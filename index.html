/* ===========================================================
   ゾウノアシゲームズ
   色や余白を変えたいときは、まずこの :root をいじってください
   =========================================================== */
:root {
  --paper:    #ffffff;
  --ink:      #1b2a41;
  --ink-soft: #5b6b82;
  --stamp:    #e8483f;
  --gold:     #ffc93c;
  --card:     #ffffff;
  --line:     #d5dde8;
  --dot: "DotGothic16", "Courier New", monospace;
  --sans: "Zen Kaku Gothic New", system-ui, -apple-system,
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background-color: var(--paper);
  /* 方眼紙の背景に戻したいときは、この4行のコメントを外してください
  background-image:
    linear-gradient(rgba(27,42,65,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27,42,65,.07) 1px, transparent 1px);
  background-size: 24px 24px; */
  min-height: 100vh;
  line-height: 1.8;
}
img { max-width: 100%; display: block; }
a { color: var(--stamp); }
:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* ---------- 共通パーツ ---------- */
.eyebrow {
  font-family: var(--dot); font-size: 13px; letter-spacing: .35em;
  color: var(--stamp); margin-bottom: 6px;
}
h1 {
  font-family: var(--dot); font-size: clamp(28px, 5.5vw, 46px);
  line-height: 1.15; letter-spacing: .04em;
}
h2 {
  font-family: var(--dot); font-size: 20px; letter-spacing: .04em;
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
h2::after { content: ""; flex: 1; height: 2px; background: var(--ink); opacity: .18; }
h3 { font-size: 15px; margin-bottom: 6px; }
main { padding: 30px 0 70px; }
section + section { margin-top: 46px; }
.muted { color: var(--ink-soft); font-size: 13.5px; }

.btn {
  display: inline-block; font-family: var(--sans); font-weight: 700; font-size: 13px;
  padding: 10px 20px; border: 2px solid var(--ink); border-radius: 999px;
  background: var(--gold); color: var(--ink); text-decoration: none;
  box-shadow: 3px 3px 0 rgba(27,42,65,.22); cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 rgba(27,42,65,.26); }
.btn.plain { background: var(--card); }

/* 画面には出さないが読み上げ・検索用に残す見出し */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- ヒーロー ---------- */
.hero { padding: 40px 0 30px; }
.hero .lead { color: var(--ink-soft); margin-top: 10px; font-size: 14.5px; }

/* トップページのロゴ */
.home-hero { padding: 48px 0 40px; text-align: center; }
.logo-title { line-height: 0; margin: 0; }
.logo-title a { display: block; }
.logo-title img { width: min(420px, 78vw); height: auto; margin: 0 auto; }
/* ゲーム画面など、下層ページ用の小さいロゴ */
.home-hero.small { padding: 26px 0 18px; }
.home-hero.small .logo-title img { width: min(210px, 48vw); }
.tagline {
  margin-top: 18px; font-size: 15px; font-weight: 500;
  letter-spacing: .08em; color: var(--ink);
}
@media (max-width: 480px) {
  .home-hero { padding: 34px 0 30px; }
  .tagline { font-size: 14px; }
}

/* ---------- コントロール（ゲーム一覧） ---------- */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  margin-bottom: 22px; position: sticky; top: 0; z-index: 5; padding: 12px 0;
  background: linear-gradient(var(--paper) 85%, transparent);
}
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  font-family: var(--sans); font-weight: 700; font-size: 13px;
  padding: 8px 14px; border: 2px solid var(--ink); border-radius: 999px;
  background: var(--card); color: var(--ink); cursor: pointer;
  transition: transform .08s ease, background .12s ease, color .12s ease;
}
.tab:hover { transform: translateY(-1px); }
.tab[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* 中央ぞろえで並べるカード（トモぞヴPページ） */
.link-meta .title { min-height: 2.6em; }
.link-meta { padding-bottom: 8px; }
.center-grid {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
}
.center-grid .card-link { width: clamp(132px, 42vw, 172px); }

/* ---------- ギャラリー ---------- */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
}
.card-link { text-decoration: none; color: inherit; display: block; }
.card {
  background: var(--card); border: 2px solid var(--ink); border-radius: 10px;
  overflow: hidden; box-shadow: 3px 3px 0 rgba(27,42,65,.18);
  transition: transform .12s ease, box-shadow .12s ease; position: relative;
}
.card-link:hover .card { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(27,42,65,.22); }
.thumb { position: relative; aspect-ratio: 1 / 1; background: #e8edf4; overflow: hidden; }
.thumb img, .thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .noimg {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: var(--dot); font-size: 26px; color: var(--ink-soft);
  padding: 0 8px; text-align: center; line-height: 1.2; word-break: break-word;
}
.meta { padding: 8px 10px 10px; border-top: 2px solid var(--ink); }
.meta .title {
  font-size: 12.5px; font-weight: 700; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 2.9em;
}
/* ハッシュタグはカーソルを合わせたときだけ出す
   （普段は高さ0で詰めておき、ホバーで展開する） */
.meta .tags {
  display: flex; flex-wrap: wrap; gap: 2px 8px;
  font-family: var(--dot); font-size: 10.5px; color: var(--stamp); line-height: 1.5;
  max-height: 0; margin-top: 0; opacity: 0; overflow: hidden;
  transition: max-height .15s ease, opacity .12s ease, margin-top .15s ease;
}
.card-link:hover .meta .tags,
.card-link:focus-visible .meta .tags { max-height: 3em; margin-top: 4px; opacity: 1; }
/* 年とプレイ数もカーソルを合わせたときだけ出す
   （普段は高さ0で詰めておき、ホバーで展開する） */
.meta .year {
  font-family: var(--dot); font-size: 11px; color: var(--ink-soft);
  max-height: 0; margin-top: 0; opacity: 0; overflow: hidden;
  transition: max-height .15s ease, opacity .12s ease, margin-top .15s ease;
}
.card-link:hover .meta .year,
.card-link:focus-visible .meta .year { max-height: 2em; margin-top: 3px; opacity: 1; }
/* タッチ端末はホバーがないので常時表示 */
@media (hover: none) {
  .meta .tags { max-height: 3em; margin-top: 4px; opacity: 1; }
  .meta .year { max-height: 2em; margin-top: 3px; opacity: 1; }
}
.empty {
  grid-column: 1 / -1; text-align: center; padding: 60px 0;
  font-family: var(--dot); color: var(--ink-soft);
}

.grid-note {
  margin: 34px auto 0; max-width: 46em; text-align: center;
  font-size: 12px; line-height: 1.9; color: var(--ink-soft);
}
.grid-note a { white-space: nowrap; }

/* ---------- ゲームプレイ画面 ---------- */
.player-shell { overflow: hidden; }
.player-frame { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
.player-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
.player-tags {
  font-family: var(--dot); font-size: 12px; color: var(--stamp);
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;
}

/* ---------- リンクリスト / 年表 ---------- */
.link-list { list-style: none; }
.link-list li { border-bottom: 1px dashed var(--line); }
.link-list a, .link-list .row {
  display: flex; align-items: baseline; gap: 12px; padding: 12px 4px;
  color: var(--ink); text-decoration: none; font-size: 14px;
}
.link-list a:hover { color: var(--stamp); }
.link-list .sub { margin-left: auto; font-size: 11.5px; color: var(--ink-soft); font-family: var(--dot); }
.link-list .yr { font-family: var(--dot); font-size: 13px; color: var(--stamp); min-width: 3.6em; }

/* ---------- 本文ブロック ---------- */
.prose { max-width: 62ch; font-size: 14.5px; }
.prose p + p { margin-top: 1em; }
.prose ul { margin: .6em 0 .6em 1.4em; }
.note {
  border: 2px dashed var(--stamp); border-radius: 10px;
  padding: 12px 16px; font-size: 13px; background: var(--card); margin-bottom: 20px;
}

/* ---------- フッター ---------- */
.site-footer {
  border-top: 2px solid var(--ink); background: var(--card);
  padding: 26px 0; font-size: 12px; color: var(--ink-soft); line-height: 1.9;
}
.site-footer .wrap { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; }
.site-footer a { color: var(--ink-soft); }
.site-footer nav { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto; }
}
</style>

        return '<button class="tab" data-filter="' + t[0] + '" aria-pressed="' +
               (t[0] === active) + '">' + t[1] + '</button>';
      }).join('') +
      '</div></div>';
  }

  /* ---------------- カード ---------------- */
  function thumbInner(g) {
    var noimg = '<div class="noimg">' + esc(g.title.slice(0, 2)) + '</div>';
    if (!g.img) return noimg;
    // 画像が読めなかったときはタイトル頭文字の代替に差し替える
    return '<img src="' + esc(g.img) + '" alt="" loading="lazy" onerror="this.outerHTML=' +
           esc(JSON.stringify(noimg)) + '">';
  }
  function card(g) {
    var playable = !!g.play;
    var href = playable ? '#/game/' + encodeURIComponent(g.id) : g.url;
    var attrs = playable ? '' : ' target="_blank" rel="noopener"';
    return '' +
      '<a class="card-link" href="' + esc(href) + '"' + attrs + '><div class="card">' +
        '<div class="thumb">' + thumbInner(g) + '</div>' +
        '<div class="meta">' +
          '<div class="title">' + esc(g.title) + '</div>' +
          '<div class="tags">' + tagsOf(g).map(function (t) { return "#" + esc(t); }).join(" ") + '</div>' +
          '<div class="year">' + esc(g.year) + (g.plays != null ? " ・ " + fmtPlays(g.plays) : "") + '</div>' +
        '</div>' +
      '</div></a>';
  }
  function gridHtml(listArr) {
    return listArr.length ? listArr.map(card).join("") : '<div class="empty">みつからなかった…</div>';
  }

  /* GIFアイコンを最初のフレームで静止画化する */
  function freezeGifs(root) {
    root.querySelectorAll('img[src*=".gif"]').forEach(function (img) {
      var freeze = function () {
        if (!img.naturalWidth) return;
        var c = document.createElement("canvas");
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        try {
          c.getContext("2d").drawImage(img, 0, 0);
          c.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
          img.replaceWith(c);
        } catch (e) { /* 描画できなければ動くまま */ }
      };
      if (img.complete) freeze(); else img.addEventListener("load", freeze, { once: true });
    });
  }

  /* ---------------- ホーム ---------------- */
  function pageHome() {
    return '<main class="home"><div class="wrap">' +
      logoHero(false) +
      '<h2 class="sr-only">ゲーム</h2>' +
      tabsBar(state.filter) +
      '<div class="grid" id="grid"></div>' +
      '<p class="grid-note" id="gridNote" hidden></p>' +
      '</div></main>';
  }

  /* ---------------- ゲーム一覧 ---------------- */
  var state = { filter: "personal" };

  function filtered() {
    var list = GAMES.filter(function (g) { return g.type === state.filter; }).sort(byNew);
    var secondTitle = PINNED_SECOND[state.filter];
    if (secondTitle) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].title === secondTitle) { list.unshift(list.splice(i, 1)[0]); break; }
      }
    }
    var pin = PINNED[state.filter];
    return pin ? [pin].concat(list) : list;
  }

  function paintGrid() {
    var g = $("#grid");
    g.innerHTML = gridHtml(filtered());
    freezeGifs(g);
    var note = $("#gridNote");
    if (note) {
      var text = GRID_NOTES[state.filter];
      note.innerHTML = text || "";
      note.hidden = !text;
    }
  }


  function bindTabs(isHome) {
    document.querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var v = btn.dataset.filter;
        if (v === "about") { location.hash = "#/about"; return; }
        state.filter = v;
        if (!isHome) { location.hash = "#/"; return; }
        document.querySelectorAll(".tab").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b === btn));
        });
        paintGrid();
      });
    });
  }

  /* ---------------- 個別ゲーム（サイト内で遊ぶ） ---------------- */
  function pageGame(id) {
    var g = GAMES.filter(function (x) { return x.id === id; })[0];
    if (!g || !g.play) {
      return '<main><div class="wrap">' + logoHero(true) + '<h1>ゲームが見つかりません</h1>' +
             '<p class="muted">URL が間違っているかもしれません。</p>' +
             '<p style="margin-top:20px"><a class="btn" href="#/">ゲーム一覧へ</a></p></div></main>';
    }
    return '<main><div class="wrap">' + logoHero(true) +
      '<div class="hero" style="padding:4px 0 18px; text-align:center">' +
        '<h1>' + esc(g.title) + '</h1>' +
      '</div>' +
      '<div class="player-shell"><iframe class="player-frame" src="' + esc(g.play) + '" title="' + esc(g.title) +
        '" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></div>' +
      '<p style="margin-top:36px"><a href="#/">← ゲーム一覧にもどる</a></p>' +
      '</div></main>';
  }

  /* ---------------- トモぞヴP ---------------- */
  function linkCard(l) {
    var noimg = '<div class="noimg">' + esc(l.mark || l.title.slice(0, 2)) + '</div>';
    var thumb = l.img
      ? '<img src="' + esc(l.img) + '" alt="" loading="lazy" onerror="this.outerHTML=' +
        esc(JSON.stringify(noimg)) + '">'
      : noimg;
    return '<a class="card-link" href="' + esc(l.url) + '" target="_blank" rel="noopener"><div class="card">' +
      '<div class="thumb">' + thumb + '</div>' +
      '<div class="meta link-meta"><div class="title">' + esc(l.title) + '</div></div></div></a>';
  }

  function pageAbout() {
    return '<main><div class="wrap">' +
      logoHero(false) +
      '<h1 class="sr-only">トモぞヴP</h1>' +
      tabsBar("about") +
      '<div class="center-grid" style="margin-top:28px">' + PROFILE_LINKS.map(linkCard).join('') + '</div>' +
      (PROFILE ? '<div class="prose" style="margin:28px auto 0; text-align:center">' + esc(PROFILE) + '</div>' : '') +
      '<section style="margin-top:40px">' +
        '<ul class="link-list">' +
          HISTORY.map(function (h) {
            return '<li><div class="row"><span class="yr">' + esc(h.year) + '</span>' +
                   '<span>' + esc(h.text) + '</span></div></li>';
          }).join('') +
        '</ul>' +
      '</section>' +
      '</div></main>';
  }

  /* ---------------- ルーター ---------------- */
  function render() {
    var h = (location.hash || "#/").replace(/^#/, "");
    var html, title = SITE.name, isGames = false, isAbout = false;

    if (h.indexOf("/game/") === 0) {
      var id = decodeURIComponent(h.slice(6));
      html = pageGame(id);
      var g = GAMES.filter(function (x) { return x.id === id; })[0];
      if (g) title = g.title + " | " + SITE.name;
    }
    else if (h === "/about")   { html = pageAbout(); title = "トモぞヴP | " + SITE.name; isAbout = true; }
    else                       { html = pageHome(); isGames = true; }   /* 旧 #/games もここに来ます */

    $("#app").innerHTML = html;
    document.title = title;
    chrome();
    window.scrollTo(0, 0);

    if (isGames) { bindTabs(true); paintGrid(); }
    else if (isAbout) bindTabs(false);
    else freezeGifs($("#app"));
  }

  addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
