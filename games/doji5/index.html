<body>
<div id="stage"><div id="wrap">

  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script>
/* 装備・奥のユニフォームで共通に使う競技の色。 */
var ZDoji5Colors = { yakyu: "#e65a55", soccer: "#448bea", tennis: "#b6d94c", basket: "#ef963c", volley: "#ac75df" };
</script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../voice.js"></script>

<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 同時ボール。
   野球・サッカー・テニス・バスケ・バレーの球が、ぜんぶ同じ場所へ次々に飛んでくる。
   押すのは1つだけ。いちばん近い球に合わせて、打つ・蹴る・打ち返す・撃つ・叩く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var view3d = (window.WebGLRenderingContext && typeof ZDoji5Scene !== "undefined" && typeof THREE !== "undefined")
    ? new ZDoji5Scene() : null;

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    if (view3d) view3d.resize(canvas.width, canvas.height);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, MASTER = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    MASTER = AC.createGain(); MASTER.gain.value = 1.6;
    var limiter = AC.createDynamicsCompressor();
    limiter.threshold.value = -8; limiter.ratio.value = 10; limiter.attack.value = .004; limiter.release.value = .12;
    MASTER.connect(limiter); limiter.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    startAmbience();
  }
  /* 遠くの観客席。音程や拍子を付けず、ざわつきと拍手を散らす。 */
  var ambience = null, nextAmbient = 0;
  function startAmbience() {
    if (!AC || ambience) return;
    ambience = AC.createGain();
    ambience.gain.value = .35;
    var soft = AC.createBiquadFilter();
    soft.type = "lowpass"; soft.frequency.value = 3200; soft.Q.value = .5;
    ambience.connect(soft); soft.connect(crowdOutput());
    updateAmbience();
  }
  function updateAmbience() {
    if (!AC || !NOISE || !ambience || AC.state !== "running" || AC.currentTime < nextAmbient) return;
    nextAmbient = AC.currentTime + .55 + Math.random() * .35;
    /* 音程を持たない広い帯域。発声に似た強弱だけを不規則に重ねる。 */
    for (var i = 0; i < 7; i++) {
      var clap = i === 0 && Math.random() < .55;
      var at = AC.currentTime + Math.random() * .7;
      var dur = clap ? .06 : .55 + Math.random() * .65;
      var crowd = AC.createBufferSource(), filter = AC.createBiquadFilter(), envelope = AC.createGain();
      crowd.buffer = NOISE; crowd.loop = true;
      crowd.playbackRate.value = .8 + Math.random() * .4;
      filter.type = "bandpass"; filter.Q.value = clap ? .7 : .5;
      filter.frequency.value = clap ? 1900 : 700 + Math.random() * 1200;
      var volume = clap ? .055 : .018 + Math.random() * .012;
      envelope.gain.setValueAtTime(.0001, at);
      envelope.gain.linearRampToValueAtTime(volume, at + (clap ? .003 : dur * .22));
      if (!clap) envelope.gain.linearRampToValueAtTime(volume * .6, at + dur * .6);
      envelope.gain.exponentialRampToValueAtTime(.0001, at + dur);
      crowd.connect(filter); filter.connect(envelope);
      var nodes = [crowd, filter, envelope];
      if (AC.createStereoPanner) {
        var pan = AC.createStereoPanner(); pan.pan.value = Math.random() * 1.8 - .9;
        envelope.connect(pan); pan.connect(ambience); nodes.push(pan);
      } else envelope.connect(ambience);
      crowd.onended = (function (list) { return function () { list.forEach(function (n) { n.disconnect(); }); }; })(nodes);
      crowd.start(at, Math.random()); crowd.stop(at + dur + .03);
    }
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(MASTER || AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, to, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    if (to) f.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(MASTER || AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  /* 競技ごとの当たった音 */
  function hitSound(kind, perfect) {
    if (kind === "yakyu") {
      /* 打った芯の衝撃に、金属バットの高い響きと短い反響を重ねる。 */
      noiseHit(.045, 3100, .42, .7, 1600);
      tone(210, .10, .18, "sine", 95);
      tone(1480, .62, .23, "sine", 1430);
      tone(2390, .36, .10, "sine", 2330);
      tone(3670, .20, .045, "sine", 3600);
      tone(1480, .38, .045, "sine", 1430, .075);
    }
    else if (kind === "soccer") {
      /* 足が球を捉える乾いた打音と、腹に響く低音。 */
      noiseHit(.07, 1300, .38, .8, 550);
      noiseHit(.15, 300, .62, .9, 100);
      tone(155, .24, .34, "sine", 52);
      tone(340, .08, .12, "triangle", 150);
    }
    else if (kind === "tennis") { noiseHit(.06, 3400, .42, 1.4, 1500); tone(760, .1, .14, "triangle", 420); }
    else if (kind === "basket") { noiseHit(.11, 700, .34, .7, 260); tone(190, .18, .16, "sine", 90); }
    else { noiseHit(.07, 1800, .45, .9, 700); tone(420, .12, .16, "square", 210); }
    if (perfect) { tone(1320, .1, .1, "triangle", null, .03); tone(1760, .14, .09, "triangle", null, .09); }
  }
  /* 一輪車と同じ母音合成（games/voice.js）。録音やOSの読み上げ音声は使わない。 */
  function speak(ac, at, pitch, words) {
    return window.zVoice.speak(ac, at, pitch, words, { out: MASTER || ac.destination, volume: 0.11, noise: NOISE });
  }
  function firstBallSound(kind) {
    if (!AC) return;
    var at = AC.currentTime + .02;
    var calls = {
      yakyu: [175, [["p","u",.10],["r","e",.14],["","i",.09],["b","o",.25],["r","u",.18]]],
      soccer: [225, [["k","i",.14],["k","u",.10],["","o",.18],["f","u",.15]]],
      tennis: [285, [["p","u",.12],["r","e",.22],["","i",.19]]],
      basket: [200, [["r","e",.13],["t","u",.10],["p","u",.10],["r","e",.20],["","i",.16]]],
      volley: [255, [["s","a",.30],["b","u",.22]]]
    };
    speak(AC, at, calls[kind][0], calls[kind][1]);
    if (kind === "soccer") tone(2450, .20, .035, "sine", 2600);
    if (kind === "basket") { tone(180, .24, .035, "square", 180); tone(270, .24, .018, "sawtooth", 270); }
    if (kind === "volley") { tone(3100, .12, .028, "sine", 2950); tone(3100, .12, .028, "sine", 2950, .18); }
  }
  function missSound() { tone(200, .3, .2, "sawtooth", 70); noiseHit(.2, 420, .18, .6, 150); }
  /* ボウリングの得点時と同じ、母音が開く観客の歓声。 */
  var crowdBus=null;
  function crowdOutput(){
    if(crowdBus)return crowdBus;
    // 観客席の短い反射音を共有し、遠近のある一団にまとめる。
    crowdBus=AC.createGain();var dry=AC.createGain(),wet=AC.createGain(),room=AC.createConvolver(),filter=AC.createBiquadFilter(),limit=AC.createDynamicsCompressor();
    var length=Math.floor(AC.sampleRate*.24),impulse=AC.createBuffer(2,length,AC.sampleRate);
    for(var ch=0;ch<2;ch++){var data=impulse.getChannelData(ch);for(var n=0;n<length;n++){var t=n/AC.sampleRate;data[n]=t<.022?0:(Math.random()*2-1)*Math.exp(-t*24)*.35;}}
    room.buffer=impulse;dry.gain.value=.8;wet.gain.value=.28;filter.type='lowpass';filter.frequency.value=3800;
    limit.threshold.value=-19;limit.knee.value=12;limit.ratio.value=3;limit.attack.value=.008;limit.release.value=.15;
    crowdBus.connect(dry);dry.connect(limit);crowdBus.connect(room);room.connect(filter);filter.connect(wet);wet.connect(limit);var voiceVolume=AC.createGain();voiceVolume.gain.value=3.2;limit.connect(voiceVolume);voiceVolume.connect(MASTER);return crowdBus;
  }
  var lastCheer = -10;
  function cheerSound(){
    if(!AC)return;
    if(AC.currentTime-lastCheer<.18)return;
    lastCheer=AC.currentTime;
    /* ざわつきは短く控えめに膨らませ、拍手を主役にする。 */
    if (!NOISE) return;
    for(var i=0;i<6;i++){
      var at=AC.currentTime+Math.random()*.16, dur=.55+Math.random()*.3;
      var crowd=AC.createBufferSource(), filter=AC.createBiquadFilter(), gain=AC.createGain();
      crowd.buffer=NOISE; crowd.loop=true; crowd.playbackRate.value=.8+Math.random()*.4;
      filter.type="bandpass"; filter.Q.value=.5; filter.frequency.value=650+Math.random()*850;
      var volume=.01+Math.random()*.006;
      gain.gain.setValueAtTime(.0001,at);
      gain.gain.linearRampToValueAtTime(volume,at+.10);
      gain.gain.linearRampToValueAtTime(volume*.65,at+dur*.5);
      gain.gain.exponentialRampToValueAtTime(.0001,at+dur);
      crowd.connect(filter); filter.connect(gain);
      var nodes=[crowd,filter,gain];
      if(AC.createStereoPanner){
        var pan=AC.createStereoPanner(); pan.pan.value=i/5*1.8-.9;
        gain.connect(pan); pan.connect(crowdOutput()); nodes.push(pan);
      }else gain.connect(crowdOutput());
      crowd.onended=(function(list){return function(){list.forEach(function(n){n.disconnect();});};})(nodes);
      crowd.start(at,Math.random()); crowd.stop(at+dur+.03);
    }
    /* 手のひらの低い打音と乾いた高音を重ね、複数人の拍手をはっきり出す。 */
    for(var j=0;j<18;j++){
      var delay=.04+j*.062+Math.random()*.025;
      var volume=.045*(1-j/26)*(.85+Math.random()*.3);
      noiseHit(.055,1100+Math.random()*650,volume,.8,700,delay);
      noiseHit(.032,2600,volume*.7,.65,1500,delay+.009+Math.random()*.009);
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 球 ============
     flight は投げてから打つ位置に届くまでの秒数。到着の時刻から逆算して出す。 */
  var KINDS = {
    yakyu:  { flight: 1.2, z0: 11, y0: 1.95, y1: 1.2,  r: .12, pts: 1 },
    soccer: { flight: 2.1, z0: 26, y0: .30,  y1: .45,  r: .23, pts: 1 },
    tennis: { flight: 1.8, z0: 24, y0: 1.5,  y1: 1.05, r: .11, pts: 0 },
    basket: { flight: 2.4, z0: 28, y0: 2.0,  y1: 1.6,  r: .25, pts: 3 },
    volley: { flight: 1.7, z0: 19, y0: 5.4,  y1: 2.1,  r: .23, pts: 1 }
  };
  var KEYS = ["yakyu", "soccer", "tennis", "basket", "volley"];
  var WINDOW = .17, PERFECT = .07, LIVES = 3, GRAVITY = 17;
  var PLATE = 1.4;                                 /* 打つ場所。選手の少し前 */
  var calledKinds = {}, cameraTime = 0, CAMERA_MOVE = .9, START_PAUSE = .6;
  var nextInput = 0;                              /* 全競技で共通の、次に押せる時刻 */
  var ACT = .38;                                   /* 振ってから構えへ戻るまでの秒数 */

  function ballY(kind, u) {
    var k = KINDS[kind];
    if (kind === "yakyu") return k.y0 + (k.y1 - k.y0) * u - .12 * u * u;
    if (kind === "soccer") { var b = u * 2.6; return k.r + Math.abs(Math.sin(b * Math.PI)) * Math.max(0, .85 - .26 * b); }
    if (kind === "tennis") {
      if (u < .6) { var a = u / .6; return k.y0 + (.12 - k.y0) * a * a + Math.sin(a * Math.PI) * .5; }
      var c = (u - .6) / .4; return .12 + (k.y1 + .35) * Math.sin(c * Math.PI * .85);
    }
    if (kind === "basket") return k.y0 + (k.y1 - k.y0) * u + Math.sin(u * Math.PI) * 3.2;
    return k.y0 + (k.y1 - k.y0) * u + Math.sin(u * Math.PI) * .8;
  }
  function ballAt(b, t) {
    var k = KINDS[b.kind], flight = b.variant === "fast" ? .98 : k.flight;
    var u = (t - b.tArrive + flight) / flight;
    var x = b.xs + (b.xe - b.xs) * u, y = ballY(b.kind, u);
    /* 変化は途中だけ。到着位置・時刻と押す間合いは通常球と揃える。 */
    if (b.variant && u > 0 && u < 1) {
      var arc = Math.sin(Math.PI * u), side = b.side || 1;
      if (b.variant === "curve") x += side * 1.8 * arc * u;
      else if (b.variant === "drop") y += .85 * arc * u;
      else if (b.variant === "swerve") x += side * 2.2 * arc;
      else if (b.variant === "spin" && u > .6) {
        var bounce = (u - .6) / .4;
        y += .65 * Math.sin(Math.PI * bounce); x += side * .65 * Math.sin(Math.PI * bounce);
      } else if (b.variant === "bounce") {
        y = u < .55 ? k.y0 + (k.r - k.y0) * u / .55 : k.r + (k.y1 - k.r) * (u - .55) / .45;
      } else if (b.variant === "float") x += side * .55 * Math.sin(u * Math.PI * 5) * arc;
    }
    return { x: x, y: y, z: PLATE + (k.z0 - PLATE) * (1 - u), u: u };
  }
  /* tf 秒で目標へ届く速さ */
  function aimAt(from, to, tf) {
    return {
      x: (to.x - from.x) / tf,
      y: (to.y - from.y) / tf + .5 * GRAVITY * tf,
      z: (to.z - from.z) / tf
    };
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, hits, lives, T, held, keyMode = false;
  var tennisPoint = 0, tennisGames = 0, fallenAt = 0;
  var lastWasVariant = false;
  var balls, nextArrive, lastKinds, act, actT, actKind, shake, flashes, pitchAt, leanX;
  var results = [], flash = {}, cursor = 0, animT = 0;           /* 押した目印、キー操作の選び位置、絵の時計 */
  var on = { yakyu: true, soccer: true, tennis: true, basket: true, volley: true };
  function kinds() { return KEYS.slice(); }
  var CHEERS = { yakyu: "HOME RUN!", soccer: "GOAL!", tennis: "WINNER!", basket: "BASKET!", volley: "POINT!" };

  /* ============ 下の5ボタン ============
     遊びのあいだは常に5つとも出す。 */
  var HUDY, SCOREY, PADY, PADW = 92, PADGAP = 14;
  function place() {
    HUDY = Math.round(H * 0.045);
    SCOREY = HUDY - 12;
    PADY = Math.round(H * 0.85);                 /* 選手より下、STARTより上 */
  }
  function pads(all) {
    var ks = all ? KEYS : kinds(), n = ks.length;
    var total = n * PADW + (n - 1) * PADGAP, x0 = W / 2 - total / 2;
    return ks.map(function (k, i) {
      return { kind: k, x: x0 + i * (PADW + PADGAP), y: PADY - PADW / 2, w: PADW, h: PADW };
    });
  }
  function padAt(x, y, all) {
    var list = pads(all);
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }
  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; hits = 0; tennisPoint = 0; tennisGames = 0; lives = LIVES; T = 0; held = false; nextInput = 0; cameraTime = 0; calledKinds = {};
    balls = []; lastKinds = []; flashes = []; lastWasVariant = false;
    act = null; actT = 0; actKind = null; shake = 0; pitchAt = -9; leanX = 0;
    nextArrive = 1.9; cursor = 0; flash = {}; results = [];
  }
  /* 結果から「もう一度」は、開始画面へ戻す */
  function toIntro() {
    newRound();
    state = S.INTRO;
    shareButton.hidden = true;
    document.getElementById("start").hidden = false;
  }

  function pickKind() {
    var ks = kinds(), k;
    do { k = ks[(Math.random() * ks.length) | 0]; }
    while (ks.length > 1 && lastKinds.length >= 2 && lastKinds[0] === k && lastKinds[1] === k);
    lastKinds.unshift(k); lastKinds.length = 2;
    return k;
  }
  /* 来る球を先に決めておく。飛んでいる時間ぶん早く出す */
  function schedule() {
    while (nextArrive < T + 3.6) {
      var kind = pickKind(), k = KINDS[kind];
      var xs = (Math.random() - .5) * (kind === "yakyu" ? 1.2 : 9);
      var b = {
        kind: kind, tArrive: nextArrive, xs: xs, xe: (Math.random() - .5) * 1.6,
        spin: Math.random() * 6, hit: false, dead: false, judged: false
      };
      /* 最初は通常球。変化球は野球20%、ほか12%を目安にし、連続させない。 */
      var varied = T > 4 && !lastWasVariant && Math.random() < (kind === "yakyu" ? .20 : .12);
      b.variant = varied ? (kind === "yakyu" ? (T > 10 ? ["curve", "drop", "fast"][Math.floor(Math.random() * 3)] : (Math.random() < .5 ? "curve" : "drop")) : { soccer: "swerve", tennis: "spin", basket: "bounce", volley: "float" }[kind]) : null;

  /* ============ 進行 ============ */
  function update(dt) {

    if (act) { actT += dt; if (actT > ACT) act = null; }
    KEYS.forEach(function (k) { if (flash[k] > 0) flash[k] = Math.max(0, flash[k] - dt); });
    animT += dt;                                   /* 絵だけの時計。選ぶ画面でも奥の人は動く */
    results.forEach(function (r) { r.age += dt; });
    results = results.filter(function (r) { return r.age < 1.1; });
    flashes.forEach(function (f) { f.age += dt; });
    flashes = flashes.filter(function (f) { return f.age < .45; });

    if (cameraTime < CAMERA_MOVE + START_PAUSE) { cameraTime = Math.min(CAMERA_MOVE + START_PAUSE, cameraTime + dt); return; }
    T += dt;
    schedule();

    var near = null, nearAbs = 9;
    balls.forEach(function (b) {
      var k = KINDS[b.kind];

        b.fy = b.hy + b.v.y * e - .5 * GRAVITY * e * e;
        b.fz = b.hz + b.v.z * e;
        if (b.fy < k.r) { b.fy = k.r; }
        if (!b.resultShown && e >= b.resultAfter) {
          b.resultShown = true;
          results.push({ text: b.resultText, kind: b.kind, x: b.resultAt.x, y: b.resultAt.y, z: b.resultAt.z, age: 0 });
          cheerSound();

        if (e > 2.4 || Math.abs(b.fz) > 95) b.dead = true;
        return;
      }
      var p = ballAt(b, T);
      if (p.u < 0) return;
      if (!calledKinds[b.kind]) { calledKinds[b.kind] = true; firstBallSound(b.kind); }
      if (!b.judged && T > b.tArrive + WINDOW) {          /* 見逃した */
        b.judged = true;

        if (lives <= 0 && state === S.PLAY) {
          state = S.RESULT; fallenAt = animT; shareButton.hidden = false;
          /* 終了の合図は短く二回、最後だけ長く吹く。 */
          [[0, .12], [.21, .12], [.43, .48]].forEach(function (v) {
            tone(2950, v[1], .045, "sine", 2800, v[0]);
            tone(3220, v[1], .018, "sine", 3100, v[0]);

  /* その競技で、いま間合いにいちばん近い球 */

  /* ボタンを押す。合っていれば打ち返し、外れていれば空振り */

    flash[kind] = .16;

  }

  function swingAt(b) {

    b.hit = true; b.judged = true; b.hitT = T;
    var p = ballAt(b, T);
    b.hx = p.x; b.hy = Math.max(k.r, p.y); b.hz = p.z;
    var from = { x: b.hx, y: b.hy, z: b.hz }, to, tf;
    if (b.kind === "yakyu") { to = { x: (Math.random() - .5) * 34, y: 11, z: 88 }; tf = 2.1; }
    else if (b.kind === "soccer") { to = { x: (Math.random() - .5) * 5, y: 1.1, z: 78 }; tf = 1.6; }
    else if (b.kind === "tennis") { to = { x: (Math.random() - .5) * 8, y: .2, z: 22 }; tf = 1.0; }
    else if (b.kind === "basket") { to = { x: 0, y: 3.2, z: 24.2 }; tf = 1.15; }

  /* 空振り。振っただけでは減らない。減るのは球を見逃したときだけ */

  /* ============ 入力 ============

      return;
    }
    held = true;
    var b = padAt(x, y);
    if (b) press(b.kind);
  }
  function move() {}
  function up() {
    held = false;

  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);

    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var flip = e.key === "ArrowUp" || e.key === "ArrowDown";
    var num = /^[1-5]$/.test(e.key) ? parseInt(e.key, 10) - 1 : -1;

    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    var list = pads(state === S.INTRO);
    if (left || right) {                       /* 選び位置を動かす */
      if (!list.length) return;
      cursor = (cursor + (right ? 1 : list.length - 1)) % list.length;
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    if (state === S.INTRO) {
      if (!go) return;
      introArmed = true;                       /* 開始は、この指を離したとき */
      return;
    }
    if (flip) return;
    if (num >= 0) {
      var kind = KEYS[num];                    /* 競技を切ってもキーの割り当ては変えない */
      if (on[kind]) { cursor = kinds().indexOf(kind); press(kind); }
      return;
    }
    if (state === S.PLAY) { if (list[cursor]) press(list[cursor].kind); return; }

  });

  window.addEventListener("keyup", function (e) {

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。 */
    window.zResultActions.x({ text: score + "点でした #同時ボール" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function snapshot() {
    var list = [];
    balls.forEach(function (b) {
      var k = KINDS[b.kind];
      if (b.hit) { list.push({ kind: b.kind, x: b.fx, y: b.fy, z: b.fz, r: k.r, spin: b.spin }); return; }
      var p = ballAt(b, T);
      if (p.u < 0 || p.z < -9) return;
      var trail = [];
      for (var j = 0; j < 12; j++) {
        var past = ballAt(b, T - j * .020);
        if (past.u < 0) break;
        trail.push({ x: past.x, y: past.y, z: past.z });
      }
      list.push({ kind: b.kind, x: p.x, y: p.y, z: p.z, r: k.r, spin: b.spin, trail: trail });
    });
    var pitch = -1;
    if (T - pitchAt > -.55 && T - pitchAt < .55) pitch = (T - pitchAt + .55) / 1.1;
    return { fall: state === S.RESULT ? Math.min(1, (animT - fallenAt) / .8) : -1, cameraMix: state === S.INTRO ? 0 : Math.min(1, cameraTime / CAMERA_MOVE), t: animT, balls: list, act: act, actP: act ? actT / ACT : 0, shake: shake, leanX: leanX, pitch: pitch,

  /* 3Dが使えないとき（自動確認の台など）の簡単な絵 */
  function drawFlat(snap) {
    ctx.fillStyle = "#16283a"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2e7a3b"; ctx.fillRect(0, H * .42, W, H * .58);
    var colors = { yakyu: "#f6f3ea", soccer: "#f4f4f0", tennis: "#d3e64a", basket: "#d4702a", volley: "#f7f6f1" };
    snap.balls.forEach(function (b) {
      var f = 620 / Math.max(.3, b.z + 7.4);
      var x = W / 2 + b.x * f * .55, y = H * .62 - (b.y - 1.2) * f * .55;
      ctx.fillStyle = colors[b.kind];
      ctx.beginPath(); ctx.arc(x, y, Math.max(1, b.r * f * .55), 0, Math.PI * 2); ctx.fill();
    });
  }

  /* ボタンに出す球の絵。3Dの球と同じ見た目に寄せる */
  function drawBall2D(kind, cx, cy, r) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = { yakyu: "#f6f3ea", soccer: "#f4f4f0", tennis: "#d3e64a", basket: "#d4702a", volley: "#f7f6f1" }[kind];
    ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    if (kind === "yakyu") {
      ctx.strokeStyle = "#c4384a"; ctx.lineWidth = r * .11;
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.moveTo(s * r * .66, -r * .82);
        ctx.quadraticCurveTo(s * r * .06, 0, s * r * .66, r * .82);
        ctx.stroke();
      });
    } else if (kind === "soccer") {
      ctx.fillStyle = "#20242a";
      ctx.beginPath();
      for (var i = 0; i < 5; i++) {
        var a = i / 5 * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r * .42, Math.sin(a) * r * .42);
      }
      ctx.closePath(); ctx.fill();
      /* 中央の五角形から白い六角形の継ぎ目を伸ばす。周縁は球面で縮む五角形。 */
      ctx.strokeStyle = "#b9beb9"; ctx.lineWidth = r * .018;
      for (var j = 0; j < 5; j++) {
        var b = j / 5 * Math.PI * 2 - Math.PI / 2;

        ctx.beginPath(); ctx.moveTo(ux * r * .42, uy * r * .42);
        ctx.lineTo(ux * r * .77, uy * r * .77); ctx.stroke();
        ctx.beginPath();
        [[.77, 0], [.86, -.25], [1.08, -.29], [1.16, 0], [1.08, .29], [.86, .25]].forEach(function (p, n) {
          var x = (ux * p[0] + vx * p[1]) * r, y = (uy * p[0] + vy * p[1]) * r;
          if (n === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath(); ctx.fill();
        [-1, 1].forEach(function (side) {
          ctx.beginPath(); ctx.moveTo((ux * .86 + vx * .25 * side) * r, (uy * .86 + vy * .25 * side) * r);

      [-1, 1].forEach(function (s) {
        ctx.beginPath();

      });
    } else if (kind === "basket") {
      /* 正面の十字と、左右から内側へ回り込む切れ目のない継ぎ目。 */
      ctx.strokeStyle = "#30251d"; ctx.lineWidth = r * .065;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r);
      ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();

  /* 下の5ボタン。球そのものが押しどころ。白い球が背景に埋もれないよう縁を付ける */

    var list = pads(all);

    list.forEach(function (b, i) {

      var off = all && !on[b.kind];

  function drawWord(word, x, y, color, size, alpha) {
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold " + size + "px sans-serif";
    var margin = ctx.measureText(word).width / 2 + 8;
    x = Math.max(margin, Math.min(W - margin, x));
    y = Math.max(size, Math.min(H - size, y));
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.lineWidth = 5; ctx.strokeStyle = "#101820"; ctx.fillStyle = color;
    ctx.strokeText(word, x, y); ctx.fillText(word, x, y);
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    var snap = snapshot();
    if (view3d) { ctx.clearRect(0, 0, W, H); view3d.draw(ctx, W, H, snap); }
    else drawFlat(snap);

    /* 当たった場所の光 */
    flashes.forEach(function (f) {
      var p = view3d ? view3d.project(f.x, f.y, f.z) : { x: W / 2, y: H * .6, z: 0 };
      if (p.z > 1) return;
      var a = 1 - f.age / .45, rad = (f.big ? 90 : 60) * (.3 + f.age / .45);

      ctx.lineWidth = f.big ? 9 : 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    if (state === S.INTRO) return;
    drawPads(false);
    /* 結果は球が届いた奥の場所に出す。 */
    results.forEach(function (r) {
      var p = view3d ? view3d.project(r.x, r.y, r.z) : { x: W / 2, y: H * .28 };
      drawWord(r.text || CHEERS[r.kind], p.x, p.y - 20 - r.age * 16, ZDoji5Colors[r.kind], 26, (1.1 - r.age) / .2);
    });

    for (var i = 0; i < LIVES; i++) {
      ctx.beginPath();
      ctx.arc(30 + i * 26, HUDY, 8, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ffffff" : "rgba(255,255,255,.22)";

    ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = 12;
    ctx.font = "800 52px sans-serif";
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillText(String(score), W - 24, SCOREY);
    ctx.restore();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return {
        state: state, score: score, tennisPoint: [0,15,30,40][tennisPoint], tennisGames: tennisGames, hits: hits, lives: lives, T: T, act: act,
        balls: balls.map(function (b) {
          return { kind: b.kind, variant: b.variant, dt: T - b.tArrive, hit: b.hit, judged: b.judged };
        }),
        nextArrive: nextArrive, W: W, H: H, has3d: !!view3d,
        on: kinds(), cheers: results.map(function (r) { return r.text || CHEERS[r.kind]; }), results: results.map(function (r) { return { kind: r.kind, x: r.x, y: r.y, z: r.z }; }), pads: state === S.PLAY ? pads(false) : []
      };
    },
    trajectory: function (kind, variant, u) { return ballAt({ kind: kind, variant: variant, side: 1, xs: 0, xe: 0, tArrive: KINDS[kind].flight }, u * KINDS[kind].flight); },
    /* 次の球を、ちょうどの間合いまで進める */
    toBall: function () {
      var guard = 0;
      while (guard++ < 1200) {
        var b = null, d = 9;
        for (var i = 0; i < balls.length; i++) {
          if (balls[i].hit || balls[i].judged) continue;
          var e = balls[i].tArrive - T;
          if (e > -WINDOW && e < d) { d = e; b = balls[i]; }
        }
        if (b && Math.abs(T - b.tArrive) < .02) return b.kind;
        update(1 / 60); draw();
      }
      return null;
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      var guard = Date.now() + 45000;
      while (state !== S.RESULT && Date.now() < guard) {
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (!b.hit && !b.judged && Math.abs(T - b.tArrive) < .04) { press(b.kind); break; }
        }
        await r.wait(16);
      }
      await r.wait(1600);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer = null;
  document.addEventListener("pointerdown", function (e) {
    if (!(state === S.INTRO)) return;
    if (e.isPrimary === false || e.button > 0) return;
    keyMode = false;
    startingPointer = e.pointerId;
    e.stopImmediatePropagation();
  }, true);
  document.addEventListener("pointerup", function (e) {
    if (!(state === S.INTRO)) return;
    if (startingPointer !== e.pointerId) return;
    startingPointer = null; e.preventDefault(); e.stopImmediatePropagation(); startButton.click();
  }, true);
  document.addEventListener("pointercancel", function () { startingPointer = null; }, true);

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); if (state !== S.INTRO) return; audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.033, (now - last) / 1000));   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
