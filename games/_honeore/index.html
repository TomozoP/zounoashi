<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>骨が折れるアクション</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #8fd0f2; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 骨が折れるアクション

   右へ進んでゴールを目指す。強い衝撃で骨が折れ、折れた先はフニャフニャになる。
   体の動きは「操り棒」（四角い当たり）が受け持ち、骨格はそれに引っぱられる点と棒でできている。
   折れていない骨は姿勢どおりに引っぱり、折れた骨より先は引っぱらずに重力でぶら下げる。
   骨の数と配置は人の体（206本）に寄せて描く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  var Z = 0.88;                                /* 世界を縮めて見せる倍率 */
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  function sCrack() {                         /* ポキッ */
    noiseHit(0.05, 3200, 0.9, 2);
    noiseHit(0.04, 1800, 0.6, 3, 0.03);
    tone(170, 0.12, 0.25, "triangle", 70);
  }
  function sLand(v) { noiseHit(0.09, 260, Math.min(0.5, v / 2400), 1.2); }
  function sStep() { noiseHit(0.035, 900, 0.07, 1.5); }
  function sJump() { tone(330, 0.12, 0.08, "sine", 560); }
  function sMilk() { [0, 0.09, 0.18].forEach(function (d, i) { tone(520 + i * 160, 0.12, 0.12, "sine", null, d); }); }
  function sGoal() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 0.13, "triangle", null, i * 0.11); }); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 面 ============
     1マス48。列ごとの地面の高さ（下から何マス）と、浮いた足場。 */
  var T = 48, R = 24, COLS = 0;
  var solid = [];                              /* solid[col][row] */
  var milks = [], lanes = [], goalX = 0, startX = 0, startY = 0;
  function build() {
    solid = []; milks = []; lanes = [];
    var c = 0, hs = [];
    function g(len, h) { for (var i = 0; i < len; i++) hs[c++] = h; }
    var plats = [];
    function p(col, h, len) { plats.push([col, h, len]); }
    function milk(col, h) { milks.push({ x: col * T + T / 2, y: (R - h) * T, got: false }); }
    function lane(c0, c1, h, gap) { lanes.push({ x0: c0 * T, x1: c1 * T, y: (R - h) * T, gap: gap }); }
    g(14, 4);
    g(3, 5); g(3, 6); g(6, 7);
    g(6, 4);
    g(2, 2);
    g(8, 4); milk(39, 4);
    g(1, 7); g(9, 7); milk(48, 7);
    p(53, 4, 3);
    g(20, 1); lane(54, 71, 1, 2.6); milk(64, 1);
    g(2, 3); g(2, 5); g(2, 7); g(2, 9);
    g(10, 9); milk(86, 9);
    p(92, 6, 3); p(97, 4, 2);
    g(16, 2); lane(100, 106, 2, 3.2);
    g(3, 3); g(3, 4); g(3, 5); g(3, 6);
    g(6, 6); milk(121, 6);
    g(3, 4);
    g(8, 6);
    g(3, 3);
    g(16, 3); lane(140, 153, 3, 2.2); milk(146, 3);
    g(4, 5);
    g(16, 5);
    COLS = c;
    for (var x = 0; x < COLS; x++) {
      solid[x] = [];
      for (var y = 0; y < R; y++) solid[x][y] = y >= R - hs[x];
    }
    plats.forEach(function (q) { for (var i = 0; i < q[2]; i++) solid[q[0] + i][R - q[1]] = true; });
    goalX = (COLS - 6) * T;
    startX = 4 * T; startY = (R - 4) * T;
  }
  function isSolid(col, row) {
    if (col < 0 || col >= COLS) return true;
    if (row >= R) return true;
    if (row < 0) return false;
    return solid[col][row];
  }
  function solidAt(x, y) { return isSolid(Math.floor(x / T), Math.floor(y / T)); }

  /* ============ 体の寸法 ============ */
  var LF = 58, LS = 54, ANK = 10, FOOT = 26;        /* 太もも・すね・足首の高さ・足 */
  var LUMB = 30, TH2 = 30, TH1 = 30, CERV = 28;     /* 背骨の区切り */
  var LH = 42, LFA = 36, LHAND = 24;                /* 上腕・前腕・手 */
  var HIP = LF + LS + ANK;

  /* 点の番号 */
  var PEL = 0, WAI = 1, CHE = 2, NEC = 3, HEA = 4, SHO = 5;
  function arm(s) { var b = s ? 11 : 6; return { hm: b, el: b + 1, fm: b + 2, wr: b + 3, ha: b + 4 }; }
  function leg(s) { var b = s ? 21 : 16; return { fm: b, kn: b + 1, sm: b + 2, an: b + 3, to: b + 4 }; }
  var AN = arm(0), AF = arm(1), LN = leg(0), LG = leg(1);
  var NP = 26;

  /* 折れる骨のまとまり。n は数える骨の本数 */
  var UNITS = {
    skull: { n: 1 }, cerv: { n: 1 }, thor1: { n: 1 }, thor2: { n: 1 }, lumb: { n: 1 }, pelvis: { n: 1 },
    clavN: { n: 1 }, clavF: { n: 1 }, humN: { n: 1 }, humF: { n: 1 }, foreN: { n: 2 }, foreF: { n: 2 },
    femN: { n: 1 }, femF: { n: 1 }, shinN: { n: 2 }, shinF: { n: 2 }
  };
  var TOTAL = 206;
  var broken, ribs, brokenCount;               /* ribs: 手前12本・奥12本の折れ */

  /* 点がどの骨に支えられているか（骨盤から順に、この骨が全部無事なら姿勢どおり動く） */
  var NEED = [];
  (function () {
    var sp = [], sp1 = ["lumb"], sp2 = ["lumb", "thor2"], sp3 = ["lumb", "thor2", "thor1"];
    NEED[PEL] = sp; NEED[WAI] = sp1; NEED[CHE] = sp2; NEED[NEC] = sp3; NEED[HEA] = sp3.concat("cerv"); NEED[SHO] = sp3;
    [[AN, "N"], [AF, "F"]].forEach(function (q) {
      var a = q[0], s = q[1], c = sp3.concat("clav" + s);
      NEED[a.hm] = c; NEED[a.el] = c.concat("hum" + s); NEED[a.fm] = NEED[a.el];
      NEED[a.wr] = NEED[a.el].concat("fore" + s); NEED[a.ha] = NEED[a.wr];
    });
    [[LN, "N"], [LG, "F"]].forEach(function (q) {
      var l = q[0], s = q[1], c = ["pelvis"];
      NEED[l.fm] = c; NEED[l.kn] = c.concat("fem" + s); NEED[l.sm] = NEED[l.kn];
      NEED[l.an] = NEED[l.kn].concat("shin" + s); NEED[l.to] = NEED[l.an];
    });
  })();

  /* 棒。brace は骨をまっすぐに保つ棒で、その骨が折れると外れる */
  var STICKS = [];
  function stick(a, b, unit) { STICKS.push({ a: a, b: b, unit: unit || null, len: 0 }); }
  stick(PEL, WAI); stick(WAI, CHE); stick(CHE, NEC); stick(NEC, HEA);
  stick(NEC, SHO); stick(CHE, SHO); stick(WAI, SHO);
  [[AN, "N"], [AF, "F"]].forEach(function (q) {
    var a = q[0], s = q[1];
    stick(SHO, a.hm); stick(a.hm, a.el); stick(SHO, a.el, "hum" + s);
    stick(a.el, a.fm); stick(a.fm, a.wr); stick(a.el, a.wr, "fore" + s);
    stick(a.wr, a.ha);
  });
  [[LN, "N"], [LG, "F"]].forEach(function (q) {
    var l = q[0], s = q[1];
    stick(PEL, l.fm); stick(l.fm, l.kn); stick(PEL, l.kn, "fem" + s);
    stick(l.kn, l.sm); stick(l.sm, l.an); stick(l.kn, l.an, "shin" + s);
    stick(l.an, l.to);
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", DOWN: "down", GOAL: "goal", RESULT: "result" };
  var state, T0, keyMode = false;
  var P = [];                                  /* 体の点 {x,y,px,py} */
  var sup = [];                                /* 姿勢どおりに引っぱる点か */
  var ctl;                                     /* 操り棒 */
  var dir, phase, legs, arms, cleared, endT;
  var camX = 0, camY = 0, shake = 0;
  var barrels, sparks, hitCool, flash;
  var input = { left: false, right: false, jumpBuf: 0 };
  var pointers = {};

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    build();
    state = S.PLAY;
    T0 = 0;
    broken = {}; for (var k in UNITS) broken[k] = false;
    ribs = []; for (var i = 0; i < 24; i++) ribs[i] = false;
    brokenCount = 0;
    ctl = { x: startX, y: startY, vx: 0, vy: 0, ground: true, coyote: 0, h: 250 };
    dir = 1; phase = 0; cleared = false; endT = 0;
    milks.forEach(function (m) { m.got = false; });
    barrels = [];
    lanes.forEach(function (l, j) {
      for (var x = l.x1 - 30; x > l.x0; x -= l.gap * T * 1.4) barrels.push({ lane: l, x: x, a: 0 });
    });
    sparks = []; hitCool = 0; flash = 0; shake = 0;
    input.jumpBuf = 0;
    refresh();
    var t = targets();
    for (i = 0; i < NP; i++) P[i] = { x: t[i].x, y: t[i].y, px: t[i].x, py: t[i].y };
    STICKS.forEach(function (s) { s.len = Math.hypot(P[s.a].x - P[s.b].x, P[s.a].y - P[s.b].y); });
    camX = ctl.x - W / Z * 0.36; camY = ctl.y - H / Z * 0.7;
  }

  /* 折れ具合から、支えと動ける力を決め直す */
  function refresh() {
    for (var i = 0; i < NP; i++) {
      var ok = state !== S.DOWN;
      if (ok) NEED[i].forEach(function (u) { if (broken[u]) ok = false; });
      sup[i] = ok;
    }
    var spine = broken.lumb || broken.thor1 || broken.thor2;
    legs = 0;
    if (!broken.pelvis && !spine) {
      if (!broken.femN && !broken.shinN) legs++;
      if (!broken.femF && !broken.shinF) legs++;
    }
    arms = 0;
    if (!spine) {
      if (!broken.clavN && !broken.humN && !broken.foreN) arms++;
      if (!broken.clavF && !broken.humF && !broken.foreF) arms++;
    }
  }

  function breakUnit(id) {
    if (id === "ribs") {
      var left = [];
      for (var i = 0; i < 24; i++) if (!ribs[i]) left.push(i);
      if (!left.length) return false;
      ribs[left[Math.floor(Math.random() * left.length)]] = true;
      brokenCount++;
      sCrack(); burst(P[CHE].x + dir * 16, P[CHE].y + 10);
      return true;
    }
    if (broken[id]) return false;
    broken[id] = true;
    brokenCount += UNITS[id].n;
    var m = midOf(id);
    if (m != null) { P[m].px -= dir * 4; P[m].py += 3; burst(P[m].x, P[m].y); }
    sCrack(); shake = Math.min(18, shake + 9); flash = 0.25;
    refresh();
    if (broken.skull || broken.cerv || broken.lumb || broken.thor1 || broken.thor2 || (legs === 0 && arms === 0)) down();
    return true;
  }
  function midOf(id) {
    var s = id.slice(-1), a = s === "F" ? AF : AN, l = s === "F" ? LG : LN;
    if (/^hum/.test(id)) return a.hm; if (/^fore/.test(id)) return a.fm; if (/^clav/.test(id)) return SHO;
    if (/^fem/.test(id)) return l.fm; if (/^shin/.test(id)) return l.sm;
    return { skull: HEA, cerv: NEC, thor1: CHE, thor2: WAI, lumb: WAI, pelvis: PEL }[id];
  }
  function heal() {
    var order = ["shinN", "shinF", "femN", "femF", "pelvis", "foreN", "foreF", "humN", "humF", "clavN", "clavF"];
    for (var i = 0; i < order.length; i++) if (broken[order[i]]) {
      broken[order[i]] = false; brokenCount -= UNITS[order[i]].n; refresh(); return;
    }
    for (i = 0; i < 24; i++) if (ribs[i]) { ribs[i] = false; brokenCount--; return; }
  }
  function down() {
    if (state !== S.PLAY) return;
    state = S.DOWN; endT = 0;
    refresh();
  }
  function burst(x, y) {
    for (var i = 0; i < 9; i++) {
      var a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 220;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0.5 });
    }
  }

  /* 着地の衝撃。地面に近い骨から順に折れる */
  var SAFE = 1050;
  function impact(v) {
    if (v > 500) sLand(v);
    if (v <= SAFE) return;
    var pts = 1 + Math.floor((v - SAFE) / 110), seq = [];
    function sh(a) { return a.sort(function () { return Math.random() - 0.5; }); }
    if (legs > 0) {
      var sides = [];
      if (!broken.femN && !broken.shinN) sides.push("N");
      if (!broken.femF && !broken.shinF) sides.push("F");
      seq = seq.concat(sh(sides.map(function (s) { return "shin" + s; })));
      seq = seq.concat(sh(sides.map(function (s) { return "fem" + s; })));
      seq = seq.concat(["pelvis", "ribs", "ribs", "lumb", "thor2"]);
    } else {
      seq = ["ribs", "ribs"].concat(sh(["foreN", "foreF"]), sh(["humN", "humF"]), ["ribs", "clavN", "skull"]);
    }
    for (var i = 0; i < seq.length && pts > 0; i++) {
      if (state !== S.PLAY) break;
      if (breakUnit(seq[i])) pts--;
    }
  }

  /* ============ 姿勢 ============
     前向きを +x、下を +y にした体の形を作り、向きに合わせて世界の座標へ置く。 */
  function targets() {
    var t = [], prone = legs === 0, air = !ctl.ground;
    var spd = Math.min(1, Math.abs(ctl.vx) / 240);
    var px = ctl.x, py = prone ? ctl.y - 16 : ctl.y - HIP + (legs === 1 ? 6 : 0);
    function put(i, x, y) { t[i] = { x: px + dir * x, y: py + y }; }
    function dirv(a) { return [Math.sin(a), Math.cos(a)]; }  /* 下から前へ a だけ回した向き */
    var up, w, c, n, h;
    if (!prone) {
      var lean = 0.06 + 0.12 * spd;
      up = [Math.sin(lean), -Math.cos(lean)];
      w = [up[0] * LUMB, up[1] * LUMB];
      c = [w[0] + up[0] * TH2, w[1] + up[1] * TH2];
      n = [c[0] + up[0] * TH1, c[1] + up[1] * TH1];
      h = [n[0] + up[0] * CERV + 2, n[1] + up[1] * CERV];
    } else {
      var lift = 0.08;
      w = [LUMB, -2]; c = [LUMB + TH2, -4]; n = [LUMB + TH2 + TH1, -6];
      h = [n[0] + CERV * 0.75, n[1] - CERV * 0.65 + lift];
    }
    put(PEL, 0, 0); put(WAI, w[0], w[1]); put(CHE, c[0], c[1]); put(NEC, n[0], n[1]); put(HEA, h[0], h[1]);
    var so = prone ? [n[0] - 4, n[1] + 6] : [n[0] + 3, n[1] + 9];
    put(SHO, so[0], so[1]);

    function armAt(A, a1, bend) {
      var u = dirv(a1), f = dirv(a1 + bend);
      var e = [so[0] + u[0] * LH, so[1] + u[1] * LH];
      var wr = [e[0] + f[0] * LFA, e[1] + f[1] * LFA];
      put(A.hm, (so[0] + e[0]) / 2, (so[1] + e[1]) / 2); put(A.el, e[0], e[1]);
      put(A.fm, (e[0] + wr[0]) / 2, (e[1] + wr[1]) / 2); put(A.wr, wr[0], wr[1]);
      put(A.ha, wr[0] + f[0] * LHAND, wr[1] + f[1] * LHAND);
    }
    function legAt(L, a1, bend, footA) {
      var u = dirv(a1), f = dirv(a1 - bend);
      var k = [u[0] * LF, u[1] * LF];
      var an = [k[0] + f[0] * LS, k[1] + f[1] * LS];
      put(L.fm, k[0] / 2, k[1] / 2); put(L.kn, k[0], k[1]);
      put(L.sm, (k[0] + an[0]) / 2, (k[1] + an[1]) / 2); put(L.an, an[0], an[1]);
      var fa = footA == null ? 1.45 : footA;
      put(L.to, an[0] + Math.sin(fa) * FOOT, an[1] + Math.cos(fa) * FOOT);
    }
    var s = Math.sin(phase), co = Math.cos(phase);
    if (prone) {
      armAt(AN, 1.25 + 0.45 * s, 0.5 - 0.4 * s);
      armAt(AF, 1.25 - 0.45 * s, 0.5 + 0.4 * s);
      legAt(LN, -1.45, 0, 0.2);
      legAt(LG, -1.4, 0.1, 0.25);
    } else if (air) {
      var rising = ctl.vy < 0;
      armAt(AN, rising ? 2.3 : 1.7, 0.4);
      armAt(AF, rising ? 1.9 : 1.3, 0.5);
      legAt(LN, rising ? 0.7 : 0.35, rising ? 1.1 : 0.5);
      legAt(LG, rising ? -0.05 : 0.1, rising ? 0.5 : 0.3);
    } else if (legs === 1) {
      /* けんけん。無事な脚はまっすぐ、上半身は少し弾む */
      var hop = Math.abs(s) * spd;
      armAt(AN, 0.5 + 0.4 * hop, 0.6); armAt(AF, 0.4 + 0.3 * hop, 0.6);
      legAt(LN, 0.05 + 0.2 * co * spd, 0.15 + 0.4 * hop);
      legAt(LG, 0.05 - 0.2 * co * spd, 0.15 + 0.4 * hop);
      for (var j = 0; j < 6; j++) t[j].y -= hop * 6;
    } else {
      var amp = 0.55 * spd;
      armAt(AN, -amp * 0.9 * s, 0.3 + 0.3 * spd);
      armAt(AF, amp * 0.9 * s, 0.3 + 0.3 * spd);

  function drawHand(A) {
    var w = P[A.wr], h = P[A.ha];
    var d = norm(sub(h, w)), n = front(d), L = Math.hypot(h.x - w.x, h.y - w.y);
    function at(t, s) { return [w.x + d[0] * L * t + n[0] * s, w.y + d[1] * L * t + n[1] * s]; }
    for (var i = 0; i < 4; i++) { var c = at(0.12 + (i % 2) * 0.1, -3 + i * 2); blob(c[0], c[1], 1.8); }
    for (i = 0; i < 4; i++) {
      var s = -3.2 + i * 2.1, k = 1 - i * 0.05;
      lineBone([at(0.3, s), at(0.62, s)], 1.6);
      lineBone([at(0.66, s), at(0.8 * k, s + 0.6)], 1.4);
      lineBone([at(0.83 * k, s + 0.8), at(0.92 * k, s + 1.4)], 1.2);
      lineBone([at(0.95 * k, s + 1.6), at(1.0 * k, s + 2.4)], 1.1);
    }
    lineBone([at(0.2, 3.5), at(0.4, 7)], 1.7);
    lineBone([at(0.45, 7.6), at(0.6, 9)], 1.4);
    lineBone([at(0.64, 9.2), at(0.74, 9.8)], 1.2);
  }
  function drawFoot(L) {
    var a = P[L.an], t = P[L.to];
    var d = norm(sub(t, a)), n = front(d);
    var len = Math.hypot(t.x - a.x, t.y - a.y);
    var up = [-n[0], -n[1]];
    var dn = [d[1] * dir, -d[0] * dir];          /* 足の裏の向き */
    function at(u, v) { return [a.x + d[0] * u + dn[0] * v, a.y + d[1] * u + dn[1] * v]; }
    var heel = at(-8, 5); blob(heel[0], heel[1], 5.2);    /* 踵骨 */
    var ta = at(0, 0); blob(ta[0], ta[1], 4.4);           /* 距骨 */
    var nv = at(6, 1); blob(nv[0], nv[1], 3);
    for (var i = 0; i < 3; i++) { var cu = at(9 + i * 0.5, 1.5 + i * 1.4); blob(cu[0], cu[1], 1.8); }

    for (i = 0; i < 5; i++) {
      var o = 0.4 + i * 1.3;
      lineBone([at(11 * k, o), at(19 * k, o + 1.8)], 1.8);
      lineBone([at(20 * k, o + 2), at(23.5 * k, o + 2.6)], 1.4);
      if (i) lineBone([at(24.5 * k, o + 2.8), at(26 * k, o + 3.2)], 1.2);
    }
    void up;
  }
  function drawLimbArm(A, s) {
    var sh = P[SHO];
    longBone(sh, P[A.hm], P[A.el], [[6, 0, 7, 5.5]], broken["hum" + s]);
    var d = norm(sub(P[A.wr], P[A.el])), f = front(d), side = f[0] * dir >= 0 ? 1 : -1;
    longBone(P[A.el], P[A.fm], P[A.wr], [[3.6, 2.4 * side, 3.6, 3], [3.2, -2.4 * side, 3, 3.6]], broken["fore" + s]);
    drawHand(A);
  }
  function drawLimbLeg(L, s) {
    longBone(P[PEL], P[L.fm], P[L.kn], [[8, 0, 9, 8]], broken["fem" + s]);
    /* 膝のお皿 */
    var d = norm(sub(P[L.kn], P[PEL])), f = front(d);
    blob(P[L.kn].x + f[0] * 6, P[L.kn].y + f[1] * 6, 3.6);
    var d2 = norm(sub(P[L.an], P[L.kn])), f2 = front(d2);
    var o = f2[0] * dir >= 0 ? 1 : -1;
    var n2 = [-d2[1], d2[0]];
    var sideSign = (n2[0] * f2[0] + n2[1] * f2[1]) > 0 ? 1 : -1;
    longBone(P[L.kn], P[L.sm], P[L.an], [[6.5, 1.2 * sideSign, 8, 5.5], [2.6, -4.6 * sideSign, 3, 3.4]], broken["shin" + s]);
    void o;
    drawFoot(L);
  }
  function drawSkin(chain, w) {
    ctx.beginPath(); ctx.moveTo(P[chain[0]].x, P[chain[0]].y);
    for (var i = 1; i < chain.length; i++) ctx.lineTo(P[chain[i]].x, P[chain[i]].y);
    ctx.lineWidth = w; ctx.stroke();
  }
  function skinStyle(far) {
    ctx.strokeStyle = far ? "rgba(214,150,128,.55)" : "rgba(244,186,160,.55)";
    ctx.lineCap = "round"; ctx.lineJoin = "round";
  }
  function drawArmSet(A, s, far) {
    skinStyle(far);
    drawSkin([SHO, A.hm, A.el], 17); drawSkin([A.el, A.fm, A.wr], 14); drawSkin([A.wr, A.ha], 11);
    drawLimbArm(A, s);
  }
  function drawLegSet(L, s, far) {
    skinStyle(far);
    drawSkin([PEL, L.fm, L.kn], 24); drawSkin([L.kn, L.sm, L.an], 17); drawSkin([L.an, L.to], 11);
    drawLimbLeg(L, s);
  }
  function drawTorso() {
    var pel = P[PEL], wai = P[WAI], che = P[CHE], nec = P[NEC], hea = P[HEA], sho = P[SHO];
    /* 肌 */
    skinStyle(false);
    var tu = norm(sub(nec, pel)), tf = front(tu);
    ctx.beginPath();
    ctx.moveTo(pel.x - tf[0] * 4, pel.y - tf[1] * 4);
    ctx.lineTo(wai.x + tf[0] * 6, wai.y + tf[1] * 6);
    ctx.lineTo(che.x + tf[0] * 10, che.y + tf[1] * 10);
    ctx.lineTo(nec.x + tf[0] * 6, nec.y + tf[1] * 6);
    ctx.lineWidth = 50; ctx.stroke();
    drawSkin([NEC, HEA], 22);
    ctx.beginPath(); ctx.arc(hea.x, hea.y, 23, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(244,186,160,.55)"; ctx.fill();

    /* 骨盤 */
    var pu = norm(sub(wai, pel)), pf = front(pu);
    function pp(u, f) { return [pel.x + pu[0] * u + pf[0] * f, pel.y + pu[1] * u + pf[1] * f]; }
    var base = pp(14, -11);
    ctx.beginPath();
    [pp(6, -10), pp(26, -14), pp(31, -2), pp(26, 9), pp(15, 13), pp(6, 9), pp(-2, 12), pp(-8, 10), pp(-12, 2), pp(-10, -6)].forEach(function (q, i) { i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); ctx.fillStyle = BONE; ctx.fill(); ctx.strokeStyle = broken.pelvis ? RED : EDGE; ctx.lineWidth = broken.pelvis ? 2.4 : 1.2; ctx.stroke();
    var hole = pp(-4, 3); ctx.beginPath(); ctx.arc(hole[0], hole[1], 3.4, 0, Math.PI * 2); ctx.fillStyle = "rgba(107,95,76,.5)"; ctx.fill();
    ctx.beginPath(); ctx.arc(pel.x, pel.y, 4.2, 0, Math.PI * 2); ctx.strokeStyle = EDGE; ctx.lineWidth = 1.2; ctx.stroke();
    /* 仙骨・尾骨 */
    var sc = pp(-4, -15), cc = pp(-12, -12);
    lineBone([base, sc], 7); lineBone([sc, cc], 3);

    /* 背骨: 腰椎5・胸椎12・頸椎7 */
    function verts(a, b, n, w, cls) {
      var d = norm([b[0] - a[0], b[1] - a[1]]), f = front(d);
      for (var i = 0; i < n; i++) {
        var t = (i + 0.5) / n, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
        var len = Math.hypot(b[0] - a[0], b[1] - a[1]) / n * 0.78;
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(d[1], d[0]));
        roundRect(-len / 2, -w / 2, len, w, 2);
        ctx.fillStyle = BONE; ctx.fill(); ctx.strokeStyle = broken[cls] ? RED : EDGE; ctx.lineWidth = broken[cls] ? 2 : 1.1; ctx.stroke();
        ctx.restore();
        /* 棘突起（背中側） */
        lineBone([[x - f[0] * w * 0.4, y - f[1] * w * 0.4], [x - f[0] * (w * 0.4 + 6) + d[0] * 2, y - f[1] * (w * 0.4 + 6) + d[1] * 2]], 1.8);
      }
    }
    var W0 = [wai.x, wai.y], C0 = [che.x, che.y], N0 = [nec.x, nec.y];
    var hu = norm(sub(hea, nec)), hf = front(hu);
    var skullBase = [hea.x - hu[0] * 12 - hf[0] * 3, hea.y - hu[1] * 12 - hf[1] * 3];
    verts(base, W0, 5, 10, "lumb");

    /* 肋骨12対（奥の12本は少し暗く） */
    var tor = norm(sub(nec, wai)), fr = front(tor);
    function ribAt(i) {
      var t = (i + 0.5) / 12;
      return t < 0.5 ? [N0[0] + (C0[0] - N0[0]) * t * 2, N0[1] + (C0[1] - N0[1]) * t * 2]
                     : [C0[0] + (W0[0] - C0[0]) * (t - 0.5) * 2, C0[1] + (W0[1] - C0[1]) * (t - 0.5) * 2];
    }
    var depth = [22, 27, 31, 34, 35, 35, 34, 32, 29, 25, 15, 11];
    var ends = [];
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < 12; i++) {
        var v = ribAt(i), dp = depth[i] * (pass ? 1 : 0.93), drop = 8 + i * 1.1;
        var e = [v[0] + fr[0] * dp - tor[0] * drop, v[1] + fr[1] * dp - tor[1] * drop];
        var cp = [v[0] + fr[0] * dp * 0.55 + tor[0] * 5, v[1] + fr[1] * dp * 0.55 + tor[1] * 5];
        if (pass) ends[i] = e;
        ctx.beginPath(); ctx.moveTo(v[0], v[1]); ctx.quadraticCurveTo(cp[0], cp[1], e[0], e[1]);
        var br = ribs[i + (pass ? 0 : 12)];
        ctx.strokeStyle = EDGE; ctx.lineWidth = pass ? 3.6 : 3.2; ctx.stroke();
        ctx.strokeStyle = br ? RED : pass ? BONE : "#ddd5c4"; ctx.lineWidth = pass ? 1.8 : 1.4; ctx.stroke();
      }
    }
    /* 胸骨 */
    lineBone([[ends[0][0] + tor[0] * 3, ends[0][1] + tor[1] * 3], ends[3], ends[6]], 4.5);
    verts(W0, C0, 6, 9, "thor2");
    verts(C0, N0, 6, 8.5, "thor1");
    verts(N0, skullBase, 7, 6.5, "cerv");

    /* 肩甲骨と鎖骨 */
    var sf = fr;
    function sp(u, f) { return [sho.x + tor[0] * u + sf[0] * f, sho.y + tor[1] * u + sf[1] * f]; }
    ctx.beginPath();
    [sp(4, -3), sp(2, -14), sp(-30, -12), sp(-20, -4)].forEach(function (q, i) { i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); ctx.fillStyle = "rgba(246,241,228,.85)"; ctx.fill(); ctx.strokeStyle = EDGE; ctx.lineWidth = 1.1; ctx.stroke();
    var stTop = [ends[0][0] + tor[0] * 3, ends[0][1] + tor[1] * 3];
    lineBone([stTop, [sho.x + tor[0] * 3, sho.y + tor[1] * 3]], 3);
    if (broken.clavN || broken.clavF) { var cm = [(stTop[0] + sho.x) / 2, (stTop[1] + sho.y) / 2]; ctx.beginPath(); ctx.arc(cm[0], cm[1], 4, 0, Math.PI * 2); ctx.strokeStyle = RED; ctx.lineWidth = 2; ctx.stroke(); }

  }
  function drawSkull(c, u, f) {

    var ns = at(16, -9); ctx.beginPath(); ctx.arc(ns[0], ns[1], 2, 0, Math.PI * 2); ctx.fill();
    lineBone([at(2, -6), at(10, -9)], 1.5);

    for (var i = 0; i < 4; i++) { var a = at(9 + i * 2, -17), b = at(9 + i * 2, -21); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    var ear = at(-6, -3); ctx.beginPath(); ctx.arc(ear[0], ear[1], 2, 0, Math.PI * 2); ctx.fillStyle = "#4a4134"; ctx.fill();
  }

  function drawBody() {
    ctx.save();
    ctx.globalAlpha = 0.78;
    drawLegSet(LG, "F", true);
    drawArmSet(AF, "F", true);
    ctx.globalAlpha = 1;
    drawTorso();
    drawLegSet(LN, "N", false);
    drawArmSet(AN, "N", false);
    ctx.restore();
  }

  function drawPad() {
    if (state !== S.PLAY && state !== S.DOWN && state !== S.GOAL) return;
    buttons().forEach(function (b) {
      var on = b.id === "left" ? input.left : b.id === "right" ? input.right : false;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = on ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.45)"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(22,32,46,.55)"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.beginPath();
      if (b.id === "left") { ctx.moveTo(b.x + 12, b.y - 18); ctx.lineTo(b.x - 16, b.y); ctx.lineTo(b.x + 12, b.y + 18); }
      else if (b.id === "right") { ctx.moveTo(b.x - 12, b.y - 18); ctx.lineTo(b.x + 16, b.y); ctx.lineTo(b.x - 12, b.y + 18); }
      else { ctx.moveTo(b.x - 20, b.y + 12); ctx.lineTo(b.x, b.y - 16); ctx.lineTo(b.x + 20, b.y + 12); }
      ctx.closePath(); ctx.fill();
    });
    ctx.beginPath(); ctx.arc(RETRY.x, RETRY.y, RETRY.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.fillStyle = "#16202e";
    if (window.zActionIcon) window.zActionIcon(ctx, "もう一度", RETRY.x, RETRY.y + 1, 26);
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    drawBack();
    ctx.save();
    var sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(sx, sy);
    ctx.scale(Z, Z);

  /* 結果画面。無事な骨の数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;

      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];

    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    var a = String(TOTAL - brokenCount), b = "/" + TOTAL;
    ctx.font = "800 108px sans-serif"; var wa = ctx.measureText(a).width;
    ctx.font = "800 54px sans-serif"; var wb = ctx.measureText(b).width;
    var x0 = W / 2 - (wa + wb) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif"; ctx.fillText(a, x0, H * 0.45);
    ctx.font = "800 54px sans-serif"; ctx.fillText(b, x0 + wa + 4, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, broken: brokenCount, intact: TOTAL - brokenCount, legs: legs, arms: arms,
        x: ctl.x, y: ctl.y, ground: ctl.ground, goalX: goalX, cleared: cleared, W: W, H: H };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hold: function (k, on) { keys[k] = on; syncPointers(); },
    jump: function () { input.jumpBuf = 0.15; },
    debug: debugKey
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      await r.wait(300);
      keys.right = true; syncPointers();
      await r.wait(6000);
      keys.right = false; syncPointers();
      await r.wait(800);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
