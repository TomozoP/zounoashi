<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牛歩シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 牛歩シミュレーター

   押すたびに牛が速くなる。景色は 牧場→道路→町→都市→宇宙 と変わり、
   変わるたびに1押しの効き（ギア）が上がる。速さは落ちない。
   光の速さの手前で警告が出て、それでも押して光の速さになると宇宙が壊れる。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var TAU = Math.PI * 2;
  var C_KMH = 1079252848.8;                  /* 光の速さ km/h */
  var SONIC = 1234.8;                        /* 音の速さ km/h */
  var MIN_KMH = 0.1;                         /* 牛歩 */
  var WARN_BETA = 0.9;                       /* ここから警告 */

  /* 景色と、そこでの1押しの効き。上の速さに届くと次の景色へ移り、ギアが上がる。
     先へ行くほど1景色を抜けるのに要る押しの数が増える（50→100→150→198→297）。 */
  var GEARS = [
    { top: 50,    step: 1 },                 /* 牧場 */
    { top: 1e4,   step: 1e2 },               /* 道路 */
    { top: 1e6,   step: 6600 },              /* 町 */
    { top: 1e8,   step: 5e5 },               /* 都市 */
    { top: C_KMH, step: 3.3e6 }              /* 宇宙 */
  ];
  function gearIndex(km) {
    for (var i = 0; i < GEARS.length - 1; i++) if (km < GEARS[i].top) return i;
    return GEARS.length - 1;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function log10(v) { return Math.log(Math.max(v, 1e-9)) / Math.LN10; }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, t) {
    t = clamp01(t);
    var A = hex(a), B = hex(b);
    return "rgb(" + Math.round(A[0] + (B[0] - A[0]) * t) + "," +
                    Math.round(A[1] + (B[1] - A[1]) * t) + "," +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ")";
  }
  /* 景色の重みで色を混ぜる */
  function mixW(list) {
    var r = 0, g = 0, b = 0, s = 0;
    for (var i = 0; i < list.length; i++) {
      var w = W8[i]; if (w <= 0) continue;
      var c = hex(list[i]);
      r += c[0] * w; g += c[1] * w; b += c[2] * w; s += w;
    }
    if (s <= 0) return "rgb(0,0,0)";
    return "rgb(" + Math.round(r / s) + "," + Math.round(g / s) + "," + Math.round(b / s) + ")";
  }
  /* 番号から決まるでたらめ（流れても建物の高さが変わらないように） */
  function rnd(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function ell(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.2, rx), Math.max(0.2, ry), rot || 0, 0, TAU);
    ctx.fill();
  }

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", BOOM: "boom", RESULT: "result" };
  var state, score, T, bt;
  var speed = MIN_KMH, beta = 0, vis = 0, gear = 0, warning = false;
  var W8 = [1, 0, 0, 0, 0];                    /* 景色の重み（牧場・道路・町・都市・宇宙） */
  var cars, flying, rings, shards, stars;
  var dist, legPhase, prevHalf, prevKmh, prevGear, carTimer, sirenT, clickPulse, gearFlash;

  var CARCOL = ["#e0543c", "#3f7fd6", "#e8b63a", "#4aa86b", "#e9e4da", "#8a5ad0"];
  var PIECE = ["#f4f1ea", "#2b2723", "#e0543c", "#45464b", "#7fb04a", "#3f7fd6"];
  var SKY_HI = ["#3f8fd0", "#3f8fd0", "#4d92c8", "#6d8ba4", "#04050d"];
  var SKY_LO = ["#d5e9f6", "#d5e9f6", "#dbe7ef", "#c6ccd2", "#0a0b1a"];
  var GROUND = ["#7fb04a", "#74a648", "#8a9a6e", "#6e7278", "#0a0b1a"];
  var PAVE   = ["#b79a6b", "#4a4b50", "#4a4b50", "#3f4046", "#04050d"];

  var HORIZON, ROAD_TOP, ROAD_Y, ROAD_BOTTOM, READ_Y, GAUGE_Y, GX0, GX1;
  var COW_X = 196;
  function place() {
    HORIZON     = Math.round(H * 0.40);
    ROAD_TOP    = Math.round(H * 0.47);
    ROAD_Y      = Math.round(H * 0.615);       /* 牛の足元 */
    ROAD_BOTTOM = Math.round(H * 0.735);
    READ_Y      = Math.round(H * 0.80);
    GAUGE_Y     = Math.round(H * 0.86);
    GX0 = 76; GX1 = W - 76;
  }

  function visOf(km) {                          /* 画面上の流れる速さ px/s */
    return Math.min(2600, 40 * Math.pow(Math.max(km, 1e-4) / 5, 0.35));
  }
  function heatOf(km) { return clamp01((log10(km) - 4.0) / 2.2); }

  /* 景色の重み。境目では前後がまざる */
  function weightsAt(km) {
    var L = log10(km), b = 0.42, w = [0, 0, 0, 0, 0];
    for (var i = 0; i < 5; i++) {
      var lo = i === 0 ? -99 : log10(GEARS[i - 1].top);
      var hi = i === 4 ? 99 : log10(GEARS[i].top);
      var a = i === 0 ? 1 : clamp01((L - lo + b) / (2 * b));
      var c = i === 4 ? 1 : clamp01((hi + b - L) / (2 * b));
      w[i] = Math.min(a, c);
    }
    return w;
  }

  function fmtSpeed(km) {
    var b = km / C_KMH;
    if (b >= 0.01) return (b >= 1 ? 1 : Math.floor(b * 1e6) / 1e6).toFixed(6) + " c";
    if (km < 10) return km.toFixed(2) + " km/h";
    if (km < 1000) return km.toFixed(0) + " km/h";
    return Math.round(km).toLocaleString("en-US") + " km/h";
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0; bt = 0;
    speed = MIN_KMH;
    cars = []; flying = []; rings = []; shards = [];
    dist = 0; legPhase = 0; prevHalf = 0; prevKmh = MIN_KMH; prevGear = 0;
    carTimer = 1.2; sirenT = 0; clickPulse = 0; gearFlash = 0;
    stars = [];
    for (var i = 0; i < 130; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H * 0.8, z: 0.25 + Math.random() * 0.75 });
    }
    recalc();
  }

  function recalc() {
    beta = speed / C_KMH;
    vis = visOf(speed);
    gear = gearIndex(speed);
    W8 = weightsAt(speed);
    warning = beta >= WARN_BETA;
  }

  /* ============ 押す ============ 1押しで、いまのギアのぶんだけ速くなる */
  function push() {
    if (state !== S.PLAY) return;
    score++;
    clickPulse = 1;
    speed += GEARS[gearIndex(speed)].step;
    if (speed >= C_KMH) { speed = C_KMH; recalc(); reachLight(); return; }
    recalc();
    var g = gear;
    tone(180 + g * 90 + Math.min(300, vis * 0.1), 0.06, 0.09, "square");
    noiseHit(0.05, 200 + g * 120, 0.09, 1.4);
  }

  function reachLight() {
    state = S.BOOM; bt = 0;
    shards = [];
    for (var i = 0; i < 80; i++) {
      var a = Math.random() * TAU, sp = 140 + Math.random() * 900;
      shards.push({ x: W / 2, y: H * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 12,
                    w: 6 + Math.random() * 34, h: 3 + Math.random() * 11,
                    c: PIECE[i % PIECE.length] });
    }
    noiseHit(1.5, 70, 0.5, 0.4);
    tone(70, 2.0, 0.32, "sawtooth", 22);
    tone(1400, 0.7, 0.18, "square", 60);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.BOOM) {
      bt += dt;
      for (var i = 0; i < shards.length; i++) {
        var s = shards[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
        s.vx *= 0.985; s.vy *= 0.985;
      }
      if (bt > 2.2) state = S.RESULT;
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;

    recalc();
    dist += vis * dt;
    clickPulse = Math.max(0, clickPulse - dt * 4);
    gearFlash = Math.max(0, gearFlash - dt * 1.6);

    /* ギアが変わった */
    if (gear !== prevGear) {
      if (gear > prevGear) {
        gearFlash = 1;
        tone(330, 0.16, 0.16, "square", 660);
        tone(660, 0.22, 0.12, "square", 990, 0.08);
        noiseHit(0.3, 300, 0.22, 0.8);
      }
      prevGear = gear;
    }

    /* 歩調とひづめの音 */
    var cad = Math.min(16, 0.9 + vis / 26);
    legPhase += cad * dt;
    var half = Math.floor(legPhase * 2);
    if (half !== prevHalf) {
      if (cad < 7) noiseHit(0.07, 150, 0.12, 1.2);
      prevHalf = half;
    }

    /* 音の壁 */
    if (prevKmh < SONIC && speed >= SONIC) {
      rings.push({ r: 24, life: 0 });
      noiseHit(0.55, 110, 0.45, 0.5);
      tone(160, 0.5, 0.2, "sawtooth", 50);
    }
    prevKmh = speed;

    /* 車。道路・町・都市にいる。速くなると追いついて跳ね飛ばす */
    var onRoad = W8[1] + W8[2] + W8[3];
    var rel = vis - visOf(58);
    if (onRoad > 0.25 && rel > 6) {
      carTimer -= dt;
      if (carTimer <= 0) {
        carTimer = clamp(300 / rel, 0.22, 3.5);
        cars.push({ x: W + 110, lane: Math.random() < 0.5 ? 0 : 1,
                    w: 92 + Math.random() * 26, col: CARCOL[Math.floor(Math.random() * CARCOL.length)] });
      }
    }
    for (var j = cars.length - 1; j >= 0; j--) {
      var c = cars[j];
      c.x -= rel * dt;
      if (rel > 0 && c.x < COW_X + 120) {          /* 牛の鼻先で弾く */
        cars.splice(j, 1);
        bump(c, rel);
      } else if (c.x < -220 || c.x > W + 420 || onRoad < 0.15) {
        cars.splice(j, 1);
      }
    }
    for (var k = flying.length - 1; k >= 0; k--) {
      var f = flying[k];
      f.vx += (-rel - f.vx) * 1.4 * dt;
      f.vy += 1600 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += f.vr * dt;
      if (f.y > ROAD_BOTTOM || f.x < -300 || f.x > W + 500) flying.splice(k, 1);
    }

    /* 音の壁の輪 */
    for (var m = rings.length - 1; m >= 0; m--) {
      rings[m].r += 900 * dt;
      rings[m].life += dt;
      if (rings[m].life > 0.9) rings.splice(m, 1);
    }

    /* 星の流れ */
    if (W8[4] > 0.01) {
      var len = starLen();
      for (var n = 0; n < stars.length; n++) {
        var st = stars[n];
        st.x -= vis * dt * (0.4 + st.z * 1.8);
        if (st.x < -len) { st.x += W + len * 2; st.y = Math.random() * H * 0.8; }
      }
    }

    /* 警告の音 */
    if (warning) {
      sirenT -= dt;
      if (sirenT <= 0) { sirenT = 0.42; tone(1046, 0.16, 0.08, "square"); tone(784, 0.16, 0.07, "square", null, 0.19); }
    } else { sirenT = 0; }
  }

  function bump(c, rel) {
    flying.push({ x: c.x, y: laneY(c.lane), w: c.w, col: c.col,
                  vx: Math.min(700, 210 + rel * 0.16), vy: -(880 + Math.random() * 260),
                  rot: 0, vr: (Math.random() * 7 + 4) * (Math.random() < 0.5 ? -1 : 1) });
    if (flying.length > 36) flying.shift();
    noiseHit(0.22, 240, 0.3, 0.8);
    tone(340, 0.18, 0.1, "sawtooth", 90);
  }
  function laneY(lane) { return ROAD_Y - 26 + lane * 30; }

  /* ============ 入力 ============
     絵の中ならどこを押してもよい。スペースとジョイパッドも同じ。 */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    push();
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない。連打で進む */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") {
      if (state === S.INTRO) startButton.click();
    }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。 */
    window.zResultActions.x({ text: score + "回押して宇宙を壊しました #牛歩シミュレーター" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function starLen() { return 3 + Math.pow(beta, 3) * 300 + vis * 0.05; }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, HORIZON + 80);
    g.addColorStop(0, mixW(SKY_HI));
    g.addColorStop(1, mixW(SKY_LO));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HORIZON + 80);
    ctx.fillStyle = mixW(GROUND);
    ctx.fillRect(0, HORIZON + 78, W, H - HORIZON - 78);
  }

  function drawStars() {
    var a = W8[4];
    if (a < 0.02) return;
    var len = starLen();
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], l = len * s.z;
      ctx.strokeStyle = "rgba(" + Math.round(205 + 50 * (1 - beta)) + "," +
                                  Math.round(218 + 37 * (1 - beta)) + ",255," +
                                  (a * (0.35 + s.z * 0.65)) + ")";
      ctx.lineWidth = 1 + s.z * 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + l, s.y);
      ctx.stroke();
    }
  }

  function drawClouds() {
    var a = W8[0] + W8[1] + W8[2] * 0.6;
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a) * 0.92;
    ctx.fillStyle = "#ffffff";
    var gap = 400, off = (dist * 0.06) % gap;
    for (var i = -1; i < Math.ceil(W / gap) + 3; i++) {
      var x = W + 160 - off - i * gap;
      if (x < -180 || x > W + 180) continue;
      var y = HORIZON - 300 + (Math.abs(i % 2) ? 120 : 0);
      ell(x, y, 62, 26); ell(x - 46, y + 12, 40, 19); ell(x + 44, y + 10, 46, 21);
    }
    ctx.restore();
  }

  function drawHills() {
    var a = W8[0] + W8[1] + W8[2] * 0.5;
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    var off = (dist * 0.12) % 420;
    ctx.fillStyle = "#6f9f7d";
    ctx.beginPath();
    ctx.moveTo(-off - 420, HORIZON + 8);
    for (var i = -1; i < 4; i++) {
      var bx = -off + i * 420;
      ctx.quadraticCurveTo(bx + 105, HORIZON - 92, bx + 210, HORIZON + 8);
      ctx.quadraticCurveTo(bx + 315, HORIZON - 48, bx + 420, HORIZON + 8);
    }
    ctx.lineTo(W + 500, HORIZON + 90);
    ctx.lineTo(-500, HORIZON + 90);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* 牧場：柵・納屋・仲間の牛 */
  function drawPasture() {
    var a = W8[0];
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = a;

    var gy = HORIZON + 46;
    var bgap = 900, boff = (dist * 0.3) % bgap;         /* 納屋とサイロ */
    for (var i = -1; i < Math.ceil(W / bgap) + 2; i++) {
      var bx = W + 200 - boff - i * bgap;
      if (bx < -220 || bx > W + 240) continue;
      ctx.fillStyle = "#b5503f";
      ctx.fillRect(bx - 84, gy - 70, 132, 70);
      ctx.beginPath();
      ctx.moveTo(bx - 94, gy - 70); ctx.lineTo(bx - 18, gy - 116); ctx.lineTo(bx + 58, gy - 70);
      ctx.closePath(); ctx.fillStyle = "#8c3a2d"; ctx.fill();
      ctx.fillStyle = "#e6ddc8";
      ctx.fillRect(bx + 62, gy - 96, 40, 96);
      ctx.beginPath(); ctx.ellipse(bx + 82, gy - 96, 20, 15, 0, Math.PI, 0); ctx.fill();
    }

    var hgap = 380, hoff = (dist * 0.34) % hgap;        /* 仲間の牛 */
    for (var j = -1; j < Math.ceil(W / hgap) + 2; j++) {
      var hx = W + 120 - hoff - j * hgap;
      if (hx < -100 || hx > W + 120) continue;
      for (var k = 0; k < 2; k++) {
        var x = hx + k * 66, y = gy - 6 - k * 12, s = 0.26 - k * 0.05;
        ctx.fillStyle = "#f5f2ea";
        ell(x, y, 46 * s, 26 * s);
        ell(x + 48 * s, y - 12 * s, 17 * s, 13 * s);
        ctx.fillStyle = "#2b2723";
        ell(x - 12 * s, y - 6 * s, 14 * s, 10 * s);
        ctx.fillRect(x - 26 * s, y + 18 * s, 6 * s, 20 * s);
        ctx.fillRect(x + 20 * s, y + 18 * s, 6 * s, 20 * s);
      }
    }

    var fgap = 74, foff = dist % fgap;                  /* 柵 */
    var fy = ROAD_TOP - 14;
    ctx.strokeStyle = "#a8875c"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(0, fy - 26); ctx.lineTo(W, fy - 26);
    ctx.moveTo(0, fy - 8); ctx.lineTo(W, fy - 8); ctx.stroke();
    ctx.fillStyle = "#8f7048";
    for (var m = -1; m < Math.ceil(W / fgap) + 2; m++) {
      var fx = W - foff - m * fgap;
      ctx.fillRect(fx - 5, fy - 44, 10, 46);
    }
    ctx.restore();
  }

  /* 道路：ガードレールと標識 */
  function drawGuard() {
    var a = W8[1] + W8[2] * 0.7 + W8[3] * 0.5;
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    var y = ROAD_TOP - 10;
    ctx.fillStyle = "#c9cdd2";
    ctx.fillRect(0, y - 20, W, 12);
    var gap = 120, off = dist % gap;
    ctx.fillStyle = "#9aa0a7";
    for (var i = -1; i < Math.ceil(W / gap) + 2; i++) {
      var x = W - off - i * gap;
      ctx.fillRect(x - 4, y - 8, 8, 14);
    }
    ctx.restore();
  }

  /* 町：家と商店、街灯 */
  function drawTown() {
    var a = W8[2];
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = a;
    var gy = ROAD_TOP - 18;
    var gap = 190, off = (dist * 0.8) % gap;
    var roofs = ["#c25a4a", "#4c6f9c", "#7a6aa8", "#c99a3f"];
    for (var i = -1; i < Math.ceil(W / gap) + 2; i++) {
      var x = W + 120 - off - i * gap;
      if (x < -160 || x > W + 160) continue;
      var r = rnd(Math.round((dist * 0.8 - off) / gap) + i);
      var hgt = 96 + r * 54, wid = 116 + r * 30;
      ctx.fillStyle = "#efe7d8";
      ctx.fillRect(x - wid / 2, gy - hgt, wid, hgt);
      ctx.fillStyle = roofs[Math.floor(r * 4) % 4];
      ctx.beginPath();
      ctx.moveTo(x - wid / 2 - 12, gy - hgt);
      ctx.lineTo(x, gy - hgt - 40 - r * 18);
      ctx.lineTo(x + wid / 2 + 12, gy - hgt);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8fb6cf";
      ctx.fillRect(x - wid * 0.3, gy - hgt + 22, 30, 26);
      ctx.fillRect(x + wid * 0.1, gy - hgt + 22, 30, 26);
      ctx.fillStyle = "#6d5a44";
      ctx.fillRect(x - 16, gy - 44, 32, 44);
    }
    var lgap = 250, loff = dist % lgap;                 /* 街灯 */
    ctx.strokeStyle = "#8b9199"; ctx.lineWidth = 6;
    for (var j = -1; j < Math.ceil(W / lgap) + 2; j++) {
      var lx = W - loff - j * lgap;
      ctx.beginPath(); ctx.moveTo(lx, gy); ctx.lineTo(lx, gy - 128);
      ctx.quadraticCurveTo(lx, gy - 146, lx + 26, gy - 146); ctx.stroke();
      ctx.fillStyle = "#f6e9bb";
      ell(lx + 30, gy - 143, 11, 7);
    }
    ctx.restore();
  }

  /* 都市：ビル群。奥と手前の2列 */
  function drawCity() {
    var a = W8[3];
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = a;
    var gy = ROAD_TOP - 14;
    layer(0.35, 0.55, "#5a6472", 128, 470);
    layer(0.85, 1.0, "#39414f", 96, 330);
    function layer(sp, dim, col, gap, maxh) {
      var off = (dist * sp) % gap;
      var base = Math.floor((dist * sp) / gap);
      for (var i = -1; i < Math.ceil(W / gap) + 2; i++) {
        var x = W + 60 - off - i * gap;
        if (x < -110 || x > W + 110) continue;
        var r = rnd(base + i + (sp > 0.5 ? 100 : 0));
        var hgt = 130 + r * (maxh - 130), wid = gap * (0.62 + r * 0.22);
        ctx.fillStyle = col;
        ctx.fillRect(x - wid / 2, gy - hgt, wid, hgt);
        ctx.fillStyle = "rgba(246,233,187," + (0.5 * dim) + ")";
        for (var wy = gy - hgt + 18; wy < gy - 22; wy += 30) {
          for (var wx = x - wid / 2 + 12; wx < x + wid / 2 - 14; wx += 26) {
            if (rnd(wx * 0.7 + wy * 1.3 + base) > 0.45) ctx.fillRect(wx, wy, 12, 16);
          }
        }
      }
    }
    ctx.restore();
  }

  function drawPoles() {
    var a = W8[1] + W8[2] * 0.5;
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    var gap = 270, off = (dist * 0.55) % gap;
    for (var i = -1; i < Math.ceil(W / gap) + 2; i++) {
      var x = W + 60 - off - i * gap;
      if (x < -60 || x > W + 80) continue;
      ctx.fillStyle = "#6b5c4c";
      ctx.fillRect(x - 5, HORIZON - 96, 10, 118);
      ctx.fillRect(x - 26, HORIZON - 88, 52, 8);
    }
    ctx.restore();
  }

  function drawRoad() {
    var a = 1 - W8[4];
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = mixW(PAVE);
    ctx.fillRect(0, ROAD_TOP, W, ROAD_BOTTOM - ROAD_TOP);

    var paved = Math.min(1, W8[1] + W8[2] + W8[3]);     /* 白線は舗装路だけ */
    if (paved > 0.02) {
      ctx.save();
      ctx.globalAlpha = a * paved;
      ctx.fillStyle = "#e9e4d6";
      ctx.fillRect(0, ROAD_TOP, W, 5);
      ctx.fillRect(0, ROAD_BOTTOM - 5, W, 5);
      var midY = Math.round(ROAD_TOP + (ROAD_BOTTOM - ROAD_TOP) * 0.34);
      var gap = 120, off = dist % gap;
      var dash = Math.min(74, 34 + vis * 0.06);
      ctx.fillStyle = "#f1ead6";
      for (var i = -1; i < Math.ceil(W / gap) + 2; i++) {
        ctx.fillRect(W - off - i * gap, midY, dash, 7);
      }
      ctx.restore();
    }
    if (vis > 500) {                                     /* 速いと路面が線に流れる */
      var n = Math.round(clamp((vis - 500) / 90, 1, 22));
      ctx.fillStyle = "rgba(255,255,255,.13)";
      for (var j = 0; j < n; j++) {
        var y = ROAD_TOP + 10 + Math.random() * (ROAD_BOTTOM - ROAD_TOP - 20);
        ctx.fillRect(Math.random() * W - 120, y, 120 + Math.random() * 260, 2);
      }
    }
    ctx.restore();
  }

  function drawCar(x, y, w, col, rot) {
    var h = 40;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.fillStyle = col;
    roundRect(-w / 2, -h / 2, w, h, 9); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    roundRect(-w * 0.26, -h / 2 - 20, w * 0.52, 24, 7); ctx.fill();
    ctx.fillStyle = "#23242a";
    ell(-w * 0.28, h / 2 - 1, 12, 12);
    ell(w * 0.28, h / 2 - 1, 12, 12);
    ctx.fillStyle = "#f6e6a8";
    ell(-w / 2 + 5, 0, 5, 4);
    ctx.restore();
  }

  /* 牛。右を向いて歩く */
  function drawCow(cx, gy, lean, phase, blurA) {
    ctx.save();
    ctx.translate(cx, gy);
    ctx.rotate(-lean);
    var bob = Math.abs(Math.sin(phase * TAU)) * 4;
    ctx.translate(0, -bob);

    if (blurA > 0.02) {
      ctx.save();
      ctx.globalAlpha = blurA * 0.16;
      for (var b = 1; b <= 3; b++) { ctx.save(); ctx.translate(-b * 11, 0); body(phase - b * 0.09); ctx.restore(); }
      ctx.restore();
    }
    body(phase);
    ctx.restore();

    function legs(ph, col) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 13;
      ctx.lineCap = "round";
      pair(-46, ph); pair(42, ph + 0.5);
      function pair(x, p) {
        var sw = Math.sin(p * TAU);
        var fx = x + sw * 16;
        var lift = Math.max(0, sw) * 11;
        ctx.beginPath();
        ctx.moveTo(x, -42);
        ctx.quadraticCurveTo(x + sw * 11, -22, fx, -2 - lift);
        ctx.stroke();
      }
    }

    function body(ph) {
      legs(ph + 0.25, "#cdc7ba");                 /* 奥の脚 */
      ctx.fillStyle = "#f5f2ea";
      ell(0, -62, 80, 45);                        /* 胴 */
      ctx.fillStyle = "#2b2723";                  /* 斑 */
      ell(-30, -76, 25, 17, -0.3);
      ell(18, -50, 18, 13, 0.2);
      ell(48, -80, 13, 10, 0.4);
      ctx.fillStyle = "#f0c3c6";                  /* 乳房 */
      ell(-12, -28, 19, 12);
      ctx.fillStyle = "#f5f2ea";                  /* 首 */
      ctx.beginPath();
      ctx.moveTo(56, -92); ctx.lineTo(96, -104); ctx.lineTo(102, -70); ctx.lineTo(60, -48);
      ctx.closePath(); ctx.fill();
      ell(106, -96, 30, 22, -0.18);               /* 頭 */
      ctx.fillStyle = "#e9a9a3";
      ell(130, -88, 15, 12, -0.18);               /* 鼻 */
      ctx.fillStyle = "#2b2723";
      ell(133, -92, 2.6, 2.2); ell(126, -83, 2.6, 2.2);
      ell(111, -104, 3.4, 3.4);                   /* 目 */
      ctx.fillStyle = "#f5f2ea";
      ell(92, -108, 11, 6, -0.5);                 /* 耳 */
      ctx.fillStyle = "#e7dfcb";
      ell(98, -118, 6, 9, -0.6); ell(116, -120, 6, 9, 0.4);   /* 角 */
      ctx.strokeStyle = "#f5f2ea"; ctx.lineWidth = 7; ctx.lineCap = "round";   /* 尻尾 */
      var sway = Math.sin(ph * TAU * 0.5) * 12;
      ctx.beginPath(); ctx.moveTo(-76, -84);
      ctx.quadraticCurveTo(-104 - sway * 0.4, -74 + sway, -96 - sway, -34 + sway * 0.6);
      ctx.stroke();
      ctx.fillStyle = "#2b2723";
      ell(-96 - sway, -30 + sway * 0.6, 6, 8);
      legs(ph, "#f5f2ea");                        /* 手前の脚 */
    }
  }

  function drawFlame() {
    var heat = heatOf(speed);
    if (heat < 0.03) return;
    var base = COW_X - 68, y0 = ROAD_Y - 58, L = 70 + heat * 320;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 14; i++) {
      var f = Math.random(), l = L * (0.3 + f * 0.7);
      var yy = y0 + (Math.random() - 0.5) * 44 * (0.4 + heat * 0.6);
      ctx.fillStyle = f > 0.66 ? "rgba(255,246,205,.5)"
                    : (f > 0.33 ? "rgba(255,168,45,.4)" : "rgba(255,74,18,.32)");
      ell(base - l * 0.5, yy, l * 0.5, 8 + Math.random() * 13);
    }
    ctx.restore();
  }

  function drawShock() {
    if (speed >= SONIC) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255," + (0.22 + clamp01(vis / 2600) * 0.34) + ")";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(COW_X + 116, ROAD_Y - 66, 30, 100, 0, -1.25, 1.25);
      ctx.stroke();
      ctx.restore();
    }
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i], a = 1 - r.life / 0.9;
      ctx.strokeStyle = "rgba(255,255,255," + (a * 0.6) + ")";
      ctx.lineWidth = 3 + a * 7;
      ctx.beginPath();
      ctx.ellipse(COW_X, ROAD_Y - 62, r.r, r.r * 0.42, 0, 0, TAU);
      ctx.stroke();
    }
  }

  function drawBlue() {
    if (beta < 0.2) return;
    var a = Math.pow(clamp01((beta - 0.2) / 0.8), 1.6);
    var g = ctx.createRadialGradient(W * 1.05, H * 0.42, 10, W * 1.05, H * 0.42, W * 1.35);
    g.addColorStop(0, "rgba(220,238,255," + (0.85 * a) + ")");
    g.addColorStop(0.35, "rgba(120,170,255," + (0.4 * a) + ")");
    g.addColorStop(1, "rgba(30,20,90,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawWarn() {
    if (!warning || state !== S.PLAY) return;
    var p = 0.5 + 0.5 * Math.sin(T * 13);
    ctx.save();
    ctx.strokeStyle = "rgba(255,46,46," + (0.3 + 0.55 * p) + ")";
    ctx.lineWidth = 28;
    ctx.strokeRect(14, 14, W - 28, H - 28);
    ctx.fillStyle = "rgba(255,255,255," + (0.55 + 0.45 * p) + ")";
    ctx.shadowColor = "rgba(210,0,0,.95)";
    ctx.shadowBlur = 24;
    ctx.font = "800 64px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("警告", W / 2, H * 0.185);
    ctx.restore();
  }

  function gearColor(i) {
    return ["#5ec27a", "#8fc258", "#e8c65a", "#e8843a", "#ff3b30"][i];
  }

  /* 速さの数字と、光の速さまでの目盛り（押すところではない） */
  function drawMeter() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,.75)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = warning ? "#ff6b60" : "#fff";
    var pop = 1 + clickPulse * 0.08;
    ctx.font = "800 " + Math.round(46 * pop) + "px sans-serif";
    ctx.fillText(fmtSpeed(speed), W / 2, READ_Y);
    ctx.restore();

    var y = GAUGE_Y, x0 = GX0, x1 = GX1;
    var lo = gear === 0 ? 0 : GEARS[gear - 1].top;
    var p = clamp01((gear + (speed - lo) / (GEARS[gear].top - lo)) / GEARS.length);
    ctx.save();
    roundRect(x0, y - 7, x1 - x0, 14, 7);
    ctx.fillStyle = "rgba(10,9,14,.5)"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.stroke();
    if (p > 0.004) {
      roundRect(x0, y - 7, (x1 - x0) * p, 14, 7);
      ctx.fillStyle = gearColor(gear); ctx.fill();
    }
    for (var i = 0; i < GEARS.length - 1; i++) {      /* 景色の変わり目 */
      var tx = x0 + (x1 - x0) * ((i + 1) / GEARS.length);
      ctx.fillStyle = i < gear ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.4)";
      ctx.fillRect(tx - 1.5, y - 18, 3, 9);
    }
    ctx.fillStyle = "#ff3b30";
    ctx.fillRect(x1 - 2, y - 18, 4, 9);
    ctx.restore();
  }

  function drawBoom() {
    if (bt < 0.45) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(1, bt / 0.3) + ")";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    var k = Math.min(1, (bt - 0.45) / 0.55);
    var v = Math.round(255 * (1 - k));
    ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    ctx.fillRect(0, 0, W, H);
    var a = clamp01(1 - (bt - 0.45) / 1.3);
    for (var i = 0; i < shards.length; i++) {
      var s = shards[i];
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.fillStyle = s.c;
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }
    var r = Math.max(0, 150 * (1 - (bt - 0.45) / 0.95));
    if (r > 0.5) {
      var g = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, r);
      g.addColorStop(0, "rgba(255,255,255," + a + ")");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(W / 2, H * 0.5, r, 0, TAU); ctx.fill();
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    if (state === S.BOOM && bt >= 0.45) { drawBoom(); return; }

    var shake = (vis / 2600) * 3 + (warning ? 5 : 0) + clickPulse * 3;
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    drawStars();
    drawClouds();
    drawHills();
    drawCity();
    drawTown();
    drawPasture();
    drawPoles();
    drawGuard();
    drawRoad();

    for (var i = 0; i < cars.length; i++) {
      var c = cars[i];
      drawCar(c.x, laneY(c.lane), c.w, c.col, 0);
    }
    drawFlame();
    drawCow(COW_X + clickPulse * 14, ROAD_Y, clamp01(vis / 2600) * 0.26, legPhase,
            clamp01((vis - 280) / 900));
    drawShock();
    for (var j = 0; j < flying.length; j++) {
      var f = flying[j];
      drawCar(f.x, f.y, f.w, f.col, f.rot);
    }
    drawBlue();
    if (gearFlash > 0.01) {                       /* ギアが上がった合図 */
      ctx.fillStyle = "rgba(255,255,255," + (gearFlash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    drawWarn();
    if (state !== S.RESULT) drawMeter();

    if (state === S.BOOM) drawBoom();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(4,3,8,.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, W: W, H: H,
               kmh: speed, beta: beta, vis: vis, gear: gear, step: GEARS[gear].step,
               phase: ["牧場", "道路", "町", "都市", "宇宙"][gear],
               cars: cars.length, flying: flying.length,
               warn: warning, read: fmtSpeed(speed) };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(900);
      r.key();
      await r.wait(600);
      while (state === S.PLAY) { r.key(); await r.wait(45); }
      if (!await r.until(function () { return state === S.RESULT; }, 8)) throw Error("宇宙が壊れない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer = null;
  document.addEventListener('pointerdown', function (e) {
    if (!(state === S.INTRO)) return;
    if (e.isPrimary === false || e.button > 0) return;
    startingPointer = e.pointerId;
    e.stopImmediatePropagation();
  }, true);
  document.addEventListener('pointerup', function (e) {
    if (!(state === S.INTRO) || startingPointer !== e.pointerId) return;
    startingPointer = null; e.preventDefault(); e.stopImmediatePropagation(); startButton.click();
  }, true);
  document.addEventListener('pointercancel', function () { startingPointer = null; }, true);

  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
