<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牛歩シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../share.js"></script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene3d.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 牛歩シミュレーター

   奥へ走る牛を、左後ろのすこし上から見ている（立体。組み立ては scene3d.js）。
   押すたびに速くなり、道の先にあるものを壊す。景色は 牧場→道路→町→都市→宇宙。
   変わるたびに1押しの効き（ギア）と壊すもの（わら・電柱・車・ビル・星）が変わる。
   速さは落ちない。光の速さの手前で警告が出て、それでも押すと宇宙が壊れる。

   空・雲・遠くの山なみと、数字まわりは2Dで描き、そのあいだに立体を重ねている。
   WebGL が無いところでは立体を飛ばして、進行だけが動く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var scene3d = null;
  if (window.WebGLRenderingContext && window.GyuhoScene3D && window.THREE) {
    try { scene3d = new window.GyuhoScene3D(); } catch (e) { scene3d = null; }
  }

  var TAU = Math.PI * 2;
  var C_KMH = 1079252848.8;                  /* 光の速さ km/h */
  var SONIC = 1234.8;                        /* 音の速さ km/h */
  var STROKE = 160;                          /* このぶん指を上へはらうと、ひとこぎ */
  var LUNGE = 2.2;                           /* 大きくはらったとき、何秒ぶん前へ出るか */
  var GLIDE = 0.18;                          /* 指を離したあとの余韻。1秒でこの割合まで落ちる */
  var GLIDE_MAX = 3000;                      /* 余韻の速さの上限（px／秒） */
  var MIN_KMH = 0.1;                         /* 牛歩 */
  var WARN_BETA = 0.9;                       /* ここから警告 */

  /* 景色と、そこでの1押しの効き。上の速さに届くと次の景色へ移り、ギアが上がる。
     宇宙に出たところで1押しの効きが一気に跳ね上がる。
     1景色に要る押しの数は 100→200→200→250→264→300（合計1314）。 */
  var GEARS = [
    { top: 10,    step: 0.1 },               /* 牧場：わら */
    { top: 50,    step: 0.2 },               /* 道路：人 */
    { top: 200,   step: 0.75 },              /* 町：車 */
    { top: 1000,  step: 3.2 },               /* 都市：大通りの車 */
    { top: 3e4,   step: 110 },               /* 洋上：島と戦闘機 */
    { top: C_KMH, step: 3.6e6 }              /* 宇宙：星 */
  ];
  var PHASE_NAME = ["牧場", "道路", "町", "都市", "洋上", "宇宙"];
  var NEWS = [
    "",
    "牧場から速い牛が脱走し県道を北上中、近隣住民は注意を",
    "脱走中の牛 市街地に入る 対向車線からの牛に警戒",
    "牛 都心を直進 建物等を破壊しながら北上中",
    "牛 国境を越え洋上を飛行中 各国が緊急事態を宣言、軍が出動開始",
    "牛 大気圏を抜け宇宙空間へ突入 このまま加速すると宇宙崩壊との見解"
  ];
  var WORLD = [1, 1.25, 1.5, 1.8, 2.6, 3.4];   /* 景色ごとの世界の広さ */
  /* 見た目の速さ。景色のはじめと終わりで、ここからここまで登る。
     景色が変わると登りなおすが、はじまりの速さ自体が段ごとに上がっていく。
     宇宙はいきなり速い。 */
  var WSP_LO = [46, 82, 131, 210, 380, 900];
  var WSP_HI = [700, 1000, 1400, 1950, 2500, 3600];
  /* 景色ごとに、道の先へ置くもの。洋上だけ2種類から選ぶ */
  function propType(g) {
    if (g === 3) return 3;                     /* 都市の道路上には大型トラック */
    if (g === 4) return Math.random() < 0.5 ? 4 : 6;   /* 島 / 戦闘機 */
    return g;
  }
  function gearIndex(km) {
    for (var i = 0; i < GEARS.length - 1; i++) if (km < GEARS[i].top) return i;
    return GEARS.length - 1;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function log10(v) { return Math.log(Math.max(v, 1e-9)) / Math.LN10; }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgb(c) { return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
  /* 景色の重みで色を混ぜる */
  function mixW(list) {
    var r = 0, g = 0, b = 0, s = 0;
    for (var i = 0; i < list.length; i++) {
      var w = W8[i]; if (w <= 0) continue;
      var c = hex(list[i]);
      r += c[0] * w; g += c[1] * w; b += c[2] * w; s += w;
    }
    if (s <= 0) return [0, 0, 0];
    return [r / s, g / s, b / s];
  }
  function rnd(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function ell(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.2, rx), Math.max(0.2, ry), rot || 0, 0, TAU);
    ctx.fill();
  }

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。 */
  var W = 540, H = 960;
  var HY, VAN, COWP, READ_Y;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);

    if (scene3d) scene3d.resize(canvas.width, canvas.height, H);
    place();
  }
  function place() {
    if (scene3d) {
      HY = scene3d.horizonY(H);
      VAN = scene3d.vanish(W, H);
      COWP = scene3d.cowScreen(W, H);
    } else {
      HY = Math.round(H * 0.30);
      VAN = { x: W * 0.66, y: HY };
      COWP = { x: W * 0.5, y: H * 0.62, s: 2 };
    }
    READ_Y = Math.round(H * 0.045 + 118);       /* 上部の速報の下に速度を置く */
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, windGain = null, windFilter = null;
  var audioUnlocked = false, showDragGuide = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 128, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  /* 開始操作が伝播を止める前に、実際の指の操作から直接音声を起こす。
     スワイプや長押しでは click が発生しないため、click に頼らない。 */
  ["touchstart", "touchend", "pointerdown", "pointerup"].forEach(function (name) {
    document.addEventListener(name, audioOn, { capture: true, passive: true });
  });
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var wind = AC.createBufferSource(); wind.buffer = NOISE; wind.loop = true;
    windFilter = AC.createBiquadFilter(); windFilter.type = "lowpass"; windFilter.frequency.value = 160;
    windGain = AC.createGain(); windGain.gain.value = 0;
    wind.connect(windFilter); windFilter.connect(windGain); windGain.connect(AC.destination); wind.start();
  }
  function updateWind() {
    if (!AC || !windGain) return;
    var active = state === S.PLAY && !document.hidden;
    var amount = active ? clamp01((wsp - 65) / 3000) : 0;
    var push = active ? clickPulse : 0;
    windGain.gain.setTargetAtTime(active ? amount * 0.045 + push * 0.018 : 0, AC.currentTime, 0.12);
    windFilter.frequency.setTargetAtTime(160 + amount * 1300 + push * 850, AC.currentTime, 0.1);
  }
  document.addEventListener("visibilitychange", updateWind);
  window.addEventListener("blur", function () {
    if (windGain) windGain.gain.setTargetAtTime(0, AC.currentTime, 0.04);
  });
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  function moo(pitch, dur, vol) {
    if (!AC) return;
    var n = AC.currentTime;
    var o = AC.createOscillator(), o2 = AC.createOscillator();
    var lfo = AC.createOscillator(), lg = AC.createGain();
    var f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(pitch * 1.16, n);
    o.frequency.exponentialRampToValueAtTime(pitch, n + dur * 0.22);
    o.frequency.exponentialRampToValueAtTime(pitch * 0.74, n + dur);
    o2.type = "triangle";
    o2.frequency.setValueAtTime(pitch * 0.5, n);
    o2.frequency.exponentialRampToValueAtTime(pitch * 0.37, n + dur);
    lfo.frequency.setValueAtTime(6.5, n);        /* のどのふるえ */
    lg.gain.setValueAtTime(pitch * 0.035, n);
    lfo.connect(lg); lg.connect(o.frequency);
    f.type = "bandpass";                         /* 口の開き */
    f.frequency.setValueAtTime(pitch * 2.1, n);
    f.frequency.exponentialRampToValueAtTime(pitch * 3.8, n + dur * 0.3);
    f.frequency.exponentialRampToValueAtTime(pitch * 1.9, n + dur);
    f.Q.value = 2.4;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.1);
    g.gain.setValueAtTime(vol, n + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination);
    o.start(n); o2.start(n); lfo.start(n);
    o.stop(n + dur + 0.05); o2.stop(n + dur + 0.05); lfo.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", BOOM: "boom", RESULT: "result" };
  var state, score, scoreF, broken, T, bt;
  var dragY = null, tickAcc = 0, mooAcc = 0, lastSmash = -9, boomT = 0, boost, lead;
  var moveAcc = 0, flickVel = 0, glide = 0, impactShake = 0;   /* 指の勢いと、離したあとの余韻 */
  var zips = [];                              /* 速いときに流れる線 */
  var news = null;                            /* 上に流れる速報 */
  var speed = MIN_KMH, beta = 0, wsp = 0, gear = 0, warning = false;
  var W8 = [1, 0, 0, 0, 0, 0];                 /* 景色の重み（牧場・道路・町・都市・大陸・宇宙） */
  var props, shards;
  var dist, nextAt, legPhase, prevHalf, prevKmh, prevGear, sirenT, clickPulse, gearFlash, lastDt;

  var PIECE = ["#f4f1ea", "#2b2723", "#e0543c", "#45464b", "#7fb04a", "#3f7fd6"];
  /* 空の色。ぜんぶの道のりを0〜1として、朝から夜へ移る */
  var SKY_KEY = [
    { t: 0.00, hi: "#6aa8dc", lo: "#ffd2a0" },   /* 朝やけ */
    { t: 0.15, hi: "#3f8fd0", lo: "#d5e9f6" },   /* 朝 */
    { t: 0.40, hi: "#2f86cf", lo: "#d8ecf8" },   /* 昼 */
    { t: 0.60, hi: "#3f80bd", lo: "#e8d3a8" },   /* 午後 */
    { t: 0.72, hi: "#436ea6", lo: "#f0a868" },   /* 夕 */
    { t: 0.83, hi: "#2a3f70", lo: "#d4683f" },   /* 日ぐれ */
    { t: 0.92, hi: "#101a3a", lo: "#34305c" },   /* 宵 */
    { t: 1.00, hi: "#04050d", lo: "#0a0b1a" }    /* 夜 */
  ];
  var GROUND = ["#7fb04a", "#74a648", "#8a9a6e", "#6e7278", "#2a6a8f", "#0a0b1a"];
  var PAVE   = ["#b79a6b", "#c5bbaa", "#4a4b50", "#34373d", "#2a6a8f", "#0a0b1a"];

  /* その景色のなかで、どこまで来たか（0〜1） */
  function phaseT(km) {
    var g = gearIndex(km);
    var lo = g === 0 ? MIN_KMH : GEARS[g - 1].top;
    return clamp01((km - lo) / (GEARS[g].top - lo));
  }
  function quietSpace() { return gear === 5 && phaseT(speed) >= 0.5; }
  function wspOf(km) {
    var g = gearIndex(km);
    return WSP_LO[g] + (WSP_HI[g] - WSP_LO[g]) * Math.pow(phaseT(km), 0.8);
  }
  /* 壊すものの間隔 */
  function propGap() {
    return wsp * (2.0 + 1.3 * phaseT(speed));   /* はじめ2秒に1つ、終わりで3.3秒に1つ */
  }
  function heatOf(km) { return clamp01((log10(km) - 2.8) / 1.6); }

  /* 景色はまぜない。速さが切れ目を越えたところで、まるごと入れ替わる */
  function weightsAt(km) {
    var w = [0, 0, 0, 0, 0, 0];
    w[gearIndex(km)] = 1;
    return w;
  }

  /* ぜんぶの道のりのうち、どこまで来たか */
  function progress() { return (gear + phaseT(speed)) / GEARS.length; }
  function lerpHex(a, b, k) {
    var A = hex(a), B = hex(b);
    return [A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k, A[2] + (B[2] - A[2]) * k];
  }
  function skyNow() {
    if (gear === 5) return { hi: [2, 3, 10], lo: [2, 3, 10] };
    var t = progress();
    for (var i = 1; i < SKY_KEY.length; i++) {
      if (t <= SKY_KEY[i].t) {
        var a = SKY_KEY[i - 1], b = SKY_KEY[i];
        var k = (t - a.t) / (b.t - a.t);
        return { hi: lerpHex(a.hi, b.hi, k), lo: lerpHex(a.lo, b.lo, k) };
      }
    }
    var last = SKY_KEY[SKY_KEY.length - 1];
    return { hi: hex(last.hi), lo: hex(last.lo) };
  }
  /* 日が傾くと、地面も暗くなる */
  function dayLight() {
    var t = progress();
    if (t < 0.58) return 1;
    return 1 - 0.55 * clamp01((t - 0.58) / 0.36);
  }
  function dim(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }

  function fmtSpeed(km) {
    if (km < 1000) return km.toFixed(2) + " km/h";
    return Math.round(km).toLocaleString("en-US") + " km/h";
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; scoreF = 0; tickAcc = 0; mooAcc = 0; lastSmash = -9; dragY = null; broken = 0;
    T = 0; bt = 0; lastDt = 1 / 60;
    speed = MIN_KMH;
    props = []; shards = [];
    dist = 0; nextAt = 300; legPhase = 0; prevHalf = 0; prevKmh = MIN_KMH; prevGear = 0;
    sirenT = 0; clickPulse = 0; gearFlash = 0; boost = 0; lead = 0; boomT = 0;
    moveAcc = 0; flickVel = 0; glide = 0; impactShake = 0;
    news = null;
    zips = [];
    for (var z = 0; z < 34; z++) {
      zips.push({ a: Math.random() * TAU, r: Math.random() * 1.2,
                  len: 0.09 + Math.random() * 0.22, v: 0.55 + Math.random() * 0.8 });
    }
    if (scene3d) scene3d.reset();
    recalc();
  }

  function recalc() {
    beta = speed / C_KMH;
    wsp = wspOf(speed);
    gear = gearIndex(speed);
    W8 = weightsAt(speed);
    warning = beta >= WARN_BETA;
  }

  /* ============ こぐ ============ なぞった長さのぶんだけ速くなる */
  function feed(px) {
    showDragGuide = false;
    if (state !== S.PLAY || !(px > 0)) return;
    var u = px / STROKE;
    scoreF += u;
    score = Math.floor(scoreF);
    speed += GEARS[gearIndex(speed)].step * u;
    boost += (px / 900) * wsp * LUNGE;         /* はらった量ぶん、前へ突き出す */
    clickPulse = Math.min(1, clickPulse + u * 0.6);
    if (speed >= C_KMH) { speed = C_KMH; recalc(); reachLight(); return; }
    recalc();
    tickAcc += u;
    if (tickAcc >= 1) {                        /* ひとこぎごとの足音 */
      tickAcc -= Math.floor(tickAcc);
      tone(180 + gear * 90 + Math.min(300, wsp * 0.1), 0.06, 0.07, "square");
      noiseHit(0.05, 200 + gear * 120, 0.07, 1.4);
    }
    mooAcc += u;
    if (mooAcc >= 5.5) {                       /* まとまってこぐと、モーと鳴く */
      mooAcc = 0;
      var big = u > 2.5;
      moo(150 + gear * 20 + phaseT(speed) * 46, big ? 0.62 : 0.42, big ? 0.15 : 0.1);
    }
  }

  function reachLight() {
    state = S.BOOM; bt = 0;
    shards = [];
    for (var i = 0; i < 80; i++) {
      var a = Math.random() * TAU, sp = 140 + Math.random() * 900;
      shards.push({ x: W / 2, y: H * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 12,
                    w: 6 + Math.random() * 34, h: 3 + Math.random() * 11,
                    c: PIECE[i % PIECE.length] });
    }
    noiseHit(1.5, 70, 0.5, 0.4);
    tone(70, 2.0, 0.32, "sawtooth", 22);
    tone(1400, 0.7, 0.18, "square", 60);
  }

  /* ============ 壊す ============ */
  function smash(o) {
    broken++;
    impactShake = Math.max(impactShake, o.t === 3 || o.t === 4 || o.t === 5 ? 6 : 4);
    if (scene3d) {
      if (o.t === 1) scene3d.launchPerson(o.x, o.r, o.z, dist);   /* 衝突した場所から跳ね上げる */
      else if (o.t === 2) scene3d.launchVehicle(o.x, o.r, o.z, dist, o.t);
      else scene3d.burst(o.x, o.y || 0, o.t, o.r, o.z);
    }
    if (T - lastSmash < 0.07) return;          /* つづけざまのときは重ねない */
    lastSmash = T;
    if (o.t === 0) {                           /* わら：ザッ */
      noiseHit(0.3, 1100, 0.18, 0.7);
      tone(560, 0.12, 0.042, "triangle", 320);
    } else if (o.t === 1) {                    /* 人：ボフッとひと声 */
      noiseHit(0.16, 340, 0.192, 1.0);
      tone(430, 0.09, 0.06, "triangle", 190);
      tone(250, 0.16, 0.042, "sawtooth", 110, 0.05);
    } else if (o.t === 2) {                    /* 車：低い衝撃と金属のきしみ */
      noiseHit(0.55, 120, 0.264, 0.6);
      noiseHit(0.24, 850, 0.096, 1.0);
      tone(125, 0.55, 0.138, "sine", 38);
      tone(230, 0.3, 0.06, "triangle", 65, 0.035);
    } else if (o.t === 3) {                    /* 大型車：腹に響く衝撃と長い余韻 */
      noiseHit(0.85, 85, 0.288, 0.5);
      noiseHit(0.45, 650, 0.12, 0.8);
      tone(100, 0.8, 0.168, "sine", 28);
      tone(180, 0.48, 0.072, "triangle", 45, 0.04);
    } else if (o.t === 4) {                    /* 島：ドシャーン */
      noiseHit(0.8, 180, 0.276, 0.45);
      noiseHit(0.5, 1300, 0.12, 0.9);
      tone(110, 0.6, 0.096, "sawtooth", 44);
    } else if (o.t === 6) {                    /* 戦闘機：爆発 */
      noiseHit(0.55, 140, 0.3, 0.4);
      noiseHit(0.3, 2400, 0.108, 1.5);
      tone(170, 0.32, 0.096, "sawtooth", 48);
    } else {                                   /* 星：キラン */
      noiseHit(0.34, 1800, 0.132, 2.4);
      tone(1600, 0.24, 0.06, "sine", 3200);
      tone(2400, 0.18, 0.036, "sine", 4800, 0.06);
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    lastDt = dt;
    updateWind();
    if (state === S.BOOM) {
      bt += dt;
      for (var i = 0; i < shards.length; i++) {
        var s = shards[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
        s.vx *= 0.985; s.vy *= 0.985;
      }
      if (bt > 2.2) state = S.RESULT;
      return;
    }
    if (state === S.RESULT) { bt += dt; return; }
    if (state !== S.PLAY) return;
    T += dt;

    if (dragY != null) {                       /* なぞっているあいだ、勢いを測る */
      flickVel = flickVel * 0.45 + (moveAcc / Math.max(dt, 1 / 120)) * 0.55;
      moveAcc = 0;
      glide = 0;
    } else if (glide > 40) {                   /* 離したあとは、余韻でしばらく進む */
      feed(glide * dt);
      glide *= Math.pow(GLIDE, dt);
      if (state !== S.PLAY) return;
    } else { glide = 0; }

    recalc();
    dist += wsp * dt;
    if (boost > 0) {                           /* 突き出したぶんを、みるみる使う */
      var give = Math.min(boost, boost * 6 * dt + 40 * dt);
      dist += give;
      boost -= give;
    }
    /* ひとこぎで素早く踏み込み、戻りはゆっくりにして重みを出す。 */
    var targetLead = Math.min(260, boost * 0.65 + clickPulse * 190);
    lead += (targetLead - lead) * Math.min(1, dt * (targetLead > lead ? 22 : 4.5));
    clickPulse = Math.max(0, clickPulse - dt * 2.8);
    impactShake = Math.max(0, impactShake - dt * 24);
    gearFlash = Math.max(0, gearFlash - dt * 1.6);

    /* ギアが上がった */
    if (gear !== prevGear) {
      for (var g2 = 0; g2 < props.length; g2++) {                    /* 道の先のものも入れ替える */
        props[g2].t = propType(gear);
        props[g2].y = props[g2].t === 6 ? 150 + Math.random() * 130 : 0;
      }
      if (gear > prevGear) {
        gearFlash = gear === 5 ? 0 : 1;
        if (NEWS[gear]) showNews(NEWS[gear]);
        tone(330, 0.16, 0.16, "square", 660);
        tone(660, 0.22, 0.12, "square", 990, 0.08);
        noiseHit(0.3, 300, 0.22, 0.8);
      }
      prevGear = gear;
    }

    /* 歩調とひづめの音 */
    var cad = Math.min(16, 0.9 + wsp / 24);
    legPhase += cad * dt;
    var half = Math.floor(legPhase * 2);
    if (half !== prevHalf) {
      if (cad < 7) noiseHit(0.07, 150, 0.12, 1.2);
      prevHalf = half;
    }

    /* 音の壁 */
    if (prevKmh < SONIC && speed >= SONIC) {
      if (scene3d) scene3d.sonicBoom();
      noiseHit(0.55, 110, 0.45, 0.5);
      tone(160, 0.5, 0.2, "sawtooth", 50);
    }
    prevKmh = speed;
    if (speed >= SONIC && scene3d) { /* 宇宙の後半も加速の輪を残す */
      boomT -= dt;
      if (boomT <= 0) { boomT = 0.36; scene3d.sonicBoom(1); }
    } else { boomT = 0; }

    /* 道の先に置くもの */
    if (quietSpace()) { props.length = 0; nextAt = dist + 1600; }
    while (!quietSpace() && nextAt - dist < 2500 * WORLD[gear]) {
      var pt = propType(gear);
      props.push({ at: nextAt, x: (Math.random() - 0.5) * 92, y: pt === 6 ? 150 + Math.random() * 130 : 0,
                   t: pt, r: Math.random(), z: nextAt - dist });
      nextAt += propGap() * (0.82 + Math.random() * 0.36);
    }
    for (var j = props.length - 1; j >= 0; j--) {
      var o = props[j];
      /* 車は前方から向かってくる。牛の加速とは別に進ませる。 */
      if (o.t === 2 || o.t === 3) o.at -= (o.t === 3 ? 180 : 130) * dt;
      o.z = o.at - dist;
      var contact = 96 + lead + (o.t === 5 ? 240 + o.r * 160 : o.t === 3 ? 150 : o.t === 2 ? 80 : 0);
      if (o.z <= contact) { props.splice(j, 1); smash(o); }
    }
    if (props.length > 60) props.splice(0, props.length - 60);

    if (news) { news.t += dt; if (news.t > news.dur) news = null; }

    /* 速いときの流れ線 */
    var zk = zipAmount();
    if (zk > 0.01) {
      for (var zi = 0; zi < zips.length; zi++) {
        var zp = zips[zi];
        zp.r += zp.v * dt * (0.5 + zk * 3.2);
        if (zp.r > 1.35) { zp.r = 0.04 + Math.random() * 0.12; zp.a = Math.random() * TAU; }
      }
    }

    /* 警告の音 */
    if (warning) {
      sirenT -= dt;
      if (sirenT <= 0) { sirenT = 0.42; tone(1046, 0.16, 0.08, "square"); tone(784, 0.16, 0.07, "square", null, 0.19); }
    } else { sirenT = 0; }
  }

  /* ============ 入力 ============
     絵の中ならどこを押してもよい。スペースとジョイパッドも同じ。 */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) return;
    if (x == null) feed(STROKE);               /* キーとジョイパッドは、ひとこぎぶん */
    else dragY = y;
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (dragY == null || state !== S.PLAY) return;
    var p = atCanvas(e);
    var dy = dragY - p.y;                      /* 上へはらったぶんだけ進む */
    dragY = p.y;
    if (dy > 0) { feed(dy); moveAcc += dy; }
  });
  function release() {
    if (dragY == null) return;
    dragY = null;
    glide = Math.min(GLIDE_MAX, flickVel);     /* 勢いをそのまま余韻へ */
    flickVel = 0; moveAcc = 0;
  }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(); });
  wrap.addEventListener("pointercancel", release);
  window.addEventListener("pointerup", release);   /* 絵の外で離したときのため */
  window.addEventListener("blur", release);
  wrap.addEventListener("wheel", function (e) {   /* ころがしても進む */
    if (state !== S.PLAY) return;
    e.preventDefault();
    audioOn();
    feed(Math.max(0, e.deltaY) * 0.7);
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    /* 手元では数字キーで景色の先頭へ飛ぶ。 */
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^[1-6]$/.test(e.key)) {
      e.preventDefault();
      if (e.repeat) return;
      if (state !== S.PLAY) newRound();
      var target = Number(e.key) - 1;
      speed = target === 0 ? MIN_KMH : GEARS[target - 1].top;
      boost = 0; glide = 0; lead = 0; dragY = null; flickVel = 0; moveAcc = 0;
      props.length = 0; nextAt = dist + 1600;
      if (scene3d) scene3d.reset();
      recalc();
      return;
    }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない。連打で進む */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") {
      if (state === S.INTRO) startButton.click();
    }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。 */
    window.zResultActions.x({ text: score + "回押して宇宙を壊しました #牛歩シミュレーター" });
  }

  /* ============ 描画 ============ 空と雲は2D、そのうえに立体、いちばん上に数字 */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    var sk = skyNow();
    var g = ctx.createLinearGradient(0, 0, 0, HY + 10);
    g.addColorStop(0, rgb(sk.hi));
    g.addColorStop(1, rgb(sk.lo));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HY + 10);
    /* 地平線から下は、空の下はしと同じ色でつないでおく。
       立体の地面は遠くがこの色に溶けるので、境目が出ない。 */
    ctx.fillStyle = scene3d ? rgb(sk.lo) : rgb(dim(mixW(GROUND), dayLight()));
    ctx.fillRect(0, HY, W, H - HY);
  }

  function drawClouds() {
    if (W8[3] || W8[5]) return;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = rgb(dim([255, 255, 255], 0.45 + dayLight() * 0.55));
    var gap = 250, off = (dist * 0.05) % gap;
    for (var i = -1; i < Math.ceil(W / gap) + 3; i++) {
      var x = W + 140 - off - i * gap;
      if (x < -160 || x > W + 160) continue;
      var cloudId = i - Math.floor(dist * 0.05 / gap);
      var y = HY - 120 - ((cloudId % 3 + 3) % 3) * 84;
      ell(x, y, 56, 23); ell(x - 42, y + 11, 36, 17); ell(x + 40, y + 9, 41, 19);
    }
    ctx.restore();
  }

  /* 地平線のむこう（山なみ・遠いビルの影） */
  function drawFar() {
    if (!W8[3] && !W8[4] && !W8[5]) {
      ctx.save();
      var off = (dist * 0.03) % 420;
      ctx.fillStyle = rgb(dim([111, 159, 125], dayLight()));
      ctx.beginPath();
      ctx.moveTo(-off - 420, HY + 4);
      for (var i = -1; i < 4; i++) {
        var bx = -off + i * 420;
        ctx.quadraticCurveTo(bx + 105, HY - 74, bx + 210, HY + 4);
        ctx.quadraticCurveTo(bx + 315, HY - 38, bx + 420, HY + 4);
      }
      ctx.lineTo(W + 500, HY + 40); ctx.lineTo(-500, HY + 40);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (W8[3]) {
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = rgb(dim([107, 117, 133], dayLight()));
      var gap = 58, off2 = (dist * 0.04) % gap;
      for (var j = -1; j < Math.ceil(W / gap) + 2; j++) {
        var x = W - off2 - j * gap;
        var hgt = 34 + rnd(j - Math.floor((dist * 0.04) / gap)) * 110;
        ctx.fillRect(x - gap * 0.42, HY - hgt, gap * 0.84, hgt + 10);
      }
      ctx.restore();
    }
  }

  /* 大気との摩擦。牛が見えている場所に重ねる */
  function drawFlame() {
    var heat = heatOf(speed);
    if (heat < 0.03) return;
    var s = COWP.s;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 14; i++) {
      var f = Math.random(), l = (26 + f * 84 * heat) * s;
      var side = (Math.random() - 0.5) * 60 * s;
      ctx.fillStyle = f > 0.66 ? "rgba(255,246,205,.4)"
                    : (f > 0.33 ? "rgba(255,168,45,.32)" : "rgba(255,74,18,.26)");
      ell(COWP.x + side, COWP.y - 16 * s + l * 0.3, 9 * s + l * 0.13, l * 0.36);
    }
    ctx.restore();
  }

  /* 上に出る速報。文が右から左へ流れきったら消える */
  var NEWS_LOOPS = 3;
  function showNews(text) {
    ctx.save();
    ctx.font = "700 27px sans-serif";
    var tw = ctx.measureText(text).width;
    ctx.restore();
    var span = W - 104 + tw + 150;             /* 文ひとまわりぶんの長さ */
    news = { text: text, t: 0, w: tw, span: span,
             dur: 0.3 + (span / 168) * NEWS_LOOPS + 0.3 };
  }
  function drawNews() {
    if (!news) return;
    var t = news.t;
    var sl = Math.min(1, t / 0.28, (news.dur - t) / 0.28);
    if (sl <= 0) return;
    var h = 56, top = Math.round(H * 0.045) - (1 - sl) * (h + 22);
    ctx.save();
    ctx.globalAlpha = Math.min(1, sl);
    ctx.fillStyle = "rgba(252,250,246,.95)";
    ctx.fillRect(0, top, W, h);
    ctx.fillStyle = "#d8262b";
    ctx.fillRect(0, top, 104, h);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(0, top + h, W, 3);
    ctx.fillStyle = "#fff";
    ctx.font = "800 27px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("速報", 52, top + h / 2 + 1);
    ctx.beginPath();
    ctx.rect(104, top, W - 104, h);
    ctx.clip();
    ctx.fillStyle = "#16202e";
    ctx.font = "700 27px sans-serif";
    ctx.textAlign = "left";
    var run = Math.max(0, t - 0.3) * 168;
    ctx.fillText(news.text, W - (run % news.span), top + h / 2 + 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  /* 速いときに、奥から手前へ流れる線 */
  function zipAmount() {
    return clamp01((wsp - 65) / 1250) * (W8[5] ? 0.55 : 1);
  }
  function drawZips() {
    var k = zipAmount();
    if (k <= 0.01) return;
    var R = Math.max(W, H) * 0.9;
    ctx.save();
    ctx.lineCap = "round";
    for (var i = 0; i < zips.length; i++) {
      var z = zips[i];
      var c = Math.cos(z.a), si = Math.sin(z.a);
      var r0 = z.r, r1 = z.r + z.len * (0.4 + k);
      var fade = clamp01(r0 * 3) * clamp01((1.35 - r0) * 2.5);
      ctx.strokeStyle = "rgba(255,255,255," + (k * 0.42 * fade) + ")";
      ctx.lineWidth = 1.5 + k * 3.5;
      ctx.beginPath();
      ctx.moveTo(VAN.x + c * r0 * R, VAN.y + si * r0 * R * 0.88);
      ctx.lineTo(VAN.x + c * r1 * R, VAN.y + si * r1 * R * 0.88);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBlue() {
    if (gear !== 5) return;
    var a = Math.pow(phaseT(speed), 0.8);
    var radius = 24 + a * Math.max(W, H) * 1.8;
    var g = ctx.createRadialGradient(VAN.x, VAN.y, 0, VAN.x, VAN.y, radius);
    g.addColorStop(0, "rgba(240,248,255," + (0.45 + 0.5 * a) + ")");
    g.addColorStop(0.12, "rgba(175,215,255," + (0.2 + 0.5 * a) + ")");
    g.addColorStop(0.45, "rgba(85,125,255," + (0.08 + 0.25 * a) + ")");
    g.addColorStop(1, "rgba(30,20,90,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawWarn() {
    if (!warning || state !== S.PLAY) return;
    var p = 0.5 + 0.5 * Math.sin(T * 13);
    ctx.save();
    ctx.strokeStyle = "rgba(255,46,46," + (0.3 + 0.55 * p) + ")";
    ctx.lineWidth = 28;
    ctx.strokeRect(14, 14, W - 28, H - 28);
    ctx.restore();
  }

  /* 速さの数字 */
  function drawMeter() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,.75)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = warning ? "#ff6b60" : "#fff";
    var text = fmtSpeed(speed), size = 46;
    ctx.font = "800 " + size + "px sans-serif";
    var room = (W - 44) / 1.35;  /* 長い数字にも拡大する余白を残す */
    if (ctx.measureText(text).width > room) {
      size = Math.floor(size * room / ctx.measureText(text).width);
    }
    size = Math.round(size * (1 + clickPulse * 0.35));
    ctx.font = "800 " + size + "px sans-serif";
    ctx.fillText(text, W / 2, READ_Y);
    ctx.restore();
  }

  function drawBoom() {
    if (bt < 0.45) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(1, bt / 0.3) + ")";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    var k = Math.min(1, (bt - 0.45) / 0.55);
    var v = Math.round(255 * (1 - k));
    ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    ctx.fillRect(0, 0, W, H);
    var a = clamp01(1 - (bt - 0.45) / 1.3);
    for (var i = 0; i < shards.length; i++) {
      var s = shards[i];
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.fillStyle = s.c;
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }
    var r = Math.max(0, 150 * (1 - (bt - 0.45) / 0.95));
    if (r > 0.5) {
      var g = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, r);
      g.addColorStop(0, "rgba(255,255,255," + a + ")");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(W / 2, H * 0.5, r, 0, TAU); ctx.fill();
    }
  }

  function draw() {
    shareButton.hidden = true;
    if (state === S.RESULT) { drawResult(); return; }
    ctx.clearRect(0, 0, W, H);

    if (state === S.BOOM && bt >= 0.45) { drawBoom(); return; }

    var shake = clamp01(wsp / 2400) * 3 + (warning ? 5 : 0) + clickPulse * 3 + impactShake;
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    drawClouds();
    drawFar();
    drawBlue();

    if (scene3d) {
      scene3d.sync({
        dist: dist, w: W8, gear: gear, legPhase: legPhase, wsp: wsp, beta: beta,
        props: props, dt: lastDt, clickPulse: clickPulse, lead: lead, t: phaseT(speed), world: WORLD[gear],
        kmh: speed, running: state === S.PLAY, quietSpace: quietSpace(),
        groundColor: dim(mixW(GROUND), dayLight()), roadColor: dim(mixW(PAVE), dayLight()),
        fogColor: skyNow().lo, light: dayLight()
      });
      place();                                   /* カメラが動くので測りなおす */
      scene3d.render();
      ctx.drawImage(scene3d.dom, 0, 0, W, H);
    }

    drawFlame();
    drawZips();
    if (gearFlash > 0.01) {
      ctx.fillStyle = "rgba(255,255,255," + (gearFlash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    /* 奥の光が画面全体へ満ちる。光速の直前にはほぼ白くなる。 */
    if (gear === 5) {
      var white = Math.pow(clamp01((phaseT(speed) - 0.35) / 0.65), 1.25) * 0.98;
      ctx.fillStyle = "rgba(255,255,255," + white + ")";
      ctx.fillRect(0, 0, W, H);
    }
    drawWarn();
    if (state !== S.RESULT && state !== S.INTRO) { drawMeter(); drawNews(); }
    if (state === S.INTRO) drawTapGuide();
    else if (state === S.PLAY && showDragGuide) drawDragGuide();

    if (state === S.BOOM) drawBoom();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function drawDragGuide() {
    var phase = (performance.now() % 1800) / 1800;
    var travel = Math.min(1, phase / 0.7);
    var x = W / 2, bottom = H * 0.82, top = bottom - 140;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.85)";
    ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(x, bottom); ctx.lineTo(x, top);
    ctx.moveTo(x - 18, top + 22); ctx.lineTo(x, top); ctx.lineTo(x + 18, top + 22); ctx.stroke();
    ctx.globalAlpha = phase > 0.7 ? (1 - phase) / 0.3 : 1;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, bottom - travel * 130, 17, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawTapGuide() {
    var pulse = (performance.now() % 1200) / 1200;
    var x = W / 2, y = H * 0.78;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, 17, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255," + (1 - pulse) + ")";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, 22 + pulse * 28, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    var fade = clamp01((bt - 2.2) / 2);
    ctx.globalAlpha = fade * fade * (3 - 2 * fade);
    ctx.fillStyle = "#fff";
    ctx.font = "800 64px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("宇宙崩壊", W / 2, H / 2);
    ctx.restore();
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, broken: broken, W: W, H: H,
               kmh: speed, beta: beta, wsp: wsp, gear: gear, step: GEARS[gear].step,
               phase: PHASE_NAME[gear], props: props.length, quietSpace: quietSpace(),
               bits: scene3d ? scene3d.bits.length : 0, solid: !!scene3d,
               boost: Math.round(boost), lead: Math.round(lead), glide: Math.round(glide), news: news ? news.text : "",
               warn: warning, read: fmtSpeed(speed) };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(900);
      r.key();
      await r.wait(600);
      while (state === S.PLAY) { r.key(); await r.wait(38); }
      if (!await r.until(function () { return state === S.RESULT; }, 8)) throw Error("宇宙が壊れない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer = null, startingX = 0, startingY = 0, startingAt = 0, startTap = false;
  document.addEventListener('pointerdown', function (e) {
    if (!(state === S.INTRO)) return;
    if (e.isPrimary === false || e.button > 0) return;
    startingPointer = e.pointerId;
    startingX = e.clientX; startingY = e.clientY; startingAt = performance.now(); startTap = false;
    e.stopImmediatePropagation();
  }, true);
  document.addEventListener('pointerup', function (e) {
    if (!(state === S.INTRO) || startingPointer !== e.pointerId) return;
    startTap = performance.now() - startingAt < 500 && Math.hypot(e.clientX - startingX, e.clientY - startingY) < 16;
    startingPointer = null; e.stopImmediatePropagation();
  }, true);
  document.addEventListener('pointercancel', function () { startingPointer = null; }, true);
  document.addEventListener('click', function (e) {
    if (state !== S.INTRO || !startTap) return;
    startTap = false; e.preventDefault(); e.stopImmediatePropagation(); beginPlay();
  }, true);

  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  function beginPlay() { audioOn(); resumeAudio(); newRound(); showDragGuide = true; }
  startButton.addEventListener('click', function (e) { e.stopPropagation(); beginPlay(); });
  newRound(); state = S.INTRO; startButton.hidden = true;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
