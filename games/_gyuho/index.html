<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牛歩シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../share.js"></script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene3d.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 牛歩シミュレーター

   奥へ走る牛を、左後ろのすこし上から見ている（立体。組み立ては scene3d.js）。
   押すたびに速くなり、道の先にあるものを壊す。景色は 牧場→道路→町→都市→宇宙。
   変わるたびに1押しの効き（ギア）と壊すもの（わら・電柱・車・ビル・星）が変わる。
   速さは落ちない。光の速さの手前で警告が出て、それでも押すと宇宙が壊れる。

   空・雲・遠くの山なみと、数字まわりは2Dで描き、そのあいだに立体を重ねている。
   WebGL が無いところでは立体を飛ばして、進行だけが動く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var scene3d = null;
  if (window.WebGLRenderingContext && window.GyuhoScene3D && window.THREE) {
    try { scene3d = new window.GyuhoScene3D(); } catch (e) { scene3d = null; }
  }

  var TAU = Math.PI * 2;
  var C_KMH = 1079252848.8;                  /* 光の速さ km/h */
  var SONIC = 1234.8;                        /* 音の速さ km/h */
  var STROKE = 80;                           /* このぶん指を上へはらうと、ひとこぎ */
  var LUNGE = 1.4;                           /* 大きくはらったとき、何秒ぶん前へ出るか */
  var GLIDE = 0.1;                           /* 指を離したあとの余韻。1秒でこの割合まで落ちる */
  var GLIDE_MAX = 2600;                      /* 余韻の速さの上限（px／秒） */
  var MIN_KMH = 0.1;                         /* 牛歩 */
  var WARN_BETA = 0.9;                       /* ここから警告 */

  /* 景色と、そこでの1押しの効き。上の速さに届くと次の景色へ移り、ギアが上がる。
     宇宙に出たところで1押しの効きが一気に跳ね上がる。
     1景色に要る押しの数は 100→200→200→250→300（合計1050）。 */
  var GEARS = [
    { top: 10,    step: 0.1 },               /* 牧場：わら */
    { top: 50,    step: 0.2 },               /* 道路：電柱 */
    { top: 200,   step: 0.75 },              /* 町：車 */
    { top: 1000,  step: 3.2 },               /* 都市：ビル */
    { top: C_KMH, step: 3.6e6 }              /* 宇宙：星 */
  ];
  var PHASE_NAME = ["牧場", "道路", "町", "都市", "宇宙"];
  var WORLD = [1, 1.25, 1.5, 1.8, 2.2];      /* 景色ごとの世界の広さ */
  /* 見た目の速さ。景色のはじめと終わりで、ここからここまで登る。
     景色が変わると登りなおすが、はじまりの速さ自体が段ごとに上がっていく。
     宇宙はいきなり速い。 */
  var WSP_LO = [46, 82, 131, 210, 760];
  var WSP_HI = [700, 1000, 1400, 1950, 3200];
  function gearIndex(km) {
    for (var i = 0; i < GEARS.length - 1; i++) if (km < GEARS[i].top) return i;
    return GEARS.length - 1;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function log10(v) { return Math.log(Math.max(v, 1e-9)) / Math.LN10; }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgb(c) { return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
  /* 景色の重みで色を混ぜる */
  function mixW(list) {
    var r = 0, g = 0, b = 0, s = 0;
    for (var i = 0; i < list.length; i++) {
      var w = W8[i]; if (w <= 0) continue;
      var c = hex(list[i]);
      r += c[0] * w; g += c[1] * w; b += c[2] * w; s += w;
    }
    if (s <= 0) return [0, 0, 0];
    return [r / s, g / s, b / s];
  }
  function rnd(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function ell(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.2, rx), Math.max(0.2, ry), rot || 0, 0, TAU);
    ctx.fill();
  }

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。 */
  var W = 540, H = 960;
  var HY, VAN, COWP, READ_Y;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);

    if (scene3d) scene3d.resize(canvas.width, canvas.height, H);
    place();
  }
  function place() {
    if (scene3d) {
      HY = scene3d.horizonY(H);
      VAN = scene3d.vanish(W, H);
      COWP = scene3d.cowScreen(W, H);
    } else {
      HY = Math.round(H * 0.30);
      VAN = { x: W * 0.66, y: HY };
      COWP = { x: W * 0.5, y: H * 0.62, s: 2 };
    }
    READ_Y = Math.round(H * 0.84);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  function moo(pitch, dur, vol) {
    if (!AC) return;
    var n = AC.currentTime;
    var o = AC.createOscillator(), o2 = AC.createOscillator();
    var lfo = AC.createOscillator(), lg = AC.createGain();
    var f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(pitch * 1.16, n);
    o.frequency.exponentialRampToValueAtTime(pitch, n + dur * 0.22);
    o.frequency.exponentialRampToValueAtTime(pitch * 0.74, n + dur);
    o2.type = "triangle";
    o2.frequency.setValueAtTime(pitch * 0.5, n);
    o2.frequency.exponentialRampToValueAtTime(pitch * 0.37, n + dur);
    lfo.frequency.setValueAtTime(6.5, n);        /* のどのふるえ */
    lg.gain.setValueAtTime(pitch * 0.035, n);
    lfo.connect(lg); lg.connect(o.frequency);
    f.type = "bandpass";                         /* 口の開き */
    f.frequency.setValueAtTime(pitch * 2.1, n);
    f.frequency.exponentialRampToValueAtTime(pitch * 3.8, n + dur * 0.3);
    f.frequency.exponentialRampToValueAtTime(pitch * 1.9, n + dur);
    f.Q.value = 2.4;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.1);
    g.gain.setValueAtTime(vol, n + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination);
    o.start(n); o2.start(n); lfo.start(n);
    o.stop(n + dur + 0.05); o2.stop(n + dur + 0.05); lfo.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", BOOM: "boom", RESULT: "result" };
  var state, score, scoreF, broken, T, bt;
  var dragY = null, tickAcc = 0, mooAcc = 0, lastSmash = -9, boost, lead;
  var moveAcc = 0, flickVel = 0, glide = 0;   /* 指の勢いと、離したあとの余韻 */
  var zips = [];                              /* 速いときに流れる線 */
  var speed = MIN_KMH, beta = 0, wsp = 0, gear = 0, warning = false;
  var W8 = [1, 0, 0, 0, 0];                    /* 景色の重み（牧場・道路・町・都市・宇宙） */
  var props, shards;
  var dist, nextAt, legPhase, prevHalf, prevKmh, prevGear, sirenT, clickPulse, gearFlash, lastDt;

  var PIECE = ["#f4f1ea", "#2b2723", "#e0543c", "#45464b", "#7fb04a", "#3f7fd6"];
  var SKY_HI = ["#3f8fd0", "#3f8fd0", "#4d92c8", "#6d8ba4", "#04050d"];
  var SKY_LO = ["#d5e9f6", "#d5e9f6", "#dbe7ef", "#c6ccd2", "#0a0b1a"];
  var GROUND = ["#7fb04a", "#74a648", "#8a9a6e", "#6e7278", "#0a0b1a"];
  var PAVE   = ["#b79a6b", "#4a4b50", "#4a4b50", "#3f4046", "#0a0b1a"];

  /* その景色のなかで、どこまで来たか（0〜1） */
  function phaseT(km) {
    var g = gearIndex(km);
    var lo = g === 0 ? MIN_KMH : GEARS[g - 1].top;
    return clamp01((km - lo) / (GEARS[g].top - lo));
  }
  function wspOf(km) {
    var g = gearIndex(km);
    return WSP_LO[g] + (WSP_HI[g] - WSP_LO[g]) * Math.pow(phaseT(km), 0.8);
  }
  /* 壊すものの間隔 */
  function propGap() {
    return wsp * (2.0 + 1.3 * phaseT(speed));   /* はじめ2秒に1つ、終わりで3.3秒に1つ */
  }
  function heatOf(km) { return clamp01((log10(km) - 2.8) / 1.6); }

  /* 景色はまぜない。速さが切れ目を越えたところで、まるごと入れ替わる */
  function weightsAt(km) {
    var w = [0, 0, 0, 0, 0];
    w[gearIndex(km)] = 1;
    return w;
  }

  function fmtSpeed(km) {
    if (km < 1000) return km.toFixed(2) + " km/h";
    return Math.round(km).toLocaleString("en-US") + " km/h";
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; scoreF = 0; tickAcc = 0; mooAcc = 0; lastSmash = -9; dragY = null; broken = 0;
    T = 0; bt = 0; lastDt = 1 / 60;
    speed = MIN_KMH;
    props = []; shards = [];
    dist = 0; nextAt = 300; legPhase = 0; prevHalf = 0; prevKmh = MIN_KMH; prevGear = 0;
    sirenT = 0; clickPulse = 0; gearFlash = 0; boost = 0; lead = 0;
    moveAcc = 0; flickVel = 0; glide = 0;
    zips = [];
    for (var z = 0; z < 34; z++) {
      zips.push({ a: Math.random() * TAU, r: Math.random() * 1.2,
                  len: 0.09 + Math.random() * 0.22, v: 0.55 + Math.random() * 0.8 });
    }
    if (scene3d) scene3d.reset();
    recalc();
  }

  function recalc() {
    beta = speed / C_KMH;
    wsp = wspOf(speed);
    gear = gearIndex(speed);
    W8 = weightsAt(speed);
    warning = beta >= WARN_BETA;
  }

  /* ============ こぐ ============ なぞった長さのぶんだけ速くなる */
  function feed(px) {
    if (state !== S.PLAY || !(px > 0)) return;
    var u = px / STROKE;
    scoreF += u;
    score = Math.floor(scoreF);
    speed += GEARS[gearIndex(speed)].step * u;
    boost += (px / 900) * wsp * LUNGE;         /* はらった量ぶん、前へ突き出す */
    clickPulse = Math.min(1, clickPulse + u * 0.6);
    if (speed >= C_KMH) { speed = C_KMH; recalc(); reachLight(); return; }
    recalc();
    tickAcc += u;
    if (tickAcc >= 1) {                        /* ひとこぎごとの足音 */
      tickAcc -= Math.floor(tickAcc);
      tone(180 + gear * 90 + Math.min(300, wsp * 0.1), 0.06, 0.07, "square");
      noiseHit(0.05, 200 + gear * 120, 0.07, 1.4);
    }
    mooAcc += u;
    if (mooAcc >= 5.5) {                       /* まとまってこぐと、モーと鳴く */
      mooAcc = 0;
      var big = u > 2.5;
      moo(150 + gear * 20 + phaseT(speed) * 46, big ? 0.62 : 0.42, big ? 0.15 : 0.1);
    }
  }

  function reachLight() {
    state = S.BOOM; bt = 0;
    shards = [];
    for (var i = 0; i < 80; i++) {
      var a = Math.random() * TAU, sp = 140 + Math.random() * 900;
      shards.push({ x: W / 2, y: H * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 12,
                    w: 6 + Math.random() * 34, h: 3 + Math.random() * 11,
                    c: PIECE[i % PIECE.length] });
    }
    noiseHit(1.5, 70, 0.5, 0.4);
    tone(70, 2.0, 0.32, "sawtooth", 22);
    tone(1400, 0.7, 0.18, "square", 60);
  }

  /* ============ 壊す ============ */
  function smash(o) {
    broken++;
    if (scene3d) {
      if (o.t === 1) scene3d.launchPerson(o.x, o.r);   /* 人はこわさず跳ね上げる */
      else scene3d.burst(o.x, 0, o.t);
    }
    if (T - lastSmash < 0.07) return;          /* つづけざまのときは重ねない */
    lastSmash = T;
    if (o.t === 0) {                           /* わら：ザッ */
      noiseHit(0.3, 1100, 0.3, 0.7);
      tone(560, 0.12, 0.07, "triangle", 320);
    } else if (o.t === 1) {                    /* 人：ボフッとひと声 */
      noiseHit(0.16, 340, 0.32, 1.0);
      tone(430, 0.09, 0.1, "triangle", 190);
      tone(250, 0.16, 0.07, "sawtooth", 110, 0.05);
    } else if (o.t === 2) {                    /* 車：ガシャン */
      noiseHit(0.3, 200, 0.4, 0.7);
      noiseHit(0.22, 2600, 0.17, 1.6);
      tone(300, 0.2, 0.12, "sawtooth", 70);
    } else if (o.t === 3) {                    /* ビル：ゴゴゴ */
      noiseHit(0.7, 90, 0.46, 0.4);
      noiseHit(0.4, 520, 0.18, 0.8);
      tone(90, 0.5, 0.16, "sawtooth", 40);
    } else {                                   /* 星：キラン */
      noiseHit(0.34, 1800, 0.22, 2.4);
      tone(1600, 0.24, 0.1, "sine", 3200);
      tone(2400, 0.18, 0.06, "sine", 4800, 0.06);
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    lastDt = dt;
    if (state === S.BOOM) {
      bt += dt;
      for (var i = 0; i < shards.length; i++) {
        var s = shards[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
        s.vx *= 0.985; s.vy *= 0.985;
      }
      if (bt > 2.2) state = S.RESULT;
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;

    if (dragY != null) {                       /* なぞっているあいだ、勢いを測る */
      flickVel = flickVel * 0.45 + (moveAcc / Math.max(dt, 1 / 120)) * 0.55;
      moveAcc = 0;
      glide = 0;
    } else if (glide > 40) {                   /* 離したあとは、余韻でしばらく進む */
      feed(glide * dt);
      glide *= Math.pow(GLIDE, dt);
      if (state !== S.PLAY) return;
    } else { glide = 0; }

    recalc();
    dist += wsp * dt;
    if (boost > 0) {                           /* 突き出したぶんを、みるみる使う */
      var give = Math.min(boost, boost * 6 * dt + 40 * dt);
      dist += give;
      boost -= give;
    }
    lead += (Math.min(150, boost * 0.5) - lead) * Math.min(1, dt * 10);
    clickPulse = Math.max(0, clickPulse - dt * 4);
    gearFlash = Math.max(0, gearFlash - dt * 1.6);

    /* ギアが上がった */
    if (gear !== prevGear) {
      for (var g2 = 0; g2 < props.length; g2++) props[g2].t = gear;   /* 道の先のものも入れ替える */
      if (gear > prevGear) {
        gearFlash = 1;
        tone(330, 0.16, 0.16, "square", 660);
        tone(660, 0.22, 0.12, "square", 990, 0.08);
        noiseHit(0.3, 300, 0.22, 0.8);
      }
      prevGear = gear;
    }

    /* 歩調とひづめの音 */
    var cad = Math.min(16, 0.9 + wsp / 24);
    legPhase += cad * dt;
    var half = Math.floor(legPhase * 2);
    if (half !== prevHalf) {
      if (cad < 7) noiseHit(0.07, 150, 0.12, 1.2);
      prevHalf = half;
    }

    /* 音の壁 */
    if (prevKmh < SONIC && speed >= SONIC) {
      if (scene3d) scene3d.sonicBoom();
      noiseHit(0.55, 110, 0.45, 0.5);
      tone(160, 0.5, 0.2, "sawtooth", 50);
    }
    prevKmh = speed;

    /* 道の先に置くもの */
    while (nextAt - dist < 2500 * WORLD[gear]) {
      props.push({ at: nextAt, x: (Math.random() - 0.5) * 92, t: gear, r: Math.random(), z: nextAt - dist });
      nextAt += propGap() * (0.82 + Math.random() * 0.36);
    }
    for (var j = props.length - 1; j >= 0; j--) {
      var o = props[j];
      o.z = o.at - dist;
      if (o.z <= 96) { props.splice(j, 1); smash(o); }
    }
    if (props.length > 60) props.splice(0, props.length - 60);

    /* 速いときの流れ線 */
    var zk = zipAmount();
    if (zk > 0.01) {
      for (var zi = 0; zi < zips.length; zi++) {
        var zp = zips[zi];
        zp.r += zp.v * dt * (0.5 + zk * 3.2);
        if (zp.r > 1.35) { zp.r = 0.04 + Math.random() * 0.12; zp.a = Math.random() * TAU; }
      }
    }

    /* 警告の音 */
    if (warning) {
      sirenT -= dt;
      if (sirenT <= 0) { sirenT = 0.42; tone(1046, 0.16, 0.08, "square"); tone(784, 0.16, 0.07, "square", null, 0.19); }
    } else { sirenT = 0; }
  }

  /* ============ 入力 ============
     絵の中ならどこを押してもよい。スペースとジョイパッドも同じ。 */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) feed(STROKE);               /* キーとジョイパッドは、ひとこぎぶん */
    else dragY = y;
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (dragY == null || state !== S.PLAY) return;
    var p = atCanvas(e);
    var dy = dragY - p.y;                      /* 上へはらったぶんだけ進む */
    dragY = p.y;
    if (dy > 0) { feed(dy); moveAcc += dy; }
  });
  function release() {
    if (dragY == null) return;
    dragY = null;
    glide = Math.min(GLIDE_MAX, flickVel);     /* 勢いをそのまま余韻へ */
    flickVel = 0; moveAcc = 0;
  }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(); });
  wrap.addEventListener("pointercancel", release);
  window.addEventListener("blur", release);
  wrap.addEventListener("wheel", function (e) {   /* ころがしても進む */
    if (state !== S.PLAY) return;
    e.preventDefault();
    audioOn();
    feed(Math.max(0, e.deltaY) * 0.7);
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない。連打で進む */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") {
      if (state === S.INTRO) startButton.click();
    }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。 */
    window.zResultActions.x({ text: score + "回押して宇宙を壊しました #牛歩シミュレーター" });
  }

  /* ============ 描画 ============ 空と雲は2D、そのうえに立体、いちばん上に数字 */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, HY + 10);
    g.addColorStop(0, rgb(mixW(SKY_HI)));
    g.addColorStop(1, rgb(mixW(SKY_LO)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HY + 10);
    ctx.fillStyle = rgb(mixW(GROUND));           /* 立体が無いときの下地 */
    ctx.fillRect(0, HY, W, H - HY);
  }

  function drawClouds() {
    if (W8[3] || W8[4]) return;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = "#ffffff";
    var gap = 250, off = (dist * 0.05) % gap;
    for (var i = -1; i < Math.ceil(W / gap) + 3; i++) {
      var x = W + 140 - off - i * gap;
      if (x < -160 || x > W + 160) continue;
      var y = HY - 120 - (Math.abs(i % 3)) * 84;
      ell(x, y, 56, 23); ell(x - 42, y + 11, 36, 17); ell(x + 40, y + 9, 41, 19);
    }
    ctx.restore();
  }

  /* 地平線のむこう（山なみ・遠いビルの影） */
  function drawFar() {
    if (!W8[3] && !W8[4]) {
      ctx.save();
      var off = (dist * 0.03) % 420;
      ctx.fillStyle = "#6f9f7d";
      ctx.beginPath();
      ctx.moveTo(-off - 420, HY + 4);
      for (var i = -1; i < 4; i++) {
        var bx = -off + i * 420;
        ctx.quadraticCurveTo(bx + 105, HY - 74, bx + 210, HY + 4);
        ctx.quadraticCurveTo(bx + 315, HY - 38, bx + 420, HY + 4);
      }
      ctx.lineTo(W + 500, HY + 40); ctx.lineTo(-500, HY + 40);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (W8[3]) {
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "#6b7585";
      var gap = 58, off2 = (dist * 0.04) % gap;
      for (var j = -1; j < Math.ceil(W / gap) + 2; j++) {
        var x = W - off2 - j * gap;
        var hgt = 34 + rnd(j + Math.floor((dist * 0.04) / gap)) * 110;
        ctx.fillRect(x - gap * 0.42, HY - hgt, gap * 0.84, hgt + 10);
      }
      ctx.restore();
    }
  }

  /* 大気との摩擦。牛が見えている場所に重ねる */
  function drawFlame() {
    var heat = heatOf(speed);
    if (heat < 0.03) return;
    var s = COWP.s;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 14; i++) {
      var f = Math.random(), l = (26 + f * 84 * heat) * s;
      var side = (Math.random() - 0.5) * 60 * s;
      ctx.fillStyle = f > 0.66 ? "rgba(255,246,205,.4)"
                    : (f > 0.33 ? "rgba(255,168,45,.32)" : "rgba(255,74,18,.26)");
      ell(COWP.x + side, COWP.y - 16 * s + l * 0.3, 9 * s + l * 0.13, l * 0.36);
    }
    ctx.restore();
  }

  /* 速いときに、奥から手前へ流れる線 */
  function zipAmount() {
    return clamp01((wsp - 300) / 1500) * (W8[4] ? 0.55 : 1);
  }
  function drawZips() {
    var k = zipAmount();
    if (k <= 0.01) return;
    var R = Math.max(W, H) * 0.9;
    ctx.save();
    ctx.lineCap = "round";
    for (var i = 0; i < zips.length; i++) {
      var z = zips[i];
      var c = Math.cos(z.a), si = Math.sin(z.a);
      var r0 = z.r, r1 = z.r + z.len * (0.4 + k);
      var fade = clamp01(r0 * 3) * clamp01((1.35 - r0) * 2.5);
      ctx.strokeStyle = "rgba(255,255,255," + (k * 0.42 * fade) + ")";
      ctx.lineWidth = 1.5 + k * 3.5;
      ctx.beginPath();
      ctx.moveTo(VAN.x + c * r0 * R, VAN.y + si * r0 * R * 0.88);
      ctx.lineTo(VAN.x + c * r1 * R, VAN.y + si * r1 * R * 0.88);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBlue() {
    if (beta < 0.2) return;
    var a = Math.pow(clamp01((beta - 0.2) / 0.8), 1.6);
    var g = ctx.createRadialGradient(VAN.x, VAN.y, 10, VAN.x, VAN.y, W * 1.2);
    g.addColorStop(0, "rgba(225,240,255," + (0.85 * a) + ")");
    g.addColorStop(0.3, "rgba(120,170,255," + (0.36 * a) + ")");
    g.addColorStop(1, "rgba(30,20,90,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawWarn() {
    if (!warning || state !== S.PLAY) return;
    var p = 0.5 + 0.5 * Math.sin(T * 13);
    ctx.save();
    ctx.strokeStyle = "rgba(255,46,46," + (0.3 + 0.55 * p) + ")";
    ctx.lineWidth = 28;
    ctx.strokeRect(14, 14, W - 28, H - 28);
    ctx.fillStyle = "rgba(255,255,255," + (0.55 + 0.45 * p) + ")";
    ctx.shadowColor = "rgba(210,0,0,.95)";
    ctx.shadowBlur = 24;
    ctx.font = "800 64px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("警告", W / 2, H * 0.135);
    ctx.restore();
  }

  /* 速さの数字 */
  function drawMeter() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,.75)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = warning ? "#ff6b60" : "#fff";
    var text = fmtSpeed(speed), size = Math.round(46 * (1 + clickPulse * 0.08));
    ctx.font = "800 " + size + "px sans-serif";
    var room = W - 44;
    if (ctx.measureText(text).width > room) {
      size = Math.floor(size * room / ctx.measureText(text).width);
      ctx.font = "800 " + size + "px sans-serif";
    }
    ctx.fillText(text, W / 2, READ_Y);
    ctx.restore();
  }

  function drawBoom() {
    if (bt < 0.45) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(1, bt / 0.3) + ")";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    var k = Math.min(1, (bt - 0.45) / 0.55);
    var v = Math.round(255 * (1 - k));
    ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    ctx.fillRect(0, 0, W, H);
    var a = clamp01(1 - (bt - 0.45) / 1.3);
    for (var i = 0; i < shards.length; i++) {
      var s = shards[i];
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.fillStyle = s.c;
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }
    var r = Math.max(0, 150 * (1 - (bt - 0.45) / 0.95));
    if (r > 0.5) {
      var g = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, r);
      g.addColorStop(0, "rgba(255,255,255," + a + ")");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(W / 2, H * 0.5, r, 0, TAU); ctx.fill();
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    if (state === S.BOOM && bt >= 0.45) { drawBoom(); return; }

    var shake = clamp01(wsp / 2400) * 3 + (warning ? 5 : 0) + clickPulse * 3;
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    drawClouds();
    drawFar();

    if (scene3d) {
      scene3d.sync({
        dist: dist, w: W8, gear: gear, legPhase: legPhase, wsp: wsp, beta: beta,
        props: props, dt: lastDt, clickPulse: clickPulse, lead: lead, t: phaseT(speed), world: WORLD[gear],
        kmh: speed, running: state === S.PLAY,
        groundColor: mixW(GROUND), roadColor: mixW(PAVE), fogColor: mixW(SKY_LO)
      });
      place();                                   /* カメラが動くので測りなおす */
      scene3d.render();
      ctx.drawImage(scene3d.dom, 0, 0, W, H);
    }

    drawFlame();
    drawZips();
    drawBlue();
    if (gearFlash > 0.01) {
      ctx.fillStyle = "rgba(255,255,255," + (gearFlash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    drawWarn();
    if (state !== S.RESULT) drawMeter();

    if (state === S.BOOM) drawBoom();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(4,3,8,.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, broken: broken, W: W, H: H,
               kmh: speed, beta: beta, wsp: wsp, gear: gear, step: GEARS[gear].step,
               phase: PHASE_NAME[gear], props: props.length,
               bits: scene3d ? scene3d.bits.length : 0, solid: !!scene3d,
               boost: Math.round(boost), glide: Math.round(glide),
               warn: warning, read: fmtSpeed(speed) };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(900);
      r.key();
      await r.wait(600);
      while (state === S.PLAY) { r.key(); await r.wait(38); }
      if (!await r.until(function () { return state === S.RESULT; }, 8)) throw Error("宇宙が壊れない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer = null;
  document.addEventListener('pointerdown', function (e) {
    if (!(state === S.INTRO)) return;
    if (e.isPrimary === false || e.button > 0) return;
    startingPointer = e.pointerId;
    e.stopImmediatePropagation();
  }, true);
  document.addEventListener('pointerup', function (e) {
    if (!(state === S.INTRO) || startingPointer !== e.pointerId) return;
    startingPointer = null; e.preventDefault(); e.stopImmediatePropagation(); startButton.click();
  }, true);
  document.addEventListener('pointercancel', function () { startingPointer = null; }, true);

  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
