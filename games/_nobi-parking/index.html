<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ガチロング縦列駐車</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #4b4f55; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="park3d.js"></script>
<script>
/* ガチロング縦列駐車

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============
     世界の長さはメートル。y は下向き。道は x=0〜7、駐車帯は 7〜9.6。
     前の車は y<0、後ろの車は y>G。そのあいだ（0〜G）が空き。 */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var ROAD = 7, CURB = 9.6, PARK_L = 4.5, PARK_X = 7.35, PARK_W = 1.8;
  var CAR_W = 1.8;
  var LEFT = 0, stage, L, prevL, G, phase, phaseT, car, best, rects, crashAt, parkedT, beepT;
  var view = { k: 40, ox: 0, oy: 0 };
  /* 画面下の操作盤：左にハンドル、右にバックとアクセル */
  var PANEL = 230, WMAX = 2.5;
  var wheel = 0, pedal = { acc: false, back: false }, touches = {};
  function panelGeo() {
    var top = H - PANEL, cy = top + PANEL / 2;
    return {
      top: top,
      wheel: { x: 125, y: cy, r: 92 },
      back: { x: 290, y: top + 32, w: 100, h: PANEL - 64 },
      acc: { x: 410, y: top + 32, w: 100, h: PANEL - 64 }
    };
  }
  var keys = { up: false, down: false, left: false, right: false };
  var COLORS = ["#3d7bd9", "#e8e4dc", "#2f3540", "#58a368", "#d9a23d", "#8a5bc4", "#c9ccd1"];
  var parkedColor = ["#3d7bd9", "#e8e4dc"];

  var START_REAR = -0.3;                           /* 出発時の車の後ろ端。前の車の横から始め、車の前側は画面の外（長さがわからない） */
  var LONG = 28.6;                                   /* 最初から超長い車1台だけ。空きにぎりぎり入る長さ */
  function lengthOf(n) { return n === 0 ? PARK_L : LONG; }
  function gapOf(len) { return 29.8; }              /* 空きの長さ（画面の大きさもこれで決まる） */

  var CY;
  function place() {
    CY = Math.round(H * 0.5);
    fitView();
  }

  /* 空きと車が全部入る大きさで見せる */
  function fitView() {
    if (L == null) return;
    var g = gapOf(L);
    /* 上の車と下の車がぎりぎり収まる大きさで固定。長い車ははみ出す */
    var top = -PARK_L - 0.4, bottom = g + PARK_L + 0.4;
    var left = LEFT - 0.5, right = CURB + 0.5;
    var k = Math.min(W / (right - left), (H - PANEL) / (bottom - top));
    view.k = k;
    view.ox = W / 2 - (left + right) / 2 * k;
    view.oy = (H - PANEL) / 2 - (top + bottom) / 2 * k;
  }

  function startStage(n) {
    stage = n;
    prevL = PARK_L;
    L = LONG;
    G = gapOf(L);
    LEFT = -Math.max(0, (L - 6) * 0.45);                             /* 長い車ほど道も広げる */
    parkedColor = ["#3d7bd9", "#f2c230"];                           /* 上は青、後ろは黄色 */
    rects = [
      { x0: -99, x1: LEFT, y0: -999, y1: 999 },                         /* 左の歩道 */
      { x0: CURB, x1: 60, y0: -999, y1: 999 },                       /* 右の歩道 */
      { x0: PARK_X, x1: PARK_X + PARK_W, y0: -PARK_L - 0.1, y1: -0.1, car: 0 },
      { x0: PARK_X, x1: PARK_X + PARK_W, y0: G + 0.1, y1: G + PARK_L + 0.1, car: 1 }
    ];
    car = { x: ROAD - 1.45, y: START_REAR - L / 2, th: 0, v: 0, d: 0, len: L };
    phase = "drive";
    phaseT = 0;
    parkedT = 0;
    beepT = 0;
    crashAt = null;
    releaseAll();
    wheel = 0;
    fitView();
    setup3d();
  }

  /* ぶつかったら出発点からやり直す（時間は進んだまま） */
  function restartCar() {
    car = { x: ROAD - 1.45, y: START_REAR - L / 2, th: 0, v: 0, d: 0, len: L };
    phase = "drive"; phaseT = 0; parkedT = 0; crashAt = null; wheel = 0;
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    best = 0;
    T = 0;
    held = false;
    keys.up = keys.down = keys.left = keys.right = false;
    startStage(0);
  }

  /* ============ 車の形 ============ */
  function dirOf(th) { return { x: Math.sin(th), y: -Math.cos(th) }; }
  function overhang(len) { return Math.min(1.0, len * 0.2); }
  function corners(c, len) {
    var f = dirOf(c.th), s = { x: -f.y, y: f.x }, hl = len / 2, hw = CAR_W / 2;
    return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(function (q) {
      return { x: c.x + f.x * hl * q[0] + s.x * hw * q[1], y: c.y + f.y * hl * q[0] + s.y * hw * q[1] };
    });
  }
  function inRect(p, r) { return p.x > r.x0 && p.x < r.x1 && p.y > r.y0 && p.y < r.y1; }
  function inCar(p, c, len) {
    var f = dirOf(c.th), dx = p.x - c.x, dy = p.y - c.y;
    var a = dx * f.x + dy * f.y, b = dx * -f.y + dy * f.x;
    return Math.abs(a) < len / 2 && Math.abs(b) < CAR_W / 2;
  }
  /* ぶつかった場所を返す（なければ null） */
  function hitPoint(c, len) {
    var cs = corners(c, len), i, j, k;
    for (i = 0; i < 4; i++) {
      var a = cs[i], b = cs[(i + 1) % 4];
      var n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 0.2);
      for (j = 0; j <= n; j++) {
        var p = { x: a.x + (b.x - a.x) * j / n, y: a.y + (b.y - a.y) * j / n };
        for (k = 0; k < rects.length; k++) if (inRect(p, rects[k])) return p;
      }
    }
    for (k = 2; k < rects.length; k++) {
      var r = rects[k];
      var rc = [{ x: r.x0, y: r.y0 }, { x: r.x1, y: r.y0 }, { x: r.x1, y: r.y1 }, { x: r.x0, y: r.y1 }];
      for (j = 0; j < 4; j++) if (inCar(rc[j], c, len)) return rc[j];
    }
    return null;
  }
  function inSlot(c) {
    var cs = corners(c, L);
    for (var i = 0; i < 4; i++) if (cs[i].x < ROAD - 0.4) return false;   /* 線を少しはみ出すくらいは許す */
    var m = ((c.th % Math.PI) + Math.PI) % Math.PI;
    return Math.min(m, Math.PI - m) < 7 * Math.PI / 180;      /* 前向きでも後ろ向きでもよい */
  }

  /* ============ 進行 ============ */
  function control() {
    var thr = 0, st = 0;
    thr = ((pedal.acc || keys.up) ? 1 : 0) - ((pedal.back || keys.down) ? 1 : 0);
    st = wheel / WMAX;
    return { thr: thr, st: st };
  }

  function update(dt) {
    if (state !== S.PLAY) return;
    phaseT += dt;
    if (phase === "drive" || phase === "crash") T += dt;

    if (phase === "grow") {
      var t = Math.min(1, phaseT / 0.8);
      var e = 1 - Math.pow(1 - t, 3);
      car.len = prevL + (L - prevL) * e;
      car.y = START_REAR - car.len / 2;
      if (t >= 1) { car.len = L; phase = "drive"; phaseT = 0; }
      return;
    }
    if (phase === "parked") {
      if (phaseT > 1.1) finish();
      return;
    }
    if (phase === "crash") {
      if (phaseT > 1.0) restartCar();
      return;
    }

    if (keys.left) wheel = Math.max(-WMAX, wheel - 4 * dt);
    if (keys.right) wheel = Math.min(WMAX, wheel + 4 * dt);
    var c = control();
    lastThr = c.thr;
    var vmax = 2.2 + L * 0.1;
    var target = c.thr * vmax;
    var acc = (target === 0 || target * car.v < 0) ? 7 : 4;
    if (car.v < target) car.v = Math.min(target, car.v + acc * dt);
    else car.v = Math.max(target, car.v - acc * dt);
    var dTarget = c.st * 0.6;
    if (car.d < dTarget) car.d = Math.min(dTarget, car.d + 2.4 * dt);
    else car.d = Math.max(dTarget, car.d - 2.4 * dt);

    /* 後ろの車軸を中心に曲がる */
    var a = L / 2 - overhang(L), wb = 2 * a;
    var f = dirOf(car.th);
    var rx = car.x - f.x * a, ry = car.y - f.y * a;
    rx += f.x * car.v * dt; ry += f.y * car.v * dt;
    car.th += car.v / wb * Math.tan(car.d) * dt;
    f = dirOf(car.th);
    var next = { x: rx + f.x * a, y: ry + f.y * a, th: car.th };

    var hp = hitPoint(next, L);
    if (hp) {
      crashAt = hp;
      phase = "crash"; phaseT = 0;
      car.v = 0;
      noiseHit(0.45, 500, 0.5, 0.8);
      tone(110, 0.4, 0.2, "square", 50);
      return;
    }
    car.x = next.x; car.y = next.y;

    if (car.v < -0.2) {
      beepT -= dt;
      if (beepT <= 0) { tone(1400, 0.12, 0.05, "sine"); beepT = 0.55; }
    } else beepT = 0;

    if (Math.abs(car.v) < 0.05 && c.thr === 0 && inSlot(car)) {
      parkedT += dt;
      if (parkedT > 0.4) park();
    } else parkedT = 0;
  }

  function park() {
    phase = "parked"; phaseT = 0;
    score = 1;
    best = T;
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.18, 0.12, "triangle", 0, i * 0.09); });
  }

  /* エンジン音。アクセル・バックを踏んでいる間だけうなる。速いほど高くなる */
  var lastThr = 0, ENG = null;
  function engineSync() {
    if (!AC) return;
    var on = state === S.PLAY && phase === "drive" && lastThr !== 0;
    if (!ENG) {
      if (!on) return;
      var o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
      o.type = "sawtooth"; o2.type = "square";
      f.type = "lowpass"; f.frequency.value = 420; f.Q.value = 2;
      g.gain.value = 0.0001;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination);
      o.start(); o2.start();
      ENG = { o: o, o2: o2, g: g, f: f };
    }
    var n = AC.currentTime, sp = Math.abs(car.v);
    ENG.o.frequency.setTargetAtTime(48 + sp * 16, n, 0.08);
    ENG.o2.frequency.setTargetAtTime(24 + sp * 8, n, 0.08);
    ENG.f.frequency.setTargetAtTime(300 + sp * 120, n, 0.08);
    ENG.g.gain.setTargetAtTime(on ? 0.07 : 0.0001, n, on ? 0.05 : 0.12);
  }

  function finish() {
    state = S.RESULT;
    releaseAll();
  }

  /* ============ 入力 ============
     画面下のハンドルを回して曲がり、右のアクセル・バックを押している間だけ進む。
     ハンドルとペダルは別の指で同時に触れる。キーは矢印（またはWASD）。 */
  function inBox(x, y, b) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
  function releaseAll() { touches = {}; pedal.acc = pedal.back = false; held = false; }
  function syncPedals() {
    pedal.acc = pedal.back = false;
    for (var id in touches) { if (touches[id].kind === "acc") pedal.acc = true; if (touches[id].kind === "back") pedal.back = true; }
  }
  function down(x, y, id) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) return;
    var g = panelGeo(), kind = null;
    if (inBox(x, y, { x: g.acc.x - 10, y: g.acc.y - 20, w: g.acc.w + 30, h: g.acc.h + 40 })) kind = "acc";
    else if (inBox(x, y, { x: g.back.x - 10, y: g.back.y - 20, w: g.back.w + 20, h: g.back.h + 40 })) kind = "back";
    else if (Math.hypot(x - g.wheel.x, y - g.wheel.y) < g.wheel.r + 50) kind = "wheel";
    if (!kind) return;
    touches[id] = { kind: kind, ang: Math.atan2(y - g.wheel.y, x - g.wheel.x) };
    held = true;
    syncPedals();
  }
  function move(x, y, id) {
    var t = touches[id];
    if (state !== S.PLAY || !t) return;
    if (t.kind === "wheel") {
      var g = panelGeo(), ang = Math.atan2(y - g.wheel.y, x - g.wheel.x);
      var d = ang - t.ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      if (Math.hypot(x - g.wheel.x, y - g.wheel.y) > 18) wheel = Math.max(-WMAX, Math.min(WMAX, wheel + d));
      t.ang = ang;
    } else {
      /* 指がペダルから外れたら離したことにする */
      var b = panelGeo()[t.kind];
      if (!inBox(x, y, { x: b.x - 30, y: b.y - 40, w: b.w + 60, h: b.h + 80 })) { delete touches[id]; syncPedals(); }
    }
  }
  function up(id) {
    if (id == null) { releaseAll(); return; }
    delete touches[id];
    syncPedals();
    held = Object.keys(touches).length > 0;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) { up(e.pointerId); });
  window.addEventListener("blur", function () { up(); keys.up = keys.down = keys.left = keys.right = false; });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) return;
    if (n === 1 && phase === "drive") park();                      /* 駐車成功にする */
    if (n === 2 && phase === "drive") { crashAt = { x: car.x, y: car.y }; phase = "crash"; phaseT = 0; noiseHit(0.45, 500, 0.5, 0.8); }

  }

  var KEYMAP = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down",
                 ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var k = KEYMAP[e.key];
    if (!esc && !go && !k) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (k) { keys[k] = true; return; }
    if (e.repeat) return;
    if (state === S.RESULT) down();
  });
  window.addEventListener("keyup", function (e) {
    var k = KEYMAP[e.key];
    if (k) { keys[k] = false; return; }
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function timeText(v) { return (Math.floor(v * 10) / 10).toFixed(1) + "秒"; }
  function lenText(v) { return (Math.round(v * 10) / 10).toFixed(1) + "m"; }
  function doShare() {
    var text = timeText(best) + "で縦列駐車成功";
    window.zResultActions.x({ text: text + " #ガチロング縦列駐車" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function sx(x) { return x * view.k + view.ox; }
  function sy(y) { return y * view.k + view.oy; }

  /* 上から見た車。len が長いほど窓が増える。向きは上が前 */
  function drawCar(cx, cy, th, len, color, steer) {
    var k = view.k, w = CAR_W * k, l = len * k;
    ctx.save();
    ctx.translate(sx(cx), sy(cy));
    ctx.rotate(th);
    /* タイヤ */
    var a = (len / 2 - overhang(len)) * k;
    ctx.fillStyle = "#16181c";
    [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(function (q) {
      ctx.save();
      ctx.translate(q[0] * w * 0.5, -q[1] * a);
      if (q[1] > 0 && steer) ctx.rotate(steer);
      ctx.fillRect(-0.13 * k, -0.33 * k, 0.26 * k, 0.66 * k);
      ctx.restore();
    });
    /* 影と車体 */
    ctx.fillStyle = "rgba(0,0,0,.28)";
    roundRect(-w / 2 + 3, -l / 2 + 4, w, l, 0.35 * k); ctx.fill();
    ctx.fillStyle = color;
    roundRect(-w / 2, -l / 2, w, l, 0.35 * k); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = Math.max(1, k * 0.04); ctx.stroke();
    /* 屋根と窓 */
    var rt = -l / 2 + 1.25 * k, rb = l / 2 - 0.85 * k, rw = w * 0.78;
    ctx.fillStyle = "#1f2a36";
    roundRect(-rw / 2, rt, rw, rb - rt, 0.2 * k); ctx.fill();
    ctx.fillStyle = color;
    var it = rt + 0.45 * k, ib = rb - 0.3 * k, iw = rw - 0.22 * k;
    roundRect(-iw / 2, it, iw, ib - it, 0.15 * k); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    roundRect(-iw / 2, it, iw, ib - it, 0.15 * k); ctx.fill();
    /* 柱（長い車ほど数が増える） */
    var n = Math.max(1, Math.round((ib - it) / (1.3 * k)));
    ctx.fillStyle = color;
    for (var i = 1; i < n; i++) {
      var y = it + (ib - it) * i / n;
      ctx.fillRect(-rw / 2, y - 0.06 * k, rw, 0.12 * k);
    }
    /* ライト */
    ctx.fillStyle = "#fff3b0";
    ctx.fillRect(-w / 2 + 0.12 * k, -l / 2 + 0.02 * k, 0.4 * k, 0.12 * k);
    ctx.fillRect(w / 2 - 0.52 * k, -l / 2 + 0.02 * k, 0.4 * k, 0.12 * k);
    ctx.fillStyle = "#d8263a";
    ctx.fillRect(-w / 2 + 0.12 * k, l / 2 - 0.14 * k, 0.4 * k, 0.12 * k);
    ctx.fillRect(w / 2 - 0.52 * k, l / 2 - 0.14 * k, 0.4 * k, 0.12 * k);
    ctx.restore();
  }

  function drawWorld() {
    var k = view.k;
    var yTop = (0 - view.oy) / k - 2, yBot = (H - view.oy) / k + 2;
    ctx.fillStyle = "#4b4f55";
    ctx.fillRect(0, 0, W, H);
    /* 歩道 */
    ctx.fillStyle = "#bdb6a8";
    ctx.fillRect(0, 0, sx(LEFT), H);
    ctx.fillRect(sx(CURB), 0, W - sx(CURB), H);
    ctx.fillStyle = "#e3ddd0";
    ctx.fillRect(sx(LEFT - 0.25), 0, 0.25 * k, H);
    ctx.fillRect(sx(CURB), 0, 0.25 * k, H);
    /* 歩道の敷石 */
    ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = 1;
    for (var y = Math.floor(yTop); y < yBot; y++) {
      ctx.beginPath(); ctx.moveTo(0, sy(y)); ctx.lineTo(sx(LEFT - 0.25), sy(y)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx(CURB + 0.25), sy(y)); ctx.lineTo(W, sy(y)); ctx.stroke();
    }
    /* 中央の破線 */
    ctx.fillStyle = "#f2efe6";
    for (y = Math.floor(yTop / 3) * 3; y < yBot; y += 3) ctx.fillRect(sx((LEFT + ROAD) / 2 - 0.08), sy(y), 0.16 * k, 1.6 * k);
    /* 駐車帯の線 */
    ctx.fillRect(sx(ROAD - 0.08), 0, 0.16 * k, H);
    /* 空きの枠 */
    var ok = phase === "parked";
    ctx.fillStyle = ok ? "rgba(90,220,120,.35)" : "rgba(255,255,255,.07)";
    ctx.fillRect(sx(ROAD), sy(0), (CURB - ROAD) * k, G * k);
    ctx.fillStyle = "#f2efe6";
    ctx.fillRect(sx(ROAD), sy(-0.05), (CURB - ROAD) * k, 0.12 * k);
    ctx.fillRect(sx(ROAD), sy(G - 0.07), (CURB - ROAD) * k, 0.12 * k);
    /* 止まっている車 */
    for (var i = 2; i < rects.length; i++) {
      var r = rects[i];
      drawCar((r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2, 0, PARK_L, parkedColor[r.car], 0);
    }
  }

  /* 立体の場面。three.js が使えないときは上から見た絵のまま */
  var scene3d = null;
  try { if (window.THREE && window.ParkScene) scene3d = new window.ParkScene(); } catch (e) { scene3d = null; }
  function setup3d() {
    if (!scene3d) return;
    try {
      scene3d.setup({
        LEFT: LEFT, ROAD: ROAD, CURB: CURB, G: G, L: L, carW: CAR_W, parkL: PARK_L, color: "#e2483c",
        parked: rects.slice(2).map(function (r) { return { x: (r.x0 + r.x1) / 2, y: (r.y0 + r.y1) / 2, len: PARK_L, color: parkedColor[r.car] }; })
      });
    } catch (e) { scene3d = null; }
  }
  function toScreen(x, y) {
    if (scene3d) return scene3d.toScreen(x, y, W, H - PANEL);
    return { x: sx(x), y: sy(y) };
  }

  function draw() {
    engineSync();
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (phase === "crash" && phaseT < 0.35) ctx.translate((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14);
    var drawn3d = false;
    if (scene3d) {
      try { scene3d.render(ctx, W, H - PANEL, { car: car, parked: phase === "parked" }); drawn3d = true; }
      catch (e) { scene3d = null; }
    }
    if (!drawn3d) {
      drawWorld();
      drawCar(car.x, car.y, car.th, car.len, "#e2483c", car.d);
    }
    if (crashAt) {
      var rr = 16 + phaseT * 40, cp = toScreen(crashAt.x, crashAt.y);
      ctx.fillStyle = "rgba(255,210,60,.85)";
      ctx.beginPath();
      for (var i = 0; i < 16; i++) {
        var ang = i / 16 * Math.PI * 2, rad = i % 2 ? rr * 0.45 : rr;
        ctx.lineTo(cp.x + Math.cos(ang) * rad, cp.y + Math.sin(ang) * rad);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    if (state === S.PLAY) {
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 6;
      ctx.font = "800 44px sans-serif";
      ctx.textAlign = "center";
      /* 経過秒数は画面に出さない（結果だけ） */
      ctx.restore();
    }
    drawPanel();

    if (state === S.RESULT) drawResult();
  }

  /* 操作盤 */
  function drawPedal(b, on, dir) {
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2 + (on ? 4 : 0));
    ctx.fillStyle = "rgba(0,0,0,.45)";
    roundRect(-b.w / 2 + 3, -b.h / 2 + 6, b.w, b.h, 18); ctx.fill();
    ctx.fillStyle = on ? "#7c8591" : "#4a525d";
    roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 18); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 4;
    for (var i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(-b.w / 2 + 18, i * 26); ctx.lineTo(b.w / 2 - 18, i * 26); ctx.stroke();
    }
    ctx.fillStyle = on ? "#fff" : "#e6e9ee";
    ctx.beginPath();
    ctx.moveTo(0, -30 * dir); ctx.lineTo(28, 14 * dir); ctx.lineTo(-28, 14 * dir); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function drawPanel() {
    var g = panelGeo();
    ctx.fillStyle = "#23272d";
    ctx.fillRect(0, g.top, W, PANEL);
    ctx.fillStyle = "#3a4048";
    ctx.fillRect(0, g.top, W, 4);
    /* ハンドル */
    var w = g.wheel;
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(wheel);
    ctx.lineWidth = 22; ctx.strokeStyle = "#5b6470";
    ctx.beginPath(); ctx.arc(0, 0, w.r - 11, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 14; ctx.strokeStyle = "#4a525c";
    [Math.PI / 2, Math.PI / 2 + Math.PI * 2 / 3, Math.PI / 2 - Math.PI * 2 / 3].forEach(function (a) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * (w.r - 14), Math.sin(a) * (w.r - 14)); ctx.stroke();
    });
    ctx.fillStyle = "#2b3038";
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e2483c";
    ctx.fillRect(-5, -w.r, 10, 22);
    ctx.restore();
    drawPedal(g.back, pedal.back || keys.down, -1);
    drawPedal(g.acc, pedal.acc || keys.up, 1);
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(timeText(best), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { threeD: !!scene3d, state: state, phase: phase, stage: stage, score: score, best: best, L: L, G: G, car: { x: car.x, y: car.y, th: car.th, v: car.v, d: car.d }, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  function loop(now) {
    /* 端末の速さで難しさが変わらないように、描画が遅れてもゲームの時間は実際の時間どおり進める。
       1回の update は 1/60 秒までに刻む。タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
