<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>迷色</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1b2230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 迷色（めいしょく）

   画像迷路と同じ作りと操作の迷路。通ったマスに色が塗られる。
   入口から出口への正しい道は、きれいなグラデーションの色。寄り道したマスは、にごった色。
   出口までの秒数が結果。色の組み合わせは毎回ひとつ選ぶ。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 色 ============
     正しい道の色は、入口から出口まで、いくつかの色をなめらかにつないだグラデーション */
  var PALETTES = [
    { ja: "夕焼け", en: "Sunset", c: ["#ffd56b", "#ff9a5c", "#ff5f7e", "#b34fd1", "#4b3fae"] },
    { ja: "海", en: "Ocean", c: ["#b8fff0", "#7fe3d6", "#2fb5d6", "#2a6fd1", "#2b3a8f"] },
    { ja: "春", en: "Spring", c: ["#ffe98a", "#ffc1d0", "#ff8fbf", "#c58cf5", "#7fb8ff"] },
    { ja: "森", en: "Forest", c: ["#e8f78a", "#b9f27c", "#5fd38d", "#2a9d8f", "#1f5f6b"] },
    { ja: "虹", en: "Rainbow", c: ["#ff6b6b", "#ffb86b", "#ffe66b", "#7be08a", "#6bc8ff", "#a98cff"] },
    { ja: "真夜中", en: "Midnight", c: ["#a8e6ff", "#8fa8ff", "#7a5cff", "#b34fd1", "#ff6fae"] }
  ];
  /* 寄り道したマスのにごった色 */
  var MUD = ["#7d7461", "#6f6a55", "#8a7a62", "#5f6458", "#857563", "#6d5f57"];
  var pal, palNo = -1;
  function pickPalette() {
    palNo = palNo < 0 ? Math.floor(Math.random() * PALETTES.length)
      : (palNo + 1 + Math.floor(Math.random() * (PALETTES.length - 1))) % PALETTES.length;   /* 前と同じ色は続けない */
    pal = PALETTES[palNo];
  }
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  /* 道の i マス目の色 */
  function colorAt(i) {
    var cs = pal.c, f = path.length > 1 ? i / (path.length - 1) : 0, x = f * (cs.length - 1), k = Math.min(cs.length - 2, Math.floor(x)), t = x - k;
    var a = hex(cs[k]), b = hex(cs[k + 1]);
    return "rgb(" + [0, 1, 2].map(function (j) { return Math.round(a[j] + (b[j] - a[j]) * t); }).join(",") + ")";
  }
  /* 音は進むほど高くなる5音の音階（ド・レ・ミ・ソ・ラ）。3オクターブで出口に着く */
  var PENTA = [0, 2, 4, 7, 9], NOTES = 15;
  function hzOfStep(n) { return 261.63 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12); }

  /* ============ 迷路 ============
     N×N の部屋。壁も1マスとして数えるので、マス目は G = 2N+1 */
  var N = 21, G = 2 * N + 1, B = 12, BOARD = G * B;
  var strength = new Float32Array(G * G);   /* 掘る順のばらつき */
  var open = new Uint8Array(G * G);         /* 1 = 通路 */
  var carveOrder = [];                      /* 掘った順（作る演出用） */
  var openAt = new Float32Array(G * G);     /* 演出で通路になる時刻 0〜1 */
  var mazeLayer = null;
  var path = [], onPath = new Int32Array(G * G);   /* 入口から出口への道と、マスごとの道の何番目か（-1 = 道でない） */
  var painted = new Uint8Array(G * G), paintList = [];

  function makeCanvas(w, h) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }

  /* 線の弱いところから順に掘る（Prim の最小全域木）。線のあるところに壁が残る */
  function buildMaze() {
    for (var j = 0; j < G * G; j++) strength[j] = Math.random();
    open.fill(0);
    carveOrder = [];
    var heap = [];
    function push(w, a, b) {
      heap.push([w, a, b]);
      var i = heap.length - 1;
      while (i > 0) { var p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; var t = heap[p]; heap[p] = heap[i]; heap[i] = t; i = p; }
    }
    function pop() {
      var top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        var i = 0;
        for (;;) {
          var l = i * 2 + 1, r = l + 1, m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          var t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m;
        }
      }
      return top;
    }
    var seen = new Uint8Array(N * N);
    function visit(c) {
      seen[c] = 1;
      var cx = c % N, cy = (c / N) | 0, bx = cx * 2 + 1, by = cy * 2 + 1;
      open[by * G + bx] = 1;
      carveOrder.push(by * G + bx);
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (dv) {
        var nx = cx + dv[0], ny = cy + dv[1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N || seen[ny * N + nx]) return;
        var wall = (by + dv[1]) * G + bx + dv[0];
                push(strength[wall] + Math.random() * 0.06, wall, ny * N + nx);
      });
    }
    visit(0);
    while (heap.length) {
      var e = pop();
      if (seen[e[2]]) continue;
      open[e[1]] = 1;
      carveOrder.push(e[1]);
      visit(e[2]);
    }
    /* 入口は左上、出口は右下 */
    open[0 * G + 1] = 1;
    open[(G - 1) * G + G - 2] = 1;
    carveOrder.unshift(1);
    carveOrder.push((G - 1) * G + G - 2);
    openAt.fill(2);
    for (var i = 0; i < carveOrder.length; i++) openAt[carveOrder[i]] = i / carveOrder.length;
    /* 入口から出口への道 */
    var from = new Int32Array(G * G).fill(-1), q = [1], s0 = 1, e0 = (G - 1) * G + G - 2;
    from[s0] = s0;
    for (var h = 0; h < q.length; h++) {
      var c = q[h], cx = c % G, cy = (c / G) | 0;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
        var X = cx + d[0], Y = cy + d[1];
        if (X < 0 || Y < 0 || X >= G || Y >= G) return;
        var m = Y * G + X;
        if (!open[m] || from[m] >= 0) return;
        from[m] = c; q.push(m);
      });
    }
    path = [];
    for (var k = e0; k !== s0; k = from[k]) path.unshift(k);
    path.unshift(s0);
    onPath.fill(-1);
    path.forEach(function (c2, n) { onPath[c2] = n; });
    renderMaze(1);
  }

  /* 迷路の絵。通路は白っぽい紙の色、壁は濃い色。塗ったマスはその色 */
  var PAPER = "#f4efe6", INK = "#2b2b36";
  function renderMaze(t) {
    mazeLayer = mazeLayer || makeCanvas(BOARD * 2, BOARD * 2);
    var mc = mazeLayer.getContext && mazeLayer.getContext("2d");
    if (!mc) return;
    mc.setTransform(2, 0, 0, 2, 0, 0);
    mc.fillStyle = INK;
    mc.fillRect(0, 0, BOARD, BOARD);
    mc.fillStyle = PAPER;
    for (var y = 0; y < G; y++) for (var x = 0; x < G; x++) {
      var i = y * G + x;
      if (open[i] && openAt[i] <= t) mc.fillRect(x * B, y * B, B, B);
    }
    paintList.forEach(function (p) { mc.fillStyle = p.col; mc.fillRect(p.x * B, p.y * B, B, B); });
  }
  /* マスを塗る。塗りの絵にも、すぐ描き足す */
  function paintCell(i) {
    if (painted[i] || !open[i]) return;
    painted[i] = 1;
    var k = onPath[i], col = k >= 0 ? colorAt(k) : MUD[Math.floor(Math.random() * MUD.length)];
    var p = { x: i % G, y: (i / G) | 0, col: col, t: 0, bad: k < 0 };
    paintList.push(p);
    flashes.push(p);
    if (k < 0) {
      misses++;
      if (time - lastKnock > 0.25) { lastKnock = time; knock(); }
    } else {
      best = Math.max(best, k);
      var n = Math.floor(k * NOTES / Math.max(1, path.length - 1));
      if (n > lastNote) { lastNote = n; tone(hzOfStep(n), 0.5, 0.12, "triangle"); }
      playerColor = col;
    }
    var mc = mazeLayer && mazeLayer.getContext && mazeLayer.getContext("2d");
    if (mc) { mc.setTransform(2, 0, 0, 2, 0, 0); mc.fillStyle = col; mc.fillRect(p.x * B, p.y * B, B, B); }
  }
  function knock() {
    tone(180, 0.12, 0.12, "sine", 120);
    tone(372, 0.05, 0.05, "sine");
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", BUILD: "build", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var state, T, held = false, keyMode = false, time = 0, lastBuild = -1;
  var player = { x: 0, y: 0 };
  var misses = 0, best = 0, lastNote = -1, lastKnock = -9, flashes = [], playerColor = "#fff";
  var keys = { l: 0, r: 0, u: 0, d: 0 };
  var BX = 0, BY = 0;                         /* 迷路の左上 */
  var R_PLAYER = 3.5, BUILD_TIME = 2.2;

  function place() {
    BX = Math.round((W - BOARD) / 2);
    BY = Math.round(Math.max(110, (H - BOARD) / 2 - 20));
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.BUILD;
    T = 0;
    time = 0;
    held = false;
    lastBuild = -1;
    keys = { l: 0, r: 0, u: 0, d: 0 };
    player.x = 1.5 * B; player.y = 0.5 * B;
    misses = 0; best = 0; lastNote = -1; lastKnock = -9; flashes = [];
    painted.fill(0); paintList = [];
    pickPalette();
    playerColor = "#fff";
    buildMaze();
    renderMaze(0);
  }

  function wallAt(bx, by) {
    if (bx < 0 || by < 0 || bx >= G || by >= G) return true;
    return !open[by * G + bx];
  }
  function hits(x, y) {
    var r = R_PLAYER;
    var x0 = Math.floor((x - r) / B), x1 = Math.floor((x + r - 0.001) / B);
    var y0 = Math.floor((y - r) / B), y1 = Math.floor((y + r - 0.001) / B);
    for (var by = y0; by <= y1; by++) for (var bx = x0; bx <= x1; bx++) if (wallAt(bx, by)) return true;
    return false;
  }
  /* 角で引っかからないよう、ぶつかったら通路の真ん中へ寄せる */
  function moveAxis(dx, dy) {
    if (!hits(player.x + dx, player.y + dy)) { player.x += dx; player.y += dy; return; }
    var amt = Math.abs(dx + dy);
    if (dx) {
      var cy = (Math.floor(player.y / B) + 0.5) * B, ahead = Math.floor((player.x + Math.sign(dx) * (R_PLAYER + 1)) / B);
      if (!wallAt(ahead, Math.floor(player.y / B)) && Math.abs(cy - player.y) > 0.01) {
        var ny = player.y + Math.sign(cy - player.y) * Math.min(amt, Math.abs(cy - player.y));
        if (!hits(player.x, ny)) player.y = ny;
      }
    } else {
      var cx = (Math.floor(player.x / B) + 0.5) * B, below = Math.floor((player.y + Math.sign(dy) * (R_PLAYER + 1)) / B);
      if (!wallAt(Math.floor(player.x / B), below) && Math.abs(cx - player.x) > 0.01) {
        var nx = player.x + Math.sign(cx - player.x) * Math.min(amt, Math.abs(cx - player.x));
        if (!hits(nx, player.y)) player.x = nx;
      }
    }
  }
  function moveBy(dx, dy) {
    if (state !== S.PLAY) return;
    var n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 2));
    for (var i = 0; i < n; i++) {
      moveAxis(dx / n, 0); moveAxis(0, dy / n);
      paintCell(Math.floor(player.y / B) * G + Math.floor(player.x / B));
    }
    if (player.y > (G - 1) * B + B * 0.3) goal();
  }
  /* ゴールしたら、正しい道を入口から出口へ光が流れ、音階が駆け上がる */
  var SWEEP_AT = 0.4, SWEEP = 1.4, sweptNote = -1;
  function goal() {
    state = S.GOAL;
    T = 0;
    sweptNote = -1;
    path.forEach(function (c) { paintCell(c); });   /* 塗り残しの道も塗る（ほぼ無いはず） */
  }
  function sweepPos() { return Math.max(0, Math.min(1, (T - SWEEP_AT) / SWEEP)); }

  /* ============ 進行 ============ */
  function update(dt) {
    flashes.forEach(function (f) { f.t += dt; });
    flashes = flashes.filter(function (f) { return f.t < 0.4; });
    if (state === S.BUILD) {
      T += dt;
      if (T >= BUILD_TIME) { state = S.PLAY; T = 0; renderMaze(1); tone(880, 0.1, 0.1, "square"); }
      return;
    }
    if (state === S.GOAL) {
      T += dt;
      var n = Math.floor(sweepPos() * NOTES);
      if (T >= SWEEP_AT && n > sweptNote && n <= NOTES) { sweptNote = n; tone(hzOfStep(Math.min(n, NOTES - 1)), 0.5, 0.1, "triangle"); }
      if (T >= SWEEP_AT + SWEEP && sweptNote < NOTES + 1) {
        sweptNote = NOTES + 1;
        [261.63, 329.63, 392.0, 523.25].forEach(function (f, j) { tone(f, 1.6, 0.08, "triangle", null, j * 0.03); });
      }
      if (T > SWEEP_AT + SWEEP + 1.0) { state = S.RESULT; shareButton.hidden = false; }
      return;
    }
    if (state !== S.PLAY) return;
    time += dt;
    var sp = 200 * dt;
    if (keys.l || keys.r || keys.u || keys.d) moveBy((keys.r - keys.l) * sp, (keys.d - keys.u) * sp);
  }

  /* ============ 入力 ============
     指をすべらせた分だけ玉が動く（指で迷路が隠れないよう、どこをなぞってもよい） */
  var lastP = null;
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") {
        newRound();
      }
      return;
    }
    held = true;
    lastP = x == null ? null : { x: x, y: y };
  }
  function move(x, y) {
    if (!held || !lastP) return;
    var dx = x - lastP.x, dy = y - lastP.y;
    lastP = { x: x, y: y };
    moveBy(dx * 1.1, dy * 1.1);
  }
  function up() { held = false; lastP = null; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); keys = { l: 0, r: 0, u: 0, d: 0 }; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1 && state !== S.INTRO) newRound();                                          /* 次の迷路 */
    if (n === 2 && state === S.PLAY) {                                                    /* ゴール目前へ */
      player.x = (G - 1.5) * B; player.y = (G - 1.5) * B;
      if (hits(player.x, player.y)) { player.x = (G - 2 + 0.5) * B; player.y = (G - 2 + 0.5) * B; }
    }
    if (n === 3 && state === S.PLAY) { time += 3; goal(); }                                /* クリア */
  }

  var KEYMAP = { ArrowLeft: "l", a: "l", A: "l", ArrowRight: "r", d: "r", D: "r", ArrowUp: "u", w: "u", W: "u", ArrowDown: "d", s: "d", S: "d" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var dir = KEYMAP[e.key];
    if (!esc && !go && !dir) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (dir) { keys[dir] = 1; return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    var dir = KEYMAP[e.key];
    if (dir) { keys[dir] = 0; return; }
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function secText() { return (Math.floor(time * 10) / 10).toFixed(1); }
  function doShare() {
    /* 英語のときのハッシュタグは英語のゲーム名にする */
    var sec = secText();
    var ja = "迷路を「" + pal.ja + "」色に" + sec + "秒で塗りきった" + (misses ? "（にごり" + misses + "マス）" : "（にごりなし）");
    var en = "Painted a maze in \"" + pal.en + "\" colors in " + sec + "s" + (misses ? " (" + misses + " muddy cells)" : " (no muddy cells)");
    window.zResultActions.x({ text: zT(ja, en) + zT(" #迷色", " #ColorMaze") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#1b2230";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(BX, BY);
    if (state === S.BUILD) {
      /* 通路が掘られていく */
      var k = Math.max(0, Math.min(1, T / (BUILD_TIME - 0.4)));
      var step = Math.floor(k * 30);
      if (step !== lastBuild) { lastBuild = step; renderMaze(step / 30); if (step > 0 && step < 30) tone(300 + step * 22, 0.04, 0.04, "square"); }
    }
    if (mazeLayer) ctx.drawImage(mazeLayer, 0, 0, BOARD, BOARD);
    if (state !== S.INTRO && state !== S.BUILD) {
      /* 塗ったばかりのマスが光る */
      flashes.forEach(function (f) {
        var a = 1 - f.t / 0.4;
        ctx.fillStyle = (f.bad ? "rgba(60,40,20," : "rgba(255,255,255,") + (0.6 * a).toFixed(3) + ")";
        ctx.fillRect(f.x * B, f.y * B, B, B);
      });
      /* ゴール後：正しい道を入口から出口へ光が流れる */
      if (state === S.GOAL || state === S.RESULT) {
        var sp = sweepPos(), w = 0.08;
        for (var i = 0; i < path.length; i++) {
          var d = sp * (1 + w) - i / path.length;
          if (d < 0 || d > w) continue;
          ctx.fillStyle = "rgba(255,255,255," + (0.8 * (1 - d / w)).toFixed(3) + ")";
          ctx.fillRect((path[i] % G) * B, ((path[i] / G) | 0) * B, B, B);
        }
      }
      /* 出口 */
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.strokeRect((G - 2) * B + 1, (G - 1) * B + 1, B - 2, B - 2);
      /* 玉。今いる道の色に染まる */
      ctx.beginPath();
      ctx.arc(player.x, player.y, R_PLAYER + 1.5, 0, Math.PI * 2);
      ctx.fillStyle = playerColor; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    }
    ctx.restore();

    /* 経過時間 */
    if (state === S.PLAY || state === S.GOAL) {
      ctx.fillStyle = "#fff";
      ctx.font = "800 44px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(secText(), W / 2, BY - 30);
    }
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, time: time, player: { x: player.x, y: player.y }, W: W, H: H, palette: pal && pal.ja, misses: misses, best: best, pathLen: path.length }; },
    path: function () { return path.slice(); },
    maze: function () { return { G: G, B: B, open: Array.prototype.slice.call(open), strength: Array.prototype.slice.call(strength) }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    move: function (dx, dy) { moveBy(dx, dy); },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(4000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO;
  startButton.hidden = false;
  shareButton.hidden = true;
  pickPalette();
  buildMaze();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
