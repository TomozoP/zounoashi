<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>あだ名ルーレット</title>
<script src="../guard.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../celebrate.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* あだ名ルーレット

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ あだ名の材料 ============
     よくあるあだ名を集めて、音（ちゃ・きゅ などは1つ）に分け、
     「最初」「まんなか」「最後から2つ目」「最後」の位置ごとに出てくる回数を数える。
     リールの絵柄はこの回数の割合で並ぶので、よく使われる音ほどよく止まる。 */
  var NAMES = ("たっくん まっちゃん ゆうちゃん あっちゃん けんちゃん しゅんちゃん よっしー まーくん ゆっきー なっちゃん " +
    "みっちゃん さっちゃん りょうちゃん ともちゃん こうちゃん かっちゃん のりちゃん ひろくん ゆうくん しょうくん " +
    "たかちゃん もっちー ぐっさん はっしー ふじもん なべちゃん やまちゃん まっつん いっちー あやっぺ " +
    "みーたん ゆきりん まゆゆ あっくん こばっち たまちゃん なおっち かなっぺ まりりん えりりん " +
    "みほりん ちーちゃん なーちゃん ゆいゆい あーちゃん さとちゃん じゅんじゅん ぽんちゃん きよぴー かずぴー " +
    "こーちゃん やっさん よっちゃん ぴーちゃん まさやん てっちゃん ひでちゃん まこっちゃん ぶっちゃん のんちゃん " +
    "ゆっこ まーちゃん けいちゃん よしりん あきぴょん もえっち はるるん ゆずぽん たけぽん しんちゃん " +
    "がっきー まさぴょん ゆうゆう ひーくん みっきー まりっぺ ななちゃん あいぽん かおりん なっつん " +
    "きよっち ともっち あゆみん みなみん かよちん まっきー つっきー りっちゃん さきちゃん ゆかりん " +
    "まなてぃー しげちゃん ひさし かっつん やすくん おっくん だいちゃん じゅんぺー てつぼー まっすー " +
    "たっちゃん ゆみちゃん めぐちゃん あやちゃん みかちゃん くみちゃん ひとみん なつみん まいまい あみたん " +
    "しーちゃん とっきー こっしー まっこ ちゃこ きっちゃん いとちゃん そうちゃん ゆーすけ けんけん " +
    "りゅうちゃん しょーたん はやぴー こたろー ちゅんちゃん しんしん ぺーやん べっきー うっちー おかぴー " +
    "わっきー かとちゃん すーさん にっしー まるちゃん みよっぺ のっち あっこ りえぴょん ゆりっぺ " +
    "なかやん むっちゃん さくらん よーへー かんちゃん ばーちゃん だっちゃん ぴょんきち ごっちゃん ふーちゃん").split(" ");
  var SMALL = "ゃゅょぁぃぅぇぉゎ";
  function morae(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (SMALL.indexOf(c) >= 0 && out.length) out[out.length - 1] += c;
      else out.push(c);
    }
    return out;
  }
  var DIST = { first: {}, mid: {}, pen: {}, last: {} }, LENS = {};
  NAMES.forEach(function (n) {
    var m = morae(n), L = m.length;
    var k = Math.max(3, Math.min(6, L));
    LENS[k] = (LENS[k] || 0) + 1;
    m.forEach(function (u, i) {
      var slot = slotOf(i, L);
      DIST[slot][u] = (DIST[slot][u] || 0) + 1;
    });
  });
  function slotOf(i, L) {
    if (i === 0) return "first";
    if (i === L - 1) return "last";
    if (i === L - 2) return "pen";
    return "mid";
  }
  /* 割合のまま並べた箱。重み付きで1つ引く */
  function bag(d) {
    var keys = Object.keys(d), sum = 0;
    keys.forEach(function (k) { sum += d[k]; });
    return { keys: keys, d: d, sum: sum };
  }
  var BAGS = { first: bag(DIST.first), mid: bag(DIST.mid), pen: bag(DIST.pen), last: bag(DIST.last) };
  /* 文字数は 3〜6 を同じ割合で（集めたあだ名はほぼ4音なので、そのままだと毎回4になる） */
  var LENBAG = bag({ 3: 1, 4: 1, 5: 1, 6: 1 });
  function draw1(b, ok) {
    for (var tries = 0; tries < 40; tries++) {
      var r = Math.random() * b.sum;
      for (var i = 0; i < b.keys.length; i++) {
        r -= b.d[b.keys[i]];
        if (r < 0) break;
      }
      var k = b.keys[Math.min(i, b.keys.length - 1)];
      if (!ok || ok(k)) return k;
    }
    return b.keys[0];
  }
  /* 前の音のあとに来られない音（読めなくなるものだけ外す） */
  function okAfter(prev) {
    if (!prev) return null;
    return function (u) {
      if (prev === "っ") return "っんーあいうえお".indexOf(u) < 0;
      if (prev === "ん") return "っんー".indexOf(u) < 0;
      if (prev === "ー") return "ーっ".indexOf(u) < 0;
      return true;
    };
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var phase, lenReel, reels, nick, resultT, confetti = null;
  var STRIP = 36;                               /* 1本のリールに並ぶ絵柄の数 */
  var SPIN = 13;                                /* 1秒に流れる絵柄の数 */

  var CY;
  function place() {
    CY = Math.round(H * 0.5);
  }

  function makeReel(fill, phaseOff) {
    var r = { items: [], pos: Math.random() * STRIP, speed: SPIN * (0.9 + Math.random() * 0.25), stop: null, done: false, fill: fill, value: null };
    for (var i = 0; i < STRIP; i++) r.items.push(fill());
    return r;
  }
  /* 見えていないところの絵柄だけ、前の音に合わせて並べ直す */
  function refill(r) {
    var c = Math.floor(r.pos);
    for (var i = 0; i < STRIP; i++) {
      var d = ((i - c) % STRIP + STRIP) % STRIP;
      if (d <= 2 || d >= STRIP - 2) continue;
      r.items[i] = r.fill();
    }
  }
  function startMorae(L) {
    reels = [];
    for (var i = 0; i < L; i++) (function (i) {
      var slot = slotOf(i, L), r;
      r = makeReel(function () { return draw1(BAGS[slot], okAfter(i > 0 ? reels[i - 1].value : null)); });
      reels.push(r);
    })(i);
    phase = "morae";
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    nick = "";
    resultT = 0;
    reels = [];
    lenReel = makeReel(function () { return draw1(LENBAG); });
    phase = "len";
  }

  /* ============ 進行 ============ */
  function stepReel(r, dt) {
    if (r.done) return;
    var before = Math.floor(r.pos);
    if (r.stop) {
      r.stop.t += dt;
      var k = Math.min(1, r.stop.t / r.stop.dur);
      var e = 1 - Math.pow(1 - k, 3);
      r.pos = r.stop.from + (r.stop.to - r.stop.from) * e;
      if (k >= 1) {
        r.done = true;
        r.pos = r.stop.to;
        r.value = r.items[((Math.round(r.pos) % STRIP) + STRIP) % STRIP];
        r.bump = 0.25;
        tone(330, 0.12, 0.16, "triangle");
        noiseHit(0.06, 1800, 0.12, 2);
      }
    } else {
      r.pos += r.speed * dt;
    }
    if (Math.floor(r.pos) !== before && !r.done && r === activeReel()) tone(1400, 0.02, 0.025, "square");
  }
  function activeReel() {
    if (phase === "len") return lenReel;
    for (var i = 0; i < reels.length; i++) if (!reels[i].done && !reels[i].stop) return reels[i];
    return null;
  }
  function stopReel(r) {
    if (!r || r.stop || r.done) return;
    var to = Math.ceil(r.pos + 0.6);           /* すこし滑ってから、次の絵柄でぴたっと止まる */
    var i = reels.indexOf(r), ok = i > 0 ? okAfter(reels[i - 1].value) : null;
    var at = function (n) { return ((n % STRIP) + STRIP) % STRIP; };
    for (var k = 0; k < 4 && ok && !ok(r.items[at(to)]); k++) to++;   /* 読めない並びは1つ先へ */
    if (ok && !ok(r.items[at(to)])) r.items[at(to)] = r.fill();
    r.value = r.items[at(to)];
    r.stop = { from: r.pos, to: to, t: 0, dur: 0.32 + (to - Math.ceil(r.pos + 0.6)) * 0.08 };
    if (reels[i + 1]) refill(reels[i + 1]);
  }
  function update(dt) {
    if (state === S.RESULT) {
      resultT += dt;
      if (confetti) confetti.step(dt, W, H);
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;
    if (phase === "len") {
      stepReel(lenReel, dt);
      if (lenReel.bump) lenReel.bump = Math.max(0, lenReel.bump - dt);
      if (lenReel.done) {
        lenReel.wait = (lenReel.wait || 0) + dt;
        if (lenReel.wait > 0.55) startMorae(Number(lenReel.value));
      }
      return;
    }
    if (phase === "morae") {
      var all = true;
      for (var i = 0; i < reels.length; i++) {
        var r = reels[i], wasDone = r.done;
        stepReel(r, dt);
        if (r.bump) r.bump = Math.max(0, r.bump - dt);
        if (r.done && !wasDone && reels[i + 1]) refill(reels[i + 1]);
        if (!r.done) all = false;
      }
      if (all) {
        phase = "wait";
        T = 0;
        nick = reels.map(function (r) { return r.value; }).join("");
      }
      return;
    }
    if (phase === "wait") {
      if (T > 0.6) finish();
    }
  }
  function finish() {
    state = S.RESULT;
    resultT = 0;
    score = nick;
    if (AC && window.zCelebrate) window.zCelebrate.play(AC, "chime");
    if (window.zCelebrate) { confetti = window.zCelebrate.confetti(); confetti.burst(W, H, 120); }
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      if (resultT < 0.5) return;
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    held = true;
    stopReel(activeReel());
  }
  function move(x, y) {}
  function up() { held = false; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1=文字数のリール 2=文字のリール（3〜6をランダム） 3〜6=その文字数でリール 0=結果の直前（次のタップで最後のリールが止まる） */
    if (n === 1) { newRound(); return; }
    if (n === 2 || (n >= 3 && n <= 6) || n === 0) {
      newRound();
      startMorae(n >= 3 && n <= 6 ? n : 3 + Math.floor(Math.random() * 4));
      if (n === 0) {
        for (var i = 0; i < reels.length - 1; i++) {
          var r = reels[i];
          r.pos = Math.round(r.pos); r.done = true;
          r.value = r.items[((r.pos % STRIP) + STRIP) % STRIP];
          refill(reels[i + 1]);
        }
      }
    }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    window.zResultActions.x({ text: "あだ名は「" + nick + "」になりました #あだ名ルーレット" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var REEL_COLORS = ["#ff6b8b", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#b197fc"];
  var ITEM = 120;                               /* 絵柄1つの高さ */
  function drawReel(r, x, y, w, color, big) {
    var h = ITEM * 2.2;
    ctx.save();
    /* 枠 */
    roundRect(x - 6, y - h / 2 - 6, w + 12, h + 12, 22);
    ctx.fillStyle = color;
    ctx.fill();
    roundRect(x, y - h / 2, w, h, 16);
    ctx.fillStyle = "#fffdf7";
    ctx.fill();
    ctx.clip();
    var c = Math.floor(r.pos), frac = r.pos - c;
    var bump = r.bump ? Math.sin(r.bump / 0.25 * Math.PI) * 6 : 0;
    for (var k = -2; k <= 2; k++) {
      var idx = (((c + k) % STRIP) + STRIP) % STRIP;
      var s = r.items[idx];
      var iy = y + (k - frac) * ITEM + bump;
      var size = big ? 96 : (s.length >= 2 ? Math.min(54, w * 0.42) : Math.min(76, w * 0.8));
      ctx.font = "900 " + size + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#2b2233";
      ctx.fillText(s, x + w / 2, iy);
    }
    /* 上下をぼかして、真ん中の1つを目立たせる */
    var g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    g.addColorStop(0, "rgba(255,253,247,.95)");
    g.addColorStop(0.3, "rgba(255,253,247,0)");
    g.addColorStop(0.7, "rgba(255,253,247,0)");
    g.addColorStop(1, "rgba(255,253,247,.95)");
    ctx.fillStyle = g;
    ctx.fillRect(x, y - h / 2, w, h);
    ctx.restore();
    /* 当たり線 */
    ctx.save();
    ctx.strokeStyle = r.done ? color : "rgba(43,34,51,.25)";
    ctx.lineWidth = r.done ? 5 : 3;
    roundRect(x + 3, y - ITEM / 2, w - 6, ITEM, 12);
    ctx.stroke();
    ctx.restore();
  }

  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#fff0f5");
    g.addColorStop(1, "#ffe3c4");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    /* 水玉 */
    ctx.fillStyle = "rgba(255,140,170,.13)";
    for (var yy = 0; yy < H + 60; yy += 60) {
      for (var xx = (yy / 60 % 2) * 30; xx < W + 60; xx += 60) {
        ctx.beginPath(); ctx.arc(xx, yy, 9, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT && resultT > 0.5);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT && resultT > 0.5);
    ctx.clearRect(0, 0, W, H);
    drawBg();

    if (state === S.INTRO || phase === "len") {
      drawReel(lenReel, W / 2 - 80, CY, 160, "#ff6b8b", true);
      ctx.fillStyle = "#2b2233";
      ctx.font = "800 34px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("文字", W / 2, CY + ITEM * 1.1 + 44);
    } else {
      var L = reels.length, gap = 8;
      var w = Math.min(120, (W - 30 - gap * (L - 1)) / L);
      var total = w * L + gap * (L - 1);
      var y = state === S.RESULT ? H * 0.3 : CY;
      for (var i = 0; i < L; i++) drawReel(reels[i], (W - total) / 2 + i * (w + gap), y, w, REEL_COLORS[i % REEL_COLORS.length], false);
    }
    if (state === S.PLAY && Math.floor(T * 2) % 2 === 0 && activeReel()) {
      ctx.fillStyle = "rgba(43,34,51,.55)";
      ctx.font = "700 26px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("タップでストップ", W / 2, H * 0.84);
    }

    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.66);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    var k = Math.min(1, resultT / 0.35);
    var s = 0.6 + 0.4 * (1 - Math.pow(1 - k, 3)) + Math.sin(Math.min(1, resultT / 0.5) * Math.PI) * 0.08;
    ctx.save();
    ctx.translate(W / 2, H * 0.5);
    ctx.scale(s, s);
    var size = 112;
    ctx.font = "900 " + size + "px sans-serif";
    while (ctx.measureText(nick).width > W - 50 && size > 40) { size -= 4; ctx.font = "900 " + size + "px sans-serif"; }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 14;
    ctx.strokeStyle = "#fff";
    ctx.strokeText(nick, 0, 0);
    ctx.fillStyle = "#e8436b";
    ctx.fillText(nick, 0, 0);
    ctx.restore();
    if (confetti) confetti.draw(ctx);
    if (resultT > 0.5) {
      window.zResultActions.drawButtons(ctx, resultButtons());
      window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
    }
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, phase: phase, nick: nick, len: reels.length, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    tap: function () { down(); up(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      for (var i = 0; i < 8 && state !== S.RESULT; i++) { r.key(); await r.wait(900); }
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("結果が出ない");
      await r.wait(2000);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
