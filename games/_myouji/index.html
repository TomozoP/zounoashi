<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>名字の水族館</title>
<script src="../guard.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="names.js"></script>
<script src="scene3d.js"></script>
<script>
/* 名字の水族館

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  /* ============ BGM（自作のアンビエント） ============
     ゆっくり移り変わる和音の霧と、ときどき鳴る鉄琴のような音、泡の音。 */
  var BGM = null;
  var CHORDS = [[50, 57, 62, 66, 69], [47, 54, 59, 62, 66], [43, 50, 55, 59, 64], [45, 52, 57, 61, 64]];
  var BELL = [74, 76, 78, 81, 83, 86, 88, 90];
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function startBGM() {
    if (!AC || BGM) return;
    var out = AC.createGain(); out.gain.value = 0.0001;
    out.gain.setTargetAtTime(0.22, AC.currentTime, 1.5);
    out.connect(AC.destination);
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1100; lp.connect(out);
    /* 響き：短い遅れを重ねる */
    var dl = AC.createDelay(1.5); dl.delayTime.value = 0.42;
    var fb = AC.createGain(); fb.gain.value = 0.45;
    var wet = AC.createGain(); wet.gain.value = 0.5;
    dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(out);
    BGM = { out: out, pad: lp, bell: dl, next: AC.currentTime + 0.1, bellAt: AC.currentTime + 2, bubAt: AC.currentTime + 4, i: 0 };
  }
  function padNote(f, t0, dur) {
    for (var k = 0; k < 2; k++) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = k ? "sine" : "triangle";
      o.frequency.value = f; o.detune.value = k ? 7 : -7;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.05, t0 + dur * 0.35);
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(BGM.pad);
      o.start(t0); o.stop(t0 + dur + 0.1);
    }
  }
  function bellNote(f, t0, vol) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
    o.connect(g); g.connect(BGM.out); g.connect(BGM.bell);
    o.start(t0); o.stop(t0 + 2.5);
  }
  function bubble(t0) {
    var o = AC.createOscillator(), g = AC.createGain(), f = 300 + Math.random() * 300;
    o.type = "sine";
    o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * 2.6, t0 + 0.08);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.04, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
    o.connect(g); g.connect(BGM.out);
    o.start(t0); o.stop(t0 + 0.12);
  }
  /* 先の分だけ少しずつ予約する（毎コマ呼ぶ） */
  function tickBGM() {
    if (!AC || !BGM || AC.state !== "running") return;
    var now = AC.currentTime;
    if (BGM.next < now) BGM.next = now + 0.05;
    while (BGM.next < now + 1) {
      var ch = CHORDS[BGM.i % CHORDS.length];
      ch.forEach(function (m) { padNote(mtof(m), BGM.next, 10); });
      BGM.next += 8; BGM.i++;
    }
    if (BGM.bellAt < now + 0.5) {
      var ch2 = CHORDS[(BGM.i + CHORDS.length - 1) % CHORDS.length];
      var pool = BELL.filter(function (m) { return ch2.some(function (c) { return (m - c) % 12 === 0; }); });
      var n = 1 + Math.floor(Math.random() * 3);
      for (var i = 0; i < n; i++) bellNote(mtof(pool[Math.floor(Math.random() * pool.length)]), Math.max(now, BGM.bellAt) + i * 0.32, 0.035);
      BGM.bellAt = Math.max(now, BGM.bellAt) + 1.8 + Math.random() * 3.5;
    }
    if (BGM.bubAt < now + 0.2) {
      var m2 = 1 + Math.floor(Math.random() * 4);
      for (var j = 0; j < m2; j++) bubble(Math.max(now, BGM.bubAt) + j * (0.06 + Math.random() * 0.1));
      BGM.bubAt = Math.max(now, BGM.bubAt) + 3 + Math.random() * 6;
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  /* 並び（scene3d.js）。読めないときは空の通路 */
  var L = window.MYOUJI_LAYOUT ? window.MYOUJI_LAYOUT() : { list: [], tanks: [], hall: 2, room: 5.2, end: -10, exitZ: -13, giantZ: -17 };
  var TOTAL = L.list.length;
  var cam, found, foundN, card, drag, glide, keys = {}, hintT, resultT;

  var CY;
  function place() {
    CY = Math.round(H * 0.5);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    cam = { x: 0, z: 1.2, yaw: 0, pitch: 0.04 };
    found = {}; foundN = 0;
    card = null; drag = null; glide = null; hintT = 0; resultT = 0;
  }

  /* ============ 進行 ============ */
  var WALK = 5.5, TURN = 1.8;
  function update(dt) {
    tickBGM();
    T += dt;                                   /* 魚は開始前も泳がせる */
    if (state === S.RESULT) { resultT += dt; return; }
    if (state !== S.PLAY) return;
    hintT += dt;
    if (card) { card.t += dt; if (card.t > 3) card = null; }
    var fwd = 0, turn = 0;
    if (keys.up) fwd += 1;
    if (keys.down) fwd -= 1;
    if (keys.left) turn += 1;
    if (keys.right) turn -= 1;
    cam.yaw += turn * TURN * dt;
    if (fwd) {
      glide = null;
      cam.x += -Math.sin(cam.yaw) * fwd * WALK * dt;
      cam.z += -Math.cos(cam.yaw) * fwd * WALK * dt;
    }
    /* タップした場所へ、すっと移動する（グーグルマップのストリートビューの形） */
    if (glide) {
      glide.t += dt;
      var k = Math.min(1, glide.t / glide.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      cam.x = glide.x0 + (glide.x1 - glide.x0) * e;
      cam.z = glide.z0 + (glide.z1 - glide.z0) * e;
      if (k >= 1) glide = null;
    }
    clampPos(cam);
    /* 出口に入ったら結果 */
    if (cam.x > L.room - 0.75 && Math.abs(cam.z - L.exitZ) < 0.75) finish();
  }
  /* 通路は狭く、大水槽の部屋は広い */
  function clampPos(p) {
    var half = p.z < L.end - 0.3 ? L.room : L.hall;
    p.x = Math.max(-half + 0.6, Math.min(half - 0.6, p.x));
    if (Math.abs(p.x) > L.hall - 0.6 && p.z > L.end - 0.6) p.z = Math.max(p.z, L.end + 0.6);
    p.z = Math.max(L.giantZ + 0.7, Math.min(1.6, p.z));
  }
  /* 画面の (x, y) の方へ移動する。床を指したらその場所、壁や水槽を指したらその方向へ少し */
  function goToward(x, y) {
    var s3 = scene3d();
    if (!s3) return false;
    var r = s3.ray(x, y, W, H);
    var hl = Math.hypot(r.x, r.z);
    if (hl < 0.05) return false;
    var dist = r.y < -0.02 ? Math.min(18, 1.55 / -r.y * hl) : 8;
    var p = { x: cam.x + r.x / hl * dist, z: cam.z + r.z / hl * dist };
    /* 間の壁を越えないよう、細かく区切って進めるところまで */
    var q = { x: cam.x, z: cam.z }, n = Math.ceil(dist / 0.2);
    for (var i = 1; i <= n; i++) {
      var t = { x: cam.x + (p.x - cam.x) * i / n, z: cam.z + (p.z - cam.z) * i / n };
      var c = { x: t.x, z: t.z }; clampPos(c);
      if (Math.hypot(c.x - t.x, c.z - t.z) > 0.01) { q = c; break; }
      q = t;
    }
    var d = Math.hypot(q.x - cam.x, q.z - cam.z);
    if (d < 0.2) return false;
    glide = { x0: cam.x, z0: cam.z, x1: q.x, z1: q.z, t: 0, dur: 0.45 + d * 0.09 };
    noiseHit(0.25, 500, 0.05, 0.7);
    return true;
  }
  function finish() {
    state = S.RESULT;
    resultT = 0;
    score = 0;
    drag = null; keys = {};
    tone(523, 0.18, 0.12, "triangle"); tone(784, 0.3, 0.12, "triangle", null, 0.14);
  }

  /* ============ 入力 ============
     上下にドラッグで歩く（指を置いた所から上へずらすほど前へ）、左右で向きを変える。
     ほとんど動かさずに離したらタップ＝名字を見る。 */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    startBGM();
    if (state === S.RESULT) {
      if (resultT < 0.5) return;
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    held = true;
    if (x == null) return;
    drag = { x0: x, y0: y, x: x, y: y, px: x, py: y, t0: T, moved: false };
  }
  function move(x, y) {
    if (state !== S.PLAY || !drag) return;
    if (Math.hypot(x - drag.x0, y - drag.y0) > 12) drag.moved = true;
    /* 指につかんだ景色がついてくる向きに回す */
    cam.yaw += (x - drag.px) * 0.0055;
    cam.pitch = Math.max(-0.55, Math.min(0.55, cam.pitch + (y - drag.py) * 0.0045));
    drag.px = x; drag.py = y; drag.x = x; drag.y = y;
  }
  function up() {
    held = false;
    if (state === S.PLAY && drag && !drag.moved && T - drag.t0 < 0.5) tapAt(drag.x0, drag.y0);
    drag = null;
  }
  function tapAt(x, y) {
    var s3 = scene3d();
    if (!s3) return;
    /* 床を指したら移動。上のほう（水槽）を指したら、名字があればよみ、なければその方へ移動 */
    var r = s3.ray(x, y, W, H);
    var o = r.y < -0.02 && 1.55 / -r.y < 20 ? null : s3.pick(x, y, W, H);
    if (!o) { goToward(x, y); return; }
    card = { o: o, t: 0 };
    tone(660, 0.09, 0.12, "sine", 990);
    tone(1200, 0.06, 0.05, "sine", 1700, 0.06);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { drag = null; held = false; });
  window.addEventListener("blur", function () { drag = null; held = false; keys = {}; });

  /* 本番以外だけ、数字キーで場所を飛ばせる */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1=入口 2=通路のまんなか 3=大水槽の前 4=出口の手前（前へ進むと結果） */
    if (n < 1 || n > 4) return;
    if (state !== S.PLAY) newRound();
    if (n === 1) { cam.x = 0; cam.z = 1.2; cam.yaw = 0; }
    if (n === 2) { cam.x = 0; cam.z = L.end / 2; cam.yaw = 0; }
    if (n === 3) { cam.x = 0; cam.z = L.end - 0.5; cam.yaw = 0; }
    if (n >= 1) glide = null;
    if (n === 4) { cam.x = L.room - 1.1; cam.z = L.exitZ; cam.yaw = -Math.PI / 2; }
  }

  var KEYMAP = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    if (KEYMAP[e.key]) { e.preventDefault(); keyMode = true; if (state === S.PLAY) keys[KEYMAP[e.key]] = true; return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    if (state === S.RESULT) down();
    else if (state === S.PLAY) tapAt(W / 2, H / 2);   /* 画面のまんなかの名字を見る */
  });
  window.addEventListener("keyup", function (e) {
    if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = false; return; }
    if ((e.code === "Space" || e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    window.zResultActions.x({ text: "#名字の水族館" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    var showBtn = state === S.RESULT && resultT > 0.5;
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, showBtn);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, showBtn);
    ctx.clearRect(0, 0, W, H);

    var s3 = scene3d(), drew = false;
    if (s3) { try { s3.sync({ t: T || 0, cam: cam, glide: glide }); drew = s3.draw(ctx, W, H); } catch (e) { scene3d.drop(); } }
    if (!drew) { ctx.fillStyle = "#04101e"; ctx.fillRect(0, 0, W, H); }

    if (state === S.PLAY) {
      if (hintT < 6 && !card) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, (6 - hintT) / 0.8);
        ctx.font = "700 22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(4,16,30,.6)";
        roundRect(W / 2 - 220, H - 120, 440, 76, 18); ctx.fill();
        ctx.fillStyle = "#e8f6ff";
        ctx.fillText("ドラッグで見回す・床をタップでそこへ進む", W / 2, H - 96);
        ctx.fillText("名字をタップすると、よみが出ます", W / 2, H - 66);
        ctx.restore();
      }
      if (card) drawCard();
    }
    if (state === S.RESULT) drawResult();
  }

  function drawCard() {
    var k = Math.min(1, card.t / 0.18), out = Math.max(0, (card.t - 2.6) / 0.4);
    ctx.save();
    ctx.globalAlpha = 1 - out;
    var y = H - 200 + (1 - k) * 30;
    roundRect(40, y, W - 80, 150, 24);
    ctx.fillStyle = "rgba(255,255,255,.94)"; ctx.fill();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#2a6f97"; ctx.font = "700 26px sans-serif";
    ctx.fillText(card.o.f.yomi, W / 2, y + 38);
    var size = 64;
    ctx.font = "900 " + size + "px sans-serif";
    while (ctx.measureText(card.o.f.name).width > W - 140 && size > 30) { size -= 4; ctx.font = "900 " + size + "px sans-serif"; }
    ctx.fillStyle = "#10243a";
    ctx.fillText(card.o.f.name, W / 2, y + 96);
    ctx.restore();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(4,10,20,.72)";
    ctx.fillRect(0, 0, W, H);
    if (resultT > 0.5) {
      window.zResultActions.drawButtons(ctx, resultButtons());
      window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
    }
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, found: foundN, total: TOTAL, tanks: L.tanks.length, cam: cam, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { hintT = 99; card = null; },
    tap: function (x, y) { tapAt(x, y); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      keys.up = true; await r.wait(4000); keys.up = false;
      tapAt(W / 2, H / 2); await r.wait(2000);
      debugKey(4); keys.up = true;
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("出口に着かない");
      keys = {};
      await r.wait(2000);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();startBGM();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
