<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QR召喚士</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden], #photo-button[hidden], #save-button[hidden] { display:none; }
  #save-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #photo-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <button id="save-button" type="button" aria-label="画像を保存" hidden></button>
  <button id="photo-button" type="button" aria-label="画像を選ぶ" hidden></button>
  <input id="photo-input" type="file" accept="image/*" hidden>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../celebrate.js"></script>
<script src="jsQR.js"></script>   <!-- QRの読み取り（Apache-2.0） -->
<script src="sim.js"></script>
<script>
/* QR召喚士
   魔法陣を描く → 形から勇者の名前とステータスが決まる → 冒険を見守る（上で冒険、下にログ）。
   冒険の中身は sim.js が召喚のときに最後まで計算し、ここでは1行ずつ高速に再生する。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var saveButton = document.getElementById("save-button");
  var pageSaver = null;
  if (window.claude && window.claude.use) window.claude.use("downloads").then(function (d) { pageSaver = d; }, function () {});
  window.zResultActions.bind(saveButton, function () {
    if (!run) return;
    var cv = makeCard(4), d = new Date();
    function p2(n) { return (n < 10 ? "0" : "") + n; }
    var name = zT("QR召喚士", "QRSummoner", "QR소환사", "QR召唤师", "QR召喚師") + "_" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + ".png";
    if (pageSaver) { cv.toBlob(function (b) { if (b) pageSaver.save({ filename: name, data: b }).catch(function () {}); }, "image/png"); return; }
    window.zResultActions.saveImage({ canvas: cv, name: name });
  });
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);
  var LANG = window.zLangFull || "ja";

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    setupPix();
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  /* 音の並び [周波数, 遅れ(秒), 長さ(秒)]。節はすべて自作 */
  function seq(list, type, vol) {
    list.forEach(function (n) { tone(n[0], n[2], vol, type, 0, n[1]); });
  }
  function sweep(dur, f0, f1, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(), g = AC.createGain(), n = AC.currentTime;
    f.type = "bandpass"; f.Q.value = q || 2;
    f.frequency.setValueAtTime(f0, n); f.frequency.exponentialRampToValueAtTime(f1, n + dur);
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(vol, n + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  /* 地域に入ったときの短い合図（地域ごとに音色と和音を変える） */
  var AREA_SND = [
    [[[523, 0, 0.1], [659, 0.08, 0.1], [784, 0.16, 0.22]], "triangle"],
    [[[440, 0, 0.12], [523, 0.1, 0.12], [659, 0.2, 0.26]], "sine"],
    [[[294, 0, 0.14], [349, 0.12, 0.14], [440, 0.24, 0.3]], "triangle"],
    [[[1319, 0, 0.08], [988, 0.07, 0.08], [1568, 0.14, 0.3]], "sine"],
    [[[196, 0, 0.14], [233, 0.12, 0.14], [294, 0.24, 0.3]], "sawtooth"],
    [[[247, 0, 0.18], [294, 0.16, 0.18], [349, 0.32, 0.4]], "square"]
  ];
  function sfx(k) {
    switch (k) {
      case "atk": noiseHit(0.06, 1800, 0.07, 2); tone(220, 0.05, 0.03, "square", 110); break;
      case "crit": noiseHit(0.1, 2400, 0.1, 2); tone(880, 0.08, 0.04, "square", 440); tone(1760, 0.1, 0.03, "square", 0, 0.05); break;
      case "spell": tone(500, 0.12, 0.04, "triangle", 1400); sweep(0.15, 800, 3000, 0.04); break;
      case "heal": tone(660, 0.08, 0.04, "sine", 990); tone(990, 0.1, 0.03, "sine", 0, 0.06); tone(1320, 0.12, 0.02, "sine", 0, 0.12); break;
      case "hit": noiseHit(0.07, 700, 0.08, 1.5); tone(160, 0.06, 0.04, "square", 90); break;
      case "dodge": sweep(0.12, 3000, 900, 0.05, 1.5); break;
      case "miss": sweep(0.1, 1500, 600, 0.03, 1); break;
      case "kill": tone(440, 0.07, 0.04, "square", 880); noiseHit(0.08, 3200, 0.04, 3); break;
      case "won": seq([[659, 0, 0.06], [988, 0.06, 0.1]], "square", 0.03); break;
      case "lv": seq([[784, 0, 0.06], [988, 0.06, 0.06], [1319, 0.12, 0.14]], "square", 0.04); break;
      case "fall": tone(300, 0.25, 0.06, "triangle", 90); break;
      case "boss": tone(110, 0.5, 0.08, "sawtooth", 70); noiseHit(0.5, 150, 0.08, 0.7); break;
      case "gate": tone(82, 0.9, 0.08, "sawtooth", 55); noiseHit(0.8, 120, 0.1, 0.6); break;
      case "maou": seq([[147, 0, 0.3], [139, 0.25, 0.3], [131, 0.5, 0.5]], "sawtooth", 0.05); break;
      case "chest": seq([[1046, 0, 0.06], [1568, 0.05, 0.12]], "square", 0.04); break;
      case "buy": case "steal": seq([[1568, 0, 0.05], [2093, 0.05, 0.12]], "square", 0.035); break;
      case "town": seq([[523, 0, 0.12], [659, 0.1, 0.12], [587, 0.2, 0.12], [784, 0.3, 0.24]], "triangle", 0.04); break;
      case "inn": seq([[392, 0, 0.18], [523, 0.16, 0.18], [659, 0.32, 0.4]], "sine", 0.05); break;
      case "revive": seq([[523, 0, 0.1], [784, 0.08, 0.2]], "sine", 0.04); break;
      case "spring": seq([[880, 0, 0.06], [1175, 0.07, 0.06], [988, 0.14, 0.06], [1319, 0.21, 0.12]], "sine", 0.04); break;
      case "trap": noiseHit(0.15, 400, 0.08, 1); tone(140, 0.15, 0.05, "square", 80); break;
      case "yawn": tone(300, 0.3, 0.04, "sine", 200); break;
      case "fire": tone(200, 0.25, 0.05, "sawtooth", 600); break;
      case "flee": seq([[700, 0, 0.04], [600, 0.05, 0.04], [500, 0.1, 0.04], [400, 0.15, 0.04]], "square", 0.03); break;
      case "summon": sweep(0.4, 600, 4000, 0.05); break;
      case "enter": break;
      case "curse": tone(180, 0.3, 0.05, "sawtooth", 120); break;
      case "gear": seq([[988, 0, 0.06], [1319, 0.05, 0.14]], "triangle", 0.04); break;
    }
  }
  /* 負けたときの自作の短い下がり節 */
  function sadPhrase() { seq([[523, 0, 0.22], [466, 0.22, 0.22], [392, 0.44, 0.22], [311, 0.66, 0.6]], "triangle", 0.06); }

  /* ============ ドット絵 ============ */
  var SPR = {
    hero: ["...hhhh...", "..hhhhhh..", "..hhsskh..", "..hsssss..", "...ssss..w", "..aaaaa..w", ".saaaaaasw", ".s.aaaa..y", "...aaaa...", "...a..a...", "...b..b...", "..bb..bb.."],
    warrior: ["...mmmm...", "..mmmmmm..", "..mssskm..", "..msssss..", "...ssss.xx", ".mmaaaamxx", ".saaaaaas.", ".s.aaaa...", "...aaaa...", "...a..a...", "...m..m...", "..mm..mm.."],
    mage: ["....pp....", "...pppp..o", "..pppppp.t", ".ppppppppt", "...sssk..t", "...ssss..t", "..rrrrr..t", ".srrrrrrst", "..rrrrr..t", "..rrrrr...", ".rrrrrrr..", "..b...b..."],
    priest: ["...cccc...", "..ccyycc..", "..csssk...", "..ssssss..", "...ssss...", "..ccccc...", ".scccccs..", "..ccycc...", "..ccycc...", "..ccccc...", ".ccccccc..", "..b...b..."],
    thief: ["...gggg...", "..gggggg..", "..ggsskg..", "..gsssss..", "...ssss...", "..gaaaa...", ".saaaaaasd", ".s.aaaa...", "...aaaa...", "...a..a...", "...b..b...", "..bb..bb.."],
    tomb: ["..........", "..........", "..........", "..........", "....qq....", "..qqqqqq..", "....qq....", "....qq....", "....qq....", "...qqqq...", "..qqqqqq..", ".QQQQQQQQ."],
    slime: ["............", "............", "............", "............", ".....cc.....", "....cccc....", "...cwcccc...", "..cwccccccc.", "..ckcckcccc.", ".cccccccccc.", ".cccddddccc.", "..dddddddd.."],
    bat: ["............", "c..........c", "cc...cc...cc", "ccc.cccc.ccc", "cccccccccccc", "ccc.ckkc.ccc", "cc..cccc..cc", "c....ww....c", "............", "............", "............", "............"],
    beast: ["............", "............", "............", "..c.........", ".ccc........", "ckcccccccc..", "cccccccccccc", "wcccccccccc.", ".cddcccccdc.", ".dc.d..d.cd.", ".d..d..d..d.", ".d..d..d..d."],
    ghost: ["............", "....cccc....", "...cccccc...", "..cckcckcc..", "..cccccccc..", "..cccwwccc..", "..cccccccc..", "..cccccccc..", "..cccccccc..", "..c.cc.cc.c.", "............", "............"],
    skel: ["....cccc....", "...ckcckc...", "...cccccc...", "....cdcd....", "..s..cc.....", "..s.cccc....", "..scc..cc...", "..y.cccc....", ".....cc.....", "....c..c....", "....c..c....", "...cc..cc..."],
    golem: ["....cccc....", "...ckcckc...", "...cccccc...", ".cccccccccc.", "cccdccccdccc", "ccc.cccc.ccc", "cc..cdcc..cc", "....cccc....", "...cc..cc...", "...cc..cc...", "..ccc..ccc..", "..ddd..ddd.."],
    dragon: ["............", "..cc......l.", ".ckcc....ll.", "ccccc...lll.", "wwcc...llll.", "..cc..clll..", "..cccccccc..", ".cccdddccccc", ".ccdddddcc.c", "..ccccccc..c", "..c.c..c.c..", ".cc.cc.cc.cc"],
    maou: ["..y......y..", "..yy....yy..", "...yccccy...", "...crkkrc...", "...cccccc...", "..pppccppp..", ".ppppccpppp.", "pppcccccccpp", "pp.cccccc.pp", "p..cccccc..p", "...cc..cc...", "..ccc..ccc.."]
  };
  var HAIR = ["#f4d03f", "#8b4a1a", "#2a2a33", "#e04848", "#4a80e0", "#e8e8f0", "#3ac06a", "#ff8ac8"];
  var ARMOR = ["#3a6ad8", "#c83a3a", "#3aa04a", "#8a4ad8", "#d8a03a", "#2ab0b0", "#e8e8f0", "#3a3a48"];
  var SKIN = ["#f2c8a0", "#e0a878", "#b87850", "#8a5434"];
  /* 勇者の頭（髪型）5種と体。武器は右手（列9）に重ねる */
  var HEADS = [
    ["...hhhh...", "..hhhhhh..", "..hhsskh..", "..hsssss..", "...ssss..."],
    ["..h.h.h...", ".hhhhhhh..", "..hhsskh..", "..hsssss..", "...ssss..."],
    ["...hhhh...", "..hhhhhh..", ".hhhsskh..", ".hhsssss..", ".hh.ssss.."],
    ["...mmmm...", "..mmmmmm..", "..mmsskm..", "..msssss..", "...ssss..."],
    ["..........", "..hhhhhh..", "..aaaaaa..", "..hsssks..", "...ssss..."]
  ];
  var BODY = ["..aaaaa...", ".saaaaaas.", ".s.aaaa...", "...aaaa...", "...a..a...", "...b..b...", "..bb..bb.."];
  var WEAPON = [
    [[9, 3, "w"], [9, 4, "w"], [9, 5, "w"], [9, 6, "w"], [9, 7, "y"]],
    [[8, 3, "x"], [9, 3, "x"], [8, 4, "x"], [9, 4, "t"], [9, 5, "t"], [9, 6, "t"], [9, 7, "t"]],
    [[9, 2, "o"], [9, 3, "t"], [9, 4, "t"], [9, 5, "t"], [9, 6, "t"], [9, 7, "t"], [9, 8, "t"], [9, 9, "t"]],
    [[9, 0, "w"], [9, 1, "w"], [9, 2, "t"], [9, 3, "t"], [9, 4, "t"], [9, 5, "t"], [9, 6, "t"], [9, 7, "t"], [9, 8, "t"]]
  ];
  /* 職業ごとの頭と体（剣士は髪型つきの基本形）。a は主の色、d は濃い布、W は白、r は赤 */
  var JOB_SPR = {
    jester: [["r......a..", "rr....aa..", ".rrryaaa..", "..sssk....", "..ssss...."],
      ["..rarar...", ".sararars.", ".s.rara...", "...arar...", "...r..a...", "...b..b...", "..bb..bb.."]],
    villager: [["...yyyy...", ".yyyyyyyy.", "..hsssk...", "..hsssss..", "...ssss..."],
      ["..aaaaa...", ".saaaaaas.", ".s.aaaa...", "...tttt...", "...t..t...", "...b..b...", "..bb..bb.."]],
    thief: [["...dddd...", "..dddddd..", "..ddsskd..", "..dddddd..", "...dddd..."],
      ["..ddddd...", ".sdddddds.", ".s.yaaa...", "...dddd...", "...d..d...", "...d..d...", "..bb..bb.."]],
    fighter: [["...hhhh...", "..hhhhhh..", "..aaaaaa..", "..hsssks..", "...ssss..."],
      ["..WWWWW...", "ssWWWWWWs.", "...kkkk...", "...WWWW...", "...W..W...", "...s..s...", "..ss..ss.."]],
    mage: [[".....aa...", "....aaa...", "...aaaa...", ".aaaaaaaa.", "..hsssk..."],
      ["..aaaaa...", ".saaaaaas.", "..aaaaa...", "..aaaaa...", ".aaaaaaa..", ".aaaaaaa..", "..b...b..."]],
    priest: [["...WWWW...", "..WWyWWW..", "..Wsssk...", "..Wsssss..", "...ssss..."],
      ["..WaWWW...", ".sWaWWWWs.", "..WaWyW...", "..WaWyW...", "..WWWWW...", ".WWWWWWW..", "..b...b..."]],
    knight: [["....aa....", "...mmmm...", "..mmmmmm..", "..mmkkkm..", "...mmmm..."],
      ["..maaam...", "aamaaaams.", "aya.aaa...", "aaamaam...", ".a.m..m...", "...m..m...", "..mm..mm.."]],
    sage: [["...hhhh...", "..yyyyyy..", ".hhhsskh..", ".hhsssss..", ".hh.ssss.."],
      ["..ayyya...", ".saaaaaas.", "..aayaa...", "..aayaa...", ".aaayaaa..", ".aaaaaaa..", "..b...b..."]],
    legend: [["..y.y.y...", "..yyyyyy..", "..hhsskh..", "..hsssss..", "...ssss..."],
      ["..yaaay...", ".saaaaaas.", ".s.ayya...", "...aaaa...", "...y..y...", "...m..m...", "..mm..mm.."]]
  };
  function heroRows(L) {
    var J = JOB_SPR[L.job];
    var rows = (J ? J[0].concat(J[1]) : HEADS[L.style].concat(BODY)).map(function (r) { return r.split(""); });
    if (L.cape >= 0 && L.job !== "knight") for (var y = 5; y < 10; y++) { if (rows[y][1] === ".") rows[y][1] = "c"; if (rows[y][2] === ".") rows[y][2] = "c"; }
    (WEAPON[L.weapon] || []).forEach(function (p) { rows[p[1]][p[0]] = p[2]; });
    return rows.map(function (r) { return r.join(""); });
  }
  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function f(v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); }
    return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
  }
  var sprCache = {};
  function sprite(name, color, look) {
    var obj = name === "hero" && look && typeof look === "object";
    var key = name + color + (obj ? JSON.stringify(look) : look);
    if (sprCache[key]) return sprCache[key];
    var rows = obj ? heroRows(look) : SPR[name], c = document.createElement("canvas");
    c.width = rows[0].length; c.height = rows.length;
    var g = c.getContext("2d");
    var pal = {
      k: "#141018", s: "#f2c8a0", w: name === "dragon" ? shade(color, 0.5) : "#f4f4f4", y: "#f0d050", b: "#5a3a22",
      h: HAIR[look % 6], a: ARMOR[(look * 5 + 1) % 6], m: "#b8bcc8", x: "#c8ccd8", p: "#3a4ab8", r: "#4a5ad0", o: "#ffe060",
      t: "#8a5a2a", c: name === "priest" ? "#f4f0e8" : color, g: "#3a8a4a", d: name === "thief" ? "#d8dce8" : shade(color || "#888888", -0.35),
      q: "#9a9aa8", Q: "#5a5a68", l: shade(color || "#888888", 0.35)
    };
    if (name === "maou") { pal.c = "#6a4a9a"; pal.p = "#7a1020"; pal.r = "#ff3030"; pal.y = "#e8e0c8"; }
    if (name === "slime" || name === "ghost") pal.w = "#ffffff";
    if (obj) {
      pal.h = HAIR[look.hair]; pal.a = ARMOR[look.armor]; pal.s = SKIN[look.skin]; pal.c = look.cape >= 0 ? shade(ARMOR[look.cape], -0.25) : "";
      pal.d = "#2c2a3a"; pal.W = "#f4f2ea"; pal.r = "#e04848";
      if (look.job === "jester" && look.armor === 1) pal.a = "#f0d040";
      if (look.job === "legend") { pal.a = "#3a6ad8"; pal.c = "#c02a2a"; pal.w = "#fffbe0"; }
    }
    for (var y = 0; y < rows.length; y++) for (var x = 0; x < rows[y].length; x++) {
      var ch = rows[y][x];
      if (ch === ".") continue;
      g.fillStyle = pal[ch] || "#f0f";
      g.fillRect(x, y, 1, 1);
    }
    sprCache[key] = c;
    return c;

    var ax = 18, ay = 52, aw = CARD_W - 36, ah = 220, area = Math.min(5, run.area), bg = BG[area], gy = ay + ah - 96;
    g.save();
    rr(ax, ay, aw, ah, 6); g.clip();
    for (var band = 0; band < 6; band++) { g.fillStyle = mixHex(bg[0], bg[1], band / 5); g.fillRect(ax, ay + Math.floor((gy - ay) * band / 6), aw, Math.ceil((gy - ay) / 6) + 1); }
    g.fillStyle = bg[2];
    for (var x = 0; x < aw; x += 4) { var hh = 14 + Math.round(Math.sin(x * 0.05 + area) * 8 + Math.sin(x * 0.13) * 4); g.fillRect(ax + x, gy - hh, 4, hh); }
    g.fillStyle = bg[3]; g.fillRect(ax, gy, aw, ay + ah - gy);
    g.fillStyle = bg[4]; g.fillRect(ax, gy, aw, 4);
    /* 床の魔法陣（読んだQRの模様をそのまま、奥行きをつけて） */
    var cx = CARD_W / 2, cy = gy + 34, R = 120;
    function P(X, Y) { var d = 1 - 0.38 * Y; return [cx + X * R / d * 0.82, cy + Y * R * 0.3 / d]; }
    g.strokeStyle = "rgba(" + fx[3] + ",.9)"; g.lineWidth = 3;
    g.beginPath();
    for (var t = 0; t <= 64; t++) { var pt = P(Math.cos(t / 64 * Math.PI * 2), Math.sin(t / 64 * Math.PI * 2)); if (t) g.lineTo(pt[0], pt[1]); else g.moveTo(pt[0], pt[1]); }
    g.stroke();
    if (qr && qr.mat) {
      var N = qr.N, h0 = 0.66, m = h0 * 2 / N, gap = m * 0.14;
      g.fillStyle = "rgba(" + fx[3] + ",.8)";
      for (var j = 0; j < N; j++) for (var k = 0; k < N; k++) if (qr.mat[j * N + k]) {
        var x0 = -h0 + k * m, y0 = -h0 + j * m, x1 = x0 + m - gap, y1 = y0 + m - gap;
        var p1 = P(x0, y0), p2 = P(x1, y0), p3 = P(x1, y1), p4 = P(x0, y1);
        g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.lineTo(p3[0], p3[1]); g.lineTo(p4[0], p4[1]); g.closePath(); g.fill();
      }
    }
    /* 勇者 */
    var spr = sprite("hero", "", hero.look), sc = 11;
    g.drawImage(spr, Math.round(cx - spr.width * sc / 2), Math.round(cy - spr.height * sc + 6), spr.width * sc, spr.height * sc);
    g.restore();
    g.strokeStyle = col; g.lineWidth = 2; rr(ax, ay, aw, ah, 6); g.stroke();
    /* 二つ名、その下に名前とレベル */
    g.fillStyle = "#ffd890"; g.font = "bold 22px monospace";
    g.fillText(titleName(), CARD_W / 2, 302, CARD_W - 30);
    g.fillStyle = "#fff"; g.font = "bold 30px monospace";
    g.fillText(run.name + "  Lv" + run.lv, CARD_W / 2, 344, CARD_W - 36);
    return c;
  }
  function wrapText(t, x, y, maxW, lh) {
    var lines = [], cur = "";
    if (ctx.measureText(t).width <= maxW) lines = [t];
    else {
      /* 読点のところで折る。なければ文字の途中で */
      var parts = t.split(/(?<=[、，,])/);
      parts.forEach(function (pt) { if (cur && ctx.measureText(cur + pt).width > maxW) { lines.push(cur); cur = pt.replace(/^\s+/, ""); } else cur += pt; });
      if (cur) lines.push(cur);
    }
    lines.forEach(function (l, i) { ctx.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh, maxW); });
  }
  function cardBox() {
    var top = Math.max(20, H * 0.04), bottom = resultButtons()[0].y - 120;
    var k = Math.min((W - 40) / CARD_W, (bottom - top) / CARD_H), w = CARD_W * k, h = CARD_H * k;
    return { x: W / 2 - w / 2, y: top + (bottom - top - h) / 2, w: w, h: h, k: k };
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,16,.9)";
    ctx.fillRect(0, 0, W, H);
    var b = cardBox(), q = Math.max(1, Math.ceil(b.k * canvas.width / W));
    if (!cardCache || cardCache.q !== q) cardCache = { q: q, cv: makeCard(q) };
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 24;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(cardCache.cv, b.x, b.y, b.w, b.h);
    ctx.restore();
    /* 来歴はカードの外に */
    ctx.save();
    ctx.fillStyle = run.win ? "#ffe060" : "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 26px sans-serif";
    wrapText(run.digest || "", W / 2, b.y + b.h + 50, W - 48, 34);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, W: W, H: H, ev: evIdx, total: run ? run.events.length : 0, win: run && run.win, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    auto: function () { var q = fakeQR(7); useQR(q.data, q.mat, q.N); },
    read: function (canvasLike) { scanCv.width = canvasLike.width; scanCv.height = canvasLike.height; scanCtx.drawImage(canvasLike, 0, 0); return tryRead(); },
    hideUI: function (v) { hideUI = v !== false; },
    star: function () { return hero ? starOf() : 0; },
    big: function (n, c, sc) { return (sc > 1 ? bigSprite(n, c, sc) : sprite(n, c, 0)).toDataURL(); },
    /* 職業ごとの見た目を並べた画像（確認用） */
    jobSheet: function () {
      var jobs = Object.keys(window.MahoSim.JOBS), c = document.createElement("canvas"), g = c.getContext("2d");
      c.width = jobs.length * 120; c.height = 3 * 150; g.fillStyle = "#16121e"; g.fillRect(0, 0, c.width, c.height); g.imageSmoothingEnabled = false;
      jobs.forEach(function (j, i) {
        for (var v = 0; v < 3; v++) {
          var L = { hair: (i + v * 3) % 8, style: v % 3, skin: (i + v) % 4, armor: (i * 3 + v * 2) % 8, weapon: 0, cape: v === 1 ? 2 : -1 };
          var st = { cls: j, look: L, gr: [0.5, 0, 0.5] }; dressUp(st);
          g.drawImage(sprite("hero", "", L), i * 120 + 10, v * 150 + 6, 100, 120);
        }
      });
      return c.toDataURL();
    }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      await r.wait(500);
      window.__probe.auto();
      if (!await r.until(function () { return state === S.ADV; }, 10)) throw Error("召喚されない");
      if (!await r.until(function () { return state === S.RESULT; }, 120)) throw Error("冒険が終わらない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); beginScan(); });
  confetti = window.zCelebrate.confetti();
  confetti.rain = false;
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
