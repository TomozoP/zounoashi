<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魔法陣ゲーム</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden], #photo-button[hidden] { display:none; }
  #photo-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <button id="photo-button" type="button" aria-label="画像を選ぶ" hidden></button>
  <input id="photo-input" type="file" accept="image/*" hidden>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../celebrate.js"></script>
<script src="jsQR.js"></script>   <!-- QRの読み取り（Apache-2.0） -->
<script src="sim.js"></script>
<script>
/* 魔法陣ゲーム
   魔法陣を描く → 形から勇者の名前とステータスが決まる → 冒険を見守る（上で冒険、下にログ）。
   冒険の中身は sim.js が召喚のときに最後まで計算し、ここでは1行ずつ高速に再生する。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);
  var LANG = window.zLangFull || "ja";

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  function sfx(k) {
    switch (k) {
      case "atk": noiseHit(0.06, 1800, 0.07, 2); tone(220, 0.05, 0.03, "square", 110); break;
      case "crit": noiseHit(0.1, 2400, 0.1, 2); tone(880, 0.08, 0.04, "square", 440); break;
      case "spell": tone(500, 0.12, 0.04, "triangle", 1400); break;
      case "heal": tone(660, 0.08, 0.04, "sine", 990); tone(990, 0.1, 0.03, "sine", 0, 0.06); break;
      case "hit": noiseHit(0.07, 700, 0.08, 1.5); break;
      case "kill": tone(440, 0.07, 0.04, "square", 880); break;
      case "lv": tone(784, 0.06, 0.04, "square"); tone(988, 0.06, 0.04, "square", 0, 0.06); tone(1319, 0.12, 0.04, "square", 0, 0.12); break;
      case "join": window.zCelebrate.play(AC, "chime", { volume: 0.5 }); break;
      case "fall": tone(300, 0.25, 0.06, "triangle", 90); break;
      case "boss": case "gate": tone(110, 0.4, 0.08, "sawtooth", 70); break;
      case "chest": tone(1046, 0.06, 0.04, "square"); tone(1568, 0.1, 0.04, "square", 0, 0.05); break;
      case "town": case "inn": tone(523, 0.12, 0.04, "triangle"); tone(784, 0.18, 0.04, "triangle", 0, 0.1); break;
      case "trap": noiseHit(0.15, 400, 0.08, 1); break;
    }
  }

  /* ============ ドット絵 ============ */
  var SPR = {
    hero: ["...hhhh...", "..hhhhhh..", "..hhsskh..", "..hsssss..", "...ssss..w", "..aaaaa..w", ".saaaaaasw", ".s.aaaa..y", "...aaaa...", "...a..a...", "...b..b...", "..bb..bb.."],
    warrior: ["...mmmm...", "..mmmmmm..", "..mssskm..", "..msssss..", "...ssss.xx", ".mmaaaamxx", ".saaaaaas.", ".s.aaaa...", "...aaaa...", "...a..a...", "...m..m...", "..mm..mm.."],
    mage: ["....pp....", "...pppp..o", "..pppppp.t", ".ppppppppt", "...sssk..t", "...ssss..t", "..rrrrr..t", ".srrrrrrst", "..rrrrr..t", "..rrrrr...", ".rrrrrrr..", "..b...b..."],
    priest: ["...cccc...", "..ccyycc..", "..csssk...", "..ssssss..", "...ssss...", "..ccccc...", ".scccccs..", "..ccycc...", "..ccycc...", "..ccccc...", ".ccccccc..", "..b...b..."],
    thief: ["...gggg...", "..gggggg..", "..ggsskg..", "..gsssss..", "...ssss...", "..gaaaa...", ".saaaaaasd", ".s.aaaa...", "...aaaa...", "...a..a...", "...b..b...", "..bb..bb.."],
    tomb: ["..........", "..........", "..........", "..........", "....qq....", "..qqqqqq..", "....qq....", "....qq....", "....qq....", "...qqqq...", "..qqqqqq..", ".QQQQQQQQ."],
    slime: ["............", "............", "............", "............", ".....cc.....", "....cccc....", "...cwcccc...", "..cwccccccc.", "..ckcckcccc.", ".cccccccccc.", ".cccddddccc.", "..dddddddd.."],
    bat: ["............", "c..........c", "cc...cc...cc", "ccc.cccc.ccc", "cccccccccccc", "ccc.ckkc.ccc", "cc..cccc..cc", "c....ww....c", "............", "............", "............", "............"],
    beast: ["............", "............", "............", "..c.........", ".ccc........", "ckcccccccc..", "cccccccccccc", "wcccccccccc.", ".cddcccccdc.", ".dc.d..d.cd.", ".d..d..d..d.", ".d..d..d..d."],
    ghost: ["............", "....cccc....", "...cccccc...", "..cckcckcc..", "..cccccccc..", "..cccwwccc..", "..cccccccc..", "..cccccccc..", "..cccccccc..", "..c.cc.cc.c.", "............", "............"],
    skel: ["....cccc....", "...ckcckc...", "...cccccc...", "....cdcd....", "..s..cc.....", "..s.cccc....", "..scc..cc...", "..y.cccc....", ".....cc.....", "....c..c....", "....c..c....", "...cc..cc..."],
    golem: ["....cccc....", "...ckcckc...", "...cccccc...", ".cccccccccc.", "cccdccccdccc", "ccc.cccc.ccc", "cc..cdcc..cc", "....cccc....", "...cc..cc...", "...cc..cc...", "..ccc..ccc..", "..ddd..ddd.."],
    dragon: ["............", "..cc......l.", ".ckcc....ll.", "ccccc...lll.", "wwcc...llll.", "..cc..clll..", "..cccccccc..", ".cccdddccccc", ".ccdddddcc.c", "..ccccccc..c", "..c.c..c.c..", ".cc.cc.cc.cc"],
    maou: ["..y......y..", "..yy....yy..", "...yccccy...", "...crkkrc...", "...cccccc...", "..pppccppp..", ".ppppccpppp.", "pppcccccccpp", "pp.cccccc.pp", "p..cccccc..p", "...cc..cc...", "..ccc..ccc.."]
  };
  var HAIR = ["#f4d03f", "#8b4a1a", "#2a2a33", "#e04848", "#4a80e0", "#e8e8f0", "#3ac06a", "#ff8ac8"];
  var ARMOR = ["#3a6ad8", "#c83a3a", "#3aa04a", "#8a4ad8", "#d8a03a", "#2ab0b0", "#e8e8f0", "#3a3a48"];
  var SKIN = ["#f2c8a0", "#e0a878", "#b87850", "#8a5434"];
  /* 勇者の頭（髪型）5種と体。武器は右手（列9）に重ねる */
  var HEADS = [
    ["...hhhh...", "..hhhhhh..", "..hhsskh..", "..hsssss..", "...ssss..."],
    ["..h.h.h...", ".hhhhhhh..", "..hhsskh..", "..hsssss..", "...ssss..."],
    ["...hhhh...", "..hhhhhh..", ".hhhsskh..", ".hhsssss..", ".hh.ssss.."],
    ["...mmmm...", "..mmmmmm..", "..mmsskm..", "..msssss..", "...ssss..."],
    ["..........", "..hhhhhh..", "..aaaaaa..", "..hsssks..", "...ssss..."]
  ];
  var BODY = ["..aaaaa...", ".saaaaaas.", ".s.aaaa...", "...aaaa...", "...a..a...", "...b..b...", "..bb..bb.."];
  var WEAPON = [
    [[9, 3, "w"], [9, 4, "w"], [9, 5, "w"], [9, 6, "w"], [9, 7, "y"]],
    [[8, 3, "x"], [9, 3, "x"], [8, 4, "x"], [9, 4, "t"], [9, 5, "t"], [9, 6, "t"], [9, 7, "t"]],
    [[9, 2, "o"], [9, 3, "t"], [9, 4, "t"], [9, 5, "t"], [9, 6, "t"], [9, 7, "t"], [9, 8, "t"], [9, 9, "t"]],
    [[9, 0, "w"], [9, 1, "w"], [9, 2, "t"], [9, 3, "t"], [9, 4, "t"], [9, 5, "t"], [9, 6, "t"], [9, 7, "t"], [9, 8, "t"]]
  ];
  function heroRows(L) {
    var rows = HEADS[L.style].concat(BODY).map(function (r) { return r.split(""); });
    if (L.cape >= 0) for (var y = 5; y < 10; y++) { if (rows[y][1] === ".") rows[y][1] = "c"; if (rows[y][2] === ".") rows[y][2] = "c"; }
    WEAPON[L.weapon].forEach(function (p) { rows[p[1]][p[0]] = p[2]; });
    return rows.map(function (r) { return r.join(""); });
  }
  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function f(v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); }
    return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
  }
  var sprCache = {};
  function sprite(name, color, look) {
    var obj = look && typeof look === "object";
    var key = name + color + (obj ? JSON.stringify(look) : look);
    if (sprCache[key]) return sprCache[key];
    var rows = obj ? heroRows(look) : SPR[name], c = document.createElement("canvas");
    c.width = rows[0].length; c.height = rows.length;
    var g = c.getContext("2d");
    var pal = {
      k: "#141018", s: "#f2c8a0", w: name === "dragon" ? shade(color, 0.5) : "#f4f4f4", y: "#f0d050", b: "#5a3a22",
      h: HAIR[look % 6], a: ARMOR[(look * 5 + 1) % 6], m: "#b8bcc8", x: "#c8ccd8", p: "#3a4ab8", r: "#4a5ad0", o: "#ffe060",
      t: "#8a5a2a", c: name === "priest" ? "#f4f0e8" : color, g: "#3a8a4a", d: name === "thief" ? "#d8dce8" : shade(color || "#888888", -0.35),
      q: "#9a9aa8", Q: "#5a5a68", l: shade(color || "#888888", 0.35)
    };
    if (name === "maou") { pal.c = "#6a4a9a"; pal.p = "#7a1020"; pal.r = "#ff3030"; pal.y = "#e8e0c8"; }
    if (name === "slime" || name === "ghost") pal.w = "#ffffff";
    if (obj) { pal.h = HAIR[look.hair]; pal.a = ARMOR[look.armor]; pal.s = SKIN[look.skin]; pal.c = look.cape >= 0 ? shade(ARMOR[look.cape], -0.25) : ""; }
    for (var y = 0; y < rows.length; y++) for (var x = 0; x < rows[y].length; x++) {
      var ch = rows[y][x];
      if (ch === ".") continue;
      g.fillStyle = pal[ch] || "#f0f";
      g.fillRect(x, y, 1, 1);
    }
    sprCache[key] = c;
    return c;
  }

  /* 場所ごとの色 [空上, 空下, 遠景, 地面, 地面の影, 近景] */
  var BG = [
    ["#5aa8f0", "#bfe6ff", "#6cc06a", "#7ccf4a", "#5a9a30", "#3f8a3a"],
    ["#245a40", "#4f8a5a", "#1f4a2e", "#4a7a32", "#2e5220", "#163a20"],
    ["#140f1c", "#2a2232", "#3a3044", "#4e4450", "#2e2834", "#5a4e64"],
    ["#7aa0d0", "#d8e8f8", "#f0f4ff", "#e8f0ff", "#b0c4e0", "#c8d8f0"],
    ["#3a0e0e", "#8a2a10", "#2a1818", "#40302c", "#ff6a1a", "#1e1212"],
    ["#120a22", "#2a1440", "#3a3050", "#4a4060", "#2a2440", "#5a4a78"]
  ];

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", SCAN: "scan", SUMMON: "summon", ADV: "adv", RESULT: "result" };
  var state, T, held = false, keyMode = false;
  var qr, readFail = -9;
  var hero, run, ev, evIdx, evAcc, logLines, logScroll, scroll, pops, anim, endT, sumT, confetti, hideUI = false;
  var CX, CY, CR, QS, SH, BW = 135, BH, buf, bctx;
  var RATE = 15;                               /* 等速での1秒あたりのログの行数 */
  var FAST = 5;                                /* 冒険の再生の倍速 */
  var lastSfx = 0;

  function place() {
    CX = W / 2; CY = Math.round(H * 0.42); CR = 230; QS = 290;
    SH = Math.round(H * 0.4 / 4) * 4;
    BH = SH / 4;
    buf = document.createElement("canvas"); buf.width = BW; buf.height = BH;
    bctx = buf.getContext("2d");
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.SCAN;
    T = 0; held = false;
    qr = null; readFail = -9;
    hero = null; run = null; ev = null;
    if (confetti) confetti.clear();
  }
  function beginScan() { newRound(); startCamera(); }

  /* ============ QRを読む ============
     カメラに映ったQR（または選んだ画像のQR）を読み取り、その模様をそのまま魔法陣にする。 */
  var video = null, stream = null, lastScan = 0;
  var scanCv = document.createElement("canvas"), scanCtx = scanCv.getContext("2d", { willReadFrequently: true });
  var photoButton = document.getElementById("photo-button"), photoInput = document.getElementById("photo-input");
  ["pointerdown", "pointerup"].forEach(function (name) { photoButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  photoButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); photoInput.click(); });
  photoInput.addEventListener("change", function () {
    var f = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    if (!f || state !== S.SCAN) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      URL.revokeObjectURL(url);
      var k = Math.min(1, 1200 / Math.max(im.width, im.height));
      scanCv.width = Math.round(im.width * k); scanCv.height = Math.round(im.height * k);
      scanCtx.drawImage(im, 0, 0, scanCv.width, scanCv.height);
      if (!tryRead()) { readFail = T; tone(180, 0.25, 0.06, "square", 120); }
    };
    im.src = url;
  });
  function startCamera() {
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) return;
    md.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).then(function (s) {
      if (state !== S.SCAN) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stopCamera();
      stream = s;
      video = document.createElement("video");
      video.muted = true; video.playsInline = true; video.setAttribute("playsinline", "");
      video.srcObject = s;
      var p = video.play(); if (p && p.catch) p.catch(function () {});
    }).catch(function () {});
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null; video = null;
  }
  function scanFrame() {
    if (!video || video.readyState < 2 || !video.videoWidth) return;
    var vw = video.videoWidth, vh = video.videoHeight, k = Math.min(1, 640 / Math.max(vw, vh));
    scanCv.width = Math.round(vw * k); scanCv.height = Math.round(vh * k);
    scanCtx.drawImage(video, 0, 0, scanCv.width, scanCv.height);
    tryRead();
  }
  function tryRead() {
    var w = scanCv.width, h = scanCv.height;
    if (!w || !h || !window.jsQR) return false;
    var img = scanCtx.getImageData(0, 0, w, h), d = img.data;
    var r = window.jsQR(d, w, h, { inversionAttempts: "attemptBoth" });
    if (!r || !r.location) return false;
    /* 四隅から升目の真ん中を拾って、模様を取り出す */
    var L = r.location, A = L.topLeftCorner, B = L.topRightCorner, C = L.bottomLeftCorner, D = L.bottomRightCorner;
    var N = 17 + 4 * (r.version || 1), lum = [], lo = 255, hi = 0;
    for (var j = 0; j < N; j++) for (var i = 0; i < N; i++) {
      var u = (i + 0.5) / N, v = (j + 0.5) / N;
      var x = A.x + u * (B.x - A.x) + v * (C.x - A.x) + u * v * (D.x - B.x - C.x + A.x);
      var y = A.y + u * (B.y - A.y) + v * (C.y - A.y) + u * v * (D.y - B.y - C.y + A.y);
      var px = Math.max(0, Math.min(w - 1, Math.round(x))), py = Math.max(0, Math.min(h - 1, Math.round(y))), o = (py * w + px) * 4;
      var g = d[o] * 0.3 + d[o + 1] * 0.59 + d[o + 2] * 0.11;
      lum.push(g); if (g < lo) lo = g; if (g > hi) hi = g;
    }
    var mid = (lo + hi) / 2, dark = lum.map(function (g) { return g < mid; });
    /* 白黒が反転したQRなら戻す（左上の角は黒） */
    if (!dark[0]) dark = dark.map(function (b) { return !b; });
    useQR(r.data || "", dark, N);
    return true;
  }

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function fnv(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  /* QRの中身と模様から勇者を決める。同じQRならいつも同じ勇者・同じ冒険になる */
  function heroOf(data, mat, N) {
    var h = fnv(data + "|" + N), dk = 0, sym = 0, r = window.MahoSim.rngOf(h ^ 0x5bd1e995);
    for (var j = 0; j < N; j++) for (var i = 0; i < N; i++) {
      if (mat[j * N + i]) dk++;
      if (mat[j * N + i] === mat[j * N + (N - 1 - i)]) sym++;
    }
    var f = {
      size: clamp01((N - 21) / 24), dark: clamp01((dk / (N * N) - 0.44) / 0.12), sym: clamp01((sym / (N * N) - 0.5) / 0.25)
    };
    /* 模様の特徴を半分、コードから引いた運を半分 */
    function mix(v) { return 0.5 * v + 0.5 * r(); }
    return {
      seed: h,
      stats: {
        hp: Math.round(30 + 30 * mix(f.size)), atk: Math.round(6 + 8 * r()), def: Math.round(3 + 8 * mix(f.dark)),
        mag: Math.round(3 + 10 * mix(f.sym)), spd: Math.round(4 + 10 * r()), luk: Math.round(2 + 10 * r()),
        look: lookOf(r), trait: TRAIT_IDS[Math.floor(r() * TRAIT_IDS.length)], name: window.MahoSim.jumon(r, LANG)
      }
    };

    }
    /* 魔物 */
    ev.e.forEach(function (e, j) {
      if (!e.alive) return;
      var spr = sprite(e.shape, e.color, 0);
      var sc = e.boss ? (e.shape === "maou" || e.shape === "dragon" ? 3 : 2) : 1;
      var w = spr.width * sc, h = spr.height * sc;
      var ex = e.boss ? 104 - w / 2 + 6 : 84 + j * (ev.e.length > 3 ? 12 : 14);
      var ey = gy - h + (e.shape === "bat" || e.shape === "ghost" ? -6 + Math.round(Math.sin(T * 6 + j) * 2) : 0);
      if (e.boss) ex = Math.round(ex);
      if (anim && anim.elunge === j) ex -= Math.round(lunge * 6);
      if (anim && (anim.shake === j || (ev.act && ev.act.all)) && at < 0.2) ex += (Math.floor(at * 40) % 2 ? -1 : 1);
      b.drawImage(spr, ex, ey, w, h);
    });
  }
  function drawPops() {
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold 30px monospace";
    ctx.lineWidth = 6; ctx.strokeStyle = "#140f1c";
    pops.forEach(function (p) {
      var y = SH - 90 - p.y - p.t * 60;
      ctx.globalAlpha = Math.min(1, (0.7 - p.t) * 4);
      ctx.strokeText(String(p.v), p.x, y);
      ctx.fillStyle = p.c; ctx.fillText(String(p.v), p.x, y);
    });
    ctx.restore();
  }
  var LOGC = { lv: "#ffe060", join: "#7aff8a", fall: "#ff6a5a", over: "#ff6a5a", boss: "#ffb04a", gate: "#ffb04a", maou: "#e0a0ff",
    clear: "#ffe060", heal: "#9affc8", chest: "#ffd890", enter: "#9ad0ff", town: "#9ad0ff", inn: "#9ad0ff", buy: "#ffd890", hit: "#ffc8c0", summon: "#e8d8ff", won: "#d8d8e8", revive: "#7aff8a" };
  function drawAdv() {
    ctx.fillStyle = "#0c0a14"; ctx.fillRect(0, 0, W, H);
    drawScene();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, BW * 4, BH * 4);
    if (hideUI) return;
    drawPops();
    /* 仲間のHPと、魔王城までの道のり */
    var y0 = SH;
    ctx.fillStyle = "#16121f"; ctx.fillRect(0, y0, W, 96);
    ctx.fillStyle = "#e8e0ff"; ctx.fillRect(0, y0, W, 4);
    var bx = 24, bw = W - 48, by = y0 + 22;
    ctx.fillStyle = "#2a2440"; ctx.fillRect(bx, by - 4, bw, 8);
    for (var i = 0; i < 6; i++) { ctx.fillStyle = BG[i][3]; ctx.fillRect(bx + bw * i / 6 + 1, by - 4, bw / 6 - 2, 8); }
    var pr = ev ? ev.prog : 0;
    ctx.fillStyle = "#2a2440"; ctx.fillRect(bx + bw * pr, by - 4, bw * (1 - pr), 8);
    drawBig(sprite("hero", "", hero.look), bx + bw * pr, by + 6, 2);
    drawBig(sprite("maou", "", 0), bx + bw - 4, by + 8, 2);
    if (ev) ev.p.forEach(function (p, i) {
      var cw = W - 48, x = 24 + i * cw, y = y0 + 46;
      ctx.globalAlpha = p.alive ? 1 : 0.45;
      drawBig(sprite(p.job, "", p.look || 0), x + 14, y + 40, 3);
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText("Lv" + p.lv, x + 34, y + 2);
      ctx.fillStyle = "#3a2a3a"; ctx.fillRect(x + 34, y + 26, cw - 44, 10);
      var f = p.mhp ? p.hp / p.mhp : 0;
      ctx.fillStyle = f > 0.5 ? "#6ae07a" : f > 0.25 ? "#ffd040" : "#ff5a4a";
      ctx.fillRect(x + 34, y + 26, (cw - 44) * f, 10);
      ctx.globalAlpha = 1;
    });
    /* ログ */
    var ly = y0 + 100, lh = 30, top = ly + 6, bottom = H - 8;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, ly, W, H - ly); ctx.clip();
    ctx.fillStyle = "#0c0a14"; ctx.fillRect(0, ly, W, H - ly);
    ctx.font = "bold 20px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    var n = logLines.length;
    for (var k = n - 1; k >= 0; k--) {
      var yy = bottom - (n - 1 - k) * lh + logScroll * lh - 6;
      if (yy < top) break;
      var L = logLines[k];
      ctx.globalAlpha = k === n - 1 ? 1 : Math.max(0.35, 1 - (n - 1 - k) * 0.06);
      ctx.fillStyle = LOGC[L.k] || "#f0f0f8";
      ctx.fillText(L.t, 18, yy, W - 36);
    }
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";
    window.zResultActions.place(photoButton, photoRect(), W, H, state === S.SCAN);
    if (state === S.INTRO || state === S.SCAN) drawScan();
    else if (state === S.SUMMON) drawSummon();
    else drawAdv();
    if (state === S.RESULT) drawResult();
    if (confetti) confetti.draw(ctx);
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.66);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,16,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10;
    drawBig(sprite(run.win ? "hero" : "tomb", "", hero.look), W / 2, H * 0.3, 10);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 34px monospace";
    ctx.fillText(run.name, W / 2, H * 0.35);
    ctx.font = "800 56px sans-serif";
    ctx.fillText(run.win ? zT("魔王討伐", "Demon King Slain", "마왕 토벌", "讨伐魔王", "討伐魔王") : run.areaName, W / 2, H * 0.44, W - 40);
    ctx.font = "800 72px sans-serif";
    ctx.fillText("Lv" + run.lv, W / 2, H * 0.53);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, W: W, H: H, ev: evIdx, total: run ? run.events.length : 0, win: run && run.win, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    auto: function () { var q = fakeQR(7); useQR(q.data, q.mat, q.N); },
    read: function (canvasLike) { scanCv.width = canvasLike.width; scanCv.height = canvasLike.height; scanCtx.drawImage(canvasLike, 0, 0); return tryRead(); },
    hideUI: function (v) { hideUI = v !== false; }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      await r.wait(500);
      window.__probe.auto();
      if (!await r.until(function () { return state === S.ADV; }, 10)) throw Error("召喚されない");
      if (!await r.until(function () { return state === S.RESULT; }, 120)) throw Error("冒険が終わらない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); beginScan(); });
  confetti = window.zCelebrate.confetti();
  confetti.rain = false;
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
