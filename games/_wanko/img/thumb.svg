<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c221c"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3d29"/>
      <stop offset="1" stop-color="#2a1c13"/>
    </linearGradient>
    <radialGradient id="shell" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#4a525d"/>
      <stop offset="0.55" stop-color="#1b1f25"/>
      <stop offset="1" stop-color="#080a0d"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.45" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ffb43a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9ffe0"/>
      <stop offset="0.4" stop-color="#5dffa0"/>
      <stop offset="1" stop-color="#5dffa0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#wall)"/>
  <g opacity="0.5" fill="#3a2c20">
