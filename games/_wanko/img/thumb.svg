  <circle cx="352" cy="316" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
  <path d="M334 172 h50 l-6 -26 h-36 z" fill="#8d7038"/>
  <rect x="326" y="162" width="58" height="10" fill="#b8974f"/>

