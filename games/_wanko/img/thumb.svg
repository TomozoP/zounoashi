  </g>
  <rect x="0" y="392" width="600" height="208" fill="url(#table)"/>
  <rect x="0" y="392" width="600" height="4" fill="#ffdcaa" opacity="0.1"/>

  <!-- 解除ずみの山 -->
  <g>
