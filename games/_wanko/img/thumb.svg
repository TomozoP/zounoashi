    <rect x="88" y="484" width="16" height="12" rx="3" fill="#8d7038"/>
    <rect x="128" y="490" width="52" height="30" rx="15" fill="#3d444d"/>
    <rect x="66" y="466" width="44" height="30" rx="6" fill="#37502d"/>
