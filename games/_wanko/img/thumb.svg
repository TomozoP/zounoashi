  <path d="M372 168 C 412 122 452 176 492 132" fill="none" stroke="#c0a878" stroke-width="13" stroke-linecap="round"/>
  <path d="M372 168 C 412 122 452 176 492 132" fill="none" stroke="#8d7749" stroke-width="5" stroke-linecap="round"/>
  <circle cx="492" cy="132" r="34" fill="url(#spark)"/>
  <circle cx="492" cy="132" r="9" fill="#fff3c4"/>

