<script>
/* 256色旗揚げ

   奥の人が色の名前で「〇〇上げて」「〇〇下げて」と言う。
   手前の人は左右の手に1本ずつ旗を持ち、画面の左右をタップして上げ下げする。
   旗の色は指示ごとに変わり、使う色は2色から倍々に増えて256色になる。
   違う旗を動かすか、時間切れで終わり。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var view3d = null;
  try {
    view3d = (window.WebGLRenderingContext && typeof ZHataScene !== "undefined" && typeof THREE !== "undefined")
      ? new ZHataScene() : null;
  } catch (e) { view3d = null; }

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    if (view3d) view3d.resize(canvas.width, canvas.height);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, voice = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  /* 旗を振る音。布が風を切る音 */
  function flapSound(raise) {
    noiseHit(0.14, raise ? 1600 : 800, 0.45, 0.7);
  }
  var MORA = 0.085;
  function say(yomi) {
    if (voice) { voice.stop(); voice = null; }
    if (!AC || !window.zVoice) return;
    voice = window.zVoice.speak(AC, AC.currentTime + 0.03, 250, window.zVoice.kana(yomi, MORA), { volume: 0.34, swing: 0.8 });
  }
  function hushVoice() { if (voice) { voice.stop(); voice = null; } }

  /* ============ 色 ============ */
  var COLORS = window.HATA_COLORS;
  function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function apart(a, b) {
    var p = rgb(a[2]), q = rgb(b[2]);
    return Math.sqrt((p[0] - q[0]) * (p[0] - q[0]) + (p[1] - q[1]) * (p[1] - q[1]) + (p[2] - q[2]) * (p[2] - q[2]));
  }
  function moraOf(yomi) { return window.zVoice ? window.zVoice.kana(yomi, 1).reduce(function (s, w) { return s + w[2]; }, 0) : yomi.length; }

  /* ============ 進行の数字 ============ */
  var PER_LEVEL = 3;                           /* 色が倍になるまでの指示の数 */
  var MAXK = 8;
  var MIN_APART = 60;                          /* 2本の旗の色の近さの下限（RGBの距離） */
  function limitFor(c, extra) {                /* 1つの指示にかけられる秒数。言い終わるまで＋考える時間 */
    var t = moraOf(c[1] + "あげて") * MORA + 1.8 - Math.min(0.5, extra * 0.02);
    return Math.max(2.2, t);
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", MISS: "miss", RESULT: "result" };
  var state, score, T, keyMode = false;
  var level, levelCount, extra, cmd, cmdT, flags, missT, missSide, shake, lastName;

  function poolSize() { return 1 << level; }
  function pick(n, not) {
    var c;
    do { c = COLORS[Math.floor(Math.random() * n)]; } while (not && (c === not || apart(c, not) < MIN_APART));
    return c;
  }

  function nextCommand() {
    var n = poolSize(), a, b;
    if (n === 2) { a = COLORS[0]; b = COLORS[1]; if (Math.random() < 0.5) { var t = a; a = b; b = t; } }
    else {
      /* 新しく増えた色を多めに出す */
      a = Math.random() < 0.6 ? COLORS[n / 2 + Math.floor(Math.random() * n / 2)] : pick(n);
      b = pick(n, a);
      if (Math.random() < 0.5) { var u = a; a = b; b = u; }
    }
    var pair = [a, b];
    var side;
    do { side = Math.random() < 0.5 ? 0 : 1; } while (n > 2 && pair[side][0] === lastName && pair[1 - side][0] !== lastName);
    flags.forEach(function (f, i) {
      if (f.color !== pair[i]) f.pop = 1;
      f.color = pair[i];
    });
    lastName = pair[side][0];
    cmd = { side: side, color: pair[side], raise: !flags[side].up };
    cmd.text = cmd.color[0] + (cmd.raise ? "上げて" : "下げて");
    cmd.limit = limitFor(cmd.color, extra);
    cmdT = 0;
    say(cmd.color[1] + (cmd.raise ? "あげて" : "さげて"));
  }

  function freshFlags() {
    return [{ up: false, p: 0, pop: 0, color: COLORS[0] }, { up: false, p: 0, pop: 0, color: COLORS[1] }];
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; T = 0; extra = 0; levelCount = 0; level = 1;
    missSide = -1; shake = 0; lastName = null;
    flags = freshFlags();
    nextCommand();
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    flags.forEach(function (f) {
      f.p += ((f.up ? 1 : 0) - f.p) * Math.min(1, dt * 16);
      f.pop = Math.max(0, f.pop - dt * 4);
    });
    if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
    if (state === S.MISS) {
      missT += dt;
      if (missT > 1.4) { state = S.RESULT; shareButton.hidden = false; }
      return;
    }
    if (state !== S.PLAY) return;
    cmdT += dt;
    if (cmdT >= cmd.limit) miss();
  }

  function miss() {
    state = S.MISS; missT = 0; missSide = cmd.side; shake = 1;
    hushVoice();
    tone(150, 0.45, 0.16, "square", 90);
    noiseHit(0.3, 300, 0.25, 0.7);
  }

  function hitSide(i) {
    var f = flags[i];
    f.up = !f.up;
    flapSound(f.up);
    if (i !== cmd.side) { miss(); return; }
    score++;
    if (level === MAXK) extra++;
    else if (++levelCount >= PER_LEVEL) {
      levelCount = 0;
      level++;
      [523, 659, 784].forEach(function (fr, j) { tone(fr, 0.1, 0.06, "triangle", null, j * 0.05); });
    }
    nextCommand();
  }

  /* ============ 入力 ============
     画面の左半分で左の旗、右半分で右の旗。キーは ← → */
  function down(x, y, side) {
    if (state === S.INTRO || state === S.MISS) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? (side == null ? "retry" : null) : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (side == null) {
      if (x == null) return;
      side = x < W / 2 ? 0 : 1;
    }
    hitSide(side);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    if (left || right) { if (state === S.PLAY) down(null, null, left ? 0 : 1); return; }
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function doShare() {
    window.zResultActions.x({ text: score + "回でした #256色旗揚げ" });
  }

  /* ============ 描画 ============ */
  var INK = "#16202e";
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 3Dが使えないとき（自動確認の台など）の簡単な絵 */
  function drawFlat() {
    ctx.fillStyle = "#9fd3f0"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#cdb68c"; ctx.fillRect(0, H * 0.45, W, H * 0.55);
    flags.forEach(function (f, i) {
      var x = i ? W * 0.75 : W * 0.25, y = H * 0.75 - f.p * H * 0.3;
      ctx.fillStyle = f.color[2]; ctx.fillRect(x - 40, y - 30, 80, 60);
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(x - 40, y - 30, 80, 60);
    });
  }

  function drawBubble() {
    if (!cmd) return;
    var head = view3d ? view3d.callerHead(W, H) : { x: W / 2, y: H * 0.3 };
    var size = 50;
    ctx.font = "900 " + size + "px sans-serif";
    var tw = ctx.measureText(cmd.text).width;
    if (tw > W - 90) { size = Math.floor(size * (W - 90) / tw); ctx.font = "900 " + size + "px sans-serif"; tw = ctx.measureText(cmd.text).width; }
    var bw = tw + 56, bh = size + 44, bx = W / 2 - bw / 2, by = Math.max(24, head.y - bh - 36);
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    roundRect(bx, by, bw, bh, bh / 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(head.x - 14, by + bh - 1.5); ctx.lineTo(head.x, by + bh + 20); ctx.lineTo(head.x + 14, by + bh - 1.5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(head.x - 14, by + bh); ctx.lineTo(head.x, by + bh + 20); ctx.lineTo(head.x + 14, by + bh);
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(cmd.text, W / 2, by + bh / 2 + 2);
    ctx.textBaseline = "alphabetic";
    if (state === S.PLAY) {
      var left = Math.max(0, 1 - cmdT / cmd.limit), barW = Math.min(bw, 280);
      ctx.fillStyle = "rgba(22,32,46,.25)";
      roundRect(W / 2 - barW / 2, by - 18, barW, 8, 4); ctx.fill();
      ctx.fillStyle = left < 0.3 ? "#e8443a" : INK;
      roundRect(W / 2 - barW / 2, by - 18, Math.max(8, barW * left), 8, 4); ctx.fill();
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    if (view3d) {
      view3d.draw(ctx, W, H, {
        t: T,
        arms: [flags[0].p, flags[1].p],
        colors: [flags[0].color[2], flags[1].color[2]],
        pop: [flags[0].pop, flags[1].pop],
        talk: state === S.PLAY && voice && AC && AC.currentTime < voice.end ? 1 : (state === S.PLAY && cmdT < 0.6 ? 1 : 0),
        blink: state === S.MISS ? missSide : -1,
        shake: shake
      });
    } else drawFlat();

    if (state !== S.INTRO) drawBubble();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      ctx.fillStyle = INK;
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, score: score, W: W, H: H, level: level, colors: poolSize(),
        say: cmd ? cmd.text : null, side: cmd ? cmd.side : null, raise: cmd ? cmd.raise : null,
        flags: flags.map(function (f) { return { name: f.color[0], hex: f.color[2], up: f.up }; }),
        limit: cmd ? cmd.limit : null, left: cmd ? cmd.limit - cmdT : null, has3d: !!view3d };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var n = 0; n < 24 && state === S.PLAY; n++) {
        await r.wait(900 + Math.random() * 700);
        if (state === S.PLAY) down(null, null, cmd.side);
      }
      await r.wait(6000);
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO; score = 0; T = 0; level = 1; flags = freshFlags(); cmd = null; shake = 0; missSide = -1;
  startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
