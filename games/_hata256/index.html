<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>256色旗揚げ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #2b3038; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 256色旗揚げ

   ふつうは赤と白の2本でやる旗揚げを、色を倍々に増やして256色まで続ける。
   吹き出しの色の旗を、言われたとおり上げる・下げる。違う旗に触るか時間切れで終わり。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  /* 旗を振る音。上げるときは高め、下げるときは低め */
  function flapSound(raise) {
    noiseHit(0.12, raise ? 1800 : 900, 0.35, 0.8);
    tone(raise ? 520 : 390, 0.09, 0.08, "triangle", raise ? 780 : 260);
  }

  /* ============ 色 ============
     2色は赤と白。8色から先は赤・緑・青の段階を1ビットずつ増やし、
     256色で赤8段・緑8段・青4段（1バイトの色）になる。どの段階にも赤と白が残る。 */
  var MAXK = 8;
  var BITS = [null, null, null, [1, 1, 1], [2, 1, 1], [2, 2, 1], [2, 2, 2], [3, 2, 2], [3, 3, 2]];
  function hex2(v) { var s = v.toString(16); return s.length < 2 ? "0" + s : s; }
  function palette(k) {
    if (k === 1) return ["#ff0000", "#ffffff"];
    if (k === 2) return ["#000000", "#0000ff", "#ff0000", "#ffffff"];
    /* 青の段ごとに「赤の段×緑の段」の区画を作り、区画を並べて長方形にする */
    var b = BITS[k], out = [];
    var lr = 1 << b[0], lg = 1 << b[1], lb = 1 << b[2];
    var c = cols(k), rw = rows(k), bc = c / lg;
    function v(i, n) { return hex2(Math.round(i * 255 / (n - 1))); }
    for (var y = 0; y < rw; y++)
      for (var x = 0; x < c; x++) {
        var bl = Math.floor(y / lr) * bc + Math.floor(x / lg);
        out.push("#" + v(y % lr, lr) + v(x % lg, lg) + v(bl, lb));
      }
    return out;
  }

  /* ============ 進行の数字 ============ */
  var PER_LEVEL = 3;                           /* 色が倍になるまでの指示の数 */
  function limitFor(k, extra) {               /* 1つの指示にかけられる秒数 */
    var t = 1.5 + 0.45 * k;                    /* 2色 1.95秒 … 256色 5.1秒 */
    if (k === MAXK) t = Math.max(2.8, t - 0.08 * extra);
    return t;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", MISS: "miss", RESULT: "result" };
  var state, score, T, keyMode = false;
  var level, flags, order, cmd, cmdT, lastTarget, levelCount, extra, grow, missT, missCell, shake;

  var GX, GY, GS, BY;                          /* 旗の面・吹き出しの置き場所 */
  function place() {
    GS = 500;
    GX = (W - GS) / 2;
    GY = Math.round(Math.max(230, Math.min(H - GS - 150, H * 0.5 - GS / 2 + 70)));
    BY = GY - 150;
  }

  function cols(k) { return 1 << Math.ceil(k / 2); }
  function rows(k) { return 1 << Math.floor(k / 2); }
  function cellRect(i) {
    var c = cols(level), rw = rows(level), s = GS / c;
    var oy = GY + (GS - s * rw) / 2;
    return { x: GX + (i % c) * s, y: oy + Math.floor(i / c) * s, s: s };
  }

  function setLevel(k) {
    var prev = flags || {};
    level = k;
    order = palette(k);
    flags = {};
    order.forEach(function (col) {
      var p = prev[col];
      flags[col] = p ? p : { up: false, p: 1, born: 0 };
    });
    grow = 0;
  }

  function nextCommand() {
    var i, tries = 0;
    do { i = Math.floor(Math.random() * order.length); tries++; }
    while (order[i] === lastTarget && tries < 20);
    lastTarget = order[i];
    cmd = { color: order[i], raise: !flags[order[i]].up, limit: limitFor(level, extra) };
    cmdT = 0;
    tone(1320, 0.06, 0.07, "sine");
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; T = 0; extra = 0; levelCount = 0;
    flags = null; lastTarget = null; missCell = null; shake = 0;
    setLevel(1);
    nextCommand();
  }

  /* ============ 進行 ============ */
  function update(dt) {
    var col;
    for (col in flags) {
      var f = flags[col], to = f.up ? 0 : 1;
      f.p += (to - f.p) * Math.min(1, dt * 18);
      f.born = Math.min(1, f.born + dt * 3);
    }
    grow = Math.min(1, grow + dt * 3);
    if (shake > 0) shake = Math.max(0, shake - dt * 3);
    if (state === S.MISS) {
      missT += dt;
      if (missT > 1.1) { state = S.RESULT; shareButton.hidden = false; }
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;
    cmdT += dt;
    if (cmdT >= cmd.limit) miss(cmd.color);
  }

  function miss(col) {
    state = S.MISS; missT = 0; missCell = col; shake = 1;
    tone(150, 0.45, 0.16, "square", 90);
    noiseHit(0.3, 300, 0.25, 0.7);
  }

  function hitFlag(col) {
    var f = flags[col];
    f.up = !f.up;
    flapSound(f.up);
    if (col !== cmd.color) { miss(cmd.color); return; }
    score++;
    if (level === MAXK) extra++;
    else if (++levelCount >= PER_LEVEL) {
      levelCount = 0;
      setLevel(level + 1);
      [523, 659, 784, 1047].forEach(function (fr, j) { tone(fr, 0.12, 0.08, "triangle", null, j * 0.06); });
    }
    nextCommand();
  }

  /* ============ 入力 ============ */
  function cellAt(x, y) {
    var c = cols(level), rw = rows(level), s = GS / c;
    var oy = GY + (GS - s * rw) / 2;
    var ci = Math.floor((x - GX) / s), ri = Math.floor((y - oy) / s);
    if (x < GX || ci < 0 || ci >= c || y < oy || ri < 0 || ri >= rw) return -1;
    return ri * c + ci;
  }
  function down(x, y) {
    if (state === S.INTRO || state === S.MISS) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) return;
    var i = cellAt(x, y);
    if (i >= 0) hitFlag(order[i]);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function doShare() {
    window.zResultActions.x({ text: score + "回 #256色旗揚げ" });
  }

  /* ============ 描画 ============ */
  var INK = "#16202e";
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 1マスに旗1本。p=0 で上げた、p=1 で下げた */
  function drawFlag(r, col, f) {
    var s = r.s * (0.6 + 0.4 * easeOut(f.born));
    var x = r.x + (r.s - s) / 2, y = r.y + (r.s - s) / 2;
    var lw = Math.max(1, s * 0.035);
    var px = x + s * 0.28;
    ctx.lineCap = "round";
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.2, s * 0.045);
    ctx.beginPath(); ctx.moveTo(px, y + s * 0.1); ctx.lineTo(px, y + s * 0.92); ctx.stroke();
    var fw = s * 0.52, fh = s * 0.34;
    var fy = y + s * 0.1 + (s * 0.46) * f.p;
    var wave = s * 0.04 * (1 - Math.abs(f.p - 0.5) * 2 + 0.3);
    ctx.beginPath();
    ctx.moveTo(px, fy);
    ctx.quadraticCurveTo(px + fw * 0.5, fy - wave, px + fw, fy);
    ctx.lineTo(px + fw, fy + fh);
    ctx.quadraticCurveTo(px + fw * 0.5, fy + fh - wave, px, fy + fh);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
  }
  function easeOut(t) { return 1 - (1 - t) * (1 - t); }

  function drawBubble() {
    if (!cmd) return;
    var bw = 360, bh = 116, bx = (W - bw) / 2, by = BY;
    ctx.fillStyle = "#fff";
    roundRect(bx, by, bw, bh, 26); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W / 2 - 18, by + bh - 1); ctx.lineTo(W / 2, by + bh + 20); ctx.lineTo(W / 2 + 18, by + bh - 1);
    ctx.closePath(); ctx.fill();
    var sw = 76, sx = bx + 26, sy = by + (bh - sw) / 2;
    roundRect(sx, sy, sw, sw, 12);
    ctx.fillStyle = cmd.color; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = INK;
    ctx.font = "900 58px sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(cmd.raise ? "上げて" : "下げて", sx + sw + 22, by + bh / 2 + 3);
    ctx.textBaseline = "alphabetic";
    /* 残り時間 */
    if (state === S.PLAY) {
      var left = Math.max(0, 1 - cmdT / cmd.limit);
      ctx.fillStyle = "rgba(255,255,255,.25)";
      roundRect(bx, by - 22, bw, 8, 4); ctx.fill();
      ctx.fillStyle = left < 0.3 ? "#ff5a4e" : "#fff";
      roundRect(bx, by - 22, Math.max(8, bw * left), 8, 4); ctx.fill();
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#2b3038";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate(Math.sin(T * 90 + shake * 20) * 8 * shake, 0);
    var c = cols(level), rw = rows(level), s = GS / c;
    var oy = GY + (GS - s * rw) / 2;
    ctx.fillStyle = "#e9ecf0";
    roundRect(GX - 6, oy - 6, GS + 12, s * rw + 12, 14); ctx.fill();
    for (var i = 0; i < order.length; i++) {
      var col = order[i], r = cellRect(i);
      if (state === S.MISS && col === missCell) {
        ctx.fillStyle = (Math.floor(missT * 8) % 2) ? "#ff5a4e" : "#ffd2cc";
        ctx.fillRect(r.x, r.y, r.s, r.s);
      }
      drawFlag(r, col, flags[col]);
    }
    ctx.restore();

    if (state !== S.INTRO) drawBubble();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      ctx.fillStyle = INK;
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      var t = cmd ? order.indexOf(cmd.color) : -1, r = t >= 0 ? cellRect(t) : null;
      return { state: state, score: score, W: W, H: H, level: level, colors: order.length,
        target: cmd ? cmd.color : null, raise: cmd ? cmd.raise : null,
        limit: cmd ? cmd.limit : null, left: cmd ? cmd.limit - cmdT : null,
        cell: r ? { x: r.x + r.s / 2, y: r.y + r.s / 2, s: r.s } : null };
    },
    colors: function () { return order.slice(); },
    cellOf: function (col) { var i = order.indexOf(col); if (i < 0) return null; var r = cellRect(i); return { x: r.x + r.s / 2, y: r.y + r.s / 2, s: r.s }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  function tapAt(x, y) {
    var r = canvas.getBoundingClientRect();
    wrap.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, isPrimary: true, pointerId: 1,
      clientX: r.left + x / W * r.width, clientY: r.top + y / H * r.height }));
  }
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var n = 0; n < 26 && state === S.PLAY; n++) {
        await r.wait(500 + Math.random() * 500);
        var c = window.__probe.now().cell;
        if (c && state === S.PLAY) tapAt(c.x, c.y);
      }
      await r.wait(4000);
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; cmd = null; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
