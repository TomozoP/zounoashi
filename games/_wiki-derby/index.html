<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>情報量ダービー</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1f5a34; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
  /* 着順の一覧の題名に重ねる透明なリンク（絵は canvas に描いてある） */
  .article-link { position:absolute; display:block; color:transparent; overflow:hidden; text-decoration:none; touch-action:manipulation; }
  .article-link[hidden] { display:none; }
  .article-link:focus-visible { outline:3px solid #f7cc71; outline-offset:2px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 情報量ダービー

   ランダムなWikipediaの記事8本が、8頭の出走馬。馬の名前は記事の題名。
   人気（倍率）は記事の閲覧数で決まる。架空の観客が、よく読まれている記事ほど多く賭ける。
   各馬は自分の記事の本文を走路に書きながら走り、全部書き切ったところで止まる。
   最後まで書き続けた馬（本文の文字数＝情報量がいちばん多い記事）が1着。
   1着と2着の決着がついた直後の地点がゴール。1着の馬はゴールを越えても速さを落とさずに画面の外へ駆け抜け、レースは終わる
   （1着だけは書き切らない）。
   単勝（1着）に100ずつ賭けて、3レース後の手持ちが結果。
   開始画面で1〜4人を選べる。2人以上なら、レースごとにプレイヤーが順番に賭けてから走らせる（ひとつの端末を回して遊ぶ）。

   遊ぶたびにWikipediaから取りに行く。文章を出すので、出典と利用条件を表示する。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    /* 幅0の枠で読み込まれると高さが数値でなくなり、背景のグラデーションで止まって固まるので、仮の高さにしておく */
    if (!isFinite(H)) H = 960;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + Math.min(0.05, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  function sndChip(delay) { noiseHit(0.05, 3200 + Math.random() * 600, 0.2, 3, delay); tone(2400 + Math.random() * 300, 0.04, 0.03, "triangle", null, delay); }
  function sndReveal(i) { tone(520 + i * 70, 0.06, 0.035, "triangle"); }   /* 馬名が1頭ずつ出るとき。だんだん高く */
  function sndPick() { tone(660, 0.05, 0.05, "square"); }
  function sndTurn() { tone(784, 0.1, 0.06, "triangle"); tone(1047, 0.16, 0.06, "triangle", null, 0.1); }
  function sndNo() { tone(160, 0.1, 0.05, "square"); }
  /* ゲートが開く: 金属の音と、短いファンファーレ */
  function sndGate() {
    noiseHit(0.12, 1800, 0.25, 3); tone(1318, 0.5, 0.06, "triangle", null, 0.02); tone(1760, 0.6, 0.05, "triangle", null, 0.02);
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 0.05, "square", null, 0.12 + i * 0.08); });
  }
  function sndCount(n) { tone(n > 0 ? 880 : 1320, 0.18, 0.08, "square"); }
  /* 足音。1歩ごとに「パ・カ・ラッ」と3つ打つ。乾いた木の音と、低い土の音を重ねる */
  function clop(at, vol, pitch) {
    noiseHit(0.035, 1150 * pitch + Math.random() * 250, vol, 5, at);
    tone(240 * pitch, 0.06, vol * 0.45, "triangle", 150 * pitch, at);
  }
  function gallop(v) {
    var p = 0.9 + Math.random() * 0.2;
    clop(0, 0.14 * v, p); clop(0.065, 0.11 * v, p * 0.94); clop(0.13, 0.17 * v, p * 0.88);
  }

  /* ダービーらしい行進曲ふうのBGM（ここで作った旋律）。ゲートが開いたら流し、ゴールしたら消す。
     先の音を少しずつ予約していく。旋律は金管っぽい音、ほかにベースと太鼓 */
  var BPM = 140, BPM_TOP = 200, BEAT = 60 / BPM;              /* テンポは始め140、終盤200まで上がる */
  function musicTempo(u) { BEAT = 60 / (BPM + (BPM_TOP - BPM) * Math.max(0, Math.min(1, u)) * Math.max(0, Math.min(1, u))); }
  /* 旋律: [音の高さ（C4=60のMIDI番号。0は休み）, 拍数] */
  var MELODY = [
    [67, 1], [72, 1], [76, 1], [79, 1],        [76, 1], [72, 0.5], [76, 0.5], [79, 2],
    [81, 1], [79, 1], [77, 1], [76, 1],        [74, 2], [67, 2],
    [65, 1], [69, 1], [72, 1], [77, 1],        [76, 1], [74, 0.5], [76, 0.5], [72, 2],
    [74, 1], [76, 1], [77, 1], [74, 1],        [72, 3], [0, 1]
  ];
  var BASS = [48, 48, 53, 55, 53, 48, 55, 48];  /* 1小節ごとの根音 */
  var music = null;
  function mnote(midi, at, dur, vol, type, cut) {
    if (!AC || !music) return;
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = type; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    lp.type = "lowpass"; lp.frequency.value = cut || 2400;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.02);
    g.gain.setValueAtTime(vol * 0.8, at + Math.max(0.03, dur - 0.06));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(lp); lp.connect(g); g.connect(music.out);
    o.start(at); o.stop(at + dur + 0.05);
  }
  function mdrum(at, kind) {
    if (!AC || !NOISE || !music) return;
    if (kind === "kick") {
      var o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(120, at); o.frequency.exponentialRampToValueAtTime(45, at + 0.12);
      g.gain.setValueAtTime(0.25, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
      o.connect(g); g.connect(music.out); o.start(at); o.stop(at + 0.2);
      return;
    }
    var src = AC.createBufferSource(), fl = AC.createBiquadFilter(), gn = AC.createGain();
    src.buffer = NOISE;
    fl.type = kind === "hat" ? "highpass" : "bandpass"; fl.frequency.value = kind === "hat" ? 7000 : 1800;
    var v = kind === "hat" ? 0.035 : 0.14, d = kind === "hat" ? 0.03 : 0.12;
    gn.gain.setValueAtTime(v, at); gn.gain.exponentialRampToValueAtTime(0.0001, at + d);
    src.connect(fl); fl.connect(gn); gn.connect(music.out);
    src.start(at, Math.random() * 1.5); src.stop(at + d + 0.02);
  }
  function startMusic() {
    if (!AC || music) return;
    var out = AC.createGain();
    out.gain.value = 0.55;
    out.connect(AC.destination);
    music = { out: out, next: AC.currentTime + 0.05, beat: 0, mi: 0, mt: 0 };
  }
  function stopMusic() {
    if (!music) return;
    var m = music; music = null;
    try { m.out.gain.setTargetAtTime(0.0001, AC.currentTime, 0.4); setTimeout(function () { try { m.out.disconnect(); } catch (e) {} }, 2500); } catch (e) {}
  }
  /* 先0.25秒ぶんの音を予約する。8分音符ずつ進める */
  function musicTick() {
    if (!AC || !music) return;
    var total = MELODY.reduce(function (a, n) { return a + n[1]; }, 0);
    while (music.next < AC.currentTime + 0.25) {
      var at = music.next, b = music.beat, inBar = b % 4;
      if (inBar === 0 || inBar === 2) mdrum(at, "kick");
      if (inBar === 1 || inBar === 3) mdrum(at, "snare");
      mdrum(at, "hat");
      if (Math.abs(b - Math.round(b)) < 1e-6) {                     /* ベース: 1拍ごとに根音と5度 */
        var root = BASS[Math.floor(b / 4) % BASS.length];
        mnote(root + (Math.round(b) % 2 ? 7 : 0) - 12, at, BEAT * 0.9, 0.12, "triangle", 900);
      }
      var pos = b % total;                                           /* 旋律 */
      while (music.mi < MELODY.length && music.mt + 1e-6 < pos) { music.mt += MELODY[music.mi][1]; music.mi++; }
      if (pos < 1e-6) { music.mi = 0; music.mt = 0; }
      if (music.mi < MELODY.length && Math.abs(music.mt - pos) < 1e-6) {
        var nt = MELODY[music.mi];
        if (nt[0]) {
          mnote(nt[0], at, nt[1] * BEAT * 0.92, 0.06, "sawtooth", 2600);
          mnote(nt[0] - 12, at, nt[1] * BEAT * 0.92, 0.035, "square", 1600);
        }
      }
      music.beat += 0.5;
      music.next += BEAT / 2;
    }
  }
  function sndCrowd(v) { noiseHit(0.5, 900 + Math.random() * 400, 0.015 + 0.045 * v, 0.6); }
  function sndCheer() { for (var i = 0; i < 4; i++) noiseHit(0.9, 1100 + i * 300, 0.12, 0.5, i * 0.05); }
  function sndStop(mine, rank) {
    if (rank === 0) return;
    var f0 = 1568 * Math.pow(2, -(rank - 1) * 2 / 12);           /* 2着がいちばん高く、下の着順ほど低い */
    tone(f0, 0.9, 0.07, "sine"); tone(f0 * 2.76, 0.5, 0.025, "sine"); tone(f0 * 5.4, 0.25, 0.012, "sine");
    if (mine) { tone(260, 0.5, 0.06, "sine", 170, 0.05); noiseHit(1.0, 500, 0.09, 0.6, 0.05); }
  }
  /* ゴールのファンファーレ（ここで作った短い節）。金管っぽい音で */
  function sndFanfare() {
    if (!AC) return;
    var at = AC.currentTime + 0.05, b = 0.16;
    [[72, 0, 1], [72, 1, 1], [72, 2, 1], [76, 3, 3], [74, 6, 1], [76, 7, 1], [79, 8, 6], [84, 8, 6]].forEach(function (n) {
      [["sawtooth", 0.06, 2600, 0], ["square", 0.03, 1600, -12]].forEach(function (v) {
        var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter(), t0 = at + n[1] * b, d = n[2] * b * 0.95;
        o.type = v[0]; o.frequency.value = 440 * Math.pow(2, (n[0] + v[3] - 69) / 12);
        lp.type = "lowpass"; lp.frequency.value = v[2];
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v[1], t0 + 0.02);
        g.gain.setValueAtTime(v[1] * 0.85, t0 + Math.max(0.03, d - 0.08)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        o.connect(lp); lp.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.05);
      });
    });
    for (var i = 0; i < 3; i++) noiseHit(0.5, 5200, 0.05, 2, 1.28 + i * 0.02);    /* シンバル */
  }
  function sndWin() { [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, 0.22, 0.08, "triangle", null, i * 0.09); }); }
  function sndLose() { tone(300, 0.3, 0.06, "sine", 170); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 出走馬を取ってくる ============
     ランダムな記事8本の、題名・30日の閲覧数・本文。
     1回目で題名・閲覧数（の一部）・記事の原稿（記号入りの文章）がそろう。閲覧数は1回で返りきらないので続きを数回取る。
     原稿の記号（枠・表・脚注・リンクの書式など）はゲーム側で取り除いて本文にする。
     テストでは window.__wikiSource に同じ形の偽物を置く。 */
  var API = "https://ja.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query";
  var UA = "ZounoashiGames-WikiDerby/1.0 (https://www.zounoashi.com)";
  var N = 8;                                    /* 8頭立て。1頭ずつ別の枠（色）になる */
  function getJSON(url) {
    if (typeof fetch !== "function") return Promise.reject(new Error("通信できない"));
    /* Wikipediaの決まりに沿って、どこの何が問い合わせているかを名乗る（連絡先はサイトのURL） */
    return fetch(url, { headers: { "Api-User-Agent": UA } }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function sumViews(pv) { var s = 0; for (var k in pv) s += pv[k] || 0; return s; }
  var wikiSource = {
    field: function () {
      return getJSON(API + "&generator=random&grnnamespace=0&grnlimit=" + N +
                     "&prop=info|pageviews|revisions&rvprop=content&rvslots=main&pvipdays=30").then(function (j) {
        var ps = ((j.query && j.query.pages) || []).filter(function (p) { return !p.missing && p.title && p.length > 0; }).slice(0, N);
        if (ps.length < N) throw new Error("頭数が足りない");
        var byId = {};
        var field = ps.map(function (p) {
          var rv = p.revisions && p.revisions[0], src = rv && rv.slots && rv.slots.main ? rv.slots.main.content : "";
          var h = { id: p.pageid, title: p.title, text: plainText(src || ""), pv: p.pageviews ? sumViews(p.pageviews) : null };
          byId[p.pageid] = h;
          return h;
        });
        /* 閲覧数の続き（最大4回）。取れなかった記事は0回扱い */
        var ids = field.map(function (h) { return h.id; }).join("|");
        function more(cont, n) {
          if (!cont || n >= 4) return field;
          return getJSON(API + "&prop=pageviews&pvipdays=30&pageids=" + ids + "&pvipcontinue=" + encodeURIComponent(cont)).then(function (v) {
            ((v.query && v.query.pages) || []).forEach(function (p) { if (p.pageviews && byId[p.pageid]) byId[p.pageid].pv = sumViews(p.pageviews); });
            return more(v.continue && v.continue.pvipcontinue, n + 1);
          }, function () { return field; });
        }
        return Promise.resolve(more(j.continue && j.continue.pvipcontinue, 0)).then(function (f) {
          f.forEach(function (h) { if (h.pv == null) h.pv = 0; });
          return f;
        });
      });
    }
  };
  function source() { return window.__wikiSource || wikiSource; }

  /* 記事の原稿から記号を取り除いて、読める本文だけにする（おおまかでよい） */
  function plainText(w) {
    var s = String(w), prev;
    s = s.replace(/<!--[\s\S]*?-->/g, "");
    s = s.replace(/<ref[^>]*\/>/gi, "").replace(/<ref[\s\S]*?<\/ref>/gi, "");
    s = s.replace(/<(gallery|math|syntaxhighlight|source|timeline|score|graph|mapframe)[\s\S]*?<\/\1>/gi, "");
    do { prev = s; s = s.replace(/\{\{[^{}]*\}\}/g, ""); } while (s !== prev);          /* 枠（入れ子も内側から） */
    do { prev = s; s = s.replace(/\{\|[\s\S]*?\|\}/g, ""); } while (s !== prev);       /* 表 */
    do {                                                                                  /* リンク（内側から） */
      prev = s;
      s = s.replace(/\[\[([^\[\]]*)\]\]/g, function (m, inner) {
        if (/^\s*(ファイル|画像|File|Image|Category|カテゴリ|Media):/i.test(inner)) return "";
        var parts = inner.split("|");
        return parts[parts.length - 1];
      });
    } while (s !== prev);
    s = s.replace(/\[https?:\/\/[^\s\]]+\s+([^\]]*)\]/g, "$1").replace(/\[https?:\/\/[^\]]*\]/g, "");
    s = s.replace(/<[^>]+>/g, "");
    s = s.replace(/__[A-Z]+__/g, "");
    s = s.replace(/'{2,}/g, "");
    s = s.replace(/^=+\s*(.*?)\s*=+\s*$/gm, "$1");
    s = s.replace(/^[*#:;]+\s*/gm, "");
    s = s.replace(/^-{4,}\s*$/gm, "");                                              /* 区切り線 */
    s = s.replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
    return s.replace(/\s+/g, " ").trim();
  }

  /* ============ 決まりごと ============ */
  var START_MONEY = 1000, UNIT = 100, RACES = 3;
  var TAKE = 0.8;                               /* 賭け金のうち払い戻しに回る割合（胴元の取り分2割） */
  /* 枠の色（8頭立てなので1枠1頭） */
  var FRAME_OF = [1, 2, 3, 4, 5, 6, 7, 8];
  var FRAME_COL = [null,
    { bg: "#f4f4f2", fg: "#1a1a1a" }, { bg: "#1e1e22", fg: "#ffffff" }, { bg: "#d63a3a", fg: "#ffffff" }, { bg: "#2f6fd6", fg: "#ffffff" },
    { bg: "#f2d23a", fg: "#1a1a1a" }, { bg: "#2e9a4f", fg: "#ffffff" }, { bg: "#f08a24", fg: "#ffffff" }, { bg: "#f59ac0", fg: "#1a1a1a" }];
  function frameCol(i) { return FRAME_COL[FRAME_OF[i]]; }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[r]; a[r] = t; }
    return a;
  }
  function comma(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  /* 倍率。観客は閲覧数に応じて賭ける（閲覧数0でも少しは賭ける人がいる） */
  function makeOdds(field) {
    var w = field.map(function (h) { return Math.pow(h.pv + 20, 0.45); });   /* 差をゆるめに: 1番人気が2倍前後、大穴が30倍前後 */
    var sum = w.reduce(function (a, b) { return a + b; }, 0);
    return w.map(function (x) { return Math.max(1.1, Math.min(999.9, Math.floor(TAKE / (x / sum) * 10) / 10)); });
  }
  function oddsText(o) { return "×" + o.toFixed(1); }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };

    if (inside(pileRect(), x, y)) { takeBack(); return; }

      if (n) { if (players !== n) { players = n; audioOn(); sndPick(); } return; }   /* 人数を選ぶだけで、始めない */
    }
    startButton.click();
  });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO; phase = "intro"; T = 0; pt = 0; money = START_MONEY; shown = money; score = 0; raceNo = 0;
  order = []; odds = []; popRank = []; flyers = []; clearBets();
  startButton.hidden = false;
  layout();
  var lastT = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    if (!window.__recordManual) { if (state === S.INTRO) T += dt; update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
