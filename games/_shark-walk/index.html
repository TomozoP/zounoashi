<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>サメ</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
</div></div>
<script src="../share.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="walk.js"></script>
<script>
/* サメ

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  var walker = SharkWalk(), camera = 0, accumulator=0, activePointer=null;
  var shark = new Image(), limbs = new Image(); shark.src="img/shark.webp"; limbs.src="img/limbs.webp";
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound() {
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    walker=SharkWalk();camera=0;accumulator=0;activePointer=null;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;

    accumulator+=dt;while(accumulator>=1/60){walker.update(1/60);accumulator-=1/60;} camera=Math.max(0,walker.now().x-235);
    score=Math.round(T*10)/10;
    if(walker.now().x>=2500){state=S.RESULT;held=false;tone(880,.3,.1); }
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "share") doShare();
      else if (hit === "retry") newRound();
      return;
    }
    if(held)return;
    held = true;
    /* ▼UPDATE: 押したときの処理 */
    walker.advance();
    tone(130,.055,.035,"sine",75);
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    if(state===S.PLAY)walker.advance();
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    if(e.isPrimary===false||e.button>0||activePointer!==null)return;
    activePointer=e.pointerId;if(wrap.setPointerCapture)wrap.setPointerCapture(e.pointerId);
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { if(e.pointerId!==activePointer)return;activePointer=null;e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { activePointer=null;held=false; });
  window.addEventListener("blur", function () { activePointer=null;held=false; });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    zShare({ text: score + "秒 #サメ" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var floor=H*.64;
    var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#d8f3f5");sky.addColorStop(1,"#f7f2df");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff9db";ctx.beginPath();ctx.arc(420,135,53,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#aeced0";ctx.beginPath();ctx.moveTo(0,floor);for(var x=0;x<=W;x+=15)ctx.lineTo(x,floor-85-28*Math.sin((x+camera*.2)/130));ctx.lineTo(W,floor);ctx.fill();
    ctx.save();ctx.translate(-camera,floor);
    ctx.beginPath();ctx.moveTo(camera-20,H);for(var x=camera-20;x<camera+W+30;x+=8)ctx.lineTo(x,walker.ground(x));ctx.lineTo(camera+W+30,H);ctx.closePath();ctx.fillStyle="#e1cda4";ctx.fill();ctx.strokeStyle="#6f8b72";ctx.lineWidth=7;ctx.stroke();
    for(var x=Math.floor(camera/90)*90;x<camera+W;x+=90){ctx.fillStyle="#baa781";ctx.fillRect(x,walker.ground(x)+28,15,3);}
    ctx.fillStyle="#334c57";ctx.fillRect(2500,-205,6,205);
    for(var i=0;i<4;i++)for(var j=0;j<3;j++){ctx.fillStyle=(i+j)%2?"#fff":"#263d48";ctx.fillRect(2506+i*17,-205+j*17,17,17);}
    function piece(img,sx,sy,sw,sh,a,b,width,top){
      if(!img.complete||!img.naturalWidth)return;
      var dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
      ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(dy,dx)-Math.PI/2);
      ctx.drawImage(img,sx,sy,sw,sh,-width/2,-(top||0),width,len+(top||0)+3);ctx.restore();
    }
    function leg(i){var a=walker.rear,b=walker.feet[i],k=walker.knee(a,b,76,1);piece(limbs,140,20,300,710,a,k,37,5);piece(limbs,140,700,410,810,k,b,51,3);}
    function arm(i){var a=walker.front,b=walker.hands[i],k=walker.knee(a,b,45,-1);piece(limbs,655,65,285,625,a,k,31,5);piece(limbs,705,650,265,735,k,b,29,3);}
    ctx.globalAlpha=.7;leg(1);arm(1);ctx.globalAlpha=1;
    var r=walker.rear,f=walker.front;ctx.save();ctx.translate((r.x+f.x)/2,(r.y+f.y)/2-27);ctx.rotate(Math.atan2(f.y-r.y,f.x-r.x));if(shark.complete&&shark.naturalWidth)ctx.drawImage(shark,-200,-95,380,190);ctx.restore();
    leg(0);arm(0);ctx.restore();
    ctx.fillStyle="#c3d8d5";roundRect(45,49,450,8,4);ctx.fill();ctx.fillStyle="#335f64";roundRect(45,49,450*Math.max(0,Math.min(1,(walker.now().x-222.5)/2277.5)),8,4);ctx.fill();
    // 文字の説明を足さず、接地と押している状態を円で見せる。
    ctx.beginPath();ctx.arc(270,H*.83,43,0,Math.PI*2);ctx.fillStyle=held?"#335f64":"#ffffffa0";ctx.fill();ctx.strokeStyle="#335f64";ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.moveTo(253,H*.83);ctx.lineTo(285,H*.83);ctx.moveTo(275,H*.83-10);ctx.lineTo(285,H*.83);ctx.lineTo(275,H*.83+10);ctx.strokeStyle=held?"#fff":"#335f64";ctx.stroke();

    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return Object.assign({ state: state, score: score, W: W, H: H },walker.now()); },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    frame: function(){draw();if(state===S.INTRO){var b=startButton.getBoundingClientRect(),c=canvas.getBoundingClientRect(),k=W/c.width,x=(b.left-c.left)*k,y=(b.top-c.top)*k;ctx.fillStyle="#fff";roundRect(x,y,b.width*k,b.height*k,34*k);ctx.fill();ctx.fillStyle="#16202e";ctx.font="bold "+(28*k)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("START",x+b.width*k/2,y+b.height*k/2);ctx.textBaseline="alphabetic";}return canvas;},
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for(var i=0;i<90&&state!==S.RESULT;i++){r.key();await r.wait(650);}
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer=null;
  document.addEventListener('pointerdown',function(e){
    if(!(state===S.INTRO))return;
    if(e.isPrimary===false||e.button>0)return;
    startingPointer=e.pointerId;
    e.stopImmediatePropagation();
  },true);
  document.addEventListener('pointerup',function(e){
    if(!(state===S.INTRO)||startingPointer!==e.pointerId)return;
    startingPointer=null;e.preventDefault();e.stopImmediatePropagation();startButton.click();
  },true);
  document.addEventListener('pointercancel',function(){startingPointer=null;},true);

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){if(e.stopPropagation)e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
