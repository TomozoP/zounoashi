<script>
/* 巨大プリンの中身（見た目ではなく、形と崩れ方）。window.Pudding
   形は格子の点ごとの「表面までの距離」f（中は負）で持つ。食べるとその場所を球でくり抜く。
   崩れるかどうかは、層ごとに「上に乗っている重さ ÷ その層の断面」と「重心のずれ」で決める。 */
(function (global) {
  "use strict";
  var h = 0.2;                       /* 格子の間隔(m) */
  var RB = 3.0, RT = 2.15, HT = 3.6; /* 底の半径・上の半径・高さ */
  var NX = 61, NY = 22, NZ = 61;     /* 点の数。y の 0 番は床の下（いつも空）、1 番が皿の高さ */
  var X0 = -(NX - 1) / 2 * h, Y0 = -h, Z0 = X0;
  var KG = 1050;                     /* 1m³ の重さ(kg) */
  var LIMIT = 2.0;                   /* これを超えたら崩れる */

  function smax(a, b, k) { var x = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + x * x * k * 0.25; }
  /* 元の形（台形の円柱、角は丸く） */
  function orig(x, y, z) {
    var r = Math.sqrt(x * x + z * z);
    var R = RB + (RT - RB) * Math.max(0, Math.min(1, y / HT));
    var side = (r - R) * 0.97;
    return smax(side, y - HT, 0.5);
  }

  /* カラメルの深さ（向きによって垂れる） */
  function caramelDepth(x, z) {
    var a = Math.atan2(z, x);
    var d = 0.42 + 0.08 * Math.sin(a * 5 + 1.3);
    var drip = Math.pow(Math.max(0, Math.sin(a * 9 + 0.7)), 10) * 1.3 + Math.pow(Math.max(0, Math.sin(a * 13 + 2.1)), 16) * 0.8;
    return d + drip;
  }
  function Field() {
    this.f = new Float32Array(NX * NY * NZ);
    this.car = new Float32Array(NX * NY * NZ);   /* カラメル(0〜1) */
    this.skin = new Float32Array(NX * NY * NZ);  /* 元の表面(1)か中(0)か */
    this.reset();
  }
  var P = Field.prototype;
  P.h = h; P.NX = NX; P.NY = NY; P.NZ = NZ; P.X0 = X0; P.Y0 = Y0; P.Z0 = Z0; P.HT = HT; P.RB = RB; P.RT = RT;
  P.orig = orig;
  P.idx = function (i, j, k) { return i + NX * (j + NY * k); };
  P.reset = function () {
    var f = this.f;
    for (var k = 0; k < NZ; k++) for (var j = 0; j < NY; j++) for (var i = 0; i < NX; i++) {
      var v = orig(X0 + i * h, Y0 + j * h, Z0 + k * h);
      if (j === 0 || i === 0 || k === 0 || i === NX - 1 || k === NZ - 1 || j === NY - 1) v = Math.max(v, h);
      var n0 = this.idx(i, j, k), x = X0 + i * h, y = Y0 + j * h, z = Z0 + k * h, o = orig(x, y, z);
      f[n0] = v;
      this.skin[n0] = o > -0.13 ? 1 : 0;
      var cd = caramelDepth(x, z), dep = HT - y;
      this.car[n0] = o > -0.13 && dep < cd ? 1 - Math.max(0, Math.min(1, dep / cd)) * 0.6 : 0;
    }
    this.ver = (this.ver || 0) + 1;
    this.vol0 = this.volume();
    this.S0 = 0;
    var a = this.analyze(true);
    this.S0 = a.s0;
    this.last = this.analyze();
  };
  /* 中身の量（境目はなめらかに数える） */
  P.occ = function (v) { return Math.max(0, Math.min(1, 0.5 - v / h)); };
  P.volume = function () {
    var s = 0, f = this.f;
    for (var n = 0; n < f.length; n++) if (f[n] < 0) s += this.occ(f[n]);
    return s * h * h * h;
  };
  P.eatenKg = function () { return Math.max(0, (this.vol0 - this.volume()) * KG); };

  /* 好きな場所の f（格子の間はなめらかにつなぐ。外は遠い） */
  P.sample = function (x, y, z, arr) {
    var gx = (x - X0) / h, gy = (y - Y0) / h, gz = (z - Z0) / h;
    if (gx < 0 || gy < 0 || gz < 0 || gx >= NX - 1 || gy >= NY - 1 || gz >= NZ - 1) {
      return Math.max(1, Math.max(Math.abs(x) + X0, y - 4, Math.abs(z) + X0));
    }
    var i = gx | 0, j = gy | 0, k = gz | 0, u = gx - i, v = gy - j, w = gz - k, f = arr || this.f;
    var a = this.idx(i, j, k), sx = 1, sy = NX, sz = NX * NY;
    var c00 = f[a] * (1 - u) + f[a + sx] * u, c10 = f[a + sy] * (1 - u) + f[a + sy + sx] * u;
    var c01 = f[a + sz] * (1 - u) + f[a + sz + sx] * u, c11 = f[a + sz + sy] * (1 - u) + f[a + sz + sy + sx] * u;
    return (c00 * (1 - v) + c10 * v) * (1 - w) + (c01 * (1 - v) + c11 * v) * w;
  };
  P.grad = function (x, y, z) {
    var e = 0.08;
    return [this.sample(x + e, y, z) - this.sample(x - e, y, z), this.sample(x, y + e, z) - this.sample(x, y - e, z), this.sample(x, y, z + e) - this.sample(x, y, z - e)];
  };

  /* 目から見ている先で、プリンに当たる所（無ければ null） */
  P.ray = function (o, d, reach) {
    for (var t = 0.1; t < reach; t += 0.04) {
      var x = o[0] + d[0] * t, y = o[1] + d[1] * t, z = o[2] + d[2] * t;
      if (y < 0) return null;
      if (this.sample(x, y, z) < 0) return { p: [x, y, z], t: t };
    }
    return null;
  };

  /* 球でくり抜く */
  /* 縦の筒（両端は丸い）でくり抜く。体で食べるとき */
  P.carveCapsule = function (cx, cz, y0, y1, r) {
    var f = this.f;
    var i0 = Math.max(1, Math.floor((cx - r - X0) / h)), i1 = Math.min(NX - 2, Math.ceil((cx + r - X0) / h));
    var j0 = Math.max(1, Math.floor((y0 - r - Y0) / h)), j1 = Math.min(NY - 2, Math.ceil((y1 + r - Y0) / h));
    var k0 = Math.max(1, Math.floor((cz - r - Z0) / h)), k1 = Math.min(NZ - 2, Math.ceil((cz + r - Z0) / h));
    for (var k = k0; k <= k1; k++) for (var j = j0; j <= j1; j++) for (var i = i0; i <= i1; i++) {
      var y = Y0 + j * h, dy = y < y0 ? y0 - y : y > y1 ? y - y1 : 0;
      var dx = X0 + i * h - cx, dz = Z0 + k * h - cz;
      var n = this.idx(i, j, k);
      f[n] = Math.max(f[n], r - Math.sqrt(dx * dx + dy * dy + dz * dz));
    }
    this.ver++;
  };
  P.carve = function (cx, cy, cz, r) {
    var f = this.f;
    var i0 = Math.max(1, Math.floor((cx - r - X0) / h)), i1 = Math.min(NX - 2, Math.ceil((cx + r - X0) / h));
    var j0 = Math.max(1, Math.floor((cy - r - Y0) / h)), j1 = Math.min(NY - 2, Math.ceil((cy + r - Y0) / h));
    var k0 = Math.max(1, Math.floor((cz - r - Z0) / h)), k1 = Math.min(NZ - 2, Math.ceil((cz + r - Z0) / h));
    for (var k = k0; k <= k1; k++) for (var j = j0; j <= j1; j++) for (var i = i0; i <= i1; i++) {
      var dx = X0 + i * h - cx, dy = Y0 + j * h - cy, dz = Z0 + k * h - cz;
      var n = this.idx(i, j, k);
      f[n] = Math.max(f[n], r - Math.sqrt(dx * dx + dy * dy + dz * dz));
    }
    this.ver++;
  };

  /* 崩れ具合を調べる。
     返すもの: risk（1が最初、LIMIT で崩れる）、lean（傾く向き）、collapse（崩れるなら { layer, dir, pivot, mode }） */
  P.analyze = function (init) {
    var f = this.f, self = this;
    /* 皿につながっていないかたまり */
    var solid = new Uint8Array(f.length), seen = new Uint8Array(f.length), q = new Int32Array(f.length), qn = 0;
    for (var n = 0; n < f.length; n++) solid[n] = f[n] < 0 ? 1 : 0;
    for (var k = 0; k < NZ; k++) for (var i = 0; i < NX; i++) for (var jj = 1; jj <= 2; jj++) { var b = this.idx(i, jj, k); if (solid[b] && !seen[b]) { seen[b] = 1; q[qn++] = b; } }
    var steps = [1, -1, NX, -NX, NX * NY, -NX * NY];
    for (var qi = 0; qi < qn; qi++) {
      var c = q[qi];
      for (var s = 0; s < 6; s++) { var m = c + steps[s]; if (m >= 0 && m < f.length && solid[m] && !seen[m]) { seen[m] = 1; q[qn++] = m; } }
    }
    var loose = 0, lx = 0, lz = 0;
    for (n = 0; n < f.length; n++) if (solid[n] && !seen[n]) { loose++; }
    /* 層ごとの量と重心 */
    var A = new Float32Array(NY), CX = new Float32Array(NY), CZ = new Float32Array(NY);
    for (k = 0; k < NZ; k++) for (var j = 1; j < NY; j++) for (i = 0; i < NX; i++) {
      var o = this.occ(f[this.idx(i, j, k)]);
      if (o > 0) { A[j] += o; CX[j] += o * (X0 + i * h); CZ[j] += o * (Z0 + k * h); }
    }
    var best = { risk: 0, layer: 1, dir: null, off: 0, e: 1, cx: 0, cz: 0 }, s0 = 0;
    var M = 0, MX = 0, MZ = 0;
    for (j = NY - 1; j >= 1; j--) {
      if (M > 0.5) {
        if (A[j] < 0.5) { best = { risk: 99, layer: j, dir: null, off: 0, e: 1, cx: 0, cz: 0 }; break; }
        var cx = CX[j] / A[j], cz = CZ[j] / A[j];
        var mx = MX / M - cx, mz = MZ / M - cz, off = Math.sqrt(mx * mx + mz * mz);
        var dx = off > 1e-4 ? mx / off : 1, dz = off > 1e-4 ? mz / off : 0;
        /* その向きの、層の端までの長さ */
        var e = h;
        for (k = 0; k < NZ; k++) for (i = 0; i < NX; i++) {
          if (f[this.idx(i, j, k)] < 0) { var pr = (X0 + i * h - cx) * dx + (Z0 + k * h - cz) * dz; if (pr > e) e = pr; }
        }
        var stress = M / A[j];
        if (stress > s0) s0 = stress;
        var risk = init ? 0 : (stress / this.S0) * (1 + 2.5 * off / e);
        if (risk > best.risk) best = { risk: risk, layer: j, dir: [dx, dz], off: off, e: e, cx: cx, cz: cz };
      }
      M += A[j]; MX += CX[j]; MZ += CZ[j];
    }
    var out = { risk: best.risk, s0: s0, lean: best.dir ? [best.dir[0] * Math.min(1, best.off / best.e * 3), best.dir[1] * Math.min(1, best.off / best.e * 3)] : [0, 0], loose: loose * h * h * h };
    var looseV = loose * h * h * h;
    if (!init && looseV > 0.05) {
      /* 宙に浮いたかたまりは、下にあるものの上まで落とす */
      out.collapse = { mode: "loose", layer: 0, keep: seen };
    } else if (!init && best.risk > LIMIT) {
      {
        var tip = false;   /* 横に倒れるのはなし。崩れたら上が真下へ落ちる（tomozo） */
        var y = Y0 + best.layer * h;
        out.collapse = {
          mode: tip ? "tip" : "squash", layer: best.layer, dir: best.dir || [1, 0],
          pivot: tip ? [best.cx + best.dir[0] * best.e, y, best.cz + best.dir[1] * best.e] : [best.cx, y, best.cz]
        };
      }
    } else if (loose > 0) {
      /* 小さいかけらはそのまま落ちて消える */
      for (n = 0; n < f.length; n++) if (solid[n] && !seen[n]) f[n] = h;
      this.ver++;
    }
    return out;
  };

  /* 崩れの段取り。上のかたまり（up[n]=1）が、倒れて・落ちて・つぶれた最後の形まで決める */
  P.plan = function (c) {
    var f = this.f, self = this, up = new Uint8Array(f.length), n, i, j, k;
    for (k = 0; k < NZ; k++) for (j = 0; j < NY; j++) for (i = 0; i < NX; i++) {
      n = this.idx(i, j, k);
      up[n] = c.mode === "loose" ? (c.keep[n] ? 0 : 1) : (j > c.layer ? 1 : 0);
    }
    var pl = { mode: c.mode, up: up, f0: f.slice(), pivot: c.pivot || [0, 0, 0], ax: c.dir ? [c.dir[1], 0, -c.dir[0]] : [1, 0, 0], ang: c.mode === "tip" ? 1.45 : 0, drop: 0, cx: 0, cz: 0, sy: c.mode === "tip" ? 0.72 : 0.62 };
    if (c.mode === "loose") pl.sy = 0.92;
    /* 回したあとの一番下と重心 */
    var minY = 1e9, sx = 0, sz = 0, cnt = 0;
    for (k = 0; k < NZ; k++) for (j = 0; j < NY; j++) for (i = 0; i < NX; i++) {
      n = this.idx(i, j, k);
      if (!up[n] || f[n] >= 0) continue;
      var q = this.rot(pl, [X0 + i * h, Y0 + j * h, Z0 + k * h], pl.ang);
      if (q[1] < minY) minY = q[1];
      sx += q[0]; sz += q[2]; cnt++;
    }
    if (!cnt) minY = 0;
    pl.drop = c.mode === "squash" ? Math.max(0, minY * 0.45) : Math.max(0, minY);
    if (c.mode === "loose") {
      /* 列ごとに、浮いたかたまりの一番下と、その下の支え（床か残る側）とのすき間。いちばん小さいすき間だけ落とす */
      var gap = 1e9;
      for (k = 1; k < NZ - 1; k++) for (i = 1; i < NX - 1; i++) {
        for (j = 1; j < NY - 1; j++) {
          n = this.idx(i, j, k);
          if (up[n] && f[n] < 0) {
            var js = 0;
            for (var jb = j - 1; jb >= 1; jb--) { var nb = this.idx(i, jb, k); if (!up[nb] && f[nb] < 0) { js = jb; break; } }
            var g2 = js ? (j - js - 1) * h : (j - 1) * h;
            if (g2 < gap) gap = g2;
            break;
          }
        }
      }
      pl.drop = gap < 1e8 ? Math.max(h * 0.5, gap + h * 0.5) : 0;
    }
    pl.cx = cnt ? sx / cnt : 0; pl.cz = cnt ? sz / cnt : 0;
    pl.base = minY - pl.drop;                /* つぶれるときの床（下のかたまりの上にのる高さ） */
    if (c.mode === "tip") pl.base = 0;
    pl.tLand = c.mode === "tip" ? 1.05 : c.mode === "loose" ? Math.sqrt(Math.max(0.05, pl.drop) / 4.9) : 0.6;
    pl.tEnd = pl.tLand + (c.mode === "loose" ? 0.6 : 1.4);
    return pl;
  };
  /* 支点のまわりに回す */
  P.rot = function (pl, p, a) {
    if (!a) return p.slice();
    var ax = pl.ax, c = Math.cos(a), s = Math.sin(a), x = p[0] - pl.pivot[0], y = p[1] - pl.pivot[1], z = p[2] - pl.pivot[2];
    var d = ax[0] * x + ax[1] * y + ax[2] * z;
    var cx = ax[1] * z - ax[2] * y, cy = ax[2] * x - ax[0] * z, cz = ax[0] * y - ax[1] * x;
    return [pl.pivot[0] + x * c + cx * s + ax[0] * d * (1 - c), pl.pivot[1] + y * c + cy * s + ax[1] * d * (1 - c), pl.pivot[2] + z * c + cz * s + ax[2] * d * (1 - c)];
  };
  /* t 秒目の姿（角度・落ちた量・つぶれ） */
  P.pose = function (pl, t) {
    var g, ang = 0, drop = 0, sy = 1;
    if (pl.mode === "tip") {
      ang = Math.min(pl.ang, 0.15 * t + 1.25 * t * t);
      g = ang / pl.ang; drop = pl.drop * g * g;
    } else {
      g = Math.min(1, t / pl.tLand); drop = pl.drop * g * g;
    }
    if (t > pl.tLand) {
      var e = t - pl.tLand, k = Math.min(1, e / 0.25);
      sy = pl.sy + (1 - pl.sy) * (1 - k) + (1 - pl.sy) * 0.9 * Math.exp(-e * 2.6) * Math.sin(e * 12);
      if (t >= pl.tEnd) sy = pl.sy;
    }
    return { ang: ang, drop: drop, sy: sy, sxz: 1 / Math.sqrt(sy) };
  };
  /* 最後の形を格子に焼きこむ（倒れたプリンもそのまま食べられる） */
  P.bake = function (pl) {
    var f = this.f, upF = new Float32Array(f.length), n, i, j, k;
    for (n = 0; n < f.length; n++) { upF[n] = pl.up[n] ? pl.f0[n] : Math.max(pl.f0[n], h); if (pl.up[n]) f[n] = Math.max(f[n], h); }
    var po = this.pose(pl, pl.tEnd + 1), ia = -po.ang, car0 = this.car.slice(), skin0 = this.skin.slice();
    for (k = 1; k < NZ - 1; k++) for (j = 1; j < NY - 1; j++) for (i = 1; i < NX - 1; i++) {
      var x = X0 + i * h, y = Y0 + j * h, z = Z0 + k * h;
      /* つぶれ・落下・回転を逆にたどって、元の場所の値を読む */
      var ox = pl.cx + (x - pl.cx) / po.sxz, oz = pl.cz + (z - pl.cz) / po.sxz, oy = pl.base + (y - pl.base) / po.sy + po.drop;
      var q = this.rot(pl, [ox, oy, oz], ia);
      var v = this.sample(q[0], q[1], q[2], upF) * Math.min(po.sy, 1);
      n = this.idx(i, j, k);
      if (v < f[n]) {
        f[n] = v;
        this.car[n] = Math.max(0, Math.min(1, this.sample(q[0], q[1], q[2], car0)));
        this.skin[n] = Math.max(0, Math.min(1, this.sample(q[0], q[1], q[2], skin0)));
      }
    }
    this.ver++;
  };

  /* 崩れを起こす（デバッグ） */
  P.forceCollapse = function (dir) {
    var y = Y0 + 6 * h;
    return { mode: "squash", layer: 6, dir: dir, pivot: [0, y, 0] };
  };

  global.Pudding = { Field: Field, LIMIT: LIMIT, KG: KG };
})(window);
</script>
<script>
/* 巨大プリン
   リアルな巨大プリンを一人称で食べ進める。崩れたら終わり。食べた重さが点数。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);

    if (n === 3 && state === S.PLAY) startCollapse(F.forceCollapse([-Math.sin(me.yaw), -Math.cos(me.yaw)]));
  }

  var KEYMAP = { KeyW: "f", ArrowUp: "f", KeyS: "b", ArrowDown: "b", KeyA: "l", KeyD: "r", ArrowLeft: "tl", ArrowRight: "tr", KeyQ: "tl", KeyE: "tr" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    if (e.key === "Escape") { e.preventDefault(); if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (KEYMAP[e.code]) { e.preventDefault(); keys[KEYMAP[e.code]] = true; return; }
    if (e.code === "Space" || e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (e.repeat) return;
      audioOn();
      if (state === S.RESULT) newRound();
    }
  });
  window.addEventListener("keyup", function (e) {
    if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = false; return; }
    if ((e.code === "Space" || e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
    if ((e.code === "Space" || e.key === "Enter") && state === S.SHOP && shopT > 0.4) startDive();
  });

  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  function doShare() {
    var ton = Math.round(F.vol0 * window.Pudding.KG / 1000), cups = fmt(F.vol0 * window.Pudding.KG * 10);
    window.zResultActions.x({ text: zT(
      ton + "トンの巨大プリン（ふつうのプリン" + cups + "個分）を" + dives + "回目で完食しました",
      "Finished a " + ton + "-ton giant pudding (" + cups + " regular puddings) on dive " + dives,
      ton + "톤 거대 푸딩(보통 푸딩 " + cups + "개분)을 " + dives + "번째에 다 먹었습니다",
      "第" + dives + "次吃完了" + ton + "吨的巨型布丁（相当于" + cups + "个普通布丁）",
      "第" + dives + "次吃完了" + ton + "噸的巨型布丁（相當於" + cups + "個普通布丁）"
    ) + zT(" #巨大プリン", " #GiantPudding", " #거대푸딩", " #巨型布丁", " #巨型布丁") });
  }

  /* ============ 描画 ============ */
  var confetti = window.zCelebrate ? window.zCelebrate.confetti() : null;
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(F); }) : function () { return null; };
  var hideUI = false;

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    /* 崩れそうなほど、ゆらゆら傾く */
    var over = Math.max(0, risk - 1);
    var sway = Math.sin(T * 2.1) * 0.006 * over * over;
    var lx = lean[0] * 0.02 * over * over + sway, lz = lean[1] * 0.02 * over * over;
    var shake = state === S.COLLAPSE && crashed ? Math.max(0, 0.12 * (1 - (col.t - col.plan.tLand) / 1.2)) : 0;
    if (confetti && state === S.RESULT) confetti.step(1 / 60, W, H);
    var s3 = scene3d(), drew = false;
    if (s3) {
      try {
        s3.sync({ me: [me.x, me.y, me.z], face: me.face, moving: me.moving, eating: eatGlow > 0 ? 1 : 0, bites: bites, wide: 0, intro: state === S.INTRO || state === S.SHOP ? 1 : 0, size: mouthK(), land: land, cherries: cherries, boost: boost > 0 ? Math.min(1, boost) : 0, yaw: me.yaw, pitch: me.pitch, walk: me.walk,
          wob: [wob[0] + lx, wob[1] + lz], spoon: spoon, collapse: state === S.COLLAPSE ? col : null, shake: shake });
        drew = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); if (window.console) console.error(e); }
    }
    if (!drew) { ctx.fillStyle = "#e9dccb"; ctx.fillRect(0, 0, W, H); }

    if (!hideUI && (state === S.PLAY || state === S.COLLAPSE)) drawHud();
    if (state === S.RESULT) drawResult();
    if (state === S.SHOP && !hideUI) drawShop();
  }
  /* 残り時間（上に小さく） */
  function drawHud() {
    var t = Math.max(0, Math.ceil(timeLeft));
    ctx.save();
    ctx.textAlign = "center"; ctx.font = "800 44px sans-serif";
    ctx.lineWidth = 7; ctx.strokeStyle = "rgba(40,20,5,.55)"; ctx.lineJoin = "round";
    ctx.strokeText(t, W / 2, 70);
    ctx.fillStyle = t <= 5 ? "#ff6a5a" : "#fff"; ctx.fillText(t, W / 2, 70);
    ctx.restore();
  }
  function shopLayout() {
    var cw = 440, ch = 104, x = (W - cw) / 2, y0 = H * 0.3, cards = [];
    for (var i = 0; i < UPS.length; i++) cards.push({ x: x, y: y0 + i * (ch + 18), w: cw, h: ch });
    return { cards: cards, go: { x: W / 2, y: Math.min(H - 90, y0 + 3 * (ch + 18) + 90), r: 54 } };
  }
  function drawShop() {
    shopT += 1 / 60;
    var L = shopLayout();
    ctx.save();
    ctx.fillStyle = "rgba(10,8,6,.45)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#f6c453"; ctx.font = "800 40px sans-serif";
    ctx.fillText("+" + gained + "P", W / 2, H * 0.13);
    ctx.fillStyle = "#fff"; ctx.font = "800 56px sans-serif";
    ctx.fillText(money + "P", W / 2, H * 0.2);
    L.cards.forEach(function (c, i) {
      var u = UPS[i], cost = upCost(u), ok = cost !== null && money >= cost;
      ctx.fillStyle = ok ? "rgba(255,248,230,.95)" : "rgba(255,248,230,.45)";
      roundRect(c.x, c.y, c.w, c.h, 22); ctx.fill();
      ctx.font = "56px sans-serif"; ctx.fillStyle = "#000"; ctx.fillText(u.icon, c.x + 60, c.y + c.h / 2 + 2);
      for (var d = 0; d < u.cost.length; d++) {
        ctx.beginPath(); ctx.arc(c.x + 130 + d * 30, c.y + c.h / 2, 10, 0, Math.PI * 2);
        ctx.fillStyle = d < lv[u.id] ? "#e0453a" : "rgba(60,40,20,.2)"; ctx.fill();
      }
      ctx.fillStyle = ok ? "#3a2410" : "rgba(58,36,16,.55)"; ctx.font = "800 38px sans-serif";
      ctx.fillText(cost === null ? "MAX" : cost + "P", c.x + c.w - 70, c.y + c.h / 2 + 2);
    });
    var g = L.go;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fillStyle = "#e0453a"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(g.x - 16, g.y - 24); ctx.lineTo(g.x + 26, g.y); ctx.lineTo(g.x - 16, g.y + 24); ctx.closePath();
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function clock(t) { var m = Math.floor(t / 60), sec = t - m * 60; return m + ":" + (sec < 10 ? "0" : "") + sec.toFixed(1); }
  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    ctx.font = "800 104px sans-serif";
    ctx.fillText(zT(dives + "回目", "Dive " + dives, dives + "회차", "第" + dives + "次", "第" + dives + "次"), W / 2, H * 0.45);
    ctx.restore();
    if (confetti) confetti.draw(ctx);
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: Math.round(kg), kg: kg, risk: risk, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { hideUI = true; shareButton.hidden = true; }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      debugKey(2);
      await r.wait(800);
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("終わらない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
