<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>歯車機関</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1c1612; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* 歯車機関

   指を置いた所から離した所までを直径にして歯車を描く。
   動力の歯車から、機械の歯車まで噛み合わせて、決められた向きに回せば機関が動く。
   描いた歯車はタップで外せる。全10台。結果は描いた歯車の枚数。
   遊びの計算は 540×800 の箱の座標（2D）でやり、見た目は scene3d.js の立体。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  function sndPlace() { noiseHit(0.12, 2600, 0.35, 3); tone(520, 0.12, 0.08, "triangle", 380); }
  function sndMesh() { noiseHit(0.06, 4200, 0.3, 6); noiseHit(0.06, 4200, 0.25, 6, 0.07); }
  function sndBad() { tone(140, 0.18, 0.12, "sawtooth", 90); }
  function sndRemove() { tone(700, 0.08, 0.08, "square", 1100); noiseHit(0.05, 3000, 0.15, 4); }
  function sndJam() { noiseHit(0.35, 900, 0.3, 8); tone(110, 0.3, 0.08, "sawtooth", 80); }
  function sndGlass() { tone(2400, 0.25, 0.05, "sine", 2600); tone(3100, 0.2, 0.04, "sine", 0, 0.05); }
  function sndClear() {
    /* 汽笛 */
    tone(523, 0.9, 0.09, "sine", 0, 0); tone(659, 0.9, 0.07, "sine", 0, 0); tone(784, 0.9, 0.05, "sine", 0, 0);
    noiseHit(1.0, 1800, 0.2, 1.5);
  }
  function sndTick(v) { noiseHit(0.03, 5200, v || 0.06, 8); }

  /* ============ 歯車の寸法 ============
     歯の間隔は全部同じ。半径は歯の数で決まるので、半径の和の距離に置けば必ず噛み合う。 */
  var PITCH = 16, NMIN = 10, NMAX = 50, TOL = 5;
  function rOf(n) { return n * PITCH / (2 * Math.PI); }
  function nOf(r) { return Math.max(NMIN, Math.min(NMAX, Math.round(r * 2 * Math.PI / PITCH))); }
  var RMIN = rOf(NMIN), RMAX = rOf(NMAX);
  var SPEED = 70;                              /* 歯の先が動く速さ（箱の座標/秒） */

  /* ============ 面 ============
     540×800 の箱の座標。
     drv: 動力 [x, y, 向き]（1=右回り、-1=左回り）
     tg: 機械 need=回す向き。kind: fan 羽根 / lamp 電球 / whistle 汽笛
     fix: 外せない歯車 [x, y, 歯数]、ob: 鉄の壁 [x, y, 幅, 奥行き]
     limit: 描ける枚数、pegs: 軸を立てられる所（あれば、ここにしか立てられない） */
  var STAGES = [
    { drv: [[150, 610, 1]], tg: [{ x: 360, y: 340, n: 20, need: 1, kind: "lamp" }] },
    { drv: [[130, 640, 1]], tg: [{ x: 410, y: 210, n: 20, need: -1, kind: "lamp" }], ob: [[220, 370, 110, 80]] },
    { drv: [[270, 650, 1]], tg: [{ x: 110, y: 230, n: 18, need: 1, kind: "lamp" }, { x: 430, y: 230, n: 18, need: -1, kind: "lamp" }], ob: [[240, 300, 60, 140]] },
    { drv: [[120, 660, 1]], tg: [{ x: 420, y: 230, n: 20, need: -1, kind: "lamp" }], pegs: [[228, 505], [243, 251], [420, 520], [110, 330], [400, 390]] },
    { drv: [[110, 680, 1]], tg: [{ x: 430, y: 170, n: 20, need: 1, kind: "lamp" }], ob: [[0, 430, 310, 34], [230, 270, 310, 34]] },
    { drv: [[270, 690, 1]], tg: [{ x: 100, y: 190, n: 18, need: 1, kind: "lamp" }, { x: 440, y: 190, n: 18, need: 1, kind: "lamp" }], ob: [[190, 260, 160, 40]] },
    { drv: [[120, 680, 1]], fix: [[120, 543, 30], [330, 380, 26]], tg: [{ x: 430, y: 170, n: 18, need: -1, kind: "lamp" }], limit: 2 },
    { drv: [[270, 690, 1]], tg: [{ x: 268, y: 186, n: 20, need: 1, kind: "lamp" }],
      pegs: [[199, 567], [251, 423], [192, 288], [390, 560], [400, 380], [340, 280], [100, 420]] },
    { drv: [[110, 690, 1], [430, 690, -1]], tg: [{ x: 130, y: 200, n: 18, need: -1, kind: "lamp" }, { x: 410, y: 200, n: 18, need: -1, kind: "lamp" }], ob: [[255, 120, 30, 300]] },
    { drv: [[270, 700, 1]], fix: [[270, 578, 24]], tg: [{ x: 100, y: 160, n: 16, need: 1, kind: "lamp" }, { x: 440, y: 160, n: 16, need: -1, kind: "lamp" }],
      ob: [[0, 420, 150, 30], [390, 420, 150, 30]], limit: 5 }
  ];
  var BOX_H = 800;

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", CLEAR: "clear", ENDING: "ending", RESULT: "result" };
  var state, T = 0, held = false, keyMode = false;
  var stageNo = 0, gears = null, obs = [], pegs = null, limit = 0, clearT = 0, usedTotal = 0, flash = [], endT = 0, litCount = 0;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    usedTotal = 0;
    held = false;
    loadStage(0);
  }
  function loadStage(i) {
    stageNo = i;
    var st = STAGES[i];
    gears = [];
    obs = (st.ob || []).map(function (o) { return { x: o[0], y: o[1], w: o[2], h: o[3] }; });
    st.drv.forEach(function (d) {
      var g = mk(d[0], d[1], 24, "drv"); g.dir0 = d[2]; gears.push(g);
      /* 動力の釜。歯車の下から箱の底まで */
      obs.push({ x: d[0] - 58, y: d[1] + 52, w: 116, h: BOX_H + 60 - d[1] - 52, boiler: true, drv: g });
    });
    (st.fix || []).forEach(function (f) { gears.push(mk(f[0], f[1], f[2], "fix")); });
    st.tg.forEach(function (t) { var g = mk(t.x, t.y, t.n, "tg"); g.need = t.need; g.kind = t.kind; gears.push(g); });
    pegs = st.pegs || null;
    limit = st.limit || 0;
    drag = null; flash = [];
    wasJam = false; wasStopTurn = false;
    var sc = scene3d();
    if (sc) sc.load(st, obs, pegs);
    loadedFor = sc ? stageNo : -1;
    solve();
  }
  var loadedFor = -1;
  function mk(x, y, n, type) {
    return { x: x, y: y, n: n, r: rOf(n), type: type, a0: 0, w: 0, dir: 0, jam: false, shake: 0, born: T, t0: T };
  }
  function myCount() { var c = 0; gears.forEach(function (g) { if (g.type === "my") c++; }); return c; }

  /* ============ 噛み合わせ ============ */
  var wasJam = false, wasStopTurn = false;
  function meshes(a, b) { return Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - (a.r + b.r)) <= TOL; }
  function solve() {
    var j, bad = [];
    gears.forEach(function (g) { g.dir = 0; g.w = 0; g.jam = false; });
    var q = [];
    gears.forEach(function (g) { if (g.type === "drv") { g.dir = g.dir0; q.push(g); } });
    while (q.length) {
      var a = q.shift();
      for (j = 0; j < gears.length; j++) {
        var b = gears[j];
        if (b === a || !meshes(a, b)) continue;
        if (b.dir === 0) {
          b.dir = -a.dir;
          /* 噛み合う角度に歯をそろえる */
          var phi = Math.atan2(b.y - a.y, b.x - a.x);
          var u = ((phi - a.a0) * a.n / (2 * Math.PI)) % 1; if (u < 0) u += 1;
          b.a0 = phi + Math.PI - (2 * Math.PI / b.n) * (0.5 - u); b.t0 = a.t0;
          q.push(b);
        } else if (b.dir === a.dir) bad.push(a);
      }
    }
    /* 向きがぶつかった所から、つながっている歯車は全部止まる */
    while (bad.length) {
      var g = bad.pop();
      if (g.jam) continue;
      g.jam = true;
      for (j = 0; j < gears.length; j++) if (!gears[j].jam && gears[j] !== g && meshes(g, gears[j])) bad.push(gears[j]);
    }
    var jam = false;
    gears.forEach(function (g) {
      if (g.jam) { jam = true; g.w = 0; }
      else if (g.dir) g.w = g.dir * SPEED / g.r;
    });
    if (jam && !wasJam) sndJam();
    wasJam = jam;
    var stopTurn = gears.some(function (g) { return g.type === "tg" && g.need === 0 && g.w !== 0; });
    if (stopTurn && !wasStopTurn) sndGlass();
    wasStopTurn = stopTurn;
  }
  function targetsOk() {
    if (wasJam) return false;
    for (var i = 0; i < gears.length; i++) {
      var g = gears[i];
      if (g.type !== "tg") continue;
      if (g.need === 0 ? g.dir !== 0 : g.dir !== g.need) return false;
    }
    return true;
  }
  function angleOf(g) { return g.a0 + g.w * (T - (g.t0 || 0)); }
  /* 解き直す前に今の角度を残しておき、置き直しで歯がぱっと跳ばないようにする */
  function reanchor() { gears.forEach(function (g) { g.a0 = angleOf(g); g.t0 = T; }); }

  /* ============ 描いている途中の歯車 ============ */
  var drag = null;
  function circleRect(x, y, r, o) {
    var cx = Math.max(o.x, Math.min(x, o.x + o.w)), cy = Math.max(o.y, Math.min(y, o.y + o.h));
    return Math.hypot(x - cx, y - cy) < r;
  }
  function twoCircle(x1, y1, r1, x2, y2, r2, px, py) {
    var d = Math.hypot(x2 - x1, y2 - y1);
    if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return null;
    var a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
    var mx = x1 + a * (x2 - x1) / d, my = y1 + a * (y2 - y1) / d;
    var ox = -(y2 - y1) / d * h, oy = (x2 - x1) / d * h;
    var p1 = [mx + ox, my + oy], p2 = [mx - ox, my - oy];
    return Math.hypot(p1[0] - px, p1[1] - py) < Math.hypot(p2[0] - px, p2[1] - py) ? p1 : p2;
  }
  /* 回してはいけない機械には吸い付かせない */
  function snapTo(g) { return !(g.type === "tg" && g.need === 0); }
  /* 指の位置と半径から、近くの歯車にぴたりと噛むように半径と軸を寄せる。
     軸の穴がある面では軸は動かさず、半径だけ寄せる */
  function fit(cx, cy, r, fixedAxis) {
    var best = null, i, g;
    for (i = 0; i < gears.length; i++) {
      g = gears[i];
      if (!snapTo(g)) continue;
      var rr = Math.hypot(cx - g.x, cy - g.y) - g.r;
      if (rr < RMIN - 4 || rr > RMAX + 4) continue;
      var e = Math.abs(rr - r);
      if (e < 24 && (!best || e < best.e)) best = { g: g, rr: rr, e: e };
    }
    var n = nOf(r), x = cx, y = cy;
    if (fixedAxis) {
      /* 軸の穴：引いた大きさの近くで、いちばん多くの歯車に噛む歯の数を選ぶ */
      var top = null;
      for (var dn = -4; dn <= 4; dn++) {
        var nn = nOf(r) + dn;
        if (nn < NMIN || nn > NMAX) continue;
        var rr2 = rOf(nn), cnt = 0, bad = false;
        for (i = 0; i < gears.length; i++) {
          var dd2 = Math.hypot(cx - gears[i].x, cy - gears[i].y);
          if (dd2 < gears[i].r + rr2 - TOL) bad = true;
          else if (dd2 <= gears[i].r + rr2 + TOL) cnt++;
        }
        if (bad || !cnt) continue;
        if (!top || cnt > top.cnt || (cnt === top.cnt && Math.abs(dn) < Math.abs(top.dn))) top = { n: nn, cnt: cnt, dn: dn };
      }
      if (top) { n = top.n; best = null; }
    }
    if (best) {
      n = nOf(best.rr);
      if (!fixedAxis) {
        var R = best.g.r + rOf(n), d = Math.hypot(cx - best.g.x, cy - best.g.y) || 1;
        x = best.g.x + (cx - best.g.x) / d * R; y = best.g.y + (cy - best.g.y) / d * R;
        /* もう1つにも届きそうなら、両方に噛む位置へ。
           縁から縁へ描くとぎりぎり届かない大きさになりやすいので、歯の数を少し増減して探す */
        var pick = null;
        for (i = 0; i < gears.length; i++) {
          var h = gears[i];
          if (h === best.g || !snapTo(h)) continue;
          for (var dn = -2; dn <= 6; dn++) {
            var n2 = n + dn;
            if (n2 < NMIN || n2 > NMAX) continue;
            var rn = rOf(n2);
            var p = twoCircle(best.g.x, best.g.y, best.g.r + rn, h.x, h.y, h.r + rn, cx, cy);
            if (!p) continue;
            var sh = Math.hypot(p[0] - cx, p[1] - cy), score = sh + Math.abs(dn) * 4;
            if (sh < 44 && (!pick || score < pick.score)) pick = { p: p, n: n2, score: score };
          }
        }
        if (pick) { x = pick.p[0]; y = pick.p[1]; n = pick.n; }
      }
    }
    var c = { x: x, y: y, n: n, r: rOf(n), ok: true, mesh: false };
    if (limit && myCount() >= limit) c.ok = false;
    if (x - c.r < 4 || x + c.r > W - 4 || y - c.r < 10 || y + c.r > BOX_H + 40) c.ok = false;
    for (i = 0; i < obs.length && c.ok; i++) if (circleRect(x, y, c.r - 3, obs[i])) c.ok = false;
    for (i = 0; i < gears.length && c.ok; i++) {
      g = gears[i];
      var dd = Math.hypot(x - g.x, y - g.y);
      if (dd < g.r + c.r - TOL) c.ok = false;
      else if (dd <= g.r + c.r + TOL) c.mesh = true;
    }
    return c;
  }
  function gearAt(x, y) {
    for (var i = gears.length - 1; i >= 0; i--) {
      var g = gears[i];
      if (Math.hypot(x - g.x, y - g.y) < g.r + 4) return g;
    }
    return null;
  }
  function pegAt(x, y) {
    var best = null, bd = 34;
    pegs.forEach(function (p) {
      var d = Math.hypot(x - p[0], y - p[1]);
      if (d < bd && !gears.some(function (g) { return g.x === p[0] && g.y === p[1]; })) { bd = d; best = p; }
    });
    return best;
  }
  function addGear(c) {
    var before = gears.filter(function (k) { return k.dir !== 0; }).length;
    reanchor();
    gears.push(mk(c.x, c.y, c.n, "my"));
    solve();
    var after = gears.filter(function (k) { return k.dir !== 0; }).length;
    sndPlace();
    if (after > before && !wasJam) sndMesh();
  }

  /* ============ 進行 ============ */
  var tickAcc = 0;
  function update(dt) {
    if (state === S.ENDING || state === S.RESULT) { T += dt; updateEnding(dt); return; }
    if (state === S.INTRO) { T += dt; return; }
    T += dt;
    var i;
    for (i = 0; i < gears.length; i++) if (gears[i].shake > 0) gears[i].shake = Math.max(0, gears[i].shake - dt);
    for (i = flash.length - 1; i >= 0; i--) { flash[i].t -= dt; if (flash[i].t <= 0) flash.splice(i, 1); }
    if (state === S.PLAY) {
      tickAcc += dt;
      if (tickAcc > 0.22) { tickAcc = 0; if (!wasJam) sndTick(0.03); }
      if (!drag && targetsOk()) {
        state = S.CLEAR; clearT = 0; usedTotal += myCount(); sndClear();
      }
    } else {
      clearT += dt;
      if (clearT > 2.6) {
        if (stageNo + 1 < STAGES.length) { loadStage(stageNo + 1); state = S.PLAY; }
        else startEnding();
      }
    }
  }
  /* 全部動いたら、工場に明かりがついて動き出す */
  function startEnding() {
    state = S.ENDING; endT = 0; litCount = 0;
    tone(70, 1.2, 0.12, "sine", 110);                     /* 電源が入る低い音 */
  }
  function updateEnding(dt) {
    var before = endT;
    endT += dt;
    if (before < 2.8 && endT >= 2.8) {
      sndClear();
      /* 工場のうなり */
      tone(55, 3.5, 0.07, "sawtooth", 58); tone(110, 3.5, 0.03, "square", 112);
      for (var k = 0; k < 8; k++) noiseHit(0.06, 3000, 0.12, 6, 0.25 * k);
    }
    if (endT >= 4.3 && state === S.ENDING) finish();
  }
  function finish() {
    state = S.RESULT;
    tone(523, 0.15, 0.1, "triangle", 0, 0); tone(659, 0.15, 0.1, "triangle", 0, 0.15); tone(784, 0.4, 0.1, "triangle", 0, 0.3);
  }

  /* ============ 入力 ============
     down / move / up は箱の座標で受ける（画面の点からの変換は toBox） */
  var tapStart = null, lastP = null;
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) return;
    if (state !== S.PLAY || x == null) return;
    held = true;
    var g = gearAt(x, y);
    tapStart = { x: x, y: y, g: g };
    lastP = { x: x, y: y };
    drag = null;
    if (pegs) {
      /* 軸の穴の面は、穴から半径を引き出す */
      if (g) return;
      var p = pegAt(x, y);
      if (!p) { sndBad(); flash.push({ x: x, y: y, t: 0.3, peg: true }); return; }
      drag = { sx: p[0], sy: p[1], cx: p[0], cy: p[1], r: 0, fit: null, peg: true };
    } else drag = { sx: x, sy: y, cx: x, cy: y, r: 0, fit: null };   /* 押した所から離す所までが直径 */
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    lastP = { x: x, y: y };
    if (!drag) return;
    if (drag.peg) drag.r = Math.hypot(x - drag.cx, y - drag.cy);
    else { drag.cx = (drag.sx + x) / 2; drag.cy = (drag.sy + y) / 2; drag.r = Math.hypot(x - drag.sx, y - drag.sy) / 2; }
    var pn = drag.fit ? drag.fit.n : 0;
    drag.fit = drag.r >= RMIN * 0.6 ? fit(drag.cx, drag.cy, Math.max(RMIN, drag.r), drag.peg) : null;
    /* 大きさ（歯の数）が変わるたびにカチッ */
    var nn = drag.fit ? drag.fit.n : 0;
    if (nn !== pn && nn) { noiseHit(0.025, 4600 + nn * 30, 0.22, 9); tone(1800 + nn * 20, 0.02, 0.025, "square"); }
  }
  function up() {
    if (!held) return;
    held = false;
    if (state !== S.PLAY) { drag = null; return; }
    var moved = lastP && tapStart ? Math.hypot(lastP.x - tapStart.x, lastP.y - tapStart.y) : 0;
    if (tapStart && tapStart.g && moved < 14) {
      if (tapStart.g.type === "my") {
        reanchor();
        gears.splice(gears.indexOf(tapStart.g), 1);
        solve(); sndRemove();
      } else { tapStart.g.shake = 0.3; sndBad(); }
    } else if (drag && drag.fit) {
      if (drag.fit.ok) addGear(drag.fit);
      else sndBad();
    }
    drag = null; tapStart = null;
  }
  /* 画面の点 → 箱の座標。立体が無いとき（テストの台など）は箱を縦の真ん中に置いた形で換算する */
  function toBox(px, py) {
    var sc = scene3d();
    if (sc) return sc.pick(px, py, W, H);
    return { x: px, y: py - (H - BOX_H) / 2 };
  }
  function resultDown(x, y) {
    var hit = x == null ? "retry" : hitButton(x, y);
    if (hit === "retry") newRound();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e);
    if (state === S.RESULT) { resultDown(p.x, p.y); return; }
    var b = toBox(p.x, p.y); down(b.x, b.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e), b = toBox(p.x, p.y); move(b.x, b.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外だけ、数字キーで場面を飛ばせる。1 今の台をクリア、2 次の台へ、3 結果、4 最終台へ */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state === S.INTRO) newRound();
    if (n === 1 && state === S.PLAY) { forceRun(); state = S.CLEAR; clearT = 0; sndClear(); }
    if (n === 2 && stageNo + 1 < STAGES.length) { loadStage(stageNo + 1); state = S.PLAY; }
    if (n === 3) { loadStage(STAGES.length - 1); startEnding(); }
    if (n === 4) { loadStage(STAGES.length - 1); state = S.PLAY; }
  }
  /* 1キー用。機械を正しい向きに回して見せる */
  function forceRun() {
    reanchor();
    gears.forEach(function (g) {
      g.jam = false;
      if (g.type === "tg") { g.dir = g.need; g.w = g.need * SPEED / g.r; }
    });
    wasJam = false;
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    if (state === S.RESULT) resultDown();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function doShare() {
    window.zResultActions.x({ text: zT("歯車を描いて描いて描きまくり、止まっていた工場を動かした", "Drew gear after gear until the dead factory roared back to life") + zT(" #歯車機関", " #GearEngine") });
  }

  /* ============ 描画 ============ */
  var scene3d = window.Z3 ? Z3.lazy(function () { return new GearScene(PITCH); }) : function () { return null; };
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function iconGear(x, y, r, n, fill) {
    ctx.beginPath();
    for (var k = 0; k < n * 2; k++) {
      var a = k * Math.PI / n, rr = k % 2 ? r * 0.78 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r * 0.3, 0, Math.PI * 2); ctx.fillStyle = "#1c1612"; ctx.fill();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    var sc = scene3d();
    if (sc && loadedFor !== stageNo) { sc.load(STAGES[stageNo], obs, pegs); loadedFor = stageNo; }
    var drew = false;
    if (sc) {
      try {
        var running = state === S.CLEAR || state === S.RESULT;
        sc.sync({
          t: T, dt: Math.max(0, Math.min(0.1, T - lastDrawT)), running: running, showArrows: state === S.PLAY || state === S.INTRO,
          gears: gears.map(function (g) {
            return { g: g, angle: angleOf(g), shake: g.jam || g.shake > 0, jam: g.jam, turning: g.w !== 0, born: g.type === "my" ? Math.min(1, (T - g.born) / 0.12) : 1 };
          }),
          preview: drag && drag.fit && state === S.PLAY ? drag.fit : null
        });
        var ending = state === S.ENDING || state === S.RESULT;
        var lit = sc.ending(ending ? endT : -1, Math.max(0, Math.min(0.1, T - lastDrawT)), W, H);
        if (lit > litCount) { noiseHit(0.04, 2200, 0.25, 5); tone(1400, 0.05, 0.03, "square"); }
        litCount = lit;
        lastDrawT = T;
        drew = sc.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); loadedFor = -1; }
    }
    if (!drew) { ctx.fillStyle = "#2a221c"; ctx.fillRect(0, 0, W, H); }
    /* 軸の穴の面で、穴のない所を押したとき */
    if (sc) flash.forEach(function (f) {
      var p = sc.toScreen(f.x, f.y, 0, W, H);
      ctx.beginPath(); ctx.arc(p.x, p.y, 14 + (0.3 - f.t) * 40, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,90,70," + (f.t * 3) + ")"; ctx.lineWidth = 3; ctx.stroke();
    });
    if (drag && sc && state === S.PLAY) {
      var c = sc.toScreen(drag.sx, drag.sy, 8, W, H);
      ctx.beginPath(); ctx.arc(c.x, c.y, 5, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
    }
    if (state === S.PLAY || state === S.CLEAR) drawHud();
    if (state === S.CLEAR) {
      var k = Math.min(1, clearT / 0.3) * (clearT > 2.2 ? Math.max(0, (2.6 - clearT) / 0.4) : 1);
      ctx.fillStyle = "rgba(255,240,200," + (0.12 * k) + ")"; ctx.fillRect(0, 0, W, H);
    }
    if (state === S.RESULT) drawResult();
  }

  var lastDrawT = 0;
  function drawHud() {
    if (window.__hideUI) return;
    /* 何台目か（丸の並び）と、描ける残りの枚数（歯車の印） */
    var n = STAGES.length, gap = 22, x0 = W / 2 - (n - 1) * gap / 2;
    for (var i = 0; i < n; i++) {
      ctx.beginPath(); ctx.arc(x0 + i * gap, 30, 6, 0, Math.PI * 2);
      ctx.fillStyle = i < stageNo || (i === stageNo && state === S.CLEAR) ? "#f2c14e" : i === stageNo ? "#fff" : "rgba(255,255,255,.25)";
      ctx.fill();
    }
    if (limit) {
      var left = limit - myCount(), g2 = 34, gx = W / 2 - (limit - 1) * g2 / 2;
      for (var j = 0; j < limit; j++) iconGear(gx + j * g2, 66, 13, 8, j < left ? "#d6a640" : "rgba(255,255,255,.18)");
    }
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.82;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    /* 今回は点数なし。動き出した工場を見せたまま、下にボタンだけ */
    var k = Math.min(1, (endT - 4.3) / 0.5);
    var gr = ctx.createLinearGradient(0, H * 0.6, 0, H);
    gr.addColorStop(0, "rgba(10,8,6,0)"); gr.addColorStop(1, "rgba(10,8,6," + (0.55 * k) + ")");
    ctx.fillStyle = gr; ctx.fillRect(0, H * 0.6, W, H * 0.4);
    ctx.globalAlpha = k;
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
    ctx.globalAlpha = 1;
  }

  /* ============ 覗き穴 ============
     put は箱の座標で「軸を押して、半径ぶん引いて、離す」のと同じこと（指で描くのと同じ道を通る） */
  window.__probe = {
    now: function () {
      return { state: state, stage: stageNo, used: usedTotal, mine: gears ? myCount() : 0, gears: gears ? gears.length : 0, jam: wasJam, limit: limit,
        targets: gears ? gears.filter(function (g) { return g.type === "tg"; }).map(function (g) { return { x: g.x, y: g.y, r: g.r, need: g.need, dir: g.dir }; }) : [],
        all: gears ? gears.map(function (g) { return { x: g.x, y: g.y, r: g.r, n: g.n, type: g.type, dir: g.dir }; }) : [],
        pegs: pegs, obs: obs.map(function (o) { return [o.x, o.y, o.w, o.h]; }), W: W, H: H };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    put: function (x, y, r) { if (pegs) { down(x, y); move(x + r, y); } else { down(x - r, y); move(x + r, y); } var f = drag && drag.fit; up(); return f; },
    remove: function (x, y) { down(x, y); up(); },
    load: function (i) { loadStage(i); state = S.PLAY; },
    rOf: rOf, STAGES: STAGES
  };
  window.__thumbnail = function () {
    newRound(); loadStage(9);
    [[150, 520, 30], [390, 520, 30]].forEach(function (p) { window.__probe.put(p[0], p[1], rOf(p[2])); });
    state = S.CLEAR; clearT = 1; forceRun();
    window.__hideUI = true;
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(2000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  loadStage(0);
  state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* update はいつもちょうど 1/60 秒ずつ（余りは次へ持ち越す） */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
