<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ミニカーチキンレース</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* ミニカーチキンレース

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  /* 単位は 1 = 100mm。机の端が z=0。z は車の重心（車の長さ 0.8 なので前の端は z-0.4） */
  var HALF = 0.4, DECEL = 4, GAIN = 4.6, PULL_MAX = 3, FLOOR = -7.5;
  var phase, L, z, y, pitch, w, v, vy, pull, wheel, side, fell, startY, lastClick, wobble, settleT, keyHold;
  var runOsc = null, runGain = null;

  function place() {}

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    phase = "aim";
    L = 6 + Math.random() * 4;
    z = L; y = 0; pitch = 0; w = 0; v = 0; vy = 0; pull = 0; wheel = 0; side = 0;
    fell = false; lastClick = 0; wobble = 0; settleT = 0; keyHold = false;
    runSound(0);
  }

  /* 引いた量から走る距離を決めて、離す */
  function launch() {
    if (pull < 0.05) { pull = 0; z = L; phase = "aim"; return; }
    var dist = GAIN * pull;
    v = Math.sqrt(2 * DECEL * dist);
    phase = "run";
    noiseHit(0.08, 2400, 0.12, 3);
  }
  function setPull(p) {
    p = Math.max(0, Math.min(PULL_MAX, p));
    if (Math.abs(p - lastClick) >= 0.06) { lastClick = p; tone(2200 + p * 300, 0.018, 0.05, "square"); }
    wheel -= (p - pull) / 0.09;
    pull = p;
    z = L + pull;
  }
  function stopCar() {
    phase = "settle"; settleT = 0;
    var over = HALF - z;
    score = Math.round(over * 100);
    if (over > 0.2) wobble = (over - 0.2) / 0.2 * 0.09;
    runSound(0);
    if (score >= 30) [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.18, 0.1, "triangle", null, i * 0.09); });
    else if (score >= 0) tone(880, 0.2, 0.08, "triangle");
  }
  function runSound(speed) {
    if (!AC) return;
    if (!runOsc && speed > 0) {
      runOsc = AC.createOscillator(); runGain = AC.createGain();
      runOsc.type = "sawtooth"; runGain.gain.value = 0;
      var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
      runOsc.connect(f); f.connect(runGain); runGain.connect(AC.destination); runOsc.start();
    }
    if (!runOsc) return;
    var n = AC.currentTime;
    runOsc.frequency.setTargetAtTime(60 + speed * 40, n, 0.03);
    runGain.gain.setTargetAtTime(speed > 0 ? Math.min(0.06, 0.012 + speed * 0.005) : 0, n, 0.04);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;

    if (phase === "aim" && keyHold) setPull(pull + dt * 0.9);
    if (phase === "run") {
      /* 減速は式どおりに進め、止まる位置が刻みでずれないようにする */
      var nv = v - DECEL * dt, dz = nv > 0 ? (v + nv) / 2 * dt : v * v / (2 * DECEL);
      z -= dz; wheel += dz / 0.09; v = Math.max(0, nv);
      runSound(v);
      if (z < 0) { phase = "fall"; fell = true; score = null; runSound(0); noiseHit(0.5, 600, 0.15, 0.7); }
      else if (v <= 0) { v = 0; stopCar(); }
    } else if (phase === "fall") {
      /* 重心が端を越えたら、前に回りながら落ちる */
      w += 26 * dt; pitch += w * dt;
      vy -= 98 * dt; y += vy * dt;
      z -= v * dt; wheel += v * dt / 0.09;
      if (y <= FLOOR) {
        y = FLOOR; pitch = Math.round(pitch / Math.PI) * Math.PI;
        noiseHit(0.35, 300, 0.35, 0.8); tone(140, 0.25, 0.15, "square", 60);
        phase = "settle"; settleT = 0;
      }
    } else if (phase === "settle") {
      settleT += dt;
      if (!fell) pitch = wobble * Math.exp(-settleT * 1.6) * Math.abs(Math.sin(settleT * 9));
    }
    if (phase === "run" || phase === "fall" || phase === "settle") {
      var near = phase === "run" ? Math.max(0, 1 - Math.max(0, z - 1.5) / 2.5) * 0.35 : 1;
      side += (Math.max(side, near) - side) * Math.min(1, dt * 3);
      if (phase !== "run") side = Math.min(1, side + dt * 0.9);
    }
    if (phase === "settle" && settleT > 2) state = S.RESULT;
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (phase !== "aim") return;
    held = true;
    if (x == null) { keyHold = true; return; }
    startY = y;
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    if (phase === "aim") setPull((y - startY) / 120);
  }
  function up() {
    if (!held) return;
    held = false;
    keyHold = false;
    if (state === S.PLAY && phase === "aim") launch();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1=ちょうどよく(+30mm) 2=落ちる 3=手前で止まる */
    if (state !== S.PLAY || phase !== "aim") newRound();
    var want = n === 1 ? L - HALF + 0.3 : n === 2 ? L + 1 : n === 3 ? L - 1.5 : null;
    if (want == null) return;
    setPull(want / (GAIN - 1)); launch();   /* 引いた分だけ後ろから走る */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    /* 英語のときのハッシュタグは英語のゲーム名にする（空白・記号は除く） */
    var text;
    if (score == null) text = zT("ミニカーを机から落としました", "My minicar flew off the table", "미니카를 책상에서 떨어뜨렸습니다", "迷你车从桌子上掉下去了", "迷你車從桌子上掉下去了");
    else if (score > 0) text = zT("ミニカーを机の端から" + score + "mmはみ出させて止めました", "Stopped my minicar hanging " + score + "mm off the table edge", "미니카를 책상 끝에서 " + score + "mm 튀어나오게 세웠습니다", "让迷你车探出桌边" + score + "mm停住了", "讓迷你車探出桌邊" + score + "mm停住了");
    else text = zT("ミニカーが机の端の" + (-score) + "mm手前で止まりました", "My minicar stopped " + (-score) + "mm before the table edge", "미니카가 책상 끝 " + (-score) + "mm 앞에서 멈췄습니다", "迷你车停在离桌边" + (-score) + "mm的地方", "迷你車停在離桌邊" + (-score) + "mm的地方");
    window.zResultActions.x({ text: text + zT(" #ミニカーチキンレース", " #MinicarChickenRace", " #미니카치킨레이스", " #迷你车胆量赛", " #迷你車膽量賽") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    /* ▼DRAW: ここに絵。立体の上に、文字やボタンを2Dで描く */
    var s3 = scene3d(), drew = false;
    if (s3) { try { s3.sync({ z: z, y: y, pitch: pitch, wheel: wheel, side: side, fall: fell }); drew = s3.draw(ctx, W, H); } catch (e) { scene3d.drop(); } }
    if (!drew) { ctx.fillStyle = "#1d1714"; ctx.fillRect(0, 0, W, H); }

    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない）。
     基本は doji5 の形（暗くして中央に白い大きなスコア）。
     盆栽・炒飯のように作ったものを見せるゲームは、暗くせず「作品を見せる形」にする：
       var L = window.zResultActions.showcase(W, H, { sizes: [104, 76, 30] });
       L.lines[i].y（textBaseline "top"）に上から文字、L.subject の枠の中央に作品を大きく、
       resultButtons() は L.buttons を返す。文字は上端から積むので画面からはみ出さない。 */
  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function scoreText() {
    if (score == null) return zT("落下", "FELL", "낙하", "掉落", "掉落");
    return (score > 0 ? "+" : "") + score + "mm";
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, phase: phase, z: z, L: L, score: score, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(800);
      debugKey(1);
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
