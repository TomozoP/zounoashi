<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ミニカーチキンレース</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>
<script src="../celebrate.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* ミニカーチキンレース

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  /* 単位は 1 = 100mm。車は -z の向きへ走る。z は車の重心（車の長さ 0.8 なので前後の端は z∓0.4） */
  var START_Z = 2.5, HALF = 0.4, DECEL = 4, GAIN = 4.6, GRAV = 28, STAGE = 10;   /* 1ステージ = トラップ10個 */
  var phase, z, x, y, pitch, roll, yaw, vx, vy, vz, spin, v, pull, wheel, base, startY, lastClick, endT, keyHold, crashZ;
  var traps, edgeZ, sx, sy, sz, crushBy, resT, keyAng = 0, goalZ, clearT, songStep, confetti = null;
  var runOsc = null, runGain = null;
  var KINDS = ["press", "hammer", "spinner", "pusher", "door"];

  function place() {}

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    phase = "aim";
    z = START_Z; x = 0; y = 0; pitch = 0; roll = 0; yaw = 0; vx = vy = vz = spin = 0;
    v = 0; pull = 0; wheel = 0; base = z; sx = sy = sz = 1; crushBy = null; resT = 0; clearT = null; songStep = 0; confetti = null; lastClick = 0; endT = 0; keyHold = false; crashZ = null;
    traps = []; edgeZ = 0;
    moreTraps();
    runSound(0);
  }

  /* 前のほうへトラップを足していく（どこまでも続く）。あとのものほど周期が短い */
  function moreTraps(ahead) {
    /* トラップ10個でゴール。その先はトラップのない道 */
    while (traps.length < STAGE) {
      var k = traps.length, a = 2.7 + Math.random() * 1.0, b = 2.7 + Math.random() * 1.0;
      var kind = k === 0 ? "press" : k === 1 ? "hammer" : KINDS[Math.floor(Math.random() * KINDS.length)];
      if (k > 1 && kind === traps[k - 1].kind) kind = KINDS[(KINDS.indexOf(kind) + 1 + Math.floor(Math.random() * 4)) % KINDS.length];
      var speedUp = Math.max(0.55, 1 - k * 0.025);
      traps.push({ k: k, kind: kind, z0: edgeZ, zc: edgeZ - a, z1: edgeZ - a - b,
        period: (kind === "spinner" ? 2.2 : 2.3) * speedUp * (0.85 + Math.random() * 0.3), off: Math.random(), pose: 0 });
      edgeZ -= a + b;
    }
    if (traps.length === STAGE) {
      traps.push({ k: STAGE, kind: "end", z0: edgeZ, zc: edgeZ - 6, z1: edgeZ - 12, period: 1, off: 0, pose: 0 });
      goalZ = edgeZ;
    }
  }

  /* 0〜1 を区切りで繋いだ動き。[[u, 値], ...] の間を直線で結ぶ */
  function ramp(u, pts) {
    for (var i = 1; i < pts.length; i++) if (u <= pts[i][0]) {
      var a = pts[i - 1], b = pts[i];
      return a[1] + (b[1] - a[1]) * (u - a[0]) / (b[0] - a[0]);
    }
    return pts[pts.length - 1][1];
  }
  /* トラップの今の形（pose）と、車（重心 cz）に当たるか。"hit" / "fall" / null */
  function trapPose(tr) {
    if (tr.kind === "end") return;
    var u = ((T / tr.period + tr.off) % 1 + 1) % 1;
    if (tr.kind === "press") tr.pose = ramp(u, [[0, 1], [0.5, 1], [0.58, 0], [0.75, 0], [1, 1]]);       /* 1=上がっている */
    else if (tr.kind === "hammer") tr.pose = 0.48 * Math.sin(u * Math.PI * 2);   /* 振れの角度（柱に当たらない幅） */
    else if (tr.kind === "spinner") tr.pose = u * Math.PI * 2;                                           /* 腕の向き */
    else if (tr.kind === "pusher") tr.pose = ramp(u, [[0, 0], [0.45, 0], [0.55, 1], [0.75, 1], [1, 0]]); /* 1=閉じている */
    else tr.pose = ramp(u, [[0, 0], [0.5, 0], [0.56, 1], [0.8, 1], [0.92, 0], [1, 0]]);                  /* 1=開いている */
  }
  function trapHit(tr, cz) {
    if (tr.kind === "end") return null;
    var d = cz - tr.zc, p = tr.pose;
    if (tr.kind === "press") return Math.abs(d) < 0.45 + HALF && 0.02 + p * 1.5 < 0.33 ? "hit" : null;
    if (tr.kind === "hammer") return Math.abs(d) < 0.3 + HALF && Math.abs(2.35 * Math.sin(p)) < 0.55 ? "hit" : null;
    if (tr.kind === "spinner") {
      var c = Math.cos(p);
      if (c < 1.4 / 2.8) return null;                                    /* 腕が道まで届いていない */
      return Math.abs(cz - (tr.zc + 1.4 * Math.tan(p))) < 0.08 + HALF ? "hit" : null;
    }
    if (tr.kind === "pusher") return Math.abs(d) < 0.4 + HALF && 1.15 - p * 1.0 < 0.22 ? "hit" : null;
    return Math.abs(d) < 0.6 && p > 0.4 ? "fall" : null;
  }

  /* カメラ用：車の前にある、まだ抜けていない一番近いトラップの奥の端 */
  function aheadZ() {
    for (var i = 0; i < traps.length; i++) if (traps[i].zc - 0.9 < z - HALF) return traps[i].zc - 1.2;
    return z - 4;
  }

  /* 引いた量から走る距離を決めて、離す */
  function launch() {
    if (pull < 0.05) { pull = 0; z = base; phase = "aim"; return; }
    v = Math.sqrt(2 * DECEL * GAIN * pull);
    phase = "run";
    noiseHit(0.08, 2400, 0.12, 3);
  }
  function setPull(p) {
    p = Math.max(0, p);                        /* 引ける量に上限はない */
    if (Math.abs(p - lastClick) >= 0.035) { lastClick = p; windClick(p); }
    wheel -= (p - pull) / 0.09;
    keyAng += (p - pull) * 9;                  /* 引くとお尻のネジが巻かれる */
    pull = p;
    z = base + pull;
  }
  /* 当たったトラップで壊れ方を変える。プレスはぺちゃんこ、閉じる壁は細く、振り子・回転バーは吹っ飛んでへこむ */
  /* ネジを巻く音：歯車の爪がカチカチ鳴り、巻くほど高く硬くなる */
  function windClick(p) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2600 + p * 900; f.Q.value = 6;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.35, n + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, n + 0.03);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + 0.05);
    tone(900 + p * 260, 0.025, 0.035, "square");
  }
  function crash(kind, tr) {
    phase = "crash"; crashZ = z; endT = 0; runSound(0);
    crushBy = tr && (tr.kind === "press" || tr.kind === "pusher") ? tr : null;
    if (crushBy) {
      vx = vy = vz = spin = 0; v = 0;
      noiseHit(0.45, 500, 0.45, 0.6); tone(120, 0.35, 0.18, "square", 50);
      tone(2400, 0.12, 0.05, "square", 900, 0.05);
    } else if (kind === "hit") {
      sz = 0.72; sy = 0.85;
      noiseHit(0.08, 3000, 0.2, 2);
      vx = (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 2); vy = 7; vz = -v * 0.4 - 1; spin = 9 + Math.random() * 6;
      noiseHit(0.3, 900, 0.4, 0.8); tone(180, 0.25, 0.15, "square", 70);
    } else {
      vx = 0; vy = 0; vz = -v; spin = 0;
      tone(700, 0.6, 0.1, "triangle", 120);
    }
  }
  function runSound(speed) {
    if (!AC) return;
    if (!runOsc && speed > 0) {
      runOsc = AC.createOscillator(); runGain = AC.createGain();
      runOsc.type = "sawtooth"; runGain.gain.value = 0;
      var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
      runOsc.connect(f); f.connect(runGain); runGain.connect(AC.destination); runOsc.start();
    }
    if (!runOsc) return;
    var n = AC.currentTime;
    runOsc.frequency.setTargetAtTime(60 + speed * 40, n, 0.03);
    runGain.gain.setTargetAtTime(speed > 0 ? Math.min(0.06, 0.012 + speed * 0.005) : 0, n, 0.04);
  }

  /* BGM（自作の節）。曲の位置は車の進み具合そのもの。進むと前へ流れ、ネジを巻いて下がると巻き戻り、
     ゴールでちょうど最後の和音になる。止まっている間は鳴らない。
     8小節 × 16分音符。数はドからの半音、null は休み。和音進行 C→Am→F→G、C→Am→F G→C */
  var SONG = [
    0, null, 4, 7, null, 4, 0, null, 2, null, 4, null, 7, null, null, null,
    9, null, 7, 4, null, 7, 9, null, 12, null, 9, null, 7, null, null, null,
    5, null, 9, 12, null, 9, 5, null, 7, null, 9, null, 5, null, null, null,
    7, null, 11, 14, null, 11, 7, null, 5, null, 4, null, 2, null, null, null,
    0, null, 4, 7, null, 12, 11, null, 9, null, 7, null, 4, null, null, null,
    9, null, 12, 16, null, 12, 9, null, 7, null, 9, null, 12, null, null, null,
    5, null, 9, 12, null, 9, 7, null, 11, null, 14, null, 11, null, 7, null,
    12, null, 11, null, 9, null, 7, null, 4, null, 2, null, 4, null, 7, 12
  ];
  var ROOTS = [-12, -15, -19, -17, -12, -15, -19, -24];
  function note(st) { return 523.25 * Math.pow(2, st / 12); }
  function songAt(i, back) {
    var m = SONG[i];
    if (back) {                                /* 巻き戻し：テープを逆に早回ししたような、高く短く下がる音 */
      if (m != null) tone(note(m) * 1.5, 0.06, 0.07, "square", note(m) * 1.1);
      else tone(note(ROOTS[i >> 4] + 24) * 1.5, 0.03, 0.025, "square");
      return;
    }
    if (m != null) tone(note(m), 0.12, 0.045, "square");
    if (i % 8 === 0) tone(note(i >> 4 === 6 && i % 16 === 8 ? -17 : ROOTS[i >> 4]), 0.2, 0.06, "triangle");
    if (i % 2 === 1) noiseHit(0.03, 7000, 0.03, 1);
  }
  function songFollow() {
    var f = Math.max(0, Math.min(1, (START_Z - z) / (START_Z - goalZ)));
    var step = Math.min(SONG.length, Math.floor(f * SONG.length));
    if (step === songStep) return;
    var back = step < songStep, n = 0;
    while (step !== songStep && n < 4) {        /* 一度にたくさん鳴らさない */
      if (back) { songStep--; songAt(songStep, true); }
      else { songAt(songStep, false); songStep++; }
      n++;
    }
    songStep = step;
  }
  function songEnd() {                         /* ゴールの和音（曲の最後） */
    [0, 4, 7, 12].forEach(function (m) { tone(note(m), 1.2, 0.06, "triangle"); });
    tone(note(-24), 1.2, 0.08, "triangle");
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.RESULT) {
      /* しばらくしたら自動でもう一度 */
      resT += dt; T += dt;                     /* トラップは動き続ける（潰れた車が見える） */
      for (var j = 0; j < traps.length; j++) trapPose(traps[j]);
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;
    for (var i = 0; i < traps.length; i++) trapPose(traps[i]);

    if (phase === "aim" && keyHold) setPull(pull + dt * 0.9);
    if (phase === "aim" || phase === "run") songFollow();
    if (phase === "run") {
      /* 減速は式どおりに進め、止まる位置が刻みでずれないようにする */
      var nv = v - DECEL * dt, dz = nv > 0 ? (v + nv) / 2 * dt : v * v / (2 * DECEL);
      z -= dz; wheel += dz / 0.09; v = Math.max(0, nv);
      keyAng -= dz / GAIN * 9;                 /* 走るとほどけて逆に回る */
      runSound(v);
      if (v <= 0) { phase = "aim"; base = z; pull = 0; lastClick = 0; moreTraps(); }
    }
    if (phase === "aim" || phase === "run") {
      /* くぐり抜けた数。トラップの区間を車の後ろの端が抜けたら1つ */
      var n = 0;
      for (i = 0; i < traps.length; i++) {
        var tr = traps[i], hit = trapHit(tr, z);
        if (hit && (tr.kind === "press" || tr.kind === "pusher") && !tr.under) {
          /* 下りている（閉じている）所へ横から突っ込んだだけなら、手前でコツンと止まる。
             潰されるのは、下に入っている所へ下りてきたときだけ */
          var face = (tr.kind === "press" ? 0.45 : 0.4) + HALF + 0.01;
          if (phase === "run") {
            z = tr.zc + face;
            v = 0; phase = "aim"; base = z; pull = 0; lastClick = 0; moreTraps(); runSound(0);
          } else {                             /* 引いて後ろの壁に当たったときは、そこまでしか引けない */
            z = tr.zc - face; pull = Math.max(0, z - base);
          }
          if (!tr.bumped) { noiseHit(0.1, 1200, 0.25, 1.2); tone(320, 0.08, 0.08, "square", 200); }
          tr.bumped = true;
          hit = null;
        }
        else tr.bumped = false;
        if (hit) { crash(hit, tr); break; }
        tr.under = Math.abs(z - tr.zc) < (tr.kind === "press" ? 0.45 : 0.4) + HALF;
        if (z + HALF < tr.zc - 0.9) n++;
      }
      if (phase !== "crash" && z + HALF < goalZ) {   /* ゴール */
        clearT = T; phase = "clear"; endT = 0; runSound(0);
        songEnd();
        if (window.zCelebrate) { confetti = window.zCelebrate.confetti(); confetti.rain = false; confetti.burst(W, H, 160); }
      }
      if (n > score) { score = n; tone(1320, 0.07, 0.06, "triangle"); tone(1760, 0.09, 0.05, "triangle", null, 0.06); }
    } else if (phase === "clear") {
      /* ゴールの先へ惰性で少し進んで止まる */
      endT += dt;
      v = Math.max(0, v - (4 + v * 3) * dt); z -= v * dt; wheel += v * dt / 0.09;
      if (endT > 1.6) state = S.RESULT;
    } else if (phase === "crash") {
      endT += dt;
      if (!crushBy) {                          /* 潰れた車はその場に残す（重力で床を抜けない） */
        vy -= GRAV * dt;
        x += vx * dt; y += vy * dt; z += vz * dt;
        pitch += spin * dt; roll += spin * 0.6 * dt; yaw += vx * 0.5 * dt;
      }
      if (crushBy) {
        /* 見た目どおりに潰す（一度潰れたら戻らない） */
        if (crushBy.kind === "press") sy = Math.min(sy, Math.max(0.12, (0.02 + crushBy.pose * 1.5) / 0.32));
        else sx = Math.min(sx, Math.max(0.28, (1.15 - crushBy.pose * 1.0) / 0.21));
      }
      if (endT > 1.8) newRound();              /* 結果画面は出さず、自動でもう一度 */
    }
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(px, py) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = px == null ? "retry" : hitButton(px, py);
      if (hit === "retry") newRound();
      return;
    }
    if (phase === "run") {                     /* 走っている間はタップでいつでも止まる */
      v = 0; phase = "aim"; base = z; pull = 0; lastClick = 0; moreTraps();
      runSound(0); noiseHit(0.12, 1800, 0.18, 1.5);
      /* 止めた指のまま、続けてドラッグで引ける */
    }
    if (phase !== "aim") return;
    held = true;
    if (px == null) { keyHold = true; return; }
    startY = py;
  }
  function move(px, py) {
    if (state !== S.PLAY || !held) return;
    if (phase === "aim") setPull((py - startY) / 120);
  }
  function up() {
    if (!held) return;
    held = false;
    keyHold = false;
    if (state === S.PLAY && phase === "aim") launch();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1=次のトラップの手前へ 2=その場で壊れる 3=最後のトラップの手前へ */
    if (state !== S.PLAY) newRound();
    if (phase !== "aim") return;
    if (n === 2) { v = 3; crash("hit"); return; }
    var skip = n === 1 ? 0 : n === 3 ? STAGE - 1 : null;
    if (skip == null) return;
    for (var i = 0; i < traps.length; i++) if (traps[i].zc < z - 0.5) break;
    var tr = traps[Math.min(STAGE - 1, n === 3 ? skip : i + skip)];
    if (!tr) return;
    z = base = tr.z0 - HALF - 0.05; pull = 0;
    moreTraps();
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    /* 英語のときのハッシュタグは英語のゲーム名にする（空白・記号は除く） */
    var t = (clearT || 0).toFixed(2);
    var text = zT("ゼンマイのミニカーでトラップ10個を" + t + "秒でくぐり抜けました", "My wind-up minicar dodged 10 traps in " + t + "s", "태엽 미니카로 함정 10개를 " + t + "초 만에 빠져나갔습니다", "发条迷你车用" + t + "秒穿过了10个陷阱", "發條迷你車用" + t + "秒穿過了10個陷阱");
    window.zResultActions.x({ text: text + zT(" #ミニカーチキンレース", " #MinicarChickenRace", " #미니카치킨레이스", " #迷你车胆量赛", " #迷你車膽量賽") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    /* ▼DRAW: ここに絵。立体の上に、文字やボタンを2Dで描く */
    var s3 = scene3d(), drew = false;
    if (s3) { try { s3.sync({ x: x, y: y, z: z, pitch: pitch, roll: roll, yaw: yaw, wheel: wheel, key: keyAng, ahead: aheadZ(), sx: sx, sy: sy, sz: sz, camZ: crashZ == null ? z : crashZ, traps: traps }); drew = s3.draw(ctx, W, H); } catch (e) { scene3d.drop(); } }
    if (!drew) { ctx.fillStyle = "#1d1714"; ctx.fillRect(0, 0, W, H); }

    if (state === S.PLAY && phase !== "crash") drawProgress();
    if (confetti) { confetti.step(1 / 60, W, H); confetti.draw(ctx); }
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない）。
     基本は doji5 の形（暗くして中央に白い大きなスコア）。
     盆栽・炒飯のように作ったものを見せるゲームは、暗くせず「作品を見せる形」にする：
       var L = window.zResultActions.showcase(W, H, { sizes: [104, 76, 30] });
       L.lines[i].y（textBaseline "top"）に上から文字、L.subject の枠の中央に作品を大きく、
       resultButtons() は L.buttons を返す。文字は上端から積むので画面からはみ出さない。 */
  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  /* 上のステージの進み具合。今のステージのスタートからゴール（10個目の先）まで */
  function drawProgress() {
    var st = 0, a = { z0: START_Z }, b = { z1: goalZ };
    var f = Math.max(0, Math.min(1, (a.z0 - z) / (a.z0 - b.z1)));
    var bw = 380, bh = 16, bx = (W - bw) / 2, by = 40;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.45)"; roundRect(bx - 3, by - 3, bw + 6, bh + 6, (bh + 6) / 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)"; roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
    if (f > 0) { ctx.fillStyle = "#f2c230"; roundRect(bx, by, Math.max(bh, bw * f), bh, bh / 2); ctx.fill(); }
    ctx.fillStyle = "rgba(0,0,0,.35)";                 /* トラップの位置の目盛り */
    for (var i = 1; i < STAGE; i++) {
      var t = traps[st * STAGE + i]; if (!t) break;
      ctx.fillRect(bx + bw * (a.z0 - t.z0) / (a.z0 - b.z1) - 1, by + 3, 2, bh - 6);
    }
    ctx.restore();
  }
  function scoreText() {
    return (clearT || 0).toFixed(2) + zT("秒", "s", "초", "秒", "秒");
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, phase: phase, z: z, score: score, lastKind: traps && traps[STAGE - 1] && traps[STAGE - 1].kind, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(800);
      debugKey(1); await r.wait(1500); debugKey(2);
      if (!await r.until(function () { return phase === "aim" && z > 2; }, 10)) throw Error("やり直しにならない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
