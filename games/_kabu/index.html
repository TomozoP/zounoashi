<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>おおきなかぶ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../celebrate.js"></script>
<script src="presence.js"></script>
<script>
/* おおきなかぶ

   同時にこのページを開いている人みんなで、1本のかぶを引っぱる。
   押している間が「引っぱり中」。同時に100人が引っぱると抜ける。
   人数は presence.js（公開ブローカー経由）で数える。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  var NEED = 100;

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 人数 ============ */
  var net = null;              /* 開始を押してからつなぐ */
  var bots = [];               /* デバッグ用の手元だけの仲間 */
  function people() {
    var list = net ? net.peers() : [{ id: "me", pull: held, since: 0, me: true }];
    bots.forEach(function (b) { list.push({ id: b.id, pull: held, since: b.since, me: false }); });
    return list.sort(function (a, b) { return a.since - b.since || (a.id < b.id ? -1 : 1); });
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", OUT: "out", RESULT: "result" };
  var state, T, held, keyMode = false;
  var crowd = [], pullN = 0, lift = 0, shake = 0, outT = 0, outN = 0, creakT = 0;
  var confetti = window.zCelebrate.confetti();

  var KX, KY;                                  /* かぶの根元 */
  function place() {
    KX = 128; KY = Math.round(H * 0.3);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; held = false; lift = 0; shake = 0; outT = 0;
    confetti.clear();
    if (net) net.setPulling(false);
  }

  function pullOut(n) {
    if (state !== S.PLAY) return;
    state = S.OUT; outT = 0; outN = Math.max(n, NEED);
    held = false; if (net) net.setPulling(false);
    noiseHit(0.5, 300, 0.5, 0.6);
    tone(220, 0.35, 0.25, "triangle", 880);
    window.zCelebrate.play(AC, "fanfare", { delay: 0.35 });
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    crowd = people();
    pullN = crowd.filter(function (p) { return p.pull; }).length;
    if (state === S.PLAY) {
      var goal = Math.min(1, pullN / NEED);
      lift += (goal - lift) * Math.min(1, dt * 3);
      shake = pullN > 0 ? 0.3 + goal : 0;
      if (held) {
        creakT -= dt;
        if (creakT <= 0) { creakT = 0.55 + Math.random() * 0.3; noiseHit(0.18, 160 + goal * 300, 0.12 + goal * 0.2, 3); }
      }
      if (pullN >= NEED) { if (net) net.sendDone(); pullOut(pullN); }
    } else if (state === S.OUT) {
      outT += dt;
      if (outT > 2.6) { state = S.RESULT; }
    }
    confetti.step(dt, W, H);
    if (state === S.OUT && outT > 0.35 && outT - dt <= 0.35) confetti.burst(W, H, 180);
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    held = true; creakT = 0;
    if (net) net.setPulling(true);
  }
  function move() {}
  function up() {
    if (!held) return;
    held = false;
    if (net) net.setPulling(false);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1=手元だけの仲間を10人足す 2=仲間を99人にする（次に押すと100人で抜ける） 3=仲間を消す */
    if (n === 1 || n === 2) {
      var want = n === 1 ? bots.length + 10 : NEED - 1 - (net ? net.peers().length - 1 : 0);
      while (bots.length < want) bots.push({ id: "bot" + bots.length, since: Date.now() + bots.length });
    }
    if (n === 3) bots = [];
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state === S.RESULT) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    window.zResultActions.x({ text: zT(
      "同時に" + outN + "人で、おおきなかぶを抜いた",
      "Pulled out the giant turnip with " + outN + " people at once",
      "동시에 " + outN + "명이서 커다란 순무를 뽑았다",
      "同时" + outN + "人一起拔出了大萝卜",
      "同時" + outN + "人一起拔出了大蘿蔔"
    ) + zT(" #おおきなかぶ", " #TheGiantTurnip", " #커다란순무", " #拔萝卜", " #拔蘿蔔") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

  /* 並び：かぶの右から、畑の上を左右に折り返しながら続く */
  function slots(n) {
    var top = H * 0.42, bottom = H - 30, left = 40, right = W - 30;
    var s = 96;
    for (; s > 20; s -= 2) {
      var cols = Math.floor((right - left) / (s * 0.82));
      if (Math.ceil(n / cols) * s * 1.06 <= bottom - top) break;
    }
    cols = Math.max(1, Math.floor((right - left) / (s * 0.82)));
    var out = [];
    for (var i = 0; i < n; i++) {
      var r = Math.floor(i / cols), c = i % cols, dir = r % 2 ? -1 : 1;
      var x = dir > 0 ? left + (c + 0.5) * s * 0.82 : right - (c + 0.5) * s * 0.82;
      out.push({ x: x, y: top + r * s * 1.06 + s * 0.9, s: s, dir: dir });
    }
    return out;
  }

  var KINDS = ["jii", "baa", "mago", "inu", "neko", "nezumi"];
  var CLOTHES = ["#3d7be0", "#e05d5d", "#4bb46b", "#e0a33d", "#9a5ce0", "#3dbfc4", "#e07ab8", "#7a8a99", "#c46b3d"];
  var SKIN = ["#f4cfa8", "#e8b68a", "#c98d5e", "#f6dcc0"];

  function drawPerson(p, sl, i, pulling, fallen) {
    var s = sl.s, k = i < KINDS.length ? KINDS[i] : "hito";
    var h = hash(p.id);
    var lean = fallen ? 1.25 : pulling ? 0.42 + Math.sin(T * 9 + i) * 0.05 : 0.06;
    ctx.save();
    ctx.translate(sl.x, sl.y);
    ctx.scale(-sl.dir, 1);                     /* 前（かぶの方）が -x */
    var sc = k === "nezumi" ? 0.45 : k === "neko" ? 0.6 : k === "inu" ? 0.72 : k === "mago" ? 0.82 : 1;
    ctx.scale(sc * s / 100, sc * s / 100);
    /* 影 */
    ctx.fillStyle = "rgba(60,40,10,.25)";
    ctx.beginPath(); ctx.ellipse(0, 0, 34, 8, 0, 0, Math.PI * 2); ctx.fill();
    if (p.me) {
      ctx.strokeStyle = "#ff7a45"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(0, 0, 42, 11, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.rotate(lean);
    if (k === "inu" || k === "neko" || k === "nezumi") drawAnimal(k);
    else drawHuman(k, h);
    ctx.restore();
    if (p.me) {
      var ay = sl.y - s * sc * 1.25 - 8 + Math.sin(T * 5) * 3;
      ctx.fillStyle = "#ff7a45";
      ctx.beginPath(); ctx.moveTo(sl.x - 9, ay - 12); ctx.lineTo(sl.x + 9, ay - 12); ctx.lineTo(sl.x, ay); ctx.closePath(); ctx.fill();
    }
  }
  function drawHuman(k, h) {
    var cloth = k === "jii" ? "#7a5232" : k === "baa" ? "#8a5ca8" : k === "mago" ? "#e04848" : CLOTHES[h % CLOTHES.length];
    var skin = k === "hito" ? SKIN[(h >> 3) % SKIN.length] : "#f4cfa8";
    ctx.lineCap = "round";
    /* 足 */
    ctx.strokeStyle = "#3a2c22"; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(-14, -2); ctx.moveTo(6, -30); ctx.lineTo(12, -2); ctx.stroke();
    /* 胴 */
    ctx.fillStyle = cloth;
    roundRect(-16, -74, 32, 48, 12); ctx.fill();
    /* 腕（前へ） */
    ctx.strokeStyle = cloth; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(-4, -64); ctx.lineTo(-40, -58); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(-42, -58, 6, 0, Math.PI * 2); ctx.fill();
    /* 頭 */
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(0, -92, 18, 0, Math.PI * 2); ctx.fill();
    if (k === "jii") {
      ctx.fillStyle = "#f2f2f2";
      ctx.beginPath(); ctx.arc(-6, -82, 12, 0.2, Math.PI * 1.1); ctx.fill();
      ctx.beginPath(); ctx.arc(10, -96, 8, 0, Math.PI * 2); ctx.fill();
    } else if (k === "baa") {
      ctx.fillStyle = "#c9c9c9";
      ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * 0.95, Math.PI * 2.1); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -108, 9, 0, Math.PI * 2); ctx.fill();
    } else if (k === "mago") {
      ctx.fillStyle = "#2a1f1a";
      ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -86, 7, 0, Math.PI * 2); ctx.fill();
    } else {
      var hair = ["#2a1f1a", "#5a3a22", "#1a1a1a", "#8a6a3a", "#c0a060"][(h >> 5) % 5];
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    }
    ctx.fillStyle = "#2a1f1a";
    ctx.beginPath(); ctx.arc(-10, -92, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  function drawAnimal(k) {
    var col = k === "inu" ? "#b07a42" : k === "neko" ? "#9a9a9a" : "#8a8a96";
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = "round";
    /* 足 */
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-14, -26); ctx.lineTo(-18, -2); ctx.moveTo(14, -26); ctx.lineTo(18, -2); ctx.stroke();
    /* 胴 */
    ctx.beginPath(); ctx.ellipse(0, -36, 30, 18, 0, 0, Math.PI * 2); ctx.fill();
    /* しっぽ */
    ctx.lineWidth = k === "nezumi" ? 4 : 8;
    ctx.beginPath(); ctx.moveTo(26, -42);
    if (k === "nezumi") ctx.quadraticCurveTo(60, -40, 56, -10);
    else ctx.quadraticCurveTo(44, -60, 40, -74);
    ctx.stroke();
    /* 頭 */
    ctx.beginPath(); ctx.arc(-32, -54, 18, 0, Math.PI * 2); ctx.fill();
    /* 耳 */
    if (k === "neko") {
      ctx.beginPath(); ctx.moveTo(-46, -64); ctx.lineTo(-44, -84); ctx.lineTo(-32, -70); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-28, -70); ctx.lineTo(-18, -84); ctx.lineTo(-16, -62); ctx.fill();
    } else if (k === "inu") {
      ctx.fillStyle = "#7a5228";
      ctx.beginPath(); ctx.ellipse(-22, -64, 7, 14, 0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(-38, -72, 10, 0, Math.PI * 2); ctx.arc(-22, -72, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e8a0a8";
      ctx.beginPath(); ctx.arc(-38, -72, 5, 0, Math.PI * 2); ctx.arc(-22, -72, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#2a1f1a";
    ctx.beginPath(); ctx.arc(-40, -56, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-50, -50, 3, 0, Math.PI * 2); ctx.fill();
  }

  function kabuPos() {
    var out = state === S.OUT || state === S.RESULT;
    var u = out ? Math.min(1, outT / 0.6) : 0;
    var up = lift * 34 + (out ? (1 - Math.pow(1 - u, 3)) * H * 0.12 : 0);
    var sx = state === S.PLAY ? Math.sin(T * 40) * shake * 3 : 0;
    var rot = out ? u * 0.5 : Math.sin(T * 23) * shake * 0.03;
    return { x: KX + sx, y: KY + 40 - up, rot: rot };
  }
  function drawKabu() {
    var k = kabuPos(), r = 84;
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.rot);
    /* 葉 */
    ctx.fillStyle = "#3e9a3a";
    for (var i = -2; i <= 2; i++) {
      ctx.save(); ctx.rotate(i * 0.32 + Math.sin(T * 6 + i) * shake * 0.05);
      ctx.beginPath(); ctx.ellipse(0, -r * 1.7, 22, 70, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = "#2f7a2c"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.9); ctx.lineTo(0, -r * 1.25); ctx.stroke();
    /* 実 */
    var g = ctx.createRadialGradient(-26, -10, 10, 0, 0, r * 1.2);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.7, "#f1eee6"); g.addColorStop(1, "#d9d2c2");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r * 1.15, -r, r * 1.2, r * 0.5, 0, r * 1.05);
    ctx.bezierCurveTo(-r * 1.2, r * 0.5, -r * 1.15, -r, 0, -r);
    ctx.fill();
    ctx.strokeStyle = "#d9d2c2"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, r * 1.05); ctx.quadraticCurveTo(6, r * 1.4, -4, r * 1.7); ctx.stroke();
    ctx.restore();
    return k;
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);

    /* 空と畑 */
    var sky = ctx.createLinearGradient(0, 0, 0, KY);
    sky.addColorStop(0, "#7cc8f2"); sky.addColorStop(1, "#cdeefa");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#a8703f"; ctx.fillRect(0, KY + 20, W, H - KY);
    ctx.fillStyle = "#96612f";
    for (var y = KY + 60; y < H; y += 46) ctx.fillRect(0, y, W, 6);

    /* 人数 */
    var n = crowd.length;
    if (!hideUI) {
    ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#16202e";
    ctx.font = "900 92px sans-serif";
    var shown = state === S.PLAY ? n : outN;
    ctx.fillText(String(shown), W - 120, 108);
    ctx.textAlign = "left";
    ctx.font = "800 40px sans-serif";
    ctx.fillText("/" + NEED, W - 114, 108);
    }

    /* 綱（かぶ → 並びの順） */
    var k = kabuPos();
    var sl = slots(n);
    var out = state !== S.PLAY;
    ctx.strokeStyle = "#e8d39a"; ctx.lineWidth = 5; ctx.lineJoin = "round";
    if (!out) {
      ctx.beginPath(); ctx.moveTo(k.x + 6, k.y - 90);
      sl.forEach(function (q) { ctx.lineTo(q.x - q.dir * q.s * 0.38, q.y - q.s * 0.55); });
      ctx.stroke();
    }

    /* 土に埋まった所を隠すため、かぶは土の手前の穴の上に描き、下を土で塞ぐ */
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, KY + 20); ctx.clip();
    drawKabu();
    ctx.restore();
    ctx.fillStyle = "#6e4622";
    ctx.beginPath(); ctx.ellipse(KX, KY + 22, 96, 14, 0, 0, Math.PI * 2); ctx.fill();
    if (out) { ctx.save(); drawKabu(); ctx.restore(); }

    for (var i = 0; i < n; i++) drawPerson(crowd[i], sl[i], i, crowd[i].pull, out);

    if (DEBUG && net && net.status() === 0) {
      ctx.fillStyle = "rgba(22,32,46,.5)"; ctx.font = "600 18px sans-serif"; ctx.textAlign = "left";
      ctx.fillText("offline", 12, 24);
    }

    confetti.draw(ctx);
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.5)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(outN), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  window.__probe = {
    now: function () { return { state: state, people: crowd.length, pulling: pullN, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { hideUI = true; }
  };
  var hideUI = false;

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      debugKey(2);
      await r.wait(1500);
      down(W / 2, H / 2);
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("抜けない");
      await r.wait(1500);
    }
  };

  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) {
    e.stopPropagation(); audioOn(); resumeAudio();
    if (!net) net = window.zPresence({ topic: "zounoashi/kabu/v1", onDone: function (n) { pullOut(NEED); } });
    newRound();
  });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
