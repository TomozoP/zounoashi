  /* 長押し中にゲームの絵が選択されないようにする。 */

</style>

<script>
/* おじさんの涙を舐め生きるアメンボ

   泣いているおじさんの涙を、水面のアメンボ（左右にドラッグ）で受けて飲む。
   取りそこねた涙は水かさになり、あごまで来たら終わり。飲んだ量(ml)が結果。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  /* BGM：ゆっくりしたシャッフルの12小節ブルース（自作）。イ長調、66拍/分。
     ブギのベース、エレピの和音、ブラシの刻み、ときどきギターの泣きのフレーズ。少し先まで音を予約しておく */
  var bgm = null;
  var TRIP = 60 / 66 / 3;                                  /* 3連の1つ分 */
  var BLUES = [0, 0, 0, 0, 5, 5, 0, 0, 7, 5, 0, 7];         /* 小節ごとの根音（イからの半音数） */
  var BOOGIE = [0, 4, 7, 9, 10, 9, 7, 4];                  /* ベースの8つの音 */
  var LICKS = {                                            /* [小節内の3連の位置, イからの半音数, 長さ(3連)] */
    3: [[0, 15, 2], [2, 12, 1], [3, 10, 2], [5, 7, 4], [9, 3, 3]],
    7: [[0, 12, 1], [1, 15, 1], [2, 17, 3], [6, 15, 2], [8, 12, 4]],
    11: [[0, 19, 2], [3, 17, 1], [4, 15, 2], [6, 12, 2], [9, 10, 3]]
  };
  function hz(semi, base) { return base * Math.pow(2, semi / 12); }
  function bgmStart() {
    if (!AC || bgm) return;
    var out = AC.createGain(); out.gain.value = 0.0001;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    out.connect(lp); lp.connect(AC.destination);
    out.gain.setTargetAtTime(0.5, AC.currentTime, 1.0);
    bgm = { out: out, step: 0, next: AC.currentTime + 0.1 };
    setInterval(bgmTick, 90);
  }
  function bgmTick() {
    if (!bgm || !AC) return;
    if (bgm.next < AC.currentTime) bgm.next = AC.currentTime + 0.05;   /* 裏に回って遅れた分はまとめて鳴らさない */
    while (bgm.next < AC.currentTime + 0.4) {
      var st = bgm.step % 144, bar = Math.floor(st / 12), b = st % 12, beat = Math.floor(b / 3), tr = b % 3, t = bgm.next;
      var root = hz(BLUES[bar], 55);
      /* ベース：シャッフルの表(1つ目)と裏(3つ目) */
      if (tr !== 1) bgmBass(t, hz(BOOGIE[beat * 2 + (tr ? 1 : 0)], root), TRIP * (tr ? 1 : 2) * 0.95);
      /* 太鼓：1・3拍に低い音、2・4拍に軽いスネア、刻みは表と裏 */
      if (tr === 0 && beat % 2 === 0) bgmKick(t);
      if (tr === 0 && beat % 2 === 1) bgmNoise(t, 0.16, 1800, 0.10);
      if (tr !== 1) bgmNoise(t, 0.05, 7000, tr ? 0.035 : 0.05);
      /* エレピ：2・4拍の裏に3度・7度・9度 */
      if (tr === 2 && beat % 2 === 1) [4, 10, 14].forEach(function (k) { bgmKeys(t, hz(k, root * 2), TRIP * 1.6); });
      if (b === 0) [4, 10, 14].forEach(function (k) { bgmKeys(t, hz(k, root * 2), TRIP * 2.5); });
      /* ギター：決まった小節でだけ泣く */
      var lk = LICKS[bar];
      if (lk && bgm.step % 288 >= 144) lk.forEach(function (n) { if (n[0] === b) bgmGuitar(t, hz(n[1], 220), TRIP * n[2]); });
      bgm.step++; bgm.next += TRIP;
    }
  }
  function bgmBass(t, f, dur) {
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = "triangle"; o.frequency.value = f; lp.type = "lowpass"; lp.frequency.value = 600;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(bgm.out); o.start(t); o.stop(t + dur + 0.05);
  }
  function bgmKeys(t, f, dur) {
    var o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f * 2.001;
    var g2 = AC.createGain(); g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bgm.out); o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function bgmKick(t) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(bgm.out); o.start(t); o.stop(t + 0.3);
  }
  function bgmNoise(t, dur, freq, vol) {
    if (!NOISE) return;
    var s2 = AC.createBufferSource(); s2.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    var g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s2.connect(f); f.connect(g); g.connect(bgm.out); s2.start(t, Math.random()); s2.stop(t + dur + 0.05);
  }
  function bgmGuitar(t, f, dur) {
    /* 半音下からすべり上がる、ゆれのある音 */
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(f * 0.944, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.09);
    lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012, t + dur);
    lfo.connect(lg); lg.connect(o.frequency);
    lp.type = "lowpass"; lp.frequency.value = 1400; lp.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.02); g.gain.setTargetAtTime(0.0001, t + dur * 0.6, dur * 0.35 + 0.05);
    o.connect(lp); lp.connect(g); g.connect(bgm.out); o.start(t); lfo.start(t); o.stop(t + dur * 1.6 + 0.2); lfo.stop(t + dur * 1.6 + 0.2);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.loopStart = 0; s.playbackRate.value = 1;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var tears, drops, ripples = [], fill, wet, hx, hy, px, py, sobT, swishT, burst, hideUI = false;
  /* アメンボ：床の水面に浮かび、左右のドラッグで滑る。落ちてくる涙を水に落ちる前に受け止める */
  var sx = 270, sxT = 270, sv = 0, dragX0 = 0, dragS0 = 0, rippleT = 0, gulp = 0, glow = 0;
  var soak = 0, tilt = 0;
  var BASE = 70;                               /* 最初の水面の高さ（画面の下から） */
  var CAP = 16;                                 /* 取りこぼしてよい量(ml)。これであごまで水がたまる */

  /* 顔の置き場所。高さが変わっても涙の量で終わるので、難しさは変わらない */
  /* 顔は画面の横幅ぎりぎりまで大きく映す */
  var FX = 270, FY, RX = 240, RY = 296, LOSE;
  function place() {
    FY = Math.round(Math.max(RY + 70, Math.min(H * 0.36, H - RY - 200)));
    LOSE = FY + RY - 30;
  }
  function edgeY(x) {
    var d = (x - FX) / RX;
    if (Math.abs(d) >= 1) return FY;
    return FY + RY * Math.sqrt(1 - d * d);
  }
  function waterY() { return (H - BASE) - (H - BASE - LOSE) * fill; }

  /* 涙の出口（左右の目尻と目頭） */
  function eyeSpots() {
    return [
      { x: FX - RX * 0.62, y: FY - RY * 0.095, dx: -12 }, { x: FX - RX * 0.23, y: FY - RY * 0.08, dx: 5 },
      { x: FX + RX * 0.23, y: FY - RY * 0.08, dx: -5 }, { x: FX + RX * 0.62, y: FY - RY * 0.095, dx: 12 }
    ];
  }

  function newRound() {
    bgmStart();
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    tears = []; drops = []; ripples = []; fill = 0; wet = 0; gulp = 0;
    sx = sxT = W / 2; sv = 0;
    sobT = 0.4; swishT = 0; burst = false;
  }

  /* 泣く強さ。時間とともに増え、ときどき号泣する */
  function rate() {
    var r = Math.min(4.2, 0.9 + T * 0.055);
    return burst ? r * 1.8 : r;
  }
  var spawnAcc = 0, spotI = 0;
  function spawn(n) {
    var sp = eyeSpots();
    for (var i = 0; i < n; i++) {
      spotI = (spotI + 1 + (Math.random() < 0.35 ? 1 : 0)) % 4;
      var s = sp[spotI];
      var vol = 0.25 + Math.random() * 0.45 + (burst ? 0.15 : 0);
      tears.push({ x: s.x + (Math.random() - 0.5) * 10, y: s.y + 6, vx: s.dx, vy: 40 + Math.random() * 40, vol: vol, onFace: true, trail: [], ph: Math.random() * 6.28 });
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.RESULT) { stepDrops(dt); return; }
    T += dt;
    var play = state === S.PLAY;
    if (play) {
      var cyc = T % 9;
      var b = T > 7 && cyc > 6.3 && cyc < 8.4;
      burst = b;
    } else burst = false;

    spawnAcc += dt * (play ? rate() : 0.9);
    while (spawnAcc >= 1) { spawnAcc -= 1; spawn(1); }

    var wy = waterY();
    for (var i = tears.length - 1; i >= 0; i--) {
      var t = tears[i];
      if (t.onFace) {
        t.vy = Math.min(160, t.vy + dt * 60);
        t.x += (t.vx + Math.sin(T * 3 + t.ph) * 6) * dt;
        t.y += t.vy * dt;
        t.trail.push(t.x, t.y);
        if (t.trail.length > 40) t.trail.splice(0, 2);
        if (play && t.y > wy - 40 && hitStrider(t.x, t.y - t.vy * dt, t.x, t.y, wy, (8 + t.vol * 9) * 0.68)) {
          tears.splice(i, 1); score += t.vol; gulp = 1; glow = 1;
          tone(700 + Math.random() * 200, 0.07, 0.06, "sine", 1200);
          continue;
        }
        if (t.y >= wy) { tears.splice(i, 1); splash(t.x, wy, t.vol); if (play) fill += t.vol / CAP; continue; }
        if (t.y > edgeY(t.x) - 6) { t.onFace = false; t.vx = (t.x - FX) * 0.25; t.vy = Math.max(t.vy, 60); }
      } else {
        t.vy += 900 * dt;
        t.x += t.vx * dt; t.y += t.vy * dt;
        if (t.trail.length) t.trail.splice(0, 2);
        /* 立体の涙は中心より下にふくらむので、下側の丸で触れたかを見る */
        var tr0 = (8 + t.vol * 9) * 0.68, tb = (8 + t.vol * 9) * 0.72;
        if (play && hitStrider(t.x - t.vx * dt, t.y - t.vy * dt + tb, t.x, t.y + tb, wy, tr0)) {
          tears.splice(i, 1);
          score += t.vol; gulp = 1; glow = 1;
          tone(700 + Math.random() * 200, 0.07, 0.06, "sine", 1200);
          continue;
        }
        if (t.y >= wy) {
          tears.splice(i, 1);
          splash(t.x, wy, t.vol);
          if (play && !t.pour) fill += t.vol / CAP;
          continue;
        }
      }
    }
    /* アメンボの動き：ドラッグの先へ水の上を滑る */
    if (play) {
      var nx = sx + (sxT - sx) * Math.min(1, dt * 12);
      sv = (nx - sx) / dt; sx = nx;
      rippleT -= dt;
      if (rippleT <= 0 && Math.abs(sv) > 40) { rippleT = 0.12; ripples.push({ x: sx, t: T, a: 1.5 }); if (ripples.length > 12) ripples.shift(); }
    }
    gulp = Math.max(0, gulp - dt * 4);
    glow = Math.max(0, glow - dt * 3);
    stepDrops(dt);
    swishT -= dt;
    if (play && fill >= 1) {
      fill = 1;
      state = S.RESULT;
      held = false;
      tone(300, 0.5, 0.12, "sine", 90);
      noiseHit(0.6, 500, 0.15, 0.8);
    }
  }
  function splash(x, y, vol) {
    noiseHit(0.1, 1500 + Math.random() * 800, 0.05, 2);
    var n = 4 + Math.round(vol * 6);
    for (var i = 0; i < n; i++) drops.push({ x: x, y: y, vx: (Math.random() - 0.5) * 220, vy: -150 - Math.random() * 260 * (0.6 + vol), life: 0.7, r: 2 + Math.random() * 3 * (0.5 + vol) });
    ripples.push({ x: x, t: T, a: 3 + vol * 6 });
    if (ripples.length > 12) ripples.shift();
  }
  function stepDrops(dt) {
    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      var ox = d.x, oy = d.y;
      d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
      /* しぶきもアメンボの体を抜けないよう、触れたら消す（点は増えない） */
      if (d.life <= 0 || (d.vy > 0 && d.y > waterY() + 4) || (state === S.PLAY && hitStrider(ox, oy, d.x, d.y, waterY(), d.r || 4))) drops.splice(i, 1);
    }
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) return;
    held = true;
    dragX0 = x; dragS0 = sxT;
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    sxT = Math.max(30, Math.min(W - 30, dragS0 + (x - dragX0) * 1.2));
  }
  function up() {
    if (!held) return;
    held = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外だけ、数字キーで場面を飛ばせる。
     1 号泣の強さまで飛ぶ  2 あふれる直前  3 結果 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) { newRound(); }
    if (n === 1) T = 60;
    if (n === 2) fill = 0.95;
    if (n === 3) { score = Math.max(score, 48.3); fill = 1; }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function ml() { return score.toFixed(1); }
  function doShare() {
    window.zResultActions.x({ text: zT("おじさんの涙を" + ml() + "ml舐めて生きた", "Survived on " + ml() + " ml of an old man's tears") + zT(" #おじさんの涙を舐め生きるアメンボ", " #PondSkaterLivingOnOldMansTears") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {

    ctx.arcTo(x + w, y + h, x, y + h, r);

  function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); }

  var SKIN = "#f1c39b", LINE = "#5b3b26";
  function drawBack() {
    ctx.fillStyle = "#e8dcc4";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(160,130,90,.10)";
    for (var x = 0; x < W; x += 60) ctx.fillRect(x, 0, 26, H);
  }
  function drawBody() {
    var top = FY + RY - 40;
    /* 背広 */
    ctx.fillStyle = "#4a5260";
    ctx.beginPath();
    ctx.moveTo(10, H + 10);
    ctx.lineTo(20, top + 150);
    ctx.quadraticCurveTo(40, top + 70, 160, top + 50);
    ctx.lineTo(380, top + 50);
    ctx.quadraticCurveTo(500, top + 70, 520, top + 150);
    ctx.lineTo(530, H + 10);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#2c313a"; ctx.stroke();
    /* 首 */
    ctx.fillStyle = SKIN;
    ctx.fillRect(FX - 70, top - 30, 140, 90);
    /* シャツ */
    ctx.fillStyle = "#fbfbf6";
    ctx.beginPath();
    ctx.moveTo(FX - 95, top + 48); ctx.lineTo(FX, top + 210); ctx.lineTo(FX + 95, top + 48);
    ctx.lineTo(FX + 60, top + 40); ctx.lineTo(FX, top + 80); ctx.lineTo(FX - 60, top + 40);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#9aa0a8"; ctx.lineWidth = 3; ctx.stroke();
    /* ネクタイ */
    ctx.fillStyle = "#b8343a";
    ctx.beginPath();
    ctx.moveTo(FX - 18, top + 82); ctx.lineTo(FX + 18, top + 82); ctx.lineTo(FX + 12, top + 104);
    ctx.lineTo(FX + 30, top + 220); ctx.lineTo(FX, top + 250); ctx.lineTo(FX - 30, top + 220);
    ctx.lineTo(FX - 12, top + 104); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#7a1f24"; ctx.stroke();
  }
  function drawFace() {
    var shake = burst ? Math.sin(T * 47) * 2.5 : Math.sin(T * 9) * 0.8;
    ctx.save();
    ctx.translate(shake, 0);
    /* 耳 */
    ctx.fillStyle = SKIN; ctx.strokeStyle = LINE; ctx.lineWidth = 4;
    ell(FX - RX + 4, FY + 10, 26, 44); ctx.fill(); ctx.stroke();
    ell(FX + RX - 4, FY + 10, 26, 44); ctx.fill(); ctx.stroke();
    /* 顔 */
    ell(FX, FY, RX, RY); ctx.fill(); ctx.stroke();
    /* 横の髪と頭の光 */
    ctx.fillStyle = "#3b3633";
    ell(FX - RX + 14, FY - 66, 16, 50, 0.25); ctx.fill();
    ell(FX + RX - 14, FY - 66, 16, 50, -0.25); ctx.fill();
    ctx.strokeStyle = "#3b3633"; ctx.lineWidth = 3;
    for (var k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.moveTo(FX - 120, FY - 150 + k * 14);
      ctx.quadraticCurveTo(FX, FY - 222 + k * 10, FX + 125, FY - 140 + k * 16); ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ell(FX - 60, FY - 175, 46, 16, -0.25); ctx.fill();
    /* おでこのしわ */
    ctx.strokeStyle = "rgba(91,59,38,.55)"; ctx.lineWidth = 3;
    for (k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.moveTo(FX - 70 + k * 6, FY - 112 - k * 16);
      ctx.quadraticCurveTo(FX, FY - 128 - k * 16 + (burst ? 6 : 0), FX + 70 - k * 6, FY - 112 - k * 16); ctx.stroke();
    }
    /* 眉（内側が上がる） */
    var lift = burst ? 14 : 6;
    ctx.strokeStyle = "#2d2724"; ctx.lineWidth = 13; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(FX - 140, FY - 62); ctx.quadraticCurveTo(FX - 95, FY - 70, FX - 40, FY - 86 - lift); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(FX + 140, FY - 62); ctx.quadraticCurveTo(FX + 95, FY - 70, FX + 40, FY - 86 - lift); ctx.stroke();
    /* ぎゅっとつぶった目 */
    ctx.strokeStyle = LINE; ctx.lineWidth = 6;
    [-1, 1].forEach(function (s) {
      var ex = FX + s * 80;
      ctx.beginPath(); ctx.moveTo(ex - 44, FY - 20); ctx.quadraticCurveTo(ex, FY - 44, ex + 44, FY - 20); ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ex - 34, FY - 8); ctx.quadraticCurveTo(ex, FY + 2, ex + 34, FY - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + s * 50, FY - 26); ctx.lineTo(ex + s * 62, FY - 34);
      ctx.moveTo(ex + s * 50, FY - 18); ctx.lineTo(ex + s * 64, FY - 16); ctx.stroke();
      ctx.lineWidth = 6;
      /* 目にたまる涙 */
      ctx.fillStyle = "rgba(120,200,255,.75)";
      ell(ex, FY - 18, 42, burst ? 10 : 7); ctx.fill();
    });
    /* ほお */
    ctx.fillStyle = "rgba(230,90,80,.30)";
    ell(FX - 112, FY + 52, 38, 22); ctx.fill();
    ell(FX + 112, FY + 52, 38, 22); ctx.fill();
    /* 鼻 */
    ctx.fillStyle = "#eba985"; ctx.strokeStyle = LINE; ctx.lineWidth = 4;
    ell(FX, FY + 36, 36, 30); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(220,70,60,.35)"; ell(FX, FY + 40, 24, 18); ctx.fill();
    ctx.fillStyle = LINE; ell(FX - 13, FY + 54, 7, 4); ctx.fill(); ell(FX + 13, FY + 54, 7, 4); ctx.fill();
    /* 口（わなわな） */
    var mw = burst ? 70 : 54, mh = (burst ? 52 : 30) + Math.sin(T * (burst ? 26 : 11)) * (burst ? 8 : 4);
    var my = FY + 128;
    ctx.fillStyle = "#5a1d1f";
    ctx.beginPath();
    ctx.moveTo(FX - mw, my + mh * 0.5);
    ctx.quadraticCurveTo(FX, my - mh * 1.0, FX + mw, my + mh * 0.5);
    ctx.quadraticCurveTo(FX, my + mh * 1.0, FX - mw, my + mh * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.clip();
    ctx.fillStyle = "#d9737a"; ell(FX, my + mh * 0.75, mw * 0.55, mh * 0.35); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillRect(FX - mw, my - mh * 0.3, mw * 2, 12);
    ctx.restore();
    /* ひげ */
    ctx.fillStyle = "#3b3633";
    ctx.beginPath();
    ctx.moveTo(FX, FY + 74);
    ctx.quadraticCurveTo(FX - 40, FY + 64, FX - 82, FY + 96);
    ctx.quadraticCurveTo(FX - 40, FY + 96, FX, FY + 86);
    ctx.quadraticCurveTo(FX + 40, FY + 96, FX + 82, FY + 96);
    ctx.quadraticCurveTo(FX + 40, FY + 64, FX, FY + 74);
    ctx.fill();
    /* ぶしょうひげ */
    ctx.fillStyle = "rgba(60,50,45,.35)";
    for (var i = 0; i < 40; i++) {
      var a = 0.5 + (i * 0.618 % 1) * 2.14, rr = 0.82 + ((i * 0.37) % 1) * 0.14;
      ctx.fillRect(FX + Math.cos(a) * RX * rr, FY + Math.sin(a) * RY * rr, 3, 3);
    }
    ctx.restore();
  }
  function drawBlush() {
    var sx = burst ? Math.sin(T * 47) * 2.5 : Math.sin(T * 9) * 0.8;
    [-1, 1].forEach(function (s) {
      var x = FX + s * 112 + sx, y = FY + 52;
      ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.6);
      var gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 44);
      gr.addColorStop(0, "rgba(235,90,80,.38)"); gr.addColorStop(1, "rgba(235,90,80,0)");
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }
  function drawTrails() {
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    tears.forEach(function (t) {
      if (t.trail.length < 4) return;
      ctx.strokeStyle = "rgba(200,235,255,.22)"; ctx.lineWidth = (8 + t.vol * 9) * 0.45;
      ctx.beginPath(); ctx.moveTo(t.trail[0], t.trail[1]);
      for (var i = 2; i < t.trail.length; i += 2) ctx.lineTo(t.trail[i], t.trail[i + 1]);
      ctx.stroke();
    });
  }
  function drawTears() {
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    drawTrails();
    tears.forEach(function (t) {
      var r = 8 + t.vol * 9;
      ctx.fillStyle = "rgba(110,195,255,.9)";
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - r * 1.9);
      ctx.quadraticCurveTo(t.x + r * 1.1, t.y - r * 0.2, t.x, t.y + r);
      ctx.quadraticCurveTo(t.x - r * 1.1, t.y - r * 0.2, t.x, t.y - r * 1.9);
      ctx.fill();
      ctx.strokeStyle = "rgba(40,120,190,.8)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ell(t.x - r * 0.3, t.y - r * 0.2, r * 0.22, r * 0.35); ctx.fill();
    });
  }
  function drawWater() {
    var wy = waterY();
    if (fill > 0.001 || state !== S.INTRO) {
      ctx.fillStyle = "rgba(90,175,235,.72)";
      ctx.beginPath(); ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += 20) ctx.lineTo(x, wy + Math.sin(x * 0.03 + T * 3) * 5);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(220,245,255,.8)"; ctx.lineWidth = 4;
      ctx.beginPath();
      for (x = 0; x <= W; x += 20) { var y = wy + Math.sin(x * 0.03 + T * 3) * 5; if (x) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(130,205,255,.9)";
    drops.forEach(function (d) { ell(d.x, d.y, 4, 5); ctx.fill(); });
  }
  /* アメンボ（ここだけトゥーン調の2D）。明るい色と太い縁取りで、暗い背景でも見えるようにする */
  var faceDir = 1;
  var LEGS = [[[8, -22], [34, -48], [74, 4]], [[-6, -22], [-30, -46], [-70, 4]], [[18, -24], [32, -30], [44, 4]], [[-14, -22], [-30, -36], [-44, 4]]];
  /* 当たり判定：絵と同じ形（体・頭・脚）。落ちる途中を細かく刻んで、すり抜けないようにする */
  function hitStrider(x0, y0, x1, y1, wy, r) {
    /* r は立体で描く涙の半径。涙の縁が触れたら当たり */
    var k = RX / 188 * 0.6, d = faceDir >= 0 ? 1 : -1, tr = r / k;
    var n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 4));
    for (var s = 1; s <= n; s++) {
      var px = x0 + (x1 - x0) * s / n, py = y0 + (y1 - y0) * s / n;
      var lx = (px - sx) / (d * k), ly = (py - (wy - 3)) / k;
      if (ly < -60 - tr || ly > 8 + tr || Math.abs(lx) > 80 + tr) continue;
      /* 体の真ん中は、体の上から水面までの帯で受ける（すり抜けを防ぐ） */
      if (lx > -36 - tr && lx < 50 + tr && ly > -38 - tr && ly < 4) return true;
      var ex = (lx + 2) / (34 + tr), ey = (ly + 24) / (12 + tr);
      if (ex * ex + ey * ey < 1) return true;
      ex = (lx - 38) / (11 + tr); ey = (ly + 28) / (9 + tr);
      if (ex * ex + ey * ey < 1) return true;
      for (var j = 0; j < LEGS.length; j++) {
        var l = LEGS[j];
        for (var q = 0; q <= 12; q++) {
          var u = q / 12, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
          var cx = a * l[0][0] + b * l[1][0] + c * l[2][0], cy = a * l[0][1] + b * l[1][1] + c * l[2][1];
          if ((lx - cx) * (lx - cx) + (ly - cy) * (ly - cy) < (4 + tr) * (4 + tr)) return true;
        }

  }
  function drawStrider() {
    var y = waterY(), k = RX / 188, g = gulp;
    if (Math.abs(sv) > 20) faceDir += ((sv > 0 ? 1 : -1) - faceDir) * 0.25;
    var d = faceDir >= 0 ? 1 : -1;
    var bob = Math.sin(T * 7) * 1.5;
    var OUT = "#1b2433";
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    k *= 0.6;
    /* 足元のくぼみ */
    ctx.strokeStyle = "rgba(235,248,255,.8)"; ctx.lineWidth = 1.5;
    [-70, -44, 44, 74].forEach(function (lx) { ctx.beginPath(); ctx.ellipse(sx + lx * k, y + 1, 11 * k, 3 * k, 0, 0, Math.PI * 2); ctx.stroke(); });
    ctx.translate(sx, y - 3 + bob * 0.6);

    });

    ctx.strokeStyle = OUT; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(44, -36); ctx.quadraticCurveTo(56, -48, 66, -44); ctx.stroke();

    ctx.fillStyle = "#4fd18b"; ctx.strokeStyle = OUT; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(-2, -24, 34, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(38, -28, 11, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    /* 点の目 */
    ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(42, -30, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }



  /* 涙を取ったときに画面の縁を光らせる */
  function drawGlow() {
    if (glow <= 0.01) return;
    var a = glow * 0.55, e = 70;
    ctx.save();
    [[0, 0, 0, e, 0, 0, W, e], [0, H, 0, H - e, 0, H - e, W, e], [0, 0, e, 0, 0, 0, e, H], [W, 0, W - e, 0, W - e, 0, e, H]].forEach(function (q) {
      var gr = ctx.createLinearGradient(q[0], q[1], q[2], q[3]);
      gr.addColorStop(0, "rgba(150,230,255," + a + ")"); gr.addColorStop(1, "rgba(150,230,255,0)");
      ctx.fillStyle = gr; ctx.fillRect(q[4], q[5], q[6], q[7]);
    });
    ctx.restore();
  }

  /* 立体の絵。作れないとき（WebGLなし）は平面の絵のまま */
  var scene3d = null, tries3d = 0, lastTry3d = -1e9, lastPoseT = 0;
  function make3d() {
    if (scene3d || tries3d >= 20 || !window.THREE || !window.ManScene) return;
    var now = performance.now();
    if (now - lastTry3d < 500) return;
    lastTry3d = now; tries3d++;
    try { scene3d = new window.ManScene(); } catch (e) { scene3d = null; }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT && !hideUI);
    ctx.clearRect(0, 0, W, H);
    drawBack();
    make3d();
    var ok3 = false;
    if (scene3d) {
      try {
        scene3d.build({ W: W, H: H, FX: FX, FY: FY, RX: RX, RY: RY, CW: 40, CH: 110 });
        scene3d.pose({ T: T, dt: Math.max(0, T - lastPoseT), burst: burst, tears: tears, drops: drops, level: waterY(), ripples: ripples, strider: { x: sx, y: waterY(), v: sv, gulp: gulp } });
        lastPoseT = T;

    }
    if (!ok3) { drawBody(); drawFace(); drawTears(); drawWater(); }
    if (state !== S.RESULT || true) drawStrider();
    drawGlow();
    if (state === S.PLAY && !hideUI) {
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 8;
      ctx.font = "800 40px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(ml() + "ml", W / 2, Math.max(56, FY - RY - 26));
      ctx.restore();

  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    ctx.font = "800 108px sans-serif";
    var num = ml(), unit = "ml";
    var nw = ctx.measureText(num).width;
    ctx.font = "800 54px sans-serif";
    var uw = ctx.measureText(unit).width;
    var x0 = W / 2 - (nw + 8 + uw) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif";
    ctx.fillText(num, x0, H * 0.45);
    ctx.font = "800 54px sans-serif";
    ctx.fillText(unit, x0 + nw + 8, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, fill: fill, tears: tears.length, T: T, W: W, H: H, FY: FY }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    skip: function (n) { for (var i = 0; i < (n || 1); i++) update(1 / 60); },
    go: function (x) { sxT = x; },
    falling: function () { return tears.filter(function (t) { return !t.onFace; }).map(function (t) { return { x: t.x, y: t.y }; }); },
    strider: function () { return sx; },
    hideUI: function (v) { hideUI = v !== false; draw(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 120)) throw Error("終わらない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); bgmStart(); newRound(); });
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));

  }
  requestAnimationFrame(loop);
})();
