<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>画素あみだ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #16202e; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 画素あみだ

   画面の実際の画素で引いたあみだくじ。縦線は1画素おき、横線も1画素。
   画素の細かい端末ほど縦線が増え、当たりを引くのがむずかしくなる。
   上でタップした所から、選んだ縦線をたどって下まで一気に降りる。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     見た目の寸法は 540 幅。絵の画素数は端末の画素比をそのまま使う（上限をかけない）。 */
  var W = 540, H = 960, K = 1;   /* K = ゲーム座標1あたりの画素数 */
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    var dpr = window.devicePixelRatio || 1;
    var cssW = parseFloat(canvas.style.width) || W, cssH = parseFloat(canvas.style.height) || H;
    canvas.width = Math.max(9, Math.round(cssW * dpr));
    canvas.height = Math.max(9, Math.round(cssH * dpr));
    K = canvas.width / W;
    if (state === S.INTRO || state === S.PICK || !rung) build();
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ あみだ ============
     縦線 i は画素の列 2i+1。横線は行 y で、縦線 i と i+1 の間の画素 2i+2 を埋める。 */
  var PW = 0, PH = 0, NL = 0, Y0 = 0, Y1 = 0, GAPS = 0;
  var rung = null, layer = null, lctx = null, img = null, px32 = null, dirty = false;
  var LINE = 0xffe6dccb, BG = 0xff2e2016, TRACE = 0xff5533ff;   /* 色（並びは A B G R） */
  var TOP = 150, BOTTOM = 110;   /* 上下の余白（ゲーム座標）。上は選ぶところ、下は当たりの印 */
  var RUNG_P = 0.005;            /* 1行・1すき間あたりの、ばらばらの横線の出やすさ */
  var STAIR_RATE = 2.6e-3;       /* 階段の数（画素1つあたり） */
  var winLine = 0;

  function build() {
    PW = canvas.width; PH = canvas.height;
    NL = Math.max(2, Math.floor((PW - 1) / 2));
    GAPS = NL - 1;
    Y0 = Math.round(TOP * K); Y1 = Math.max(Y0 + 4, PH - Math.round(BOTTOM * K));
    var ROWS = Y1 - Y0;
    rung = new Uint8Array(ROWS * GAPS);
    /* 横線は2行おき。となり同士が同じ行でつながらないようにする */
    function set(y, g) {
      if (y < 0 || y >= ROWS || g < 0 || g >= GAPS) return false;
      var r = y * GAPS;
      if ((g && rung[r + g - 1]) || (g < GAPS - 1 && rung[r + g + 1])) return false;
      rung[r + g] = 1;
      return true;
    }
    /* 斜めに続く階段。乗ると横へ大きく流される。上下いくつかの帯ごとに流れる向きをそろえる */
    var bands = [];
    for (var b = 0; b < 5; b++) bands.push(Math.random() < 0.5 ? 1 : -1);
    var stairs = Math.round(NL * ROWS * STAIR_RATE), len = NL * 0.7;
    for (var s2 = 0; s2 < stairs; s2++) {
      var y = 2 * ((Math.random() * ROWS / 2) | 0), g = (Math.random() * GAPS) | 0;
      var d = bands[Math.min(bands.length - 1, Math.floor(y / ROWS * bands.length))], L = (len * (0.3 + Math.random())) | 0;
      for (var k = 0; k < L; k++) { if (!set(y, g)) break; y += 2; g += d; }
    }
    for (var y2 = 0; y2 < ROWS; y2 += 2) for (var g2 = 0; g2 < GAPS; g2++) if (Math.random() < RUNG_P) set(y2, g2);
    winLine = (Math.random() * NL) | 0;
    layer = document.createElement("canvas");
    layer.width = PW; layer.height = PH;
    lctx = layer.getContext && layer.getContext("2d");
    img = lctx && lctx.createImageData ? lctx.createImageData(PW, PH) : null;
    px32 = img && img.data && img.data.buffer ? new Uint32Array(img.data.buffer) : null;
    if (px32) {
      px32.fill(BG);
      for (var yy = Y0; yy < Y1; yy++) {
        var base = yy * PW, r0 = (yy - Y0) * GAPS;
        for (var i = 0; i < NL; i++) px32[base + 2 * i + 1] = LINE;
        for (var j = 0; j < GAPS; j++) if (rung[r0 + j]) px32[base + 2 * j + 2] = LINE;
      }
    }
    dirty = true;
  }
  function flush() {
    if (dirty && img && lctx) lctx.putImageData(img, 0, 0);
    dirty = false;
  }
  /* 縦線 l の行 y（あみだの中の行）で、横線があれば渡る */
  function stepRow(l, y) {
    var r0 = y * GAPS;
    if (l < GAPS && rung[r0 + l]) return l + 1;
    if (l > 0 && rung[r0 + l - 1]) return l - 1;
    return l;
  }
  function endOf(l) { for (var y = 0; y < Y1 - Y0; y++) l = stepRow(l, y); return l; }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PICK: "pick", RUN: "run", END: "end", RESULT: "result" };
  var state = S.INTRO, T = 0;
  var head = { l: 0, y: 0 }, startLine = 0, crossings = 0, acc = 0, tickT = 0;
  var ROWS_PER_SEC = 900;   /* 降りる速さ（画素の行/秒）。どの端末でもほぼ同じ時間で降りる */

  function newRound(fresh) {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    if (fresh) build();
    state = S.PICK;
    T = 0;
  }
  function pick(x) {
    startLine = Math.max(0, Math.min(NL - 1, Math.round((x * K - 1) / 2)));
    head.l = startLine; head.y = 0;
    crossings = 0; acc = 0;
    state = S.RUN;
    tone(880, 0.08, 0.1, "square");
  }
  function paint(px, py) { if (px32) px32[py * PW + px] = TRACE; dirty = true; }

  function update(dt) {
    if (state === S.RUN) {
      /* 行の速さは画面の高さに合わせる（高い画素数でも同じくらいの時間） */
      acc += dt * ROWS_PER_SEC * K / 2.2;
      while (acc >= 1 && state === S.RUN) {
        acc -= 1;
        var y = head.y, l = head.l;
        paint(2 * l + 1, Y0 + y);
        var nl = stepRow(l, y);
        if (nl !== l) { paint(2 * Math.min(l, nl) + 2, Y0 + y); paint(2 * nl + 1, Y0 + y); crossings++; }
        head.l = nl;
        head.y++;
        if (head.y >= Y1 - Y0) { finish(); break; }
      }
      tickT -= dt;
      if (tickT <= 0) { tickT = 0.035; tone(600 + 900 * (head.l / NL), 0.03, 0.04, "square"); }
      return;
    }
    if (state === S.END) {
      T += dt;
      if (T > 1.2) { state = S.RESULT; shareButton.hidden = false; }
    }
  }
  function finish() {
    state = S.END; T = 0;
    if (head.l === winLine) {
      tone(523, 0.12, 0.16, "triangle"); tone(659, 0.12, 0.16, "triangle", null, 0.1);
      tone(784, 0.12, 0.16, "triangle", null, 0.2); tone(1047, 0.4, 0.18, "triangle", null, 0.3);
    } else tone(300, 0.3, 0.12, "sawtooth", 150);
  }
  function off() { return Math.abs(head.l - winLine); }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.PICK && x != null) { pick(x); return; }
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound(true);
    }
  }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1 && state === S.PICK) {                        /* 当たる線を選ぶ */
      for (var l = 0; l < NL; l++) if (endOf(l) === winLine) { pick((2 * l + 1) / K); return; }
    }
    if (n === 2 && state === S.RUN) acc += 1e9;               /* 一気に下まで */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (e.key === "Escape") { e.preventDefault(); if (state !== S.INTRO) newRound(true); return; }
    if (!go) return;
    e.preventDefault();
    if (e.repeat) return;
    if (state === S.INTRO) { startButton.click(); return; }
    if (state === S.PICK) { pick(W / 2); return; }
    down();
  });

  function numText(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function doShare() {
    var n = numText(NL), d = off();
    var text = d === 0
      ? zT(n + "本の画素あみだで当たりを引いた", "Hit the prize on a " + n + "-line pixel ladder")
      : zT(n + "本の画素あみだで当たりから" + numText(d) + "本ずれた", "Missed the prize by " + numText(d) + " lines on a " + n + "-line pixel ladder");
    /* 英語のときのハッシュタグは英語のゲーム名にする */
    window.zResultActions.x({ text: text + zT(" #画素あみだ", " #PixelLadder") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function gx(px) { return (px + 0.5) / K; }

  /* 虫めがね。たどっている先の画素を大きくして見せる */
  var LOUPE_R = 110, LOUPE_Z = 8;
  function drawLoupe(cx, cy, px, py) {
    if (!layer) return;
    var half = Math.ceil(LOUPE_R / LOUPE_Z) + 1;
    var x0 = Math.max(0, px - half), y0 = Math.max(0, py - half), x1 = Math.min(PW, px + half + 1), y1 = Math.min(PH, py + half + 1);
    var ox = cx - (px + 0.5) * LOUPE_Z, oy = cy - (py + 0.5) * LOUPE_Z;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, LOUPE_R, 0, Math.PI * 2);
    ctx.save(); ctx.clip();
    ctx.fillStyle = "#16202e"; ctx.fillRect(cx - LOUPE_R, cy - LOUPE_R, LOUPE_R * 2, LOUPE_R * 2);
    if (x1 > x0 && y1 > y0) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(layer, x0, y0, x1 - x0, y1 - y0, ox + x0 * LOUPE_Z, oy + y0 * LOUPE_Z, (x1 - x0) * LOUPE_Z, (y1 - y0) * LOUPE_Z);
      ctx.imageSmoothingEnabled = true;
    }
    ctx.restore();
    ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    flush();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#16202e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (layer) {
      ctx.imageSmoothingEnabled = false;
      var sc = canvas.width / Math.max(1, PW);
      ctx.drawImage(layer, 0, 0, PW * sc, PH * sc);
      ctx.imageSmoothingEnabled = true;
    }
    ctx.setTransform(K, 0, 0, K, 0, 0);

    /* 当たりの印（下）。1画素の線の真下に金色の三角 */
    var wx = gx(2 * winLine + 1), by = Y1 / K;
    ctx.beginPath(); ctx.moveTo(wx, by + 8); ctx.lineTo(wx - 16, by + 38); ctx.lineTo(wx + 16, by + 38); ctx.closePath();
    ctx.fillStyle = "#ffcf3f"; ctx.fill();

    if (state === S.RUN || state === S.END || state === S.RESULT) {
      var hx = gx(2 * head.l + 1), hy = (Y0 + head.y) / K;
      /* 選んだ所の印（上） */
      var sx = gx(2 * startLine + 1);
      ctx.beginPath(); ctx.moveTo(sx, Y0 / K - 8); ctx.lineTo(sx - 14, Y0 / K - 34); ctx.lineTo(sx + 14, Y0 / K - 34); ctx.closePath();
      ctx.fillStyle = "#ff3355"; ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy, 9, 0, Math.PI * 2);
      ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = "#ff3355"; ctx.stroke();
      if (state === S.RUN) drawLoupe(hx < W / 2 ? W - LOUPE_R - 24 : LOUPE_R + 24, Math.min(H - LOUPE_R - 24, Math.max(LOUPE_R + 24, hy)), 2 * head.l + 1, Y0 + head.y);
    }
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = off() === 0 ? "#ffcf3f" : "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    var t = off() === 0 ? zT("当たり", "WIN") : zT(numText(off()) + "本ずれ", numText(off()) + " off");
    var size = 108;
    ctx.font = "800 " + size + "px sans-serif";
    while (size > 40 && ctx.measureText && ctx.measureText(t).width > W - 60) { size -= 4; ctx.font = "800 " + size + "px sans-serif"; }
    ctx.fillText(t, W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, NL: NL, rows: Y1 - Y0, head: { l: head.l, y: head.y }, start: startLine, win: winLine, crossings: crossings, PW: PW, PH: PH, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    pick: function (x) { pick(x); },
    endOf: function (l) { return endOf(l); },
    reset: function () { newRound(true); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(4000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(false); });
  startButton.hidden = false;
  shareButton.hidden = true;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
