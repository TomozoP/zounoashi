<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ランダムボーリング</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/cannon.js"></script>
<script src="physics.js"></script>
<script src="scene.js"></script>
<script src="../share.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* ランダムボーリング。奥行きのある座標で動かし、透視投影して描く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var view3d=window.WebGLRenderingContext?new ZBowlingScene():null;
  var world=new ZBowlingPhysics.Game();
  var frameDt=1/60;

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if(view3d)view3d.resize(canvas.width,canvas.height);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  function audioOn() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });


  /* 半径・質量・摩擦・反発・速度。毎投、独立した等確率の抽選。 */
  var kinds=ZBowlingPhysics.kinds;
  var S = { PLAY:'play', RESULT:'result' };
  var state, score, T, held, keyMode=false, phase, shot, pins, ball, kind, aim, elapsed, history, scoreTime=0, position=0, dragX=0, dragY=0, dragAim=0, power=1;
  function place() {}
  function clamp(v,a,b) { return Math.max(a,Math.min(b,v)); }
  function syncPhysics() {var snapshot=world.snapshot();pins=snapshot.pins;ball=snapshot.ball;}
  function nextBall() {
    kind=kinds[Math.floor(Math.random()*kinds.length)];
    phase='return';power=1;position=0;held=false;aim=0;elapsed=0;world.reset(kind);syncPhysics();
  }
  function newRound() {
    state=S.PLAY;scoreTime=0;score=0;T=0;held=false;shot=0;history=[];nextBall();
  }
  function startPower() {phase='power';elapsed=0;power=1;}
  function launch() {
    if(state!==S.PLAY||phase!=='power')return;
    world.launch(position,aim,.45+.85*power);syncPhysics();phase='roll';elapsed=0;tone(100,.18,.06,'sine',45);
  }
  function update(dt) {
    frameDt=dt;T+=dt;
    scoreTime=Math.max(0,scoreTime-dt);
    if(state!==S.PLAY) return;
    elapsed+=dt;
    if(phase==='return') {if(elapsed>=1.2) {phase='receive';elapsed=0;}return;}
    if(phase==='receive') {if(elapsed>=.2) {phase='place';elapsed=0;}return;}
    if(phase==='place') {if(elapsed>=.4) {phase='position';elapsed=0;}return;}
    if(phase==='power') {power=.35+.65*(.5+.5*Math.cos(elapsed*Math.PI*2/1.8));return;}
    if(phase==='receive'||phase==='position'||phase==='angle') return;
    if(phase==='roll') {
      world.step(dt);syncPhysics();
      if(world.impact>1) {noiseHit(.06+Math.min(.15,world.impact*.006),500+world.impact*70,Math.min(.2,world.impact*.009));world.impact=0;}
      if(world.finished()) {var fallen=pins.filter(function(p){return p.down;}).length;history.push(fallen);score+=fallen;shot++;scoreTime=2;phase='settle';elapsed=0;}
    } else if(elapsed>1) {if(shot===10) state=S.RESULT;else nextBall();}
  }
  function down(x,y) {
    audioOn();
    if(state===S.RESULT) {
      var hit=x==null?'retry':hitButton(x,y);
      if(hit==='share') doShare();else if(hit==='retry') newRound();
      return;
    }
    if(x==null) {
      if(phase==='position') phase='angle';
      else if(phase==='angle') startPower();
      else if(phase==='power') launch();
      return;
    }
    if(y<80) return;
    if(phase==='power') {launch();return;}
    if(phase!=='position'&&phase!=='angle') return;
    if(phase==='position') position=clamp((view3d?view3d.screenX(x):(x-270)*9.65/720),-2.1,2.1);
    held=true;dragX=x;dragY=y;dragAim=aim;
  }
  function move(x,y) {
    if(!held) return;
    if(phase==='position') position=clamp((view3d?view3d.screenX(x):(x-270)*9.65/720),-2.1,2.1);
    else if(phase==='angle') aim=clamp(dragAim+(x-dragX)/600,-.3,.3);
  }
  function up() {
    if(!held) return;
    held=false;
    if(phase==='position') phase='angle';
    else if(phase==='angle') startPower();
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { held=false; });
  window.addEventListener("blur", function () { held=false; });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      if(phase==='position') position=clamp(position+(left?-.12:.12),-2.1,2.1);
      else if(phase==='angle') aim=clamp(aim+(left?-.012:.012),-.3,.3);
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") up();
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    zShare({ text: score + "/100 #ランダムボーリング" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }


  /* ガイドと球名を、三次元の球と同じ画面位置へ重ねる。 */
  function project(x,y,z) {
    if(view3d)return view3d.project(x,y,z);
    var d=z+9;return {x:270+720*x/d,y:100+((H-260)*9-720*y)/d,k:720/d};
  }
  /* 位置は横向き、角度は弧を描く矢印で示す。文字は足さない。 */
  function drawGuide() {
    if(state!==S.PLAY || (phase!=='position'&&phase!=='angle')) return;
    var center=project(position,kind.r,.65);
    ctx.save();ctx.translate(center.x,center.y-65);
    var size=Math.min(1,(Math.min(center.x,W-center.x)-8)/161);ctx.scale(size,size);ctx.fillStyle='#ee3025';
    [-1,1].forEach(function(side) {
      ctx.save();ctx.scale(side,1);
      ctx.beginPath();
      if(phase==='position') {
        ctx.moveTo(62,-7);ctx.lineTo(119,-7);ctx.lineTo(119,-19);
        ctx.lineTo(161,0);ctx.lineTo(119,19);ctx.lineTo(119,7);ctx.lineTo(62,7);
      } else {
        ctx.moveTo(99,31);ctx.bezierCurveTo(152,16,157,-11,111,-28);
        ctx.lineTo(119,-42);ctx.lineTo(72,-35);ctx.lineTo(102,-6);
        ctx.lineTo(104,-18);ctx.bezierCurveTo(130,-7,129,8,89,17);
      }
      ctx.closePath();ctx.fill();ctx.restore();
    });
    ctx.restore();
  }
  function draw() {
    ctx.fillStyle='#142a37';ctx.fillRect(0,0,W,H);
    if(view3d)view3d.draw(ctx,W,H,{pins:pins,ball:ball},kind,phase,elapsed,position,aim,frameDt,power);
    if(phase==='position'||phase==='angle'||phase==='power') {
      var p=project(position,kind.r,.65);
      ctx.fillStyle='#f5f2eb';ctx.font='600 20px sans-serif';ctx.textAlign='center';
      ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=5;ctx.fillText(kind.name,p.x,p.y+p.k*kind.r*(kind.skin===8?1.45:1)+29);ctx.shadowBlur=0;
    }
    /* 投球結果を書き込んだときだけ、背景付きで二秒間見せる。 */
    if(scoreTime>0) {
      ctx.save();ctx.globalAlpha=Math.min(1,scoreTime/.25);
      ctx.fillStyle='#101f29';ctx.fillRect(0,0,W,80);
    for(var i=0;i<10;i++) {
      var x=24+i*49;ctx.fillStyle='#2c414c';roundRect(x,11,43,43,10);ctx.fill();
      ctx.textAlign='center';ctx.fillStyle='#c2d2d7';ctx.font='600 18px sans-serif';ctx.fillText(history[i]==null?'·':String(history[i]),x+21.5,39);
    }
      ctx.restore();
    }
    drawGuide();
    if(state===S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 68, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state:state,score:score,scoreTime:scoreTime,W:W,H:H,phase:phase,position:position,shot:shot,aim:aim,power:power,kind:kind.name,history:history.slice(),ball:ball?Object.assign({},ball):null,cameraFollow:view3d?view3d.follow:0,modelsReady:view3d?view3d.modelReady:false,pins:pins.map(function(p){return Object.assign({},p);}),kinds:kinds.map(function(k){return Object.assign({},k);}) }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      for(var i=0;i<10;i++) {
        if(!await r.until(function(){return phase==='position';},3)) throw Error('球が出てこない');
        r.key();await r.wait(350);r.key();await r.wait(450);r.key();
        if(!await r.until(function(){return phase==='position'||state===S.RESULT;},14)) throw Error('投球が終わらない');
      }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  newRound();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
