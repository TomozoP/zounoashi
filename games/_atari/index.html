<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>あたりくじ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../celebrate.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* あたりくじ

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", WIN: "win", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  /* ハズレは全部「あた」で始まる（文章多め）。あたりは1本だけ */
  var HAZURE = "あたりじゃないです あたりはとなりのぼう あたりませんでした あたりまえのことです あたりだとおもった？ あたりめがたべたい あたまがいたいです あたまをなでてほしい あたらしいくつをかった あたためますか あたりはもうちょっとおく あたりはひだりのほう あたりはみぎかも あたりまであとすこし あたりまでまだまだ あたりかとおもった あたりをひきたいね あたりがでますように あたりませんように あたしがあたりよ あたしははずれ あたまからいこう あたまではわかってる あたらしいかぜがふく あたたかいおちゃどうぞ あたためなおしてね あたえられたしごと あたまがまっしろ あたりさわりのないこと あたりいちめんゆきげしき あたりはずれがある あたりどしになりそう あたりやにきをつけて あたりくじはこっち あたりっていいたい あたりかもしれない あたりのよかんがする あたりそうでこわい あたったらおしえて あたったことがない あたるもはっけ あたらしいでんわ あたまがいいね あたまをつかおう あたまにのせてみて あたふたしないで あたいはむてき あたかもあたりのように あたみにいきたい あたりのにおいがする あたりのとなり あたりのともだち あたりのおとうと あたりのいとこ あたりのうわさ あたりをさがせ あたりはもうないかも あたりまえだのはずれ あたりはあっちです あたりならよかったね あたま あたりまえ あたりめ あたりくじ あたりじゃない あたらしい あたためる あたたかい あたふた あたかも あたし あたい あたる あたった あたって あたれ あたみ あたご あたりや あたりどし あたりはずれ あたりさわり あたりちらす あたりかまわず あたりばち あたりそう あたりかも あたりません あたります あたりがいい あたりきしゃりき あたりやく あたらない あたまでっかち あたまきた あたりかな あたりはどれ あたぼう あたっく あたしんち".split(" ");
  var ATARI = "あたり";

  /* 立体の大きさ（scene3d.js）。読めなかったときも進行だけは動くようにする */
  var K = window.KUJI3D || { C: 0.34, SW: 0.42, R: 2.35, hideY: function () { return 0; } };
  var sticks, gone, popup, confetti, sel, grab, winT, winStick;

  function place() {}

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* 棒は口の位置 (x, z) から、外向きに少し傾いて刺さっている。
     先から1文字分あけて文字、言葉の下も1文字分。最初は「あた」まで見えて、3文字目から下は筒の手前の壁に隠れる */
  function makeSticks() {
    var words = shuffle(HAZURE.concat([ATARI]));
    var list = [], R = K.R - K.SW * 0.6;
    for (var i = 0; i < words.length; i++) {
      var w = words[i], ang = Math.random() * Math.PI * 2, rr = R * Math.sqrt(Math.random());
      var x = Math.cos(ang) * rr, z = Math.sin(ang) * rr;
      var dx = x * 0.07 + (Math.random() - 0.5) * 0.06, dz = z * 0.05 + (Math.random() - 0.5) * 0.04;
      var n = Math.hypot(dx, 1, dz), d = { x: dx / n, y: 1 / n, z: dz / n };
      var hide = K.hideY(x, z) - 0.03;
      var v = 3 * K.C + hide / d.y;            /* 口から上に出ている長さ */
      var Ls = K.C * (w.length + 2);
      list.push({ word: w, x: x, z: z, d: d, v: v, Ls: Ls, pop: Ls - v + hide / d.y + 0.05, p: 0, fly: null });
    }
    return list;
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    sticks = makeSticks();
    gone = [];
    popup = null;
    grab = null;
    sel = 0;
    winT = 0;
    winStick = null;
    confetti = window.zCelebrate ? window.zCelebrate.confetti() : null;
    if (confetti) confetti.rain = false;
  }

  function tipOf(st) {
    var k = st.v + st.p;
    return { x: st.x + st.d.x * k, y: st.d.y * k, z: st.z + st.d.z * k };
  }

  function pop(st) {
    var i = sticks.indexOf(st);
    if (i < 0) return;
    sticks.splice(i, 1);
    if (grab && grab.st === st) grab = null;
    held = false;
    score++;
    if (sel >= sticks.length) sel = Math.max(0, sticks.length - 1);
    gone.push(st);
    if (st.word === ATARI) {
      state = S.WIN;
      winT = 0;
      winStick = st;
      popup = { word: st.word, t: 0, win: true };
      noiseHit(0.08, 2400, 0.25, 2);
      if (AC && window.zCelebrate) window.zCelebrate.play(AC, "fanfare");
      if (confetti) confetti.burst(W, H, 180);
      return;
    }
    var t = tipOf(st), side = st.x >= 0 ? 1 : -1;
    st.fly = { x: t.x, y: t.y, z: t.z, vx: side * (2 + Math.random() * 3), vy: 7 + Math.random() * 2, vz: Math.random() - 0.5, r: 0, vr: side * -(3 + Math.random() * 5) };
    popup = { word: st.word, t: 0 };
    noiseHit(0.06, 1800, 0.2, 2);
    tone(150, 0.32, 0.12, "sawtooth", 110, 0.05);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.INTRO || state === S.RESULT) return;
    T += dt;
    if (popup) popup.t += dt;
    if (confetti) confetti.step(dt, W, H);
    for (var i = gone.length - 1; i >= 0; i--) {
      var f = gone[i].fly;
      if (!f) continue;
      f.vy -= 22 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.r += f.vr * dt;
      if (f.y < -14) gone.splice(i, 1);
    }
    if (state === S.WIN) {
      winT += dt;
      if (winT > 2.4) { state = S.RESULT; }
      return;
    }
    for (var j = 0; j < sticks.length; j++) {
      var st = sticks[j];
      if (grab && grab.st === st) {
        if (grab.key) st.p += 3.2 * dt;
      } else if (st.p > 0) {
        st.p = Math.max(0, st.p - 2.6 * dt);   /* 手を離すと戻っていく */
      }
      if (st.p >= st.pop) { pop(st); j--; }
    }
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    if (x == null) {                           /* キー：選んでいる棒を引き続ける */
      var ks = sticks[sel];
      if (!ks) return;
      grab = { st: ks, key: true };
      held = true;
      tone(520, 0.05, 0.06, "triangle");
      return;
    }
    var s3 = scene3d();
    var st = s3 ? s3.pick(x, y, W, H, sticks) : null;
    if (!st) return;
    held = true;
    grab = { st: st, x: x, y: y, p0: st.p, ax: s3.axis(st, W, H) };
    tone(520, 0.05, 0.06, "triangle");
  }
  function move(x, y) {
    if (state !== S.PLAY || !held || !grab || grab.key) return;
    var st = grab.st, a = grab.ax, L = a.x * a.x + a.y * a.y;
    if (!L) return;
    var np = Math.max(0, grab.p0 + ((x - grab.x) * a.x + (y - grab.y) * a.y) / L);
    if (Math.floor(np / K.C) !== Math.floor(st.p / K.C) && np > st.p) noiseHit(0.03, 900 + Math.random() * 400, 0.05, 3);
    st.p = np;
  }
  function up() {
    if (!held) return;
    held = false;
    grab = null;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) return;
    var i;
    if (n === 1) {                             /* 1: あたりを引く */
      for (i = 0; i < sticks.length; i++) if (sticks[i].word === ATARI) { pop(sticks[i]); return; }
    } else if (n === 2) {                      /* 2: ハズレを1本引く */
      for (i = 0; i < sticks.length; i++) if (sticks[i].word !== ATARI) { pop(sticks[i]); return; }
    } else if (n === 3) {                      /* 3: ハズレを90本ぬく */
      for (var k = 0; k < 90; k++) {
        for (i = 0; i < sticks.length; i++) if (sticks[i].word !== ATARI) { sticks.splice(i, 1); score++; break; }
      }
      sel = 0;
    }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY || held || !sticks.length) return;
      /* 左右は口の位置の順に選ぶ */
      var order = sticks.slice().sort(function (A, B) { return A.x - B.x; });
      var k = order.indexOf(sticks[sel]);
      k = Math.max(0, Math.min(order.length - 1, k + (right ? 1 : -1)));
      sel = sticks.indexOf(order[k]);
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    /* 英語のときのハッシュタグは英語のゲーム名にする（空白・記号は除く） */
    window.zResultActions.x({ text: zT(score + "本目で「あたり」を引いた", "Drew「あたり」on pull #" + score, score + "번째에 「あたり」를 뽑았다", "第" + score + "根抽中了「あたり」", "第" + score + "根抽中了「あたり」") +
      zT(" #あたりくじ", " #AtariKuji", " #AtariKuji", " #AtariKuji", " #AtariKuji") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPopup() {
    if (!popup) return;
    var t = popup.t;
    if (!popup.win && t > 1.1) return;
    var a = popup.win ? 1 : Math.min(1, (1.1 - t) / 0.25);
    var s = Math.min(1, t / 0.12);
    var n = popup.word.length;
    var fs = popup.win ? 120 : Math.min(76, 500 / n);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W / 2, H * 0.2);
    ctx.scale(0.7 + 0.3 * s, 0.7 + 0.3 * s);
    ctx.font = "900 " + fs + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 14;
    ctx.strokeStyle = popup.win ? "#b3120c" : "#3b2a20";
    ctx.strokeText(popup.word, 0, 0);
    ctx.fillStyle = popup.win ? "#fff36b" : "#fff";
    ctx.fillText(popup.word, 0, 0);
    ctx.restore();
  }

  /* 立体の場面 */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    var s3 = scene3d(), drew = false;
    if (s3) {
      try {
        s3.sync({ sticks: sticks, gone: gone, lit: grab ? grab.st : (keyMode && state === S.PLAY ? sticks[sel] : null), win: winStick, winT: winT });
        drew = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); }
    }
    if (!drew) { ctx.fillStyle = "#efdcb6"; ctx.fillRect(0, 0, W, H); }

    drawPopup();
    if (confetti) confetti.draw(ctx);

    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(zT(score + "本目", "#" + score, score + "번째", "第" + score + "根", "第" + score + "根"), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, left: sticks ? sticks.length : 0, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { document.getElementById("start").hidden = true; }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var n = 0; n < 6 && state === S.PLAY; n++) {
        sel = Math.floor(Math.random() * sticks.length);
        if (n === 5) for (var i = 0; i < sticks.length; i++) if (sticks[i].word === ATARI) sel = i;
        grab = { st: sticks[sel], key: true }; held = true;
        await r.until(function () { return !grab; }, 5);
        await r.wait(700);
      }
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };
  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
