<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>たまご立てゲーム</title>
<script src="../guard.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>
<script src="../celebrate.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* たまご立てゲーム

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  /* 卵が机の上を転がるゴロゴロ音（つないだまま音量だけ変える） */
  var roll = null;
  function rollSound(v) {
    if (!AC || !NOISE) return;
    if (!roll) {
      try {
        var src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
        var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 420; f.Q.value = 0.9;
        var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
        var g = AC.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(lp); lp.connect(g); g.connect(AC.destination); src.start();
        roll = { g: g, f: f };
      } catch (e) { return; }
    }
    var n = AC.currentTime;
    /* 殻のでこぼこで小さく揺れる */
    var j = 0.75 + Math.random() * 0.5;
    roll.g.gain.setTargetAtTime(v * 0.32 * j, n, 0.03);
    roll.f.frequency.setTargetAtTime(300 + v * 500, n, 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  /* 卵: th=重力に対する傾き(右へ+)、om=その速さ、phi=机の傾き(右が下がる+) */
  /* 360度: 傾きは向きつき(tx=右へ, tz=手前へ)。th はその大きさ */
  var th = 0, om = 0, phi = 0, grabX = 0, grabY = 0, standT = 0;
  var camYaw = 0, camSpin = 0, camFocus = 0, camSpinT = 0;
  /* 左右ガイド: 最初と、しばらく触っていないときに出す */
  var idleT = 9, guideA = 0, holdX = 0;
  /* 隠しの正解: こすって温めると孵化（hatch）、遠くの板のすき間にはまる（gap） */
  var heat = 0, hatchT = -1, rubDir = 0, rubFlipT = 0, rubLastX = 0, cupT = 0;
  var dbgSide = -1;
  var GAP_X = 6.5;
  var tx = 0, tz = 0, vx = 0, vz = 0, ax = 0, az = 0, gx = 0, gz = 0;
  var cracked = 0, crackT = 0, falling = false, fallT = 0, cleared = false, endT = 0, keyDir = 0;
  var lastY = 0, lastMoveT = 0, downY = 0, lastXm = 0;
  var G = 35, INERTIA = 0.3, ROLL_DAMP = 0.5, DIMPLE = 30, HOLD_K = 260, HOLD_C = 28;
  var K = 9.5, REST = 1.72, EPS = 0.005, STAND = 3;
  var confetti = window.zCelebrate ? window.zCelebrate.confetti() : null;

  var CY, hideUI = false;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    /* 卵は横に寝た状態から始める */
    var a0 = Math.random() < 0.5 ? 0 : Math.PI;   /* 操作は左右だけ。卵も左右の向きにだけ傾く */
    tx = Math.cos(a0) * REST; tz = Math.sin(a0) * REST; vx = vz = 0; ax = tx; az = tz; th = REST; om = 0;
    phi = 0; keyDir = 0; standT = 0;
    cracked = 0; crackT = 0; falling = false; fallT = 0; cleared = false; endT = 0;
    if (confetti) confetti.clear();
    heat = 0; hatchT = -1; rubDir = 0; cupT = 0;
    window.__eggX = 0;   /* 前の回の卵の位置が残っていると、すぐ卵立てに入ってしまう */
    camSpin = 0; camSpinT = 0; idleT = 9; guideA = 0;
  }

  /* ============ 進行 ============
     卵をつまんで左右に傾け、離すと卵だけで立つ。真上のごく狭い範囲で離したときだけ止まる。 */
  function update(dt) {
    if (confetti && state === S.RESULT) confetti.step(dt, W, H);
    /* カメラ: 遊んでいる間はゆっくり左右に回り込み、クリアしたら卵のまわりを一周する */
    if (state === S.RESULT && cleared) camSpin += dt * 0.8 * Math.min(1, (T - endT + (camSpinT += dt)) * 0.8);
    else if (state === S.PLAY) camYaw = 0.3 * Math.sin(T * 0.2);
    /* 寄り: 真上近くで寄る。結果の間はそのまま動かさない（クリアの瞬間に画がずれないように） */
    if (state === S.PLAY) camFocus += (((cracked === 1 ? th < 0.4 : cracked === 2 ? Math.PI - th < 0.4 : (th < 0.1 || Math.PI - th < 0.1)) ? 1 : 0) - camFocus) * Math.min(1, dt * 1.4);
    if (state !== S.PLAY) { rollSound(0); return; }
    T += dt;
    idleT = held ? 0 : idleT + dt;
    var showG = !held && standT === 0 && hatchT < 0 && !cupT && idleT > 2.5;
    guideA += ((showG ? 1 : 0) - guideA) * Math.min(1, dt * (showG ? 4 : 12));
    score = T;
    /* 転がる速さで音を出す */
    var sp = Math.sqrt(vx * vx + vz * vz);
    rollSound(Math.min(1, sp * Math.max(0.25, Math.sin(th) + 0.2) / 2.2));

    /* 卵立てに収まる間: 一番近い「立った向き」へ回りながら入る */
    if (cupT) {
      var tgt0 = Math.round(tx / (Math.PI * 2)) * Math.PI * 2;
      tx += (tgt0 - tx) * Math.min(1, dt * 7); vx = 0; th = Math.abs(tx - tgt0); om = 0;
      if (T - cupT > 0.5) {
        var pn = Math.floor(standT);
        standT += dt;
        if (Math.floor(standT) !== pn && standT < STAND) tone(880, 0.09, 0.12, "sine");
        if (pn === 0 && standT <= dt * 1.5) tone(880, 0.09, 0.12, "sine");
        if (standT >= STAND) { cleared = true; finish(); }
      }
      return;
    }
    /* 孵化: 温まりきったら、卵をまっすぐにして震わせ、殻が割れてヒヨコが立つ */
    if (hatchT >= 0) {
      var ht = T - hatchT;
      held = false; tx += (Math.round(tx / (Math.PI * 2)) * Math.PI * 2 - tx) * Math.min(1, dt * 6); vx = 0;
      th = 0; om = 0;
      if (ht > 3.4) { cleared = true; finish(); }
      return;
    }
    if (heat >= 1 && !cracked) {
      hatchT = T; heat = 1;
      noiseHit(0.05, 3000, 0.4, 1.4);
      return;
    }
    heat = Math.max(0, heat - dt * 0.04);
    /* 割った瞬間の一瞬の止め（ヒットストップ） */
    if (cracked && T - crackT < 0.09) return;
    if (keyMode && keyDir) { if (!held) { ax = tx; az = 0; } held = true; ax += keyDir * dt * 0.35; }

    /* ===== 物理 =====
       卵は机の上を滑らずに転がる。重心の高さ（形から計算）が下がる向きに倒れ、
       横に寝た所で揺れながら落ち着く。真上・さかさはごく狭い範囲だけ止まれる（殻のざらつき） */
    var a = tx, cr = cracked;
    var ES = window.EggShape;
    var hc = ES ? function (q) { return -ES.low(q, cr) + (ES.COM - (cr === 1 ? ES.FLAT : 0)) * Math.cos(q); } : function (q) { return 0.13 * Math.cos(q); };
    var dH = (hc(a + 0.002) - hc(a - 0.002)) / 0.004;
    var acc = -G * dH / INERTIA - ROLL_DAMP * vx;
    var am = ((a % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;   /* -π〜π */
    /* 平らな底が机に乗っている間は、底の面で受け止めて揺れが早く収まる（角で行ったり来たりしない） */
    if (cr === 1 && Math.abs(am) < 0.12) acc = -45 * am - 14 * vx;
    if (!cr && Math.abs(am) < EPS) acc += -DIMPLE * am - 3 * vx;
    var up = am > 0 ? Math.PI - am : -Math.PI - am;                          /* さかさからのずれ */
    if (!cr && Math.abs(up) < EPS * 0.6) acc += DIMPLE * 3 * up - 3 * vx;
    if (cr === 2 && Math.abs(up) < 0.08) acc = 45 * up - 14 * vx;
    /* 板のすき間: 起きぎみの卵の足もとが、すき間の上に来たらはまって立つ */
    /* 遠くの卵立て: 卵がそこまで転がって当たったら、どんな向きでもすっぽり収まって立つ */
    var ex = window.__eggX || 0;
    if (!cupT && !cr && T > 0.2 && Math.abs(ex) >= GAP_X - 0.45) {
      cupT = T; held = false; noiseHit(0.06, 1500, 0.3, 2); tone(1320, 0.08, 0.08, "sine", 0, 0.32);
    }
    if (held) {
      /* 指はばねのように卵を引っぱる（ぴったり張りつかない）。指先のわずかな震え */
      var jx = Math.sin(T * 9.3) * 0.005 + Math.sin(T * 5.1) * 0.004;
      acc += HOLD_K * (ax + jx - a) - HOLD_C * vx;
    }
    vx += acc * dt; tx += vx * dt; tz = 0; vz = 0;
    am = ((tx % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
    th = Math.abs(am); om = Math.abs(vx);
    if (held) { standT = 0; return; }
    var prevN = Math.floor(standT);
    if (((cracked === 1 && th < 0.3) || (cracked === 2 && Math.PI - th < 0.18) || th < EPS || Math.PI - th < EPS * 0.6) && om < 0.06) standT += dt; else standT = 0;
    /* 静止したら 1,2,3,4,5 と数える */
    if (standT > 0 && Math.floor(standT) !== prevN && standT < STAND) tone(880, 0.09, 0.12, "sine");
    if (standT > 0 && prevN === 0 && standT <= dt * 1.5) tone(880, 0.09, 0.12, "sine");
    if (standT >= STAND) { cleared = true; finish(); }
  }
  function finish() {
    state = S.RESULT; endT = T;
    if (cleared) {
      if (AC && window.zCelebrate) window.zCelebrate.play(AC, "fanfare");
      if (confetti) confetti.burst(W, H, 160);
    }
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function limitAim() {}
  /* 下へはやくはじくと、底を割って立てる */
  function crack() {
    /* 立てる向きの端（下になっている方）を割る。逆さならとがった方 */
    if (state !== S.PLAY || cracked) return;
    /* はっきり立ちかけ（真上・逆さから約14°以内）のときだけ割れる */
    if (th <= 0.25) cracked = 1; else if (Math.PI - th <= 0.25) cracked = 2; else return;
    crackT = T;
    held = false; keyDir = 0; om = 0; vx = vz = 0;
    noiseHit(0.05, 3200, 0.7, 1.2); noiseHit(0.09, 1800, 0.5, 2); noiseHit(0.22, 600, 0.45, 0.7); tone(140, 0.14, 0.32, "triangle", 60);
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) return;
    held = true;
    /* 寝ている卵はつまむと少し起きる */
    var m = Math.sqrt(tx * tx + tz * tz);
    gx = tx; gz = tz;
    ax = gx; az = gz;
    grabX = x; grabY = y; holdX = x; rubLastX = x; lastXm = x; rubDir = 0; downY = lastY = y; lastMoveT = performance.now();
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* こする: 左右に細かく往復させるほど温まる（ゆっくり大きく動かすのは数えない） */
    var rdx = x - rubLastX, nowR = performance.now();
    if (Math.abs(rdx) > 2) {
      var d = rdx > 0 ? 1 : -1;
      if (d !== rubDir) { if (nowR - rubFlipT < 350) { heat += 0.035; noiseHit(0.05, 2400, 0.05, 1); } rubDir = d; rubFlipT = nowR; }
      rubLastX = x;
    }
    holdX = x;
    ax = gx + (x - grabX) / W * 1.8; az = 0;
    var now = performance.now(), dtm = Math.max(1, now - lastMoveT);
    /* 下へのすばやいスワイプ（横の動きより縦が大きいとき）だけ */
    if ((y - lastY) / dtm > 2.2 && y - downY > 50 && Math.abs(x - lastXm) < (y - lastY)) crack();
    lastY = y; lastXm = x; lastMoveT = now;
  }
  function up() {
    if (!held) return;
    held = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1) { startButton.hidden = true; newRound(); }
    if (n === 2) { startButton.hidden = true; newRound(); tx = 0.28; tz = 0; th = 0.28; crack(); }
    if (n === 3) { startButton.hidden = true; newRound(); tx = 0.003; tz = 0; th = 0.003; vx = vz = 0; }
    if (n === 5) { startButton.hidden = true; newRound(); tx = Math.PI - 0.002; tz = 0; th = tx; vx = vz = 0; }
    if (n === 6) { startButton.hidden = true; newRound(); window.__eggJump = -(GAP_X - 0.9); tx = -0.3; vx = 0; }   /* 左の塩の手前 */
    if (n === 7) { startButton.hidden = true; newRound(); held = true; gx = tx; ax = tx + 9; grabX = 0; }
    if (n === 8) { startButton.hidden = true; newRound(); tx = Math.PI - 0.1; tz = 0; th = tx; vx = vz = 0; crack(); }
    if (n === 9) { startButton.hidden = true; newRound(); tx = 0.3; heat = 1; }
    if (n === 0) { startButton.hidden = true; newRound(); window.__eggJump = GAP_X - 0.9; tx = 0.3; vx = 0; }   /* 右の卵立ての手前 */
    if (n === 4) { startButton.hidden = true; newRound(); tx = 0.04; tz = 0; th = 0.04; vx = vz = 0; }
    /* ▼DEBUG: 数字キーで飛ぶ先。基本は「n を押すと n 番目の場面・工程の始めへ直接飛ぶ」（前は済ませた状態。開始前や結果画面からでも飛べる）。
       結果を直接出すより「次の操作でそうなる」形を優先（次に引くのが当たり、次の一押しでクリアなど）。録画で本物の動きが撮れる */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); crack(); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      keyDir = left ? -1 : 1;
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (/^Arrow(Left|Right)$|^[aAdD]$/.test(e.key)) { keyDir = 0; held = false; }
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    /* 英語のときのハッシュタグは英語のゲーム名にする（空白・記号は除く） */
    var s = score.toFixed(1);
    /* 割ったかどうかは言わない（割れることは秘密）。逆さに立てたときだけ言い方を変える */
    var text = hatchT >= 0
      ? zT(s + "秒で卵からヒヨコが立ちました", "A chick hatched and stood up in " + s + "s", s + "초 만에 달걀에서 병아리가 일어섰습니다", "用" + s + "秒孵出小鸡站起来了", "用" + s + "秒孵出小雞站起來了")
      : cracked
      ? zT("誰にでもできる方法で、" + s + "秒で卵を立てました", "I stood an egg up in " + s + "s, in a way anyone could do", "누구나 할 수 있는 방법으로 " + s + "초 만에 달걀을 세웠습니다", "用谁都会的方法，" + s + "秒把蛋立起来了", "用誰都會的方法，" + s + "秒把蛋立起來了")
      : cupT && (window.__eggX || 0) < 0
      ? zT(s + "秒で卵を塩の山に立てました", "I stood an egg in a pile of salt in " + s + "s", s + "초 만에 달걀을 소금 더미에 세웠습니다", "用" + s + "秒把蛋立在了盐堆上", "用" + s + "秒把蛋立在了鹽堆上")
      : cupT
      ? zT(s + "秒で卵を卵立てに立てました", "I stood an egg in an egg cup in " + s + "s", s + "초 만에 달걀을 달걀 받침에 세웠습니다", "用" + s + "秒把蛋立在了蛋托上", "用" + s + "秒把蛋立在了蛋托上")
      : th > Math.PI / 2
      ? zT(s + "秒で卵を逆さまに立てました", "I stood an egg upside down in " + s + "s", s + "초 만에 달걀을 거꾸로 세웠습니다", "用" + s + "秒把蛋倒立起来了", "用" + s + "秒把蛋倒立起來了")
      : zT(s + "秒で卵を立てました", "I stood an egg upright in " + s + "s", s + "초 만에 달걀을 세웠습니다", "用" + s + "秒把蛋立起来了", "用" + s + "秒把蛋立起來了");
    window.zResultActions.x({ text: text + zT(" #たまご立てゲーム", " #EggStandingGame", " #달걀세우기게임", " #立蛋游戏", " #立蛋遊戲") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    /* ▼DRAW: ここに絵。立体の上に、文字やボタンを2Dで描く */
    var s3 = scene3d(), drew = false;
    if (s3) { try { s3.sync({ t: T || 0, tx: tx, tz: tz, phi: phi, yaw: camYaw + camSpin, focus: camFocus, cracked: cracked, crackT: crackT, heat: heat, hatch: hatchT >= 0 ? T - hatchT : -1, gapX: GAP_X, cup: cupT ? T - cupT : -1 }); drew = s3.draw(ctx, W, H); } catch (e) { scene3d.drop(); } }
    if (!drew) { ctx.fillStyle = "#1d1714"; ctx.fillRect(0, 0, W, H); }
    if (state === S.PLAY && !hideUI) {
      ctx.save();
      ctx.fillStyle = "#f2ede4"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 8;
      ctx.font = "800 96px sans-serif"; ctx.textAlign = "center";
      if (standT > 0) ctx.fillText(String(Math.min(STAND, Math.floor(standT) + 1)), W / 2, H * 0.12);
      ctx.restore();
    }

    if (state === S.PLAY && !hideUI && guideA > 0.01) drawGuide();
    if (state === S.RESULT) drawResult();
  }

  /* 左右にドラッグする指のガイド（文字なし） */
  function drawGuide() {
    var cx = W / 2, cy = H * 0.74, sw = Math.sin(T * 3.2) * 70;
    ctx.save();
    ctx.globalAlpha = guideA * 0.92;
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 8;
    ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
    /* 両向きの矢印 */
    var L = 130;
    ctx.beginPath(); ctx.moveTo(cx - L, cy); ctx.lineTo(cx + L, cy); ctx.stroke();
    [-1, 1].forEach(function (d) {
      ctx.beginPath(); ctx.moveTo(cx + d * (L + 12), cy); ctx.lineTo(cx + d * (L - 14), cy - 18); ctx.lineTo(cx + d * (L - 14), cy + 18); ctx.closePath(); ctx.fill();
    });
    /* 指先の丸（左右に動く） */
    ctx.shadowBlur = 0;
    ctx.globalAlpha = guideA * 0.35;
    ctx.beginPath(); ctx.arc(cx + sw, cy, 34, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = guideA * 0.95;
    ctx.beginPath(); ctx.arc(cx + sw, cy, 20, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない）。
     基本は doji5 の形（暗くして中央に白い大きなスコア）。
     盆栽・炒飯のように作ったものを見せるゲームは、暗くせず「作品を見せる形」にする：
       var L = window.zResultActions.showcase(W, H, { sizes: [104, 76, 30] });
       L.lines[i].y（textBaseline "top"）に上から文字、L.subject の枠の中央に作品を大きく、
       resultButtons() は L.buttons を返す。文字は上端から積むので画面からはみ出さない。 */
  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score.toFixed(1), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
    if (confetti) confetti.draw(ctx);
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function (v) { hideUI = v !== false; }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(1500);
      crack();
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
