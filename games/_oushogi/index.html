(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  function audioOn() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }

    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }

    var passive={x:0,y:sgn*1.02,z:.012,r:sgn===1?Math.PI:0};
    var activeNear=project([active.x,active.y,active.z]).z<project([passive.x,passive.y,passive.z]).z;
    if(progress<.92){shadow(passive.x,passive.y,.015,.16);model(MODEL.piece,passive,activeNear?4:6);}
    shadow(active.x+lift*.15,active.y+.03,.016,.16/(1+lift));
    model(MODEL.piece,active,activeNear?6:4);
    if(state==='play' && selected){
      flat([[-.94,-1.94,.019],[.94,-1.94,.019],[.94,-.10,.019],[-.94,-.10,.019]],'rgba(252,230,148,.20)',3);
      flat([[-.94,.1,.019],[.94,.1,.019],[.94,1.94,.019],[-.94,1.94,.019]],'rgba(252,230,148,.29)',3);
    }
    queue.sort(function(a,b){return a.layer-b.layer || b.z-a.z;});
    queue.forEach(function(f){
      path(f.p);ctx.fillStyle=f.color;ctx.fill();
      if(f.grain){
        ctx.save();ctx.clip();ctx.strokeStyle='rgba(86,43,12,.13)';ctx.lineWidth=.65;
        var z=f.vs[0][2]+.0001;
        for(var k=-1.3;k<=1.3;k+=.062){
          ctx.beginPath();for(var t=-2.4;t<=2.4;t+=.3){var pp=project([k+.014*Math.sin(t*3+k*29),t,z]);if(t===-2.4)ctx.moveTo(pp.x,pp.y);else ctx.lineTo(pp.x,pp.y);}ctx.stroke();
        }ctx.restore();
      }
    });
    centers=[project([0,-1.02,.2]),project([0,1.02,.2])];
    if(state==='play' && selected){var q=centers[1];ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y,53,0,Math.PI*2);ctx.stroke();}
  }
  function text(str,x,y,size,color){ctx.fillStyle=color||'#f1e6cf';ctx.font=size+'px "Yu Mincho", "Hiragino Mincho ProN", serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(str,x,y);}
  function plaque(str,x,y,on){
    ctx.fillStyle=on?'#e8d6ad':'#302d25';ctx.fillRect(x-52,y-28,104,56);
    ctx.strokeStyle=on?'#f8e9c7':'#77705b';ctx.lineWidth=1;ctx.strokeRect(x-48,y-24,96,48);
    text(str,x,y,24,on?'#322b20':'#b9af96');
  }
  function draw(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#777358';ctx.fillRect(0,0,W,H);
    if(state==='cinema') scene();
    else {
      var cacheKey=[state,first,selected,H].join('/');
      if(cacheKey!==stillKey){
        still.width=W*2;still.height=H*2;
        var main=ctx;ctx=still.getContext('2d');ctx.setTransform(2,0,0,2,0,0);
        scene();ctx=main;stillKey=cacheKey;
      }
      ctx.drawImage(still,0,0,W,H);
    }
    var shade=ctx.createRadialGradient(270,CY,150,270,CY,H*.7);
    shade.addColorStop(0,'rgba(16,18,12,0)');shade.addColorStop(1,'rgba(16,18,12,.75)');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
    if(state==='cinema'){
      var s=shot(),opening=Math.min(1,T/.3);ctx.fillStyle='#11110e';ctx.fillRect(0,0,W,80*opening);ctx.fillRect(0,H-80*opening,W,80*opening);
      var flash=Math.max(0,1-Math.abs(s.progress-.70)*35);if(flash){ctx.fillStyle='rgba(255,240,203,'+(flash*.22)+')';ctx.fillRect(0,80,W,H-160);}
      return;
    }
    text('王将棋',270,Math.max(91,H*.13),52);
    ctx.strokeStyle='#a89a77';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(224,H*.13+46);ctx.lineTo(316,H*.13+46);ctx.stroke();
    if(state==='ready'){
      var a=.35+.18*Math.sin(elapsed*2);ctx.strokeStyle='rgba(255,239,192,'+a+')';ctx.lineWidth=2;
      var c=centers[0];ctx.beginPath();ctx.arc(c.x,c.y,68,0,Math.PI*2);ctx.stroke();
    }
    if(state==='lottery'){
      var flip=Math.floor(T*(T<1.4?12:5))%2===0;
      plaque(flip?'先手':'後手',270,H*.77,true);
    }
    if(state==='play'||state==='reply'){
      plaque(first?'先手':'後手',270,H*.77,first);
      plaque(first?'後手':'先手',270,H*.26,!first);
    }
    if(state==='result'){
      ctx.fillStyle='rgba(19,19,15,.76)';ctx.fillRect(0,H*.25,W,H*.7);
      text(first?'勝ち':'負け',270,H*.40,64);text('1手',270,H*.53,38,'#cbbc99');
      buttons().forEach(function(b,i){
        ctx.fillStyle=focus===i?'#e6d7b7':'#302f28';ctx.fillRect(b.x,b.y,b.w,b.h);
        ctx.strokeStyle='#c4b38a';ctx.strokeRect(b.x+4,b.y+4,b.w-8,b.h-8);
        text(b.label,b.x+b.w/2,b.y+b.h/2,24,focus===i?'#30291e':'#e6d7b7');
      });
    }
  }
  window.__probe={
    now:function(){return {state:state,score:score,W:W,H:H,first:first,selected:selected,camera:state==='cinema'?shot().index:null,
      time:T,cells:2,pieces:state==='result'?1:2,centers:centers,buttons:buttons(),duration:duration};},
    step:function(n){for(var i=0;i<(n||1);i++){update(1/60);draw();}},reset:newRound
  };
  /* ============ ループ ============ */
  newRound();layout();draw();
  var last=performance.now();
  function loop(now){var dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
