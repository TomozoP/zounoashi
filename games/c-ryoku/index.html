<script>
/* C力検査

   視力検査のような白い紙に、黒いC。
   薄いグレーのエリアの中でCを触ったところでつかみ、振り回して離すと飛ぶ。相手のCに引っかける。
   Cどうしは円を並べた剛体としてぶつかる（重力・反発・摩擦・回転あり）。
   引っかかる＝相手のCの線が、自分のCの穴の中に入って抜けない状態。

   25段。5段ずつが視力検査表の1行。行の終わりで結果画面になる。
   1・10・20・25段は相手がC。ほかの段は「C」から始まる物（雲・時計・車・カップ・サボテン・
   猫・カニ・コーン）がゴールで、引っかけるか乗って止まればよい。
   投げるCの向き（上下左右）と大きさは段ごとに決まっていて、段の一覧（視力表）に並ぶCと同じ。下の行ほど小さい。
   「C力」は初めてクリアした段ごとに上がる。小さいCの段ほど多く上がり、25段で 10.0。上がる演出を出す。
   左上のボタンで段を選べる（最初から全部選べる）。引っかけた段は端末に保存する。

   操作
     つかむ   … エリアの中のCを触ると、その点でつかむ（離すと飛ぶ）
     スペース … 相手のCへ向けて投げる（左右キーで横の強さを変える）
     Esc      … いまの行の最初から */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, OUT = null;
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor();
    OUT.threshold.value = -12; OUT.ratio.value = 5;
    OUT.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  function sndThrow() { noiseHit(0.16, 900, 0.18, 0.8); }
  /* 成功の合唱「シィィィ〜」。「シ」の息から入って、和音（ド・ミ・ソ・ド）の「ィ」を伸ばす。
     1声ごとに少しずらした2本ののこぎり波を、イの形（300・2300・3000Hzあたり）に絞る */
  /* 合唱の「シィィィ〜」。big：全段そろった回のファンファーレを合唱で歌う。
     「シシシ シーン、シ シ、シシシ」と音ごとに言いなおして上がり、最後の高いドをCの大合唱で伸ばす */
  var E4 = 329.63, G4 = 392.0, F3 = 174.61, A3 = 220.0, B3 = 246.94, D4 = 293.66, A4 = 440.0, B4 = 493.88;
  function sndChoir(big) {
    if (!AC || !NOISE) return;
    var n = AC.currentTime;
    if (!big) { choirPhrase(n, 1.5, [C4 / 2, C4, E4, G4, C5], [-7, 7], 1, 0.16, 0.3, 0); return; }
    var bus = choirBus();
    var CC = [C4 / 2, C4, E4], FF = [F3, A3, C4], GG = [G4 / 2, B3, D4];
    [ /* 始まり秒, 長さ, 旋律, 下の和音 */
      [0.00, 0.10, G4, CC], [0.13, 0.10, G4, CC], [0.26, 0.10, G4, CC],
      [0.40, 0.46, C5, CC],
      [0.92, 0.20, A4, FF], [1.14, 0.20, B4, GG],
      [1.36, 0.10, C5, CC], [1.48, 0.10, E4 * 2, CC], [1.60, 0.10, G4 * 2, CC]
    ].forEach(function (e) { choirNote(bus, n + e[0], e[1], e[2], e[3]); });
    choirPhrase(n + 1.74, 2.6, [C4 / 4, C4 / 2, G4 / 2, C4, E4, G4, C5, E4 * 2, G4 * 2, C5 * 2], [-13, -5, 5, 13], 0.42, 0.21, 0.12, 0);
  }
  /* 声の響き（「イ」の口の形）を通す入れ物。ファンファーレの音はみなここへ流す */
  function choirBus() {
    var bus = AC.createGain(); bus.gain.value = 1;
    [300, 2300, 3000].forEach(function (fq, i) {
      var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = fq; f.Q.value = [4, 7, 8][i];
      var fg = AC.createGain(); fg.gain.value = [1, 0.6, 0.4][i] * 2.2;
      bus.connect(f); f.connect(fg); fg.connect(OUT);
    });
    return bus;
  }
  /* ファンファーレの1音。頭で「シ」と言い、旋律を強め、下の和音を添える */
  function choirNote(bus, at, dur, top, chord) {
    var src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
    var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2000;
    var sh = AC.createBiquadFilter(); sh.type = "bandpass"; sh.frequency.value = 3300; sh.Q.value = 1.2;
    var gs = AC.createGain();
    gs.gain.setValueAtTime(0.0001, at);
    gs.gain.linearRampToValueAtTime(0.28, at + 0.015);
    gs.gain.setTargetAtTime(0.0001, at + 0.04, 0.03);
    src.connect(hp); hp.connect(sh); sh.connect(gs); gs.connect(OUT);
    src.start(at, Math.random()); src.stop(at + 0.3);
    var env = AC.createGain(), peak = 0.17;
    env.gain.setValueAtTime(0.0001, at);
    env.gain.linearRampToValueAtTime(peak, at + 0.03);
    env.gain.setValueAtTime(peak, at + dur);
    env.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.09);
    env.connect(bus);
    [top].concat(chord).forEach(function (hz, i) {
      [-10, 0, 10].forEach(function (c) {
        var o = AC.createOscillator(); o.type = "sawtooth";
        o.frequency.value = hz; o.detune.value = c + (Math.random() - 0.5) * 6;
        var og = AC.createGain(); og.gain.value = i === 0 ? 0.55 : 0.3;
        o.connect(og); og.connect(env);
        o.start(at); o.stop(at + dur + 0.12);
      });
    });
  }
  /* 1回ぶんの「シィィィ〜」。at：始まり、len：長さ、notes：和音、cents：声ごとのずれ、vg：声の強さ、peak：全体の大きさ、rise：立ち上がり秒、
     scoop：この分（セント）だけ低いところから入って、すぐ本来の高さへ上がる */
  function choirPhrase(at, len, notes, cents, vg, peak, rise, scoop) {
    var n = at;
    var src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
    var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2000;
    var sh = AC.createBiquadFilter(); sh.type = "bandpass"; sh.frequency.value = 3300; sh.Q.value = 1.2;
    var gs = AC.createGain();
    gs.gain.setValueAtTime(0.0001, n);
    gs.gain.linearRampToValueAtTime(0.3, n + 0.04);
    gs.gain.setTargetAtTime(0.03, n + 0.16, 0.08);
    gs.gain.setTargetAtTime(0.0001, n + len - 0.3, 0.12);
    src.connect(hp); hp.connect(sh); sh.connect(gs); gs.connect(OUT);
    src.start(n, Math.random()); src.stop(n + len + 0.3);
    var bus = AC.createGain();
    bus.gain.setValueAtTime(0.0001, n);
    bus.gain.linearRampToValueAtTime(peak, n + rise);
    bus.gain.setValueAtTime(peak, n + len - 0.35);
    bus.gain.exponentialRampToValueAtTime(0.0001, n + len + 0.15);
    [300, 2300, 3000].forEach(function (fq, i) {
      var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = fq; f.Q.value = [4, 7, 8][i];
      var fg = AC.createGain(); fg.gain.value = [1, 0.6, 0.4][i] * 2.2;
      bus.connect(f); f.connect(fg); fg.connect(OUT);
    });
    var lfo = AC.createOscillator(); lfo.frequency.value = 4.8;
    lfo.start(n); lfo.stop(n + len + 0.3);
    notes.forEach(function (hz, i) {   /* Cの和音（ド・ミ・ソ）。動かす音のドと同じ高さ */
      cents.forEach(function (cent) {
        var o = AC.createOscillator(); o.type = "sawtooth";
        o.frequency.value = hz;
        var dc = cent + (Math.random() - 0.5) * 6;
        o.detune.setValueAtTime(dc - scoop, n);
        if (scoop) o.detune.setTargetAtTime(dc, n + 0.05, 0.06);
        var lg = AC.createGain(); lg.gain.value = hz * 0.004;       /* ほんの少しだけ揺らす */
        lfo.connect(lg); lg.connect(o.frequency);
        var og = AC.createGain(); og.gain.value = (i === 0 ? 0.7 : 0.5) * vg;
        o.connect(og); og.connect(bus);
        o.start(n + 0.05 + i * 0.012); o.stop(n + len + 0.3);
      });
    });
  }

  /* つかんで動かしている間の音。指の動きに合わせて、ド（C）の音がなめらかに大きくなったり小さくなったりする。
     低いドと高いドを重ね、速いほど高いドが強くなって明るくなる。指を止めると消える */
  var hum = null, humLevel = 0, humSmooth = 0, humPx = null, humPy = 0;
  var C4 = 261.63, C5 = 523.25;
  function makeHum() {
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; lp.Q.value = 0.5;
    var g = AC.createGain(); g.gain.value = 0;
    lp.connect(g); g.connect(OUT);
    var lo = AC.createOscillator(); lo.type = "sine"; lo.frequency.value = C4;
    var hi = AC.createOscillator(); hi.type = "triangle"; hi.frequency.value = C5;
    var gh = AC.createGain(); gh.gain.value = 0;
    lo.connect(lp); hi.connect(gh); gh.connect(lp);
    lo.start(); hi.start();
    return { g: g, gh: gh, lp: lp };
  }
  function updateHum(dt) {
    var sp = 0;
    if (grab && ball && state === S.PLAY && !sel && dt) {
      /* 指の動いた速さで決める。指を止めてCが揺れているだけなら鳴らない */
      sp = humPx == null ? 0 : Math.hypot(grab.px - humPx, grab.py - humPy) / dt;
      humPx = grab.px; humPy = grab.py;
    } else humPx = null;
    var k = Math.max(0, Math.min(1, (sp - 60) / 1400));
    humSmooth += (k - humSmooth) * Math.min(1, dt * (k > humSmooth ? 14 : 6));
    humLevel = humSmooth;
    if (!AC) return;
    if (!hum) { if (humLevel < 0.01) return; hum = makeHum(); }
    var n = AC.currentTime, v = humLevel;
    hum.g.gain.setTargetAtTime(0.16 * Math.pow(v, 1.1), n, 0.03);
    hum.gh.gain.setTargetAtTime(0.25 + 0.6 * v, n, 0.05);
    hum.lp.frequency.setTargetAtTime(900 + 1800 * v, n, 0.05);
  }
  var lastClack = 0;
  /* ぶつかったときの音。相手のCはコツッ、物はそれぞれの材質っぽく。続けざまには鳴らさない */
  function sndClack(power, kind) {
    if (!AC || T - lastClack < 0.05 || power < 60) return;
    lastClack = T;
    var v = Math.min(0.35, power / 2400);
    if (kind === "cloud") { noiseHit(0.12, 500, v * 0.8, 0.7); return; }
    if (kind === "car" || kind === "clock" || kind === "hands" || kind === "coin") { tone(1400 + Math.random() * 300, 0.12, v * 0.5, "triangle"); noiseHit(0.03, 4000, v * 0.6, 4); return; }
    if (kind === "cat") { tone(700, 0.18, v * 0.5, "sine", 1100); return; }
    noiseHit(0.03, 2600, v, 5);
    tone(700 + Math.random() * 120, 0.05, v * 0.5, "triangle");
  }
  /* 引っかかった：検査のピッ */
  function sndTap() { tone(1800, 0.05, 0.1, "sine"); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ Cの形 ============
     Cは「中心線の半径 rm・線の太さ st・すき間の半分の角度 gh」で決まる。
     すき間は角度0（右）向き。回すと向きが変わる。
     当たり判定は、中心線に沿って線の太さの円を並べたもの。 */
  var GAP = 50 * Math.PI / 180;               /* すき間の半分の角度 */
  var STROKE = 0.12;                          /* 線の太さ / 直径 */
  function makeC(D, gh) {
    gh = gh || GAP;
    var st = D * STROKE, rm = D / 2 - st / 2, r = st / 2;
    var span = Math.PI * 2 - gh * 2;
    var n = Math.max(12, Math.ceil(span * rm / (r * 0.9)));
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = gh + span * i / n;
      pts.push({ a: a, x: Math.cos(a) * rm, y: Math.sin(a) * rm });
    }
    return { D: D, st: st, rm: rm, r: r, gh: gh, pts: pts };
  }

  /* ============ 段 ============
     t      … 相手のC [直径, 横, 高さ, すき間の向き]。向きは右が0°、上が -90°
     g      … 相手のCの代わりにゴールにする、Cから始まる物 [種類, 横, 高さ, 大きさ, 動きの幅, 動きの周期]
     投げたCは、相手の上向きの端に上からかぶさると引っかかる。相手に乗って止まってもよい。物がゴールの段も同じ。
     Cを自由に動かせるエリアは下に固定。ゴールの位置（高さ・左右）と大きさ、動きで難しさを付ける。 */
  var AREA = [0.03, 0.66, 0.94, 0.32];       /* エリアはどの段も下に固定 */
  var STAGES = [
    /* おおむねモチーフの難しさ（同じ大きさのCで測った入りやすさ）の順。5・10・14・20段は難しい物を置いてメリハリを付ける。最後だけCに掛ける */
    /* 1行目 */
    { g: ["cup", 0.8, 0.55, 80] },
    { g: ["cocktail", 0.5, 0.45, 70] },
    { g: ["crab", 0.75, 0.55, 40, 0.08, 6] },
    { g: ["candy", 0.5, 0.45, 32] },
    { g: ["cake", 0.5, 0.55, 50] },
    /* 2行目 */
    { g: ["castle", 0.25, 0.55, 50] },
    { g: ["cat", 0.3, 0.55, 40] },
    { g: ["cherry", 0.65, 0.5, 46] },
    { g: ["crown", 0.6, 0.45, 40] },
    { g: ["cloud", 0.4, 0.45, 64, 0.08, 7] },
    /* 3行目 */
    { g: ["cheese", 0.7, 0.55, 50] },
    { g: ["hands", 0.5, 0.5, 100] },
    { g: ["crayon", 0.35, 0.4, 40] },
    { g: ["cane", 0.3, 0.5, 56] },
    { g: ["cap", 0.3, 0.45, 44] },
    /* 4行目 */
    { g: ["carrot", 0.4, 0.55, 50] },
    { g: ["car", 0.35, 0.55, 48, 0.1, 6] },
    { g: ["cactus", 0.5, 0.55, 46] },
    { g: ["candle", 0.35, 0.6, 36] },
    { g: ["clip", 0.3, 0.4, 50] },
    /* 5行目 */
    { g: ["chair", 0.6, 0.45, 44] },
    { g: ["comb", 0.3, 0.5, 50] },
    { g: ["cone", 0.8, 0.45, 48] },
    { g: ["camera", 0.3, 0.45, 40] },
    { t: [100, 0.5, 0.35, 0] }
  ];
  var ROW = 5;

  /* 投げるC。段の一覧（視力表）と同じで、行が下がるほど小さい。向き（すき間の向き）は段ごとに上下左右 */
  var SIZES = [100, 84, 68, 52, 38];
  var R_ = 0, U_ = -90, L_ = 180, D_ = 90;
  var DIRS = [R_, U_, L_, D_, U_,  L_, D_, R_, U_, R_,  D_, L_, U_, R_, L_,  U_, R_, D_, L_, D_,  L_, U_, R_, D_, U_];
  /* 初めてクリアしたときに上がるC力。小さいCほど多い。25段で合計 10.0 */
  var GAINS = [0.1, 0.2, 0.4, 0.5, 0.8];
  var BALL = makeC(SIZES[0]);
  var G = 1800;                                /* 重力 */
  var SUB = 8;                                 /* 1コマを何回に分けて計算するか */
  var E = 0.25, MU = 0.35;                     /* 反発・摩擦 */
  var SOFT_E = 0.15, SOFT_MU = 0.8;   /* ゴール（相手のCと物）は少し跳ねにくく、ざらざら（ゴムくらいの摩擦） */
  var IM = 1, II = 1 / (BALL.rm * BALL.rm);    /* 質量1の輪。慣性は m r^2。大きさが変わるたびに直す */
  /* つかんだ点を指へ引き寄せるばね。強さと、揺れを止める力 */
  var K = 700, DAMP = 38;

  /* ============ 道中の物 ============
     どれも「C」から始まる物。白く塗って黒い線で縁取る。

          /* 摩擦 */
          vpx = b.vx - b.w * ry - qvx; vpy = b.vy + b.w * rx - qvy;
          var tx = -ny, ty = nx, vt = vpx * tx + vpy * ty;
          var rt = rx * ty - ry * tx;
          var jt = -vt / (IM + rt * rt * II);
          var lim = (soft ? SOFT_MU : MU) * jn;
          if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
          b.vx += jt * tx * IM; b.vy += jt * ty * IM; b.w += rt * jt * II;
        }
        acc.x += nx * pen; acc.y += ny * pen; acc.n++;
      }
    }
    if (hit > (acc.hit || 0)) { acc.hit = hit; acc.kind = kind; }
  }
  /* 物の円を、時刻 t の世界の位置と速さにする */
  function objCircles(o, t) {
    var p = objPose(o, t), out = [];
    o.body.forEach(function (c) { out.push({ x: p.x + c.x, y: p.y + c.y, r: c.r, vx: p.vx, vy: p.vy }); });
    if (o.hands) o.hands.forEach(function (h, k) {
      var ca = Math.cos(p.has[k]), sa = Math.sin(p.has[k]), hw = p.hws[k];
      h.circles.forEach(function (c) {
        var hx = c.x * ca - c.y * sa, hy = c.x * sa + c.y * ca;
        out.push({ x: p.x + hx, y: p.y + hy, r: c.r, vx: p.vx - hw * hy, vy: p.vy + hw * hx });
      });
    });
    return out;
  }

  function physics(dt) {
    var b = ball;
    if (b.idle) return;
    ST += dt;
    b.vy += G * dt;
    if (grab) {
      /* つかんだ点（Cに貼りついた点）を指の位置へばねで引く。
         重心からずれた点を引くので、振ると回る */
      var c0 = Math.cos(b.a), s0 = Math.sin(b.a);
      var gx = grab.lx * c0 - grab.ly * s0, gy = grab.lx * s0 + grab.ly * c0;
      var gvx = b.vx - b.w * gy, gvy = b.vy + b.w * gx;
      var fx = K * (grab.px - (b.x + gx)) - DAMP * gvx;
      var fy = K * (grab.py - (b.y + gy)) - DAMP * gvy;
      b.vx += fx * IM * dt; b.vy += fy * IM * dt;
      b.w += (gx * fy - gy * fx) * II * dt;
      b.w *= 1 - 1.5 * dt;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;
    var ca = Math.cos(b.a), sa = Math.sin(b.a);
    var acc = { x: 0, y: 0, n: 0 };
    /* 外側の円どうしが離れていれば調べない */
    if (target && Math.hypot(b.x - target.x, b.y - target.y) < BALL.rm + target.shape.rm + BALL.r + target.shape.r) {
      collideSet(b, target.world, target.shape.r, ca, sa, acc, "c", true);
      if (acc.n) b.onC = true;                               /* 相手に触れている */
    }
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (!o.body.length && !o.hands) continue;
      var p = objPose(o, ST);
      if (Math.hypot(b.x - p.x, b.y - p.y) > BALL.rm + BALL.r + o.R) continue;
      var n0 = acc.n;
      collideSet(b, objCircles(o, ST), 0, ca, sa, acc, o.kind, o === goal);
      if (o === goal && acc.n > n0) b.onC = true;          /* ゴールの物に触れている */
    }
    if (acc.n) { b.x += acc.x / acc.n * 0.9; b.y += acc.y / acc.n * 0.9; }
    if (acc.hit) sndClack(acc.hit, acc.kind);
  }

  /* 相手のCの線（または物の一部）が、投げたCの穴の中にある＝引っかかっている */
  function linked() {
    var b = ball, list = target ? target.world : objCircles(goal, ST);
    for (var j = 0; j < list.length; j++) {
      var q = list[j], lim = BALL.rm - BALL.r - (target ? target.shape.r : q.r) * 0.3;
      if (Math.hypot(q.x - b.x, q.y - b.y) < lim) return true;
    }
    return false;
  }

  /* 相手のCに乗って（中に落ちて）止まっている */
  function still() {
    var g = goalPos();                         /* 動く物に乗っているときは、物と同じ速さなら止まっている扱い */
    return Math.hypot(ball.vx - g.vx, ball.vy - g.vy) < 30 && Math.abs(ball.w) < 0.6;
  }
  /* 引っかかっているか乗っていて、しっかり止まっている */
  function settled() {
    if (linked()) return still();
    return ball.onC && still();
  }

  /* ============ 進行 ============ */
  /* ============ 紙吹雪 ============
     成功したら画面の上から降らせる。形は小さなC。白黒の絵に合わせて、黒・灰・赤・白 */
  var confetti = [];
  var CONF_COLORS = ["#111", "#111", "#8c8b85", "#e0463a", "#e0463a", "#fff"];
  function burstConfetti(big) {
    var count = big ? 380 : 140, spread = big ? 1.2 : 0.35;   /* 大合唱のときは多く、長く降る */
    for (var i = 0; i < count; i++) {
      confetti.push({
        x: Math.random() * W, y: -20 - Math.random() * H * spread,
        vx: (Math.random() - 0.5) * 120, vy: 120 + Math.random() * 160,
        a: Math.random() * Math.PI * 2, w: (Math.random() - 0.5) * 12,
        flip: Math.random() * Math.PI * 2, fw: 6 + Math.random() * 8,
        s: 10 + Math.random() * 10, c: CONF_COLORS[i % CONF_COLORS.length]
      });
    }
  }
  function updateConfetti(dt) {
    for (var i = confetti.length - 1; i >= 0; i--) {
      var p = confetti[i];
      p.vy = Math.min(p.vy + 260 * dt, 330);
      p.x += (p.vx + Math.sin(p.flip) * 40) * dt; p.y += p.vy * dt;
      p.a += p.w * dt; p.flip += p.fw * dt;
      if (p.y > H + 30) confetti.splice(i, 1);
    }
  }
  function drawConfetti() {
    confetti.forEach(function (p) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, Math.cos(p.flip));
      /* 小さなC。白は黒で縁取る */
      var r = p.s * 0.5, gh = 50 * Math.PI / 180;
      if (p.c === "#fff") {
        ctx.strokeStyle = "#111"; ctx.lineWidth = r * 0.5;
        ctx.beginPath(); ctx.arc(0, 0, r, gh, Math.PI * 2 - gh); ctx.stroke();
      }
      ctx.strokeStyle = p.c; ctx.lineWidth = r * 0.3;
      ctx.beginPath(); ctx.arc(0, 0, r, gh, Math.PI * 2 - gh); ctx.stroke();
      ctx.restore();
    });
  }

  function update(dt) {
    updateConfetti(dt);
    updateHum(dt);
    if (state === S.INTRO) { T += dt; return; }
    if (state !== S.PLAY) return;
    T += dt;
    if (ball.idle) ST += dt;                   /* 待っている間も物は動く */
    if (sel) return;

    if (clearT >= 0) {
      clearT += dt;
      for (var k = 0; k < SUB; k++) physics(dt / SUB);
      if (clearT > CLEAR_T) finishStage();
      return;
    }

    if (ball.idle) return;
    ball.onC = false;
    for (var i = 0; i < SUB; i++) physics(dt / SUB);

    /* 手を離したCがエリアから出たら1投と数える。
       エリアの下へ落ちただけのときは数えない */
    if (!grab && !ball.out && !inArea(ball.x, ball.y)) {
      var fell = ball.y > AY + AH;
      if (!fell) { ball.out = true; throws++; rowThrows++; sndThrow(); }
    }

    /* 引っかかるか乗って、HOLD 秒止まっていればクリア */
    if (!grab && settled()) {
      hookT += dt;
      if (hookT > HOLD) {
        clearT = 0; gain = !isCleared(stage);
        var big = gain && cleared.length === STAGES.length - 1;   /* これで全段そろう */
        sndChoir(big); burstConfetti(big);
      }
    } else hookT = 0;

    var sp = Math.hypot(ball.vx, ball.vy);
    ball.still = !grab && sp < 25 && Math.abs(ball.w) < 0.6 ? ball.still + dt : 0;
    var lost = ball.y > H + BALL.D || ball.x < -BALL.D * 2 || ball.x > W + BALL.D * 2;
    if (lost || ball.still > 1.2) {
      ball.gone += dt;
      if (ball.gone > (lost ? 0.25 : 0.4)) readyBall();
    }
  }

  function finishStage() {
    /* 最後の1段を初めてクリアして、全段そろった回だけ「Complete」 */
    complete = false;
    if (!isCleared(stage)) { cleared.push(stage); save(); complete = cleared.length === STAGES.length; }
    gain = false;
    /* 毎段、クリアの画面。場面はそのまま残し、「次」と「シェア」を出す */
    score = cPower();
    state = S.RESULT;
    clearT = -1;
  }
  function nextStage() { newRound(stage + 1 < STAGES.length ? stage + 1 : firstOpen()); }

  /* C力：クリアした段ごとの上がり幅の合計。25段で 10.0 */
  function gainOf(i) { return GAINS[Math.floor(i / ROW)]; }
  function cPowerNum(list) { return (list || cleared).reduce(function (a, i) { return a + gainOf(i); }, 0); }
  function cPower(list) { return cPowerNum(list).toFixed(1); }

  /* ============ 段を選ぶ ============
     左上のボタンで、視力検査表のように並んだ25個のCを出す。
     引っかけた段は黒、選べる段は灰色、まだ選べない段は薄く。 */
  var SEL_BTN = { x: 12, y: 12, w: 64, h: 64 };
  function selCells() {
    var cells = [], top = Math.max(170, H * 0.22), rowH = Math.min(130, (H - top - 60) / 5);
    for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++) {
      var i = r * 5 + c;
      cells.push({ i: i, x: 20 + c * 100, y: top + r * rowH, w: 100, h: rowH, d: Math.round(76 * SIZES[r] / SIZES[0]) });
    }
    return cells;
  }
  function inRect(x, y, b) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
  function selectTap(x, y) {
    var cells = selCells();
    for (var k = 0; k < cells.length; k++) {
      if (inRect(x, y, cells[k])) {
        var i = cells[k].i;
        if (!isOpen(i)) return;
        sndTap();
        state = S.PLAY; shareButton.hidden = true;
        sel = false;
        goStage(i);
        return;
      }
    }
    sel = false;
  }

  /* ============ 入力 ============
     エリアの中にあるCを、触ったところでつかむ。指はエリアの外へ出てもCはエリアの中まで。
     離すと、その時の勢いと回転のまま飛んでいく */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (x != null && inRect(x, y, SEL_BTN) && !sel) { sndTap(); sel = true; return; }
    if (sel) { if (x == null) { sel = false; return; } selectTap(x, y); return; }
    if (state === S.RESULT) {
      var hit = x == null ? "next" : hitButton(x, y);
      if (hit === "next") { sndTap(); nextStage(); }
      return;
    }
    if (x == null) { keyThrow(); return; }
    held = true;
    if (clearT >= 0 || grab || !inArea(ball.x, ball.y)) return;
    if (Math.hypot(x - ball.x, y - ball.y) > BALL.D / 2 + 28) return;
    var c = Math.cos(-ball.a), s = Math.sin(-ball.a);
    var dx = x - ball.x, dy = y - ball.y;
    var lx = dx * c - dy * s, ly = dx * s + dy * c;
    /* 線から外れたところ（すき間や穴）を触ったら、いちばん近い線の上をつかむ */
    var best = null, bd = Infinity;
    BALL.pts.forEach(function (q) { var d = Math.hypot(q.x - lx, q.y - ly); if (d < bd) { bd = d; best = q; } });
    if (bd > BALL.r) { lx = best.x + (lx - best.x) * BALL.r / bd; ly = best.y + (ly - best.y) * BALL.r / bd; }
    grab = { lx: lx, ly: ly, px: x, py: y };
    ball.idle = false; ball.out = false; ball.still = 0; ball.gone = 0;
  }
  function move(x, y) {
    if (state !== S.PLAY || !grab) return;
    grab.px = Math.max(AX, Math.min(AX + AW, x));
    grab.py = Math.max(AY, Math.min(AY + AH, y));
  }
  function up() {
    held = false;
    if (!grab) return;
    grab = null;
    /* 離した瞬間の勢いには上限を付ける（ばねで引きすぎたとき画面の外まで飛ばないように） */
    var sp = Math.hypot(ball.vx, ball.vy), MAX = 2400;
    if (sp > MAX) { ball.vx *= MAX / sp; ball.vy *= MAX / sp; }
    ball.w = Math.max(-24, Math.min(24, ball.w));
  }
  /* スペース：相手のCへ向けた速さ。相手が下なら横へ押し出して落とし、上なら少し上まで届く速さ */
  function keyVel() {
    var gp = goalPos();
    if (gp.y > LY) {
      var ft = Math.sqrt(2 * (gp.y - LY) / G);
      return [(gp.x - LX) / ft + aimX, 0];
    }
    var h = LY - gp.y + 30, vy = -Math.sqrt(2 * G * h), t = -vy / G;
    return [(gp.x - LX) / t + aimX, vy];
  }
  function keyThrow() {
    var v = keyVel();
    if (launch(v[0], v[1])) { ball.out = false; }
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 演出の覗き穴。F2：ふつうのクリアの合唱と紙吹雪。F4：全段そろったときの大合唱と「Complete」の画面（記録は変えない） */
  function debugFx(big) {
    sndChoir(big); burstConfetti(big);
    if (big && state !== S.INTRO) { grab = null; hookT = 0; complete = true; score = cPower(); state = S.RESULT; clearT = -1; }
  }
  window.addEventListener("keydown", function (e) {
    if (e.key === "F2" || e.key === "F4") { e.preventDefault(); if (!e.repeat) debugFx(e.key === "F4"); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state !== S.INTRO) newRound(Math.floor(stage / ROW) * ROW); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      aimX = Math.max(-300, Math.min(300, aimX + (left ? -30 : 30)));
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function doShare() {
    /* ▼SHARE: 正方形サムネの共有リンクは share.js が付ける */
    window.zResultActions.x({ text: "C力 " + score + " #C力検査" });
  }

  /* ============ 描画 ============ */
  var INK = "#111", PAPER = "#fbfbf8", OUTSIDE = "#e7e6de";
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  /* 当たり判定の円の外側まで線を引き、端は切りっぱなしにする */
  function drawC(shape, x, y, a, alpha, color) {
    var ext = shape.r / shape.rm;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = color || INK;
    ctx.lineWidth = shape.st;
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.arc(x, y, shape.rm, a + shape.gh - ext, a + Math.PI * 2 - shape.gh + ext);
    ctx.stroke();
    ctx.restore();
  }

  /* 円の集まりを、外周だけ黒く縁取った白い形として描く */
  var LINE = 4;
  function blob(list, x, y) {
    ctx.fillStyle = INK;
    list.forEach(function (c) { ctx.beginPath(); ctx.arc(x + c.x, y + c.y, c.r + LINE, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = "#fff";
    list.forEach(function (c) { ctx.beginPath(); ctx.arc(x + c.x, y + c.y, c.r, 0, Math.PI * 2); ctx.fill(); });
  }
  function line(x0, y0, x1, y1, w) {
    ctx.lineWidth = w || LINE; ctx.strokeStyle = INK; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  /* 時計の針（今の時刻）と真ん中の軸 */
  function drawHands(o, x, y) {
    var p = objPose(o, ST);
    o.hands.forEach(function (h, k) {
      ctx.lineWidth = h.w; ctx.strokeStyle = INK; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(p.has[k]) * h.len, y + Math.sin(p.has[k]) * h.len); ctx.stroke();
    });
    dot(x, y, 10);
  }
  function dot(x, y, r, color) { ctx.fillStyle = color || INK; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  function drawObj(o) {
    var p = objPose(o, ST), x = p.x, y = p.y, s = o.s;
    ctx.save();
    if (ART[o.kind]) { drawArt(ART[o.kind], x, y, s); ctx.restore(); return; }
    switch (o.kind) {
      case "cloud":
        blob(o.body, x, y);
        break;
      case "cup":
        drawArt({ segs: [[-0.8, -0.9, -0.65, 0.75, 0.28], [-0.65, 0.75, 0.65, 0.75, 0.28], [0.65, 0.75, 0.8, -0.9, 0.28]] }, x, y, s);
        /* 湯気 */
        ctx.globalAlpha = 0.5;
        for (var k = -1; k <= 1; k++) {
          var sx = x + k * 0.35 * s, ph = ST * 2 + k;
          ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.beginPath();
          ctx.moveTo(sx, y - 1.1 * s);
          ctx.quadraticCurveTo(sx + Math.sin(ph) * 0.2 * s, y - 1.4 * s, sx, y - 1.7 * s);
          ctx.stroke();
        }
        break;
      case "cactus":
        drawArt({ segs: [[0, -1.4, 0, 1.5, 0.6], [-0.75, -0.5, -0.75, 0.25, 0.48], [-0.75, 0.25, 0, 0.25, 0.48], [0.75, -0.9, 0.75, -0.15, 0.48], [0.75, -0.15, 0, -0.15, 0.48]] }, x, y, s);
        ctx.globalAlpha = 0.8;
        for (var k2 = 0; k2 < 5; k2++) line(x - 0.12 * s, y - 1.1 * s + k2 * 0.55 * s, x - 0.02 * s, y - 1.0 * s + k2 * 0.55 * s, 2);
        ctx.globalAlpha = 1;
        break;
      case "candle":
        drawArt({ segs: [[0, -0.9, 0, 1.6, 0.68]] }, x, y, s);
        line(x, y - 1.25 * s, x, y - 1.45 * s, 3);
        var fl = 1 + Math.sin(ST * 13) * 0.08 + Math.sin(ST * 7.3) * 0.05;
        ctx.fillStyle = INK;
        ctx.beginPath();
        ctx.moveTo(x, y - 1.45 * s - 0.9 * s * fl);
        ctx.quadraticCurveTo(x + 0.35 * s, y - 1.6 * s, x, y - 1.42 * s);
        ctx.quadraticCurveTo(x - 0.35 * s, y - 1.6 * s, x, y - 1.45 * s - 0.9 * s * fl);
        ctx.fill();
        break;
      case "cat":
        /* しっぽ（飾り）→ 体 → 耳 → 顔 */
        var tw = Math.sin(ST * 2.4) * 0.35;
        ctx.lineWidth = 0.22 * s + LINE * 2; ctx.strokeStyle = INK; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x + 0.6 * s, y + 1.1 * s); ctx.quadraticCurveTo(x + 1.5 * s, y + 0.9 * s, x + (1.3 + tw) * s, y + 0.1 * s); ctx.stroke();
        ctx.lineWidth = 0.22 * s; ctx.strokeStyle = "#fff";
        ctx.beginPath(); ctx.moveTo(x + 0.6 * s, y + 1.1 * s); ctx.quadraticCurveTo(x + 1.5 * s, y + 0.9 * s, x + (1.3 + tw) * s, y + 0.1 * s); ctx.stroke();
        [-1, 1].forEach(function (k) {
          ctx.fillStyle = INK; ctx.beginPath();
          ctx.moveTo(x + k * 0.58 * s, y - 0.95 * s); ctx.lineTo(x + k * 0.5 * s, y - 1.8 * s); ctx.lineTo(x + k * 0.12 * s, y - 1.2 * s); ctx.fill();
        });
        blob(o.body.slice(0, 3), x, y);   /* 耳の当たりは黒い三角で見せる */
        var blink = (ST % 3.2) < 0.12;
        [-1, 1].forEach(function (k) {
          if (blink) line(x + k * 0.22 * s - 0.08 * s, y - 0.8 * s, x + k * 0.22 * s + 0.08 * s, y - 0.8 * s, 2.5);
          else dot(x + k * 0.22 * s, y - 0.8 * s, 0.07 * s);
        });
        line(x - 0.1 * s, y - 0.6 * s, x + 0.1 * s, y - 0.6 * s, 2);
        break;
      case "cone":
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.moveTo(x, y - 1.35 * s); ctx.lineTo(x + 0.72 * s, y + 0.95 * s); ctx.lineTo(x - 0.72 * s, y + 0.95 * s); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.moveTo(x, y - 1.2 * s); ctx.lineTo(x + 0.6 * s, y + 0.9 * s); ctx.lineTo(x - 0.6 * s, y + 0.9 * s); ctx.closePath(); ctx.fill();
        ctx.fillStyle = INK;
        ctx.fillRect(x - 0.33 * s, y - 0.3 * s, 0.66 * s, 0.22 * s);
        ctx.fillRect(x - 1 * s, y + 0.9 * s, 2 * s, 0.25 * s);
        break;
      case "coin":
        /* くるくる回るコイン（当たらない） */
        var sx2 = Math.abs(Math.cos(ST * 3 + o.fx * 10));
        ctx.translate(x, y + Math.sin(ST * 2 + o.fy * 9) * 4);
        ctx.scale(Math.max(0.12, sx2), 1);
        dot(0, 0, s + LINE);
        dot(0, 0, s, "#fff");
        ctx.lineWidth = 3; ctx.strokeStyle = INK;
        ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0.9, Math.PI * 2 - 0.9); ctx.stroke();
        break;
      case "car":
        drawArt({ segs: [[-1.4, 0.1, 1.4, 0.1, 0.8], [-0.6, -0.4, 0.6, -0.4, 0.8]] }, x, y, s);
        /* 窓 */
        ctx.fillStyle = INK;
        roundRect(x - 0.55 * s, y - 0.62 * s, 0.5 * s, 0.34 * s, 4); ctx.fill();
        roundRect(x + 0.05 * s, y - 0.62 * s, 0.5 * s, 0.34 * s, 4); ctx.fill();
        /* 車輪（回る） */
        [-0.85, 0.85].forEach(function (k) {
          var wx = x + k * s, wy = y + 0.55 * s, ang = (x - W * o.fx) / (0.32 * s);
          dot(wx, wy, 0.32 * s + 2);
          dot(wx, wy, 0.13 * s, "#fff");
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(ang) * 0.28 * s, wy + Math.sin(ang) * 0.28 * s); ctx.stroke();
        });
        break;
      case "crab":
        /* 足（動く） */
        for (var k3 = 0; k3 < 3; k3++) {
          [-1, 1].forEach(function (d) {
            var ph = Math.sin(ST * 14 + k3 * 1.4 + d) * 0.12 * s;
            line(x + d * (0.3 + k3 * 0.25) * s, y + 0.3 * s, x + d * (0.6 + k3 * 0.3) * s, y + (0.9 + (d > 0 ? ph : -ph) / s) * s, 3);
          });
        }
        blob(o.body, x, y);
        /* はさみの切れ目と目 */
        [-1, 1].forEach(function (d) {
          /* はさみ：外側に切れ込みを入れて、開いた爪にする */
          var cx = x + d * 1.15 * s, cy = y - 0.6 * s, ca = d > 0 ? -Math.PI / 4 : -Math.PI * 3 / 4, R = 0.35 * s + LINE + 1;
          ctx.fillStyle = OUTSIDE; ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(ca - 0.45) * R, cy + Math.sin(ca - 0.45) * R);
          ctx.lineTo(cx + Math.cos(ca + 0.45) * R, cy + Math.sin(ca + 0.45) * R); ctx.fill();
          line(cx, cy, cx + Math.cos(ca - 0.45) * 0.35 * s, cy + Math.sin(ca - 0.45) * 0.35 * s, LINE);
          line(cx, cy, cx + Math.cos(ca + 0.45) * 0.35 * s, cy + Math.sin(ca + 0.45) * 0.35 * s, LINE);
          line(x + d * 0.25 * s, y - 0.45 * s, x + d * 0.3 * s, y - 0.8 * s, 2.5);
          dot(x + d * 0.3 * s, y - 0.85 * s, 0.1 * s);
        });
        break;
      case "clock":
        dot(x, y, s + 8);
        dot(x, y, s - 8, "#fff");
        for (var h = 0; h < 12; h++) {
          var ta = h * Math.PI / 6, r0 = s - 14, r1 = s - (h % 3 ? 20 : 26);
          line(x + Math.cos(ta) * r0, y + Math.sin(ta) * r0, x + Math.cos(ta) * r1, y + Math.sin(ta) * r1, h % 3 ? 2 : 4);
        }
        drawHands(o, x, y);
        break;
      case "hands":
        drawHands(o, x, y);
        break;
    }
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT && !sel);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = OUTSIDE;                   /* 操作できないところは灰色、エリアは白 */
    ctx.fillRect(0, 0, W, H);

    if (!target && !goal) return;
    /* Cを自由に動かせるエリア */
    ctx.fillStyle = PAPER;
    roundRect(AX, AY, AW, AH, 22);
    ctx.fill();

    objs.forEach(drawObj);

    var fade = 1;                              /* クリアしても場面は消さずに残す */
    if (target) drawC(target.shape, target.x, target.y, target.a, fade);

    /* クリアの画面では、エリアに残ったCはボタンの邪魔なので描かない */
    if (ball && !(state === S.RESULT && inArea(ball.x, ball.y))) {
      var alpha = fade * (ball.gone > 0 ? Math.max(0, 1 - ball.gone / 0.4) : 1);
      drawC(BALL, ball.x, ball.y, ball.a, alpha);
      if (hookT > 0.15 && clearT < 0) drawHold();
      if (grab) drawGrab();
      if (ball.idle && keyMode && state === S.PLAY && clearT < 0 && !sel) drawAim();
    }

    drawConfetti();
    if (clearT >= 0 && gain) drawGain();
    if (state === S.RESULT) drawResult();
    if (state !== S.INTRO) {
      if (sel) drawSelect();
      else drawSelButton();                    /* 一覧を開いている間は左上のボタンを出さない */
    }
  }

  /* 左上のボタン：薄い灰色の小さなCを3×3に並べる（段の一覧）。押せる範囲は SEL_BTN のまま */
  function drawSelButton() {
    var b = SEL_BTN, cx = b.x + b.w / 2 - 8, cy = b.y + b.h / 2 - 8;
    ctx.strokeStyle = "#b5b4ac"; ctx.lineWidth = 2; ctx.lineCap = "butt";
    var gh = 50 * Math.PI / 180;
    for (var r = -1; r <= 1; r++) for (var c = -1; c <= 1; c++) {
      ctx.beginPath(); ctx.arc(cx + c * 10, cy + r * 10, 3.3, gh, Math.PI * 2 - gh); ctx.stroke();
    }
  }

  function drawSelect() {
    ctx.fillStyle = "rgba(251,251,248,.97)";
    ctx.fillRect(0, 0, W, H);
    drawPower(cPower(), H * 0.13);            /* 上に今のC力 */
    var cells = selCells();
    cells.forEach(function (c) {
      var cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      var color = isCleared(c.i) ? INK : isOpen(c.i) ? "#b4b3ac" : "#e3e2dc";   /* クリア済み・選べる・まだ選べない */
      drawC(makeC(c.d), cx, cy, DIRS[c.i] * Math.PI / 180, 1, color);   /* その段で投げるCの向きと大きさ */
      if (c.i === stage) dot(cx, cy + c.d / 2 + 12, 5, "#e0463a");
    });
  }

  /* 止まって判定を待つ間、Cのまわりに細い輪が伸びていく */
  function drawHold() {
    var k = Math.min(1, (hookT - 0.15) / (HOLD - 0.15)), R = BALL.D / 2 + 9;
    ctx.save();
    ctx.strokeStyle = "rgba(17,17,17,.35)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(ball.x, ball.y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
    ctx.restore();
  }

  /* つかんでいる点と、指までの引っぱり */
  function drawGrab() {
    var c = Math.cos(ball.a), s = Math.sin(ball.a);
    var gx = ball.x + grab.lx * c - grab.ly * s, gy = ball.y + grab.lx * s + grab.ly * c;
    ctx.save();
    ctx.strokeStyle = "rgba(17,17,17,.3)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(grab.px, grab.py); ctx.stroke();
    ctx.fillStyle = "#e0463a";
    ctx.beginPath(); ctx.arc(gx, gy, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* キー操作のときだけ、投げる向きを点で見せる */
  function drawAim() {
    var v = keyVel();
    ctx.fillStyle = "rgba(17,17,17,.35)";
    for (var k = 1; k <= 7; k++) {
      var s = k * 0.05;
      ctx.beginPath();
      ctx.arc(LX + v[0] * s, LY + v[1] * s + G * s * s / 2, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    /* 下のC操作エリアの真ん中に出す */
    var x0 = W / 2 - (wr + gap + ws) / 2, y = AY + AH / 2 - h / 2;
    return [
      { id: "next", x: x0, y: y, w: wr, h: h, label: "次" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  /* 初めて引っかけたとき、C力が0.1上がる */
  function drawGain() {
    var before = cPower(), after = cPower(cleared.concat([stage]));
    var t = clearT, flip = 0.45;
    var inA = Math.min(1, t / 0.2), out = 0;     /* 消さずに、そのままクリアの画面の表示につなぐ */
    var pop = t < flip ? 1 : 1 + 0.45 * Math.max(0, 1 - (t - flip) / 0.3);
    var cy = H * 0.16;
    ctx.save();
    ctx.globalAlpha = inA * (1 - out);
    ctx.fillStyle = INK;
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    var label = "C力", num = t < flip ? before : after;
    ctx.font = "800 40px sans-serif";
    var lw = ctx.measureText(label).width;
    ctx.font = "800 84px sans-serif";
    var nw = ctx.measureText(after).width;
    var x0 = W / 2 - (lw + 14 + nw) / 2;
    ctx.font = "800 40px sans-serif";
    ctx.fillText(label, x0, cy);
    ctx.save();
    ctx.translate(x0 + lw + 14 + nw / 2, cy - 30);
    ctx.scale(pop, pop);
    ctx.font = "800 84px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = t < flip || t > flip + 0.5 ? INK : "#e0463a";
    ctx.fillText(num, 0, 30);
    ctx.restore();
    if (t >= flip) {
      var k = Math.min(1, (t - flip) / 0.8);
      ctx.globalAlpha = (1 - out) * (1 - k * 0.6);
      ctx.font = "800 34px sans-serif";
      ctx.textAlign = "left";
      ctx.fillStyle = "#e0463a";
      ctx.fillText("+" + gainOf(stage).toFixed(1), x0 + lw + 14 + nw + 8, cy - 58 - k * 26);
    }
    ctx.restore();
  }

  /* 「次」の矢印。共通のアイコンと同じ線の太さ・色 */
  function drawNextIcon(size) {
    var u = size / 30;
    ctx.save();
    ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4.5 * u; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-11 * u, 0); ctx.lineTo(11 * u, 0);
    ctx.moveTo(2 * u, -9 * u); ctx.lineTo(11 * u, 0); ctx.lineTo(2 * u, 9 * u);
    ctx.stroke();
    ctx.restore();
  }

  /* クリアの画面の「C力 0.0」。上がる演出の終わりと同じ形 */
  function drawPower(num, y) {
    var cy = y || H * 0.16, label = "C力";
    ctx.save();
    ctx.fillStyle = INK; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    ctx.font = "800 40px sans-serif";
    var lw = ctx.measureText(label).width;
    ctx.font = "800 84px sans-serif";
    var nw = ctx.measureText(num).width;
    var x0 = W / 2 - (lw + 14 + nw) / 2;
    ctx.font = "800 40px sans-serif";
    ctx.fillText(label, x0, cy);
    ctx.font = "800 84px sans-serif";
    ctx.fillText(num, x0 + lw + 14, cy);
    ctx.restore();
  }

  function drawResult() {
    /* 暗くしない。場面の上に、今のC力とボタン。全段そろった回だけ「Complete」 */
    drawPower(score);
    if (complete) {
      ctx.save();
      ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "800 64px sans-serif";
      ctx.lineWidth = 10; ctx.strokeStyle = PAPER; ctx.lineJoin = "round";
      ctx.strokeText("Complete", W / 2, H * 0.33);
      ctx.fillText("Complete", W / 2, H * 0.33);
      ctx.restore();
    }
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 28px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (b.id === "next") drawNextIcon(30);     /* 「次」は右向きの矢印。文字は出さない（読み上げ用の名前だけ） */
      else if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return {
        state: state, score: score, W: W, H: H, stage: stage, throws: throws, rowThrows: rowThrows, power: cPower(), gain: gain, complete: complete,
        clearing: clearT >= 0, hooked: hookT, confetti: confetti.length, hum: humLevel, launch: { x: LX, y: LY }, sel: sel, cleared: cleared.slice(),
        area: { x: AX, y: AY, w: AW, h: AH }, grab: grab && { lx: grab.lx, ly: grab.ly, px: grab.px, py: grab.py },
        ball: ball && { x: ball.x, y: ball.y, a: ball.a, vx: ball.vx, vy: ball.vy, w: ball.w, idle: ball.idle, out: ball.out, rm: BALL.rm, D: BALL.D },
        target: target ? { x: target.x, y: target.y, D: target.shape.D, a: target.a } : (function () { var gp = goalPos(); return { x: gp.x, y: gp.y, D: goal.R * 2, a: 0, kind: goal.kind }; })(),
        objs: objs.map(function (o) { var p = objPose(o, ST); return { kind: o.kind, x: p.x, y: p.y, R: o.R }; })
      };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    power: function (list) { return cPower(list); },
    hands: function () { return goal && goal.hands ? objPose(goal, ST).has.map(function (r) { return Math.round(r * 180 / Math.PI); }) : null; },
    buttons: function () { return resultButtons(); },
    size: function (i) { return SIZES[Math.floor(i / ROW)]; },
    dir: function (i) { return DIRS[i]; },
    stages: function () { return STAGES.length; },
    selButton: function () { return SEL_BTN; },
    selCells: function () { return selCells(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      var guard = Date.now() + 90000;
      while (state !== S.RESULT && Date.now() < guard) {
        if (state === S.PLAY && ball.idle && clearT < 0) { await r.wait(300 + Math.random() * 500); r.key(); }
        await r.wait(50);
      }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  /* STARTを押したら、まず段の一覧を開く。閉じれば続きの段から */
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(stage); sel = true; });
  load();
  stage = firstOpen();
  stageObjs();
  layout();
  readyBall();
  /* STARTは出さず、開いたらすぐ段の一覧から。最初のタップで音も有効になる */
  newRound(stage); sel = true;
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
