<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スカイダイビング紅茶</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 紅茶の流体計算（高いところから紅茶を注ぐ）

   単位は cm と秒。x はカップの中心が0、y はテーブルの上面が0で上向き。
   注ぎ口から出た粒は、重力と空気の抵抗と風で落ちる（飛んでいる粒）。
   カップの近くまで落ちた粒は、粒どうしが押し合う流体（Clavet らの二重密度緩和）に加わり、
   カップのガラス・受け皿・テーブルにぶつかって、跳ね・たまり・こぼれる。 */
(function (root) {
  "use strict";

  var G = 980;                 /* 重力 cm/s² */
  var DRAG = 0.00121;          /* 空気の抵抗（落ちる速さの上限が約 9m/s） */
  var KH = 1.2;                /* 粒どうしが押し合う距離 */
  var RHO0 = 3.0, K = 4000, KN = 6000;  /* 密度の目標と、押し返す強さ */
  var PR = 0.22;               /* 粒の半径（壁との当たり） */
  var SUB = 4;                 /* 1/60秒を何回に割って解くか */
  var JOIN_Y = 16;             /* これより下に来た粒は流体に加わる */
  var MAXN = 2400;

  /* カップ（耐熱ガラス）・受け皿の形。線分に太さをつけた棒の集まり */
  var CUP = {
    top: 9.0, base: 1.55,                 /* 内側の底の高さ */
    inBot: 3.2, inTop: 4.0                /* 内側の半幅（底・縁） */
  };
  var CAPS = [
    [-3.42, 1.2, -4.22, 9.0, 0.22],       /* 左の壁 */
    [3.42, 1.2, 4.22, 9.0, 0.22],         /* 右の壁 */
    [-3.0, 0.95, 3.0, 0.95, 0.6],         /* 厚い底 */
    [-7.4, 0.28, 7.4, 0.28, 0.28],        /* 受け皿 */
    [-7.4, 0.28, -8.2, 0.75, 0.22],       /* 受け皿のふち */
    [7.4, 0.28, 8.2, 0.75, 0.22]
  ];

  function innerHalf(y) { return CUP.inBot + (CUP.inTop - CUP.inBot) * (y - CUP.base) / (CUP.top - CUP.base); }
  function inCup(x, y) { return y > CUP.base - 0.3 && y < CUP.top + 0.2 && Math.abs(x) < innerHalf(y); }

  function create() {
    var x = new Float32Array(MAXN), y = new Float32Array(MAXN);
    var vx = new Float32Array(MAXN), vy = new Float32Array(MAXN);
    var px = new Float32Array(MAXN), py = new Float32Array(MAXN);
    var hgt = new Float32Array(MAXN);       /* 注いだときの高さ */
    var mode = new Uint8Array(MAXN);        /* 0なし 1飛んでいる 2流体 */
    var link = new Int32Array(MAXN);        /* ひとつ前に出た粒（流れのつながり） */
    var still = new Float32Array(MAXN);     /* こぼれて止まっている時間 */
    var born = new Float32Array(MAXN);
    var id = new Int32Array(MAXN);          /* 番号（つながりの確かめ用） */
    var n = 0, serial = 1, T = 0;
    var lastEmit = -1;
    var stains = [];                        /* テーブルに染みた跡（描く側が取り出す） */
    var hits = { cup: 0, table: 0, glass: 0, joinCup: 0, joinOut: 0 };

    /* 近所探し用の格子 */
    var GX0 = -40, GY0 = -6, GW = 80, GH = 40, CELL = KH;
    var NCX = Math.ceil(GW / CELL), NCY = Math.ceil(GH / CELL);
    var head = new Int32Array(NCX * NCY), next = new Int32Array(MAXN);
    var simList = new Int32Array(MAXN);

    /* 消すのはまとめて（つながりを壊さないよう、印をつけてから詰める） */
    var dead = [];
    function flush() {
      if (!dead.length) return;
      dead.sort(function (a, b) { return b - a; });
      var map = new Int32Array(n); for (var i = 0; i < n; i++) map[i] = i;
      var alive = new Uint8Array(n); alive.fill(1);
      for (var d = 0; d < dead.length; d++) alive[dead[d]] = 0;
      var w = 0;
      for (var r = 0; r < n; r++) {
        if (!alive[r]) { map[r] = -1; continue; }
        if (w !== r) {
          x[w] = x[r]; y[w] = y[r]; vx[w] = vx[r]; vy[w] = vy[r];
          px[w] = px[r]; py[w] = py[r]; hgt[w] = hgt[r]; mode[w] = mode[r];
          link[w] = link[r]; still[w] = still[r]; born[w] = born[r]; id[w] = id[r];
        }
        map[r] = w; w++;
      }
      for (var k = 0; k < w; k++) link[k] = link[k] >= 0 && link[k] < n ? map[link[k]] : -1;
      lastEmit = lastEmit >= 0 && lastEmit < n ? map[lastEmit] : -1;
      n = w; dead.length = 0;
    }

    function emit(sx, sy, svx, svy, height, connect) {
      if (n >= MAXN) return -1;
      var i = n++;
      x[i] = sx; y[i] = sy; vx[i] = svx; vy[i] = svy; px[i] = sx; py[i] = sy;
      hgt[i] = height; mode[i] = 1; still[i] = 0; born[i] = T; id[i] = serial++;
      link[i] = connect && lastEmit >= 0 && lastEmit < n - 1 ? lastEmit : -1;
      lastEmit = i;
      return i;
    }
    function cut() { lastEmit = -1; }

    function randn() { return (Math.random() + Math.random() + Math.random() - 1.5) * 2; }

    /* 飛んでいる粒：重力・抵抗・風・流れのほつれ */
    function fly(i, dt, wind) {
      var sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
      vx[i] += (-DRAG * sp * vx[i] + wind * Math.min(1, Math.max(0, (y[i] - 25) / 400))) * dt;
      vy[i] += (-G - DRAG * sp * vy[i]) * dt;
      /* 落ちるほど流れは細くなり、ほつれて粒に分かれる */
      var fray = 0.6 + sp * 0.012;
      vx[i] += randn() * fray * Math.sqrt(dt);
      x[i] += vx[i] * dt; y[i] += vy[i] * dt;
      /* つながりが切れる：注ぎ口から離れるほど切れやすい */
      var L = link[i];
      if (L >= 0) {
        var dx = x[L] - x[i], dy = y[L] - y[i];
        var gap = dx * dx + dy * dy;
        if (gap > 36 || Math.random() < dt * Math.max(0, (sp - 120) / 160)) link[i] = -1;
      }
      if (y[i] < JOIN_Y) {
        mode[i] = 2; if (Math.abs(x[i]) < 4.4) hits.joinCup++; else hits.joinOut++;
        px[i] = x[i] - vx[i] / 60 / SUB; py[i] = y[i] - vy[i] / 60 / SUB;
        /* 速すぎる粒は数値が暴れるので、跳ねる勢いは残して少し抑える */
        var s2 = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
        if (s2 > 520) { var f = 520 / s2; vx[i] *= f; vy[i] *= f; px[i] = x[i] - vx[i] / 60 / SUB; py[i] = y[i] - vy[i] / 60 / SUB; }
      }
    }

    function collide(i) {
      /* 途中で壁を通り抜けないよう、動いた道のりを刻んで確かめる */
      var sx = px[i], sy = py[i], ex = x[i], ey = y[i];
      var len = Math.sqrt((ex - sx) * (ex - sx) + (ey - sy) * (ey - sy));
      var steps = Math.max(1, Math.ceil(len / 0.3));
      for (var s = 1; s <= steps; s++) {
        var t = s / steps, cx = sx + (ex - sx) * t, cy = sy + (ey - sy) * t;
        var hit = false;
        for (var c = 0; c < CAPS.length; c++) {
          var C = CAPS[c];
          var ax = C[0], ay = C[1], bx = C[2], by = C[3], R = C[4] + PR;
          var abx = bx - ax, aby = by - ay;
          var u = ((cx - ax) * abx + (cy - ay) * aby) / (abx * abx + aby * aby);
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          var qx = ax + abx * u, qy = ay + aby * u;
          var dx = cx - qx, dy = cy - qy, d = Math.sqrt(dx * dx + dy * dy);
          if (d < R) {
            var nx, ny;
            if (d > 1e-5) { nx = dx / d; ny = dy / d; }
            else {
              /* 真上から芯に入ったとき：手前の位置の側へ返す */
              var ox = sx - qx, oy = sy - qy, od = Math.sqrt(ox * ox + oy * oy) || 1;
              nx = ox / od; ny = oy / od;
            }
            cx = qx + nx * R; cy = qy + ny * R;
            hit = true;
            /* はね返りは弱く、ガラスの上は少し滑る */
            var vxx = (x[i] - px[i]), vyy = (y[i] - py[i]);
            var vn = vxx * nx + vyy * ny;
            if (vn < 0) {
              vxx -= 1.15 * vn * nx; vyy -= 1.15 * vn * ny;
              if (vn < -0.8) hits.glass++;
            }
            vxx *= 0.985; vyy *= 0.985;
            x[i] = cx; y[i] = cy; px[i] = cx - vxx; py[i] = cy - vyy;
            ex = cx; ey = cy;
          }
        }
        if (cy < PR) {
          var vy0 = y[i] - py[i], vx0 = x[i] - px[i];
          if (vy0 < -1.2) hits.table++;
          cy = PR; x[i] = cx; y[i] = cy;
          px[i] = cx - vx0 * 0.7; py[i] = cy + Math.max(0, -vy0) * 0.12; /* テーブルクロスは吸う */
          hit = true;
        }
        if (hit) return;
      }
    }

    function relax(dt) {
      var m = 0;
      head.fill(-1);
      for (var i = 0; i < n; i++) {
        if (mode[i] !== 2) continue;
        simList[m++] = i;
        var gx = Math.floor((x[i] - GX0) / CELL), gy = Math.floor((y[i] - GY0) / CELL);
        if (gx < 0 || gy < 0 || gx >= NCX || gy >= NCY) { next[i] = -2; continue; }
        var c = gy * NCX + gx;
        next[i] = head[c]; head[c] = i;
      }
      var dt2 = dt * dt;
      for (var a = 0; a < m; a++) {
        var I = simList[a];
        if (next[I] === -2) continue;
        var gx2 = Math.floor((x[I] - GX0) / CELL), gy2 = Math.floor((y[I] - GY0) / CELL);
        var rho = 0, rhoN = 0;
        var xi = x[I], yi = y[I];
        for (var oy = -1; oy <= 1; oy++) {
          var yy = gy2 + oy; if (yy < 0 || yy >= NCY) continue;
          for (var ox = -1; ox <= 1; ox++) {
            var xx = gx2 + ox; if (xx < 0 || xx >= NCX) continue;
            for (var j = head[yy * NCX + xx]; j >= 0; j = next[j]) {
              if (j === I) continue;
              var dx = x[j] - xi, dy = y[j] - yi, r2 = dx * dx + dy * dy;
              if (r2 >= KH * KH) continue;
              var q = 1 - Math.sqrt(r2) / KH;
              rho += q * q; rhoN += q * q * q;
            }
          }
        }
        var P = K * (rho - RHO0), PN = KN * rhoN;
        var mx = 0, my = 0;
        for (var oy2 = -1; oy2 <= 1; oy2++) {
          var yy2 = gy2 + oy2; if (yy2 < 0 || yy2 >= NCY) continue;
          for (var ox2 = -1; ox2 <= 1; ox2++) {
            var xx2 = gx2 + ox2; if (xx2 < 0 || xx2 >= NCX) continue;
            for (var j2 = head[yy2 * NCX + xx2]; j2 >= 0; j2 = next[j2]) {
              if (j2 === I) continue;
              var ddx = x[j2] - xi, ddy = y[j2] - yi, rr2 = ddx * ddx + ddy * ddy;
              if (rr2 >= KH * KH || rr2 < 1e-10) continue;
              var r = Math.sqrt(rr2), q2 = 1 - r / KH;
              var D = dt2 * (P * q2 + PN * q2 * q2) * 0.5 / r;
              if (D > 0.25 / r) D = 0.25 / r;    /* 1回に動かす量の上限（暴れ止め） */
              var dX = D * ddx, dY = D * ddy;
              x[j2] += dX; y[j2] += dY;
              mx -= dX; my -= dY;
            }
          }
        }
        x[I] += mx; y[I] += my;
      }
    }

    /* 1/60秒進める。wind は上空の風の強さ（cm/s²） */
    function step(wind) {
      var dt = 1 / 60;
      T += dt;
      hits.cup = 0; hits.table = 0; hits.glass = 0; hits.joinCup = 0; hits.joinOut = 0;
      for (var i = 0; i < n; i++) if (mode[i] === 1) fly(i, dt, wind);
      var h = dt / SUB;
      for (var s = 0; s < SUB; s++) {
        for (var k = 0; k < n; k++) {
          if (mode[k] !== 2) continue;
          vy[k] -= G * h;
          px[k] = x[k]; py[k] = y[k];
          x[k] += vx[k] * h; y[k] += vy[k] * h;
        }
        relax(h);
        for (var k2 = 0; k2 < n; k2++) {
          if (mode[k2] !== 2) continue;
          var ix = x[k2], iy = y[k2];
          collide(k2);
          vx[k2] = (x[k2] - px[k2]) / h; vy[k2] = (y[k2] - py[k2]) / h;
          if (!(ix === ix)) { vx[k2] = 0; vy[k2] = 0; }
        }
      }
      /* こぼれて止まった粒はテーブルクロスの染みになる。遠くへ行った粒は消す */
      for (var p = 0; p < n; p++) {
        if (mode[p] !== 2) continue;
        if (!(x[p] === x[p]) || !(y[p] === y[p]) || y[p] < -4 || Math.abs(x[p]) > 38) { dead.push(p); continue; }
        if (!inCup(x[p], y[p])) {
          var sp = vx[p] * vx[p] + vy[p] * vy[p];
          if (y[p] < 1.6 && sp < 400) still[p] += dt; else still[p] = 0;
          if (still[p] > 0.9 && (Math.abs(x[p]) > 7.6 || y[p] < 0.7)) {
            stains.push({ x: x[p], y: y[p] }); dead.push(p);
          }
        }
      }
      flush();
    }

    function stats() {
      var inC = 0, sumH = 0, flying = 0, top = CUP.base;
      for (var i = 0; i < n; i++) {
        if (mode[i] === 1) { flying++; continue; }
        if (mode[i] === 2 && inCup(x[i], y[i])) { inC++; sumH += hgt[i]; if (y[i] > top) top = y[i]; }
        else if (mode[i] === 2 && y[i] > JOIN_Y - 2) flying++;
      }
      return { inCup: inC, avgH: inC ? sumH / inC : 0, flying: flying, n: n };
    }

    return {
      emit: emit, cut: cut, step: step, stats: stats,
      get n() { return n; },
      x: x, y: y, vx: vx, vy: vy, mode: mode, link: link, hgt: hgt,
      stains: stains, hits: hits, CUP: CUP, CAPS: CAPS, inCup: inCup, PR: PR,
      /* 確認用：カップの中にすぐ粒を置く */
      fillTo: function (count) {
        var placed = 0, s = 0.5;
        for (var yy = CUP.base + 0.3; yy < CUP.top && placed < count; yy += s * 0.87) {
          var hw = innerHalf(yy) - 0.35;
          for (var xx = -hw; xx <= hw && placed < count; xx += s) {
            var i = emit(xx, yy, 0, 0, 30, false); if (i < 0) return;
            mode[i] = 2; placed++;
          }
        }
        cut();
      }
    };
  }

  var api = { create: create, CUP: CUP };
  root.TeaSim = api;
})(typeof window !== "undefined" ? window : this);
</script>
<script>
/* スカイダイビング紅茶

   飛行機から飛び降りる。押すとパラシュートが開く。
   開いたあとは、押している間ポットから紅茶が出て、指を左右に動かすと進む向きが変わる。
   地上のテーブルのカップに紅茶を入れる。
   記録は「カップに入った紅茶が、平均で何mの高さから注がれたか」。

   空の動きは本当の物理（落ちる人は約55m/s、開くと約5m/s、紅茶の粒は約9m/sまで）。
   高いところでは、空の時間だけを早送りにする（低くなるほど本当の速さに戻る）。
   カップのまわりの紅茶は tea の流体計算で、いつも本当の速さで動く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  var SC = 13;                                 /* カップのあたりの 1cm が何ドットか */
  var GY, TOPY;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* 縦：カップのあたり（14cmまで）はそのまま、上は対数で縮めて、落ちる人がいつも画面の上に入るようにする */
  var Y1 = 14, Y0 = 1e9, LIN = true;
  function setCamera(h) {
    var A = GY - TOPY;
    if (h * SC <= A) { LIN = true; return; }
    LIN = false;
    var target = (A - SC * Y1) / SC, L = h - Y1;
    var lo = 1e-4, hi = 1e7;
    for (var k = 0; k < 60; k++) {
      var mid = Math.sqrt(lo * hi);
      if (mid * Math.log(1 + L / mid) > target) hi = mid; else lo = mid;
    }
    Y0 = Math.sqrt(lo * hi);
  }
  function fy(y) {
    if (LIN || y <= Y1) return y * SC;
    return SC * Y1 + SC * Y0 * Math.log(1 + (y - Y1) / Y0);
  }
  function dfy(y) {
    if (LIN || y <= Y1) return SC;
    return SC * Y0 / (Y0 + y - Y1);
  }
  /* 横：カップの真上を見上げたように、高いところほど横を縮める（真上にあるものは画面の真ん中）。
     カップのあたり（14cmまで）はそのままの縮尺 */
  var XS = 30;
  function hs(y) { return y <= Y1 ? SC : SC * XS / (XS + y - Y1); }
  function sxy(x, y) { return W / 2 + x * hs(y); }
  function sx(x) { return W / 2 + x * SC; }
  function sy(y) { return GY - fy(y); }

  /* ============ 音 ============ */
  var AC = null, NOISE = null, pourGain = null, pourBand = null, windGain = null, windBand = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    /* カップに当たる音：たまるほど高くなる */
    var s1 = AC.createBufferSource(); s1.buffer = NOISE; s1.loop = true;
    pourBand = AC.createBiquadFilter(); pourBand.type = "bandpass"; pourBand.frequency.value = 500; pourBand.Q.value = 2.2;
    pourGain = AC.createGain(); pourGain.gain.value = 0;
    s1.connect(pourBand); pourBand.connect(pourGain); pourGain.connect(AC.destination); s1.start();
    /* 風を切る音 */
    var s2 = AC.createBufferSource(); s2.buffer = NOISE; s2.loop = true; s2.playbackRate.value = 0.6;
    windBand = AC.createBiquadFilter(); windBand.type = "lowpass"; windBand.frequency.value = 600;
    windGain = AC.createGain(); windGain.gain.value = 0;

    bctx.putImageData(img, x0, y0);
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(buf, 0, 0, bw, bh, 0, 0, bw / BF, bh / BF);
    ctx.restore();
  }
  /* 空を落ちている紅茶の粒 */
  function drawSkyTea() {
    ctx.fillStyle = "rgba(150,70,22,.9)";
    for (var i = 0; i < sn; i++) {
      var X = sxy(PX[i] * 100, PY[i] * 100), Y = sy(PY[i] * 100);
      if (Y < -4 || Y > H) continue;
      ctx.fillRect(X - 1.6, Y - 1.6, 3.2, 3.2);
    }
  }

  function drawPlane() {
    if (state === S.PLAY && dv.y < JUMP - 300) return;
    var X = sxy(plane.x * 100, plane.y * 100) + 40, Y = sy(plane.y * 100) - 20;
    if (X < -200 || X > W + 200) return;
    ctx.save(); ctx.translate(X, Y);
    ctx.fillStyle = "#eef1f4";
    ctx.beginPath(); ctx.ellipse(0, 0, 92, 16, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#d4dae0";
    ctx.beginPath(); ctx.moveTo(-20, 2); ctx.lineTo(20, 2); ctx.lineTo(-5, 34); ctx.lineTo(-30, 34); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-78, -4); ctx.lineTo(-96, -38); ctx.lineTo(-80, -38); ctx.lineTo(-60, -6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4a6b8a";
    for (var i = 0; i < 5; i++) ctx.fillRect(20 + i * 12 - 40, -7, 7, 6);
    ctx.fillStyle = "#2b3a4a"; ctx.fillRect(-48, -10, 14, 20);   /* 開いた扉 */
    ctx.restore();
  }

  /* 人：注ぎ口の先がいつも (tx, ty) に来るように描く。u は 1cm のドット数 */
  function drawDiver(tx, ty, u) {
    ctx.save();
    ctx.translate(tx, ty); ctx.scale(u, u);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    var free = dv.chute === 0 && !dv.landed;
    if (dv.chute && !dv.landed) {
      /* パラシュート：開くにつれて広がる */
      var o = dv.chute === 1 ? dv.open : 1;
      var cw = 260 * (0.25 + 0.75 * o), cy = -300;
      ctx.strokeStyle = "rgba(60,60,60,.6)"; ctx.lineWidth = 1.2;
      for (var i = 0; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(25, -120); ctx.lineTo(25 - cw / 2 + cw * i / 6, cy + 12); ctx.stroke(); }
      var cols = ["#e8483b", "#f6c344", "#2f8ad8", "#f6c344", "#e8483b", "#2f8ad8"];
      for (var j = 0; j < 6; j++) {
        ctx.fillStyle = cols[j];
        var x0 = 25 - cw / 2 + cw * j / 6, x1 = x0 + cw / 6;
        ctx.beginPath(); ctx.moveTo(x0, cy + 12); ctx.quadraticCurveTo((x0 + x1) / 2, cy - 30 * o - 8, x1, cy + 12);
        ctx.lineTo(x1, cy + 18); ctx.lineTo(x0, cy + 18); ctx.closePath(); ctx.fill();
      }
    }
    if (free) {
      /* うつぶせで落ちる姿勢。ポットは右手 */
      ctx.translate(30, -40);
      ctx.fillStyle = "#e8483b"; roundRect(-10, -14, 90, 28, 14); ctx.fill();           /* 胴 */
      ctx.strokeStyle = "#e8483b"; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(70, -6); ctx.lineTo(120, -30); ctx.moveTo(70, 6); ctx.lineTo(120, 30); ctx.stroke();  /* 脚 */
      ctx.beginPath(); ctx.moveTo(10, -8); ctx.lineTo(-5, -50); ctx.stroke();            /* 左腕 */
      ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(-20, 22); ctx.stroke();             /* 右腕（ポット） */
      ctx.fillStyle = "#e9b892"; ctx.beginPath(); ctx.arc(-24, 0, 13, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#2b2b2b"; ctx.beginPath(); ctx.arc(-26, 0, 13, 1.6, 4.7); ctx.fill();  /* ヘルメット */
      ctx.translate(-30, 40);
      drawPotAt(0, 0, 0.2);
    } else {
      /* 座って吊られる姿勢（着地したら立つ） */
      var by = dv.landed ? -80 : -110;
      ctx.translate(26, 0);
      ctx.strokeStyle = "#e8483b"; ctx.lineWidth = 15;
      if (dv.landed) { ctx.beginPath(); ctx.moveTo(5, by + 70); ctx.lineTo(-2, 0); ctx.moveTo(15, by + 70); ctx.lineTo(24, 0); ctx.stroke(); }
      else { ctx.beginPath(); ctx.moveTo(5, by + 70); ctx.lineTo(-10, by + 115); ctx.moveTo(15, by + 70); ctx.lineTo(28, by + 112); ctx.stroke(); }
      ctx.fillStyle = "#e8483b"; roundRect(-6, by, 32, 76, 14); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4, by + 18); ctx.lineTo(-8, by + 64); ctx.stroke();      /* ポットを持つ腕 */
      ctx.beginPath(); ctx.moveTo(22, by + 14); ctx.lineTo(dv.landed ? 30 : 0, by - (dv.landed ? -40 : 10)); ctx.stroke();
      ctx.fillStyle = "#e9b892"; ctx.beginPath(); ctx.arc(10, by - 14, 14, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#2b2b2b"; ctx.beginPath(); ctx.arc(10, by - 17, 14.5, 3.3, 6.1); ctx.fill();
      ctx.translate(-26, 0);
      drawPotAt(0, 0, dv.landed ? 0 : 0.55 + 0.5 * (1 - pourLeft / POT));
    }
    ctx.restore();
  }
  /* ポット（白い磁器）。注ぎ口の先が原点。tilt で傾ける */
  function drawPotAt(ox, oy, tilt) {
    ctx.save();
    var tipL = [-13.5, 4.5];
    var c = Math.cos(-tilt), s = Math.sin(-tilt);
    var rx = tipL[0] * c - tipL[1] * s, ry = tipL[0] * s + tipL[1] * c;
    ctx.translate(ox - rx * 1.6, oy - ry * 1.6); ctx.rotate(-tilt); ctx.scale(1.6, 1.6);
    ctx.lineWidth = 0.6;
    ctx.strokeStyle = "#f2efe8"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(6.5, -4); ctx.bezierCurveTo(13, -6, 13, 4, 6.5, 3.5); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(-5.5, 3.5); ctx.quadraticCurveTo(-10.5, 3.2, -13.8, 4.0);
    ctx.lineTo(-13.2, 5.2); ctx.quadraticCurveTo(-10, 5.4, -5.5, 6.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f4f1ea";
    ctx.beginPath(); ctx.ellipse(0, 1, 7.6, 6.4, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#c9a94e"; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.ellipse(0, 1, 7.6, 6.4, 0, 3.6, 5.82); ctx.stroke();
    ctx.fillStyle = "#f6f4ef"; ctx.beginPath(); ctx.ellipse(0, -5.2, 4.6, 1.3, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#c9a94e"; ctx.beginPath(); ctx.arc(0, -6.8, 1.1, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    setCamera(camH());
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawGround();
    drawPlane();
    drawSaucer();
    drawCupBack();
    drawTea();
    drawCupFront();
    drawSkyTea();
    if (state !== S.INTRO) {
      var y = dv.y * 100;
      var u = Math.max(0.45, Math.min(0.9, dfy(y)));
      drawDiver(sxy(dv.x * 100, y - 15), sy(y - 15), u);
    }
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.62)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { var st = tea.stats(); return { fly: st.flying, state: state, score: score, W: W, H: H, y: dv.y, x: dv.x, vx: dv.vx, chute: dv.chute, landed: dv.landed, steer: dv.steer, wind: windAt(dv.y), inCup: inCup, cap: CAP, left: pourLeft, sky: sn, n: tea.n, avgH: avgH, TS: TS }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); jump(); },
    hold: function (on) { if (on) down(); else up(); },
    steer: function (v) { dv.steer = v; },
    spots: function () { return spots; },
    windAt: function (y) { return windAt(y); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 90)) throw Error("終わらない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); jump(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
