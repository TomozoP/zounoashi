<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>一輪車で鍋</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../share.js"></script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 一輪車で鍋

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if (view3d) view3d.resize(canvas.width, canvas.height, W, H);
  }

  /* 3Dの絵。使えない環境（テストの台など）では平らな絵で代わりに描く */
  var view3d = null;
  if (window.WebGLRenderingContext && window.THREE && window.NabeScene) {
    try { view3d = new window.NabeScene(); } catch (e) { view3d = null; }
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  /* ---- こぐ音と「アツっ」 ここから（音の試聴用に道具が切り出すので、目印を消さない） ---- */
  var noiseBufs = [];
  function noiseOf(ac) {
    for (var i = 0; i < noiseBufs.length; i++) if (noiseBufs[i].ac === ac) return noiseBufs[i].buf;
    var len = Math.floor(ac.sampleRate * 0.5), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (var k = 0; k < len; k++) d[k] = Math.random() * 2 - 1;
    noiseBufs.push({ ac: ac, buf: buf });
    return buf;
  }
  /* こぐ音。クランク半回転ごとに「キ」「コ」と交互にきしむ */
  function creak(ac, at, vol, high) {
    var t = at, o = ac.createOscillator(), g = ac.createGain(), b = ac.createBiquadFilter();
    o.type = "triangle";
    var f = high ? 1650 : 1250;
    o.frequency.setValueAtTime(f * (high ? 0.9 : 1.08), t);
    o.frequency.exponentialRampToValueAtTime(f * (high ? 1.12 : 0.88), t + 0.06);
    b.type = "bandpass"; b.frequency.value = f; b.Q.value = 3;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(b); b.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.1);
    /* チェーンのカチッ */
    var n = ac.createBufferSource(), nb = ac.createBiquadFilter(), ng = ac.createGain();
    n.buffer = noiseOf(ac); nb.type = "highpass"; nb.frequency.value = 3000;
    ng.gain.setValueAtTime(vol * 0.8, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.015);
    n.connect(nb); nb.connect(ng); ng.connect(ac.destination);
    n.start(t); n.stop(t + 0.03);
  }
  /* 「アツっ」。声の元（のこぎり波）を口の形の響き（フォルマント）で絞って母音にする。
     ア（口を開けて、驚いて高めから下がる）→ 一瞬止める → ツ（舌で止めてから息が擦れる）→ ウ（小さく） */
  function atsu(ac, at, pitch) {
    var t = at, f0 = pitch || 340;
    var out = ac.createGain();
    out.gain.value = 0.3;                       /* ほかの効果音と大きさを揃える */
    out.connect(ac.destination);
    function vowel(t0, dur, fm, p0, p1, vol) {
      var o = ac.createOscillator(), env = ac.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(p0, t0);
      o.frequency.exponentialRampToValueAtTime(p1, t0 + dur);
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      env.gain.setValueAtTime(vol, t0 + dur * 0.55);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(env);
      fm.forEach(function (f) {
        var b = ac.createBiquadFilter(), g = ac.createGain();
        b.type = "bandpass"; b.frequency.value = f[0]; b.Q.value = f[1]; g.gain.value = f[2];
        env.connect(b); b.connect(g); g.connect(out);
      });
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    function hiss(t0, dur, freq, q, vol) {
      var n = ac.createBufferSource(), b = ac.createBiquadFilter(), g = ac.createGain();
      n.buffer = noiseOf(ac); b.type = "bandpass"; b.frequency.value = freq; b.Q.value = q;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      n.connect(b); b.connect(g); g.connect(out);
      n.start(t0); n.stop(t0 + dur + 0.02);
    }
    /* ア：F1 800 / F2 1200 / F3 2600 あたり */
    vowel(t, 0.16, [[800, 5, 2.2], [1200, 6, 1.4], [2600, 8, 0.6]], f0 * 1.3, f0 * 0.95, 0.9);
    /* ッ：息を止める（無音）→ ツ：舌がはじける「t」と、続く「s」の擦れ */
    var t1 = t + 0.23;
    hiss(t1, 0.02, 3500, 0.8, 0.5);
    hiss(t1 + 0.012, 0.08, 6000, 1.5, 0.45);
    /* ウ：F1 350 / F2 1300（口をすぼめて小さく） */
    vowel(t1 + 0.07, 0.11, [[350, 5, 2.0], [1300, 7, 0.7], [2500, 8, 0.25]], f0 * 1.05, f0 * 0.85, 0.35);
  }
  /* ---- こぐ音と「アツっ」 ここまで ---- */
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  /* 釣り合いの決まりごと。一輪車に乗った人を、車輪の上に立てた棒（倒立振子）として計算する。
     th は体の傾き（ラジアン、前＝右が＋）、w はその速さ。x, v は車輪の位置と速さ。
     ボタンは車輪を前後に加速させるだけ。体はその反動で傾く（右を押すと車輪が左へ出て、体が右へ）。
     車輪には最高速度があり、そこに張りついたらもう同じ向きには加速できない＝立て直せない。
     乗り手は鍋を持ったぶん少しのけぞって重心を車輪の上に保っている（前へ一方的には引かれない）。
     箸を口へ運ぶと、腕のぶん重心が一瞬後ろへ動く。
     熱いと体がはねる。路面のでこぼこでいつも揺さぶられる。
     数字はテストの自動運転で決めた：食べずに乗るだけなら反応0.2秒でなんとかなり、0.3秒では数秒で倒れる。
     食べきれるのは反応0.2秒前後で半分ほど。 */
  var P = {
    G: 3.5,        /* 重力で倒れようとする強さ（重さ÷高さ。大きいほど速く倒れる） */
    A: 3.2,        /* ボタンで車輪を加速する強さ（m/s²） */
    AL: 1.0,       /* 車輪の加速が体の傾きに効く割合（1÷高さ） */
    VMAX: 2.2,     /* 車輪の最高速度（m/s） */
    ROLL: 0.05,    /* 転がりの抵抗 */
    ARM: 0.5,      /* 箸を口へ運ぶときに重心が後ろへ動くぶん */
    D: 0.2,        /* 体のぶれの収まり（小さいほど揺れが残る） */
    FALL: 1.1,     /* これより傾いたら倒れる */
    BITE: 0.3,     /* ひと口の秒数 */
    HOT: 0.25,     /* 冷めているときに熱い見込み */
    BURN: 0.22,    /* ひと口ごとにたまる熱さ */
    COOL: 0.45,    /* 熱さが1秒で引くぶん */
    JOLT: 0.8,     /* 熱くて体がはねる強さ */
    GUST: 0.4,     /* 路面のでこぼこで常に揺さぶられる強さ */
    GUSTT: 0.5     /* 揺さぶりの向きが変わるまでの目安（秒） */
  };
  var N = 16;                                  /* 具の数 = ひと口の数 */
  var th, w, x, v, gust, gustTo, eaten, biteP, biting, burn, hot, phase, fallT, doneT, clearTime, puffNow, crank, creakHigh;
  var dir;                                     /* 左右の押している向き（-1, 0, 1） */
  var fingers = {}, keys = { l: false, r: false };

  /* 下に並ぶ3つのボタン。← 食べる → */
  var PADS;
  function place() {
    var y = H - 118, r = 58;
    PADS = [
      { id: "left", x: W * 0.17, y: y, r: r },
      { id: "eat", x: W * 0.5, y: y, r: r + 8 },
      { id: "right", x: W * 0.83, y: y, r: r }
    ];
  }
  /* 絵の中を縦3列に分け、どこを押してもその列のボタンになる（指が小さくずれても効く） */
  function padAt(px) { return px < W / 3 ? "left" : px > W * 2 / 3 ? "right" : "eat"; }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    fingers = {}; keys = { l: false, r: false }; dir = 0;
    th = 0; w = (Math.random() < 0.5 ? -1 : 1) * 0.05;
    x = 0; v = 0;
    gust = 0; gustTo = 0;
    eaten = 0; biteP = 0; biting = false; burn = 0; hot = 0;
    phase = "ride"; fallT = 0; doneT = 0; clearTime = 0; puffNow = false;
    crank = 0; creakHigh = false;
  }

  function readDir() {
    var l = keys.l, r = keys.r;
    for (var id in fingers) { if (fingers[id] === "left") l = true; if (fingers[id] === "right") r = true; }
    dir = (r ? 1 : 0) - (l ? 1 : 0);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    hot = Math.max(0, hot - dt / 1.2);
    burn = Math.max(0, burn - dt * P.COOL);

    if (phase === "ride") {
      T += dt;
      /* でこぼこ：ときどき向きの変わる揺さぶりを、なめらかにつなぐ */
      if (Math.random() < dt / P.GUSTT) gustTo = (Math.random() * 2 - 1) * P.GUST;
      gust += (gustTo - gust) * Math.min(1, dt * 4);
      /* 車輪：ボタンで加速。最高速度に張りついたら、その向きへはもう加速できない */
      var a = -P.A * dir;
      if ((v >= P.VMAX && a > 0) || (v <= -P.VMAX && a < 0)) a = 0;
      a -= P.ROLL * v;
      v = Math.max(-P.VMAX, Math.min(P.VMAX, v + a * dt));
      x += v * dt;
      /* クランクが半回転するごとにきしむ（車輪の半径0.3m） */
      crank += Math.abs(v) * dt / 0.3;
      if (crank >= Math.PI) {
        crank -= Math.PI;
        creakHigh = !creakHigh;
        if (AC) creak(AC, AC.currentTime, Math.min(0.1, 0.04 + 0.04 * Math.abs(v)), creakHigh);
      }
      /* 体：重力・鍋の重み・腕の動き・車輪の加速の反動 */
      var arm = biting ? Math.sin(Math.PI * Math.min(1, biteP / 0.72)) : 0;
      var acc = gust + P.G * Math.sin(th) - P.ARM * arm * Math.cos(th)
              - a * P.AL * Math.cos(th) - P.D * w;
      w += acc * dt;
      th += w * dt;

      if (biting) {
        var before = biteP;
        biteP += dt / P.BITE;
        if (before < 0.72 && biteP >= 0.72) eat();
        if (biteP >= 1) { biteP = 0; biting = false; }
      }
      if (phase === "ride" && Math.abs(th) > P.FALL) {
        phase = "fall";
        biting = false;
        noiseHit(0.5, 380, 0.35, 0.8);
        tone(160, 0.35, 0.18, "triangle", 70);
      }
    } else if (phase === "fall") {
      fallT += dt;
      w += 5 * Math.sin(th) * dt;
      th += w * dt;
      if (Math.abs(th) > 1.5) {
        if (Math.abs(w) > 0.8) noiseHit(0.25, 250, 0.3, 0.8);
        th = (th > 0 ? 1 : -1) * 1.5;
        w = -w * 0.2;
      }
      v *= 1 - Math.min(1, dt * 3);
      x += v * dt;
      if (fallT > 1.4) endRound();
    } else if (phase === "done") {
      doneT += dt;
      th += (0 - th) * Math.min(1, dt * 4);
      w = 0;
      v *= 1 - Math.min(1, dt * 2);
      x += v * dt;
      if (doneT > 1.8) endRound();
    }
  }

  function startBite() {
    if (phase !== "ride" || biting || eaten >= N) return;
    biting = true;
    biteP = 0;
    tone(520, 0.04, 0.04, "triangle", 620);
  }

  function eat() {
    eaten++;
    noiseHit(0.1, 1600, 0.12, 2);
    tone(420, 0.06, 0.05, "sine", 300, 0.08);
    if (Math.random() < Math.min(0.9, P.HOT + burn * 0.6)) {
      hot = 1;
      puffNow = true;
      w += (Math.random() < 0.5 ? -1 : 1) * P.JOLT * (0.5 + burn * 0.6) * (0.8 + 0.4 * Math.random());
      if (AC) atsu(AC, AC.currentTime + 0.02, 310 + Math.random() * 80);
    }
    burn = Math.min(1.5, burn + P.BURN);
    if (eaten >= N) {
      phase = "done";
      biting = false; biteP = 0;
      clearTime = T;
      tone(660, 0.14, 0.12, "triangle");
      tone(880, 0.14, 0.12, "triangle", null, 0.12);
      tone(1320, 0.3, 0.12, "triangle", null, 0.24);
    }
  }

  function endRound() {
    state = S.RESULT;
    fingers = {}; keys = { l: false, r: false }; dir = 0;
    score = phase === "done" ? Math.round(clearTime * 10) / 10 : Math.round(eaten / N * 100);
  }
  function scoreText() {
    return phase === "done" ? score.toFixed(1) + "秒" : score + "%";
  }

  /* ============ 入力 ============
     左右は ← → キー、食べるのはスペース（ジョイパッドは十字キーとボタン）。
     タップは列で決まる：左の列＝←、真ん中＝食べる、右の列＝→。左右は押している間だけ効く。 */
  function down(px, py, id) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = px == null ? "retry" : hitButton(px, py);
      if (hit === "retry") newRound();
      return;
    }
    if (phase !== "ride") return;
    var pad = px == null ? "eat" : padAt(px);
    if (pad === "eat") { startBite(); return; }
    fingers[id] = pad;
    readDir();
  }
  function up(id) {
    if (id === undefined) fingers = {}; else delete fingers[id];
    readDir();
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) { up(e.pointerId); });
  window.addEventListener("blur", function () { keys = { l: false, r: false }; up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter" || e.key === "ArrowUp";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (left) keys.l = true; else keys.r = true;
      readDir();
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    if (e.key === "ArrowUp" && state !== S.PLAY) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (left || right) { if (left) keys.l = false; else keys.r = false; readDir(); return; }
    if ((e.code === "Space" || e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    var text = phase === "done" ? "一輪車に乗ったまま鍋を" + scoreText() + "で食べきりました" : "一輪車に乗ったまま鍋を" + scoreText() + "食べました";
    window.zResultActions.x({ text: text + " #一輪車で鍋" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(dt) {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    var look = {
      x: x, th: th, v: v, eaten: eaten, N: N, hot: Math.max(hot, burn * 0.35), t: animT,
      phase: state === S.INTRO ? "intro" : phase, fallT: fallT, doneT: doneT,
      bite: { p: state === S.INTRO ? 0 : biteP, idx: eaten }, puff: puffNow
    };
    puffNow = false;
    if (view3d) {
      try { ctx.drawImage(view3d.render(look, dt || 1 / 60), 0, 0, W, H); }
      catch (e) { view3d = null; }
    }
    if (!view3d) drawFlat(look);
    if (state === S.PLAY && phase === "ride") drawPads();

    if (state === S.RESULT) drawResult();
  }

  /* 下の3つのボタン。文字は出さず、矢印と鍋の絵だけ */
  function drawPads() {
    PADS.forEach(function (p) {
      var on = p.id === "eat" ? biting : (p.id === "left" ? dir < 0 : dir > 0);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      if (p.id === "eat") {
        /* 続けて食べて熱いほど赤くなる */
        var k = Math.min(1, burn / 1.2);
        ctx.fillStyle = "rgba(" + Math.round(255) + "," + Math.round(255 - 150 * k) + "," + Math.round(255 - 190 * k) + "," + (on ? 0.5 : 0.28) + ")";
      } else ctx.fillStyle = on ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.22)";
      ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.stroke();
      ctx.fillStyle = "#fff";
      if (p.id === "eat") {
        if (biting) {
          ctx.beginPath(); ctx.arc(0, 0, p.r - 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * biteP);
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.stroke();
        }
        /* 鍋と箸 */
        ctx.beginPath(); ctx.moveTo(-30, -2); ctx.lineTo(30, -2); ctx.quadraticCurveTo(28, 24, 0, 26); ctx.quadraticCurveTo(-28, 24, -30, -2); ctx.fill();
        ctx.fillRect(-36, -8, 72, 7);
        ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.strokeStyle = "#fff";
        ctx.beginPath(); ctx.moveTo(4, -14); ctx.lineTo(24, -38); ctx.moveTo(13, -12); ctx.lineTo(34, -32); ctx.stroke();
      } else {
        var sg = p.id === "left" ? -1 : 1;
        ctx.beginPath(); ctx.moveTo(sg * 24, 0); ctx.lineTo(-sg * 14, -24); ctx.lineTo(-sg * 14, 24); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
  }

  /* 3Dが使えないときの平らな絵（横から見た形だけ） */
  function drawFlat(o) {
    var s = 220, gx = W / 2 - 40, gy = H * 0.7;
    ctx.fillStyle = "#1c2544"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#3a3e4b"; ctx.fillRect(0, gy, W, H - gy);
    var ax = gx, ay = gy - 0.3 * s;
    ctx.strokeStyle = "#1d1f24"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(ax, ay, 0.3 * s - 5, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(o.th);
    ctx.fillStyle = "#3a6fb8"; ctx.fillRect(-0.15 * s, -1.05 * s, 0.3 * s, 0.45 * s);
    ctx.fillStyle = "#f1c7a1"; ctx.beginPath(); ctx.arc(0.03 * s, -1.2 * s, 0.14 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#d8412f"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -0.58 * s); ctx.stroke();
    if (o.phase !== "fall") {
      ctx.fillStyle = "#6e3f27"; ctx.fillRect(0.2 * s, -0.75 * s, 0.3 * s, 0.1 * s);
      ctx.fillStyle = "#d8783a"; ctx.fillRect(0.22 * s, -0.75 * s, 0.26 * s * (1 - o.eaten / o.N), 0.03 * s);
    }
    ctx.restore();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, W: W, H: H, phase: phase, th: th, w: w, x: x, v: v,
               eaten: eaten, N: N, T: T, dir: dir, biting: biting, burn: burn, hot: hot };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { animT += 1 / 60; update(1 / 60); draw(1 / 60); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      /* 傾きを見て左右を押し、落ち着いていて熱くないときに食べる。人の反応ぶん少し遅れて見る */
      var seen = [], now = 0;
      function send(type, key) { window.dispatchEvent(new KeyboardEvent(type, { key: key, bubbles: true })); }
      var t0 = Date.now();
      while (state !== S.RESULT && Date.now() - t0 < 60000) {
        seen.push(th + 0.35 * w);
        var sv = seen[Math.max(0, seen.length - 3)];
        var want = state === S.PLAY && phase === "ride" ? (sv > 0.03 ? -1 : sv < -0.03 ? 1 : 0) : 0;
        if (want !== now) {
          if (now) send("keyup", now < 0 ? "ArrowLeft" : "ArrowRight");
          if (want) send("keydown", want < 0 ? "ArrowLeft" : "ArrowRight");
          now = want;
        }
        if (phase === "ride" && !biting && Math.abs(th) < 0.1 && burn < 0.4) { send("keydown", " "); send("keyup", " "); }
        await r.wait(40);
      }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer=null;
  document.addEventListener('pointerdown',function(e){
    if(!(state===S.INTRO))return;
    if(e.isPrimary===false||e.button>0)return;
    startingPointer=e.pointerId;
    e.stopImmediatePropagation();
  },true);
  document.addEventListener('pointerup',function(e){
    if(!(state===S.INTRO)||startingPointer!==e.pointerId)return;
    startingPointer=null;e.preventDefault();e.stopImmediatePropagation();startButton.click();
  },true);
  document.addEventListener('pointercancel',function(){startingPointer=null;},true);

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now(), animT = 0;
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    animT += dt;
    if (!window.__recordManual) { update(dt); draw(dt); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
