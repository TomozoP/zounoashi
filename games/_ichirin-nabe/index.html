<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>一輪車で鍋</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../share.js"></script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 一輪車で鍋

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if (view3d) view3d.resize(canvas.width, canvas.height, W, H);
  }

  /* 3Dの絵。使えない環境（テストの台など）では平らな絵で代わりに描く */
  var view3d = null;
  if (window.WebGLRenderingContext && window.THREE && window.NabeScene) {
    try { view3d = new window.NabeScene(); } catch (e) { view3d = null; }
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  /* 釣り合いの決まりごと。th は体の傾き（ラジアン、前のめりが＋）、w はその速さ。
     押している間は前へ漕いで体が後ろへ起き、離すと後ろへ漕いで前へ倒れる。
     鍋が重いぶん前へ引っぱられ、食べるほど軽くなる。
     数字は試算で決めた：放っておくと約1.2秒で倒れ、反応0.2〜0.3秒ならほぼ食べきれる。 */
  var P = {
    K: 1.0,        /* 倒れようとする強さ */
    C: 0.6,        /* 鍋の重みで前へ引かれる強さ（満杯のとき） */
    B: 1.8,        /* 漕いで体を起こす強さ */
    BACK: 0.8,     /* 離したときの後ろ漕ぎ（前漕ぎに対する割合） */
    D: 1.0,        /* ぶれの収まり */
    FALL: 1.1,     /* これより傾いたら倒れる */
    STEADY: 0.3,   /* これより傾きが小さいときだけ食べ進む */
    BITE: 0.9,     /* ひと口の秒数 */
    HOT: 0.5,      /* ひと口が熱い見込み */
    JOLT: 0.9      /* 熱くて体がはねる強さ */
  };
  var N = 16;                                  /* 具の数 = ひと口の数 */
  var th, w, x, v, eaten, biteP, hot, phase, fallT, doneT, clearTime, puffNow, rnd;

  function place() {}

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    th = 0; w = (Math.random() < 0.5 ? -1 : 1) * 0.05;
    x = 0; v = 0;
    eaten = 0; biteP = 0; hot = 0;
    phase = "ride"; fallT = 0; doneT = 0; clearTime = 0; puffNow = false;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    hot = Math.max(0, hot - dt / 1.2);

    if (phase === "ride") {
      T += dt;
      var u = held ? 1 : -P.BACK;
      var load = 0.3 + 0.7 * (1 - eaten / N);
      var acc = P.K * Math.sin(th) + P.C * load - P.B * u * Math.cos(th) - P.D * w;
      w += acc * dt;
      th += w * dt;
      v = Math.max(-1.2, Math.min(2.2, v + (held ? 1.1 : -0.9) * dt));
      x += v * dt;

      if (Math.abs(th) < P.STEADY) {
        var before = biteP;
        biteP += dt / P.BITE;
        if (before < 0.72 && biteP >= 0.72) eat();
        if (biteP >= 1) biteP -= 1;
      }
      if (phase === "ride" && Math.abs(th) > P.FALL) {
        phase = "fall";
        held = false;
        noiseHit(0.5, 380, 0.35, 0.8);
        tone(160, 0.35, 0.18, "triangle", 70);
      }
    } else if (phase === "fall") {
      fallT += dt;
      w += 5 * Math.sin(th) * dt;
      th += w * dt;
      if (Math.abs(th) > 1.5) {
        if (Math.abs(w) > 0.8) noiseHit(0.25, 250, 0.3, 0.8);
        th = (th > 0 ? 1 : -1) * 1.5;
        w = -w * 0.2;
      }
      v *= 1 - Math.min(1, dt * 3);
      x += v * dt;
      if (fallT > 1.4) endRound();
    } else if (phase === "done") {
      doneT += dt;
      th += (0 - th) * Math.min(1, dt * 4);
      w = 0;
      v *= 1 - Math.min(1, dt * 2);
      x += v * dt;
      if (doneT > 1.8) endRound();
    }
  }

  function eat() {
    eaten++;
    noiseHit(0.1, 1600, 0.12, 2);
    tone(420, 0.06, 0.05, "sine", 300, 0.08);
    if (Math.random() < P.HOT) {
      hot = 1;
      puffNow = true;
      w += (Math.random() < 0.5 ? -1 : 1) * P.JOLT * (0.6 + 0.4 * Math.random());
      noiseHit(0.35, 900, 0.18, 0.6);
      tone(980, 0.18, 0.08, "square", 520, 0.02);
    }
    if (eaten >= N) {
      phase = "done";
      clearTime = T;
      tone(660, 0.14, 0.12, "triangle");
      tone(880, 0.14, 0.12, "triangle", null, 0.12);
      tone(1320, 0.3, 0.12, "triangle", null, 0.24);
    }
  }

  function endRound() {
    state = S.RESULT;
    score = phase === "done" ? Math.round(clearTime * 10) / 10 : Math.round(eaten / N * 100);
  }
  function scoreText() {
    return phase === "done" ? score.toFixed(1) + "秒" : score + "%";
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (phase !== "ride") return;
    held = true;
    tone(240, 0.05, 0.04, "triangle", 300);
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    /* ▼UPDATE: 離したときの処理（要らなければ空のまま） */
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    var text = phase === "done" ? "一輪車に乗ったまま鍋を" + scoreText() + "で食べきりました" : "一輪車に乗ったまま鍋を" + scoreText() + "食べました";
    window.zResultActions.x({ text: text + " #一輪車で鍋" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(dt) {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    var look = {
      x: x, th: th, v: v, eaten: eaten, N: N, hot: hot, t: animT,
      phase: state === S.INTRO ? "intro" : phase, fallT: fallT, doneT: doneT,
      bite: { p: state === S.INTRO ? 0 : biteP, idx: eaten }, puff: puffNow
    };
    puffNow = false;
    if (view3d) {
      try { ctx.drawImage(view3d.render(look, dt || 1 / 60), 0, 0, W, H); }
      catch (e) { view3d = null; }
    }
    if (!view3d) drawFlat(look);

    if (state === S.RESULT) drawResult();
  }

  /* 3Dが使えないときの平らな絵（横から見た形だけ） */
  function drawFlat(o) {
    var s = 220, gx = W / 2 - 40, gy = H * 0.7;
    ctx.fillStyle = "#1c2544"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#3a3e4b"; ctx.fillRect(0, gy, W, H - gy);
    var ax = gx, ay = gy - 0.3 * s;
    ctx.strokeStyle = "#1d1f24"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(ax, ay, 0.3 * s - 5, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(o.th);
    ctx.fillStyle = "#3a6fb8"; ctx.fillRect(-0.15 * s, -1.05 * s, 0.3 * s, 0.45 * s);
    ctx.fillStyle = "#f1c7a1"; ctx.beginPath(); ctx.arc(0.03 * s, -1.2 * s, 0.14 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#d8412f"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -0.58 * s); ctx.stroke();
    if (o.phase !== "fall") {
      ctx.fillStyle = "#6e3f27"; ctx.fillRect(0.2 * s, -0.75 * s, 0.3 * s, 0.1 * s);
      ctx.fillStyle = "#d8783a"; ctx.fillRect(0.22 * s, -0.75 * s, 0.26 * s * (1 - o.eaten / o.N), 0.03 * s);
    }
    ctx.restore();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, W: W, H: H, phase: phase, th: th, w: w, x: x,
               eaten: eaten, N: N, T: T, held: held, hot: hot };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { animT += 1 / 60; update(1 / 60); draw(1 / 60); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      /* 傾きを見て押したり離したりする。人の反応ぶん少し遅れて見る */
      var seen = [];
      var t0 = Date.now();
      while (state !== S.RESULT && Date.now() - t0 < 60000) {
        seen.push(th + 0.5 * w);
        var want = state === S.PLAY && phase === "ride" && seen[Math.max(0, seen.length - 5)] > 0;
        if (want !== held) window.dispatchEvent(new KeyboardEvent(want ? "keydown" : "keyup", { key: " ", code: "Space", bubbles: true }));
        await r.wait(40);
      }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer=null;
  document.addEventListener('pointerdown',function(e){
    if(!(state===S.INTRO))return;
    if(e.isPrimary===false||e.button>0)return;
    startingPointer=e.pointerId;
    e.stopImmediatePropagation();
  },true);
  document.addEventListener('pointerup',function(e){
    if(!(state===S.INTRO)||startingPointer!==e.pointerId)return;
    startingPointer=null;e.preventDefault();e.stopImmediatePropagation();startButton.click();
  },true);
  document.addEventListener('pointercancel',function(){startingPointer=null;},true);

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now(), animT = 0;
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    animT += dt;
    if (!window.__recordManual) { update(dt); draw(dt); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
