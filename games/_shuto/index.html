<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>手刀を見逃さないゲーム</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
</div></div>
<script src="../share.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 手刀を見逃さないゲーム

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  var people=[], attacker=-1, victim=-1, attackAt=0, elapsed=-1, outcome='', selected=0;
  var clothes=['#c76c50','#5d8790','#d5b76b','#697761','#6f7096','#b88188','#ded3b4'];
  var crowdHeight=960;
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    if(people)people.forEach(function(p){p.y=p.y/crowdHeight*H;});crowdHeight=H;
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound() {
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    attackAt=2.5+Math.random()*4; elapsed=-1; outcome=''; attacker=-1; victim=-1; selected=0;
    people=[];
    for(var i=0;i<42;i++){
      var p=makePerson(i),tries=0;
      do{p.x=15+Math.random()*510;p.y=40+Math.random()*(H-55);tries++;}
      while(tries<1000&&people.some(function(q){return Math.hypot(p.x-q.x,p.y-q.y)<66;}));
      people.push(p);
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;

    walkCrowd(dt);
    if(elapsed<0 && T>=attackAt){
      var pairs=[];
      people.forEach(function(p){
        if(p.x<155||p.x>W-155||p.y<190||p.y>H-140)return;
        people.forEach(function(q){
          var distance=Math.hypot(p.x-q.x,p.y-q.y);
          if(p.id!==q.id&&distance>=63&&distance<88&&Math.abs(p.y-q.y)<28)pairs.push([p.id,q.id]);
        });
      });
      if(pairs.length){
        var pair=pairs[Math.floor(Math.random()*pairs.length)];attacker=pair[0];victim=pair[1];
        elapsed=0;noiseHit(.075,900,.09);
      }
    }else if(elapsed>=0){
      elapsed+=dt;
      if(elapsed>=3-1e-9){elapsed=3;outcome='miss';state=S.RESULT;}
    }
  }

  // 行き先は画面外。退場してから、別の入口の外側へ戻す。
  function makePerson(id){
    var angle=Math.random()*Math.PI*2,speed=19+Math.random()*16;
    return {id:id,x:0,y:0,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,speed:speed,
      phase:Math.random()*6.28,color:clothes[Math.floor(Math.random()*clothes.length)],
      hair:Math.floor(Math.random()*3),skin:['#dbb395','#bf9276','#e5c6a8'][Math.floor(Math.random()*3)],
      trousers:['#384248','#575650','#4b505c'][Math.floor(Math.random()*3)],generation:0};
  }
  function enter(p){
    p.generation++;
    var targetX=80+Math.random()*380,targetY=140+Math.random()*(H-260),attempt=0;
    do{
      var edge=Math.floor(Math.random()*4);
      p.x=edge===0?-100:edge===1?W+100:Math.random()*W;
      p.y=edge===2?-110:edge===3?H+160:Math.random()*H;
      attempt++;
    }while(attempt<200&&people.some(function(q){return p!==q&&Math.hypot(p.x-q.x,p.y-q.y)<66;}));
    var dx=targetX-p.x,dy=targetY-p.y,d=Math.hypot(dx,dy);
    p.vx=dx/d*p.speed;p.vy=dy/d*p.speed;
  }
  function walkCrowd(dt){
    people.forEach(function(p){
      if(p.id===victim)return;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x< -120||p.x>W+120||p.y< -140||p.y>H+190)enter(p);
    });
    // 近づいた人同士が少しずつ道を譲り、押し分けられる間隔を残す。
    for(var pass=0;pass<5;pass++)for(var i=0;i<people.length;i++)for(var j=i+1;j<people.length;j++){
      var p=people[i],q=people[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
      if(d>=64)continue;
      if(d<.001){dx=1;dy=0;d=1;}
      var shift=(64-d)/2,px=dx/d*shift,py=dy/d*shift;
      if(p.id!==victim){p.x+=px*(q.id===victim?2:1);p.y+=py*(q.id===victim?2:1);}
      if(q.id!==victim){q.x-=px*(p.id===victim?2:1);q.y-=py*(p.id===victim?2:1);}
    }
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "share") doShare();
      else if (hit === "retry") newRound();
      return;
    }
    held = true;
    if(elapsed<0)return;
    var id=-1;
    if(x==null)id=selected;
    else{
      var nearest=Infinity;
      people.forEach(function(p){if(p.id===victim)return;var q=position(p),distance=Math.hypot(x-q.x,y-(q.y-44));
        if(Math.abs(x-q.x)<=31&&Math.abs(y-(q.y-44))<=43&&distance<nearest){nearest=distance;id=p.id;}});
    }
    if(id<0||id===victim)return;
    score=id===attacker?1:0;outcome=score?'caught':'wrong';state=S.RESULT;
    tone(score?880:160,.18,.09,'sine');
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    /* ▼UPDATE: 離したときの処理（要らなければ空のまま） */
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    if(e.isPrimary===false||e.button>0)return;
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var vertical=e.key==='ArrowUp'?-6:e.key==='ArrowDown'?6:0;
    if(vertical){e.preventDefault();keyMode=true;if(state===S.PLAY)selected=(selected+vertical+42)%42;return;}
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      selected=(selected+(left?-1:1)+42)%42;
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    zShare({ text: score + "点でした #手刀を見逃さないゲーム" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function position(p){return {x:p.x,y:p.y};}
  function line(x,y,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
  function drawTown(){
    ctx.fillStyle='#b6b4a9';ctx.fillRect(0,0,W,H);
    for(var y=0;y<H;y+=60){
      line(0,y,W,y,'#a6a59b',1);
      for(var x=-60+(Math.floor(y/60)%2)*60;x<W;x+=120){
        line(x,y,x,y+60,'#a6a59b',1);
        ctx.fillStyle='rgba(255,255,240,.07)';ctx.fillRect(x+2,y+2,116,2);
      }
    }
  }
  function drawPerson(p){
    var q=position(p),fallen=p.id===victim&&elapsed>=0;
    if(q.x< -95||q.x>W+95||q.y< -10||q.y>H+105)return;
    var walk=Math.sin(T*p.speed*.25+p.phase),side=p.vx<0?-1:1;
    ctx.save();ctx.translate(q.x,q.y);
    ctx.fillStyle='rgba(41,43,39,.17)';ctx.beginPath();ctx.ellipse(9,1,18,5,-.2,0,Math.PI*2);ctx.fill();
    if(fallen){ctx.translate(0,-5);ctx.rotate(Math.min(1,elapsed/.22)*Math.PI/2);walk=0;}
    // 頭は全身の約七分の一。膝・肘を曲げながら歩く。
    var bob=fallen?0:Math.abs(walk)*1.2;
    ctx.translate(0,-bob);
    line(-5,-39,-6+walk*4,-21,p.trousers,7);
    line(-6+walk*4,-21,-6+walk*8,-3,p.trousers,6);
    line(5,-39,6-walk*4,-21,p.trousers,7);
    line(6-walk*4,-21,6-walk*8,-3,p.trousers,6);
    line(-6+walk*8,-2,-6+walk*8+side*5,-1,'#303533',4);
    line(6-walk*8,-2,6-walk*8+side*5,-1,'#303533',4);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(-10,-69);ctx.lineTo(10,-69);ctx.lineTo(8,-40);ctx.lineTo(-8,-40);ctx.closePath();ctx.fill();
    line(-10,-65,-13-walk*4,-51,p.color,6);line(-13-walk*4,-51,-12-walk*7,-38,p.skin,4);
    if(p.id===attacker&&elapsed>=0&&elapsed<.1){
      var other=position(people[victim]),dx=other.x-q.x,dy=other.y-q.y;
      line(dx<0?-9:9,-64,dx*.48,dy*.5-65,p.color,6);
      line(dx*.48,dy*.5-65,dx,dy-72,p.skin,4);
      line(dx*.35,-74,dx*.8,dy-78,'#f5eed4',1.5);
    }else{line(10,-65,13+walk*4,-51,p.color,6);line(13+walk*4,-51,12+walk*7,-38,p.skin,4);}
    line(0,-71,0,-75,p.skin,5);
    ctx.fillStyle=p.skin;ctx.beginPath();ctx.ellipse(0,-81,5.8,7.3,side*.08,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=['#333a36','#665347','#999082'][p.hair];ctx.beginPath();ctx.ellipse(-side,-84,6,4.8,0,Math.PI,Math.PI*2);ctx.fill();
    if(p.vy< -8){ctx.fillRect(-5,-85,9,9);}else{ctx.fillStyle='#49473f';ctx.fillRect(side*3,-81,1.2,1.2);}
    ctx.restore();
    if(keyMode&&selected===p.id&&state===S.PLAY){ctx.strokeStyle='#fff6d3';ctx.lineWidth=2;roundRect(q.x-28,q.y-94,56,100,12);ctx.stroke();}
    if(state===S.RESULT&&p.id===attacker){ctx.strokeStyle='#f7cc71';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(q.x,q.y-44,32,50,0,0,Math.PI*2);ctx.stroke();}
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    drawTown();
    people.slice().sort(function(a,b){return a.y-b.y;}).forEach(drawPerson);
    if(elapsed>=0&&state===S.PLAY){
      ctx.fillStyle='#283e43';ctx.fillRect(38,36,464,5);
      ctx.fillStyle='#f7cc71';ctx.fillRect(38,36,464*(1-elapsed/3),5);
    }

    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,24,28,.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.font=outcome==='miss'?'800 48px sans-serif':'800 108px sans-serif';
    ctx.fillText(outcome==='miss'?'見逃した':score?'○':'×', W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, T:T, elapsed:elapsed, attackAt:attackAt, attacker:attacker, victim:victim, outcome:outcome, selected:selected, people:people.map(function(p){var q=position(p);return {id:p.id,x:q.x,y:q.y-44,footY:q.y,vx:p.vx,vy:p.vy,generation:p.generation};}) }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer=null;
  document.addEventListener('pointerdown',function(e){
    if(!(state===S.INTRO))return;
    if(e.isPrimary===false||e.button>0)return;
    startingPointer=e.pointerId;
    e.stopImmediatePropagation();
  },true);
  document.addEventListener('pointerup',function(e){
    if(!(state===S.INTRO)||startingPointer!==e.pointerId)return;
    startingPointer=null;e.preventDefault();e.stopImmediatePropagation();startButton.click();
  },true);
  document.addEventListener('pointercancel',function(){startingPointer=null;},true);

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){if(e.stopPropagation)e.stopPropagation();audioOn();resumeAudio();newRound();});
  layout();
  newRound();state=S.INTRO;startButton.hidden=false;
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { if(!document.hidden)update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
