<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>指タップダンス</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #8a5a33; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 指タップダンス

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, keyMode = false;

  /* 曲と譜面。BPM120、1拍0.5秒、1小節4拍 */
  var BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;
  var LEAD = 1.0;                              /* 足跡が見えてから踏むまでの秒数 */
  var BARS = 20;                               /* 曲の長さ（小節） */
  var SONG_END = BARS * BAR + 1.5;
  var notes = null, hits, scuffs, sparks, combo, maxCombo, autoPlay = false;
  var songT0 = 0, schedUntil = 0;              /* 音の予約 */
  var perfectN, goodN, missN;

  var MX = 90, MY0 = 150, MY1 = 820;                 /* 足跡を置く範囲 */
  function place() {
    MY1 = H - 140;
    if (notes) notes.forEach(function (n) {
      var fp = footPos(n.t, n.foot, n.toe ? 26 : 0);
      n.x = fp.x; n.y = fp.y; n.a = fp.a;
    });
  }

  /* 足の位置。踊り手の中心がゆっくり床を歩き回り、左右の足がその両脇に来る */
  function center(t) {
    var cx = W / 2 + Math.sin(t * 0.45) * (W / 2 - MX - 60) * 0.9;
    var cy = (MY0 + MY1) / 2 + Math.sin(t * 0.31 + 1.2) * ((MY1 - MY0) / 2 - 70) * 0.9;
    return { x: cx, y: cy };
  }
  function footPos(t, foot, lift) {
    var c = center(t);
    var a = Math.sin(t * 0.45 + 0.7) * 0.5;    /* 体の向きを少し回す */
    var side = foot === "L" ? -1 : 1;
    var ox = side * 72, oy = (lift || 0);
    return { x: c.x + ox * Math.cos(a) - oy * Math.sin(a), y: c.y + ox * Math.sin(a) + oy * Math.cos(a), a: a + Math.PI };  /* つま先は手前（撮る側）へ */
  }

  /* 小節ごとの踏み方（1小節を8分割した位置。sは16分の半分ずらし） */
  function barPattern(b) {
    if (b < 2) return [];                                  /* 前奏 */
    if (b < 6) return [[0, "L"], [2, "R"], [4, "L"], [6, "R"]];
    if (b < 9) return [[0, "L"], [2, "R"], [3, "L"], [4, "R"], [6, "L"], [7, "R"]];
    if (b === 9) return [[0, "LR"], [4, "LR"]];
    if (b < 13) return [[0, "L"], [1, "R"], [2, "L"], [4, "R"], [5, "L"], [6, "R"]];
    if (b < 16) return [[0, "L"], [1, "R"], [2, "L"], [2.5, "R"], [3, "L"], [4, "R"], [6, "L"], [6.5, "R"], [7, "L"]];
    if (b < 19) return [[0, "L"], [0.5, "R"], [1, "L"], [2, "R"], [2.5, "L"], [3, "R"], [4, "LR"], [5, "L"], [5.5, "R"], [6, "L"], [6.5, "R"], [7, "L"]];
    return [[0, "LR"]];                                    /* 決め */
  }
  function makeNotes() {
    var out = [];
    for (var b = 0; b < BARS; b++) {
      barPattern(b).forEach(function (p) {
        var t = b * BAR + p[0] * BEAT / 2;
        var lift = (p[0] % 2) ? 26 : 0;                    /* 裏拍はつま先側（手前） */
        p[1].split("").forEach(function (f) {
          var fp = footPos(t, f, lift);
          out.push({ t: t, foot: f, x: fp.x, y: fp.y, a: fp.a, hit: 0, done: false, toe: !!(p[0] % 2) });
        });
      });
    }
    return out;
  }

  function songTime() {
    if (AC && songT0) return AC.currentTime - songT0;
    return T;
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; T = 0;
    combo = 0; maxCombo = 0; perfectN = goodN = missN = 0;
    notes = makeNotes();
    scuffs = []; sparks = []; hits = []; resetShoes();
    songT0 = AC ? AC.currentTime + 0.1 : 0;
    T = -0.1;
    schedUntil = 0;
  }
  function maxScore() { return notes.length * 100; }

  /* ============ 曲 ============ ベースとスナップとハイハットのスウィング */
  var BASS = [43.65, 55, 65.41, 73.42, 49, 61.74, 73.42, 82.41]; /* F A C D / G B D E */
  var ROOT = [[87.31, 110, 130.81], [98, 123.47, 146.83], [87.31, 110, 130.81], [65.41, 82.41, 98]]; /* F G F C */
  function at(t) { return songT0 + t; }
  function toneAt(t, freq, dur, vol, type) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain(), n = at(t);
    if (n < AC.currentTime) return;
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, n + Math.min(0.12, dur * 0.4));
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(bus());
    o.start(n); o.stop(n + dur + 0.05);
  }
  /* ピアノ風: 基音と2倍音、すぐ減衰 */
  function keyAt(t, freq, dur, vol) {
    toneAt(t, freq, dur, vol, "triangle");
    toneAt(t, freq * 2.001, dur * 0.6, vol * 0.35, "sine");
    toneAt(t, freq * 3.002, dur * 0.3, vol * 0.12, "sine");
  }
  function noiseAt(t, dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var n = at(t);
    if (n < AC.currentTime) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(bus());
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  var SW = BEAT * 2 / 3;                       /* スウィングの裏 */
  function scheduleBeat(i) {
    var t = i * BEAT, bar = Math.floor(i / 4), k = i % 4;
    if (bar >= BARS) {
      if (i === BARS * 4) { /* 最後のジャーン */
        ROOT[0].forEach(function (f) { keyAt(t, f * 2, 2.2, 0.08); });
        toneAt(t, 43.65, 1.6, 0.25, "sine");
        noiseAt(t, 1.2, 6000, 0.12, 0.6);
      }
      return;
    }
    var ch = Math.floor(bar / 2) % 4;
    /* ハイハット: 毎拍 + スウィングの裏 */
    noiseAt(t, 0.09, 9000, 0.035, 1.2);                       /* ライドシンバル風 */
    if (bar >= 2) noiseAt(t + SW, 0.05, 9000, 0.022, 1.2);
    /* 2拍目と4拍目にスナップ */
    if (k === 1 || k === 3) { noiseAt(t, 0.06, 2200, 0.13, 3); noiseAt(t, 0.18, 4500, 0.04, 0.7); }  /* スナップとブラシ */
    /* ウォーキングベース */
    var bs = ch === 1 ? BASS.slice(4) : BASS.slice(0, 4);
    if (ch === 3) bs = [65.41, 49, 58.27, 61.74];
    toneAt(t, bs[k] * 2, BEAT * 0.85, 0.32, "sine");          /* ウッドベース風 */
    toneAt(t, bs[k] * 4, 0.08, 0.06, "triangle");
    /* 和音（2拍目と4拍目の裏で短く） */
    if (bar >= 2 && (k === 1 || k === 3)) {
      ROOT[ch].forEach(function (f) { keyAt(t + SW, f * 2, 0.35, 0.05); });
    }
  }

  /* タップシューズの音。かかとは低め、つま先は高め */
  /* 舞台の響き。短い残響を少しだけ混ぜる（靴の音と伴奏に） */
  var BUS = null, ROOM = null;
  function bus() {
    if (!AC) return null;
    if (BUS) return BUS;
    BUS = AC.createGain(); BUS.gain.value = 1;
    BUS.connect(AC.destination);
    try {
      var len = Math.floor(AC.sampleRate * 0.9), ir = AC.createBuffer(2, len, AC.sampleRate);
      for (var c = 0; c < 2; c++) {
        var d = ir.getChannelData(c);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
      }
      var cv = AC.createConvolver(); cv.buffer = ir;
      var wet = AC.createGain(); wet.gain.value = 0.22;
      BUS.connect(cv); cv.connect(wet); wet.connect(AC.destination);
      ROOM = cv;
    } catch (e) {}
    return BUS;
  }

  /* タップシューズの音。金具が板を叩く「カッ」：
     ごく短いアタック＋金属の鳴り（倍音がずれた数本のサイン）＋板の胴鳴り。
     かかとは低く重く、つま先は高く軽い。1回ごとに少しずつ揺らす */
  function tapSound(good, toe) {
    if (!AC || !NOISE) return;
    var out = bus(), n = AC.currentTime + 0.002;
    var v = (good ? 1 : 0.7) * (0.85 + Math.random() * 0.3);
    var j = 1 + (Math.random() - 0.5) * 0.06;
    /* アタック */
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = toe ? 3500 : 2500;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.9 * v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.012);
    s.connect(hp); hp.connect(g); g.connect(out);
    s.start(n, Math.random()); s.stop(n + 0.03);
    /* 金具の鳴り */
    var base = (toe ? 2650 : 1980) * j;
    [[1, 0.16, 0.07], [1.47, 0.11, 0.05], [2.09, 0.08, 0.035], [2.76, 0.06, 0.025], [3.51, 0.04, 0.018]].forEach(function (p) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.frequency.value = base * p[0];
      og.gain.setValueAtTime(p[1] * v, n);
      og.gain.exponentialRampToValueAtTime(0.0001, n + p[2] * (toe ? 0.9 : 1.2));
      o.connect(og); og.connect(out); o.start(n); o.stop(n + 0.12);
    });
    /* 板の胴鳴り（かかとは強め） */
    var w = AC.createOscillator(), wg = AC.createGain();
    w.frequency.setValueAtTime((toe ? 260 : 190) * j, n);
    w.frequency.exponentialRampToValueAtTime((toe ? 170 : 110) * j, n + 0.06);
    wg.gain.setValueAtTime((toe ? 0.18 : 0.35) * v, n);
    wg.gain.exponentialRampToValueAtTime(0.0001, n + (toe ? 0.05 : 0.08));
    w.connect(wg); wg.connect(out); w.start(n); w.stop(n + 0.1);
    var s2 = AC.createBufferSource(); s2.buffer = NOISE;
    var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = toe ? 1100 : 750; bp.Q.value = 2.5;
    var g2 = AC.createGain();
    g2.gain.setValueAtTime(0.35 * v, n); g2.gain.exponentialRampToValueAtTime(0.0001, n + 0.045);
    s2.connect(bp); bp.connect(g2); g2.connect(out);
    s2.start(n, Math.random()); s2.stop(n + 0.06);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.9; s.vy *= 0.9; s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    for (i = hits.length - 1; i >= 0; i--) { hits[i].life -= dt; if (hits[i].life <= 0) hits.splice(i, 1); }
    if (state !== S.PLAY) return;
    var st = songTime();
    /* 音を少し先まで予約 */
    if (AC) {
      while (schedUntil * BEAT < st + 0.3) { scheduleBeat(schedUntil); schedUntil++; }
    }
    notes.forEach(function (n) {
      if (n.done) return;
      if (autoPlay && st >= n.t) judge(n, 0, n.x, n.y);
      else if (st > n.t + 0.16) { n.done = true; n.miss = true; missN++; combo = 0; }
    });
    if (st > SONG_END) finish();
  }
  function finish() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  function judge(n, err, x, y) {
    n.done = true;
    var a = Math.abs(err), pts, good;
    if (a < 0.06) { pts = 100; perfectN++; good = 2; }
    else { pts = 50; goodN++; good = 1; }
    combo++; if (combo > maxCombo) maxCombo = combo;
    score += pts;
    n.hit = good;
    hits.push({ x: n.x, y: n.y, a: n.a, foot: n.foot, life: 0.35, good: good });
    tapSound(true, n.toe);
    var k = good === 2 ? 10 : 5;
    for (var i = 0; i < k; i++) {
      var r = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
      sparks.push({ x: x, y: y, vx: Math.cos(r) * v, vy: Math.sin(r) * v, life: 0.25 + Math.random() * 0.2, gold: good === 2 });
    }
    addScuff(n.x, n.y, n.a);
    stomp(n.foot === "R" ? "R" : "L", n.x, n.y, n.a);
  }
  function addScuff(x, y, a) {
    scuffs.push({ x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10, a: a + (Math.random() - 0.5) * 0.6, l: 10 + Math.random() * 16 });
    if (scuffs.length > 260) scuffs.shift();
  }

  /* ============ 入力 ============
     指を足にして踏む。何本の指でも同時に踏める。キーは一番近い足跡を踏む */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    var st = songTime(), best = null, bd = 1e9;
    notes.forEach(function (n) {
      if (n.done) return;
      var e = st - n.t;
      if (e < -0.16 || e > 0.16) return;
      var d = x == null ? 0 : Math.hypot(n.x - x, n.y - y);
      if (d > 85) return;
      var cost = Math.abs(e) * 600 + d;
      if (cost < bd) { bd = cost; best = n; }
    });
    if (best) { judge(best, st - best.t, x == null ? best.x : x, y == null ? best.y : y); return; }
    /* 外れても床は鳴る */
    tapSound(false, Math.random() < 0.5);
    if (x != null) {
      addScuff(x, y, Math.random() * 3);
      hits.push({ x: x, y: y, a: 0, foot: "", life: 0.2, good: 0 });
      var f = Math.hypot(shoes.L.x - x, shoes.L.y - y) < Math.hypot(shoes.R.x - x, shoes.R.y - y) ? "L" : "R";
      stomp(f, x, y, shoes[f].a);
    }
  }
  function move() {}
  function up() {}

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); });
  wrap.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function jumpTo(t) {
    if (AC) songT0 = AC.currentTime - t; else T = t;
    schedUntil = Math.ceil(t / BEAT);
    notes.forEach(function (n) { if (n.t < t) n.done = true; });
  }
  function debugKey(n) {
    if (n === 1 && state === S.PLAY) jumpTo(13 * BAR - 0.5);       /* 後半へ */
    if (n === 2 && state === S.PLAY) jumpTo(SONG_END - 0.2);        /* 結果へ */
    if (n === 3) autoPlay = !autoPlay;                               /* 自動で全部踏む */
    if (n === 4) solid = !solid;                                     /* 立つ靴 ⇔ 平らな靴 */
    if (n === 5) { EYE_H = Math.max(400, EYE_H - 200); }             /* 撮る角度を低く */
    if (n === 6) { EYE_H = Math.min(4000, EYE_H + 200); }            /* 撮る角度を高く */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function rate() { return notes && notes.length ? score / maxScore() : 0; }
  function doShare() {
    var r = rate(), ja, en;
    if (r < 0.3) { ja = "スマホの床をただ叩いていた"; en = "I just knocked on my phone floor"; }
    else if (r < 0.6) { ja = "指2本でなんとか踊りきった"; en = "I barely danced it through with two fingers"; }
    else if (r < 0.85) { ja = "指先だけで拍手をもらった"; en = "My fingertips got a round of applause"; }
    else if (r < 1) { ja = "指2本でブロードウェイに立った"; en = "Two fingers made it to Broadway"; }
    else { ja = "指がタップダンスの神になった"; en = "My fingers became the god of tap dance"; }
    window.zResultActions.x({ text: zT(ja + "（" + score + "点）", en + " (" + score + " pts)") + zT(" #指タップダンス", " #FingerTapDance") });
  }

  /* ============ 立って見える靴 ============
     スマホを机に置き、画面の下の辺の側から斜めに撮ると、靴が床から立って見えるように、
     その目の位置から床へ投げた影の形で描く（だまし絵）。真上から見ると前へ引き伸びて見える。
     目の位置は画面の下の辺から EYE_D 手前・EYE_H 上（どちらもゲーム座標。横540≒スマホの幅） */
  var EYE_D = 1500, EYE_H = 1300, solid = true;
  var SC = 1.35;                               /* 靴の大きさ */
  var shoes;
  function resetShoes() {
    var l = footPos(0, "L", 0), r = footPos(0, "R", 0);
    shoes = { L: { x: l.x, y: l.y, a: l.a, t: -9 }, R: { x: r.x, y: r.y, a: r.a, t: -9 } };
  }
  function stomp(foot, x, y, a) {
    var s = shoes[foot];
    s.x = x; s.y = y; s.a = a; s.t = T;
  }
  /* 床の上の点(x, y)と高さzを、画面の点へ */
  function proj(x, y, z) {
    var ex = W / 2, ey = H + EYE_D, k = EYE_H / (EYE_H - z);
    return [ex + (x - ex) * k, ey + (y - ey) * k];
  }
  /* 靴底の輪郭。上がつま先（-y）。左右の足で内側をふくらませる */
  var SOLE = (function () {
    var pts = [], n = 28;
    for (var i = 0; i < n; i++) {
      var u = i / n * Math.PI * 2;
      var y = -Math.cos(u) * 64;                       /* -64(つま先)〜64(かかと) */
      var t = (y + 64) / 128;
      var hw = 24 * Math.sqrt(Math.max(0, Math.sin(u) * Math.sin(u)));
      hw *= t < 0.45 ? 1 : 1 - (t - 0.45) * 0.55;      /* かかとは細め */
      pts.push([Math.sin(u) >= 0 ? hw : -hw, y, Math.sin(u) >= 0 ? 1 : -1]);
    }
    return pts;
  })();
  var SHOE_TOP = 46;
  /* 高さzでの靴の輪切り。つま先は低く、足首の所が一番高い */
  function sliceAt(z, foot) {
    var front;
    if (z <= 9) front = -64;
    else if (z <= 26) front = -64 + (z - 9) * 1.4;
    else front = -40 + (z - 26) * 2.6;
    var back = z < 30 ? 64 : 64 - (z - 30) * 0.35;
    var shrink = z <= 9 ? 1 : 0.93 - (z - 9) * 0.004;
    var m = foot === "L" ? 1 : -1;
    var out = [], n = 16, mid = (front + back) / 2, half = (back - front) / 2;
    function hw(y) { var t = (y + 64) / 128; return 24 * (t < 0.45 ? 1 : 1 - (t - 0.45) * 0.55) * shrink; }
    function cap(y) { var q = Math.abs((y - mid) / half); return Math.pow(Math.max(0, 1 - Math.pow(q, 3)), 1 / 3); }
    for (var i = 0; i <= n; i++) { var y = front + (back - front) * i / n; out.push([hw(y) * cap(y) + m * 2, y]); }
    for (i = n; i >= 0; i--) { y = front + (back - front) * i / n; out.push([-hw(y) * cap(y) + m * 2, y]); }
    return out;
  }
  function drawSolidShoe(s, foot) {
    var since = T - s.t, lift = since < 0.09 ? (1 - since / 0.09) * 26 : 0;
    var ca = Math.cos(s.a), sa = Math.sin(s.a);
    function world(px, py, z) { px *= SC; py *= SC; return proj(s.x + px * ca - py * sa, s.y + px * sa + py * ca, z * SC + lift); }
    /* 床の影 */
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.scale(SC, SC);
    ctx.fillStyle = "rgba(0,0,0," + (0.35 - lift * 0.006) + ")";
    ctx.beginPath(); ctx.ellipse(0, 4, 30, 70, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    for (var z = 0; z <= SHOE_TOP; z += 1) {
      var sl = sliceAt(z, foot);
      ctx.beginPath();
      sl.forEach(function (p, i) { var q = world(p[0], p[1], z); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
      ctx.closePath();
      var c;
      if (z <= 3) c = "#b9bcc2";                         /* 金具 */
      else if (z <= 8) c = "#2a1d14";                    /* 靴底 */
      else { var l = 6 + (z / SHOE_TOP) * 16; c = "hsl(220,8%," + l + "%)"; }
      ctx.fillStyle = c; ctx.fill();
    }
    /* てっぺん：つやと履き口 */
    var top = sliceAt(SHOE_TOP, foot);
    ctx.beginPath();
    top.forEach(function (p, i) { var q = world(p[0], p[1], SHOE_TOP); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); ctx.fillStyle = "#3d4048"; ctx.fill();
    ctx.beginPath();
    for (var i = 0; i < 20; i++) {
      var u = i / 20 * Math.PI * 2, q = world(Math.cos(u) * 15, 34 + Math.sin(u) * 19, SHOE_TOP);
      if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
    }
    ctx.closePath(); ctx.fillStyle = "#0b0b0d"; ctx.fill();
    /* つま先の光 */
    ctx.beginPath();
    for (i = 0; i < 14; i++) {
      u = i / 14 * Math.PI * 2; q = world(Math.cos(u) * 7, -30 + Math.sin(u) * 11, 27);
      if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
    }
    ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
  }
  function drawShoes() {
    var arr = [["L", shoes.L], ["R", shoes.R]].sort(function (a, b) { return a[1].y - b[1].y; });
    arr.forEach(function (e) { drawSolidShoe(e[1], e[0]); });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 板張りの床。板の並びは乱数を固定して毎回同じ */
  var floorCache = null, floorH = 0;
  function makeFloor() {
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var g = c.getContext("2d");
    if (!g) return null;
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var pw = 60;
    for (var x = 0; x < W; x += pw) {
      var y = -rnd() * 300;
      while (y < H) {
        var len = 220 + rnd() * 260;
        var l = 38 + rnd() * 10;
        g.fillStyle = "hsl(" + (26 + rnd() * 8) + ",52%," + l + "%)";
        g.fillRect(x, y, pw, len);
        g.strokeStyle = "rgba(60,30,10,.18)"; g.lineWidth = 1.2;
        for (var k = 0; k < 5; k++) {
          var gx = x + 6 + rnd() * (pw - 12);
          g.beginPath(); g.moveTo(gx, y);
          g.bezierCurveTo(gx + (rnd() - 0.5) * 14, y + len * 0.33, gx + (rnd() - 0.5) * 14, y + len * 0.66, gx + (rnd() - 0.5) * 8, y + len);
          g.stroke();
        }
        g.fillStyle = "rgba(40,18,5,.55)";
        g.fillRect(x, y + len - 1.5, pw, 3);
        y += len;
      }
      g.fillStyle = "rgba(40,18,5,.6)";
      g.fillRect(x + pw - 1.5, 0, 3, H);
    }
    /* スポットライト（固定。明滅はしない） */
    var rg = g.createRadialGradient(W / 2, H * 0.48, 40, W / 2, H * 0.48, Math.max(W, H) * 0.7);
    rg.addColorStop(0, "rgba(255,235,190,.18)");
    rg.addColorStop(0.5, "rgba(0,0,0,0)");
    rg.addColorStop(1, "rgba(0,0,0,.55)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    return c;
  }

  /* タップシューズの靴底（上から）。原点は足の真ん中、上がつま先 */
  function solePath(foot) {
    var m = foot === "L" ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(0, -62);
    ctx.bezierCurveTo(m * 26, -62, m * 30, -30, m * 24, -6);
    ctx.bezierCurveTo(m * 20, 10, m * 22, 30, m * 20, 48);
    ctx.bezierCurveTo(m * 18, 66, -m * 18, 66, -m * 18, 48);
    ctx.bezierCurveTo(-m * 18, 30, -m * 12, 10, -m * 16, -6);
    ctx.bezierCurveTo(-m * 22, -30, -m * 22, -62, 0, -62);
    ctx.closePath();
  }
  function plates(foot, fill) {
    /* つま先とかかとの金具 */
    var m = foot === "L" ? 1 : -1;
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.ellipse(m * 3, -40, 18, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 46, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawNote(n, st) {
    var e = n.t - st;                     /* 残り秒 */
    if (n.done && !n.hit) return;
    if (e > LEAD) return;
    var p = 1 - Math.max(0, e) / LEAD;    /* 0→1 */
    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.rotate(n.a);
    ctx.scale(SC, SC);
    var col = n.foot === "L" ? "#7fd6ff" : "#ffb36b";
    if (n.hit) {
      ctx.globalAlpha = 0;
    } else {
      ctx.globalAlpha = Math.min(1, p * 2.5);
      /* 足跡 */
      solePath(n.foot);
      ctx.fillStyle = "rgba(20,10,5,.35)"; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = col; ctx.stroke();
      ctx.save(); ctx.globalAlpha *= 0.85;
      if (n.toe) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse((n.foot === "L" ? 3 : -3), -40, 18, 16, 0, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 46, 14, 12, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      /* 縮んでくる輪 */
      var r = 90 + 150 * (1 - p);
      ctx.scale(1 / SC, 1 / SC);
      ctx.rotate(-n.a);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.lineWidth = 4 + 4 * p; ctx.strokeStyle = col; ctx.globalAlpha = Math.min(1, p * 2) * 0.9; ctx.stroke();
    }
    ctx.restore();
  }

  function drawRing(h) {
    var k = h.life / 0.35;
    ctx.beginPath(); ctx.arc(h.x, h.y, 70 + (1 - k) * 50, 0, Math.PI * 2);
    ctx.lineWidth = 6 * k; ctx.strokeStyle = h.good === 2 ? "#ffe27a" : "#ffffff"; ctx.stroke();
  }
  function drawShoe(h) {
    /* 踏んだ瞬間に靴が床に乗る（指＝足） */
    var k = h.life / 0.35;
    ctx.save();
    ctx.translate(h.x, h.y);
    if (h.foot) {
      ctx.rotate(h.a);
      ctx.globalAlpha = Math.min(1, k * 2);
      var s = SC * (1 + (1 - k) * 0.08);
      ctx.scale(s, s);
      solePath(h.foot);
      ctx.fillStyle = "#151515"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#3a3a3a"; ctx.stroke();
      plates(h.foot, "#d9d9d9");
      ctx.scale(1 / s, 1 / s);
      ctx.rotate(-h.a);
      ctx.beginPath(); ctx.arc(0, 0, 70 + (1 - k) * 50, 0, Math.PI * 2);
      ctx.lineWidth = 6 * k; ctx.strokeStyle = h.good === 2 ? "#ffe27a" : "#ffffff"; ctx.stroke();
    } else {
      ctx.globalAlpha = k * 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 14 + (1 - k / 0.57) * 26, 0, Math.PI * 2);
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    if (!floorCache || floorH !== H) { floorCache = makeFloor(); floorH = H; }
    if (floorCache) ctx.drawImage(floorCache, 0, 0);
    else { ctx.fillStyle = "#8a5a33"; ctx.fillRect(0, 0, W, H); }

    /* 床に残った擦り跡 */
    ctx.strokeStyle = "rgba(25,15,10,.35)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    scuffs.forEach(function (s) {
      ctx.beginPath();
      ctx.moveTo(s.x - Math.cos(s.a) * s.l / 2, s.y - Math.sin(s.a) * s.l / 2);
      ctx.lineTo(s.x + Math.cos(s.a) * s.l / 2, s.y + Math.sin(s.a) * s.l / 2);
      ctx.stroke();
    });

    var st = songTime();
    if (state === S.PLAY || state === S.RESULT) {
      /* 遠いものから描き、近いものを上に */
      for (var i = notes.length - 1; i >= 0; i--) {
        var n = notes[i];
        if (n.t - st > LEAD || n.done) continue;
        drawNote(n, st);
      }
    }
    if (solid && shoes) { hits.forEach(function (h) { if (!h.foot) drawShoe(h); else drawRing(h); }); drawShoes(); }
    else hits.forEach(drawShoe);
    sparks.forEach(function (s) {
      ctx.globalAlpha = Math.min(1, s.life * 4);
      ctx.fillStyle = s.gold ? "#ffe27a" : "#ffffff";
      ctx.fillRect(s.x - 2.5, s.y - 2.5, 5, 5);
    });
    ctx.globalAlpha = 1;

    if (state === S.PLAY && !hideUI) {
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 6;
      ctx.font = "800 44px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(score), W / 2, 64);
      ctx.restore();
    }
    if (state === S.RESULT) drawResult();
  }
  var hideUI = false;

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, max: notes ? maxScore() : 0, notes: notes ? notes.length : 0, perfect: perfectN, good: goodN, miss: missN, W: W, H: H, t: songTime() }; },
    notes: function () { return notes; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function (v) { hideUI = v !== false; }
  };
  /* サムネ用: 中盤まで自動で踏み、UIを消す */
  window.__thumbnail = function () {
    startButton.click(); autoPlay = true; hideUI = true;
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 60)) throw Error("終わらない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
