<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>画像迷路</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1b2230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #photo-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #photo-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <button id="photo-button" type="button" aria-label="画像を選ぶ"></button>
  <input id="photo-input" type="file" accept="image/*" hidden>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 画像迷路

   画像の線（明るさが急に変わるところ）を見つけて、そこに壁が来るように迷路を作る。
   迷路は「線の弱いところから順に通路を掘る」最小全域木なので、必ずひと続きで解ける。
   画像は、このサイトのゲームのサムネか、手元の写真。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var photoButton = document.getElementById("photo-button");
  var photoInput = document.getElementById("photo-input");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 画像 ============
     このサイトで公開したゲームのサムネ。手元の写真も選べる。 */
  var IMG = "../";
  var SOURCES = [
    ["karaage", "画像揚げ", "karaage/img/thumb.webp"],
    ["shark-walk", "スーパーカスタムシャークレース", "shark-walk/img/thumb.webp"],
    ["slot", "100連スロット", "slot/img/thumb.webp"],
    ["shuto", "手刀を見逃さないゲーム", "shuto/img/thumb.webp"],
    ["baibai-quiz", "2ⁿ択クイズ", "baibai-quiz/img/thumb.webp"],
    ["ichirin-nabe", "アツアツ一輪車", "ichirin-nabe/img/thumb.webp"],
    ["doji5", "同時ボール", "doji5/img/thumb.webp"],
    ["gyuho", "スワイプで加速する牛", "gyuho/img/thumb.webp"],
    ["skate-limbo", "リンボー・オン・ザ・アイス", "skate-limbo/img/thumb.webp"],
    ["wiki-derby", "情報量ダービー", "wiki-derby/img/thumb.webp"],
    ["nandoku-bingo", "難読ビンゴ", "nandoku-bingo/img/thumb.webp"],
    ["henken", "偏県クイズ", "henken/img/thumb.webp"],
    ["koe-balloon", "ステガマリーズ大行進", "koe-balloon/img/thumb.webp"],
    ["c-ryoku", "C力検査", "c-ryoku/img/thumb.webp"],
    ["hata256", "256色旗揚げ", "hata256/img/thumb.webp"],
    ["shredder", "シュレッダー・エージェント", "shredder/img/thumb.webp"],
    ["walk100", "人生ウォーカー", "walk100/img/thumb.webp"],
    ["kakiya", "描き矢", "kakiya/img/thumb.webp"],
    ["neko-kenka", "キャットファイター", "neko-kenka/img/thumb.webp"],
    ["gachilong", "ガチロング縦列駐車", "gachilong/img/thumb.webp"],
    ["random-bowling", "STRONG BOWL", "random-bowling/img/thumb.webp"],
    ["oushogi", "王だけ将棋", "oushogi/img/thumb.webp"],
    ["wanko", "わんこボマー", "wanko/img/thumb.webp"],
    ["melos", "車で走れメロス", "../img/games/melos.webp"],
    ["macho", "全員マッチョ館の殺人", "../img/games/macho.webp"],
    ["momotarogue", "突撃モモタローグ", "../img/games/momotarogue.webp"],
    ["gyaku-mizukiri", "水切り世界一周", "../img/games/gyaku-mizukiri.webp"]
  ];
  var srcIndex = Math.floor(Math.random() * SOURCES.length);
  var picture = null;        /* 迷路の元の絵（正方形に切ったもの） */
  var loading = 0;

  function loadSource(i, then) {
    srcIndex = (i + SOURCES.length) % SOURCES.length;
    var token = ++loading;
    var im = new Image();
    im.onload = function () { if (token === loading) { setPicture(im); if (then) then(); } };
    im.onerror = function () { if (token === loading) setPicture(null); };
    im.src = IMG + SOURCES[srcIndex][2];
  }
  /* 「もう一度」は別の絵にする。待たずに始められるよう、遊んでいる間に読んでおく */
  var nextPic = null;
  function preloadNext() {
    var idx = (Math.max(0, srcIndex) + 1 + Math.floor(Math.random() * (SOURCES.length - 1))) % SOURCES.length;
    var im = new Image();
    nextPic = null;
    im.onload = function () { nextPic = { idx: idx, im: im }; };
    im.src = IMG + SOURCES[idx][2];
  }

  /* 手元の写真。選んだら、その絵で迷路を作る */
  ["pointerdown", "pointerup"].forEach(function (n) { photoButton.addEventListener(n, function (e) { e.stopPropagation(); }); });
  photoButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); photoInput.click(); });
  photoInput.addEventListener("change", function () {
    var f = photoInput.files && photoInput.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var token = ++loading;
    var im = new Image();
    im.onload = function () { if (token === loading) { srcIndex = -1; setPicture(im); } URL.revokeObjectURL(url); };
    im.onerror = function () { URL.revokeObjectURL(url); };
    im.src = url;
    photoInput.value = "";
  });

  /* ============ 迷路 ============
     N×N の部屋。壁も1マスとして数えるので、マス目は G = 2N+1 */
  var N = 21, G = 2 * N + 1, B = 12, BOARD = G * B;
  var strength = new Float32Array(G * G);   /* マスごとの線の強さ 0〜1 */
  var open = new Uint8Array(G * G);         /* 1 = 通路 */
  var carveOrder = [];                      /* 掘った順（作る演出用） */
  var openAt = new Float32Array(G * G);     /* 演出で通路になる時刻 0〜1 */
  var mazeLayer = null, edgeLayer = null, photoLayer = null;

  function makeCanvas(w, h) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }

  function setPicture(im) {
    picture = im;
    analyze();
    if (state === S.INTRO) buildMaze();
  }

  /* 絵を正方形に切って、明るさの変わり目（線）の強さをマスごとに測る */
  function analyze() {
    var R = G * 4;
    var ok = false;
    try {
      photoLayer = makeCanvas(BOARD * 2, BOARD * 2);
      var pc = photoLayer.getContext("2d");
      var sm = makeCanvas(R, R), sc = sm.getContext("2d");
      if (picture && pc && sc) {
        var iw = picture.naturalWidth || picture.width, ih = picture.naturalHeight || picture.height;
        var s = Math.min(iw, ih), sx = (iw - s) / 2, sy = (ih - s) / 2;
        pc.drawImage(picture, sx, sy, s, s, 0, 0, BOARD * 2, BOARD * 2);
        sc.drawImage(picture, sx, sy, s, s, 0, 0, R, R);
        var d = sc.getImageData(0, 0, R, R).data;
        var gray = new Float32Array(R * R), x, y, i;
        for (i = 0; i < R * R; i++) gray[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11;
        /* 細かいざらつきを消してから、縦横の差を見る */
        var blur = new Float32Array(R * R);
        for (y = 0; y < R; y++) for (x = 0; x < R; x++) {
          var sum = 0, cnt = 0;
          for (var yy = -2; yy <= 2; yy++) for (var xx = -2; xx <= 2; xx++) {
            var px = x + xx, py = y + yy;
            if (px < 0 || py < 0 || px >= R || py >= R) continue;
            sum += gray[py * R + px]; cnt++;
          }
          blur[y * R + x] = sum / cnt;
        }
        var mag = new Float32Array(R * R);
        function at(xx, yy) { xx = Math.max(0, Math.min(R - 1, xx)); yy = Math.max(0, Math.min(R - 1, yy)); return blur[yy * R + xx]; }
        for (y = 0; y < R; y++) for (x = 0; x < R; x++) {
          var gx = at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x - 1, y) - at(x - 1, y + 1);
          var gy = at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x, y - 1) - at(x + 1, y - 1);
          mag[y * R + x] = Math.sqrt(gx * gx + gy * gy);
        }
        var max = 0;
        for (y = 0; y < G; y++) for (x = 0; x < G; x++) {
          var m = 0;
          for (var k = 0; k < 16; k++) m = Math.max(m, mag[(y * 4 + (k >> 2)) * R + x * 4 + (k & 3)]);
          strength[y * G + x] = m;
        }
        /* 線が部屋のマスを通っていても、すぐ横の壁が残るように、まわり1マスぶん広げる */
        var wide = new Float32Array(G * G);
        for (y = 0; y < G; y++) for (x = 0; x < G; x++) {
          var w2 = 0;
          for (var dy2 = -1; dy2 <= 1; dy2++) for (var dx2 = -1; dx2 <= 1; dx2++) {
            var X2 = x + dx2, Y2 = y + dy2;
            if (X2 >= 0 && Y2 >= 0 && X2 < G && Y2 < G) w2 = Math.max(w2, strength[Y2 * G + X2] * (dx2 || dy2 ? 0.85 : 1));
          }
          wide[y * G + x] = w2;
        }
        strength.set(wide);
        /* 上位のほうで割って 0〜1 にそろえる（一部の強い線に引っぱられないように） */
        var sorted = Array.prototype.slice.call(strength).sort(function (a, b) { return a - b; });
        max = sorted[Math.floor(sorted.length * 0.96)] || 1;
        if (max > 0.5) {
          for (i = 0; i < G * G; i++) strength[i] = Math.min(1, strength[i] / max);
          ok = true;
        }
      }
    } catch (e) { ok = false; }
    if (!ok) {
      photoLayer = null;
      for (var j = 0; j < G * G; j++) strength[j] = Math.random();
    }
    /* 線の絵（作る演出で、元の絵から線だけが浮かぶところ） */
    edgeLayer = makeCanvas(G, G);
    var ec = edgeLayer.getContext && edgeLayer.getContext("2d");
    if (ec && ec.createImageData) {
      var img = ec.createImageData(G, G);
      if (img && img.data) {
      for (var q = 0; q < G * G; q++) {
        var v = Math.round(255 * strength[q]);
        img.data[q * 4] = v; img.data[q * 4 + 1] = v; img.data[q * 4 + 2] = v; img.data[q * 4 + 3] = 255;
      }
      ec.putImageData(img, 0, 0);
      }
    }
  }

  /* 線の弱いところから順に掘る（Prim の最小全域木）。線のあるところに壁が残る */
  function buildMaze() {
    open.fill(0);
    carveOrder = [];
    var heap = [];
    function push(w, a, b) {
      heap.push([w, a, b]);
      var i = heap.length - 1;
      while (i > 0) { var p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; var t = heap[p]; heap[p] = heap[i]; heap[i] = t; i = p; }
    }
    function pop() {
      var top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        var i = 0;
        for (;;) {
          var l = i * 2 + 1, r = l + 1, m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          var t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m;
        }
      }
      return top;
    }
    var seen = new Uint8Array(N * N);
    function visit(c) {
      seen[c] = 1;
      var cx = c % N, cy = (c / N) | 0, bx = cx * 2 + 1, by = cy * 2 + 1;
      open[by * G + bx] = 1;
      carveOrder.push(by * G + bx);
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (dv) {
        var nx = cx + dv[0], ny = cy + dv[1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N || seen[ny * N + nx]) return;
        var wall = (by + dv[1]) * G + bx + dv[0];
                push(strength[wall] + Math.random() * 0.06, wall, ny * N + nx);
      });
    }
    visit(0);
    while (heap.length) {
      var e = pop();
      if (seen[e[2]]) continue;
      open[e[1]] = 1;
      carveOrder.push(e[1]);
      visit(e[2]);
    }
    /* 入口は左上、出口は右下 */
    open[0 * G + 1] = 1;
    open[(G - 1) * G + G - 2] = 1;
    carveOrder.unshift(1);
    carveOrder.push((G - 1) * G + G - 2);
    openAt.fill(2);
    for (var i = 0; i < carveOrder.length; i++) openAt[carveOrder[i]] = i / carveOrder.length;
    renderMaze(1);
  }

  /* 迷路の絵。通路は絵を白っぽく薄め、壁は絵の色のまま残す */
  function renderMaze(t) {
    mazeLayer = mazeLayer || makeCanvas(BOARD * 2, BOARD * 2);
    var mc = mazeLayer.getContext && mazeLayer.getContext("2d");
    if (!mc) return;
    mc.setTransform(2, 0, 0, 2, 0, 0);
    mc.clearRect(0, 0, BOARD, BOARD);
    if (photoLayer) mc.drawImage(photoLayer, 0, 0, BOARD, BOARD);
    else { mc.fillStyle = "#4a5874"; mc.fillRect(0, 0, BOARD, BOARD); }
    mc.fillStyle = "rgba(255,255,255,.55)";
    mc.fillRect(0, 0, BOARD, BOARD);
    for (var y = 0; y < G; y++) for (var x = 0; x < G; x++) {
      var i = y * G + x;
      if (open[i] && openAt[i] <= t) {
        mc.fillStyle = "rgba(255,255,255,.75)";
        mc.fillRect(x * B, y * B, B, B);
      } else if (!open[i] || openAt[i] > t) {
        /* 絵の線にあたる壁ほど濃く */
        var k = Math.max(0, Math.min(1, (strength[i] - 0.35) / 0.4));
        mc.fillStyle = "rgba(22,32,46," + (0.25 + 0.7 * k).toFixed(2) + ")";
        mc.fillRect(x * B, y * B, B, B);
      }
    }
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", BUILD: "build", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var state, T, held = false, keyMode = false, time = 0, lastBuild = -1;
  var player = { x: 0, y: 0 }, trail = [];
  var keys = { l: 0, r: 0, u: 0, d: 0 };
  var BX = 0, BY = 0;                         /* 迷路の左上 */
  var R_PLAYER = 3.5, BUILD_TIME = 2.2;

  function place() {
    BX = Math.round((W - BOARD) / 2);
    BY = Math.round(Math.max(110, (H - BOARD) / 2 - 20));
  }

  function newRound() {
    shareButton.hidden = true;
    photoButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.BUILD;
    T = 0;
    time = 0;
    held = false;
    lastBuild = -1;
    keys = { l: 0, r: 0, u: 0, d: 0 };
    player.x = 1.5 * B; player.y = 0.5 * B;
    trail = [{ x: player.x, y: player.y }];
    buildMaze();
    renderMaze(0);
    preloadNext();
  }

  function wallAt(bx, by) {
    if (bx < 0 || by < 0 || bx >= G || by >= G) return true;
    return !open[by * G + bx];
  }
  function hits(x, y) {
    var r = R_PLAYER;
    var x0 = Math.floor((x - r) / B), x1 = Math.floor((x + r - 0.001) / B);
    var y0 = Math.floor((y - r) / B), y1 = Math.floor((y + r - 0.001) / B);
    for (var by = y0; by <= y1; by++) for (var bx = x0; bx <= x1; bx++) if (wallAt(bx, by)) return true;
    return false;
  }
  /* 角で引っかからないよう、ぶつかったら通路の真ん中へ寄せる */
  function moveAxis(dx, dy) {
    if (!hits(player.x + dx, player.y + dy)) { player.x += dx; player.y += dy; return; }
    var amt = Math.abs(dx + dy);
    if (dx) {
      var cy = (Math.floor(player.y / B) + 0.5) * B, ahead = Math.floor((player.x + Math.sign(dx) * (R_PLAYER + 1)) / B);
      if (!wallAt(ahead, Math.floor(player.y / B)) && Math.abs(cy - player.y) > 0.01) {
        var ny = player.y + Math.sign(cy - player.y) * Math.min(amt, Math.abs(cy - player.y));
        if (!hits(player.x, ny)) player.y = ny;
      }
    } else {
      var cx = (Math.floor(player.x / B) + 0.5) * B, below = Math.floor((player.y + Math.sign(dy) * (R_PLAYER + 1)) / B);
      if (!wallAt(Math.floor(player.x / B), below) && Math.abs(cx - player.x) > 0.01) {
        var nx = player.x + Math.sign(cx - player.x) * Math.min(amt, Math.abs(cx - player.x));
        if (!hits(nx, player.y)) player.x = nx;
      }
    }
  }
  function moveBy(dx, dy) {
    if (state !== S.PLAY) return;
    var n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 2));
    for (var i = 0; i < n; i++) { moveAxis(dx / n, 0); moveAxis(0, dy / n); }
    var last = trail[trail.length - 1];
    if (Math.hypot(player.x - last.x, player.y - last.y) > 3) trail.push({ x: player.x, y: player.y });
    if (player.y > (G - 1) * B + B * 0.3) goal();
  }
  function goal() {
    state = S.GOAL;
    T = 0;
    tone(523, 0.12, 0.14, "triangle");
    tone(659, 0.12, 0.14, "triangle", null, 0.1);
    tone(784, 0.3, 0.16, "triangle", null, 0.2);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.BUILD) {
      T += dt;
      if (T >= BUILD_TIME) { state = S.PLAY; T = 0; renderMaze(1); tone(880, 0.1, 0.1, "square"); }
      return;
    }
    if (state === S.GOAL) {
      T += dt;
      if (T > 0.9) { state = S.RESULT; shareButton.hidden = false; }
      return;
    }
    if (state !== S.PLAY) return;
    time += dt;
    var sp = 200 * dt;
    if (keys.l || keys.r || keys.u || keys.d) moveBy((keys.r - keys.l) * sp, (keys.d - keys.u) * sp);
  }

  /* ============ 入力 ============
     指をすべらせた分だけ玉が動く（指で迷路が隠れないよう、どこをなぞってもよい） */
  var lastP = null;
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") {
        if (nextPic) { loading++; srcIndex = nextPic.idx; picture = nextPic.im; analyze(); }
        newRound();
      }
      return;
    }
    held = true;
    lastP = x == null ? null : { x: x, y: y };
  }
  function move(x, y) {
    if (!held || !lastP) return;
    var dx = x - lastP.x, dy = y - lastP.y;
    lastP = { x: x, y: y };
    moveBy(dx * 1.1, dy * 1.1);
  }
  function up() { held = false; lastP = null; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); keys = { l: 0, r: 0, u: 0, d: 0 }; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1) loadSource(srcIndex + 1, function () { if (state !== S.INTRO) newRound(); });  /* 次の絵 */
    if (n === 2 && state === S.PLAY) {                                                    /* ゴール目前へ */
      player.x = (G - 1.5) * B; player.y = (G - 1.5) * B;
      if (hits(player.x, player.y)) { player.x = (G - 2 + 0.5) * B; player.y = (G - 2 + 0.5) * B; }
    }
    if (n === 3 && state === S.PLAY) { time += 3; goal(); }                                /* クリア */
  }

  var KEYMAP = { ArrowLeft: "l", a: "l", A: "l", ArrowRight: "r", d: "r", D: "r", ArrowUp: "u", w: "u", W: "u", ArrowDown: "d", s: "d", S: "d" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var dir = KEYMAP[e.key];
    if (!esc && !go && !dir) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (dir) { keys[dir] = 1; return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    var dir = KEYMAP[e.key];
    if (dir) { keys[dir] = 0; return; }
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function secText() { return (Math.floor(time * 10) / 10).toFixed(1); }
  function doShare() {
    /* 英語のときのハッシュタグは英語のゲーム名にする */
    window.zResultActions.x({ text: zT(secText() + "秒で迷路を抜けた", "Escaped the maze in " + secText() + "s") + zT(" #画像迷路", " #ImageMaze") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function photoRect() { return { x: W - 84, y: 24, w: 60, h: 60 }; }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(photoButton, photoRect(), W, H, state === S.INTRO);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#1b2230";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(BX, BY);
    if (state === S.INTRO) {
      if (photoLayer) ctx.drawImage(photoLayer, 0, 0, BOARD, BOARD);
      else if (mazeLayer) ctx.drawImage(mazeLayer, 0, 0, BOARD, BOARD);
    } else if (state === S.BUILD) {
      /* 元の絵 → 線だけ → 線の弱いところから通路が掘られていく */
      var a = Math.min(1, T / 0.7);
      if (photoLayer) { ctx.globalAlpha = 1 - a; ctx.drawImage(photoLayer, 0, 0, BOARD, BOARD); }
      if (edgeLayer) {
        ctx.globalAlpha = a * (1 - Math.max(0, Math.min(1, (T - 0.8) / 0.6)));
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(edgeLayer, 0, 0, BOARD, BOARD);
        ctx.imageSmoothingEnabled = true;
      }
      ctx.globalAlpha = Math.max(0, Math.min(1, (T - 0.8) / 0.4));
      var k = Math.max(0, Math.min(1, (T - 0.8) / (BUILD_TIME - 1.0)));
      var step = Math.floor(k * 30);
      if (step !== lastBuild) { lastBuild = step; renderMaze(step / 30); if (step > 0 && step < 30) tone(300 + step * 22, 0.04, 0.04, "square"); }
      if (mazeLayer) ctx.drawImage(mazeLayer, 0, 0, BOARD, BOARD);
      ctx.globalAlpha = 1;
    } else {
      if (mazeLayer) ctx.drawImage(mazeLayer, 0, 0, BOARD, BOARD);
      /* 通った道 */
      ctx.strokeStyle = "rgba(255,70,90,.55)";
      ctx.lineWidth = 3;
      ctx.lineCap = ctx.lineJoin = "round";
      ctx.beginPath();
      trail.forEach(function (p, i) { if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
      /* 入口と出口 */
      ctx.fillStyle = "#2ec27e";
      ctx.fillRect((G - 2) * B, (G - 1) * B, B, B);
      /* 玉 */
      ctx.beginPath();
      ctx.arc(player.x, player.y, R_PLAYER + 1, 0, Math.PI * 2);
      ctx.fillStyle = "#ff3355"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
    }
    ctx.restore();

    /* 経過時間 */
    if (state === S.PLAY || state === S.GOAL) {
      ctx.fillStyle = "#fff";
      ctx.font = "800 44px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(secText(), W / 2, BY - 30);
    }
    if (state === S.INTRO) drawPhotoButton();
    if (state === S.RESULT) drawResult();
  }

  function drawPhotoButton() {
    var b = photoRect();
    ctx.save();
    roundRect(b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.fillStyle = "#16202e";
    window.zActionIcon && window.zActionIcon(ctx, "画像を選ぶ", b.x + b.w / 2, b.y + b.h / 2, 30);
    ctx.restore();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, time: time, player: { x: player.x, y: player.y }, W: W, H: H, src: srcIndex }; },
    maze: function () { return { G: G, B: B, open: Array.prototype.slice.call(open), strength: Array.prototype.slice.call(strength) }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    move: function (dx, dy) { moveBy(dx, dy); },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(4000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  /* 画像を選ぶボタンを押したときは始めない */
  var onPhoto = false;
  window.addEventListener("pointerdown", function (e) { onPhoto = e.target === photoButton; }, true);
  window.zStartTap(function () { return state === S.INTRO && !onPhoto; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO;
  startButton.hidden = false;
  shareButton.hidden = true;
  loadSource(srcIndex);
  if (!picture) setPicture(null);
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
