<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16億タイプ診断</title>
<style>
  :root{
    --bg:#f4f5fa;
    --ink:#1b1f2e;
    --sub:#6b7185;
    --line:#e2e5ef;
    --card:#ffffff;
    --accent:#4a4de0;
    --accent2:#8b5cf6;
    --soft:#eef0fb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-y:auto;
    overflow-x:hidden;
  }
  #app{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wrap{
    width:100%;
    max-width:520px;
    padding:0 20px 40px;
  }
  .screen{display:none;}
  .screen.on{display:block;}
  #s-start.on,
  #s-quiz.on{display:flex; flex-direction:column; min-height:calc(100vh - 40px);}
  #s-start.on{justify-content:center;}

  /* ---------- スタート ---------- */
  .hero{
    text-align:center;
    padding:24px 0 0;
  }
  .hero .mark{
    width:64px;height:64px;margin:0 auto 20px;
    border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:20px;font-weight:800;letter-spacing:-.02em;
    box-shadow:0 10px 24px rgba(74,77,224,.28);
  }
  .hero h1{
    margin:0;
    font-size:31px;
    letter-spacing:.02em;
    font-weight:800;
  }
  .meta{
    margin:26px auto 0;
    max-width:320px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .meta div{
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:13px 18px;
    font-size:13px;
    color:var(--sub);
  }
  .meta div + div{border-top:1px solid var(--line);}
  .meta b{
    font-size:15px;color:var(--ink);font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .btn{
    display:block;width:100%;
    border:0;border-radius:14px;
    padding:17px 20px;
    font-size:16px;font-weight:700;
    font-family:inherit;
    cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;
    box-shadow:0 8px 20px rgba(74,77,224,.26);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px); box-shadow:0 4px 12px rgba(74,77,224,.22);}
  .btn[hidden]{display:none;}   /* display指定があると hidden が効かないので明示する */
  .btn.ghost{
    background:var(--card);color:var(--ink);
    border:1px solid var(--line);box-shadow:none;
  }
  .start-btn{margin:18px auto 0;max-width:320px;}

  /* ---------- 質問 ---------- */
  .bar-area{
    position:sticky;top:0;z-index:5;
    width:100%;
    background:var(--bg);
    padding:18px 0 10px;
  }
  .bar{
    height:4px;border-radius:4px;background:var(--line);overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s ease;
  }
  .count{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;
    font-size:12px;color:var(--sub);
    font-variant-numeric:tabular-nums;
  }
  .back{
    border:0;background:none;padding:4px 0;margin:0;
    font-family:inherit;font-size:12px;color:var(--sub);
    cursor:pointer;visibility:hidden;
  }
  .back.on{visibility:visible;}
  .qbox{
    flex:1 1 auto;
    display:flex;flex-direction:column;justify-content:center;
    padding:24px 0 56px;
  }
  .qtext{
    font-size:20px;line-height:1.7;font-weight:700;
    margin:0 0 30px;
    min-height:3.4em;
    text-align:center;
  }
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .choices .choice:nth-child(3){grid-column:1 / -1;}
  .choice{
    width:100%;text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 12px;
    font-family:inherit;font-size:15.5px;font-weight:700;line-height:1.5;
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .12s ease, background .12s ease, transform .1s ease;
  }
  .choice:hover{border-color:#c3c7de;}
  .choice:active{transform:scale(.99);}
  .choice.pick{
    border-color:var(--accent);
    background:var(--soft);
  }

  /* ---------- 結果 ---------- */
  .rhead{text-align:center;padding:44px 0 0;}
  .tcard{
    width:320px;max-width:100%;margin:0 auto;
    background:var(--card);
    border:3px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 14px 38px rgba(27,31,46,.13);
  }
  .tcard-art{display:block;}
  .tcard-art svg{display:block;width:100%;height:auto;}
  .tcard-body{padding:20px 22px 24px;}
  .code{
    margin:0;
    font-family:"SFMono-Regular",Consolas,"Courier New",monospace;
    font-size:22px;font-weight:800;
    letter-spacing:.1em;
    line-height:1.6;
    white-space:pre-line;
    word-break:break-all;
  }
  .tname{
    margin:14px 0 0;
    font-size:12px;font-weight:800;line-height:1.95;letter-spacing:0;
    color:var(--ink);
    white-space:pre-line;
  }
  .actions{margin:30px auto 0;max-width:320px;display:flex;flex-direction:column;gap:11px;}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">

    <!-- スタート -->
    <section class="screen on" id="s-start">
      <div class="hero">
        <div class="mark">16億</div>
        <h1>16億タイプ診断</h1>
      </div>
      <div class="meta">
        <div>質問数<b>全30問</b></div>
        <div>所要時間<b>約3分</b></div>
        <div>タイプ数<b id="total">1,610,612,736</b></div>
      </div>
      <button class="btn start-btn" id="go">はじめる</button>
    </section>

    <!-- 質問 -->
    <section class="screen" id="s-quiz">
      <div class="bar-area">
        <div class="bar"><i id="prog"></i></div>
        <div class="count">
          <button class="back" id="back">← もどる</button>
          <span id="cnt">1 / 30</span>
        </div>
      </div>
      <div class="qbox">
        <h2 class="qtext" id="qtext"></h2>
        <div class="choices" id="choices"></div>
      </div>
    </section>

    <!-- 結果 -->
    <section class="screen" id="s-result">
      <div class="rhead">
        <div class="tcard">
          <div class="tcard-art" id="ravatar"></div>
          <div class="tcard-body">
            <div class="code" id="rcode"></div>
            <h2 class="tname" id="rname"></h2>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="share">Xでシェア</button>
        <button class="btn ghost" id="saveimg">画像を保存</button>
        <button class="btn ghost" id="again">もう一度</button>
        <button class="btn" id="tryme" hidden>診断してみる</button>
      </div>
    </section>

  </div>
</div>

<script src="../share.js"></script>
<script src="avatar.js"></script>
<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     30の軸。どれも「そう思う／そう思わない」で答える。
     最後のひとつだけ「どちらでもない」があるので、
     総数は 2^29 × 3 = 1,610,612,736 通りになる。
     o は、選んだ答えがコードのどの文字になるかの並び。
     ------------------------------------------------------------------ */
  var LABELS = {
    2: ["そう思う", "そう思わない"],
    3: ["そう思う", "そう思わない", "どちらでもない"]
  };

  var AXES = [
    { q:"人が集まる場所から帰ったあとは、ひとりの時間で回復したい", o:["K","G"] },
    { q:"話を聞くときは、その裏にある意味のほうが先に浮かぶ",       o:["U","R"] },
    { q:"決めるときに最後に効くのは、誰がどう感じるかだ",           o:["H","L"] },
    { q:"旅行の予定は、前の日になってもまだ決めていない",           o:["W","D"] },
    { q:"自信のない話題でも、言い切ってしまう",                     o:["A","U"] },
    { q:"仕事は、丁寧さより速さを優先する",                         o:["S","M"] },
    { q:"急な誘いは、持ち帰らずにとりあえず受ける",                 o:["O","C"] },
    { q:"大勢の輪の中にいるときのほうが、力を出せる",               o:["G","H"] },
    { q:"ふだん考えているのは、目の前のことより先のことだ",         o:["F","N"] },
    { q:"頭が冴えるのは、夜より朝だ",                               o:["M","Y"] },
    { q:"机の上には、何も置いていない",                             o:["T","L"] },
    { q:"つい比べてしまうのは、昨日の自分より上にいる誰かだ",       o:["U","D"] },
    { q:"腹が立ったときは、その場で熱くなる",                       o:["H","C"] },
    { q:"空いた時間は、考えごとより手を動かして過ごす",             o:["R","I"] },
    { q:"勝負ごとでは、待つより先に仕掛ける",                       o:["A","D"] },
    { q:"うれしいのは、終わったあとよりやっている最中だ",           o:["P","S"] },
    { q:"店では、いつものものより見たことのないものを選ぶ",         o:["N","F"] },
    { q:"悩みごとは、人に話さず自分の中で回す",                     o:["I","O"] },
    { q:"昔のことは、細かいところまでよく覚えている",               o:["M","W"] },
    { q:"借りるより、貸すほうが気楽だ",                             o:["G","T"] },
    { q:"いやなことがあっても、一晩で流れていく",                   o:["F","K"] },
    { q:"集中したいときは、無音より何か音がほしい",                 o:["O","S"] },
    { q:"覚えるときは、頭の中で並べるより手を動かす",               o:["H","M"] },
    { q:"面倒な役回りは、気づくと引き受けている",                   o:["A","P"] },
    { q:"迷ったときの返事は、ひとまず断るほうだ",                   o:["N","Y"] },
    { q:"人が見ている場所では、前に出るほうだ",                     o:["U","F"] },
    { q:"お金より、時間のほうが惜しい",                             o:["T","O"] },
    { q:"やるなら、広く手を出すよりひとつを深くだ",                 o:["I","A"] },
    { q:"落ち着くのは、端のほうより真ん中あたりだ",                 o:["M","F"] },
    /* ここだけ「どちらでもない」がある */
    { q:"話は、はっきり終わらせたい",                               o:["F","A","P"] }
  ];

  /* 肩書は30の軸ぜんぶから組み立てる。
     5軸ずつ5つの語（32通り）＋ 残り4軸と3択の軸で最後の名詞（48通り）。
     32×32×32×32×32×48 = 1,610,612,736 で、コードとちょうど同じ数になる。 */
  var P1 = ["朝いちばんの","昼下がりの","夕暮れどきの","夜ふけの","真夜中の","明け方の","休みの日の","締切前の",
            "雨の日の","晴れた日の","雪の日の","風の強い日の","春先の","真夏の","秋口の","真冬の",
            "窓ぎわの","廊下の","屋上の","地下の","路地裏の","大通りの","駅前の","山あいの",
            "海辺の","川べりの","公園の","図書館の","台所の","押し入れの","坂の上の","橋の下の"];
  var P2 = ["よく笑う","よく寝る","よく食べる","よく歩く","黙って進む","先に謝る","あとで悔やむ","すぐ忘れる",
            "熱く語る","静かに待つ","口笛を吹く","鼻歌まじりの","早口で話す","ゆっくり話す","目を合わせない","じっと見る",
            "すぐ立ち上がる","なかなか動かない","何度も確かめる","一度で決める","遠回りする","近道を探す","荷物の多い","手ぶらの",
            "よくつまずく","足音のしない","声のでかい","返事の早い","メモを取る","覚えていない","顔に出る","顔に出ない"];
  var P3 = ["手の早い","腰の重い","耳のいい","目のいい","鼻のきく","口の堅い","気の長い","気の短い",
            "腹の据わった","肝の太い","骨のある","線の細い","押しの強い","引きぎわのいい","勘のいい","理屈っぽい",
            "物覚えのいい","忘れっぽい","飽きっぽい","粘り強い","涙もろい","照れ屋の","負けず嫌いの","勝ち負けにこだわらない",
            "寝つきのいい","寝起きの悪い","食にうるさい","何でも食べる","運のいい","運に頼らない","汗かきの","冷え性の"];
  var P4 = ["段取りの","言い訳の","片づけの","散らかしの","値切りの","おごりの","仕込みの","仕上げの",
            "下ごしらえの","味つけの","計算の","目分量の","地図の","道草の","荷造りの","荷ほどきの",
            "呼び込みの","聞き役の","つなぎの","締めの","前置きの","後始末の","下調べの","出たとこ勝負の",
            "根回しの","直談判の","手直しの","やり直しの","代打の","留守番の","案内の","見送りの"];
  var P5 = ["一番手の","二番手の","三番手の","最後尾の","真ん中の","はしっこの","表向きの","裏方の",
            "見張り役の","相談役の","頼まれ役の","言い出しっぺの","付き添いの","立会人の","仲裁役の","応援団の",
            "新入りの","古株の","名ばかりの","名うての","自称の","公認の","元祖の","二代目の",
            "通いの","住み込みの","かけもちの","専属の","臨時の","終身の","非公式の","筆頭の"];
  var P6 = ["発明家","設計者","案内人","見物人","職人","管理人","守り手","分解者",
            "詩人","思索家","旗振り役","火付け役","指揮者","世話役","実行役","統率者",
            "研究者","記録係","運び屋","門番","狩人","漁師","庭師","時計係",
            "店主","客","旅人","隣人","先生","生徒","審判","選手",
            "語り部","聞き手","目撃者","証人","案山子","灯台守","渡し守","鍵屋",
            "薬売り","仕立て屋","風見鶏","羅針盤","便利屋","何でも屋","こだわり屋","気分屋"];

  var TOTAL = Math.pow(2, 29) * 3;   // 1,610,612,736

  var $ = function (id) { return document.getElementById(id); };
  var answers = [];   // 各軸で選んだ選択肢の番号
  var cur = 0;

  /* ---------- 画面 ---------- */
  function show(name) {
    ["start", "quiz", "result"].forEach(function (n) {
      $("s-" + n).className = "screen" + (n === name ? " on" : "");
    });
    if (window.scrollTo) window.scrollTo(0, 0);
  }

  function reset() {
    answers = [];
    cur = 0;
    stampUrl("");
    show("start");
  }

  /* ---------- 質問 ---------- */
  function renderQ() {
    var ax = AXES[cur];
    var n = cur + 1;

    $("prog").style.width = (cur / AXES.length * 100) + "%";
    $("cnt").textContent = n + " / " + AXES.length;
    $("qtext").textContent = ax.q;
    $("back").className = "back" + (cur > 0 ? " on" : "");

    var box = $("choices");
    box.textContent = "";
    var labels = LABELS[ax.o.length];
    ax.o.forEach(function (op, i) {
      var b = document.createElement("button");
      b.className = "choice" + (answers[cur] === i ? " pick" : "");
      b.type = "button";
      b.textContent = labels[i];
      b.addEventListener("click", function () { pick(i); });
      box.appendChild(b);
    });
  }

  var locked = false;
  function pick(i) {
    if (locked) return;
    locked = true;
    answers[cur] = i;
    var nodes = $("choices").children;
    for (var k = 0; k < nodes.length; k++) {
      nodes[k].className = "choice" + (k === i ? " pick" : "");
    }
    setTimeout(function () {
      locked = false;
      cur++;
      if (cur >= AXES.length) { finish(); } else { renderQ(); }
    }, 180);
  }

  function goBack() {
    if (cur > 0) { cur--; renderQ(); }
  }

  /* ---------- 結果 ---------- */
  function code() {
    return answers.map(function (a, i) { return AXES[i].o[a]; }).join("");
  }

  /* コードから答えを読み戻す（シェアされたリンクを開いたとき用） */
  function decode(c) {
    if (!c || c.length !== AXES.length) return null;
    var out = [];
    for (var i = 0; i < AXES.length; i++) {
      var k = -1;
      for (var j = 0; j < AXES[i].o.length; j++) if (AXES[i].o[j] === c.charAt(i)) { k = j; break; }
      if (k < 0) return null;
      out.push(k);
    }
    return out;
  }

  /* 結果をURLに残す。サイトに埋め込まれているときは、埋め込み先のURLに残す
     （そこがシェアされるので）。履歴は置き換えるだけで、読み込み直しはしない */
  function stampUrl(c) {
    try {
      var w = (window.parent && window.parent !== window) ? window.parent : window;
      var h = w.location.hash || "";
      if (h.indexOf("/game/") >= 0) {
        w.history.replaceState(null, "", h.split("?")[0] + (c ? "?r=" + c : ""));
      } else {
        w.history.replaceState(null, "", w.location.pathname + (c ? "?r=" + c : ""));
      }
    } catch (e) {}
  }

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h;
  }

  function typeName(sep) {
    function bits(from, n) {
      var v = 0;
      for (var i = 0; i < n; i++) v = v * 2 + answers[from + i];
      return v;
    }
    /* 2つずつ3行に折る。sep に "" を渡すと1行につながる（シェアの文はこちら） */
    return [
      P1[bits(0, 5)] + P2[bits(5, 5)] + P3[bits(10, 5)],
      P4[bits(15, 5)] + P5[bits(20, 5)] + P6[bits(25, 4) * 3 + answers[29]]
    ].join(sep === undefined ? "\n" : sep);
  }

  function finish(fromLink) {
    var c = code();
    if (!fromLink) stampUrl(c);
    $("share").hidden = !!fromLink;
    $("saveimg").hidden = !!fromLink;
    $("again").hidden = !!fromLink;
    $("tryme").hidden = !fromLink;
    $("ravatar").innerHTML = zAvatar(answers);
    var edge = zAvatarEdge(answers);
    var card = document.querySelector(".tcard");
    card.style.borderColor = edge;
    card.style.boxShadow = "0 0 0 5px " + edge + "26, 0 0 34px " + edge + "aa, 0 16px 38px " + edge + "4d";
    $("rcode").style.color = edge;
    $("rcode").textContent = c.slice(0, 15) + "\n" + c.slice(15);
    $("rname").textContent = typeName();

    show("result");
  }

  /* ---------- カードを1枚の画像にする ---------- */
  function roundPath(g, x, y, w, h, r) {
    if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
    var v = typeof r === "number" ? [r, r, r, r] : r;
    g.beginPath();
    g.moveTo(x + v[0], y);
    g.lineTo(x + w - v[1], y); g.quadraticCurveTo(x + w, y, x + w, y + v[1]);
    g.lineTo(x + w, y + h - v[2]); g.quadraticCurveTo(x + w, y + h, x + w - v[2], y + h);
    g.lineTo(x + v[3], y + h); g.quadraticCurveTo(x, y + h, x, y + h - v[3]);
    g.lineTo(x, y + v[0]); g.quadraticCurveTo(x, y, x + v[0], y);
    g.closePath();
  }

  /* 画面のカードと同じ組み方で描く（縦横は2倍） */
  function makeCard(done) {
    var W = 640, H = 896, edge = zAvatarEdge(answers);
    var svg = $("ravatar").innerHTML.replace("<svg ", '<svg width="628" height="534" ');
    var url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    var img = new Image();

    img.onload = function () {
      var cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      var g = cv.getContext("2d");

      g.fillStyle = "#ffffff";
      roundPath(g, 3, 3, W - 6, H - 6, 45);
      g.fill();

      g.save();
      roundPath(g, 6, 6, 628, 534, [42, 42, 0, 0]);
      g.clip();
      g.drawImage(img, 6, 6, 628, 534);
      g.restore();
      URL.revokeObjectURL(url);

      g.textAlign = "center";
      g.textBaseline = "middle";

      try { g.letterSpacing = "4px"; } catch (e) {}
      g.fillStyle = edge;
      g.font = '800 44px "SFMono-Regular", Consolas, "Courier New", monospace';
      var cc = code();
      var lines = [cc.slice(0, 15), cc.slice(15)];
      lines.forEach(function (t, i) { g.fillText(t, W / 2, 615 + i * 70.4); });

      try { g.letterSpacing = "0px"; } catch (e) {}
      g.fillStyle = "#1b1f2e";
      g.font = '800 24px -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
      var top = 580 + lines.length * 70.4 + 28;
      typeName().split("\n").forEach(function (t, i) { g.fillText(t, W / 2, top + 23 + i * 46.8); });

      g.strokeStyle = edge;
      g.lineWidth = 6;
      roundPath(g, 3, 3, W - 6, H - 6, 45);
      g.stroke();

      cv.toBlob(function (b) { done(b); }, "image/png");
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  /* 端末が対応していれば共有シートへ、だめならダウンロード */
  function saveCard() {
    makeCard(function (blob) {
      if (!blob) return;
      var name = "16oku-" + code() + ".png";
      var file = null;
      try { file = new File([blob], name, { type: "image/png" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] })["catch"](function () {});
        return;
      }
      var u = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = u;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(u);
      }, 1000);
    });
  }

  /* ---------- 操作 ---------- */
  $("go").addEventListener("click", function () {
    answers = [];
    cur = 0;
    show("quiz");
    renderQ();
  });
  $("back").addEventListener("click", goBack);
  $("again").addEventListener("click", reset);
  $("tryme").addEventListener("click", reset);
  $("saveimg").addEventListener("click", saveCard);
  $("share").addEventListener("click", function () {
    zShare({
      native: false,
      text: "私は「" + typeName("") + "」（" + code() + "） でした #16億タイプ診断"
    });
  });

  var escDown = false;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!escDown) { escDown = true; reset(); }
      return;
    }
    if ($("s-quiz").className.indexOf("on") < 0) return;
    var ax = AXES[cur];
    if (e.key === "1" || e.key === "2" || e.key === "3") {
      var i = parseInt(e.key, 10) - 1;
      if (i < ax.o.length) pick(i);
    } else if (e.key === "ArrowLeft") {
      goBack();
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "Escape") escDown = false;
  });

  $("total").textContent = TOTAL.toLocaleString();

  var shared = /[?&]r=([A-Z]{30})/.exec(location.search);
  if (shared) {
    var got = decode(shared[1]);
    if (got) { answers = got; cur = AXES.length; finish(true); }
  }
})();
</script>
</body>
</html>
