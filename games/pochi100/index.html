<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
<!-- ゲームのOGP：道具で更新 -->

<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->

<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* ポチポチ100
   同じ形のボタンが100個並んだゲーム機。どれかが本物の左・右・A。
   中のゲームは、穴を1つ跳び越えて旗まで行けばクリア。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });


  var SND = {
    jump: function () { tone(330, 0.12, 0.08, "square", 660); },
    ouch: function () { tone(700, 0.3, 0.07, "square", 200); },
    click: function () { noiseHit(0.03, 2400, 0.25, 2); tone(180, 0.04, 0.05, "square", 120); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 0.07, "square", null, i * 0.08); }); }
  };

  var LW = 160, LH = 128;                       /* 画面の中のゲームは横160×縦128の点 */
  var lcd = document.createElement("canvas"); lcd.width = LW; lcd.height = LH;
  var lctx = lcd.getContext("2d");

  /* ============ 面 ============ 段差を1つ跳び上がって旗まで */
  var GROUND = 112;
  function g(a, b) { return { x: a, y: GROUND, w: b - a, h: 16 }; }
  var STAGE = { solids: [g(0, 160), { x: 92, y: GROUND - 30, w: 68, h: 46 }], flag: 150, flagY: GROUND - 30 };

  /* ============ ボタン ============
     同じ形のボタンを縦10×横10に並べる（ゲーム機の上の位置、単位cm）。
     本物の左・右・A は、遊ぶたびに100個の中から選び直す */
  var BODY = { w: 10.6, l: 20 }, PITCH = 1.0;
  var BTNS = [];
  /* 色は100個とも違う。色相25段×色合い4種の組み合わせを、決まった順に混ぜて配る
     （隣り合う色相は近いが、完全に同じ色にはならない） */
  var TONE = [[0.95, 0.55], [0.95, 0.44], [0.8, 0.64], [0.7, 0.5]], COLS = [];
  for (var hi = 0; hi < 25; hi++) for (var ti = 0; ti < 4; ti++) COLS.push(hsl(hi / 25 + ti * 0.01, TONE[ti][0], TONE[ti][1]));
  var seed = 7;
  for (var ci = COLS.length - 1; ci > 0; ci--) { seed = (seed * 16807) % 2147483647; var cj = seed % (ci + 1), tc = COLS[ci]; COLS[ci] = COLS[cj]; COLS[cj] = tc; }
  for (var row = 0; row < 10; row++) for (var col = 0; col < 10; col++)
    BTNS.push({ x: (col - 4.5) * PITCH, z: 3.1 + (row - 4.5) * PITCH, r: 0.4, col: COLS[row * 10 + col] });
  function hsl(h, s, l) {
    var q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    function c(t) { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }
    return (Math.round(c(h + 1 / 3) * 255) << 16) | (Math.round(c(h) * 255) << 8) | Math.round(c(h - 1 / 3) * 255);
  }
  function cssCol(n) { return "#" + ("00000" + n.toString(16)).slice(-6); }
  var real = { L: -1, R: -1, A: -1 };

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, P = null, falls, clearT, jumpQ, dead, mark = false;
  var keys = { L: false, R: false }, pointers = {}, flash = {};

  /* ============ ハズレの反応 ============ 押すと何か起きる。ゲームの進み（当たり）は変えない */
  var fx;
  function newFx() { return { invert: 0, flipV: 0, flipH: 0, shake: 0, night: 0, off: 0, rain: 0, snow: 0, glitch: 0, big: 0, bounce: 0, wave: null, bird: -1, ghost: 0, parts: [], pop: {}, lamp: null }; }
  var SCALE = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];
  function burst(kind, x, y, n, sp) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = sp * (0.4 + Math.random() * 0.6);
      fx.parts.push({ k: kind, x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.4, life: 0.9 + Math.random() * 0.5 });
    }
  }
  var REACT = [
    function (b) { tone(SCALE[b.note % 10], 0.5, 0.09, "triangle"); tone(SCALE[b.note % 10] * 2, 0.3, 0.03, "sine"); burst("note", P.x + 3, P.y - 4, 1, 20); },
    function () { fx.invert = 0.8; tone(1200, 0.15, 0.05, "square", 300); },
    function () { fx.flipV = 1.2; tone(200, 0.4, 0.08, "sine", 600); },
    function () { fx.flipH = 1.2; tone(600, 0.3, 0.06, "sine", 200); },
    function () { fx.shake = 0.6; noiseHit(0.4, 120, 0.5, 0.8); },
    function () { fx.night = 1.8; tone(392, 0.25, 0.05, "sine"); tone(330, 0.4, 0.05, "sine", null, 0.25); },
    function () { fx.off = 0.6; tone(90, 0.2, 0.08, "square", 40); },
    function () { fx.rain = 2.5; noiseHit(1.5, 5000, 0.08, 0.3); },
    function () { fx.snow = 3; [1568, 2093, 1760].forEach(function (f, i) { tone(f, 0.25, 0.025, "sine", null, i * 0.1); }); },
    function () { burst("heart", P.x + 3, P.y, 8, 50); tone(660, 0.12, 0.05, "sine", 990); tone(880, 0.2, 0.04, "sine", 1320, 0.1); },
    function () { burst("star", 80, 50, 14, 90); tone(1047, 0.1, 0.05, "square"); tone(1568, 0.25, 0.04, "square", null, 0.08); },
    function () { fx.bird = 0; [2400, 2800, 2400].forEach(function (f, i) { tone(f, 0.06, 0.04, "sine", f * 1.3, i * 0.09); }); },
    function () { fx.bounce = 1; tone(150, 0.5, 0.1, "sine", 500); },
    function (b) { fx.wave = { x: b.x, z: b.z, t: 0 }; [0, 1, 2, 3, 4].forEach(function (i) { tone(300 + i * 80, 0.08, 0.04, "square", null, i * 0.06); }); },
    function () { fx.glitch = 0.7; noiseHit(0.5, 2000, 0.2, 0.5); },
    function () { fx.ghost = 1.6; tone(440, 1.0, 0.05, "sine", 220); tone(466, 1.0, 0.04, "sine", 233); },
    function () { burst("puff", P.x - 1, P.y + 6, 5, 12); tone(90, 0.45, 0.12, "sawtooth", 60); noiseHit(0.4, 300, 0.2, 1); },
    function () { burst("coin", P.x + 2, P.y - 6, 1, 0); tone(988, 0.08, 0.06, "square"); tone(1319, 0.3, 0.06, "square", null, 0.08); },
    function (b) { fx.pop[BTNS.indexOf(b)] = 1; tone(500, 0.15, 0.08, "sine", 1500); },
    function () { fx.big = 1.4; tone(200, 0.4, 0.07, "square", 800); }
  ];

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; falls = 0; pointers = {};
    var pick = [];
    while (pick.length < 3) { var n = Math.floor(Math.random() * BTNS.length); if (pick.indexOf(n) < 0) pick.push(n); }
    real = { L: pick[0], R: pick[1], A: pick[2] };
    /* ハズレの反応を配り直す（20種類を5個ずつ） */
    var kinds = [];
    for (var j = 0; j < BTNS.length; j++) kinds.push(REACT[j % REACT.length]);
    kinds.sort(function () { return Math.random() - 0.5; });
    BTNS.forEach(function (b, j) { b.react = kinds[j]; b.note = j; });
    fx = newFx();
    chaos = null;
    /* 大外れ：押すとボタンが全部飛び散って、入れ替わる */
    do { big = Math.floor(Math.random() * BTNS.length); } while (isReal(big));
    respawn();
  }
  function respawn() {
    P = { x: 8, y: GROUND - 8, w: 6, h: 8, vx: 0, vy: 0, ground: true, face: 1, walk: 0 };
    clearT = -1; jumpQ = 0; dead = -1;
  }
  function die() { if (dead < 0) { dead = 0; SND.ouch(); } }

  /* ============ 進行 ============ */
  var G = 300, JUMP = 170, WALK = 60;   /* ふわっと長く跳ぶ（滞空 約1.1秒、高さ 約48点） */
  function down(i) {
    for (var k in pointers) if (pointers[k] === i) return true;
    return (flash[i] || 0) > 0;
  }
  function held(id) { return (id !== "A" && keys[id]) || down(real[id]); }
  function hitRect(a, r) { return a.x < r.x + r.w && a.x + a.w > r.x && a.y < r.y + r.h && a.y + a.h > r.y; }

  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    for (var f in flash) flash[f] -= dt;
    updateFx(dt);
    if (dead >= 0) { dead += dt; if (dead > 0.7) { falls++; respawn(); } return; }
    if (clearT >= 0) { clearT += dt; if (clearT > 0.9) finish(); return; }
    var dir = (held("L") ? -1 : 0) + (held("R") ? 1 : 0);
    if (dir) P.face = dir;
    var acc = 900 * dt;
    P.vx += Math.max(-acc, Math.min(acc, dir * WALK - P.vx));
    if (jumpQ > 0 && P.ground) { P.vy = -JUMP; P.ground = false; jumpQ = 0; SND.jump(); }
    jumpQ = Math.max(0, jumpQ - dt);
    P.vy = Math.min(320, P.vy + G * dt);

    var sol = STAGE.solids;
    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > LW - P.w) P.x = LW - P.w;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vx > 0) P.x = r.x - P.w; else if (P.vx < 0) P.x = r.x + r.w;
      P.vx = 0;
    });
    P.y += P.vy * dt;
    P.ground = false;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vy > 0) { P.y = r.y - P.h; P.ground = true; } else if (P.vy < 0) P.y = r.y + r.h;
      P.vy = 0;
    });
    if (Math.abs(P.vx) > 1 && P.ground) P.walk += dt * Math.abs(P.vx) / 8;
    if (P.y > LH + 16) { die(); return; }
    if (P.x + P.w >= STAGE.flag - 1 && P.ground) { clearT = 0; SND.clear(); }
  }
  function jump() { if (state === S.PLAY) jumpQ = 0.12; }
  /* ============ 大外れ ============
     ボタンが全部穴から飛び出して机の上の本体でぐちゃっと転がり、別の穴にランダムに収まり直す。
     色ごと（本物も大外れも）一緒に動くので、どこにあったかの記憶が崩れる */
  var chaos = null, big = -1, FLY = 1.3, BACK = 0.8;
  function startChaos() {
    var slots = BTNS.map(function (b) { return { x: b.x, z: b.z }; });
    slots.sort(function () { return Math.random() - 0.5; });
    chaos = { t: 0, to: slots, p: BTNS.map(function (b) {
      return { x: b.x, y: 0, z: b.z, vx: (Math.random() - 0.5) * 9, vy: 5 + Math.random() * 7, vz: (Math.random() - 0.5) * 9, rx: 0, rz: 0,
        sx: (Math.random() - 0.5) * 14, sz: (Math.random() - 0.5) * 14 };
    }) };
    pointers = {};
    fx.bounce = 1;
    noiseHit(1.2, 400, 0.5, 0.4); tone(300, 0.9, 0.08, "sawtooth", 60);
  }
  function updateChaos(dt) {
    if (!chaos) return;
    var c = chaos, hw = BODY.w / 2 - 0.4, hl = BODY.l / 2 - 0.4;
    c.t += dt;
    if (c.t < FLY) {
      c.p.forEach(function (q) {
        q.vy -= 30 * dt;
        q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
        q.rx += q.sx * dt; q.rz += q.sz * dt;
        if (q.y < 0) { q.y = 0; q.vy = -q.vy * 0.45; q.vx *= 0.7; q.vz *= 0.7; q.sx *= 0.7; q.sz *= 0.7; if (Math.abs(q.vy) > 2) tone(500 + Math.random() * 600, 0.03, 0.015, "square"); }
        if (Math.abs(q.x) > hw) { q.x = Math.sign(q.x) * hw; q.vx = -q.vx * 0.5; }
        if (Math.abs(q.z) > hl) { q.z = Math.sign(q.z) * hl; q.vz = -q.vz * 0.5; }
      });
    } else {
      if (!c.from) { c.from = c.p.map(function (q) { return { x: q.x, y: q.y, z: q.z, rx: q.rx % (Math.PI * 2), rz: q.rz % (Math.PI * 2) }; }); tone(200, 0.5, 0.05, "sine", 900); }
      var k = Math.min(1, (c.t - FLY) / BACK), e = k * k * (3 - 2 * k);
      c.p.forEach(function (q, i) {
        var f = c.from[i], to = c.to[i];
        q.x = f.x + (to.x - f.x) * e; q.z = f.z + (to.z - f.z) * e;
        q.y = f.y * (1 - e) + Math.sin(e * Math.PI) * 1.2;
        q.rx = f.rx * (1 - e); q.rz = f.rz * (1 - e);
      });
      if (k >= 1) {
        BTNS.forEach(function (b, i) { b.x = c.to[i].x; b.z = c.to[i].z; });
        chaos = null;
        SND.click();
      }
    }
  }
  function updateFx(dt) {
    updateChaos(dt);
    ["invert", "flipV", "flipH", "shake", "night", "off", "rain", "snow", "glitch", "big", "ghost"].forEach(function (k) { fx[k] = Math.max(0, fx[k] - dt); });
    fx.bounce = Math.max(0, fx.bounce - dt * 1.2);
    if (fx.wave) { fx.wave.t += dt; if (fx.wave.t > 1.2) fx.wave = null; }
    if (fx.bird >= 0) { fx.bird += dt; if (fx.bird > 2) fx.bird = -1; }
    for (var i in fx.pop) { fx.pop[i] -= dt * 1.5; if (fx.pop[i] <= 0) delete fx.pop[i]; }
    fx.parts = fx.parts.filter(function (q) {
      q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += (q.k === "puff" ? -20 : q.k === "coin" ? 0 : 80) * dt;
      if (q.k === "coin") q.y -= 30 * dt;
      return q.life > 0;
    });
  }

  function finish() { state = S.RESULT; clearT = -1; shareButton.hidden = false; }

  /* ============ 入力 ============ */
  /* 立体が使えないとき（自動確認の台など）は、ゲーム機を画面の中央に平らに描く */
  function flatK() { return Math.min(W / (BODY.w + 0.3), H / (BODY.l + 0.8)); }
  function btnAt(i) {
    var s3 = scene3d();
    if (s3) { try { return s3.buttonAt(i, W, H); } catch (e) {} }
    var k = flatK(), b = BTNS[i];
    return { x: W / 2 + b.x * k, y: H / 2 + b.z * k, r: b.r * k };
  }
  /* いちばん近いボタン。隣との間の半分より遠ければなし */
  function hitBtn(x, y) {
    var best = -1, bd = 1e9, lim = 0;
    for (var i = 0; i < BTNS.length; i++) {
      var c = btnAt(i), d = Math.hypot(x - c.x, y - c.y);
      if (d < bd) { bd = d; best = i; lim = c.r / BTNS[i].r * PITCH * 0.6; }
    }
    return bd < lim ? best : -1;
  }
  function pressBtn(i) {
    flash[i] = 0.15;   /* 軽いタップでも、沈んだ姿が少しのあいだ見えるように */
    SND.click();
    if (chaos) return;
    if (i === big) { startChaos(); return; }
    if (i === real.A) jump();
    else if (!isReal(i) && state === S.PLAY) BTNS[i].react(BTNS[i]);
  }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var i = chaos ? -1 : hitBtn(p.x, p.y);
    if (i < 0) return;
    pointers[e.pointerId] = i;
    pressBtn(i);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pointers) || state !== S.PLAY) return;
    var p = atCanvas(e), i = hitBtn(p.x, p.y);
    if (i >= 0 && i !== pointers[e.pointerId]) { pointers[e.pointerId] = i; pressBtn(i); }  /* 指をずらすと隣のボタンへ */
  });
  function release(e) { delete pointers[e.pointerId]; }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);
  wrap.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("blur", function () { pointers = {}; keys.L = keys.R = false; });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1) mark = !mark;                                  /* 本物のボタンに色をつける */
    if (n === 2 && state === S.PLAY) { P.x = 60; }              /* 段差の手前へ */
    if (n === 3 && state === S.PLAY && !chaos) startChaos();   /* 大外れ */
    if (n === 9 && state === S.PLAY) finish();                  /* 結果へ */
  }

  /* キーボード・ジョイパッドでは遊べない（ボタンを探すのが遊びなので、キーで本物を押せてしまわないように）。
     開始・やり直しと、本番以外の数字キーだけ受ける */
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if ((k === " " || k === "enter") && state === S.RESULT && !e.repeat) { e.preventDefault(); newRound(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  /* ============ シェア ============ */
  function secText() { return (Math.floor(T * 10) / 10).toFixed(1); }
  function doShare() {
    var s = secText();
    window.zResultActions.x({ text:
      zT("100個のボタンから本物を探し当てて、" + s + "秒で段差を跳び上がった", "Found the real buttons among 100 and jumped up the step in " + s + "s", "100개의 버튼 중에서 진짜를 찾아내 " + s + "초 만에 단차를 뛰어올랐다", "从100个按钮中找出真的，用 " + s + " 秒跳上了台阶", "從100個按鈕中找出真的，用 " + s + " 秒跳上了臺階") +
      zT(" #ポチポチ100", " #PochiPochi100", " #포치포치100", " #按按100", " #按按100") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  var PAL = ["#d8e6ea", "#a6bfc8", "#577684", "#22323c"];
  function px(x, y, w, h, c) { lctx.fillStyle = PAL[c]; lctx.fillRect(Math.round(x), Math.round(y), w, h); }

  var PAL_DAY = PAL, PAL_NIGHT = ["#1d2b3a", "#2e4257", "#5c7690", "#d8e6ea"];
  var tmp = document.createElement("canvas"); tmp.width = LW; tmp.height = LH;
  var tctx = tmp.getContext("2d");
  function drawLCD() {
    PAL = fx.night > 0 ? PAL_NIGHT : PAL_DAY;
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = "source-over";
    px(0, 0, LW, LH, 0);
    if (fx.night > 0) { px(128, 14, 8, 8, 3); px(130, 12, 4, 12, 3); }
    else { px(20, 28, 18, 4, 1); px(24, 25, 10, 3, 1); px(118, 18, 18, 4, 1); px(122, 15, 10, 3, 1); }
    STAGE.solids.forEach(function (r) {
      px(r.x, r.y, r.w, r.h, 2);
      px(r.x, r.y, r.w, 2, 3);
      for (var i = r.x + 3; i < r.x + r.w - 1; i += 6) px(i, r.y + 5 + ((i / 6) % 2) * 4, 2, 2, 1);
    });
    px(STAGE.flag, STAGE.flagY - 26, 2, 26, 3);
    px(STAGE.flag - 10, STAGE.flagY - 26, 10, 7, 2);
    if (fx.big > 0) {
      var cx = P.x + 3, cy = P.y + 8;
      lctx.setTransform(2.5, 0, 0, 2.5, -cx * 1.5, -cy * 1.5);
      drawPlayer();
      lctx.setTransform(1, 0, 0, 1, 0, 0);
    } else drawPlayer();
    drawFx();
    if (clearT >= 0) { lctx.fillStyle = "rgba(216,230,234," + Math.min(0.6, clearT) + ")"; lctx.fillRect(0, 0, LW, LH); }
    postFx();
  }
  /* 画面の中に出る小物 */
  function drawFx() {
    var t = T || 0, i;
    if (fx.rain > 0) for (i = 0; i < 40; i++) { var rx = (i * 37 + t * 40) % LW, ry = (i * 53 + t * 220) % LH; px(rx, ry, 1, 4, 2); }
    if (fx.snow > 0) for (i = 0; i < 30; i++) { var sx = (i * 41 + Math.sin(t * 2 + i) * 6 + LW) % LW, sy = (i * 29 + t * 30) % LH; px(sx, sy, 2, 2, fx.night > 0 ? 3 : 1); }
    if (fx.bird >= 0) {
      var bx = -12 + fx.bird * 92, by = 40 + Math.sin(fx.bird * 6) * 4, up = Math.floor(fx.bird * 10) % 2;
      px(bx, by, 6, 3, 3); px(bx + 6, by - 1, 3, 3, 3); px(bx + 1, by + (up ? -3 : 2), 3, 2, 3);
    }
    if (fx.ghost > 0) {  /* 下からおばけが出てくる */
      var gy = LH - Math.min(1, Math.min(fx.ghost, 1.6 - fx.ghost) * 3) * 50, gx = 50 + Math.sin(fx.ghost * 5) * 3;
      px(gx, gy, 14, 14, 1); px(gx + 2, gy - 2, 10, 2, 1);
      for (var k = 0; k < 3; k++) px(gx + k * 5, gy + 14, 4, 2, 1);
      px(gx + 3, gy + 4, 2, 3, 3); px(gx + 9, gy + 4, 2, 3, 3);
    }
    fx.parts.forEach(function (q) {
      var x = q.x, y = q.y;
      if (q.k === "heart") { px(x, y, 2, 2, 3); px(x + 3, y, 2, 2, 3); px(x, y + 1, 5, 2, 3); px(x + 1, y + 3, 3, 1, 3); px(x + 2, y + 4, 1, 1, 3); }
      else if (q.k === "star") { px(x, y - 1, 1, 3, 3); px(x - 1, y, 3, 1, 3); }
      else if (q.k === "note") { px(x + 3, y - 6, 1, 6, 3); px(x, y, 4, 2, 3); px(x + 3, y - 6, 3, 2, 3); }
      else if (q.k === "puff") { px(x - 2, y - 2, 5, 4, 1); px(x - 1, y - 3, 3, 6, 1); }
      else if (q.k === "coin") { var wv = Math.abs(Math.sin(q.life * 9)) * 3 + 1; px(x + 3 - wv / 2, y, wv, 6, 3); }
    });
  }
  /* 画面全体にかける効果（反転・上下左右の裏返し・揺れ・乱れ・消灯） */
  function postFx() {
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    if (fx.glitch > 0) {
      for (var i = 0; i < 6; i++) {
        var y = Math.floor(Math.random() * LH), h = 2 + Math.floor(Math.random() * 10), d = Math.floor(Math.random() * 30 - 15);
        lctx.drawImage(lcd, 0, y, LW, h, d, y, LW, h);
      }
    }
    if (fx.flipV > 0 || fx.flipH > 0 || fx.shake > 0) {
      tctx.clearRect(0, 0, LW, LH); tctx.drawImage(lcd, 0, 0);
      var sx = fx.shake > 0 ? Math.round((Math.random() - 0.5) * 10 * fx.shake) : 0, sy = fx.shake > 0 ? Math.round((Math.random() - 0.5) * 10 * fx.shake) : 0;
      lctx.fillStyle = PAL[3]; lctx.fillRect(0, 0, LW, LH);
      lctx.setTransform(fx.flipH > 0 ? -1 : 1, 0, 0, fx.flipV > 0 ? -1 : 1, (fx.flipH > 0 ? LW : 0) + sx, (fx.flipV > 0 ? LH : 0) + sy);
      lctx.drawImage(tmp, 0, 0);
      lctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    if (fx.invert > 0) { lctx.globalCompositeOperation = "difference"; lctx.fillStyle = "#fff"; lctx.fillRect(0, 0, LW, LH); lctx.globalCompositeOperation = "source-over"; }
    if (fx.off > 0) { lctx.fillStyle = "#141c20"; lctx.fillRect(0, 0, LW, LH); }
  }
  function drawPlayer() {
    var x = Math.round(P.x), y = Math.round(P.y), f = P.face;
    if (dead >= 0) lctx.globalAlpha = Math.max(0, 1 - dead * 1.5);
    px(x + 1, y, 4, 3, 3);
    px(f > 0 ? x + 3 : x + 1, y + 1, 1, 1, 0);
    px(x, y + 3, 6, 3, 3);
    var leg = P.ground ? (Math.floor(P.walk) % 2) : 1;
    if (!P.ground) { px(x - 1, y + 6, 2, 2, 3); px(x + 5, y + 5, 2, 2, 3); }
    else { px(x + (leg ? 0 : 1), y + 6, 2, 2, 3); px(x + (leg ? 4 : 3), y + 6, 2, 2, 3); }
    lctx.globalAlpha = 1;
  }

  function isReal(i) { return i === real.L || i === real.R || i === real.A; }
  function drawFlat() {
    var k = flatK();
    ctx.fillStyle = "#3a2a20"; ctx.fillRect(0, 0, W, H);
    roundRect(W / 2 - BODY.w / 2 * k, H / 2 - BODY.l / 2 * k, BODY.w * k, BODY.l * k, k);
    ctx.fillStyle = "#f0c85a"; ctx.fill();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lcd, W / 2 - 3.75 * k, H / 2 + (-6.2 - 3) * k, 7.5 * k, 6 * k);
    BTNS.forEach(function (b, i) {
      var c = btnAt(i);
      ctx.fillStyle = mark && isReal(i) ? "#fff" : cssCol(b.col);
      ctx.beginPath(); ctx.arc(c.x, c.y + (down(i) ? 2 : 0), c.r, 0, Math.PI * 2); ctx.fill();
    });
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(lcd, BTNS); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    drawLCD();
    var s3 = scene3d(), drew = false;
    if (s3) {
      try {
        s3.sync({ pressed: BTNS.map(function (b, i) { return down(i); }), mark: mark ? BTNS.map(function (b, i) { return isReal(i) || i === big; }) : null,
          anim: chaos ? chaos.p : null,
          bounce: fx.bounce, wave: fx.wave, pop: BTNS.map(function (b, i) { return fx.pop[i] ? Math.sin(fx.pop[i] * Math.PI) * 2.5 : 0; }), lamp: fx.lamp });
        drew = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); }
    }
    if (!drew) drawFlat();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。秒数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var r = bs[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s", "초", "秒", "秒"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (r) {
      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      roundRect(-r.w / 2, -r.h / 2, r.w, r.h, r.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, r.label, 0, 1, 30)) ctx.fillText(r.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, T: T, falls: falls, x: P && P.x, y: P && P.y, ground: P && P.ground, dead: dead, clear: clearT, W: W, H: H }; },
    real: function () { return real; },
    big: function () { return big; },
    btnAt: function (i) { return btnAt(i); },
    hitBtn: function (x, y) { return hitBtn(x, y); },
    press: function (i) { pressBtn(i); },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    keys: keys,
    jump: function () { jump(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
