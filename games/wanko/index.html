<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わんこ爆弾解除</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="../share.js"></script>
<script>
/* わんこ爆弾解除
   女将が奥から次々と爆弾を出してくる。導火線が尽きる前に解除しつづける。
   仕掛けは8種類。緑に光っているところを触る、で全部通る。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする */
  var W = 540, H = 960;
  var CX = 270, GROUND = 576, TABLE_Y = 544, END_Y = 701;
  var FACE = { x: 150, y: 354, w: 240, h: 140 };
  var WIRE_A = 55, WIRE_B = 485;

  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    CX = W / 2;
    GROUND = Math.round(H * 0.62);
    TABLE_Y = GROUND - 32;
    END_Y = GROUND + Math.round(H * 0.15);
    FACE.w = 240; FACE.h = 140;
    FACE.x = CX - FACE.w / 2;
    FACE.y = GROUND - 222;
    WIRE_A = CX - 215; WIRE_B = CX + 215;

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);

    if (bomb && kind.place) kind.place(bomb);
    for (var i = 0; i < pile.length; i++) {
      var s = pileSlot(i);
      pile[i].x = s.x; pile[i].y = s.y; pile[i].r = s.r;
    }
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, hissGain = null, hissFilter = null;

  function audioOn() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = AC.createBufferSource();
    src.buffer = NOISE; src.loop = true;
    hissFilter = AC.createBiquadFilter();
    hissFilter.type = "bandpass";
    hissFilter.frequency.value = 2400;
    hissFilter.Q.value = 0.8;
    hissGain = AC.createGain();
    hissGain.gain.value = 0;
    src.connect(hissFilter); hissFilter.connect(hissGain); hissGain.connect(AC.destination);
    src.start();
  }

  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain();
    var n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }

  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }

  function sfxServe() { noiseHit(0.12, 900, 0.22, 2); tone(300, 0.09, 0.1, "square"); }
  function sfxSnip()  { noiseHit(0.07, 3600, 0.4, 3); }
  function sfxClick() { noiseHit(0.04, 1800, 0.3, 4); tone(520, 0.05, 0.09, "square"); }
  function sfxTick()  { noiseHit(0.03, 5200, 0.16, 6); }
  function sfxOk()    { tone(880, 0.08, 0.14, "square"); tone(1320, 0.12, 0.12, "square", null, 0.07); }
  function sfxDone()  {
    tone(660, 0.09, 0.15, "triangle");
    tone(990, 0.09, 0.15, "triangle", null, 0.08);
    tone(1480, 0.22, 0.15, "triangle", null, 0.16);
  }
  function sfxBoom() {
    noiseHit(0.9, 220, 0.9, 0.4);
    noiseHit(0.5, 90, 0.9, 0.3);
    tone(180, 0.8, 0.5, "sine", 30);
  }

  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 道具 ============ */
  var GREEN = "#5dffa0", GREEN_D = "#1d6b45";
  var COLORS = ["#e8453a", "#3f9fe8", "#f0c93a", "#49bf62", "#f2f2f2", "#9a63de"];

  function bez(p, t) {
    var u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return { x: a * p[0].x + b * p[1].x + c * p[2].x + d * p[3].x,
             y: a * p[0].y + b * p[1].y + c * p[2].y + d * p[3].y };
  }
  function pathBez(p, t0, t1) {
    ctx.beginPath();
    var N = 24;
    for (var i = 0; i <= N; i++) {
      var q = bez(p, t0 + (t1 - t0) * i / N);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shuffled(n) {
    var a = [], i, j, k;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); k = a[i]; a[i] = a[j]; a[j] = k; }
    return a;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function spread(n, a, b) {
    var r = [];
    for (var i = 0; i < n; i++) r.push(n === 1 ? (a + b) / 2 : a + (b - a) * i / (n - 1));
    return r;
  }
  function angDiff(a, b) {
    var d = (a - b) % 6.283185;
    if (d > 3.14159) d -= 6.283185;
    if (d < -3.14159) d += 6.283185;
    return d;
  }

  function facePlate() {
    ctx.save();
    roundRect(FACE.x - 10, FACE.y - 10, FACE.w + 20, FACE.h + 20, 14);
    ctx.fillStyle = "#8d7038";
    ctx.fill();
    ctx.fillStyle = "#c6a559";
    for (var s = 0; s < 4; s++) {
      var sx = FACE.x - 10 + (s % 2) * (FACE.w + 20) + (s % 2 ? -10 : 10);
      var sy = FACE.y - 10 + (s > 1 ? FACE.h + 20 - 10 : 10);
      ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 6.284); ctx.fill();
    }
    roundRect(FACE.x, FACE.y, FACE.w, FACE.h, 8);
    ctx.fillStyle = "#0d1418";
    ctx.fill();
    ctx.strokeStyle = "rgba(90,200,150,.07)";
    ctx.lineWidth = 1;
    ctx.save(); ctx.clip();
    for (var x = FACE.x; x < FACE.x + FACE.w; x += 14) {
      ctx.beginPath(); ctx.moveTo(x, FACE.y); ctx.lineTo(x, FACE.y + FACE.h); ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  function lamp(x, y, r, on) {
    ctx.fillStyle = "#2b3038";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.fill();
    if (on) {
      ctx.save();
      ctx.shadowColor = "#4dff92";
      ctx.shadowBlur = 24 * (0.75 + 0.25 * Math.sin(T * 7));
      ctx.fillStyle = "#7cffae";
      ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 6.284); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = "#18301f";
      ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 6.284); ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.stroke();
  }

  function cursorRing(g, r) {
    if (!g.slots || cur < 0 || cur >= g.slots.length) return;
    var s = g.slots[cur];
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = -T * 18;
    ctx.beginPath(); ctx.arc(s.x, s.y, r + 6, 0, 6.284); ctx.stroke();
    ctx.restore();
  }

  /* ============ 胴体 ============ */
  var BODY = {
    round: {
      fuse: { x: 30, y: -328 },
      tray: 214,
      draw: function () {
        var cy = GROUND - 172, r = 172;
        var g = ctx.createRadialGradient(CX - 66, cy - 78, 24, CX, cy, r);
        g.addColorStop(0, "#454c56");
        g.addColorStop(0.55, "#1b1f25");
        g.addColorStop(1, "#090b0e");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(CX, cy, r, 0, 6.284); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.10)";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(CX, cy, r - 2, 0, 6.284); ctx.stroke();
        ctx.fillStyle = "#8d7038";
        ctx.beginPath();
        ctx.moveTo(CX + 8, cy - r + 16); ctx.lineTo(CX + 56, cy - r + 16);
        ctx.lineTo(CX + 50, cy - r - 12); ctx.lineTo(CX + 14, cy - r - 12);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#b8974f";
        ctx.fillRect(CX + 4, cy - r + 10, 58, 9);
      }
    },
    box: {
      fuse: { x: 110, y: -288 },
      tray: 190,
      draw: function () {
        var w = 356, x = CX - w / 2, y = GROUND - 288, h = 288;
        var g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, "#5b4a34");
        g.addColorStop(0.5, "#3d3122");
        g.addColorStop(1, "#241c14");
        ctx.fillStyle = g;
        roundRect(x, y, w, h, 14); ctx.fill();
        ctx.strokeStyle = "#7d6640";
        ctx.lineWidth = 4;
        roundRect(x + 8, y + 8, w - 16, h - 16, 10); ctx.stroke();
        ctx.strokeStyle = "#2b2218";
        ctx.lineWidth = 12; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + 124, y + 2);
        ctx.quadraticCurveTo(x + w / 2, y - 46, x + w - 124, y + 2);
        ctx.stroke();
        ctx.fillStyle = "#c6a559";
        roundRect(x + 36, y + h - 36, 44, 26, 5); ctx.fill();
        roundRect(x + w - 80, y + h - 36, 44, 26, 5); ctx.fill();
      }
    },
    drum: {
      fuse: { x: -10, y: -292 },
      tray: 168,
      draw: function () {
        var w = 284, x = CX - w / 2, y = GROUND - 292, h = 274;
        var g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, "#22331f");
        g.addColorStop(0.35, "#4e6b41");
        g.addColorStop(0.7, "#2e4227");
        g.addColorStop(1, "#1a2617");
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
        ctx.beginPath(); ctx.ellipse(CX, y + h, w / 2, 18, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "#5d7d4e";
        ctx.beginPath(); ctx.ellipse(CX, y, w / 2, 18, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "#425c37";
        ctx.beginPath(); ctx.ellipse(CX, y, w / 2 - 12, 12, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(x, y + 34, w, 13);
        ctx.fillRect(x, y + h - 44, w, 13);
      }
    },
    pipe: {
      fuse: { x: 130, y: -236 },
      tray: 200,
      draw: function () {
        var w = 428, x = CX - w / 2, y = GROUND - 244, h = 244, r = h / 2;
        var g = ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, "#767d86");
        g.addColorStop(0.4, "#3d444d");
        g.addColorStop(1, "#191d22");
        ctx.fillStyle = g;
        roundRect(x, y, w, h, r); ctx.fill();
        ctx.fillStyle = "#5a626c";
        ctx.beginPath(); ctx.ellipse(x + 28, y + r, 20, r - 6, 0, 0, 6.284); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + w - 28, y + r, 20, r - 6, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "rgba(210,150,60,.55)";
        ctx.fillRect(x + 66, y + 14, 22, h - 28);
        ctx.fillRect(x + w - 88, y + 14, 22, h - 28);
      }
    }
  };

  var FUSE_PATH = [{ x: 0, y: 0 }, { x: 30, y: -70 }, { x: 86, y: -40 }, { x: 120, y: -96 }];

  /* ============ 仕掛け ============ */
  var TYPES = {};

  /* --- 配線を切る --- */
  TYPES.wire = {
    body: "round",
    make: function (g, k) {
      var n = k >= 16 ? 5 : (k >= 7 ? 4 : 3);
      g.n = n;
      var perm = shuffled(n), tries = 0, i, same;
      while (tries++ < 40) {
        same = 0;
        for (i = 0; i < n; i++) if (perm[i] === i) same++;
        if (same === 0) break;
        perm = shuffled(n);
      }
      g.perm = perm;
      g.lit = Math.floor(Math.random() * n);
      g.cols = shuffled(COLORS.length).slice(0, n).map(function (v) { return COLORS[v]; });
      g.z = shuffled(n);
      g.cut = [];
      for (i = 0; i < n; i++) g.cut.push(false);
      g.ct = 0;
      TYPES.wire.place(g);
    },
    place: function (g) {
      var n = g.n, i;
      g.lampY = FACE.y + 30;
      g.termY = FACE.y + FACE.h - 26;
      g.lx = spread(n, FACE.x + 34, FACE.x + FACE.w - 34);
      var ex = spread(n, WIRE_A, WIRE_B);
      g.wires = [];
      g.slots = [];
      for (i = 0; i < n; i++) {
        var p = [{ x: g.lx[i], y: g.termY }, { x: g.lx[i], y: g.termY + (END_Y - g.termY) * 0.45 },
                 { x: ex[i], y: END_Y - (END_Y - g.termY) * 0.55 }, { x: ex[i], y: END_Y }];
        g.wires.push({ color: g.cols[i], p: p });
        g.slots.push(bez(p, 0.6));
      }
      g.inner = [];
      for (i = 0; i < n; i++) {
        var x1 = g.lx[i], x2 = g.lx[g.perm[i]], mid = (g.termY - g.lampY) * 0.62;
        g.inner.push([{ x: x1, y: g.lampY }, { x: x1, y: g.lampY + mid },
                      { x: x2, y: g.termY - mid }, { x: x2, y: g.termY }]);
      }
    },
    act: function (g, i) {
      if (g.cut[i]) return;
      g.cut[i] = true; g.ct = 0;
      sfxSnip();
      spark(g.slots[i].x, g.slots[i].y, 12, "#ffe08a", 150);
      if (g.perm[g.lit] === i) solve(); else fail();
    },
    tick: function (g, dt) { if (g.cut.indexOf(true) >= 0) g.ct += dt; },
    draw: function (g) {
      facePlate();
      ctx.save();
      roundRect(FACE.x, FACE.y, FACE.w, FACE.h, 8);
      ctx.clip();
      for (var k = 0; k < g.n; k++) {
        var p = g.inner[g.z[k]];
        ctx.lineCap = "round";
        ctx.strokeStyle = "#05090b"; ctx.lineWidth = 13; pathBez(p, 0, 1); ctx.stroke();
        ctx.strokeStyle = "#9a8f7c"; ctx.lineWidth = 7; pathBez(p, 0, 1); ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 2; pathBez(p, 0, 1); ctx.stroke();
      }
      ctx.restore();
      for (var i = 0; i < g.n; i++) {
        lamp(g.lx[i], g.lampY, 12, g.lit === i);
        ctx.fillStyle = "#c6a559";
        roundRect(g.lx[i] - 9, g.termY - 8, 18, 16, 4);
        ctx.fill();
      }
    },
    drawFront: function (g) {
      for (var j = 0; j < g.n; j++) {
        var p = g.wires[j].p, col = g.wires[j].color;
        ctx.lineCap = "round";
        if (!g.cut[j]) {
          ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 15; pathBez(p, 0, 1); ctx.stroke();
          ctx.strokeStyle = col; ctx.lineWidth = 10; pathBez(p, 0, 1); ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 2.5; pathBez(p, 0.02, 0.98); ctx.stroke();
        } else {
          ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 15; pathBez(p, 0, 0.55); ctx.stroke();
          ctx.strokeStyle = col; ctx.lineWidth = 10; pathBez(p, 0, 0.55); ctx.stroke();
          ctx.save();
          ctx.translate(Math.sin(g.ct * 6) * 10, Math.min(320, 700 * g.ct * g.ct));
          ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 15; pathBez(p, 0.62, 1); ctx.stroke();
          ctx.strokeStyle = col; ctx.lineWidth = 10; pathBez(p, 0.62, 1); ctx.stroke();
          ctx.restore();
        }
      }
      nipper(g);
    }
  };

  function nipper(g) {
    if (cur < 0 || cur >= g.n || g.cut[cur]) return;
    var p = g.wires[cur].p;
    var a = bez(p, 0.54), b = bez(p, 0.66), q = g.slots[cur];
    var ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
    if (Math.cos(ang) < 0) ang -= Math.PI;                 /* 柄がいつも下を向くように */
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(ang);
    var open = (10 + Math.sin(T * 4) * 2) * Math.PI / 180;
    for (var s = -1; s <= 1; s += 2) {
      ctx.save();
      ctx.rotate(s * open);
      ctx.fillStyle = "#cfd6de";
      ctx.beginPath();
      ctx.moveTo(-4, -6); ctx.lineTo(4, -6); ctx.lineTo(6, 26); ctx.lineTo(-6, 26);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c8352c";
      roundRect(-9, 26, 18, 58, 8); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = "#8f98a4";
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, 6.284); ctx.fill();
    ctx.restore();
  }

  /* --- 同じ色のボタン --- */
  TYPES.color = {
    body: "box",
    make: function (g, k) {
      g.n = 4;
      g.cols = shuffled(COLORS.length).slice(0, g.n).map(function (v) { return COLORS[v]; });
      g.target = Math.floor(Math.random() * g.n);
      g.press = -1;
      TYPES.color.place(g);
    },
    place: function (g) {
      var xs = spread(g.n, FACE.x + 44, FACE.x + FACE.w - 44);
      g.slots = xs.map(function (x) { return { x: x, y: FACE.y + 104 }; });
    },
    act: function (g, i) {
      g.press = i;
      sfxClick();
      if (i === g.target) solve(); else fail();
    },
    draw: function (g) {
      facePlate();
      var wx = CX, wy = FACE.y + 42;
      ctx.fillStyle = "#05090b";
      roundRect(wx - 46, wy - 22, 92, 44, 10); ctx.fill();
      ctx.save();
      ctx.shadowColor = g.cols[g.target];
      ctx.shadowBlur = 26;
      ctx.fillStyle = g.cols[g.target];
      ctx.beginPath(); ctx.arc(wx, wy, 15, 0, 6.284); ctx.fill();
      ctx.restore();
      for (var i = 0; i < g.n; i++) {
        var s = g.slots[i], down = g.press === i;
        ctx.fillStyle = "rgba(0,0,0,.6)";
        ctx.beginPath(); ctx.arc(s.x, s.y + 5, 24, 0, 6.284); ctx.fill();
        ctx.fillStyle = g.cols[i];
        ctx.beginPath(); ctx.arc(s.x, s.y + (down ? 4 : 0), 23, 0, 6.284); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.3)";
        ctx.beginPath(); ctx.arc(s.x - 7, s.y - 8 + (down ? 4 : 0), 7, 0, 6.284); ctx.fill();
      }
      cursorRing(g, 30);
    }
  };

  /* --- スイッチを倒す --- */

    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function doShare() {
    zShare({ text: score + "個目で爆散しました #わんこ爆弾解除" });
  }

  function nearSlot(x, y) {
    if (!bomb.slots) return -1;
    var best = -1, bd = 52 * 52;
    for (var i = 0; i < bomb.slots.length; i++) {
      var s = bomb.slots[i], dx = s.x - x, dy = s.y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function down(x, y) {
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "share") doShare();
      else if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    held = true;
    if (bomb.slots) {
      var i = x == null ? cur : nearSlot(x, y);
      if (i >= 0) { cur = i; if (kind.act) kind.act(bomb, i); }
      return;
    }
    if (kind.drag && x != null) kind.drag(bomb, x, y);
    if (kind.press) kind.press(bomb);
  }

  function up() {
    if (!held) return;
    held = false;
    if (state === S.PLAY && kind.release) kind.release(bomb);
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }

  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e);
    down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (state !== S.PLAY) return;
    var p = atCanvas(e);
    if (bomb.slots) {
      var i = nearSlot(p.x, p.y);
      if (i >= 0) cur = i;
    } else if (kind.drag && held) kind.drag(bomb, p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      var d = right ? 1 : -1;
      if (bomb.slots) cur = (cur + d + bomb.slots.length) % bomb.slots.length;
      else if (kind.dir) kind.dir(bomb, d);
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") up();
  });

  /* ============ 描画 ============ */
  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#241c18");
    g.addColorStop(1, "#120f0d");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var wx = 24, ww = W - 48, wy = 24, wh = TABLE_Y - 40;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#3a2c20";
    ctx.fillRect(wx, wy, ww, wh);
    ctx.fillStyle = "#2a2018";
    for (var x = wx + 62; x < wx + ww; x += 62) ctx.fillRect(x - 3, wy, 6, wh);
    for (var y = wy + 62; y < wy + wh; y += 62) ctx.fillRect(wx, y - 3, ww, 6);
    ctx.restore();

    var tg = ctx.createLinearGradient(0, TABLE_Y, 0, H);
    tg.addColorStop(0, "#5a3d29");
    tg.addColorStop(0.06, "#46301f");
    tg.addColorStop(1, "#2a1c13");
    ctx.fillStyle = tg;
    ctx.fillRect(0, TABLE_Y, W, H - TABLE_Y);
    ctx.fillStyle = "rgba(255,220,170,.08)";
    ctx.fillRect(0, TABLE_Y, W, 4);
  }

  function drawTray() {
    var rx = BODY[bomb.body].tray, y = GROUND - 4;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(CX, y + 10, rx, 28, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#7d2b20";
    ctx.beginPath(); ctx.ellipse(CX, y, rx, 26, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#98392a";
    ctx.beginPath(); ctx.ellipse(CX, y - 5, rx - 16, 21, 0, 0, 6.284); ctx.fill();
    ctx.strokeStyle = "rgba(255,200,160,.25)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(CX, y - 5, rx - 16, 21, 0, 0, 6.284); ctx.stroke();
    ctx.restore();
  }

  function drawMini(x, y, r, body, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.2);
    g.addColorStop(0, "#4a515b");
    g.addColorStop(0.6, "#1c2027");
    g.addColorStop(1, "#0b0d11");
    ctx.fillStyle = g;
    if (body === "box") {
      roundRect(-r, -r * 0.8, r * 2, r * 1.6, 3); ctx.fill();
      ctx.strokeStyle = "#a8834a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.85); ctx.quadraticCurveTo(0, -r * 1.5, r * 0.5, -r * 0.85); ctx.stroke();
    } else if (body === "drum") {
      ctx.fillStyle = "#37502d";
      roundRect(-r * 0.7, -r, r * 1.4, r * 2, 3); ctx.fill();
      ctx.fillStyle = "#5d7d4e";
      ctx.beginPath(); ctx.ellipse(0, -r, r * 0.7, r * 0.24, 0, 0, 6.284); ctx.fill();
    } else if (body === "pipe") {
      ctx.fillStyle = "#4b535c";
      roundRect(-r * 1.2, -r * 0.5, r * 2.4, r, r * 0.5); ctx.fill();
      ctx.fillStyle = "rgba(210,150,60,.6)";
      ctx.fillRect(-r * 0.6, -r * 0.5, r * 0.3, r);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.284); ctx.fill();
      ctx.strokeStyle = "#a8834a";
      ctx.lineWidth = Math.max(1.5, r * 0.12);
      ctx.beginPath(); ctx.arc(0, -r * 0.9, r * 0.28, 0, 6.284); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPile() {
    for (var i = 0; i < pile.length; i++) {
      if (state === S.PASS && i === pile.length - 1) continue;
      var s = pile[i];
      drawMini(s.x, s.y, s.r, s.body, (i % 3 - 1) * 0.16);
    }
  }

  function drawFuse() {
    var a = BODY[bomb.body].fuse, f = bomb.fuse;
    if (f <= 0.001) return;
    ctx.save();
    ctx.translate(CX + a.x, GROUND + a.y);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#c0a878"; ctx.lineWidth = 8;
    pathBez(FUSE_PATH, 0, f); ctx.stroke();
    ctx.strokeStyle = "#8d7749"; ctx.lineWidth = 3;
    pathBez(FUSE_PATH, 0, f); ctx.stroke();
    var tip = bez(FUSE_PATH, f), fl = 0.7 + Math.random() * 0.6;
    ctx.fillStyle = "#fff0b0";
    ctx.shadowColor = "#ffb43a";
    ctx.shadowBlur = 26 * fl;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 6 * fl, 0, 6.284); ctx.fill();
    ctx.restore();
  }

  function drawBomb() {
    var pos = bombPos();
    if (state === S.BOOM || state === S.RESULT) return;
    if (state === S.PASS && pos.gone) return;
    var cy = GROUND - 150;
    ctx.save();
    ctx.translate(CX + pos.x, cy + pos.y);
    ctx.rotate(pos.rot || 0);
    ctx.scale(pos.s, pos.s);
    ctx.translate(-CX, -cy);
    drawTray();
    drawFuse();
    BODY[bomb.body].draw();
    kind.draw(bomb);
    if (kind.drawFront) kind.drawFront(bomb);
    ctx.restore();
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.c;
      if (p.chunk) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.age * 6);
        ctx.fillRect(-p.r, -p.r * 0.7, p.r * 2, p.r * 1.4);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a + 0.5, 0, 6.284); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawButton(b) {
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    var hw = b.w / 2, hh = b.h / 2, rad = hh;
    ctx.beginPath();
    ctx.moveTo(-hw + rad, -hh);
    ctx.arcTo(hw, -hh, hw, hh, rad);
    ctx.arcTo(hw, hh, -hw, hh, rad);
    ctx.arcTo(-hw, hh, -hw, -hh, rad);
    ctx.arcTo(-hw, -hh, hw, -hh, rad);
    ctx.closePath();
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#16202e";
    ctx.stroke();
    ctx.fillStyle = "#16202e";
    ctx.font = "800 24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.label, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    drawOkami();
    drawPile();
    drawBomb();
    drawParts();
    drawSay();
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,238,200," + Math.min(1, flash) + ")";
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    ctx.restore();

    if (state === S.RESULT) {
      ctx.fillStyle = "rgba(10,8,6,.66)";
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(0,0,0,.6)";
      ctx.shadowBlur = 10;
      ctx.font = "800 108px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(score), W / 2, H * 0.45);
      ctx.restore();
      resultButtons().forEach(drawButton);
    }
  }

  /* ============ ループ ============ */
  newRound();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
