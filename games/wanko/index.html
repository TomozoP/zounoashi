<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わんこボマー</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="../share.js"></script>
<script src="../pad.js"></script>
<script>
/* わんこボマー
   女将が奥から次々と爆弾を出してくる。導火線が尽きる前に解除しつづける。
   仕掛けは10種類。緑に光っているところを触る、で全部通る。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする */
  var W = 540, H = 960;
  var CX = 270, GROUND = 576, TABLE_Y = 544, END_Y = 701;
  var FACE = { x: 150, y: 354, w: 240, h: 140 };
  var WIRE_A = 55, WIRE_B = 485;

  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    CX = W / 2;
    GROUND = Math.round(H * 0.67);
    TABLE_Y = GROUND - 32;
    END_Y = GROUND + Math.round(H * 0.15);
    FACE.w = 240; FACE.h = 140;
    FACE.x = CX - FACE.w / 2;
    FACE.y = GROUND - 222;
    WIRE_A = CX - 215; WIRE_B = CX + 215;

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);

    if (bombs) {
      for (var qi = 0; qi < bombs.length; qi++) {
        bombs[qi].tf = slotTf(qi, bombs.length);
        if (bombs[qi].kind.place) withBomb(bombs[qi], function (g) { g.kind.place(g); });
      }
      layoutTwin();
    }
    for (var i = 0; i < pile.length; i++) {
      var s = pileSlot(i);
      pile[i].x = s.x; pile[i].y = s.y; pile[i].r = s.r;
    }
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* 色を回す描画が使えるか（虹色の女将に使う） */
  var CAN_FILTER = false;
  try { ctx.filter = "hue-rotate(90deg)"; CAN_FILTER = ctx.filter !== "none"; ctx.filter = "none"; }
  catch (e) { CAN_FILTER = false; }

  /* ============ 音 ============ */
  var AC = null, NOISE = null, hissGain = null, hissFilter = null;

  function audioOn() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = AC.createBufferSource();
    src.buffer = NOISE; src.loop = true;
    hissFilter = AC.createBiquadFilter();
    hissFilter.type = "bandpass";
    hissFilter.frequency.value = 2400;
    hissFilter.Q.value = 0.8;
    hissGain = AC.createGain();
    hissGain.gain.value = 0;
    src.connect(hissFilter); hissFilter.connect(hissGain); hissGain.connect(AC.destination);
    src.start();

    bgmGain = AC.createGain();
    bgmGain.gain.value = 0.16;
    bgmGain.connect(AC.destination);
    bgmNext = AC.currentTime + 0.15;
  }

  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain();
    var n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }

  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }

  function sfxServe() { noiseHit(0.12, 900, 0.22, 2); tone(300, 0.09, 0.1, "square"); }
  function sfxSnip()  { noiseHit(0.07, 3600, 0.4, 3); }
  function sfxClick() { noiseHit(0.04, 1800, 0.3, 4); tone(520, 0.05, 0.09, "square"); }
  function sfxTick()  { noiseHit(0.03, 5200, 0.16, 6); }
  function sfxOk()    { tone(880, 0.08, 0.14, "square"); tone(1320, 0.12, 0.12, "square", null, 0.07); }
  function sfxDone()  {
    tone(660, 0.09, 0.15, "triangle");
    tone(990, 0.09, 0.15, "triangle", null, 0.08);
    tone(1480, 0.22, 0.15, "triangle", null, 0.16);
  }
  function sfxBoom() {
    noiseHit(0.9, 220, 0.9, 0.4);
    noiseHit(0.5, 90, 0.9, 0.3);
    tone(180, 0.8, 0.5, "sine", 30);
  }

  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ BGM ============ */
  /* ヨナ抜き音階の短い句を、箏っぽい音で並べ続ける。店の有線みたいな薄さで鳴らす */
  var bgmGain = null, bgmNext = 0, bgmBar = 0;
  var PENTA = [0, 2, 4, 7, 9];
  var PHRASES = [
    [4, -1, 3, 2, -1, 3, 4, -1],
    [2, 3, 4, -1, 5, 4, -1, 3],
    [4, 4, 3, -1, 2, -1, 1, -1],
    [0, 2, 3, -1, 4, 3, 2, -1],
    [5, 4, -1, 3, 4, -1, 2, -1],
    [3, -1, 4, 5, -1, 4, 3, -1]
  ];
  var BEAT = 0.42;                                  /* 8分音符の長さ */

  function penta(i, oct) {
    var k = ((i % 5) + 5) % 5;
    var step = PENTA[k] + 12 * (Math.floor(i / 5) + (oct || 0));
    return 261.63 * Math.pow(2, step / 12);
  }

  function koto(freq, at, vol, dur) {
    var o = AC.createOscillator(), o2 = AC.createOscillator();
    var f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    o2.type = "sine"; o2.frequency.value = freq * 2.01;
    f.type = "lowpass";
    f.frequency.setValueAtTime(4200, at);
    f.frequency.exponentialRampToValueAtTime(800, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(bgmGain);
    o.start(at); o2.start(at); o.stop(at + dur + 0.05); o2.stop(at + dur + 0.05);
  }

  function tsuzumi(at, vol) {
    if (!NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.playbackRate.value = 0.5;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 320; f.Q.value = 3;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
    s.connect(f); f.connect(g); g.connect(bgmGain);
    s.start(at); s.stop(at + 0.25);
  }

  /* 連結が出ている間は、倍の速さで一段にぎやかに鳴らす */
  var bgmHot = false;
  function bgmSchedule() {
    if (!AC || !bgmGain) return;
    while (bgmNext < AC.currentTime + 1.2) {
      var hot = bgmHot, bt = hot ? BEAT * 0.5 : BEAT;
      var at = Math.max(bgmNext, AC.currentTime + 0.05);
      var ph = PHRASES[(bgmBar * 3 + Math.floor(bgmBar / 4)) % PHRASES.length];
      var root = [0, 0, 4, 3][bgmBar % 4];
      koto(penta(root, -2), at, hot ? 0.24 : 0.20, bt * 3.1);        /* 低音 */
      koto(penta(root + 2, -2), at + bt * 4, hot ? 0.18 : 0.14, bt * 2.4);
      if (hot) {
        for (var t = 0; t < 8; t += 2) tsuzumi(at + bt * t, 0.11);   /* 拍を打つ */
      } else {
        tsuzumi(at + BEAT * 2, 0.10);
        tsuzumi(at + BEAT * 6, 0.07);
      }
      for (var i = 0; i < 8; i++) {
        if (ph[i] < 0) continue;
        koto(penta(ph[i], 0), at + bt * i, hot ? 0.19 : 0.17, bt * 2.0);
        if (hot) koto(penta(ph[i] + 5, 0), at + bt * i + 0.012, 0.09, bt * 1.4);  /* 重ねる */
      }
      bgmNext = at + bt * 8;
      bgmBar++;
    }
  }

  function bgmDuck(v, sec) {
    if (!bgmGain) return;
    var n = AC.currentTime;
    bgmGain.gain.cancelScheduledValues(n);
    bgmGain.gain.setValueAtTime(bgmGain.gain.value, n);
    bgmGain.gain.linearRampToValueAtTime(v, n + sec);
  }

  /* ============ 道具 ============ */
  var GREEN = "#5dffa0", GREEN_D = "#1d6b45";
  var COLORS = ["#e8453a", "#3f9fe8", "#f0c93a", "#49bf62", "#f2f2f2", "#9a63de"];

  function bez(p, t) {
    var u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return { x: a * p[0].x + b * p[1].x + c * p[2].x + d * p[3].x,
             y: a * p[0].y + b * p[1].y + c * p[2].y + d * p[3].y };
  }
  /* 曲線と点の距離（2乗）。線の上を触ったか調べるのに使う */
  function bezDist2(p, x, y) {
    var best = Infinity;
    for (var i = 0; i <= 24; i++) {
      var q = bez(p, i / 24), dx = q.x - x, dy = q.y - y, d = dx * dx + dy * dy;
      if (d < best) best = d;
    }
    return best;
  }
  function pathBez(p, t0, t1) {
    ctx.beginPath();
    var N = 24;
    for (var i = 0; i <= N; i++) {
      var q = bez(p, t0 + (t1 - t0) * i / N);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shuffled(n) {
    var a = [], i, j, k;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); k = a[i]; a[i] = a[j]; a[j] = k; }
    return a;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function spread(n, a, b) {
    var r = [];
    for (var i = 0; i < n; i++) r.push(n === 1 ? (a + b) / 2 : a + (b - a) * i / (n - 1));
    return r;
  }
  function angDiff(a, b) {
    var d = (a - b) % 6.283185;
    if (d > 3.14159) d -= 6.283185;
    if (d < -3.14159) d += 6.283185;
    return d;
  }

  /* 面板。r を渡すと、その仕掛けだけ大きさを変えられる */
  function facePlate(r) {
    r = r || FACE;
    ctx.save();
    roundRect(r.x - 10, r.y - 10, r.w + 20, r.h + 20, 14);
    ctx.fillStyle = "#8d7038";
    ctx.fill();
    ctx.fillStyle = "#c6a559";
    for (var s = 0; s < 4; s++) {
      var sx = r.x - 10 + (s % 2) * (r.w + 20) + (s % 2 ? -10 : 10);
      var sy = r.y - 10 + (s > 1 ? r.h + 20 - 10 : 10);
      ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 6.284); ctx.fill();
    }
    roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = "#0d1418";
    ctx.fill();
    ctx.strokeStyle = "rgba(90,200,150,.07)";
    ctx.lineWidth = 1;
    ctx.save(); ctx.clip();
    for (var x = r.x; x < r.x + r.w; x += 14) {
      ctx.beginPath(); ctx.moveTo(x, r.y); ctx.lineTo(x, r.y + r.h); ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  function lamp(x, y, r, on) {
    ctx.fillStyle = "#2b3038";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.fill();
    if (on) {
      ctx.save();
      ctx.shadowColor = "#4dff92";
      ctx.shadowBlur = 24 * (0.75 + 0.25 * Math.sin(T * 7));
      ctx.fillStyle = "#7cffae";
      ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 6.284); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = "#18301f";
      ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 6.284); ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.stroke();
  }

  /* キーで遊んでいるときだけ、どこを選んでいるか出す（触って遊ぶぶんには出ない） */
  function cursorRing(g, r) {
    if (!keyMode || !g.slots || cur < 0 || cur >= g.slots.length) return;
    var s = g.slots[cur];
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = -T * 18;
    ctx.beginPath(); ctx.arc(s.x, s.y, r + 6, 0, 6.284); ctx.stroke();
    ctx.restore();
  }

  /* ============ 胴体 ============ */
  var BODY = {
    round: {
      fuse: { x: 30, y: -328 },
      tray: 214,
      draw: function () {
        var cy = GROUND - 172, r = 172;
        var g = ctx.createRadialGradient(CX - 66, cy - 78, 24, CX, cy, r);
        g.addColorStop(0, "#454c56");
        g.addColorStop(0.55, "#1b1f25");
        g.addColorStop(1, "#090b0e");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(CX, cy, r, 0, 6.284); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.10)";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(CX, cy, r - 2, 0, 6.284); ctx.stroke();
        ctx.fillStyle = "#8d7038";
        ctx.beginPath();
        ctx.moveTo(CX + 8, cy - r + 16); ctx.lineTo(CX + 56, cy - r + 16);
        ctx.lineTo(CX + 50, cy - r - 12); ctx.lineTo(CX + 14, cy - r - 12);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#b8974f";
        ctx.fillRect(CX + 4, cy - r + 10, 58, 9);
      }
    },
    box: {
      fuse: { x: 110, y: -288 },
      tray: 190,
      draw: function () {
        var w = 356, x = CX - w / 2, y = GROUND - 288, h = 288;
        var g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, "#5b4a34");
        g.addColorStop(0.5, "#3d3122");
        g.addColorStop(1, "#241c14");
        ctx.fillStyle = g;
        roundRect(x, y, w, h, 14); ctx.fill();
        ctx.strokeStyle = "#7d6640";
        ctx.lineWidth = 4;
        roundRect(x + 8, y + 8, w - 16, h - 16, 10); ctx.stroke();
        ctx.strokeStyle = "#2b2218";
        ctx.lineWidth = 12; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + 124, y + 2);
        ctx.quadraticCurveTo(x + w / 2, y - 46, x + w - 124, y + 2);
        ctx.stroke();
        ctx.fillStyle = "#c6a559";
        roundRect(x + 36, y + h - 36, 44, 26, 5); ctx.fill();
        roundRect(x + w - 80, y + h - 36, 44, 26, 5); ctx.fill();
      }
    },
    drum: {
      fuse: { x: -10, y: -292 },
      tray: 168,
      draw: function () {
        var w = 284, x = CX - w / 2, y = GROUND - 292, h = 274;
        var g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, "#22331f");
        g.addColorStop(0.35, "#4e6b41");
        g.addColorStop(0.7, "#2e4227");
        g.addColorStop(1, "#1a2617");
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
        ctx.beginPath(); ctx.ellipse(CX, y + h, w / 2, 18, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "#5d7d4e";
        ctx.beginPath(); ctx.ellipse(CX, y, w / 2, 18, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "#425c37";
        ctx.beginPath(); ctx.ellipse(CX, y, w / 2 - 12, 12, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(x, y + 34, w, 13);
        ctx.fillRect(x, y + h - 44, w, 13);
      }
    },
    pipe: {
      fuse: { x: 130, y: -236 },
      tray: 200,
      draw: function () {
        var w = 428, x = CX - w / 2, y = GROUND - 244, h = 244, r = h / 2;
        var g = ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, "#767d86");
        g.addColorStop(0.4, "#3d444d");
        g.addColorStop(1, "#191d22");
        ctx.fillStyle = g;
        roundRect(x, y, w, h, r); ctx.fill();
        ctx.fillStyle = "#5a626c";
        ctx.beginPath(); ctx.ellipse(x + 28, y + r, 20, r - 6, 0, 0, 6.284); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + w - 28, y + r, 20, r - 6, 0, 0, 6.284); ctx.fill();
        ctx.fillStyle = "rgba(210,150,60,.55)";
        ctx.fillRect(x + 66, y + 14, 22, h - 28);
        ctx.fillRect(x + w - 88, y + 14, 22, h - 28);
      }
    }
  };

  var FUSE_PATH = [{ x: 0, y: 0 }, { x: 30, y: -70 }, { x: 86, y: -40 }, { x: 120, y: -96 }];

  /* ============ 仕掛け ============ */
  var TYPES = {};

  /* --- 配線を切る --- */
  TYPES.wire = {
    body: "round",
    make: function (g, k) {
      var n = Math.min(5, 1 + Math.floor(k / 7));
      g.n = n;
      var perm = shuffled(n), tries = 0, i, same;
      while (n > 1 && tries++ < 40) {
        same = 0;
        for (i = 0; i < n; i++) if (perm[i] === i) same++;
        if (same === 0) break;
        perm = shuffled(n);
      }
      g.perm = perm;
      g.lit = Math.floor(Math.random() * n);
      g.cols = shuffled(COLORS.length).slice(0, n).map(function (v) { return COLORS[v]; });
      g.z = shuffled(n);
      g.cut = [];
      for (i = 0; i < n; i++) g.cut.push(false);
      g.ct = 0;
      TYPES.wire.place(g);
    },
    /* 面板の中で、左右の端子台をつなぐコードが入れ替わりながら渡る。
       光っているランプのコードを、真ん中で切る */
    place: function (g) {
      var n = g.n, i;
      /* コードを収めるため、この仕掛けだけ面板を縦に広げる（胴が球なので中心に置く） */
      g.fr = { x: FACE.x, y: GROUND - 267, w: FACE.w, h: 190 };
      g.lx = g.fr.x + 26; g.rx = g.fr.x + g.fr.w - 26;
      g.ye = spread(n, g.fr.y + 24, g.fr.y + g.fr.h - 24);
      g.left = []; g.right = []; g.slots = [];
      for (i = 0; i < n; i++) {
        var ye = g.ye[i], row = g.perm[i], ym = g.ye[row];   /* 真ん中では高さが入れ替わる */
        /* 切る場所は左右にも振る。段が詰まっても、指で押し分けられる間隔になる */
        var mx = CX + (n > 1 ? (row % 2 ? 40 : -40) : 0);
        g.left.push([{ x: g.lx, y: ye }, { x: g.lx + 46, y: ye },
                     { x: mx - 46, y: ym }, { x: mx, y: ym }]);

      if (hissFilter) hissFilter.frequency.value = 1800 + (1 - worst) * 2200;
      if (!bombs.length) spawnWave();
      else if (live().indexOf(bomb) < 0) {                 /* 触る先が無くなったら生きている方へ */
        var lv = live();
        if (lv.length) { bomb = lv[0]; kind = bomb.kind; cur = bomb.cur; focus = bombs.indexOf(bomb); }
      }
    } else if (state === S.BOOM) {
      if (phase >= 1.5) { state = S.RESULT; phase = 0; }
    }
  }

  function ease(x) { return 1 - Math.pow(1 - x, 3); }

  /* 台ぜんたい（連結なら箱ごと）の動き */
  function wavePos(b) {
    var cy = GROUND - 150;
    if (b.mode === "serve") {
      var u = ease(Math.min(1, b.mt / 0.32));
      var sp = servePoint();
      return { x: (sp.x - CX) * (1 - u), y: (sp.y - cy) * (1 - u),
               s: 0.46 * (1 - u) + u, rot: (1 - u) * 0.5 };
    }
    if (b.mode === "pass") {
      var v = Math.min(1, b.mt / 0.4), e = ease(v), slot = b.plate;
      return { x: (slot.x - CX) * e, y: (slot.y - cy) * e - Math.sin(v * Math.PI) * 90,
               s: 1 + (slot.r / 170 - 1) * e, rot: -v * 1.4, gone: v >= 1 };
    }
    return { x: 0, y: 0, s: 1, rot: 0 };
  }

  /* ユニットごとの、いまの位置と大きさ（台の動き × 面板の割り当て） */
  function posOf(b) {
    var w = wavePos(b), tf = b.tf;
    return { x: w.x + tf.x * w.s, y: w.y + tf.y * w.s, s: tf.s * w.s, rot: w.rot, gone: w.gone };
  }

  /* 画面の点を、その台の中の座標に直す */
  function toLocal(b, x, y) {
    var p = posOf(b), cy = GROUND - 150;
    return { x: CX + (x - CX - p.x) / p.s, y: cy + (y - cy - p.y) / p.s };
  }

  /* どの面に触ったか。面板の真ん中がいちばん近いものを選ぶ */
  function pickBomb(x, y) {
    var lv = live();
    if (!lv.length) return null;
    if (lv.length === 1) return lv[0];
    if (x == null) return bombs[focus] && bombs[focus].mode === "live" ? bombs[focus] : lv[0];
    var best = lv[0], bd = Infinity, cy = GROUND - 150;
    for (var i = 0; i < lv.length; i++) {
      var p = posOf(lv[i]), fr = lv[i].fr || FACE;
      var fx = CX + p.x + (fr.x + fr.w / 2 - CX) * p.s;
      var fy = cy + p.y + (fr.y + fr.h / 2 - cy) * p.s;
      var d = (fx - x) * (fx - x) + (fy - y) * (fy - y);
      if (d < bd) { bd = d; best = lv[i]; }
    }
    return best;
  }

  /* ============ 入力 ============ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function doShare() {
    zShare({ text: score + "個目で爆散しました #わんこボマー" });
  }

  function nearSlot(x, y) {
    if (!bomb.slots) return -1;
    var tol = 52 * INV;                          /* 小さく置かれた台でも、指の距離感は同じに */
    var best = -1, bd = tol * tol;
    for (var i = 0; i < bomb.slots.length; i++) {
      var s = bomb.slots[i], dx = s.x - x, dy = s.y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function down(x, y) {
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "share") doShare();
      else if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    var b = pickBomb(x, y);
    if (!b) return;
    held = true;
    if (b !== bomb) { bomb = b; kind = b.kind; cur = b.cur; focus = bombs.indexOf(b); }
    withBomb(b, function (g) {
      var q = x == null ? null : toLocal(g, x, y);
      if (g.slots) {
        var i = q == null ? cur : (kind.hit ? kind.hit(g, q.x, q.y) : nearSlot(q.x, q.y));
        if (i >= 0) { cur = i; if (kind.act) kind.act(g, i); }
        return;
      }
      if (kind.drag && q) kind.drag(g, q.x, q.y);
      if (kind.press) kind.press(g);
    });
  }

  function up() {
    if (!held) return;
    held = false;
    if (state !== S.PLAY || !bomb || bomb.mode !== "live") return;
    withBomb(bomb, function (g) { if (kind.release) kind.release(g); });
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }

  /* 受けるのは canvas の入れ物（wrap）。絵の外（黒い余白）はここに届かないので、
     ボタンでないところを押して何か起きることはない。
     window で受けると余白も拾えるが、スマホで効かなくなるのでやらない */
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    keyMode = false;
    var p = atCanvas(e);
    down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (state !== S.PLAY) return;
    var p = atCanvas(e);
    var b = held ? bomb : pickBomb(p.x, p.y);
    if (!b || b.mode !== "live") return;
    withBomb(b, function (g) {
      var q = toLocal(g, p.x, p.y);
      if (g.slots) {
        var i = kind.hit ? kind.hit(g, q.x, q.y) : nearSlot(q.x, q.y);
        if (i >= 0) cur = i;
      } else if (kind.drag && held) kind.drag(g, q.x, q.y);
    });
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var num = (e.key.length === 1 && e.key >= "1" && e.key <= "9") ? Number(e.key) : 0;
    var swapKey = e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "Tab" ||
                  e.key === "w" || e.key === "W" || e.key === "s" || e.key === "S";
    if (!esc && !go && !left && !right && !num && !swapKey) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (swapKey) {                               /* 2台のときは、触る台を持ちかえる */
      if (e.repeat || state !== S.PLAY) return;
      var lv = live();
      if (lv.length < 2) return;
      var nb = lv[(lv.indexOf(bomb) + 1) % lv.length];
      bomb = nb; kind = nb.kind; cur = nb.cur; focus = bombs.indexOf(nb);
      held = false;
      sfxTick();
      return;
    }
    if (state !== S.PLAY || !bomb || bomb.mode !== "live") { if (num || left || right) return; }
    if (num) {                                   /* テンキーの面は数字キーでも打てる */
      if (!e.repeat && state === S.PLAY && bomb && kind.digit) {
        withBomb(bomb, function (g) { kind.digit(g, num); });
      }
      return;
    }
    if (left || right) {
      if (state !== S.PLAY || !bomb) return;
      var d = right ? 1 : -1;
      withBomb(bomb, function (g) {
        if (g.slots) cur = (cur + d + g.slots.length) % g.slots.length;
        else if (kind.dir) kind.dir(g, d);
      });
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") up();
  });

  /* ============ 描画 ============ */
  /* 定食屋の店内。奥が厨房の暖簾、手前が白木のカウンター */
  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, TABLE_Y);
    g.addColorStop(0, "#40301f");
    g.addColorStop(0.55, "#33261a");
    g.addColorStop(1, "#241b13");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, TABLE_Y);

    /* 板張りの壁 */
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#1c150f";
    for (var y = 120; y < TABLE_Y; y += 46) ctx.fillRect(0, y, W, 3);
    ctx.restore();

    /* 品書きの短冊（文字は入れない） */
    ctx.save();
    for (var i = 0; i < 4; i++) {
      var sx = 22 + i * 28, sy = 132, sh = 112 + (i % 2) * 26;
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#e8dcc2";
      ctx.fillRect(sx, sy, 24, sh);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = "#3a2c20";
      for (var m = 0; m < 5; m++) ctx.fillRect(sx + 9, sy + 16 + m * 20, 6, 11);
    }
    ctx.restore();

    /* 赤提灯 */
    ctx.save();
    var lx = 192, ly = 200;
    ctx.strokeStyle = "#2a1f16"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, ly - 40); ctx.stroke();
    ctx.fillStyle = "#a8302a";
    ctx.beginPath(); ctx.ellipse(lx, ly, 34, 44, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "rgba(255,190,120,.22)";
    ctx.beginPath(); ctx.ellipse(lx - 9, ly - 10, 14, 22, 0, 0, 6.284); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = 2;
    for (var r = -3; r <= 3; r++) {
      ctx.beginPath();
      ctx.ellipse(lx, ly + r * 12, 34 * Math.sqrt(Math.max(0.02, 1 - (r * 12 / 44) * (r * 12 / 44))), 2, 0, 0, 6.284);
      ctx.stroke();
    }
    ctx.fillStyle = "#2a1f16";
    ctx.fillRect(lx - 12, ly - 46, 24, 7);
    ctx.fillRect(lx - 12, ly + 39, 24, 7);
    ctx.restore();

    /* 厨房の暖簾 */
    var nh = 92, ny = 0;
    ctx.fillStyle = "#1e3550";
    ctx.fillRect(0, ny, W, nh);
    ctx.fillStyle = "#16283d";
    for (var s = 0; s < 5; s++) ctx.fillRect(s * (W / 5) + W / 5 - 4, ny + 16, 8, nh - 16);
    ctx.fillStyle = "rgba(240,236,226,.9)";
    ctx.fillRect(0, ny + nh - 26, W, 7);
    ctx.fillStyle = "#0f1a27";
    ctx.fillRect(0, ny, W, 14);

    /* カウンター */
    var tg = ctx.createLinearGradient(0, TABLE_Y, 0, H);
    tg.addColorStop(0, "#c79a5e");
    tg.addColorStop(0.05, "#a87d45");
    tg.addColorStop(0.3, "#8a6436");
    tg.addColorStop(1, "#5d4223");
    ctx.fillStyle = tg;
    ctx.fillRect(0, TABLE_Y, W, H - TABLE_Y);
    ctx.fillStyle = "rgba(255,240,210,.20)";
    ctx.fillRect(0, TABLE_Y, W, 5);
    ctx.save();                                  /* 木目 */
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = "#3a2a16";
    ctx.lineWidth = 2;
    for (var k = 0; k < 6; k++) {
      var wy2 = TABLE_Y + 26 + k * 38;
      ctx.beginPath();
      ctx.moveTo(0, wy2);
      ctx.bezierCurveTo(W * 0.3, wy2 - 7, W * 0.7, wy2 + 7, W, wy2 - 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTray(rxIn) {
    var rx = rxIn || BODY[bomb.body].tray, y = GROUND - 4;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(CX, y + 10, rx, 28, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#7d2b20";
    ctx.beginPath(); ctx.ellipse(CX, y, rx, 26, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#98392a";
    ctx.beginPath(); ctx.ellipse(CX, y - 5, rx - 16, 21, 0, 0, 6.284); ctx.fill();
    ctx.strokeStyle = "rgba(255,200,160,.25)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(CX, y - 5, rx - 16, 21, 0, 0, 6.284); ctx.stroke();
    ctx.restore();
  }

  /* 解除した数だけ、左端に皿が積み上がる。
     爆弾を乗せている朱塗りのお盆と同じ意匠（drawTray と色・作りを揃えてある） */
  function drawPlate(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    var ry = r * 0.24;
    ctx.fillStyle = "rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.ellipse(0, ry * 0.8, r, ry, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#7d2b20";
    ctx.beginPath(); ctx.ellipse(0, 0, r, ry, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#98392a";
    ctx.beginPath(); ctx.ellipse(0, -ry * 0.42, r * 0.92, ry * 0.82, 0, 0, 6.284); ctx.fill();
    ctx.strokeStyle = "rgba(255,200,160,.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -ry * 0.42, r * 0.92, ry * 0.82, 0, 0, 6.284); ctx.stroke();
    ctx.restore();
  }

  function drawPile() {
    for (var i = 0; i < pile.length; i++) {
      if (i === pile.length - 1 && flying()) continue;     /* 飛んでいる最中の1枚は出さない */
      var s = pile[i];
      drawPlate(s.x, s.y, s.r, (i % 3 - 1) * 0.012);
    }
  }

  function drawFuse(aIn, fIn) {
    var a = aIn || BODY[bomb.body].fuse, f = fIn === undefined ? bomb.fuse : fIn;
    if (f <= 0.001) return;
    ctx.save();
    ctx.translate(CX + a.x, GROUND + a.y);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#c0a878"; ctx.lineWidth = 8;
    pathBez(FUSE_PATH, 0, f); ctx.stroke();
    ctx.strokeStyle = "#8d7749"; ctx.lineWidth = 3;
    pathBez(FUSE_PATH, 0, f); ctx.stroke();
    var tip = bez(FUSE_PATH, f), fl = 0.7 + Math.random() * 0.6;
    ctx.fillStyle = "#fff0b0";
    ctx.shadowColor = "#ffb43a";
    ctx.shadowBlur = 26 * fl;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 6 * fl, 0, 6.284); ctx.fill();
    ctx.restore();
  }

  /* 爆弾1台を、与えられた位置と大きさで描く */
  function drawBombAt(b, pos) {
    var ob = bomb, ok = kind, ocur = cur;
    bomb = b; kind = b.kind; cur = b.cur === undefined ? cur : b.cur;
    var cy = GROUND - 150;
    ctx.save();
    ctx.translate(CX + pos.x, cy + pos.y);
    ctx.rotate(pos.rot || 0);
    ctx.scale(pos.s, pos.s);
    ctx.translate(-CX, -cy);
    drawTray();
    drawFuse();
    BODY[bomb.body].draw();
    kind.draw(bomb);
    if (kind.drawFront) kind.drawFront(bomb);
    ctx.restore();
    bomb = ob; kind = ok; cur = ocur;
  }

  /* 2ユニット連結の大きい箱（上下に積む） */
  function drawTwinBody() {
    var r = twinRect(), band = 34, uh = (r.h - band) / 2;
    for (var s = 0; s < 2; s++) {
      var uy = s ? r.y + uh + band : r.y;
      var g = ctx.createLinearGradient(r.x, 0, r.x + r.w, 0);
      g.addColorStop(0, "#252d35");
      g.addColorStop(0.35, "#4b5560");
      g.addColorStop(0.7, "#333c46");
      g.addColorStop(1, "#171d23");
      ctx.fillStyle = g;
      roundRect(r.x, uy, r.w, uh, 14); ctx.fill();
      ctx.strokeStyle = "#727c88"; ctx.lineWidth = 3;
      roundRect(r.x + 8, uy + 8, r.w - 16, uh - 16, 10); ctx.stroke();
    }
    ctx.fillStyle = "#8d7038";                       /* 連結の帯 */
    ctx.fillRect(r.x + 18, r.y + uh + 2, r.w - 36, band - 4);
    ctx.fillStyle = "#c6a559";
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(r.x + 40 + i * (r.w - 80) / 3, r.y + uh + band / 2, 5.5, 0, 6.284);
      ctx.fill();
    }
    ctx.fillStyle = "#b8974f";                       /* 導火線の口金 */
    ctx.fillRect(CX + r.w / 2 - 78, r.y - 8, 52, 14);
  }

  function drawBomb() {
    if (state === S.BOOM || state === S.RESULT) return;
    if (bomb) bomb.cur = cur;
    var i, b, cy = GROUND - 150;

    if (isTwin()) {
      var wp = wavePos(bombs[0]);
      if (wp.gone) return;
      ctx.save();
      ctx.translate(CX + wp.x, cy + wp.y);
      ctx.rotate(wp.rot || 0);
      ctx.scale(wp.s, wp.s);
      ctx.translate(-CX, -cy);
      drawTray(twinRect().w / 2 + 34);
      drawFuse(twinFuse(), waveFuse());
      drawTwinBody();
      ctx.restore();
      for (i = 0; i < bombs.length; i++) drawUnit(bombs[i]);
      return;
    }

    for (i = 0; i < bombs.length; i++) {
      b = bombs[i];
      var pos = posOf(b);
      if (b.mode === "pass" && pos.gone) continue;
      drawBombAt(b, pos);
    }
  }

  /* 連結のときの、面板ひとつぶん */
  function drawUnit(b) {
    var pos = posOf(b), cy = GROUND - 150;
    var ob = bomb, ok = kind, oc = cur;
    bomb = b; kind = b.kind; cur = b.cur;
    ctx.save();
    ctx.translate(CX + pos.x, cy + pos.y);
    ctx.rotate(pos.rot || 0);
    ctx.scale(pos.s, pos.s);
    ctx.translate(-CX, -cy);
    kind.draw(b);
    if (kind.drawFront && b.mode === "live") kind.drawFront(b);
    if (b.mode !== "live" && b.mode !== "serve") {   /* 済んだ面は暗くする */
      var fr = b.fr || FACE;
      ctx.fillStyle = "rgba(6,10,14,.6)";
      roundRect(fr.x, fr.y, fr.w, fr.h, 8); ctx.fill();
    }
    ctx.restore();
    bomb = ob; kind = ok; cur = oc;
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.c;
      if (p.chunk) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.age * 6);
        ctx.fillRect(-p.r, -p.r * 0.7, p.r * 2, p.r * 1.4);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a + 0.5, 0, 6.284); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawButton(b) {
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    var hw = b.w / 2, hh = b.h / 2, rad = hh;
    ctx.beginPath();
    ctx.moveTo(-hw + rad, -hh);
    ctx.arcTo(hw, -hh, hw, hh, rad);
    ctx.arcTo(hw, hh, -hw, hh, rad);
    ctx.arcTo(-hw, hh, -hw, -hh, rad);
    ctx.arcTo(-hw, -hh, hw, -hh, rad);
    ctx.closePath();
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#16202e";
    ctx.stroke();
    ctx.fillStyle = "#16202e";
    ctx.font = "800 24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.label, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    drawCrowd();
    drawOkami();

    drawPile();
    drawBomb();
    drawParts();
    drawSay();
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,238,200," + Math.min(1, flash) + ")";
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    ctx.restore();

    if (state === S.RESULT) {
      ctx.fillStyle = "rgba(10,8,6,.66)";
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(0,0,0,.6)";
      ctx.shadowBlur = 10;
      ctx.font = "800 108px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(score), W / 2, H * 0.45);
      ctx.restore();
      resultButtons().forEach(drawButton);
    }
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () {
      return { state: (state === S.PLAY && !live().length) ? "serve" : state,
               score: score, W: W, H: H, key: bomb && bomb.key,
               units: bombs.length, twin: isTwin(), plates: pile.length };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    /* 生きている面の、画面の上での押しどころ */
    spots: function () {
      var cy = GROUND - 150;
      return live().map(function (b) {
        var p = posOf(b);
        return (b.slots || []).map(function (s) {
          return { x: CX + p.x + (s.x - CX) * p.s, y: cy + p.y + (s.y - cy) * p.s };
        });
      });
    }
  };

  /* ============ ループ ============ */
  newRound();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
