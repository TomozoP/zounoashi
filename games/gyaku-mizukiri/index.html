<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ストロング水切り</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 0; background: #7fc8e8; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  var W = 960, H = 540;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var WATER_Y = 340;
  var SHORE_RIGHT = 210;
  var START_X = 130;
  var GRAVITY = 1500;
  var WORLD_W = 5200;
  var TURBO_TRIGGER = 4;
  var TURBO_MIN_SPEED = 180;
  var TURBO_DURATION = 2.4;
  var MIN_ANGLE_DEG = 8, MAX_ANGLE_DEG = 48;
  var ARROW_ORIGIN_X = START_X + 90, ARROW_ORIGIN_Y = WATER_Y - 140;
  var METERS_PER_SKIP = 3.2;
  var EARTH_KM = 40075;
  var MAX_ROLL_THRESHOLD = 0.95;
  var IMPACT_DURATION = 0.8;

  var ojisanImg = new Image();
  var assetsReady = 0;
  ojisanImg.onload = function () { assetsReady++; };
  ojisanImg.src = "img/ojisan.png";

  var ROCK_STAND_SIZE = 200;
  var ROCK_FLY_SIZE = 150;
  var OJISAN_SIZE = 118, OJISAN_FOOT = 0.92;
  var ROCK_STAND_X = START_X + 78, ROCK_GROUND_Y = WATER_Y - 6;

  /* ---- 岩の生成: 10種類、丸い〜平たいまで ---- */
  var ROCK_COUNT = 10;
  var rockTypes = [];
  (function initRocks() {
    for (var i = 0; i < ROCK_COUNT; i++) {
      var flatness = 1.0 + (i / (ROCK_COUNT - 1)) * 1.7;
      var jag = 0.22 + Math.random() * 0.14;
      var n = 9 + Math.floor(Math.random() * 4);
      var shape = [];
      for (var k = 0; k < n; k++) {
        var a = (k / n) * Math.PI * 2;
        var r = 1 + (Math.random() - 0.5) * jag;
        shape.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
      }
      var darkSpots = [];
      for (var s = 0; s < 3; s++) {
        darkSpots.push([0, 1, 2].map(function () {
          var a2 = Math.random() * Math.PI * 2;
          var r2 = 0.2 + Math.random() * 0.55;
          return { x: Math.cos(a2) * r2, y: Math.sin(a2) * r2 };
        }));
      }
      rockTypes.push({ flatness: flatness, shape: shape, darkSpots: darkSpots, hue: 205 + Math.random() * 20 - 10 });
    }
  })();
  var selectedRock = rockTypes[0];

  function drawGeneratedRock(rock, width) {
    var height = width / rock.flatness;
    var hw = width / 2, hh = height / 2;
    ctx.beginPath();
    rock.shape.forEach(function (p, i) {
      var px = p.x * hw, py = p.y * hh;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath();
    var g = ctx.createLinearGradient(-hw, -hh, hw, hh);
    g.addColorStop(0, "hsl(" + rock.hue + ",8%,74%)");
    g.addColorStop(1, "hsl(" + rock.hue + ",10%,40%)");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.16)";
    rock.darkSpots.forEach(function (tri) {
      ctx.beginPath();
      ctx.moveTo(tri[0].x * hw, tri[0].y * hh);
      ctx.lineTo(tri[1].x * hw, tri[1].y * hh);
      ctx.lineTo(tri[2].x * hw, tri[2].y * hh);
      ctx.closePath();
      ctx.fill();
    });
    ctx.strokeStyle = "rgba(0,0,0,.28)";
    ctx.lineWidth = Math.max(1.5, width * 0.015);
    ctx.stroke();
  }

  var audioCtx = null;
  function beep(freq, dur, type, gain) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime((gain || 0.15), t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur);
    } catch (e) {}
  }

  var state = "select";
  var t = 0;
  var power = 0, angle = 0;
  var throwFx = 0;
  var camX = 0;
  var particles = [];

  var body = { x: START_X, y: WATER_Y - 40, vx: 0, vy: 0, rot: 0, rotSpeed: 0, sinking: 0 };
  var skips = 0;
  var turboFrom = 0, turboTo = 0, turboT = 0, turboBaseDistM = 0, turboIsMax = false;
  var turboStartX = 0, turboStartY = 0, turboStartRot = 0, turboRotSpeed = 0;
  var resultDistanceM = 0;
  var impactT = 0, impactHit = false, hitFlash = 0;

  function reset() {
    state = "select";
    body.x = START_X; body.y = WATER_Y - 40;
    body.vx = 0; body.vy = 0; body.rot = 0; body.rotSpeed = 0; body.sinking = 0;
    skips = 0; camX = 0; particles = [];
  }
  reset();

  function spawnSplash(x, y) {
    for (var i = 0; i < 10; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 260,
        vy: -Math.random() * 260 - 40,
        life: 0.5 + Math.random() * 0.3,
        age: 0
      });
    }
  }

  function startTurbo() {
    state = "turbo";
    turboFrom = skips;
    var roll = Math.random();
    turboIsMax = roll > MAX_ROLL_THRESHOLD;
    turboTo = skips + (turboIsMax ? 12000 : Math.round(3000 + roll * 9000));
    turboT = 0;
    turboBaseDistM = (body.x - START_X) / 12;
    turboStartX = body.x; turboStartY = body.y; turboStartRot = body.rot;
    turboRotSpeed = body.rotSpeed;
    beep(660, 0.2, "square", 0.14);
  }

  function update(dt) {
    t += dt;
    if (state === "power") {
      power = (Math.sin(t * 4.2) + 1) / 2;
    } else if (state === "angle") {
      angle = (Math.sin(t * 4.6) + 1) / 2;
    } else if (state === "throw-anim") {
      throwFx += dt;
      if (throwFx > 0.16) { throwFx = 0; launch(); }
    } else if (state === "flying") {
      var flat = selectedRock.flatness;
      var restitution = 0.40 + (flat - 1) * 0.11;
      var vxFriction = 0.80 + (flat - 1) * 0.048;
      var maxIncidence = 0.48 + (flat - 1) * 0.135;

      body.vy += GRAVITY * dt;
      body.x += body.vx * dt;
      body.y += body.vy * dt;
      body.rot += body.rotSpeed * dt;

      var speed = Math.hypot(body.vx, body.vy);
      if (body.y + 30 >= WATER_Y && body.vy > 0 && body.x > SHORE_RIGHT) {
        var incidence = Math.atan2(body.vy, Math.abs(body.vx));
        if (incidence < maxIncidence && speed > 130) {
          body.y = WATER_Y - 30;
          body.vy = -body.vy * restitution;
          body.vx *= vxFriction;
          body.rotSpeed *= 0.85;
          skips++;
          spawnSplash(body.x, WATER_Y);
          beep(320 + Math.random() * 120, 0.12, "triangle", 0.12);
          var postSpeed = Math.hypot(body.vx, body.vy);
          if (skips >= TURBO_TRIGGER && postSpeed > TURBO_MIN_SPEED) {
            startTurbo();
          } else if (postSpeed < 150) {
            sink();
          }
        } else {
          sink();
        }
      }
      if (body.x > WORLD_W - 60) sink();

      var target = body.x - 220;
      camX += (Math.max(0, Math.min(WORLD_W - W, target)) - camX) * Math.min(1, dt * 6);
    } else if (state === "turbo") {
      turboT += dt;
      var p = Math.min(1, turboT / TURBO_DURATION);
      var eased = 1 - Math.pow(1 - p, 3);
      skips = Math.round(turboFrom + (turboTo - turboFrom) * eased);
      if (Math.random() < 0.4) {
        spawnSplash(camX + W * 0.5 + (Math.random() - 0.5) * 220, WATER_Y);
      }
      if (p >= 1) {
        if (turboIsMax) {
          resultDistanceM = EARTH_KM * 1000;
          state = "impact";
          impactT = 0; impactHit = false; hitFlash = 0;
          beep(200, 0.15, "square", 0.2);
        } else {
          resultDistanceM = turboBaseDistM + (skips - turboFrom) * METERS_PER_SKIP;
          beep(880, 0.4, "sine", 0.16);
          state = "result";
        }
      }
    } else if (state === "impact") {
      impactT += dt;
      if (impactT >= IMPACT_DURATION && !impactHit) {
        impactHit = true;
        hitFlash = 1;
        spawnSplash(START_X + 30, WATER_Y - 70);
        beep(140, 0.25, "sawtooth", 0.22);
      }
      if (impactHit) {
        hitFlash = Math.max(0, hitFlash - dt * 2.2);
        if (hitFlash <= 0 && impactT >= IMPACT_DURATION + 0.5) {
          state = "result";
        }
      }
    } else if (state === "sinking") {
      body.sinking += dt;
      body.y += 60 * dt;
      if (body.sinking > 0.9) {
        resultDistanceM = Math.max(0, (body.x - START_X) / 12);
        state = "result";
      }
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p2 = particles[i];
      p2.age += dt;
      if (p2.age > p2.life) { particles.splice(i, 1); continue; }
      p2.vy += 700 * dt;
      p2.x += p2.vx * dt;
      p2.y += p2.vy * dt;
    }
  }

  function sink() {
    state = "sinking";
    body.sinking = 0;
    spawnSplash(body.x, WATER_Y);
    beep(180, 0.35, "sawtooth", 0.1);
  }

  function currentAngleRad() {
    return (MIN_ANGLE_DEG + angle * (MAX_ANGLE_DEG - MIN_ANGLE_DEG)) * Math.PI / 180;
  }

  function standingRockCenterY() {
    var h = ROCK_STAND_SIZE / selectedRock.flatness;
    return ROCK_GROUND_Y - h / 2;
  }

  function launch() {
    var speed = 620 + power * 480;
    var ang = currentAngleRad();
    body.x = ROCK_STAND_X; body.y = standingRockCenterY();
    body.vx = Math.cos(ang) * speed;
    body.vy = -Math.sin(ang) * speed;
    body.rotSpeed = (6 + power * 7) * (1 + (selectedRock.flatness - 1) * 0.12);
    skips = 0;
    state = "flying";
    beep(520, 0.12, "square", 0.12);
  }

  /* ---- 岩の選択画面 ---- */
  var SELECT_COLS = 5, SELECT_ROWS = 2;
  var SELECT_CELL_W = W * 0.16, SELECT_CELL_H = 140;
  var SELECT_GRID_LEFT = W / 2 - (SELECT_COLS * SELECT_CELL_W) / 2;
  var SELECT_GRID_TOP = 40;
  var SELECT_ROCK_WIDTH = 92;

  function selectSlotPos(i) {
    var col = i % SELECT_COLS, row = Math.floor(i / SELECT_COLS);
    return {
      x: SELECT_GRID_LEFT + SELECT_CELL_W * (col + 0.5),
      y: SELECT_GRID_TOP + SELECT_CELL_H * (row + 0.5)
    };
  }

  function hitTestRockSlot(x, y) {
    for (var i = 0; i < ROCK_COUNT; i++) {
      var pos = selectSlotPos(i);
      if (Math.abs(x - pos.x) < SELECT_CELL_W / 2 && Math.abs(y - pos.y) < SELECT_CELL_H / 2) return i;
    }
    return null;
  }

  function drawRockSelectGrid() {
    for (var i = 0; i < ROCK_COUNT; i++) {
      var pos = selectSlotPos(i);
      ctx.save();
      ctx.translate(pos.x, pos.y);
      drawGeneratedRock(rockTypes[i], SELECT_ROCK_WIDTH);
      ctx.restore();
    }
  }

  function handleTap(x, y) {
    if (assetsReady < 1) return;
    if (state === "select") {
      var idx = hitTestRockSlot(x, y);
      if (idx != null) { selectedRock = rockTypes[idx]; state = "power"; t = 0; }
    }
    else if (state === "power") { state = "angle"; t = 0; }
    else if (state === "angle") { state = "throw-anim"; throwFx = 0; }
    else if (state === "result") { reset(); }
  }

  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var lx = (e.clientX - rect.left) / rect.width * W;
    var ly = (e.clientY - rect.top) / rect.height * H;
    handleTap(lx, ly);
  });

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, WATER_Y);
    g.addColorStop(0, "#bfe8ff");
    g.addColorStop(1, "#eaf8ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawWater() {
    var g = ctx.createLinearGradient(0, WATER_Y, 0, H);
    g.addColorStop(0, "#4fb3d9");
    g.addColorStop(1, "#1c6f94");
    ctx.fillStyle = g;
    ctx.fillRect(0, WATER_Y, W, H - WATER_Y);
    ctx.strokeStyle = "rgba(255,255,255,.45)";
    ctx.lineWidth = 2;
    for (var i = 0; i < 6; i++) {
      var wy = WATER_Y + 14 + i * 22;
      ctx.beginPath();
      for (var x = -40; x < W + 40; x += 8) {
        var yy = wy + Math.sin((x + camX) * 0.03 + t * 2 + i) * 3;
        if (x === -40) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.globalAlpha = 0.18;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawShore() {
    ctx.fillStyle = "#c9b183";
    ctx.beginPath();
    ctx.moveTo(-10 - camX, H);
    ctx.lineTo(-10 - camX, WATER_Y - 10);
    ctx.quadraticCurveTo(SHORE_RIGHT * 0.5 - camX, WATER_Y - 60, SHORE_RIGHT - camX, WATER_Y);
    ctx.lineTo(-10 - camX, WATER_Y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#7cae5c";
    ctx.beginPath();
    ctx.moveTo(-10 - camX, WATER_Y - 30);
    ctx.quadraticCurveTo(SHORE_RIGHT * 0.5 - camX, WATER_Y - 90, SHORE_RIGHT - camX, WATER_Y - 20);
    ctx.lineTo(-10 - camX, WATER_Y - 10);
    ctx.closePath();
    ctx.fill();
  }

  function drawOjisan(x, y) {
    ctx.save();
    ctx.translate(x - camX, y);
    var lean = state === "throw-anim" ? Math.sin((throwFx / 0.16) * Math.PI) * 0.22 : 0;
    ctx.rotate(lean);
    ctx.drawImage(ojisanImg, -OJISAN_SIZE / 2, -OJISAN_SIZE * OJISAN_FOOT, OJISAN_SIZE, OJISAN_SIZE);
    ctx.restore();
  }

  function drawRockStanding(x, throwing) {
    ctx.save();
    var progress = throwFx / 0.16;
    var squish = throwing ? 1 - Math.sin(progress * Math.PI) * 0.14 : 1;
    ctx.translate(x - camX, standingRockCenterY());
    ctx.scale(squish, 2 - squish);
    drawGeneratedRock(selectedRock, ROCK_STAND_SIZE);
    ctx.restore();
  }

  function drawRockFlying(x, y, rot) {
    ctx.save();
    ctx.translate(x - camX, y);
    ctx.rotate(rot);
    drawGeneratedRock(selectedRock, ROCK_FLY_SIZE);
    ctx.restore();
  }

  function drawParticles() {
    ctx.fillStyle = "rgba(255,255,255,.85)";
    particles.forEach(function (p) {
      var a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawPowerGauge(value) {
    var bw = W * 0.5, bh = 22, bx = (W - bw) / 2, by = H * 0.14;
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 8);
    ctx.fillStyle = "#233043";
    ctx.fillRect(bx, by, bw, bh);
    var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, "#5fd0ff");
    g.addColorStop(0.5, "#ffe15a");
    g.addColorStop(1, "#ff5a5a");
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#fff";
    ctx.fillRect(bx + value * bw - 2, by - 6, 4, bh + 12);
  }

  function drawAngleArrow(angRad) {
    var len = 100 + power * 20;
    var dx = Math.cos(angRad), dy = -Math.sin(angRad);
    var ox = ARROW_ORIGIN_X - camX, oy = ARROW_ORIGIN_Y;
    var tx = ox + dx * len, ty = oy + dy * len;
    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.45)";
    ctx.shadowBlur = 8;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    var headAng = Math.atan2(dy, dx);
    var headLen = 20, headSpread = 0.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - headLen * Math.cos(headAng - headSpread), ty - headLen * Math.sin(headAng - headSpread));
    ctx.lineTo(tx - headLen * Math.cos(headAng + headSpread), ty - headLen * Math.sin(headAng + headSpread));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawCount(x, y, size, value) {
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.5)";
    ctx.shadowBlur = 6;
    ctx.font = "800 " + size + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(value), x, y);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (assetsReady < 1) {
      ctx.fillStyle = "#0b1622";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    drawSky();
    drawWater();
    drawShore();

    if (state === "select") {
      drawRockSelectGrid();
      drawOjisan(START_X, WATER_Y - 20);
    } else {
      var ojisanX = START_X, ojisanY = WATER_Y - 20;
      if (state === "impact" && hitFlash > 0) {
        ojisanX += (Math.random() - 0.5) * 12 * hitFlash;
        ojisanY += (Math.random() - 0.5) * 12 * hitFlash;
      }
      drawOjisan(ojisanX, ojisanY);

      if (state === "power" || state === "angle" || state === "throw-anim") {
        drawRockStanding(ROCK_STAND_X, state === "throw-anim");
      } else if (state === "turbo") {
        var bx = turboStartX - camX + turboT * 60;
        var by = turboStartY - Math.abs(Math.sin(turboT * 16)) * 50;
        drawRockFlying(bx, by, turboStartRot + turboT * (turboRotSpeed + 20));
      } else if (state === "impact") {
        var ip = Math.min(1, impactT / IMPACT_DURATION);
        if (ip < 1) {
          var fromX = camX + W + 140, fromY = WATER_Y - 170;
          var toX = START_X + 40, toY = WATER_Y - 90;
          drawRockFlying(fromX + (toX - fromX) * ip, fromY + (toY - fromY) * ip, ip * 30);
        }
      } else {
        drawRockFlying(body.x, body.y, body.rot);
      }
    }
    drawParticles();

    if (state === "impact" && hitFlash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (hitFlash * 0.5) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    if (state === "power") drawPowerGauge(power);
    if (state === "angle") drawAngleArrow(currentAngleRad());

    if (state === "flying" || state === "sinking") {
      drawCount(W - 60, 46, 28, skips);
    }

    if (state === "turbo") {
      drawCount(W / 2, H * 0.5, 90, skips);
    }

    if (state === "result") {
      ctx.fillStyle = "rgba(10,20,30,.55)";
      ctx.fillRect(0, 0, W, H);
      drawCount(W / 2, H * 0.55, 88, (resultDistanceM / 1000).toFixed(1) + "km");
    }
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
