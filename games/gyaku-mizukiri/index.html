<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ストロング水切り</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; background: #9fd8ef; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  var W = 960, H = 540, TAU = Math.PI * 2;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ============ 定数 ============ */
  var WATER_Y = 344;
  var GROUND_Y = WATER_Y - 4;
  var SHORE_RIGHT = 250;
  var OJISAN_X = 120, OJISAN_W = 118, OJISAN_FOOT = 0.92;
  var ROCK_X = OJISAN_X + 100;
  var ROCK_HELD_W = 190, ROCK_FLY_W = 140;
  var GRAVITY = 1500;
  var MIN_ANGLE = 8, MAX_ANGLE = 48;
  var SKIM_VY = 95;             // 反発後の跳ね上がりがこれ未満なら水面を滑走しはじめる
  var V_REF = 800;              // 滑走距離の基準速度
  var D_MAX = 52000000;         // 到達しうる最大距離(m)
  var EARTH_M = 40075000;       // 地球一周
  var DEST_OFFSET = EARTH_M + (ROCK_X - OJISAN_X);  // 一周した先の砂浜(おじさんが投げた地点に戻る)

  /* ============ 小道具 ============ */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function rndInt(a, b) { return Math.floor(rnd(a, b + 1)); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function mixRGB(c1, c2, k) {
    return [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
  }
  function rgb(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
  function hsl(h, s, l) { return "hsl(" + h + "," + s + "%," + clamp(l, 0, 100) + "%)"; }
  function easeOutQuart(p) { return 1 - Math.pow(1 - p, 4); }

  /* ============ 石の生成 ============ */
  /* 輪郭は「大きなうねり + 細かいギザギザ + 欠け」の重ね合わせで作る。
     flat(横幅÷高さ)が大きいほど平たく、水切りの成績が良くなる。 */
  function makeRock() {
    var n = rndInt(9, 16);
    var lobes = rndInt(2, 4);
    var lobeAmp = rnd(0.05, 0.20);
    var lobePhase = rnd(0, TAU);
    var jag = rnd(0.03, 0.16);
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU + rnd(-0.45, 0.45) * (TAU / n);
      var r = 1 + Math.sin(a * lobes + lobePhase) * lobeAmp + rnd(-jag, jag);
      pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    // 割れて欠けた面をときどき作る
    if (Math.random() < 0.65) {
      var s = rndInt(0, n - 1), len = rndInt(2, 3), depth = rnd(0.55, 0.85);
      for (var k = 0; k < len; k++) {
        var p = pts[(s + k) % n];
        p.x *= depth; p.y *= depth;
      }
    }
    var facets = [];
    for (var f = 0, fc = rndInt(2, 5); f < fc; f++) {
      var i0 = rndInt(0, n - 1);
      facets.push({
        tri: [pts[i0], pts[(i0 + rndInt(1, 3)) % n], { x: rnd(-0.5, 0.5), y: rnd(-0.5, 0.5) }],
        shade: rnd(-0.20, 0.14)
      });
    }
    var specks = [];
    for (var s2 = 0, sc = rndInt(5, 14); s2 < sc; s2++) {
      var aa = rnd(0, TAU), rr = rnd(0, 0.72);
      specks.push({ x: Math.cos(aa) * rr, y: Math.sin(aa) * rr, r: rnd(0.03, 0.09), d: rnd(-0.22, 0.14) });
    }
    return {
      flat: rnd(1.0, 3.3),
      pts: pts, facets: facets, specks: specks,
      hue: rnd(185, 245), sat: rnd(3, 15), light: rnd(42, 62),
      moss: Math.random() < 0.28 ? { x: rnd(-0.45, 0.45), y: rnd(-0.4, 0.4), r: rnd(0.22, 0.42) } : null,
      lie: rnd(-0.2, 0.2)   // 砂浜に転がっているときの傾き
    };
  }

  function rockPath(rock, hw, hh) {
    ctx.beginPath();
    for (var i = 0; i < rock.pts.length; i++) {
      var x = rock.pts[i].x * hw, y = rock.pts[i].y * hh;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawRock(rock, width) {
    var hw = width / 2, hh = (width / rock.flat) / 2;
    ctx.save();
    rockPath(rock, hw, hh);
    var g = ctx.createLinearGradient(-hw * 0.7, -hh, hw * 0.7, hh);
    g.addColorStop(0, hsl(rock.hue, rock.sat, rock.light + 17));
    g.addColorStop(0.55, hsl(rock.hue, rock.sat, rock.light));
    g.addColorStop(1, hsl(rock.hue, rock.sat, rock.light - 19));
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    ctx.clip();
    for (var i = 0; i < rock.facets.length; i++) {
      var f = rock.facets[i];
      ctx.beginPath();
      ctx.moveTo(f.tri[0].x * hw, f.tri[0].y * hh);
      ctx.lineTo(f.tri[1].x * hw, f.tri[1].y * hh);
      ctx.lineTo(f.tri[2].x * hw, f.tri[2].y * hh);
      ctx.closePath();
      ctx.fillStyle = f.shade < 0 ? "rgba(12,16,20," + (-f.shade) + ")" : "rgba(255,255,255," + f.shade + ")";
      ctx.fill();
    }
    if (rock.moss) {
      ctx.beginPath();
      ctx.ellipse(rock.moss.x * hw, rock.moss.y * hh, rock.moss.r * hw, rock.moss.r * hh, 0, 0, TAU);
      ctx.fillStyle = "rgba(104,132,66,.34)";
      ctx.fill();
    }
    for (var s = 0; s < rock.specks.length; s++) {
      var sp = rock.specks[s];
      ctx.beginPath();
      ctx.ellipse(sp.x * hw, sp.y * hh, sp.r * hw, sp.r * hh, 0, 0, TAU);
      ctx.fillStyle = sp.d < 0 ? "rgba(10,14,18," + (-sp.d) + ")" : "rgba(255,255,255," + sp.d + ")";
      ctx.fill();
    }
    ctx.restore();

    rockPath(rock, hw, hh);
    ctx.strokeStyle = "rgba(18,22,26,.45)";
    ctx.lineWidth = Math.max(1, width * 0.012);
    ctx.stroke();
    ctx.restore();
  }

  /* ============ 素材 ============ */
  var ojisanImg = new Image();
  var ready = false;
  ojisanImg.onload = function () { ready = true; };
  ojisanImg.src = "img/ojisan.png";

  var stars = [];
  for (var si = 0; si < 90; si++) {
    stars.push({ x: Math.random() * W, y: Math.random() * (WATER_Y - 40), r: rnd(0.6, 1.7), tw: rnd(0, TAU) });
  }
  var sandDots = [];
  for (var di = 0; di < 260; di++) {
    sandDots.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(0.6, 2.4), d: rnd(0.04, 0.16) });
  }

  /* ============ 音 ============ */
  var actx = null;
  function beep(freq, dur, type, gain) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = actx.currentTime;
      var osc = actx.createOscillator(), g = actx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(gain || 0.14, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t0); osc.stop(t0 + dur);
    } catch (e) {}
  }

  /* ============ 状態 ============ */
  var S = {
    SELECT: "select", POWER: "power", AIM: "aim", WIND: "wind",
    FLY: "fly", SKIM: "skim", APPROACH: "approach", HIT: "hit", SINK: "sink", RESULT: "result"
  };
  var APPROACH_LEN = 950;    // 一周して浜が見えてから着弾するまでの助走
  var APPROACH_VX = 720;

  var state, t, camX, particles, choices, rock, power, aimT, windT;
  var body, traveled, skim, hitT, ojiFly, resultM, sinkT;

  function newRound() {
    state = S.SELECT;
    t = 0; camX = 0; particles = [];
    choices = [];
    for (var i = 0; i < 10; i++) choices.push(makeRock());
    rock = choices[0];
    power = 0; aimT = 0; windT = 0;
    body = { x: ROCK_X, y: 0, vx: 0, vy: 0, rot: 0, spin: 0 };
    traveled = 0; resultM = 0; sinkT = 0; hitT = 0;
    skim = null;
    ojiFly = null;
  }
  newRound();

  function heldCenterY() { return GROUND_Y - (ROCK_HELD_W / rock.flat) / 2; }
  function flyHalfH() { return (ROCK_FLY_W / rock.flat) / 2; }
  function aimRad() { return (MIN_ANGLE + aimT * (MAX_ANGLE - MIN_ANGLE)) * Math.PI / 180; }

  function spawnSplash(x, y, n, spread) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: rnd(-1, 1) * spread, vy: rnd(-1, -0.15) * spread * 1.4,
        life: rnd(0.35, 0.8), age: 0, r: rnd(1.6, 3.6)
      });
    }
    if (particles.length > 420) particles.splice(0, particles.length - 420);
  }

  /* ============ 進行 ============ */
  function launch() {
    var speed = 620 + power * 520;
    var a = aimRad();
    body.x = ROCK_X; body.y = heldCenterY();
    body.vx = Math.cos(a) * speed;
    body.vy = -Math.sin(a) * speed;
    body.spin = (5 + power * 8) * (0.6 + rock.flat * 0.25);
    body.rot = 0;
    state = S.FLY;
    beep(520, 0.12, "square", 0.13);
  }

  function startSkim() {
    // 水面を滑りはじめた瞬間の速度と石の平たさで、最終的な到達距離が決まる
    var flatNorm = clamp((rock.flat - 1) / 2.3, 0, 1);
    var q = clamp(body.vx / V_REF, 0, 1.2) * (0.35 + 0.65 * flatNorm);
    var total = D_MAX * Math.pow(q, 3);
    var jackpot = total >= EARTH_M;
    // 一周ぶんに届く場合は、浜が見えるところまでで滑走を終えて助走に切り替える
    if (jackpot) total = (ROCK_X + EARTH_M - APPROACH_LEN) - body.x;
    skim = {
      t: 0,
      dur: 1.5 + 1.9 * clamp(total / EARTH_M, 0, 1),
      x0: body.x,
      total: total,
      jackpot: jackpot
    };
    state = S.SKIM;
    beep(700, 0.18, "square", 0.12);
  }

  function sink() {
    state = S.SINK;
    sinkT = 0;
    resultM = Math.max(0, body.x - ROCK_X);
    spawnSplash(body.x, WATER_Y, 16, 190);
    beep(170, 0.34, "sawtooth", 0.11);
  }

  function hitOjisan() {
    state = S.HIT;
    hitT = 0;
    body.x = ROCK_X + EARTH_M;
    traveled = EARTH_M;
    resultM = EARTH_M;
    ojiFly = { x: DEST_OFFSET + OJISAN_X, y: GROUND_Y, vx: 300, vy: -640, rot: 0, spin: 7 };
    spawnSplash(body.x, GROUND_Y - 60, 26, 260);
    beep(120, 0.3, "sawtooth", 0.22);
  }

  function update(dt) {
    t += dt;

    if (state === S.POWER) {
      power = (Math.sin(t * 4.2) + 1) / 2;

    } else if (state === S.AIM) {
      aimT = (Math.sin(t * 4.6) + 1) / 2;

    } else if (state === S.WIND) {
      windT += dt;
      if (windT >= 0.18) launch();

    } else if (state === S.FLY) {
      var maxInc = 0.40 + (rock.flat - 1) * 0.16;
      var rest = 0.36 + (rock.flat - 1) * 0.095;
      var fric = 0.79 + (rock.flat - 1) * 0.042;

      body.vy += GRAVITY * dt;
      body.x += body.vx * dt;
      body.y += body.vy * dt;
      body.rot += body.spin * dt;

      var contact = flyHalfH() * 0.8;
      if (body.y + contact >= WATER_Y && body.vy > 0 && body.x > SHORE_RIGHT) {
        var inc = Math.atan2(body.vy, Math.abs(body.vx));
        var speed = Math.hypot(body.vx, body.vy);
        if (inc < maxInc && speed > 120) {
          body.y = WATER_Y - contact;
          body.vy = -body.vy * rest;
          body.vx *= fric;
          body.spin *= 0.94;
          spawnSplash(body.x, WATER_Y, 8, 150);
          beep(300 + Math.random() * 150, 0.1, "triangle", 0.1);
          if (-body.vy < SKIM_VY) startSkim();
        } else {
          sink();
        }
      }
      traveled = body.x - ROCK_X;
      camX = Math.max(0, body.x - 300);

    } else if (state === S.SKIM) {
      skim.t += dt;
      var p = clamp(skim.t / skim.dur, 0, 1);
      body.x = skim.x0 + skim.total * easeOutQuart(p);
      body.y = WATER_Y - flyHalfH() * 0.7 + Math.sin(t * 40) * 2;
      body.rot += (18 + 26 * (1 - p)) * dt;
      traveled = body.x - ROCK_X;
      camX = Math.max(0, body.x - 300);
      if (Math.random() < 0.9) spawnSplash(body.x - rnd(0, 40), WATER_Y, 2, 120);
      if (p >= 1) {
        if (skim.jackpot) { state = S.APPROACH; } else sink();
      }

    } else if (state === S.APPROACH) {
      body.x += APPROACH_VX * dt;
      body.y = WATER_Y - flyHalfH() * 0.7 - Math.abs(Math.sin(t * 13)) * 30;
      body.rot += 9 * dt;
      traveled = body.x - ROCK_X;
      camX = body.x - 300;
      if (Math.random() < 0.5) spawnSplash(body.x - rnd(0, 30), WATER_Y, 2, 130);
      if (body.x >= ROCK_X + EARTH_M) hitOjisan();

    } else if (state === S.SINK) {
      sinkT += dt;
      body.y += 90 * dt;
      body.rot += 1.4 * dt;
      if (sinkT > 0.85) state = S.RESULT;

    } else if (state === S.HIT) {
      hitT += dt;
      if (ojiFly) {
        ojiFly.vy += 900 * dt;
        ojiFly.x += ojiFly.vx * dt;
        ojiFly.y += ojiFly.vy * dt;
        ojiFly.rot += ojiFly.spin * dt;
      }
      if (hitT > 1.5) state = S.RESULT;
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.age += dt;
      if (pt.age > pt.life) { particles.splice(i, 1); continue; }
      pt.vy += 620 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }
  }

  /* ============ 入力 ============ */
  function slotPos(i) {
    var col = i % 5, row = (i / 5) | 0;
    return { x: W * 0.13 + col * (W * 0.185), y: H * 0.30 + row * (H * 0.33) };
  }

  function pickChoice(x, y) {
    for (var i = 0; i < choices.length; i++) {
      var s = slotPos(i);
      if (Math.abs(x - s.x) < W * 0.09 && Math.abs(y - s.y) < H * 0.16) return i;
    }
    return -1;
  }

  function tap(x, y) {
    if (!ready) return;
    if (state === S.SELECT) {
      var i = pickChoice(x, y);
      if (i >= 0) {
        rock = choices[i];
        state = S.POWER; t = 0;
        beep(660, 0.08, "triangle", 0.1);
      }
    } else if (state === S.POWER) {
      state = S.AIM; t = 0;
    } else if (state === S.AIM) {
      state = S.WIND; windT = 0;
    } else if (state === S.RESULT) {
      newRound();
    }
  }

  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    tap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  });

  /* ============ 描画 ============ */
  function dayPhase() { return traveled / EARTH_M; }

  function drawSky(phase) {
    var ang = phase * TAU;
    var night = clamp(-Math.cos(ang), 0, 1);
    var dusk = clamp(1 - Math.abs(Math.cos(ang)) * 2.6, 0, 1);

    var top = mixRGB([150, 214, 255], [10, 14, 34], night);
    var bot = mixRGB([228, 246, 255], [26, 36, 66], night);
    bot = mixRGB(bot, [255, 158, 96], dusk * 0.75);
    top = mixRGB(top, [225, 120, 110], dusk * 0.35);

    var g = ctx.createLinearGradient(0, 0, 0, WATER_Y);
    g.addColorStop(0, rgb(top));
    g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, WATER_Y);

    if (night > 0.05) {
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.globalAlpha = night * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.6 + st.tw)));
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    drawOrb(ang, "#ffe9a8", "#ffd166", 34);
    drawOrb(ang + Math.PI, "#f2f4ff", "#d8ddf0", 24);
    return night;
  }

  function drawOrb(ang, c1, c2, r) {
    var x = W * 0.5 + Math.sin(ang) * (W * 0.42);
    var y = (WATER_Y - 60) - Math.cos(ang) * (WATER_Y - 120);
    if (y > WATER_Y + 20) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function drawWater(night, dusk) {
    var c1 = mixRGB([88, 182, 216], [20, 34, 64], night);
    var c2 = mixRGB([24, 106, 142], [6, 12, 28], night);
    c1 = mixRGB(c1, [214, 132, 104], dusk * 0.5);
    var g = ctx.createLinearGradient(0, WATER_Y, 0, H);
    g.addColorStop(0, rgb(c1));
    g.addColorStop(1, rgb(c2));
    ctx.fillStyle = g;
    ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 2;
    for (var i = 0; i < 6; i++) {
      var wy = WATER_Y + 14 + i * 22;
      ctx.beginPath();
      for (var x = -40; x <= W + 40; x += 10) {
        var yy = wy + Math.sin((x + camX % 100000) * 0.03 + t * 2 + i) * 3;
        if (x === -40) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.globalAlpha = 0.16;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawShore(offset, night) {
    var left = offset - 120 - camX, right = offset + SHORE_RIGHT - camX;
    if (right < -40 || left > W + 40) return;
    var sand = mixRGB([206, 180, 132], [56, 62, 84], night);
    var grass = mixRGB([124, 174, 92], [30, 48, 52], night);
    ctx.fillStyle = rgb(sand);
    ctx.beginPath();
    ctx.moveTo(left, H);
    ctx.lineTo(left, WATER_Y - 12);
    ctx.quadraticCurveTo((left + right) / 2, WATER_Y - 64, right, WATER_Y);
    ctx.lineTo(left, WATER_Y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(grass);
    ctx.beginPath();
    ctx.moveTo(left, WATER_Y - 34);
    ctx.quadraticCurveTo((left + right) / 2, WATER_Y - 96, right - 40, WATER_Y - 20);
    ctx.lineTo(left, WATER_Y - 12);
    ctx.closePath();
    ctx.fill();
  }

  function drawOjisan(worldX, y, night, rot) {
    var x = worldX - camX;
    if (x < -140 || x > W + 140) return;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    else if (state === S.WIND) ctx.rotate(Math.sin((windT / 0.18) * Math.PI) * 0.24);
    ctx.drawImage(ojisanImg, -OJISAN_W / 2, -OJISAN_W * OJISAN_FOOT, OJISAN_W, OJISAN_W);
    if (night > 0.05) {
      ctx.globalAlpha = night * 0.55;
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = "#0d1430";
      ctx.fillRect(-OJISAN_W / 2, -OJISAN_W * OJISAN_FOOT, OJISAN_W, OJISAN_W);
    }
    ctx.restore();
  }

  function drawParticles() {
    ctx.fillStyle = "rgba(255,255,255,.9)";
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var sx = p.x - camX;
      if (sx < -20 || sx > W + 20) continue;
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.beginPath();
      ctx.arc(sx, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGauge(v) {
    var bw = W * 0.46, bh = 20, bx = (W - bw) / 2, by = H * 0.12;
    ctx.fillStyle = "rgba(8,16,26,.35)";
    ctx.fillRect(bx - 5, by - 5, bw + 10, bh + 10);
    var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, "#6ad4ff");
    g.addColorStop(0.5, "#ffe15a");
    g.addColorStop(1, "#ff5a5a");
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#fff";
    ctx.fillRect(bx + v * bw - 2, by - 7, 4, bh + 14);
  }

  function drawArrow() {
    var a = aimRad();
    var ox = ROCK_X - camX, oy = heldCenterY();
    var len = 96 + power * 46;
    var tx = ox + Math.cos(a) * len, ty = oy - Math.sin(a) * len;
    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.5)";
    ctx.shadowBlur = 8;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    var ha = Math.atan2(-Math.sin(a), Math.cos(a)), hl = 20, hs = 0.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - hl * Math.cos(ha - hs), ty - hl * Math.sin(ha - hs));
    ctx.lineTo(tx - hl * Math.cos(ha + hs), ty - hl * Math.sin(ha + hs));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawNumber(x, y, size, str) {
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.55)";
    ctx.shadowBlur = 8;
    ctx.font = "800 " + size + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function km(m) { return (m / 1000).toFixed(1) + "km"; }

  function drawSelect() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#e6d3a8");
    g.addColorStop(1, "#c9ad7e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < sandDots.length; i++) {
      var d = sandDots[i];
      ctx.fillStyle = "rgba(90,70,40," + d.d + ")";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, TAU);
      ctx.fill();
    }
    for (var k = 0; k < choices.length; k++) {
      var s = slotPos(k), c = choices[k];
      var w = 118;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.fillStyle = "rgba(90,72,44,.22)";
      ctx.beginPath();
      ctx.ellipse(4, (w / c.flat) / 2 + 4, w * 0.48, w * 0.09, 0, 0, TAU);
      ctx.fill();
      ctx.rotate(c.lie);
      drawRock(c, w);
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!ready) {
      ctx.fillStyle = "#0b1622";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    if (state === S.SELECT) { drawSelect(); return; }

    var phase = dayPhase();
    var ang = phase * TAU;
    var night = clamp(-Math.cos(ang), 0, 1);
    var dusk = clamp(1 - Math.abs(Math.cos(ang)) * 2.6, 0, 1);

    drawSky(phase);
    drawWater(night, dusk);
    drawShore(0, night);
    drawShore(DEST_OFFSET, night);

    // 投げた場所のおじさん
    if (state !== S.HIT || !ojiFly) drawOjisan(OJISAN_X, GROUND_Y, night);
    // 一周した先のおじさん(＝同じ砂浜)
    if (ojiFly) drawOjisan(ojiFly.x, ojiFly.y, night, ojiFly.rot);
    else drawOjisan(DEST_OFFSET + OJISAN_X, GROUND_Y, night);

    if (state === S.POWER || state === S.AIM || state === S.WIND) {
      ctx.save();
      var sq = state === S.WIND ? 1 - Math.sin((windT / 0.18) * Math.PI) * 0.12 : 1;
      ctx.translate(ROCK_X - camX, heldCenterY());
      ctx.scale(sq, 2 - sq);
      drawRock(rock, ROCK_HELD_W);
      ctx.restore();
    } else if (state !== S.SELECT) {
      ctx.save();
      ctx.translate(body.x - camX, body.y);
      ctx.rotate(body.rot);
      drawRock(rock, ROCK_FLY_W);
      ctx.restore();
    }

    drawParticles();

    if (state === S.HIT && hitT < 0.22) {
      ctx.fillStyle = "rgba(255,255,255," + (1 - hitT / 0.22) * 0.6 + ")";
      ctx.fillRect(0, 0, W, H);
    }

    if (state === S.POWER) drawGauge(power);
    if (state === S.AIM) drawArrow();

    if (state === S.FLY || state === S.SKIM || state === S.APPROACH) drawNumber(W - 96, 52, 30, km(traveled));

    if (state === S.RESULT) {
      ctx.fillStyle = "rgba(8,16,26,.55)";
      ctx.fillRect(0, 0, W, H);
      drawNumber(W / 2, H * 0.56, 92, km(resultM));
    }
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
