<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>水切り世界一周</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; aspect-ratio: 16/9; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; background: #9fd8ef; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="../share.js"></script>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  var W = 960, H = 540, TAU = Math.PI * 2;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ============ 定数 ============ */
  var WATER_Y = 344;
  var GROUND_Y = WATER_Y - 4;
  var SHORE_RIGHT = 250;
  var OJISAN_X = 120, OJISAN_W = 118, OJISAN_FOOT = 0.92;
  var HEAD_Y = GROUND_Y - OJISAN_W * OJISAN_FOOT;   // 頭のてっぺん
  var ROCK_X = OJISAN_X;                            // 岩はおじさんの頭の上
  var ROCK_W = 160;
  var GRAVITY = 1500;
  var MIN_ANGLE = 0, MAX_ANGLE = 90;
  var SKIM_VY = 95;             // 反発後の跳ね上がりがこれ未満なら水面を滑走しはじめる
  var V_REF = 690;              // 滑走距離の基準速度
  var D_MAX = 52000000;         // 到達しうる最大距離(m)
  var EARTH_M = 40075000;       // 地球一周
  var DEST_OFFSET = EARTH_M + (ROCK_X - OJISAN_X);  // 一周した先の砂浜(おじさんが投げた地点に戻る)

  /* ============ 小道具 ============ */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function rndInt(a, b) { return Math.floor(rnd(a, b + 1)); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function mixRGB(c1, c2, k) {
    return [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
  }
  function rgb(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
  function hsl(h, s, l) { return "hsl(" + h + "," + s + "%," + clamp(l, 0, 100) + "%)"; }

  /* ============ 石の生成 ============ */
  /* 輪郭は「大きなうねり + 細かいギザギザ + 欠け」の重ね合わせで作る。
     flat(横幅÷高さ)が大きいほど平たく、水切りの成績が良くなる。 */
  function makeRock() {
    var n = rndInt(9, 16);
    var lobes = rndInt(2, 4);
    var lobeAmp = rnd(0.05, 0.20);
    var lobePhase = rnd(0, TAU);
    var jag = rnd(0.03, 0.16);
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU + rnd(-0.45, 0.45) * (TAU / n);
      var r = 1 + Math.sin(a * lobes + lobePhase) * lobeAmp + rnd(-jag, jag);
      pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    // 割れて欠けた面をときどき作る
    if (Math.random() < 0.65) {
      var s = rndInt(0, n - 1), len = rndInt(2, 3), depth = rnd(0.55, 0.85);
      for (var k = 0; k < len; k++) {
        var p = pts[(s + k) % n];
        p.x *= depth; p.y *= depth;
      }
    }
    var facets = [];
    for (var f = 0, fc = rndInt(2, 5); f < fc; f++) {
      var i0 = rndInt(0, n - 1);
      facets.push({
        tri: [pts[i0], pts[(i0 + rndInt(1, 3)) % n], { x: rnd(-0.5, 0.5), y: rnd(-0.5, 0.5) }],
        shade: rnd(-0.20, 0.14)
      });
    }
    var specks = [];
    for (var s2 = 0, sc = rndInt(5, 14); s2 < sc; s2++) {
      var aa = rnd(0, TAU), rr = rnd(0, 0.72);
      specks.push({ x: Math.cos(aa) * rr, y: Math.sin(aa) * rr, r: rnd(0.03, 0.09), d: rnd(-0.22, 0.14) });
    }
    return {
      flat: rnd(1.0, 3.3),
      pts: pts, facets: facets, specks: specks,
      hue: rnd(185, 245), sat: rnd(3, 15), light: rnd(42, 62),
      moss: Math.random() < 0.28 ? { x: rnd(-0.45, 0.45), y: rnd(-0.4, 0.4), r: rnd(0.22, 0.42) } : null,
      lie: rnd(-0.2, 0.2)   // 砂浜に転がっているときの傾き
    };
  }

  function rockPath(rock, hw, hh) {
    ctx.beginPath();
    for (var i = 0; i < rock.pts.length; i++) {
      var x = rock.pts[i].x * hw, y = rock.pts[i].y * hh;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawRock(rock, width) {
    var hw = width / 2, hh = (width / rock.flat) / 2;
    ctx.save();
    rockPath(rock, hw, hh);
    var g = ctx.createLinearGradient(-hw * 0.7, -hh, hw * 0.7, hh);
    g.addColorStop(0, hsl(rock.hue, rock.sat, rock.light + 17));
    g.addColorStop(0.55, hsl(rock.hue, rock.sat, rock.light));
    g.addColorStop(1, hsl(rock.hue, rock.sat, rock.light - 19));
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    ctx.clip();
    for (var i = 0; i < rock.facets.length; i++) {
      var f = rock.facets[i];
      ctx.beginPath();
      ctx.moveTo(f.tri[0].x * hw, f.tri[0].y * hh);
      ctx.lineTo(f.tri[1].x * hw, f.tri[1].y * hh);
      ctx.lineTo(f.tri[2].x * hw, f.tri[2].y * hh);
      ctx.closePath();
      ctx.fillStyle = f.shade < 0 ? "rgba(12,16,20," + (-f.shade) + ")" : "rgba(255,255,255," + f.shade + ")";
      ctx.fill();
    }
    if (rock.moss) {
      ctx.beginPath();
      ctx.ellipse(rock.moss.x * hw, rock.moss.y * hh, rock.moss.r * hw, rock.moss.r * hh, 0, 0, TAU);
      ctx.fillStyle = "rgba(104,132,66,.34)";
      ctx.fill();
    }
    for (var s = 0; s < rock.specks.length; s++) {
      var sp = rock.specks[s];
      ctx.beginPath();
      ctx.ellipse(sp.x * hw, sp.y * hh, sp.r * hw, sp.r * hh, 0, 0, TAU);
      ctx.fillStyle = sp.d < 0 ? "rgba(10,14,18," + (-sp.d) + ")" : "rgba(255,255,255," + sp.d + ")";
      ctx.fill();
    }
    ctx.restore();

    rockPath(rock, hw, hh);
    ctx.strokeStyle = "rgba(18,22,26,.45)";
    ctx.lineWidth = Math.max(1, width * 0.012);
    ctx.stroke();
    ctx.restore();
  }

  /* ============ 素材 ============ */
  var ojisanImg = new Image();
  var ready = false;
  ojisanImg.onload = function () { ready = true; };
  ojisanImg.src = "img/ojisan.png";

  var stars = [];
  for (var si = 0; si < 90; si++) {
    stars.push({ x: Math.random() * W, y: Math.random() * (WATER_Y - 40), r: rnd(0.6, 1.7), tw: rnd(0, TAU) });
  }
  var sandDots = [];
  for (var di = 0; di < 260; di++) {
    sandDots.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(0.6, 2.4), d: rnd(0.04, 0.16) });
  }

  /* ============ 音 ============ */
  var actx = null;
  function audio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }

  function beep(freq, dur, type, gain) {
    try {
      var a = audio(), t0 = a.currentTime;
      var osc = a.createOscillator(), g = a.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(gain || 0.14, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(a.destination);
      osc.start(t0); osc.stop(t0 + dur);
    } catch (e) {}
  }

  // ゲージや矢印が動いているあいだ、高さの変わる音を鳴らし続ける
  var toneOsc = null, toneGain = null, toneKind = null;
  function toneStart(kind, type, vol) {
    try {
      toneStop();
      var a = audio();
      toneOsc = a.createOscillator();
      toneGain = a.createGain();
      toneOsc.type = type;
      toneGain.gain.setValueAtTime(vol, a.currentTime);
      toneOsc.connect(toneGain); toneGain.connect(a.destination);
      toneOsc.start();
      toneKind = kind;
    } catch (e) {}
  }
  var toneFedAt = 0;
  function toneFreq(f) {
    toneFedAt = performance.now();
    try { if (toneOsc) toneOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.015); } catch (e) {}
  }
  function toneStop() {
    try {
      if (!toneOsc) return;
      var osc = toneOsc, g = toneGain, a = audio();
      g.gain.setTargetAtTime(0, a.currentTime, 0.02);
      setTimeout(function () { try { osc.stop(); } catch (e) {} }, 140);
    } catch (e) {}
    toneOsc = null; toneGain = null; toneKind = null;
  }

  // タブやウィンドウから離れると描画ループが止まり、音を止める処理も走らなくなる。
  // 離れた時点で必ず消し、描画が途切れた場合も鳴りっぱなしにならないよう見張る。
  function silence() {
    toneStop();
    try { if (actx) actx.suspend(); } catch (e) {}
  }
  function unsilence() {
    try { if (actx) actx.resume(); } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) silence(); else unsilence();
  });
  window.addEventListener("blur", silence);
  window.addEventListener("focus", unsilence);
  setInterval(function () {
    if (toneOsc && performance.now() - toneFedAt > 400) toneStop();
  }, 250);

  function fanfare() {
    var notes = [523, 659, 784, 1047, 1319];
    for (var i = 0; i < notes.length; i++) {
      (function (f, d) {
        setTimeout(function () { beep(f, d, "square", 0.13); }, i * 135);
      })(notes[i], i === notes.length - 1 ? 0.7 : 0.22);
    }
  }

  /* ============ 状態 ============ */
  var S = {
    SELECT: "select", REVEAL: "reveal", AIM: "aim", POWER: "power", WIND: "wind",
    FLY: "fly", SKIM: "skim", APPROACH: "approach", HIT: "hit",
    SINK: "sink", SELFHIT: "selfhit", RESULT: "result"
  };
  var REVEAL_DUR = 0.6;      // 拾った石を見せる時間
  var CAM_MIN = -140;        // 投げる前は、おじさんが真ん中寄りに見えるところまで寄せる
  var APPROACH_LEN = 430;    // 一周して浜が見えてから着弾するまでの助走
  var APPROACH_VX = 1450;
  var BASE_TILT = -0.13;     // 石は少しだけ頭を上げた姿勢のまま飛ぶ
  var SEL_COUNT = 16;        // 砂浜に転がっている石の数
  var SEL_SPACING = 250;
  var SEL_SPEED = 1575;      // 砂浜を探し回る速さ
  var WIND_DUR = 0.55;       // 投げる直前のタメ
  var SKIM_DELAY = 3.0;      // 投げてからこの秒数は普通に跳ねさせ、そのあと加速に入る

  var state, t, camX, particles, choices, rock, power, aimT, windT;
  var body, traveled, skim, hitT, ojiFly, resultM, sinkT;
  var selScroll;
  var selfT, squash, armed, crushed, hitReal;
  var flyT, grazing, islands, speedLines, islandAcc;
  var revealT, selTick, confetti;
  var shareMsg = "", shareMsgT = 0, shareHit = 0, retryHit = 0;

  function newRound() {
    state = S.SELECT;
    t = 0; camX = CAM_MIN; particles = [];
    revealT = 0; selTick = 0; confetti = [];
    shareMsg = ""; shareMsgT = 0; shareHit = 0;
    choices = [];
    for (var i = 0; i < SEL_COUNT; i++) {
      var r = makeRock();
      r.sy = rnd(H * 0.36, H * 0.74);   // 砂浜のどのあたりに転がっているか
      choices.push(r);
    }
    rock = choices[0];
    selScroll = 0;
    power = 0; aimT = 0; windT = 0;
    body = { x: ROCK_X, y: 0, vx: 0, vy: 0, rot: 0 };
    traveled = 0; resultM = 0; sinkT = 0; hitT = 0; hitReal = 0; selfT = 0; squash = 0; armed = false;
    crushed = false; flyT = 0; grazing = false;
    islands = []; speedLines = []; islandAcc = 0;
    skim = null;
    ojiFly = null;
  }
  newRound();

  // タメ: ぐっと沈み込んでから、最後に一気に伸び上がる
  function windCrouch() {
    var wp = clamp(windT / WIND_DUR, 0, 1);
    return wp < 0.7 ? Math.sin((wp / 0.7) * Math.PI / 2)
                    : Math.cos(((wp - 0.7) / 0.3) * Math.PI / 2);
  }

  function rockHalfH() { return (ROCK_W / rock.flat) / 2; }
  function heldCenterY() { return HEAD_Y + 10 - rockHalfH(); }   // 頭に乗せた状態
  function flyHalfH() { return rockHalfH(); }
  function aimRad() { return (MIN_ANGLE + aimT * (MAX_ANGLE - MIN_ANGLE)) * Math.PI / 180; }

  function spawnSplash(x, y, n, spread, col) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: rnd(-1, 1) * spread, vy: rnd(-1, -0.15) * spread * 1.4,
        life: rnd(0.35, 0.8), age: 0, r: rnd(1.6, 3.6),
        col: col || "255,255,255"
      });
    }
    if (particles.length > 420) particles.splice(0, particles.length - 420);
  }

  /* ============ 進行 ============ */
  function launch() {
    var speed = 620 + power * 520;
    var a = aimRad();
    body.x = ROCK_X; body.y = heldCenterY();
    body.vx = Math.cos(a) * speed;
    body.vy = -Math.sin(a) * speed;
    body.rot = BASE_TILT;      // 水切りの石は回らず、水面と平行のまま跳ねていく
    flyT = 0; grazing = false;
    state = S.FLY;
    beep(520, 0.12, "square", 0.13);
  }

  function startSkim() {
    // 水面を滑りはじめた瞬間の速度と石の平たさで、最終的な到達距離が決まる
    var flatNorm = clamp((rock.flat - 1) / 2.3, 0, 1);
    var q = clamp(body.vx / V_REF, 0, 1.2) * (0.35 + 0.65 * flatNorm);
    var total = D_MAX * Math.pow(q, 3);
    var jackpot = total >= EARTH_M;
    // 一周ぶんに届く場合は、浜が見えるところまでで滑走を終えて助走に切り替える
    if (jackpot) total = (ROCK_X + EARTH_M - APPROACH_LEN) - body.x;

    // 距離に応じて、加速を最大3段階まで踏んでいく。
    // 各段は2.5秒ほど流し、次の段へは切れ目なく速さと音程が上がっていく。
    var stages = total > EARTH_M * 0.35 ? 3 : (total > EARTH_M * 0.06 ? 2 : 1);
    var levels = [1, 1.8, 2.6];
    var segs = [];
    for (var i = 0; i < stages; i++) {
      segs.push({ dur: 1.9, v0: levels[i], v1: levels[i] });
      if (i < stages - 1) segs.push({ dur: 0.6, v0: levels[i], v1: levels[i + 1] });
    }
    segs.push({ dur: 1.2, v0: levels[stages - 1], v1: 0 });   // 最後は失速して止まる
    var area = 0;
    for (i = 0; i < segs.length; i++) {
      segs[i].a0 = area;
      area += (segs[i].v0 + segs[i].v1) / 2 * segs[i].dur;
    }

    skim = { t: 0, segs: segs, area: area, x0: body.x, total: total, jackpot: jackpot, stage: 0, sndAcc: 0 };
    state = S.SKIM;
    beep(560, 0.14, "square", 0.12);
  }

  function sink() {
    state = S.SINK;
    sinkT = 0;
    resultM = Math.max(0, body.x - ROCK_X);
    spawnSplash(body.x, WATER_Y, 16, 190);
    beep(170, 0.34, "sawtooth", 0.11);
  }

  function thud() {
    state = S.SINK;
    sinkT = 0;
    resultM = Math.max(0, body.x - ROCK_X);
    spawnSplash(body.x, GROUND_Y, 14, 150, "196,168,120");
    beep(130, 0.26, "sawtooth", 0.14);
  }

  function selfHit() {
    state = S.SELFHIT;
    selfT = 0;
    squash = 1;
    crushed = true;   // 結果表示のあいだも潰れたままにする
    body.vx = 0; body.vy = 0;
    resultM = 0;
    spawnSplash(OJISAN_X, GROUND_Y - 20, 24, 210, "196,168,120");
    beep(84, 0.5, "sawtooth", 0.26);
  }

  function hitOjisan() {
    state = S.HIT;
    hitT = 0; hitReal = 0;
    body.x = ROCK_X + EARTH_M;
    traveled = EARTH_M;
    resultM = EARTH_M;
    ojiFly = { x: DEST_OFFSET + OJISAN_X, y: GROUND_Y, vx: 300, vy: -640, rot: 0, spin: 7 };
    spawnSplash(body.x, GROUND_Y - 60, 40, 320);
    spawnSplash(body.x, GROUND_Y - 20, 20, 240, "196,168,120");
    spawnConfetti(body.x, GROUND_Y - 60, 70);
    beep(110, 0.45, "sawtooth", 0.26);
  }

  function spawnConfetti(x, y, n) {
    var cols = ["#ff5a7a", "#ffd166", "#5fd0ff", "#7ce08a", "#d08cff", "#fff"];
    for (var i = 0; i < n; i++) {
      var a = rnd(0, TAU), sp = rnd(120, 620);
      confetti.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180,
        w: rnd(5, 12), h: rnd(8, 16),
        rot: rnd(0, TAU), spin: rnd(-9, 9),
        col: cols[(Math.random() * cols.length) | 0],
        life: rnd(1.6, 3.0), age: 0
      });
    }
  }

  function update(dt) {
    // 一周してぶつかった瞬間だけ、止めて → スローにしてから通常速度に戻す
    if (state === S.HIT) {
      hitReal += dt;
      dt *= hitReal < 0.10 ? 0.02 : (hitReal < 0.95 ? 0.16 : 1);
    }
    t += dt;

    if (state === S.SELECT) {
      selScroll += SEL_SPEED * dt;   // 一定の速さで流し続ける(タップした瞬間に決まる)
      var tick = Math.floor((selScroll + W / 2) / SEL_SPACING);
      if (tick !== selTick) { selTick = tick; beep(1050, 0.03, "square", 0.05); }

    } else if (state === S.REVEAL) {
      revealT += dt;
      if (revealT >= REVEAL_DUR) { state = S.AIM; t = 0; }

    } else if (state === S.POWER) {
      power = (Math.sin(t * 8.4) + 1) / 2;

    } else if (state === S.AIM) {
      aimT = (Math.sin(t * 9.2) + 1) / 2;

    } else if (state === S.WIND) {
      if (windT === 0) beep(220, 0.4, "square", 0.09);   // タメの唸り
      windT += dt;
      if (windT >= WIND_DUR) launch();

    } else if (state === S.FLY) {
      var maxInc = 0.40 + (rock.flat - 1) * 0.16;
      var rest = 0.36 + (rock.flat - 1) * 0.095;
      var fric = 0.79 + (rock.flat - 1) * 0.042;

      flyT += dt;
      if (grazing) body.vx *= Math.pow(0.90, dt);   // 細かく水面を叩いている間はゆるやかに減速

      body.vy += GRAVITY * dt;
      body.x += body.vx * dt;
      body.y += body.vy * dt;
      body.rot += (BASE_TILT - body.rot) * Math.min(1, dt * 7);   // 跳ねた反動から水平に戻る

      var contact = flyHalfH() * 0.8;
      if (body.y + contact >= WATER_Y && body.vy > 0 && body.x > SHORE_RIGHT) {
        var inc = Math.atan2(body.vy, Math.abs(body.vx));
        var speed = Math.hypot(body.vx, body.vy);
        if (inc < maxInc && speed > 120) {
          body.y = WATER_Y - contact;
          spawnSplash(body.x, WATER_Y, 8, 150);
          beep(300 + Math.random() * 150, 0.1, "triangle", 0.1);
          if (body.vy * rest < SKIM_VY) {
            // 跳ねる力を使い切って、水面を細かく叩きはじめた状態
            if (flyT >= SKIM_DELAY) startSkim();
            else { grazing = true; body.vy = -SKIM_VY * 0.85; body.rot = BASE_TILT - 0.12; }
          } else {
            body.vy = -body.vy * rest;
            body.vx *= fric;
            body.rot = BASE_TILT - 0.26;   // 水を蹴った瞬間だけ頭を跳ね上げる
          }
        } else {
          sink();
        }
      }
      // 頭から離れてはじめて、落下の判定を有効にする
      if (!armed && (body.y + flyHalfH() < HEAD_Y - 14 || body.x > OJISAN_X + 90)) armed = true;
      // 真上に投げてしまった場合は、落ちてきて自分に当たる
      if (armed && body.vy > 0 && body.x < SHORE_RIGHT) {
        if (Math.abs(body.x - OJISAN_X) < 75 && body.y + flyHalfH() >= HEAD_Y) selfHit();
        else if (body.y + flyHalfH() >= GROUND_Y) thud();
      }
      traveled = body.x - ROCK_X;
      camX = Math.max(CAM_MIN, body.x - 300);

    } else if (state === S.SKIM) {
      skim.t += dt;
      // いま何段目か、そこまでに進んだ量はどれだけかを求める
      var rem = skim.t, idx = 0;
      while (idx < skim.segs.length - 1 && rem > skim.segs[idx].dur) { rem -= skim.segs[idx].dur; idx++; }
      var seg = skim.segs[idx];
      var sk = clamp(rem / seg.dur, 0, 1);
      var sv = lerp(seg.v0, seg.v1, sk);
      var p = clamp((seg.a0 + (seg.v0 + sv) / 2 * (sk * seg.dur)) / skim.area, 0, 1);
      skim.stage = idx;
      body.x = skim.x0 + skim.total * p;
      var hop = Math.abs(Math.sin(t * (20 + sv * 9)));
      body.y = WATER_Y - flyHalfH() * 0.7 - hop * 18;
      body.rot = BASE_TILT - hop * 0.18;
      traveled = body.x - ROCK_X;
      camX = Math.max(CAM_MIN, body.x - 300);
      if (Math.random() < 0.9) spawnSplash(body.x - rnd(0, 40), WATER_Y, 2, 120);

      // 水を叩く音を、速さに合わせてピッチと間隔を上げながら流す
      skim.sndAcc += dt * (6 + sv * 9);
      if (skim.sndAcc >= 1) {
        skim.sndAcc -= 1;
        beep(280 + sv * 280, 0.05, "triangle", 0.085);
      }

      // 流れていく島と加速線(見た目の速さは頭打ちにして、速さの変化だけ伝える)
      var vis = sv * 1000;
      islandAcc += vis * dt;
      if (islandAcc > 340) {
        islandAcc = 0;
        islands.push({ x: W + 150, w: rnd(50, 140), h: rnd(22, 74), par: rnd(0.30, 0.58) });
        if (islands.length > 24) islands.shift();
      }
      for (var ii = islands.length - 1; ii >= 0; ii--) {
        islands[ii].x -= vis * islands[ii].par * dt;
        if (islands[ii].x < -260) islands.splice(ii, 1);
      }
      if (vis > 260 && Math.random() < 0.85) {
        speedLines.push({
          x: W + rnd(0, 220), y: rnd(WATER_Y + 8, H - 10), w: rnd(90, 280),
          a: rnd(0.35, 0.8), life: rnd(0.25, 0.5), age: 0
        });
        if (speedLines.length > 70) speedLines.shift();
      }
      for (var li = speedLines.length - 1; li >= 0; li--) {
        var ln = speedLines[li];
        ln.age += dt;
        ln.x -= vis * 1.3 * dt;
        if (ln.age > ln.life || ln.x < -300) speedLines.splice(li, 1);
      }

      if (p >= 1) {
        speedLines.length = 0;
        if (skim.jackpot) { state = S.APPROACH; } else sink();
      }

    } else if (state === S.APPROACH) {
      body.x += APPROACH_VX * dt;
      var hopA = Math.abs(Math.sin(t * 13));
      body.y = WATER_Y - flyHalfH() * 0.7 - hopA * 30;
      body.rot = BASE_TILT - hopA * 0.22;
      traveled = body.x - ROCK_X;
      camX = body.x - 300;
      if (Math.random() < 0.5) spawnSplash(body.x - rnd(0, 30), WATER_Y, 2, 130);
      if (body.x >= ROCK_X + EARTH_M) hitOjisan();

    } else if (state === S.SINK) {
      sinkT += dt;
      if (body.x > SHORE_RIGHT) {
        body.y += 90 * dt;
        body.rot += 0.9 * dt;   // 水に落ちたときだけ、ぐらりと傾いて沈む
      }
      if (sinkT > 0.85) state = S.RESULT;

    } else if (state === S.SELFHIT) {
      selfT += dt;
      squash = 0.75 + 0.25 * Math.max(0, 1 - selfT * 2.5);
      body.x = OJISAN_X;
      body.y = GROUND_Y - OJISAN_W * OJISAN_FOOT * (1 - squash * 0.42) - flyHalfH();
      body.rot += (0 - body.rot) * Math.min(1, dt * 4);
      camX = CAM_MIN + (selfT < 0.35 ? (Math.random() - 0.5) * 18 * (1 - selfT / 0.35) : 0);
      if (selfT > 1.9) state = S.RESULT;

    } else if (state === S.HIT) {
      hitT += dt;
      if (ojiFly) {
        ojiFly.vy += 900 * dt;
        ojiFly.x += ojiFly.vx * dt;
        ojiFly.y += ojiFly.vy * dt;
        ojiFly.rot += ojiFly.spin * dt;
      }
      if (hitReal > 2.3) { state = S.RESULT; fanfare(); }
    }

    // 矢印とゲージが動いているあいだは、その値を音の高さで表す
    if (state === S.AIM) {
      if (toneKind !== "aim") toneStart("aim", "sine", 0.05);
      toneFreq(240 + aimT * 540);
    } else if (state === S.POWER) {
      if (toneKind !== "power") toneStart("power", "sawtooth", 0.04);
      toneFreq(150 + power * 430);
    } else if (toneKind) {
      toneStop();
    }

    if (shareHit > 0) shareHit = Math.max(0, shareHit - dt * 4);
    if (retryHit > 0) retryHit = Math.max(0, retryHit - dt * 4);
    if (shareMsg) shareMsgT += dt;

    for (var ci = confetti.length - 1; ci >= 0; ci--) {
      var cf = confetti[ci];
      cf.age += dt;
      if (cf.age > cf.life) { confetti.splice(ci, 1); continue; }
      cf.vy += 520 * dt;
      cf.vx *= Math.pow(0.5, dt);
      cf.x += cf.vx * dt;
      cf.y += cf.vy * dt;
      cf.rot += cf.spin * dt;
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.age += dt;
      if (pt.age > pt.life) { particles.splice(i, 1); continue; }
      pt.vy += 620 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }
  }

  /* ============ 入力 ============ */
  /* 結果画面のボタン */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.68;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }

  function doShare() {
    shareHit = 1;
    zShare({
      text: km(resultM) + "の水切りに成功しました #水切り世界一周",
      done: function (res) {
        shareMsg = res === "blocked" ? "ポップアップを許可してください" : "";
        shareMsgT = 0;
      }
    });
  }

  function tap(x, y) {
    if (!ready) return;
    if (state === S.RESULT) {
      // 結果画面はボタンでしか進まない(スペースキーはもう一度に割り当てる)
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "share") { shareHit = 1; doShare(); }
      else if (hit === "retry") { retryHit = 1; newRound(); }
      return;
    }
    if (state === S.SELECT) {
      // いま中央にいちばん近い石を、そのまま掴む
      var L = SEL_COUNT * SEL_SPACING, best = 0, bestD = Infinity;
      for (var i = 0; i < SEL_COUNT; i++) {
        var sx = ((i * SEL_SPACING - selScroll + 300) % L + L) % L - 300;
        var d = Math.abs(sx - W / 2);
        if (d < bestD) { bestD = d; best = i; }
      }
      rock = choices[best];
      state = S.REVEAL; revealT = 0;
      beep(760, 0.09, "triangle", 0.13);
      setTimeout(function () { beep(1140, 0.16, "triangle", 0.13); }, 90);
    } else if (state === S.AIM) {
      state = S.POWER; t = 0;
      beep(900, 0.1, "square", 0.12);
    } else if (state === S.POWER) {
      state = S.WIND; windT = 0;
      beep(1000, 0.12, "square", 0.13);
    }
  }

  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    tap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  });

  // スペース(とEnter)でも同じ操作ができるようにする
  window.addEventListener("keydown", function (e) {
    if (e.code !== "Space" && e.key !== " " && e.key !== "Enter") return;
    e.preventDefault();          // ページが下にスクロールしないように
    if (e.repeat) return;        // 押しっぱなしで連打にはしない
    tap();
  });

  /* ============ 描画 ============ */
  function dayPhase() { return traveled / EARTH_M; }

  function drawSky(phase) {
    var ang = phase * TAU;
    var night = clamp(-Math.cos(ang), 0, 1);
    var dusk = clamp(1 - Math.abs(Math.cos(ang)) * 2.6, 0, 1);

    var top = mixRGB([150, 214, 255], [10, 14, 34], night);
    var bot = mixRGB([228, 246, 255], [26, 36, 66], night);
    bot = mixRGB(bot, [255, 158, 96], dusk * 0.75);
    top = mixRGB(top, [225, 120, 110], dusk * 0.35);

    var g = ctx.createLinearGradient(0, 0, 0, WATER_Y);
    g.addColorStop(0, rgb(top));
    g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, WATER_Y);

    if (night > 0.05) {
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.globalAlpha = night * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.6 + st.tw)));
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 太陽と月は、走りはじめて世界が動きだしてから現れる
    var orbA = clamp((phase - 0.015) / 0.05, 0, 1);
    drawOrb(ang, "#ffe9a8", "#ffd166", 34, orbA);
    drawOrb(ang + Math.PI, "#f2f4ff", "#d8ddf0", 24, orbA);
    return night;
  }

  function drawOrb(ang, c1, c2, r, alpha) {
    if (alpha <= 0) return;
    var x = W * 0.5 + Math.sin(ang) * (W * 0.42);
    var y = (WATER_Y - 60) - Math.cos(ang) * (WATER_Y - 120);
    if (y > WATER_Y + 20) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawWater(night, dusk) {
    var c1 = mixRGB([88, 182, 216], [20, 34, 64], night);
    var c2 = mixRGB([24, 106, 142], [6, 12, 28], night);
    c1 = mixRGB(c1, [214, 132, 104], dusk * 0.5);
    var g = ctx.createLinearGradient(0, WATER_Y, 0, H);
    g.addColorStop(0, rgb(c1));
    g.addColorStop(1, rgb(c2));
    ctx.fillStyle = g;
    ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 2;
    for (var i = 0; i < 6; i++) {
      var wy = WATER_Y + 14 + i * 22;
      ctx.beginPath();
      for (var x = -40; x <= W + 40; x += 10) {
        var yy = wy + Math.sin((x + camX % 100000) * 0.03 + t * 2 + i) * 3;
        if (x === -40) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.globalAlpha = 0.16;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawShore(offset, night) {
    var left = offset - 420 - camX, right = offset + SHORE_RIGHT - camX;
    if (right < -40 || left > W + 40) return;
    var sand = mixRGB([206, 180, 132], [56, 62, 84], night);
    var grass = mixRGB([124, 174, 92], [30, 48, 52], night);
    ctx.fillStyle = rgb(sand);
    ctx.beginPath();
    ctx.moveTo(left, H);
    ctx.lineTo(left, WATER_Y - 12);
    ctx.quadraticCurveTo((left + right) / 2, WATER_Y - 64, right, WATER_Y);
    ctx.lineTo(left, WATER_Y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(grass);
    ctx.beginPath();
    ctx.moveTo(left, WATER_Y - 34);
    ctx.quadraticCurveTo((left + right) / 2, WATER_Y - 96, right - 40, WATER_Y - 20);
    ctx.lineTo(left, WATER_Y - 12);
    ctx.closePath();
    ctx.fill();
  }

  function drawOjisan(worldX, y, night, rot, sq) {
    var x = worldX - camX;
    if (x < -140 || x > W + 140) return;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    // 投げる直前のタメと、石が落ちてきたときは足元を軸に潰れる
    var s = sq || (state === S.WIND ? windCrouch() * 0.26 : 0);
    if (s) ctx.scale(1 + s * 0.40, 1 - s * 0.42);
    ctx.drawImage(ojisanImg, -OJISAN_W / 2, -OJISAN_W * OJISAN_FOOT, OJISAN_W, OJISAN_W);
    if (night > 0.05) {
      ctx.globalAlpha = night * 0.55;
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = "#0d1430";
      ctx.fillRect(-OJISAN_W / 2, -OJISAN_W * OJISAN_FOOT, OJISAN_W, OJISAN_W);
    }
    ctx.restore();
  }

  function drawIslands(night) {
    var col = rgb(mixRGB([92, 128, 96], [14, 22, 38], night));
    for (var i = 0; i < islands.length; i++) {
      var s = islands[i];
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(s.x - s.w, WATER_Y + 2);
      ctx.quadraticCurveTo(s.x - s.w * 0.4, WATER_Y - s.h, s.x, WATER_Y - s.h * 0.92);
      ctx.quadraticCurveTo(s.x + s.w * 0.5, WATER_Y - s.h * 0.7, s.x + s.w, WATER_Y + 2);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawConfetti() {
    for (var i = 0; i < confetti.length; i++) {
      var c = confetti[i];
      var sx = c.x - camX;
      if (sx < -30 || sx > W + 30) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - c.age / c.life);
      ctx.translate(sx, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.col;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * (0.4 + 0.6 * Math.abs(Math.cos(c.rot * 1.7))));
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawSpeedLines() {
    ctx.lineCap = "round";
    for (var i = 0; i < speedLines.length; i++) {
      var l = speedLines[i];
      ctx.strokeStyle = "rgba(255,255,255," + l.a * (1 - l.age / l.life) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(l.x, l.y);
      ctx.lineTo(l.x + l.w, l.y);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var sx = p.x - camX;
      if (sx < -20 || sx > W + 20) continue;
      ctx.fillStyle = "rgba(" + p.col + "," + Math.max(0, 1 - p.age / p.life) * 0.9 + ")";
      ctx.beginPath();
      ctx.arc(sx, p.y, p.r, 0, TAU);
      ctx.fill();
    }
  }

  // 右へいくほど太くなるくさび形。太さがそのまま力の強さになる
  function drawGauge(v) {
    var bw = W * 0.46, bx = (W - bw) / 2, cy = 78;
    var hMin = 3, hMax = 30;
    function wedge(x0, x1, h0, h1) {
      ctx.beginPath();
      ctx.moveTo(x0, cy - h0);
      ctx.lineTo(x1, cy - h1);
      ctx.lineTo(x1, cy + h1);
      ctx.lineTo(x0, cy + h0);
      ctx.closePath();
    }
    ctx.save();
    wedge(bx - 4, bx + bw + 4, hMin + 5, hMax + 5);
    ctx.fillStyle = "rgba(8,16,26,.35)";
    ctx.fill();

    wedge(bx, bx + bw, hMin, hMax);
    var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, "#6ad4ff");
    g.addColorStop(0.5, "#ffe15a");
    g.addColorStop(1, "#ff5a5a");
    ctx.fillStyle = g;
    ctx.fill();

    var mx = bx + v * bw, mh = lerp(hMin, hMax, v) + 7;
    ctx.fillStyle = "#fff";
    ctx.fillRect(mx - 2, cy - mh, 4, mh * 2);
    ctx.restore();
  }

  function drawArrow() {
    var a = aimRad();
    var ca = Math.cos(a), sa = Math.sin(a);
    // 石の外側から生やして、石に埋もれないようにする
    var ox = ROCK_X - camX + ca * (ROCK_W / 2) * 0.85;
    var oy = heldCenterY() - sa * rockHalfH() * 0.85;
    var len = 88;
    var ty = oy - sa * len;
    if (ty < 84) len = Math.max(24, (oy - 84) / Math.max(sa, 0.001));
    var tx = ox + ca * len;
    ty = oy - sa * len;
    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.5)";
    ctx.shadowBlur = 8;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    var ha = Math.atan2(-Math.sin(a), Math.cos(a)), hl = 20, hs = 0.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - hl * Math.cos(ha - hs), ty - hl * Math.sin(ha - hs));
    ctx.lineTo(tx - hl * Math.cos(ha + hs), ty - hl * Math.sin(ha + hs));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawNumber(x, y, size, str) {
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.55)";
    ctx.shadowBlur = 8;
    ctx.font = "800 " + size + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function km(m) { return (m / 1000).toFixed(1) + "km"; }

  function drawButton(b, pressed) {
    var pop = 1 + 0.06 * pressed;
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.scale(pop, pop);
    var hw = b.w / 2, hh = b.h / 2, rad = hh;
    ctx.beginPath();
    ctx.moveTo(-hw + rad, -hh);
    ctx.arcTo(hw, -hh, hw, hh, rad);
    ctx.arcTo(hw, hh, -hw, hh, rad);
    ctx.arcTo(-hw, hh, -hw, -hh, rad);
    ctx.arcTo(-hw, -hh, hw, -hh, rad);
    ctx.closePath();
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#16202e";
    ctx.stroke();
    ctx.fillStyle = "#16202e";
    ctx.font = "800 24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.label, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  function drawResultButtons() {
    var bs = resultButtons();
    drawButton(bs[0], retryHit);
    drawButton(bs[1], shareHit);
    if (shareMsg && shareMsgT < 2.6) {
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.font = "700 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(shareMsg, W / 2, bs[0].y + bs[0].h + 30);
      ctx.restore();
    }
  }

  function drawSelect() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#e6d3a8");
    g.addColorStop(1, "#c9ad7e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 砂粒は奥と手前で流れる速さを変えて、浜を見て回っている感じを出す
    for (var i = 0; i < sandDots.length; i++) {
      var d = sandDots[i];
      var par = (i % 2) ? 1 : 0.45;
      var dx = ((d.x - selScroll * par) % W + W) % W;
      ctx.fillStyle = "rgba(90,70,40," + d.d + ")";
      ctx.beginPath();
      ctx.arc(dx, d.y, d.r, 0, TAU);
      ctx.fill();
    }

    // 拾う位置
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(W / 2 - 74, 0, 148, H);

    var L = SEL_COUNT * SEL_SPACING, w = 132;
    for (var k = 0; k < SEL_COUNT; k++) {
      var sx = ((k * SEL_SPACING - selScroll + 300) % L + L) % L - 300;
      if (sx < -220 || sx > W + 220) continue;
      var c = choices[k];
      ctx.save();
      ctx.translate(sx, c.sy);
      ctx.fillStyle = "rgba(90,72,44,.22)";
      ctx.beginPath();
      ctx.ellipse(4, (w / c.flat) / 2 + 5, w * 0.48, w * 0.09, 0, 0, TAU);
      ctx.fill();
      ctx.rotate(c.lie);
      drawRock(c, w);
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "rgba(24,30,38,.65)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W / 2, H * 0.20);
    ctx.lineTo(W / 2 - 15, H * 0.20 - 23);
    ctx.lineTo(W / 2 + 15, H * 0.20 - 23);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // 拾った石を、フラッシュとともに一拍見せる
  function drawReveal() {
    drawSelect();
    var p = clamp(revealT / REVEAL_DUR, 0, 1);
    ctx.fillStyle = "rgba(12,18,26,.45)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H * 0.52);
    var pop = 1 + 0.25 * Math.max(0, 1 - p * 6);
    ctx.scale(pop, pop);
    drawRock(rock, 250);
    ctx.restore();
    if (revealT < 0.22) {
      ctx.fillStyle = "rgba(255,255,255," + (1 - revealT / 0.22) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!ready) {
      ctx.fillStyle = "#0b1622";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    if (state === S.SELECT) { drawSelect(); return; }
    if (state === S.REVEAL) { drawReveal(); return; }

    var phase = dayPhase();
    var ang = phase * TAU;
    var night = clamp(-Math.cos(ang), 0, 1);
    var dusk = clamp(1 - Math.abs(Math.cos(ang)) * 2.6, 0, 1);

    drawSky(phase);
    drawWater(night, dusk);
    drawIslands(night);
    drawShore(0, night);
    drawShore(DEST_OFFSET, night);

    // 投げた場所のおじさん(潰れたら結果表示のあいだも潰れたまま)
    if (state !== S.HIT || !ojiFly) {
      var crush = (state === S.SELFHIT || (crushed && state === S.RESULT)) ? squash : 0;
      drawOjisan(OJISAN_X, GROUND_Y, night, 0, crush);
    }
    // 一周した先のおじさん(＝同じ砂浜)
    if (ojiFly) drawOjisan(ojiFly.x, ojiFly.y, night, ojiFly.rot);
    else drawOjisan(DEST_OFFSET + OJISAN_X, GROUND_Y, night);

    if (state === S.AIM || state === S.POWER || state === S.WIND) {
      ctx.save();
      // タメの間は石も一緒に沈み込んで、小刻みに震える
      var cr = state === S.WIND ? windCrouch() : 0;
      var shake = cr > 0.2 ? (Math.random() - 0.5) * 5 * cr : 0;
      ctx.translate(ROCK_X - camX + shake, heldCenterY() + cr * 16);
      drawRock(rock, ROCK_W);
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(body.x - camX, body.y);
      ctx.rotate(body.rot);
      drawRock(rock, ROCK_W);
      ctx.restore();
    }

    drawParticles();
    drawConfetti();
    drawSpeedLines();

    if (state === S.HIT && hitReal < 0.5) {
      ctx.fillStyle = "rgba(255,255,255," + (1 - hitReal / 0.5) * 0.7 + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (state === S.SELFHIT && selfT < 0.22) {
      ctx.fillStyle = "rgba(255,236,180," + (1 - selfT / 0.22) * 0.55 + ")";
      ctx.fillRect(0, 0, W, H);
    }

    if (state === S.AIM) drawArrow();
    if (state === S.POWER) drawGauge(power);

    if (state === S.FLY || state === S.SKIM || state === S.APPROACH) drawNumber(W - 96, 52, 30, km(traveled));

    if (state === S.RESULT) {
      ctx.fillStyle = "rgba(8,16,26,.55)";
      ctx.fillRect(0, 0, W, H);
      drawNumber(W / 2, H * 0.5, 92, km(resultM));
      drawResultButtons();
    }
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
