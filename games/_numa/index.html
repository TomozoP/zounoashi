<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>底なし沼からの正しい抜け出し方シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 底なし沼からの正しい抜け出し方シミュレーター

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", CLEAR: "clear", SINK: "sink", RESULT: "result" };
  var state, score, T, held, keyMode = false, won = false;

  /* 体の寸法（ゲームの座標） */
  var K = 1.45, TORSO = 100 * K, HEAD_AT = 128 * K, HEAD_R = 28, LEG = 112 * K, ARM = 84 * K;
  var SY, SHORE;                               /* 沼の表面の高さ、岸の始まり */
  function place() {
    SY = Math.round(H * 0.52);
    SHORE = W - 66;
  }

  /* 人：腰の位置 x と沈み d（腰が表面より下に何px）、上体の傾き th（0=直立、+で岸側へ仰向け）、
     脚の上がり ph（0=真下、+で反対側へ浮く）、手の位置（肩からの相対） */
  var P, grab, finger, fv, panic, bubbles, splats, sinkT, endT, guideT;
  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    won = false;
    P = { x: 110, d: 58, th: 0, ph: 0, hx: 10, hy: 70, shake: 0 };
    grab = null; finger = null; fv = 0; panic = 0;
    bubbles = []; splats = []; sinkT = 0; endT = 0; guideT = 0;
  }

  function hip() { return { x: P.x, y: SY + P.d }; }
  function dirT() { return { x: Math.sin(P.th), y: -Math.cos(P.th) }; }
  function shoulder() { var h = hip(), t = dirT(); return { x: h.x + t.x * TORSO * 0.92, y: h.y + t.y * TORSO * 0.92 }; }
  function headPos() { var h = hip(), t = dirT(); return { x: h.x + t.x * HEAD_AT, y: h.y + t.y * HEAD_AT }; }
  function lying() { return P.th > 1.15; }
  function legsFree() { return P.ph > 1.0; }
  function canSwim() { return lying() && legsFree(); }
  function handPos() { var s = shoulder(); return { x: s.x + P.hx, y: s.y + P.hy }; }

  /* ============ 進行 ============ */
  var PANIC_V = 650;                           /* これより速く指を動かすともがいたことになる */
  function update(dt) {
    T += dt;
    guideT += dt;
    updateFx(dt);
    if (state === S.CLEAR) { updateClear(dt); return; }
    if (state === S.SINK) {
      sinkT += dt; P.d += 40 * dt;
      if (Math.random() < dt * 8) addBubble(P.x + 30 + (Math.random() - .5) * 60, 6);
      if (sinkT > 1.8) toResult();
      return;
    }
    if (state !== S.PLAY) return;

    /* 指の速さ（なめらかにならす） */
    fv *= Math.pow(0.02, dt);
    var over = Math.max(0, fv - PANIC_V) / PANIC_V;
    var pt = Math.min(1, over);
    panic += (pt - panic) * Math.min(1, dt * (pt > panic ? 3 : 5));
    if (panic < 0.02) panic = 0;
    if (panic > 0.15) {
      P.shake = panic;
      if (Math.random() < dt * 20 * panic) splash(P.x + (Math.random() - .5) * 70, 1);
      if (Math.random() < dt * 6 * panic) gurgle();
    } else P.shake *= 0.9;

    /* 上体：頭をつかむと指の方へゆっくり傾く（速く動かしても体は追いつかない） */
    if (grab === "head" && finger) {
      var h = hip();
      var want = Math.atan2(finger.x - h.x, -(finger.y - h.y));
      want = Math.max(-0.35, Math.min(1.5, want));
      var rate = 0.85 * (1 - panic * 0.8);
      P.th += Math.max(-rate * dt, Math.min(rate * dt, want - P.th));
    }

    /* 沈む・浮く。立ったままだとゆっくり、もがくと一気に沈む。寝そべると浮く */
    var lie = Math.max(0, Math.min(1, (P.th - 0.5) / 0.95));
    P.d += (lie > 0.6 ? 0 : 5) * dt + 85 * panic * dt;
    P.d -= 120 * lie * (1 - panic) * dt;
    var floor = -6 + (1 - Math.min(1, P.ph / 1.3)) * 18;      /* 脚が埋まっているうちは浮ききらない */
    if (P.d < floor) P.d = floor;

    /* 脚：仰向けで落ち着いていると少しずつ抜けて浮いてくる。もがく・起き上がると戻る */
    if (lying() && panic < 0.25) P.ph += 0.42 * (1 - panic * 3) * dt;
    if (P.th < 0.9) P.ph -= 0.35 * dt;
    P.ph -= 0.9 * panic * dt;
    P.ph = Math.max(0, Math.min(1.45, P.ph));

    /* 腕：つかんだ手は肩の届く範囲で指を追う。泥の中で後ろへかくと岸へ進む */
    var s = shoulder();
    var tx, ty;
    if (grab === "hand" && finger) { tx = finger.x - s.x; ty = finger.y - s.y; }
    else {
      var t = dirT();                          /* 何もしないときは体の横に沿わせる */
      tx = -t.x * 30 + (-t.y) * 18 + 6; ty = -t.y * 30 * 0 + t.x * 0 + 64 * Math.cos(P.th) + 26 * Math.sin(P.th) ;
    }
    var L = Math.hypot(tx, ty);
    if (L > ARM) { tx *= ARM / L; ty *= ARM / L; }
    var mv = 700 * dt;
    var dx = tx - P.hx, dy = ty - P.hy, dl = Math.hypot(dx, dy);
    if (dl > mv) { dx *= mv / dl; dy *= mv / dl; }
    var inMud = s.y + P.hy > SY + 4;
    if (grab === "hand" && inMud && dx < 0) {
      if (canSwim() && panic < 0.3) {
        P.x += -dx * 0.35 * (1 - panic * 2);
        if (Math.random() < 0.25) squelch();
      } else if (!canSwim()) {
        P.d += -dx * 0.08;                     /* 立ったまま泥をかいても沈むだけ */
      }
    }
    P.hx += dx; P.hy += dy;
    if (grab === "hand" && inMud && Math.abs(dx) > 1 && Math.random() < 0.3) splash(s.x + P.hx, 0.4);

    if (Math.random() < dt * 1.2) addBubble(20 + Math.random() * (SHORE - 40), 3 + Math.random() * 4);

    /* 岸に頭が届いたら上がる。頭が沈んだら終わり */
    var hp = headPos();
    if (canSwim() && hp.x > SHORE - 6) { state = S.CLEAR; endT = 0; score = T; grab = null; won = true; fanfare(); return; }
    if (hp.y > SY + 18) { state = S.SINK; sinkT = 0; grab = null; won = false; sad(); }
  }

  function updateClear(dt) {
    endT += dt;
    var k = Math.min(1, endT / 1.2);
    P.x += (SHORE + 10 - (P.x + HEAD_AT * 0.4) ) * Math.min(1, dt * 3);
    P.d += (-28 - P.d) * Math.min(1, dt * 3);
    P.hx += (40 - P.hx) * dt * 3; P.hy += (-20 - P.hy) * dt * 3;
    if (endT > 1.8) toResult();
  }
  function toResult() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  /* 泥の粒と泡 */
  function splash(x, n) {
    for (var i = 0; i < 3 + n * 4; i++) splats.push({ x: x, y: SY, vx: (Math.random() - .5) * 220, vy: -120 - Math.random() * 260 * n, r: 3 + Math.random() * 5, t: 0 });
  }
  function addBubble(x, r) { bubbles.push({ x: x, r: r, t: 0, life: 0.8 + Math.random() * 1.2 }); }
  function updateFx(dt) {
    for (var i = splats.length - 1; i >= 0; i--) {
      var p = splats[i]; p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > SY + 4 && p.vy > 0) { splats.splice(i, 1); }
    }
    for (var j = bubbles.length - 1; j >= 0; j--) {
      var b = bubbles[j]; b.t += dt;
      if (b.t > b.life) { bubbles.splice(j, 1); if (b.r > 4) blop(); }
    }
  }

  /* 音 */
  function gurgle() { noiseHit(0.25, 180 + Math.random() * 120, 0.25, 3); tone(90 + Math.random() * 60, 0.18, 0.12, "sine", 50); }
  function squelch() { noiseHit(0.12, 420, 0.12, 2); }
  function blop() { tone(220 + Math.random() * 160, 0.09, 0.05, "sine", 520); }
  function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 0.14, "triangle", null, i * 0.12); }); }
  function sad() { tone(330, 0.5, 0.12, "triangle", 160); tone(160, 0.9, 0.12, "sine", 60, 0.3); }

  /* ============ 入力 ============
     頭をつかんで傾ける、手をつかんで泥をかく。速く動かすともがいて沈む。 */
  var lastF = null;
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY || x == null) return;
    held = true;
    finger = { x: x, y: y }; lastF = { x: x, y: y, t: performance.now() };
    var hp = headPos(), hd = handPos();
    var dH = Math.hypot(x - hp.x, y - hp.y), dA = Math.hypot(x - hd.x, y - hd.y);
    if (dA < 70 && (dA < dH || canSwim())) grab = "hand";
    else if (dH < 90) grab = "head";
    else grab = canSwim() ? "hand" : "head";
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    finger = { x: x, y: y };
    var now = performance.now();
    if (lastF) {
      var ms = now - lastF.t;
      if (ms < 24) return;                     /* 細かすぎる間隔は速さがぶれるのでまとめて測る */
      var v = Math.hypot(x - lastF.x, y - lastF.y) / (ms / 1000);
      fv = Math.max(fv, v);
    }
    lastF = { x: x, y: y, t: now };
  }
  function up() {
    if (!held) return;
    held = false;
    grab = null; finger = null; lastF = null;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state === S.INTRO) { startButton.click(); }
    if (n === 1) { newRound(); P.th = 1.35; P.ph = 1.2; P.d = 0; }
    if (n === 2) { newRound(); P.th = 1.35; P.ph = 1.3; P.d = -4; P.x = SHORE - HEAD_AT - 30; }
    if (n === 3) { if (state === S.PLAY) { panic = 1; fv = 3000; } }
    if (n === 9) { newRound(); T = 12.3; P.th = 1.35; P.ph = 1.3; P.d = -4; P.x = SHORE - HEAD_AT; }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function scoreText() { return won ? zT(score.toFixed(1) + "秒", score.toFixed(1) + "s") : zT("沈没", "SANK"); }
  function doShare() {
    /* ▼SHARE */
    var text = won
      ? zT("底なし沼から" + score.toFixed(1) + "秒で正しく抜け出しました", "Properly escaped quicksand in " + score.toFixed(1) + " seconds")
      : zT("もがいて底なし沼に沈みました", "Struggled and sank into the quicksand");
    window.zResultActions.x({ text: text + zT(" #底なし沼からの正しい抜け出し方シミュレーター", " #QuicksandEscapeSimulator") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, SY);
    g.addColorStop(0, "#5d6f62"); g.addColorStop(0.7, "#a9b394"); g.addColorStop(1, "#c9c49a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, SY + 2);
    /* 遠くの林 */
    ctx.fillStyle = "rgba(60,78,62,.55)";
    ctx.beginPath(); ctx.moveTo(0, SY);
    for (var x = 0; x <= W; x += 30) ctx.lineTo(x, SY - 70 - Math.sin(x * 0.05) * 18 - Math.sin(x * 0.13 + 1) * 10);
    ctx.lineTo(W, SY); ctx.fill();
    /* 枯れ木 */
    deadTree(70, SY - 4, 1.0); deadTree(300, SY - 2, 0.7);
    /* もや */
    ctx.fillStyle = "rgba(230,232,210,.25)";
    ctx.fillRect(0, SY - 40, W, 40);
  }
  function deadTree(x, y, k) {
    ctx.strokeStyle = "#3d3a2c"; ctx.lineCap = "round";
    ctx.lineWidth = 12 * k;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6 * k, y - 210 * k); ctx.stroke();
    ctx.lineWidth = 6 * k;
    ctx.beginPath(); ctx.moveTo(x + 4 * k, y - 120 * k); ctx.lineTo(x - 50 * k, y - 175 * k); ctx.lineTo(x - 62 * k, y - 205 * k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 5 * k, y - 160 * k); ctx.lineTo(x + 52 * k, y - 200 * k); ctx.stroke();
    ctx.lineWidth = 4 * k;
    ctx.beginPath(); ctx.moveTo(x + 30 * k, y - 183 * k); ctx.lineTo(x + 40 * k, y - 230 * k); ctx.stroke();
  }

  function drawShore() {
    var top = SY - 26;
    ctx.fillStyle = "#4f3d26";
    ctx.beginPath(); ctx.moveTo(SHORE - 20, H); ctx.lineTo(SHORE - 20, SY + 10);
    ctx.quadraticCurveTo(SHORE - 14, top, SHORE + 20, top); ctx.lineTo(W, top - 6); ctx.lineTo(W, H); ctx.fill();
    ctx.fillStyle = "#5f7a3a";
    ctx.beginPath(); ctx.moveTo(SHORE - 12, top + 8); ctx.quadraticCurveTo(SHORE - 6, top - 4, SHORE + 20, top - 4); ctx.lineTo(W, top - 10); ctx.lineTo(W, top + 6); ctx.lineTo(SHORE + 10, top + 8); ctx.fill();
    ctx.strokeStyle = "#6f8f40"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (var i = 0; i < 9; i++) {
      var x = SHORE + 2 + i * 8, h = 16 + (i * 37 % 13);
      ctx.beginPath(); ctx.moveTo(x, top - 2); ctx.quadraticCurveTo(x - 3, top - h * 0.6, x - 6 + (i % 3) * 4, top - h); ctx.stroke();
    }
  }

  function limb(a, b, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function drawPerson() {
    var sh = P.shake * 4;
    var ox = (Math.random() - .5) * sh, oy = (Math.random() - .5) * sh;
    ctx.save(); ctx.translate(ox, oy);
    var h = hip(), t = dirT(), s = shoulder(), hp = headPos();
    var lgx = -Math.sin(P.ph), lgy = Math.cos(P.ph);
    var wig = state === S.PLAY && lying() && !legsFree() ? Math.sin(T * 5) * 0.06 : 0;
    var knee = { x: h.x + (lgx * Math.cos(wig) - lgy * Math.sin(wig)) * LEG * 0.5, y: h.y + (lgy * Math.cos(wig) + lgx * Math.sin(wig)) * LEG * 0.5 };
    var foot = { x: h.x + lgx * LEG, y: h.y + lgy * LEG };
    /* 奥の脚・腕 */
    limb(h, { x: foot.x + 8, y: foot.y - 4 }, 24 * K, "#3b4a5e");
    var other = { x: s.x - P.hx * 0.6 + t.x * 10, y: s.y + Math.abs(P.hy) * 0.7 + 20 };
    limb(s, other, 16 * K, "#b8935f");
    /* 手前の脚 */
    limb(h, knee, 26 * K, "#465a72"); limb(knee, foot, 24 * K, "#465a72");
    limb({ x: foot.x, y: foot.y }, { x: foot.x + lgy * 16 - lgx * 4, y: foot.y - lgx * 16 }, 14 * K, "#2a2420");
    /* 胴（シャツ） */
    limb(h, s, 46 * K, "#c9a96a");
    ctx.save(); ctx.lineCap = "butt"; ctx.strokeStyle = "#6b4a2a"; ctx.lineWidth = 46 * K; ctx.beginPath(); ctx.moveTo(h.x + t.x * 8 * K, h.y + t.y * 8 * K); ctx.lineTo(h.x + t.x * 16 * K, h.y + t.y * 16 * K); ctx.stroke(); ctx.restore();  /* ベルト */
    /* 首と頭 */
    limb(s, { x: s.x + t.x * 18, y: s.y + t.y * 18 }, 16 * K, "#e7b98a");
    drawHead(hp, P.th);
    /* 手前の腕 */
    var hd = handPos();
    var el = { x: (s.x + hd.x) / 2 + t.x * -10, y: (s.y + hd.y) / 2 + 6 };
    limb(s, el, 18 * K, "#c9a96a"); limb(el, hd, 15 * K, "#e7b98a");
    ctx.fillStyle = "#e7b98a"; ctx.beginPath(); ctx.arc(hd.x, hd.y, 10 * K, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawHead(p, rot) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(rot); ctx.scale(-K, K);
    ctx.fillStyle = "#e7b98a";
    ctx.beginPath(); ctx.arc(0, 0, HEAD_R, 0, 7); ctx.fill();
    /* 帽子 */
    ctx.fillStyle = "#b99a5e";
    ctx.beginPath(); ctx.ellipse(0, -14, 40, 8, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -16, 24, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#6b4a2a"; ctx.fillRect(-24, -20, 48, 6);
    /* 顔（岸の方を向く） */
    var scared = panic > 0.2 || (state === S.PLAY && P.d > 95 && !lying()) || state === S.SINK;
    var calm = lying() && !scared;
    ctx.fillStyle = "#1d1714"; ctx.strokeStyle = "#1d1714"; ctx.lineWidth = 3; ctx.lineCap = "round";
    if (scared) {
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(8, 2, 7, 0, 7); ctx.arc(22, 2, 6, 0, 7); ctx.fill();
      ctx.fillStyle = "#1d1714";
      ctx.beginPath(); ctx.arc(9, 2, 2.5, 0, 7); ctx.arc(23, 2, 2.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16, 16, 5, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#9fd0ea"; ctx.beginPath(); ctx.ellipse(-12, -2, 4, 7, 0.3, 0, 7); ctx.fill();
    } else if (calm) {
      ctx.beginPath(); ctx.arc(9, 2, 4, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(22, 2, 4, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, 15); ctx.lineTo(22, 15); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(9, 2, 3, 0, 7); ctx.arc(22, 2, 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(17, 17, 5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawMud() {
    var g = ctx.createLinearGradient(0, SY, 0, H);
    g.addColorStop(0, "#6a5236"); g.addColorStop(0.3, "#4c3a26"); g.addColorStop(1, "#2a1f15");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, SY);
    for (var x = 0; x <= SHORE; x += 12) ctx.lineTo(x, SY + Math.sin(x * 0.04 + T * 1.3) * 1.6);
    ctx.lineTo(SHORE, H); ctx.fill();
    /* 表面のつや */
    ctx.strokeStyle = "rgba(160,130,90,.55)"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (var x2 = 0; x2 <= SHORE - 10; x2 += 12) { var y2 = SY + 1 + Math.sin(x2 * 0.04 + T * 1.3) * 1.6; if (x2) ctx.lineTo(x2, y2); else ctx.moveTo(x2, y2); }
    ctx.stroke();
    ctx.fillStyle = "rgba(140,112,76,.35)";
    for (var i = 0; i < 7; i++) { ctx.beginPath(); ctx.ellipse((i * 97 + 40) % SHORE, SY + 30 + (i * 53 % 160), 40, 5, 0, 0, 7); ctx.fill(); }
    /* 体のまわりの泥の盛り上がり */
    ctx.fillStyle = "#6a5236";
    var h = hip();
    var w = lying() ? 150 : 46;
    var cx = lying() ? h.x + 10 : h.x;
    ctx.beginPath(); ctx.ellipse(cx, SY + 2, w, 7, 0, 0, 7); ctx.fill();
    /* 泡 */
    for (var j = 0; j < bubbles.length; j++) {
      var b = bubbles[j], k = b.t / b.life;
      ctx.strokeStyle = "rgba(170,140,100," + (0.8 - k * 0.5) + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, SY + 1, b.r * (0.4 + k), Math.PI, 0); ctx.stroke();
    }
    ctx.fillStyle = "#5a4430";
    for (var m = 0; m < splats.length; m++) { var p = splats[m]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  }

  /* つかめる所をそっと光らせる（文字は出さない） */
  function drawGuide() {
    if (state !== S.PLAY || held) return;
    var p = canSwim() ? handPos() : (lying() ? null : headPos());
    if (!p) return;
    var a = 0.25 + 0.25 * Math.sin(guideT * 4);
    ctx.strokeStyle = "rgba(255,255,255," + a + ")"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, canSwim() ? 34 : 64, 0, 7); ctx.stroke();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawShore();
    drawPerson();
    drawMud();
    drawGuide();
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, P: P, panic: panic, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 40)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
