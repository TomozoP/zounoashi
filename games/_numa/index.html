<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>底なし沼からの正しい抜け出し方シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="numa3d.js"></script>   <!-- 立体の見た目（動きは2Dのまま） -->
<script>
/* 底なし沼からの正しい抜け出し方シミュレーター

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var state, score, T, held, keyMode = false, won = false;

  /* プール：ゲームの 200px が 1m。スタートの壁から25m先がゴールの壁 */
  var M = 200, WALL0 = 60, POOL = 25 * M, WALL1 = WALL0 + POOL;
  var K = 1.45, HEAD_R = 28;                   /* 頭の見た目の大きさ（HEAD_R * K） */
  var SY;                                      /* 水面の高さ */
  function place() {
    SY = Math.round(H * 0.5);
  }

  /* ============ 体（物理） ============
     点と棒でできた人形（点の位置を直接動かす方式）。うつ伏せで頭がゴール側。
     関節を目標の角度へ回すと、手足が水を押し、その抵抗で体が進む。進み方は水の抵抗まかせ。
     腕ボタン：押している間は腕が前から水の中を通って後ろへ（かく）。離すと空中を回って前へ戻る。
     脚ボタン：押している間はひざを曲げて足を上げる。離すと一気に蹴り下ろす。 */
  var HEAD = 0, NECK = 1, HIP = 2, KNEE = 3, ANKLE = 4, TOE = 5, ELBOW = 6, HAND = 7;
  var MASS = [3, 4, 5, 1.6, 1, 0.5, 1, 0.7];
  var STICKS = [[HEAD, NECK, 52], [NECK, HIP, 135], [HIP, KNEE, 88], [KNEE, ANKLE, 82], [ANKLE, TOE, 36], [NECK, ELBOW, 74], [ELBOW, HAND, 70]];
  var LIFT = [1.25, 1.2, 1.1, 0.9, 0.9, 0.9, 0.9, 0.9];   /* 浮く強さ（重さに対して）。胸と頭はよく浮く */
  var G = 1400;                                 /* 重さ（下向きの加速） */
  var CN = 0.055, CT = 0.004;                   /* 水の抵抗：棒の向きに垂直な動きは強く、沿う動きは弱い */
  var FIN = [1, 1, 1, 1.5, 4, 1.2, 1.6];        /* 棒ごとの抵抗の倍率（足先はひれのように強く、手のひらも少し） */
  var SUB = 8;                                  /* 1コマを細かく分けて計算する回数 */
  var pts, arm, armRel, btnArm, btnLeg, camX, splats, bubbles, strokes, kicks, guideT;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    won = false;
    /* まっすぐ伸びて水面に浮いた姿勢から。つま先がスタートの壁 */
    var x = WALL0 + 6, y = SY + 6;
    pts = [];
    function at(px, py) { pts.push({ x: px, y: py, px: px, py: py }); }
    var toeX = x, ank = toeX + 36, knee = ank + 82, hip = knee + 88, neck = hip + 135, head = neck + 52;
    at(head, y - 6); at(neck, y); at(hip, y); at(knee, y); at(ank, y); at(toeX, y);
    at(neck + 74, y + 4); at(neck + 144, y + 6);           /* 腕は頭の先へ伸ばしておく */
    arm = 0; armRel = null;
    btnArm = btnLeg = false;
    camX = W / 2; splats = []; bubbles = []; strokes = 0; kicks = 0; guideT = 0;
  }

  function ang(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
  function wrapA(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
  function rotAround(p, c, d) {
    var dx = p.x - c.x, dy = p.y - c.y, cs = Math.cos(d), sn = Math.sin(d);
    p.x = c.x + dx * cs - dy * sn; p.y = c.y + dx * sn + dy * cs;
  }
  function relAngle(a, j, c) { return wrapA(ang(pts[j], pts[c]) - ang(pts[a], pts[j])); }
  /* 関節の筋肉：子の角度を目標へ近づける回す力（ばねと減衰）。親側には同じ大きさの逆向きの力。
     力の合計は0なので、体が進むのは水を押したときだけ。I は先の重さの回りにくさ、wn は速さ */
  function muscle(ax, ay, a, j, c, err, I, wn, h) {
    var A = pts[a], J = pts[j], C = pts[c];
    var cx = C.x - J.x, cy = C.y - J.y, Lc = Math.hypot(cx, cy) || 1; cx /= Lc; cy /= Lc;
    var wx = A.x - J.x, wy = A.y - J.y, Lp = Math.hypot(wx, wy) || 1; wx /= Lp; wy /= Lp;
    var vjx = (J.x - J.px) / h, vjy = (J.y - J.py) / h;
    var wc = (cx * ((C.y - C.py) / h - vjy) - cy * ((C.x - C.px) / h - vjx)) / Lc;
    var wp = (wx * ((A.y - A.py) / h - vjy) - wy * ((A.x - A.px) / h - vjx)) / Lp;
    err = Math.max(-1.5, Math.min(1.5, err));
    var tau = I * wn * wn * err - 2 * I * wn * (wc - wp);
    var tmax = I * wn * wn * 1.3;
    tau = Math.max(-tmax, Math.min(tmax, tau));
    var fcx = -cy * tau / Lc, fcy = cx * tau / Lc;            /* 子：角度が増える向き */
    var fax = wy * tau / Lp, fay = -wx * tau / Lp;            /* 親：逆向き */
    ax[c] += fcx / MASS[c]; ay[c] += fcy / MASS[c];
    ax[a] += fax / MASS[a]; ay[a] += fay / MASS[a];
    ax[j] -= (fcx + fax) / MASS[j]; ay[j] -= (fcy + fay) / MASS[j];
  }

  function physStep(h) {
    var i, p, s;
    /* 力：重さ・浮く力・空気と水の抵抗 */
    var ax = [], ay = [];
    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      var dep = p.y - SY;
      var sub = Math.max(0, Math.min(1, (dep + 12) / 30));          /* 水に浸かっている割合 */
      ax[i] = 0; ay[i] = G - G * LIFT[i] * sub;
      var vx = (p.x - p.px) / h, vy = (p.y - p.py) / h;
      ax[i] -= vx * 0.15; ay[i] -= vy * 0.15;
    }
    for (i = 0; i < STICKS.length; i++) {
      s = STICKS[i];
      var A = pts[s[0]], B = pts[s[1]];
      var mid = (A.y + B.y) / 2 - SY;
      var wet = Math.max(0, Math.min(1, (mid + 10) / 25));
      if (!wet) continue;
      var dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      var vmx = ((A.x - A.px) + (B.x - B.px)) / 2 / h, vmy = ((A.y - A.py) + (B.y - B.py)) / 2 / h;
      var vt = vmx * ux + vmy * uy, nx = -uy, ny = ux, vn = vmx * nx + vmy * ny;
      var cn = CN * FIN[i];
      var fx = -(cn * vn * nx + CT * vt * ux) * L * wet, fy = -(cn * vn * ny + CT * vt * uy) * L * wet;
      ax[s[0]] += fx / 2 / MASS[s[0]] * 10; ay[s[0]] += fy / 2 / MASS[s[0]] * 10;
      ax[s[1]] += fx / 2 / MASS[s[1]] * 10; ay[s[1]] += fy / 2 / MASS[s[1]] * 10;
    }
    /* 関節の筋肉 */
    var ra = relAngle(HIP, NECK, ELBOW);
    if (armRel != null) arm += wrapA(ra - armRel);
    armRel = ra;
    var tw = btnArm ? Math.PI : 0;                  /* 押す：後ろ（π）へ、離す：前（0）へ。いつも同じ向きに回る */
    var tgt = arm + ((tw - arm) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    if (tgt - arm > Math.PI * 2 - 0.4) tgt -= Math.PI * 2;
    muscle(ax, ay, HIP, NECK, ELBOW, tgt - arm, 20000, 14, h);
    muscle(ax, ay, NECK, ELBOW, HAND, wrapA(0.12 - relAngle(NECK, ELBOW, HAND)), 3400, 20, h);
    muscle(ax, ay, HIP, NECK, HEAD, wrapA(0.1 - relAngle(HIP, NECK, HEAD)), 8100, 20, h);
    muscle(ax, ay, NECK, HIP, KNEE, wrapA((btnLeg ? -0.75 : 0.2) - relAngle(NECK, HIP, KNEE)), 62000, 12, h);
    muscle(ax, ay, HIP, KNEE, ANKLE, wrapA((btnLeg ? 1.5 : 0) - relAngle(HIP, KNEE, ANKLE)), 13700, 16, h);
    muscle(ax, ay, KNEE, ANKLE, TOE, wrapA(0.15 - relAngle(KNEE, ANKLE, TOE)), 650, 15, h);
    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      var nx2 = p.x + (p.x - p.px) + ax[i] * h * h, ny2 = p.y + (p.y - p.py) + ay[i] * h * h;
      p.px = p.x; p.py = p.y; p.x = nx2; p.y = ny2;
    }
    /* 棒の長さを保つ */
    for (var it = 0; it < 3; it++) {
      for (i = 0; i < STICKS.length; i++) {
        s = STICKS[i];
        var P1 = pts[s[0]], P2 = pts[s[1]];
        var ddx = P2.x - P1.x, ddy = P2.y - P1.y, d = Math.hypot(ddx, ddy) || 1, e = (d - s[2]) / d;
        var w1 = MASS[s[1]] / (MASS[s[0]] + MASS[s[1]]), w2 = 1 - w1;
        P1.x += ddx * e * w1; P1.y += ddy * e * w1;
        P2.x -= ddx * e * w2; P2.y -= ddy * e * w2;
      }
    }
    /* 壁と底 */
    for (i = 0; i < pts.length; i++) {
      p = pts[i];
      if (p.x < WALL0 + 4) { p.x = WALL0 + 4; p.px = p.x; }
      if (p.y > SY + 290) { p.y = SY + 290; }
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    guideT += dt;
    updateFx(dt);
    if (state === S.GOAL) {
      for (var j = 0; j < SUB; j++) physStep(dt / SUB);
      if (T - score > 1.6) toResult();
      followCam(dt);
      return;
    }
    if (state !== S.PLAY) return;
    var y0 = pts[HAND].y, k0 = pts[TOE].y;
    for (var i = 0; i < SUB; i++) physStep(dt / SUB);
    /* 手足が水面を出入りしたらしぶき */
    if ((y0 - SY) * (pts[HAND].y - SY) < 0) { splash(pts[HAND].x, 0.8); plash(); }
    if ((k0 - SY) * (pts[TOE].y - SY) < 0) { splash(pts[TOE].x, 0.5); }
    if (Math.random() < dt * 4) addBubble(pts[HEAD].x - 20 + Math.random() * 40, 2 + Math.random() * 3);

    /* 頭が壁に着いたらゴール */
    var hp = pts[HEAD];
    if (hp.x + HEAD_R * K >= WALL1) {
      state = S.GOAL; score = T; won = true; btnArm = btnLeg = false; fanfare();
    }
    for (var n = 0; n < pts.length; n++) if (pts[n].x > WALL1 - 4) { pts[n].x = WALL1 - 4; pts[n].px = pts[n].x; }
    followCam(dt);
  }
  /* 画面は泳ぐ人を追う（頭の少し先を見せる） */
  function followCam(dt) {
    var want = Math.max(W / 2, Math.min(WALL1 + 80 - W / 2, pts[HIP].x + 150));
    camX += (want - camX) * Math.min(1, dt * 4);
  }
  function toResult() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  /* しぶきと泡 */
  function splash(x, n) {
    for (var i = 0; i < 2 + n * 6; i++) splats.push({ x: x, y: SY, vx: (Math.random() - .5) * 240, vy: -100 - Math.random() * 280 * n, r: 3 + Math.random() * 5, t: 0 });
  }
  function addBubble(x, r) { bubbles.push({ x: x, r: r, t: 0, life: 0.6 + Math.random() * 1 }); }
  function updateFx(dt) {
    for (var i = splats.length - 1; i >= 0; i--) {
      var p = splats[i]; p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > SY + 4 && p.vy > 0) splats.splice(i, 1);
    }
    for (var j = bubbles.length - 1; j >= 0; j--) {
      var b = bubbles[j]; b.t += dt;
      if (b.t > b.life) bubbles.splice(j, 1);
    }
  }

  /* 音 */
  function plash() { noiseHit(0.18, 900 + Math.random() * 300, 0.18, 1.5); }
  function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 0.14, "triangle", null, i * 0.12); }); }

  /* ============ 入力 ============
     画面の左半分が腕ボタン、右半分が脚ボタン（下に丸いボタンを描く）。2本の指で同時に押せる。
     キーは 左/A/F が腕、右/D/J が脚。 */
  var touches = {};
  var scene3d = window.Z3 ? Z3.lazy(function () { return new NumaScene(); }) : function () { return null; };
  scene3d.drop = scene3d.drop || function () {};
  function setButtons() {
    var a = false, l = false;
    for (var id in touches) { if (touches[id] === "arm") a = true; else l = true; }
    var na = a || keyArm, nl = l || keyLeg;
    if (na && !btnArm) strokes++;
    if (!nl && btnLeg) kicks++;
    btnArm = na; btnLeg = nl;
  }
  var keyArm = false, keyLeg = false;
  function down(x, y, id) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY || x == null) return;
    held = true;
    touches[id == null ? "m" : id] = x < W / 2 ? "arm" : "leg";
    setButtons();
  }
  function move() {}
  function up(id) {
    if (id == null) touches = {}; else delete touches[id];
    held = Object.keys(touches).length > 0;
    if (state === S.PLAY) setButtons();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) { up(e.pointerId); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state === S.INTRO) { startButton.click(); }
    if (n === 1) { newRound(); var dx = WALL1 - 600 - pts[HEAD].x; pts.forEach(function (p) { p.x += dx; p.px += dx; }); camX = pts[HIP].x; T = 15; }
    if (n === 9) { newRound(); var dx2 = WALL1 - HEAD_R * K - 2 - pts[HEAD].x; pts.forEach(function (p) { p.x += dx2; p.px += dx2; }); T = 18.4; score = T; won = true; state = S.GOAL; camX = WALL1 + 80 - W / 2; }
  }



  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = /^(ArrowLeft|a|A|f|F)$/.test(e.key);
    var right = /^(ArrowRight|d|D|j|J)$/.test(e.key);
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (left) keyArm = true; else keyLeg = true;
      if (state !== S.PLAY) return;
      setButtons();
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (/^(ArrowLeft|a|A|f|F)$/.test(e.key)) { keyArm = false; if (state === S.PLAY) setButtons(); }
    if (/^(ArrowRight|d|D|j|J)$/.test(e.key)) { keyLeg = false; if (state === S.PLAY) setButtons(); }
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function scoreText() { return zT(score.toFixed(2) + "秒", score.toFixed(2) + "s"); }
  function doShare() {
    /* ▼SHARE */
    var text = zT("バタフライ25mを" + score.toFixed(2) + "秒で泳ぎきりました", "Swam 25m butterfly in " + score.toFixed(2) + " seconds");
    window.zResultActions.x({ text: text + zT(" #底なし沼からの正しい抜け出し方シミュレーター", " #QuicksandEscapeSimulator") });
  }

  /* ============ 描画 ============
     ふだんは立体（numa3d.js）。立体が使えない端末だけ、ここの平面の絵で描く。 */
  function limb(a, b, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function face() {
    return state === S.GOAL || state === S.RESULT ? "calm" : (btnArm && btnLeg ? "scared" : "normal");
  }
  function drawPerson() {
    var p = pts;
    limb(p[HIP], p[KNEE], 26 * K, "#f0b88a"); limb(p[KNEE], p[ANKLE], 22 * K, "#f0b88a"); limb(p[ANKLE], p[TOE], 14 * K, "#f0b88a");
    limb(p[NECK], p[HIP], 46 * K, "#f0b88a");
    limb(p[HIP], { x: p[HIP].x + (p[NECK].x - p[HIP].x) * 0.12, y: p[HIP].y + (p[NECK].y - p[HIP].y) * 0.12 }, 44 * K, "#d23b3b");
    ctx.fillStyle = "#f0b88a"; ctx.beginPath(); ctx.arc(p[HEAD].x, p[HEAD].y, HEAD_R * K, 0, 7); ctx.fill();
    limb(p[NECK], p[ELBOW], 18 * K, "#f0b88a"); limb(p[ELBOW], p[HAND], 15 * K, "#f0b88a");
  }
  function draw2d() {
    var g = ctx.createLinearGradient(0, 0, 0, SY);
    g.addColorStop(0, "#dfe9ef"); g.addColorStop(1, "#b9cfdb");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, SY);
    ctx.save(); ctx.translate(W / 2 - camX, 0);
    drawPerson();
    ctx.fillStyle = "rgba(40,150,210,.55)"; ctx.fillRect(WALL0, SY, POOL, H - SY);
    ctx.fillStyle = "#fff";
    for (var m = 0; m <= 25; m += 5) ctx.fillRect(WALL0 + m * M - 2, SY + 6, 4, 18);
    ctx.fillStyle = "#cfd8de"; ctx.fillRect(WALL0 - 200, SY - 40, 200, H); ctx.fillRect(WALL1, SY - 40, 200, H);
    ctx.fillStyle = "#fff";
    for (var i = 0; i < splats.length; i++) { var q = splats[i]; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  /* 腕ボタン（左下）と脚ボタン（右下）。文字は出さず、絵だけ */
  function buttonPos() {
    var r = 62, y = H - r - Math.max(28, H * 0.05);
    return [{ x: W * 0.25, y: y, r: r, on: btnArm }, { x: W * 0.75, y: y, r: r, on: btnLeg }];
  }
  function drawButtons() {
    if (state !== S.PLAY) return;
    var b = buttonPos();
    for (var i = 0; i < 2; i++) {
      var o = b[i];
      ctx.save(); ctx.translate(o.x, o.y + (o.on ? 4 : 0));
      ctx.fillStyle = o.on ? "#d9e6ee" : "#fff";
      ctx.strokeStyle = "#16202e"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, o.r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#16202e"; ctx.fillStyle = "#16202e"; ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (i === 0) {
        /* 腕：肩から伸びた腕と、回す向きの矢印 */
        ctx.beginPath(); ctx.arc(-14, 10, 9, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-6, 4); ctx.lineTo(10, -14); ctx.lineTo(24, -6); ctx.stroke();
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 4, 34, Math.PI * 1.1, Math.PI * 1.75); ctx.stroke();
      } else {
        /* 脚：曲げた脚 */
        ctx.beginPath(); ctx.moveTo(-26, -14); ctx.lineTo(4, 4); ctx.lineTo(-6, 26); ctx.lineTo(10, 28); ctx.stroke();
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(20, -20); ctx.lineTo(28, -6); ctx.moveTo(30, 6); ctx.lineTo(34, 18); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    var s3 = scene3d(), drawn3d = false;
    if (s3) {
      try {
        var p = pts;
        s3.sync({ W: W, H: H, SY: SY, M: M, WALL0: WALL0, WALL1: WALL1, camX: camX, K: K, T: T,
          hip: p[HIP], shoulder: p[NECK], head: p[HEAD], knee: p[KNEE], foot: p[ANKLE], toe: p[TOE], elbow: p[ELBOW], hand: p[HAND],
          face: face(), bubbles: bubbles, splats: splats });
        drawn3d = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); drawn3d = false; }
    }
    if (!drawn3d) draw2d();
    drawButtons();
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    pts: function () { return pts; },
    now: function () { return { state: state, score: score, W: W, H: H, head: pts && pts[HEAD], hip: pts && pts[HIP], camX: camX, SY: SY, T: T, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 90)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
