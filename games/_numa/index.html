<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>底なし沼からの正しい抜け出し方シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="numa3d.js"></script>   <!-- 立体の見た目（動きは2Dのまま） -->
<script>
/* 底なし沼からの正しい抜け出し方シミュレーター

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var state, score, T, held, keyMode = false, won = false;

  /* 体の寸法（ゲームの座標） */
  var K = 1.45, TORSO = 100 * K, HEAD_AT = 128 * K, HEAD_R = 28, LEG = 112 * K, ARM = 84 * K;
  /* プール：ゲームの 200px が 1m。スタートの壁から25m先がゴールの壁 */
  var M = 200, WALL0 = 60, POOL = 25 * M, WALL1 = WALL0 + POOL;
  var SY;                                      /* 水面の高さ */
  function place() {
    SY = Math.round(H * 0.5);
  }

  /* 人：腰の位置 x・沈み d（腰が水面より下に何px）・速さ vx。仰向けで頭がゴール側。
     腕は肩のまわりの角度 arm（画面の時計回り。0=頭の先、π/2=水の中、π=腰の横、3π/2=空中）。
     奥の腕はいつも反対側（arm+π）。 */
  var P, finger, fv, panic, bubbles, splats, guideT, camX, strokes;
  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    won = false;
    P = { x: WALL0 + LEG + 14, d: 14, vx: 0, th: 1.48, ph: 1.42, arm: Math.PI, shake: 0, kick: 0 };
    finger = null; fv = 0; panic = 0;
    bubbles = []; splats = []; guideT = 0; strokes = 0;
    camX = W / 2;
  }

  function hip() { return { x: P.x, y: SY + P.d }; }
  function dirT() { return { x: Math.sin(P.th), y: -Math.cos(P.th) }; }
  function shoulder() { var h = hip(), t = dirT(); return { x: h.x + t.x * TORSO * 0.92, y: h.y + t.y * TORSO * 0.92 }; }
  function headPos() { var h = hip(), t = dirT(); return { x: h.x + t.x * HEAD_AT, y: h.y + t.y * HEAD_AT }; }
  function lying() { return true; }
  function armAt(a) { var s = shoulder(); return { x: s.x + Math.cos(a) * ARM, y: s.y + Math.sin(a) * ARM }; }
  function handPos() { return armAt(P.arm); }

  /* ============ 進行 ============ */
  var PANIC_W = 8.5;                           /* 指が肩のまわりをこれより速く回ると（1秒あたり）、腕が空回りしてバシャバシャになる */
  var ARM_W = 7;                               /* 腕が回る速さの上限（1秒あたり） */
  function update(dt) {
    T += dt;
    guideT += dt;
    updateFx(dt);
    if (state === S.GOAL) {
      P.vx *= Math.pow(0.05, dt); P.x += P.vx * dt;
      if (T - score > 1.6) toResult();
      followCam(dt);
      return;
    }
    if (state !== S.PLAY) return;

    /* 指の速さ（なめらかにならす） */
    if (!held || (lastWant && performance.now() - lastWant.t > 120)) fv *= Math.pow(0.05, dt);   /* 指が止まったら落ち着く */
    var over = Math.max(0, fv - PANIC_W) / (PANIC_W * 0.4);
    var pt = Math.min(1, over);
    panic += (pt - panic) * Math.min(1, dt * (pt > panic ? 3 : 5));
    if (panic < 0.02) panic = 0;
    P.shake = panic;

    /* 腕：指のある向きへ回す（速すぎても上限まで）。前へ回した分だけ水をかいて進む */
    var s = shoulder();
    if (held && finger) {
      var want = Math.atan2(finger.y - s.y, finger.x - s.x);
      var da = want - P.arm;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      da = Math.max(-ARM_W * dt, Math.min(ARM_W * dt, da));
      var before = Math.floor(P.arm / Math.PI);
      P.arm += da;
      /* 水をかく力。どちらかの手はいつも水の中。暴れているとほとんど進まない */
      P.vx += da * 34 * (1 - panic * 0.85);
      var after = Math.floor(P.arm / Math.PI);
      if (after > before) { strokes++; plash(); splash(armAt(P.arm - Math.PI * 0.05).x, 0.6); }
    }
    /* バタ足は小さく一定。水の抵抗で速さが落ちる。暴れると沈んで抵抗も増える */
    P.kick += dt;
    P.vx += 18 * dt;
    P.vx *= Math.pow(0.42 - panic * 0.3, dt);
    if (P.vx < 0) P.vx *= Math.pow(0.01, dt);
    P.x += P.vx * dt;
    if (P.x < WALL0 + LEG + 14) { P.x = WALL0 + LEG + 14; P.vx = 0; }
    var wantD = 14 + panic * 70;
    P.d += (wantD - P.d) * Math.min(1, dt * 3);
    if (panic > 0.15) {
      if (Math.random() < dt * 30 * panic) splash(s.x + (Math.random() - .3) * 160, 1);
      if (Math.random() < dt * 6 * panic) gurgle();
    }
    if (Math.random() < dt * 3) addBubble(P.x + (Math.random() - .5) * 200, 2 + Math.random() * 3);
    if (Math.random() < dt * 6) splash(P.x - LEG + Math.random() * 30, 0.15);     /* バタ足のしぶき */

    /* 頭が壁に着いたらゴール */
    var hp = headPos();
    if (hp.x + HEAD_R * K >= WALL1) {
      P.x -= hp.x + HEAD_R * K - WALL1;
      state = S.GOAL; score = T; won = true; P.vx = 0; fanfare();
    }
    followCam(dt);
  }
  /* 画面は泳ぐ人を追う（頭の少し先を見せる） */
  function followCam(dt) {
    var want = Math.max(W / 2, Math.min(WALL1 + 80 - W / 2, P.x + 90));
    camX += (want - camX) * Math.min(1, dt * 5);
  }
  function toResult() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  /* しぶきと泡 */
  function splash(x, n) {
    for (var i = 0; i < 2 + n * 5; i++) splats.push({ x: x, y: SY, vx: (Math.random() - .5) * 220, vy: -100 - Math.random() * 260 * n, r: 3 + Math.random() * 5, t: 0 });
  }
  function addBubble(x, r) { bubbles.push({ x: x, r: r, t: 0, life: 0.6 + Math.random() * 1 }); }
  function updateFx(dt) {
    for (var i = splats.length - 1; i >= 0; i--) {
      var p = splats[i]; p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > SY + 4 && p.vy > 0) splats.splice(i, 1);
    }
    for (var j = bubbles.length - 1; j >= 0; j--) {
      var b = bubbles[j]; b.t += dt;
      if (b.t > b.life) bubbles.splice(j, 1);
    }
  }

  /* 音 */
  function gurgle() { noiseHit(0.25, 500 + Math.random() * 400, 0.2, 2); }
  function plash() { noiseHit(0.18, 900 + Math.random() * 300, 0.18, 1.5); }
  function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 0.14, "triangle", null, i * 0.12); }); }

  /* ============ 入力 ============
     どこを触ってもよい。肩のまわりで指をぐるぐる回すと腕が回って進む。速く回しすぎると暴れて沈む。 */
  /* 立体で描いているときは、画面の点を人の動く面の点に直す */
  var view3d = null;
  function toGame(x, y) { return view3d ? view3d.toGame(x, y) : { x: x + camX - W / 2, y: y }; }
  var scene3d = window.Z3 ? Z3.lazy(function () { return new NumaScene(); }) : function () { return null; };
  scene3d.drop = scene3d.drop || function () {};
  var lastWant = null;
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY || x == null) return;
    var g = toGame(x, y);
    held = true;
    finger = g; lastWant = null;
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    finger = toGame(x, y);
    /* 指が肩のまわりを回る速さ（指の動いた時刻で測る。ならす） */
    var s = shoulder(), now = performance.now();
    var want = Math.atan2(finger.y - s.y, finger.x - s.x);
    if (lastWant) {
      var ms = now - lastWant.t;
      if (ms < 30) return;
      var dw = want - lastWant.a; dw = Math.atan2(Math.sin(dw), Math.cos(dw));
      var w = Math.abs(dw) / (ms / 1000);
      fv += (w - fv) * Math.min(1, ms / 1000 * 6);
    }
    lastWant = { a: want, t: now };
  }
  function up() {
    if (!held) return;
    held = false;
    finger = null;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state === S.INTRO) { startButton.click(); }
    if (n === 1) { newRound(); P.x = WALL1 - HEAD_AT - 260; T = 15; }
    if (n === 3) { if (state === S.PLAY) { panic = 1; fv = 3000; } }
    if (n === 9) { newRound(); P.x = WALL1 - HEAD_AT - HEAD_R * K; T = 18.4; score = T; won = true; state = S.GOAL; camX = WALL1 + 80 - W / 2; }
  }


  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function scoreText() { return zT(score.toFixed(2) + "秒", score.toFixed(2) + "s"); }
  function doShare() {
    /* ▼SHARE */
    var text = zT("背泳ぎ25mを" + score.toFixed(2) + "秒で泳ぎきりました", "Swam 25m backstroke in " + score.toFixed(2) + " seconds");
    window.zResultActions.x({ text: text + zT(" #底なし沼からの正しい抜け出し方シミュレーター", " #QuicksandEscapeSimulator") });
  }

  /* ============ 描画 ============
     ふだんは立体（numa3d.js）。立体が使えない端末だけ、ここの平面の絵で描く。 */
  function limb(a, b, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  /* 体の各点（平面でも立体でも同じものを使う） */
  function pose() {
    var h = hip(), t = dirT(), s = shoulder(), hp = headPos();
    var kick = Math.sin(P.kick * 14) * 0.12;
    var lgx = -Math.sin(P.ph + kick), lgy = Math.cos(P.ph + kick);
    var knee = { x: h.x + lgx * LEG * 0.5, y: h.y + lgy * LEG * 0.5 };
    var lgx2 = -Math.sin(P.ph - kick * 1.6), lgy2 = Math.cos(P.ph - kick * 1.6);
    var foot = { x: knee.x + lgx2 * LEG * 0.5, y: knee.y + lgy2 * LEG * 0.5 };
    var footB = { x: h.x - Math.sin(P.ph - kick) * LEG, y: h.y + Math.cos(P.ph - kick) * LEG };
    var hd = handPos(), ot = armAt(P.arm + Math.PI);
    var el = { x: (s.x + hd.x) / 2, y: (s.y + hd.y) / 2 };
    return { hip: h, t: t, shoulder: s, head: hp, knee: knee, foot: foot, footB: footB, other: ot, hand: hd, elbow: el, lgx: lgx, lgy: lgy };
  }
  function face() {
    if (panic > 0.2) return "scared";
    return state === S.GOAL || state === S.RESULT ? "calm" : "normal";
  }
  function drawPerson() {
    var q = pose(), h = q.hip, s = q.shoulder;
    limb(h, q.footB, 24 * K, "#e0a87a");
    limb(s, q.other, 16 * K, "#d9a074");
    limb(h, q.knee, 26 * K, "#f0b88a"); limb(q.knee, q.foot, 24 * K, "#f0b88a");
    limb(h, s, 46 * K, "#f0b88a");
    limb(h, { x: h.x + q.t.x * 16 * K, y: h.y + q.t.y * 16 * K }, 44 * K, "#d23b3b");   /* 水着 */
    ctx.fillStyle = "#f0b88a"; ctx.beginPath(); ctx.arc(q.head.x, q.head.y, HEAD_R * K, 0, 7); ctx.fill();
    ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.arc(q.head.x + 8, q.head.y, HEAD_R * K * 0.95, -Math.PI / 2, Math.PI / 2); ctx.fill();
    limb(s, q.hand, 16 * K, "#f0b88a");
  }
  function draw2d() {
    var g = ctx.createLinearGradient(0, 0, 0, SY);
    g.addColorStop(0, "#dfe9ef"); g.addColorStop(1, "#b9cfdb");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, SY);
    ctx.save(); ctx.translate(W / 2 - camX, 0);
    ctx.fillStyle = "#e6eef2"; ctx.fillRect(WALL1, SY - 40, 200, H);
    drawPerson();
    ctx.fillStyle = "rgba(40,150,210,.55)"; ctx.fillRect(WALL0, SY, POOL, H - SY);
    ctx.fillStyle = "#fff";
    for (var m = 0; m <= 25; m += 5) ctx.fillRect(WALL0 + m * M - 2, SY + 6, 4, 18);
    ctx.fillStyle = "#cfd8de"; ctx.fillRect(WALL0 - 200, SY - 40, 200, H); ctx.fillRect(WALL1, SY - 40, 200, H);
    ctx.fillStyle = "#fff";
    for (var i = 0; i < splats.length; i++) { var p = splats[i]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  /* 最初の一かきまで、腕を回す向きをそっと示す（文字は出さない） */
  function drawGuide() {
    if (state !== S.PLAY || held || strokes > 0) return;
    var s = shoulder();
    if (view3d) s = view3d.toScreen(s.x, s.y); else s = { x: s.x - camX + W / 2, y: s.y };
    var a = 0.35 + 0.25 * Math.sin(guideT * 4), r = ARM * 0.9, t0 = guideT * 3;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255," + a + ")"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(s.x, s.y, r, t0, t0 + Math.PI * 1.4); ctx.stroke();
    var e = t0 + Math.PI * 1.4, ex = s.x + Math.cos(e) * r, ey = s.y + Math.sin(e) * r;
    var tx = -Math.sin(e), ty = Math.cos(e);
    ctx.fillStyle = "rgba(255,255,255," + a + ")";
    ctx.beginPath(); ctx.moveTo(ex + tx * 16, ey + ty * 16); ctx.lineTo(ex - ty * 11, ey + tx * 11); ctx.lineTo(ex + ty * 11, ey - tx * 11); ctx.fill();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    var s3 = scene3d(), drawn3d = false;
    if (s3) {
      try {
        var q = pose();
        s3.sync({ W: W, H: H, SY: SY, M: M, WALL0: WALL0, WALL1: WALL1, camX: camX, K: K, T: T, th: P.th, shake: P.shake,
          hip: q.hip, shoulder: q.shoulder, head: q.head, knee: q.knee, foot: q.foot, footB: q.footB, other: q.other, hand: q.hand, elbow: q.elbow,
          face: face(), bubbles: bubbles, splats: splats });
        drawn3d = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); drawn3d = false; }
    }
    view3d = drawn3d ? s3 : null;
    if (!drawn3d) draw2d();
    drawGuide();
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    return window.zResultActions.row(W, H * 0.62);
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, P: P, panic: panic, camX: camX, SY: SY, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 90)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
