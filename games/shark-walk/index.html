<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スーパーカスタムシャーク</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
<!-- ゲームのOGP：道具で更新 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ゾウノアシゲームズ">
<meta property="og:title" content="スーパーカスタムシャーク">
<meta property="og:url" content="https://www.zounoashi.com/share/shark-walk/">
<meta property="og:image" content="https://www.zounoashi.com/games/shark-walk/img/thumb.webp">
<meta property="og:image:alt" content="スーパーカスタムシャーク">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="スーパーカスタムシャーク">
<meta name="twitter:image" content="https://www.zounoashi.com/games/shark-walk/img/thumb.webp">
<!-- ゲームのOGPここまで -->
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="../share.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="walk.js"></script>
<script src="music.js"></script>
<script>
/* スーパーカスタムシャーク

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960, GOAL = 3200;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, music = null, partSound = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); if(music && state!==S.INTRO)music.start(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    partSound=SharkPartSound(AC);
    music=SharkMusic(AC);if(state!==S.INTRO)music.start();
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { resumeAudio(); }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, goalSnapshot=null,goalPrint=null,finishAge=0;
  var pointers={}, keys={};

  var choices={leftLeg:"leg",rightLeg:"leg",leftArm:"arm",rightArm:"arm"};
  var partNames={leg:"脚",arm:"腕",wheel:"車輪",jet:"ジェット",balloon:"風船"};
  var walker = SharkWalk(choices), camera = 0, accumulator=0;
  var shark = new Image(), limbs = new Image(); shark.src="img/shark.webp"; limbs.src="img/limbs.webp";
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound() {
    state = S.PLAY;
    if(music)music.start();
    score = 0;goalSnapshot=null;goalPrint=null;finishAge=0;
    T = 0;
    pointers={};keys={};
    walker=SharkWalk(choices);camera=0;accumulator=0;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.INTRO) return;
    if(state===S.RESULT){finishAge+=dt;dt*=finishAge<.7?.18:1;}
    accumulator+=dt;
    while(accumulator>=1/60){
      walker.update(1/60);walker.takeImpacts().forEach(function(hit){if(partSound)partSound(hit.group,hit.kind,hit.strength);});T+=1/60;accumulator-=1/60;camera=walker.now().x-222.5;
      if(state===S.PLAY){
        if(walker.now().fallen){newRound();return;}
        score=Math.round(T*10)/10;
        if(walker.now().x>=GOAL){
          // 通過した物理更新の直後に一枚だけ保存する。
          draw(true);goalSnapshot=document.createElement('canvas');goalSnapshot.width=W;goalSnapshot.height=390;
          var floor=H*.64-Math.min(0,walker.now().y+160)*.88;
          var sharkY=floor+(walker.rear.y+walker.front.y)/2*.88;
          var cropY=Math.max(0,Math.min(H-390,sharkY-210));
          var pixelScale=canvas.width/W;
          goalSnapshot.getContext('2d').drawImage(canvas,0,cropY*pixelScale,canvas.width,390*pixelScale,0,0,W,390);
          goalPrint=makeGoalPrint();state=S.RESULT;finishAge=0;clearInput();shutter();
        }
      }
    }
  }

  /* 四肢を別々に操作する。複数の指やキーで押しても、それぞれ独立して離せる。 */
  var keyHints=window.matchMedia?window.matchMedia("(hover: hover) and (pointer: fine)"):{matches:false};
  var controlCount=4,togglePointer=null;
  function controls(){if(controlCount===2)return [{id:"rear",groups:["leftLeg","rightLeg"],x:140,y:H*.82,r:54,w:238,key:"A / S"},{id:"front",groups:["leftArm","rightArm"],x:400,y:H*.82,r:54,w:238,key:"K / L"}];return [{id:"leftLeg",x:75,y:H*.82,r:54,label:"左脚",key:"A"},{id:"rightLeg",x:205,y:H*.82,r:54,label:"右脚",key:"S"},{id:"leftArm",x:335,y:H*.82,r:54,label:"左腕",key:"K"},{id:"rightArm",x:465,y:H*.82,r:54,label:"右腕",key:"L"}];}
  function customize(){goalSnapshot=null;goalPrint=null;finishAge=0;clearInput();state=S.INTRO;walker=SharkWalk(choices);camera=0;accumulator=0;if(music)music.stop();}
  function choose(group){var options=['leg','arm','wheel','jet','balloon'],pair=group==='rear'||group.indexOf('Leg')>=0?['leftLeg','rightLeg']:['leftArm','rightArm'],target=controlCount===2?pair[0]:group;var next=options[(options.indexOf(choices[target])+1)%options.length];(controlCount===2?pair:[group]).forEach(function(id){choices[id]=next;});walker=SharkWalk(choices);camera=0;}
  function modeAt(x,y){if(state!==S.INTRO)return null;return Math.abs(y-(H*.82-98))<=32?(Math.abs(x-232)<=34?2:Math.abs(x-308)<=34?4:null):null;}
  function playAt(x,y){return Math.abs(x-270)<=90&&Math.abs(y-H*.94)<=32;}
  function controlAt(x,y){var bs=controls();for(var i=0;i<bs.length;i++){var b=bs[i];if(Math.abs(x-b.x)<=(b.w||108)/2&&Math.abs(y-b.y)<=54)return b.id;}return null;}
  function syncInput(){
    ["leftLeg","rightLeg","leftArm","rightArm"].forEach(function(group){
      function matches(value){if(controlCount===2&&state!==S.INTRO){var rear=group.indexOf('Leg')>=0;return rear?['rear','leftLeg','rightLeg'].indexOf(value)>=0:['front','leftArm','rightArm'].indexOf(value)>=0;}return value===group;}
      var pressed=Object.keys(pointers).some(function(k){return matches(pointers[k]);})||Object.keys(keys).some(function(k){return matches(keys[k]);});
      if(pressed && !walker.now()[group+"Pressed"] && state!==S.INTRO && partSound && ['wheel','jet','balloon'].indexOf(choices[group])>=0)partSound(group,choices[group]);
      walker.set(group,pressed);
    });
  }
  function clearInput(){togglePointer=null;pointers={};keys={};syncInput();}
  function atCanvas(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  wrap.addEventListener("pointerdown",function(e){
    if(e.button>0)return;
    var p=atCanvas(e);
    var mode=modeAt(p.x,p.y);if(mode){togglePointer={id:e.pointerId,mode:mode};e.preventDefault();return;}
    if(state===S.INTRO){if(e.isPrimary===false)return;menuPointer={id:e.pointerId,group:controlAt(p.x,p.y),go:playAt(p.x,p.y)};if(wrap.setPointerCapture)wrap.setPointerCapture(e.pointerId);return;}
    if(Math.hypot(p.x-45,p.y-93)<32){customize();return;}
    if(state===S.RESULT){var hit=hitButton(p.x,p.y);if(hit==="retry"){newRound();return;}else if(hit==="share"){doShare();return;}else if(hit==="save"){saveGoalImage();return;}return;}
    var group=controlAt(p.x,p.y);if(!group)return;
    e.preventDefault();audioOn();pointers[e.pointerId]=group;
    if(wrap.setPointerCapture)wrap.setPointerCapture(e.pointerId);
    syncInput();
  });
  var menuPointer=null;
  function releasePointer(e){
    if(togglePointer&&togglePointer.id===e.pointerId){var toggle=togglePointer;togglePointer=null;var at=atCanvas(e);if(modeAt(at.x,at.y)===toggle.mode){clearInput();controlCount=toggle.mode;if(controlCount===2){var changed=choices.rightLeg!==choices.leftLeg||choices.rightArm!==choices.leftArm;choices.rightLeg=choices.leftLeg;choices.rightArm=choices.leftArm;if(changed)customize();}}return;}
    if(state===S.INTRO){var pending=menuPointer;menuPointer=null;if(!pending||pending.id!==e.pointerId)return;var p=atCanvas(e);if(pending.group&&controlAt(p.x,p.y)===pending.group)choose(pending.group);else if(pending.go&&playAt(p.x,p.y)){audioOn();newRound();}return;}
    delete pointers[e.pointerId];syncInput();
  }
  wrap.addEventListener("pointerup",releasePointer);
  wrap.addEventListener("pointercancel",function(e){togglePointer=null;menuPointer=null;delete pointers[e.pointerId];syncInput();});
  wrap.addEventListener("lostpointercapture",function(e){menuPointer=null;delete pointers[e.pointerId];syncInput();});
  window.addEventListener("blur",clearInput);
  document.addEventListener("visibilitychange",function(){if(document.hidden)clearInput();});
  function keyGroup(e){
    if(e.key==="a"||e.key==="A"||e.key==="ArrowLeft"||e.code==="Space"||e.key===" ")return "leftLeg";
    if(e.key==="s"||e.key==="S"||e.key==="ArrowDown")return "rightLeg";
    if(e.key==="k"||e.key==="K"||e.key==="ArrowUp")return "leftArm";
    if(e.key==="l"||e.key==="L"||e.key==="ArrowRight"||e.key==="Enter")return "rightArm";
    return null;
  }
  var startingKey=null;
  window.addEventListener("keydown",function(e){
    if(e.key==="Escape"){e.preventDefault();if(!e.repeat){startingKey=null;menuPointer=null;customize();}return;}
    var group=keyGroup(e);if(!group)return;e.preventDefault();if(e.repeat)return;
    if(state===S.INTRO){if(e.key===" "||e.code==="Space"||e.key==="Enter")startingKey=e.key;else choose(group);return;}
    if(state===S.RESULT){if(e.key===" "||e.code==="Space"||e.key==="Enter")newRound();return;}
    audioOn();keys[e.key]=group;syncInput();
  });
  window.addEventListener("keyup",function(e){
    if(state===S.INTRO&&startingKey===e.key){startingKey=null;audioOn();newRound();return;}
    delete keys[e.key];syncInput();
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    zShare({ text: score + "秒 #スーパーカスタムシャーク" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(withoutResult) {
    ctx.clearRect(0, 0, W, H);

    var zoom=.88,viewLeft=camera-222.5*(1-zoom)/zoom,viewRight=viewLeft+W/zoom;
    var floor=H*.64-Math.min(0,walker.now().y+160)*zoom;
    var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#d8f3f5");sky.addColorStop(1,"#f7f2df");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff9db";ctx.beginPath();ctx.arc(420,135,53,0,Math.PI*2);ctx.fill();
    var horizon=floor-105,sea=ctx.createLinearGradient(0,horizon,0,H);
    sea.addColorStop(0,'#70cbd1');sea.addColorStop(.5,'#3098b7');sea.addColorStop(1,'#176887');
    ctx.fillStyle=sea;ctx.fillRect(0,horizon,W,Math.max(0,H-horizon));
    ctx.strokeStyle='#d6f7ed';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.stroke();
    // 遠くは細かく、崖の下は大きくうねる波。
    for(var row=0;row<9;row++){
      var waveY=horizon+18+row*row*11;ctx.strokeStyle=row<3?'#b4e8df99':'#b9f3e0bb';ctx.lineWidth=row<3?1.5:3;
      for(var wx=-90;wx<W+90;wx+=115){var shift=Math.sin(T*.7+row)*16-camera*.08;
        ctx.beginPath();for(var q=0;q<=64;q+=8){var px=wx+q+shift,py=waveY+Math.sin(q/22+T*1.4+row)*3;if(q===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();
      }
    }
    ctx.save();ctx.translate(222.5*(1-zoom)-camera*zoom,floor);ctx.scale(zoom,zoom);
    var edge=walker.now().cliff,startGround=Math.max(edge,viewLeft-20);
    ctx.beginPath();ctx.moveTo(startGround,H/zoom);ctx.lineTo(startGround,walker.ground(startGround));for(var x=startGround;x<viewRight+30;x+=8)ctx.lineTo(x,walker.ground(x));ctx.lineTo(viewRight+30,H/zoom);ctx.closePath();ctx.fillStyle="#e1cda4";ctx.fill();ctx.strokeStyle="#6f8b72";ctx.lineWidth=7;ctx.stroke();
    for(var x=Math.max(90,Math.floor(viewLeft/90)*90);x<viewRight;x+=90){ctx.fillStyle="#baa781";ctx.fillRect(x,walker.ground(x)+28,15,3);}
    // 飛行中も画面上端まで続く、白黒模様だけのゴールライン。
    var goalTop=Math.floor(-floor/zoom/17)*17,goalBottom=Math.min(0,(H-floor)/zoom+17);
    for(var gy=goalTop;gy<goalBottom;gy+=17)for(var col=0;col<2;col++){
      ctx.fillStyle=(Math.round(gy/17)+col)%2?'#fff':'#202020';ctx.fillRect(GOAL+col*17,gy,17,Math.min(17,-gy));
    }
    function piece(img,sx,sy,sw,sh,a,b,width,top){
      if(!img.complete||!img.naturalWidth)return;
      var dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
      ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(dy,dx)-Math.PI/2);
      ctx.drawImage(img,sx,sy,sw,sh,-width/2,-(top||0),width,len+(top||0)+3);ctx.restore();
    }
    function machine(group,a,b,sample){
      var type=choices[group],joint=sample||walker.joints.find(function(j){return j.name===group;});
      if(type==='leg'){piece(limbs,140,20,300,710,a,joint.b,37,5);piece(limbs,140,700,410,810,joint.b,b,51,3);return true;}
      if(type==='arm'||type==='balloon'){piece(limbs,655,65,285,625,a,joint.b,31,5);piece(limbs,705,650,265,735,joint.b,b,29,3);if(type==='arm')return true;}
      var on=walker.now()[group+'Pressed'];
      if(type==='balloon'){
        var balloon=sample?sample.balloon:walker.balloons[group],size=sample?22:balloon.r;
        ctx.strokeStyle='#887d70';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(balloon.x,balloon.y+size);ctx.stroke();
        ctx.save();ctx.translate(balloon.x,balloon.y);ctx.scale(size/37,1.2*size/37);
        ctx.fillStyle={leftLeg:'#ef8e91',rightLeg:'#eebd68',leftArm:'#77bccc',rightArm:'#b39dd9'}[group];ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.arc(-10,-12,7,0,Math.PI*2);ctx.fill();ctx.restore();return true;
      }
      {
        piece(limbs,140,20,300,710,a,joint.b,37,5);
        piece(limbs,140,700,300,600,joint.b,b,38,3);
      }
      ctx.save();ctx.translate(b.x,b.y);
      if(type==='wheel'){
        ctx.rotate(walker.now().spins[group]);ctx.fillStyle='#24313d';ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b9d0d7';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.stroke();
        for(var i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(18,0);ctx.stroke();}ctx.fillStyle='#607e8d';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
      }else{
        ctx.rotate(Math.atan2(b.y-joint.b.y,b.x-joint.b.x)+joint.jetOffset);
        if(on&&state!==S.INTRO){ctx.fillStyle='#f49042';ctx.beginPath();ctx.moveTo(-22,-13);ctx.lineTo(-65-Math.sin(T*45)*13,0);ctx.lineTo(-22,13);ctx.fill();ctx.fillStyle='#fff0ac';ctx.beginPath();ctx.moveTo(-23,-7);ctx.lineTo(-46,0);ctx.lineTo(-23,7);ctx.fill();}
        ctx.fillStyle='#d85b32';ctx.strokeStyle='#26333e';ctx.lineWidth=3;roundRect(-22,-17,46,34,10);ctx.fill();ctx.stroke();ctx.fillStyle='#26333e';ctx.fillRect(-26,-15,9,30);ctx.fillStyle='#ffe0a0';ctx.fillRect(4,-15,7,30);ctx.fillStyle='#ffae72';ctx.fillRect(-12,-11,11,4);
      }
      ctx.restore();return true;
    }
    function leg(i){machine(i===0?'leftLeg':'rightLeg',walker.rear,walker.feet[i]);}
    function arm(i){machine(i===0?'leftArm':'rightArm',walker.front,walker.hands[i]);}
    ctx.globalAlpha=.7;leg(1);arm(1);ctx.globalAlpha=1;
    var r=walker.rear,f=walker.front;ctx.save();ctx.translate((r.x+f.x)/2,(r.y+f.y)/2-27);ctx.rotate(Math.atan2(f.y-r.y,f.x-r.x));if(shark.complete&&shark.naturalWidth)ctx.drawImage(shark,-200,-95,380,190);ctx.restore();
    leg(0);arm(0);ctx.restore();
    ctx.fillStyle="#c3d8d5";roundRect(45,49,450,8,4);ctx.fill();ctx.fillStyle="#335f64";roundRect(45,49,450*Math.max(0,Math.min(1,(walker.now().x-222.5)/(GOAL-222.5))),8,4);ctx.fill();
    if(state!==S.RESULT)controls().forEach(function(b){
      var groups=b.groups||[b.id],on=groups.some(function(id){return walker.now()[id+"Pressed"];});
      roundRect(b.x-(b.w||108)/2,b.y-54,b.w||108,108,20);ctx.fillStyle=on?"#335f64":"#ffffffc9";ctx.fill();ctx.strokeStyle="#335f64";ctx.lineWidth=3;ctx.stroke();
      // 本体と同じ素材・描画で、選んだパーツを縮小表示する。
      groups.forEach(function(id,index){
      var isBalloon=choices[id]==='balloon',sample=isBalloon?{a:{x:0,y:55},b:{x:28,y:20},c:{x:0,y:-15},balloon:{x:0,y:-65}}:{a:{x:0,y:-65},b:{x:22,y:0},c:{x:0,y:65},jetOffset:-.35-Math.atan2(65,-22)};
      ctx.save();ctx.translate(b.x+(groups.length===2?(index-.5)*82:0),b.y-16);ctx.scale(.4,.4);machine(id,sample.a,sample.c,sample);ctx.restore();
      });
      ctx.fillStyle=on?"#fff":"#335f64";ctx.font="bold 20px sans-serif";ctx.textAlign="center";if(keyHints.matches)ctx.fillText(b.key,b.x,b.y+37);
    });

    if(state===S.INTRO){[2,4].forEach(function(n){var x=n===2?232:308;roundRect(x-34,H*.82-130,68,64,14);ctx.fillStyle=controlCount===n?'#335f64':'#ffffffdf';ctx.fill();ctx.strokeStyle='#335f64';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=controlCount===n?'#fff':'#335f64';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText(String(n),x,H*.82-90);});}
    if(state===S.INTRO){ctx.fillStyle='#fff';roundRect(180,H*.94-32,180,64,18);ctx.fill();ctx.fillStyle='#335f64';ctx.beginPath();ctx.moveTo(262,H*.94-14);ctx.lineTo(284,H*.94);ctx.lineTo(262,H*.94+14);ctx.closePath();ctx.fill();}
    if(state!==S.INTRO){ctx.save();ctx.translate(45,93);ctx.strokeStyle='#335f64';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-17,0);ctx.moveTo(-3,-15);ctx.lineTo(-18,0);ctx.lineTo(-3,15);ctx.stroke();ctx.restore();}
    if (state === S.RESULT&&!withoutResult) drawResult();
  }

  // 白い紙枠と記録を一枚にして、画面表示と画像保存で共用する。
  function makeGoalPrint(){
    var paper=document.createElement('canvas');paper.width=840;paper.height=800;
    var c=paper.getContext('2d');c.fillStyle='#fffdf7';c.fillRect(0,0,840,800);
    c.drawImage(goalSnapshot,36,36,768,555);c.strokeStyle='#e5e1d8';c.lineWidth=2;c.strokeRect(36,36,768,555);
    c.fillStyle='#273738';c.font='italic 76px Georgia, serif';c.textAlign='center';c.fillText(String(score),420,722);
    return paper;
  }
  function shutter(){
    if(!AC)return;
    var buffer=AC.createBuffer(1,Math.floor(AC.sampleRate*.11),AC.sampleRate),data=buffer.getChannelData(0);
    for(var i=0;i<data.length;i++){var t=i/AC.sampleRate;data[i]=(Math.random()*2-1)*(Math.exp(-t*95)+.55*Math.exp(-Math.max(0,t-.045)*110)*(t>.045?1:0));}
    var source=AC.createBufferSource(),gain=AC.createGain();source.buffer=buffer;gain.gain.value=.19;source.connect(gain);gain.connect(AC.destination);source.onended=function(){source.disconnect();gain.disconnect();};source.start();
  }
  function saveGoalImage(){
    if(!goalPrint)return;
    // 画像揚げと同様、タップの権限が有効な間にファイル共有を呼ぶ。
    var name='スーパーカスタムシャーク-'+score+'.png',encoded=atob(goalPrint.toDataURL('image/png').split(',')[1]),bytes=new Uint8Array(encoded.length);
    for(var i=0;i<encoded.length;i++)bytes[i]=encoded.charCodeAt(i);
    var file=new File([bytes],name,{type:'image/png'});
    function download(){var url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},60000);}
    var nav=window.navigator,mobile=nav&&(/Android|iPhone|iPad|iPod/i.test(nav.userAgent||'')||((nav.maxTouchPoints||0)>1&&/Mac/i.test(nav.platform||'')));
    if(mobile&&nav.share&&nav.canShare&&nav.canShare({files:[file]})){nav.share({files:[file]}).catch(function(e){if(e.name!=='AbortError')download();});}else download();
  }
  function snapshotLayout(){var w=Math.min(402,H*.52),h=w*800/840;return{x:(W-w)/2,y:H*.13,w:w,h:h};}
  function resultButtons(){return[{id:'retry',x:120,y:H*.82,r:54,label:'もう一度'},{id:'share',x:270,y:H*.82,r:54,label:'Xでシェア'},{id:'save',x:420,y:H*.82,r:54,label:'画像を保存'}];}
  function hitButton(x,y){var bs=resultButtons();for(var i=0;i<bs.length;i++)if(Math.abs(x-bs[i].x)<=54&&Math.abs(y-bs[i].y)<=54)return bs[i].id;return null;}
  function drawResult(){
    var photo=snapshotLayout(),appear=Math.max(0,Math.min(1,(finishAge-.12)/.45));
    ctx.save();ctx.globalAlpha=appear;ctx.translate(W/2,photo.y+photo.h/2+(1-appear)*32);ctx.rotate(-.025);
    ctx.shadowColor='rgba(21,45,49,.32)';ctx.shadowBlur=18;ctx.shadowOffsetY=10;
    if(goalPrint)ctx.drawImage(goalPrint,-photo.w/2,-photo.h/2,photo.w,photo.h);ctx.restore();
    resultButtons().forEach(function(b){
      ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#ffffffed';ctx.strokeStyle='#335f64';ctx.lineWidth=3;roundRect(-54,-54,108,108,20);ctx.fill();ctx.stroke();ctx.fillStyle='#335f64';
      if(b.id==='save'){
        ctx.strokeStyle='#335f64';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(0,10);ctx.moveTo(-11,-1);ctx.lineTo(0,10);ctx.lineTo(11,-1);ctx.moveTo(-21,15);ctx.lineTo(-21,26);ctx.lineTo(21,26);ctx.lineTo(21,15);ctx.stroke();
      }else if(window.zActionIcon)window.zActionIcon(ctx,b.label,0,0,38);
      ctx.restore();
    });
    var flash=Math.max(0,1-finishAge/.19);if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.85)+')';ctx.fillRect(0,0,W,H);}
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return Object.assign({ state: state, score: score, elapsed:T, snapshot:!!goalSnapshot, finishAge:finishAge, controlCount:controlCount, resultButtons:state===S.RESULT?resultButtons():[], W: W, H: H, goal: GOAL, controls:controls() },walker.now()); },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    frame: function(){draw();return canvas;},
    run: async function (r) {
      await r.wait(1000);
      r.key();
      function key(type,k){window.dispatchEvent(new KeyboardEvent(type,{key:k,bubbles:true}));}
      for(var i=0;i<80&&state!==S.RESULT;i++){key("keydown","a");key("keydown","s");await r.wait(350);key("keydown","k");key("keydown","l");await r.wait(350);key("keyup","a");key("keyup","s");await r.wait(350);key("keyup","k");key("keyup","l");await r.wait(350);}
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  newRound();state=S.INTRO;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
