<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>謎にUIが多い</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #000; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 謎にUIが多い（題名は仮）

   上はゲームの画面、下はやたら多いつまみ・ダイヤル・スイッチ・ボタン。説明は一切ない。
   どれも何かが本当に変わる。触って、何が起きるかを見つけながら進む。
   どの面も、ふつうの左右とジャンプだけでは抜けられない。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音（音量つまみと消音が本当に効く） ============ */
  var AC = null, NOISE = null, MASTER = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    MASTER = AC.createGain();
    MASTER.connect(AC.destination);
    setVolume();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function setVolume() { if (MASTER) MASTER.gain.value = V.mute ? 0 : Math.pow(V.vol, 1.6) * 2.2; }
  /* 音程つまみで全部の音の高さが変わる */
  function pitchMul() { return Math.pow(2, (V.pitch - 0.5) * 2); }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0), m = pitchMul();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq * m, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to * m, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(MASTER);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq * pitchMul(); f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(MASTER);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  var SND = {
    jump: function () { tone(330, 0.12, 0.08, "square", 660); heard(); },
    flap: function () { tone(500, 0.06, 0.05, "square", 700); heard(); },
    boing: function () { tone(200, 0.2, 0.08, "sine", 600); heard(); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 0.07, "square", null, i * 0.08); }); },
    tick: function () { tone(1400, 0.02, 0.03, "square"); },
    click: function () { noiseHit(0.03, 2500, 0.3, 3); },
    glass: function () { for (var i = 0; i < 6; i++) noiseHit(0.25, 3000 + i * 900, 0.5, 4, i * 0.03); tone(2600, 0.4, 0.05, "triangle", 1800); },
    crush: function () { noiseHit(0.25, 200, 0.6, 1); },
    thud: function () { noiseHit(0.2, 180, 0.6, 1); },
    ouch: function () { tone(700, 0.3, 0.07, "square", 200); },
    flip: function () { tone(500, 0.25, 0.06, "sine", 250); },
    melt: function () { noiseHit(0.6, 900, 0.3, 0.6); },
    open: function () { tone(880, 0.5, 0.06, "sine", 1320); },
    slam: function () { noiseHit(0.15, 400, 0.7, 1); }
  };

  /* ============ つまみ類 ============
     数のものは 0〜1。ほかは入り切り。 */
  var V;
  function resetV() {
    V = { h: 0.2, w: 0.07, grav: 0.364, vol: 0.5, bright: 1, speed: 0.45, col: 0, flip: false,
      wind: 0.5, temp: 0.5, alpha: 1, res: 1, tilt: 0.5, wifi: true, air: false, pitch: 0.5,
      magnet: false, pause: false, eco: false, fric: 0.5, bounce: 0, mute: false, shake: 0 };
  }
  resetV();
  function wantH() { return 4 + V.h * 40; }
  function wantW() { return 4 + V.w * 56; }
  function gravity() { return (300 + V.grav * 1100) * (V.air ? 0.45 : 1); }
  function speed() { return V.pause ? 0 : 0.2 + V.speed * 1.8; }
  function wind() { return (V.wind - 0.5) * 2 * 180; }
  function tiltA() { return (V.tilt - 0.5) * 0.4; }
  function pixel() { return 1 + Math.round((1 - V.res) * 7); }
  var COLS = ["#f4f1e8", "#e2574c", "#3d7fd6"];

  /* 並べ方。span は横に何マス使うか。型：vs 縦つまみ、hs 横つまみ、dial、toggle、btn */
  var LAYOUT = [
    ["w", "hs", 2, "#4a90c8"], ["grav", "dial", 1, "#4a4f5c"], ["flip", "toggle", 1, "#4cc06a"], ["h", "vs", 1, "#e0a23a"], ["vol", "hs", 2, "#9a6ad0"],
    ["col", "btn", 1, ""], ["temp", "vs", 1, "#e2574c"], ["wifi", "toggle", 1, "#3d7fd6"], ["bright", "hs", 2, "#f0c040"], ["wind", "dial", 1, "#6aa8a0"], ["alpha", "vs", 1, "#8aa0b8"],
    ["shake", "btn", 1, "#c98a5a"], ["air", "toggle", 1, "#f08a30"], ["res", "vs", 1, "#58b070"], ["tilt", "dial", 1, "#7d6a5a"], ["speed", "hs", 2, "#4cb0d8"], ["magnet", "toggle", 1, "#c04a5a"],
    ["fric", "vs", 1, "#a07850"], ["eco", "toggle", 1, "#6cc04a"], ["pause", "btn", 1, "#5a6070"], ["bounce", "vs", 1, "#e070b0"], ["mute", "toggle", 1, "#8d949c"], ["pitch", "hs", 2, "#d0a030"]
  ];

  var CTRL = {};
  /* 画面（中のゲームは横200×縦120の点で描き、2.5倍で出す） */
  var LW = 200, LH = 120, SC = 2.5, LX = 20, LY = 20;
  var GROUND = 100;
  var VH = LH, VT = 0; /* 画面に映る高さと、映る一番上（縦長の画面では空が広く映る） */

  function place() {
    var cellH = 84;
    var sh = Math.max(LH * SC, Math.min(460, H - 120 - cellH * 4 - 50));
    VH = sh / SC; VT = LH - VH;
    var total = sh + 120 + cellH * 4 + 10;
    LY = 20 + Math.max(0, Math.round((H - 20 - total) / 2));
    var y0 = LY + sh + 52;
    CTRL.L = { kind: "move", x: 58, y: y0, r: 30 };
    CTRL.R = { kind: "move", x: 140, y: y0, r: 30 };
    CTRL.A = { kind: "move", x: 482, y: y0, r: 32 };
    var gx = 4, gy = y0 + 46, cw = 76, col = 0, row = 0;
    LAYOUT.forEach(function (it) {
      if (col + it[2] > 7) { col = 0; row++; }
      var c = { kind: it[1], x: gx + col * cw, y: gy + row * cellH, w: cw * it[2], h: cellH, col: it[3] };
      c.cx = c.x + c.w / 2; c.cy = c.y + c.h / 2;
      CTRL[it[0]] = c;
      col += it[2];
    });
  }

  /* ============ 面 ============ */
  function blk(x, y, w, h, kind, c) { return { x: x, y: y, w: w, h: h, kind: kind || "", c: c || 0 }; }
  function gnd(a, b, y) { return blk(a, y || GROUND, b - a, 60); }
  function ceil(x, w, bottom, kind, c) { return blk(x, -400, w, bottom + 400, kind, c); }
  var STAGES = [
    /* 1 背：低いすき間 */
    function () { return { solids: [gnd(0, 200), ceil(70, 60, 92)] }; },
    /* 2 幅：ジャンプでは届かない穴（天井が低い） */
    function () { return { solids: [gnd(0, 70), gnd(116, 200), ceil(0, 200, 70)] }; },
    /* 3 音量でガラス、消音で耳の門 */
    function () { return { solids: [gnd(0, 200), ceil(60, 8, 100, "glass"), blk(108, 86, 16, 14), ceil(150, 8, 70, "ear")] }; },
    /* 4 重力で高い段、解像度で細い柵 */
    function () { return { solids: [gnd(0, 200), blk(56, 40, 54, 60), ceil(150, 1, 100, "fence"), ceil(153, 1, 100, "fence"), ceil(156, 1, 100, "fence")] }; },
    /* 5 明るさ：暗いときだけ見える橋 */
    function () { return { solids: [gnd(0, 20), gnd(180, 200), blk(20, GROUND, 160, 6, "dark")] }; },
    /* 6 速さ・一時停止で柱、透明度で光線 */
    function () { return { solids: [gnd(0, 200)], crush: [{ x: 70, w: 16, t: 0 }], lasers: [150] }; },
    /* 7 色の壁と、電波の壁 */
    function () { return { solids: [gnd(0, 200), ceil(60, 8, 100, "col", 1), ceil(100, 8, 100, "col", 2), ceil(150, 8, 100, "wifi")] }; },
    /* 8 上下：天井づたい */
    function () { return { solids: [gnd(0, 30), gnd(170, 200), ceil(0, 200, 10)] }; },
    /* 9 風：広い穴 */
    function () { return { solids: [gnd(0, 40), gnd(160, 200)] }; },
    /* 10 扇風機（省電力で止まる）と、凍らせる水 */
    function () { return { solids: [gnd(0, 120), gnd(120, 170, 130), gnd(170, 200), blk(120, 100, 50, 30, "water")], fan: true }; },
    /* 11 温度で溶ける氷、音程で開く扉 */
    function () { return { solids: [gnd(0, 200), ceil(60, 10, 100, "ice"), ceil(140, 8, 100, "pitch")] }; },
    /* 12 揺らすと落ちる吊り板 */
    function () { return { solids: [gnd(0, 40), gnd(40, 120, 140), gnd(120, 200)], movs: [{ x: 40, y: 12, w: 80, h: 40, kind: "hang", fixed: true }] }; },
    /* 13 傾けると転がる岩 */
    function () { return { solids: [gnd(0, 60), gnd(60, 108, 144), gnd(108, 200), ceil(108, 92, 52)], movs: [{ x: 140, y: 56, w: 44, h: 44, kind: "rock" }] }; },
    /* 14 磁石で寄ってくる箱 */
    function () { return { solids: [gnd(0, 200), blk(120, 25, 80, 75)], movs: [{ x: 140, y: -25, w: 50, h: 50, kind: "metal" }], flagY: 25 }; },
    /* 15 とても高い壁（機内モード・弾力・摩擦のどれか） */
    function () { return { solids: [gnd(0, 200), blk(100, 10, 100, 90)], flagY: 10 }; }
  ];
  var LAST = STAGES.length - 1;
  function makeStage(n) {
    var s = STAGES[n]();
    s.n = n; s.w = 200; s.flagX = 190; s.flagY = s.flagY || GROUND;
    s.crush = s.crush || []; s.lasers = s.lasers || []; s.movs = s.movs || [];
    s.solids.forEach(function (r) { r.broken = false; r.pass = false; r.was = false; r.shut = 0; r.open = false; });
    s.movs.forEach(function (m) { m.vx = 0; m.vy = 0; });
    return s;
  }

  var S = { INTRO: 0, PLAY: 1, RESULT: 2 };
  var state = S.INTRO, stage, P, T = 0, retries = 0, dead = -1, clearT = -1, camX = 0;
  var keys = { L: false, R: false }, pointers = {}, jumpQ = 0, fx = [], shake = 0, flash = {};

  function newRound() {
    resetV(); setVolume();
    T = 0; retries = 0; state = S.PLAY; shareButton.hidden = true;
    if (startButton) startButton.hidden = true;
    loadStage(0);
  }
  function loadStage(n) {
    V.flip = false;
    stage = makeStage(n);
    P = { x: 6, y: GROUND - wantH(), w: wantW(), h: wantH(), vx: 0, vy: 0, ground: true, face: 1 };
    dead = -1; clearT = -1; jumpQ = 0; fx = []; camX = 0;
  }
  function die() { if (dead < 0) { dead = 0; SND.ouch(); } }

  /* 耳の門：音が聞こえると閉まり、離れるまで開かない */
  function heard() {
    if (V.mute || V.vol < 0.05 || !stage) return;
    stage.solids.forEach(function (r) { if (r.kind === "ear" && !r.shut) { r.shut = 1; SND.slam(); } });
  }

  /* その瞬間に壁としてあるか */
  function isSolid(r) {
    if (r.kind === "glass") return !r.broken;
    if (r.kind === "dark") return V.bright < 0.3;
    if (r.kind === "col") return V.col !== r.c;
    if (r.kind === "wifi") return V.wifi;
    if (r.kind === "fence") return V.res > 0.25;
    if (r.kind === "water") return V.temp < 0.2;
    if (r.kind === "ice") return !r.broken;
    if (r.kind === "pitch") return !r.open;
    return true;
  }
  function crushRect(c) {
    var p = c.t % 1, b;
    if (p < 0.25) b = 80;
    else if (p < 0.35) b = 80 + 20 * (p - 0.25) / 0.1;
    else if (p < 0.85) b = 100;
    else b = 100 - 20 * (p - 0.85) / 0.15;
    return { x: c.x, y: -400, w: c.w, h: b + 400 };
  }
  function statics() {
    var r = stage.solids.filter(function (o) { return isSolid(o) && !o.pass; });
    stage.crush.forEach(function (c) { r.push(crushRect(c)); });
    return r;
  }
  function solids() { return statics().concat(stage.movs); }
  function hitRect(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function hitsAny(a) { return solids().some(function (s) { return hitRect(a, s); }); }

  function held(id) {
    if (flash[id] > 0) return true;
    for (var k in pointers) if (pointers[k] && pointers[k].id === id) return true;
    return (id === "L" && keys.L) || (id === "R" && keys.R);
  }

  /* つまみに合わせて体の大きさを変える。壁にぶつかる所までしか伸びない */
  function resize() {
    var down = V.flip ? -1 : 1, i;
    var th = wantH();
    for (i = 0; i < 200 && Math.abs(P.h - th) > 0.01; i++) {
      var nh = P.h + Math.max(-0.5, Math.min(0.5, th - P.h));
      var ny = down > 0 ? P.y + P.h - nh : P.y;
      var c = { x: P.x, y: ny, w: P.w, h: nh };
      if (nh > P.h && hitsAny(c)) break;
      P.h = nh; P.y = ny;
    }
    var tw = wantW();
    for (i = 0; i < 200 && Math.abs(P.w - tw) > 0.01; i++) {
      var nw = P.w + Math.max(-0.5, Math.min(0.5, tw - P.w));
      var opts = [P.x - (nw - P.w) / 2, P.x, P.x - (nw - P.w)], ok = false;
      for (var j = 0; j < opts.length; j++) {
        var cc = { x: opts[j], y: P.y, w: nw, h: P.h };
        if (nw < P.w || !hitsAny(cc)) { P.x = opts[j]; P.w = nw; ok = true; break; }
      }
      if (!ok) break;
    }
  }

  /* 動く物（吊り板・岩・鉄の箱） */
  function moveMovs(dt) {
    var st = statics();
    stage.movs.forEach(function (m) {
      if (m.fixed) { if (V.shake > 0) { m.fixed = false; SND.thud(); } else return; }
      var others = st.concat(stage.movs.filter(function (o) { return o !== m; }));
      var tx = 0;
      if (m.kind === "rock" && Math.abs(V.tilt - 0.5) > 0.08) tx = (V.tilt - 0.5) * 2 * 150;
      if (m.kind === "metal" && V.magnet) {
        var dx = (P.x + P.w / 2) - (m.x + m.w / 2);
        if (Math.abs(dx) > 2) tx = (dx > 0 ? 1 : -1) * 60;
      }
      m.vx = tx;
      m.x += m.vx * dt;
      if (others.some(function (o) { return hitRect(m, o); }) || hitRect(m, P)) { m.x -= m.vx * dt; m.vx = 0; }
      if (m.x < 0) m.x = 0;
      if (m.x + m.w > stage.w) m.x = stage.w - m.w;
      m.vy = Math.min(420, m.vy + 700 * dt);
      m.y += m.vy * dt;
      var hitO = null;
      others.forEach(function (o) { if (hitRect(m, o)) hitO = o; });
      if (hitO) { m.y = hitO.y - m.h; if (m.vy > 120) { SND.thud(); shake = 0.2; } m.vy = 0; }
      if (hitRect(m, P)) {
        if (m.vy > 0 && P.y > m.y) die();
        else { m.y -= m.vy * dt; m.vy = 0; }
      }
    });
  }

  function update(dt) {
    for (var f in flash) flash[f] -= dt;
    if (shake > 0) shake -= dt;
    if (V.shake > 0) V.shake -= dt;
    fx.forEach(function (e) { e.t += dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 300 * dt; });
    fx = fx.filter(function (e) { return e.t < e.life; });
    if (state !== S.PLAY) return;
    T += dt;
    var spd = speed();
    stage.crush.forEach(function (c) { c.t += dt * spd * 1.1; });
    if (dead >= 0) {
      dead += dt;
      if (dead > 0.8) { retries++; loadStage(stage.n); }
      return;
    }
    if (clearT >= 0) {
      clearT += dt;
      if (clearT > 0.9) { if (stage.n >= LAST) finish(); else loadStage(stage.n + 1); }
      return;
    }
    stage.solids.forEach(function (r) {
      /* ガラスは大きな音で震え、ひびが入り、最大で割れる */
      if (r.kind === "glass" && !r.broken && V.vol >= 0.95 && !V.mute) {
        r.broken = true; SND.glass(); shake = 0.3;
        for (var i = 0; i < 14; i++) fx.push({ x: r.x + 4, y: 20 + Math.random() * 80, vx: (Math.random() - 0.3) * 80, vy: -Math.random() * 60, t: 0, life: 1.2, c: "rgba(220,245,255,.9)" });
      }
      if (r.kind === "ice" && !r.broken && V.temp > 0.8) {
        r.broken = true; SND.melt();
        for (var j = 0; j < 12; j++) fx.push({ x: r.x + Math.random() * r.w, y: 30 + Math.random() * 70, vx: 0, vy: 20, t: 0, life: 1, c: "rgba(150,210,255,.9)" });
      }
      if (r.kind === "pitch" && !r.open && Math.abs(V.pitch - 0.82) < 0.05) { r.open = true; SND.open(); }
      if (r.kind === "ear") {
        if (r.shut && Math.abs(P.x + P.w / 2 - r.x) > 70) r.shut = 0;
        r.h = (r.shut ? 100 : 70) + 400;
      }
    });
    /* 急に壁になったものの中にいたら、出るまではすり抜ける（耳の門は挟む） */
    stage.solids.forEach(function (r) {
      var now = isSolid(r);
      if (r.kind === "ear") { if (hitRect(P, r)) { die(); SND.crush(); } return; }
      if (now && !r.was && hitRect(P, r)) r.pass = true;
      if (r.pass && (!now || !hitRect(P, r))) r.pass = false;
      r.was = now;
    });
    if (dead >= 0) return;
    moveMovs(dt);
    if (dead >= 0) return;
    resize();
    stage.crush.forEach(function (c) { if (hitRect(P, crushRect(c))) { die(); SND.crush(); shake = 0.3; } });
    stage.lasers.forEach(function (x) { if (V.alpha > 0.25 && P.x < x + 1 && P.x + P.w > x) die(); });

    }
    var d = id === "L" ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(c.x + d * 12, c.y + oy); ctx.lineTo(c.x - d * 8, c.y + oy - 12); ctx.lineTo(c.x - d * 8, c.y + oy + 12); ctx.closePath(); ctx.fill();
  }
  function drawSlider(id) {
    var c = CTRL[id], g = sliderGeom(c), k = knobPos(id);
    ctx.fillStyle = "#9aa1a8";
    if (c.kind === "hs") {
      roundRect(g.x1, g.y - 4, g.x2 - g.x1, 8, 4); ctx.fill();
      ctx.fillStyle = c.col; roundRect(g.x1, g.y - 4, Math.max(8, k.x - g.x1), 8, 4); ctx.fill();
    } else {
      roundRect(g.x - 4, g.y1, 8, g.y2 - g.y1, 4); ctx.fill();
      ctx.fillStyle = c.col; roundRect(g.x - 4, k.y, 8, Math.max(8, g.y2 - k.y), 4); ctx.fill();
    }
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.arc(k.x, k.y + 2, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fafafa"; ctx.beginPath(); ctx.arc(k.x, k.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#6b727a"; ctx.lineWidth = 2; ctx.stroke();
  }
  function drawDial(id) {
    var c = CTRL[id], r = 26, a = -DIAL_A + V[id] * DIAL_A * 2;
    ctx.strokeStyle = "#8d949c"; ctx.lineWidth = 2;
    for (var i = 0; i <= 8; i++) {
      var t = -DIAL_A + i * DIAL_A * 0.25;
      ctx.beginPath();
      ctx.moveTo(c.cx + Math.sin(t) * (r + 4), c.cy - Math.cos(t) * (r + 4));
      ctx.lineTo(c.cx + Math.sin(t) * (r + 9), c.cy - Math.cos(t) * (r + 9));
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.arc(c.cx, c.cy + 3, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(c.cx, c.cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#f4f1e8"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(c.cx + Math.sin(a) * 7, c.cy - Math.cos(a) * 7); ctx.lineTo(c.cx + Math.sin(a) * (r - 6), c.cy - Math.cos(a) * (r - 6)); ctx.stroke();
    ctx.lineCap = "butt";
  }
  function drawToggle(id) {
    var c = CTRL[id], w = 60, h = 32, x = c.cx - w / 2, y = c.cy - h / 2, on = V[id];
    ctx.fillStyle = on ? c.col : "#9aa1a8";
    roundRect(x, y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = "#fafafa";
    ctx.beginPath(); ctx.arc(on ? x + w - h / 2 : x + h / 2, c.cy, h / 2 - 4, 0, Math.PI * 2); ctx.fill();
  }
  function drawButton(id) {
    var c = CTRL[id], down = held(id) || (id === "pause" && V.pause) || (id === "shake" && V.shake > 0);
    var w = 54, h = 40, x = c.cx - w / 2, y = c.cy - h / 2 + (down ? 3 : 0);
    ctx.fillStyle = "rgba(0,0,0,.2)"; roundRect(x, c.cy - h / 2 + 4, w, h, 10); ctx.fill();
    ctx.fillStyle = id === "col" ? COLS[V.col] : c.col;
    roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = "#6b727a"; ctx.lineWidth = 2; ctx.stroke();
    if (id === "pause" && V.pause) { ctx.fillStyle = "#ffd75a"; ctx.beginPath(); ctx.arc(c.cx, y + 8, 3, 0, Math.PI * 2); ctx.fill(); }
  }

  /* 結果画面。秒数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, stage: stage.n, x: P.x, y: P.y, w: P.w, h: P.h, ground: P.ground, dead: dead >= 0,
        crush: stage.crush.map(function (c) { return c.t % 1; }), movs: stage.movs.map(function (m) { return { x: m.x, y: m.y }; }),
        time: T, retries: retries, clear: clearT >= 0, W: W, H: H, ctrl: CTRL, V: V };
    },
    set: function (id, v) {
      if (typeof v === "boolean" || id === "col") { if (V[id] !== v) { if (id === "col") V.col = v; else tapCtrl({ id: id }); } }
      else setV(id, v);
    },
    shake: function () { tapCtrl({ id: "shake" }); },
    keys: keys,
    jump: function () { jumpQ = 0.12; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
