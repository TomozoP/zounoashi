<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>絶叫裁判</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:0; opacity:0; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #retry-button, #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #retry-button[hidden], #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="retry-button" type="button" aria-label="もう一度" hidden></button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 絶叫裁判

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var retryButton=document.getElementById('retry-button');
  window.zResultActions.bind(retryButton,function(){audioOn();newRound();requestInputs();});

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", FALL: "fall", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  var level=0,peak=0,charge=0,won=false,verdictTime=0;
  var mic=null, micSource=null, analyser=null, samples=null, micPending=false, micError=false;
  function stopMic() { if(micSource){micSource.disconnect();micSource=null;} if(mic) mic.getTracks().forEach(function(t){t.stop();}); mic=null; analyser=null; }
  function requestInputs(){requestMic();startRecognition();}
  function stopInputs(){stopMic();stopRecognition();}
  async function requestMic() {
    if(micPending || mic) return;
    if(!window.navigator.mediaDevices || !window.navigator.mediaDevices.getUserMedia || !AC) { micError=true; return; }
    micPending=true; micError=false;
    try {
      var stream=await window.navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      if(document.hidden){stream.getTracks().forEach(function(t){t.stop();});return;}
      mic=stream; analyser=AC.createAnalyser(); analyser.fftSize=1024;
      samples=new Float32Array(analyser.fftSize);
      micSource=AC.createMediaStreamSource(stream); micSource.connect(analyser);
      stream.getTracks().forEach(function(t){t.onended=function(){stopMic();micError=true;};});
    } catch(e) { stopMic(); micError=true; }
    finally { micPending=false; }
  }
  window.addEventListener('pagehide',stopInputs);
  document.addEventListener('visibilitychange',function(){if(document.hidden){stopInputs();held=false;}else if(state===S.PLAY && !micError){requestInputs();}});
  function readVoice() {
    if(!analyser) return 0;
    analyser.getFloatTimeDomainData(samples);
    var sum=0; for(var i=0;i<samples.length;i++)sum+=samples[i]*samples[i];
    return Math.max(0,Math.min(1,(Math.sqrt(sum/samples.length)-0.012)/0.075));
  }
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  var cases=[
    {fact:'店は午後6時に閉店。',statement:'「午後7時に、その店でパンを買った」',lines:['天気','時間','場所'],keys:[['天気','てんき'],['時間','じかん'],['場所','ばしょ']],answer:1},
    {fact:'建物には階段しかありません。',statement:'「エレベーターで3階へ行った」',lines:['移動','時間','天気'],keys:[['移動','いどう'],['時間','じかん'],['天気','てんき']],answer:0},
    {fact:'その日は一日中、晴れでした。',statement:'「大雨だったので傘を差した」',lines:['場所','時間','天気'],keys:[['場所','ばしょ'],['時間','じかん'],['天気','てんき']],answer:2}
  ];
  var caseIndex=-1,current=cases[0],selected=-1,scan=0,scanTime=0,selectionTime=0,quiet=0,mode='scan',recognizer=null,recognitionEpoch=0;
  function stopRecognition(){recognitionEpoch++;if(recognizer){recognizer.onend=null;recognizer.abort();recognizer=null;}}
  function chooseWords(text){
    if(state!==S.PLAY||mode!=='words')return;
    var clean=text.replace(/[\s。、！？]/g,'');var hits=[];
    current.keys.forEach(function(keys,i){if(keys.some(function(k){return clean.includes(k);}))hits.push(i);});
    if(hits.length===1){selected=hits[0];selectionTime=T;charge=0;}
  }
  async function startRecognition(){
    if(recognizer)return;var R=window.SpeechRecognition||window.webkitSpeechRecognition;
    mode='scan';
    // 端末内処理を保証できない実装では、認識を開始しない。
    if(!R||!('processLocally' in R.prototype)||typeof R.available!=='function')return;
    var epoch=++recognitionEpoch;
    try{
      var available=await R.available({langs:['ja-JP'],processLocally:true});
      if(epoch!==recognitionEpoch||state!==S.PLAY||document.hidden||available!=='available')return;
      var r=new R();r.processLocally=true;if(r.processLocally!==true)return;
      recognizer=r;mode='words';r.lang='ja-JP';r.continuous=true;r.interimResults=false;
      r.onresult=function(e){if(epoch!==recognitionEpoch)return;for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)chooseWords(e.results[i][0].transcript);};
      r.onerror=function(){if(epoch!==recognitionEpoch)return;stopRecognition();mode='scan';scanTime=0;quiet=0;};
      r.onend=function(){if(epoch!==recognitionEpoch||state!==S.PLAY||document.hidden)return;try{r.start();}catch(e){stopRecognition();mode='scan';}};
      r.start();
    }catch(e){if(epoch===recognitionEpoch){stopRecognition();mode='scan';}}
  }
  function newRound(){
    shareButton.hidden=true;retryButton.hidden=true;document.getElementById('start').hidden=true;
    stopRecognition();caseIndex=(caseIndex+1)%cases.length;current=cases[caseIndex];selected=-1;scan=0;scanTime=selectionTime=quiet=0;mode="scan";
    state=S.PLAY;score=0;T=0;held=false;level=peak=charge=verdictTime=0;won=false;
  }
  function update(dt){
    if(document.hidden||micPending)return;
    if(state===S.FALL){verdictTime+=dt;if(verdictTime>1.3)state=S.RESULT;return;}
    if(state!==S.PLAY)return;
    T+=dt;var input=held?1:readVoice();level+=(input-level)*Math.min(1,dt*18);
    peak=Math.max(peak,level);score=Math.round(peak*100);
    if(level<.15)quiet+=dt;
    if(mode==='scan'&&selected<0){scanTime+=dt;if(scanTime>=2.4){scanTime-=2.4;scan=(scan+1)%3;}
      if(level>.45&&quiet>.2){selected=scan;selectionTime=T;charge=0;}
    }
    if(selected>=0&&T-selectionTime>3){selected=-1;charge=0;quiet=0;}
    charge=selected>=0&&level>.72?charge+dt:Math.max(0,charge-dt*2);
    if(charge>=.25||T>=30){won=charge>=.25&&selected===current.answer;state=S.FALL;verdictTime=0;held=false;stopInputs();
      noiseHit(.2,180,.15);if(won){tone(523,.18,.09);tone(659,.22,.08,'sine',null,.12);tone(784,.4,.08,'sine',null,.25);}
    }
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO||state===S.FALL)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") { newRound(); requestInputs(); }
      return;
    }
    held = true;
    /* ▼UPDATE: 押したときの処理 */
    if(!mic && !micPending && !micError) requestInputs();
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;

  }
  function up() {
    if (!held) return;
    held = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) { newRound(); audioOn(); requestInputs(); } return; }
    if (left || right) {
      if (state !== S.PLAY) return;

      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    window.zResultActions.x({ text: (won?"勝訴！ ":"")+score+"点 #絶叫裁判" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
  function draw() {
    window.zResultActions.place(retryButton, resultButtons()[0], W, H, state === S.RESULT);
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    drawCourt();
    if(state===S.PLAY)drawTestimony();
    if(state===S.INTRO){ctx.fillStyle='#fff';roundRect(150,H-98,240,68,34);ctx.fill();ctx.fillStyle='#16202e';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('START',270,H-54);}
    if(state===S.FALL&&won)drawVerdict();
    if (state === S.RESULT) drawResult();
  }

  function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
  function oval(x,y,rx,ry,color){ctx.fillStyle=color;ellipse(x,y,rx,ry);}
  function drawCourt(){
    var floor=H*.7,jy=H*.42,power=state===S.INTRO?0:level;
    var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#172632');bg.addColorStop(1,'#80644a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    rect(32,0,476,floor,'#564232');
    for(var i=0;i<7;i++){rect(40+i*68,0,4,floor,'#775a3d');}
    [-1,1].forEach(function(side){var x=270+side*201;rect(x-20,0,40,floor,'#ceb88b');rect(x-27,floor-14,54,18,'#e3d3aa');rect(x-27,35,54,17,'#e3d3aa');rect(x-8,53,4,floor-67,'#a79372');});
    oval(270,H*.19,50,50,'#ba9659');oval(270,H*.19,43,43,'#273440');
    ctx.strokeStyle='#e9cd84';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(270,H*.19-27);ctx.lineTo(270,H*.19+28);ctx.moveTo(240,H*.19-12);ctx.lineTo(300,H*.19-12);ctx.stroke();
    [-1,1].forEach(function(side){var x=270+side*26,y=H*.19;ctx.beginPath();ctx.moveTo(x,y-12);ctx.lineTo(x-14,y+13);ctx.lineTo(x+14,y+13);ctx.closePath();ctx.stroke();});
    rect(198,jy-83,144,160,'#292d30');rect(206,jy-75,128,150,'#873d38');
    ctx.save();ctx.translate(270+Math.sin(T*48)*power*5,jy-power*24);ctx.rotate(-power*.2);
    oval(0,44,57,70,'#151d25');rect(-12,3,24,32,'#fff0d4');
    oval(0,-25,39,46,'#e7b791');oval(0,-57,40,18,'#ece6da');
    [-1,1].forEach(function(side){oval(side*21,-68,14,12,'#ece6da');oval(side*39,-39,9,22,'#ddd6cc');oval(side*14,-28,5,5+power*3,'#202935');});
    oval(0,-4,6+power*9,3+power*13,'#4f292b');
    ctx.strokeStyle='#b38e68';ctx.lineWidth=2;ctx.strokeRect(-26,-38,23,20);ctx.strokeRect(3,-38,23,20);ctx.beginPath();ctx.moveTo(-3,-29);ctx.lineTo(3,-29);ctx.stroke();ctx.restore();
    rect(56,jy+70,428,126,'#5a3024');rect(45,jy+66,450,17,'#c09259');rect(65,jy+92,410,4,'#a66b40');
    for(var i=0;i<5;i++){rect(78+i*81,jy+103,64,73,'#774531');rect(83+i*81,jy+108,54,4,'#9d6240');}
    rect(0,floor,W,H-floor,'#282e34');ctx.strokeStyle='#4d4a44';ctx.lineWidth=2;
    for(var i=-4;i<7;i++){ctx.beginPath();ctx.moveTo(270+i*40,floor);ctx.lineTo(270+i*160,H);ctx.stroke();}
    var py=Math.min(H-160,jy+270);oval(270,py+35,54,70,'#213c53');oval(270,py-22,33,39,'#edbb95');oval(270,py-45,34,24,'#202931');
    rect(131,py+51,278,18,'#b88750');rect(151,py+69,238,90,'#633a2a');rect(165,py+81,210,4,'#9a6440');
    if(power>.08&&state!==S.INTRO){ctx.strokeStyle='rgba(255,224,135,'+(power*.6)+')';ctx.lineWidth=2+power*3;for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(270,py-20,65+((T*150+i*38)%120),Math.PI*1.17,Math.PI*1.83);ctx.stroke();}}
    var mw=240,mx=150,my=H-127;rect(mx,my,mw,9,'#192530');rect(mx,my,mw*power,9,power>.72?'#f6d877':'#7ed2c4');rect(mx+mw*.72,my-4,3,17,'#fff3d3');
    if(state===S.PLAY){ctx.strokeStyle='#e6c58b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(492,45,17,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-T/30));ctx.stroke();}
    if(state===S.INTRO){ctx.fillStyle='#fff0ca';ctx.font='900 48px serif';ctx.textAlign='center';ctx.fillText('絶叫裁判',270,H*.1);}
  }
  function drawTestimony(){
    var y=H-325;
    rect(22,y-44,496,206,'#fff8e8');ctx.textAlign='left';ctx.fillStyle='#28313b';ctx.font='bold 20px sans-serif';ctx.fillText(current.fact,36,y-12);
    ctx.font='17px sans-serif';ctx.fillText(current.statement,36,y+22);
    current.lines.forEach(function(line,i){
      var active=selected===i||(selected<0&&mode==='scan'&&scan===i);
      rect(32+i*162,y+43,152,67,active?'#f6d877':'#eadfcc');ctx.fillStyle='#18252e';ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillText(line,108+i*162,y+88);
    });
    ctx.textAlign='left';ctx.font='14px sans-serif';ctx.fillStyle='#37424c';ctx.fillText(mode==='words'?'怪しい言葉を1つ叫ぶ':'光った言葉を声で選ぶ（言葉の認識は非対応）',36,y+143);
  }
  function drawVerdict(){
    var k=Math.min(1,verdictTime*5);ctx.save();ctx.translate(270,H*.4);ctx.rotate(-.065);ctx.scale(.8+k*.2,.8+k*.2);
    ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=24;rect(-92,-150,184,300,'#fffaf0');ctx.shadowBlur=0;ctx.fillStyle='#17212b';ctx.font='900 98px serif';ctx.textAlign='center';ctx.fillText('勝',0,-25);ctx.fillText('訴',0,89);ctx.restore();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.76;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    if(!won)ctx.fillText(String(score),W/2,H*.45);
    ctx.restore();
    if(won)drawVerdict();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now:function(){return {state:state,score:score,W:W,H:H,level:level,won:won,time:T,micPending:micPending,micError:micError,selected:selected,mode:mode,scan:scan,answer:current.answer};},
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();requestInputs();});
  newRound();caseIndex=-1;state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
