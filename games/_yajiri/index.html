<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>矢じりシューター</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #2a2433; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 矢じりシューター

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var stroke, arrows, foes, bits, fizz, spawnT, overT;

  var ZT;                                      /* 描く場所の上端 */
  function place() {
    ZT = Math.round(H * 0.68);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    stroke = null; arrows = []; foes = []; bits = []; fizz = [];
    spawnT = 0.6; overT = 0;
  }

  /* ============ 矢じりの読み取り ============
     描いた線の両端を結んだ線から、いちばん遠い点を先端とみなす。
     両端の真ん中から先端へ向かう向きに飛ぶ。 */
  function readShape(pts) {
    if (pts.length < 3) return null;
    var s = pts[0], e = pts[pts.length - 1];
    var cx = e.x - s.x, cy = e.y - s.y, cl = Math.hypot(cx, cy);
    var best = -1, bi = 0;
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i], d;
      if (cl < 1) d = Math.hypot(p.x - s.x, p.y - s.y);
      else d = Math.abs((p.x - s.x) * cy - (p.y - s.y) * cx) / cl;
      if (d > best) { best = d; bi = i; }
    }
    var a = pts[bi];
    var l1 = Math.hypot(s.x - a.x, s.y - a.y), l2 = Math.hypot(e.x - a.x, e.y - a.y);
    if (best < 18 || l1 < 25 || l2 < 25) return null;
    var dot = ((s.x - a.x) * (e.x - a.x) + (s.y - a.y) * (e.y - a.y)) / (l1 * l2);
    var ang = Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI;
    if (ang > 150) return null;
    var mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
    var dx = a.x - mx, dy = a.y - my, dl = Math.hypot(dx, dy) || 1;
    return { ax: a.x, ay: a.y, dx: dx / dl, dy: dy / dl, size: Math.max(l1, l2), ang: ang, side: l1 > l2 ? 1 : -1 };
  }

  /* 角を丸めてなめらかにする（角を少しずつ切り落とす） */
  function smooth(pts) {
    for (var n = 0; n < 3 && pts.length > 2; n++) {
      var o = [pts[0]];
      for (var i = 0; i < pts.length - 1; i++) {
        var a = pts[i], b = pts[i + 1];
        o.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 });
        o.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 });
      }
      o.push(pts[pts.length - 1]);
      pts = o;
    }
    return pts;
  }

  function shoot(pts) {
    var r = readShape(pts);
    if (!r) {
      fizz.push({ pts: pts, t: 0 });
      tone(180, 0.12, 0.08, "triangle", 120);
      return;
    }
    var rel = pts.map(function (p) { return { x: p.x - r.ax, y: p.y - r.ay }; });
    /* 鋭角ほど遠くまで飛び、たくさん貫く。鈍角は手前で失速して1体しか落とせない */
    var k = Math.max(0, Math.min(1, (r.ang - 25) / 115));
    /* 小さいほどさらに速く遠くへ（小さい 1.6倍 〜 大きい 0.85倍） */
    var m = 1.6 - 0.75 * Math.max(0, Math.min(1, (r.size - 40) / 160));
    arrows.push({ x: r.ax, y: r.ay, dx: r.dx, dy: r.dy, v0: (1150 - 450 * k) * m, pts: rel,
      range: (1400 - 1180 * k) * m, pierce: Math.round(5 - 4 * k), went: 0, fade: 0,
      dmg: dmgOf(r.size), bw: boomWidth(r.size), reach: Math.min(34, 8 + r.size * 0.18), hit: {} });
    var A = arrows[arrows.length - 1];
    A.tier = A.dmg; A.sharp = 1 - k; A.trail = [];
    launchSound(A.tier, A.sharp);
  }

  /* 威力が耳でわかる音：重いほど高く澄んだ音、尖りほど長く鋭い風切り */
  function launchSound(tier, sharp) {
    noiseHit(0.08 + 0.3 * sharp, 1200 + 2400 * sharp, 0.12 + 0.2 * sharp, 0.6 + sharp);
    if (tier === 1) { tone(220, 0.12, 0.12, "triangle", 150); noiseHit(0.1, 300, 0.25, 1); }
    if (tier === 2) { tone(660, 0.14, 0.09, "square", 990); }
    if (tier === 3) { tone(1320, 0.25, 0.08, "triangle", 2640); tone(1980, 0.3, 0.05, "sine", 3960, 0.05); }
  }
  /* 描いている途中の見積もり。威力の段が変わったら小さく鳴らす */
  var lastTier = 0;
  function judge(pts) {
    var r = readShape(pts);
    if (!r) return null;
    var k = Math.max(0, Math.min(1, (r.ang - 25) / 115));
    return { tier: dmgOf(r.size), sharp: 1 - k };
  }

  /* 小さく描くほど高ダメージ（3〜1）。大きいと太くて当てやすいが弱い */
  function dmgOf(size) { return size < 90 ? 3 : size < 150 ? 2 : 1; }

  function spawn() {
    var bat = T > 8 && Math.random() < Math.min(0.45, 0.1 + T * 0.006);
    /* 鉄の的：固い。2〜3発ぶん。小さく尖らせた矢なら1発 */
    var iron = !bat && T > 5 && Math.random() < Math.min(0.4, 0.12 + T * 0.006);
    var hp = iron ? (T > 30 && Math.random() < 0.5 ? 3 : 2) : 1;
    var r = bat ? 24 : iron ? 40 + Math.random() * 8 : 30 + Math.random() * 16;
    var sp = Math.min(210, 55 + T * 2.2) * (bat ? 1.35 : iron ? 0.75 : 1);
    foes.push({ id: Math.random(), bat: bat, iron: iron, hp: hp, hp0: hp, flash: 0, r: r, x0: r + 20 + Math.random() * (W - 2 * r - 40), x: 0,
      y: -r, vy: sp, ph: Math.random() * 6.28, sw: bat ? 60 : 14 + Math.random() * 20, t: 0 });
  }

  /* ============ 進行 ============ */
  function update(dt) {
    bits.forEach(function (b) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 600 * dt; });
    bits = bits.filter(function (b) { return b.t < b.life; });
    fizz.forEach(function (f) { f.t += dt; });
    fizz = fizz.filter(function (f) { return f.t < 0.4; });
    if (state === S.RESULT) return;
    if (state === S.PLAY && overT > 0) {
      overT += dt;
      if (overT > 0.7) { state = S.RESULT; held = false; stroke = null; tone(140, 0.5, 0.15, "sawtooth", 60); }
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.42, 1.5 - T * 0.02) * (0.7 + Math.random() * 0.6); }

    foes.forEach(function (f) {
      f.t += dt; f.y += f.vy * dt; f.flash = Math.max(0, f.flash - dt);
      f.x = Math.max(f.r, Math.min(W - f.r, f.x0 + Math.sin(f.t * (f.bat ? 3 : 1.4) + f.ph) * f.sw));
      if (f.y + f.r >= ZT && !overT) { overT = 0.0001; f.bad = true; }
    });

    arrows.forEach(function (a) {
      var px = a.x, py = a.y;
      var left = a.range - a.went;
      if (left <= 0) { a.fade += dt; return; }
      var v = a.v0 * Math.min(1, left / (a.range * 0.4) + 0.12);
      a.x += a.dx * v * dt; a.y += a.dy * v * dt; a.went += v * dt;
      a.trail.push({ x: a.x, y: a.y });
      if (a.trail.length > 3 + Math.round(a.sharp * 14)) a.trail.shift();
      foes.forEach(function (f) {
        if (f.dead || a.hit[f.id] || a.pierce <= 0) return;
        /* この1コマで先端が通った線分と、的の中心との距離 */
        var sx = a.x - px, sy = a.y - py, L = sx * sx + sy * sy || 1;
        var k = Math.max(0, Math.min(1, ((f.x - px) * sx + (f.y - py) * sy) / L));
        var d = Math.hypot(px + sx * k - f.x, py + sy * k - f.y);
        if (d < f.r + a.reach) {
          a.hit[f.id] = 1; f.hp -= a.dmg; lastHitTier = a.tier; a.pierce--;
          if (f.hp <= 0) { f.dead = true; score++; burst(f); }
          else {
            /* 倒しきれないと矢は弾かれて止まる */
            f.flash = 0.15; f.y -= 14; a.went = a.range; a.pierce = 0;
            tone(1400, 0.08, 0.1, "square", 700); noiseHit(0.08, 3000, 0.2, 3);
          }
          if (a.pierce <= 0) a.went = a.range;
        }
      });
    });
    foes = foes.filter(function (f) { return !f.dead; });
    arrows = arrows.filter(function (a) { return a.fade < 0.3 && a.x > -200 && a.x < W + 200 && a.y > -200 && a.y < H + 200; });
  }

  var lastHitTier = 0;
  function burst(f) {
    for (var i = 0; i < 16; i++) {
      var an = Math.random() * 6.28, sp = 120 + Math.random() * 260;
      bits.push({ x: f.x, y: f.y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 100, t: 0,
        life: 0.5 + Math.random() * 0.3, c: f.bat ? "#3a2b4a" : f.iron ? (i % 2 ? "#6b7684" : "#c4ccd6") : (i % 2 ? "#e2383f" : "#fff") });
    }
    tone(520 + Math.min(score, 40) * 12, 0.1, 0.12, "square", 1040);
    if (lastHitTier === 3) tone(2093, 0.18, 0.06, "triangle", 3136);
    noiseHit(0.12, 900, 0.2, 1.5);
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (overT) return;
    if (x == null) {
      /* キーは真上へ */
      var cx = W / 2, cy = ZT + (H - ZT) * 0.45;
      shoot([{ x: cx - 50, y: cy + 50 }, { x: cx - 25, y: cy + 25 }, { x: cx, y: cy }, { x: cx + 25, y: cy + 25 }, { x: cx + 50, y: cy + 50 }]);
      return;
    }
    if (y < ZT) return;
    held = true;
    stroke = [{ x: x, y: y }]; lastTier = 0;
  }
  function move(x, y) {
    if (state !== S.PLAY || !held || !stroke) return;
    /* 手ぶれ補正：指の位置を少し遅れて追いかけた点を足す */
    var l = stroke[stroke.length - 1];
    var nx = l.x + (x - l.x) * 0.45, ny = l.y + (y - l.y) * 0.45;
    if (Math.hypot(nx - l.x, ny - l.y) >= 4) {
      stroke.push({ x: nx, y: ny });
      var jg = judge(stroke), tr = jg ? jg.tier : 0;
      if (tr !== lastTier) { if (tr) tone([0, 330, 660, 1320][tr], 0.06, 0.05, "sine"); lastTier = tr; }
    }
  }
  function up() {
    if (!held) return;
    held = false;
    if (stroke && state === S.PLAY && !overT) shoot(smooth(stroke));
    stroke = null;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1: 30秒ぶん速くする  2: 敵を5体出す  3: 負けにする */
    if (state !== S.PLAY || overT) return;
    if (n === 1) T += 30;
    if (n === 2) for (var i = 0; i < 5; i++) { spawn(); foes[foes.length - 1].y -= i * 90; }
    if (n === 3 && foes.length) foes[0].y = ZT;
    if (n === 3 && !foes.length) { spawn(); foes[0].y = ZT; }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    window.zResultActions.x({ text: score + "体撃ち落としました #矢じりシューター" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createLinearGradient(0, 0, 0, ZT);
    g.addColorStop(0, "#1b2a4a"); g.addColorStop(1, "#4b5f8c");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, ZT);
    ctx.fillStyle = "#2a2433"; ctx.fillRect(0, ZT, W, H - ZT);
    ctx.fillStyle = overT ? "#e2383f" : "#f2c14e";
    ctx.fillRect(0, ZT - 3, W, 6);

    foes.forEach(drawFoe);

    ctx.lineCap = "round"; ctx.lineJoin = "round";
    fizz.forEach(function (f) {
      ctx.globalAlpha = 1 - f.t / 0.4;
      line(f.pts, 0, 0, "#8a8196", 8);
    });
    ctx.globalAlpha = 1;
    arrows.forEach(function (a) {
      ctx.globalAlpha = 1 - a.fade / 0.3;
      /* 尖っているほど長い光の尾 */
      var tc = TIER[a.tier][2], n = a.trail.length;
      for (var i = 1; i < n; i++) {
        ctx.globalAlpha = (1 - a.fade / 0.3) * (i / n) * (0.25 + 0.5 * a.sharp);
        ctx.strokeStyle = tc; ctx.lineWidth = a.bw * (0.3 + 0.6 * i / n);
        ctx.beginPath(); ctx.moveTo(a.trail[i - 1].x, a.trail[i - 1].y); ctx.lineTo(a.trail[i].x, a.trail[i].y); ctx.stroke();
      }
      ctx.globalAlpha = 1 - a.fade / 0.3;
      ctx.save(); ctx.translate(a.x, a.y);
      boom(a.pts, a.bw, 1, a.tier, a.sharp);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if (stroke) {
      var sp = smooth(stroke), jg = judge(sp);
      if (jg) boom(sp, boomWidth(sizeOf(sp)), 0.9, jg.tier, jg.sharp);
      else boom(sp, boomWidth(sizeOf(sp)), 0.6, 0, 0);
    }

    bits.forEach(function (b) {
      ctx.globalAlpha = 1 - b.t / b.life;
      ctx.fillStyle = b.c; ctx.fillRect(b.x - 4, b.y - 4, 8, 8);
    });
    ctx.globalAlpha = 1;

    if (state === S.PLAY) {
      ctx.fillStyle = "#fff";
      ctx.font = "800 56px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(score), W / 2, 76);
    }

    if (state === S.RESULT) drawResult();
  }
  function sizeOf(pts) {
    var s = pts[0], e = pts[pts.length - 1], m = 0;
    pts.forEach(function (p) { m = Math.max(m, Math.hypot(p.x - s.x, p.y - s.y), Math.hypot(p.x - e.x, p.y - e.y)); });
    return m;
  }
  function boomWidth(size) { return Math.max(14, Math.min(28, size * 0.17)); }
  /* ブーメランの絵：縁取り・木の色・つや。真ん中の曲がりが太く、両端は丸く細め */
  /* 威力の段ごとの色：0=飛ばない形(灰) 1=木 2=銀 3=金 */
  var TIER = [
    ["#2e2a35", "#77707f", "#958d9c", "#b3acb9"],
    ["#4a2a10", "#c98a45", "#e2ad6b", "#f6d6a0"],
    ["#262c35", "#9aa6b4", "#d4dde8", "#ffffff"],
    ["#5e3d00", "#f2b62e", "#ffe28a", "#fffbe0"]
  ];
  function boom(pts, w, alpha, tier, sharp) {
    if (pts.length < 2) return;
    var C = TIER[tier == null ? 1 : tier];
    sharp = sharp || 0;
    ctx.save();
    ctx.globalAlpha *= alpha;
    /* 尖っているほど強く光る */
    if (sharp > 0.05) { ctx.shadowColor = C[2]; ctx.shadowBlur = 2 + 14 * sharp; }
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    var n = pts.length - 1;
    function pass(col, add, mul, ox, oy) {
      ctx.strokeStyle = col;
      for (var i = 0; i < n; i++) {
        var t = (i + 0.5) / n;
        ctx.lineWidth = (w * (0.62 + 0.38 * Math.sin(Math.PI * t))) * mul + add;
        ctx.beginPath();
        ctx.moveTo(pts[i].x + ox, pts[i].y + oy);
        ctx.lineTo(pts[i + 1].x + ox, pts[i + 1].y + oy);
        ctx.stroke();
      }
    }
    pass(C[0], 5, 1, 0, 0);
    ctx.shadowBlur = 0;
    pass(C[1], 0, 1, 0, 0);
    pass(C[2], 0, 0.55, -w * 0.12, -w * 0.12);
    pass(C[3], 0, 0.16, -w * 0.2, -w * 0.2);
    ctx.restore();
  }
  function line(pts, ox, oy, col, w) {
    if (!pts.length) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x + ox, pts[0].y + oy);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + ox, pts[i].y + oy);
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }
  /* 敵と的は立体に見せる。的は厚みのある円盤が縦の軸で回り、コウモリは丸い胴に陰影 */
  function drawFoe(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.bat) drawBat(f); else drawTarget(f);
    ctx.restore();
  }
  function drawTarget(f) {
    var th = f.t * 1.6 + f.ph, c = Math.cos(th), sn = Math.sin(th);
    var sx = Math.max(0.22, Math.abs(c)), r = f.r, dep = r * 0.32;
    var side = sn * dep;                                  /* 回転で見える側面のずれ */
    /* 側面（木の縁） */
    ctx.fillStyle = f.bad ? "#7a1b1f" : f.iron ? "#363d47" : "#8a5a2b";
    ctx.beginPath();
    ctx.ellipse(side, 0, r * sx, r, 0, 0, 6.29); ctx.fill();
    ctx.fillRect(Math.min(0, side), -r, Math.abs(side), r * 2);
    /* 面 */
    var cs = f.bad ? ["#e2383f", "#ff7b7f"] : f.iron ? ["#6b7684", "#c4ccd6"] : ["#e2383f", "#fff"];
    var front = c > 0;
    for (var i = 0; i < 4; i++) {
      ctx.fillStyle = front ? cs[i % 2] : f.iron ? "#59626e" : "#b07a42";   /* 裏は板 */
      ctx.beginPath(); ctx.ellipse(0, 0, r * (1 - i * 0.24) * sx, r * (1 - i * 0.24), 0, 0, 6.29); ctx.fill();
      if (!front) break;
    }
    /* 光と影 */
    var g = ctx.createLinearGradient(-r * sx, -r, r * sx, r);
    g.addColorStop(0, "rgba(255,255,255,.35)"); g.addColorStop(0.45, "rgba(255,255,255,0)");
    g.addColorStop(1, "rgba(0,0,0,.35)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, r * sx, r, 0, 0, 6.29); ctx.fill();
    if (f.iron) {
      /* 縁の鋲が残りの固さ。削れるとひびが入る */
      ctx.fillStyle = "#e8edf2";
      for (var j = 0; j < f.hp; j++) {
        var an = -Math.PI / 2 + (j - (f.hp - 1) / 2) * 0.6;
        ctx.beginPath(); ctx.arc(Math.cos(an) * r * 0.86 * sx, Math.sin(an) * r * 0.86, 4.5, 0, 6.29); ctx.fill();
      }
      if (f.hp < f.hp0) {
        ctx.strokeStyle = "#1c2128"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-r * 0.5 * sx, -r * 0.3); ctx.lineTo(-r * 0.05 * sx, r * 0.05); ctx.lineTo(r * 0.2 * sx, -r * 0.2);
        if (f.hp0 - f.hp > 1) { ctx.moveTo(-r * 0.05 * sx, r * 0.05); ctx.lineTo(r * 0.1 * sx, r * 0.6); }
        ctx.stroke();
      }
      if (f.flash > 0) {
        ctx.fillStyle = "rgba(255,255,255," + (f.flash / 0.15 * 0.8) + ")";
        ctx.beginPath(); ctx.ellipse(0, 0, r * sx, r, 0, 0, 6.29); ctx.fill();
      }
    }
  }
  function drawBat(f) {
    var r = f.r, fl = Math.sin(f.t * 16);
    var body = f.bad ? "#e2383f" : "#3b2a52";
    /* 羽：はばたきで奥行きが変わる（上がると短く見える） */
    [-1, 1].forEach(function (s) {
      var span = r * (1.4 + 0.6 * Math.abs(Math.cos(f.t * 8))), tipY = -r * 0.9 * fl;
      var g = ctx.createLinearGradient(0, 0, s * span * 1.2, 0);
      g.addColorStop(0, f.bad ? "#b3242a" : "#2a1c3c"); g.addColorStop(1, f.bad ? "#ff6b70" : "#6a5290");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(s * r * 0.4, -r * 0.3);
      ctx.quadraticCurveTo(s * span * 0.6, tipY - r * 0.6, s * span * 1.2, tipY);
      ctx.quadraticCurveTo(s * span * 0.9, tipY * 0.4 + r * 0.5, s * span * 0.6, r * 0.35);
      ctx.quadraticCurveTo(s * span * 0.45, r * 0.1, s * r * 0.45, r * 0.4);
      ctx.closePath(); ctx.fill();
    });
    /* 耳 */
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -r * 0.4); ctx.lineTo(-r * 0.45, -r * 1.15); ctx.lineTo(-r * 0.1, -r * 0.65);
    ctx.moveTo(r * 0.55, -r * 0.4); ctx.lineTo(r * 0.45, -r * 1.15); ctx.lineTo(r * 0.1, -r * 0.65);
    ctx.fill();
    /* 丸い胴 */
    var g2 = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 0.95);
    g2.addColorStop(0, f.bad ? "#ff9a9d" : "#8a72b0"); g2.addColorStop(0.6, body); g2.addColorStop(1, "#0d0814");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, 6.29); ctx.fill();
    /* 目 */
    ctx.fillStyle = "#ffe066";
    ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.1, r * 0.17, 0, 6.29); ctx.arc(r * 0.3, -r * 0.1, r * 0.17, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.16, r * 0.06, 0, 6.29); ctx.arc(r * 0.25, -r * 0.16, r * 0.06, 0, 6.29); ctx.fill();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, ZT: ZT, foes: foes.length, arrows: arrows.length }; },
    read: readShape,
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var i = 0; i < 12; i++) { await r.wait(700); r.key(); }
      if (!await r.until(function () { return state === S.RESULT; }, 60)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
