<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>シュレッダー復元</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #4a3a2c; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* シュレッダー復元

   シュレッダーで縦に細く切られた書類を、手で並べ替えて元に戻す。
     ・紙片をつかんで左右へ動かすと、その位置に差し込まれる
     ・紙片を軽くタップすると上下が入れ替わる（逆さまの紙片がまざっている）
     ・全部の順番と向きがそろったら完成。かかった秒数が結果になる
   キーでは ← → で選び、スペースでつかむ・置く、↑ ↓ で上下を入れ替える。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  /* 紙の音。つかむ＝かさっ、置く＝ぱさっ、裏返す＝しゃらっ */
  function sndGrab() { noiseHit(0.09, 3200, 0.16, 0.8); }
  function sndDrop() { noiseHit(0.07, 1500, 0.2, 0.9); noiseHit(0.05, 4200, 0.06, 1); }
  function sndFlip() { noiseHit(0.05, 2600, 0.12, 1); noiseHit(0.08, 3600, 0.12, 0.8, 0.06); }
  function sndDone() {
    noiseHit(0.12, 300, 0.5, 0.7);            /* ハンコの「どん」 */
    tone(90, 0.18, 0.35, "sine", 50);
    tone(784, 0.16, 0.1, "triangle", 0, 0.25);
    tone(1175, 0.3, 0.1, "triangle", 0, 0.37);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 書類 ============
     毎回ちがう書類を描いて、縦に N 本へ切る。 */
  var N = 12;                                   /* 紙片の本数 */
  var DW = 480, DH = 680;                       /* 書類の大きさ（ゲーム座標、縮小前） */
  var RES = 2;                                  /* 書類の絵の細かさ */
  var paper = document.createElement("canvas");
  paper.width = DW * RES; paper.height = DH * RES;
  var pc = paper.getContext("2d");

  var seed = 1;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function rr(a, b) { return a + (b - a) * rnd(); }

  function drawPaper() {
    pc.setTransform(RES, 0, 0, RES, 0, 0);
    pc.fillStyle = "#f6f3ea";
    pc.fillRect(0, 0, DW, DH);
    /* うっすら紙のむら */
    for (var i = 0; i < 40; i++) {
      pc.fillStyle = "rgba(120,100,60," + rr(0.01, 0.03) + ")";
      pc.beginPath(); pc.arc(rr(0, DW), rr(0, DH), rr(20, 90), 0, Math.PI * 2); pc.fill();
    }
    var L = 34, R = DW - 34, y = 40;
    /* 表題の帯 */
    bars(L + rr(40, 120), y, rr(160, 240), 14, "#2b2f36", 1);
    y += 30;
    pc.fillStyle = "#2b2f36"; pc.fillRect(L, y, R - L, 2.5);
    y += 20;
    bars(R - rr(120, 160), y, 130, 7, "#6b6f78", 1);
    y += 24;

    var blocks = ["text", "photo", "chart", "map", "table"];
    for (var s = blocks.length - 1; s > 0; s--) { var j = Math.floor(rnd() * (s + 1)); var t = blocks[s]; blocks[s] = blocks[j]; blocks[j] = t; }
    var room = DH - y - 90;
    var hs = { text: 70, photo: 120, chart: 120, map: 130, table: 100 };
    var used = 0;
    blocks = blocks.filter(function (b) { if (used + hs[b] + 16 > room) return false; used += hs[b] + 16; return true; });
    var extra = (room - used) / blocks.length;
    blocks.forEach(function (b) {
      var h = hs[b] + extra * 0.9;
      if (b === "text") textBlock(L, y, R - L, h);
      if (b === "photo") photoBlock(L, y, R - L, h);
      if (b === "chart") chartBlock(L, y, R - L, h);
      if (b === "map") mapBlock(L, y, R - L, h);
      if (b === "table") tableBlock(L, y, R - L, h);
      y += h + 16;
    });

    /* 署名 */
    var sx = R - 150, sy = DH - 58;
    pc.strokeStyle = "#1f3a8a"; pc.lineWidth = 2.2; pc.lineCap = "round"; pc.lineJoin = "round";
    pc.beginPath(); pc.moveTo(sx, sy);
    for (var k = 1; k <= 14; k++) pc.quadraticCurveTo(sx + k * 10 - 5, sy + rr(-22, 16), sx + k * 10, sy + rr(-6, 6));
    pc.stroke();
    pc.fillStyle = "#8b8e96"; pc.fillRect(sx - 6, sy + 14, 160, 1.5);

    /* ハンコ */
    var cx = rr(DW * 0.55, DW * 0.8), cy = rr(70, 130);
    pc.save();
    pc.translate(cx, cy); pc.rotate(rr(-0.35, -0.1));
    pc.globalAlpha = 0.82;
    pc.strokeStyle = "#c8262c"; pc.fillStyle = "#c8262c";
    pc.lineWidth = 5; pc.beginPath(); pc.arc(0, 0, 50, 0, Math.PI * 2); pc.stroke();
    pc.lineWidth = 2; pc.beginPath(); pc.arc(0, 0, 42, 0, Math.PI * 2); pc.stroke();
    pc.font = "900 34px sans-serif"; pc.textAlign = "center"; pc.textBaseline = "middle";
    pc.fillText("極秘", 0, 2);
    pc.restore();

    /* 赤ペンの丸と矢印 */
    pc.save();
    pc.strokeStyle = "rgba(210,40,40,.8)"; pc.lineWidth = 3; pc.lineCap = "round";
    var ax = rr(60, DW - 200), ay = rr(DH * 0.35, DH * 0.75);
    pc.beginPath(); pc.ellipse(ax + 60, ay, 75, 26, rr(-0.2, 0.2), 0.2, Math.PI * 2.1); pc.stroke();
    var bx = ax + 150 + rr(20, 80), by = ay + rr(-110, -60);
    pc.beginPath(); pc.moveTo(ax + 130, ay - 12); pc.quadraticCurveTo(bx - 10, ay - 10, bx, by); pc.stroke();
    pc.beginPath(); pc.moveTo(bx - 10, by + 12); pc.lineTo(bx, by); pc.lineTo(bx + 11, by + 10); pc.stroke();
    pc.restore();

    /* 墨消し */
    for (var m = 0; m < 3; m++) {
      pc.fillStyle = "#111";
      pc.fillRect(rr(L, R - 160), rr(140, DH - 120), rr(60, 160), 12);
    }
  }
  function bars(x, y, w, h, col, a) {
    pc.fillStyle = col; pc.globalAlpha = a;
    var x0 = x;
    while (x0 < x + w - 6) {
      var len = Math.min(rr(18, 70), x + w - x0);
      pc.fillRect(x0, y, len, h);
      x0 += len + rr(4, 9);
    }
    pc.globalAlpha = 1;
  }
  function textBlock(x, y, w, h) {
    for (var ly = y; ly < y + h - 8; ly += 17) {
      var end = ly + 17 >= y + h - 8 ? rr(0.3, 0.7) : rr(0.86, 1);
      bars(x + (ly === y ? 16 : 0), ly, (w - (ly === y ? 16 : 0)) * end, 6.5, "#565a63", 0.85);
    }
  }
  function photoBlock(x, y, w, h) {
    var pw = h * 0.85, px = rnd() < 0.5 ? x : x + w - pw;
    pc.fillStyle = "#b9c0c8"; pc.fillRect(px, y, pw, h);
    var g = pc.createLinearGradient(px, y, px, y + h);
    g.addColorStop(0, "#d5dbe1"); g.addColorStop(1, "#8f99a4");
    pc.fillStyle = g; pc.fillRect(px + 4, y + 4, pw - 8, h - 8);
    pc.fillStyle = "#3d4550";
    pc.beginPath(); pc.arc(px + pw / 2, y + h * 0.42, h * 0.17, 0, Math.PI * 2); pc.fill();
    pc.beginPath(); pc.ellipse(px + pw / 2, y + h * 0.98, pw * 0.36, h * 0.3, 0, Math.PI, Math.PI * 2); pc.fill();
    pc.fillStyle = "#111"; pc.fillRect(px + pw * 0.28, y + h * 0.37, pw * 0.44, h * 0.07);
    var tx = px === x ? x + pw + 14 : x, tw = w - pw - 14;
    for (var ly = y + 4; ly < y + h - 6; ly += 17) bars(tx, ly, tw * rr(0.7, 1), 6.5, "#565a63", 0.85);
  }
  function chartBlock(x, y, w, h) {
    pc.strokeStyle = "#8b8e96"; pc.lineWidth = 1;
    for (var i = 0; i <= 4; i++) { pc.beginPath(); pc.moveTo(x, y + h * i / 4); pc.lineTo(x + w, y + h * i / 4); pc.stroke(); }
    pc.strokeStyle = "#2b2f36"; pc.lineWidth = 2;
    pc.beginPath(); pc.moveTo(x, y); pc.lineTo(x, y + h); pc.lineTo(x + w, y + h); pc.stroke();
    var n = 9, v = rr(0.3, 0.7);
    pc.strokeStyle = "#1f5fbf"; pc.lineWidth = 3.5; pc.lineJoin = "round";
    pc.beginPath();
    for (var k = 0; k <= n; k++) {
      v = Math.max(0.08, Math.min(0.92, v + rr(-0.3, 0.3)));
      var px = x + w * k / n, py = y + h * (1 - v);
      if (k) pc.lineTo(px, py); else pc.moveTo(px, py);
    }
    pc.stroke();
    var bw = w / 14;
    pc.fillStyle = "rgba(230,140,40,.55)";
    for (var b = 0; b < 7; b++) { var bh = h * rr(0.15, 0.6); pc.fillRect(x + bw * (b * 2 + 0.5), y + h - bh, bw, bh); }
  }
  function mapBlock(x, y, w, h) {
    pc.fillStyle = "#e4ecd9"; pc.fillRect(x, y, w, h);
    pc.strokeStyle = "#7fb0d8"; pc.lineWidth = 9; pc.lineCap = "round";
    pc.beginPath(); pc.moveTo(x, y + h * rr(0.2, 0.8));
    pc.bezierCurveTo(x + w * 0.3, y + h * rr(-0.2, 1.2), x + w * 0.6, y + h * rr(-0.2, 1.2), x + w, y + h * rr(0.2, 0.8));
    pc.stroke();
    pc.strokeStyle = "#fff"; pc.lineWidth = 5;
    for (var r = 0; r < 3; r++) {
      pc.beginPath(); pc.moveTo(x + rr(0, w), y); pc.lineTo(x + rr(0, w), y + h); pc.stroke();
    }
    pc.beginPath(); pc.moveTo(x, y + rr(0, h)); pc.lineTo(x + w, y + rr(0, h)); pc.stroke();
    pc.strokeStyle = "#8b8e96"; pc.lineWidth = 1.5; pc.strokeRect(x, y, w, h);
    var mx = x + rr(w * 0.2, w * 0.8), my = y + rr(h * 0.3, h * 0.7);
    pc.strokeStyle = "#d22"; pc.lineWidth = 4;
    pc.beginPath(); pc.moveTo(mx - 12, my - 12); pc.lineTo(mx + 12, my + 12); pc.moveTo(mx + 12, my - 12); pc.lineTo(mx - 12, my + 12); pc.stroke();
  }
  function tableBlock(x, y, w, h) {
    var rows = 5, cols = 4;
    pc.fillStyle = "#dfe3e8"; pc.fillRect(x, y, w, h / rows);
    pc.strokeStyle = "#6b6f78"; pc.lineWidth = 1.2;
    for (var i = 0; i <= rows; i++) { pc.beginPath(); pc.moveTo(x, y + h * i / rows); pc.lineTo(x + w, y + h * i / rows); pc.stroke(); }
    var cx = [0, rr(0.25, 0.35), rr(0.5, 0.6), rr(0.72, 0.82), 1];
    for (var c = 0; c <= cols; c++) { pc.beginPath(); pc.moveTo(x + w * cx[c], y); pc.lineTo(x + w * cx[c], y + h); pc.stroke(); }
    for (var r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
      var cw = w * (cx[c + 1] - cx[c]);
      pc.fillStyle = r ? "#565a63" : "#2b2f36";
      pc.fillRect(x + w * cx[c] + 8, y + h * (r + 0.5) / rows - 3, cw * rr(0.3, 0.75), 6);
    }
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", DONE: "done", RESULT: "result" };
  var state, T, doneT, held, keyMode = false;
  var pieces = [];            /* 左から順に並んだ紙片。{ i: 元の位置, flip: 逆さまか, x: 表示中の位置, rot: 表示中の回転, dy: ずれ } */
  var grab = null;            /* つかんでいる紙片 { p, sx, sy, off, x, y, moved } */
  var cur = 0;                /* キー操作の選択位置 */
  var keyHold = false;        /* キーでつかんでいる */

  var sc, sw, dh, docX, docY;
  function place() {
    var top = 96, bottom = 110;
    sc = Math.min(1, (H - top - bottom) / DH, (W - 40) / DW);
    sw = DW * sc / N; dh = DH * sc;
    docX = (W - DW * sc) / 2;
    docY = top + Math.max(0, (H - top - bottom - dh) / 2);
  }

  function shuffle() {
    var ord, tries = 0;
    do {
      ord = [];
      for (var i = 0; i < N; i++) ord.push(i);
      for (i = N - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = ord[i]; ord[i] = ord[j]; ord[j] = t; }
      var near = 0;
      for (i = 1; i < N; i++) if (ord[i] === ord[i - 1] + 1 || ord[i] === ord[i - 1] - 1) near++;
    } while (near > 0 && ++tries < 200);
    var flips = {};
    while (Object.keys(flips).length < Math.round(N / 3)) flips[Math.floor(Math.random() * N)] = true;
    pieces = ord.map(function (i, k) {
      return { i: i, flip: !!flips[i], x: k, rot: flips[i] ? Math.PI : 0, dy: (Math.random() * 2 - 1) * 10, tilt: (Math.random() * 2 - 1) * 0.012 };
    });
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; doneT = 0;
    held = false; grab = null; keyHold = false; cur = 0;
    seed = 1 + Math.floor(Math.random() * 2147483640);
    drawPaper();
    shuffle();
  }

  function solved() {
    for (var k = 0; k < N; k++) if (pieces[k].i !== k || pieces[k].flip) return false;
    return true;
  }
  function checkDone() {
    if (state === S.PLAY && solved()) { state = S.DONE; doneT = 0; grab = null; keyHold = false; sndDone(); }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    var k = Math.min(1, dt * 16);
    pieces.forEach(function (p, idx) {
      if (!grab || grab.p !== p) p.x += (idx - p.x) * k;
      var want = p.flip ? Math.PI : 0;
      p.rot += (want - p.rot) * Math.min(1, dt * 18);
      if (state === S.DONE || state === S.RESULT) { p.dy *= 1 - k; p.tilt *= 1 - k; }
    });
    if (state === S.PLAY) T += dt;
    if (state === S.DONE) {
      doneT += dt;
      if (doneT > 1.4) { state = S.RESULT; }
    }
  }

  /* ============ 入力 ============ */
  function slotAt(x) { return Math.max(0, Math.min(N - 1, Math.floor((x - docX) / sw))); }
  function onPaper(x, y) { return x >= docX - 10 && x <= docX + DW * sc + 10 && y >= docY - 30 && y <= docY + dh + 30; }

  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    if (x == null) {                           /* スペース：つかむ・置く */
      keyHold = !keyHold;
      if (keyHold) sndGrab(); else { sndDrop(); checkDone(); }
      return;
    }
    keyHold = false;
    if (!onPaper(x, y)) return;
    held = true;
    var p = pieces[slotAt(x)];
    grab = { p: p, sx: x, sy: y, off: x - (docX + p.x * sw), x: x, y: y, moved: false };
  }
  function move(x, y) {
    if (state !== S.PLAY || !held || !grab) return;
    grab.x = x; grab.y = y;
    if (!grab.moved && Math.abs(x - grab.sx) > 8) { grab.moved = true; sndGrab(); }
    if (!grab.moved) return;
    var p = grab.p;
    p.x = (x - grab.off - docX) / sw;
    var to = Math.max(0, Math.min(N - 1, Math.round(p.x)));
    var from = pieces.indexOf(p);
    if (to !== from) { pieces.splice(from, 1); pieces.splice(to, 0, p); }
  }
  function up() {
    if (!held) return;
    held = false;
    if (!grab || state !== S.PLAY) { grab = null; return; }
    var g = grab; grab = null;
    if (g.moved) sndDrop();
    else { g.p.flip = !g.p.flip; sndFlip(); }
    checkDone();
  }
  function keyMove(d) {
    if (state !== S.PLAY) return;
    var to = Math.max(0, Math.min(N - 1, cur + d));
    if (keyHold) {
      var p = pieces[cur];
      pieces.splice(cur, 1); pieces.splice(to, 0, p);
      if (to !== cur) noiseHit(0.05, 2400, 0.08, 1);
    }
    cur = to;
  }
  function keyFlip() {
    if (state !== S.PLAY) return;
    pieces[cur].flip = !pieces[cur].flip; sndFlip();
    if (!keyHold) checkDone();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { if (grab) grab.moved = true; up(); });
  window.addEventListener("blur", function () { if (grab) grab.moved = true; up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var flip = e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "w" || e.key === "W" || e.key === "s" || e.key === "S";
    if (!esc && !go && !left && !right && !flip) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) { keyMove(left ? -1 : 1); return; }
    if (flip) { if (!e.repeat) keyFlip(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function secText() { return (Math.floor(T * 10) / 10).toFixed(1); }
  function doShare() {
    /* ▼SHARE */
    window.zResultActions.x({ text: secText() + "秒でした #シュレッダー復元" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawDesk() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#5a4636"); g.addColorStop(1, "#3e2f24");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 2;
    for (var y = 30; y < H; y += 46) {
      ctx.beginPath(); ctx.moveTo(0, y);
      ctx.bezierCurveTo(W * 0.3, y + 8, W * 0.6, y - 8, W, y + 3); ctx.stroke();
    }
  }

  function drawPiece(p, x, y, lift) {
    var src = p.i * (DW / N) * RES, sws = (DW / N) * RES;
    ctx.save();
    ctx.translate(x + sw / 2, y + dh / 2);
    ctx.rotate(p.rot + p.tilt);
    if (lift) { ctx.scale(1.05, 1.02); }
    ctx.shadowColor = "rgba(0,0,0," + (lift ? 0.5 : 0.28) + ")";
    ctx.shadowBlur = lift ? 16 : 5;
    ctx.shadowOffsetY = lift ? 10 : 2;
    ctx.fillStyle = "#f6f3ea";
    ctx.fillRect(-sw / 2, -dh / 2, sw, dh);
    ctx.shadowColor = "transparent";
    ctx.drawImage(paper, src, 0, sws, DH * RES, -sw / 2, -dh / 2, sw, dh);
    /* 切り口 */
    ctx.strokeStyle = "rgba(0,0,0,.14)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-sw / 2 + 0.5, -dh / 2); ctx.lineTo(-sw / 2 + 0.5, dh / 2);
    ctx.moveTo(sw / 2 - 0.5, -dh / 2); ctx.lineTo(sw / 2 - 0.5, dh / 2); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    drawDesk();

    var gap = state === S.PLAY || state === S.INTRO ? 2 : Math.max(0, 2 - doneT * 6);
    var inner = sw - gap;
    pieces.forEach(function (p) {
      if (grab && grab.moved && grab.p === p) return;
      var lift = keyHold && pieces[cur] === p;
      drawPiece(p, docX + p.x * sw + gap / 2 - (sw - inner) / 2, docY + p.dy - (lift ? 14 : 0), lift);
    });
    if (grab && grab.moved) {
      drawPiece(grab.p, grab.x - grab.off, docY + grab.p.dy - 14, true);
    }
    if (keyMode && state === S.PLAY) {
      ctx.strokeStyle = "#f7cc71"; ctx.lineWidth = 3;
      ctx.strokeRect(docX + cur * sw - 2, docY - (keyHold ? 18 : 4), sw + 4, dh + 8);
    }

    /* 経過秒 */
    if (state === S.PLAY || state === S.DONE) {
      ctx.fillStyle = "#f2ede4";
      ctx.font = "800 44px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(secText(), W / 2, 66);
    }

    if (state === S.DONE) {
      var a = Math.max(0, 0.5 - doneT * 1.2);
      if (a > 0) { ctx.fillStyle = "rgba(255,255,255," + a + ")"; ctx.fillRect(0, 0, W, H); }
    }
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    ctx.font = "800 108px sans-serif";
    var num = secText();
    var nw = ctx.measureText(num).width;
    ctx.font = "800 44px sans-serif";
    var uw = ctx.measureText("秒").width;
    var left = W / 2 - (nw + 8 + uw) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif";
    ctx.fillText(num, left, H * 0.45);
    ctx.font = "800 44px sans-serif";
    ctx.fillText("秒", left + nw + 8, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return {
        state: state, T: T, W: W, H: H, N: N,
        order: pieces.map(function (p) { return p.i; }),
        flips: pieces.map(function (p) { return p.flip; }),
        doc: { x: docX, y: docY, sw: sw, h: dh }, cur: cur, keyHold: keyHold
      };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     キー操作で一本ずつ正しい位置へ運び、向きを直す。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      await r.wait(800);
      function key(k) { window.dispatchEvent(new KeyboardEvent("keydown", { key: k })); window.dispatchEvent(new KeyboardEvent("keyup", { key: k })); }
      for (var want = 0; want < N && state === S.PLAY; want++) {
        var at = pieces.findIndex(function (p) { return p.i === want; });
        while (cur < at) { key("ArrowRight"); await r.wait(60); }
        while (cur > at) { key("ArrowLeft"); await r.wait(60); }
        if (at !== want) {
          key(" "); await r.wait(150);
          while (cur > want) { key("ArrowLeft"); await r.wait(90); }
          key(" "); await r.wait(150);
        }
        if (pieces[want].flip) { key("ArrowUp"); await r.wait(200); }
      }
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("完成しない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
