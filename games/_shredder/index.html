<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>シュレッダー復元</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #4a3a2c; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* シュレッダー復元

   シュレッダーで縦に細く切られた書類を、手で並べ替えて元に戻す。
     ・紙片をつかんで左右へ動かすと、その位置に差し込まれる
     ・紙片を軽くタップすると上下が入れ替わる（逆さまの紙片がまざっている）
     ・全部の順番と向きがそろったら完成。かかった秒数が結果になる
   キーでは ← → で選び、スペースでつかむ・置く、↑ ↓ で上下を入れ替える。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* 背景の机（3D）。使えない環境では2Dの机を描く */
  var view3d = null;
  try {
    view3d = (window.WebGLRenderingContext && typeof ZShredScene !== "undefined" && typeof THREE !== "undefined")
      ? new ZShredScene() : null;
  } catch (e) { view3d = null; }

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    if (view3d) view3d.resize(canvas.width, canvas.height, W, H, { x: docX, y: docY, w: DW * sc, h: dh });
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  /* 紙の音。つかむ＝かさっ、置く＝ぱさっ、裏返す＝しゃらっ */
  function sndGrab() { noiseHit(0.09, 3200, 0.16, 0.8); }
  function sndDrop() { noiseHit(0.07, 1500, 0.2, 0.9); noiseHit(0.05, 4200, 0.06, 1); }
  function sndFlip() { noiseHit(0.05, 2600, 0.12, 1); noiseHit(0.08, 3600, 0.12, 0.8, 0.06); }
  /* 計画阻止：どしんと印を押し、警報が下がって止まり、明るい和音 */
  function sndStop() {
    if (!AC) return;
    tone(880, 1.2, 0.08, "sawtooth", 180, 0);
    noiseHit(0.3, 160, 0.7, 0.6, 0.5);
    tone(70, 0.5, 0.5, "sine", 35, 0.5);
  }
  /* カメラが夜空へ向くときの風切り音と、兵器の爆発 */
  function sndRise() {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    var g = AC.createGain(), n = AC.currentTime;
    f.frequency.setValueAtTime(300, n); f.frequency.exponentialRampToValueAtTime(2400, n + 1.6);
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.18, n + 0.8); g.gain.exponentialRampToValueAtTime(0.0001, n + 2.2);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + 2.3);
    tone(55, 3, 0.12, "sawtooth", 40, 1.0);          /* 落ちてくる兵器のうなり */
  }
  function sndBoom() {
    noiseHit(2.4, 120, 0.9, 0.5);
    noiseHit(1.2, 600, 0.35, 0.7);
    tone(60, 1.6, 0.6, "sine", 22);
    noiseHit(0.8, 2500, 0.08, 1, 0.3);
    [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 1.8, 0.06, "triangle", 0, 1.2 + i * 0.09); });
  }
  function sndDone() {
    noiseHit(0.12, 300, 0.5, 0.7);            /* ハンコの「どん」 */
    tone(90, 0.18, 0.35, "sine", 50);
    tone(784, 0.16, 0.1, "triangle", 0, 0.25);
    tone(1175, 0.3, 0.1, "triangle", 0, 0.37);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 書類 ============
     毎回ちがう書類を描いて、縦に N 本へ切る。 */
  /* ステージごとの紙片の本数と、逆さまの本数。書類は順に DOCS の1枚目・2枚目・3枚目 */
  var STAGES = [{ n: 6, flips: 0 }, { n: 10, flips: 3 }, { n: 15, flips: 5 }];
  var N = STAGES[0].n;                          /* 今のステージの紙片の本数 */
  var DW = 480, DH = 680;                       /* 書類の大きさ（ゲーム座標、縮小前） */
  var RES = 2;                                  /* 書類の絵の細かさ */
  var paper = document.createElement("canvas");
  paper.width = DW * RES; paper.height = DH * RES;
  var pc = paper.getContext("2d");

  var seed = 1;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function rr(a, b) { return a + (b - a) * rnd(); }

  /* 書類の中身（英語）。3枚を通して、架空の会社がとんでもない兵器「Project Z」を
     作ろうとしている、という筋。会社・人物・数字はすべて架空。
     1枚目：技術者の極秘施設への異動 → 2枚目：建造の日程 → 3枚目：兵器の設計図 */
  var SERIF = '"Times New Roman","Times","Liberation Serif","Georgia",serif';
  var SANS = '"Helvetica Neue","Helvetica","Arial","Liberation Sans",sans-serif';
  var INK = "#23252b", RED = "#c8262c";
  var DOCS = [
    {
      ref: "Ref. EST/HR/0917", date: "September 17, 2026",
      to: "All Department Heads", from: "Robert Hayes, Director of Human Resources",
      subject: "Staff Transfer to the Project Z Facility",
      body: "The following engineers will be transferred to the Project Z facility, effective October 1, 2026. The location of the facility is classified. Staff must not disclose the nature of their new assignment to anyone, including their families.",
      table: [["Name", "Specialty", "Assignment"], ["Dr. Kevin Walsh", "Structures", "Chief Designer"], ["Laura Bennett", "Hydraulics", "Leg Assembly"], ["Daniel Ortiz", "Orbital Mech.", "Launch Systems"]],
      photo: "Dr. Kevin Walsh",
      notes: ["Report to Gate 7 of the facility with this memo.", "Personal phones will be collected on arrival.", "Shred this memo immediately after reading."],
      hide: [0, 2]
    },
    {
      ref: "Ref. EST/CP/2026-044", date: "September 3, 2026",
      to: "Board of Directors", from: "Margaret Cole, Head of Corporate Planning",
      subject: "Project Z: Construction Schedule",
      body: "Construction of Project Z is proceeding as outlined below. Once complete, the device will be able to reach any city on Earth within 40 minutes of launch. Handle this information with the utmost care.",
      chart: true,
      notes: ["Final assembly: April 2027", "Total budget: $8.4 billion", "First test drop: Pacific Ocean, June 2027", "The existence of this project must never be disclosed."],
      hide: [1, 2]
    },
    { blueprint: true }
  ];

  function drawPaper() {
    pc.setTransform(RES, 0, 0, RES, 0, 0);
    var d = DOCS[stage % DOCS.length];
    if (d.blueprint) { drawBlueprint(); return; }
    pc.fillStyle = "#f7f6f1";
    pc.fillRect(0, 0, DW, DH);
    /* コピー機のくすみ */
    for (var i = 0; i < 60; i++) {
      pc.fillStyle = "rgba(90,90,80," + rr(0.006, 0.02) + ")";
      pc.beginPath(); pc.arc(rr(0, DW), rr(0, DH), rr(20, 110), 0, Math.PI * 2); pc.fill();
    }
    var L = 38, R = DW - 38, y = 34;
    pc.textBaseline = "alphabetic";

    /* 左上の区分、右上の文書番号と日付 */
    pc.strokeStyle = RED; pc.fillStyle = RED; pc.lineWidth = 1.6;
    pc.strokeRect(L, y - 2, 118, 22);
    pc.font = "700 13px " + SANS; pc.textAlign = "center";
    pc.fillText("CONFIDENTIAL", L + 59, y + 14);
    pc.fillStyle = INK; pc.font = "9.5px " + SERIF; pc.textAlign = "right";
    pc.fillText(d.ref, R, y + 6);
    pc.fillText(d.date, R, y + 20);
    y += 52;

    /* 社名と題 */
    pc.textAlign = "left";
    pc.font = "700 11px " + SANS;
    pc.fillText("ELEPHANT STAR TRADING CO., LTD.", L, y);
    pc.font = "700 25px " + SERIF;
    pc.fillText("MEMORANDUM", L, y + 30);
    pc.fillRect(L, y + 40, R - L, 2);
    y += 62;

    /* 宛先など */
    var head = [["TO:", d.to], ["FROM:", d.from], ["DATE:", d.date], ["SUBJECT:", d.subject]];
    head.forEach(function (h) {
      pc.font = "700 10px " + SANS; pc.fillText(h[0], L, y);
      pc.font = (h[0] === "SUBJECT:" ? "700 " : "") + "11px " + SERIF; pc.fillText(h[1], L + 64, y);
      y += 17;
    });
    pc.fillRect(L, y - 6, R - L, 0.8);
    y += 14;

    pc.font = "11px " + SERIF;
    y = para(d.body, L, y, R - L, 16);
    y += 14;

    if (d.table) y = table(d.table, L, y, d.photo ? R - L - 108 : R - L);
    if (d.photo) { photo(R - 96, y - 4 * 25 - 10, 96, 124, d.photo); y += 20; }
    if (d.chart) y = chart(L, y, R - L, 110);
    y += 30;

    pc.textAlign = "left"; pc.font = "11px " + SERIF;
    var redact = [];
    d.notes.forEach(function (t, k) {
      pc.fillText((k + 1) + ".", L + 4, y);
      var y0 = y;
      y = para(t, L + 20, y, R - L - 20, 16);
      if (d.hide.indexOf(k) >= 0) redact.push([L + 20 + rr(60, 160), y0 - 10, rr(70, 150), 13]);
      y += 6;
    });

    /* 承認欄。署名は手書きの線 */
    var roles = ["President", "Director", "Manager"];
    var sw3 = (R - L - 180) / 3, sy = DH - 92;
    pc.font = "700 9px " + SANS; pc.textAlign = "left";
    pc.fillText("APPROVED BY", L + 180, sy - 40);
    roles.forEach(function (role, k) {
      var x = L + 180 + k * sw3;
      pc.fillStyle = INK; pc.fillRect(x + 6, sy, sw3 - 12, 0.8);
      pc.font = "9px " + SANS; pc.textAlign = "center";
      pc.fillText(role, x + sw3 / 2, sy + 12);
      if (k === 0 && rnd() < 0.5) return;               /* まだ回っていない */
      signature(x + 14, sy - 8, sw3 - 28);
    });

    /* 下の注意書きと頁 */
    pc.fillStyle = INK; pc.font = "8.5px " + SANS; pc.textAlign = "left";
    pc.fillText("Do not copy or distribute. Unauthorized disclosure is strictly prohibited.", L, DH - 30);
    pc.textAlign = "right";
    pc.fillText("Page 1 of 1", R, DH - 30);
    pc.fillRect(L, DH - 44, R - L, 0.8);

    /* 墨消し */
    pc.fillStyle = "#101010";
    redact.forEach(function (r) { pc.fillRect(r[0], r[1], Math.min(r[2], R - r[0]), r[3]); });

    /* 大きな「TOP SECRET」の印 */
    pc.save();
    pc.translate(rr(L + 70, L + 100), rr(DH - 110, DH - 85)); pc.rotate(rr(-0.3, -0.12));
    pc.globalAlpha = 0.78;
    pc.strokeStyle = RED; pc.fillStyle = RED;
    pc.lineWidth = 4.5; pc.strokeRect(-86, -24, 172, 48);
    pc.lineWidth = 1.5; pc.strokeRect(-80, -18, 160, 36);
    pc.font = "900 23px " + SANS; pc.textAlign = "center"; pc.textBaseline = "middle";
    pc.fillText("TOP SECRET", 0, 2);
    pc.restore();

    /* 赤ペンの丸 */
    pc.save();
    pc.strokeStyle = "rgba(200,30,30,.75)"; pc.lineWidth = 2.2; pc.lineCap = "round";
    var ax = rr(L + 60, R - 120), ay = rr(DH * 0.45, DH * 0.62);
    pc.beginPath(); pc.ellipse(ax, ay, rr(55, 80), 15, rr(-0.1, 0.1), 0.3, Math.PI * 2.15); pc.stroke();
    pc.restore();
    pc.textBaseline = "alphabetic";
  }

  /* 3枚目：兵器「Project Z」の設計図。軌道上から落とす巨大な機械の象の足 */
  function drawBlueprint() {
    var BG = "#1d4f8c", LINE = "rgba(235,244,255,.92)", FAINT = "rgba(220,235,255,.16)";
    pc.fillStyle = BG; pc.fillRect(0, 0, DW, DH);
    var g = pc.createRadialGradient(DW / 2, DH / 2, 60, DW / 2, DH / 2, DH * 0.7);
    g.addColorStop(0, "rgba(255,255,255,.05)"); g.addColorStop(1, "rgba(0,0,0,.18)");
    pc.fillStyle = g; pc.fillRect(0, 0, DW, DH);
    /* 方眼 */
    pc.strokeStyle = FAINT; pc.lineWidth = 0.6;
    for (var x = 10; x < DW; x += 20) { pc.beginPath(); pc.moveTo(x, 0); pc.lineTo(x, DH); pc.stroke(); }
    for (var y = 10; y < DH; y += 20) { pc.beginPath(); pc.moveTo(0, y); pc.lineTo(DW, y); pc.stroke(); }
    pc.strokeStyle = LINE; pc.lineWidth = 1.5;
    pc.strokeRect(14, 14, DW - 28, DH - 28);
    pc.lineWidth = 0.6; pc.strokeRect(19, 19, DW - 38, DH - 38);

    pc.fillStyle = LINE; pc.textBaseline = "alphabetic"; pc.textAlign = "left";
    pc.font = "700 11px " + SANS;
    pc.fillText("PROJECT Z", 34, 46);
    pc.font = "900 24px " + SANS;
    pc.fillText("ORBITAL STOMPER", 34, 72);
    pc.font = "9px " + SANS;
    pc.fillText("GENERAL ARRANGEMENT — FRONT ELEVATION", 34, 88);

    var cx = 212, top = 190, bot = 520, w = 230;          /* 足の本体 */
    pc.lineJoin = "round"; pc.lineCap = "round";

    /* 上の機械：軌道推進器・噴射口・アンテナ */
    pc.lineWidth = 1.6; pc.strokeStyle = LINE;
    pc.strokeRect(cx - 95, top - 50, 190, 50);
    for (var k = 0; k < 4; k++) {
      var nx = cx - 75 + k * 50;
      pc.beginPath(); pc.moveTo(nx - 12, top - 50); pc.lineTo(nx - 18, top - 78); pc.lineTo(nx + 18, top - 78); pc.lineTo(nx + 12, top - 50); pc.closePath(); pc.stroke();
    }
    pc.beginPath(); pc.moveTo(cx + 70, top - 78); pc.lineTo(cx + 70, top - 108); pc.stroke();
    pc.beginPath(); pc.arc(cx + 70, top - 112, 5, 0, Math.PI * 2); pc.stroke();
    pc.lineWidth = 0.7;
    for (var r = 0; r < 5; r++) { pc.beginPath(); pc.moveTo(cx - 95, top - 42 + r * 9); pc.lineTo(cx + 95, top - 42 + r * 9); pc.stroke(); }

    /* 足の輪郭。下へ少し広がる柱 */
    pc.lineWidth = 2.2;
    pc.beginPath();
    pc.moveTo(cx - w / 2 + 14, top);
    pc.bezierCurveTo(cx - w / 2 + 4, top + 120, cx - w / 2 - 8, bot - 90, cx - w / 2 - 14, bot - 20);
    pc.quadraticCurveTo(cx - w / 2 - 12, bot + 8, cx - w / 2 + 20, bot + 10);
    pc.lineTo(cx + w / 2 - 20, bot + 10);
    pc.quadraticCurveTo(cx + w / 2 + 12, bot + 8, cx + w / 2 + 14, bot - 20);
    pc.bezierCurveTo(cx + w / 2 + 8, bot - 90, cx + w / 2 - 4, top + 120, cx + w / 2 - 14, top);
    pc.closePath(); pc.stroke();

    /* しわ（装甲板の継ぎ目） */
    pc.lineWidth = 0.9;
    for (var s = 0; s < 7; s++) {
      var sy = top + 40 + s * 40, sw2 = w / 2 - 6 + s * 2;
      pc.beginPath(); pc.moveTo(cx - sw2, sy);
      pc.quadraticCurveTo(cx, sy + 14 + (s % 2) * 6, cx + sw2, sy); pc.stroke();
    }
    /* 油圧の柱4本 */
    pc.lineWidth = 1.2;
    for (k = 0; k < 4; k++) {
      var px = cx - 75 + k * 50;
      pc.strokeRect(px - 7, top + 20, 14, 150);
      pc.strokeRect(px - 4, top + 170, 8, 90);
      pc.beginPath(); pc.arc(px, top + 20, 7, Math.PI, 0); pc.stroke();
    }
    /* 爪 */
    pc.lineWidth = 1.8;
    for (k = 0; k < 5; k++) {
      var tx = cx - 96 + k * 48;
      pc.beginPath(); pc.moveTo(tx - 18, bot + 10);
      pc.bezierCurveTo(tx - 18, bot - 26, tx + 18, bot - 26, tx + 18, bot + 10); pc.stroke();
      pc.lineWidth = 0.8;
      pc.beginPath(); pc.moveTo(tx - 10, bot + 2); pc.quadraticCurveTo(tx, bot - 12, tx + 10, bot + 2); pc.stroke();
      pc.lineWidth = 1.8;
    }
    /* 足の裏の中心線 */
    pc.setLineDash([10, 4, 2, 4]); pc.lineWidth = 0.7;
    pc.beginPath(); pc.moveTo(cx, top - 120); pc.lineTo(cx, bot + 40); pc.stroke();
    pc.setLineDash([]);

    /* 寸法線 */
    function dim(x1, y1, x2, y2, label, vertical) {
      pc.lineWidth = 0.8; pc.strokeStyle = LINE; pc.fillStyle = LINE;
      pc.beginPath(); pc.moveTo(x1, y1); pc.lineTo(x2, y2); pc.stroke();
      [[x1, y1, 1], [x2, y2, -1]].forEach(function (e) {
        pc.beginPath();
        if (vertical) { pc.moveTo(e[0] - 4, e[1] + 7 * e[2]); pc.lineTo(e[0], e[1]); pc.lineTo(e[0] + 4, e[1] + 7 * e[2]); }
        else { pc.moveTo(e[0] + 7 * e[2], e[1] - 4); pc.lineTo(e[0], e[1]); pc.lineTo(e[0] + 7 * e[2], e[1] + 4); }
        pc.stroke();
      });
      pc.font = "700 10px " + SANS; pc.textAlign = "center";
      if (vertical) {
        pc.save(); pc.translate(x1 - 8, (y1 + y2) / 2); pc.rotate(-Math.PI / 2); pc.fillText(label, 0, 0); pc.restore();
      } else pc.fillText(label, (x1 + x2) / 2, y1 - 6);
    }
    dim(cx - w / 2 - 14, bot + 34, cx + w / 2 + 14, bot + 34, "480 m", false);
    dim(58, top - 78, 58, bot + 10, "1,200 m", true);

    /* 引き出し線と注記 */
    function note(x1, y1, x2, y2, t) {
      pc.lineWidth = 0.8; pc.strokeStyle = LINE; pc.fillStyle = LINE;
      pc.beginPath(); pc.arc(x1, y1, 2.5, 0, Math.PI * 2); pc.fill();
      pc.beginPath(); pc.moveTo(x1, y1); pc.lineTo(x2, y2); pc.lineTo(x2 + 8, y2); pc.stroke();
      pc.font = "700 9px " + SANS; pc.textAlign = "left";

    if (keyMode && state === S.PLAY) {
      ctx.strokeStyle = "#f7cc71"; ctx.lineWidth = 3;
      ctx.strokeRect(docX + cur * sw - 2, docY - (keyHold ? 18 : 4), sw + 4, dh + 8);
    }

    if (stopping() && doneT > STOP_AT) drawStopStamp(doneT - STOP_AT);
    ctx.restore();

    /* ステージの進み具合 */
    if ((state === S.PLAY || state === S.DONE) && !away) {
      ctx.save();
      ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 8;
      ctx.font = "800 30px sans-serif"; ctx.textAlign = "center";
      ctx.fillText((stage + 1) + "/" + STAGES.length, W / 2, Math.min(48, docY - 16));
      ctx.restore();
    }

    if (state === S.DONE) {
      var a = Math.max(0, 0.5 - doneT * 1.2);
      if (a > 0) { ctx.fillStyle = "rgba(255,255,255," + a + ")"; ctx.fillRect(0, 0, W, H); }
    }
    if (stopping() && doneT > STOP_AT) {
      var fl = Math.max(0, 0.55 - (doneT - STOP_AT) * 2.2);
      if (doneT > BOOM_AT) fl = Math.max(fl, 0.8 - (doneT - BOOM_AT) * 1.6);
      if (fl > 0) { ctx.fillStyle = "rgba(255,240,230," + fl + ")"; ctx.fillRect(0, 0, W, H); }
    }
    ctx.restore();
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    ctx.font = "800 108px sans-serif";
    var num = secText();
    var nw = ctx.measureText(num).width;
    ctx.font = "800 60px sans-serif";
    var uw = ctx.measureText("s").width;
    var left = W / 2 - (nw + 4 + uw) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif";
    ctx.fillText(num, left, H * 0.45);
    ctx.font = "800 60px sans-serif";
    ctx.fillText("s", left + nw + 4, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return {
        state: state, stage: stage, T: T, endLen: STOP_END, W: W, H: H, N: N,
        order: pieces.map(function (p) { return p.i; }),
        flips: pieces.map(function (p) { return p.flip; }),
        doc: { x: docX, y: docY, sw: sw, h: dh }, cur: cur, keyHold: keyHold, has3d: !!view3d
      };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     キー操作で一本ずつ正しい位置へ運び、向きを直す。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      await r.wait(800);
      function key(k) { window.dispatchEvent(new KeyboardEvent("keydown", { key: k })); window.dispatchEvent(new KeyboardEvent("keyup", { key: k })); }
      for (var st = 0; st < STAGES.length; st++) {
        if (!await r.until(function () { return state === S.PLAY && stage === st; }, 10)) throw Error("次のステージにならない");
        await r.wait(400);
        for (var want = 0; want < N && state === S.PLAY; want++) {
          var at = pieces.findIndex(function (p) { return p.i === want; });
          while (cur < at && state === S.PLAY) { key("ArrowRight"); await r.wait(60); }
          while (cur > at && state === S.PLAY) { key("ArrowLeft"); await r.wait(60); }
          if (at !== want) {
            key(" "); await r.wait(150);
            while (cur > want) { key("ArrowLeft"); await r.wait(90); }
            key(" "); await r.wait(150);
          }
          if (pieces[want].flip) { key("ArrowUp"); await r.wait(200); }
        }
      }
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("完成しない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
