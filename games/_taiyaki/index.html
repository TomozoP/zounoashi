<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>好きなたい焼き</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #2a211c; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #photo-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #photo-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <button id="photo-button" type="button" aria-label="画像を選ぶ" hidden></button>
  <input id="photo-input" type="file" accept="image/*" hidden>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 好きなたい焼き

   好きな画像から型を作り、その形でたい焼きを焼く。
     型   … 画像の背景（透明か、縁と同じ色）を除いた形。画像の明るさを型の凹凸にする
     生地 … 押している所へ流し込む。型の中は深さ1、外の鉄板は薄く広がる（はみ出しは羽根になる）
     あんこ … タップで置く
     焼く … 片面ずつ。ひっくり返すまでの時間で焼き色が決まる
   結果は焼き上がったたい焼きを大きく見せる（作品を見せる形）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var photoButton = document.getElementById("photo-button");
  var photoInput = document.getElementById("photo-input");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, type) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = type || "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 型 ============
     R×R の細かさで形・凹凸・縁からの距離を持ち、生地は N×N の升目で流す（R = 2N）。 */
  var R = 240, N = 120;
  var mask = new Uint8Array(R * R);       /* 1 = 型の中 */
  var detail = new Float32Array(R * R);   /* 画像の明るさ -1〜1（型の凹凸） */
  var dist = new Float32Array(R * R);     /* 縁からの距離（ふくらみ） */
  var gmask = new Uint8Array(N * N), gdist = new Float32Array(N * N), maskCells = 1;
  var moldLayer = null, lidLayer = null, picLayer = null;

  function makeCanvas(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

  /* 最初の型。ふつうのたい焼きの形（鯛）を絵で描く。背景は透明。 */
  function fishPicture() {
    var c = makeCanvas(600, 400), g = c.getContext("2d");
    g.translate(300, 200);
    g.fillStyle = "#d98b57"; g.strokeStyle = "#7a3f1f"; g.lineWidth = 6; g.lineJoin = "round";
    /* 尾 */
    g.beginPath(); g.moveTo(170, 0); g.lineTo(270, -95); g.quadraticCurveTo(245, 0, 270, 95); g.closePath(); g.fill(); g.stroke();
    /* 背びれ・腹びれ */
    g.beginPath(); g.moveTo(-90, -80); g.quadraticCurveTo(10, -175, 150, -50); g.lineTo(60, -85); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-30, 85); g.quadraticCurveTo(30, 140, 90, 70); g.closePath(); g.fill(); g.stroke();
    /* 体 */
    g.beginPath(); g.moveTo(-250, 10);
    g.bezierCurveTo(-200, -120, 60, -130, 185, -5);
    g.bezierCurveTo(60, 120, -200, 120, -250, 10); g.closePath(); g.fill(); g.stroke();
    /* えら・目・うろこ */
    g.beginPath(); g.arc(-150, 5, 75, -0.9, 0.9); g.stroke();
    g.fillStyle = "#3a1d0c"; g.beginPath(); g.arc(-190, -20, 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#f5c79a"; g.beginPath(); g.arc(-194, -24, 4, 0, Math.PI * 2); g.fill();
    g.lineWidth = 4; g.strokeStyle = "#8c4a24";
    for (var y = -60; y <= 60; y += 24) for (var x = -60; x <= 140; x += 28) {
      var xx = x + ((y / 24) & 1) * 14;
      if (Math.pow(xx / 210, 2) + Math.pow(y / 95, 2) > 0.75) continue;
      g.beginPath(); g.arc(xx, y, 13, Math.PI * 0.5, Math.PI * 1.5); g.stroke();
    }
    g.beginPath(); g.moveTo(-250, 10); g.lineTo(-215, 18); g.stroke();
    return c;
  }

  function buildMold(src) {
    var c = makeCanvas(R, R), g = c.getContext("2d", { willReadFrequently: true });
    var sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
    var sc = Math.min(R * 0.86 / sw, R * 0.86 / sh);
    var dw = Math.max(1, Math.round(sw * sc)), dh = Math.max(1, Math.round(sh * sc));
    var x0 = Math.round((R - dw) / 2), y0 = Math.round((R - dh) / 2);
    g.clearRect(0, 0, R, R);
    g.drawImage(src, x0, y0, dw, dh);
    picLayer = c;
    var d = g.getImageData(0, 0, R, R).data, i, x, y;
    var inRect = function (x, y) { return x >= x0 && x < x0 + dw && y >= y0 && y < y0 + dh; };

    /* 透明な所があれば、それを外とする */
    var clear = 0;
    for (y = y0; y < y0 + dh; y++) for (x = x0; x < x0 + dw; x++) if (d[(y * R + x) * 4 + 3] < 128) clear++;
    if (clear > dw * dh * 0.02) {
      for (i = 0; i < R * R; i++) mask[i] = d[i * 4 + 3] >= 128 ? 1 : 0;
    } else {
      /* 縁の色を背景として、縁からつながる似た色を外にする */
      var rs = [], gs = [], bs = [];
      for (x = x0; x < x0 + dw; x++) [y0, y0 + dh - 1].forEach(function (yy) { var k = (yy * R + x) * 4; rs.push(d[k]); gs.push(d[k + 1]); bs.push(d[k + 2]); });
      for (y = y0; y < y0 + dh; y++) [x0, x0 + dw - 1].forEach(function (xx) { var k = (y * R + xx) * 4; rs.push(d[k]); gs.push(d[k + 1]); bs.push(d[k + 2]); });
      var med = function (a) { a.sort(function (p, q) { return p - q; }); return a[a.length >> 1]; };
      var br = med(rs), bg = med(gs), bb = med(bs);
      var bgm = new Uint8Array(R * R), st = [];
      for (i = 0; i < R * R; i++) { x = i % R; y = (i / R) | 0; if (!inRect(x, y)) bgm[i] = 1; }
      var near = function (k) { var p = k * 4, dr = d[p] - br, dg = d[p + 1] - bg, db = d[p + 2] - bb; return dr * dr + dg * dg + db * db < 52 * 52; };
      for (i = 0; i < R * R; i++) if (bgm[i]) st.push(i);
      while (st.length) {
        var k = st.pop(); x = k % R; y = (k / R) | 0;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (o) {
          var nx = x + o[0], ny = y + o[1];
          if (nx < 0 || ny < 0 || nx >= R || ny >= R) return;
          var n = ny * R + nx;
          if (!bgm[n] && near(n)) { bgm[n] = 1; st.push(n); }
        });
      }
      for (i = 0; i < R * R; i++) mask[i] = bgm[i] ? 0 : 1;
    }
    keepLargest();
    var area = 0;
    for (i = 0; i < R * R; i++) area += mask[i];
    /* 形が取れなかったら、画像の枠いっぱいの楕円にする */
    if (area < dw * dh * 0.04 || area > dw * dh * 0.97) {
      for (y = 0; y < R; y++) for (x = 0; x < R; x++) {
        var ex = (x - R / 2) / (dw / 2), ey = (y - R / 2) / (dh / 2);
        mask[y * R + x] = ex * ex + ey * ey < 1 ? 1 : 0;
      }
    }

    /* 凹凸：明るさを型の中で平均0にそろえ、軽くぼかす */
    var lum = new Float32Array(R * R), sum = 0, sq = 0, cnt = 0;
    for (i = 0; i < R * R; i++) {
      lum[i] = (d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11) / 255;
      if (mask[i]) { sum += lum[i]; sq += lum[i] * lum[i]; cnt++; }
    }
    var mean = sum / cnt, sd = Math.sqrt(Math.max(1e-4, sq / cnt - mean * mean));
    for (y = 0; y < R; y++) for (x = 0; x < R; x++) {
      i = y * R + x;
      if (!mask[i]) { detail[i] = 0; continue; }
      var a = 0, m = 0;
      for (var oy = -1; oy <= 1; oy++) for (var ox = -1; ox <= 1; ox++) {
        var nx2 = x + ox, ny2 = y + oy;
        if (nx2 < 0 || ny2 < 0 || nx2 >= R || ny2 >= R || !mask[ny2 * R + nx2]) continue;
        a += lum[ny2 * R + nx2]; m++;
      }
      detail[i] = Math.max(-1, Math.min(1, (a / m - mean) / (2.2 * sd)));
    }

    /* 縁からの距離（2回なめる簡易版） */
    var BIG = 1e4;
    for (i = 0; i < R * R; i++) dist[i] = mask[i] ? BIG : 0;
    for (y = 0; y < R; y++) for (x = 0; x < R; x++) {
      i = y * R + x; if (!dist[i]) continue;
      var v = dist[i];
      if (x > 0) v = Math.min(v, dist[i - 1] + 1); else v = 1;
      if (y > 0) v = Math.min(v, dist[i - R] + 1); else v = 1;
      if (x > 0 && y > 0) v = Math.min(v, dist[i - R - 1] + 1.414);
      if (x < R - 1 && y > 0) v = Math.min(v, dist[i - R + 1] + 1.414);
      dist[i] = v;
    }
    for (y = R - 1; y >= 0; y--) for (x = R - 1; x >= 0; x--) {
      i = y * R + x; if (!dist[i]) continue;
      var u = dist[i];
      if (x < R - 1) u = Math.min(u, dist[i + 1] + 1); else u = 1;
      if (y < R - 1) u = Math.min(u, dist[i + R] + 1); else u = 1;
      if (x < R - 1 && y < R - 1) u = Math.min(u, dist[i + R + 1] + 1.414);
      if (x > 0 && y < R - 1) u = Math.min(u, dist[i + R - 1] + 1.414);
      dist[i] = u;
    }

    /* 生地の升目 */
    maskCells = 0;
    for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
      var j = y * 2 * R + x * 2;
      var s4 = mask[j] + mask[j + 1] + mask[j + R] + mask[j + R + 1];
      gmask[y * N + x] = s4 >= 2 ? 1 : 0;
      gdist[y * N + x] = (dist[j] + dist[j + 1] + dist[j + R] + dist[j + R + 1]) / 8;
      maskCells += gmask[y * N + x];
    }
    maskCells = Math.max(1, maskCells);
    moldLayer = renderIron(-1);
    lidLayer = renderIron(1);
  }

  function keepLargest() {
    var lab = new Int32Array(R * R), best = 0, bestN = 0, id = 0, i;
    for (i = 0; i < R * R; i++) {
      if (!mask[i] || lab[i]) continue;
      id++; var st = [i], n = 0; lab[i] = id;
      while (st.length) {
        var k = st.pop(), x = k % R, y = (k / R) | 0; n++;
        if (x > 0 && mask[k - 1] && !lab[k - 1]) { lab[k - 1] = id; st.push(k - 1); }
        if (x < R - 1 && mask[k + 1] && !lab[k + 1]) { lab[k + 1] = id; st.push(k + 1); }
        if (y > 0 && mask[k - R] && !lab[k - R]) { lab[k - R] = id; st.push(k - R); }
        if (y < R - 1 && mask[k + R] && !lab[k + R]) { lab[k + R] = id; st.push(k + R); }
      }
      if (n > bestN) { bestN = n; best = id; }
    }
    for (i = 0; i < R * R; i++) mask[i] = lab[i] === best ? 1 : 0;
    /* 中の穴はふさぐ */
    var out = new Uint8Array(R * R), st2 = [];
    for (i = 0; i < R; i++) [i, (R - 1) * R + i, i * R, i * R + R - 1].forEach(function (k) { if (!mask[k] && !out[k]) { out[k] = 1; st2.push(k); } });
    while (st2.length) {
      var k = st2.pop(), x = k % R, y = (k / R) | 0;
      [x > 0 ? k - 1 : -1, x < R - 1 ? k + 1 : -1, y > 0 ? k - R : -1, y < R - 1 ? k + R : -1].forEach(function (n) {
        if (n >= 0 && !mask[n] && !out[n]) { out[n] = 1; st2.push(n); }
      });
    }
    for (i = 0; i < R * R; i++) if (!out[i]) mask[i] = 1;
  }

  /* 型の中の高さ（ふくらみ＋画像の凹凸） */
  function heightAt(i) {
    if (!mask[i]) return 0;
    var t = Math.min(1, dist[i] / 14);
    return Math.sqrt(1 - (1 - t) * (1 - t)) + detail[i] * 0.35 * t;
  }

  /* 鉄の型。sign=-1 は凹んだ型、1 はふたの裏から見た盛り上がり */
  function renderIron(sign) {
    var c = makeCanvas(R, R), g = c.getContext("2d"), im = g.getImageData(0, 0, R, R), p = im.data;
    for (var y = 0; y < R; y++) for (var x = 0; x < R; x++) {
      var i = y * R + x, k = i * 4;
      var hx = heightAt(Math.min(R * R - 1, i + 1)) - heightAt(Math.max(0, i - 1));
      var hy = heightAt(Math.min(R * R - 1, i + R)) - heightAt(Math.max(0, i - R));
      var sh = (-hx - hy) * 1.6 * sign;
      var base = mask[i] ? (sign < 0 ? 40 : 66) : 58;
      var nse = ((x * 73856093 ^ y * 19349663) & 7) - 3;
      var v = Math.max(0, Math.min(255, base + sh * 70 + nse));
      p[k] = v; p[k + 1] = v * 0.97; p[k + 2] = v * 0.95; p[k + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    return c;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", POUR: "pour", ANKO: "anko", BAKE: "bake", OPEN: "open", RESULT: "result" };
  var state, T, held, px, py;
  var L = new Float32Array(N * N), Ltmp = new Float32Array(N * N);
  var anko = [];                          /* {x, y, r} 升目の座標 */
  var side, bake = [0, 0], flipT, openT, steam = [], pourSnd = 0, sizzle = 0;
  var result = null, taiyakiLayer = null;
  var BOX, BX, BY;

  function place() {
    BOX = Math.min(500, H * 0.56);
    BX = (W - BOX) / 2;
    BY = Math.max(40, H * 0.43 - BOX / 2);
  }
  function toGrid(x, y) { return { x: (x - BX) / BOX * N, y: (y - BY) / BOX * N }; }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.POUR;
    T = 0; held = false;
    L.fill(0); anko = []; bake = [0, 0]; side = 0; flipT = 0; openT = 0; steam = [];
    result = null; taiyakiLayer = null;
  }
  function toIntro() {
    newRound();
    state = S.INTRO;
    document.getElementById("start").hidden = false;
  }

  /* ============ 生地の流れ ============
     型の中は底が -1、外の鉄板は底が 0。表面の高さの差で隣へ流れる。
     ねばりがあるので、差が小さいと流れない（外では薄く止まって羽根になる）。 */
  var POUR_RATE = 0;
  function pourAt(gx, gy, amt) {
    var r = 2.6;
    var x0 = Math.max(0, Math.floor(gx - r)), x1 = Math.min(N - 1, Math.ceil(gx + r));
    var y0 = Math.max(0, Math.floor(gy - r)), y1 = Math.min(N - 1, Math.ceil(gy + r));
    var ws = [], tot = 0, x, y;
    for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) {
      var dd = (x - gx) * (x - gx) + (y - gy) * (y - gy);
      if (dd > r * r) continue;
      var w = 1 - dd / (r * r); ws.push([y * N + x, w]); tot += w;
    }
    ws.forEach(function (e) { L[e[0]] += amt * e[1] / tot; });
  }
  function flow() {
    var VISC = 0.06, K = 0.22, i, x, y;
    Ltmp.set(L);
    for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
      i = y * N + x;
      var si = L[i] - gmask[i];
      if (x < N - 1) pair(i, i + 1, si);
      if (y < N - 1) pair(i, i + N, si);
    }
    L.set(Ltmp);
    function pair(a, b, sa) {
      var sb = L[b] - gmask[b], dff = sa - sb;
      var visc = (gmask[a] && gmask[b]) ? VISC * 0.5 : VISC;
      if (Math.abs(dff) <= visc) return;
      var f = K * (dff - (dff > 0 ? visc : -visc));
      if (f > 0) f = Math.min(f, L[a] * 0.25); else f = -Math.min(-f, L[b] * 0.25);
      Ltmp[a] -= f; Ltmp[b] += f;
    }
    /* 鉄板の端から落ちた分は消える */
    for (i = 0; i < N; i++) { L[i] = 0; L[(N - 1) * N + i] = 0; L[i * N] = 0; L[i * N + N - 1] = 0; }
  }
  function fillRatio() {
    var s = 0;
    for (var i = 0; i < N * N; i++) if (gmask[i]) s += Math.min(1, L[i]);
    return s / maskCells;
  }
  function overflowAmount() {
    var s = 0;
    for (var i = 0; i < N * N; i++) if (!gmask[i]) s += L[i];
    return s / maskCells;
  }

  /* ============ 進行 ============ */
  var BAKE_GOOD = 5;                       /* 片面ちょうどいい秒数 */
  function update(dt) {
    T += dt;
    var i;
    for (i = steam.length - 1; i >= 0; i--) {
      var s = steam[i]; s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.98;
      if (s.t > s.life) steam.splice(i, 1);
    }
    if (state === S.POUR) {
      if (held) {
        var gp = toGrid(px, py - 70);
        pourAt(gp.x, gp.y, maskCells / 7 * dt);
        pourSnd -= dt;
        if (pourSnd <= 0) { pourSnd = 0.12; noiseHit(0.22, 700 + Math.random() * 300, 0.05, 0.8, "lowpass"); }
      }
      for (i = 0; i < 3; i++) flow();
    } else if (state === S.BAKE) {
      if (flipT > 0) flipT = Math.max(0, flipT - dt);
      else bake[side] += dt / BAKE_GOOD;
      var b = bake[side];
      sizzle -= dt;
      if (sizzle <= 0) { sizzle = 0.18; noiseHit(0.3, 3500 + Math.random() * 2000, 0.03, 0.6, "highpass"); }
      if (Math.random() < dt * 14) {
        var smoke = b > 1.35;
        steam.push({ x: BX + BOX * (0.1 + Math.random() * 0.8), y: BY + BOX * (0.3 + Math.random() * 0.4), vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 50, t: 0, life: 1.6, c: smoke ? Math.max(30, 220 - (b - 1.35) * 300) : 245, a: smoke ? 0.55 : 0.32 });
      }
    } else if (state === S.OPEN) {
      openT += dt;
      if (openT > 1.2) finish();
    }
  }

  function finish() {
    var fill = fillRatio(), over = overflowAmount();
    /* あんこ：ふちから少し内側の所にどれだけ届いているか（しっぽまで） */
    var inner = 0, got = 0, poke = 0, i;
    for (i = 0; i < N * N; i++) {
      var x = i % N, y = (i / N) | 0, inA = false;
      for (var k = 0; k < anko.length; k++) { var a = anko[k], dx = x - a.x, dy = y - a.y; if (dx * dx + dy * dy < a.r * a.r) { inA = true; break; } }
      if (gmask[i] && gdist[i] >= 3) { inner++; if (inA) got++; }
      else if (inA) poke++;
    }
    var ankoR = inner ? got / inner : 0;
    var bs = bake.map(function (b) { return Math.exp(-Math.pow((b - 1) / 0.32, 2)); });
    var sc = fill * 45 + Math.min(1, ankoR / 0.6) * 20 + (bs[0] + bs[1]) / 2 * 35;
    sc -= Math.min(15, over * 25) + Math.min(10, poke / maskCells * 60);
    result = { score: Math.max(0, Math.round(sc)), fill: fill, anko: ankoR, bake: bake.slice(), over: over };
    taiyakiLayer = renderTaiyaki();
    state = S.RESULT;
    tone(523, 0.18, 0.12, "triangle"); tone(659, 0.18, 0.12, "triangle", null, 0.14); tone(784, 0.4, 0.13, "triangle", null, 0.28);
  }

  /* 焼き色。0=生、1=きつね色、2=まっ黒 */
  function brownColor(b) {
    var stops = [[0, 246, 226, 178], [0.6, 233, 180, 104], [1, 196, 120, 52], [1.45, 120, 62, 24], [2, 34, 20, 12]];
    b = Math.max(0, Math.min(2, b));
    for (var i = 1; i < stops.length; i++) if (b <= stops[i][0]) {
      var a = stops[i - 1], c = stops[i], t = (b - a[0]) / (c[0] - a[0]);
      return [a[1] + (c[1] - a[1]) * t, a[2] + (c[2] - a[2]) * t, a[3] + (c[3] - a[3]) * t];
    }
    return stops[stops.length - 1].slice(1);
  }
  function gridL(x, y) {
    /* R の座標から升目の生地の量（なめらかに） */
    var gx = Math.max(0, Math.min(N - 1.001, x / 2 - 0.25)), gy = Math.max(0, Math.min(N - 1.001, y / 2 - 0.25));
    var ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy, i = iy * N + ix;
    var a = L[i], b = L[Math.min(N * N - 1, i + 1)], c = L[Math.min(N * N - 1, i + N)], d = L[Math.min(N * N - 1, i + N + 1)];
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }
  function ankoAt(x, y) {
    var gx = x / 2, gy = y / 2, v = 0;
    for (var k = 0; k < anko.length; k++) {
      var a = anko[k], dx = gx - a.x, dy = gy - a.y, q = 1 - (dx * dx + dy * dy) / (a.r * a.r);
      if (q > v) v = q;
    }
    return v;
  }
  function renderTaiyaki() {
    var c = makeCanvas(R, R), g = c.getContext("2d"), im = g.getImageData(0, 0, R, R), p = im.data;
    var hgt = new Float32Array(R * R), x, y, i;
    for (i = 0; i < R * R; i++) {
      x = i % R; y = (i / R) | 0;
      hgt[i] = mask[i] ? heightAt(i) * Math.min(1, gridL(x, y)) + Math.sqrt(ankoAt(x, y)) * 0.45 : 0;
    }
    var b0 = bake[0];
    for (y = 0; y < R; y++) for (x = 0; x < R; x++) {
      i = y * R + x;
      var k = i * 4, lv = gridL(x, y), al, col, sh = 1;
      if (mask[i]) {
        al = Math.max(0, Math.min(1, (lv - 0.3) / 0.3));
        var hx = hgt[Math.min(R * R - 1, i + 1)] - hgt[Math.max(0, i - 1)];
        var hy = hgt[Math.min(R * R - 1, i + R)] - hgt[Math.max(0, i - R)];
        sh = 1 + (-hx - hy) * 1.3;
        /* 盛り上がった所ほどよく焼ける */
        col = brownColor(b0 * (0.75 + 0.35 * hgt[i]) + (1 - Math.min(1, lv)) * 0.25);
        /* ふちから飛び出したあんこは焦げて見える */
        var an = ankoAt(x, y);
        if (an > 0 && dist[i] < 4) { col = [60, 26, 22]; al = Math.max(al, 0.9); }
      } else {
        /* 外にはみ出した薄い生地＝羽根 */
        var an2 = ankoAt(x, y);
        al = Math.max(0, Math.min(0.9, (lv - 0.015) / 0.06));
        col = brownColor(b0 * 1.25 + 0.2);
        if (an2 > 0) { col = [50, 22, 18]; al = 1; }
      }
      p[k] = Math.min(255, col[0] * sh); p[k + 1] = Math.min(255, col[1] * sh); p[k + 2] = Math.min(255, col[2] * sh); p[k + 3] = al * 255;
    }
    g.putImageData(im, 0, 0);
    return c;
  }

  /* ============ 入力 ============ */
  function stageButton() {
    var ids = state === S.BAKE ? (side === 0 ? ["ひっくり返す"] : ["次"]) : ["次"];
    var w = 170, h = 54, y = H - h - Math.max(24, H * 0.05);
    return [{ id: ids[0], label: ids[0], x: W / 2 - w / 2, y: y, w: w, h: h }];
  }
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") toIntro();
      return;
    }
    if (state === S.POUR || state === S.ANKO || (state === S.BAKE && flipT <= 0)) {
      var b = x == null ? stageButton()[0].id : window.zResultActions.hit(stageButton(), x, y);
      if (b) { nextStage(); return; }
    }
    if (x == null) return;
    if (state === S.POUR) { held = true; px = x; py = y; }
    else if (state === S.ANKO) {
      var gp = toGrid(x, y);
      if (gp.x < 0 || gp.y < 0 || gp.x > N || gp.y > N) return;
      anko.push({ x: gp.x, y: gp.y, r: 6.5 });
      tone(180, 0.12, 0.12, "sine", 90);
      noiseHit(0.1, 400, 0.08, 1);
    }
  }
  function nextStage() {
    held = false;
    if (state === S.POUR) { state = S.ANKO; tone(520, 0.08, 0.1, "square"); }
    else if (state === S.ANKO) {
      state = S.BAKE; side = 0; flipT = 0.5;
      tone(140, 0.25, 0.2, "square", 70); noiseHit(0.3, 300, 0.25, 0.7);
    } else if (state === S.BAKE) {
      if (side === 0) { side = 1; flipT = 0.5; tone(160, 0.25, 0.2, "square", 80); noiseHit(0.25, 300, 0.2, 0.7); }
      else { state = S.OPEN; openT = 0; tone(220, 0.15, 0.15, "square", 110); }
    }
  }
  function move(x, y) {
    if (state !== S.POUR || !held) return;
    px = x; py = y;
  }
  function up() { held = false; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 手元の画像。選んだら、その形の型を作る */
  ["pointerdown", "pointerup"].forEach(function (n) { photoButton.addEventListener(n, function (e) { e.stopPropagation(); }); });
  photoButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); photoInput.click(); });
  photoInput.addEventListener("change", function () {
    var f = photoInput.files && photoInput.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () { buildMold(im); URL.revokeObjectURL(url); tone(300, 0.2, 0.15, "square", 150); };
    im.onerror = function () { URL.revokeObjectURL(url); };
    im.src = url;
    photoInput.value = "";
  });

  /* 本番以外だけ、数字キーで場面を飛ばせる */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function fillAll() { for (var i = 0; i < N * N; i++) L[i] = gmask[i] ? 1 : 0; }
  function debugKey(n) {
    if (n === 1) { if (state === S.INTRO) newRound(); fillAll(); state = S.ANKO; }
    if (n === 2) {
      if (state === S.INTRO) newRound();
      fillAll(); anko = [];
      for (var i = 0; i < N * N; i += 1) { var x = i % N, y = (i / N) | 0; if (x % 6 === 0 && y % 6 === 0 && gmask[i] && gdist[i] > 6) anko.push({ x: x, y: y, r: 5 }); }
      state = S.BAKE; side = 0; flipT = 0;
    }
    if (n === 3 || n === 4) {
      if (state === S.INTRO) newRound();
      if (fillRatio() < 0.5) fillAll();
      bake = n === 3 ? [1, 1] : [1.9, 1.7];
      finish();
    }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) toIntro(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function shareText() {
    var r = result, sc = r.score;
    var burnt = r.bake[0] > 1.6 || r.bake[1] > 1.6;
    var ja, en;
    if (sc >= 90) { ja = "しっぽまであんこの詰まったたい焼きを焼いた"; en = "I baked a taiyaki packed with anko to the tip of its tail"; }
    else if (burnt) { ja = "真っ黒なたい焼きを焼いた"; en = "I baked a pitch-black taiyaki"; }
    else if (r.fill < 0.6) { ja = "穴だらけのたい焼きを焼いた"; en = "I baked a taiyaki full of holes"; }
    else if (r.over > 0.4) { ja = "羽根だらけのたい焼きを焼いた"; en = "I baked a taiyaki with huge crispy wings"; }
    else { ja = "好きな形のたい焼きを焼いた"; en = "I baked a taiyaki in any shape I like"; }
    return zT(ja + "（" + sc + "点）", en + " (" + sc + " pts)") + zT(" #好きなたい焼き", " #AnyShapeTaiyaki");
  }
  function doShare() {
    if (!result) return;
    window.zResultActions.x({ text: shareText() });
  }

  /* ============ 描画 ============ */
  function plate(x, y, w, h, r, top, bot) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    var gr = ctx.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0, top); gr.addColorStop(1, bot);
    ctx.fillStyle = gr; ctx.fill();
  }
  function drawBackground() {
    var gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, "#3a2b22"); gr.addColorStop(1, "#1c1410");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  function drawHandle(flip) {
    /* 型の柄（右へ伸びる） */
    ctx.fillStyle = "#4a2f1d";
    ctx.fillRect(BX + BOX - 4, BY + BOX / 2 - 10, 40, 20);
  }
  var batterCanvas = makeCanvas(N, N), batterCtx = batterCanvas.getContext("2d"), batterImg = batterCtx.getImageData(0, 0, N, N);
  function drawBatter() {
    var p = batterImg.data;
    for (var i = 0; i < N * N; i++) {
      var v = L[i], k = i * 4, a = gmask[i] ? Math.min(1, v * 1.1) : Math.min(0.92, v / 0.08);
      p[k] = 250; p[k + 1] = 230 - (gmask[i] ? 0 : 10); p[k + 2] = 182; p[k + 3] = a * 255;
    }
    batterCtx.putImageData(batterImg, 0, 0);
    ctx.save(); ctx.imageSmoothingEnabled = true;
    ctx.drawImage(batterCanvas, BX, BY, BOX, BOX);
    ctx.restore();
  }
  function drawAnko() {
    anko.forEach(function (a) {
      var x = BX + a.x / N * BOX, y = BY + a.y / N * BOX, r = a.r / N * BOX;
      ctx.fillStyle = "#3d1d1f"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.35, 0, Math.PI * 2); ctx.fill();
    });
  }
  function drawOpenMold(sx) {
    plate(BX - 14, BY - 14, BOX + 28, BOX + 28, 26, "#4c4b4f", "#2c2b2f");
    ctx.save(); ctx.imageSmoothingEnabled = true;
    if (moldLayer) ctx.drawImage(moldLayer, BX, BY, BOX, BOX);
    ctx.restore();
  }
  function drawPitcher() {
    if (!held) return;
    var x = px, y = py - 70;
    ctx.strokeStyle = "rgba(250,230,182,.95)"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, y - 46); ctx.lineTo(x + Math.sin(T * 30) * 1.2, y); ctx.stroke();
    ctx.save(); ctx.translate(x + 18, y - 70); ctx.rotate(-0.7);
    plate(-22, -26, 44, 52, 10, "#d9dde3", "#9aa1aa");
    ctx.fillStyle = "#9aa1aa"; ctx.beginPath(); ctx.moveTo(-22, -24); ctx.lineTo(-34, -32); ctx.lineTo(-20, -14); ctx.fill();
    ctx.restore();
  }
  function drawSteam() {
    steam.forEach(function (s) {
      var k = s.t / s.life, r = 10 + k * 34;
      ctx.fillStyle = "rgba(" + (s.c | 0) + "," + (s.c | 0) + "," + (s.c | 0) + "," + (s.a * (1 - k)) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
    });
  }
  function drawFire() {
    for (var i = 0; i < 9; i++) {
      var x = BX + BOX * (0.1 + i * 0.1), h = 22 + Math.sin(T * 13 + i * 2.1) * 8;
      var y = BY + BOX + 30;
      ctx.fillStyle = "rgba(90,140,255,.75)";
      ctx.beginPath(); ctx.moveTo(x - 9, y + 10); ctx.quadraticCurveTo(x, y - h, x + 9, y + 10); ctx.fill();
    }
  }

  function draw() {
    var res = state === S.RESULT;
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, res);
    var intro = state === S.INTRO;
    window.zResultActions.place(photoButton, photoBox(), W, H, intro);
    ctx.clearRect(0, 0, W, H);
    drawBackground();

    if (intro) {
      drawOpenMold();
      window.zResultActions.drawButtons(ctx, [Object.assign({ label: "画像を選ぶ" }, photoBox())]);
    } else if (state === S.POUR || state === S.ANKO) {
      drawOpenMold();
      drawBatter();
      drawAnko();
      if (state === S.POUR) drawPitcher();
      window.zResultActions.drawButtons(ctx, stageButton());
    } else if (state === S.BAKE || state === S.OPEN) {
      drawFire();
      var k = state === S.BAKE && flipT > 0 ? Math.cos((1 - flipT / 0.5) * Math.PI) : 1;
      var lift = state === S.OPEN ? Math.min(1, openT / 0.6) : 0;
      if (state === S.OPEN) {
        drawOpenMold(); drawBatter();
      }
      ctx.save();
      ctx.translate(W / 2, BY + BOX / 2 - lift * BOX * 1.2);
      ctx.scale(1, Math.max(0.04, Math.abs(k)));
      plate(-BOX / 2 - 14, -BOX / 2 - 14, BOX + 28, BOX + 28, 26, "#57565b", "#2f2e33");
      ctx.globalAlpha = 0.9;
      if (lidLayer) ctx.drawImage(lidLayer, -BOX / 2, -BOX / 2, BOX, BOX);
      ctx.restore();
      drawSteam();
      if (state === S.BAKE && flipT <= 0) window.zResultActions.drawButtons(ctx, stageButton());
    } else if (res) {
      drawResult();
    }
  }

  function photoBox() {
    var w = 170, h = 54;
    return { x: W / 2 - w / 2, y: H - 68 - Math.max(24, H * 0.03) - h - 22, w: w, h: h };
  }

  /* 結果画面。作品を見せる形（暗くせず、上に点数、真ん中にたい焼き、下にボタン） */
  function showcase() { return window.zResultActions.showcase(W, H, { sizes: [104] }); }
  function resultButtons() { return showcase().buttons; }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    var Lo = showcase(), sub = Lo.subject;
    var size = Math.min(sub.w * 0.98, sub.h * 1.1);
    if (taiyakiLayer) {
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(taiyakiLayer, sub.cx - size / 2, sub.cy - size / 2, size, size);
      ctx.restore();
    }
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 8;
    ctx.font = "800 " + Lo.lines[0].size + "px sans-serif";
    ctx.fillText(String(result.score), W / 2, Lo.lines[0].y);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: result ? result.score : 0, result: result, fill: fillRatio(), over: overflowAmount(), maskCells: maskCells, W: W, H: H, box: [BX, BY, BOX], buttons: state === S.RESULT ? resultButtons() : null, stage: state === S.RESULT || state === S.INTRO ? null : stageButton() }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    mold: function (src) { buildMold(src); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  buildMold(fishPicture());
  toIntro();
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
