<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>倒してもいいですかゲーム</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>
<script src="../voice.js"></script>   <!-- かなの読みを音に分ける -->   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 倒してもいいですかゲーム

   新幹線の座席。STARTで「倒してもいいですか？」と聞き、後ろの人が「どうぞ」。
   押している間だけ背もたれがなめらかに倒れる。離したところで決まる。
   後ろの人はひざの上でパソコンを開いていて、背もたれの裏が画面の上の角に触れたら「ちょっと！」。
   画面の位置は毎回少しちがう。すき間が近づくと拡大鏡が出る。結果は残りのすき間（mm）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, CREAK = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    /* 走行音（低いゴー） */
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 220;
    var g = AC.createGain(); g.gain.value = 0.18;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  }
  function noiseHit(dur, freq, vol, q, at) {
    if (!AC) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = at || AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  /* 背もたれが少しずつ倒れる「ギッ」 */
  function creak() {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(), n = AC.currentTime;
    o.type = "sawtooth"; o.frequency.setValueAtTime(70 + Math.random() * 30, n);
    f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 3;
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.12, n + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.07);
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + 0.1);
  }

  /* FM合成の声（リズム説教と同じ作り）。words は zVoice.kana の形 */
  var VOW = { a: [800, 1200, 2600], i: [300, 2300, 3000], u: [350, 1300, 2400], e: [500, 1900, 2600], o: [500, 850, 2500], n: [250, 1000, 2200] };
  function fmSpeak(at, words, opt) {
    if (!AC) return 0;
    var base = opt.pitch, out = AC.createGain();
    out.gain.value = opt.volume || 0.5;
    out.connect(AC.destination);
    var mod = AC.createOscillator(); mod.type = "sine";
    var env = AC.createGain(); env.gain.value = 0.0001; env.connect(out);
    var ops = [0.55, 0.3, 0.1].map(function (amp) {
      var c = AC.createOscillator(), depth = AC.createGain(), g = AC.createGain();
      c.type = "sine"; g.gain.value = amp;
      mod.connect(depth); depth.connect(c.frequency); c.connect(g); g.connect(env);
      return { c: c, depth: depth };
    });
    function hiss(t0, dur, freq, q, vol) {
      var n = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
      n.buffer = NOISE; b.type = "bandpass"; b.frequency.value = freq; b.Q.value = q;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      n.connect(b); b.connect(g); g.connect(out);
      n.start(t0, Math.random() * 0.5); n.stop(t0 + dur + 0.02);
    }
    var t = at, voiced = 0, total = 0;
    words.forEach(function (w) { if (VOW[w[1]]) total++; });
    words.forEach(function (w) {
      var c = w[0], vw = VOW[w[1]], dur = w[2];
      if (!vw) { env.gain.setTargetAtTime(0.0001, t, 0.01); t += dur; return; }
      var k = total > 1 ? voiced / (total - 1) : 0;
      var p = base * (1.15 - 0.25 * k);
      if (opt.ask && voiced >= total - 2) p = base * (1.0 + 0.35 * (voiced - total + 3) / 2);
      voiced++;
      var cl = 0;
      if (c === "s" || c === "sh" || c === "ch") { cl = Math.min(dur * 0.35, 0.05); env.gain.setTargetAtTime(0.0001, t, 0.004); hiss(t, cl + 0.01, c === "s" ? 6500 : 3400, 1.6, 0.5); }
      else if (c === "g" || c === "d" || c === "t" || c === "p" || c === "b" || c === "k") { cl = 0.02; env.gain.setTargetAtTime(0.0001, t, 0.003); hiss(t + 0.008, 0.02, (c === "p" || c === "b") ? 700 : c === "g" ? 1500 : 3500, 0.8, 0.45); }
      else if (c === "h") { cl = Math.min(dur * 0.3, 0.04); env.gain.setTargetAtTime(0.0001, t, 0.004); hiss(t, cl + 0.01, 1800, 0.6, 0.35); }
      else if (c === "z" || c === "j") { cl = 0.03; env.gain.setTargetAtTime(0.15, t, 0.004); hiss(t, cl, c === "z" ? 5500 : 3200, 1.5, 0.3); }
      else if (c === "m" || c === "n" || c === "r" || c === "y" || c === "w") { cl = 0.025; env.gain.setTargetAtTime(0.3, t, 0.005); }
      var tv = t + cl;
      mod.frequency.setValueAtTime(p, tv);
      ops.forEach(function (o, j) {
        var f = c === "m" || c === "n" ? [250, 1100, 2200][j] : vw[j];
        o.c.frequency.setValueAtTime(Math.max(1, Math.round(f / p)) * p, tv);
        o.depth.gain.setValueAtTime(p * opt.bright * [1.2, 0.8, 0.5][j], tv);
      });
      var loud = w[1] === "n" ? 0.45 : (c === "sh" && w[1] === "i") ? 0.35 : 1;
      env.gain.setTargetAtTime(loud, tv, 0.006);
      env.gain.setTargetAtTime(loud * 0.7, tv + 0.03, 0.05);
      t += dur;
    });
    env.gain.setTargetAtTime(0.0001, t - 0.02, 0.02);
    mod.start(at); ops.forEach(function (o) { o.c.start(at); });
    mod.stop(t + 0.3); ops.forEach(function (o) { o.c.stop(t + 0.3); });
    return t;
  }
  var bubbles = [];                             /* 吹き出し { who: "me"|"back", ja, en, until } */
  function say(who, yomi, ja, en, opt) {
    var at = AC ? AC.currentTime + (opt.delay || 0) : 0;
    var end = fmSpeak(at, window.zVoice.kana(yomi.replace(/[！？!?。…]+$/, ""), opt.mora || 0.11), opt);
    bubbles = bubbles.filter(function (b) { return b.who !== who; });
    bubbles.push({ who: who, ja: ja, en: en, from: T + (opt.delay || 0), until: T + (opt.delay || 0) + Math.max(1.2, (end - at) + 0.8) });
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", ASK: "ask", PLAY: "play", ANGRY: "angry", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var MAX = 40;                                 /* 座席が倒れきる角度 */
  var SPEED = 8;                                /* 倒れる速さ（度/秒） */
  var MM = 2.5;                                 /* 絵の1点が何mmか（背もたれ 310点 ≒ 78cm） */
  var angle, contact, gap, coughed, failed, sceneryX = 0, creakT = 0;
  /* 場所（場面の座標。拡大前） */
  var MYX = 195, BACKX = 425, PIV = { x: 0, y: 0 }, LAP = null;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.ASK;
    score = 0; T = 0; T2 = 0; held = false; angle = 0; failed = false; coughed = false; gap = null;
    contact = 15 + Math.random() * 14;          /* 画面に触れる角度（毎回ちがう） */
    LAP = null;
    bubbles = [];
    say("me", "たおしてもいいですか？", "倒してもいいですか？", "May I recline?", { pitch: 140, bright: 1.0, volume: 0.5, ask: true });
    say("back", "どうぞ", "どうぞ", "Sure.", { pitch: 120, bright: 0.9, volume: 0.45, delay: 1.7, mora: 0.14 });
  }

  /* 座席の背もたれ：軸 p、角度 a（度）の座席の「ローカル→場面」 */
  function toWorld(p, a, u, v) {
    var r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return { x: p.x + u * c - v * s, y: p.y + u * s + v * c };
  }
  function toLocal(p, a, x, y) {
    var r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r), dx = x - p.x, dy = y - p.y;
    return { u: dx * c + dy * s, v: -dx * s + dy * c };
  }
  var BACK_U = 30;                              /* 背もたれの裏の面 */
  /* パソコンの置き場所。画面の上の角が contact 度で背もたれの裏（高さ120）に触れるように置く */
  function placeLaptop(fy) {
    PIV = { x: MYX - 4, y: fy - 100 };
    var top = toWorld(PIV, contact, BACK_U, -120);
    var tilt = 16 * Math.PI / 180, len = 92;
    var hinge = { x: top.x - Math.sin(tilt) * len, y: top.y + Math.cos(tilt) * len };
    LAP = { top: top, hinge: hinge, fy: fy };
  }
  /* 背もたれの裏と画面の上の角のすき間（点） */
  function gapNow(a) {
    var l = toLocal(PIV, a, LAP.top.x, LAP.top.y);
    return l.u - BACK_U;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    sceneryX += dt * 900;
    bubbles = bubbles.filter(function (b) { return T < b.until; });
    if (!LAP) return;
    gap = gapNow(angle);
    if (state === S.ASK) { if (T > 2.4) state = S.PLAY; return; }
    if (state === S.ANGRY) {
      T2 += dt;
      if (T2 > 0.5) angle = Math.max(0, angle - dt * 25);
      if (T2 > 2.4) toResult();
      return;
    }
    if (state !== S.PLAY) return;

    /* 押している間、なめらかに倒れる */
    if (held && angle < MAX) {
      angle = Math.min(MAX, angle + SPEED * dt);
      creakT -= dt;
      if (creakT <= 0) { creakT = 0.12; creak(); }
      gap = gapNow(angle);
    }
    if (gap < 14 && !coughed) {
      coughed = true;
      say("back", "ごほん", "ゴホン", "Ahem.", { pitch: 110, bright: 1.6, volume: 0.4, mora: 0.12 });
    }
    if (gap <= 0) {
      state = S.ANGRY; T2 = 0; failed = true; held = false;
      say("back", "ちょっと！", "ちょっと！", "Hey!", { pitch: 170, bright: 2.6, volume: 0.65, mora: 0.1 });
      noiseHit(0.12, 2500, 0.5, 2);
    }
  }
  var T2 = 0;
  function toResult() {
    state = S.RESULT;
    score = failed ? 0 : Math.round(gap * MM * 10) / 10;
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    held = true;
  }
  function up() {
    if (!held) return;
    held = false;
    if (state === S.PLAY && angle > 0) { toResult(); noiseHit(0.08, 600, 0.3, 2); }
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1 すき間 2cm の手前まで 2 触れる 3 結果（残り 1.5mm） */
    if (state !== S.PLAY || !LAP) return;
    var to = n === 1 ? 20 / MM : n === 2 ? -1 : 1.5 / MM;
    while (gapNow(angle) > to && angle < MAX) angle += 0.01;
    gap = gapNow(angle);
    if (n === 3) toResult();
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    var text = failed
      ? zT("新幹線の座席を倒しすぎて、後ろの人に「ちょっと！」と言われた", "Reclined my bullet-train seat too far and the person behind me went \"Hey!\"")
      : zT("新幹線の座席を、後ろの人のパソコンまで残り" + score.toFixed(1) + "mmまで倒した", "Reclined my bullet-train seat to within " + score.toFixed(1) + "mm of the laptop behind me");
    window.zResultActions.x({ text: text + zT(" #倒してもいいですかゲーム", " #MayIReclineGame") });
  }

  /* ============ 描画 ============ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function limb(pts, w, color) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  /* 横顔（左向き）。c: 中心、tilt: うつむき（ラジアン）、look: 0 下を見る〜1 前を見上げる、mood: 0〜1 */
  function face(c, tilt, look, mood, o) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(tilt);
    /* 首 */
    ctx.fillStyle = o.skin; ctx.fillRect(-6, 20, 22, 34);
    /* 頭の形（後頭部が丸く、あごが前に） */
    ctx.beginPath();
    ctx.moveTo(18, -34);
    ctx.bezierCurveTo(44, -24, 42, 26, 16, 38);   /* 後頭部〜首の付け根 */
    ctx.lineTo(-10, 40);
    ctx.bezierCurveTo(-20, 40, -24, 32, -25, 24); /* あご */
    ctx.lineTo(-27, 14);                          /* 口元 */
    ctx.lineTo(-30, 8);
    ctx.lineTo(-27, 4);
    ctx.lineTo(-34, -6);                          /* 鼻 */
    ctx.lineTo(-27, -10);
    ctx.bezierCurveTo(-28, -30, -10, -40, 18, -34);
    ctx.fillStyle = o.skin; ctx.fill();
    /* 髪 */
    ctx.fillStyle = o.hair;
    ctx.beginPath();
    ctx.moveTo(-24, -16); ctx.bezierCurveTo(-26, -42, 20, -50, 38, -22);
    ctx.bezierCurveTo(46, -2, 40, 14, 30, 22); ctx.lineTo(22, 4); ctx.bezierCurveTo(14, -18, -6, -24, -24, -16);
    ctx.fill();
    /* 耳 */
    ctx.fillStyle = o.ear; ctx.beginPath(); ctx.ellipse(10, 2, 6, 10, 0.1, 0, Math.PI * 2); ctx.fill();
    /* 目・まゆ */
    var ey = -6 + (1 - look) * 3, open = mood > 0.8 ? 1.6 : 3.2;
    ctx.fillStyle = "#1d1d1d"; ctx.beginPath(); ctx.ellipse(-18 - look * 2, ey, 2.6, open, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = o.hair; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-26, -14 + mood * 3); ctx.lineTo(-12, -16 - mood * 2); ctx.stroke();
    /* 口 */
    ctx.strokeStyle = "#8a4b3c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-26, 16); ctx.lineTo(-20, 16 + (mood > 0.5 ? 2 : -1)); ctx.stroke();
    /* 汗 */
    if (mood > 0.85) { ctx.fillStyle = "#7cc4f0"; ctx.beginPath(); ctx.ellipse(6, -26, 4, 7, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  /* 座席（横から）。x は座面の後ろの端、a は背もたれの傾き（度、後ろへ） */
  function seatBase(x, fy) {
    ctx.fillStyle = "#6f747c"; ctx.fillRect(x - 120, fy - 70, 14, 70); ctx.fillRect(x - 20, fy - 70, 14, 70);
    ctx.fillStyle = "#2f4f86"; rr(x - 150, fy - 124, 160, 56, 20); ctx.fill();
  }
  function seatBack(x, fy, a) {
    ctx.save(); ctx.translate(x - 4, fy - 100); ctx.rotate(a * Math.PI / 180);
    ctx.fillStyle = "#2f4f86"; rr(-26, -300, 56, 310, 24); ctx.fill();
    ctx.fillStyle = "#26447a"; rr(4, -296, 26, 300, 14); ctx.fill();
    ctx.fillStyle = "#f2f2ee"; rr(-30, -300, 64, 70, 16); ctx.fill();
    ctx.restore();
  }
  function armrest(x, fy) { ctx.fillStyle = "#4a4f57"; rr(x - 140, fy - 166, 130, 16, 8); ctx.fill(); }

  /* 座っている人（左向き）。p: 座席の軸、a: 背もたれの角度 */
  function person(p, a, fy, o) {
    var hip = toWorld(p, a, -36, -28);
    var shoulder = toWorld(p, a, -40, -200);
    var head = toWorld(p, a, -44, -262);
    var knee = o.knee, foot = { x: knee.x - 6, y: fy - 8 };
    /* 脚 */
    limb([hip, knee, foot], 40, o.pants);
    ctx.fillStyle = "#1f1f22"; rr(foot.x - 34, foot.y - 12, 48, 18, 8); ctx.fill();
    /* 胴 */
    limb([hip, shoulder], 74, o.shirt);
    /* 頭 */
    face(head, o.tilt, o.look, o.mood, o);
    /* 腕：肩→ひじ→手 */
    limb([shoulder, o.elbow, o.hand], 26, o.shirt);
    ctx.fillStyle = o.skin; ctx.beginPath(); ctx.ellipse(o.hand.x - 4, o.hand.y, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    var Z = 1.12, fy = Math.round((H * 0.5 + 330) / Z);
    if (!LAP || LAP.fy !== fy) placeLaptop(fy);
    ctx.fillStyle = "#e9e6dc"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#8a8578"; ctx.fillRect(0, fy * Z, W, H);
    ctx.save(); ctx.translate(W / 2, 0); ctx.scale(Z, Z); ctx.translate(-W / 2, 0);
    /* 車内の壁と窓（景色が流れる） */
    ctx.fillStyle = "#e9e6dc"; ctx.fillRect(-60, 0, W + 120, fy);
    var wy = fy - 520, wh = 190;
    ctx.save();
    rr(-20, wy, W + 40, wh, 26); ctx.clip();
    var sky = ctx.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, "#8ec5ee"); sky.addColorStop(1, "#d9eefb");
    ctx.fillStyle = sky; ctx.fillRect(-60, wy, W + 120, wh);
    var fx = W * 0.7 - ((sceneryX * 0.02) % (W + 400));
    if (fx < -200) fx += W + 400;
    ctx.fillStyle = "#6c86a8"; ctx.beginPath(); ctx.moveTo(fx - 180, wy + wh); ctx.lineTo(fx - 40, wy + 50); ctx.lineTo(fx + 40, wy + 50); ctx.lineTo(fx + 180, wy + wh); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(fx - 64, wy + 82); ctx.lineTo(fx - 40, wy + 50); ctx.lineTo(fx + 40, wy + 50); ctx.lineTo(fx + 64, wy + 82); ctx.lineTo(fx + 30, wy + 74); ctx.lineTo(fx, wy + 86); ctx.lineTo(fx - 30, wy + 74); ctx.fill();
    ctx.fillStyle = "#6b8f4e";
    for (var i = 0; i < 8; i++) { var tx = ((i * 180 - sceneryX * 0.6) % 1440 + 1440) % 1440 - 100; ctx.beginPath(); ctx.ellipse(tx, wy + wh - 20, 60, 34, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#555";
    for (i = 0; i < 3; i++) { var px = ((i * 520 - sceneryX * 1.4) % 1560 + 1560) % 1560 - 60; ctx.fillRect(px, wy, 8, wh); }
    ctx.restore();
    ctx.strokeStyle = "#c9c4b6"; ctx.lineWidth = 8; rr(-20, wy, W + 40, wh, 26); ctx.stroke();
    ctx.fillStyle = "#b9b4a6"; ctx.fillRect(-60, wy - 90, W + 120, 14);
    ctx.fillStyle = "#8a8578"; ctx.fillRect(-60, fy, W + 120, H);
    ctx.fillStyle = "#7a7568"; ctx.fillRect(-60, fy, W + 120, 6);

    var g = gap == null ? 99 : gap, near = Math.max(0, Math.min(1, 1 - g / 40));
    var mood = state === S.ANGRY ? 1 : near;
    var bp = { x: BACKX - 4, y: fy - 100 };
    /* 後ろの人：座席→人→パソコン */
    seatBase(BACKX, fy); seatBack(BACKX, fy, 8);
    var L = LAP, tilt = 16 * Math.PI / 180;
    var baseEnd = { x: L.hinge.x + 96, y: L.hinge.y + 4 };
    var knee = { x: L.hinge.x + 8, y: L.hinge.y + 22 };
    var look = state === S.ANGRY ? 1 : near;
    person(bp, 8, fy, {
      skin: "#e8bf9c", ear: "#dcae8a", hair: "#2a2420", shirt: "#56708f", pants: "#2d2f36",
      knee: knee, tilt: 0.28 - look * 0.32, look: look, mood: mood,
      elbow: { x: L.hinge.x + 120, y: L.hinge.y + 30 }, hand: { x: L.hinge.x + 50, y: L.hinge.y - 4 }
    });
    armrest(BACKX, fy);
    /* パソコン（ひざの上） */
    ctx.fillStyle = "#3b3f46";
    ctx.save(); ctx.translate(L.hinge.x, L.hinge.y); ctx.rotate(Math.atan2(baseEnd.y - L.hinge.y, baseEnd.x - L.hinge.x));
    rr(-2, -3, 98, 7, 3); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(L.hinge.x, L.hinge.y); ctx.rotate(tilt);
    ctx.fillStyle = "#3b3f46"; rr(-4, -92, 7, 94, 3); ctx.fill();
    ctx.fillStyle = "#9fd8ff"; ctx.fillRect(3, -86, 2, 80);
    ctx.restore();

    /* 自分：座席→自分→ひじ掛け */
    seatBase(MYX, fy);
    seatBack(MYX, fy, angle);
    var mp = { x: MYX - 4, y: fy - 100 };
    var sh = toWorld(mp, angle, -40, -200);
    person(mp, angle, fy, {
      skin: "#eec4a2", ear: "#e0b18c", hair: "#1c1916", shirt: "#3a4152", pants: "#4a4a52",
      knee: { x: MYX - 160, y: fy - 132 }, tilt: -0.05, look: 0.8, mood: state === S.ANGRY ? 0.9 : 0,
      elbow: { x: sh.x + 10, y: fy - 162 }, hand: { x: sh.x - 70, y: fy - 166 }
    });
    armrest(MYX, fy);
    ctx.restore();
    var fyz = fy * Z;

    /* すき間が近いときの拡大鏡（画面の上の角を5倍に） */
    if (state !== S.INTRO && g < 26 && state !== S.ANGRY) {
      var k = canvas.width / W, mag = 4, R = 100;
      var sx = (W / 2 + (L.top.x - W / 2) * Z), sy = L.top.y * Z;
      var cx = W / 2, cy = Math.max(R + 16, (fy - 520) * Z - R - 24);
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#e9e6dc"; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      var sw = (R * 2) / mag;
      ctx.drawImage(canvas, (sx - sw / 2) * k, (sy - sw / 2) * k, sw * k, sw * k, cx - R, cy - R, R * 2, R * 2);
      ctx.restore();
      ctx.strokeStyle = "#16202e"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.font = "800 26px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillStyle = "#16202e";
      ctx.fillText((Math.max(0, g) * MM).toFixed(1) + "mm", cx, cy + R + 8);
    }

    /* 吹き出し */
    bubbles.forEach(function (b) {
      if (T < b.from) return;
      var txt = zT(b.ja, b.en), angry = b.ja === "ちょっと！";
      ctx.font = (angry ? "900 44px" : "800 32px") + " sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var w = ctx.measureText(txt).width + 40, bx = b.who === "me" ? W * 0.36 : W * 0.72, by = fyz - 540;
      bx = Math.max(w / 2 + 10, Math.min(W - w / 2 - 10, bx));
      ctx.fillStyle = angry ? "#c0263a" : "#fff";
      rr(bx - w / 2, by - 34, w, 68, 30); ctx.fill();
      ctx.fillStyle = angry ? "#fff" : "#16202e";
      ctx.fillText(txt, bx, by + 2);
    });

    if (state === S.RESULT) drawResult();
  }

  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(failed ? zT("アウト", "OUT") : score.toFixed(1) + "mm", W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }

  window.__probe = {
    now: function () { return { state: state, score: score, angle: angle, contact: contact, gap: gap, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
      held = true;
      if (!await r.until(function () { return gap < 6 || state !== S.PLAY; }, 20)) throw Error("倒れない");
      up();
      await r.wait(1500);
    }
  };

  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  angle = 0; contact = 22; T = 0; bubbles = []; state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
