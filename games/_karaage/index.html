<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>なんでも唐揚げ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee7db;overscroll-behavior:none}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
#wrap{position:relative;flex-shrink:0;transform-origin:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
button{position:absolute;border:0;cursor:pointer;touch-action:manipulation;color:#273b38;background:#fffaf0;box-shadow:0 5px 0 #d1c6b5;border-radius:50%;width:72px;height:72px;display:grid;place-items:center}
button:active{translate:0 3px;box-shadow:0 2px 0 #d1c6b5}button:focus-visible{outline:4px solid #d7782e;outline-offset:5px}button:disabled{opacity:.35;cursor:default}
button svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}#start{width:226px;height:70px;border-radius:40px;left:157px;bottom:38px;font:bold 28px sans-serif;letter-spacing:4px}
#pick{left:48px;bottom:38px}#act{left:234px;bottom:38px;background:#284d43;color:#fff9df;box-shadow:0 5px 0 #15352c}#save{right:48px;bottom:38px}
#again{left:170px;bottom:38px}#share{left:298px;bottom:38px}#save.result{right:48px}#pick.result{left:48px}
#file{display:none}#error{position:absolute;left:30px;right:30px;bottom:126px;text-align:center;color:#ad342c;font:600 18px sans-serif;margin:0}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
<canvas id="c" aria-label="画像を唐揚げにする鍋"></canvas>
<button id="start" type="button">START</button>
<button id="pick" aria-label="画像を選ぶ" hidden><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="23" rx="4"/><circle cx="11" cy="12" r="2"/><path d="m4 24 8-8 6 6 5-5 6 7"/></svg></button>
<button id="act" aria-label="油に入れる" hidden><svg id="down-icon" viewBox="0 0 32 32"><path d="M16 4v18m-7-7 7 7 7-7M5 23v5h22v-5"/></svg><svg id="up-icon" viewBox="0 0 32 32" hidden><path d="M16 24V6m-7 7 7-7 7 7M5 23v5h22v-5"/></svg></button>
<button id="save" aria-label="画像を保存" hidden disabled><svg viewBox="0 0 32 32"><path d="M16 3v17m-6-6 6 6 6-6M5 22v7h22v-7"/></svg></button>
<button id="again" aria-label="もう一度" hidden><svg viewBox="0 0 32 32"><path d="M6 12a11 11 0 1 1 0 10M6 4v8h8"/></svg></button>
<button id="share" aria-label="Xでシェア" hidden><svg viewBox="0 0 32 32"><path d="m5 4 17 24h5L10 4Zm21 0L5 28"/></svg></button>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp">
<p id="error" role="status" hidden></p>
</div></div>
<script src="../share.js"></script>
<script src="../pad.js"></script>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
var start=document.getElementById('start'),pick=document.getElementById('pick'),act=document.getElementById('act'),save=document.getElementById('save'),again=document.getElementById('again'),share=document.getElementById('share'),file=document.getElementById('file'),error=document.getElementById('error');
var W=540,H=960,state='intro',elapsed=0,clock=0,transition=0,loadId=0,busy=false,keyHeld=false,pointer=null,focused=true;
var original=document.createElement('canvas'),fried=document.createElement('canvas'),exported=document.createElement('canvas');
var pixels=null,relief=null,grain=null,lastBake=-1,AC=null,hiss=null,volume=null;
function layout(){H=Math.max(780,Math.min(1700,Math.round(W*window.innerHeight/window.innerWidth)));var k=Math.min(window.innerWidth/W,window.innerHeight/H);wrap.style.width=W+'px';wrap.style.height=H+'px';wrap.style.transform='scale('+k+')';var d=Math.min(window.devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw();}
window.addEventListener('resize',layout);window.addEventListener('orientationchange',layout);
function plateY(){return H*.285;}function panY(){return H*.66;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hash(x,y){var v=Math.sin(x*127.1+y*311.7+73.2)*43758.5453;return v-Math.floor(v);}
function noise(x,y){var i=Math.floor(x),j=Math.floor(y),u=x-i,v=y-j;u=u*u*(3-2*u);v=v*v*(3-2*v);return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v;}
function oval(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function round(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();}
// 最初から触って試せる、星形の食材。外部の画像は読み込まない。
function sample(){original.width=original.height=320;var c=original.getContext('2d');c.beginPath();for(var i=0;i<10;i++){var a=i*Math.PI/5-Math.PI/2,r=i%2?71:138;c.lineTo(160+Math.cos(a)*r,160+Math.sin(a)*r);}c.closePath();var g=c.createLinearGradient(30,20,250,300);g.addColorStop(0,'#84b6a0');g.addColorStop(1,'#235f59');c.fillStyle=g;c.fill();c.lineWidth=8;c.strokeStyle='#b2d5b3';c.stroke();prepare();}
// 端につながる単色の背景だけを抜く。写真の複雑な背景には手を加えない。
function removePlainBackground(data,w,h){var a=data.data,ref=[a[0],a[1],a[2]],ok=0,count=0,transparent=false;
 for(var y=0;y<h;y++)for(var x=0;x<w;x++){var p=(y*w+x)*4;if(a[p+3]<245&&(x===0||y===0||x===w-1||y===h-1))transparent=true;if(x===0||y===0||x===w-1||y===h-1){count++;if(Math.max(Math.abs(a[p]-ref[0]),Math.abs(a[p+1]-ref[1]),Math.abs(a[p+2]-ref[2]))<22)ok++;}}
 if(transparent||ok/count<.96)return;
 var seen=new Uint8Array(w*h),q=new Int32Array(w*h),head=0,tail=0;
 function add(p){if(seen[p])return;seen[p]=1;var i=p*4;if(Math.max(Math.abs(a[i]-ref[0]),Math.abs(a[i+1]-ref[1]),Math.abs(a[i+2]-ref[2]))>30)return;q[tail++]=p;}
 for(var x=0;x<w;x++){add(x);add((h-1)*w+x);}for(var y=0;y<h;y++){add(y*w);add(y*w+w-1);}
 while(head<tail){var p=q[head++],x=p%w,y=Math.floor(p/w);if(x)add(p-1);if(x<w-1)add(p+1);if(y)add(p-w);if(y<h-1)add(p+w);}
 if(tail>w*h*.97)return;
 for(var i=0;i<tail;i++)a[q[i]*4+3]=0;
}
function prepare(){var w=original.width,h=original.height,c=original.getContext('2d');pixels=c.getImageData(0,0,w,h);fried.width=w;fried.height=h;relief=new Float32Array(w*h);grain=new Float32Array(w*h);
 for(var y=0;y<h;y++)for(var x=0;x<w;x++){var p=y*w+x;relief[p]=noise(x*.12,y*.12)*.55+noise(x*.32,y*.32)*.30+noise(x*.8,y*.8)*.15;grain[p]=hash(x,y);}
 lastBake=-1;bake(0);
}
// 元の明暗を残しつつ、多段の粒と斜めからの光で衣を描く。
function bake(seconds){var bucket=Math.floor(seconds*5);if(bucket===lastBake)return;lastBake=bucket;var w=original.width,h=original.height,c=fried.getContext('2d'),out=c.getImageData(0,0,w,h),a=pixels.data,b=out.data,t=clamp(seconds/8,0,1),burn=clamp((seconds-11)/7,0,1);
 for(var y=0;y<h;y++)for(var x=0;x<w;x++){var p=y*w+x,i=p*4;if(!a[i+3]){b[i+3]=0;continue;}var n=relief[p],slope=n-relief[Math.max(0,y-2)*w+Math.max(0,x-2)],lum=(a[i]*.2126+a[i+1]*.7152+a[i+2]*.0722)/255;
 var l=(n-.5)*72+slope*145+(grain[p]-.5)*25+(lum-.5)*47;var pit=n<.34?-24:0;var crust=t*.94;
 var r=(211+l+pit)*(1-burn*.66),g=(157-t*50+l*.79+pit)*(1-burn*.8),bl=(83-t*57+l*.42+pit*.5)*(1-burn*.84);
 b[i]=a[i]*(1-crust)+r*crust;b[i+1]=a[i+1]*(1-crust)+g*crust;b[i+2]=a[i+2]*(1-crust)+bl*crust;b[i+3]=a[i+3];}
 c.putImageData(out,0,0);
}
function controls(){var intro=state==='intro',result=state==='result';start.hidden=!intro;pick.hidden=intro;pick.disabled=busy||state==='frying'||state==='lifting';act.hidden=intro||result;act.disabled=busy||state==='lifting';act.setAttribute('aria-label',state==='frying'?'引き上げる':'油に入れる');document.getElementById('down-icon').hidden=state==='frying';document.getElementById('up-icon').hidden=state!=='frying';save.hidden=intro;save.disabled=!result||busy;again.hidden=!result;share.hidden=!result;save.classList.toggle('result',result);pick.classList.toggle('result',result);}
function reset(){elapsed=0;transition=0;state='play';keyHeld=false;pointer=null;lastBake=-1;bake(0);silence();controls();draw();}
function go(){if(busy)return;if(state==='intro'){soundOn();reset();return;}soundOn();if(state==='play'){state='frying';elapsed=0;controls();}else if(state==='frying'){state='lifting';transition=0;silence();controls();}else if(state==='result')reset();}
function update(dt){clock+=dt;if(state==='frying'){elapsed=Math.min(18,elapsed+dt);bake(elapsed);if(volume&&AC&&AC.state==='running'&&focused)volume.gain.setTargetAtTime(.045,AC.currentTime,.1);if(elapsed>=18){state='lifting';transition=0;silence();controls();}}else if(state==='lifting'){transition=Math.min(1,transition+dt/.65);if(transition>=1){state='result';makeExport();controls();}}}
function soundOn(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!AC){AC=new C();var buffer=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buffer.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;hiss=AC.createBufferSource();hiss.buffer=buffer;hiss.loop=true;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1700;volume=AC.createGain();volume.gain.value=0;hiss.connect(f);f.connect(volume);volume.connect(AC.destination);hiss.start();}if(AC.state!=='closed'&&AC.state!=='running')AC.resume().catch(function(){});}catch(e){}}
function silence(){if(volume&&AC)volume.gain.setTargetAtTime(0,AC.currentTime,.03);}
document.addEventListener('visibilitychange',function(){if(document.hidden){silence();if(AC&&AC.state!=='closed')AC.suspend().catch(function(){});}else if(AC)soundOn();});
function drawFood(image,x,y,size,angle){ctx.save();ctx.translate(x,y);ctx.rotate(angle||0);var k=size/Math.max(image.width,image.height);ctx.shadowColor='rgba(70,37,10,.26)';ctx.shadowBlur=13;ctx.shadowOffsetY=8;ctx.drawImage(image,-image.width*k/2,-image.height*k/2,image.width*k,image.height*k);ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#eee7db';ctx.fillRect(0,0,W,H);
 // 白いタイルと、台の継ぎ目。
 ctx.strokeStyle='#e1d8c9';ctx.lineWidth=1;for(var y=0;y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(var x=0;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 var py=plateY(),fy=panY();
 ctx.save();ctx.translate(270,py);ctx.rotate(-.09);ctx.shadowColor='#c9bdad';ctx.shadowBlur=18;ctx.shadowOffsetY=12;round(-193,-145,386,290,29,'#faf7ed');ctx.shadowBlur=0;ctx.shadowOffsetY=0;round(-177,-129,354,258,21,'#e9e5da');round(-173,-125,346,250,19,'#fffdf5');ctx.restore();
 // 鉄鍋と油。食材の前後で泡を分ける。
 oval(270,fy+45,220,126,'#d4c7b4');round(13,fy-25,63,50,17,'#233a35');round(464,fy-25,63,50,17,'#233a35');round(23,fy-14,34,27,8,'#eee7db');round(483,fy-14,34,27,8,'#eee7db');oval(270,fy+16,221,133,'#1c302c');oval(270,fy,221,126,'#3a5049');oval(270,fy-4,208,112,'#142922');
 var oil=ctx.createRadialGradient(240,fy-48,10,270,fy,210);oil.addColorStop(0,'#e3b94d');oil.addColorStop(.65,'#bd7e20');oil.addColorStop(1,'#764015');oval(270,fy-4,197,103,oil);
 ctx.strokeStyle='rgba(255,222,136,.25)';ctx.lineWidth=2;for(var i=0;i<6;i++){ctx.beginPath();ctx.ellipse(270,fy-5,65+i*23,30+i*12,0,0,Math.PI*2);ctx.stroke();}
 var active=state==='frying',lift=state==='lifting',finished=state==='result',image=(active||lift||finished)?fried:original;
 var drop=clamp(elapsed/.5,0,1);var foodY=active?py+(fy-12-py)*drop*drop:lift?(fy-12)+(py-(fy-12))*(1-Math.pow(1-transition,3)):py;
 var jiggle=active?Math.sin(clock*19)*.016:0;drawFood(image,270,foodY,active?214:250,jiggle-.07);
 if(active){for(var i=0;i<94;i++){var a=hash(i,9)*Math.PI*2,r=35+hash(i,7)*130,life=(clock*(.5+hash(i,2))+hash(i,3))%1;var bx=270+Math.cos(a)*r,by=fy-6+Math.sin(a)*r*.52-life*23;var br=(2+hash(i,4)*7)*Math.sin(life*Math.PI);oval(bx,by,br,br*.8,'rgba(255,234,173,'+(.72*(1-life))+')');}}
 // 油の中の時間を小さな針で示す。
 if(active||lift||finished){var gx=270,gy=py+172;ctx.lineWidth=5;ctx.strokeStyle='#d6c9b6';ctx.beginPath();ctx.arc(gx,gy,17,-Math.PI/2,Math.PI*1.5);ctx.stroke();ctx.strokeStyle='#ad672b';ctx.beginPath();ctx.arc(gx,gy,17,-Math.PI/2,-Math.PI/2+Math.PI*2*elapsed/18);ctx.stroke();}
 if(busy){ctx.strokeStyle='#284d43';ctx.lineWidth=5;ctx.beginPath();ctx.arc(270,py,29,clock*4,clock*4+4);ctx.stroke();}
}
function makeExport(){exported.width=exported.height=1080;var c=exported.getContext('2d');c.fillStyle='#f3eee2';c.fillRect(0,0,1080,1080);c.fillStyle='#fffdf7';c.beginPath();c.roundRect(70,70,940,940,85);c.shadowColor='#b9a88d';c.shadowBlur=32;c.shadowOffsetY=16;c.fill();c.shadowBlur=0;c.shadowOffsetY=0;c.strokeStyle='#e9e2d5';c.lineWidth=3;c.beginPath();c.roundRect(100,100,880,880,66);c.stroke();var k=760/Math.max(fried.width,fried.height);c.save();c.translate(540,540);c.rotate(-.07);c.shadowColor='rgba(70,37,10,.24)';c.shadowBlur=25;c.shadowOffsetY=16;c.drawImage(fried,-fried.width*k/2,-fried.height*k/2,fried.width*k,fried.height*k);c.restore();}
function showError(message){error.textContent=message;error.hidden=false;}
async function acceptImage(f){if(!f)return;var id=++loadId;error.hidden=true;if(f.size>25*1024*1024){showError('25MB以下の画像を選んでください');return;}if(!/^image\/(png|jpeg|webp|gif|avif|bmp)$/.test(f.type)){showError('PNG・JPEG・WebPなどの画像を選んでください');return;}busy=true;controls();var url=URL.createObjectURL(f);
 try{var im=new Image();await new Promise(function(resolve,reject){im.onload=resolve;im.onerror=reject;im.src=url;});if(id!==loadId)return;if(!im.naturalWidth||!im.naturalHeight)throw Error();var k=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight));var next=document.createElement('canvas');next.width=Math.max(1,Math.round(im.naturalWidth*k));next.height=Math.max(1,Math.round(im.naturalHeight*k));var c=next.getContext('2d');c.drawImage(im,0,0,next.width,next.height);var data=c.getImageData(0,0,next.width,next.height);removePlainBackground(data,next.width,next.height);c.putImageData(data,0,0);
 // 透明な余白を詰め、皿の中央に置く。
 var x0=next.width,y0=next.height,x1=-1,y1=-1;for(var y=0;y<next.height;y++)for(var x=0;x<next.width;x++)if(data.data[(y*next.width+x)*4+3]>15){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}if(x1<0)throw Error();original.width=x1-x0+1;original.height=y1-y0+1;original.getContext('2d').drawImage(next,x0,y0,original.width,original.height,0,0,original.width,original.height);prepare();busy=false;reset();
 }catch(e){if(id===loadId)showError('画像を読み込めませんでした');}finally{URL.revokeObjectURL(url);if(id===loadId){busy=false;controls();}}
}
file.addEventListener('change',function(){acceptImage(file.files[0]);file.value='';});
pick.addEventListener('click',function(){if(!pick.disabled)file.click();});act.addEventListener('click',go);start.addEventListener('click',go);again.addEventListener('click',reset);
save.addEventListener('click',function(){if(state!=='result')return;exported.toBlob(function(blob){if(!blob){showError('画像を保存できませんでした');return;}var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='唐揚げ.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},60000);},'image/png');});
share.addEventListener('click',function(){if(state==='result')zShare({text:'',native:false});});
// 開始の指離しは、そのまま鍋の操作へ流さない。
document.addEventListener('pointerdown',function(e){if(state!=='intro'||e.isPrimary===false||e.button>0)return;pointer=e.pointerId;},true);
document.addEventListener('pointerup',function(e){if(state!=='intro'||pointer!==e.pointerId)return;pointer=null;e.preventDefault();e.stopImmediatePropagation();go();},true);
document.addEventListener('pointercancel',function(){pointer=null;keyHeld=false;},true);
wrap.addEventListener('pointerdown',function(e){if(e.target!==canvas||e.isPrimary===false||e.button>0||state==='intro')return;pointer=e.pointerId;});
wrap.addEventListener('pointerup',function(e){if(e.target!==canvas||pointer!==e.pointerId||state==='intro')return;pointer=null;var r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(Math.abs(x-270)<210&&Math.abs(y-panY())<120)go();});
window.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();if(!e.repeat){loadId++;busy=false;error.hidden=true;reset();}return;}if(e.code==='Space'||e.key===' '||e.key==='Enter'){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();if(!e.repeat)keyHeld=true;}});
window.addEventListener('keyup',function(e){if(e.code==='Space'||e.key===' '||e.key==='Enter'){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();if(keyHeld){keyHeld=false;go();}}});
window.addEventListener('blur',function(){focused=false;keyHeld=false;pointer=null;silence();});window.addEventListener('focus',function(){focused=true;});
window.__probe={now:function(){return {state:state,seconds:elapsed,W:W,H:H,busy:busy,imageWidth:original.width,imageHeight:original.height};},step:function(n){for(var i=0;i<(n||1);i++)update(1/60);draw();},reset:reset};
/* ============ ループ ============ */
sample();controls();layout();var last=performance.now();function loop(now){var dt=Math.min(.033,(now-last)/1000);last=now;if(!document.hidden&&!window.__recordManual){update(dt);draw();}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
