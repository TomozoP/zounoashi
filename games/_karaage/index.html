<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>なんでも唐揚げ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee7db;overscroll-behavior:none}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
#wrap{position:relative;flex-shrink:0;transform-origin:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:calc(100% - 140px)}
#footer{height:140px;display:flex;align-items:center;justify-content:space-evenly;background:#e0d6c5;padding-bottom:env(safe-area-inset-bottom,0px)}
#footer button{position:relative;inset:auto;flex-shrink:0}
button{position:absolute;border:0;cursor:pointer;touch-action:manipulation;color:#273b38;background:#fffaf0;box-shadow:0 5px 0 #d1c6b5;border-radius:50%;width:72px;height:72px;display:grid;place-items:center}
button:active{translate:0 3px;box-shadow:0 2px 0 #d1c6b5}button:focus-visible{outline:4px solid #d7782e;outline-offset:5px}button:disabled{opacity:.35;cursor:default}
button svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
#file{display:none}#error{position:absolute;left:30px;right:30px;bottom:126px;text-align:center;color:#ad342c;font:600 18px sans-serif;margin:0}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
<canvas id="c" aria-label="画像を唐揚げにする鍋"></canvas>
<footer id="footer">
<button id="pick" aria-label="画像を選ぶ"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="23" rx="4"/><circle cx="11" cy="12" r="2"/><path d="m4 24 8-8 6 6 5-5 6 7"/></svg></button>
<button id="again" aria-label="もう一度"><svg viewBox="0 0 32 32"><path d="M6 12a11 11 0 1 1 0 10M6 4v8h8"/></svg></button>
<button id="share" aria-label="Xでシェア"><svg viewBox="0 0 32 32"><path d="m5 4 17 24h5L10 4Zm21 0L5 28"/></svg></button>
<button id="save" aria-label="画像を保存"><svg viewBox="0 0 32 32"><path d="M16 3v17m-6-6 6 6 6-6M5 22v7h22v-7"/></svg></button>
</footer>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp">
<p id="error" role="status" hidden></p>
</div></div>
<script src="../share.js"></script>
<script src="../pad.js"></script>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var wrap=document.getElementById('wrap');
var pick=document.getElementById('pick');
var save=document.getElementById('save');
var saveIcon=save.innerHTML;
var again=document.getElementById('again');
var share=document.getElementById('share');
var file=document.getElementById('file');
var error=document.getElementById('error');

var W=540;
var H=960;
var state='play';
var elapsed=0;
var clock=0;
var loadId=0;
var cutting=null;
var cutPoints=[];
var cutDrawing=false;
var pendingName='';
var imageName='鶏肉';
var busy=false;
var pointerId=null;
var focused=true;
var original=document.createElement('canvas');
var fried=document.createElement('canvas');
var exported=document.createElement('canvas');
var pixels=null;
var relief=null;
var grain=null;
var coat=null;
var bubbleSeeds=[];
var lastBake=-1;
var AC=null;
var hiss=null;
var volume=null;
var popBuffer=null;

var panX=270;
var panY=0;
var foodX=270;
var foodY=250;
var foodBase=250;
var foodOil=214;
var dragging=false;
var dragDx=0;
var dragDy=0;
var oilTouch=false;
var nextPop=0;
var steam=0;
var liftSound=null;

function layout(){
  H=Math.max(780,Math.min(1700,Math.round(W*window.innerHeight/window.innerWidth)));
  var k=Math.min(window.innerWidth/W,window.innerHeight/H);
  wrap.style.width=W+'px';
  wrap.style.height=H+'px';
  H-=140;
  wrap.style.transform='scale('+k+')';
  var d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*d;
  canvas.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  draw();
}

window.addEventListener('resize',layout);
window.addEventListener('orientationchange',layout);

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function hash(x,y){
  var v=Math.sin(x*127.1+y*311.7+73.2)*43758.5453;
  return v-Math.floor(v);
}

function noise(x,y){
  var i=Math.floor(x),j=Math.floor(y);
  var u=x-i,v=y-j;
  u=u*u*(3-2*u);
  v=v*v*(3-2*v);
  return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v;
}

function plateY(){
  return H*.285;
}

function panYPos(){
  return H*.66;
}

function oval(x,y,rx,ry,color){
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
}

function sample(){
  original.width=original.height=1;
  prepare();
  var id=loadId;
  var im=new Image();
  im.onload=function(){
    if(id!==loadId)return;
    original.width=original.height=512;
    original.getContext('2d').drawImage(im,0,0,512,512);
    prepare();
    reset();
  };
  im.src='./img/chicken.webp?v=20260914-karaage-7';
}

function removePlainBackground(data,w,h){
  var a=data.data;
  var r0=a[0],g0=a[1],b0=a[2];
  var hit=0,sample=0,cutout=false;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=(y*w+x)*4;
    if(a[p+3]<245&&(x===0||y===0||x===w-1||y===h-1))cutout=true;
    if(x===0||y===0||x===w-1||y===h-1){
      sample++;
      if(Math.max(Math.abs(a[p]-r0),Math.abs(a[p+1]-g0),Math.abs(a[p+2]-b0))<22)hit++;
    }
  }
  if(cutout||hit/sample<.96)return;

  var seen=new Uint8Array(w*h);
  var q=new Int32Array(w*h);
  var head=0,tail=0;
  function add(p){
    if(seen[p])return;
    seen[p]=1;
    var i=p*4;
    if(Math.max(Math.abs(a[i]-r0),Math.abs(a[i+1]-g0),Math.abs(a[i+2]-b0))>30)return;
    q[tail++]=p;
  }
  for(var x=0;x<w;x++){add(x);add((h-1)*w+x);}
  for(var y=0;y<h;y++){add(y*w);add(y*w+w-1);}
  while(head<tail){
    var p=q[head++],x=p%w,y=Math.floor(p/w);
    if(x>0)add(p-1);
    if(x<w-1)add(p+1);
    if(y>0)add(p-w);
    if(y<h-1)add(p+w);
  }
  if(tail>w*h*.97)return;
  for(var i=0;i<tail;i++)a[q[i]*4+3]=0;
}

function nearestToInside(w,h,alpha,outside){
  var n=w*h;
  var dist=new Int16Array(n);
  for(var i=0;i<n;i++)dist[i]=-1;
  var q=new Int32Array(n);
  var head=0,tail=0;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=y*w+x;
    if(alpha[p]){dist[p]=0;q[tail++]=p;}
  }
  while(head<tail){
    var p=q[head++];
    var d=dist[p]+1;
    var x=p%w,y=Math.floor(p/w);
    if(x>0&&dist[p-1]===-1&&outside[p-1]){dist[p-1]=d;q[tail++]=p-1;}
    if(x<w-1&&dist[p+1]===-1&&outside[p+1]){dist[p+1]=d;q[tail++]=p+1;}
    if(y>0&&dist[p-w]===-1&&outside[p-w]){dist[p-w]=d;q[tail++]=p-w;}
    if(y<h-1&&dist[p+w]===-1&&outside[p+w]){dist[p+w]=d;q[tail++]=p+w;}
  }
  return dist;
}

function prepare(){
  // 衣が画像の外へ張り出すための余白。
  var padded=document.createElement('canvas');
  padded.width=original.width+56;
  padded.height=original.height+56;
  padded.getContext('2d').drawImage(original,28,28);
  original.width=padded.width;
  original.height=padded.height;
  original.getContext('2d').drawImage(padded,0,0);
  var w=original.width;
  var h=original.height;
  var c=original.getContext('2d');
  pixels=c.getImageData(0,0,w,h);
  fried.width=w;
  fried.height=h;
  relief=new Float32Array(w*h);
  grain=new Float32Array(w*h);
  coat=new Float32Array(w*h);

  var a=pixels.data;
  var alpha=new Uint8Array(w*h);
  var n=w*h;
  for(var i=0;i<n;i++)alpha[i]=a[i*4+3]>10?1:0;

  var outside=new Uint8Array(n);
  var q=new Int32Array(n);
  var hA=0,hB=0;
  function addOutside(p){
    if(outside[p])return;
    outside[p]=1;
    if(!alpha[p])q[hB++]=p;
  }
  for(var x=0;x<w;x++){
    addOutside(x);
    addOutside((h-1)*w+x);
  }
  for(var y=0;y<h;y++){
    addOutside(y*w);
    addOutside(y*w+w-1);
  }
  while(hA<hB){
    var p=q[hA++];
    var x=p%w,y=Math.floor(p/w);
    if(x>0)addOutside(p-1);
    if(x<w-1)addOutside(p+1);
    if(y>0)addOutside(p-w);
    if(y<h-1)addOutside(p+w);
  }

  var dist=nearestToInside(w,h,alpha,outside);
  var empty=new Uint8Array(n),all=new Uint8Array(n);
  for(var i=0;i<n;i++){empty[i]=alpha[i]?0:1;all[i]=1;}
  var inward=nearestToInside(w,h,empty,all);
  // 太い衣と細かい突起を重ね、元の輪郭から不規則に膨らませる。
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=y*w+x;
    relief[p]=noise(x*.04,y*.04)*.7+noise(x*.11,y*.11)*.25+noise(x*.28,y*.28)*.05;
    grain[p]=noise(x*.4,y*.4);
    if(alpha[p])coat[p]=clamp((20+noise(x*.055,y*.055)*16-inward[p])/12,0,1);
    if(outside[p]&&!alpha[p]){
      var spread=5+noise(x*.075,y*.075)*19+noise(x*.27,y*.27)*5;
      if(dist[p]>0)coat[p]=clamp((spread-dist[p])*1.5,0,1);
    }
  }

  // 透明部分を避けて、食材の表面と輪郭を泡の発生源にする。
  var surfaceSeeds=[],edgeSeeds=[];
  for(var p=0;p<n;p++)if(alpha[p]){
    surfaceSeeds.push(p);
    if(coat[p]>.5)edgeSeeds.push(p);
  }
  bubbleSeeds=[];
  for(var j=0;j<120&&surfaceSeeds.length;j++){
    var pool=j%2&&edgeSeeds.length?edgeSeeds:surfaceSeeds;
    var p=pool[Math.floor(hash(j,81)*pool.length)];
    bubbleSeeds.push({x:p%w-w/2,y:Math.floor(p/w)-h/2});
  }
  lastBake=-1;
  bake(0);
}

function inOil(x,y,size){
  var cy=panYPos()-8;
  var rx=195*(size/250);
  var ry=92*(size/250);
  var dx=x-panX;
  var dy=y-cy;
  if(dy<-20||dy>ry+24)return false;
  return(dx*dx)/(rx*rx)+(dy*dy)/((ry+24)*(ry+24))<=1;
}

function updateContact(){
  var size=elapsed>0?foodOil:foodBase;
  var wasInOil=oilTouch;
  oilTouch=inOil(foodX,foodY,size);
  if(wasInOil&&!oilTouch&&state==='frying'&&elapsed>0)liftEffect();
}

function bake(seconds){
  var bucket=Math.floor(seconds*6);
  if(bucket===lastBake)return;
  lastBake=bucket;
  var w=original.width;
  var h=original.height;
  var c=fried.getContext('2d');
  var out=c.getImageData(0,0,w,h);
  var a=pixels.data;
  var b=out.data;
  var t=clamp((seconds-3)/7,0,1);
  var white=clamp(seconds/3,0,1);
  var burn=clamp((seconds-11)/7,0,1);
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=y*w+x;
    var i=p*4;
    if(!a[i+3]){
      if(coat[p]){
        var n=relief[p];
        var slope=n-relief[Math.max(0,y-5)*w+Math.max(0,x-5)];
        var rough=(n-.5)*105+slope*180+(grain[p]-.5)*30;
        b[i]=(218+rough)*(1-burn*.66);
        b[i+1]=(155-t*48+rough*.76)*(1-burn*.8);
        b[i+2]=(72-t*45+rough*.38)*(1-burn*.84);
        b[i+3]=Math.round(255*coat[p]*clamp(seconds*1.5,0,1));
      } else {
        b[i+3]=0;
      }
      continue;
    }

    var n=relief[p];
    var slope=n-relief[Math.max(0,y-5)*w+Math.max(0,x-5)];
    var lum=(a[i]*.2126+a[i+1]*.7152+a[i+2]*.0722)/255;
    var rough=(n-.5)*72+slope*145+(grain[p]-.5)*25+(lum-.5)*47;
    var pit=n<.34?-24:0;
    var coverage=clamp(seconds*1.5,0,1);
    var clumps=clamp((n-.46)*4,0,.75);
    var crust=Math.max(t*.94,coverage*Math.max(coat[p],clumps));

    var r=(211+rough+pit)*(1-burn*.66);
    var g=(157-t*50+rough*.79+pit)*(1-burn*.8);
    var bcol=(83-t*57+rough*.42+pit*.5)*(1-burn*.84);

    // 輪郭の内外を同じ衣で覆い、肉の上に衣を重ねる。
    if(coat[p]){
      var rim=(n-.5)*105+slope*180+(grain[p]-.5)*30;
      r=(218+rim)*(1-burn*.66);
      g=(155-t*48+rim*.76)*(1-burn*.8);
      bcol=(72-t*45+rim*.38)*(1-burn*.84);
    }
    // 先に肉の赤みが抜け、その後に揚げ色が付く。
    var shade=(lum-.5)*45;
    var paleR=a[i]*(1-white)+(239+shade)*white;
    var paleG=a[i+1]*(1-white)+(225+shade)*white;
    var paleB=a[i+2]*(1-white)+(203+shade)*white;
    b[i]=paleR*(1-crust)+r*crust;
    b[i+1]=paleG*(1-crust)+g*crust;
    b[i+2]=paleB*(1-crust)+bcol*crust;
    b[i+3]=255;
  }
  c.putImageData(out,0,0);
}

function controls(){
  save.innerHTML=cutting?'<svg viewBox="0 0 32 32"><path d="m5 16 7 7L27 7"/></svg>':saveIcon;
  share.disabled=!!cutting;
  save.setAttribute('aria-label',cutting?'切り抜きを確定':'画像を保存');
  pick.disabled=busy;
  save.disabled=busy;
}

function reset(){
  cutting=null;cutPoints=[];cutDrawing=false;
  steam=0;
  if(liftSound){try{liftSound.stop();}catch(e){}liftSound=null;}
  state='play';
  elapsed=0;
  foodX=panX;
  foodY=plateY();
  lastBake=-1;
  oilTouch=false;
  dragging=false;
  pointerId=null;
  bake(0);
  if(volume)volume.gain.setTargetAtTime(0,AC&&AC.currentTime||0,.03);
  controls();
  draw();
}

function go(){
  if(busy)return;
  if(cutting){finishCut();return;}
  soundOn();
  foodY=oilTouch?plateY():panYPos()-8;
  updateContact();
  if(oilTouch)state='frying';
  controls();
}

function update(dt){
  clock+=dt;
  steam=Math.max(0,steam-dt);
  if(busy||cutting)return;
  updateContact();

  if(state==='play'&&oilTouch)state='frying';

  if(state==='frying'){
    var rate=oilTouch?1:0;
    elapsed=Math.min(18,elapsed+dt*rate);
    if(elapsed>0){
      bake(elapsed);
      if(rate>0 && dragging && oilTouch && volume){
        volume.gain.setTargetAtTime(.12,AC.currentTime,.05);
      } else if(volume && oilTouch){
        volume.gain.setTargetAtTime(.05,AC.currentTime,.1);
      }
      if(dragging&&oilTouch&&AC&&clock>nextPop){
        popNoise();
        nextPop=clock+0.09+hash(clock,9)*0.12;
      }
    }

    if(!dragging&&elapsed===0&&!oilTouch)state='play';
  }


  if(!volume)return;
  if(state==='frying'&&oilTouch){
    volume.gain.setTargetAtTime(.05,AC.currentTime,.1);
  } else {
    volume.gain.setTargetAtTime(0,AC.currentTime,.05);
  }
}

function liftEffect(){
  // 油を離れる瞬間だけ、短い湯気と余韻を出す。
  steam=2.4;
  if(!AC||!popBuffer)return;
  if(liftSound){try{liftSound.stop();}catch(e){}}
  var source=AC.createBufferSource();
  source.buffer=popBuffer;
  var filter=AC.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.setValueAtTime(6500,AC.currentTime);
  filter.frequency.exponentialRampToValueAtTime(700,AC.currentTime+1.1);
  var gain=AC.createGain();
  gain.gain.setValueAtTime(.001,AC.currentTime);
  gain.gain.exponentialRampToValueAtTime(.22,AC.currentTime+.04);
  gain.gain.exponentialRampToValueAtTime(.001,AC.currentTime+1.2);
  source.loop=true;
  source.connect(filter);filter.connect(gain);gain.connect(AC.destination);
  source.start();source.stop(AC.currentTime+1.25);
  liftSound=source;
  source.onended=function(){source.disconnect();filter.disconnect();gain.disconnect();if(liftSound===source)liftSound=null;};
}

function soundOn(){
  if(!window.AudioContext&&!window.webkitAudioContext)return;
  if(AC){if(AC.state!=='running'&&AC.state!=='closed')AC.resume().catch(function(){});return;}
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    AC=new C();
    var buffer=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    var d=buffer.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    hiss=AC.createBufferSource();
    hiss.buffer=buffer;
    hiss.loop=true;
    var f=AC.createBiquadFilter();
    f.type='highpass';
    f.frequency.value=1700;
    volume=AC.createGain();
    volume.gain.value=0;
    hiss.connect(f);
    f.connect(volume);
    volume.connect(AC.destination);
    hiss.start();

    var p=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);
    var dp=p.getChannelData(0);
    for(var i=0;i<dp.length;i++)dp[i]=Math.random()*2-1;
    popBuffer=p;
    if(AC.state!=='running')AC.resume().catch(function(){});
  }catch(e){}
}

function popNoise(){
  if(!AC||!popBuffer)return;
  var s=AC.createBufferSource();
  s.buffer=popBuffer;
  s.playbackRate.value=0.7+hash(clock,2)*0.8;
  var f=AC.createBiquadFilter();
  f.type='bandpass';
  f.frequency.value=2200;
  var g=AC.createGain();
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(0.06,AC.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.07);
  s.connect(f);
  f.connect(g);
  g.connect(AC.destination);
  s.start();
}

function silence(){
  if(!volume)return;
  volume.gain.setTargetAtTime(0,AC.currentTime,.03);
}

document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    focused=false;
    if(AC&&AC.state!=='closed')AC.suspend().catch(function(){});
    silence();
  } else {
    focused=true;
    if(AC&&AC.state!=='running')soundOn();
  }
});

function drawFood(image,x,y,size,angle){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle||0);
  var k=size/Math.max(image.width,image.height);
  ctx.shadowColor='rgba(70,37,10,.26)';
  ctx.shadowBlur=13;
  ctx.shadowOffsetY=8;
  ctx.drawImage(image,-image.width*k/2,-image.height*k/2,image.width*k,image.height*k);
  ctx.restore();
}

function draw(){
  if(cutting){drawCut();return;}
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#eee7db';
  ctx.fillRect(0,0,W,H);

  var py=plateY();
  panY=panYPos();
  // 鉄鍋の取っ手は胴より奥に置く。
  ctx.save();
  ctx.lineWidth=13;
  ctx.strokeStyle='#303334';
  [-1,1].forEach(function(side){
    ctx.beginPath();
    ctx.ellipse(panX+side*222,panY+5,32,25,side*.25,0,Math.PI*2);
    ctx.stroke();
    ctx.lineWidth=3;ctx.strokeStyle='#737675';ctx.stroke();
    ctx.lineWidth=13;ctx.strokeStyle='#303334';
  });
  ctx.restore();
  // 深い胴と丸い底。横方向の明暗で鉄の厚みを出す。
  var iron=ctx.createLinearGradient(panX-221,0,panX+221,0);
  iron.addColorStop(0,'#191c1e');
  iron.addColorStop(.22,'#484b4b');
  iron.addColorStop(.48,'#353839');
  iron.addColorStop(.82,'#252829');
  iron.addColorStop(1,'#131617');
  ctx.beginPath();
  ctx.moveTo(panX-221,panY);
  ctx.lineTo(panX-207,panY+85);
  ctx.ellipse(panX,panY+85,207,104,0,Math.PI,0,true);
  ctx.lineTo(panX+221,panY);
  ctx.closePath();ctx.fillStyle=iron;ctx.fill();
  oval(panX,panY,221,126,'#626765');
  oval(panX,panY-2,216,121,'#303536');
  oval(panX,panY-4,208,112,'#111617');
  var oil=ctx.createRadialGradient(248,panY-46,10,270,panY,214);
  oil.addColorStop(0,'#e3b94d');
  oil.addColorStop(.65,'#bd7e20');
  oil.addColorStop(1,'#764015');
  oval(panX,panY-4,197,104,oil);

  var px=clamp(foodX,110,W-110);
  var py2=clamp(foodY,80,H-110);
  var size=elapsed>0?foodOil:foodBase;
  var active=state==='frying'&&oilTouch;
  var image=elapsed>0?fried:original;
  var jiggle=(active&&dragging)?Math.sin(clock*16)*.014:0;
  ctx.save();
  if(oilTouch){
    // 油の中の食材は、手前の内縁より下へはみ出させない。
    ctx.beginPath();
    ctx.moveTo(0,0);ctx.lineTo(W,0);
    ctx.lineTo(W,panY-4);ctx.lineTo(panX+197,panY-4);
    ctx.ellipse(panX,panY-4,197,104,0,0,Math.PI);
    ctx.lineTo(0,panY-4);ctx.closePath();ctx.clip();
  }
  drawFood(image,px,py2,size,jiggle-(active?-0.07:0));
  ctx.restore();

  if(oilTouch){
    // 油面の内側だけ、食材の手前に油と光の揺らぎを重ねる。
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(panX,panY-4,197,104,0,0,Math.PI*2);
    ctx.clip();
    var surface=ctx.createLinearGradient(0,panY-108,0,panY+100);
    surface.addColorStop(0,'rgba(238,191,68,.20)');
    surface.addColorStop(.5,'rgba(207,139,27,.40)');
    surface.addColorStop(1,'rgba(124,69,15,.60)');
    ctx.fillStyle=surface;
    ctx.fillRect(panX-197,panY-108,394,208);
    ctx.restore();
  }

  if(steam>0){
    ctx.save();
    for(var j=0;j<12;j++){
      var age=(2.4-steam)-j*.065;
      if(age<0)continue;
      var fade=clamp(age/.15,0,1)*clamp((2.4-age)/1.6,0,1);
      var sx=px+(hash(j,31)-.5)*size*.7+Math.sin(age*2+j)*16;
      var sy=py2-size*.2-age*(40+hash(j,42)*25);
      var radius=9+age*15;
      var mist=ctx.createRadialGradient(sx,sy,0,sx,sy,radius);
      mist.addColorStop(0,'rgba(255,255,245,'+(.38*fade)+')');
      mist.addColorStop(1,'rgba(255,255,245,0)');
      oval(sx,sy,radius,radius,mist);
    }
    ctx.restore();
  }

  if(active){
    ctx.save();ctx.beginPath();
    ctx.ellipse(panX,panY-4,197,104,0,0,Math.PI*2);ctx.clip();
    var k=size/Math.max(image.width,image.height);
    var angle=jiggle+.07,cs=Math.cos(angle),sn=Math.sin(angle);
    for(var i=0;i<bubbleSeeds.length;i++){
      var seed=bubbleSeeds[i];
      var life=(clock*(1.1+hash(i,2)*.9)+hash(i,3))%1;
      var bx=px+(seed.x*cs-seed.y*sn)*k+Math.sin(life*5+i)*life*7;
      var by=py2+(seed.x*sn+seed.y*cs)*k-life*(12+hash(i,5)*18);
      var br=(1.8+hash(i,4)*4)*Math.sin(life*Math.PI);
      ctx.globalAlpha=Math.sin(life*Math.PI);
      ctx.fillStyle='rgba(255,223,139,.38)';
      ctx.strokeStyle='rgba(255,246,196,.75)';ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(bx,by,br,br*.8,0,0,Math.PI*2);
      ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }

  if(busy){
    ctx.strokeStyle='#284d43';
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(270,py,29,clock*4,clock*4+4);
    ctx.stroke();
  }
}

function makeExport(){
  exported.width=1080;
  exported.height=1080;
  var c=exported.getContext('2d');
  c.clearRect(0,0,1080,1080);
  var k=760/Math.max(fried.width,fried.height);
  c.save();
  c.translate(540,540);
  c.rotate(-0.07);
  c.shadowColor='rgba(70,37,10,.24)';
  c.shadowBlur=25;
  c.shadowOffsetY=16;
  c.drawImage(fried,-fried.width*k/2,-fried.height*k/2,fried.width*k,fried.height*k);
  c.restore();
}

function showError(message){
  error.textContent=message;
  error.hidden=false;
}

async function acceptImage(f){
  if(!f)return;
  var id=++loadId;
  error.hidden=true;
  if(f.size>25*1024*1024){
    showError('25MB以下の画像を選んでください');
    return;
  }
  if(!/^image\/(png|jpeg|webp|gif|avif|bmp)$/.test(f.type)){
    showError('PNG・JPEG・WebPなどの画像を選んでください');
    return;
  }

  busy=true;
  controls();
  var url=URL.createObjectURL(f);
  try{
    var im=new Image();
    await new Promise(function(resolve,reject){
      im.onload=resolve;
      im.onerror=reject;
      im.src=url;
    });
    if(id!==loadId)return;
    if(!im.naturalWidth||!im.naturalHeight)throw Error();

    var scale=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight));
    var next=document.createElement('canvas');
    next.width=Math.max(1,Math.round(im.naturalWidth*scale));
    next.height=Math.max(1,Math.round(im.naturalHeight*scale));
    var c=next.getContext('2d');
    c.drawImage(im,0,0,next.width,next.height);
    cutting=next;
    cutPoints=[];cutDrawing=false;dragging=false;pointerId=null;
    pendingName=f.name.replace(/\.[^.]+$/, '')||'画像';
    silence();
    draw();
  }catch(e){
    if(id===loadId)showError('画像を読み込めませんでした');
  }finally{
    URL.revokeObjectURL(url);
    if(id===loadId){
      busy=false;
      controls();
    }
  }
}

file.addEventListener('change',function(){
  acceptImage(file.files[0]);
  file.value='';
});
pick.addEventListener('click',function(){
  if(!pick.disabled)file.click();
});
again.addEventListener('click',function(){if(cutting){cutPoints=[];draw();return;}loadId++;busy=false;error.hidden=true;reset();});
save.addEventListener('click',function(){
  if(busy)return;
  if(cutting){finishCut();return;}
  bake(elapsed);
  makeExport();
  var downloadName=imageName+'のから揚げ.png';
  // タップ直後の権限を保ったまま、画像ファイルを共有する。
  var encoded=atob(exported.toDataURL('image/png').split(',')[1]);
  var bytes=new Uint8Array(encoded.length);
  for(var i=0;i<encoded.length;i++)bytes[i]=encoded.charCodeAt(i);
  var blob=new File([bytes],downloadName,{type:'image/png'});
  function download(){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=downloadName;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
  }
  var nav=window.navigator;
  if(nav&&nav.share&&nav.canShare&&nav.canShare({files:[blob]})){
    nav.share({files:[blob]}).catch(function(e){
      if(e.name!=='AbortError')download();
    });
  }else download();
});
share.addEventListener('click',function(){
  if(cutting)return;
  zShare({text:'',native:false});
});

document.addEventListener('pointercancel',function(){
  if(cutting){cutDrawing=false;cutPoints=[];}
  pointerId=null;
  dragging=false;
  if(volume)silence();
});

function cutBox(){
  var k=Math.min((W-60)/cutting.width,(H-80)/cutting.height);
  return {k:k,x:(W-cutting.width*k)/2,y:(H-cutting.height*k)/2};
}
function drawCut(){
  ctx.fillStyle='#eee7db';ctx.fillRect(0,0,W,H);
  var r=cutBox();
  ctx.drawImage(cutting,r.x,r.y,cutting.width*r.k,cutting.height*r.k);
  if(cutPoints.length){
    ctx.beginPath();
    cutPoints.forEach(function(p,i){if(i)ctx.lineTo(r.x+p.x*r.k,r.y+p.y*r.k);else ctx.moveTo(r.x+p.x*r.k,r.y+p.y*r.k);});
    if(!cutDrawing)ctx.closePath();
    ctx.fillStyle='rgba(255,210,70,.18)';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();
    ctx.strokeStyle='#284d43';ctx.lineWidth=2;ctx.stroke();
  }
}
function cutPoint(e){var p=pointerPos(e),r=cutBox();return {x:clamp((p.x-r.x)/r.k,0,cutting.width),y:clamp((p.y-r.y)/r.k,0,cutting.height)};}
function finishCut(){
  var next=document.createElement('canvas');next.width=cutting.width;next.height=cutting.height;
  var c=next.getContext('2d');
  if(cutPoints.length>=3){c.beginPath();cutPoints.forEach(function(p,i){if(i)c.lineTo(p.x,p.y);else c.moveTo(p.x,p.y);});c.closePath();c.clip();}
  c.drawImage(cutting,0,0);
  var data=c.getImageData(0,0,next.width,next.height).data;
  var x0=next.width,y0=next.height,x1=-1,y1=-1;
  for(var y=0;y<next.height;y++)for(var x=0;x<next.width;x++)if(data[(y*next.width+x)*4+3]>15){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  if(x1<x0||y1<y0){cutPoints=[];return;}
  original.width=x1-x0+1;original.height=y1-y0+1;
  original.getContext('2d').drawImage(next,x0,y0,original.width,original.height,0,0,original.width,original.height);
  imageName=pendingName;prepare();reset();
}

function pointerPos(ev){
  var r=canvas.getBoundingClientRect();
  return{
    x:(ev.clientX-r.left)/r.width*W,
    y:(ev.clientY-r.top)/r.height*H
  };
}

wrap.addEventListener('pointerdown',function(e){
  if(e.target!==canvas||e.isPrimary===false||e.button>0||busy)return;
  if(cutting){cutPoints=[cutPoint(e)];cutDrawing=true;pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);draw();return;}
  dragging=true;
  pointerId=e.pointerId;
  soundOn();
  var p=pointerPos(e);
  dragDx=p.x-foodX;
  dragDy=p.y-foodY;
  foodX=p.x-dragDx;
  foodY=p.y-dragDy;
  updateContact();
  if(state==='play'&&oilTouch)state='frying';
  controls();
});

wrap.addEventListener('pointermove',function(e){
  if(cutting&&cutDrawing&&pointerId===e.pointerId){cutPoints.push(cutPoint(e));draw();return;}
  if(!dragging||pointerId!==e.pointerId)return;
  e.preventDefault();
  var p=pointerPos(e);
  foodX=clamp(p.x-dragDx,60,W-60);
  foodY=clamp(p.y-dragDy,120,H-110);
  updateContact();
  if(state==='play'&&oilTouch)state='frying';
});

wrap.addEventListener('pointerup',function(e){
  if(cutting&&cutDrawing&&pointerId===e.pointerId){cutDrawing=false;pointerId=null;if(cutPoints.length<3)cutPoints=[];draw();return;}
  if(!dragging||pointerId!==e.pointerId)return;
  dragging=false;
  pointerId=null;
  updateContact();
  if(state==='frying'&&!oilTouch&&elapsed===0)state='play';
  controls();
  if(volume)volume.gain.setTargetAtTime(0,AC&&AC.currentTime||0,.05);
});

window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    e.preventDefault();
    if(!e.repeat){
      loadId++;
      busy=false;
      error.hidden=true;
      reset();
    }
    return;
  }
  if(e.code==='Space'||e.key===' '||e.key==='Enter'){
    if(e.target&&e.target.tagName==='BUTTON')return;
    e.preventDefault();
    if(!e.repeat)go();
  }
});

window.addEventListener('blur',function(){
  focused=false;
  pointerId=null;
  dragging=false;
  if(AC&&AC.state!=='closed')AC.suspend().catch(function(){});
  silence();
});

window.__probe={
  now:function(){
    return {
      state:state,
      seconds:elapsed,
      W:W,
      H:H,
      busy:busy,
      imageWidth:original.width,
      imageHeight:original.height,
      foodX:foodX,
      foodY:foodY,
      steam:steam,
      canPick:!pick.disabled,
      oil:oilTouch
    };
  },
  step:function(n){
    for(var i=0;i<(n||1);i++)update(1/60);
    draw();
  },
  reset:reset
};

/* ============ ループ ============ */
sample();
controls();
layout();
reset();
var last=performance.now();
function loop(now){
  var dt=Math.min(.033,(now-last)/1000);
  last=now;
  if(!document.hidden&&!window.__recordManual){
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
