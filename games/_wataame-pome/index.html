<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わたあめポメ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #24304a; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* わたあめポメ

   上から見た綿あめ機。真ん中から出る綿あめの糸を、白いポメを指で連れてぐるぐる回って巻き取る。
   真ん中の熱い頭に触ると溶け、速く回りすぎると外側が飛び散る。
   砂糖がなくなったときの直径(cm)が結果。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, hum = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  /* 綿あめ機のうなり。回っている間だけ鳴らす */
  function humOn() {
    if (!AC || !NOISE || hum) return;
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 520; f.Q.value = 2.5;
    var o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = 92;
    var of = AC.createBiquadFilter(); of.type = "lowpass"; of.frequency.value = 300;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.09, n + 0.4);
    s.connect(f); f.connect(g); o.connect(of); of.connect(g); g.connect(AC.destination);
    s.start(n); o.start(n);
    hum = { s: s, o: o, g: g };
  }
  function humOff() {
    if (!hum) return;
    var n = AC.currentTime, h = hum; hum = null;
    h.g.gain.cancelScheduledValues(n);
    h.g.gain.setValueAtTime(h.g.gain.value, n);
    h.g.gain.exponentialRampToValueAtTime(0.0001, n + 0.6);
    h.s.stop(n + 0.7); h.o.stop(n + 0.7);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 綿あめ機 ============
     上から見た綿あめ機。真ん中の回る頭から綿あめの糸が四方へ出てくる。
     糸は向きごとの区画にたまり、ポメが通ると巻き取られてポメが大きくなる。
     同じ所にいると、その向きの分しか取れないので、ぐるぐる回るほど大きくなる。
     長さの単位は cm。 */
  var N = 48, DTH = Math.PI * 2 / N;
  var R0 = 14;                     /* ポメ本体（毛こみ）の半径 */
  var BOWL = 32;                   /* 鍋の半径 */
  var HEAD = 7;                    /* 真ん中の回る頭の半径（触ると綿あめが溶ける） */
  var TOTAL = 30;                  /* 砂糖がなくなるまでの秒数 */
  var CAP = 1.1;                   /* 1区画にたまる上限（何秒分の糸か） */
  var FAST = 2.4;                  /* これより速く（1秒に何周）回ると外側が飛び散る */
  function feedRate(t) { return 320 + 1500 * Math.min(1, t / TOTAL); }   /* 1秒に出る綿あめの面積 cm² */

  var S = { INTRO: "intro", PLAY: "play", END: "end", RESULT: "result" };
  var state, T, held, keyMode = false;
  var sec = new Float32Array(N);   /* 向きごとにたまっている綿あめの面積 */
  var px, py, tx, ty, A, roll, spinRate, lastAng, keyDir;
  var camR, endT, score, wisps, steam, flingCool, meltCool, melted, flung;

  /* 綿の模様（ポメに貼りついて転がる細い筋）。毎回同じ形にする */
  var STRANDS = [];
  (function () {
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 200; i++) STRANDS.push({ a: rnd() * Math.PI * 2, r: rnd(), len: 0.3 + rnd() * 0.6, w: 1 + rnd() * 1.6, dark: rnd() < 0.45 });
  })();

  var CX, CY;
  function place() { CX = W / 2; CY = Math.round(H * 0.46); }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; held = false; keyDir = 0;
    for (var i = 0; i < N; i++) sec[i] = 0;
    px = 0; py = 26; tx = px; ty = py;
    A = Math.PI * R0 * R0; roll = 0; spinRate = 0; lastAng = Math.atan2(py, px);
    camR = 48; endT = 0; score = 0; melted = 0; flung = 0;
    wisps = []; steam = []; flingCool = 0; meltCool = 0;
    humOn();
  }

  function rad() { return Math.sqrt(A / Math.PI); }
  function diameter() { return 2 * rad(); }
  function wrapA(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }

  /* ============ 進行 ============ */
  function update(dt) {
    var r = rad();
    if (state === S.INTRO) { T += dt; return; }
    updateParts(dt);
    camR += (Math.max(48, Math.hypot(px, py) + r + 8) - camR) * Math.min(1, dt * 2.5);
    if (state === S.END) {
      endT += dt;
      if (endT > 1.6) toResult();
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;

    /* ポメは指を追う。キーのときは今の距離のまま真ん中のまわりを回る */
    if (!held && keyDir) {
      var d0 = Math.max(HEAD + r + 4, Math.hypot(px, py)), a0 = Math.atan2(py, px) + keyDir * Math.PI * 2 * 0.9 * dt;
      tx = Math.cos(a0) * d0; ty = Math.sin(a0) * d0;
    }
    var k = Math.min(1, dt * 18), ox = px, oy = py;
    px += (tx - px) * k; py += (ty - py) * k;
    roll += Math.hypot(px - ox, py - oy) / r * (px * (py - oy) - py * (px - ox) >= 0 ? 1 : -1);

    /* 真ん中のまわりを1秒に何周しているか */
    var ang = Math.atan2(py, px), da = wrapA(ang - lastAng); lastAng = ang;
    spinRate += (Math.abs(da) / dt / (Math.PI * 2) - spinRate) * Math.min(1, dt * 6);

    /* 糸が出て、向きごとにたまる */
    var feeding = T < TOTAL;
    if (feeding) {
      var add = feedRate(T) * dt / N, cap = feedRate(T) * CAP / N;
      for (var i = 0; i < N; i++) sec[i] = Math.min(cap, sec[i] + add);
    }

    /* ポメにかかっている向きの糸を巻き取る */
    var dist = Math.hypot(px, py);
    var half = dist > r ? Math.asin(Math.min(1, r / dist)) : Math.PI;
    var got = 0;
    for (i = 0; i < N; i++) {
      if (Math.abs(wrapA(i * DTH + DTH / 2 - ang)) <= half) { got += sec[i]; sec[i] = 0; }
    }
    A += got;

    /* 回しすぎ：外側の綿が飛び散る */
    flingCool -= dt;
    if (spinRate > FAST && A > Math.PI * R0 * R0 * 1.2) {
      var loss = Math.min(A - Math.PI * R0 * R0, A * (spinRate - FAST) * 0.9 * dt);
      A -= loss; flung += loss;
      for (var w = 0; w < 3; w++) if (Math.random() < 0.7) spawnWisp();
      if (flingCool <= 0) { flingCool = 0.18; noiseHit(0.2, 2600, 0.08, 0.8); }
    }

    /* 真ん中の熱い頭に触ると溶ける */
    meltCool -= dt;
    r = rad();
    if (dist - r < HEAD) {
      var m = Math.min(A - Math.PI * R0 * R0, 2600 * dt);
      if (m > 0) { A -= m; melted += m; }
      if (Math.random() < 0.6) steam.push({ x: px - Math.cos(ang) * r, y: py - Math.sin(ang) * r, life: 0.7, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 30 });
      if (meltCool <= 0) { meltCool = 0.22; noiseHit(0.25, 4200, 0.12, 0.6); }
    }

    if (!feeding) { state = S.END; endT = 0; humOff(); tone(880, 0.25, 0.12, "triangle"); tone(1320, 0.4, 0.1, "triangle", null, 0.12); }
  }

  function spawnWisp() {
    var r = rad(), ang = Math.atan2(py, px), side = Math.random() * Math.PI * 2;
    var tdir = ang + Math.PI / 2;
    var sp = spinRate * Math.PI * 2 * Math.hypot(px, py);
    wisps.push({ x: px + Math.cos(side) * r, y: py + Math.sin(side) * r, vx: Math.cos(tdir) * sp * 0.6 + Math.cos(side) * 80, vy: Math.sin(tdir) * sp * 0.6 + Math.sin(side) * 80, life: 0.7 });
  }
  function updateParts(dt) {
    var i;
    for (i = wisps.length - 1; i >= 0; i--) {
      var w = wisps[i];
      w.life -= dt; w.x += w.vx * dt; w.y += w.vy * dt;
      w.vx *= Math.exp(-2.5 * dt); w.vy *= Math.exp(-2.5 * dt);
      if (w.life <= 0) wisps.splice(i, 1);
    }
    for (i = steam.length - 1; i >= 0; i--) {
      var s = steam[i];
      s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.life <= 0) steam.splice(i, 1);
    }
    if (wisps.length > 200) wisps.splice(0, wisps.length - 200);
    if (steam.length > 80) steam.splice(0, steam.length - 80);
  }

  function toResult() {
    state = S.RESULT;
    score = Math.round(diameter());
    tone(660, 0.12, 0.1, "square"); tone(990, 0.3, 0.1, "square", null, 0.1);
  }

  /* ============ 入力 ============ */
  var scale = 1;   /* 1cm が何ピクセルか */
  function toWorld(x, y) { return { x: (x - CX) / scale, y: (y - CY) / scale }; }
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    if (x == null) { keyDir = 1; return; }
    held = true;
    var p = toWorld(x, y); tx = p.x; ty = p.y;
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    var p = toWorld(x, y); tx = p.x; ty = p.y;
  }
  function up() {
    keyDir = 0;
    if (!held) return;
    held = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外だけ、数字キーで場面を飛ばせる */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function bigPom(d) { A = Math.PI * d * d / 4; var a = Math.atan2(py, px), dd = HEAD + d / 2 + 6; px = tx = Math.cos(a) * dd; py = ty = Math.sin(a) * dd; lastAng = a; }
  function debugKey(n) {
    if (n === 1) { if (state !== S.PLAY) newRound(); bigPom(180); T = TOTAL; }      /* 1: 大きくして終わり */
    if (n === 2) { if (state !== S.PLAY) newRound(); T = TOTAL - 3; }                /* 2: 砂糖があと3秒 */
    if (n === 3) { if (state !== S.PLAY) newRound(); bigPom(140); }                  /* 3: 大きくする */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state === S.PLAY) keyDir = right ? 1 : -1;
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || /^[aAdD]$/.test(e.key)) keyDir = 0;
  });

  function doShare() {
    var d = score;
    var ja = d >= 200 ? "ポメラニアンを直径" + d + "cmの綿あめにしてドアを通れなくした"
      : d >= 120 ? "ポメラニアンを直径" + d + "cmの綿あめにして抱っこできなくした"
      : "ポメラニアンを直径" + d + "cmの綿あめにした";
    var en = d >= 200 ? "Turned a Pomeranian into a " + d + "cm cotton candy. It no longer fits through the door."
      : d >= 120 ? "Turned a Pomeranian into a " + d + "cm cotton candy. Too big to hug now."
      : "Turned a Pomeranian into a " + d + "cm cotton candy.";
    window.zResultActions.x({ text: zT(ja, en) + zT(" #わたあめポメ", " #CottonCandyPom") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    scale = Math.min(W * 0.47, H * 0.40) / (camR || 48);

    /* 夜店の台の上（上から見ている） */
    ctx.fillStyle = "#24304a"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.03)";
    for (var y = 0; y < H; y += 46) ctx.fillRect(0, y, W, 23);

    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(scale, scale);
    drawMachine();
    drawThreads();
    drawSteam();
    drawPom();
    drawWisps();
    ctx.restore();

    if (state === S.RESULT) drawResult();
  }

  function drawMachine() {
    /* 鍋 */
    var g = ctx.createRadialGradient(0, 0, HEAD, 0, 0, BOWL);
    g.addColorStop(0, "#56607a"); g.addColorStop(1, "#3a4258");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, BOWL, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#c9cfdb"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, BOWL, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(0, 0, BOWL - 1.6, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
    /* 回る頭。中の砂糖が減っていく。熱いので赤く光る */
    var left = state === S.INTRO ? 1 : Math.max(0, 1 - T / TOTAL);
    var hot = ctx.createRadialGradient(0, 0, 0, 0, 0, HEAD * 1.8);
    hot.addColorStop(0, "rgba(255,120,60,.45)"); hot.addColorStop(1, "rgba(255,120,60,0)");
    ctx.fillStyle = hot; ctx.beginPath(); ctx.arc(0, 0, HEAD * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b9c0cc";
    ctx.beginPath(); ctx.arc(0, 0, HEAD, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a92a2";
    var now = performance.now() / 1000;
    for (var i = 0; i < 12; i++) {
      var a = i / 12 * Math.PI * 2 + now * 9;
      ctx.beginPath(); ctx.arc(Math.cos(a) * HEAD * 0.86, Math.sin(a) * HEAD * 0.86, 0.5, 0, Math.PI * 2); ctx.fill();
    }
    if (left > 0) {
      ctx.fillStyle = "#f4f4f6";
      ctx.beginPath(); ctx.arc(0, 0, HEAD * 0.7 * Math.sqrt(left), 0, Math.PI * 2); ctx.fill();
    }
  }

  /* 真ん中から四方へ出る糸。たまっている向きほど濃く長く見える */
  function drawThreads() {
    var cap = feedRate(T) * CAP / N, now = performance.now() / 1000;
    var reach = Math.max(BOWL * 1.05, Math.hypot(px, py) + rad() * 0.3);
    ctx.lineCap = "round";
    for (var i = 0; i < N; i++) {
      var fill = state === S.INTRO ? 0.4 : sec[i] / cap;
      if (fill < 0.03) continue;
      var a = i * DTH + DTH / 2;
      for (var j = 0; j < 2; j++) {
        var aa = a + (j - 0.5) * DTH * 0.5 + Math.sin(now * 7 + i * 3 + j) * 0.04;
        var len = HEAD + (reach - HEAD) * Math.min(1, fill * (0.7 + j * 0.3));
        var bend = Math.sin(now * 5 + i + j * 2) * 0.12;
        ctx.strokeStyle = "rgba(255,255,255," + (0.15 + fill * 0.45) + ")";
        ctx.lineWidth = 0.5 + fill * 0.9;
        ctx.beginPath();
        ctx.moveTo(Math.cos(aa) * HEAD, Math.sin(aa) * HEAD);
        ctx.quadraticCurveTo(Math.cos(aa + bend) * (HEAD + len) / 2, Math.sin(aa + bend) * (HEAD + len) / 2, Math.cos(aa) * len, Math.sin(aa) * len);
        ctx.stroke();
      }
    }
  }

  function drawPom() {
    var r = rad();
    ctx.save();
    ctx.translate(px, py);
    /* 影 */
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.ellipse(r * 0.08, r * 0.12, r * 1.02, r * 1.0, 0, 0, Math.PI * 2); ctx.fill();
    /* 綿あめ（ポメに巻きついた白い綿）。転がった分だけ模様が回る */
    if (r > R0 + 0.5) {
      ctx.save();
      ctx.rotate(roll);
      var g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.75, "#f2f3f7"); g.addColorStop(1, "#d9dce6");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.94, 0, Math.PI * 2); ctx.fill();
      var bumps = Math.max(14, Math.min(40, Math.round(r / 2.2)));
      for (var i = 0; i < bumps; i++) {
        var a = i / bumps * Math.PI * 2, br = r * 0.14 + 1;
        ctx.fillStyle = i % 2 ? "#f6f7fa" : "#e9ebf1";
        ctx.beginPath(); ctx.arc(Math.cos(a) * (r - br * 0.8), Math.sin(a) * (r - br * 0.8), br, 0, Math.PI * 2); ctx.fill();
      }
      ctx.lineCap = "round";
      for (i = 0; i < STRANDS.length; i++) {
        var s = STRANDS[i], rr = R0 + (r - R0) * (0.1 + s.r * 0.8);
        if (rr < R0 + 2) continue;
        ctx.strokeStyle = s.dark ? "rgba(170,175,195,.35)" : "rgba(255,255,255,.9)";
        ctx.lineWidth = s.w * Math.max(0.6, r / 50);
        ctx.beginPath(); ctx.arc(0, 0, rr, s.a, s.a + s.len * Math.min(1, 24 / rr + 0.15)); ctx.stroke();
      }
      ctx.restore();
    }
    drawPomFace(R0);
    ctx.restore();
  }

  /* 白いポメ（上を見上げている顔） */
  function drawPomFace(R) {
    ctx.save();
    var t = performance.now() / 1000;
    /* 耳 */
    [-1, 1].forEach(function (s) {
      ctx.fillStyle = "#f4f2ee";
      ctx.beginPath(); ctx.moveTo(s * R * 0.12, -R * 0.7); ctx.quadraticCurveTo(s * R * 0.5, -R * 1.45, s * R * 0.72, -R * 1.32); ctx.quadraticCurveTo(s * R * 0.95, -R * 0.9, s * R * 0.8, -R * 0.35); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f2c9c4";
      ctx.beginPath(); ctx.moveTo(s * R * 0.3, -R * 0.75); ctx.quadraticCurveTo(s * R * 0.55, -R * 1.2, s * R * 0.68, -R * 1.15); ctx.quadraticCurveTo(s * R * 0.8, -R * 0.85, s * R * 0.7, -R * 0.55); ctx.closePath(); ctx.fill();
    });
    /* ふさふさの毛 */
    ctx.beginPath();
    for (var i = 0; i <= 40; i++) {
      var th = i / 40 * Math.PI * 2, r = R * (i % 2 ? 0.88 : 1.02);
      if (i === 0) ctx.moveTo(Math.cos(th) * r, Math.sin(th) * r); else ctx.lineTo(Math.cos(th) * r, Math.sin(th) * r);
    }
    ctx.closePath();
    ctx.fillStyle = "#faf9f6"; ctx.fill();
    ctx.strokeStyle = "rgba(150,150,170,.5)"; ctx.lineWidth = R * 0.03; ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, R * 0.12, R * 0.62, 0, Math.PI * 2); ctx.fill();
    /* 目。速く回ったり溶けたりすると目が回る */
    var dizzy = spinRate > FAST * 0.85 || state === S.END;
    ctx.strokeStyle = "#1a1210"; ctx.fillStyle = "#1a1210"; ctx.lineWidth = R * 0.06; ctx.lineCap = "round";
    [-1, 1].forEach(function (s) {
      var ex = s * R * 0.32, ey = -R * 0.04;
      if (dizzy) {
        ctx.beginPath();
        for (var k = 0; k < 20; k++) { var a = k * 0.6 + s * t * 8, rr = R * 0.012 * k; var x = ex + Math.cos(a) * rr, y = ey + Math.sin(a) * rr; if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
        ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(ex, ey, R * 0.11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex + R * 0.035, ey - R * 0.045, R * 0.04, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#1a1210";
      }
    });
    /* 鼻と口 */
    ctx.beginPath(); ctx.ellipse(0, R * 0.2, R * 0.1, R * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = R * 0.05;
    ctx.beginPath(); ctx.moveTo(-R * 0.18, R * 0.34); ctx.quadraticCurveTo(-R * 0.09, R * 0.42, 0, R * 0.3); ctx.quadraticCurveTo(R * 0.09, R * 0.42, R * 0.18, R * 0.34); ctx.stroke();
    ctx.fillStyle = "#e8848a";
    ctx.beginPath(); ctx.ellipse(0, R * 0.44, R * 0.08, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawWisps() {
    ctx.lineCap = "round";
    wisps.forEach(function (w) {
      ctx.strokeStyle = "rgba(255,255,255," + Math.max(0, w.life) + ")";
      ctx.lineWidth = 3 / scale;
      ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x - w.vx * 0.04, w.y - w.vy * 0.04); ctx.stroke();
    });
  }
  function drawSteam() {
    steam.forEach(function (s) {
      ctx.fillStyle = "rgba(255,200,170," + Math.max(0, s.life * 0.5) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, 2 + (0.7 - s.life) * 6, 0, Math.PI * 2); ctx.fill();
    });
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    ctx.font = "800 108px sans-serif";
    var num = String(score), nw = ctx.measureText(num).width;
    ctx.font = "800 52px sans-serif";
    var uw = ctx.measureText("cm").width;
    var x0 = W / 2 - (nw + 8 + uw) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif"; ctx.fillText(num, x0, H * 0.45);
    ctx.font = "800 52px sans-serif"; ctx.fillText("cm", x0 + nw + 8, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, T: T, diameter: diameter(), spin: spinRate, melted: melted, flung: flung, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    /* テスト用：指の代わりに、真ん中から d cm の所を1秒に w 周で回す */
    orbit: function (w, d) { held = true; var a = Math.atan2(py, px) + w * Math.PI * 2 / 60; tx = Math.cos(a) * d; ty = Math.sin(a) * d; }
  };
  window.__thumbnail = function () { newRound(); bigPom(110); T = 12; camR = Math.hypot(px, py) + 55 + 8; };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 40)) throw Error("結果が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); tone(900, 0.12, 0.12, "triangle", 1400); tone(1100, 0.14, 0.1, "triangle", 1700, 0.13); });
  newRound(); humOff(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  recorderScript.src = "../_tools/recorder-ui.js";
