<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わたあめポメ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #ff8fbf; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* わたあめポメ

   真ん中のポメに、外側から指を回してスプレーを吹き付け、ハサミで刈ってオリジナルのポメラニアンにする。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, hum = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  /* 綿あめ機のうなり。回っている間だけ鳴らす */
  function humOn() {
    if (!AC || !NOISE || hum) return;
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 520; f.Q.value = 2.5;
    var o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = 92;
    var of = AC.createBiquadFilter(); of.type = "lowpass"; of.frequency.value = 300;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.09, n + 0.4);
    s.connect(f); f.connect(g); o.connect(of); of.connect(g); g.connect(AC.destination);
    s.start(n); o.start(n);
    hum = { s: s, o: o, g: g };
  }
  function humOff() {
    if (!hum) return;
    var n = AC.currentTime, h = hum; hum = null;
    h.g.gain.cancelScheduledValues(n);
    h.g.gain.setValueAtTime(h.g.gain.value, n);
    h.g.gain.exponentialRampToValueAtTime(0.0001, n + 0.6);
    h.s.stop(n + 0.7); h.o.stop(n + 0.7);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 遊び ============
     綿あめ機の真ん中で回っているポメに、スプレー（綿あめを吹き付けて伸ばす）と
     ハサミ（なぞった所を刈る）でオリジナルのポメラニアンを作る。
     「完成」で、いちばん長い差し渡し(cm)が結果。 */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, held, keyMode = false;
  var tool = "spray", pointer = null, barkT, grown, barkAcc, snipT, blinkT, puffs, bits;
  /* ポメの形：正面から見た升目（1升 CS cm）。1 が綿。真ん中が中心で、上が +y。
     アフロ盆栽と同じく、ハサミはなぞった所の升目を消し、指を離すと体とつながっていない綿が落ちる */
  var NG = 240, CS = 2, START = 15, BODY = 11;
  var fl = new Uint8Array(NG * NG), farR = START, fluffN = 0, dirty = true;
  function cellAt(x, y) { var i = Math.floor(x / CS + NG / 2), j = Math.floor(NG / 2 - y / CS); return i < 0 || j < 0 || i >= NG || j >= NG ? -1 : j * NG + i; }
  function cellX(k) { return ((k % NG) + 0.5 - NG / 2) * CS; }
  function cellY(k) { return (NG / 2 - ((k / NG) | 0) - 0.5) * CS; }
  function isBody(k) { return Math.hypot(cellX(k), cellY(k)) < BODY; }
  /* 中心 (x, y) 半径 r の円の升目を埋める。増えた升目の数 */
  function fillDisk(x, y, r) {
    var n = 0, i0 = Math.floor((x - r) / CS + NG / 2), i1 = Math.floor((x + r) / CS + NG / 2), j0 = Math.floor(NG / 2 - (y + r) / CS), j1 = Math.floor(NG / 2 - (y - r) / CS);
    for (var j = Math.max(0, j0); j <= Math.min(NG - 1, j1); j++) for (var i = Math.max(0, i0); i <= Math.min(NG - 1, i1); i++) {
      var k = j * NG + i;
      if (fl[k] || Math.hypot(cellX(k) - x, cellY(k) - y) > r) continue;
      fl[k] = 1; n++;
    }
    if (n) { fluffN += n; dirty = true; }
    return n;
  }
  function measure() {
    farR = START;
    var x0 = 0, x1 = 0, y0 = 0, y1 = 0;
    for (var k = 0; k < fl.length; k++) if (fl[k]) {
      var x = cellX(k), y = cellY(k), d = Math.hypot(x, y) + CS;
      if (d > farR) farR = d;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    sizeCm = Math.max(x1 - x0, y1 - y0) + CS;
  }
  var sizeCm = START * 2;
  function size() { return sizeCm; }
  /* 中心から向き a へ進んで、綿の外側の縁までの距離 */
  function edgeAt(a) {
    var r = 0, c = Math.cos(a), s = Math.sin(a);
    for (var d = 0; d < farR + CS; d += CS * 0.5) { var k = cellAt(c * d, s * d); if (k >= 0 && fl[k]) r = d; }
    return r;
  }

  /* ポメの中心の画面の位置 */
  function pomScreen() { return { x: W / 2, y: CY }; }
  /* 1cm が何ピクセルか。綿が大きくなるほど引いて全体を見せる */
  var viewR = 44;
  function pxPerCm() { return Math.min(W * 0.46, H * 0.33) / viewR; }
  /* 画面の点 → ポメの中心からの (x, 上が+y) cm */
  function toPom(x, y) {
    var k = pxPerCm();
    return { x: (x - W / 2) / k, y: (CY - y) / k };
  }

  /* スプレー：指からポメの中心へ吹き付ける。指から中心へ向かって最初に当たった綿の上に、指の側へ綿を盛る。
     指が綿の中なら何もしない。1回に盛る量は大きさに合わせて増やす */
  var sprayAcc = 0;
  function spray(p, dt) {
    sprayAcc += dt;
    if (sprayAcc < 1 / 24) return 0;
    sprayAcc = 0;
    var d = Math.hypot(p.x, p.y), k0 = cellAt(p.x, p.y);
    if (k0 >= 0 && fl[k0]) return 0;
    var ux = -p.x / d, uy = -p.y / d, t, hx = 0, hy = 0;
    for (t = 0; t < d; t += CS * 0.5) {
      var k = cellAt(p.x + ux * t, p.y + uy * t);
      if (k >= 0 && fl[k]) { hx = p.x + ux * t; hy = p.y + uy * t; break; }
    }
    var r = Math.max(7, farR * 0.16), step = Math.min(CS * 0.6, Math.max(0, t - r * 0.3));   /* 少しずつ層を重ねる */
    return fillDisk(hx - ux * step, hy - uy * step, r);
  }
  /* ハサミ：なぞった線の上の升目を消す（体は切れない） */
  function carve(a, b) {
    var r = Math.max(2.4, farR * 0.035), n = 0;
    var steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / (CS * 0.5)));
    for (var s2 = 0; s2 <= steps; s2++) {
      var x = a.x + (b.x - a.x) * s2 / steps, y = a.y + (b.y - a.y) * s2 / steps;
      var i0 = Math.floor((x - r) / CS + NG / 2), i1 = Math.floor((x + r) / CS + NG / 2), j0 = Math.floor(NG / 2 - (y + r) / CS), j1 = Math.floor(NG / 2 - (y - r) / CS);
      for (var j = Math.max(0, j0); j <= Math.min(NG - 1, j1); j++) for (var i = Math.max(0, i0); i <= Math.min(NG - 1, i1); i++) {
        var k = j * NG + i;
        if (!fl[k] || isBody(k) || Math.hypot(cellX(k) - x, cellY(k) - y) > r) continue;
        fl[k] = 0; n++;
      }
    }
    if (n) { fluffN -= n; dirty = true; }
    return n;
  }
  /* 体とつながらなくなった綿を落とす */
  function settle() {
    var keep = new Uint8Array(NG * NG), q = [], k;
    for (k = 0; k < fl.length; k++) if (fl[k] && isBody(k)) { keep[k] = 1; q.push(k); }
    while (q.length) {
      k = q.pop(); var i = k % NG, j = (k / NG) | 0;
      if (i > 0 && fl[k - 1] && !keep[k - 1]) { keep[k - 1] = 1; q.push(k - 1); }
      if (i < NG - 1 && fl[k + 1] && !keep[k + 1]) { keep[k + 1] = 1; q.push(k + 1); }
      if (j > 0 && fl[k - NG] && !keep[k - NG]) { keep[k - NG] = 1; q.push(k - NG); }
      if (j < NG - 1 && fl[k + NG] && !keep[k + NG]) { keep[k + NG] = 1; q.push(k + NG); }
    }
    var fall = new Uint8Array(NG * NG), n = 0;
    for (k = 0; k < fl.length; k++) if (fl[k] && !keep[k]) { fall[k] = 1; fl[k] = 0; n++; }
    if (n) { fluffN -= n; dirty = true; dropChunk(fall); }
    return n;
  }

  var CX, CY;
  function place() { CX = W / 2; CY = Math.round(H * 0.42); }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; held = false; pointer = null; tool = "spray";
    barkT = 1; grown = 0; barkAcc = 0; snipT = 0; blinkT = 3; puffs = []; bits = []; score = 0;
    fl.fill(0); fluffN = 0; chunks = []; stroke = null;
    fillDisk(0, 0, START); measure();
    humOn();
  }
  var score = 0;

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt; barkT += dt; snipT -= dt; blinkT -= dt;
    if (blinkT < -0.12) blinkT = 2 + Math.random() * 3;
    updateParts(dt);
    if (state !== S.PLAY) return;
    if (held && pointer) {
      var pp = toPom(pointer.x, pointer.y);
      if (tool === "spray") {
        var r = { amount: spray(pp, dt) * CS * CS };
        /* 指からポメの中心へ向かって飛ぶ霧 */
        var c = pomScreen(), vx = c.x - pointer.x, vy = c.y - pointer.y, vl = Math.hypot(vx, vy) || 1;
        for (var i = 0; i < 3; i++) puffs.push({ x: pointer.x + (Math.random() - 0.5) * 16, y: pointer.y + (Math.random() - 0.5) * 16, vx: vx / vl * 420 + (Math.random() - 0.5) * 120, vy: vy / vl * 420 + (Math.random() - 0.5) * 120, life: 0.45, s: 3 + Math.random() * 5 });
        if (r.amount > 0) { grown += r.amount; barkAcc += r.amount; }
        /* 綿が一定量ふくらむたびに「ワン」 */
        if (barkAcc > 160 && barkT > 0.25) { barkAcc = 0; bark(); barkT = 0; }
      }
    }
  }

  function updateParts(dt) {
    var i;
    for (i = puffs.length - 1; i >= 0; i--) { var p = puffs[i]; p.life -= dt; p.s += dt * 20; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) puffs.splice(i, 1); }
    for (i = bits.length - 1; i >= 0; i--) {
      var b = bits[i]; b.life -= dt; b.vy += 600 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.life <= 0) bits.splice(i, 1);
    }
    if (puffs.length > 120) puffs.splice(0, puffs.length - 120);
    if (bits.length > 80) bits.splice(0, bits.length - 80);
    for (i = chunks.length - 1; i >= 0; i--) {
      var c = chunks[i]; c.vy += 1400 * dt; c.dx += c.vx * dt; c.dy += c.vy * dt; c.rot += c.vr * dt; c.t += dt;
      if (c.t > 2) chunks.splice(i, 1);
    }
  }

  /* わん。のこぎり波を口の形（2つの山の帯域）に通して、高さを下げながら短く鳴らす */
  function bark() {
    if (!AC) return;
    var d = size(), p = Math.max(170, 620 * Math.pow(28 / Math.max(28, d), 0.45)) * (0.92 + Math.random() * 0.16);
    var n = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(p * 0.8, n);
    o.frequency.linearRampToValueAtTime(p * 1.15, n + 0.04);
    o.frequency.exponentialRampToValueAtTime(p * 0.6, n + 0.13);
    var f1 = AC.createBiquadFilter(); f1.type = "bandpass"; f1.frequency.value = p * 1.6; f1.Q.value = 3;
    var f2 = AC.createBiquadFilter(); f2.type = "bandpass"; f2.frequency.value = p * 4; f2.Q.value = 4;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.9, n + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, n + 0.14);
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + 0.17);
    noiseHit(0.05, p * 3, 0.15, 1.5);
  }

  /* ハサミの音：短い金属の擦れ2つ */
  function snip() {
    noiseHit(0.05, 5200, 0.18, 2);
    noiseHit(0.04, 3800, 0.12, 3);
    tone(2400, 0.03, 0.04, "square");
  }

  function finish() {
    state = S.RESULT;
    score = Math.round(size());
    held = false; pointer = null;
    humOff();
    bark(); setTimeout(bark, 220);
    tone(660, 0.12, 0.1, "square"); tone(990, 0.3, 0.1, "square", null, 0.1);
  }

  /* ============ 入力 ============ */
  /* 下のボタン：スプレー・ハサミ（道具を選ぶ）と「完成」 */
  function toolButtons() {
    var h = 62, w = 120, gap = 16, wd = 160, y = H - h - Math.max(28, H * 0.035);
    var x0 = W / 2 - (w * 2 + wd + gap * 2) / 2;
    return [
      { id: "spray", x: x0, y: y, w: w, h: h, label: "スプレー" },
      { id: "cut", x: x0 + w + gap, y: y, w: w, h: h, label: "ハサミ" },
      { id: "done", x: x0 + (w + gap) * 2, y: y, w: wd, h: h, label: "完成" }
    ];
  }
  function hitTool(x, y) {
    var bs = toolButtons();
    for (var i = 0; i < bs.length; i++) { var b = bs[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id; }
    return null;
  }

  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) { held = true; pointer = { x: W / 2, y: CY - 120 }; return; }   /* キーは上へスプレー */
    var b = hitTool(x, y);
    if (b === "done") { finish(); return; }
    if (b) { tool = b; tone(b === "spray" ? 700 : 1100, 0.06, 0.08, "triangle"); return; }
    held = true; pointer = { x: x, y: y };
    if (tool === "spray") bark();
    else { stroke = toPom(x, y); cutN = 0; }
  }
  /* ハサミはなぞったところを、その場で切る */
  var stroke = null, cutN = 0, snipD = 0, chunks = [];
  function move(x, y) {
    if (state !== S.PLAY || !held || !pointer) return;
    pointer.x = x; pointer.y = y;
    if (tool === "cut" && stroke) {
      var p = toPom(x, y);
      if (Math.hypot(p.x - stroke.x, p.y - stroke.y) < CS * 0.5) return;
      var c = carve(stroke, p);
      stroke = p;
      if (c) {
        cutN += c;
        if (Math.random() < 0.5) bits.push({ x: x, y: y, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 60, life: 1, s: 3 + Math.random() * 4 });
        snipD -= c;
        if (snipD <= 0) { snipD = 12; noiseHit(0.04, 4200, 0.08, 3); }
      }
    }
  }
  function up() {
    if (held && tool === "cut" && cutN && state === S.PLAY) { settle(); snip(); }
    held = false;
    pointer = null; stroke = null; cutN = 0;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外だけ、数字キーで場面を飛ばせる */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) newRound();
    if (n === 1) {                     /* 1: 適当に伸ばした形 */
      for (var k = 0; k < 160; k++) { var a = k * 0.7; spray({ x: Math.cos(a) * (60 + (k % 9) * 6), y: Math.sin(a) * (60 + (k % 9) * 6) }, 1); }
      measure();
    }
    if (n === 2) finish();             /* 2: 完成 */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    var d = score;
    var ja = d >= 200 ? "全長" + d + "cmのポメラニアンを作った。もう犬小屋に入らない"
      : d >= 100 ? "全長" + d + "cmのポメラニアンを作った。抱っこできない"
      : "全長" + d + "cmのオリジナルポメラニアンを作った";
    var en = d >= 200 ? "Made a " + d + "cm Pomeranian. It no longer fits in the doghouse."
      : d >= 100 ? "Made a " + d + "cm Pomeranian. Too big to hug."
      : "Made my own " + d + "cm Pomeranian.";
    window.zResultActions.x({ text: zT(ja, en) + zT(" #わたあめポメ", " #CottonCandyPom") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var lastDraw = 0;
  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    drawBg(now0());
    var now = performance.now() / 1000, dt = Math.min(0.1, Math.max(0, now - (lastDraw || now))); lastDraw = now;
    if (dirty) measure();
    viewR += (Math.max(44, farR + 16) - viewR) * Math.min(1, dt * 2);
    drawPom();

    /* スプレーの霧と、刈った綿のくず */
    puffs.forEach(function (p) {
      ctx.fillStyle = "rgba(255,255,255," + Math.max(0, p.life * 0.5) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
    });
    bits.forEach(function (b) {
      ctx.fillStyle = "rgba(245,246,250," + Math.max(0, b.life) + ")";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, Math.PI * 2); ctx.fill();
    });
    if (state === S.PLAY) { drawTools(); if (held && pointer) drawCursor(); }
    if (state === S.RESULT) drawResult();
  }

  function now0() { return performance.now() / 1000; }
  /* ポップな背景：ピンクの放射の縞がゆっくり回り、水玉が散る */
  var DOTS = [];
  (function () {
    var sd = 11;
    function rnd() { sd = (sd * 16807) % 2147483647; return sd / 2147483647; }
    var cols = ["#ffe066", "#7fe0d0", "#9fc8ff", "#ffffff"];
    for (var i = 0; i < 26; i++) DOTS.push({ x: rnd(), y: rnd(), r: 5 + rnd() * 12, c: cols[i % 4] });
  })();
  function drawBg(t) {
    ctx.fillStyle = "#ff8fbf"; ctx.fillRect(0, 0, W, H);
    var c = pomScreen(), R = Math.hypot(W, H), n = 16;
    ctx.fillStyle = "#ffa6cc";
    for (var i = 0; i < n; i++) {
      var a = i / n * Math.PI * 2 + t * 0.08;
      ctx.beginPath(); ctx.moveTo(c.x, c.y);
      ctx.lineTo(c.x + Math.cos(a) * R, c.y + Math.sin(a) * R);
      ctx.lineTo(c.x + Math.cos(a + Math.PI / n) * R, c.y + Math.sin(a + Math.PI / n) * R);
      ctx.closePath(); ctx.fill();
    }
    DOTS.forEach(function (d, k) {
      ctx.fillStyle = d.c; ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(d.x * W, (d.y * H + t * (6 + k % 5 * 3)) % H, d.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  /* 綿の絵。升目（maskCv）をなめらかに引き伸ばし、下に薄い影、上に白い綿を重ねる */
  var WS = NG * 3;
  var maskCv = document.createElement("canvas"); maskCv.width = maskCv.height = NG;
  var mctx = maskCv.getContext("2d"), maskImg = mctx && mctx.createImageData ? mctx.createImageData(NG, NG) : null;
  var workCv = document.createElement("canvas"); workCv.width = workCv.height = WS;
  var wctx = workCv.getContext("2d");
  var whiteCv = document.createElement("canvas"); whiteCv.width = whiteCv.height = WS;
  var hctx = whiteCv.getContext("2d");
  function paintMask(cells) {
    var d = maskImg.data;
    for (var k = 0; k < cells.length; k++) { d[k * 4] = d[k * 4 + 1] = d[k * 4 + 2] = 255; d[k * 4 + 3] = cells[k] ? 255 : 0; }
    mctx.putImageData(maskImg, 0, 0);
  }
  function tinted(g, color) {
    g.clearRect(0, 0, WS, WS);
    g.globalCompositeOperation = "source-over";
    g.imageSmoothingEnabled = true;
    g.drawImage(maskCv, 0, 0, WS, WS);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = color; g.fillRect(0, 0, WS, WS);
    g.globalCompositeOperation = "source-over";
  }
  function renderFluff() {
    if (!maskImg || !wctx || !hctx) return;
    try {
      paintMask(fl);
      var gr = hctx.createRadialGradient(WS * 0.45, WS * 0.42, 0, WS / 2, WS / 2, Math.max(30, farR / CS * 3));
      gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.7, "#f7f8fb"); gr.addColorStop(1, "#eceef4");
      tinted(hctx, gr);
      wctx.clearRect(0, 0, WS, WS);
      wctx.drawImage(whiteCv, 0, 0);
      /* 縁のもこもこ：外に面した升目に、小さな丸を並べる */
      var sc = WS / NG, br = Math.max(4, Math.min(16, farR * 0.06)) / CS * sc, n = 0;
      for (var k = 0; k < fl.length; k++) {
        if (!fl[k]) continue;
        var i = k % NG, j = (k / NG) | 0;
        if (fl[k - 1] && fl[k + 1] && fl[k - NG] && fl[k + NG]) continue;
        if (((i * 7 + j * 13) % 3) !== 0) continue;
        var x = (i + 0.5) * sc, y = (j + 0.5) * sc, dx = cellX(k), dy = -cellY(k), dl = Math.hypot(dx, dy) || 1;
        wctx.fillStyle = (n++ % 2) ? "#f6f7fa" : "#f1f2f6";
        wctx.beginPath(); wctx.arc(x - dx / dl * br * 0.5, y - dy / dl * br * 0.5, br, 0, Math.PI * 2); wctx.fill();
      }
      /* うっすら見える毛の筋 */
      wctx.strokeStyle = "rgba(200,205,218,.16)"; wctx.lineWidth = Math.max(1, br * 0.12); wctx.lineCap = "round";
      for (k = 0; k < fl.length; k += 37) {
        if (!fl[k] || isBody(k)) continue;
        var h = (k * 2654435761) % 1000 / 1000;
        if (h > 0.35) continue;
        var cx2 = ((k % NG) + 0.5) * sc, cy2 = (((k / NG) | 0) + 0.5) * sc;
        wctx.beginPath(); wctx.arc(cx2, cy2, br * (0.6 + h), h * 18, h * 18 + 2.2); wctx.stroke();
      }
    } catch (e) {}
  }
  /* 切り落とした綿を、落ちていく絵にする */
  function dropChunk(fall) {
    if (!maskImg || chunks.length > 6) return;
    try {
      paintMask(fall);
      var c = document.createElement("canvas"); c.width = c.height = WS;
      tinted(c.getContext("2d"), "#f4f5f9");
      var sx = 0, sy = 0, n = 0;
      for (var k = 0; k < fall.length; k++) if (fall[k]) { sx += cellX(k); sy += cellY(k); n++; }
      chunks.push({ cv: c, x: sx / n, y: sy / n, dx: 0, dy: 0, vx: sx / n * 2, vy: -160, rot: 0, vr: (Math.random() - 0.5) * 3, t: 0 });
    } catch (e) {}
  }

  /* 正面から見たポメ。綿の形 f を、もこもこの白い玉として描き、真ん中に顔 */
  function drawPom() {
    var k = pxPerCm(), cx = W / 2, cy = CY, i;
    var R = START * k, bounce = 1 + Math.sin(Math.min(1, barkT / 0.15) * Math.PI) * 0.15;
    if (dirty) { measure(); renderFluff(); dirty = false; }

    /* 影 */
    var low = edgeAt(-Math.PI / 2);
    ctx.fillStyle = "rgba(150,40,90,.22)";
    ctx.beginPath(); ctx.ellipse(cx, cy + low * k + 18, Math.max(40, viewR * k * 0.55), 12, 0, 0, Math.PI * 2); ctx.fill();

    /* 耳（頭の上の綿の縁から、後ろにのぞく） */
    [-1, 1].forEach(function (s) {
      var a = Math.PI / 2 - s * 0.55, r = Math.max(START, edgeAt(a)) * k;
      var bx = cx + Math.cos(a) * (r - R * 0.25), by = cy - Math.sin(a) * (r - R * 0.25);
      ctx.save(); ctx.translate(bx, by); ctx.rotate(-(a - Math.PI / 2));
      ctx.fillStyle = "#f4f5f9";
      ctx.beginPath(); ctx.moveTo(-R * 0.42, R * 0.2); ctx.quadraticCurveTo(-R * 0.15, -R * 0.75, 0, -R * 0.82); ctx.quadraticCurveTo(R * 0.15, -R * 0.75, R * 0.42, R * 0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffb3c6";
      ctx.beginPath(); ctx.moveTo(-R * 0.22, R * 0.05); ctx.quadraticCurveTo(-R * 0.08, -R * 0.5, 0, -R * 0.56); ctx.quadraticCurveTo(R * 0.08, -R * 0.5, R * 0.22, R * 0.05); ctx.closePath(); ctx.fill();
      ctx.restore();
    });

    /* 綿（升目の形をなめらかに広げた絵） */
    var span = NG * CS * k;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(workCv, cx - span / 2, cy - span / 2, span, span);
    /* 落ちていく綿のかたまり */
    chunks.forEach(function (c) {
      ctx.save();
      ctx.translate(cx + c.x * k + c.dx, cy - c.y * k + c.dy); ctx.rotate(c.rot);
      ctx.globalAlpha = Math.max(0, 1 - c.t / 2);
      ctx.drawImage(c.cv, -span / 2 - c.x * k, -span / 2 + c.y * k, span, span);
      ctx.restore();
    });

    /* 顔 */
    ctx.save();
    ctx.translate(cx, cy + R * 0.1); ctx.scale(bounce, bounce);
    ctx.fillStyle = "rgba(255,150,180,.45)";
    ctx.beginPath(); ctx.ellipse(-R * 0.55, R * 0.18, R * 0.16, R * 0.1, 0, 0, Math.PI * 2); ctx.ellipse(R * 0.55, R * 0.18, R * 0.16, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#15100e"; ctx.strokeStyle = "#15100e"; ctx.lineCap = "round"; ctx.lineWidth = Math.max(1.5, R * 0.06);
    [-1, 1].forEach(function (s) {
      var ex = s * R * 0.32, ey = -R * 0.08;
      if (blinkT < 0) { ctx.beginPath(); ctx.moveTo(ex - R * 0.1, ey); ctx.lineTo(ex + R * 0.1, ey); ctx.stroke(); }
      else {
        ctx.beginPath(); ctx.arc(ex, ey, R * 0.12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex + R * 0.04, ey - R * 0.05, R * 0.045, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#15100e";
      }
    });
    ctx.beginPath(); ctx.ellipse(0, R * 0.14, R * 0.1, R * 0.075, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-R * 0.16, R * 0.3); ctx.quadraticCurveTo(-R * 0.08, R * 0.38, 0, R * 0.26); ctx.quadraticCurveTo(R * 0.08, R * 0.38, R * 0.16, R * 0.3); ctx.stroke();
    ctx.fillStyle = "#ff7d98";
    ctx.beginPath(); ctx.ellipse(0, R * 0.42, R * 0.08, R * 0.11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawTools() {
    toolButtons().forEach(function (b) {
      var on = b.id === tool;
      ctx.save();
      roundRect(b.x, b.y, b.w, b.h, b.h / 2);
      ctx.fillStyle = on ? "#16202e" : "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = on ? "#fff" : "#16202e"; ctx.stroke();
      ctx.fillStyle = on ? "#fff" : "#16202e";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (b.id === "done") { ctx.font = "800 30px sans-serif"; ctx.fillText(zT("完成", "Done"), b.x + b.w / 2, b.y + b.h / 2 + 1); }
      else window.zActionIcon(ctx, b.label, b.x + b.w / 2, b.y + b.h / 2, 34);
      ctx.restore();
    });
  }

  /* 指の所に道具の印 */
  function drawCursor() {
    ctx.save();
    ctx.translate(pointer.x, pointer.y - 46);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    window.zActionIcon(ctx, tool === "spray" ? "スプレー" : "ハサミ", 0, 0, 40);
    ctx.restore();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    ctx.font = "800 108px sans-serif";
    var num = String(score), nw = ctx.measureText(num).width;
    ctx.font = "800 52px sans-serif";
    var uw = ctx.measureText("cm").width;
    var x0 = W / 2 - (nw + 8 + uw) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif"; ctx.fillText(num, x0, H * 0.45);
    ctx.font = "800 52px sans-serif"; ctx.fillText("cm", x0 + nw + 8, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, T: T, tool: tool, size: size(), W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };
  window.__thumbnail = function () { newRound(); debugKey(1); };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
      finish();
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); tone(900, 0.12, 0.12, "triangle", 1400); tone(1100, 0.14, 0.1, "triangle", 1700, 0.13); });
  newRound(); humOff(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
