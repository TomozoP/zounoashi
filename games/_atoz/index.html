<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A to Z</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* A to Z
   A〜Zのボタンを無理やり詰め込んだゲーム機。十字キーの左右で歩き、
   道をふさぐ26個の障害を、それぞれ決まった1文字のボタンで越えて旗まで行く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });


  var SND = {
    click: function () { noiseHit(0.03, 2400, 0.25, 2); tone(180, 0.04, 0.05, "square", 120); },
    buzz: function () { tone(140, 0.22, 0.07, "square", 110); },
    ouch: function () { tone(700, 0.3, 0.07, "square", 200); },
    ok: function () { tone(660, 0.08, 0.06, "square"); tone(990, 0.16, 0.06, "square", null, 0.07); },
    boom: function () { noiseHit(0.5, 160, 0.6, 0.7); },
    whoosh: function () { noiseHit(0.35, 1800, 0.25, 0.6); },
    rise: function () { tone(220, 0.6, 0.06, "square", 880); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 0.07, "square", null, i * 0.08); }); }
  };

  var LW = 160, LH = 128;                       /* 画面の中のゲームは横160×縦128の点 */
  var lcd = document.createElement("canvas"); lcd.width = LW; lcd.height = LH;
  var lctx = lcd.getContext("2d");

  /* ============ ボタン ============
     十字キー・ABXY・肩のLRは普通の場所。残りの20文字は空いた所に無理やり詰め込む（ゲーム機の上の位置、単位cm） */
  var PAD = { x: -3.0, z: 3.0 }, FACE = { x: 3.0, z: 3.0 };
  var BTNS = [
    { id: "left", kind: "pad", dir: "left", x: PAD.x - 1.0, z: PAD.z, r: 0.55 },
    { id: "right", kind: "pad", dir: "right", x: PAD.x + 1.0, z: PAD.z, r: 0.55 },
    { id: "up", kind: "pad", dir: "up", x: PAD.x, z: PAD.z - 1.0, r: 0.55 },
    { id: "down", kind: "pad", dir: "down", x: PAD.x, z: PAD.z + 1.0, r: 0.55 },
    { id: "A", x: FACE.x + 1.1, z: FACE.z, r: 0.52, col: 0xd8413a },
    { id: "B", x: FACE.x, z: FACE.z + 1.1, r: 0.52, col: 0xe8c52e, darkText: true },
    { id: "X", x: FACE.x, z: FACE.z - 1.1, r: 0.52, col: 0x3a67d8 },
    { id: "Y", x: FACE.x - 1.1, z: FACE.z, r: 0.52, col: 0x2f9e4a },
    { id: "L", kind: "shoulder", x: -3.7, z: -10.25, r: 0.7, col: 0x9aa0ad },
    { id: "R", kind: "shoulder", x: 3.7, z: -10.25, r: 0.7, col: 0x9aa0ad }
  ];
  /* 詰め込み：画面の左右の細い隙間・画面の下・十字キーとABXYの間・下の余白 */
  [
    ["Q", -4.7, -8.6, 0.33], ["F", -4.68, -7.4, 0.36], ["K", -4.72, -6.15, 0.31], ["W", -4.66, -4.9, 0.37],
    ["M", 4.7, -8.7, 0.32], ["T", 4.66, -7.5, 0.37], ["P", 4.72, -6.2, 0.3], ["H", 4.68, -5.0, 0.35],
    ["J", -4.15, -2.15, 0.33], ["S", -3.05, -1.85, 0.41], ["C", -1.85, -2.25, 0.3], ["O", -0.65, -1.8, 0.43],
    ["Z", 0.65, -2.2, 0.31], ["E", 1.85, -1.85, 0.4], ["I", 3.25, -2.05, 0.34],
    ["U", -0.05, 2.35, 0.36], ["N", 0.25, 3.65, 0.3],
    ["G", -2.35, 7.3, 0.47], ["D", 0.45, 6.75, 0.3], ["V", 2.75, 8.2, 0.39]
  ].forEach(function (a, i) {
    BTNS.push({ id: a[0], x: a[1], z: a[2], r: a[3], col: hsl((i * 0.381966 + 0.05) % 1, 0.9, [0.55, 0.47, 0.6][i % 3]), rot: (i % 5 - 2) * 0.12 });
  });
  BTNS.forEach(function (b) { b.kind = b.kind || "round"; b.label = b.label || (b.kind === "pad" ? "" : b.id); });
  var BODY = { w: 10.6, l: 20 };
  function hsl(h, s, l) {
    var q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    function c(t) { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }
    return (Math.round(c(h + 1 / 3) * 255) << 16) | (Math.round(c(h) * 255) << 8) | Math.round(c(h - 1 / 3) * 255);
  }
  function cssCol(n) { return "#" + ("00000" + n.toString(16)).slice(-6); }

  /* ============ 面 ============
     横に長い1面。障害が26個並び、それぞれ決まった1文字のボタンでしか越えられない。
     kind: block … 道をふさぐ物。正しい文字で消える
           pit   … 床の穴。正しい文字で渡れるようになる
           tall  … 高い台。正しい文字で上に運ばれる
           wall  … 高い壁。正しい文字で向こう側へ抜ける */
  var GROUND = 112, SEG = 72, X0 = 70;
  var ORDER = "BDWJKITOAHSXFMUCRNGQYEPVLZ";
  var KIND = { A: "block", B: "block", C: "tall", D: "block", E: "tall", F: "block", G: "wall", H: "block", I: "pit", J: "tall", K: "block", L: "block",
    M: "block", N: "block", O: "pit", P: "block", Q: "block", R: "pit", S: "tall", T: "wall", U: "block", V: "block", W: "block", X: "pit", Y: "block", Z: "block" };
  /* 障害の大きさ（幅, 高さ） */
  var SIZE = { A: [8, 30], B: [16, 16], D: [22, 12], F: [14, 14], H: [12, 12], K: [10, 24], L: [18, 112], M: [16, 14], N: [12, 12], P: [14, 14],
    Q: [10, 40], U: [16, 60], V: [18, 18], W: [14, 16], Y: [8, 30], Z: [12, 18] };
  var STAGE_W = X0 + ORDER.length * SEG + 70;
  var stage, obs;
  function buildStage() {
    var sol = [], gx = 0;
    obs = ORDER.split("").map(function (ch, k) {
      var x = X0 + k * SEG + 30, kind = KIND[ch], o = { ch: ch, kind: kind, x: x, done: false, t: 0 };
      if (kind === "pit") { sol.push({ x: gx, y: GROUND, w: x - gx, h: 16 }); gx = x + 30; o.w = 30; o.h = 16; }
      else if (kind === "tall") { o.w = 26; o.h = 40; o.solid = { x: x, y: GROUND - 40, w: 26, h: 40 }; }
      else if (kind === "wall") { o.w = 10; o.h = 80; o.solid = { x: x, y: GROUND - 80, w: 10, h: 80 }; }
      else { var s = SIZE[ch]; o.w = s[0]; o.h = s[1]; o.solid = { x: x, y: GROUND - s[1], w: s[0], h: s[1] }; }
      if (o.solid) sol.push(o.solid);
      return o;
    });
    sol.push({ x: gx, y: GROUND, w: STAGE_W - gx, h: 16 });
    stage = { solids: sol, flag: STAGE_W - 24 };
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, P = null, falls, clearT, dead, camX, used, shake, mark = false;
  var keys = { left: false, right: false }, pointers = {}, flash = {};

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; falls = 0; pointers = {}; used = {}; shake = 0;
    buildStage();
    P = { x: 12, y: GROUND - 8, w: 6, h: 8, vx: 0, vy: 0, ground: true, face: 1, walk: 0, move: null, ghost: 0 };
    clearT = -1; dead = -1; camX = 0;
  }
  function respawn() {
    var o = nextOb(), x = o ? o.x - 22 : 12;
    P.x = x; P.y = GROUND - 8; P.vx = 0; P.vy = 0; P.move = null; dead = -1;
  }
  function nextOb() { for (var i = 0; i < obs.length; i++) if (!obs[i].done) return obs[i]; return null; }
  function die() { if (dead < 0) { dead = 0; SND.ouch(); } }

  /* ============ 進行 ============ */
  var G = 300, WALK = 60;
  function down(id) {
    for (var k in pointers) if (pointers[k] === id) return true;
    return (flash[id] || 0) > 0;
  }
  function held(id) { return keys[id] || down(id); }
  function hitRect(a, r) { return a.x < r.x + r.w && a.x + a.w > r.x && a.y < r.y + r.h && a.y + a.h > r.y; }

  /* 文字のボタン：目の前の障害がその文字なら越える */
  function useLetter(ch) {
    if (state !== S.PLAY || dead >= 0 || clearT >= 0 || P.move) return;
    if (used[ch]) { SND.buzz(); return; }
    var o = nextOb();
    var gap = o ? o.x - (P.x + P.w) : 99;
    if (!o || o.ch !== ch || gap > 26 || gap < -4 || !P.ground) { SND.buzz(); shake = 0.3; return; }
    used[ch] = true; o.done = true; o.t = 0;
    if (o.kind === "block") { stage.solids.splice(stage.solids.indexOf(o.solid), 1); SND[ch === "B" ? "boom" : "ok"](); }
    else if (o.kind === "pit") { stage.solids.push({ x: o.x, y: GROUND, w: o.w, h: 4 }); SND.ok(); }
    else if (o.kind === "tall") { P.move = { t: 0, dur: 0.8, x0: P.x, y0: P.y, x1: o.x + 6, y1: GROUND - 48, arc: ch === "J" || ch === "S" ? 30 : 0, ch: ch }; SND.rise(); }
    else if (o.kind === "wall") { P.move = { t: 0, dur: ch === "T" ? 0.5 : 1.0, x0: P.x, y0: P.y, x1: o.x + o.w + 4, y1: P.y, arc: 0, ch: ch }; SND.whoosh(); }
  }

  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    for (var f in flash) flash[f] -= dt;
    shake = Math.max(0, shake - dt);
    obs.forEach(function (o) { if (o.done) o.t += dt; });
    if (dead >= 0) { dead += dt; if (dead > 0.7) { falls++; respawn(); } return; }
    if (clearT >= 0) { clearT += dt; if (clearT > 0.9) finish(); return; }
    if (P.move) {
      var m = P.move; m.t += dt;
      var k = Math.min(1, m.t / m.dur);
      /* はしご・エレベーターは上がってから横へ。ジャンプ・ばねは弧を描く */
      var ky = m.arc ? k : Math.min(1, k * 1.6), kx = m.arc ? k : Math.max(0, k * 2.5 - 1.5);
      if (m.ch === "T") { kx = k < 0.5 ? 0 : 1; }
      P.x = m.x0 + (m.x1 - m.x0) * (m.ch === "G" ? k : kx);
      P.y = m.y0 + (m.y1 - m.y0) * (m.ch === "G" ? 0 : ky) - Math.sin(k * Math.PI) * m.arc;
      if (k >= 1) { P.move = null; P.vy = 0; }
      camX = Math.max(0, Math.min(STAGE_W - LW, Math.round(P.x - 60)));
      return;
    }
    var dir = (held("left") ? -1 : 0) + (held("right") ? 1 : 0);
    if (dir) P.face = dir;
    var acc = 900 * dt;
    P.vx += Math.max(-acc, Math.min(acc, dir * WALK - P.vx));
    P.vy = Math.min(320, P.vy + G * dt);

    var sol = stage.solids;
    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > STAGE_W - P.w) P.x = STAGE_W - P.w;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vx > 0) P.x = r.x - P.w; else if (P.vx < 0) P.x = r.x + r.w;
      P.vx = 0;
    });
    P.y += P.vy * dt;
    P.ground = false;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vy > 0) { P.y = r.y - P.h; P.ground = true; } else if (P.vy < 0) P.y = r.y + r.h;
      P.vy = 0;
    });
    if (Math.abs(P.vx) > 1 && P.ground) P.walk += dt * Math.abs(P.vx) / 8;
    if (P.y > LH + 16) { die(); return; }
    if (P.x + P.w >= stage.flag - 1 && P.ground && !nextOb()) { clearT = 0; SND.clear(); }
    camX = Math.max(0, Math.min(STAGE_W - LW, Math.round(P.x - 60)));
  }

  function finish() { state = S.RESULT; clearT = -1; shareButton.hidden = false; }

  /* ============ 入力 ============ */
  /* 立体が使えないとき（自動確認の台など）は、ゲーム機を画面の中央に平らに描く */
  function flatK() { return Math.min(W / (BODY.w + 0.3), H / (BODY.l + 1.8)); }
  function btnAt(b) {
    var s3 = scene3d();
    if (s3) { try { return s3.buttonAt(b, W, H); } catch (e) {} }
    var k = flatK();
    return { x: W / 2 + b.x * k, y: H / 2 + b.z * k, r: b.r * k };
  }
  /* いちばん近いボタン（ふちからの距離で比べる）。少し外れても拾う */
  function hitBtn(x, y) {
    var best = null, bd = 1e9;
    BTNS.forEach(function (b) {
      var c = btnAt(b), d = Math.hypot(x - c.x, y - c.y) - c.r;
      if (d < bd) { bd = d; best = b; }
    });
    return best && bd < 14 ? best.id : null;
  }
  function pressBtn(id) {
    SND.click();
    if (id.length === 1) useLetter(id);
  }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var id = hitBtn(p.x, p.y);
    if (!id) return;
    pointers[e.pointerId] = id;
    pressBtn(id);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pointers) || state !== S.PLAY) return;
    var p = atCanvas(e), id = hitBtn(p.x, p.y), cur = pointers[e.pointerId];
    /* 十字キーは指をずらして左右を切り替えられる */
    if (cur.length > 1 && id && id.length > 1 && id !== cur) pointers[e.pointerId] = id;
  });
  function release(e) { delete pointers[e.pointerId]; }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);
  wrap.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("blur", function () { pointers = {}; keys.left = keys.right = false; });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1) mark = !mark;                                   /* 次に使う文字のボタンを光らせる */
    if (n === 2 && state === S.PLAY) { var o = nextOb(); if (o) { flash[o.ch] = 0.1; P.x = o.x - 10; P.y = GROUND - 8; P.ground = true; useLetter(o.ch); } }  /* 次の障害を越える */
    if (n === 9 && state === S.PLAY) finish();                   /* 結果へ */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var k = e.key;
    if (k === "Escape") { e.preventDefault(); if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (k === "ArrowLeft") { keys.left = true; e.preventDefault(); return; }
    if (k === "ArrowRight") { keys.right = true; e.preventDefault(); return; }
    if (/^[a-zA-Z]$/.test(k)) {
      e.preventDefault();
      if (e.repeat) return;
      if (state === S.RESULT) return;
      if (state === S.PLAY) { var ch = k.toUpperCase(); flash[ch] = 0.12; pressBtn(ch); }
      return;
    }
    if ((k === " " || k === "Enter") && state === S.RESULT) { e.preventDefault(); newRound(); }
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
    if ((e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
  });

  /* ============ シェア ============ */
  function secText() { return (Math.floor(T * 10) / 10).toFixed(1); }
  function doShare() {
    var s = secText();
    window.zResultActions.x({ text:
      zT("AからZまで全部のボタンを使い切って、" + s + "秒でクリアした", "Used every button from A to Z and cleared it in " + s + "s") +
      zT(" #AtoZ", " #AtoZ") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  var PAL = ["#d8e6ea", "#a6bfc8", "#577684", "#22323c"];
  function px(x, y, w, h, c) { lctx.fillStyle = PAL[c]; lctx.fillRect(Math.round(x), Math.round(y), w, h); }

  function drawLCD() {
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    px(0, 0, LW, LH, 0);
    lctx.translate(-camX, 0);
    for (var cx = 20; cx < STAGE_W; cx += 110) { px(cx, 22 + (cx % 3) * 6, 18, 4, 1); px(cx + 4, 19 + (cx % 3) * 6, 10, 3, 1); }
    stage.solids.forEach(function (r) {
      if (r.h > 16 || r.y < GROUND) return;   /* 障害そのものは下で描く */
      px(r.x, r.y, r.w, r.h, 2);
      px(r.x, r.y, r.w, 2, 3);
      if (r.h > 6) for (var i = r.x + 3; i < r.x + r.w - 1; i += 6) px(i, r.y + 5 + ((i / 6) % 2) * 4, 2, 2, 1);
    });
    obs.forEach(drawOb);
    px(stage.flag, GROUND - 26, 2, 26, 3);
    px(stage.flag - 10, GROUND - 26, 10, 7, 2);
    drawPlayer();
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    if (clearT >= 0) { lctx.fillStyle = "rgba(216,230,234," + Math.min(0.6, clearT) + ")"; lctx.fillRect(0, 0, LW, LH); }
  }

  /* 障害の絵。t は越えてからの秒（越える前は -1） */
  function drawOb(o) {
    var x = o.x, g = GROUND, w = o.w, h = o.h, t = o.done ? o.t : -1, out = t >= 0 ? Math.min(1, t / 0.5) : 0, i;
    if (x < camX - 40 || x > camX + LW + 40) return;
    if (t > 0.6 && o.kind === "block") return;
    var y = g - h;
    switch (o.ch) {
      case "A": /* 木 → 斧で切り倒す */
        if (t < 0) { px(x + 2, y + 10, 4, h - 10, 2); px(x - 6, y, 20, 12, 1); px(x - 4, y - 3, 16, 3, 1); }
        else { px(x + 2, g - 4, 4, 4, 2); px(x + 2 + out * 20, g - 4 - (1 - out) * 20, 20 * out + 4, 4, 2); }
        break;
      case "B": /* 岩 → 爆弾で吹き飛ぶ */
        if (t < 0) { px(x + 2, y, w - 4, h, 2); px(x, y + 3, w, h - 3, 2); px(x + 4, y + 3, 3, 2, 1); }
        else for (i = 0; i < 8; i++) px(x + 8 + Math.cos(i) * out * 26, y + 8 + Math.sin(i * 2) * out * 20 - out * 10, 3, 3, 3);
        break;
      case "D": /* 土の山 → 掘る */
        if (t < 0) { px(x + 4, y, w - 8, 4, 2); px(x, y + 4, w, h - 4, 2); px(x + 6, y + 6, 2, 2, 1); }
        else for (i = 0; i < 5; i++) px(x + i * 4, g - 4 - Math.sin(out * Math.PI) * (10 + i * 3), 3, 3, 2);
        break;
      case "F": /* 氷のかたまり → 火で溶ける */
        if (t < 0) { px(x, y, w, h, 1); px(x + 2, y + 2, 3, 6, 0); }
        else { px(x - 2, g - 2, w + 4, 2, 1); px(x + 4, g - 10 + out * 8, 5, 6 * (1 - out), 3); }
        break;
      case "H": /* れんが → ハンマーで砕く */
        if (t < 0) { px(x, y, w, h, 2); px(x, y + 5, w, 1, 3); px(x + 5, y, 1, 5, 3); px(x + 2, y + 6, 1, 6, 3); }
        else for (i = 0; i < 6; i++) px(x + i * 2 + (i - 3) * out * 6, y + out * out * 14, 3, 3, 2);
        break;
      case "K": /* 扉 → 鍵で開く */
        px(x - 1, y - 2, w + 2, 2, 3);
        if (t < 0) { px(x, y, w, h, 2); px(x + 4, y + 10, 2, 4, 0); }
        else px(x, y, Math.max(1, w * (1 - out)), h, 2);
        break;
      case "L": /* 真っ暗 → 明かりで晴れる */
        if (t < 0) { lctx.fillStyle = "rgba(34,50,60,.95)"; lctx.fillRect(x, 0, w, g); }
        else { lctx.fillStyle = "rgba(255,240,170," + (1 - out) * 0.8 + ")"; lctx.fillRect(x - 20, 0, w + 40, g); }
        break;
      case "M": /* 料金所の棒 → お金を払うと上がる */
        px(x + w, y - 6, 3, h + 6, 3);
        lctx.save(); lctx.translate(x + w + 1, y); lctx.rotate(-out * Math.PI / 2); lctx.fillStyle = PAL[2]; lctx.fillRect(-w - 2, 0, w + 2, 3); lctx.restore();
        if (t >= 0) px(x - 6, y - 10 - out * 10, 4, 4, 3);
        break;
      case "N": /* 鳥 → 網で捕まえる */
        if (t < 0) { var fl = Math.floor(T * 5) % 2; px(x + 2, y + 4, 8, 6, 3); px(x + 9, y + 2, 4, 4, 3); px(x, y + (fl ? 0 : 6), 5, 3, 2); }
        else { px(x + 2, y + 2 - out * 30, 8, 8, 1); px(x + 4, y + 4 - out * 30, 4, 4, 3); }
        break;
      case "P": /* 木箱 → 押して転がす */
        var px0 = x + (t < 0 ? 0 : out * 40);
        if (t < 0.55) { px(px0, y, w, h, 2); px(px0 + 1, y + 1, w - 2, 1, 1); px(px0 + 1, y + h / 2, w - 2, 1, 1); }
        break;
      case "Q": /* 柱 → 地震で倒れる */
        lctx.save(); lctx.translate(x + w, g); lctx.rotate(t < 0 ? 0 : out * Math.PI / 2); lctx.fillStyle = PAL[2]; lctx.fillRect(-w, -h, w, h); lctx.fillStyle = PAL[3]; lctx.fillRect(-w, -h, w, 2); lctx.restore();
        break;
      case "U": /* 落石 → 傘で防ぐ */
        if (t < 0) for (i = 0; i < 5; i++) px(x + (i * 7) % w, (T * 90 + i * 23) % (g - 4), 4, 4, 2);
        break;
      case "V": /* 砂ぼこり → 掃除機で吸う */
        var sc = t < 0 ? 1 : 1 - out;
        for (i = 0; i < 6; i++) { var a = i + T * 3; px(x + w / 2 + Math.cos(a) * w / 2 * sc - 2, g - h / 2 + Math.sin(a) * h / 2 * sc - 2, 5 * sc + 1, 5 * sc + 1, 1); }
        break;
      case "W": /* 火 → 水で消す */
        if (t < 0) { var fl2 = Math.floor(T * 8) % 2; px(x + 2, y + 4, w - 4, h - 4, 2); px(x + 4 + fl2, y, 5, 6, 3); px(x + 1, g - 3, w - 2, 3, 3); }
        else for (i = 0; i < 4; i++) px(x + i * 4, y - out * 16 + i * 2, 3, 3, 1);
        break;
      case "Y": /* 格子の門 → ヨーヨーで上の仕掛けを叩くと開く */
        px(x - 4, y - 12, 4, 4, 3);
        var gh = t < 0 ? h : h * (1 - out);
        for (i = 0; i < w; i += 3) px(x + i, y, 1, gh, 3);
        if (t >= 0 && t < 0.4) px(x - 3, y - 8 + Math.sin(t * 16) * 4, 2, 2, 3);
        break;
      case "Z": /* ロボット → 電撃で止まる */
        if (t < 0) { px(x + 2, y, 8, 6, 3); px(x + 4, y + 2, 1, 1, 0); px(x + 7, y + 2, 1, 1, 0); px(x, y + 6, w, 8, 2); px(x + 2, g - 4, 3, 4, 3); px(x + 7, g - 4, 3, 4, 3); }
        else if (Math.floor(t * 20) % 2) { px(x + 2, y, 8, 6, 3); px(x, y + 6, w, 8, 1); }
        break;
      case "I": /* 水たまり → 凍らせて渡る */
        px(x, g + 4, w, 12, t < 0 ? 1 : 0);
        px(x, g + 3, w, 1, 2);
        if (t >= 0) { px(x, g, w, 4, 1); px(x + 4, g + 1, 4, 1, 0); }
        break;
      case "O": /* 川 → 舟でこいで渡る */
        px(x, g + 4, w, 12, 1);
        if (t < 0) px(x + 3, g + 6 + (Math.floor(T * 3) % 2), 6, 1, 0);
        else { px(x + 2, g, w - 4, 4, 2); px(x + 4, g - 2, w - 8, 2, 3); }
        break;
      case "R": /* 谷 → 縄の橋 */
        px(x - 1, g - 10, 2, 10, 3); px(x + w - 1, g - 10, 2, 10, 3);
        if (t >= 0) { var ww = w * out; px(x, g, ww, 1, 3); for (i = 0; i < ww; i += 4) px(x + i, g + 1, 3, 2, 2); px(x, g - 8, ww, 1, 2); }
        break;
      case "X": /* 見えない床 → 透かして見る */
        if (t >= 0) { lctx.globalAlpha = Math.min(1, out * 2); for (i = 0; i < w; i += 4) px(x + i, g, 3, 4, 2); lctx.globalAlpha = 1; }
        break;
      case "C": /* 高い台 → はしごを掛けて登る */
        px(x, y, w, h, 2); px(x, y, w, 2, 3);
        if (t >= 0) { px(x - 4, y, 1, h, 3); px(x - 1, y, 1, h, 3); for (i = 2; i < h; i += 4) px(x - 4, y + i, 4, 1, 3); }
        break;
      case "E": /* 高い台 → エレベーター */
        px(x, y, w, h, 2); px(x, y, w, 2, 3);
        var ey = t < 0 ? g - 3 : Math.max(y - 3, g - 3 - out * 2 * (h));
        px(x - 10, ey, 10, 3, 3); px(x - 6, ey + 3, 2, g - ey - 3, 1);
        break;
      case "J": /* 高い台 → 大ジャンプ */
        px(x, y, w, h, 2); px(x, y, w, 2, 3);
        for (i = 4; i < w; i += 8) px(x + i, y + 6, 2, 2, 1);
        break;
      case "S": /* 高い台 → ばねで飛ぶ */
        px(x, y, w, h, 2); px(x, y, w, 2, 3);
        if (t >= 0) { var sh = t < 0.15 ? 2 : 8; px(x - 9, g - sh, 7, 1, 3); px(x - 8, g - sh, 5, sh, 2); }
        break;
      case "G": /* 石の壁 → おばけになってすり抜ける */
      case "T": /* 石の壁 → 瞬間移動 */
        px(x, y, w, h, 2); px(x, y, w, 2, 3);
        for (i = y + 6; i < g; i += 8) px(x + ((i / 8) % 2 ? 2 : 6), i, 1, 4, 3);
        if (o.ch === "T" && t >= 0 && t < 0.5) for (i = 0; i < 6; i++) px(x - 8 + Math.random() * (w + 16), g - 10 - Math.random() * 10, 1, 1, 3);
        break;
    }
  }
  function drawPlayer() {
    var x = Math.round(P.x), y = Math.round(P.y), f = P.face;
    if (dead >= 0) lctx.globalAlpha = Math.max(0, 1 - dead * 1.5);
    if (P.move && P.move.ch === "G") lctx.globalAlpha = 0.45;
    if (P.move && P.move.ch === "T" && P.move.t > 0.15 && P.move.t < 0.35) return;
    px(x + 1, y, 4, 3, 3);
    px(f > 0 ? x + 3 : x + 1, y + 1, 1, 1, 0);
    px(x, y + 3, 6, 3, 3);
    var air = !P.ground || P.move;
    var leg = air ? 1 : (Math.floor(P.walk) % 2);
    if (air) { px(x - 1, y + 6, 2, 2, 3); px(x + 5, y + 5, 2, 2, 3); }
    else { px(x + (leg ? 0 : 1), y + 6, 2, 2, 3); px(x + (leg ? 4 : 3), y + 6, 2, 2, 3); }
    /* 道具を持ったときの小物 */
    if (P.move && P.move.ch === "E") px(x - 2, y + 8, 10, 3, 3);
    lctx.globalAlpha = 1;
  }

  function drawFlat() {
    var k = flatK();
    ctx.fillStyle = "#3a2a20"; ctx.fillRect(0, 0, W, H);
    roundRect(W / 2 - BODY.w / 2 * k, H / 2 - BODY.l / 2 * k, BODY.w * k, BODY.l * k, k);
    ctx.fillStyle = "#f0c85a"; ctx.fill();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lcd, W / 2 - 3.5 * k, H / 2 + (-6.4 - 2.8) * k, 7 * k, 5.6 * k);
    BTNS.forEach(function (b) {
      var c = btnAt(b);
      ctx.fillStyle = mark && b.id === (nextOb() || {}).ch ? "#fff" : b.col != null ? cssCol(b.col) : "#2a2d38";
      ctx.beginPath(); ctx.arc(c.x, c.y + (down(b.id) ? 2 : 0), c.r, 0, Math.PI * 2); ctx.fill();
      if (b.label) { ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.round(c.r) + "px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(b.label, c.x, c.y + 1); ctx.textBaseline = "alphabetic"; }
    });
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(lcd, BTNS); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    drawLCD();
    var s3 = scene3d(), drew = false;
    if (s3) {
      try {
        var pressed = {}, nx = nextOb();
        BTNS.forEach(function (b) { pressed[b.id] = down(b.id) || (b.id === "left" && keys.left) || (b.id === "right" && keys.right) || (mark && nx && b.id === nx.ch); });
        s3.sync({ pressed: pressed, used: used, shake: shake });
        drew = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); }
    }
    if (!drew) drawFlat();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。秒数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var r = bs[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (r) {
      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      roundRect(-r.w / 2, -r.h / 2, r.w, r.h, r.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, r.label, 0, 1, 30)) ctx.fillText(r.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, T: T, falls: falls, x: P && P.x, y: P && P.y, ground: P && P.ground, dead: dead, clear: clearT, W: W, H: H, next: nextOb() && nextOb().ch, moving: !!(P && P.move) }; },
    btnAt: function (id) { return btnAt(BTNS.filter(function (b) { return b.id === id; })[0]); },
    hitBtn: function (x, y) { return hitBtn(x, y); },
    press: function (id) { pressBtn(id); },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    keys: keys
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
