<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>引っ張り引っ越し</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #6d737a; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="vendor/matter.min.js"></script>   <!-- 物理（matter-js 0.20.0, MIT, vendor/matter-LICENSE.txt） -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="room3d.js"></script>   <!-- 立体の見た目（動きは2Dのまま） -->
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 引っ張り引っ越し

   上が新居、下が旧居（真上から見た間取り図）。家具を指で引っぱって新居へ運ぶ。
   引っぱりはゴムひものようにつながっていて、ドアの角に引っかかる。
   強くぶつけると家具にへこみや傷が残り、画面が揺れる（割れる形は BREAK で切り替え。今は割れない）。
   全部が新居に入ったら終わり。秒数だけを競う。 */
(function () {
  "use strict";

  var M = window.Matter;
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.loopStart = 0; s.playbackRate.value = 1;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  /* ガツン：低いドン＋木のぶつかる音＋割れる手前のバキッ */
  var lastBang = 0;
  function bang(s) {
    if (!AC || AC.currentTime - lastBang < 0.07) return;
    lastBang = AC.currentTime;
    var k = Math.min(1, (s - 3) / 6), n = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(110, n); o.frequency.exponentialRampToValueAtTime(38, n + 0.25);
    g.gain.setValueAtTime(0.35 + k * 0.5, n); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.3);
    o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + 0.35);
    noiseHit(0.09, 700, 0.5 + k * 0.4, 1.5);
    tone(320 + Math.random() * 120, 0.07, 0.12, "square", 160);
    if (k > 0.4) noiseHit(0.22, 2600, 0.25 + k * 0.3, 0.8);
  }
  var lastThud = 0;
  function thud(power) {
    if (!AC || AC.currentTime - lastThud < 0.06) return;
    lastThud = AC.currentTime;
    var v = Math.min(0.5, 0.04 + power * 0.03);
    noiseHit(0.12, 180 + power * 25, v, 1.2);
  }
  function crash(kind) {
    if (!AC) return;
    if (kind === "glass") {
      noiseHit(0.5, 4200, 0.5, 2);
      for (var i = 0; i < 5; i++) tone(2400 + Math.random() * 2600, 0.18, 0.06, "triangle", null, i * 0.03);
    } else if (kind === "box") {
      noiseHit(0.35, 600, 0.6, 0.8);
      noiseHit(0.25, 1500, 0.3, 1);
    } else {
      noiseHit(0.4, 2400, 0.55, 1.2);
      noiseHit(0.3, 400, 0.4, 1);
      tone(1800, 0.2, 0.05, "square", 300);
    }
  }

  /* ============ 間取り ============ */
  var WT = 22;                                 /* 壁の厚さ */
  var DOOR = 104;                              /* ドアの幅 */
  var G;                                       /* 今回の家の形（作った時点の高さで固定） */
  function plan() {
    var g = {};
    g.nx0 = 18; g.nx1 = W - 18; g.ny0 = 52; g.ny1 = Math.round(H * 0.42);
    g.ox0 = 18; g.ox1 = W - 18; g.oy0 = Math.round(H * 0.57); g.oy1 = H - 22;
    g.ndoor = [326, 326 + DOOR];               /* 新居の玄関（下の壁） */
    g.odoor = [112, 112 + DOOR];               /* 旧居の玄関（上の壁） */
    g.omid = Math.round((g.oy0 + g.oy1) / 2);  /* 旧居の真ん中の壁 */
    g.omidDoor = [318, 318 + DOOR];
    g.npart = 196;                             /* 新居の仕切り（縦） */
    g.npartEnd = Math.round(g.ny0 + (g.ny1 - g.ny0) * 0.56);
    /* 壁は [x0, y0, x1, y1] の長方形 */
    var h = WT / 2, w = [];
    /* 壁はぶつけまくると壊れるように、短いかたまりに分けておく */
    var SEG = 46;
    function hw(x0, x1, y) {
      if (x1 - x0 <= 1) return;
      var n = Math.ceil((x1 - x0) / SEG);
      for (var i = 0; i < n; i++) w.push([x0 + (x1 - x0) * i / n, y - h, x0 + (x1 - x0) * (i + 1) / n, y + h]);
    }
    function vw(x, y0, y1) {
      if (y1 - y0 <= 1) return;
      var n = Math.ceil((y1 - y0) / SEG);
      for (var i = 0; i < n; i++) w.push([x - h, y0 + (y1 - y0) * i / n, x + h, y0 + (y1 - y0) * (i + 1) / n]);
    }
    /* 新居 */
    hw(g.nx0 - h, g.nx1 + h, g.ny0);
    /* 向かい合う壁（新居の下・旧居の上）は真ん中にドア */
    var DW = 46 * 3;                             /* ドアは壁のかたまり3つぶん */
    var dc0 = W / 2 - DW / 2, dc1 = W / 2 + DW / 2;
    hw(g.nx0 - h, dc0, g.ny1); hw(dc1, g.nx1 + h, g.ny1);
    vw(g.nx0, g.ny0, g.ny1); vw(g.nx1, g.ny0, g.ny1);
    /* 新居の仕切りはなし */
    /* 旧居 */
    hw(g.ox0 - h, dc0, g.oy0); hw(dc1, g.ox1 + h, g.oy0);

    hw(g.ox0 - h, g.ox1 + h, g.oy1);
    vw(g.ox0, g.oy0, g.oy1); vw(g.ox1, g.oy0, g.oy1);
    /* 旧居の仕切りはなし */
    g.walls = w;
    return g;
  }

  /* ============ 家財 ============
     w,h（四角）か r（丸）。heavy は引っぱりの重さ（1が普通）。
     brk はこの速さ以上でぶつかると割れる（無ければ割れない）。
     u,v は旧居の中の置き場所（0〜1）。 */
  var BREAK = false;                           /* いったん割れない形で試す（true で割れる） */
  var DEFS = [
    { k: "bed", split: 1, w: 96, h: 156, heavy: 2.6, slide: 0.06, bounce: 0.2, u: 0.13, v: 0.76, a: 0 },
    { k: "sofa", split: 1, w: 158, h: 58, heavy: 2.0, slide: 0.05, bounce: 0.4, u: 0.52, v: 0.70, a: 0 },
    { k: "shelf", split: 1, w: 124, h: 34, heavy: 1.8, slide: 0.07, bounce: 0.15, u: 0.6, v: 0.94, a: 0 },
    { k: "plant", r: 21, heavy: 0.8, slide: 0.05, bounce: 0.3, brk: 5.5, u: 0.93, v: 0.92 },
    { k: "lamp", r: 15, heavy: 0.4, slide: 0.02, bounce: 0.65, brk: 5, u: 0.92, v: 0.62 },
    { k: "fridge", w: 66, h: 64, heavy: 3.4, slide: 0.02, bounce: 0.08, u: 0.09, v: 0.22, a: 0 },
    { k: "kotatsu", w: 66, h: 66, heavy: 1.4, slide: 0.05, bounce: 0.2, u: 0.5, v: 0.13, a: 0 },
    { k: "table", split: 1, w: 94, h: 62, heavy: 1.3, slide: 0.035, bounce: 0.3, u: 0.6, v: 0.31, a: 0 },
    { k: "chair", w: 30, h: 30, heavy: 0.5, slide: 0.025, bounce: 0.5, u: 0.47, v: 0.31, a: 0.2 },
    { k: "box", w: 46, h: 46, heavy: 0.9, slide: 0.07, bounce: 0.15, brk: 10, u: 0.9, v: 0.14, a: 0.05 },
    { k: "box", w: 46, h: 46, heavy: 0.9, slide: 0.07, bounce: 0.15, brk: 10, u: 0.9, v: 0.34, a: -0.08 },
    { k: "washer", w: 60, h: 60, heavy: 3.0, slide: 0.08, bounce: 0.1, u: 0.33, v: 0.88, a: 0 },
    { k: "dresser", split: 1, w: 84, h: 40, heavy: 2.0, slide: 0.07, bounce: 0.15, u: 0.82, v: 0.78, a: 0 },
    { k: "guitar", w: 26, h: 84, heavy: 0.5, slide: 0.02, bounce: 0.6, u: 0.27, v: 0.67, a: 0.15 },
    { k: "chabudai", r: 30, heavy: 0.9, slide: 0.012, bounce: 0.55, u: 0.3, v: 0.25 },
    { k: "cushion", w: 38, h: 38, heavy: 0.3, slide: 0.11, bounce: 0.15, u: 0.2, v: 0.4, a: 0.2 }
  ];

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, finalT, broken, keyMode = false;
  var dents = 0, shake = 0;                    /* へこみ・傷の数と、画面の揺れ */
  var engine, items, frags, walls, decals, parts, rings, grabs, doneHold;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    pendingSplit = []; bursts = []; hitStop = 0; flung = false;
    T = 0; finalT = 0; broken = 0; doneHold = 0; dents = 0; shake = 0;
    build();
  }

  function build() {
    G = plan();
    engine = M.Engine.create();
    engine.gravity.x = 0; engine.gravity.y = 0;
    engine.positionIterations = 10; engine.velocityIterations = 8;
    walls = G.walls.map(function (r) {
      var wb = M.Bodies.rectangle((r[0] + r[2]) / 2, (r[1] + r[3]) / 2, r[2] - r[0], r[3] - r[1], { isStatic: true, friction: 0.1, restitution: 0.7 });
      wb.wall = r; r.body = wb; r.hp = WALL_HP; r.dead = false; r.cracks = [];
      return wb;
    });
    /* 画面の外へ出ないための囲い */
    var t = 200;
    walls.push(M.Bodies.rectangle(W / 2, -t / 2, W + 2 * t, t, { isStatic: true }));
    walls.push(M.Bodies.rectangle(W / 2, H + t / 2, W + 2 * t, t, { isStatic: true }));
    walls.push(M.Bodies.rectangle(-t / 2, H / 2, t, H + 2 * t, { isStatic: true }));
    walls.push(M.Bodies.rectangle(W + t / 2, H / 2, t, H + 2 * t, { isStatic: true }));
    M.Composite.add(engine.world, walls);
    items = DEFS.map(function (d) {
      var x = G.ox0 + WT / 2 + (G.ox1 - G.ox0 - WT) * d.u;
      var y = G.oy0 + WT / 2 + (G.oy1 - G.oy0 - WT) * d.v;
      return makeItem(d, x, y, d.a || 0);
    });
    M.Composite.add(engine.world, items);
    frags = []; decals = []; parts = []; rings = []; grabs = {};
    M.Events.on(engine, "collisionStart", onHit);
  }

  function makeItem(d, x, y, angle) {
    /* 家具ごとの個性：slide は空気抵抗（小さいほどよく滑る）、bounce は跳ね返り、heavy は重さ */
    var opt = { frictionAir: d.slide || 0.035, friction: 0.15, restitution: d.bounce == null ? 0.45 : d.bounce, density: 0.001 * d.heavy, chamfer: d.r ? undefined : { radius: 5 } };
    var b = d.r ? M.Bodies.circle(x, y, d.r, opt) : M.Bodies.rectangle(x, y, d.w, d.h, opt);
    if (angle) M.Body.setAngle(b, angle);
    b.def = d; b.item = true; b.inside = false; b.seed = Math.random(); b.marks = []; b.shape = outline(d);
    return b;
  }

  /* 大きい家具は強くぶつけると長い向きに半分に割れる（割れた半分はもう割れない） */
  var SPLIT = Infinity,                      /* いったん割れない（6.5 くらいで大きい家具が割れる） */
      pendingSplit = [];
  function split(b) {
    if (b.dead) return;
    b.dead = true; broken++;
    Object.keys(grabs).forEach(function (id) { if (grabs[id].body === b) release(id); });
    M.Composite.remove(engine.world, b);
    var d = b.def, alongX = d.w >= d.h;
    var pw = alongX ? d.w / 2 : d.w, ph = alongX ? d.h : d.h / 2;
    var v = M.Body.getVelocity(b), c = Math.cos(b.angle), si = Math.sin(b.angle);
    [-1, 1].forEach(function (sg) {
      var lx = alongX ? sg * d.w / 4 : 0, ly = alongX ? 0 : sg * d.h / 4;
      var nd = Object.assign({}, d, { w: pw, h: ph, aw: d.aw || d.w, ah: d.ah || d.h, ox: (d.ox || 0) + lx, oy: (d.oy || 0) + ly, heavy: d.heavy * 0.55, split: 0, piece: 1 });
      var wx = b.position.x + lx * c - ly * si, wy = b.position.y + lx * si + ly * c;
      var nb = makeItem(nd, wx, wy, b.angle);
      /* 傷はそれぞれの半分へ引き継ぐ */
      b.marks.forEach(function (m) { if (alongX ? m.x * sg > 0 : m.y * sg > 0) nb.marks.push({ x: m.x - lx, y: m.y - ly, s: m.s, a: m.a, r: m.r }); });
      var px = (lx * c - ly * si) / (d.w / 4 + d.h / 4), py = (lx * si + ly * c) / (d.w / 4 + d.h / 4);
      M.Body.setVelocity(nb, { x: v.x + px * 3, y: v.y + py * 3 });
      M.Body.setAngularVelocity(nb, sg * 0.05);
      M.Composite.add(engine.world, nb);
      items.push(nb);
    });
    shake = 18;
    rings.push({ x: b.position.x, y: b.position.y, t: 0 });
    splash(b.position.x, b.position.y, 22, "#e8d2a8", 7);
    noiseHit(0.35, 900, 0.6, 0.7); noiseHit(0.5, 160, 0.7, 0.8);
  }

  /* 絵の輪郭。ぶつけた所が内側へへこむ（当たり判定は元の形のまま） */
  function outline(d) {
    var pts = [], i;
    if (d.k === "guitar") {
      /* ギターは絵の形（ふくらみ2つ＋ネック）を輪郭にする */
      var hh = d.h / 2, ys = [], y;
      for (y = -hh; y <= hh - 1; y += 3) ys.push(y);
      ys.push(hh - 1);
      function half(y) {
        var f = y < -hh + 10 ? 5 : y < 0 ? 3 : 0, e;
        e = (y - (hh - 20)) / 19; if (Math.abs(e) < 1) f = Math.max(f, 13 * Math.sqrt(1 - e * e));
        e = (y - (hh - 45)) / 12; if (Math.abs(e) < 1) f = Math.max(f, 10 * Math.sqrt(1 - e * e));
        return Math.max(f, 1.5);
      }
      ys.forEach(function (y) { pts.push({ x0: half(y), y0: y, off: 0 }); });
      ys.slice().reverse().forEach(function (y) { pts.push({ x0: -half(y), y0: y, off: 0 }); });
      pts.forEach(function (p) { var l = Math.hypot(p.x0, p.y0) || 1; p.nx = -p.x0 / l; p.ny = -p.y0 / l; });
      pts.maxD = 5;
      return pts;
    }
    if (d.r) {
      for (i = 0; i < 40; i++) {
        var a = i / 40 * Math.PI * 2;
        pts.push({ x0: Math.cos(a) * d.r, y0: Math.sin(a) * d.r, nx: -Math.cos(a), ny: -Math.sin(a), off: 0 });
      }
    } else {
      var w = d.w / 2, h = d.h / 2;
      function side(x0, y0, x1, y1, nx, ny) {
        var n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 5));
        for (var j = 0; j < n; j++) pts.push({ x0: x0 + (x1 - x0) * j / n, y0: y0 + (y1 - y0) * j / n, nx: nx, ny: ny, off: 0 });
      }
      side(-w, -h, w, -h, 0, 1); side(w, -h, w, h, -1, 0); side(w, h, -w, h, 0, -1); side(-w, h, -w, -h, 1, 0);
      /* へこむ向きは中心へ向ける（角で線が交差してトゲにならないように） */
      pts.forEach(function (p) {
        var l = Math.hypot(p.x0 / w, p.y0 / h) || 1;
        var nx = -p.x0 / w / l / w, ny = -p.y0 / h / l / h, n = Math.hypot(nx, ny) || 1;
        p.nx = nx / n; p.ny = ny / n;
      });
    }
    pts.maxD = d.r ? d.r * 0.35 : Math.min(d.w, d.h) * 0.22;
    return pts;
  }
  function dentAt(b, lx, ly, s) {
    var pts = b.shape, depth = Math.min(pts.maxD, (s - 2.8) * 1.6), R = 7 + s * 1.6;
    pts.forEach(function (p) {
      var dd = Math.hypot(p.x0 - lx, p.y0 - ly);
      if (dd > R * 2.5) return;
      p.off = Math.min(pts.maxD, p.off + depth * Math.exp(-(dd / R) * (dd / R)));
    });
    /* となり同士でならして、なめらかなへこみにする */
    for (var it = 0; it < 2; it++) {
      var o = pts.map(function (p) { return p.off; }), n = pts.length;
      pts.forEach(function (p, i) { p.off = (o[(i + n - 1) % n] + o[i] * 2 + o[(i + 1) % n]) / 4; });
    }
    b.dented = true;
  }
  function shapePath(b) {
    ctx.beginPath();
    b.shape.forEach(function (p, i) {
      var x = p.x0 + p.nx * p.off, y = p.y0 + p.ny * p.off;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    });
    ctx.closePath();
  }
  /* 壁：強くぶつけるたびにひびが入り、HPがなくなると崩れる */
  var WALL_HP = 8;
  var WALL_BREAK = true;                       /* 壁はぶつけまくると崩れる（false で壊れない） */
  function hitWall(r, sp, s) {
    if (!WALL_BREAK || r.dead) return;
    r.hp -= s - 2.5;
    var cx = Math.max(r[0], Math.min(r[2], sp.x)), cy = Math.max(r[1], Math.min(r[3], sp.y));

  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* update はいつもちょうど 1/60 秒ずつ（端末の速さで物理が変わらない） */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
