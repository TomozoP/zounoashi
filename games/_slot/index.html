<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>100連スロット</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #000; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
</div></div>
<script src="../share.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 100連スロット

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  var COUNT = 100, PITCH = 140;
  var reels = [], stopped = [], speed = 4;
  var nextReel = 0, camera = 0, streak = 0, targetSymbol = null;
  // 一列揃えるごとの速度増分。チェリー、レモン、ダイヤ、7の順。
  var acceleration = [0.02, 0.045, 0.075, 0.11];
  function cameraTarget() {
    return Math.max(0, Math.min(COUNT - 3, nextReel - 1)) * PITCH;
  }
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound() {
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    reels = Array.from({ length: COUNT }, function() { return Math.random() * 4; });
    stopped = Array(COUNT).fill(false);
    nextReel = 0;
    camera = 0;
    streak = 0;
    targetSymbol = null;
    speed = 4;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    // 止める列を追いかけて、長い本体に沿って右へ進む。
    camera += (cameraTarget() - camera) * (1 - Math.exp(-24 * dt));
    if (Math.abs(cameraTarget() - camera) < 0.1) camera = cameraTarget();
    if (state !== S.PLAY) return;
    T += dt;

    for (var i = nextReel; i < COUNT; i++) reels[i] = (reels[i] + dt * speed) % 4;
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "share") doShare();
      else if (hit === "retry") newRound();
      return;
    }
    if (held || (x != null && Math.hypot(x - W / 2, y - (CY + 220)) > 54)) return;
    held = true;
    var index = nextReel;
    if (index >= COUNT) return;
    stopped[index] = true;
    reels[index] = Math.round(reels[index]) % 4;
    if (index > 0 && reels[index] !== targetSymbol) {
      tone(180, 0.12, 0.07, "sine", 80);
      newRound();
      held = true; // 失敗した指を離すまで、次の列を止めない。
      return;
    }
    if (index === 0) targetSymbol = reels[index];
    nextReel++;
    streak = nextReel;
    speed = 4 + acceleration[targetSymbol] * (nextReel - 1);
    score = Math.max(score, streak);
    tone(420 + Math.min(streak, 12) * 40, 0.09, 0.08, "sine");
    if (nextReel === COUNT) {
      state = S.RESULT;
      if (score) [523,659,784,1047].forEach(function(f,j){tone(f,0.18,0.06,"sine",null,j*0.12);});
    }
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    /* ▼UPDATE: 離したときの処理（要らなければ空のまま） */
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) { newRound(); state=S.INTRO; startButton.hidden=false; } return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)beginPlay();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    zShare({ text: score + "連でした #100連スロット" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function box(x,y,w,h,r,color) { roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill(); }
  function circle(x,y,r,color) {ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
  function symbol(value,x,y) {
    ctx.save();ctx.translate(x,y);
    if(value===0) {
      ctx.strokeStyle="#467957";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-19,12);ctx.quadraticCurveTo(-10,-25,15,-31);ctx.lineTo(20,10);ctx.stroke();
      circle(-20,19,19,"#c52e48");circle(21,20,19,"#e54453");circle(-25,12,5,"#ffac9c");circle(16,13,5,"#ffb2a0");
    } else if(value===1) {
      ctx.rotate(-0.35);ctx.beginPath();ctx.ellipse(0,0,35,24,0,0,Math.PI*2);ctx.fillStyle="#efc33e";ctx.fill();
      ctx.strokeStyle="#ffe9a0";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,24,3.7,5.5);ctx.stroke();
    } else if(value===2) {
      ctx.fillStyle="#428877";ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(32,0);ctx.lineTo(0,36);ctx.lineTo(-32,0);ctx.closePath();ctx.fill();
      ctx.fillStyle="#84c0a1";ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(0,36);ctx.lineTo(-32,0);ctx.closePath();ctx.fill();
    } else {
      ctx.fillStyle="#c32e44";ctx.font="900 83px Georgia";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("7",0,4);
    }
    ctx.restore();
  }
  function draw() {
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    var bodyWidth = COUNT * PITCH + 50;
    ctx.save();
    ctx.translate(-camera,0);
    box(35,CY-250,bodyWidth,390,42,"#d4c6ae");
    box(35,CY-264,bodyWidth,390,42,"#a52e42");
    box(48,CY-251,bodyWidth-26,364,33,"#bf3e50");
    box(78,CY-229,bodyWidth-86,61,20,"#812a39");
    var lampStart = Math.max(0, Math.floor((camera-110)/40));
    var lampEnd = Math.min(Math.floor((bodyWidth-120)/40), Math.ceil((camera+W-110)/40));
    for(var j=lampStart;j<=lampEnd;j++) circle(110+j*40,CY-199,7,(state===S.RESULT&&score>1)||j%2===0?"#ffe2a0":"#d19068");
    box(55,CY-145,COUNT*PITCH+10,237,19,"#733342");
    // 画面に入る列だけ描き、100列でも描画の重さを増やさない。
    var first = Math.max(0,Math.floor((camera-195)/PITCH));
    var last = Math.min(COUNT-1,Math.ceil((camera+W-65)/PITCH));
    for(var i=first;i<=last;i++) {
      var x=65+i*PITCH;
      box(x,CY-135,130,217,12,"#fff9e9");
      ctx.save();roundRect(x,CY-135,130,217,12);ctx.clip();
      var base=Math.floor(reels[i]),fraction=reels[i]-base;
      for(var k=-2;k<=2;k++) symbol(((base+k)%4+4)%4,x+65,CY-26+(k-fraction)*106);
      var shade=ctx.createLinearGradient(0,CY-135,0,CY+82);shade.addColorStop(0,"rgba(84,54,31,.24)");shade.addColorStop(.3,"rgba(84,54,31,0)");shade.addColorStop(.7,"rgba(84,54,31,0)");shade.addColorStop(1,"rgba(84,54,31,.24)");ctx.fillStyle=shade;ctx.fillRect(x,CY-135,130,217);ctx.restore();
      if(i===nextReel && state!==S.RESULT) {
        roundRect(x,CY-135,130,217,12);ctx.strokeStyle="#ffe1a0";ctx.lineWidth=4;ctx.stroke();
      }
    }
    ctx.strokeStyle="#c99853";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(65,CY-26);ctx.lineTo(55+COUNT*PITCH,CY-26);ctx.stroke();
    ctx.restore();
    if(state!==S.RESULT) {
      circle(W/2,CY+227,58,"#d4c6ae");
      circle(W/2,CY+220,56,"#812a39");
      circle(W/2,CY+216+(held?5:0),50,held?"#e8bd7c":"#ffe1a0");
      box(W/2-14,CY+202+(held?5:0),28,28,5,"#ae3547");
    }
    if(state===S.RESULT) {
      ctx.fillStyle="#ffe1a0";ctx.font="800 64px Georgia";ctx.textAlign="center";ctx.fillText(String(score),270,CY-302);
      drawResult();
    }
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 70, gap = 24, wr = 86, ws = 86;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = CY + 185;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, reels: reels.slice(), stopped: stopped.slice(), speed: speed, buttonY: CY + 220, count: COUNT, nextReel: nextReel, camera: camera, cameraTarget: cameraTarget(), streak: streak, targetSymbol: targetSymbol, acceleration: targetSymbol == null ? 0 : acceleration[targetSymbol] }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for(var i=0;i<COUNT;i++){await r.wait(180);r.key();}
      // 失敗で先頭へ戻る様子も、そのまま撮影する。
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer=null;
  document.addEventListener('pointerdown',function(e){
    if(!(state===S.INTRO))return;
    if(e.isPrimary===false||e.button>0)return;
    startingPointer=e.pointerId;
    e.stopImmediatePropagation();
  },true);
  document.addEventListener('pointerup',function(e){
    if(!(state===S.INTRO)||startingPointer!==e.pointerId)return;
    startingPointer=null;e.preventDefault();e.stopImmediatePropagation();startButton.click();
  },true);
  document.addEventListener('pointercancel',function(){startingPointer=null;},true);

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  function beginPlay() { audioOn();resumeAudio();newRound(); }
  startButton.addEventListener('click',function(e){e.stopPropagation();beginPlay();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
