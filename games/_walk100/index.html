<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>100歳ウォーク</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #f6c7a2; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../random-bowling/vendor/cannon.js"></script>
<script src="walk.js"></script>
<script src="scene.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 100歳ウォーク

   物理で歩くほど年をとる。0歳はハイハイ、1歳で立ち、背が伸び、年をとると前かがみになって杖をつく。
   押す（タップ・スペース・ジョイパッド）たびに左右が入れ替わって一歩。押している間は足を上げ、離すと前へ伸ばして着く。
   ← → は左右を選んで押す。転んだらその年齢が記録、100歳まで歩けたらゴール。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 人生 ============ 進んだ距離がそのまま年齢になる（walk.js の LIFE） */
  var LW = ZLifeWalk, GOAL_AGE = 100, LENGTH = LW.distanceAt(GOAL_AGE);

  var view3d = null;
  try {
    view3d = (window.WebGLRenderingContext && typeof ZLifeScene !== "undefined" && typeof THREE !== "undefined")
      ? new ZLifeScene({ length: LENGTH }) : null;
  } catch (e) { view3d = null; }

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    if (view3d) view3d.resize(canvas.width, canvas.height);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  // 地面に触れた音。砂を踏む足、ぺたっと着く手、杖の先。
  function contactSound(part, strength) {
    if (/^cane/.test(part)) { tone(1500, 0.05, 0.05 + 0.08 * strength, "triangle", 900); noiseHit(0.04, 3000, 0.05 * strength, 3); return; }
    if (walker.form === "baby" && /^arm/.test(part)) { noiseHit(0.07, 1300, 0.08 + 0.12 * strength, 1.2); return; }
    if (/^(foot|shin|arm)/.test(part)) { noiseHit(0.1, 420 + 200 * Math.random(), 0.1 + 0.25 * strength, 1.1); noiseHit(0.06, 2400, 0.03 + 0.05 * strength, 2); return; }
    noiseHit(0.22, 160, 0.2 + 0.35 * strength, 0.8);
    tone(90, 0.18, 0.12 + 0.2 * strength, "sine", 50);
  }
  // 立ち上がったとき。
  function standSound() {
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.35, 0.09, "triangle", null, i * 0.07); });
  }
  function finishSound() {
    [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.5, 0.1, "triangle", null, i * 0.09); });
    tone(1047, 0.9, 0.08, "sine", null, 0.5);
  }
  function fallSound() {
    noiseHit(0.35, 140, 0.45, 0.7);
    tone(70, 0.3, 0.3, "sine", 40);
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", DOWN: "down", RESULT: "result" };
  var state, score, scoreText, T, held, walker, age, flash, downT, finished, snap, best;

  function setWalker(w) {
    walker = w;
    if (view3d) view3d.setWalker(walker);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; scoreText = "";
    T = 0;
    held = false;
    flash = 0;
    finished = false;
    best = 0;
    age = 0;
    setWalker(new LW.Walker("baby", 0));
    snap = true;
  }

  // 年齢を進める。背が伸びた・杖を持つ年になったら、同じ姿勢のまま体を作り直す。
  function grow() {
    age = Math.min(GOAL_AGE, LW.ageAt(best));
    walker.setAge(age);
    if (!walker.outgrown(age)) return;
    var stood = walker.form === "baby";
    setWalker(walker.grow(age));
    if (stood) { held = false; flash = 0.6; standSound(); }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
    if (state === S.INTRO) { if (walker) walker.step(dt); return; }
    if (state !== S.PLAY && state !== S.DOWN) return;
    walker.step(dt);
    walker.takeImpacts().forEach(function (hit) { contactSound(hit.part, hit.strength); });
    if (state === S.DOWN) {
      downT += dt;
      if (downT > 1.6) showResult();
      return;
    }
    T += dt;
    best = Math.max(best, walker.x());
    if (walker.fallen()) {
      // 転んだら力を抜いて倒れるにまかせる。
      walker.limp = true;
      walker.release();
      held = false;
      state = S.DOWN;
      downT = 0;
      score = Math.floor(age);
      scoreText = score + "歳";
      fallSound();
      return;
    }
    grow();
    if (age >= GOAL_AGE) {
      finished = true;
      state = S.DOWN;
      downT = 0.4;
      score = GOAL_AGE;
      scoreText = score + "歳";
      walker.release();
      finishSound();
    }
  }
  function showResult() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができる。押すたびに左右が入れ替わる。 */
  function down(x, y, side) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    held = true;
    walker.press(side);
  }
  function up() {
    if (!held) return;
    held = false;
    if (walker) walker.release();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  var pointers = 0;
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (!e.isPrimary && pointers) return;
    pointers++;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); pointers = 0; up(); });
  wrap.addEventListener("pointercancel", function () { pointers = 0; up(); });
  window.addEventListener("blur", function () { up(); });

  var keySide = null;
  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    if (left || right) {
      if (state !== S.PLAY) return;
      keySide = left ? -1 : 1;
      down(null, null, keySide);
      return;
    }
    down();
  });
  window.addEventListener("keyup", function (e) {
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (go) { if (state === S.INTRO) startButton.click(); else up(); }
    if ((left && keySide === -1) || (right && keySide === 1)) { keySide = null; up(); }
  });

  function doShare() {
    /* ▼SHARE: 共有リンクは share.js が付ける。 */
    window.zResultActions.x({ text: scoreText + " #100歳ウォーク" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(dt) {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    if (view3d && walker) {
      view3d.draw(ctx, W, H, { x: walker.x(), form: walker.form, scale: walker.scale, progress: age / GOAL_AGE, snap: snap, dt: dt });
      snap = false;
    } else {
      ctx.fillStyle = "#f6c7a2";
      ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * flash).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    var unit = scoreText.replace(/^[\d.]+/, ""), num = scoreText.slice(0, scoreText.length - unit.length);
    var nw = ctx.measureText(num).width;
    ctx.font = "800 48px sans-serif";
    var uw = ctx.measureText(unit).width;
    ctx.textAlign = "left";
    ctx.font = "800 108px sans-serif";
    ctx.fillText(num, W / 2 - (nw + uw + 6) / 2, H * 0.45);
    ctx.font = "800 48px sans-serif";
    ctx.fillText(unit, W / 2 - (nw + uw + 6) / 2 + nw + 6, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, scoreText: scoreText, W: W, H: H, T: T, age: age, form: walker && walker.form, cane: walker ? walker.cane : false, scale: walker ? walker.scale : 0,
        x: walker ? walker.x() : 0, side: walker ? walker.side : 0, pressed: walker ? walker.pressed : false,
        landed: walker ? !walker.side || !!(walker.near || {})[(walker.form === "baby" ? "arm" : "foot") + (walker.side < 0 ? "L" : "R")] : false,
        fallen: walker ? walker.fallen() : false, finished: finished, has3d: !!view3d, length: LENGTH };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(1 / 60); } },
    reset: function () { newRound(); }
  };

  /* サムネ撮影用。setup.age の年齢の体から始める。 */
  window.__thumbnail = function (setup) {
    setup = setup || {};
    if (setup.age != null) {
      if (!(setup.age >= 0 && setup.age < GOAL_AGE)) throw Error("age は 0〜" + (GOAL_AGE - 1));
      newRound();
      best = LW.distanceAt(setup.age);
      age = setup.age;
      setWalker(setup.age < 1 ? new LW.Walker("baby", best) : new LW.Walker("biped", best, { age: age, cane: age >= LW.CANE_AGE }));
      snap = true;
    }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      var o = { key: " ", code: "Space", bubbles: true };
      for (var i = 0; i < 200 && state === S.PLAY; i++) {
        await r.wait(250);
        window.dispatchEvent(new KeyboardEvent("keydown", o));
        await r.wait(300);
        window.dispatchEvent(new KeyboardEvent("keyup", o));
      }
      await r.until(function () { return state === S.RESULT; }, 10);
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(dt); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
