<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ボタンが生える</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* ボタンが生える

   上は携帯ゲーム機の緑の画面、下は本体。
   画面の中でボタンを拾うと、本体にそのボタンが生えて押せるようになる。
   はじめは十字キー（左右）とA（ジャンプ）だけ。
   スマホで押しながらの操作はしづらいので、生えるボタンはどれも1回押すだけで働く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  var SND = {
    jump: function () { tone(330, 0.12, 0.08, "square", 660); },
    pick: function () { tone(988, 0.08, 0.08, "square"); tone(1319, 0.14, 0.08, "square", null, 0.08); },
    sprout: function () { noiseHit(0.12, 300, 0.5, 1.5); tone(140, 0.18, 0.25, "sine", 70); },
    fall: function () { tone(500, 0.5, 0.08, "square", 80); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 0.07, "square", null, i * 0.08); }); },
    bow: function () { tone(440, 0.1, 0.07, "triangle", 330); tone(330, 0.12, 0.07, "triangle", 440, 0.35); },
    card: function () { noiseHit(0.08, 3000, 0.25, 2); noiseHit(0.08, 2600, 0.25, 2, 0.4); },
    nap: function () { tone(180, 0.6, 0.05, "sine", 140); tone(160, 0.6, 0.05, "sine", 120, 0.8); },
    morning: function () { [784, 988, 1175].forEach(function (f, i) { tone(f, 0.3, 0.05, "sine", null, i * 0.15); }); },
    tax: function () { for (var i = 0; i < 8; i++) tone(1800 + i * 90, 0.06, 0.04, "square", null, 0.2 + i * 0.07); },
    press: function () { tone(220, 0.04, 0.04, "square"); }
  };

  /* ============ 本体のボタン ============ */
  var BTN = {
    B: { label: "B", key: "x" },
    bow: { label: zT("おじぎ", "Bow"), key: "c" },
    card: { label: zT("名刺交換", "Swap Cards"), key: "v" },
    nap: { label: zT("二度寝", "Snooze"), key: "b" },
    tax: { label: zT("確定申告", "File Taxes"), key: "n" }
  };
  var ORDER = ["B", "bow", "card", "nap", "tax"];
  var CTRL = {};                                 /* 置き場所（ゲーム座標） */

  /* 画面（中のゲームは横160×縦128の点で描き、2.5倍で出す） */
  var LW = 160, LH = 128, SC = 2.5, LX = 70, LY = 60;
  var GROUND = 112;
  var PAL = ["#9bbc0f", "#8bac0f", "#306230", "#0f380f"];

  function place() {
    var top = 440;
    var cy = Math.min(640, Math.round(top + (H - top) * 0.25));
    CTRL.pad = { x: 130, y: cy };
    CTRL.A = { x: 452, y: cy - 26, r: 36 };
    CTRL.B = { x: 356, y: cy + 26, r: 36 };
    var r1 = cy + 128, r2 = r1 + 86;
    CTRL.bow = { x: 200, y: r1 };
    CTRL.card = { x: 360, y: r1 };
    CTRL.nap = { x: 200, y: r2 };
    CTRL.tax = { x: 360, y: r2 };
  }

  /* ============ 面 ============
     solids … 床・壁（x,y,w,h）。npc … ボタンで変わるもの。item … 拾うボタン。 */
  function ground(a, b) { return { x: a, y: GROUND, w: b - a, h: 16 }; }
  function makeStage(n) {
    var s = { n: n, w: 160, solids: [], npcs: [], items: [], flag: 150, flagY: GROUND, night: false };
    if (n === 0) {
      s.solids.push(ground(0, 56), ground(118, 160));
      s.items.push({ id: "B", x: 30, y: 100 });
    } else if (n === 1) {
      s.solids.push(ground(0, 160));
      s.items.push({ id: "bow", x: 34, y: 100 });
      s.npcs.push({ type: "guard", x: 96 });
    } else if (n === 2) {
      s.solids.push(ground(0, 104), { x: 104, y: 56, w: 56, h: 72 });
      s.items.push({ id: "card", x: 30, y: 100 });
      s.npcs.push({ type: "biz", x: 86 });
      s.flagY = 56;
    } else if (n === 3) {
      s.night = true;
      s.solids.push(ground(0, 40), ground(130, 160));
      s.items.push({ id: "nap", x: 18, y: 100 });
      s.npcs.push({ type: "bridge", x: 40, x1: 130 });
    } else if (n === 4) {
      s.solids.push(ground(0, 160));
      s.items.push({ id: "tax", x: 34, y: 100 });
      s.npcs.push({ type: "tax", x: 100 });
    } else {
      /* 最後は、それまでのボタンを全部使う */
      s.w = 520; s.night = true; s.flag = 506;
      s.solids.push(ground(0, 50), ground(112, 224), { x: 224, y: 56, w: 60, h: 72 },
        ground(284, 330), ground(410, 520));
      s.npcs.push({ type: "guard", x: 150 }, { type: "biz", x: 206 },
        { type: "bridge", x: 330, x1: 410 }, { type: "tax", x: 452 });
    }
    s.dark = s.night ? 1 : 0;
    s.npcs.forEach(function (o) { o.on = false; o.t = 0; });
    return s;
  }
  var LAST = 5;

  function npcSolids(o) {
    if (o.type === "guard") return [o.on ? { x: o.x - 4, y: GROUND - 14, w: 16, h: 14 } : { x: o.x, y: GROUND - 40, w: 8, h: 40 }];
    if (o.type === "biz") return [o.on ? { x: o.x - 3, y: GROUND - 26, w: 14, h: 26 } : { x: o.x, y: GROUND - 18, w: 8, h: 18 }];
    if (o.type === "bridge") return o.on ? [{ x: o.x, y: GROUND, w: o.x1 - o.x, h: 4 }] : [];
    if (o.type === "tax") {
      var r = [{ x: o.x, y: 56, w: 8, h: 56 }];
      if (o.on) r.push({ x: o.x - 14, y: GROUND - 24, w: 14, h: 24 });
      return r;
    }
    return [];
  }
  function allSolids() {
    var r = stage.solids.slice();
    stage.npcs.forEach(function (o) { r = r.concat(npcSolids(o)); });
    return r;
  }
  function hitRect(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, stage, P, has, grown, flights, retries, clearT, jumpQ, camX, fx;
  var keys = { L: false, R: false, B: false };
  var pointers = {};

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; retries = 0;
    has = {}; grown = {}; flights = [];
    loadStage(0);
  }
  function loadStage(n) {
    stage = makeStage(n);
    P = { x: 8, y: GROUND - 8, w: 6, h: 8, vx: 0, vy: 0, ground: true, face: 1, act: null, actT: 0, walk: 0 };
    clearT = -1; jumpQ = 0; camX = 0; fx = [];
  }
  function restartStage() {
    retries++;
    var keep = stage.n;
    loadStage(keep);
  }

  /* ============ 進行 ============ */
  var G = 600, JUMP = 208, WALK = 50, DASH = 110;
  function held(id) {
    if (id === "L" || id === "R" || id === "B") { if (keys[id]) return true; }
    for (var k in pointers) if (pointers[k] === id) return true;
    return false;
  }
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;

    flights.forEach(function (f) { f.t += dt; if (f.t >= 0.75 && !f.done) { f.done = true; has[f.id] = true; grown[f.id] = 0; SND.sprout(); } });
    flights = flights.filter(function (f) { return !f.done; });
    for (var g in grown) grown[g] += dt;
    stage.npcs.forEach(function (o) { if (o.on) o.t = Math.min(1, o.t + dt * 1.6); });
    if (stage.morning != null) {
      stage.morning += dt;
      stage.dark = Math.max(0, 1 - stage.morning);
    }
    fx.forEach(function (e) { e.t += dt; });
    fx = fx.filter(function (e) { return e.t < e.life; });

    if (clearT >= 0) {
      clearT += dt;
      if (clearT > 0.9) {
        if (stage.n >= LAST) finish();
        else loadStage(stage.n + 1);
      }
      return;
    }

    if (P.act) {
      P.actT -= dt;
      P.vx = 0;
      if (P.act === "nap" && P.target && !P.target.on && P.actT < 1.0) wake();
      if (P.actT <= 0) endAct();
    } else {
      var dir = (held("L") ? -1 : 0) + (held("R") ? 1 : 0);
      if (dir) P.face = dir;
      var want = dir * WALK, acc = 900 * dt;
      /* Bの大ジャンプ中は、着地まで前へ同じ速さで進む */
      if (P.longJump && !P.ground) P.vx = P.face * DASH;
      else { P.longJump = false; P.vx += Math.max(-acc, Math.min(acc, want - P.vx)); }
      if (jumpQ > 0 && P.ground) { P.vy = -JUMP; P.ground = false; jumpQ = 0; SND.jump(); }
    }
    jumpQ = Math.max(0, jumpQ - dt);
    P.vy = Math.min(320, P.vy + G * dt);

    var sol = allSolids();
    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > stage.w - P.w) P.x = stage.w - P.w;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vx > 0) P.x = r.x - P.w; else if (P.vx < 0) P.x = r.x + r.w;
      P.vx = 0;
    });
    P.y += P.vy * dt;
    P.ground = false;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vy > 0) { P.y = r.y - P.h; P.ground = true; } else if (P.vy < 0) P.y = r.y + r.h;
      P.vy = 0;
    });
    if (Math.abs(P.vx) > 1 && P.ground) P.walk += dt * Math.abs(P.vx) / 8;

    if (P.y > LH + 16) { SND.fall(); restartStage(); return; }

    stage.items.forEach(function (it) {
      if (it.got || has[it.id]) return;
      if (hitRect(P, { x: it.x - 4, y: it.y - 6, w: 8, h: 12 })) {
        it.got = true; SND.pick();
        var p = lcdToGame(it.x, it.y);
        flights.push({ id: it.id, t: 0, sx: p.x, sy: p.y });
      }
    });

    if (P.x + P.w >= stage.flag - 1 && P.y + P.h <= stage.flagY + 1 && P.y + P.h > stage.flagY - 30) {
      clearT = 0; SND.clear();
    }

    camX = Math.max(0, Math.min(stage.w - LW, Math.round(P.x - 70)));
  }

  /* ボタンの働き。近くに相手がいれば変わる。いなくても動作だけはする */
  var TARGET = { bow: "guard", card: "biz", nap: "bridge", tax: "tax" };
  var ACT_TIME = { bow: 0.7, card: 0.9, nap: 2.4, tax: 1.0 };
  function command(id) {
    if (state !== S.PLAY || !has[id] || P.act || clearT >= 0 || !P.ground) return;
    P.act = id; P.actT = ACT_TIME[id]; P.target = null;
    stage.npcs.forEach(function (o) {
      if (o.type !== TARGET[id] || o.on) return;
      var cx = o.type === "tax" ? o.x - 7 : o.x + 4;
      if (id === "nap" || Math.abs(P.x + 3 - cx) < 30) P.target = o;
    });
    SND[id]();
    if (id === "card") fx.push({ k: "card", t: 0, life: 0.9, x: P.x + 3, y: P.y, d: P.face });
    if (id === "nap") fx.push({ k: "zzz", t: 0, life: 1.6, x: P.x + 4, y: P.y });
    if (id === "tax") fx.push({ k: "paper", t: 0, life: 1.0, x: P.x + 3, y: P.y, d: P.face });
  }
  function wake() {
    P.target.on = true; P.target.t = 0;
    stage.morning = 0;
    SND.morning();
  }
  function endAct() {
    var o = P.target, id = P.act;
    P.act = null;
    if (o && !o.on) {
      o.on = true; o.t = 0;
      if (id === "tax") for (var i = 0; i < 10; i++) fx.push({ k: "coin", t: -i * 0.06, life: 0.8, x: o.x - 12 + (i % 3) * 4, y: 0 });
    }
    /* 変わった物に埋まったら上に乗せる */
    allSolids().forEach(function (r) { if (hitRect(P, r)) { P.y = r.y - P.h; P.vy = 0; P.ground = true; } });
  }
  function jump() { if (state === S.PLAY && !P.act) jumpQ = 0.12; }
  /* B … 1回押すだけで、向いている方へ大きく跳ぶ */
  function longJump() {
    if (state !== S.PLAY || !has.B || P.act || !P.ground || clearT >= 0) return;
    P.vy = -JUMP; P.ground = false; P.longJump = true; P.vx = P.face * DASH;
    SND.jump();
  }

  function finish() {
    state = S.RESULT;
    clearT = -1;
  }

  function lcdToGame(x, y) { return { x: LX + (x - camX) * SC, y: LY + y * SC }; }

  /* ============ 入力 ============ */
  function hitCtrl(x, y) {
    var p = CTRL.pad;
    if (Math.abs(y - p.y) < 80 && x > p.x - 100 && x < p.x + 100) return x < p.x ? "L" : "R";
    if (Math.hypot(x - CTRL.A.x, y - CTRL.A.y) < 52) return "A";
    if (has.B && Math.hypot(x - CTRL.B.x, y - CTRL.B.y) < 52) return "B";
    for (var i = 1; i < ORDER.length; i++) {
      var id = ORDER[i], c = CTRL[id];
      if (has[id] && Math.abs(x - c.x) < 64 && Math.abs(y - c.y) < 40) return id;
    }
    return null;
  }
  function press(id) {
    if (!id) return;
    if (id === "A") jump();
    else if (id === "B") longJump();
    else if (TARGET[id]) command(id);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var id = hitCtrl(p.x, p.y);
    pointers[e.pointerId] = id;
    if (id) SND.press();
    press(id);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pointers)) return;
    var cur = pointers[e.pointerId];
    if (cur !== "L" && cur !== "R" && cur !== null) return;
    var p = atCanvas(e), id = hitCtrl(p.x, p.y);
    if (id === "L" || id === "R") pointers[e.pointerId] = id;
  });
  function release(e) { delete pointers[e.pointerId]; }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);
  window.addEventListener("blur", function () { pointers = {}; keys.L = keys.R = keys.B = false; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1〜6 … その面へ（前の面までのボタンは持った状態）。9 … クリア */
  function debugKey(n) {
    if (state === S.INTRO) startButton.click();
    if (n >= 1 && n <= 6) {
      state = S.PLAY; shareButton.hidden = true;
      has = {}; grown = {};
      for (var i = 0; i < n - 1; i++) { has[ORDER[i]] = true; grown[ORDER[i]] = 9; }
      loadStage(n - 1);
    } else if (n === 9) finish();
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && (/^Digit[0-9]$/.test(e.code) || /^[0-9]$/.test(e.key))) { e.preventDefault(); debugKey(Number(e.key)); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat) newRound(); return; }
    if (state === S.INTRO) { if (k === " " || k === "enter") e.preventDefault(); return; }
    if (state === S.RESULT) { if ((k === " " || k === "enter") && !e.repeat) { e.preventDefault(); newRound(); } return; }
    var hit = true;
    if (k === "arrowleft" || k === "a") keys.L = true;
    else if (k === "arrowright" || k === "d") keys.R = true;
    else if (k === "x" || k === "shift") { if (!e.repeat) longJump(); }
    else if (k === " " || k === "z" || k === "arrowup" || k === "w" || k === "enter") { if (!e.repeat) jump(); }
    else {
      hit = false;
      for (var i = 1; i < ORDER.length; i++) if (BTN[ORDER[i]].key === k) { hit = true; if (!e.repeat) command(ORDER[i]); }
    }
    if (hit) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.L = false;
    else if (k === "arrowright" || k === "d") keys.R = false;
    else if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  function secText() { return (Math.floor(T * 10) / 10).toFixed(1); }
  function doShare() {
    var s = secText();
    window.zResultActions.x({ text:
      zT("ゲーム機に「確定申告」ボタンが生えたので、" + s + "秒で確定申告しました",
         "My game console grew a \"File Taxes\" button, so I filed my taxes in " + s + "s") +
      zT(" #ボタンが生える", " #ButtonsSprout") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    drawBody();
    drawLCD();
    drawControls();
    flights.forEach(drawFlight);
    if (state === S.RESULT) drawResult();
  }

  function drawBody() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#d3d0c9"); g.addColorStop(1, "#bdb9b1");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(W, 14); ctx.stroke();
    /* 画面の縁。右下だけ大きく丸い */
    var x = 30, y = 28, w = 480, h = 392, r = 14, R = 64;
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - R); ctx.arcTo(x + w, y + h, x + w - R, y + h, R);
    ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
    ctx.fillStyle = "#5c5b6b"; ctx.fill();
    /* 電源の灯り（点けっぱなし） */
    ctx.fillStyle = state === S.INTRO ? "#4a2a2a" : "#e04545";
    ctx.beginPath(); ctx.arc(50, 190, 5, 0, Math.PI * 2); ctx.fill();
    /* スピーカーの穴 */
    ctx.save(); ctx.translate(470, H - 70); ctx.rotate(-0.5);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    for (var i = 0; i < 6; i++) { roundRect(-40 + i * 14, -32, 6, 64, 3); ctx.fill(); }
    ctx.restore();
  }

  function C(i) { return PAL[i]; }
  function px(x, y, w, h, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

  function drawLCD() {
    ctx.fillStyle = "#2c2c34";
    ctx.fillRect(LX - 4, LY - 4, LW * SC + 8, LH * SC + 8);
    ctx.save();
    ctx.beginPath(); ctx.rect(LX, LY, LW * SC, LH * SC); ctx.clip();
    ctx.translate(LX, LY); ctx.scale(SC, SC);
    px(0, 0, LW, LH, 0);
    ctx.translate(-camX, 0);

    /* 空：夜は月、朝からは太陽（どちらも静止） */
    if (stage.night && stage.dark > 0.5) {
      ctx.fillStyle = PAL[1]; ctx.beginPath(); ctx.arc(camX + 132, 20, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL[0]; ctx.beginPath(); ctx.arc(camX + 135, 18, 5, 0, Math.PI * 2); ctx.fill();
    } else if (stage.night) {
      ctx.fillStyle = PAL[1]; ctx.beginPath(); ctx.arc(camX + 132, 20 + stage.dark * 30, 7, 0, Math.PI * 2); ctx.fill();
    }
    px(camX + 20, 22, 18, 4, 1); px(camX + 24, 19, 10, 3, 1);
    px(camX + 70, 34, 22, 4, 1); px(camX + 75, 31, 12, 3, 1);

    stage.solids.forEach(function (r) {
      px(r.x, r.y, r.w, r.h, 2);
      px(r.x, r.y, r.w, 2, 3);
      for (var i = r.x + 3; i < r.x + r.w - 1; i += 6) px(i, r.y + 5 + ((i / 6) % 2) * 4, 2, 2, 1);
    });

    /* 旗 */
    px(stage.flag, stage.flagY - 26, 2, 26, 3);
    px(stage.flag - 10, stage.flagY - 26, 10, 7, 2);

    stage.npcs.forEach(drawNpc);

    stage.items.forEach(function (it) {
      if (it.got || has[it.id]) return;
      var b = Math.round(Math.sin(T * 5 + it.x) * 1.5);
      px(it.x - 3, it.y - 4 + b, 6, 6, 3); px(it.x - 2, it.y - 3 + b, 4, 4, 2); px(it.x - 2, it.y - 3 + b, 2, 2, 1);
      px(it.x - 4, it.y + 2 + b, 8, 2, 3);
    });

    drawPlayer();
    fx.forEach(drawFx);
    ctx.restore();

    /* 夜は全体を暗く（ゆっくり明ける） */
    if (stage.dark > 0) {
      ctx.fillStyle = "rgba(15,56,15," + (0.55 * stage.dark) + ")";
      ctx.fillRect(LX, LY, LW * SC, LH * SC);
    }
  }

  function drawPlayer() {
    var x = Math.round(P.x), y = Math.round(P.y), f = P.face;
    if (P.act === "nap") {
      px(x - 2, y + 4, 10, 4, 3); px(f > 0 ? x + 5 : x - 3, y + 3, 4, 4, 3); px(x - 2, y + 4, 8, 2, 1);
      return;
    }
    if (P.act === "bow" && P.actT < ACT_TIME.bow - 0.1) {
      px(x, y + 4, 6, 4, 3); px(f > 0 ? x + 4 : x - 2, y + 3, 4, 3, 3);
      return;
    }
    px(x + 1, y, 4, 3, 3);
    px(f > 0 ? x + 3 : x + 1, y + 1, 1, 1, 0);
    px(x, y + 3, 6, 3, 3);
    var leg = P.ground ? (Math.floor(P.walk) % 2) : 1;
    px(x + (leg ? 0 : 1), y + 6, 2, 2, 3); px(x + (leg ? 4 : 3), y + 6, 2, 2, 3);
    if (P.act === "card" || P.act === "tax") px(f > 0 ? x + 6 : x - 2, y + 3, 2, 1, 3);
  }

  function drawNpc(o) {
    var t = o.t, x = o.x;
    if (o.type === "guard") {
      if (!o.on) {
        px(x - 1, GROUND - 40, 10, 3, 3); px(x + 1, GROUND - 46, 6, 6, 3);
        px(x + 1, GROUND - 37, 6, 6, 2); px(x + 2, GROUND - 35, 1, 1, 0);
        px(x, GROUND - 31, 8, 22, 3); px(x + 3, GROUND - 31, 2, 22, 2);
        px(x, GROUND - 9, 3, 9, 3); px(x + 5, GROUND - 9, 3, 9, 3);
        px(x + 9, GROUND - 44, 1, 44, 2);                       /* 槍 */
      } else {
        /* 深くおじぎしたまま */
        px(x - 4, GROUND - 14, 16, 6, 3); px(x - 8, GROUND - 13, 5, 5, 2);
        px(x + 8, GROUND - 9, 4, 9, 3); px(x + 4, GROUND - 9, 3, 9, 3);
        px(x + 12, GROUND - 3, 10, 1, 2);                       /* 槍は寝かせる */
      }
    } else if (o.type === "biz") {
      if (!o.on) {
        px(x + 1, GROUND - 18, 6, 5, 3);
        px(x, GROUND - 13, 8, 8, 3); px(x + 3, GROUND - 13, 2, 3, 0); px(x + 3, GROUND - 11, 2, 4, 2);
        px(x + 1, GROUND - 5, 2, 5, 3); px(x + 5, GROUND - 5, 2, 5, 3);
        px(x + 8, GROUND - 8, 4, 3, 2);                          /* かばん */
      } else {
        var lift = Math.round(8 * Math.min(1, t * 2));
        px(x - 3, GROUND - 18 - lift, 14, 2, 3);                /* 手のひらを組んで足場に */
        px(x + 1, GROUND - 18, 6, 5, 3);
        px(x, GROUND - 13, 8, 8, 3); px(x + 3, GROUND - 13, 2, 3, 0);
        px(x - 2, GROUND - 18 - lift, 2, lift + 6, 3); px(x + 8, GROUND - 18 - lift, 2, lift + 6, 3);
        px(x + 1, GROUND - 5, 2, 5, 3); px(x + 5, GROUND - 5, 2, 5, 3);
      }
    } else if (o.type === "bridge") {
      var len = o.x1 - o.x;
      px(o.x - 3, GROUND - 30, 3, 30, 3);
      px(o.x1, GROUND - 30, 3, 30, 3);
      var a = (o.on ? t : 0) * Math.PI / 2;               /* 立った橋が倒れて渡れる */
      ctx.save(); ctx.translate(o.x, GROUND);
      ctx.rotate(-Math.PI / 2 + a);
      px(0, 0, len, 4, 2); px(0, 0, len, 1, 3);
      ctx.restore();
    } else if (o.type === "tax") {
      px(x - 2, 54, 12, 3, 3);
      px(x, 57, 8, 55, 2);
      for (var yy = 62; yy < 100; yy += 10) px(x + 2, yy, 4, 5, 1);
      px(x + 1, 102, 6, 10, 3);
      if (o.on) {
        var n = Math.round(Math.min(1, t * 1.5) * 6);
        for (var i = 0; i < n; i++) {
          px(x - 14, GROUND - 4 - i * 4, 14, 4, i % 2 ? 2 : 3);
          px(x - 12, GROUND - 3 - i * 4, 10, 1, 1);
        }
      }
    }
  }

  function drawFx(e) {
    var t = Math.max(0, e.t);
    if (e.k === "card") {
      var d = Math.min(1, t * 3);
      px(e.x + e.d * (4 + d * 14), e.y + 2, 5, 3, 0);
      ctx.strokeStyle = PAL[3]; ctx.lineWidth = 0.6;
      ctx.strokeRect(Math.round(e.x + e.d * (4 + d * 14)), e.y + 2, 5, 3);
    } else if (e.k === "zzz") {
      for (var i = 0; i < 3; i++) {
        var u = t - i * 0.4; if (u < 0) continue;
        var zx = e.x + 4 + u * 8 + i * 3, zy = e.y - 4 - u * 10;
        px(zx, zy, 3, 1, 3); px(zx + 1, zy + 1, 1, 1, 3); px(zx, zy + 2, 3, 1, 3);
      }
    } else if (e.k === "paper") {
      px(e.x + e.d * (3 + t * 18), e.y - t * 20, 4, 5, 0);
    } else if (e.k === "coin") {
      if (e.t < 0) return;
      var cy = Math.min(GROUND - 6, e.t * e.t * 600);
      px(e.x, cy, 4, 3, 1); px(e.x + 1, cy, 2, 1, 3);
    }
  }

  function drawControls() {
    var p = CTRL.pad, L = held("L"), R = held("R");
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath(); ctx.arc(p.x, p.y, 78, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2b2a31";
    roundRect(p.x - 66, p.y - 22, 132, 44, 6); ctx.fill();
    roundRect(p.x - 22, p.y - 66, 44, 132, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    if (L) { roundRect(p.x - 64, p.y - 20, 40, 40, 5); ctx.fill(); }
    if (R) { roundRect(p.x + 24, p.y - 20, 40, 40, 5); ctx.fill(); }
    ctx.fillStyle = "#3d3c45";
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();

    roundBtn("A", CTRL.A, true);
    if (has.B) roundBtn("B", CTRL.B, true);
    for (var i = 1; i < ORDER.length; i++) if (has[ORDER[i]]) pillBtn(ORDER[i]);
  }
  function popScale(id) {
    if (!(id in grown)) return 1;
    var t = grown[id];
    if (t > 0.5) return 1;
    return 1 + Math.sin(t / 0.5 * Math.PI) * 0.35 * (1 - t / 0.5);
  }
  function roundBtn(id, c, label) {
    var down = id === "A" ? held("A") : held(id);
    var s = popScale(id);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.arc(0, 4, c.r + 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = down ? "#6d153c" : "#8c1e4f";
    ctx.beginPath(); ctx.arc(0, down ? 3 : 0, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.beginPath(); ctx.arc(-10, -10 + (down ? 3 : 0), 12, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (label) {
      ctx.fillStyle = "#2b3a8c"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(BTN[id] ? BTN[id].label : id, c.x + 18, c.y + c.r + 28);
    }
  }
  function pillBtn(id) {
    var c = CTRL[id], down = held(id), s = popScale(id);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s);
    ctx.rotate(-0.42);
    ctx.fillStyle = "rgba(0,0,0,.15)";
    roundRect(-44, -12, 88, 30, 15); ctx.fill();
    ctx.fillStyle = down ? "#4f4d56" : "#6f6c78";
    roundRect(-42, -15 + (down ? 2 : 0), 84, 26, 13); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#2b3a8c"; ctx.font = "bold 17px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(BTN[id].label, c.x, c.y + 40);
  }
  function drawFlight(f) {
    var c = CTRL[f.id], u = Math.min(1, f.t / 0.75);
    var e = u * u * (3 - 2 * u);
    var x = f.sx + (c.x - f.sx) * e, y = f.sy + (c.y - f.sy) * e - Math.sin(u * Math.PI) * 120;
    var s = 0.25 + 0.75 * e;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(u * Math.PI * 2);
    if (f.id === "B") { ctx.fillStyle = "#8c1e4f"; ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = "#6f6c78"; roundRect(-42, -13, 84, 26, 13); ctx.fill(); }
    ctx.restore();
  }

  /* 結果画面。秒数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, stage: stage.n, x: P.x, y: P.y, ground: P.ground, act: P.act,
        has: Object.keys(has), time: T, retries: retries, clear: clearT >= 0, W: W, H: H, ctrl: CTRL };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
