<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ボタンが生える</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* ボタンが生える（題名は仮）

   上はゲーム機の画面、下は本体。本体には最初から、わけのわからないボタンが10個並んでいる。
   どの面も、ふつうの左右とジャンプだけでは抜けられない。どれかのボタンに、ちゃんと使い道がある。
   どのボタンも1回押すだけで働く（スマホで押しながらの操作はしづらいので）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  var SND = {
    jump: function () { tone(330, 0.12, 0.08, "square", 660); },
    fall: function () { tone(500, 0.5, 0.08, "square", 80); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 0.07, "square", null, i * 0.08); }); },
    press: function () { tone(220, 0.04, 0.04, "square"); },
    teiji: function () { [880, 740, 587].forEach(function (f, i) { tone(f, 0.25, 0.05, "sine", null, i * 0.18); }); },
    bow: function () { tone(440, 0.1, 0.07, "triangle", 330); },
    card: function () { noiseHit(0.08, 3000, 0.25, 2); },
    stick: function () { noiseHit(0.05, 1200, 0.3, 3); },
    clap: function () { noiseHit(0.05, 1800, 0.6, 0.8); noiseHit(0.05, 1800, 0.6, 0.8, 0.18); },
    kidoku: function () { tone(1200, 0.05, 0.05, "square"); tone(1500, 0.05, 0.05, "square", null, 0.07); },
    sneeze: function () { tone(600, 0.25, 0.05, "triangle", 900); noiseHit(0.3, 2500, 0.5, 0.7, 0.3); },
    nap: function () { tone(180, 0.6, 0.05, "sine", 140); tone(160, 0.6, 0.05, "sine", 120, 0.8); },
    morning: function () { [784, 988, 1175].forEach(function (f, i) { tone(f, 0.3, 0.05, "sine", null, i * 0.15); }); },
    tax: function () { for (var i = 0; i < 8; i++) tone(1800 + i * 90, 0.06, 0.04, "square", null, 0.2 + i * 0.07); },
    dogeza: function () { noiseHit(0.4, 400, 0.3, 0.8); },
    clr: function () { tone(1200, 0.5, 0.05, "sine", 200); },
    open: function () { tone(200, 0.4, 0.06, "square", 400); }
  };

  /* ============ 本体のボタン ============ */
  var BTN = {
    bow:    { label: zT("おじぎ", "Bow"), col: "#3d9a8b", key: "q" },
    tax:    { label: zT("確定申告", "File Taxes"), col: "#d79a2b", key: "w" },
    sneeze: { label: zT("くしゃみ", "Sneeze"), col: "#c95c8a", key: "e" },
    teiji:  { label: zT("定時退社", "Leave on Time"), col: "#4a74c9", key: "r" },
    dogeza: { label: zT("土下座", "Grovel"), col: "#7b8a3a", key: "t" },
    clap:   { label: zT("拍手", "Clap"), col: "#e07b3a", key: "y" },
    clr:    { label: zT("クリア", "Clear"), col: "#8e97a8", key: "u" },
    nap:    { label: zT("二度寝", "Snooze"), col: "#8a5fc0", key: "i" },
    card:   { label: zT("名刺交換", "Swap Cards"), col: "#3a8fb0", key: "o" },
    kidoku: { label: zT("既読スルー", "Leave on Read"), col: "#5aa05a", key: "p" }
  };
  var ORDER = ["bow", "tax", "sneeze", "teiji", "dogeza", "clap", "clr", "nap", "card", "kidoku"];
  var CTRL = {};

  /* 画面（中のゲームは横160×縦128の点で描き、2.5倍で出す） */
  var LW = 160, LH = 128, SC = 2.5, LX = 70, LY = 60;
  var GROUND = 112;
  var PAL = ["#d8e6ea", "#a6bfc8", "#577684", "#22323c"];

  function place() {
    var top = 430;
    var cy = Math.min(620, Math.round(top + (H - top) * 0.2));
    CTRL.L = { x: 72, y: cy, r: 38, col: "#3a3f52" };
    CTRL.R = { x: 178, y: cy, r: 38, col: "#3a3f52" };
    CTRL.A = { x: 462, y: cy, r: 40, col: "#e2574c" };
    var r1 = cy + 112, r2 = r1 + 96;
    ORDER.forEach(function (id, i) {
      CTRL[id] = { x: 62 + (i % 5) * 104, y: i < 5 ? r1 : r2, r: 30, col: BTN[id].col };
    });
  }

  /* ============ 面 ============
     solids … 床・壁。npc … ボタンで変わるもの。 */
  function ground(a, b) { return { x: a, y: GROUND, w: b - a, h: 16 }; }
  function block(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
  function makeStage(n) {
    var s = { n: n, w: 160, solids: [], npcs: [], flag: 150, flagY: GROUND, night: false };
    var full = [ground(0, 160)];
    if (n === 0) {          /* 定時退社：帰りたい一心で穴を跳び越える */
      s.solids.push(ground(0, 50), ground(122, 160));
    } else if (n === 1) {   /* おじぎ：頭を下げて低いところをくぐる */
      s.solids = full; s.solids.push(block(70, GROUND - 40, 44, 34));
    } else if (n === 2) {   /* 名刺交換：投げた名刺が壁に刺さって足場になる */
      s.solids.push(ground(0, 100), block(100, GROUND - 38, 60, 54));
      s.flagY = GROUND - 38;
    } else if (n === 3) {   /* 拍手：手を叩くと開く扉 */
      s.solids = full; s.npcs.push({ type: "door", x: 96 });
    } else if (n === 4) {   /* 既読スルー：話しかけてくる人を素通り */
      s.solids = full; s.npcs.push({ type: "talker", x: 90 });
    } else if (n === 5) {   /* くしゃみ：大きな綿ぼこりを吹き飛ばす */
      s.solids = full; s.npcs.push({ type: "dust", x: 84 });
    } else if (n === 6) {   /* 二度寝：朝になると跳ね橋が下りる */
      s.night = true;
      s.solids.push(ground(0, 40), ground(130, 160));
      s.npcs.push({ type: "bridge", x: 40, x1: 130 });
    } else if (n === 7) {   /* 確定申告：還付金が積み上がって段になる */
      s.solids = full; s.npcs.push({ type: "tax", x: 100 });
    } else if (n === 8) {   /* 土下座：すべり込んでシャッターの隙間を抜ける */
      s.solids = full; s.solids.push(block(80, GROUND - 50, 30, 47));
    } else {
      /* 最後は全部つなげる */
      s.w = 820; s.night = true; s.flag = 806;
      s.solids.push(ground(0, 60), ground(132, 500), ground(590, 820),
        block(160, GROUND - 40, 44, 34),                 /* おじぎ */
        block(420, GROUND - 38, 50, 54),                 /* 名刺交換 */
        block(630, GROUND - 50, 30, 47));                /* 土下座 */
      s.npcs.push({ type: "talker", x: 240 }, { type: "dust", x: 290 }, { type: "door", x: 370 },
        { type: "bridge", x: 500, x1: 590 }, { type: "tax", x: 730 });
    }
    s.dark = s.night ? 1 : 0;
    s.npcs.forEach(function (o) { o.on = false; o.t = 0; });
    return s;
  }
  var LAST = 9;

  function npcSolids(o) {
    if (o.type === "door") return o.on ? [] : [{ x: o.x, y: GROUND - 60, w: 6, h: 60 }];
    if (o.type === "talker") return P && P.ghost > 0 ? [] : [{ x: o.x, y: GROUND - 40, w: 8, h: 40 }];
    if (o.type === "dust") return o.on ? [] : [{ x: o.x, y: GROUND - 38, w: 38, h: 38 }];
    if (o.type === "bridge") return o.on ? [{ x: o.x, y: GROUND, w: o.x1 - o.x, h: 4 }] : [];
    if (o.type === "tax") {
      var r = [{ x: o.x, y: 56, w: 8, h: 56 }];
      if (o.on) r.push({ x: o.x - 14, y: GROUND - 24, w: 14, h: 24 });
      return r;
    }
    return [];
  }
  function allSolids() {
    var r = stage.solids.slice();
    stage.npcs.forEach(function (o) { r = r.concat(npcSolids(o)); });
    cards.forEach(function (c) { if (c.stuck) r.push({ x: c.x, y: c.y, w: 6, h: 2 }); });
    return r;
  }
  function hitRect(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function hitsAny(r) { return allSolids().some(function (s) { return hitRect(r, s); }); }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, stage, P = null, retries, clearT, jumpQ, camX, fx, cards, wipe;
  var keys = { L: false, R: false };
  var pointers = {}, flash = {};

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; retries = 0;
    loadStage(0);
  }
  function loadStage(n) {
    cards = []; P = null;
    stage = makeStage(n);
    P = { x: 8, y: GROUND - 8, w: 6, h: 8, vx: 0, vy: 0, ground: true, face: 1, act: null, actT: 0, walk: 0, ghost: 0 };
    clearT = -1; jumpQ = 0; camX = 0; fx = []; wipe = -1;
  }

  /* ============ 進行 ============ */
  var G = 600, JUMP = 208, WALK = 50, RUN = 120;
  function held(id) {
    if ((id === "L" || id === "R") && keys[id]) return true;
    for (var k in pointers) if (pointers[k] === id) return true;
    return (flash[id] || 0) > 0;
  }
  /* 姿勢を低くする・戻す。戻すと天井にぶつかるときは低いまま */
  function setLow(h) {
    var nb = P.y + P.h;
    if (h > P.h && hitsAny({ x: P.x, y: nb - h, w: P.w, h: h })) return false;
    P.y = nb - h; P.h = h; return true;
  }
  function groundAhead(d) {
    var probe = { x: P.x + (d > 0 ? P.w + 4 : -5), y: P.y + P.h + 1, w: 1, h: 6 };
    return hitsAny(probe);
  }
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    for (var f in flash) flash[f] -= dt;

    stage.npcs.forEach(function (o) { if (o.on) o.t = Math.min(1, o.t + dt * 1.6); });
    if (stage.morning != null) { stage.morning += dt; stage.dark = Math.max(0, 1 - stage.morning); }
    fx.forEach(function (e) { e.t += dt; });
    fx = fx.filter(function (e) { return e.t < e.life; });
    if (P.ghost > 0) {
      P.ghost -= dt;
      if (P.ghost <= 0 && stage.npcs.some(function (o) { return o.type === "talker" && hitRect(P, npcBox(o)); })) P.ghost = 0.05;
    }

    if (wipe >= 0) {                     /* クリア：画面の中身がゆっくり消えて、最初からになる */
      wipe += dt;
      if (wipe > 1.2) loadStage(stage.n);
      return;
    }
    if (clearT >= 0) {
      clearT += dt;
      if (clearT > 0.9) { if (stage.n >= LAST) finish(); else loadStage(stage.n + 1); }
      return;
    }

    updateCards(dt);

    var want = 0;
    if (P.act) {
      P.actT -= dt;
      var a = P.act;
      if (a === "teiji") {
        want = P.face * RUN;
        if (P.ground && !groundAhead(P.face)) { P.vy = -JUMP; P.ground = false; SND.jump(); }
      } else if (a === "bow") want = P.face * 40;
      else if (a === "dogeza") want = P.face * 80 * Math.min(1, P.actT / 0.3 + 0.2);
      if (P.actT <= 0) {
        if ((a === "bow" || a === "dogeza") && !setLow(8)) P.actT = 0.05;
        else endAct();
      }
      if (a === "teiji" || a === "bow" || a === "dogeza") P.vx = want;
      else P.vx = 0;
      if (a === "nap" && P.target && !P.target.on && P.actT < 1.0) wake();
    } else {
      var dir = (held("L") ? -1 : 0) + (held("R") ? 1 : 0);
      if (dir) P.face = dir;
      want = dir * WALK;
      var acc = 900 * dt;
      P.vx += Math.max(-acc, Math.min(acc, want - P.vx));
      if (jumpQ > 0 && P.ground) { P.vy = -JUMP; P.ground = false; jumpQ = 0; SND.jump(); }
    }
    jumpQ = Math.max(0, jumpQ - dt);
    P.vy = Math.min(320, P.vy + G * dt);

    var sol = allSolids();
    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > stage.w - P.w) P.x = stage.w - P.w;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vx > 0) P.x = r.x - P.w; else if (P.vx < 0) P.x = r.x + r.w;
      P.vx = 0;
    });
    P.y += P.vy * dt;
    P.ground = false;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vy > 0) { P.y = r.y - P.h; P.ground = true; } else if (P.vy < 0) P.y = r.y + r.h;
      P.vy = 0;
    });
    if (Math.abs(P.vx) > 1 && P.ground) P.walk += dt * Math.abs(P.vx) / 8;

    if (P.y > LH + 16) { SND.fall(); retries++; loadStage(stage.n); return; }

    if (P.x + P.w >= stage.flag - 1 && P.y + P.h <= stage.flagY + 1 && P.y + P.h > stage.flagY - 30) {
      clearT = 0; P.act = null; SND.clear();
    }
    camX = Math.max(0, Math.min(stage.w - LW, Math.round(P.x - 70)));
  }

  /* 名刺：前へ飛んで、壁に当たるとその場に刺さる */
  function updateCards(dt) {
    cards.forEach(function (c) {
      if (c.stuck || c.gone) return;
      c.x += c.d * 160 * dt; c.life -= dt;
      var box = { x: c.x, y: c.y, w: 6, h: 2 };
      var walls = stage.solids.concat([].concat.apply([], stage.npcs.map(npcSolids)));
      walls.forEach(function (r) {
        if (c.stuck || !hitRect(box, r)) return;
        c.stuck = true; c.x = c.d > 0 ? r.x - 5 : r.x + r.w - 1; SND.stick();
      });
      /* 刺さった名刺に重なったら、その上に乗せる */
      if (c.stuck && hitRect(P, { x: c.x, y: c.y, w: 6, h: 2 })) { P.y = c.y - P.h; P.vy = 0; P.ground = true; }
      if (c.life <= 0) c.gone = true;
    });
    cards = cards.filter(function (c) { return !c.gone; });
    var stuck = cards.filter(function (c) { return c.stuck; });
    if (stuck.length > 3) cards.splice(cards.indexOf(stuck[0]), 1);
  }

  function npcBox(o) {
    if (o.type === "talker") return { x: o.x, y: GROUND - 40, w: 8, h: 40 };
    return { x: o.x, y: 0, w: 8, h: GROUND };
  }

  /* ボタンの働き。どれもいつでも押せて、動作だけはする */
  var ACT_TIME = { teiji: 1.4, bow: 1.6, card: 0.5, clap: 0.6, kidoku: 0.4, sneeze: 0.9, nap: 2.4, tax: 1.0, dogeza: 0.9, clr: 0 };
  function near(type, range) {
    var best = null;
    stage.npcs.forEach(function (o) {
      if (o.type !== type || o.on) return;
      var cx = o.type === "tax" ? o.x - 7 : o.type === "dust" ? o.x + (P.face > 0 ? 0 : 38) : o.x + 3;
      if (range < 0 || Math.abs(P.x + 3 - cx) < range) best = o;
    });
    return best;
  }
  function command(id) {
    if (state !== S.PLAY || clearT >= 0 || wipe >= 0) return;
    if (P.act && P.act !== "kidoku") return;
    if (id === "clr") { wipe = 0; SND.clr(); return; }
    if (id !== "kidoku" && !P.ground) return;
    P.act = id; P.actT = ACT_TIME[id]; P.target = null;
    SND[id]();
    if (id === "bow") setLow(5);
    if (id === "dogeza") setLow(3);
    if (id === "card") cards.push({ x: P.x + (P.face > 0 ? P.w : -6), y: P.y + 2, d: P.face, life: 1.2 });
    if (id === "clap") { P.target = near("door", 70); fx.push({ k: "clap", t: 0, life: 0.6, x: P.x, y: P.y }); }
    if (id === "kidoku") { P.ghost = 2.2; P.act = null; fx.push({ k: "read", t: 0, life: 1.0, x: P.x, y: P.y }); }
    if (id === "sneeze") P.target = near("dust", 50);
    if (id === "nap") { P.target = near("bridge", -1); fx.push({ k: "zzz", t: 0, life: 1.6, x: P.x + 4, y: P.y }); }
    if (id === "tax") { P.target = near("tax", 30); fx.push({ k: "paper", t: 0, life: 1.0, x: P.x + 3, y: P.y, d: P.face }); }
  }
  function wake() {
    P.target.on = true; P.target.t = 0;
    stage.morning = 0;
    SND.morning();
  }
  function endAct() {
    var o = P.target, id = P.act;
    P.act = null;
    if (id === "sneeze") fx.push({ k: "spray", t: 0, life: 0.5, x: P.x + (P.face > 0 ? 6 : 0), y: P.y + 2, d: P.face });
    if (o && !o.on) {
      o.on = true; o.t = 0;
      if (id === "clap") SND.open();
      if (id === "tax") for (var i = 0; i < 10; i++) fx.push({ k: "coin", t: -i * 0.06, life: 0.8, x: o.x - 12 + (i % 3) * 4, y: 0 });
    }
    allSolids().forEach(function (r) { if (hitRect(P, r)) { P.y = r.y - P.h; P.vy = 0; P.ground = true; } });
  }
  function jump() { if (state === S.PLAY && !P.act) jumpQ = 0.12; }

  function finish() { state = S.RESULT; clearT = -1; }

  /* ============ 入力 ============ */
  function hitCtrl(x, y) {
    var ids = ["L", "R", "A"].concat(ORDER), best = null, bd = 1e9;
    ids.forEach(function (id) {
      var c = CTRL[id], d = Math.hypot(x - c.x, y - c.y);
      if (d < c.r + 20 && d < bd) { bd = d; best = id; }
    });
    return best;
  }
  function press(id) {
    if (!id) return;
    if (id === "A") jump();
    else if (BTN[id]) command(id);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var id = hitCtrl(p.x, p.y);
    pointers[e.pointerId] = id;
    if (id) SND.press();
    press(id);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pointers)) return;
    var cur = pointers[e.pointerId];
    if (cur !== "L" && cur !== "R" && cur !== null) return;
    var p = atCanvas(e), id = hitCtrl(p.x, p.y);
    if (id === "L" || id === "R") pointers[e.pointerId] = id;
  });
  function release(e) { delete pointers[e.pointerId]; }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);
  window.addEventListener("blur", function () { pointers = {}; keys.L = keys.R = false; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1〜9 … その面へ。0 … 最後の面。- … 結果画面 */
  function debugKey(n) {
    if (state === S.INTRO) startButton.click();
    state = S.PLAY; shareButton.hidden = true;
    loadStage(n === 0 ? LAST : n - 1);
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && (/^Digit[0-9]$/.test(e.code) || /^[0-9]$/.test(e.key))) { e.preventDefault(); debugKey(Number(e.key)); return; }
    if (DEBUG && e.key === "-") { finish(); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat) newRound(); return; }
    if (state === S.INTRO) { if (k === " " || k === "enter") e.preventDefault(); return; }
    if (state === S.RESULT) { if ((k === " " || k === "enter") && !e.repeat) { e.preventDefault(); newRound(); } return; }
    var hit = true;
    if (k === "arrowleft" || k === "a") keys.L = true;
    else if (k === "arrowright" || k === "d") keys.R = true;
    else if (k === " " || k === "z" || k === "arrowup" || k === "enter") { if (!e.repeat) { flash.A = 0.12; jump(); } }
    else {
      hit = false;
      ORDER.forEach(function (id) { if (BTN[id].key === k) { hit = true; if (!e.repeat) { flash[id] = 0.15; command(id); } } });
    }
    if (hit) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.L = false;
    else if (k === "arrowright" || k === "d") keys.R = false;
    else if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  function secText() { return (Math.floor(T * 10) / 10).toFixed(1); }
  function doShare() {
    var s = secText();
    window.zResultActions.x({ text:
      zT("「既読スルー」と「確定申告」を使いこなして、" + s + "秒でクリアしました",
         "Mastered \"Leave on Read\" and \"File Taxes\" and cleared it in " + s + "s") +
      zT(" #ボタンが生える", " #ButtonsSprout") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    drawBody();
    drawLCD();
    drawControls();
    if (state === S.RESULT) drawResult();
  }

  function drawBody() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#f5d77e"); g.addColorStop(1, "#ecc65f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2f3550";
    roundRect(30, 28, 480, 392, 30); ctx.fill();
    ctx.fillStyle = state === S.INTRO ? "#4a5a4a" : "#6ee07a";
    ctx.beginPath(); ctx.arc(270, 400, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.16)";
    for (var i = 0; i < 4; i++) for (var j = 0; j < 3; j++) {
      ctx.beginPath(); ctx.arc(W / 2 - 27 + i * 18, H - 70 + j * 18, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function px(x, y, w, h, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

  function drawLCD() {
    ctx.fillStyle = "#2c2c34";
    ctx.fillRect(LX - 4, LY - 4, LW * SC + 8, LH * SC + 8);
    ctx.save();
    ctx.beginPath(); ctx.rect(LX, LY, LW * SC, LH * SC); ctx.clip();
    ctx.translate(LX, LY); ctx.scale(SC, SC);
    px(0, 0, LW, LH, 0);
    ctx.translate(-camX, 0);

    if (stage.night && stage.dark > 0.5) {
      ctx.fillStyle = PAL[1]; ctx.beginPath(); ctx.arc(camX + 132, 20, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL[0]; ctx.beginPath(); ctx.arc(camX + 135, 18, 5, 0, Math.PI * 2); ctx.fill();
    } else if (stage.night) {
      ctx.fillStyle = PAL[1]; ctx.beginPath(); ctx.arc(camX + 132, 20 + stage.dark * 30, 7, 0, Math.PI * 2); ctx.fill();
    }
    for (var cx = 20; cx < stage.w; cx += 110) { px(cx, 22 + (cx % 3) * 6, 18, 4, 1); px(cx + 4, 19 + (cx % 3) * 6, 10, 3, 1); }

    stage.solids.forEach(function (r) {
      px(r.x, r.y, r.w, r.h, 2);
      px(r.x, r.y, r.w, 2, 3);
      for (var i = r.x + 3; i < r.x + r.w - 1; i += 6) px(i, r.y + 5 + ((i / 6) % 2) * 4, 2, 2, 1);
    });

    px(stage.flag, stage.flagY - 26, 2, 26, 3);
    px(stage.flag - 10, stage.flagY - 26, 10, 7, 2);

    stage.npcs.forEach(drawNpc);
    cards.forEach(function (c) { px(c.x, c.y, 6, 2, 0); px(c.x, c.y + 2, 6, 1, 3); });
    drawPlayer();
    fx.forEach(drawFx);
    ctx.restore();

    if (stage.dark > 0) {
      ctx.fillStyle = "rgba(20,30,52," + (0.6 * stage.dark) + ")";
      ctx.fillRect(LX, LY, LW * SC, LH * SC);
    }
    if (wipe >= 0) {
      ctx.fillStyle = "rgba(216,230,234," + Math.min(1, wipe / 0.6) + ")";
      ctx.fillRect(LX, LY, LW * SC, LH * SC);
    }
  }

  function drawPlayer() {
    var x = Math.round(P.x), y = Math.round(P.y), f = P.face, a = P.act;
    if (P.ghost > 0) ctx.globalAlpha = 0.45;
    if (a === "nap") {
      px(x - 2, y + 4, 10, 4, 3); px(f > 0 ? x + 5 : x - 3, y + 3, 4, 4, 3); px(x - 2, y + 4, 8, 2, 1);
    } else if (P.h === 3) {                        /* 土下座 */
      px(x - 1, y, 8, 3, 3); px(f > 0 ? x + 6 : x - 2, y + 1, 2, 2, 3);
    } else if (P.h === 5) {                        /* おじぎ */
      px(x, y + 1, 6, 4, 3); px(f > 0 ? x + 4 : x - 2, y, 4, 3, 3);
      var lg = Math.floor(P.walk) % 2; px(x + lg, y + 4, 2, 1, 3);
    } else {
      var head = a === "sneeze" && P.actT < 0.4 ? f : 0;
      px(x + 1 + head, y, 4, 3, 3);
      px(f > 0 ? x + 3 + head : x + 1 + head, y + 1, 1, 1, 0);
      px(x, y + 3, 6, 3, 3);
      var leg = P.ground ? (Math.floor(P.walk) % 2) : 1;
      px(x + (leg ? 0 : 1), y + 6, 2, 2, 3); px(x + (leg ? 4 : 3), y + 6, 2, 2, 3);
      if (a === "card" || a === "tax") px(f > 0 ? x + 6 : x - 2, y + 3, 2, 1, 3);
      if (a === "clap") { px(x - 1, y - 2, 2, 2, 3); px(x + 5, y - 2, 2, 2, 3); }
      if (a === "teiji") px(f > 0 ? x - 3 : x + 6, y + 4, 3, 3, 2);   /* かばん */
    }
    ctx.globalAlpha = 1;
  }

  function drawNpc(o) {
    var t = o.t, x = o.x;
    if (o.type === "door") {
      px(x - 20, GROUND - 66, 34, 4, 3);
      px(x - 18, GROUND - 62, 30, 62, 1);
      px(x - 14, GROUND - 54, 6, 6, 0); px(x - 14, GROUND - 40, 6, 6, 0);
      var up = o.on ? Math.round(t * 50) : 0;
      px(x, GROUND - 60 - up, 6, 60, 2); px(x + 1, GROUND - 32 - up, 1, 3, 0);
    } else if (o.type === "talker") {
      px(x + 1, GROUND - 24, 6, 6, 3); px(x, GROUND - 18, 8, 12, 2);
      px(x + 1, GROUND - 6, 2, 6, 3); px(x + 5, GROUND - 6, 2, 6, 3);
      /* 吹き出し（中は点だけ） */
      px(x - 6, GROUND - 40, 20, 12, 3); px(x - 5, GROUND - 39, 18, 10, 0); px(x + 2, GROUND - 29, 3, 3, 3);
      for (var i = 0; i < 3; i++) px(x - 2 + i * 5, GROUND - 35, 2, 2, 3);
    } else if (o.type === "dust") {
      var dx = o.on ? t * 120 : 0, dy = o.on ? -t * 60 : 0;
      ctx.fillStyle = PAL[1];
      ctx.beginPath(); ctx.arc(x + 19 + dx, GROUND - 19 + dy, 19, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL[2];
      for (var k = 0; k < 10; k++) { var an = k * 0.63; px(x + 19 + dx + Math.cos(an) * 17, GROUND - 19 + dy + Math.sin(an) * 17, 3, 1, 2); }
      px(x + 12 + dx, GROUND - 24 + dy, 2, 2, 3); px(x + 24 + dx, GROUND - 24 + dy, 2, 2, 3);
    } else if (o.type === "bridge") {
      var len = o.x1 - o.x;
      px(o.x - 3, GROUND - 30, 3, 30, 3);
      px(o.x1, GROUND - 30, 3, 30, 3);
      var a = (o.on ? t : 0) * Math.PI / 2;
      ctx.save(); ctx.translate(o.x, GROUND);
      ctx.rotate(-Math.PI / 2 + a);
      px(0, 0, len, 4, 2); px(0, 0, len, 1, 3);
      ctx.restore();
    } else if (o.type === "tax") {
      px(x - 2, 54, 12, 3, 3);
      px(x, 57, 8, 55, 2);
      for (var yy = 62; yy < 100; yy += 10) px(x + 2, yy, 4, 5, 1);
      px(x + 1, 102, 6, 10, 3);
      if (o.on) {
        var n = Math.round(Math.min(1, t * 1.5) * 6);
        for (var j = 0; j < n; j++) { px(x - 14, GROUND - 4 - j * 4, 14, 4, j % 2 ? 2 : 3); px(x - 12, GROUND - 3 - j * 4, 10, 1, 1); }
      }
    }
  }

  function drawFx(e) {
    var t = Math.max(0, e.t);
    if (e.k === "zzz") {
      for (var i = 0; i < 3; i++) {
        var u = t - i * 0.4; if (u < 0) continue;
        var zx = e.x + 4 + u * 8 + i * 3, zy = e.y - 4 - u * 10;
        px(zx, zy, 3, 1, 3); px(zx + 1, zy + 1, 1, 1, 3); px(zx, zy + 2, 3, 1, 3);
      }
    } else if (e.k === "paper") {
      px(e.x + e.d * (3 + t * 18), e.y - t * 20, 4, 5, 0);
    } else if (e.k === "coin") {
      if (e.t < 0) return;
      var cy = Math.min(GROUND - 6, e.t * e.t * 600);
      px(e.x, cy, 4, 3, 1); px(e.x + 1, cy, 2, 1, 3);
    } else if (e.k === "clap") {
      px(e.x - 3 - t * 6, e.y - 4, 2, 1, 2); px(e.x + 7 + t * 6, e.y - 4, 2, 1, 2);
    } else if (e.k === "read") {
      /* 既読の印：小さな丸2つ */
      px(e.x + 8, e.y - 6 - t * 4, 2, 2, 2); px(e.x + 11, e.y - 6 - t * 4, 2, 2, 2);
    } else if (e.k === "spray") {
      for (var s = 0; s < 6; s++) px(e.x + e.d * (t * 80 + s * 3), e.y + (s - 3) * t * 6, 1, 1, 2);
    }
  }

  function drawControls() {
    ["L", "R", "A"].concat(ORDER).forEach(roundBtn);
  }
  function roundBtn(id) {
    var c = CTRL[id], down = held(id), oy = down ? 4 : 0;
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath(); ctx.arc(c.x, c.y + 5, c.r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.col;
    ctx.beginPath(); ctx.arc(c.x, c.y + oy, c.r, 0, Math.PI * 2); ctx.fill();
    if (down) { ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fill(); }
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.arc(c.x - c.r * 0.3, c.y - c.r * 0.3 + oy, c.r * 0.32, 0, Math.PI * 2); ctx.fill();
    if (id === "L" || id === "R") {
      var d = id === "L" ? -1 : 1;
      ctx.fillStyle = "#f4f1e8";
      ctx.beginPath(); ctx.moveTo(c.x + d * 14, c.y + oy); ctx.lineTo(c.x - d * 9, c.y + oy - 14); ctx.lineTo(c.x - d * 9, c.y + oy + 14); ctx.closePath(); ctx.fill();
      return;
    }
    var label = id === "A" ? "A" : BTN[id].label;
    ctx.fillStyle = "#2f3550"; ctx.textAlign = "center";
    var size = id === "A" ? 22 : 16;
    ctx.font = "bold " + size + "px sans-serif";
    while (size > 10 && ctx.measureText(label).width > 98) { size--; ctx.font = "bold " + size + "px sans-serif"; }
    ctx.fillText(label, c.x, c.y + c.r + 24);
  }

  /* 結果画面。秒数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, stage: stage.n, x: P.x, y: P.y, h: P.h, ground: P.ground, act: P.act,
        time: T, retries: retries, clear: clearT >= 0, W: W, H: H, ctrl: CTRL };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
