<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ボタンが生える</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* ボタンが生える（題名は仮）

   上はゲーム機の画面、下は本体。本体には最初から、体の動きのボタンが10個並んでいる（ジャンルは全部ちがう）。
   どの面も、ふつうの左右とジャンプだけでは抜けられない。どれかの動きに、ちゃんと使い道がある。
   どのボタンも1回押すだけで働く（スマホで押しながらの操作はしづらいので）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  var SND = {
    jump: function () { tone(330, 0.12, 0.08, "square", 660); },
    fall: function () { tone(500, 0.5, 0.08, "square", 80); },
    clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 0.07, "square", null, i * 0.08); }); },
    press: function () { tone(220, 0.04, 0.04, "square"); },
    teiji: function () { [880, 740, 587].forEach(function (f, i) { tone(f, 0.25, 0.05, "sine", null, i * 0.18); }); },
    bow: function () { tone(440, 0.1, 0.07, "triangle", 330); },
    card: function () { noiseHit(0.08, 3000, 0.25, 2); },
    stick: function () { noiseHit(0.05, 1200, 0.3, 3); },
    clap: function () { noiseHit(0.05, 1800, 0.6, 0.8); noiseHit(0.05, 1800, 0.6, 0.8, 0.18); },
    kidoku: function () { tone(1200, 0.05, 0.05, "square"); tone(1500, 0.05, 0.05, "square", null, 0.07); },
    sneeze: function () { tone(600, 0.25, 0.05, "triangle", 900); noiseHit(0.3, 2500, 0.5, 0.7, 0.3); },
    nap: function () { tone(180, 0.6, 0.05, "sine", 140); tone(160, 0.6, 0.05, "sine", 120, 0.8); },
    morning: function () { [784, 988, 1175].forEach(function (f, i) { tone(f, 0.3, 0.05, "sine", null, i * 0.15); }); },
    tax: function () { for (var i = 0; i < 8; i++) tone(1800 + i * 90, 0.06, 0.04, "square", null, 0.2 + i * 0.07); },
    dogeza: function () { noiseHit(0.4, 400, 0.3, 0.8); },
    clr: function () { tone(1200, 0.5, 0.05, "sine", 200); },
    open: function () { tone(200, 0.4, 0.06, "square", 400); }
  };

  SND.long = function () { tone(260, 0.2, 0.08, "square", 700); };
  SND.crawl = function () { noiseHit(0.3, 500, 0.2, 1); };
  SND.wallrun = function () { for (var i = 0; i < 5; i++) noiseHit(0.04, 900, 0.25, 2, i * 0.09); };
  SND.swim = function () { for (var i = 0; i < 4; i++) noiseHit(0.15, 700, 0.2, 0.8, i * 0.3); };
  SND.spin = function () { tone(300, 0.6, 0.05, "sawtooth", 900); };
  SND.bar = function () { tone(200, 0.7, 0.06, "triangle", 800); };
  SND.slide = function () { noiseHit(0.45, 350, 0.4, 0.7); };
  SND.shiko = function () { tone(70, 0.3, 0.4, "sine", 40, 0.35); noiseHit(0.2, 150, 0.6, 1, 0.35); };
  SND.stilts = function () { tone(500, 0.05, 0.05, "square"); tone(400, 0.05, 0.05, "square", null, 0.1); };
  SND.swing = function () { tone(150, 1.0, 0.06, "sawtooth", 450); };
  SND.thud = function () { noiseHit(0.2, 200, 0.5, 1); };
  SND.ouch = function () { tone(700, 0.3, 0.07, "square", 200); };

  /* ============ 本体のボタン ============
     どれも体の動き。ジャンルは全部ちがう。 */
  var BTN = {
    long:    { label: zT("走り幅跳び", "Long Jump"), col: "#e07b3a", key: "q" },
    crawl:   { label: zT("ほふく前進", "Army Crawl"), col: "#7b8a3a", key: "w" },
    wallrun: { label: zT("壁走り", "Wall Run"), col: "#5a5f7a", key: "e" },
    swim:    { label: zT("クロール", "Front Crawl"), col: "#3a8fb0", key: "r" },
    spin:    { label: zT("ヘッドスピン", "Head Spin"), col: "#c95c8a", key: "t" },
    bar:     { label: zT("大車輪", "Giant Circle"), col: "#d79a2b", key: "y" },
    slide:   { label: zT("ヘッドスライディング", "Head-First Slide"), col: "#4a74c9", key: "u" },
    shiko:   { label: zT("四股", "Sumo Stomp"), col: "#8a5fc0", key: "i" },
    stilts:  { label: zT("竹馬", "Stilts"), col: "#3d9a8b", key: "o" },
    swing:   { label: zT("ジャイアントスイング", "Giant Swing"), col: "#c0504a", key: "p" }
  };
  var ORDER = ["slide", "stilts", "long", "swing", "bar", "crawl", "shiko", "wallrun", "spin", "swim"];
  var CTRL = {};

  /* 画面（中のゲームは横160×縦128の点で描き、2.5倍で出す） */
  var LW = 160, LH = 128, SC = 2.5, LX = 70, LY = 60;
  var GROUND = 112;
  var PAL = ["#d8e6ea", "#a6bfc8", "#577684", "#22323c"];

  function place() {
    var top = 430;
    var cy = Math.min(620, Math.round(top + (H - top) * 0.2));
    CTRL.L = { x: 72, y: cy, r: 38, col: "#3a3f52" };
    CTRL.R = { x: 178, y: cy, r: 38, col: "#3a3f52" };
    CTRL.A = { x: 462, y: cy, r: 40, col: "#e2574c" };
    var r1 = cy + 112, r2 = r1 + 96;
    ORDER.forEach(function (id, i) {
      CTRL[id] = { x: 62 + (i % 5) * 104, y: i < 5 ? r1 : r2, r: 30, col: BTN[id].col };
    });
  }

  /* ============ 面 ============
     solids … 床・壁。npc … 動きで変わるもの。water・spikes … 落ちたら最初から。 */
  function ground(a, b) { return { x: a, y: GROUND, w: b - a, h: 16 }; }
  function block(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
  function makeStage(n) {
    var s = { n: n, w: 160, solids: [], npcs: [], water: [], spikes: [], flag: 150, flagY: GROUND, sx: 8, sy: GROUND - 8 };
    var full = [ground(0, 160)];
    if (n === 0) {          /* 走り幅跳び */
      s.solids.push(ground(0, 50), ground(112, 160));
    } else if (n === 1) {   /* ほふく前進：低いすき間 */
      s.solids = full; s.solids.push(block(60, GROUND - 44, 50, 40));
    } else if (n === 2) {   /* 壁走り：高い壁 */
      s.solids.push(ground(0, 100), block(100, GROUND - 60, 60, 76));
      s.flagY = GROUND - 60;
    } else if (n === 3) {   /* クロール：深い水 */
      s.solids.push(ground(0, 40), ground(140, 160));
      s.water.push({ x: 40, w: 100 });
    } else if (n === 4) {   /* ヘッドスピン：床を掘って下へ */
      s.solids = full; s.solids.push(block(0, 70, 64, 8), block(92, 70, 68, 8));
      s.npcs.push({ type: "soft", x: 64, y: 70, w: 28 });
      s.sy = 62;
    } else if (n === 5) {   /* 大車輪：鉄棒で高く */
      s.solids = full; s.solids.push(block(104, GROUND - 64, 56, 80));
      s.npcs.push({ type: "bar", x: 70, y: GROUND - 30 });
      s.flagY = GROUND - 64;
    } else if (n === 6) {   /* ヘッドスライディング：閉まっていく門 */
      s.solids = full; s.npcs.push({ type: "gate", x: 96 });
    } else if (n === 7) {   /* 四股：揺らして木箱を落とす */
      s.solids = full; s.solids.push(block(100, GROUND - 50, 60, 66));
      s.npcs.push({ type: "crate", x: 78 });
      s.flagY = GROUND - 50;
    } else if (n === 8) {   /* 竹馬：トゲの床 */
      s.solids = full; s.spikes.push({ x: 40, w: 90 });
    } else if (n === 9) {   /* ジャイアントスイング：大男 */
      s.solids = full; s.npcs.push({ type: "wrestler", x: 90 });
    } else {
      /* 最後は全部つなげる */
      s.w = 1020; s.flag = 1010; s.flagY = GROUND - 50;
      s.solids.push(ground(0, 60), ground(122, 430), ground(530, 1020),
        block(150, GROUND - 44, 50, 40),                       /* ほふく前進 */
        block(270, GROUND - 60, 8, 60), block(278, 52, 52, 8),  /* 壁走りで上へ */
        block(358, 52, 22, 8), block(380, 0, 10, 60),           /* 上は行き止まり */
        block(600, GROUND - 64, 80, 80),                        /* 大車輪 */
        block(920, GROUND - 50, 100, 66));                      /* 四股 */
      s.water.push({ x: 430, w: 100 });
      s.spikes.push({ x: 780, w: 90 });
      s.npcs.push({ type: "wrestler", x: 230 }, { type: "soft", x: 330, y: 52, w: 28 },
        { type: "bar", x: 570, y: GROUND - 30 }, { type: "gate", x: 740 }, { type: "crate", x: 898 });
    }
    s.npcs.forEach(function (o) { o.on = false; o.t = 0; o.close = -1; });
    s.shake = 0;
    return s;
  }
  var LAST = 10;

  function npcSolids(o) {
    if (o.type === "soft") return o.on ? [] : [{ x: o.x, y: o.y, w: o.w, h: 8 }];
    if (o.type === "wrestler") return o.on ? [] : [{ x: o.x, y: GROUND - 36, w: 12, h: 36 }];
    if (o.type === "crate") return o.on && o.t >= 1 ? [{ x: o.x, y: GROUND - 16, w: 16, h: 16 }] : [];
    if (o.type === "gate") {
      var r = [{ x: o.x, y: 0, w: 6, h: GROUND - 40 }];
      var open = gateOpen(o);
      var h = 40 - open;
      /* 下にいる人は挟まない（門が頭の上で止まる） */
      if (P && P.x < o.x + 6 && P.x + P.w > o.x) h = Math.min(h, P.y - (GROUND - 40));
      if (h > 0) r.push({ x: o.x, y: GROUND - 40, w: 6, h: h });
      return r;
    }
    return [];
  }
  function gateOpen(o) { return o.close < 0 ? 40 : Math.max(0, 40 * (1 - o.close / 0.4)); }
  function allSolids() {
    var r = stage.solids.slice();
    stage.npcs.forEach(function (o) { r = r.concat(npcSolids(o)); });
    return r;
  }
  function hitRect(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function hitsAny(r) { return allSolids().some(function (s) { return hitRect(r, s); }); }
  function over(list) {
    var c = P.x + P.w / 2;
    return list.some(function (w) { return c > w.x && c < w.x + w.w; });
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, T, stage, P = null, retries, clearT, jumpQ, camX, fx, dead;
  var keys = { L: false, R: false };
  var pointers = {}, flash = {};

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; retries = 0;
    loadStage(0);
  }
  function loadStage(n) {
    stage = makeStage(n);
    P = { x: stage.sx, y: stage.sy, w: 6, h: 8, vx: 0, vy: 0, ground: true, face: 1, act: null, actT: 0, walk: 0, climb: false, hold: null, spinA: 0 };
    clearT = -1; jumpQ = 0; camX = 0; fx = []; dead = -1;
  }
  function die() { if (dead < 0) { dead = 0; SND.ouch(); } }

  /* ============ 進行 ============ */
  var G = 600, JUMP = 208, WALK = 50;
  function held(id) {
    if ((id === "L" || id === "R") && keys[id]) return true;
    for (var k in pointers) if (pointers[k] === id) return true;
    return (flash[id] || 0) > 0;
  }
  /* 姿勢の高さを変える。高くすると天井にぶつかるときは変えない */
  function setH(h) {
    var nb = P.y + P.h;
    if (h > P.h && hitsAny({ x: P.x, y: nb - h, w: P.w, h: h })) return false;
    P.y = nb - h; P.h = h; return true;
  }
  function blockedAhead() { return hitsAny({ x: P.face > 0 ? P.x + P.w : P.x - 1, y: P.y, w: 1, h: P.h }); }

  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    for (var f in flash) flash[f] -= dt;
    stage.shake = Math.max(0, stage.shake - dt);
    fx.forEach(function (e) { e.t += dt; if (e.k === "call" && !e.done && e.t > 0.4) { e.done = true; e.f(); } });
    fx = fx.filter(function (e) { return e.t < e.life; });
    stage.npcs.forEach(function (o) {
      if (o.on && o.type !== "gate") o.t = Math.min(1, o.t + dt * (o.type === "crate" ? 2.2 : 1.4));
      if (o.type === "gate") {
        if (o.close < 0 && P.x + P.w > o.x - 40 && P.x < o.x) { o.close = 0; SND.thud(); }
        else if (o.close >= 0) {
          o.close += dt;
          if (P.x + P.w < o.x - 56 && o.close > 0.4) o.close = -1;     /* 離れるとまた開く */
        }
      }
    });

    if (dead >= 0) { dead += dt; if (dead > 0.8) { retries++; loadStage(stage.n); } return; }
    if (clearT >= 0) {
      clearT += dt;
      if (clearT > 0.9) { if (stage.n >= LAST) finish(); else loadStage(stage.n + 1); }
      return;
    }

    var noGrav = false;
    if (P.act) {
      var a = P.act;
      P.actT -= dt;
      if (a === "long") {
        P.vx = P.face * 110;
        if (P.ground && P.actT < ACT_TIME.long - 0.1) { P.act = null; }
      } else if (a === "crawl") {
        P.vx = P.face * 35;
      } else if (a === "slide") {
        P.vx = P.face * (P.actT > 0.15 ? 160 : 80);
      } else if (a === "stilts") {
        P.vx = P.face * 30;
        if (P.actT <= 0 && P.ground && over(stage.spikes)) P.actT = 0.05;   /* トゲの上では降りない */
      } else if (a === "wallrun") {
        P.vx = P.face * 90;
        if (blockedAhead()) { P.climb = true; P.vy = -110; noGrav = true; }
        else if (P.climb) { P.climb = false; P.vy = -60; P.x += P.face * 3; P.actT = Math.min(P.actT, 0.3); }
      } else if (a === "swim") {
        P.vx = P.face * 60;
        if (over(stage.water) && P.y + P.h >= GROUND - 2) { P.y = GROUND - P.h; P.vy = 0; noGrav = true; P.ground = true; }
      } else if (a === "spin") {
        P.vx = 0; P.spinA += dt * 20;
      } else if (a === "bar") {
        if (P.hold) {
          P.spinA += dt * 14; noGrav = true; P.vx = 0; P.vy = 0;
          P.x = P.hold.x - P.w / 2 + Math.cos(P.spinA) * 0; P.y = P.hold.y - 4;
        }
      } else if (a === "shiko") {
        P.vx = 0;
        if (!P.stomped && P.actT < 0.45) { P.stomped = true; stage.shake = 0.5; shikoHit(); }
      } else if (a === "swing") {
        P.vx = 0; P.spinA += dt * 16;
      }
      if (P.actT <= 0) {
        if ((a === "crawl" || a === "slide" || a === "stilts") && !setH(8)) P.actT = 0.05;
        else endAct();
      }
    } else {
      var dir = (held("L") ? -1 : 0) + (held("R") ? 1 : 0);
      if (dir) P.face = dir;
      var acc = 900 * dt;
      P.vx += Math.max(-acc, Math.min(acc, dir * WALK - P.vx));
      if (jumpQ > 0 && P.ground) { P.vy = -JUMP; P.ground = false; jumpQ = 0; SND.jump(); }
    }
    jumpQ = Math.max(0, jumpQ - dt);
    if (!noGrav) P.vy = Math.min(320, P.vy + G * dt);

    var sol = allSolids();
    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > stage.w - P.w) P.x = stage.w - P.w;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vx > 0) P.x = r.x - P.w; else if (P.vx < 0) P.x = r.x + r.w;
      P.vx = 0;
    });
    P.y += P.vy * dt;
    var wasGround = P.ground;
    P.ground = false;
    sol.forEach(function (r) {
      if (!hitRect(P, r)) return;
      if (P.vy > 0) { P.y = r.y - P.h; P.ground = true; } else if (P.vy < 0) P.y = r.y + r.h;
      P.vy = 0;
    });
    if (noGrav && P.act === "swim") P.ground = true;
    if (Math.abs(P.vx) > 1 && P.ground) P.walk += dt * Math.abs(P.vx) / 8;

    /* 水に落ちる・トゲを踏む・穴に落ちる */
    if (P.y > LH + 16) { die(); return; }
    if (P.act !== "swim" && over(stage.water) && P.y + P.h > GROUND + 2) { die(); return; }
    if (P.ground && P.act !== "stilts" && over(stage.spikes) && P.y + P.h >= GROUND - 1) { die(); return; }

    if (P.x + P.w >= stage.flag - 1 && P.y + P.h <= stage.flagY + 1 && P.y + P.h > stage.flagY - 30) {
      clearT = 0; P.act = null; setH(8); SND.clear();
    }
    camX = Math.max(0, Math.min(stage.w - LW, Math.round(P.x - 70)));
  }

  function shikoHit() {
    stage.npcs.forEach(function (o) {
      if (o.type === "crate" && !o.on && Math.abs(P.x - o.x) < 90) { o.on = true; o.t = 0; setTimeout0(SND.thud); }
    });
  }
  function setTimeout0(f) { fx.push({ k: "call", t: 0, life: 0.45, f: f }); }

  /* ボタンの働き。どれもいつでも押せて、動作だけはする */
  var ACT_TIME = { long: 1.2, crawl: 2.0, wallrun: 1.8, swim: 2.6, spin: 0.8, bar: 0.7, slide: 0.6, shiko: 0.9, stilts: 3.5, swing: 1.3 };
  function near(type, range) {
    var best = null;
    stage.npcs.forEach(function (o) {
      if (o.type !== type || o.on) return;
      var cx = o.type === "wrestler" ? o.x + 6 : o.x;
      if (Math.abs(P.x + 3 - cx) < range) best = o;
    });
    return best;
  }
  function command(id) {
    if (state !== S.PLAY || clearT >= 0 || dead >= 0 || P.act) return;
    var inWater = over(stage.water) && P.y + P.h > GROUND - 6;
    if (!P.ground && !(id === "swim" && inWater) && id !== "bar") return;
    P.act = id; P.actT = ACT_TIME[id]; P.target = null; P.spinA = 0; P.stomped = false; P.hold = null;
    SND[id]();
    if (id === "long") { P.vy = -JUMP; P.ground = false; }
    if (id === "crawl" || id === "slide") setH(3);
    if (id === "stilts") { if (!setH(20)) { P.act = null; return; } }
    if (id === "spin") {
      stage.npcs.forEach(function (o) {
        if (o.type === "soft" && !o.on && P.x + P.w > o.x && P.x < o.x + o.w && Math.abs(P.y + P.h - o.y) < 2) P.target = o;
      });
    }
    if (id === "bar") {
      var b = near("bar", 26);
      if (b && b.y < P.y + P.h + 10 && b.y > P.y - 30) { P.hold = b; P.actT = 0.9; }
      else if (!P.ground) { P.act = null; return; }
    }
    if (id === "swing") P.target = near("wrestler", 30);
  }
  function endAct() {
    var a = P.act, o = P.target;
    P.act = null; P.climb = false;
    if (a === "spin" && o) { o.on = true; o.t = 0; SND.thud(); for (var i = 0; i < 6; i++) fx.push({ k: "bit", t: 0, life: 0.6, x: o.x + 4 + i * 4, y: o.y, d: i % 2 ? 1 : -1 }); }
    if (a === "bar" && P.hold) { P.vy = -320; P.vx = 0; P.act = "long"; P.actT = 1.4; P.hold = null; SND.jump(); }
    if (a === "swing" && o) { o.on = true; o.t = 0; o.d = P.face; SND.thud(); }
    if (a === "long" || a === "bar") P.ground = false;
    allSolids().forEach(function (r) { if (hitRect(P, r)) { P.y = r.y - P.h; P.vy = 0; P.ground = true; } });
  }
  function jump() { if (state === S.PLAY && !P.act) jumpQ = 0.12; }

  function finish() { state = S.RESULT; clearT = -1; }

  /* ============ 入力 ============ */
  function hitCtrl(x, y) {
    var ids = ["L", "R", "A"].concat(ORDER), best = null, bd = 1e9;
    ids.forEach(function (id) {
      var c = CTRL[id], d = Math.hypot(x - c.x, y - c.y);
      if (d < c.r + 20 && d < bd) { bd = d; best = id; }
    });
    return best;
  }
  function press(id) {
    if (!id) return;
    if (id === "A") jump();
    else if (BTN[id]) command(id);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var id = hitCtrl(p.x, p.y);
    pointers[e.pointerId] = id;
    if (id) SND.press();
    press(id);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pointers)) return;
    var cur = pointers[e.pointerId];
    if (cur !== "L" && cur !== "R" && cur !== null) return;
    var p = atCanvas(e), id = hitCtrl(p.x, p.y);
    if (id === "L" || id === "R") pointers[e.pointerId] = id;
  });
  function release(e) { delete pointers[e.pointerId]; }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);
  window.addEventListener("blur", function () { pointers = {}; keys.L = keys.R = false; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1〜9・0 … 1〜10面へ。- … 最後の面。= … 結果画面 */
  function debugKey(n) {
    if (state === S.INTRO) startButton.click();
    state = S.PLAY; shareButton.hidden = true;
    loadStage(n === 0 ? 9 : n - 1);
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && (/^Digit[0-9]$/.test(e.code) || /^[0-9]$/.test(e.key))) { e.preventDefault(); debugKey(Number(e.key)); return; }
    if (DEBUG && e.key === "-") { if (state === S.INTRO) startButton.click(); state = S.PLAY; loadStage(LAST); return; }
    if (DEBUG && e.key === "=") { finish(); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat) newRound(); return; }
    if (state === S.INTRO) { if (k === " " || k === "enter") e.preventDefault(); return; }
    if (state === S.RESULT) { if ((k === " " || k === "enter") && !e.repeat) { e.preventDefault(); newRound(); } return; }
    var hit = true;
    if (k === "arrowleft" || k === "a") keys.L = true;
    else if (k === "arrowright" || k === "d") keys.R = true;
    else if (k === " " || k === "z" || k === "arrowup" || k === "enter") { if (!e.repeat) { flash.A = 0.12; jump(); } }
    else {
      hit = false;
      ORDER.forEach(function (id) { if (BTN[id].key === k) { hit = true; if (!e.repeat) { flash[id] = 0.15; command(id); } } });
    }
    if (hit) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.L = false;
    else if (k === "arrowright" || k === "d") keys.R = false;
    else if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  function secText() { return (Math.floor(T * 10) / 10).toFixed(1); }
  function doShare() {
    var s = secText();
    window.zResultActions.x({ text:
      zT("ほふく前進とジャイアントスイングを駆使して、" + s + "秒でクリアしました",
         "Cleared it in " + s + "s using an army crawl and a giant swing") +
      zT(" #ボタンが生える", " #ButtonsSprout") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    drawBody();
    drawLCD();
    drawControls();
    if (state === S.RESULT) drawResult();
  }

  function drawBody() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#f5d77e"); g.addColorStop(1, "#ecc65f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2f3550";
    roundRect(30, 28, 480, 392, 30); ctx.fill();
    ctx.fillStyle = state === S.INTRO ? "#4a5a4a" : "#6ee07a";
    ctx.beginPath(); ctx.arc(270, 400, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.16)";
    for (var i = 0; i < 4; i++) for (var j = 0; j < 3; j++) {
      ctx.beginPath(); ctx.arc(W / 2 - 27 + i * 18, H - 70 + j * 18, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function px(x, y, w, h, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

  function drawLCD() {
    ctx.fillStyle = "#2c2c34";
    ctx.fillRect(LX - 4, LY - 4, LW * SC + 8, LH * SC + 8);
    ctx.save();
    ctx.beginPath(); ctx.rect(LX, LY, LW * SC, LH * SC); ctx.clip();
    var sk = stage.shake > 0 ? Math.round(Math.sin(stage.shake * 60) * 2) : 0;
    ctx.translate(LX, LY + sk * SC); ctx.scale(SC, SC);
    px(0, -4, LW, LH + 8, 0);
    ctx.translate(-camX, 0);

    for (var cx = 20; cx < stage.w; cx += 110) { px(cx, 22 + (cx % 3) * 6, 18, 4, 1); px(cx + 4, 19 + (cx % 3) * 6, 10, 3, 1); }

    stage.water.forEach(function (w) {
      px(w.x, GROUND + 3, w.w, LH, 1);
      for (var i = w.x; i < w.x + w.w; i += 8) px(i + Math.round(Math.sin(T * 3 + i) * 1.5) + 2, GROUND + 3, 4, 1, 2);
    });
    stage.solids.forEach(function (r) {
      px(r.x, r.y, r.w, r.h, 2);
      px(r.x, r.y, r.w, 2, 3);
      for (var i = r.x + 3; i < r.x + r.w - 1; i += 6) if (r.h > 6) px(i, r.y + 5 + ((i / 6) % 2) * Math.min(4, r.h - 7), 2, 2, 1);
    });
    stage.spikes.forEach(function (sp) {
      for (var i = sp.x; i < sp.x + sp.w; i += 6) { px(i + 2, GROUND - 5, 2, 5, 3); px(i + 1, GROUND - 2, 4, 2, 3); }
    });

    px(stage.flag, stage.flagY - 26, 2, 26, 3);
    px(stage.flag - 10, stage.flagY - 26, 10, 7, 2);

    stage.npcs.forEach(drawNpc);
    drawPlayer();
    fx.forEach(drawFx);
    ctx.restore();
  }

  function drawPlayer() {
    var x = Math.round(P.x), y = Math.round(P.y), f = P.face, a = P.act;
    if (dead >= 0) { ctx.globalAlpha = Math.max(0, 1 - dead * 1.5); }
    if (a === "spin" || a === "swing" || (a === "bar" && P.hold)) {
      /* 回る：体を回転して描く */
      ctx.save(); ctx.translate(x + 3, (a === "bar" ? P.hold.y : y + 4)); ctx.rotate(P.spinA);
      var off = a === "bar" ? 0 : 0;
      px(-2, -4 + off, 4, 3, 3); px(-3, -1 + off, 6, 3, 3); px(-3, 2 + off, 2, 2, 3); px(1, 2 + off, 2, 2, 3);
      ctx.restore();
      if (a === "bar") return void (ctx.globalAlpha = 1);
    } else if (P.h === 3) {                         /* ほふく前進・スライディング */
      px(x - 1, y, 8, 3, 3); px(f > 0 ? x + 6 : x - 2, y, 2, 2, 3);
      if (a === "crawl") px(x + (Math.floor(T * 8) % 2 ? 0 : 3), y + 2, 2, 1, 2);
    } else if (P.h === 20) {                        /* 竹馬 */
      px(x + 1, y, 4, 3, 3); px(x, y + 3, 6, 3, 3); px(x + 1, y + 6, 4, 2, 3);
      var st = Math.floor(P.walk) % 2;
      px(x - 1, y + 3, 1, 17 - st, 2); px(x + 6, y + 3, 1, 16 + st, 2);
      px(x - 2, y + 9, 3, 1, 2); px(x + 5, y + 9, 3, 1, 2);
    } else if (a === "swim" && over(stage.water)) {
      px(x - 1, y + 4, 8, 3, 3); px(f > 0 ? x + 6 : x - 2, y + 3, 3, 3, 3);
      var arm = Math.floor(T * 6) % 2; px(f > 0 ? x + 2 : x + 1, y + 1 + arm * 2, 2, 3, 3);
    } else if (a === "shiko") {
      var up = P.actT > 0.45;
      px(x + 1, y, 4, 3, 3); px(x, y + 3, 6, 3, 3);
      px(x - 1, y + 6, 2, 2, 3); px(x + 5, y + (up ? 1 : 6), 2, up ? 3 : 2, 3);
    } else if (a === "wallrun" && P.climb) {
      var lg = Math.floor(T * 12) % 2;
      px(x + 1, y, 4, 3, 3); px(x, y + 3, 6, 3, 3);
      px(f > 0 ? x + 4 : x, y + 6 - lg * 3, 2, 2, 3); px(f > 0 ? x + 4 : x, y + 3 + lg * 3, 2, 2, 3);
    } else {
      px(x + 1, y, 4, 3, 3);
      px(f > 0 ? x + 3 : x + 1, y + 1, 1, 1, 0);
      px(x, y + 3, 6, 3, 3);
      var leg = P.ground ? (Math.floor(P.walk) % 2) : 1;
      if (a === "long" && !P.ground) { px(x - 1, y + 6, 2, 2, 3); px(x + 5, y + 6, 2, 2, 3); }
      else { px(x + (leg ? 0 : 1), y + 6, 2, 2, 3); px(x + (leg ? 4 : 3), y + 6, 2, 2, 3); }
    }
    if (a === "swing" && P.target && !P.target.on) {
      /* 大男をつかんで振り回す */
      var r = 12, an = P.spinA;
      ctx.save(); ctx.translate(x + 3 + Math.cos(an) * r, y + 2 + Math.sin(an) * 4); ctx.rotate(an + Math.PI / 2);
      px(-6, -3, 12, 6, 3); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawNpc(o) {
    var t = o.t, x = o.x;
    if (o.type === "soft") {
      if (o.on) return;
      px(x, o.y, o.w, 8, 1);
      for (var i = 0; i < o.w; i += 4) px(x + i + 1, o.y + 2 + (i % 8 ? 2 : 0), 2, 2, 2);
    } else if (o.type === "bar") {
      px(x - 16, o.y, 2, GROUND - o.y, 3); px(x + 14, o.y, 2, GROUND - o.y, 3);
      px(x - 16, o.y, 32, 1, 3);
    } else if (o.type === "gate") {
      px(x - 2, GROUND - 42, 10, 2, 3);
      var open = gateOpen(o);
      px(x, 0, 6, GROUND - 40, 2);
      px(x, GROUND - 40, 6, 40 - open, 2);
      for (var yy = GROUND - 40; yy < GROUND - open; yy += 4) px(x, yy, 6, 1, 3);
    } else if (o.type === "crate") {
      var cy = o.on ? 10 + (GROUND - 26) * Math.min(1, t * t) : 10;
      if (!o.on) px(x + 7, 0, 2, 10, 2);
      px(x, cy, 16, 16, 2); px(x, cy, 16, 2, 3); px(x + 1, cy + 7, 14, 1, 3); px(x + 7, cy + 2, 1, 14, 3);
    } else if (o.type === "wrestler") {
      var dx = o.on ? o.d * t * 200 : 0, dy = o.on ? -Math.sin(t * Math.PI) * 60 : 0;
      ctx.save(); ctx.translate(x + 6 + dx, GROUND - 18 + dy); if (o.on) ctx.rotate(t * 12);
      px(-4, -18, 8, 7, 3); px(-2, -16, 1, 1, 0); px(1, -16, 1, 1, 0);
      px(-6, -11, 12, 14, 3); px(-8, -10, 2, 8, 3); px(6, -10, 2, 8, 3);
      px(-6, 1, 12, 3, 2);
      px(-5, 4, 4, 14, 3); px(1, 4, 4, 14, 3);
      ctx.restore();
    }
  }

  function drawFx(e) {
    var t = Math.max(0, e.t);
    if (e.k === "bit") px(e.x + e.d * t * 20, e.y + t * t * 120, 2, 2, 2);
  }

  function drawControls() {
    ["L", "R", "A"].concat(ORDER).forEach(roundBtn);
  }
  function roundBtn(id) {
    var c = CTRL[id], down = held(id), oy = down ? 4 : 0;
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath(); ctx.arc(c.x, c.y + 5, c.r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.col;
    ctx.beginPath(); ctx.arc(c.x, c.y + oy, c.r, 0, Math.PI * 2); ctx.fill();
    if (down) { ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fill(); }
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.arc(c.x - c.r * 0.3, c.y - c.r * 0.3 + oy, c.r * 0.32, 0, Math.PI * 2); ctx.fill();
    if (id === "L" || id === "R") {
      var d = id === "L" ? -1 : 1;
      ctx.fillStyle = "#f4f1e8";
      ctx.beginPath(); ctx.moveTo(c.x + d * 14, c.y + oy); ctx.lineTo(c.x - d * 9, c.y + oy - 14); ctx.lineTo(c.x - d * 9, c.y + oy + 14); ctx.closePath(); ctx.fill();
      return;
    }
    var label = id === "A" ? "A" : BTN[id].label;
    ctx.fillStyle = "#2f3550"; ctx.textAlign = "center";
    var size = id === "A" ? 22 : 16;
    ctx.font = "bold " + size + "px sans-serif";
    while (size > 10 && ctx.measureText(label).width > 98) { size--; ctx.font = "bold " + size + "px sans-serif"; }
    ctx.fillText(label, c.x, c.y + c.r + 24);
  }

  /* 結果画面。秒数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, stage: stage.n, x: P.x, y: P.y, h: P.h, ground: P.ground, act: P.act,
        time: T, retries: retries, clear: clearT >= 0, W: W, H: H, ctrl: CTRL };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
