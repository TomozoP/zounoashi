<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>最速泳法ファインダー</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button, #save-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden], #save-button[hidden] { display:none; }
  #share-button:focus-visible, #save-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
<!-- ゲームのOGP：道具で更新 -->

<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <button id="save-button" type="button" aria-label="動画を保存" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>

<script src="swim3d.js"></script>   <!-- 立体の見た目（動きは2Dのまま） -->
<script>
/* 最速泳法ファインダー

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var followLink = window.zResultActions.follow.link(shareButton.parentNode, true);   /* 結果画面の「作者をフォロー」 */
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 泳ぎの録画 ============
     泳ぎ始めから結果が出て2秒後まで、ボタンを除いた画面の真ん中を正方形で録る。X に載せられる mp4 を優先（無い環境は webm） */
  var saveButton = document.getElementById("save-button");
  var rec = null, recBlob = null, recEnd = 0, recCv = document.createElement("canvas"), recCtx = recCv.getContext("2d");
  /* Claude の確認用ページの中ではファイルを直接落とせないので、ページの保存の仕組みを使う */
  var pageSaver = null;
  if (window.claude && window.claude.use) window.claude.use("downloads").then(function (d) { pageSaver = d; }, function () {});
  function recType() {
    if (!window.MediaRecorder || !recCv.captureStream) return null;
    var c = ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
    for (var i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported(c[i])) return c[i];
    return null;
  }
  function recStart() {
    recStop(true); recBlob = null;
    var type = recType(); if (!type) return;
    /* 正方形（水面とタイムが入る真ん中あたりを切り出す）。投稿しやすさ優先で一辺720・控えめな画質（1分で約20MB） */
    var side = Math.round(Math.min(720, canvas.width) / 2) * 2;
    recCv.width = side; recCv.height = side;
    try {
      var stream = recCv.captureStream(30), r = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 2500000 }), chunks = [];
      r.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      r.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        if (!r.discard && chunks.length) recBlob = new Blob(chunks, { type: type.split(";")[0] });
      };
      r.start(500); rec = r;
    } catch (e) { rec = null; }
  }
  function recStop(discard) {
    if (!rec) return;
    var r = rec; rec = null; r.discard = !!discard;
    try { r.stop(); } catch (e) {}
  }
  function recFrame() {
    if (!rec) return;
    var sw = canvas.width, sy = Math.max(0, Math.min(canvas.height - sw, canvas.height * 0.45 - sw / 2));
    recCtx.drawImage(canvas, 0, sy, sw, sw, 0, 0, recCv.width, recCv.height);
    if (state === S.RESULT && performance.now() > recEnd) recStop(false);
  }
  function fileStamp() {
    var d = new Date();
    function p2(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
  }
  window.zResultActions.bind(saveButton, function () {
    if (!recBlob) return;
    var name = zT("最速泳法ファインダー", "FastestSwimStyleFinder", "최고속영법파인더", "最快泳姿探测器", "最快泳姿探測器") + "_" + fileStamp() + (recBlob.type.indexOf("mp4") >= 0 ? ".mp4" : ".webm");
    if (pageSaver) { pageSaver.save({ filename: name, data: recBlob }).catch(function () {}); return; }
    window.zResultActions.saveImage({ blob: recBlob, name: name });
  });

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============
     EDIT：手足を描いて回す力を決める → RUN：再生で自動で泳ぐ → RESULT */
  var S = { INTRO: "intro", EDIT: "edit", RUN: "run", GOAL: "goal", RESULT: "result" };
  var state, score, T, held, keyMode = false, won = false;

  /* プール：ゲームの 200px が 1m。スタートの壁から25m先がゴールの壁。60秒で打ち切り */
  var M = 200, WALL0 = 60, POOL = 25 * M, WALL1 = WALL0 + POOL, LIMIT = 60;
  var K = 1.45, HEAD_R = 28;                   /* 頭の見た目の大きさ（HEAD_R * K） */
  var SY, PANEL;                               /* 水面の高さ、下の操作盤の上端 */
  function place() {
    SY = Math.round(H * 0.42);
    PANEL = Math.round(H * 0.5);
  }

  /* ============ 体（物理） ============
     胴（腰・首・頭・お腹の4点を棒で固めた板）に、描いた手足4本を関節でつなぐ。
     手足はそれぞれ決めた力で関節のまわりを回り続ける（モーター）。胴には逆向きの力。
     体が進むのは、手足や胴が水を押したときの抵抗だけ。 */
  var HIP = 0, NECK = 1, HEAD = 2, BELLY = 3;
  var JOINT = [NECK, NECK, HIP, HIP];          /* 手前の腕・奥の腕・手前の脚・奥の脚 */
  var TORSO_M = [6, 6, 3, 4], LIMB_M = 0.5;
  var G = 1400;
  var CN = 0.055, CT = 0.004;                  /* 水の抵抗：棒に垂直な動きは強く、沿う動きは弱い */
  var TMAX = 2.5e7, WMAX = 22;                   /* 回す力の最大と、力いっぱいのときの回る速さの上限（1秒あたり） */
  var SUB = 8, SEG = 26, MAXLEN = 240;         /* 細かく分けて計算する回数、描いた線を区切る長さ、手足の長さの上限 */

  /* 設計：手足ごとに、関節から見た点の並び（胴が右向きに寝ているときの向き）と回す力（-1〜1） */
  function line(dx, dy, len) { var a = []; for (var d = SEG; d <= len + 0.1; d += SEG) a.push({ x: dx * d, y: dy * d }); return a; }
  /* 最初は手足なし。手前の腕→奥の腕→手前の脚→奥の脚の順に1本ずつ描いて、回す力を決めていく */
  var design = [{ pts: [], torque: 0.5 }, { pts: [], torque: 0.5 }, { pts: [], torque: 0.5 }, { pts: [], torque: 0.5 }];
  var ORDER = [1, 0, 3, 2];                    /* 描く順番：左腕（奥）→右腕→左脚→右脚 */
  var sel = 1;                                 /* いま描いている手足（順番） */
  var phase = "draw";                          /* draw：操作盤なしで1本ずつ描く（指を離したら次の手足へ）、power：4本まとめて回す力を決める */
  var redraw = false;                          /* 回す力の画面から1本だけ描き直している */
  var pts, mass, sticks, wet, limbIdx, camX, camY, zoom, splats, bubbles, guideT, drawing, sliding, runT;

  /* 設計から体を組み立てる（水面に浮かべた姿勢） */
  function build(x) {
    var y = SY + 8;
    pts = []; mass = []; sticks = []; wet = [];
    function at(px, py, m) { pts.push({ x: px, y: py, px: px, py: py }); mass.push(m); return pts.length - 1; }
    at(x, y, TORSO_M[0]); at(x + 135, y, TORSO_M[1]); at(x + 200, y - 6, TORSO_M[2]); at(x + 68, y + 26, TORSO_M[3]);
    function rigid(list) {
      for (var a = 0; a < list.length; a++) for (var b = a + 1; b < list.length; b++) {
        var p = pts[list[a]], q = pts[list[b]];
        sticks.push([list[a], list[b], Math.hypot(q.x - p.x, q.y - p.y)]);
      }
    }
    rigid([HIP, NECK, HEAD, BELLY]);
    wet.push([HIP, NECK, 1.3], [NECK, HEAD, 1]);
    limbIdx = [];
    for (var i = 0; i < 4; i++) {
      var j = pts[JOINT[i]], list = [JOINT[i]];
      design[i].pts.forEach(function (r) { list.push(at(j.x + r.x, j.y + r.y, LIMB_M)); });
      rigid(list);
      for (var k = 0; k + 1 < list.length; k++) wet.push([list[k], list[k + 1], 1.2]);
      limbIdx.push(list);
    }
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    toEdit();
  }
  /* 描く画面へ。もう一度のときも形は残し、1本目から順に見直せる */
  function toEdit() {
    shareButton.hidden = true; saveButton.hidden = true; recStop(true);
    sel = ORDER[0]; phase = "draw"; redraw = false;
    state = S.EDIT;
    score = 0; T = 0; held = false; won = false;
    build(WALL0 + 360);
    splats = []; bubbles = []; guideT = 0; drawing = null; sliding = false;
    editCam(1);
  }
  /* 描く画面のカメラ。描くときは関節を画面の中央に寄せ、力を決めるときは体の全体を操作盤の上に収める */
  function editCam(k) {
    var j = pts[JOINT[sel]];
    /* 描くとき、腕は関節を左寄り（前へ描く余白）、脚は右寄り（後ろへ描く余白）に置く */
    var tz = phase === "draw" ? 1.3 : 0.9, tx = phase === "draw" ? j.x + (sel < 2 ? 1 : -1) * W * 0.22 / tz : pts[HIP].x + 20, ty = phase === "draw" ? j.y : SY + (H - PANEL) / 2 / tz;
    if (k >= 1 || !(zoom > 0)) { zoom = tz; camX = tx; camY = ty; return; }
    zoom += (tz - zoom) * k; camX += (tx - camX) * k; camY += (ty - camY) * k;
  }
  function play() {
    state = S.RUN; runT = 0; T = 0; drawing = null; sliding = false;
    build(WALL0 + 200);
    recStart();
    tone(523, 0.12, 0.12, "triangle"); tone(784, 0.18, 0.12, "triangle", null, 0.1);
  }

  function physStep(h) {
    var i, p, n = pts.length, ax = new Array(n), ay = new Array(n);
    for (i = 0; i < n; i++) {
      p = pts[i];
      var sub = Math.max(0, Math.min(1, (p.y - SY + 12) / 30));          /* 水に浸かっている割合 */
      var lift = i < 4 ? 1.2 : 1.0;
      var vx = (p.x - p.px) / h, vy = (p.y - p.py) / h;
      ax[i] = -vx * 0.15; ay[i] = G - G * lift * sub - vy * 0.15;
    }
    /* 水の抵抗 */
    for (i = 0; i < wet.length; i++) {
      var A = pts[wet[i][0]], B = pts[wet[i][1]];
      var w = Math.max(0, Math.min(1, ((A.y + B.y) / 2 - SY + 10) / 25));
      if (!w) continue;
      var dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      var vmx = ((A.x - A.px) + (B.x - B.px)) / 2 / h, vmy = ((A.y - A.py) + (B.y - B.py)) / 2 / h;
      var vt = vmx * ux + vmy * uy, nx = -uy, ny = ux, vn = vmx * nx + vmy * ny, cn = CN * wet[i][2];
      var fx = -(cn * vn * nx + CT * vt * ux) * L * w * 10, fy = -(cn * vn * ny + CT * vt * uy) * L * w * 10;
      ax[wet[i][0]] += fx / 2 / mass[wet[i][0]]; ay[wet[i][0]] += fy / 2 / mass[wet[i][0]];
      ax[wet[i][1]] += fx / 2 / mass[wet[i][1]]; ay[wet[i][1]] += fy / 2 / mass[wet[i][1]];
    }
    /* 手足のモーター。手足の点に回す力、胴の点に逆向きの力、関節で合計を0にする */
    for (var L4 = 0; L4 < 4; L4++) {
      var list = limbIdx[L4];
      if (list.length < 2) continue;                /* まだ描いていない手足 */
      var J = pts[list[0]], jvx = (J.x - J.px) / h, jvy = (J.y - J.py) / h;
      function omega(ids) {
        var s = 0, c = 0;
        for (var a = 0; a < ids.length; a++) {
          var q = pts[ids[a]], rx = q.x - J.x, ry = q.y - J.y, r2 = rx * rx + ry * ry;
          if (r2 < 1) continue;
          s += (rx * ((q.y - q.py) / h - jvy) - ry * ((q.x - q.px) / h - jvx)) / r2; c++;
        }
        return c ? s / c : 0;
      }
      var others = [HIP, NECK, HEAD, BELLY].filter(function (t) { return t !== list[0]; });
      var wr = omega(list.slice(1)) - omega(others);
      var tau = TMAX * (design[L4].torque - wr / WMAX);
      tau = Math.max(-TMAX, Math.min(TMAX, tau));
      var sx = 0, sy = 0;
      function push(ids, t) {
        for (var a = 0; a < ids.length; a++) {
          var q = pts[ids[a]], rx = q.x - J.x, ry = q.y - J.y, r2 = rx * rx + ry * ry;
          if (r2 < 1) continue;
          var fx2 = -ry * t / ids.length / r2, fy2 = rx * t / ids.length / r2;
          ax[ids[a]] += fx2 / mass[ids[a]]; ay[ids[a]] += fy2 / mass[ids[a]];
          sx += fx2; sy += fy2;
        }
      }
      push(list.slice(1), tau);
      push(others, -tau);
      ax[list[0]] -= sx / mass[list[0]]; ay[list[0]] -= sy / mass[list[0]];
    }
    for (i = 0; i < n; i++) {
      p = pts[i];
      var nx2 = p.x + (p.x - p.px) + ax[i] * h * h, ny2 = p.y + (p.y - p.py) + ay[i] * h * h;
      p.px = p.x; p.py = p.y; p.x = nx2; p.y = ny2;
    }
    /* 棒の長さを保つ（胴と手足は形を変えない） */
    for (var it = 0; it < 4; it++) {
      for (i = 0; i < sticks.length; i++) {
        var s = sticks[i], P1 = pts[s[0]], P2 = pts[s[1]];
        var ddx = P2.x - P1.x, ddy = P2.y - P1.y, d = Math.hypot(ddx, ddy) || 1, e = (d - s[2]) / d;
        var w1 = mass[s[1]] / (mass[s[0]] + mass[s[1]]), w2 = 1 - w1;
        P1.x += ddx * e * w1; P1.y += ddy * e * w1;
        P2.x -= ddx * e * w2; P2.y -= ddy * e * w2;
      }
    }
    for (i = 0; i < n; i++) {
      p = pts[i];
      if (p.x < WALL0 + 4) { p.x = WALL0 + 4; p.px = p.x; }
      if (p.x > WALL1 - 4) { p.x = WALL1 - 4; p.px = p.x; }
      if (p.y > SY + 290) p.y = SY + 290;
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    guideT += dt;
    updateFx(dt);
    if (state === S.EDIT) editCam(Math.min(1, dt * 6));
    if (state === S.GOAL) {
      for (var j = 0; j < SUB; j++) physStep(dt / SUB);
      if (T - score > 1.6) toResult();
      followCam(dt);
      return;
    }
    if (state !== S.RUN) return;
    runT += dt;
    var before = pts.map(function (p) { return p.y > SY; });
    for (var i = 0; i < SUB; i++) physStep(dt / SUB);
    /* 手足が水面を出入りしたらしぶき */
    for (var k = 4; k < pts.length; k++) if (before[k] !== (pts[k].y > SY) && Math.random() < 0.35) { splash(pts[k].x, 0.5); if (Math.random() < 0.3) plash(); }
    if (Math.random() < dt * 4) addBubble(pts[HEAD].x - 20 + Math.random() * 40, 2 + Math.random() * 3);

    /* 頭でも手足でも、どこかが壁に触れたらゴール。60秒で打ち切り */
    if (pts[HEAD].x + HEAD_R * K >= WALL1 || frontX() >= WALL1 - 6) { state = S.GOAL; score = runT; won = true; T = 0; score = runT; fanfare(); T = runT; }
    else if (runT >= LIMIT) { won = false; score = distance(); toResult(); }
    followCam(dt);
  }

          hip: pts[HIP], shoulder: pts[NECK], head: pts[HEAD],
          limbs: limbIdx.map(function (l) { return l.map(function (k) { return pts[k]; }); }),
          glow: state === S.EDIT && phase === "power" ? sel : -1,
          face: state === S.RUN ? "normal" : "calm", bubbles: bubbles, splats: splats });
        drawn3d = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); drawn3d = false; }
    }
    view3d = drawn3d ? s3 : null;
    if (!drawn3d) draw2d();
    drawEditOverlay();
    drawPanel();
    drawPhaseTitle();
    if (state === S.RUN || state === S.GOAL) recFrame();
    if (state === S.RUN && !thumbMode) drawBtns(runButtons());
    if (state === S.RESULT) drawResult();
  }

  /* やり直し：書き直すは全部消して1本目から、力を直すは形を残して力の画面へ */
  function redo(hit) {
    if (hit === "redraw") { design.forEach(function (d) { d.pts = []; }); toEdit(); }
    else if (hit === "repower") { toEdit(); sel = ORDER[3]; phase = "power"; editCam(1); }
  }
  /* 泳いでいる途中は左上の戻るボタンだけ（力の画面へ戻る） */
  function runButtons() {
    return [{ id: "repower", x: 16, y: 16, w: 72, h: 54, label: "戻る" }];
  }
  function resultButtons() {
    var ids = recType() ? ["redraw", "repower", "save", "share"] : ["redraw", "repower", "share"];
    var b = window.zResultActions.row(W, H * 0.62, ids);
    b[0].label = "書き直す"; b[1].label = "力を直す";
    if (btnOf(b, "save")) btnOf(b, "save").label = "動画を保存";
    return b;
  }
  function btnOf(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    recFrame();                                  /* 録画にはボタンを入れない */
    /* 動画の保存は、録り終わるまで薄く出す */
    var rb = resultButtons();
    drawBtns(rb.filter(function (b) { return b.id !== "save" || recBlob; }));
    if (btnOf(rb, "save") && !recBlob) { ctx.save(); ctx.globalAlpha = 0.4; drawBtns([btnOf(rb, "save")]); ctx.restore(); }
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools/ の道具）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    video: function () { return recBlob ? { type: recBlob.type, size: recBlob.size } : null; },
    pts: function () { return pts; },
    now: function () { return { state: state, score: score, W: W, H: H, head: pts && pts[HEAD], hip: pts && pts[HIP], camX: camX, SY: SY, T: T, runT: runT, dist: pts && distance(), buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(800);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 90)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
