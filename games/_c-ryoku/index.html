<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>C力検査</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #fbfbf8; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 白い画面の上なので、縁の代わりに薄い影で形を見せる */
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; box-shadow:0 2px 14px rgba(0,0,0,.18); }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* C力検査

   視力検査のような白い紙に、黒いCがふたつ。
   下のCをフリックで投げて、上のCに引っかける。
   Cどうしは円を並べた剛体としてぶつかる（重力・反発・摩擦・回転あり）。
   引っかかる＝相手のCの線が、自分のCの穴の中に入って抜けない状態。
   5段で上のCは小さくなっていく。5つ引っかけるまでに投げた回数から「C力」を出す。

   操作
     フリック … 向きと速さで投げる
     スペース … 上のCへ届く速さで投げる（左右キーで横の強さを変える）
     Esc      … 最初から */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, OUT = null;
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor();
    OUT.threshold.value = -12; OUT.ratio.value = 5;
    OUT.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  function sndThrow() { noiseHit(0.16, 900, 0.18, 0.8); }
  var lastClack = 0;
  /* Cどうしが当たるコツッ。強さで音量を変え、続けざまには鳴らさない */
  function sndClack(power) {
    if (!AC || T - lastClack < 0.05 || power < 60) return;
    lastClack = T;
    var v = Math.min(0.35, power / 2400);
    noiseHit(0.03, 2600, v, 5);
    tone(700 + Math.random() * 120, 0.05, v * 0.5, "triangle");
  }
  /* 引っかかった：検査のピッ */
  function sndBeep() { tone(1000, 0.28, 0.22, "sine"); }
  function sndDone() { tone(1000, 0.2, 0.22, "sine"); tone(1000, 0.2, 0.22, "sine", null, 0.28); tone(1500, 0.4, 0.2, "sine", null, 0.56); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ Cの形 ============
     Cは「中心線の半径 rm・線の太さ st・すき間の半分の角度 gh」で決まる。
     すき間は角度0（右）向き。回すと向きが変わる。
     当たり判定は、中心線に沿って線の太さの円を並べたもの。 */
  var GAP = 50 * Math.PI / 180;               /* すき間の半分の角度（上下とも同じ形） */
  var STROKE = 0.12;                          /* 線の太さ / 直径 */
  function makeC(D) {
    var st = D * STROKE, rm = D / 2 - st / 2, r = st / 2;
    var span = Math.PI * 2 - GAP * 2;
    var n = Math.max(12, Math.ceil(span * rm / (r * 0.9)));
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = GAP + span * i / n;
      pts.push({ a: a, x: Math.cos(a) * rm, y: Math.sin(a) * rm });
    }
    return { D: D, st: st, rm: rm, r: r, pts: pts };
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  /* 上のCの大きさ・横位置・すき間の向き（右が0°、上が -90°）。
     投げたCは、すき間を下にして相手の上向きの端へ落とすと引っかかる。
     そのため相手は左右の上寄りに置き、上向きの端を真ん中の側へ向ける。 */
  var STAGES = [
    { D: 160, x: 0.2, gap: -45 },
    { D: 140, x: 0.79, gap: -135 },
    { D: 120, x: 0.2, gap: 0 },
    { D: 100, x: 0.8, gap: 180 },
    { D: 80, x: 0.22, gap: -45 }
  ];
  var BALL = makeC(100);                       /* 投げるC */
  var G = 1800;                                /* 重力 */
  var SUB = 8;                                 /* 1コマを何回に分けて計算するか */
  var E = 0.25, MU = 0.35;                     /* 反発・摩擦 */
  var IM = 1, II = 1 / (BALL.rm * BALL.rm);    /* 質量1の輪。慣性は m r^2 */

  var state, score, T, held, keyMode = false;
  var stage, throws, target, ball, hookT, clearT, aimX, trail;
  var LX, LY;                                  /* 投げる場所 */

  function place() {
    LX = W / 2;
    LY = H - 190;
    if (target) setTarget(stage, true);
  }

  function setTarget(i, keepShape) {
    var st = STAGES[Math.min(i, STAGES.length - 1)];
    var shape = keepShape && target ? target.shape : makeC(st.D);
    target = {
      shape: shape, x: W * st.x, y: Math.round(H * 0.42),
      a: st.gap * Math.PI / 180
    };
    target.world = shape.pts.map(function (p) {
      var c = Math.cos(target.a), s = Math.sin(target.a);
      return { x: target.x + p.x * c - p.y * s, y: target.y + p.x * s + p.y * c };
    });
  }

  function readyBall() {
    ball = { x: LX, y: LY, a: 0, vx: 0, vy: 0, w: 0, flying: false, still: 0, gone: 0 };
    hookT = 0;
    trail = [];
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    stage = 0;
    throws = 0;
    clearT = -1;
    aimX = 0;
    setTarget(0);
    readyBall();
    samples = [];
  }

  /* 投げる前のCは、視力検査のように8方向へ順に向きを変える */
  var TURN = 0.5;
  function readyAngle() { return Math.floor(T / TURN) % 8 * Math.PI / 4; }

  function launch(vx, vy) {
    if (!ball || ball.flying || clearT >= 0 || state !== S.PLAY) return false;
    var sp = Math.hypot(vx, vy), MAX = 2600;
    if (sp > MAX) { vx *= MAX / sp; vy *= MAX / sp; }
    ball.a = readyAngle();
    ball.vx = vx; ball.vy = vy; ball.w = 0;
    ball.flying = true;
    throws++;
    sndThrow();
    return true;
  }

  /* ============ 物理 ============ */
  function physics(dt) {
    var b = ball;
    b.vy += G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;
    var ca = Math.cos(b.a), sa = Math.sin(b.a);
    var R = BALL.r + target.shape.r;
    /* 外側の円どうしが離れていれば調べない */
    var far = Math.hypot(b.x - target.x, b.y - target.y) > BALL.rm + target.shape.rm + R;
    if (far) return;
    var cx = 0, cy = 0, cn = 0, hit = 0;
    for (var i = 0; i < BALL.pts.length; i++) {
      var p = BALL.pts[i];
      var px = b.x + p.x * ca - p.y * sa, py = b.y + p.x * sa + p.y * ca;
      for (var j = 0; j < target.world.length; j++) {
        var q = target.world[j];
        var dx = px - q.x, dy = py - q.y;
        if (dx * dx + dy * dy >= R * R) continue;
        var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
        var nx = dx / d, ny = dy / d, pen = R - d;
        /* 接点（相手の円の表面）と、重心からの腕 */
        var rx = q.x + nx * target.shape.r - b.x, ry = q.y + ny * target.shape.r - b.y;
        var vpx = b.vx - b.w * ry, vpy = b.vy + b.w * rx;
        var vn = vpx * nx + vpy * ny;
        if (vn < 0) {
          var rn = rx * ny - ry * nx;
          var jn = -(1 + E) * vn / (IM + rn * rn * II);
          b.vx += jn * nx * IM; b.vy += jn * ny * IM; b.w += rn * jn * II;
          hit = Math.max(hit, -vn);
          /* 摩擦 */
          vpx = b.vx - b.w * ry; vpy = b.vy + b.w * rx;
          var tx = -ny, ty = nx, vt = vpx * tx + vpy * ty;
          var rt = rx * ty - ry * tx;
          var jt = -vt / (IM + rt * rt * II);
          var lim = MU * jn;
          if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
          b.vx += jt * tx * IM; b.vy += jt * ty * IM; b.w += rt * jt * II;
        }
        cx += nx * pen; cy += ny * pen; cn++;
      }
    }
    if (cn) { b.x += cx / cn * 0.9; b.y += cy / cn * 0.9; }
    if (hit) sndClack(hit);
  }

  /* 相手のCの線が、投げたCの穴の中にある＝引っかかっている */
  function linked() {
    var b = ball, lim = BALL.rm - BALL.r - target.shape.r * 0.3;
    for (var j = 0; j < target.world.length; j++) {
      var q = target.world[j];
      if (Math.hypot(q.x - b.x, q.y - b.y) < lim) return true;
    }
    return false;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.INTRO) { T += dt; return; }
    if (state !== S.PLAY) return;
    T += dt;

    if (clearT >= 0) {
      clearT += dt;
      if (ball.flying) for (var k = 0; k < SUB; k++) physics(dt / SUB);
      if (clearT > 1.1) {
        stage++;
        if (stage >= STAGES.length) {
          score = cPower(throws);
          state = S.RESULT;
          sndDone();
          return;
        }
        setTarget(stage);
        readyBall();
        clearT = -1;
      }
      return;
    }

    if (!ball.flying) return;
    for (var i = 0; i < SUB; i++) physics(dt / SUB);
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 8) trail.shift();

    if (linked()) {
      hookT += dt;
      if (hookT > 0.6) { clearT = 0; sndBeep(); }
    } else hookT = 0;

    var sp = Math.hypot(ball.vx, ball.vy);
    ball.still = sp < 25 && Math.abs(ball.w) < 0.6 ? ball.still + dt : 0;
    var out = ball.y > H + BALL.D || ball.x < -BALL.D || ball.x > W + BALL.D;
    if (out || ball.still > 1.2) {
      ball.gone += dt;
      if (ball.gone > (out ? 0.25 : 0.4)) readyBall();
    }
  }

  /* 5段を引っかけるまでに投げた回数 → C力（視力の段階に合わせる） */
  var TABLE = [[5, "2.0"], [7, "1.5"], [9, "1.2"], [11, "1.0"], [13, "0.9"], [15, "0.8"], [18, "0.7"],
               [21, "0.6"], [25, "0.5"], [30, "0.4"], [36, "0.3"], [45, "0.2"], [60, "0.1"]];
  function cPower(n) {
    for (var i = 0; i < TABLE.length; i++) if (n <= TABLE[i][0]) return TABLE[i][1];
    return "0.01";
  }

  /* ============ 入力 ============
     指の動きを覚えておき、離した瞬間の直前の速さで投げる */
  var samples = [];
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) { keyThrow(); return; }
    held = true;
    samples = [{ x: x, y: y, t: performance.now() }];
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    samples.push({ x: x, y: y, t: performance.now() });
    if (samples.length > 30) samples.shift();
  }
  function up(x, y) {
    if (!held) return;
    held = false;
    if (state !== S.PLAY) return;
    /* 離した位置は使わない（直前の動きの記録だけで速さを出す） */
    var last = samples[samples.length - 1], first = last;
    for (var i = samples.length - 1; i >= 0; i--) {
      if (last.t - samples[i].t > 90) break;
      first = samples[i];
    }
    if (first === last && samples.length > 1) first = samples[samples.length - 2];
    var dt = Math.max(0.016, (last.t - first.t) / 1000);
    var vx = (last.x - first.x) / dt, vy = (last.y - first.y) / dt;
    if (vy > -300) return;                     /* 上へはじいたときだけ投げる */
    launch(vx * 0.9, vy * 0.9);
  }
  /* スペース：上のCの高さまで届く速さ。横は上のCの真上へ向かう＋左右キーの分 */
  function keyThrow() {
    var h = LY - target.y + 30;
    var vy = -Math.sqrt(2 * G * h);
    var t = -vy / G;
    launch((target.x - LX) / t + aimX, vy);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); var p = atCanvas(e); up(p.x, p.y); });
  wrap.addEventListener("pointercancel", function () { held = false; });
  window.addEventListener("blur", function () { held = false; });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      aimX = Math.max(-300, Math.min(300, aimX + (left ? -30 : 30)));
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function doShare() {
    /* ▼SHARE: 正方形サムネの共有リンクは share.js が付ける */
    window.zResultActions.x({ text: "C力 " + score + " #C力検査" });
  }

  /* ============ 描画 ============ */
  var INK = "#111";
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  /* 当たり判定の円の外側まで線を引き、端は切りっぱなしにする */
  function drawC(shape, x, y, a, alpha) {
    var ext = shape.r / shape.rm;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.strokeStyle = INK;
    ctx.lineWidth = shape.st;
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.arc(x, y, shape.rm, a + GAP - ext, a + Math.PI * 2 - GAP + ext);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#fbfbf8";
    ctx.fillRect(0, 0, W, H);

    if (!target) return;
    var fade = clearT >= 0 ? Math.max(0, 1 - Math.max(0, clearT - 0.6) / 0.5) : 1;
    drawC(target.shape, target.x, target.y, target.a, fade);

    if (ball) {
      var a = ball.flying ? ball.a : readyAngle();
      var alpha = fade * (ball.gone > 0 ? Math.max(0, 1 - ball.gone / 0.4) : 1);
      drawC(BALL, ball.x, ball.y, a, alpha);
      if (!ball.flying && keyMode && state === S.PLAY && clearT < 0) drawAim();
    }

    if (state === S.RESULT) drawResult();
  }

  /* キー操作のときだけ、投げる向きを点で見せる */
  function drawAim() {
    var h = LY - target.y + 30, vy = -Math.sqrt(2 * G * h), t = -vy / G;
    var vx = (target.x - LX) / t + aimX;
    ctx.fillStyle = "rgba(17,17,17,.35)";
    for (var k = 1; k <= 7; k++) {
      var s = k * 0.05;
      ctx.beginPath();
      ctx.arc(LX + vx * s, LY + vy * s + G * s * s / 2, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "left";
    var label = "C力", num = String(score);
    ctx.font = "800 52px sans-serif";
    var lw = ctx.measureText(label).width;
    ctx.font = "800 108px sans-serif";
    var nw = ctx.measureText(num).width;
    var x0 = W / 2 - (lw + 18 + nw) / 2;
    ctx.font = "800 52px sans-serif";
    ctx.fillText(label, x0, H * 0.45);
    ctx.font = "800 108px sans-serif";
    ctx.fillText(num, x0 + lw + 18, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return {
        state: state, score: score, W: W, H: H, stage: stage, throws: throws,
        clearing: clearT >= 0, hooked: hookT, launch: { x: LX, y: LY }, turn: TURN,
        ball: ball && { x: ball.x, y: ball.y, a: ball.flying ? ball.a : readyAngle(), vx: ball.vx, vy: ball.vy, w: ball.w, flying: ball.flying },
        target: target && { x: target.x, y: target.y, D: target.shape.D, a: target.a }
      };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    table: function () { return TABLE.slice(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      var guard = Date.now() + 90000;
      while (state !== S.RESULT && Date.now() < guard) {
        if (state === S.PLAY && !ball.flying && clearT < 0) { await r.wait(300 + Math.random() * 500); r.key(); }
        await r.wait(50);
      }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
