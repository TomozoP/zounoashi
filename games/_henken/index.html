<title>偏県</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }

  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }

  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }

  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>

  function showPref(i) {

    var x0 = sx(b[0]), x1 = sx(b[2]), y0 = sy(b[1]), y1 = sy(b[3]);
    if (x0 >= 0 && x1 <= MAP.w && y0 >= 0 && y1 <= MAP.h) return;
    goal = clampCam({ x: (b[0] + b[2]) / 2, y: (b[1] + b[3]) / 2, s: cam.s });
  }

  /* 画面の点にある県。小さい県を押しやすいよう、縁から14px以内なら近いほうの県にする */
  function prefAt(X, Y) {
    var p = toWorld(X, Y), x = p[0], y = p[1];
    for (var i = 0; i < N; i++) {
      var b = BOX[i];
      if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) continue;
      for (var r = 0; r < SHAPES[i].length; r++) if (inside(SHAPES[i][r], x, y)) return i;
    }
    var best = -1, near = 14 / cam.s;
    for (i = 0; i < N; i++) {
      b = BOX[i];
      if (x < b[0] - near || x > b[2] + near || y < b[1] - near || y > b[3] + near) continue;
      for (r = 0; r < SHAPES[i].length; r++) {
        var d = edgeDist(SHAPES[i][r], x, y);
        if (d < near) { near = d; best = i; }
      }
    }
    return best;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function range() { return NAMES.map(function (n, i) { return i; }); }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    misses = 0;
    T = 0;
    done = NAMES.map(function () { return 0; });
    solvedAt = NAMES.map(function () { return -1; });
    triedBy = {};
    list = shuffle(range());
    target = -1; sel = 0; focus = "map";
    wrongK = -1; wrongT = 0;
    scrollY = 0; scrollGoal = null; listDrag = null; vel = 0;
    finale = 0; finishT = -1;
    pointers = {}; mapDrag = null; pinch = null;
    place();
    goal = wholeView();
  }
  function choose(i) {
    if (state !== S.PLAY || finishT >= 0 || i < 0 || done[i]) return;
    target = i;
    wrongK = -1; wrongT = 0;
    if (!pickable(sel)) sel = nextFree(sel, 1);
  }
  function nextFree(k, d) {
    for (var n = 0; n < N; n++) { k = (k + d + N) % N; if (pickable(k)) return k; }
    return k;
  }
  function left() { return done.filter(function (d) { return !d; }).length; }
  /* 外したらその名前だけ押せなくなり、同じ県のまま選び直す。当たったら県名が地図に出る */
  function answer(k) {
    if (state !== S.PLAY || finishT >= 0 || k < 0 || !pickable(k)) return;
    if (list[k] !== target) {
      (triedBy[target] = triedBy[target] || {})[k] = true;
      misses++;
      wrongK = k; wrongT = WRONG_FLASH;
      soundWrong();
      if (sel === k) sel = nextFree(sel, 1);
      return;
    }
    var first = !triedBy[target];
    done[target] = first ? 1 : 2;
    if (first) score++;
    solvedAt[target] = T;
    soundRight();
    target = -1;
    focus = "map";
    if (!left()) { finishT = 0; goal = null; }
  }
  /* キー操作: いまの県から、押した向きにあるいちばん近いまだの県へ */
  function stepPref(dx, dy) {
    var from = target >= 0 ? LABEL[target] : toWorld(MAP.w / 2, MAP.h / 2), best = -1, score_ = Infinity;
    for (var i = 0; i < N; i++) {
      if (done[i] || i === target) continue;
      var vx = LABEL[i][0] - from[0], vy = LABEL[i][1] - from[1];
      var along = vx * dx + vy * dy, side = Math.abs(vx * dy - vy * dx);
      if (along <= 0) continue;
      var c = along + side * 2;
      if (c < score_) { score_ = c; best = i; }
    }
    if (best >= 0) { choose(best); showPref(best); }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    if (goal) {
      /* 自動で寄るとき（倍率は対数で寄せる） */
      var a = 1 - Math.exp(-dt * 6);
      cam.x += (goal.x - cam.x) * a;
      cam.y += (goal.y - cam.y) * a;
      cam.s = Math.exp(Math.log(cam.s) + (Math.log(goal.s) - Math.log(cam.s)) * a);
      if (Math.abs(goal.x - cam.x) + Math.abs(goal.y - cam.y) < 0.2 && Math.abs(goal.s / cam.s - 1) < 0.002) goal = null;
    }
    if (scrollGoal != null) {
      scrollY += (scrollGoal - scrollY) * (1 - Math.exp(-dt * 10));
      if (Math.abs(scrollGoal - scrollY) < 0.5) { scrollY = scrollGoal; scrollGoal = null; }
    } else if (!listDrag && vel) {
      scrollY = clampScroll(scrollY + vel * dt);
      vel *= Math.exp(-dt * 4);
      if (Math.abs(vel) < 10 || scrollY <= 0 || scrollY >= maxScroll) vel = 0;
    }
    if (state !== S.PLAY) return;
    if (wrongT > 0) wrongT = Math.max(0, wrongT - dt);
    if (finishT >= 0) {
      /* 全部埋まったら一覧を消して、県名入りの地図を画面いっぱいに */
      finishT += dt;
      finale = Math.min(1, finishT / 1.2);
      place();
      goal = wholeView();
      if (finishT >= FINAL_WAIT) { state = S.RESULT; shareButton.hidden = false; }
    }
  }

  /* ============ 入力 ============
     地図: 1本指でなぞると動く、2本指で広げる。動かさずに離したら、その県を選ぶ。
     一覧: なぞると動く。動かさずに離したら、その名前で答える。 */
  var pointers = {}, mapDrag = null, pinch = null, listDrag = null, vel = 0;
  function count() { return Object.keys(pointers).length; }
  function down(x, y, id) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) {
      if (focus === "map") { if (target >= 0) { focus = "list"; if (!pickable(sel)) sel = nextFree(sel, 1); reveal(sel); } }
      else answer(sel);
      return;
    }
    if (finishT >= 0) return;
    if (id == null) id = 0;
    if (y < MAP.h && !listDrag) {
      pointers[id] = { x: x, y: y };
      goal = null;
      if (count() === 1) mapDrag = { x0: x, y0: y, cx: cam.x, cy: cam.y, moved: false };
      else if (count() === 2) {
        var p = pointsOf();
        pinch = { d0: Math.max(10, dist(p)), s0: cam.s };
        if (mapDrag) mapDrag.moved = true;
      }
      return;
    }
    if (count()) return;
    listDrag = { y0: y, sy: scrollY, moved: false, lastY: y, lastT: performance.now() / 1000, k: cellAt(x, y), stop: Math.abs(vel) > 60 };
    vel = 0; scrollGoal = null;
  }
  function pointsOf() { var a = []; for (var k in pointers) a.push(pointers[k]); return a; }
  function dist(p) { return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }
  function move(x, y, id) {
    if (id == null) id = 0;
    if (pointers[id]) {
      pointers[id] = { x: x, y: y };
      if (pinch && count() >= 2) {
        var p = pointsOf();
        zoomAt((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2, pinch.s0 * dist(p) / pinch.d0);
        return;
      }
      if (mapDrag && !pinch) {
        if (!mapDrag.moved && Math.hypot(x - mapDrag.x0, y - mapDrag.y0) > 8) mapDrag.moved = true;
        if (mapDrag.moved) {
          cam.x = mapDrag.cx - (x - mapDrag.x0) / cam.s;
          cam.y = mapDrag.cy - (y - mapDrag.y0) / cam.s;
          clampCam(cam);
          /* 端で止まったぶんは、指の位置を基準に取り直す */
          mapDrag.cx = cam.x + (x - mapDrag.x0) / cam.s;
          mapDrag.cy = cam.y + (y - mapDrag.y0) / cam.s;
        }
      }
      return;
    }
    if (!listDrag) return;
    if (!listDrag.moved && Math.abs(y - listDrag.y0) > 10) listDrag.moved = true;
    if (!listDrag.moved) return;
    var t = performance.now() / 1000, d = Math.max(1 / 120, t - listDrag.lastT);
    vel = vel * 0.4 + 0.6 * (listDrag.lastY - y) / d;
    listDrag.lastY = y; listDrag.lastT = t;
    scrollY = clampScroll(listDrag.sy - (y - listDrag.y0));
  }
  function up(id) {
    if (id == null) id = 0;
    if (pointers[id]) {
      delete pointers[id];
      if (count() < 2) pinch = null;
      if (!count()) {
        var d = mapDrag;
        mapDrag = null;
        if (d && !d.moved) { keyMode = false; choose(prefAt(d.x0, d.y0)); }
      } else if (mapDrag) {
        /* 1本だけ残ったら、その指で続けて動かせるように */
        var q = pointsOf()[0];
        mapDrag = { x0: q.x, y0: q.y, cx: cam.x, cy: cam.y, moved: true };
      }
      return;
    }
    if (!listDrag) return;
    var l = listDrag;
    listDrag = null;
    if (l.moved || l.stop) return;
    vel = 0;
    answer(l.k);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!pointers[e.pointerId == null ? 0 : e.pointerId] && !listDrag) return;
    var p = atCanvas(e); move(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) {
    delete pointers[e.pointerId == null ? 0 : e.pointerId];
    if (!count()) { mapDrag = null; pinch = null; }
    listDrag = null;
  });
  window.addEventListener("blur", function () { pointers = {}; mapDrag = null; pinch = null; listDrag = null; });
  wrap.addEventListener("wheel", function (e) {
    if (state !== S.PLAY || finishT >= 0) return;
    e.preventDefault();
    var p = atCanvas(e);
    if (p.y < MAP.h) { zoomAt(p.x, p.y, cam.s * Math.exp(-e.deltaY * 0.0015)); return; }
    scrollGoal = null; vel = 0;
    scrollY = clampScroll(scrollY + e.deltaY);
  }, { passive: false });

  /* キー: 矢印で県を選ぶ → スペースで一覧へ → 矢印で名前 → スペースで答える。
     一覧からはバックスペースで地図へ戻る */
  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var back = e.key === "Backspace";
    var lft = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var rgt = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var upk = e.key === "ArrowUp" || e.key === "w" || e.key === "W";
    var dn = e.key === "ArrowDown" || e.key === "s" || e.key === "S";
    if (!esc && !go && !back && !lft && !rgt && !upk && !dn) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (state !== S.PLAY && !go) return;
    if (back) { focus = "map"; keyMode = true; return; }
    if (lft || rgt || upk || dn) {
      if (finishT >= 0) return;
      keyMode = true;
      if (focus === "map") {
        stepPref(lft ? -1 : rgt ? 1 : 0, upk ? -1 : dn ? 1 : 0);
        return;
      }
      if (lft || rgt) sel = nextFree(sel, lft ? -1 : 1);
      else {
        /* 上下は同じ列で、押せる名前まで進む */
        var d = upk ? -COLS : COLS, k = sel + d;
        while (k >= 0 && k < N && !pickable(k)) k += d;
        if (k >= 0 && k < N) sel = k;
      }
      reveal(sel);
      return;
    }
    if (e.repeat) return;
    if (state === S.PLAY && !keyMode) {
      keyMode = true;
      if (target < 0) stepPref(0, 1);
      return;
    }
    down();
  });
  window.addEventListener("keyup", function (e) {
    if ((e.code === "Space" || e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    /* ▼SHARE */
    window.zResultActions.x({ text: score + "/" + N + " #偏県" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function sx(x) { return (x - cam.x) * cam.s + MAP.x + MAP.w / 2; }
  function sy(y) { return (y - cam.y) * cam.s + MAP.y + MAP.h / 2; }
  function prefPath(i) {
    ctx.beginPath();
    SHAPES[i].forEach(function (r) {
      for (var k = 0; k < r.length; k++) {
        var X = sx(r[k][0]), Y = sy(r[k][1]);
        if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      }
      ctx.closePath();
    });
  }

  var LAND = "#e9dfc7", FILLED = "#a9d8b5";       /* まだ / 埋まった */
  function drawMap() {
    ctx.fillStyle = "#16304a";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(MAP.x, MAP.y, MAP.w, MAP.h); ctx.clip();

    /* 沖縄の枠 */
    ctx.strokeStyle = "rgba(255,255,255,.28)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sx(INSET[0]), sy(INSET[1]), (INSET[2] - INSET[0]) * cam.s, (INSET[3] - INSET[1]) * cam.s);

    ctx.lineJoin = "round";
    var lw = Math.max(0.6, Math.min(1.6, cam.s * 1.2));
    var lit = state === S.PLAY ? target : -1;
    for (var i = 0; i < N; i++) {
      if (i === lit) continue;
      prefPath(i);
      ctx.fillStyle = state !== S.INTRO && done[i] ? FILLED : LAND;
      ctx.fill();
      ctx.strokeStyle = "#8f7f63";
      ctx.lineWidth = lw;
      ctx.stroke();
    }
    if (lit >= 0) {
      prefPath(lit);
      ctx.fillStyle = wrongT > 0 ? "#e2504c" : "#ff7a2f";
      ctx.fill();
      var pulse = (Math.sin(T * 5) + 1) / 2;
      ctx.strokeStyle = keyMode && focus === "map" ? "#f7cc71" : "#fff";
      ctx.lineWidth = 2.5 + pulse * 2;
      ctx.stroke();
    }
    if (state !== S.INTRO) drawLabels();
    ctx.restore();
  }

  /* 当てた県の偏県を、その県の上に出す。当てた瞬間は大きく出て落ち着く */
  function drawLabels() {
    var size = Math.max(10, Math.min(18, 10 + (cam.s / FULL - 1) * 2.4));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    for (var i = 0; i < N; i++) {
      if (!done[i]) continue;
      var t = Math.min(1, (T - solvedAt[i]) / 0.35);
      var s = size * (1 + 0.8 * (1 - t) * (1 - t));
      ctx.font = "800 " + s.toFixed(1) + "px sans-serif";
      var x = sx(LABEL[i][0]), y = sy(LABEL[i][1]);
      ctx.lineWidth = Math.max(3, s * 0.28);
      ctx.strokeStyle = "rgba(255,255,255,.92)";
      ctx.strokeText(plain(NAMES[i]), x, y);
      ctx.fillStyle = "#16202e";
      ctx.fillText(plain(NAMES[i]), x, y);
    }
    ctx.textBaseline = "alphabetic";
  }

  /* ボタンの中に一文を書く。入らないときは字を小さくして1行に収める */
  function lineText(s, b) {
    fit(s, b.w - 32, 22);
    ctx.textAlign = "left";
    ctx.fillText(s, b.x + 16, b.y + b.h / 2 + 1);
    ctx.textAlign = "center";
  }
  /* max の大きさから、幅 room に収まる文字の大きさ */
  function fit(s, room, max) {
    ctx.font = "800 " + max + "px sans-serif";
    var tw = ctx.measureText(s).width, size = tw > room ? Math.floor(max * room / tw) : max;
    ctx.font = "800 " + size + "px sans-serif";
    return size;
  }

  function drawList() {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, LIST.y, W, LIST.h); ctx.clip();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var off = target < 0;                      /* 県を選ぶまでは押せない */
    for (var k = 0; k < N; k++) {
      var b = cell(k);
      if (b.y + b.h < LIST.y || b.y > LIST.y + LIST.h) continue;
      var bg = off ? "rgba(255,255,255,.72)" : "#fff", fg = "#16202e";
      if (used(k)) { bg = "rgba(255,255,255,.12)"; fg = "rgba(255,255,255,.3)"; }
      else if (k === wrongK && wrongT > 0) { bg = "#e2504c"; fg = "#fff"; }
      else if (tried(k)) { bg = "rgba(226,80,76,.28)"; fg = "rgba(255,255,255,.45)"; }
      roundRect(b.x, b.y, b.w, b.h, 14);
      ctx.fillStyle = bg;
      ctx.fill();
      if (keyMode && focus === "list" && k === sel) {
        ctx.strokeStyle = "#f7cc71"; ctx.lineWidth = 4; ctx.stroke();
      }
      ctx.fillStyle = fg;
      lineText(LINES[list[k]], b);
    }
    ctx.restore();
    ctx.textBaseline = "alphabetic";
    /* 一覧が動かせるときは、右端に位置の目印 */
    if (maxScroll > 0) {
      var track = LIST.h - 8, bar = Math.max(40, track * LIST.h / (LIST.h + maxScroll));
      var y = LIST.y + 4 + (track - bar) * (scrollY / maxScroll);
      roundRect(W - 7, y, 4, bar, 2);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fill();
    }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    drawMap();
    if (state !== S.INTRO && finale < 1) {
      ctx.save();
      ctx.globalAlpha = 1 - finale;
      drawList();
      ctx.restore();
    }
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(6,12,20,.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score + "/" + N, W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     読むのと進めるだけ。正解は教えない。
     spot(i) は i 番目の県が地図のどこに見えているか（地図を見ればわかること） */
  window.__probe = {
    now: function () {
      return {
        state: state, score: score, W: W, H: H, N: N, selected: target, left: state === S.INTRO ? N : left(),
        done: done.slice(), misses: misses, tried: target >= 0 ? Object.keys(triedBy[target] || {}).length : 0,
        sel: sel, focus: focus, keyMode: keyMode, scroll: scrollY, maxScroll: maxScroll,
        list: state === S.INTRO ? [] : list.map(function (id, k) {
          var b = cell(k); return { name: plain(NAMES[id]), line: LINES[id], used: used(k), x: b.x, y: b.y, w: b.w, h: b.h };
        }),
        listTop: LIST.y, listBottom: LIST.y + LIST.h,
        cam: { x: cam.x, y: cam.y, s: cam.s }, full: FULL, map: { x: MAP.x, y: MAP.y, w: MAP.w, h: MAP.h }
      };
    },
    spot: function (i) { return { x: sx(LABEL[i][0]), y: sy(LABEL[i][1]) }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var n = 0; n < 6; n++) {
        await r.wait(900);
        var todo = range().filter(function (i) { return !done[i]; });
        var i = todo[Math.floor(Math.random() * todo.length)];
        goal = clampCam({ x: LABEL[i][0], y: LABEL[i][1], s: FULL * 2.5 });
        await r.wait(700);
        choose(i);
        await r.wait(700);
        var free = list.map(function (id, k) { return k; }).filter(pickable);
        var k = free[Math.floor(Math.random() * free.length)];
        reveal(k);
        await r.wait(500);
        answer(k);
      }
      await r.wait(1000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO; startButton.hidden = false;
  layout();
  snapCam();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
