<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>難読ビンゴ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1b2230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 難読ビンゴ

   カードに魚へんの漢字が24個（真ん中は最初から開いている）。
   上に読みが1つずつ出る。その漢字がカードにあれば、時間内にタップして穴を開ける。
   違う漢字を押すと、その読みは流れてしまう。カードに無いと思ったらタイマーの右のスキップボタン（キーは X）で次へ進む。
   ビンゴまでに出た読みの数が結果（少ないほどよい）。
   カードは木・金・虫・魚・鳥と「難」（難読漢字）。6つ全部クリアすると「𰻞」（部首に関係なく、とても読みにくい字）が出る。
   クリアしたカードはブラウザに残し、選ぶ丸にチェックの印を付ける（回数は残さない）。
   ライフは3つ。違う字を押す・カードにある字を開けられずに流す、で1つ減り、なくなると終わり。

   Wikipediaビンゴ（games/_wiki-bingo）のカードと演出を流用している。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  /* 紙のミシン目を押し抜く音。ぷつっと切れて、ポコッと凹む */
  function sndStamp() { noiseHit(0.03, 2600, 0.18, 2); noiseHit(0.06, 900, 0.22, 1.5, 0.02); tone(210, 0.08, 0.1, "sine", 110, 0.02); }
  /* 読みが出た音 */
  function sndCall() { tone(988, 0.07, 0.05, "sine"); tone(1319, 0.12, 0.045, "sine", null, 0.06); }
  /* 違う漢字を押した */
  function sndWrong() { tone(160, 0.22, 0.12, "square", 110); noiseHit(0.08, 400, 0.1, 1); }
  /* カードにあったのに流れた */
  function sndMiss() { tone(330, 0.2, 0.05, "triangle", 220); }
  function sndPass() { tone(440, 0.1, 0.035, "sine", 330); }
  function sndPick() { tone(660, 0.06, 0.06, "square"); }
  /* ライフがなくなった: 下がっていく3音 */
  function sndOver() { [392, 330, 262].forEach(function (f, i) { tone(f, 0.28, 0.07, "triangle", f * 0.94, i * 0.16); }); }
  /* 難が出た: 高く駆け上がって、きらっと */
  /* 抽選機がガラガラ回って、玉がコロコロ出てくる */
  function sndRattle() {
    for (var i = 0; i < 9; i++) noiseHit(0.03, 2200 + Math.random() * 1800, 0.05 + Math.random() * 0.04, 3, i * 0.06 + Math.random() * 0.02);
    for (var k = 0; k < 4; k++) tone(700 - k * 60, 0.05, 0.03, "sine", null, 0.6 + k * 0.07);
    tone(520, 0.1, 0.06, "sine", 380, 0.9);
  }
  /* 𰻞 が出た: 高く駆け上がって、きらっと */
  function sndUnlock() { [784, 988, 1175, 1568, 1976, 2349].forEach(function (f, i) { tone(f, 0.22, 0.06, "triangle", null, 0.15 + i * 0.07); }); }
  function sndDud() { noiseHit(0.04, 400, 0.08, 1); }
  /* リーチ: どきっと低く鳴ってから、上がっていく2音 */
  function sndReach() {
    tone(90, 0.18, 0.16, "sine", 60); noiseHit(0.12, 300, 0.14, 1);
    tone(740, 0.14, 0.06, "triangle", null, 0.12); tone(988, 0.14, 0.06, "triangle", null, 0.24); tone(1319, 0.28, 0.07, "triangle", null, 0.36);
  }
  /* 待ちのマスの読みが出た: きらきらと駆け上がる */
  function sndChance() { [1319, 1568, 1976, 2637].forEach(function (f, i) { tone(f, 0.16, 0.05, "sine", null, i * 0.05); }); }
  function sndBingo() { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.3, 0.08, "triangle", null, i * 0.08); }); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 漢字と読み ============
     部首ごとのカード。やさしい順に左から並べる（よく使う字が多い木・金から、見慣れない字が多い鳥まで）。開始前（と結果）に上の丸で選ぶ。
     1つのカードの中では読みが重ならないものだけにしている
     （同じ読みの字が2つあると、どちらを押せばよいか決まらないため）。
     カード24字に、カードに無い読みも混ぜるので、1組30字以上にする。
     部首そのものの字（鳥のカードの「鳥」など）は、真ん中に出すので入れない。 */
  var SETS = [
    { mark: "木", list: "松まつ 杉すぎ 桜さくら 梅うめ 桃もも 柿かき 栗くり 椿つばき 楓かえで 桐きり 柳やなぎ 檜ひのき " +
                        "欅けやき 柊ひいらぎ 榊さかき 樫かし 楠くすのき 梨なし 柚ゆず 橘たちばな 椎しい 楢なら 樅もみ 桂かつら " +
                        "榎えのき 楡にれ 樺かば 栃とち 柏かしわ 杏あんず 李すもも 机つくえ 板いた 杖つえ 札ふだ 柱はしら " +
                        "杭くい 桁けた 樽たる 櫛くし 槍やり 棚たな 桶おけ 枕まくら 株かぶ 根ね 枝えだ" },
    { mark: "金", list: "銀ぎん 銅どう 鉄てつ 鈴すず 鍋なべ 釜かま 鍬くわ 鋸のこぎり 鎖くさり 針はり 釘くぎ 鐘かね " +
                        "鏡かがみ 錨いかり 鋏はさみ 錠じょう 鍵かぎ 鎧よろい 鉛なまり 鋼はがね 錆さび 銭ぜに 鉢はち 錐きり " +
                        "鎚つち 鍔つば 釣つり 鉾ほこ 銃じゅう 錦にしき 鋲びょう 鉱こう 鋤すき 銛もり 鉋かんな 鑢やすり " +
                        "錘おもり 鏃やじり 鑿のみ 釦ぼたん" },
    { mark: "虫", list: "蛙かえる 蛇へび 蜂はち 蝶ちょう 蛍ほたる 蚊か 蟻あり 蝉せみ 蛸たこ 蟹かに 蜆しじみ " +
                        "蛤はまぐり 蚕かいこ 蛭ひる 蚤のみ 虱しらみ 蝿はえ 蛾が 蝗いなご 虻あぶ 蝮まむし 蟒うわばみ 蛎かき " +
                        "蝦えび 蛆うじ 蜷にな 虹にじ 蟇がま 蝋ろう 蜜みつ 蛹さなぎ 蠍さそり 蚋ぶよ 蜩ひぐらし" },
    { mark: "魚", list: "鮪まぐろ 鯖さば 鰯いわし 鯛たい 鮭さけ 鰤ぶり 鯵あじ 鰹かつお 鮃ひらめ 鰈かれい 鱈たら 鰻うなぎ " +
                        "鮎あゆ 鯉こい 鮒ふな 鯨くじら 鮫さめ 鰆さわら 鯒こち 鱚きす 鰊にしん 鱸すずき 鯔ぼら 鮑あわび " +
                        "鯱しゃち 鰐わに 鱧はも 鯰なまず 鰌どじょう 鰍かじか 鯊はぜ 鱒ます 鮹たこ 鰕えび 鮨すし 鱶ふか " +
                        "鱏えい 鯆いるか 魳かます 鱓うつぼ 鯥むつ 鰰はたはた 鮗このしろ 鱵さより 鯏あさり 鯣するめ" },
    { mark: "鳥", list: "鳩はと 鴨かも 鶴つる 鷹たか 鷲わし 鴎かもめ 鶏にわとり 鷺さぎ 鵜う 鶯うぐいす 鴉からす " +
                        "鳶とび 鶉うずら 鴫しぎ 鵯ひよどり 鶫つぐみ 鵲かささぎ 鴇とき 鳳ほう 鶚みさご 鵙もず 鷽うそ 鴻こう " +
                        "鷭ばん 鶸ひわ 鵐しとど 鵤いかる 鶲ひたき 鳰にお 鵺ぬえ 鴈がん 鳧けり" },
    /* 難: 5つ全部ビンゴすると出る。ほかのカードに入れていない、読みにくい字 */
    { mark: "難", list: "鯑かずのこ 鱪しいら 鰙わかさぎ 鱮たなご 鯎うぐい 鱲からすみ 鰘むろあじ 鮴ごり 鯢さんしょううお 鰥やもめ " +
                        "鰾うきぶくろ 樗おうち 椚くぬぎ 楸ひさぎ 櫟いちい 橅ぶな 榁むろ 楪ゆずりは 樒しきみ 椥なぎ " +
                        "榧かや 櫨はぜ 柞ははそ 鑓やり 鐙あぶみ 錻ぶりき 鎹かすがい 鑷けぬき 鏝こて 鶍いすか " +
                        "鵟のすり 鸛こうのとり 鷚ひばり 螻けら 蟎だに 螽いなご 蜑あま 鴲しめ 蠓まくなぎ" },
    /* 𰻞（ビャン）: ほかの6つを全部クリアすると出る。部首に関係なく、とても読みにくい字 */
    { mark: "𰻞", list: "靨えくぼ 皸あかぎれ 鼾いびき 嚔くしゃみ 噦しゃっくり 瘤こぶ 痣あざ 黴かび 埃ほこり 霙みぞれ " +
                        "霰あられ 雹ひょう 靄もや 颪おろし 凩こがらし 凪なぎ 梲うだつ 閂かんぬき 楔くさび 簪かんざし " +
                        "襷たすき 裃かみしも 褌ふんどし 躾しつけ 俤おもかげ 鼬いたち 鼯むささび 貂てん 獺かわうそ 狢むじな " +
                        "薊あざみ 蕨わらび 薇ぜんまい 蓬よもぎ 韮にら 菫すみれ 粽ちまき 甑こしき 甕かめ 盥たらい " +
                        "笊ざる 匙さじ 竈かまど 閾しきい 廂ひさし 甍いらか 轍わだち 瞼まぶた 眦まなじり 項うなじ " +
                        "臍へそ 踝くるぶし 膕ひかがみ 鬣たてがみ 蹄ひづめ 鰭ひれ 纏まとい 轟とどろき" }
  ].map(function (s) {
    return { mark: s.mark, list: s.list.split(" ").map(function (w) { return { k: w.charAt(0), r: w.slice(1) }; }) };
  });
  var setNo = 3;                                /* 選んでいるカード。最初は魚 */

  /* ============ 記録 ============
     クリアしたカード（ビンゴできたか）だけをブラウザに残す。回数は残さない。
     保存できない環境（プライベートモードなど）でも、その場では覚えておく。 */
  var SAVE_KEY = "sakanahen-bingo-clear", OLD_KEY = "sakanahen-bingo-best";   /* 保存名は、今の記録を消さないよう名前を変える前（魚へんビンゴ）のまま */
  var cleared = {};                             /* クリアしたカード { 魚: true, … } */
  try {
    cleared = JSON.parse(window.localStorage.getItem(SAVE_KEY) || "{}") || {};
    var old = JSON.parse(window.localStorage.getItem(OLD_KEY) || "{}") || {};   /* 前の回数の記録は、クリア済みとして引き継ぐ */
    for (var om in old) if (old[om]) cleared[om] = true;
  } catch (e) { cleared = {}; }
  function saveCleared() { try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(cleared)); } catch (e) {} }
  /* 確かめる用（手元 localhost だけの F8）。遊んでいる間に押すと、出ている読みの字がカードにあれば開け、無ければスキップする。
     カードを選ぶ画面では 𰻞 を出す／戻す（記録には何も書かない） */
  function isLocal() {
    try { return /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname); } catch (e) { return false; }
  }
  function toggleDebugBiang() {
    debugBiang = !debugBiang;
    if (debugBiang) chooseSet(SETS.length - 1);
    else if (setNo >= setCount()) { setNo = 0; chooseSet(3); }   /* 出していたのを戻したら魚へ */
  }
  function debugAnswer() {
    if (phase !== "call") return;
    var at = card.indexOf(cur.k);
    if (at >= 0 && !open[at]) pickCell(at);
    else { skipT = T; endCall("pass"); }
  }
  /* 𰻞 はほかの6つを全部クリアすると出る。手元では F8（カード選びの画面）で出したり戻したりできる */
  var BASE = SETS.length - 1, debugBiang = false, unlockT = -9;
  /* 制作中の固定リンク（/preview/）では、スマホで確かめるために最初から出しておく */
  function isPreview() {
    try { return /\/preview\//.test(window.location.pathname); } catch (e) { return false; }
  }
  function unlocked() {
    if (debugBiang || isPreview()) return true;
    for (var i = 0; i < BASE; i++) if (!cleared[SETS[i].mark]) return false;
    return true;
  }
  function setCount() { return unlocked() ? SETS.length : BASE; }
  function FISH() { return SETS[setNo].list; }
  var DRAW_SPIN = 0.55, DRAW_ROLL = 0.87, DRAW_TIME = 1.2;   /* 抽選機が回る → 玉が転がり出る → 玉が大きく寄ってくる、の区切り（秒） */
  var CALL_TIME = 10;                           /* 1つの読みを出しておく秒数 */
  var LIVES = 3;                                /* ライフの数 */
  var RECENT = 16;                              /* 直近に出た読みは、この数だけ出さない */

  function dealCard() {
    var c = shuffle(FISH().slice()).slice(0, 24).map(function (f) { return f.k; });
    c.splice(12, 0, null);                      /* 真ん中は最初から開いている */
    return c;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[r]; a[r] = t; }
    return a;
  }
  var LINES = (function () {
    var L = [], i, j;
    for (i = 0; i < 5; i++) {
      var row = [], col = [];
      for (j = 0; j < 5; j++) { row.push(i * 5 + j); col.push(j * 5 + i); }
      L.push(row, col);
    }
    L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
    return L;
  })();

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  /* PLAY の中の段階: call（読みが出ている）→ reveal（答えの漢字を見せる）→ 次の call、または bingo → 結果 */
  var state, phase, pt, score, card, open, openT, bingoLine, calls, cur, recent, outcome,
      missT = [], wrongT = [], dealT = -9, drumA = 0, spin = 0, drumOut = 0, skipT = -9, backShown = false, punchT = -9, punchCell = 12, lives = LIVES, lifeT = -9, failed = false, reachFx = [], shakeT = -9, sparks = [], cursor = 0, keyMode = false, T, reached;

  var BOX, BOXH, CARD, CELL, FRAME;
  function place() {
    var extra = Math.max(0, H - 780);
    BOX = 18 + Math.min(extra * 0.3, 80);
    BOXH = 200 + Math.min(extra * 0.35, 110);
    /* 紙のカード: 外枠（FRAME）の上に色の帯、その下に5×5のマス */
    var top = BOX + BOXH + 18, band = 26, pad = 10;
    CELL = { w: 90, h: Math.min(90, Math.floor((H - top - 92 - band - pad * 2) / 5)) };   /* 下は結果のボタンの場所を空けておく */
    var fw = CELL.w * 5 + pad * 2;
    FRAME = { x: (W - fw) / 2, y: top, w: fw, h: band + pad * 2 + CELL.h * 5, band: band };
    CARD = { x: FRAME.x + pad, y: top + band + pad };
  }

  function newRound(keepCard) {
    shareButton.hidden = true;
    state = S.PLAY;
    T = 0; pt = 0; score = 0;
    if (!keepCard) card = dealCard();
    dealT = keepCard ? -9 : 0;                  /* 時計(T)を0に戻すので、配り直しの演出の時刻も合わせる（残すと字が消えたままになる） */
    open = []; openT = []; missT = []; wrongT = [];
    for (var i = 0; i < 25; i++) { open.push(i === 12); openT.push(i === 12 ? 9 : -1); missT.push(-9); wrongT.push(-9); }
    bingoLine = null; reached = {}; reachFx = []; shakeT = -9; sparks = [];
    calls = 0; cur = null; recent = []; outcome = null;
    lives = LIVES; lifeT = -9; failed = false;
    nextCall();
  }

  function nextCall() {
    var pool = FISH().filter(function (f) { return recent.indexOf(f.k) < 0; });
    cur = pool[Math.floor(Math.random() * pool.length)];
    recent.push(cur.k); if (recent.length > RECENT) recent.shift();
    calls++;
    outcome = null;
    phase = "draw"; pt = 0;                     /* まず抽選機が回って玉が出てくる。読みはそのあと */
    sndRattle();
  }
  /* 玉が出きった: 読みを出して、時間を数え始める */
  function showCall() {
    phase = "call"; pt = 0;
    var at = card.indexOf(cur.k);
    if (at >= 0 && !open[at] && waiting().indexOf(at) >= 0) sndChance(); else sndCall();
  }
  /* 読みを終える。ok: 開けた / wrong: 違う字を押した / pass: 箱を押して飛ばした / time: 時間切れ */
  function endCall(how) {
    outcome = how;
    phase = "reveal"; pt = 0;
    var at = card.indexOf(cur.k), missed = how !== "ok" && at >= 0 && !open[at];
    if (missed) { missT[at] = T; sndMiss(); }   /* カードにあったのに開けられなかった */
    else if (how === "pass") sndPass();
    if (how === "wrong" || missed) {            /* 1つの読みで減るのは1つまで */
      lives--; lifeT = T;
      if (lives <= 0) { phase = "over"; pt = 0; sndOver(); }
    }
  }

  function drawHole(cx, cy, R, t, word, color) {
    var PUSH = 0.09, FALL = 0.22;
    if (t < PUSH) {                                         /* 押されてへこむ */
      var u = t / PUSH;
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(29,42,68," + (0.08 + u * 0.18) + ")"; ctx.fill();
      ctx.translate(cx, cy); ctx.scale(1 - u * 0.08, 1 - u * 0.08); ctx.translate(-cx, -cy);
      drawFlap(cx, cy, R, word, color);
      ctx.restore();
      return;
    }
    /* 穴の底（下の机の色）と、切り口の影 */
    var g = ctx.createRadialGradient(cx, cy + R * 0.25, R * 0.2, cx, cy, R);
    g.addColorStop(0, "#141a26"); g.addColorStop(1, "#0a0e16");
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    ctx.lineWidth = 7; ctx.strokeStyle = "rgba(0,0,0,.5)";
    ctx.beginPath(); ctx.arc(cx, cy + 3, R + 2, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    /* 奥へ倒れた紙（上のふちでつながっている） */
    var f = Math.min(1, (t - PUSH) / (FALL - PUSH));
    var fall = f < 1 ? 1 - f * f * 0.72 : 0.28 + Math.sin(Math.min(1, (t - FALL) / 0.18) * Math.PI) * 0.05;
    ctx.translate(cx, cy - R);
    ctx.scale(1, fall);
    ctx.beginPath(); ctx.arc(0, R, R, 0, Math.PI * 2);
    ctx.fillStyle = f < 1 ? "#e8e0cd" : "#b9ae96"; ctx.fill();
    if (word && f < 1) {
      ctx.fillStyle = color || INK; ctx.globalAlpha = 1 - f;
      ctx.font = "700 " + Math.round(R * 1.25) + "px " + KANJI_FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(word, 0, R + 2);
      ctx.textBaseline = "alphabetic";
    }
    ctx.restore();
    /* 切り口のふち（紙の厚み） */
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(160,145,115,.9)";
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 0.05, Math.PI * 0.95); ctx.stroke();
    ctx.strokeStyle = "rgba(29,42,68,.55)";
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  }
  /* 揃った列: 穴を順に金色で囲み、線でつなぐ */
  function drawBingo(R) {
    ctx.save();
    ctx.shadowColor = "#ffd86b"; ctx.shadowBlur = 14;
    var pts = bingoLine.map(function (i) { var r = cellRect(i); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; });
    var u = Math.min(1, pt / 0.6);
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(255,216,107,.85)"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[0].x + (pts[4].x - pts[0].x) * u, pts[0].y + (pts[4].y - pts[0].y) * u); ctx.stroke();
    ctx.lineWidth = 5;
    pts.forEach(function (p, i) {
      if (pt < i * 0.1) return;
      var s = 1 + Math.max(0, 0.25 - (pt - i * 0.1)) * 1.6;
      ctx.beginPath(); ctx.arc(p.x, p.y, (R + 5) * s, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = TH().bg; ctx.fillRect(0, 0, W, H);
    if (state !== S.INTRO) drawBox(); else drawSets();
    drawCard();
    drawSparks();
    if (state === S.RESULT) drawResult();
  }

  /* カードを選ぶ丸。選んでいるものは紙の色 */
  function drawSets() {
    setRects().forEach(function (r, i) {
      var on = i === setNo;
      var ut = i >= BASE ? T - unlockT : 9;
      if (ut < 0) return;                       /* 出てくる前（𰻞 が出る瞬間は、ほかの丸が描けてから） */
      ctx.save();
      if (ut < 1.2) {                           /* 出てきたところ: 光の筋が回り、丸が弾んで大きくなる */
        var pop = ut < 0.35 ? ut / 0.35 * 1.3 : 1 + 0.3 * Math.max(0, 1 - (ut - 0.35) / 0.4);
        ctx.save();
        ctx.translate(r.x, r.y); ctx.rotate(ut * 2);
        ctx.globalAlpha = Math.max(0, 1 - ut / 1.2) * 0.8; ctx.fillStyle = "#ffe08a";
        for (var k = 0; k < 12; k++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r.r * 2.4, -5); ctx.lineTo(r.r * 2.4, 5); ctx.closePath(); ctx.fill(); }
        ctx.restore();
        ctx.translate(r.x, r.y); ctx.scale(pop, pop); ctx.translate(-r.x, -r.y);
      }
      var chip = THEMES[i].rainbow ? rainbowFill(r.x - r.r, r.y - r.r, r.x + r.r, r.y + r.r, T * 60) : THEMES[i].chip === "hazard" ? hazardFill() : THEMES[i].chip;
      var busy = THEMES[i].rainbow || THEMES[i].chip === "hazard";   /* 柄の上の字には縁取り */
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.fillStyle = on ? PAPER : chip; ctx.fill();
      ctx.lineWidth = on ? 6 : 2; ctx.strokeStyle = on ? chip : "rgba(255,255,255,.25)"; ctx.stroke();
      ctx.font = "700 " + Math.round(r.r * 1.18) + "px " + KANJI_FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (busy && !on) {
        ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(20,24,36,.7)";
        ctx.strokeText(SETS[i].mark, r.x, r.y + 2);
      }
      ctx.fillStyle = on ? INK : "rgba(255,248,235,.95)";
      ctx.fillText(SETS[i].mark, r.x, r.y + 2);
      ctx.restore();
      if (cleared[SETS[i].mark]) drawCheck(r.x + r.r * 0.74, r.y - r.r * 0.74);   /* クリアした印 */
      ctx.textBaseline = "alphabetic";
    });
  }

  /* クリアした印: 緑の丸に白いチェック */
  function drawCheck(x, y) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#4caf50"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#0f141d"; ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(x - 5, y + 0.5); ctx.lineTo(x - 1.5, y + 4); ctx.lineTo(x + 5.5, y - 4); ctx.stroke();
    ctx.restore();
  }

  /* 結果画面。ビンゴシートはそのまま見せて、すぐ下に「もう一度」「Xでシェア」 */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = FRAME.y + FRAME.h + 20;   /* ビンゴシートのすぐ下 */
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {                      /* 場面はそのまま。シートの下にボタンを出すだけ */
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, phase: phase, score: score, calls: calls, card: card && card.slice(), open: open && open.slice(),
               call: cur && { kanji: cur.k, reading: cur.r }, outcome: outcome, bingo: bingoLine && bingoLine.slice(),
               set: SETS[setNo].mark, cleared: JSON.parse(JSON.stringify(cleared)), lives: lives, failed: failed, waiting: waiting(), reaches: reachFx.length, cursor: cursor, keyMode: keyMode, W: W, H: H };
    },
    fish: function () { return FISH().map(function (f) { return { kanji: f.k, reading: f.r }; }); },
    sets: function () { return SETS.map(function (s) { return { mark: s.mark, list: s.list.map(function (f) { return { kanji: f.k, reading: f.r }; }) }; }); },
    setButton: function (i) { var r = setRects()[i]; return r && { x: r.x, y: r.y }; },
    setCount: function () { return setCount(); },
    callTime: CALL_TIME,
    box: function () { return { x: W / 2, y: BOX + BOXH / 2 }; },
    backShown: function () { return backShown; },
    shareText: function () { return shareText(); },
    skip: function () { var r = skipRect(); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },
    result: function () { var b = resultButtons(); return { retry: { x: b[0].x + b[0].w / 2, y: b[0].y + b[0].h / 2 }, share: { x: b[1].x + b[1].w / 2, y: b[1].y + b[1].h / 2 } }; },
    dealAlpha: function (i) { return dealAlpha(i); },
    cell: function (i) { var c = cellRect(i); return { x: c.x + c.w / 2, y: c.y + c.h / 2 }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      var guard = Date.now() + 120000;
      while (state === S.PLAY && Date.now() < guard) {
        if (!await r.until(function () { return phase === "call" || state !== S.PLAY; }, 5)) break;
        if (state !== S.PLAY) break;
        var mark = calls;
        await r.wait(700 + Math.random() * 600);
        if (phase !== "call" || calls !== mark) continue;
        var at = card.indexOf(cur.k);
        if (at >= 0 && !open[at]) pickCell(at); else endCall("pass");
        await r.until(function () { return calls !== mark || phase === "bingo" || state !== S.PLAY; }, 5);
      }
      await r.until(function () { return state === S.RESULT; }, 5);
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  /* 開始前: STARTボタンの代わりに、カードの真ん中がまだ閉じていて光っている。
     そこを押し抜くと始まる。キーとジョイパッドはスペースを離したとき */
  function startGame() {
    if (state !== S.INTRO) return;
    audioOn(); resumeAudio();
    newRound(true);
    openT[12] = 0;                              /* 真ん中の穴が開く動きから始める */
    sndStamp();
    punchAt(12);
    var cr = cellRect(12);
    burst(cr.x + cr.w / 2, cr.y + cr.h / 2, 16, 1);
  }
  /* カード選び（開始前）の画面。選んでいたカードのまま、新しく配る */
  function goIntro() {
    shareButton.hidden = true;
    state = S.INTRO; phase = "intro"; score = 0; calls = 0; cur = null; pt = 0;
    bingoLine = null; reachFx = []; sparks = []; failed = false;
    card = dealCard(); dealT = T;
    open = []; openT = []; missT = []; wrongT = [];
    for (var i0 = 0; i0 < 25; i0++) { open.push(false); openT.push(-1); missT.push(-9); wrongT.push(-9); }
    if (unlockT === -1) { unlockT = T + 0.3; sndUnlock(); }   /* 𰻞 が出た直後: 少し待ってから丸がはじけて出てくる */
  }
  T = 0; dealT = -9;
  goIntro();
  layout();
  var lastT = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
