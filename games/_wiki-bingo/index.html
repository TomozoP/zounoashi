<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wikipediaビンゴ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1b2230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
  /* 出典の表示は canvas に描き、その上に透明なリンクを重ねる（録画にも残るように） */
  #credit { position:absolute; left:0; width:100%; display:block; color:transparent; text-decoration:none; touch-action:manipulation; }
  #credit[hidden] { display:none; }
  .article-link { position:absolute; display:block; color:transparent; overflow:hidden; text-decoration:none; border-radius:999px; touch-action:manipulation; }
  .article-link[hidden] { display:none; }
  .article-link:focus-visible { outline:3px solid #f7cc71; outline-offset:2px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <a id="credit" target="_blank" rel="noopener" hidden></a>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* Wikipediaビンゴ

   カードに単語が24個（真ん中は最初から開いている）。
   ランダムに選ばれたWikipediaの記事の題名が3つ出るので、1つ選ぶと本文が流れる。
   本文にカードの単語が出たらそこで止まってマスが光る。タップして穴を開けると続きが流れる。
   1本で揃わなければ次の記事を選ぶ。
   ビンゴまでに読んだ文字数が結果（少ないほどよい）。

   記事は遊ぶたびにWikipediaから取りに行く。本文はリポジトリに入れない。
   Wikipediaの文章は CC BY-SA 4.0 なので、出している間は記事名と利用条件を表示する。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var creditLink = document.getElementById("credit");
  window.zResultActions.bind(shareButton, doShare);
  ["pointerdown", "pointerup"].forEach(function (n) { creditLink.addEventListener(n, function (e) { e.stopPropagation(); }); });

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  function sndType() { noiseHit(0.018, 4200, 0.025, 4); }
  /* 紙のミシン目を押し抜く音。ぷつっと切れて、ポコッと凹む */
  function sndStamp(n) {
    noiseHit(0.03, 2600, 0.18, 2); noiseHit(0.06, 900, 0.22, 1.5, 0.02); tone(210, 0.08, 0.1, "sine", 110, 0.02);
    /* 同じ記事で2つ目からは、開けるたびに1段ずつ上がる鈴の音を重ねる */
    if (n >= 2) { var f = 660 * Math.pow(2, Math.min(n - 2, 7) * 2 / 12); tone(f, 0.18, 0.06, "triangle", null, 0.04); tone(f * 1.5, 0.22, 0.035, "sine", null, 0.09); }
  }
  /* 大当たり: ファンファーレと、じゃらじゃら */
  function sndJackpot() {
    [784, 988, 1175, 1568, 1976].forEach(function (f, i) { tone(f, 0.22, 0.07, "square", null, i * 0.07); });
    for (var i = 0; i < 12; i++) noiseHit(0.05, 5000 + (i % 3) * 900, 0.06, 6, 0.3 + i * 0.05);
  }
  function sndLight() { tone(1568, 0.09, 0.05, "sine"); tone(2093, 0.14, 0.04, "sine", null, 0.05); }
  function sndDud() { noiseHit(0.04, 400, 0.08, 1); }
  /* リーチ: どきっと低く鳴ってから、上がっていく2音 */
  function sndReach() {
    tone(90, 0.18, 0.16, "sine", 60); noiseHit(0.12, 300, 0.14, 1);
    tone(740, 0.14, 0.06, "triangle", null, 0.12); tone(988, 0.14, 0.06, "triangle", null, 0.24); tone(1319, 0.28, 0.07, "triangle", null, 0.36);
  }
  /* 待ちのマスの単語が出た: きらきらと駆け上がる */
  function sndChance() { [1319, 1568, 1976, 2637].forEach(function (f, i) { tone(f, 0.16, 0.05, "sine", null, i * 0.05); }); }
  function sndBingo() { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.3, 0.08, "triangle", null, i * 0.08); }); }
  function sndPick() { tone(660, 0.06, 0.06, "square"); }
  function sndNext() { tone(440, 0.12, 0.04, "sine", 330); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 記事を取ってくる ============
     テストでは window.__wikiSource に同じ形の偽物を置く（通信しないで回すため）。 */
  var API = "https://ja.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query";
  var UA = "ZounoashiGames-WikiBingo/1.0 (https://www.zounoashi.com)";
  function getJSON(url) {
    if (typeof fetch !== "function") return Promise.reject(new Error("通信できない"));
    /* Wikipediaの決まりに沿って、どこの何が問い合わせているかを名乗る（連絡先はサイトのURL） */
    return fetch(url, { headers: { "Api-User-Agent": UA } }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  var wikiSource = {
    /* ランダムな記事を12本取り、そこそこ長いものから3本 */
    choices: function () {
      return getJSON(API + "&generator=random&grnnamespace=0&grnlimit=12&prop=info").then(function (j) {
        var ps = ((j.query && j.query.pages) || []).filter(function (p) { return !p.missing && p.title; });
        var good = ps.filter(function (p) { return p.length >= 2500; });
        if (good.length < 3) good = ps.sort(function (a, b) { return b.length - a.length; });
        good = shuffle(good.slice()).slice(0, 3);
        if (good.length < 3) throw new Error("記事が足りない");
        return good.map(function (p) { return { id: p.pageid, title: p.title }; });
      });
    },
    text: function (id) {
      return getJSON(API + "&prop=extracts&explaintext=1&exsectionformat=plain&exchars=1500&pageids=" + id).then(function (j) {
        var p = j.query && j.query.pages && j.query.pages[0];
        return (p && p.extract) || "";
      });
    }
  };
  function source() { return window.__wikiSource || wikiSource; }

  /* ============ 単語 ============
     分野ごとの言葉。その分野の記事には出やすく、ほかの記事には出にくいものを選んでいる。
     カードは4分野から5語ずつ（20語）と、どの記事にも出やすい言葉4語で作る（題名を見て分野を狙うと当たる）。
     色はミシン目の丸の色。同じ分野は同じ色。 */
  var GENRES = [
    { color: "#d8433b", words: "駅 ホーム 開業 路線 運行 停車 電車 列車 乗車 車両" },            /* 鉄道 */
    { color: "#2f6fd6", words: "卒業 中学校 高等学校 小学校 学区 生徒 校舎 創立 部活 教育" },    /* 学校 */
    { color: "#8a4bd1", words: "出身 経歴 生まれ 父 デビュー 所属 死去 引退 家族 本名 俳優" },  /* 人物 */
    { color: "#1c9a5a", words: "代表 優勝 大会 選手 リーグ シーズン サッカー 試合 得点 移籍 選手権" }, /* スポーツ */
    { color: "#e0527f", words: "作品 曲 監督 映画 発売 アニメ 出演 漫画 公開 原作 アルバム シングル ゲーム 主演" }, /* 作品 */
    { color: "#b9832b", words: "位置 地名 人口 地区 世帯 郵便番号 町 面積" },                    /* 地理 */
    { color: "#5f9a1c", words: "学名 分布 植物 花 葉 生息 昆虫" },                              /* 生き物 */
    { color: "#7a5230", words: "時代 城 明治 江戸 王国 藩 天皇 皇帝 王" },                        /* 歴史 */
    { color: "#3b8c9a", words: "会社 設立 事業 株式会社 販売 本社 企業" },                      /* 会社 */
    { color: "#c26a1a", words: "寺 創建 神社 祭神 本尊 境内" },                                /* 寺社 */
    { color: "#d6a21c", words: "テレビ ラジオ 番組 放送 放送局 開局 中継局" }                  /* 放送 */
  ].map(function (g) { return { color: g.color, words: g.words.split(" ") }; });
  var COMMON = "大学 研究 昭和 平成 アメリカ 東京 世界 中国 現在".split(" ");   /* どの記事にも出やすい */
  var GENRE_OF = {};
  GENRES.forEach(function (g, k) { g.words.forEach(function (w) { GENRE_OF[w] = k; }); });
  function dealCard() {
    var pool = [];
    shuffle(GENRES.slice()).slice(0, 4).forEach(function (g) { pool = pool.concat(shuffle(g.words.slice()).slice(0, 5)); });   /* 4分野から5語ずつ */
    var c = shuffle(pool.concat(shuffle(COMMON.slice()).slice(0, 4)));
    c.splice(12, 0, null);                                  /* 真ん中は最初から開いている */
    return c;
  }
  var MAX_CHARS = 1200;                         /* 1本の記事で流すのは冒頭のここまで */
  var SPEED = 45, FAST = 260;                   /* 1秒に流す文字数（ふつう・押している間） */

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[r]; a[r] = t; }
    return a;
  }
  var LINES = (function () {
    var L = [], i, j;
    for (i = 0; i < 5; i++) {
      var row = [], col = [];
      for (j = 0; j < 5; j++) { row.push(i * 5 + j); col.push(j * 5 + i); }
      L.push(row, col);
    }
    L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
    return L;
  })();

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  /* PLAY の中の段階: load（題名を取りに行く）→ choose（選ぶ）→ fetch（本文を取りに行く）
     → stream（流れる）→ 次の記事の load/choose へ、または bingo → 結果。error は通信の失敗 */
  var state, phase, pt, score, card, open, openT, bingoLine, choices, nextChoices, pick, article, articles,
      text, pos, lines, hits, lit, readList = [], reachFx = [], shakeT = -9, combo = 0, jackT = -9, sparks = [], held, keyMode = false, T, round, retry, typeT, reached;

  var HEAD, BOX, BOXH, CARD, CELL, CREDIT, FRAME;
  function place() {
    var extra = Math.max(0, H - 780);
    HEAD = 14 + Math.min(extra * 0.25, 60);
    BOX = HEAD + 50;
    BOXH = 240 + Math.min(extra * 0.35, 120);
    /* 紙のカード: 外枠（FRAME）の上に色の帯、その下に5×5のマス */
    var top = BOX + BOXH + 12, band = 26, pad = 10;
    CELL = { w: 90, h: Math.min(90, Math.floor((H - top - 40 - band - pad * 2) / 5)) };
    var fw = CELL.w * 5 + pad * 2;
    FRAME = { x: (W - fw) / 2, y: top, w: fw, h: band + pad * 2 + CELL.h * 5, band: band };
    CARD = { x: FRAME.x + pad, y: top + band + pad };
    CREDIT = Math.min(H - 14, FRAME.y + FRAME.h + 22);
    if (text) wrapText();
  }

  function newRound(keepCard) {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    round = (round || 0) + 1;
    T = 0; pt = 0; score = 0; held = false; typeT = 0;
    if (!keepCard) card = dealCard();
    open = []; openT = []; lit = [];
    for (var i = 0; i < 25; i++) { open.push(i === 12); openT.push(i === 12 ? 9 : -1); lit.push(-1); }
    bingoLine = null; reached = {}; reachFx = []; shakeT = -9; combo = 0; jackT = -9; sparks = [];
    choices = null; nextChoices = null; pick = 0; article = null; articles = 0;
    text = ""; pos = 0; lines = []; hits = []; readBefore = 0; counted = false; readList = [];
    loadChoices();
  }

  function fail(again) { phase = "error"; pt = 0; retry = again; }
  function loadChoices() {
    var r = round;
    phase = "load"; pt = 0;
    if (nextChoices) { var c = nextChoices; nextChoices = null; gotChoices(c); return; }
    Promise.resolve().then(function () { return source().choices(); }).then(function (c) {
      if (r === round && phase === "load") gotChoices(c);
    }, function () { if (r === round && phase === "load") fail(loadChoices); });
  }
  function gotChoices(c) { choices = c; pick = 0; phase = "choose"; pt = 0; }
  function prefetchChoices() {
    var r = round;
    Promise.resolve().then(function () { return source().choices(); }).then(function (c) {
      if (r !== round) return;
      if (phase === "load") gotChoices(c); else nextChoices = c;
    }, function () {});
  }
  function choose(i) {
    if (phase !== "choose" || !choices || !choices[i]) return;
    var a = choices[i], r = round;
    sndPick();
    article = a; phase = "fetch"; pt = 0;
    Promise.resolve().then(function () { return source().text(a.id); }).then(function (t) {
      if (r === round && phase === "fetch") startStream(t);
    }, function () { if (r === round && phase === "fetch") fail(function () { phase = "choose"; choose(i); }); });
  }

  function cleanText(t) {
    t = String(t || "").replace(/\r/g, "").replace(/[ \t　]+/g, " ").replace(/\n\s*\n+/g, "\n").trim();
    if (t.length > MAX_CHARS) {
      var cut = t.lastIndexOf("。", MAX_CHARS);
      t = t.slice(0, cut > MAX_CHARS * 0.6 ? cut + 1 : MAX_CHARS);
    }
    return t;
  }
  /* カードの単語が本文のどこで出るか（まだ開いていないものの最初の1回） */
  function findHits() {
    hits = [];
    for (var i = 0; i < 25; i++) {
      if (open[i] || !card[i]) continue;
      var at = text.indexOf(card[i]);
      if (at >= 0) hits.push({ cell: i, start: at, end: at + card[i].length, done: false });
    }
    hits.sort(function (a, b) { return a.end - b.end; });
  }
  function startStream(t) {
    text = cleanText(t);
    if (!text) { loadChoices(); return; }
    articles++;
    readList.push(article);
    pos = 0; counted = false; combo = 0;
    findHits();
    wrapText();
    phase = "stream"; pt = 0;
    prefetchChoices();
  }

  /* 本文を箱の幅で折り返す。1文字ずつの位置を覚えておき、流れた分だけ描く */
  var FONT = 22, LH = 31;
  function wrapText() {
    lines = [];
    ctx.font = "500 " + FONT + "px sans-serif";
    var maxW = W - 32 - 28, x = 0, start = 0, xs = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "\n") { lines.push({ s: start, e: i, xs: xs }); start = i + 1; x = 0; xs = []; continue; }
      var w = ctx.measureText(ch).width;
      if (x + w > maxW) { lines.push({ s: start, e: i, xs: xs }); start = i; x = 0; xs = []; }
      xs.push(x); x += w;
    }
    lines.push({ s: start, e: text.length, xs: xs });
  }

  function stamp(i) {
    if (open[i]) return;
    open[i] = true; openT[i] = 0;
    combo++;                                    /* 同じ記事で何個目か。多いほど音が上がり、火花が増える */
    sndStamp(combo);
    var cr = cellRect(i);
    burst(cr.x + cr.w / 2, cr.y + cr.h / 2, 6 + combo * 5, combo >= 3 ? 1.4 : 1);
    for (var l = 0; l < LINES.length; l++) {
      var n = 0;
      LINES[l].forEach(function (q) { if (open[q]) n++; });
      if (n === 5) { bingoLine = LINES[l]; phase = "bingo"; pt = 0; score = countRead(); sndBingo(); return; }
      if (n === 4 && !reached[l]) { reached[l] = true; reachFx.push({ line: LINES[l], t: T }); shakeT = T; sndReach(); }
    }
  }
  /* リーチの待ち: 4つ開いた列の、残り1つのマス */
  function waiting() {
    var w = [];
    for (var l = 0; l < LINES.length; l++) {
      var miss = -1, n = 0;
      LINES[l].forEach(function (q) { if (open[q]) n++; else miss = q; });
      if (n === 4 && w.indexOf(miss) < 0) w.push(miss);
    }
    return w;
  }
  var readBefore = 0, counted = false;          /* 前の記事までに読んだ文字数。counted = 今の記事も足し終えた */
  function countRead() { return readBefore + (counted ? 0 : countChars(text.slice(0, pos))); }
  /* 本文に出たマスを光らせる。光ったマスはタップするまで光ったまま（その間、本文は止まる） */
  function light(i) {
    if (open[i] || lit[i] >= 0) return;
    lit[i] = T;
    if (waiting().indexOf(i) >= 0) sndChance(); else sndLight();
  }
  function punch(i) {
    if (open[i] || lit[i] < 0 || phase === "bingo") return false;
    lit[i] = -1;
    stamp(i);                                   /* 開けた瞬間の文字数で数える */
    return true;
  }
  function oldestLit() {
    var best = -1;
    for (var i = 0; i < 25; i++) if (lit[i] >= 0 && !open[i] && (best < 0 || lit[i] < lit[best])) best = i;
    return best;
  }
  function cellAt(x, y) {
    for (var i = 0; i < 25; i++) { var r = cellRect(i); if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return i; }
    return -1;
  }
  function countChars(s) { return s.replace(/\s/g, "").length; }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt; pt += dt;
    for (var i = 0; i < 25; i++) if (openT[i] >= 0) openT[i] += dt;
    for (var sp = sparks.length - 1; sp >= 0; sp--) {
      var k = sparks[sp];
      k.life -= dt; k.x += k.vx * dt; k.y += k.vy * dt; k.vy += 700 * dt; k.vx *= 0.985;
      if (k.life <= 0) sparks.splice(sp, 1);
    }
    if (phase === "stream") {
      /* 開けられる単語が出たら、光ったマスを全部開けるまで本文は止まる */
      if (oldestLit() >= 0) { held = false; return; }
      var before = Math.floor(pos);
      pos = Math.min(text.length, pos + (held ? FAST : SPEED) * dt);
      var now = Math.floor(pos), stop = -1;
      for (var h = 0; h < hits.length; h++) {

  /* ============ 描画 ============ */

    var rows = Math.floor((BOXH - 20) / LH);

  /* 紙のビンゴカード。単語はミシン目の丸の上に刷ってあり、出たらその丸を押し抜いて穴にする */
  var PAPER = "#fbf5e6", INK = "#1d2a44", RIM = "#d8433b";
  function holeR() { return Math.min(CELL.w, CELL.h) * 0.4; }
  function drawCard() {
    var F = FRAME;

  /* 待ちのマス: 赤い点線の輪が回って脈打つ。単語が出て光っているときは強く */

  /* 出典。本文を出している間と結果で表示する */
  var creditKey = "";
  function drawCredit() {

        creditLink.textContent = label;
        creditLink.style.top = ((CREDIT - 14) / H * 100) + "%";
        creditLink.style.height = (28 / H * 100) + "%";

    }
    if (!showing) return;
    ctx.fillStyle = "rgba(244,239,230,.62)";
    ctx.font = "500 15px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(fitText(label, W - 32), W / 2, CREDIT);
    ctx.textBaseline = "alphabetic";
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#1b2230"; ctx.fillRect(0, 0, W, H);
    if (state !== S.INTRO) { if (state !== S.RESULT) drawHead(); drawBox(); }   /* 結果では上の記事名と数字を消す（大きい数字と重なるので） */
    drawCard();
    drawSparks();
    drawCredit();
    if (state === S.RESULT) drawResult();
    placeLinks();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」、その下に読んだ記事の一覧（押すとその記事が開く）。
     一覧を置くため、数字とボタンは画面の上のほうに寄せる */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = HEAD + 136;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  /* 記事の行。入りきらないときは最後に読んだ（ビンゴした）ほうから */
  function listRows() {
    var top = HEAD + 136 + 54 + 26, rowH = 64, h = 54;
    var fit = Math.max(1, Math.floor((CREDIT - 20 - top) / rowH));
    var from = Math.max(0, readList.length - fit);
    return readList.slice(from).map(function (a, k) {
      return { a: a, last: from + k === readList.length - 1, x: 24, y: top + k * rowH, w: W - 48, h: h };
    });
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(8,10,16,.78)";
    ctx.fillRect(0, 0, W, CREDIT - 18);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 96px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, HEAD + 112);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
    listRows().forEach(function (r) {
      roundRect(r.x, r.y, r.w, r.h, r.h / 2);
      ctx.fillStyle = "#f6f1e7"; ctx.fill();
      if (r.last) { ctx.lineWidth = 4; ctx.strokeStyle = "#f7cc71"; ctx.stroke(); }
      ctx.fillStyle = "#16202e";
      ctx.font = "800 22px sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(fitText(r.a.title, r.w - 90), r.x + 26, r.y + r.h / 2 + 1);
      drawOutIcon(r.x + r.w - 34, r.y + r.h / 2);
      ctx.textBaseline = "alphabetic";
    });
  }
  /* 外へ開く印（四角から右上へ矢印） */
  function drawOutIcon(x, y) {
    ctx.save();
    ctx.strokeStyle = "#16202e"; ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x - 1, y - 8); ctx.lineTo(x - 9, y - 8); ctx.lineTo(x - 9, y + 9); ctx.lineTo(x + 8, y + 9); ctx.lineTo(x + 8, y + 1);
    ctx.moveTo(x + 2, y - 10); ctx.lineTo(x + 10, y - 10); ctx.lineTo(x + 10, y - 2);
    ctx.moveTo(x + 10, y - 10); ctx.lineTo(x - 1, y + 1);
    ctx.stroke();
    ctx.restore();
  }
  /* 一覧の行に、押すと開く透明なリンクを重ねる（絵は canvas に描いてあるので録画にも残る） */
  var linkEls = [], linkKey = "";
  function articleUrl(a) { return "https://ja.wikipedia.org/?curid=" + encodeURIComponent(a.id); }
  function placeLinks() {
    var rows = state === S.RESULT ? listRows() : [];
    var key = rows.map(function (r) { return r.a.id + "@" + r.y; }).join(",") + ":" + H;
    if (key === linkKey) return;
    linkKey = key;
    while (linkEls.length < rows.length) {
      var el = document.createElement("a");
      el.className = "article-link"; el.target = "_blank"; el.rel = "noopener";
      ["pointerdown", "pointerup"].forEach(function (n) { el.addEventListener(n, function (e) { e.stopPropagation(); }); });
      wrap.appendChild(el);
      linkEls.push(el);
    }
    linkEls.forEach(function (el, k) {
      var r = rows[k];
      el.hidden = !r;
      if (!r) return;
      el.href = articleUrl(r.a);
      el.textContent = r.a.title;
      el.setAttribute("aria-label", r.a.title + "（Wikipedia）");
      el.style.left = (r.x / W * 100) + "%"; el.style.width = (r.w / W * 100) + "%";
      el.style.top = (r.y / H * 100) + "%"; el.style.height = (r.h / H * 100) + "%";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, phase: phase, score: score, card: card && card.slice(), open: open && open.slice(),
               bingo: bingoLine && bingoLine.slice(), waiting: waiting(), reaches: reachFx.length, combo: combo, jackpot: jackT >= 0,
               genres: card && card.map(function (w) { return w == null ? null : (GENRE_OF[w] != null ? GENRE_OF[w] : -1); }), lit: lit && lit.map(function (v) { return v >= 0; }), articles: articles, pos: pos, length: text.length,
               title: article && article.title, choices: choices && choices.map(function (c) { return c.title; }),
               pick: pick, held: held, W: W, H: H };
    },
    choice: function (i) { var r = choiceRects()[i]; return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },
    retryButton: function () { var r = retryRect(); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },
    result: function () { var b = resultButtons(); return { retry: { x: b[0].x + b[0].w / 2, y: b[0].y + b[0].h / 2 }, share: { x: b[1].x + b[1].w / 2, y: b[1].y + b[1].h / 2 } }; },
    list: function () { return listRows().map(function (r) { return { title: r.a.title, url: articleUrl(r.a), last: r.last, y: r.y + r.h / 2 }; }); },
    links: function () { return linkEls.filter(function (e) { return !e.hidden; }).map(function (e) { return e.href; }); },
    cell: function (i) { var c = cellRect(i); return { x: c.x + c.w / 2, y: c.y + c.h / 2 }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var n = 0; n < 8 && state === S.PLAY; n++) {
        if (!await r.until(function () { return phase === "choose" || phase === "bingo" || phase === "error"; }, 15)) throw Error("記事が来ない");
        if (phase !== "choose") break;
        await r.wait(900);
        choose(Math.floor(Math.random() * 3));
        var guard = Date.now() + 60000;
        while ((phase === "fetch" || phase === "stream") && Date.now() < guard) {
          var o = oldestLit();
          if (o >= 0 && T - lit[o] > 0.35) punch(o);
          await r.wait(50);
        }
        while (oldestLit() >= 0 && phase !== "bingo") { punch(oldestLit()); await r.wait(300); }
      }
      await r.until(function () { return state === S.RESULT; }, 5);
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(true); });

  /* 開始前はカードだけ見せる（通信はSTARTを押してから） */
  state = S.INTRO; phase = "intro"; round = 0; score = 0; text = ""; hits = []; lines = []; article = null; pt = 0; T = 0;
  card = dealCard();
  open = []; openT = []; lit = []; for (var i0 = 0; i0 < 25; i0++) { open.push(i0 === 12); openT.push(i0 === 12 ? 9 : -1); lit.push(-1); }
  startButton.hidden = false;
  layout();
  var lastT = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
