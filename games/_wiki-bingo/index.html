<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wikipediaビンゴ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1b2230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
  /* 出典の表示は canvas に描き、その上に透明なリンクを重ねる（録画にも残るように） */
  #credit { position:absolute; left:0; width:100%; display:block; color:transparent; text-decoration:none; touch-action:manipulation; }
  #credit[hidden] { display:none; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <a id="credit" target="_blank" rel="noopener" hidden></a>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* Wikipediaビンゴ

   カードに単語が24個（真ん中は最初から開いている）。
   ランダムに選ばれたWikipediaの記事の題名が3つ出るので、1つ選ぶと本文が流れる。
   本文にカードの単語が出たら穴が開く。1本で揃わなければ次の記事を選ぶ。
   ビンゴまでに読んだ文字数が結果（少ないほどよい）。

   記事は遊ぶたびにWikipediaから取りに行く。本文はリポジトリに入れない。
   Wikipediaの文章は CC BY-SA 4.0 なので、出している間は記事名と利用条件を表示する。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var creditLink = document.getElementById("credit");
  window.zResultActions.bind(shareButton, doShare);
  ["pointerdown", "pointerup"].forEach(function (n) { creditLink.addEventListener(n, function (e) { e.stopPropagation(); }); });

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  function sndType() { noiseHit(0.018, 4200, 0.025, 4); }
  function sndStamp() { noiseHit(0.08, 500, 0.35, 1.2); tone(180, 0.09, 0.08, "sine", 90); }
  function sndReach() { tone(880, 0.12, 0.06, "triangle"); tone(1175, 0.16, 0.06, "triangle", null, 0.1); }
  function sndBingo() { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.3, 0.08, "triangle", null, i * 0.08); }); }
  function sndPick() { tone(660, 0.06, 0.06, "square"); }
  function sndNext() { tone(440, 0.12, 0.04, "sine", 330); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 記事を取ってくる ============
     テストでは window.__wikiSource に同じ形の偽物を置く（通信しないで回すため）。 */
  var API = "https://ja.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query";
  function getJSON(url) {
    if (typeof fetch !== "function") return Promise.reject(new Error("通信できない"));
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  var wikiSource = {
    /* ランダムな記事を12本取り、そこそこ長いものから3本 */
    choices: function () {
      return getJSON(API + "&generator=random&grnnamespace=0&grnlimit=12&prop=info").then(function (j) {
        var ps = ((j.query && j.query.pages) || []).filter(function (p) { return !p.missing && p.title; });
        var good = ps.filter(function (p) { return p.length >= 2500; });
        if (good.length < 3) good = ps.sort(function (a, b) { return b.length - a.length; });
        good = shuffle(good.slice()).slice(0, 3);
        if (good.length < 3) throw new Error("記事が足りない");
        return good.map(function (p) { return { id: p.pageid, title: p.title }; });
      });
    },
    text: function (id) {
      return getJSON(API + "&prop=extracts&explaintext=1&exsectionformat=plain&pageids=" + id).then(function (j) {
        var p = j.query && j.query.pages && j.query.pages[0];
        return (p && p.extract) || "";
      });
    }
  };
  function source() { return window.__wikiSource || wikiSource; }

  /* ============ 単語 ============
     記事によく出る言葉。1本の記事に出る割合が1〜5割くらいのものを混ぜている。 */
  var WORDS = ("東京 大阪 大学 学校 高校 世界 選手 番組 放送 発売 設立 出身 駅 県 町 村 会社 研究 歴史 活動 " +
               "開始 所属 登場 以降 現在 当時 一部 以上 アメリカ 中国 韓国 山 川 海 島 道 橋 車 鉄道 バス 船 " +
               "野球 試合 優勝 王 家 父 賞 大会 記録 星 水 火 寺 城 明治 昭和 平成 時代 テレビ 通信 法 線 局 " +
               "館 社長 女 男 犬 石 花 最初 最後").split(" ");
  var MAX_CHARS = 2600;                         /* 1本の記事で流す上限 */
  var SPEED = 70, FAST = 260;                   /* 1秒に流す文字数（ふつう・押している間） */

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[r]; a[r] = t; }
    return a;
  }
  var LINES = (function () {
    var L = [], i, j;
    for (i = 0; i < 5; i++) {
      var row = [], col = [];
      for (j = 0; j < 5; j++) { row.push(i * 5 + j); col.push(j * 5 + i); }
      L.push(row, col);
    }
    L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
    return L;
  })();

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  /* PLAY の中の段階: load（題名を取りに行く）→ choose（選ぶ）→ fetch（本文を取りに行く）
     → stream（流れる）→ 次の記事の load/choose へ、または bingo → 結果。error は通信の失敗 */
  var state, phase, pt, score, card, open, openT, bingoLine, choices, nextChoices, pick, article, articles,
      text, pos, lines, hits, held, keyMode = false, T, round, retry, typeT, reached;

  var HEAD, BOX, BOXH, CARD, CELL, CREDIT;
  function place() {
    var extra = Math.max(0, H - 780);
    HEAD = 14 + Math.min(extra * 0.25, 60);
    BOX = HEAD + 50;
    BOXH = 186 + Math.min(extra * 0.3, 90);
    CELL = { w: 101, h: Math.min(104, Math.floor((H - BOX - BOXH - 16 - 44) / 5)) };
    CARD = { x: 16, y: BOX + BOXH + 16 };
    CREDIT = Math.min(H - 16, CARD.y + CELL.h * 5 + 26);
    if (text) wrapText();
  }

  function newRound(keepCard) {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    round = (round || 0) + 1;
    T = 0; pt = 0; score = 0; held = false; typeT = 0;
    if (!keepCard) { card = shuffle(WORDS.slice()).slice(0, 25); card[12] = null; }   /* 真ん中は最初から開いている */
    open = []; openT = [];
    for (var i = 0; i < 25; i++) { open.push(i === 12); openT.push(i === 12 ? 9 : -1); }
    bingoLine = null; reached = {};
    choices = null; nextChoices = null; pick = 0; article = null; articles = 0;
    text = ""; pos = 0; lines = []; hits = []; readBefore = 0;
    loadChoices();
  }

  function fail(again) { phase = "error"; pt = 0; retry = again; }
  function loadChoices() {
    var r = round;
    phase = "load"; pt = 0;
    if (nextChoices) { var c = nextChoices; nextChoices = null; gotChoices(c); return; }
    Promise.resolve().then(function () { return source().choices(); }).then(function (c) {
      if (r === round && phase === "load") gotChoices(c);
    }, function () { if (r === round && phase === "load") fail(loadChoices); });
  }
  function gotChoices(c) { choices = c; pick = 0; phase = "choose"; pt = 0; }
  function prefetchChoices() {
    var r = round;
    Promise.resolve().then(function () { return source().choices(); }).then(function (c) {
      if (r !== round) return;
      if (phase === "load") gotChoices(c); else nextChoices = c;
    }, function () {});
  }
  function choose(i) {
    if (phase !== "choose" || !choices || !choices[i]) return;
    var a = choices[i], r = round;
    sndPick();
    article = a; phase = "fetch"; pt = 0;
    Promise.resolve().then(function () { return source().text(a.id); }).then(function (t) {
      if (r === round && phase === "fetch") startStream(t);
    }, function () { if (r === round && phase === "fetch") fail(function () { phase = "choose"; choose(i); }); });
  }

  function cleanText(t) {
    t = String(t || "").replace(/\r/g, "").replace(/[ \t　]+/g, " ").replace(/\n\s*\n+/g, "\n").trim();
    if (t.length > MAX_CHARS) {
      var cut = t.lastIndexOf("。", MAX_CHARS);
      t = t.slice(0, cut > MAX_CHARS * 0.6 ? cut + 1 : MAX_CHARS);
    }
    return t;
  }
  /* カードの単語が本文のどこで出るか（まだ開いていないものの最初の1回） */
  function findHits() {
    hits = [];
    for (var i = 0; i < 25; i++) {
      if (open[i] || !card[i]) continue;
      var at = text.indexOf(card[i]);
      if (at >= 0) hits.push({ cell: i, start: at, end: at + card[i].length, done: false });
    }
    hits.sort(function (a, b) { return a.end - b.end; });
  }
  function startStream(t) {
    text = cleanText(t);
    if (!text) { loadChoices(); return; }
    articles++;
    pos = 0;
    findHits();
    wrapText();
    phase = "stream"; pt = 0;
    prefetchChoices();
  }

  /* 本文を箱の幅で折り返す。1文字ずつの位置を覚えておき、流れた分だけ描く */
  var FONT = 22, LH = 31;
  function wrapText() {
    lines = [];
    ctx.font = "500 " + FONT + "px sans-serif";
    var maxW = W - 32 - 28, x = 0, start = 0, xs = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "\n") { lines.push({ s: start, e: i, xs: xs }); start = i + 1; x = 0; xs = []; continue; }
      var w = ctx.measureText(ch).width;
      if (x + w > maxW) { lines.push({ s: start, e: i, xs: xs }); start = i; x = 0; xs = []; }
      xs.push(x); x += w;
    }
    lines.push({ s: start, e: text.length, xs: xs });
  }

  function stamp(i) {
    if (open[i]) return;
    open[i] = true; openT[i] = 0;
    sndStamp();
    for (var l = 0; l < LINES.length; l++) {
      var n = 0;
      LINES[l].forEach(function (q) { if (open[q]) n++; });
      if (n === 5) { bingoLine = LINES[l]; phase = "bingo"; pt = 0; score = countRead(); sndBingo(); return; }
      if (n === 4 && !reached[l]) { reached[l] = true; sndReach(); }
    }
  }
  var readBefore = 0;                           /* 前の記事までに読んだ文字数 */
  function countRead() { return readBefore + countChars(text.slice(0, pos)); }
  function countChars(s) { return s.replace(/\s/g, "").length; }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt; pt += dt;
    for (var i = 0; i < 25; i++) if (openT[i] >= 0) openT[i] += dt;
    if (phase === "stream") {
      var before = Math.floor(pos);
      pos = Math.min(text.length, pos + (held ? FAST : SPEED) * dt);
      var now = Math.floor(pos);
      typeT -= dt;
      if (now > before && typeT <= 0) { typeT = held ? 0.03 : 0.055; sndType(); }
      for (var h = 0; h < hits.length; h++) {
        var hit = hits[h];
        if (hit.done || hit.end > now) continue;
        hit.done = true; hit.t = T;
        pos = hit.end;                          /* 開いた瞬間で数える */
        stamp(hit.cell);
        if (phase === "bingo") return;
      }
      score = countRead();
      if (pos >= text.length) { phase = "after"; pt = 0; }
    } else if (phase === "after") {
      if (pt >= 0.7) {
        readBefore += countChars(text);
        sndNext();
        loadChoices();
      }
    } else if (phase === "bingo") {
      if (pt >= 2.2) { state = S.RESULT; held = false; }
    }
  }

  /* ============ 入力 ============ */
  function choiceRects() {
    var h = 56, gap = 9, y = BOX + (BOXH - (h * 3 + gap * 2)) / 2;
    return [0, 1, 2].map(function (i) { return { x: 16, y: y + i * (h + gap), w: W - 32, h: h }; });
  }
  function retryRect() { return { x: W / 2 - 50, y: BOX + BOXH / 2 - 30, w: 100, h: 60 }; }
  function inside(r, x, y) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (phase === "choose") {
      if (x == null) { choose(pick); return; }
      var cr = choiceRects();
      for (var i = 0; i < 3; i++) if (inside(cr[i], x, y)) { pick = i; choose(i); return; }
      return;
    }
    if (phase === "error") {
      if (x == null || inside(retryRect(), x, y)) { var f = retry; retry = null; if (f) f(); }
      return;
    }
    if (phase === "stream") held = true;      /* 押している間は速く流れる */
  }
  function move() {}
  function up() { held = false; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var upK = e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === "ArrowLeft";
    var downK = e.key === "ArrowDown" || e.key === "s" || e.key === "S" || e.key === "ArrowRight";
    if (!esc && !go && !upK && !downK) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (upK || downK) {
      if (state === S.PLAY && phase === "choose") pick = (pick + (downK ? 1 : 2)) % 3;
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    window.zResultActions.x({ text: score + "文字でビンゴ #Wikipediaビンゴ" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  /* 長い文字列を幅に収める（はみ出す分は … にする） */
  function fitText(s, maxW) {
    if (ctx.measureText(s).width <= maxW) return s;
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    return s + "…";
  }
  function cellRect(i) {
    return { x: CARD.x + (i % 5) * CELL.w, y: CARD.y + Math.floor(i / 5) * CELL.h, w: CELL.w, h: CELL.h };
  }

  function drawHead() {
    if (article && (phase === "stream" || phase === "after" || phase === "bingo" || state === S.RESULT || phase === "fetch")) {
      ctx.fillStyle = "#f4efe6";
      ctx.font = "800 26px sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(fitText(article.title, W - 32 - 110), 16, HEAD + 18);
    }
    ctx.fillStyle = "#f7cc71";
    ctx.font = "800 30px sans-serif";
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(String(score), W - 16, HEAD + 18);
    ctx.textBaseline = "alphabetic";
  }

  function drawBox() {
    roundRect(16, BOX, W - 32, BOXH, 14);
    ctx.fillStyle = "#0f141d"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.stroke();

    if (phase === "choose" && choices) { drawChoices(); return; }
    if (phase === "load" || phase === "fetch") { drawSpinner(W / 2, BOX + BOXH / 2); return; }
    if (phase === "error") { drawRetry(); return; }
    if (!text) return;

    /* 流れた分の最後の数行 */
    var now = Math.floor(pos), last = 0;
    for (var i = 0; i < lines.length; i++) if (lines[i].s <= now) last = i;
    var rows = Math.floor((BOXH - 20) / LH);
    var first = Math.max(0, last - rows + 1);
    ctx.save();
    roundRect(16, BOX, W - 32, BOXH, 14); ctx.clip();
    ctx.font = "500 " + FONT + "px sans-serif";
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    for (var r = first; r <= last; r++) {
      var L = lines[r], y = BOX + 14 + (r - first) * LH + LH / 2, x0 = 30;
      var end = Math.min(L.e, now);
      /* 当たった単語の下地 */
      hits.forEach(function (h) {
        if (!h.done) return;
        var a = Math.max(h.start, L.s), b = Math.min(h.end, end);
        if (a >= b) return;
        var xa = L.xs[a - L.s], xb = (b - L.s < L.xs.length) ? L.xs[b - L.s] : lineEndX(L, b);
        var fresh = Math.max(0, 1 - (T - h.t) / 0.6);
        ctx.fillStyle = "rgba(247,204,113," + (0.55 + fresh * 0.45) + ")";
        roundRect(x0 + xa - 2, y - 15, xb - xa + 4, 30, 6); ctx.fill();
      });
      ctx.fillStyle = "#d9dde6";
      ctx.fillText(text.slice(L.s, end), x0, y + 1);
    }
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }
  function lineEndX(L, b) {
    ctx.font = "500 " + FONT + "px sans-serif";
    var i = b - 1 - L.s;
    return L.xs[i] + ctx.measureText(text.charAt(b - 1)).width;
  }
  function drawChoices() {
    var cr = choiceRects();
    for (var i = 0; i < 3; i++) {
      var r = cr[i], c = choices[i];
      var appear = Math.min(1, Math.max(0, (pt - i * 0.08) / 0.25));
      ctx.save();
      ctx.globalAlpha = appear;
      ctx.translate(0, (1 - appear) * 12);
      roundRect(r.x, r.y, r.w, r.h, r.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      if (keyMode && pick === i) { ctx.lineWidth = 4; ctx.strokeStyle = "#f7cc71"; ctx.stroke(); }
      ctx.fillStyle = "#16202e";
      ctx.font = "800 23px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(fitText(c.title, r.w - 44), r.x + r.w / 2, r.y + r.h / 2 + 1);
      ctx.restore();
    }
    ctx.textBaseline = "alphabetic";
  }
  function drawSpinner(x, y) {
    for (var i = 0; i < 8; i++) {
      var a = T * 6 + i * Math.PI / 4;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 20, y + Math.sin(a) * 20, 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(244,239,230," + (0.15 + i / 10) + ")"; ctx.fill();
    }
  }
  function drawRetry() {
    var r = retryRect();
    roundRect(r.x, r.y, r.w, r.h, r.h / 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.fillStyle = "#16202e";
    if (window.zActionIcon) window.zActionIcon(ctx, "もう一度", r.x + r.w / 2, r.y + r.h / 2, 30);
  }

  function drawCard() {
    var bg = { x: CARD.x - 6, y: CARD.y - 6, w: CELL.w * 5 + 12, h: CELL.h * 5 + 12 };
    roundRect(bg.x, bg.y, bg.w, bg.h, 14);
    ctx.fillStyle = "#2c3a52"; ctx.fill();
    for (var i = 0; i < 25; i++) {
      var c = cellRect(i), g = 3;
      roundRect(c.x + g, c.y + g, c.w - g * 2, c.h - g * 2, 9);
      ctx.fillStyle = "#f6f1e7"; ctx.fill();
      var cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      if (card[i]) {
        var w = card[i];
        ctx.fillStyle = "#16202e";
        ctx.font = "800 " + Math.min(32, Math.floor(84 / w.length)) + "px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(w, cx, cy + 1);
        ctx.textBaseline = "alphabetic";
      }
      if (open[i]) drawStampMark(cx, cy, Math.min(c.w, c.h) * 0.4, openT[i], !card[i]);
    }
    if (bingoLine) {
      var a = cellRect(bingoLine[0]), b = cellRect(bingoLine[4]);
      var u = Math.min(1, pt / 0.5);
      var x0 = a.x + a.w / 2, y0 = a.y + a.h / 2, x1 = b.x + b.w / 2, y1 = b.y + b.h / 2;
      ctx.save();
      ctx.lineCap = "round";
      ctx.shadowColor = "#f7cc71"; ctx.shadowBlur = 16;
      ctx.strokeStyle = "rgba(247,204,113,.92)"; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u); ctx.stroke();
      ctx.restore();
    }
  }
  /* スタンプ。押した瞬間に大きく、少し戻って落ち着く */
  function drawStampMark(x, y, r, t, star) {
    var s = t < 0.12 ? 1.5 - t / 0.12 * 0.6 : (t < 0.25 ? 0.9 + (t - 0.12) / 0.13 * 0.1 : 1);
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.globalAlpha = Math.min(1, 0.4 + t * 6);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(214,48,58,.42)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(170,24,34,.85)"; ctx.stroke();
    if (star) {
      ctx.beginPath();
      for (var k = 0; k < 10; k++) {
        var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.3 : r * 0.7;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fillStyle = "#fff4d6"; ctx.fill();
    }
    ctx.restore();
  }

  /* 出典。本文を出している間と結果で表示する */
  var creditKey = "";
  function drawCredit() {
    var showing = article && text && (phase === "stream" || phase === "after" || phase === "bingo" || state === S.RESULT);
    var key = showing ? article.id + ":" + H : "";
    if (key !== creditKey) {
      creditKey = key;
      creditLink.hidden = !showing;
      if (showing) {
        creditLink.href = "https://ja.wikipedia.org/?curid=" + encodeURIComponent(article.id);
        creditLink.textContent = "出典：Wikipedia「" + article.title + "」 CC BY-SA 4.0";
        creditLink.style.top = ((CREDIT - 14) / H * 100) + "%";
        creditLink.style.height = (28 / H * 100) + "%";
      }
    }
    if (!showing) return;
    ctx.fillStyle = "rgba(244,239,230,.62)";
    ctx.font = "500 15px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(fitText("出典：Wikipedia「" + article.title + "」 CC BY-SA 4.0", W - 32), W / 2, CREDIT);
    ctx.textBaseline = "alphabetic";
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#1b2230"; ctx.fillRect(0, 0, W, H);
    if (state !== S.INTRO) { drawHead(); drawBox(); }
    drawCard();
    drawCredit();
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(8,10,16,.68)";
    ctx.fillRect(0, 0, W, CREDIT - 18);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, phase: phase, score: score, card: card && card.slice(), open: open && open.slice(),
               bingo: bingoLine && bingoLine.slice(), articles: articles, pos: pos, length: text.length,
               title: article && article.title, choices: choices && choices.map(function (c) { return c.title; }),
               pick: pick, held: held, W: W, H: H };
    },
    choice: function (i) { var r = choiceRects()[i]; return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },
    retryButton: function () { var r = retryRect(); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },
    cell: function (i) { var c = cellRect(i); return { x: c.x + c.w / 2, y: c.y + c.h / 2 }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var n = 0; n < 8 && state === S.PLAY; n++) {
        if (!await r.until(function () { return phase === "choose" || phase === "bingo" || phase === "error"; }, 15)) throw Error("記事が来ない");
        if (phase !== "choose") break;
        await r.wait(900);
        choose(Math.floor(Math.random() * 3));
        if (!await r.until(function () { return phase !== "fetch" && phase !== "stream"; }, 60)) throw Error("流れ終わらない");
      }
      await r.until(function () { return state === S.RESULT; }, 5);
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(true); });

  /* 開始前はカードだけ見せる（通信はSTARTを押してから） */
  state = S.INTRO; phase = "intro"; round = 0; score = 0; text = ""; hits = []; lines = []; article = null; pt = 0; T = 0;
  card = shuffle(WORDS.slice()).slice(0, 25); card[12] = null;
  open = []; openT = []; for (var i0 = 0; i0 < 25; i0++) { open.push(i0 === 12); openT.push(i0 === 12 ? 9 : -1); }
  startButton.hidden = false;
  layout();
  var lastT = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
