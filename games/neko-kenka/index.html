<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #0b1230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
<!-- ゲームのOGP：道具で更新 -->

<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>

<script src="../random-bowling/vendor/three.min.js"></script>
<script src="cat3d.js"></script>
<script>
/* キャットファイター
   押しているあいだ自分の猫が唸る。指の高さが声の高さ。
   声を上下に揺らすほど迫力が出て、相手を押し返す。息が切れたら離して吸う。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, MASTER = null, VOICES = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6;
    MASTER = AC.createGain(); MASTER.gain.value = 0.9;
    MASTER.connect(comp); comp.connect(AC.destination);
    VOICES = { me: makeVoice(-0.35), foe: makeVoice(0.35) };
    VOICES.me.trait(ME_VOICE); if (foe && foe.vc) VOICES.foe.trait(foe.vc);
  }

  /* 猫の声。のこぎり波2本を少しずらして濁らせ、
     口の開きで2つの共鳴（「ウ」→「ア」）を動かす。
     低いところでは細かく震わせて「ゥゥゥ」と唸らせる。 */
  function makeVoice(pan) {
    var o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = "sawtooth";
    o2.detune.value = 16;
    var vib = AC.createOscillator(), vibG = AC.createGain();
    vib.frequency.value = 4.3; vibG.gain.value = 0;
    vib.connect(vibG); vibG.connect(o1.frequency); vibG.connect(o2.frequency);
    var src = AC.createGain(); src.gain.value = 0.5;
    o1.connect(src); o2.connect(src);
    var am = AC.createGain(); am.gain.value = 1;
    var gr = AC.createOscillator(), grG = AC.createGain();
    gr.frequency.value = 31; grG.gain.value = 0;
    gr.connect(grG); grG.connect(am.gain);
    src.connect(am);
    var env = AC.createGain(); env.gain.value = 0;
    function band(f, q, v) {
      var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      var g = AC.createGain(); g.gain.value = v;
      am.connect(bp); bp.connect(g); g.connect(env);
      return bp;
    }
    var f1 = band(900, 5, 1.4), f2 = band(2200, 6, 1.0), f3 = band(4000, 3, 0.3);
    var out = env;
    if (AC.createStereoPanner) { var p = AC.createStereoPanner(); p.pan.value = pan; env.connect(p); out = p; }
    out.connect(MASTER);
    [o1, o2, vib, gr].forEach(function (o) { o.start(); });
    var fm = 1, vd = 0.035;
    return {
      /* 個体ごとの声のくせ：響きの高さ・揺れの速さと深さ・ざらつき */
      trait: function (t) {
        fm = t.fm; vd = t.vd;
        vib.frequency.value = t.vr; o2.detune.value = t.dt;
      },
      set: function (f0, open, vol, growl) {
        var n = AC.currentTime, k = 0.03;
        o1.frequency.setTargetAtTime(f0, n, k);
        o2.frequency.setTargetAtTime(f0, n, k);
        vibG.gain.setTargetAtTime(f0 * vd, n, 0.1);
        f1.frequency.setTargetAtTime((600 + 900 * open) * fm, n, 0.06);
        f2.frequency.setTargetAtTime((1500 + 1700 * open) * fm, n, 0.06);
        grG.gain.setTargetAtTime(growl * 0.5, n, 0.05);
        am.gain.setTargetAtTime(1 - growl * 0.5, n, 0.05);
        env.gain.setTargetAtTime(vol, n, vol > 0 ? 0.05 : 0.11);
      }
    };
  }
  function noiseHit(dur, freq, vol, q, type) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = type || "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(MASTER);
    s.start(n); s.stop(n + dur + 0.05);
  }
  function hiss() { noiseHit(0.7, 3800, 0.5, 0.8, "highpass"); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* 声の高さ（0〜1）を周波数に */
  var ME_BASE = 270;   /* = ME_VOICE.base */
  function hz(p, base) { return base * Math.pow(2, p * 1.7); }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false, cleared = false;
  var CLEAR_N = 5;   /* 5匹追い払えば地域最強 */
  var phase, phaseT, bal, winner, dbgEnd = 0, aim, me, foe, level, trail;
  var COLORS = [
    { body: "#8c8d96", eye: "#7fd0ff", line: "#c9ccd8" },
    { body: "#efeae0", eye: "#6fd0a8", line: "#efeae0" },
    { body: "#26262c", eye: "#e8e04a", line: "#b9b7c6" },
    { body: "#6b5240", eye: "#f2b84a", line: "#c8a080" },
    { body: "#3c3f58", eye: "#ff7a6a", line: "#9aa0d0" }
  ];
  /* 声のくせ。base 高さ / fm 響き / vr・vd 揺れの速さ・深さ / dt ざらつき / wb うねりの速さ */
  var ME_VOICE = { base: 270, fm: 1, vr: 4.3, vd: 0.035, dt: 16, wb: 1 };
  var FOE_VOICES = [
    { base: 250, fm: 0.95, vr: 3.6, vd: 0.03, dt: 12, wb: 0.8 },   /* 灰：落ち着いた中くらい */
    { base: 320, fm: 1.15, vr: 5.6, vd: 0.045, dt: 10, wb: 1.4 },  /* 白：高くてよく震える */
    { base: 215, fm: 0.85, vr: 3.0, vd: 0.025, dt: 28, wb: 0.7 },  /* 黒：低くて太く、ざらつく */
    { base: 285, fm: 1.05, vr: 6.5, vd: 0.06, dt: 18, wb: 1.8 },   /* 茶：せわしなく大きく揺れる */
    { base: 240, fm: 0.9, vr: 4.0, vd: 0.04, dt: 22, wb: 1.1 }     /* 紺：低めでうねる */
  ];
  var ME_COLOR = { body: "#e2883c", eye: "#8fe07a", line: "#ffb36b" };

  var WALL, TR0, TR1;
  function place() {
    WALL = Math.round(H * 0.5);
    TR0 = WALL + 70;                           /* 声の枠（ここだけで声の高さを動かす） */
    TR1 = H - 30;
  }

  function cat() {
    return { p: 0.3, sp: 0.3, th: -Math.PI / 2, goal: -Math.PI / 2, on: false, open: 0, onT: 0, x: 0, run: 0, jit: 0, jitT: 0 };
  }
  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; cleared = false; fanId++;
    T = 0;
    held = false;
    level = 0;
    me = cat();
    aim = -Math.PI / 2; me.th = aim;
    trail = [];
    nextFoe();
  }
  function nextFoe() {
    foe = cat();
    foe.color = COLORS[level % COLORS.length];
    foe.vc = FOE_VOICES[level % FOE_VOICES.length]; foe.base = foe.vc.base;
    if (VOICES) VOICES.foe.trait(foe.vc);
    foe.mode = "rest"; foe.rest = 0.6; foe.p = 0.3;
    foe.x = 395;
    phase = "enter"; phaseT = 0;
    bal = 0;
    me.run = 0;
  }

  /* 相手の一声 */
  function foePhrase() {
    foe.dur = 2.5 + Math.random() * 2.5;
    foe.lose = 0; foe.think = 0;
    foe.t = 0; foe.on = true; foe.onT = 0; foe.mode = "yowl";
  }

  /* 三角じゃんけん：三角形の角が 高い声・中くらい・低い唸り。
     指の向きで三角形のふちを回る。時計回りに 高→中→低→高 の順で、前の角が次の角に勝つ。
     角と角の間もなめらかにつながっていて、相手より 1/3 周 手前にいるほど強い。 */
  var TAU = Math.PI * 2, THIRD = TAU / 3;
  var CORNERS = [-Math.PI / 2, -Math.PI / 2 + THIRD, -Math.PI / 2 + 2 * THIRD];   /* 高・中・低 */
  var CORNER_COLORS = ["#ff5a5a", "#f2c14a", "#4aa8ff"];
  var CORNER_P = [0.9, 0.5, 0.15];
  function wrapA(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
  function pitchOf(th) {
    var t = ((th + Math.PI / 2) % TAU + TAU) % TAU / THIRD, k = Math.floor(t) % 3, f = t - Math.floor(t);
    return CORNER_P[k] + (CORNER_P[(k + 1) % 3] - CORNER_P[k]) * f;
  }
  function judge(a, b) { return Math.sin(b - a); }       /* 自分a・相手b。正なら自分が押す */
  function turn(from, to, max) { var d = wrapA(to - from); return from + Math.max(-max, Math.min(max, d)); }
  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    phaseT += dt;

    /* 自分の声 */
    var want = held && (phase === "fight" || phase === "enter");
    if (want && !me.on) me.onT = 0;
    me.on = want;
    /* つまみは一瞬では飛ばず、決まった速さで三角形のふちを回る */
    me.th = wrapA(turn(me.th, aim, dt * 4.5));
    me.sp = pitchOf(me.th);
    if (me.on) me.onT += dt;

    /* 相手の声 */
    if (phase === "fight") {
      /* 最後の1匹（地域最強の前）だけ少し強い */
      var dl = level + (level === CLEAR_N - 1 ? 1.5 : 0);
      if (foe.mode === "yowl") {
        foe.t += dt; foe.onT += dt;
        /* 押されていると少し遅れて回り込む。強い相手ほど速く、こちらに勝つ位置を狙いやすい */
        foe.think -= dt;
        if (me.on && judge(me.th, foe.th) > 0.3) foe.lose += dt; else foe.lose = 0;
        if (foe.lose > Math.max(0.25, 0.8 - 0.06 * dl) || foe.think <= 0) {
          foe.lose = 0; foe.think = 0.9 + Math.random() * 1.4;
          foe.chase = me.on && Math.random() < Math.min(0.85, 0.35 + 0.1 * dl);
          if (!foe.chase) foe.goal = CORNERS[Math.floor(Math.random() * 3)];
        }
        /* 追いかけるときは、少し遅れて見たこちらの位置の 1/3 周手前を狙い続ける */
        foe.seen = wrapA((foe.seen == null ? me.th : foe.seen) + wrapA(me.th - (foe.seen == null ? me.th : foe.seen)) * Math.min(1, dt * Math.min(8, 2.5 + 0.5 * dl)));
        if (foe.chase) foe.goal = foe.seen - THIRD;
        foe.th = wrapA(turn(foe.th, foe.goal + 0.15 * Math.sin(foe.t * 2.6), dt * Math.min(5, 2.2 + 0.35 * dl)));
        foe.sp = pitchOf(foe.th);
        if (foe.t >= foe.dur) { foe.on = false; foe.mode = "rest"; foe.rest = Math.max(0.25, 0.9 - dl * 0.08) * (0.6 + Math.random() * 0.8); }
      } else {
        foe.rest -= dt;
        if (foe.rest <= 0) foePhrase();
      }

      /* 勝っている段の側が押す。黙っている間は押される */
      if (me.on && foe.on) { var j = judge(me.th, foe.th); bal += dt * 0.35 * j * (j < 0 ? 1 + 0.12 * dl : 1); }
      else if (me.on) bal += dt * 0.15;
      else if (foe.on) bal -= dt * 0.25;
      if (dbgEnd) { bal = dbgEnd; dbgEnd = 0; }
      /* 決着したら、まず取っ組み合い */
      if (bal >= 1 || bal <= -1) { winner = bal > 0 ? "me" : "foe"; bal = bal > 0 ? 1 : -1; phase = "brawl"; phaseT = 0; foe.on = false; me.on = false; hiss(); }
    } else if (phase === "brawl") {
      if (phaseT > 1.7) {
        phaseT = 0;
        if (winner === "me") { phase = "win"; screech(VOICES && VOICES.foe, foe.base); }
        else { phase = "lose"; screech(VOICES && VOICES.me, ME_BASE); }
      }
    } else if (phase === "enter") {
      foe.x = 395 + Math.max(0, 1 - phaseT / 1.1) * 260;
      if (phaseT > 1.1 && !foe.hissed) { foe.hissed = true; hiss(); }
      if (phaseT > 1.6) { phase = "fight"; phaseT = 0; foe.mode = "rest"; foe.rest = 0.4; }
    } else if (phase === "win") {
      foe.run = phaseT;
      if (phaseT > 1.4) { score++; level++; if (score >= CLEAR_N) { cleared = true; state = S.RESULT; celebrate(); } else nextFoe(); }
    } else if (phase === "lose") {
      me.run = phaseT;
      if (phaseT > 1.4) { state = S.RESULT; }
    }

    /* 口の開き：鳴きはじめは閉じた「ウ」から開いていく */
    [me, foe].forEach(function (c) {
      var target = c.on ? Math.min(1, c.onT / 0.35) * (0.35 + 0.65 * c.sp) : 0;
      c.open += (target - c.open) * Math.min(1, dt * 12);
      c.jitT -= dt;
      if (c.jitT <= 0) { c.jitT = 0.06 + Math.random() * 0.1; c.jitGoal = (Math.random() * 2 - 1) * 0.02; }
      c.jit += ((c.jitGoal || 0) - c.jit) * Math.min(1, dt * 10);
    });

    trail.push([me.on ? me.th : null, foe.on ? foe.th : null]);
    if (trail.length > 30) trail.shift();

    sound();
  }

  var brawlT = 0;
  function sound() {
    if (!VOICES) return;
    if (state !== S.PLAY) { VOICES.me.set(200, 0, 0, 0); VOICES.foe.set(200, 0, 0, 0); return; }
    if (phase === "brawl") {
      /* 取っ組み合い中は、2匹とも裏返った声でギャーギャー鳴き続ける */
      brawlT = (brawlT || 0) - 1 / 60;
      if (brawlT <= 0) {
        brawlT = 0.06 + Math.random() * 0.1;
        VOICES.me.set(hz(0.5 + Math.random() * 0.7, ME_BASE), 0.6 + Math.random() * 0.4, 0.45, Math.random() * 0.5);
        VOICES.foe.set(hz(0.5 + Math.random() * 0.7, foe.base), 0.6 + Math.random() * 0.4, 0.45, Math.random() * 0.5);
        if (Math.random() < 0.5) noiseHit(0.12, 800 + Math.random() * 2500, 0.35, 0.8);
      }
      return;
    }
    voice(VOICES.me, me, ME_BASE);
    voice(VOICES.foe, foe, foe.base);
  }
  function voice(v, c, base) {
    if (c.screamT != null) return;
    /* 鳴き終わりは「ォゥ」と下がりながら消える */
    if (!c.on) { v.set(hz(c.sp, base) * 0.72, c.open, 0, 0); return; }
    var g = Math.pow(1 - c.sp, 2) * 0.7;
    /* 鳴きはじめは低い「ンア」からしゃくり上げ、のばす間はうねうねと揺れる */
    var rise = 0.72 + 0.28 * Math.min(1, c.onT / 0.32);
    var w = (c.vc || ME_VOICE).wb, wob = 1 + 0.03 * Math.sin(c.onT * 2.3 * w) + 0.018 * Math.sin(c.onT * 5.1 * w + 1);
    v.set(hz(c.sp, base) * rise * wob * (1 + c.jit), c.open, 0.5, g);
  }
  /* 地域最強：ニャーの声でファンファーレと紙吹雪 */
  var confetti = [], confLast = 0, fanId = 0;
  function celebrate() {
    confetti = [];
    var cols = ["#ff5a5a", "#f2c14a", "#4aa8ff", "#8fe07a", "#ffffff", "#e2883c"];
    for (var i = 0; i < 140; i++) {
      confetti.push({ x: Math.random() * W, y: -Math.random() * H * 0.9 - 20, vx: (Math.random() - 0.5) * 60, vy: 120 + Math.random() * 160,
        a: Math.random() * TAU, va: (Math.random() - 0.5) * 12, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, c: cols[i % cols.length], ph: Math.random() * TAU });
    }
    confLast = performance.now();
    if (!VOICES) return;
    var v = VOICES.me, v2 = VOICES.foe;
    v2.trait(ME_VOICE);
    /* ソドミ ソーー ミ ソーーーン と駆け上がるだけの自作の節 */
    var notes = [[0, 392, 0.12], [0.14, 523, 0.12], [0.28, 659, 0.12], [0.42, 784, 0.38], [0.88, 659, 0.13], [1.04, 784, 1.0]];
    var id = ++fanId;
    notes.forEach(function (n) {
      setTimeout(function () { if (id !== fanId || state !== S.RESULT) return; meow(v, n[1], n[2]); meow(v2, n[1] * 0.75, n[2]); }, n[0] * 1000);
    });
  }
  function meow(v, f, dur) {
    v.set(f * 0.8, 0.25, 0.5, 0);
    setTimeout(function () { v.set(f, 1, 0.55, 0); }, 45);
    setTimeout(function () { v.set(f * 0.8, 0.3, 0, 0); }, dur * 1000);
  }
  function drawConfetti() {
    var now = performance.now(), dt = Math.min(0.05, (now - confLast) / 1000);
    confLast = now;
    confetti.forEach(function (p) {
      p.ph += dt * 3; p.x += (p.vx + Math.sin(p.ph) * 40) * dt; p.y += p.vy * dt; p.a += p.va * dt;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, Math.cos(p.ph * 1.7));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
  }
  /* 負けた側の「ギャッ」 */
  function screech(v, base) {
    if (!v) return;
    var c = v === VOICES.me ? me : foe;
    c.screamT = 0;
    v.set(hz(1.1, base), 1, 0.75, 0);
    hiss();

    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    if (cleared) drawConfetti();
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = cleared ? "800 92px sans-serif" : "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(cleared ? zT("地域最強", "Top Cat") : String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { threeD: !!scene3d, state: state, score: score, phase: phase, bal: bal, foeOn: foe.on, foeP: foe.sp, foeTh: foe.th, meTh: me.th, level: level, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 40)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    /* 描画が重くて間が空いても、ゲームの時間は実際の時間どおり進める（遅い端末でスローにならない）。
       タブを離れたあとの大きな空白だけは切り捨てる */
    var dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var s = Math.min(1 / 60, dt); update(s); dt -= s; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
