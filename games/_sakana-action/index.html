<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>サカナアクション</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #7cc8ef; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* サカナアクション

   陸に上がった魚を、引っぱって離した量だけ跳ねさせ、右の海まで運ぶ。
   魚は点と棒でできていて、跳ねるたびに体をくねらせる。
   結果は跳ねた回数。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  var Z = 0.62;                                 /* 世界を縮めて見せる倍率 */
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  function sSlap(v) { noiseHit(0.06, 1400, Math.min(0.5, 0.08 + v / 3000), 1.4); noiseHit(0.05, 500, Math.min(0.3, v / 4000), 1, 0.01); }
  function sJump(p) { tone(260 + p * 300, 0.12, 0.09, "sine", 520 + p * 500); noiseHit(0.05, 2200, 0.15, 2); }
  function sPull(p) { tone(180 + p * 260, 0.03, 0.025, "triangle"); }
  function sSplash() { noiseHit(0.5, 900, 0.5, 0.6); noiseHit(0.3, 2600, 0.25, 1, 0.05); [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 0.12, "triangle", null, 0.25 + i * 0.11); }); }
  function sSplashSmall() { noiseHit(0.25, 1100, 0.25, 0.8); }
  function sFall() { tone(500, 0.5, 0.1, "sine", 120); }
  function sBird() { tone(1300, 0.09, 0.08, "sawtooth", 900); tone(1250, 0.12, 0.07, "sawtooth", 800, 0.13); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 面 ============
     1マス48。列ごとの地面の高さ（下から何マス、0は穴）。右の端は海。 */
  var T = 48, R = 24, COLS = 0;
  var solid = [], seaX = 0, seaY = 0, startX = 0, startY = 0;
  /* 地面の種類（いちばん上のマスだけ変わる） */
  var SAND = 1, ICE = 3, CONV_R = 4, CONV_L = 5;
  var pools = [], fans = [], plats = [];
  function build() {
    var c = 0, hs = [], ts = [];
    function g(len, h, type) { for (var i = 0; i < len; i++) { ts[c] = type || SAND; hs[c++] = h; } }
    /* 水たまり：c0〜c1列、下から h マスの高さまで水 */
    function pool(c0, c1, h) { pools.push({ x0: c0 * T, x1: c1 * T, y: (R - h) * T }); }
    /* 送風機：c0〜c1列の穴の底から上向きの風 */
    function fan(c0, c1, top) { fans.push({ x0: c0 * T, x1: c1 * T, y0: (R - top) * T, y1: R * T }); }
    /* 動く足場：中心(col, h)、幅 w マス、左右 ax・上下 ay マス、周期 per 秒 */
    function plat(col, h, w, ax, ay, per, ph) { plats.push({ bx: col * T, by: (R - h) * T, w: w * T, h: 22, ax: ax * T, ay: ay * T, per: per, ph: ph || 0, x: 0, y: 0, dx: 0, dy: 0 }); }
    pools = []; fans = []; plats = [];

    /* はじまり：段差と穴 */
    g(10, 4); g(4, 6); g(2, 0); g(6, 6); g(3, 9); g(6, 9); g(3, 0); g(5, 5);
    /* 高い段へ */
    g(2, 5); g(4, 7); g(7, 10);
    /* 氷：すべって止まらない */
    g(9, 10, ICE); g(2, 0); g(3, 8, ICE); g(5, 8);
    /* 向かい風のベルトコンベア */
    g(10, 8, CONV_L); g(2, 10); g(4, 10);
    /* 段と穴 */
    g(2, 0); g(5, 11);
    /* 送風機：広い穴を風に乗って越える */
    var f0 = c; g(9, 0); fan(f0 + 1, f0 + 8, 17); g(5, 13);
    /* 動く足場 */
    var m0 = c; g(16, 0);
    plat(m0 + 4, 12, 2, 2, 0, 3.2); plat(m0 + 11, 13, 2, 0, 3, 2.6, 1.5);
    g(5, 12);
    /* 追い風のベルトと飛び石 */
    g(8, 12, CONV_R); g(2, 0); g(3, 12); g(2, 0); g(3, 13); g(6, 14);
    /* 小さな足場を渡って下りる */
    g(2, 0); g(3, 11); g(2, 0); g(3, 10, ICE); g(2, 0); g(3, 9); g(2, 0);
    g(9, 8);
    seaX = c * T;
    g(16, 0);
    COLS = c;
    solid = [];
    for (var x = 0; x < COLS; x++) {
      solid[x] = [];
      for (var y = 0; y < R; y++) solid[x][y] = hs[x] > 0 && y >= R - hs[x] ? (y === R - hs[x] ? ts[x] : SAND) : 0;
    }
    seaY = (R - 6) * T;
    startX = 4 * T; startY = (R - 4) * T;
    movePlats(0);
  }
  function movePlats(t) {
    plats.forEach(function (p) {
      var a = Math.sin((t + p.ph) / p.per * Math.PI * 2);
      var nx = p.bx - p.w / 2 + p.ax * a, ny = p.by + p.ay * a;
      if (p.x || p.y) { p.dx = nx - p.x; p.dy = ny - p.y; }
      p.x = nx; p.y = ny;
    });
  }
  function inWater(x, y) {
    if (x > seaX && y > seaY) return true;
    for (var i = 0; i < pools.length; i++) { var w = pools[i]; if (x > w.x0 && x < w.x1 && y > w.y) return true; }
    return false;
  }
  function isSolid(col, row) {
    if (col < 0) return true;
    if (col >= COLS || row < 0 || row >= R) return 0;
    return solid[col][row];
  }

  /* ============ 魚 ============
     頭から尾まで8つの点。となり同士の棒と、ひとつ飛ばしの棒（しなる背骨）でつなぐ。 */
  var N = 8, SEG = 18;
  var RAD = 13;                                /* 体の厚みの半分。地面からこれだけ浮かせる */
  var WIDTH = [10, 16, 18, 17, 14, 10, 6, 3];       /* 体の太さ（半分） */
  var F = [], links = [];
  function fishAt(x, y, d) {
    F = [];
    for (var i = 0; i < N; i++) {
      var px = x + d * (SEG * (N - 1) / 2 - i * SEG);
      F.push({ x: px, y: y - 12, px: px, py: y - 12, ground: false, plat: null });
    }
    links = [];
    for (i = 0; i < N - 1; i++) links.push({ a: i, b: i + 1, len: SEG, k: 1 });
    for (i = 0; i < N - 2; i++) links.push({ a: i, b: i + 2, len: SEG * 2 * 0.985, k: 0.32 });
    for (i = 0; i < N - 3; i++) links.push({ a: i, b: i + 3, len: SEG * 3 * 0.97, k: 0.14 });
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var state, T0, endT, jumps, keyMode = false;
  var camX = 0, camY = 0;
  var drag = null;                             /* 引っぱり中 {x0,y0,x,y} 画面座標 */
  var wasWet = false, swimT = 0;
  var restT, flopT, onGround, safe, bend, splashes, lastPullStep;
  var keyCharge = -1, keyDir = 1;
  var bird = null;                             /* 画面の上の隅で待ち、ときどき弧を描いて襲ってくる鳥 */

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    build();
    state = S.PLAY;
    T0 = 0; endT = 0; jumps = 0;
    fishAt(startX, startY, 1);
    safe = { x: startX, y: startY };
    restT = 0; flopT = 0.8; onGround = false; bend = 0; splashes = [];
    drag = null; keyCharge = -1;
    camX = startX - W / Z * 0.4; camY = startY - H / Z * 0.55;
    bird = { mode: "away", side: 1, wait: 3, t: 0, x: 0, y: 0, face: -1 };
  }

  /* 引っぱり量（0〜1）と、跳ぶ向き */
  var PULL_MAX = 210;                          /* 画面上でこれだけ引くと最大 */
  function pullVec() {
    var dx, dy;
    if (drag) { dx = drag.x0 - drag.x; dy = drag.y0 - drag.y; }
    else if (keyCharge >= 0) { var a = keyDir > 0 ? -0.95 : Math.PI + 0.95; dx = Math.cos(a) * keyCharge * PULL_MAX; dy = Math.sin(a) * keyCharge * PULL_MAX; }
    else return null;
    var L = Math.hypot(dx, dy);
    if (L < 12) return { p: 0, ux: 0, uy: 0 };
    var p = Math.min(1, L / PULL_MAX);
    return { p: p, ux: dx / L, uy: dy / L };
  }
  function canJump() { return state === S.PLAY && onGround && bird.mode !== "carry"; }
  function launch() {
    var v = pullVec();
    if (!v || v.p < 0.06 || !canJump()) return;
    var sp = 200 + 720 * v.p;
    var vx = v.ux * sp, vy = v.uy * sp;
    /* 横に大きく跳んで仕掛けを飛ばさないよう、横の速さには上限を付ける（高さは変えない） */
    vx = Math.max(-300, Math.min(300, vx));
    /* 体を弓なりにひと振りする：頭と尾を同じ側へ、胴を反対側へ（S字にならないように） */
    var head = F[0], tail = F[N - 1];
    var ax = tail.x - head.x, ay = tail.y - head.y, al = Math.hypot(ax, ay) || 1;
    var nx = -ay / al, ny = ax / al;
    if (nx * vx + ny * vy < 0) { nx = -nx; ny = -ny; }   /* 跳ぶ向きの側へ反らす */
    var dt = 1 / 60;
    for (var i = 0; i < N; i++) {
      var p = F[i], t = i / (N - 1);
      var c = 4 * (t - 0.5) * (t - 0.5) - 0.34;          /* 両端は +、まんなかは − */
      var bx = vx - nx * c * 260, by = vy - ny * c * 260;
      p.px = p.x - bx * dt;
      p.py = p.y - by * dt;
    }
    bend = 1; swimT = 0.4;
    jumps++;
    onGround = false; restT = 0;
    sJump(v.p);
  }

  /* ============ 進行 ============ */
  var G = 2000;
  function update(dt) {
    if (state === S.INTRO || state === S.RESULT) { stepFish(dt); return; }
    T0 += dt;
    if (state === S.GOAL) {
      endT += dt;
      if (endT > 1.6) { state = S.RESULT; shareButton.hidden = false; }
    }
    if (keyCharge >= 0) {
      keyCharge = Math.min(1, keyCharge + dt * 0.9);
    }
    var v = pullVec();
    if (v && v.p > 0) {
      var st = Math.floor(v.p * 10);
      if (st !== lastPullStep) { lastPullStep = st; sPull(v.p); }
    } else lastPullStep = -1;

    if (bird.mode === "carry") { updateBird(dt); return; }
    stepFish(dt);
    updateBird(dt);

    /* 地面でじっとしているとき、ときどきぴちぴち跳ねる */
    if (onGround && state === S.PLAY && !drag && keyCharge < 0) {
      flopT -= dt;
      if (flopT <= 0) {
        flopT = 0.9 + Math.random() * 1.3;
        var side = Math.random() < 0.5 ? -1 : 1, kick = 70 + Math.random() * 90;
        for (var i = 0; i < N; i++) {
          var t = Math.abs(i / (N - 1) - 0.5) * 2;
          F[i].py += (kick * (0.3 + t)) / 60;
          F[i].px -= side * (i / (N - 1) - 0.5) * 60 / 60;
        }
        sSlap(200);
      }
    }

    /* 落ちたら最後に止まった場所へ戻す */
    var cx = center();
    if (state === S.PLAY && cx.y > R * T + 200) {
      sFall();
      fishAt(safe.x, safe.y, 1);
    }
    /* 海へ */
    if (state === S.PLAY && cx.x > seaX + T && cx.y > seaY - 10) {
      state = S.GOAL; endT = 0; sSplash();
      for (i = 0; i < 26; i++) splashes.push({ x: cx.x + (Math.random() - 0.5) * 60, y: seaY, vx: (Math.random() - 0.5) * 400, vy: -250 - Math.random() * 500, t: 1 });
    }
    splashes = splashes.filter(function (s) { s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 1400 * dt; return s.t > 0; });

    var vw = W / Z, vh = H / Z;
    /* 魚を画面の中央やや左に保つ */
    var tx = cx.x - vw * 0.4, ty = cx.y - vh * 0.55;
    camX += (tx - camX) * Math.min(1, dt * 7);
    camY += (ty - camY) * Math.min(1, dt * 7);
  }
  /* 鳥：マリオ3の太陽のように、画面の上の隅で待っては、魚めがけて弧を描いて飛び抜ける。
     つかまると連れ去られ、最後に止まった場所へ戻される */
  var SWOOP_T = 1.5;                           /* 端から端まで弧を描く秒数 */
  var CARRY_V = 700;
  var WARN_T = 1.0;                            /* 襲う前に震える秒数 */
  function birdAnchor(side) { return { x: camX + W / Z * (0.5 + side * 0.36), y: camY + H / Z * 0.14 }; }
  function bez(a, c, b, t) { var u = 1 - t; return u * u * a + 2 * u * t * c + t * t * b; }
  function updateBird(dt) {
    var b = bird, c = center(), i, k;
    b.t += dt;
    if (b.mode === "away") {
      /* コースの1/3を過ぎたら、右上の外から入ってくる */
      if (state !== S.PLAY || c.x < seaX / 3) return;
      b.mode = "back"; b.x = camX + W / Z + 150; b.y = camY + 40;
    }
    if (b.mode === "back" || b.mode === "hover") {
      /* 隅へ戻って、ふわふわ待つ */
      var A = birdAnchor(b.side);
      k = Math.min(1, dt * (b.mode === "back" ? 3 : 8));
      b.x += (A.x + Math.cos(b.t * 2) * 6 - b.x) * k;
      b.y += (A.y + Math.sin(b.t * 3) * 6 - b.y) * k;
      if (Math.hypot(A.x - b.x, A.y - b.y) < 40) b.mode = "hover";
      b.face = c.x > b.x ? 1 : -1;
      if (state === S.PLAY && b.mode === "hover") {
        if (b.wait > WARN_T && b.wait - dt <= WARN_T) for (var r = 0; r < 6; r++) noiseHit(0.05, 1800, 0.12, 2, r * 0.13);   /* ばたばた */
        b.wait -= dt;
      }
      if (state === S.PLAY && b.mode === "hover" && b.wait <= 0) {
        /* 魚のいる所を通って、反対の隅へ */
        var P = { x: c.x, y: c.y - 40 }, S0 = { x: b.x, y: b.y };
        var E = { x: P.x + (P.x - S0.x), y: S0.y };
        b.mode = "swoop"; b.st = 0; b.S = S0; b.E = E;
        b.C = { x: 2 * P.x - (S0.x + E.x) / 2, y: 2 * P.y - (S0.y + E.y) / 2 };
        b.face = E.x > S0.x ? 1 : -1;
        sBird();
      }
      return;
    }
    if (b.mode === "swoop") {
      b.st += dt / SWOOP_T;
      var t = Math.min(1, b.st);
      b.x = bez(b.S.x, b.C.x, b.E.x, t); b.y = bez(b.S.y, b.C.y, b.E.y, t);
      if (state === S.PLAY && Math.hypot(c.x - b.x, c.y - (b.y + 40)) < 44) {
        b.mode = "carry"; b.ct = 0; sBird();
        drag = null; keyCharge = -1;
        return;
      }
      if (t >= 1) { b.mode = "back"; b.side = b.face; b.wait = 3.5 + Math.random() * 2; }
      return;
    }
    /* つかんだまま、飛んできた向きへ上がりながら連れ去る */
    b.ct += dt;
    var mx = b.face * CARRY_V * dt, my = -240 * dt;
    b.x += mx; b.y += my;
    var hx = b.x, hy = b.y + 46, d = F[0].x >= F[N - 1].x ? -1 : 1;   /* 魚の向きはそのまま */
    for (i = 0; i < N; i++) {
      var tx = hx + d * (i - 3.5) * SEG * 0.95, ty = hy + Math.sin(b.t * 9 + i * 0.6) * 5;
      F[i].x += (tx - F[i].x) * 0.35 + mx * 0.65; F[i].y += (ty - F[i].y) * 0.35 + my * 0.65;
      F[i].px = F[i].x; F[i].py = F[i].y;
    }
    var vw = W / Z;
    if (b.x < camX - 260 || b.x > camX + vw + 260 || b.ct > 3) {
      fishAt(safe.x, safe.y, 1);
      restT = 0; onGround = false;
      var s = center(); camX = s.x - vw * 0.4; camY = s.y - H / Z * 0.55;
      b.mode = "back"; b.side = b.face; b.wait = 4 + Math.random() * 2;
      b.x = camX + vw * (0.5 + b.side * 0.75); b.y = camY + 40;
    }
  }
  function drawBird() {
    if (!bird) return;
    if (bird.mode === "away") return;
    var b = bird, warn = b.mode === "hover" && b.wait < WARN_T;
    var fl = warn ? 0.9 : Math.sin(b.t * (b.mode === "hover" ? 12 : 26));
    ctx.save();
    ctx.translate(b.x, b.y);
    if (warn) {
      /* 来る直前は全身をぶるぶる震わせて、少しふくらむ */
      ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
      ctx.rotate((Math.random() - 0.5) * 0.35);
      var sw = 1 + 0.15 * Math.min(1, (WARN_T - b.wait) / 0.3);
      ctx.scale(sw, sw);
    }
    ctx.scale(1.8 * b.face, 1.8);
    ctx.fillStyle = "#3b3530"; ctx.strokeStyle = "#3b3530"; ctx.lineCap = "round"; ctx.lineJoin = "round";

  }

  /* アジ。背は青みがかった灰色、腹は銀、ひれは黄みがかった半透明、側線にぜいご、大きな目 */
  var FIN = "rgba(206,190,120,.82)", FIN_EDGE = "#7d6f3c", EDGE = "#22323d";
  function drawFish() {
    var L = [], Rt = [], C = [], i;
    for (i = 0; i < N; i++) {
      var a = F[Math.max(0, i - 1)], b = F[Math.min(N - 1, i + 1)];
      var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      var nx = -dy / d, ny = dx / d, w = WIDTH[i];
      L.push([F[i].x + nx * w, F[i].y + ny * w]);
      Rt.push([F[i].x - nx * w, F[i].y - ny * w]);
      C.push([nx, ny, dx / d, dy / d]);          /* 背の向きと、頭→尾の向き */
    }
    function at(k, side, out) {                  /* k番目の点から背(+)・腹(-)へ out だけ */
      var w = WIDTH[k] * side + out * side;
      return [F[k].x + C[k][0] * w, F[k].y + C[k][1] * w];
    }
    function back(k, t) { return [F[k].x * (1 - t) + F[k + 1].x * t, F[k].y * (1 - t) + F[k + 1].y * t]; }
    /* ひれ：体の縁 p0〜p1 から外へ out、尾の側へ sweep 寄せる */
    function fin(k0, k1, side, out, sweep, rays) {
      var p0 = at(k0, side, 0), p1 = at(k1, side, 0), km = Math.round((k0 + k1) / 2);
      var o = [C[km][0] * side * out + C[km][2] * sweep, C[km][1] * side * out + C[km][3] * sweep];
      var tip = [p0[0] + o[0], p0[1] + o[1]], tip2 = [p1[0] + o[0] * 0.35, p1[1] + o[1] * 0.35];
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(tip[0], tip[1]);
      ctx.quadraticCurveTo((tip[0] + tip2[0]) / 2 - o[0] * 0.15, (tip[1] + tip2[1]) / 2 - o[1] * 0.15, tip2[0], tip2[1]);
      ctx.lineTo(p1[0], p1[1]); ctx.closePath();
      ctx.fillStyle = FIN; ctx.fill(); ctx.strokeStyle = FIN_EDGE; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.strokeStyle = "rgba(125,111,60,.55)"; ctx.lineWidth = 0.9;
      for (var r = 1; r < rays; r++) {
        var t = r / rays, bx = p0[0] + (p1[0] - p0[0]) * t, by = p0[1] + (p1[1] - p0[1]) * t;
        var ex = tip[0] + (tip2[0] - tip[0]) * t, ey = tip[1] + (tip2[1] - tip[1]) * t;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + (ex - bx) * 0.85, by + (ey - by) * 0.85); ctx.stroke();
      }
    }
    /* 尾びれ（深い二股） */
    var tl = F[N - 1], ux = C[N - 1][2], uy = C[N - 1][3], nx2 = C[N - 1][0], ny2 = C[N - 1][1];
    function tp(u, v) { return [tl.x + ux * u + nx2 * v, tl.y + uy * u + ny2 * v]; }
    var t1 = tp(30, 24), t2 = tp(12, 2), t3 = tp(30, -24), t0 = tp(-2, 0);
    ctx.beginPath(); ctx.moveTo(t0[0], t0[1]);
    var q1 = tp(14, 16), q2 = tp(14, -16);
    ctx.quadraticCurveTo(q1[0], q1[1], t1[0], t1[1]); ctx.lineTo(t2[0], t2[1]); ctx.lineTo(t3[0], t3[1]);
    ctx.quadraticCurveTo(q2[0], q2[1], t0[0], t0[1]); ctx.closePath();
    ctx.fillStyle = FIN; ctx.fill(); ctx.strokeStyle = FIN_EDGE; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = "rgba(125,111,60,.5)"; ctx.lineWidth = 0.9;
    for (var r = -4; r <= 4; r++) { if (!r) continue; var e1 = tp(14 + Math.abs(r) * 3, r * 5.2); ctx.beginPath(); ctx.moveTo(t0[0], t0[1]); ctx.lineTo(e1[0], e1[1]); ctx.stroke(); }
    /* 背びれ2つ・しりびれ・腹びれ */
    fin(2, 3, 1, 15, 6, 6);
    fin(3, 6, 1, 9, 5, 9);
    fin(4, 6, -1, 8, 5, 7);
    fin(2, 2.5 | 0, -1, 7, 8, 3);
    /* 体 */
    ctx.beginPath();
    var nose = [F[0].x - C[0][2] * 13, F[0].y - C[0][3] * 13];
    ctx.moveTo(nose[0], nose[1]);
    for (i = 0; i < N; i++) ctx.lineTo(L[i][0], L[i][1]);
    ctx.lineTo(tl.x, tl.y);
    for (i = N - 1; i >= 0; i--) ctx.lineTo(Rt[i][0], Rt[i][1]);
    ctx.closePath();
    var g = ctx.createLinearGradient(L[3][0], L[3][1], Rt[3][0], Rt[3][1]);
    g.addColorStop(0, "#2b4a5c"); g.addColorStop(0.3, "#5f8090"); g.addColorStop(0.55, "#c4d0d3"); g.addColorStop(1, "#f1f3f1");
    ctx.fillStyle = g; ctx.fill();
    ctx.lineJoin = "round"; ctx.strokeStyle = EDGE; ctx.lineWidth = 2; ctx.stroke();
    /* 側線とぜいご（頭の後ろで少し背側に曲がり、尾へまっすぐ） */
    ctx.beginPath();
    var lat = [];
    for (i = 1; i < N; i++) { var k = i < 3 ? 0.45 : i < 4 ? 0.25 : 0.05; lat.push(at(i, 1, -WIDTH[i] * (1 - k))); }
    lat.forEach(function (q, n) { n ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.strokeStyle = "rgba(60,62,48,.7)"; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.strokeStyle = "rgba(60,62,48,.55)"; ctx.lineWidth = 1;
    for (i = 3; i < N - 1; i++) for (var tt = 0; tt < 1; tt += 0.34) {
      var pz = back(i, tt), cn = C[i], o = WIDTH[i] * 0.05;
      var cx0 = pz[0] + cn[0] * o, cy0 = pz[1] + cn[1] * o;
      ctx.beginPath(); ctx.moveTo(cx0 + cn[0] * 2.5, cy0 + cn[1] * 2.5); ctx.lineTo(cx0 - cn[0] * 2.5, cy0 - cn[1] * 2.5); ctx.stroke();
    }
    /* 胸びれ（体の上に重ねる） */
    var pb = at(1, -1, -WIDTH[1] * 0.75), pe = [pb[0] + C[2][2] * 30 + C[2][0] * 3, pb[1] + C[2][3] * 30 + C[2][1] * 3];
    ctx.beginPath(); ctx.moveTo(pb[0] + C[1][0] * 3, pb[1] + C[1][1] * 3); ctx.lineTo(pe[0], pe[1]); ctx.lineTo(pb[0] - C[1][0] * 3, pb[1] - C[1][1] * 3); ctx.closePath();
    ctx.fillStyle = "rgba(214,200,140,.75)"; ctx.fill(); ctx.strokeStyle = FIN_EDGE; ctx.lineWidth = 1.1; ctx.stroke();
    /* えらぶたと黒い点 */
    var h = F[1], hn = [L[1][0] - h.x, L[1][1] - h.y];
    ctx.beginPath(); ctx.moveTo(h.x + hn[0] * 0.95, h.y + hn[1] * 0.95);
    ctx.quadraticCurveTo(h.x + C[1][2] * 7, h.y + C[1][3] * 7, h.x - hn[0] * 0.9, h.y - hn[1] * 0.9);
    ctx.strokeStyle = EDGE; ctx.lineWidth = 1.6; ctx.stroke();
    var sp = at(1, 1, -WIDTH[1] * 0.35); ctx.beginPath(); ctx.ellipse(sp[0], sp[1], 2.4, 3.6, Math.atan2(C[1][1], C[1][0]), 0, 7); ctx.fillStyle = "#1a1f22"; ctx.fill();
    /* 口 */
    var m0 = at(0, -1, -WIDTH[0] * 0.55), m1 = [m0[0] + C[0][2] * 8, m0[1] + C[0][3] * 8];
    ctx.beginPath(); ctx.moveTo(nose[0] + C[0][0] * -2, nose[1] + C[0][1] * -2); ctx.lineTo(m1[0], m1[1]);
    ctx.strokeStyle = EDGE; ctx.lineWidth = 1.3; ctx.stroke();
    /* 大きな目 */
    var e = at(0, 1, -WIDTH[0] * 0.55); e = [e[0] + C[0][2] * 2, e[1] + C[0][3] * 2];
    ctx.beginPath(); ctx.arc(e[0], e[1], 7.2, 0, 7); ctx.fillStyle = "#d8c690"; ctx.fill(); ctx.strokeStyle = EDGE; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(e[0], e[1], 4.4, 0, 7); ctx.fillStyle = "#0d0f10"; ctx.fill();
    ctx.beginPath(); ctx.arc(e[0] - 1.4, e[1] - 1.6, 1.3, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
  }


  /* 画面上の進捗バー（海までどれだけ来たか） */
  function drawProgress() {
    var x0 = 84, x1 = W - 28, y = 33, h = 14;
    var p = Math.max(0, Math.min(1, (center().x - startX) / (seaX + T - startX)));
    roundRect(x0, y, x1 - x0, h, h / 2);
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#16202e"; ctx.stroke();
    if (p > 0.01) { roundRect(x0 + 3, y + 3, Math.max(h - 6, (x1 - x0 - 6) * p), h - 6, (h - 6) / 2); ctx.fillStyle = "#2f86c4"; ctx.fill(); }
  }

  /* 引っぱり中は、跳ぶ向きと強さを矢印で見せる */
  function drawAim() {
    var v = pullVec();
    if (!v || v.p <= 0 || state !== S.PLAY) return;
    var c = center(), sx = (c.x - camX) * Z, sy = (c.y - camY) * Z;
    var len = 40 + v.p * 150;
    var ex = sx + v.ux * len, ey = sy + v.uy * len;
    ctx.save();
    ctx.globalAlpha = onGround ? 0.95 : 0.4;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    var a = Math.atan2(v.uy, v.ux);
    ctx.fillStyle = "#16202e";
    ctx.beginPath(); ctx.moveTo(ex + Math.cos(a) * 14, ey + Math.sin(a) * 14);
    ctx.lineTo(ex + Math.cos(a + 2.4) * 16, ey + Math.sin(a + 2.4) * 16);
    ctx.lineTo(ex + Math.cos(a - 2.4) * 16, ey + Math.sin(a - 2.4) * 16); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    drawBack();
    ctx.save();
    ctx.scale(Z, Z);
    ctx.translate(-camX, -camY);
    drawWorld();
    if (state !== S.GOAL && state !== S.RESULT || endT < 0.15) (drawFishImage() || drawFish());
    drawBird();
    ctx.fillStyle = "#e6f4ff";
    splashes.forEach(function (s) { ctx.globalAlpha = Math.min(1, s.t * 2); ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.restore();
    drawAim();
    if (state === S.PLAY) {
      ctx.beginPath(); ctx.arc(RETRY.x, RETRY.y, RETRY.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      if (window.zActionIcon) window.zActionIcon(ctx, "もう一度", RETRY.x, RETRY.y + 1, 26);
      drawProgress();
    }
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。跳ねた回数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(jumps), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      var c = center();
      return { state: state, jumps: jumps, x: c.x, y: c.y, ground: onGround, bird: bird.mode, seaX: seaX, W: W, H: H, pools: pools, fans: fans, plats: plats };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    /* 画面座標で引っぱって離す */
    fling: function (dx, dy) { drag = { id: -1, x0: 270, y0: 500, x: 270 - dx, y: 500 - dy }; launch(); drag = null; },
    aim: function (dx, dy) { drag = dx == null ? null : { id: -1, x0: 270, y0: 500, x: 270 - dx, y: 500 - dy }; },
    debug: debugKey
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      for (var i = 0; i < 4; i++) {
        await r.wait(1400);
        window.__probe.fling(120, -150);
      }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
