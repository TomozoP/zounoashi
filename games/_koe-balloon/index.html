<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>100体ジェット</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:0; opacity:0; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #retry-button, #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #retry-button[hidden], #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="retry-button" type="button" aria-label="もう一度" hidden></button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="scene3d.js"></script>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 100体ジェット

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var retryButton=document.getElementById('retry-button');
  window.zResultActions.bind(retryButton,function(){audioOn();newRound();});

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  var scene3d=null;
  if(window.THREE && window.BalloonScene){
    try { scene3d=new window.BalloonScene(); }
    catch(e){console.warn('立体描画を起動できないため平面で表示します。',e);}
  }
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, jetSound=null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function updateJetSound(){
    if(!AC||!NOISE)return;
    if(!jetSound){
      var source=AC.createBufferSource(),filter=AC.createBiquadFilter(),gain=AC.createGain();
      source.buffer=NOISE;source.loop=true;filter.type="bandpass";filter.frequency.value=900;filter.Q.value=.65;
      gain.gain.value=0;source.connect(filter);filter.connect(gain);gain.connect(AC.destination);source.start();
      jetSound={source:source,gain:gain};
    }
    jetSound.gain.gain.setTargetAtTime(!document.hidden&&state===S.PLAY&&held?.055:0,AC.currentTime,.025);
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", FALL: "fall", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  var py=480, vy=0, air=0, level=0, distance=0, gates=[], spawn=0, gateIndex=0;
  var BX=155, MOUTH_UP=51;
  var doll=null, fallTime=0, fallAccumulator=0, burst=null;
  // 100体の飛行履歴を、このページ内だけで保持する。
  var history=[],damage={},track=[],won=false,lives=100,traps=[],destroyed={},screenBursts=[];
  var replayGhosts=[],explosions=[],fired={},serial=0,attemptNumber=1,attemptSaved=false;
  var RUN_SPEED=320,GATE_COUNT=30,GATE_STEP=240;
  function lead(i){return (history.length-i)*.035+.12;}
  function saveAttempt(){
    if(attemptSaved)return;attemptSaved=true;
    history.push({id:++serial,frames:track.slice(),end:T,y:py/H,worldX:155+T*RUN_SPEED});
    if(history.length>100)history.shift();
  }
  function trapPosition(id,time){var born=1.6+id*1.15;return {id:id,x:W+90-(time-born)*540,y:H*.5+Math.sin(id*2.17)*Math.min(200,H*.23),born:born};}
  function baseGate(id){var gap=Math.min(180,H*.24),center=H*.51+Math.sin(id*1.7)*Math.min(85,H*.1);return {top:center-gap/2,bottom:center+gap/2};}
  function carve(wx,y){
    for(var id=0;id<GATE_COUNT;id++){var x=575+id*GATE_STEP;if(wx+108<x||wx-108>x+58)continue;
      var holes=damage[id]||(damage[id]=[]);holes.push({x:wx-x,y:y/H,r:108});
      if(holes.length>64)holes.shift();
    }
    gates.forEach(function(g){g.holes=damage[g.id]||[];});
    for(var j=0;j<28;j++){var missile=trapPosition(j,T);if(T>=missile.born&&Math.hypot(missile.x+T*RUN_SPEED-wx,missile.y-y)<140)destroyed[j]=true;}
  }
  // 円で抜いた後に残る縦の区間と、人物の楕円が重なるかを調べる。
  function pillarHit(cx,cy,rx,ry,g){
    var lo=Math.max(g.x,cx-rx),hi=Math.min(g.x+58,cx+rx);if(lo>hi)return false;
    var count=Math.max(1,Math.ceil(hi-lo));
    for(var i=0;i<=count;i++){
      var x=lo+(hi-lo)*i/count,half=ry*Math.sqrt(Math.max(0,1-Math.pow((x-cx)/rx,2)));
      var spans=[[Math.max(0,cy-half),Math.min(g.top,cy+half)],[Math.max(g.bottom,cy-half),Math.min(H,cy+half)]].filter(function(v){return v[1]>v[0];});
      (g.holes||[]).forEach(function(h){
        var dx=x-g.x-h.x;if(Math.abs(dx)>=h.r)return;var d=Math.sqrt(h.r*h.r-dx*dx),low=h.y*H-d,high=h.y*H+d,next=[];
        spans.forEach(function(v){if(low>v[0])next.push([v[0],Math.min(v[1],low)]);if(high<v[1])next.push([Math.max(v[0],high),v[1]]);});
        spans=next.filter(function(v){return v[1]>v[0];});
      });
      if(spans.length)return true;
    }return false;
  }
  function replayStep(dt){
    replayGhosts=[];history.forEach(function(h,i){var age=T+lead(i);
      if(age>=h.end){if(!fired[h.id]){fired[h.id]=true;carve(h.worldX,h.y*H);explosions.push({x:h.worldX,y:h.y*H,age:0});noiseHit(.16,250,.025);}return;}
      var n=Math.min(h.frames.length-1,Math.floor(age*60)),f=h.frames[n];
      if(f&&155+lead(i)*RUN_SPEED<W+50)replayGhosts.push({number:h.id,x:155+lead(i)*RUN_SPEED,y:f.y*H,air:f.air});
    });
    explosions.forEach(function(e){e.age+=dt;});explosions=explosions.filter(function(e){return e.age<.65;});
  }
  document.addEventListener('visibilitychange',function(){if(document.hidden)held=false;updateJetSound();});
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound(retry){
    var keepHeld=retry&&held;
    if(!retry){history=[];serial=0;lives=100;screenBursts=[];}
    attemptNumber=serial+1;damage={};destroyed={};won=false;track=[];attemptSaved=false;fired={};explosions=[];replayGhosts=[];traps=[];
    shareButton.hidden=true;retryButton.hidden=true;document.getElementById("start").hidden=true;
    state=S.PLAY;score=0;T=0;held=!!keepHeld;
    py=H*.52;vy=0;air=held?1:0;level=air;distance=0;gates=[];doll=null;fallTime=0;burst=null;
  }
  // 関節同士の距離を保ちながら、重力と接触で手足を動かす。
  function pose(){return [[155,py],[155,py],[155,py],[129,py+6],[134,py+20],[181,py+6],[176,py+20],[145,py+33],[142,py+48],[165,py+33],[171,py+48]];}
  function popBalloon(){
    if(state!==S.PLAY)return;
    saveAttempt();lives--;screenBursts.push({x:155,y:py,age:0});
    noiseHit(.25,180,.12);tone(95,.2,.07,"sawtooth",28);
    if(lives<=0){state=S.RESULT;held=false;return;}
    newRound(true);
  }
  /* ============ 進行 ============ */
  function update(dt) {
    if(document.hidden)return;
    screenBursts.forEach(function(b){b.age+=dt;});screenBursts=screenBursts.filter(function(b){return b.age<.45;});
    if (state !== S.PLAY) return;
    T += dt;
    replayStep(dt);
    level=held?1:0;air=level;
    vy+=(1550-air*4100-vy*1.1)*dt;
    vy=Math.max(-650,Math.min(720,vy));
    py+=vy*dt;
    while(track.length<Math.floor(T*60))track.push({y:py/H,air:air});
    var speed=RUN_SPEED;
    distance+=speed*dt/10;
    gates=[];
    for(var id=0;id<10;id++){
      var x=575+id*270-T*RUN_SPEED;if(x>W+80||x<-70)continue;
      var base=baseGate(id),cut=damage[id];
      gates.push({id:id,x:x,top:base.top,bottom:base.bottom,holes:cut||[]});
    }
    traps=[];
    for(var j=0;j<28;j++){var m=trapPosition(j,T);if(!destroyed[j]&&T>=m.born&&m.x>-80&&m.x<W+100)traps.push(m);}
    if(py-34<0 || py+29>H || gates.some(function(g){return pillarHit(149,py,35,31,g);})||traps.some(function(m){return Math.abs(m.x-149)<48&&Math.abs(m.y-py)<40;})) {
      popBalloon();
      return;
    }
    score=Math.min(GATE_COUNT,Math.max(0,Math.floor((T*RUN_SPEED-533)/GATE_STEP)+1));
    if(score>=GATE_COUNT){won=true;state=S.RESULT;held=false;tone(784,.4,.08);}
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO||state===S.FALL)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") { newRound();  }
      return;
    }
    held = true;
    /* ▼UPDATE: 押したときの処理 */

  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    /* ▼UPDATE: 離したときの処理（要らなければ空のまま） */
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) { newRound(); audioOn();  } return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    window.zResultActions.x({ text: score + "本くぐりました #100体ジェット" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
  function draw() {
    updateJetSound();
    window.zResultActions.place(retryButton, resultButtons()[0], W, H, state === S.RESULT);
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#86d6e8');sky.addColorStop(1,'#edf5dc');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    for(var i=0;i<9;i++){
      var cx=((i*173-distance*2)%(W+200)+W+200)%(W+200)-100, cy=H*(0.12+(i%4)*0.22);
      ctx.fillStyle='rgba(255,255,255,.55)';
      ellipse(cx,cy,48,15);ellipse(cx-22,cy-9,22,20);ellipse(cx+13,cy-15,29,26);
    }
    ctx.fillStyle='#b4cfb9';
    for(var i=0;i<12;i++){var x=((i*73-distance*3)%880+880)%880-120;ctx.fillRect(x,H-55-(i%3)*18,55,120);}
    if(scene3d){
      scene3d.render(ctx,canvas,{number:attemptNumber,W:W,H:H,y:py,vy:vy,radius:16+air*48,time:T,gates:gates,ghosts:replayGhosts,explosions:explosions,scroll:T*RUN_SPEED,level:air,doll:doll,pose:pose(),fallTime:fallTime,burst:burst});
    }else{
    gates.forEach(function(g){
      if((g.holes||[]).length){
        for(var col=0;col<58;col++){var spans=[[0,g.top],[g.bottom,H]];
          g.holes.forEach(function(h){var dx=col+.5-h.x;if(Math.abs(dx)>=h.r)return;var dy=Math.sqrt(h.r*h.r-dx*dx),low=h.y*H-dy,high=h.y*H+dy,next=[];
            spans.forEach(function(v){if(low>v[0])next.push([v[0],Math.min(v[1],low)]);if(high<v[1])next.push([Math.max(v[0],high),v[1]]);});spans=next;
          });
          ctx.fillStyle=col<10?"#658690":"#3b5960";spans.forEach(function(v){if(v[1]>v[0])ctx.fillRect(g.x+col,v[0],1,v[1]-v[0]);});
        }return;
      }
      ctx.fillStyle='#3b5960';roundRect(g.x, -30,58,g.top+30,12);ctx.fill();roundRect(g.x,g.bottom,58,H-g.bottom+30,12);ctx.fill();
      ctx.fillStyle='#ffc86b';ctx.fillRect(g.x-5,g.top-16,68,16);ctx.fillRect(g.x-5,g.bottom,68,16);
      ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(g.x+8,0,8,g.top-16);ctx.fillRect(g.x+8,g.bottom+16,8,H);
    });
    var hp=doll?doll.points[2]:{x:155,y:py},jp=doll?doll.points[0]:hp;
    ctx.fillStyle='#71899b';roundRect(jp.x-32,jp.y-20,55,43,6);ctx.fill();
    if(!doll&&air>0){ctx.fillStyle='#ffab38';[-25,17].forEach(function(x){ctx.beginPath();ctx.moveTo(jp.x+x-5,jp.y+23);ctx.lineTo(jp.x+x,jp.y+40+air*35);ctx.lineTo(jp.x+x+5,jp.y+23);ctx.fill();});}
    ctx.fillStyle='#b1c7d2';roundRect(hp.x-18,hp.y-17,36,34,3);ctx.fill();
    ctx.fillStyle='#182f40';ctx.fillRect(hp.x-14,hp.y-6,28,13);
    ctx.fillStyle='#78f4ff';ctx.fillRect(hp.x-10,hp.y-2,6,5);ctx.fillRect(hp.x+4,hp.y-2,6,5);
    ctx.fillStyle='#263b4b';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(String(attemptNumber).padStart(2,'0'),hp.x,hp.y-9);
    }

    if(state===S.INTRO){ctx.fillStyle='#fff';roundRect(150,H-98,240,68,34);ctx.fill();ctx.fillStyle='#16202e';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('START',270,H-54);}

    traps.forEach(function(m){
      ctx.fillStyle="#ff653d";ctx.beginPath();ctx.moveTo(m.x-24,m.y);ctx.lineTo(m.x+13,m.y-12);ctx.lineTo(m.x+13,m.y+12);ctx.closePath();ctx.fill();
      ctx.fillStyle="#ffdc77";ctx.fillRect(m.x+14,m.y-5,20+Math.sin(T*70)*8,10);
      ctx.strokeStyle="rgba(255,125,65,.45)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(m.x+35,m.y);ctx.lineTo(m.x+100,m.y);ctx.stroke();
    });
    screenBursts.forEach(function(b){
      ctx.fillStyle="rgba(255,183,70,"+(1-b.age/.45)+")";
      for(var i=0;i<28;i++){var angle=i*2.399,r=b.age*(150+i%5*85);ellipse(b.x+Math.cos(angle)*r,b.y+Math.sin(angle)*r+b.age*b.age*200,3+i%4,3+i%4);}
      ctx.strokeStyle="rgba(255,244,184,"+(1-b.age/.45)+")";ctx.lineWidth=5;ctx.beginPath();ctx.arc(b.x,b.y,10+b.age*230,0,Math.PI*2);ctx.stroke();
    });
    if(state!==S.INTRO){ctx.fillStyle="#365664";ctx.font="800 26px sans-serif";ctx.textAlign="left";ctx.fillText(String(lives),24,58);}
    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(lives), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now:function(){return {state:state,score:score,W:W,H:H,y:py,vy:vy,air:air,level:level,won:won,lives:lives,number:attemptNumber,time:T,historyCount:history.length,threeD:!!scene3d,gates:gates.map(function(g){return {x:g.x,top:g.top,bottom:g.bottom};}),traps:traps.map(function(m){return {id:m.id,x:m.x,y:m.y};}),ghosts:replayGhosts,damage:JSON.parse(JSON.stringify(damage)),destroyed:Object.keys(destroyed).length};},
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout(); py=H*.52;
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
