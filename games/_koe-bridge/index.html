<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>声のサーフィン</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:0; opacity:0; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #retry-button, #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #retry-button[hidden], #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="retry-button" type="button" aria-label="もう一度" hidden></button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 声のサーフィン

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var retryButton=document.getElementById('retry-button');
  window.zResultActions.bind(retryButton,function(){audioOn();newRound();requestInputs();});

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", FALL: "fall", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  var level=0,won=false,road=[],carX=0,carY=0,angle=0,speed=300,fallSpeed=0,pitch=0,targetHeight=0,penHeight=0,lastPitchTime=-1,airborne=false;
  var spin=0,crashTime=0,obstacles=[],obstacleIndex=0,spray=[],bestHeight=0,flips=0,airTurn=0,takeoffY=0,landing=0;
  var mic=null, micSource=null, analyser=null, samples=null, micPending=false, micError=false;
  function stopMic() { if(micSource){micSource.disconnect();micSource=null;} if(mic) mic.getTracks().forEach(function(t){t.stop();}); mic=null; analyser=null; }
  function requestInputs(){requestMic();}
  function stopInputs(){stopMic();}
  async function requestMic() {
    if(micPending || mic) return;
    if(!window.navigator.mediaDevices || !window.navigator.mediaDevices.getUserMedia || !AC) { micError=true; return; }
    micPending=true; micError=false;
    try {
      var stream=await window.navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      if(document.hidden){stream.getTracks().forEach(function(t){t.stop();});return;}
      mic=stream; analyser=AC.createAnalyser(); analyser.fftSize=2048;
      samples=new Float32Array(analyser.fftSize);
      micSource=AC.createMediaStreamSource(stream); micSource.connect(analyser);
      stream.getTracks().forEach(function(t){t.onended=function(){stopMic();micError=true;};});
    } catch(e) { stopMic(); micError=true; }
    finally { micPending=false; }
  }
  window.addEventListener('pagehide',stopInputs);
  document.addEventListener('visibilitychange',function(){if(document.hidden){stopInputs();held=false;}else if(state===S.PLAY && !micError){requestInputs();}});
  // 周期の最初の強い山から音程を推定。音量は無音を除くためだけに使う。
  function detectPitch(data,rate){
    var n=data.length,mean=0,energy=0;for(var i=0;i<n;i++)mean+=data[i];mean/=n;
    for(var i=0;i<n;i++)energy+=(data[i]-mean)*(data[i]-mean);
    if(Math.sqrt(energy/n)<.012)return 0;
    var lo=Math.floor(rate/700),hi=Math.min(Math.floor(rate/75),Math.floor(n/2)),previous=0,rising=false;
    for(var lag=lo;lag<=hi;lag++){
      var cross=0,e1=0,e2=0;for(var i=0;i<n-hi;i+=2){var a=data[i]-mean,b=data[i+lag]-mean;cross+=a*b;e1+=a*a;e2+=b*b;}
      var c=cross/Math.sqrt(e1*e2+1e-12);
      if(c<previous&&rising&&previous>.85)return rate/(lag-1);
      rising=c>previous;previous=c;
    }return 0;
  }
  function readPitch(){if(!analyser)return 0;analyser.getFloatTimeDomainData(samples);return detectPitch(samples,AC.sampleRate);}
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound(){
    stopInputs();shareButton.hidden=true;retryButton.hidden=true;document.getElementById('start').hidden=true;
    state=S.PLAY;score=0;T=0;held=false;level=0;won=false;road=[];carX=0;carY=-18;angle=fallSpeed=pitch=targetHeight=penHeight=0;speed=300;lastPitchTime=-1;airborne=false;spin=crashTime=0;obstacles=[];obstacleIndex=0;spray=[];bestHeight=flips=airTurn=landing=0;
    for(var x=-180;x<=270;x+=6)road.push({x:x,y:0});
  }
  function ground(x){
    var i=Math.max(0,Math.min(road.length-2,Math.floor((x-road[0].x)/6))),a=road[i],b=road[i+1];
    return a.y+(b.y-a.y)*Math.max(0,Math.min(1,(x-a.x)/6))+Math.sin(x/100-T*1.4)*23;
  }
  function update(dt){
    if(document.hidden||micPending)return;
    if(state===S.FALL){crashTime+=dt;fallSpeed+=400*dt;carY+=fallSpeed*dt;angle+=spin*dt;if(crashTime>1)state=S.RESULT;return;}
    if(state!==S.PLAY)return;
    T+=dt;
    if(T-lastPitchTime>=.05){lastPitchTime=T;pitch=held?360:readPitch();
      if(pitch>0)targetHeight=Math.max(-130,Math.min(130,-Math.log2(pitch/200)*105));else targetHeight=penHeight;
    }
    score=Math.round(bestHeight);
    while(road[road.length-1].x<carX+270){
      // 急な音程変化も坂としてつなぎ、線を途切れさせない。
      penHeight+=Math.max(-6,Math.min(6,(targetHeight-penHeight)*.16));
      road.push({x:road[road.length-1].x+6,y:penHeight});
    }
    while(road.length>2&&road[1].x<carX-200)road.shift();
    var wasAirborne=airborne,steps=Math.ceil(dt*240),h=dt/steps;
    for(var k=0;k<steps;k++)physicsStep(h);
    landing=Math.max(0,landing-dt*3);
    if(airborne&&!wasAirborne){takeoffY=carY;airTurn=0;}
    if(airborne){bestHeight=Math.max(bestHeight,takeoffY-carY);airTurn+=spin*dt;}
    if(wasAirborne&&!airborne){flips+=Math.floor(Math.abs(airTurn)/(Math.PI*2));landing=1;noiseHit(.12,900,.025);for(var j=0;j<15;j++)spray.push({x:carX,y:ground(carX),vx:-80-Math.random()*130,vy:-50-Math.random()*140,life:.7});}
    if(!airborne&&Math.random()<dt*40)spray.push({x:carX-23,y:ground(carX),vx:-80,vy:-30-Math.random()*45,life:.45});
    spray.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;});spray=spray.filter(function(p){return p.life>0;});

  }

  // 板を質量1・慣性モーメント600の剛体として積分する。
  // 水面に沈んだ3点の浮力と抵抗だけが板を回す。空中では重力だけ。
  function physicsStep(h){
    var fx=0,fy=260,torque=0,contacts=0,c=Math.cos(angle),sn=Math.sin(angle);
    [-28,0,28].forEach(function(localX){
      var rx=localX*c-4*sn,ry=localX*sn+4*c,x=carX+rx,y=carY+ry;
      var depth=y-ground(x);if(depth<=0)return;contacts++;
      var slope=(ground(x+2)-ground(x-2))/4,norm=Math.sqrt(1+slope*slope),nx=slope/norm,ny=-1/norm;
      var vx=speed-spin*ry,vy=fallSpeed+spin*rx,waterY=-32.2*Math.cos(x/100-T*1.4);
      var normalSpeed=vx*nx+(vy-waterY)*ny;
      var force=Math.max(0,depth*65-normalSpeed*9)/3;
      var px=nx*force,py=ny*force;
      // 海流へ近づく抵抗。位置や速度を強制的に置き換えない。
      px+=(300-vx)*1.3/3;
      fx+=px;fy+=py;torque+=rx*py-ry*px;
    });
    airborne=contacts===0;speed+=fx*h;fallSpeed+=fy*h;spin+=torque/600*h;
    carX+=speed*h;carY+=fallSpeed*h;angle+=spin*h;
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO||state===S.FALL)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") { newRound(); requestInputs(); }
      return;
    }
    held = true;
    /* ▼UPDATE: 押したときの処理 */
    if(!mic && !micPending && !micError) requestInputs();
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;

  }
  function up() {
    if (!held) return;
    held = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) { newRound(); audioOn(); requestInputs(); } return; }
    if (left || right) {
      if (state !== S.PLAY) return;

      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    window.zResultActions.x({ text: (bestHeight/10).toFixed(1)+"m 跳びました #声のサーフィン" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
  function draw() {
    window.zResultActions.place(retryButton, resultButtons()[0], W, H, state === S.RESULT);
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    drawBridge();
    if(state===S.INTRO){ctx.fillStyle='#fff';roundRect(150,H-98,240,68,34);ctx.fill();ctx.fillStyle='#16202e';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('START',270,H-54);}
    if(state===S.RESULT)drawResult();
  }
  function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
  function drawBridge(){
    var base=H*.54,offset=carX-145;
    var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#79d7ed');sky.addColorStop(.6,'#e7f7eb');sky.addColorStop(1,'#148dad');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff3bd';ellipse(425,H*.17,42,42);ctx.fillStyle='rgba(255,255,255,.55)';for(var i=0;i<5;i++){var x=((i*157-carX*.22)%690+690)%690-70;ellipse(x,H*.2+(i%3)*35,48,10);}
    for(var layer=0;layer<3;layer++){ctx.beginPath();ctx.moveTo(0,H);for(var x=0;x<=W;x+=8)ctx.lineTo(x,base+50+layer*30+Math.sin((x+carX*.3)/80+T+layer)*13);ctx.lineTo(W,H);ctx.fillStyle=['#78d8dc','#40bdcd','#179fbb'][layer];ctx.fill();}
    function seaY(x){return base+ground(x+offset);}
    ctx.beginPath();ctx.moveTo(0,H);for(var x=0;x<=W;x+=4)ctx.lineTo(x,seaY(x));ctx.lineTo(W,H);var sea=ctx.createLinearGradient(0,base-140,0,H);sea.addColorStop(0,'#36d5ce');sea.addColorStop(.5,'#078eaf');sea.addColorStop(1,'#075479');ctx.fillStyle=sea;ctx.fill();
    ctx.beginPath();for(var x=0;x<=W;x+=4){if(x)ctx.lineTo(x,seaY(x));else ctx.moveTo(x,seaY(x));}ctx.strokeStyle='#d9fff3';ctx.lineWidth=7;ctx.lineJoin='round';ctx.stroke();
    ctx.strokeStyle='rgba(200,255,245,.4)';ctx.lineWidth=2;for(var i=0;i<22;i++){var x=((i*93-carX*1.4)%610+610)%610-35,y=seaY(x)+24+(i%5)*28;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+18,y+5,x+38,y);ctx.stroke();}
    spray.forEach(function(p){ctx.fillStyle='rgba(239,255,250,'+Math.min(1,p.life*3)+')';ellipse(p.x-offset,base+p.y,3,3);});
    ctx.save();ctx.translate(145,base+carY);ctx.rotate(angle);
    ctx.fillStyle='#ffcc5d';ellipse(0,0,38,6);ctx.strokeStyle='#ee7850';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(25,0);ctx.stroke();
    var crouch=landing*10;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#f4b587';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-16,-7);ctx.lineTo(-8,-24+crouch);ctx.lineTo(4,-36+crouch);ctx.lineTo(18,-21+crouch);ctx.lineTo(19,-7);ctx.stroke();
    ctx.strokeStyle='#253c69';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(3,-34+crouch);ctx.lineTo(0,-52+crouch);ctx.stroke();
    ctx.strokeStyle='#f4b587';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-49+crouch);ctx.lineTo(-17,-41+crouch);ctx.lineTo(-27,-47+crouch);ctx.moveTo(1,-49+crouch);ctx.lineTo(20,-47+crouch);ctx.lineTo(29,-56+crouch);ctx.stroke();
    ctx.fillStyle='#f4b587';ellipse(0,-65+crouch,11,12);ctx.fillStyle='#473d3c';ellipse(-2,-72+crouch,12,7);ctx.restore();
    if(state===S.PLAY){ctx.fillStyle='#155574';ctx.font='bold 30px sans-serif';ctx.textAlign='right';ctx.fillText((bestHeight/10).toFixed(1)+'m',W-22,46);if(flips){ctx.font='bold 23px sans-serif';ctx.fillText('↻ '+flips,W-22,78);}}
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.76;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score+'m',W/2,H*.45);
    ctx.restore();

    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now:function(){return {state:state,score:score,W:W,H:H,level:level,won:won,time:T,x:carX,y:carY,angle:angle,speed:speed,vy:fallSpeed,spin:spin,pitch:pitch,targetHeight:targetHeight,airborne:airborne,bestHeight:bestHeight,flips:flips,obstacles:obstacles.map(function(o){return {x:o.x,y:o.y,r:o.r};}),road:road.slice(),micPending:micPending,micError:micError};},
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(10000);
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();requestInputs();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
