<!DOCTYPE html>

<title>車で走れメロス</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2331; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #2b2331; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; background: #cfe0e6; }
  #ending-reader { position:absolute; inset:0 0 auto; box-sizing:border-box; height:22.3%; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; background:#fffdf8; color:#25221e; padding:24px 30px 38px; z-index:3; transition:height 1.15s cubic-bezier(.22,.7,.25,1); scrollbar-width:thin; }
  #ending-reader[hidden] { display:none; }
  #ending-reader.expanded { height:100%; }
  #ending-reader h2 { font:700 32px 'Yu Mincho','Hiragino Mincho ProN',serif; margin:0 0 30px; letter-spacing:.06em; text-align:center; }
  #ending-prose { font:400 clamp(18px,2.2vw,21px)/1.95 'Yu Mincho','Hiragino Mincho ProN',serif; margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
  #ending-buttons { display:flex; gap:14px; justify-content:center; margin:34px 0 0; flex-wrap:wrap; }
  #ending-buttons button { padding:11px 26px; border-radius:3px; cursor:pointer; font:inherit; }
  #read-again { background:transparent; color:#35312b; border:1px solid #bbb2a3; }
  #read-share { background:#25221e; color:#fffdf8; border:1px solid #25221e; }
</style>

<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <article id="ending-reader" aria-label="走行の物語" hidden><h2>車で走れメロス</h2><p id="ending-prose"></p><div id="ending-buttons"><button id="read-again" type="button" aria-label="もう一度走る" title="もう一度走る"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8a8 8 0 1 1-1 7M4 3v6h6"/></svg></button><button id="read-share" type="button" aria-label="Xでシェア" title="Xでシェア"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2h5l13 20h-5zM21 2l-8 9M11 13l-8 9"/></svg></button></div></article>
</div></div>
<script src="../share.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>
<script src="car-model.js"></script>
<script src="scenery-models.js"></script>
<script src="depth-renderer.js"></script>
<script>
/* 車で走れメロス
   村から刑場までの帰り道を、日が沈むまでに走りきる。
   道は一本道。岩や倒木はよける。山賊と市中の人々は跳ね飛ばせる。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var reader=document.getElementById('ending-reader'), prose=document.getElementById('ending-prose');
  function openReading() {
    narr.shown=narr.s.length;touchOn=false;keyL=false;keyR=false;
    prose.textContent=narr.s;reader.hidden=false;reader.scrollTop=0;
    reader.classList.remove('expanded');
    requestAnimationFrame(function(){requestAnimationFrame(function(){if(state===ST.RESULT)reader.classList.add('expanded');});});
  }
  document.getElementById('read-again').addEventListener('click',function(e){e.stopPropagation();newRun();});
  document.getElementById('read-share').addEventListener('click',function(e){e.stopPropagation();doShare();});

  /* タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));
    TEXTH = Math.round(H * 0.223);
    VH = H - TEXTH;
    CY = VH / 2;
    FOCAL = (VH / 2) / Math.tan(0.55);
    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* =====================================================================
     帰り道。x は横、z は進む向き。
     ===================================================================== */
  var HW = 140;                              /* 道の半分の幅 */
  var GOALZ = 46000;                         /* 刑場 */
  var RIVERS = [
    {z0:1900,z1:2130}, {z0:5620,z1:5910}, {z0:8800,z1:9050},
    {z0:11700,z1:12000}, {z0:17800,z1:18120}
  ];
  RIVERS.forEach(function(r,i) {
    var width=r.z1-r.z0;r.z0*=2;r.z1=r.z0+width;
    r.ramp={z0:r.z0-210,z1:r.z0-70,h:42};
    var speed=i===4?688:430,z=r.z0+(r.z1-r.z0)*.45,t=(z-r.ramp.z1)/speed;
    r.ring={x:0,y:42+(240+speed*.62)*t-450*t*t+14,z:z,radius:73,done:false};
  });
  var RIVER=RIVERS[0], RAMP=RIVER.ramp;
  function riverNear(z) {
    var result=RIVERS[0],distance=Infinity;
    RIVERS.forEach(function(r){var d=Math.abs(z-(r.z0+r.z1)/2);if(d<distance){distance=d;result=r;}});
    return result;
  }
  function waterAt(z,end) {return RIVERS.some(function(r){return (end==null?z:end)>r.z0 && z<r.z1;});}
  var PADS=[
    {x:0,z:2600},{x:-60,z:7300},{x:60,z:9600},{x:0,z:14400},
    {x:0,z:19400},{x:-55,z:20700},{x:55,z:22000},{x:0,z:22900},
    {x:0,z:26400},{x:-60,z:29500},{x:60,z:32600},{x:0,z:34000},
    {x:0,z:37900},{x:0,z:41000},{x:0,z:43700}
  ];
  var LIMIT = 90;                            /* 日没まで（秒） */

  /* 場面の切れ目 */
  var SEC = [
    {z:RIVERS[0].z1,k:'village'}, {z:RIVERS[1].z1,k:'forest'}, {z:RIVERS[2].z1,k:'bandit'},
    {z:RIVERS[3].z1,k:'waste'}, {z:RIVERS[4].z1,k:'town'}, {z:45000,k:'sprint'}, {z:99999,k:'goal'}
  ];
  function sectionAt(z) {
    for (var i = 0; i < SEC.length; i++) if (z < SEC[i].z) return SEC[i].k;
    return "goal";
  }

  /* 毎回おなじ景色になるよう、決まった順で出る乱数を使う */
  var seed = 20260910;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function between(a, b) { return a + rnd() * (b - a); }

  /* =====================================================================
     道ばたの飾り・よける障害物・跳ね飛ばせる人
     ===================================================================== */
  var props = [];      /* 飾り。ぶつからない */
  var rocks = [];      /* 岩と倒木。ぶつかると止まる */
  var actors = [];     /* 山賊と市中の人々。跳ね飛ばせる */

  function inRiver(z) { return RIVERS.some(function(r){return z>r.z0-240 && z<r.z1+240;}); }

  (function build() {
    var z, k, n, side;

    for (z = -400; z < GOALZ + 700; z += 52) {          /* 道ばた */
      if (inRiver(z)) continue;
      k = sectionAt(z);
      for (n = 0; n < 2; n++) {
        if (rnd() > 0.66) continue;
        side = rnd() < 0.5 ? -1 : 1;
        var x = side * (HW + between(40, 620));
        var kind = k === "village" ? (rnd() < 0.5 ? "house" : "tree")
                 : k === "forest" ? (rnd() < 0.9 ? "tree" : "rock")
                 : k === "river" ? "rock"
                 : k === "bandit" ? (rnd() < 0.55 ? "tree" : "rock")
                 : k === "waste" ? (rnd() < 0.7 ? "rock" : "bush")
                 : (rnd() < 0.45 ? "house" : "column");
        props.push({ k: kind, x: x, z: z + between(-20, 20), s: between(0.7, 1.5), c: rnd() });
      }
    }

    for (z = 4600; z < 10500; z += between(340, 560)) {   /* 林の倒木 */
      if (inRiver(z)) continue;
      var lx = between(-HW + 60, HW - 60), ll = between(120, 230);
      rocks.push({ k: "log", x: lx, z: z, r: ll / 2, w: 26 });
    }
    for (z = 12200; z < 17400; z += between(190, 310)) {   /* 山賊の待ち伏せ */
      var m = 1 + (rnd() < 0.5 ? 1 : 0);
      for (n = 0; n < m; n++) actors.push(mkActor("bandit", between(-HW + 24, HW - 24), z + between(-40, 40)));
      if (rnd() < 0.25) rocks.push({ k: "rock", x: between(-HW + 40, HW - 40), z: z + between(60, 130), r: between(28, 40), w: 0 });
    }
    for (z = 17800; z < 23300; z += between(230, 380)) {  /* 荒野の岩 */
      rocks.push({ k: "rock", x: between(-HW + 34, HW - 34), z: z, r: between(26, 42), w: 0 });
      if (rnd() < 0.3) rocks.push({ k: "rock", x: between(-HW + 34, HW - 34), z: z + between(70, 140), r: between(26, 40), w: 0 });
    }
    for (z = 23800; z < GOALZ - 120; z += between(430, 720)) {  /* 市中の人々 */
      var mm = 1;
      for (n = 0; n < mm; n++) actors.push(mkActor("citizen", (rnd() < .5 ? -1 : 1) * between(85, HW - 18), z + between(-30, 30)));
      if (z < GOALZ - 10400 && rnd() < 0.07) rocks.push({ k: "cart", x: (rnd() < .5 ? -1 : 1) * (HW - 30), z: z + between(40, 90), r: 36, w: 26 });
    }
    for (z = 23800; z < GOALZ; z += 46) {                /* 沿道で見ている人 */
      side = rnd() < 0.5 ? -1 : 1;
      if (rnd() < 0.8) actors.push(mkActor("citizen", side * (HW + between(10, 90)), z + between(-20, 20)));
    }
  })();

  // Keep the launch and landing zones clear of generated obstacles and spectators.
  function blocksPad(o, rx, rz) {
    return PADS.some(function(p) {
      return Math.abs(o.x-p.x)<64+rx+24 && Math.abs(o.z-p.z)<100+rz+120;
    });
  }
  rocks=rocks.filter(function(o){return !inRiver(o.z)&&!blocksPad(o,o.r+14,(o.w||o.r)+25);});
  actors=actors.filter(function(o){return !inRiver(o.z)&&!blocksPad(o,19,29);});
  props=props.filter(function(o){var r=(o.k==='house'?84:40)*o.s;return !blocksPad(o,r,r);});
  function mkActor(k, x, z) {
    return { k: k, x: x, z: z, y: 0, a: rnd() * 6.28, vx: 0, vy: 0, vz: 0,
             spin: 0, hit: 0, c: rnd(), h: between(0.9, 1.1) };
  }

  /* =====================================================================
     色。日が傾くにつれて全体が赤く、暗くなる
     ===================================================================== */
  var SPEC = {
    roadA: "#ab9480", roadB: "#9c8470", edge: "#8a725d", shoulder: "#6f7546", stone: "#cfc6b0",
    rock: "#8e8a83", rockTop: "#a5a099", log: "#6b543d", cart: "#7d6242",
    trunk: "#5c4632", leaf: "#4d6b3e", leaf2: "#5c7a48", bush: "#7a7a4e",
    wall: "#d8cdb4", wall2: "#c2b69c", roof: "#a5553f", column: "#e0d8c4",
    skin: "#c9a07e", bandit: "#5b4a3f", bandit2: "#7a3f34", cloth: "#d9d2c2",
    cloth2: "#b8523f", cloth3: "#4e6a86", cloth4: "#c08a3e",
    body: "#c8452e", body2: "#a8351f", body3: "#8a2a17", roofc: "#f0e6d2",
    glass: "#33363d", tire: "#1b1719", shadow: "#4a4038",
    pad: "#299fad", padLight: "#b7f3e9", royal: "#803954", crown: "#f0c958", ringGold: "#e2b453", ringLight: "#fff0ab", ringSide: "#997036", banner: "#b8332a", water: "#5d6b6a", water2: "#6e7c78"
  };
  var carMesh = window.MELOS_CAR || [];
  carMesh.forEach(function (f, i) {
    f.mat='carMesh'+i;SPEC[f.mat]=f.c;f.philoMat='philo'+i;
    var r=parseInt(f.c.slice(1,3),16),g=parseInt(f.c.slice(3,5),16),b=parseInt(f.c.slice(5,7),16);
    SPEC[f.philoMat]=r>g*1.45&&r>b*1.3 ? '#496c80' : f.c;
  });
  var scenery = window.MELOS_SCENERY || {};
  Object.keys(scenery).forEach(function(name) {
    scenery[name].forEach(function(f) {f.mat='mesh'+f.c.slice(1); SPEC[f.mat]=f.c;});
  });
  var MAT = {}, FOGC = [206, 218, 208], duskT = 0, paletteAt = -9;
  function hx(s) { return [parseInt(s.substr(1, 2), 16), parseInt(s.substr(3, 2), 16), parseInt(s.substr(5, 2), 16)]; }
  function dusk(c) {
    var t = duskT;
    return [c[0] * (1 - 0.42 * t) + 96 * t, c[1] * (1 - 0.55 * t) + 54 * t, c[2] * (1 - 0.5 * t) + 58 * t];
  }
  function buildPalette() {
    for (var k in SPEC) {
      var c = dusk(hx(SPEC[k])), a = [], i, t;
      for (i = 0; i < 12; i++) {
        t = i / 11 * 0.95;
        a.push("rgb(" + Math.round(c[0] + (FOGC[0] - c[0]) * t) + "," +
                        Math.round(c[1] + (FOGC[1] - c[1]) * t) + "," +
                        Math.round(c[2] + (FOGC[2] - c[2]) * t) + ")");
      }
      MAT[k] = a;
    }
  }
  var FOG0 = 520, FOG1 = 2100;
  function shade(mat, d) {
    var t = (d - FOG0) / (FOG1 - FOG0);
    return mat[t <= 0 ? 0 : t >= 1 ? 11 : (t * 11) | 0];
  }

  /* =====================================================================
     3D。カメラの後ろは切り、遠い順に塗る
     ===================================================================== */
  var cam = { x: 0, y: 84, z: 0, yaw: 0, pitch: 0.33 };
  var TEXTH = 214, VH = H - TEXTH, CY = VH / 2;      /* 上は文章、下は走行画面 */
  var FOCAL = (VH / 2) / Math.tan(0.55), NEAR = 6;
  var cyaw = 1, syaw = 0, cpit = 1, spit = 0;
  function camSync() {
    cyaw = Math.cos(cam.yaw); syaw = Math.sin(cam.yaw);
    cpit = Math.cos(cam.pitch); spit = Math.sin(cam.pitch);
  }
  var _cx, _cy, _cz;
  function toCam(x, y, z) {
    var dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    var rx = dx * cyaw - dz * syaw, rz = dx * syaw + dz * cyaw;
    _cx = rx; _cy = dy * cpit + rz * spit; _cz = -dy * spit + rz * cpit;
  }

  var polys = [], polyN = 0;
  function addPoly(v, mat) {
    var n = v.length / 3, i, cp = [], d = 0;
    for (i = 0; i < n; i++) { toCam(v[i * 3], v[i * 3 + 1], v[i * 3 + 2]); cp.push(_cx, _cy, _cz); }
    var out = [];
    for (i = 0; i < n; i++) {
      var a = i * 3, b = ((i + 1) % n) * 3;
      var az = cp[a + 2], bz = cp[b + 2], t;
      if (az > NEAR) out.push(cp[a], cp[a + 1], az);
      if ((az > NEAR) !== (bz > NEAR)) {
        t = (NEAR - az) / (bz - az);
        out.push(cp[a] + (cp[b] - cp[a]) * t, cp[a + 1] + (cp[b + 1] - cp[a + 1]) * t, NEAR);
      }
    }
    if (out.length < 9) return;
    for (i = 2; i < out.length; i += 3) d += out[i];
    d /= (out.length / 3);
    if (d > FOG1 * 1.2) return;
    var p = polys[polyN];
    if (!p) p = polys[polyN] = { v: null, d: 0, c: "" };
    p.v = out; p.d = d; p.c = shade(mat, d);
    polyN++;
  }
  function box(x, y, z, sx, sy, sz, ang, top, side, front) {
    var s = Math.sin(ang || 0), c = Math.cos(ang || 0);
    function P(lx, ly, lz) { return [x + lx * c + lz * s, y + ly, z - lx * s + lz * c]; }
    var A = P(-sx, sy, -sz), B = P(sx, sy, -sz), C = P(sx, sy, sz), D = P(-sx, sy, sz);
    var a = P(-sx, 0, -sz), b = P(sx, 0, -sz), c2 = P(sx, 0, sz), d2 = P(-sx, 0, sz);
    function Q(p1, p2, p3, p4, m) {
      addPoly([p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2], p4[0], p4[1], p4[2]], m);
    }
    Q(A, B, C, D, top);
    Q(d2, c2, C, D, front || side);
    Q(b, a, A, B, front || side);
    Q(a, d2, D, A, side);
    Q(c2, b, B, C, side);
  }
  var depthRenderer = window.createMelosDepthRenderer ? window.createMelosDepthRenderer() : null;
  function drawPolys() {
    if (depthRenderer && depthRenderer(ctx,polys,polyN,W,VH,FOCAL,canvas.width/W)) {
      polyN=0; return;
    }
    var list = polys.slice(0, polyN);
    list.sort(function (a, b) { return b.d - a.d; });
    for (var i = 0; i < list.length; i++) {
      var v = list[i].v, n = v.length / 3, j;
      ctx.beginPath();
      for (j = 0; j < n; j++) {
        var iz = FOCAL / v[j * 3 + 2];
        var sx = W / 2 + v[j * 3] * iz, sy = CY - v[j * 3 + 1] * iz;
        if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.fillStyle = list[i].c;
      ctx.fill();
    }
    polyN = 0;
  }

  /* 手前から順に見られるよう、z で並べておく */
  function byZ(a, b) { return a.z - b.z; }
  props.sort(byZ); rocks.sort(byZ); actors.sort(byZ);
  function firstAt(arr, z) {
    var lo = 0, hi = arr.length, m;
    while (lo < hi) { m = (lo + hi) >> 1; if (arr[m].z < z) lo = m + 1; else hi = m; }
    return lo;
  }

  var VIEW = 2200;
  function rampH(z) {
    for(var i=0;i<RIVERS.length;i++) {
      var ramp=RIVERS[i].ramp;
      if(z>=ramp.z0&&z<=ramp.z1)return ramp.h*(z-ramp.z0)/(ramp.z1-ramp.z0);
    }
    return 0;
  }

  function drawRoad() {
    var s = 55, z0 = Math.floor((cam.z - 120) / s) * s, z, i = 0;
    for (z = z0; z < cam.z + VIEW; z += s) {
      if (waterAt(z,z+s)) { i++; continue; }
      var yA = rampH(z), yB = rampH(z + s);
      var m = ((z / s) | 0) & 1 ? MAT.roadA : MAT.roadB;
      addPoly([-HW, yA, z, HW, yA, z, HW, yB, z + s, -HW, yB, z + s], m);
      addPoly([-HW - 70, yA - 4, z, -HW, yA, z, -HW, yB, z + s, -HW - 70, yB - 4, z + s], MAT.shoulder);
      addPoly([HW, yA, z, HW + 70, yA - 4, z, HW + 70, yB - 4, z + s, HW, yB, z + s], MAT.shoulder);
      if ((((z / s) | 0) & 3) === 0 && yA < 0.5) {          /* 道しるべの石 */
        box(-HW - 26, 0, z, 8, 26, 8, 0, MAT.stone, MAT.stone);
        box(HW + 26, 0, z, 8, 26, 8, 0, MAT.stone, MAT.stone);
      }
      if (yA > 0.5) {                                   /* 踏切り台の横っ腹 */
        addPoly([-HW, yA, z, -HW, 0, z, -HW, 0, z + s, -HW, yB, z + s], MAT.edge);
        addPoly([HW, yA, z, HW, yB, z + s, HW, 0, z + s, HW, 0, z], MAT.edge);
      }
      i++;
    }
    /* 川と、流された橋の名残り */
    RIVERS.forEach(function(RIVER) {
    if (cam.z > RIVER.z0 - VIEW && cam.z < RIVER.z1 + 400) {
      var cx = cam.x;
      addPoly([cx - 2600, -34, RIVER.z0, cx + 2600, -34, RIVER.z0,
               cx + 2600, -34, RIVER.z1, cx - 2600, -34, RIVER.z1], MAT.water);
      var k;
      for (k = 0; k < 3; k++) {
        var zz = RIVER.z0 + 40 + k * 72;
        addPoly([cx - 2600, -32, zz, cx + 2600, -32, zz, cx + 2600, -32, zz + 22, cx - 2600, -32, zz + 22], MAT.water2);
      }
      for (k = 0; k < 5; k++) {                          /* 折れた橋杭 */
        var px = -HW + 20 + k * (HW * 2 - 40) / 4;

    village:[
      "メロスには政治がわからぬ。けれども、友を置き去りにして平気でいられるほど、鈍い心の持主ではなかった。",
      "村の屋根が、後ろへ後ろへと流れてゆく。妹の笑顔を思い出しかけて、メロスは強く首を振った。いまは、ただ走るのだ。",
      "友は私を信じた。なんの疑いも持たず、この私のために縄を受けた。そのことだけが、エンジンよりも強く胸を打っていた。"
    ],
    forest:[
      "木々のあいだから、細い光が幾筋も射した。車は光と影を縫い、鳥の群れを驚かせながら、山道を下っていった。",
      "車軸がきしんだ。古い車である。メロスはハンドルを撫でた。頼む。今日だけは、私を裏切ってくれるな。",
      "急げ、メロス。おくれてはならぬ。自分へ言いきかせる声は、車輪の響きにまじって、幾度も胸へ帰って来た。",
      "谷底から水の音が聞こえた。いつもより太く、荒い音であった。メロスは眉をひそめたが、足をゆるめはしなかった。"
    ],
    river:["水しぶきが窓を白くした。行く手は見えぬ。それでも、信じて踏むほかには、道は無かった。"],
    bandit:[
      "男たちの口が何事か叫んだ。金ならば無い。命も、いまは私だけのものでは無い。メロスは低く身を伏せた。",
      "こん棒の影が車窓をかすめた。ガラスの震える音がした。けれども、友の待つ刑場は、この道の先にある。",
      "背後の怒号は、たちまち小さくなった。メロスは歯をくいしばった。まだ陽はある。まだ、間に合う。"
    ],
    waste:[
      "喉が焼けた。息をするたびに、熱い砂を呑む心地がした。一瞬、すべてを投げ出して眠りたいと思った。メロスは、その一瞬を恥じた。",
      "ああ、私は信じられている。疑われていない。その思いが、萎えかけた腕を、もう一度ハンドルへ結びつけた。",
      "野原には酒宴の輪があった。車がその傍らを駈け抜けると、杯が止まり、人々は口をあけた。犬が吠えながら、土煙を追って来た。",
      "旅人の一団を颯っと追い越した。「いまごろは、あの男も。」不吉な声の続きを、風がさらった。ああ、その男のために、私は走っているのだ。"
    ],
    town:[
      "塔楼は夕陽を受けて、燃えるように光っていた。車輪は石畳を打った。その響きは、街じゅうの扉を叩くようであった。",
      "宴席の人々が顔を上げた。皿が鳴り、葡萄酒がこぼれた。メロスの車は黒い風となり、驚きの声さえ、はるか後ろへ置き去りにした。",
      "小さな水路を車輪が跳ねた。沈んでゆく太陽より、十倍も早く走りたい。メロスは胸をハンドルへ押しつけ、なおも踏んだ。",
      "風態などは、どうでもよかった。乱れた髪も、土にまみれた頬も。愛と誠の力を、いまこそ知らせてやるがよい。",
      "人々は軒下へ身を寄せた。大通りは、まっすぐ刑場へ続いていた。メロスの眼には、もはやその一本の道しか映らなかった。",
      "赤い光が車窓を満たした。太陽よ、しばし待て。友の胸がまだ温かいうちに、私はあの腕へ飛びこまねばならぬ。"
    ],
    goal:["友よ、私はここにいる。車の響きよ、この声より先に、あの人の耳へ届いてくれ。"]
  };
  function updateStory(dt) {
    storyClock+=dt;
    if(storyClock<.2 || narr.s.length-narr.shown>35)return;
    var section=sectionAt(car.z), lines=STORY[section]||(section==='sprint'?STORY.town:STORY.goal);
    var index=storyIndex[section]||0;
    if(index<lines.length){say(lines[index],0);storyIndex[section]=index+1;storyClock=0;}
    else if(storyClock>.6) {
      var refrain=["車輪は回った。道は続いた。メロスは、友の名を胸の内で呼びながら走った。","一刻が惜しかった。風が頬を打っても、メロスはまばたきさえ惜しんで、前を見た。","まだ走れる。そう思うたび、メロスはハンドルを握り直した。待っていてくれ。私は帰る。"][index%3];
      say(refrain,0);storyIndex[section]=index+1;storyClock=0;
    }
  }
  function updateCompanion(dt) {
    if(car.z<RIVERS[4].z1)return;
    if(!philo.active) {
      philo.active=true;philo.side=car.x>0?-1:1;philo.enter=0;philo.stage=1;
      say("その時、別のエンジンの音が迫った。青い車が傍らへ並ぶ。フィロストラトスであった。青年は窓から身を乗り出した。「メロスさま、もう、むだでございます。」",4);
    }
    philo.enter=Math.min(1,philo.enter+dt*.7);
    philo.x=car.x+philo.side*65;philo.z=car.z-120+philo.enter*135;
    philo.y=car.y;philo.a=car.a;philo.v=car.v;philo.roll=car.roll*.65;philo.wheelSpin=car.wheelSpin;
    if(philo.stage===1 && car.z>GOALZ-6800) {
      philo.stage=2;say("「まだ陽は沈まぬ。」メロスは叫んだ。フィロストラトスの車は、必死に食い下がった。「あの方は、あなたを信じておいでです。最後まで、少しも疑わずに。」",4);
    }
    if(philo.stage===2 && car.z>GOALZ-3400) {
      philo.stage=3;say("「だから、走るのだ。」メロスはそれだけ答えた。青年の声が風にちぎれた。二台の車は、長い影を引きずりながら、刑場への道を駈けた。",4);
    }
  }
  function wrapLines(str, maxw) {
    var out=[],line="", noStart="、。，．！？!?）］｝〉》」』】ーぁぃぅぇぉっゃゅょ", noEnd="（［｛〈《「『【";
    for (var i=0;i<str.length;i++) {
      var ch=str[i];
      if(ch === "\n") { out.push(line); line=""; continue; }
      if(line && ctx.measureText(line+ch).width>maxw && noStart.indexOf(ch)<0) {
        var last=line.slice(-1);
        if(noEnd.indexOf(last)>=0) {out.push(line.slice(0,-1));line=last;}
        else {out.push(line);line="";}
      }
      line+=ch;
    }
    if(line)out.push(line);
    return out;
  }
  function drawText() {
    ctx.save();
    ctx.fillStyle="#fffdf8";ctx.fillRect(0,0,W,TEXTH);
    ctx.fillStyle="#ded8ce";ctx.fillRect(0,TEXTH-1,W,1);
    /* 帯の高さから字の大きさと入る行数を出す。画面の形が変わっても、
       行が半分だけ見えるような切れ方をしないようにする */
    var fs = Math.max(15, Math.min(22, Math.round(TEXTH * 0.089)));
    var leading = Math.round(fs * 1.48);
    var titleSpace = state === ST.READY ? Math.round(TEXTH * 0.29) : 0;
    var body = "400 " + fs + "px 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif";
    ctx.font = body;
    ctx.fillStyle="#25221e";ctx.textAlign="left";ctx.textBaseline="alphabetic";
    if (narr.layoutAt !== narr.shown || narr.wrapAt !== fs) {
      narr.lines = wrapLines(narr.s.slice(0, narr.shown), W - 76);
      narr.layoutAt = narr.shown;
      narr.wrapAt = fs;
    }
    if (titleSpace) {
      ctx.save();
      ctx.font = "700 " + Math.round(TEXTH * 0.15) + "px 'Yu Mincho','Hiragino Mincho ProN',serif";
      ctx.textAlign = "center";
      ctx.fillText("車で走れメロス", W / 2, Math.round(titleSpace * 0.68));
      ctx.restore();
      ctx.font = body;
    }
    var top = titleSpace + 10, avail = TEXTH - top - 10;
    var rows = Math.max(1, Math.floor(avail / leading));
    var target = Math.max(0, narr.lines.length - rows) * leading;
    narr.scroll += (target - narr.scroll) * (1 - Math.exp(-32 * narr.dt));
    if (Math.abs(target - narr.scroll) < .05) narr.scroll = target;
    ctx.beginPath(); ctx.rect(26, top - 4, W - 52, rows * leading + 8); ctx.clip();
    var first = Math.max(0, Math.floor(narr.scroll / leading) - 1);
    for (var i = first; i < narr.lines.length; i++) {
      var y = top + leading * 0.78 + i * leading - narr.scroll;
      if (y > top + avail + leading) break;
      ctx.fillText(narr.lines[i], 32, y);
    }
    ctx.restore();
  }


  function drawButton(b) {
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    var hw = b.w / 2, hh = b.h / 2, rad = hh;
    ctx.beginPath();
    ctx.moveTo(-hw + rad, -hh);
    ctx.arcTo(hw, -hh, hw, hh, rad); ctx.arcTo(hw, hh, -hw, hh, rad);
    ctx.arcTo(-hw, hh, -hw, -hh, rad); ctx.arcTo(-hw, -hh, hw, -hh, rad);
    ctx.closePath();
    ctx.fillStyle = "#fffdf6"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#2a2426"; ctx.stroke();
    ctx.fillStyle = "#2a2426";
    ctx.font = "800 24px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  function drawDriverName(vehicle, name) {
    toCam(vehicle.x, vehicle.y + 37, vehicle.z);
    if (_cz <= NEAR) return;
    var scale = FOCAL / _cz;
    var x = W / 2 + _cx * scale, y = CY - _cy * scale;
    if (x < -100 || x > W + 100 || y < 0 || y > VH) return;
    ctx.save();
    ctx.font = "600 14px 'Yu Gothic', sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var width = ctx.measureText(name).width + 20;
    x = Math.max(width / 2 + 6, Math.min(W - width / 2 - 6, x));
    ctx.fillStyle = 'rgba(30,28,29,.76)';
    ctx.fillRect(x - width / 2, y - 12, width, 24);
    ctx.fillStyle = '#fffdf6';
    ctx.fillText(name, x, y);
    ctx.restore();
  }
  /* 排気。マフラーから後ろへ吐いて、膨らみながら消える */
  var puffs = [], puffT = 0;
  function updatePuffs(dt) {
    var i, p;
    for (i = puffs.length - 1; i >= 0; i--) {
      p = puffs[i];
      p.life += dt;
      if (p.life >= p.max) { puffs.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.vy -= 9 * dt;
      p.r += 19 * dt;
    }
    if (state !== ST.PLAY || car.air) return;
    puffT -= dt;
    var span = car.boost > 0 ? 0.018 : 0.028 + 0.05 * (1 - Math.min(1, car.v / 430));
    var guard = 0;
    while (puffT <= 0 && guard++ < 4) {
      puffT += span;
      var sa = Math.sin(car.a), ca = Math.cos(car.a), side = (puffs.length & 1 ? 1 : -1) * 7;
      puffs.push({
        x: car.x + side * ca - 25 * sa, y: car.y + 7, z: car.z - side * sa - 25 * ca,
        vx: -sa * 55 + (Math.random() - 0.5) * 26,
        vy: 14 + Math.random() * 20,
        vz: -ca * 55 - Math.random() * 26,
        r: 3 + Math.random() * 3, life: 0, max: 0.55 + Math.random() * 0.45,
        dark: car.boost > 0
      });
      if (puffs.length > 70) puffs.shift();
    }
  }
  function drawPuffs() {
    if (!puffs.length) return;
    ctx.save();
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i], f = p.life / p.max;
      toCam(p.x, p.y, p.z);
      if (_cz <= NEAR) continue;
      var k = FOCAL / _cz, sx = W / 2 + _cx * k, sy = CY - _cy * k, r = p.r * k;
      if (r < 0.5 || sx < -r || sx > W + r || sy < -r || sy > VH + r) continue;
      var a = (1 - f) * (1 - f) * (p.dark ? 0.3 : 0.2);
      ctx.fillStyle = (windMix > 0.02 || p.dark)
        ? "rgba(46,42,52," + a + ")" : "rgba(196,188,176," + a + ")";
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.284); ctx.fill();
    }
    ctx.restore();
  }

  /* 走っている間の加速線。速いほど本数と長さが増え、消失点から外へ流れる */
  var SPD = [];
  (function () {
    for (var i = 0; i < 30; i++) {
      SPD.push({ a: (i / 30) * Math.PI * 2 + (i % 3) * 0.21, o: (i * 0.3137) % 1, w: 1 + (i % 3) * 0.8 });
    }
  })();
  function drawSpeedLines() {
    if (state !== ST.PLAY) return;
    var t = (car.v - 240) / 300;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    if (t < 0.02) return;
    toCam(car.x, car.y + 10, car.z + 60000);          /* 進む先が消失点 */
    if (_cz <= NEAR) return;
    var k = FOCAL / _cz, vx = W / 2 + _cx * k, vy = CY - _cy * k;
    var far = Math.max(W, VH) * 0.95;
    var ink = windMix > 0.02;
    ctx.save();
    ctx.lineCap = "round";
    for (var i = 0; i < SPD.length; i++) {
      var d = SPD[i];
      var ph = (tick * (0.8 + car.v / 620) + d.o) % 1;
      var r0 = far * (0.1 + ph * ph * 0.95);
      var len = far * (0.05 + ph * 0.2) * (0.45 + t * 0.75);
      var ca = Math.cos(d.a), sa = Math.sin(d.a) * 0.72;   /* タテ画面なので少し潰す */
      var a = t * (0.5 - Math.abs(ph - 0.6)) * 0.9;
      if (a <= 0.005) continue;
      ctx.strokeStyle = ink ? "rgba(22,20,30," + (a * 0.9) + ")"
                            : "rgba(255,247,232," + (a * 0.95) + ")";
      ctx.lineWidth = d.w * (0.7 + t);
      ctx.beginPath();
      ctx.moveTo(vx + ca * r0, vy + sa * r0);
      ctx.lineTo(vx + ca * (r0 + len), vy + sa * (r0 + len));
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawWind() {
    if(!windMode || state!==ST.PLAY)return;
    ctx.save();
    var strength=windMix*Math.min(1,car.v/620);
    var edge=ctx.createLinearGradient(0,0,W,0);
    edge.addColorStop(0,'rgba(18,17,27,'+(.32*strength)+')');
    edge.addColorStop(.24,'rgba(18,17,27,0)');
    edge.addColorStop(.76,'rgba(18,17,27,0)');
    edge.addColorStop(1,'rgba(18,17,27,'+(.32*strength)+')');
    ctx.fillStyle=edge;ctx.fillRect(0,0,W,VH);
    // Ink-like wakes extend backwards from the rear wheels.
    for(var s=-1;s<=1;s+=2) {
      toCam(car.x+s*14,car.y+5,car.z-28);
      if(_cz<=NEAR)continue;
      var scale=FOCAL/_cz,x=W/2+_cx*scale,y=CY-_cy*scale;
      ctx.beginPath();ctx.moveTo(x,y);
      ctx.bezierCurveTo(x+s*18,y+45,x+s*(35+Math.sin(tick*8)*8),VH-35,x+s*65,VH+20);
      ctx.lineTo(x+s*34,VH+20);
      ctx.bezierCurveTo(x+s*24,VH-30,x+s*7,y+30,x,y);
      ctx.fillStyle='rgba(22,22,30,'+(.28*strength)+')';ctx.fill();
    }
    for(var i=0;i<26;i++) {
      var side=i%2?-1:1,phase=(tick*(1.25+car.v/700)+i*.137)%1;
      var x=W/2+side*(W*.22+phase*W*.37),y=VH*.15+phase*VH*.78;
      ctx.strokeStyle='rgba(18,19,28,'+((.12+phase*.32)*strength)+')';
      ctx.lineWidth=1+(i%3)*.7;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+side*(25+phase*38),y+45+phase*65);ctx.stroke();
    }
    ctx.restore();
  }  var tick = 0;
  function draw() {
    ctx.save();
    ctx.translate(0,TEXTH);
    ctx.beginPath(); ctx.rect(0, 0, W, VH); ctx.clip();
    drawSky();
    drawRoad(); drawProps(); drawRocks(); drawActors(); drawGoal();
    drawKing();
    drawCar();
    if(philo.active)drawCar(philo);
    drawPolys();
    drawPuffs();
    drawDriverName(car, 'メロス');
    if(philo.active)drawDriverName(philo, 'フィロストラトス');
    drawSpeedLines();
    drawWind();
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,246,226," + Math.min(0.7, flash) + ")";
      ctx.fillRect(0, 0, W, VH);
    }
    ctx.restore();

    drawText();

    if (state === ST.READY) {
      var pp = 0.5 + 0.5 * Math.sin(tick * 4);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.45 * pp;
      ctx.fillStyle = "#c8452e";
      ctx.translate(W / 2, TEXTH + VH * 0.44 - pp * 10);
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(26, 14); ctx.lineTo(0, 2); ctx.lineTo(-26, 14);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

  }

  layout();
  buildPalette();
  newRun();

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    tick += dt;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
