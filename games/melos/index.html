<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>車で走れメロス</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2331; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; background: #cfe0e6; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="../share.js"></script>
<script>
/* 車で走れメロス
   村から刑場までの帰り道を、日が沈むまでに走りきる。
   道は一本道。岩や倒木はよける。山賊と市中の人々は跳ね飛ばせる。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");

  var W = 540, H = 960;                 /* タテ画面 */
  wrap.style.aspectRatio = W + " / " + H;
  wrap.style.width = "min(100%, calc(100vh * " + W + " / " + H + "))";
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* =====================================================================
     帰り道。x は横、z は進む向き。
     ===================================================================== */
  var HW = 140;                              /* 道の半分の幅 */
  var GOALZ = 16200;                         /* 刑場 */
  var RIVER = { z0: 5620, z1: 5910 };        /* 橋は流されている */
  var RAMP = { z0: 5410, z1: 5550, h: 42 };  /* かわりの踏切り台 */
  var SPRING = { x: 0, z: 10250 };           /* 泉。触れると生き返る */
  var LIMIT = 70;                            /* 日没まで（秒） */

  /* 場面の切れ目 */
  var SEC = [
    { z: 1900, k: "village" },
    { z: 5300, k: "forest" },
    { z: 5980, k: "river" },
    { z: 8800, k: "bandit" },
    { z: 11700, k: "waste" },
    { z: 15700, k: "town" },
    { z: 99999, k: "goal" }
  ];
  function sectionAt(z) {
    for (var i = 0; i < SEC.length; i++) if (z < SEC[i].z) return SEC[i].k;
    return "goal";
  }

  /* 毎回おなじ景色になるよう、決まった順で出る乱数を使う */
  var seed = 20260910;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function between(a, b) { return a + rnd() * (b - a); }

  /* =====================================================================
     道ばたの飾り・よける障害物・跳ね飛ばせる人
     ===================================================================== */
  var props = [];      /* 飾り。ぶつからない */
  var rocks = [];      /* 岩と倒木。ぶつかると止まる */
  var actors = [];     /* 山賊と市中の人々。跳ね飛ばせる */

  function inRiver(z) { return z > RIVER.z0 - 120 && z < RIVER.z1 + 90; }

  (function build() {
    var z, k, n, side;

    for (z = -400; z < GOALZ + 700; z += 52) {          /* 道ばた */
      if (inRiver(z)) continue;
      k = sectionAt(z);
      for (n = 0; n < 2; n++) {
        if (rnd() > 0.66) continue;
        side = rnd() < 0.5 ? -1 : 1;
        var x = side * (HW + between(40, 620));
        var kind = k === "village" ? (rnd() < 0.5 ? "house" : "tree")
                 : k === "forest" ? (rnd() < 0.9 ? "tree" : "rock")
                 : k === "river" ? "rock"
                 : k === "bandit" ? (rnd() < 0.55 ? "tree" : "rock")
                 : k === "waste" ? (rnd() < 0.7 ? "rock" : "bush")
                 : (rnd() < 0.45 ? "house" : "column");
        props.push({ k: kind, x: x, z: z + between(-20, 20), s: between(0.7, 1.5), c: rnd() });
      }
    }

    for (z = 2300; z < 5250; z += between(190, 330)) {   /* 林の倒木 */
      if (inRiver(z)) continue;
      var lx = between(-HW + 60, HW - 60), ll = between(120, 230);
      rocks.push({ k: "log", x: lx, z: z, r: ll / 2, w: 26 });
    }
    for (z = 6100; z < 8700; z += between(150, 260)) {   /* 山賊の待ち伏せ */
      var m = 1 + (rnd() < 0.55 ? 1 : 0) + (rnd() < 0.3 ? 1 : 0);
      for (n = 0; n < m; n++) actors.push(mkActor("bandit", between(-HW + 24, HW - 24), z + between(-40, 40)));
      if (rnd() < 0.4) rocks.push({ k: "rock", x: between(-HW + 40, HW - 40), z: z + between(60, 130), r: between(28, 40), w: 0 });
    }
    for (z = 8900; z < 11650; z += between(105, 190)) {  /* 荒野の岩 */
      rocks.push({ k: "rock", x: between(-HW + 34, HW - 34), z: z, r: between(26, 42), w: 0 });
      if (rnd() < 0.35) rocks.push({ k: "rock", x: between(-HW + 34, HW - 34), z: z + between(50, 110), r: between(26, 40), w: 0 });
    }
    for (z = 11800; z < GOALZ - 120; z += between(52, 104)) {  /* 市中の人々 */
      var mm = 1 + (rnd() < 0.7 ? 1 : 0) + (rnd() < 0.45 ? 1 : 0);
      for (n = 0; n < mm; n++) actors.push(mkActor("citizen", between(-HW + 18, HW - 18), z + between(-30, 30)));
      if (rnd() < 0.22) rocks.push({ k: "cart", x: between(-HW + 50, HW - 50), z: z + between(40, 90), r: 36, w: 26 });
    }
    for (z = 11800; z < GOALZ; z += 46) {                /* 沿道で見ている人 */
      side = rnd() < 0.5 ? -1 : 1;
      if (rnd() < 0.8) actors.push(mkActor("citizen", side * (HW + between(10, 90)), z + between(-20, 20)));
    }
  })();

  function mkActor(k, x, z) {
    return { k: k, x: x, z: z, y: 0, a: rnd() * 6.28, vx: 0, vy: 0, vz: 0,
             spin: 0, hit: 0, c: rnd(), h: between(0.9, 1.1) };
  }

  /* =====================================================================
     色。日が傾くにつれて全体が赤く、暗くなる
     ===================================================================== */
  var SPEC = {
    roadA: "#ab9480", roadB: "#9c8470", edge: "#8a725d", shoulder: "#6f7546", stone: "#cfc6b0",
    rock: "#8e8a83", rockTop: "#a5a099", log: "#6b543d", cart: "#7d6242",
    trunk: "#5c4632", leaf: "#4d6b3e", leaf2: "#5c7a48", bush: "#7a7a4e",
    wall: "#d8cdb4", wall2: "#c2b69c", roof: "#a5553f", column: "#e0d8c4",
    skin: "#c9a07e", bandit: "#5b4a3f", bandit2: "#7a3f34", cloth: "#d9d2c2",
    cloth2: "#b8523f", cloth3: "#4e6a86", cloth4: "#c08a3e",
    body: "#c8452e", body2: "#a8351f", body3: "#8a2a17", roofc: "#f0e6d2",
    glass: "#33363d", tire: "#1b1719", shadow: "#4a4038",
    banner: "#b8332a", water: "#5d6b6a", water2: "#6e7c78"
  };
  var MAT = {}, FOGC = [206, 218, 208], duskT = 0, paletteAt = -9;
  function hx(s) { return [parseInt(s.substr(1, 2), 16), parseInt(s.substr(3, 2), 16), parseInt(s.substr(5, 2), 16)]; }
  function dusk(c) {
    var t = duskT;
    return [c[0] * (1 - 0.42 * t) + 96 * t, c[1] * (1 - 0.55 * t) + 54 * t, c[2] * (1 - 0.5 * t) + 58 * t];
  }
  function buildPalette() {
    for (var k in SPEC) {
      var c = dusk(hx(SPEC[k])), a = [], i, t;
      for (i = 0; i < 12; i++) {
        t = i / 11 * 0.95;
        a.push("rgb(" + Math.round(c[0] + (FOGC[0] - c[0]) * t) + "," +
                        Math.round(c[1] + (FOGC[1] - c[1]) * t) + "," +
                        Math.round(c[2] + (FOGC[2] - c[2]) * t) + ")");
      }
      MAT[k] = a;
    }
  }
  var FOG0 = 520, FOG1 = 2100;
  function shade(mat, d) {
    var t = (d - FOG0) / (FOG1 - FOG0);
    return mat[t <= 0 ? 0 : t >= 1 ? 11 : (t * 11) | 0];
  }

  /* =====================================================================
     3D。カメラの後ろは切り、遠い順に塗る
     ===================================================================== */
  var cam = { x: 0, y: 84, z: 0, yaw: 0, pitch: 0.33 };
  var FOCAL = (H / 2) / Math.tan(0.55), NEAR = 6;
  var cyaw = 1, syaw = 0, cpit = 1, spit = 0;
  function camSync() {
    cyaw = Math.cos(cam.yaw); syaw = Math.sin(cam.yaw);
    cpit = Math.cos(cam.pitch); spit = Math.sin(cam.pitch);
  }
  var _cx, _cy, _cz;
  function toCam(x, y, z) {
    var dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    var rx = dx * cyaw - dz * syaw, rz = dx * syaw + dz * cyaw;
    _cx = rx; _cy = dy * cpit + rz * spit; _cz = -dy * spit + rz * cpit;
  }

  var polys = [], polyN = 0;
  function addPoly(v, mat) {
    var n = v.length / 3, i, cp = [], d = 0;
    for (i = 0; i < n; i++) { toCam(v[i * 3], v[i * 3 + 1], v[i * 3 + 2]); cp.push(_cx, _cy, _cz); }
    var out = [];
    for (i = 0; i < n; i++) {
      var a = i * 3, b = ((i + 1) % n) * 3;
      var az = cp[a + 2], bz = cp[b + 2], t;
      if (az > NEAR) out.push(cp[a], cp[a + 1], az);
      if ((az > NEAR) !== (bz > NEAR)) {
        t = (NEAR - az) / (bz - az);
        out.push(cp[a] + (cp[b] - cp[a]) * t, cp[a + 1] + (cp[b + 1] - cp[a + 1]) * t, NEAR);
      }
    }
    if (out.length < 9) return;
    for (i = 2; i < out.length; i += 3) d += out[i];
    d /= (out.length / 3);
    if (d > FOG1 * 1.2) return;
    var p = polys[polyN];
    if (!p) p = polys[polyN] = { v: null, d: 0, c: "" };
    p.v = out; p.d = d; p.c = shade(mat, d);
    polyN++;
  }
  function box(x, y, z, sx, sy, sz, ang, top, side, front) {
    var s = Math.sin(ang || 0), c = Math.cos(ang || 0);
    function P(lx, ly, lz) { return [x + lx * c + lz * s, y + ly, z - lx * s + lz * c]; }
    var A = P(-sx, sy, -sz), B = P(sx, sy, -sz), C = P(sx, sy, sz), D = P(-sx, sy, sz);
    var a = P(-sx, 0, -sz), b = P(sx, 0, -sz), c2 = P(sx, 0, sz), d2 = P(-sx, 0, sz);
    function Q(p1, p2, p3, p4, m) {
      addPoly([p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2], p4[0], p4[1], p4[2]], m);
    }
    Q(A, B, C, D, top);
    Q(d2, c2, C, D, front || side);
    Q(b, a, A, B, front || side);
    Q(a, d2, D, A, side);
    Q(c2, b, B, C, side);
  }
  function drawPolys() {
    var list = polys.slice(0, polyN);
    list.sort(function (a, b) { return b.d - a.d; });
    for (var i = 0; i < list.length; i++) {
      var v = list[i].v, n = v.length / 3, j;
      ctx.beginPath();
      for (j = 0; j < n; j++) {
        var iz = FOCAL / v[j * 3 + 2];
        var sx = W / 2 + v[j * 3] * iz, sy = H / 2 - v[j * 3 + 1] * iz;
        if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.fillStyle = list[i].c;
      ctx.fill();
    }
    polyN = 0;
  }

  /* 手前から順に見られるよう、z で並べておく */
  function byZ(a, b) { return a.z - b.z; }
  props.sort(byZ); rocks.sort(byZ); actors.sort(byZ);
  function firstAt(arr, z) {
    var lo = 0, hi = arr.length, m;
    while (lo < hi) { m = (lo + hi) >> 1; if (arr[m].z < z) lo = m + 1; else hi = m; }
    return lo;
  }

  var VIEW = 2200;
  function rampH(z) {
    if (z < RAMP.z0 || z > RAMP.z1) return 0;
    return RAMP.h * (z - RAMP.z0) / (RAMP.z1 - RAMP.z0);
  }

  function drawRoad() {
    var s = 55, z0 = Math.floor((cam.z - 120) / s) * s, z, i = 0;
    for (z = z0; z < cam.z + VIEW; z += s) {
      if (z + s > RIVER.z0 && z < RIVER.z1) { i++; continue; }
      var yA = rampH(z), yB = rampH(z + s);
      var m = ((z / s) | 0) & 1 ? MAT.roadA : MAT.roadB;
      addPoly([-HW, yA, z, HW, yA, z, HW, yB, z + s, -HW, yB, z + s], m);
      addPoly([-HW - 70, yA - 4, z, -HW, yA, z, -HW, yB, z + s, -HW - 70, yB - 4, z + s], MAT.shoulder);
      addPoly([HW, yA, z, HW + 70, yA - 4, z, HW + 70, yB - 4, z + s, HW, yB, z + s], MAT.shoulder);
      if ((((z / s) | 0) & 3) === 0 && yA < 0.5) {          /* 道しるべの石 */
        box(-HW - 26, 0, z, 8, 26, 8, 0, MAT.stone, MAT.stone);
        box(HW + 26, 0, z, 8, 26, 8, 0, MAT.stone, MAT.stone);
      }
      if (yA > 0.5) {                                   /* 踏切り台の横っ腹 */
        addPoly([-HW, yA, z, -HW, 0, z, -HW, 0, z + s, -HW, yB, z + s], MAT.edge);
        addPoly([HW, yA, z, HW, yB, z + s, HW, 0, z + s, HW, 0, z], MAT.edge);
      }
      i++;
    }
    /* 川と、流された橋の名残り */
    if (cam.z > RIVER.z0 - VIEW && cam.z < RIVER.z1 + 400) {
      var cx = cam.x;
      addPoly([cx - 2600, -34, RIVER.z0, cx + 2600, -34, RIVER.z0,
               cx + 2600, -34, RIVER.z1, cx - 2600, -34, RIVER.z1], MAT.water);
      var k;
      for (k = 0; k < 3; k++) {
        var zz = RIVER.z0 + 40 + k * 72;
        addPoly([cx - 2600, -32, zz, cx + 2600, -32, zz, cx + 2600, -32, zz + 22, cx - 2600, -32, zz + 22], MAT.water2);
      }
      for (k = 0; k < 5; k++) {                          /* 折れた橋杭 */
        var px = -HW + 20 + k * (HW * 2 - 40) / 4;
        box(px + ((k * 37) % 19) - 9, -34, RIVER.z0 + 60 + ((k * 53) % 120), 9, 26 + ((k * 31) % 26), 9, 0.2 * k, MAT.log, MAT.log);
      }
      box(0, -34, RIVER.z0 - 4, HW, 34, 16, 0, MAT.log, MAT.log);
      box(0, -34, RIVER.z1 + 4, HW, 34, 16, 0, MAT.log, MAT.log);
    }
    /* 泉 */
    if (Math.abs(SPRING.z - cam.z) < VIEW) {
      addPoly([SPRING.x - 54, 1, SPRING.z - 54, SPRING.x + 54, 1, SPRING.z - 54,
               SPRING.x + 54, 1, SPRING.z + 54, SPRING.x - 54, 1, SPRING.z + 54], MAT.water2);
    }
  }

  function drawProps() {
    var i = firstAt(props, cam.z - 160), p;
    for (; i < props.length; i++) {
      p = props[i];
      if (p.z > cam.z + VIEW) break;
      if (Math.abs(p.x - cam.x) > 1100) continue;
      var s = p.s;
      if (p.k === "tree") {
        box(p.x, 0, p.z, 8 * s, 42 * s, 8 * s, 0, MAT.trunk, MAT.trunk);
        box(p.x, 38 * s, p.z, 34 * s, 44 * s, 34 * s, p.c * 3, p.c < 0.5 ? MAT.leaf : MAT.leaf2, MAT.leaf);
        box(p.x, 74 * s, p.z, 22 * s, 30 * s, 22 * s, p.c * 5, MAT.leaf2, MAT.leaf);
      } else if (p.k === "house") {
        box(p.x, 0, p.z, 56 * s, 54 * s, 46 * s, p.c, MAT.wall2, MAT.wall);
        box(p.x, 54 * s, p.z, 62 * s, 26 * s, 52 * s, p.c, MAT.roof, MAT.roof);
      } else if (p.k === "column") {
        box(p.x, 0, p.z, 13 * s, 96 * s, 13 * s, 0, MAT.column, MAT.column);
        box(p.x, 96 * s, p.z, 18 * s, 10 * s, 18 * s, 0, MAT.stone, MAT.column);
      } else if (p.k === "bush") {
        box(p.x, 0, p.z, 26 * s, 16 * s, 22 * s, p.c * 4, MAT.bush, MAT.bush);
      } else {
        box(p.x, 0, p.z, 26 * s, 22 * s, 24 * s, p.c * 4, MAT.rockTop, MAT.rock);
      }
    }
  }

  function drawRocks() {
    var i = firstAt(rocks, cam.z - 160), r;
    for (; i < rocks.length; i++) {
      r = rocks[i];
      if (r.z > cam.z + VIEW) break;
      if (r.k === "log") {
        box(r.x, 0, r.z, r.r, 26, r.w, 0.05, MAT.log, MAT.log);
        box(r.x - r.r * 0.8, 0, r.z, 14, 30, 14, 0, MAT.trunk, MAT.trunk);
      } else if (r.k === "cart") {
        box(r.x, 15, r.z, r.r, 24, r.w, 0, MAT.cart, MAT.cart);
        box(r.x - r.r, 0, r.z, 8, 20, 20, 0, MAT.trunk, MAT.trunk);
        box(r.x + r.r, 0, r.z, 8, 20, 20, 0, MAT.trunk, MAT.trunk);
      } else {
        box(r.x, 0, r.z, r.r, r.r * 1.15, r.r * 0.92, r.x, MAT.rockTop, MAT.rock);
      }
    }
  }

  function actorCloth(a) {
    if (a.k === "bandit") return a.c < 0.5 ? MAT.bandit : MAT.bandit2;
    return a.c < 0.3 ? MAT.cloth : a.c < 0.55 ? MAT.cloth2 : a.c < 0.8 ? MAT.cloth3 : MAT.cloth4;
  }
  var FIG = 0.38;                                       /* 人の背丈。車に合わせてある */
  function drawFigure(a) {
    var cl = actorCloth(a), h = a.h * FIG;
    if (a.hit === 2) {                                  /* 倒れている */
      box(a.x, 0, a.z, 22 * FIG, 13 * FIG, 12 * FIG, a.a, cl, cl);
      box(a.x + Math.sin(a.a) * 26 * FIG, 0, a.z + Math.cos(a.a) * 26 * FIG, 9 * FIG, 12 * FIG, 9 * FIG, a.a, MAT.skin, MAT.skin);
      return;
    }
    box(a.x, a.y, a.z, 11 * FIG, 26 * h, 9 * FIG, a.a, MAT.bandit, MAT.bandit);
    box(a.x, a.y + 24 * h, a.z, 14 * FIG, 30 * h, 11 * FIG, a.a, cl, cl);
    box(a.x, a.y + 54 * h, a.z, 9 * FIG, 15 * FIG, 9 * FIG, a.a, MAT.skin, MAT.skin);
    if (a.k === "bandit" && !a.hit) {
      box(a.x + Math.sin(a.a + 1.2) * 16 * FIG, a.y + 30 * h, a.z + Math.cos(a.a + 1.2) * 16 * FIG,
          4 * FIG, 34 * FIG, 4 * FIG, a.a, MAT.trunk, MAT.trunk);
    }
  }
  function drawActors() {
    var i = firstAt(actors, cam.z - 700), a;
    for (; i < actors.length; i++) {
      a = actors[i];
      if (a.hit === 1) continue;                        /* 飛んでいる者はあとでまとめて */
      if (a.z > cam.z + VIEW) break;
      if (Math.abs(a.x - cam.x) > 900) continue;
      drawFigure(a);
    }
    for (i = 0; i < flying.length; i++) drawFigure(flying[i]);
  }

  function drawGoal() {
    if (cam.z < GOALZ - VIEW) return;
    var x = 0, z = GOALZ;
    box(x, 0, z + 60, HW + 60, 12, 90, 0, MAT.stone, MAT.stone);
    box(x - HW + 10, 0, z, 11, 130, 11, 0, MAT.column, MAT.column);
    box(x + HW - 10, 0, z, 11, 130, 11, 0, MAT.column, MAT.column);
    box(x, 116, z, HW, 22, 10, 0, MAT.banner, MAT.banner);
    box(x, 12, z + 120, 4, 62, 4, 0, MAT.trunk, MAT.trunk);      /* はりつけの柱 */
    box(x, 56, z + 120, 22, 5, 4, 0, MAT.trunk, MAT.trunk);
    box(x, 32, z + 116, 5, 20, 4, 0, MAT.cloth, MAT.cloth);
    box(x, 52, z + 116, 4, 7, 4, 0, MAT.skin, MAT.skin);
  }

  /* ===== 車 ===== */
  var car = { x: 0, z: 0, y: 0, a: 0, v: 0, vy: 0, air: 0, roll: 0, shake: 0, boost: 0 };
  function drawCar() {
    var s = Math.sin(car.a), c = Math.cos(car.a), tilt = car.roll;
    function P(lx, ly, lz) {
      return [car.x + lx * c + lz * s, car.y + ly + lx * tilt * 0.9, car.z - lx * s + lz * c];
    }
    function Q(p1, p2, p3, p4, m) {
      addPoly([p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2], p4[0], p4[1], p4[2]], m);
    }
    var bw = 13, bl = 23, y0 = 5.5, y1 = 19, cy = 30;
    var A = P(-bw, y1, -bl), B = P(bw, y1, -bl), C = P(bw, y1, bl), D = P(-bw, y1, bl);
    var a = P(-bw, y0, -bl), b = P(bw, y0, -bl), c2 = P(bw, y0, bl), d2 = P(-bw, y0, bl);
    Q(A, B, C, D, MAT.body); Q(d2, c2, C, D, MAT.body2); Q(b, a, A, B, MAT.body3);
    Q(a, d2, D, A, MAT.body2); Q(c2, b, B, C, MAT.body2);
    var cw = 10.4, f = 9, r = -10;
    var E = P(-cw, cy, r), F = P(cw, cy, r), G = P(cw, cy, f), I = P(-cw, cy, f);
    var e = P(-cw, y1, r), f2 = P(cw, y1, r), g2 = P(cw, y1, f), i2 = P(-cw, y1, f);
    Q(E, F, G, I, MAT.roofc); Q(i2, g2, G, I, MAT.glass); Q(f2, e, E, F, MAT.glass);
    Q(e, i2, I, E, MAT.glass); Q(g2, f2, F, G, MAT.glass);
    [[-1, 12], [1, 12], [-1, -12], [1, -12]].forEach(function (w) {
      var xx = w[0] * (bw + 1), zz = w[1];
      Q(P(xx, 1, zz - 7), P(xx, 1, zz + 7), P(xx, 12, zz + 7), P(xx, 12, zz - 7), MAT.tire);
    });
    if (!car.air) Q(P(-bw, 0.5, -bl), P(bw, 0.5, -bl), P(bw, 0.5, bl), P(-bw, 0.5, bl), MAT.shadow);
  }

  /* ===== 空と地面 ===== */
  var dayT = 0;
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgb(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
  var SKY_TOP = [[122, 172, 214], [52, 44, 86]], SKY_HOR = [[218, 231, 225], [242, 150, 84]];
  var GRASS = [[118, 138, 90], [62, 52, 54]];
  function sunDir() {
    var el = 0.17 - dayT * 0.24, az = 0.28;
    return [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
  }
  function drawSky() {
    var hy = H / 2 - FOCAL * Math.tan(cam.pitch);
    hy = Math.max(0, Math.min(H, hy));
    var top = mix(SKY_TOP[0], SKY_TOP[1], duskT), hor = mix(SKY_HOR[0], SKY_HOR[1], duskT);
    var g1 = ctx.createLinearGradient(0, 0, 0, hy + 1);
    g1.addColorStop(0, rgb(top)); g1.addColorStop(1, rgb(hor));
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, hy);

    ctx.save();                                        /* 日は地平線の上だけ */
    ctx.beginPath(); ctx.rect(0, 0, W, hy); ctx.clip();
    var d = sunDir();
    toCam(cam.x + d[0] * 9000, cam.y + d[1] * 9000, cam.z + d[2] * 9000);
    if (_cz > NEAR) {
      var iz = FOCAL / _cz, sx = W / 2 + _cx * iz, sy = H / 2 - _cy * iz, rr = 40 + dayT * 26;
      var gg = ctx.createRadialGradient(sx, sy, rr * 0.5, sx, sy, rr * 3.4);
      var sc = mix([255, 246, 208], [255, 104, 58], duskT);
      gg.addColorStop(0, "rgba(" + (sc[0] | 0) + "," + (sc[1] | 0) + "," + (sc[2] | 0) + ",.85)");
      gg.addColorStop(1, "rgba(" + (sc[0] | 0) + "," + (sc[1] | 0) + "," + (sc[2] | 0) + ",0)");
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(sx, sy, rr * 3.4, 0, 6.284); ctx.fill();
      ctx.fillStyle = rgb(mix([255, 250, 226], [255, 122, 62], duskT));
      ctx.beginPath(); ctx.arc(sx, sy, rr, 0, 6.284); ctx.fill();
    }
    ctx.restore();

    var gr = mix(GRASS[0], GRASS[1], duskT);
    var g2 = ctx.createLinearGradient(0, hy, 0, H);
    g2.addColorStop(0, rgb(mix(gr, hor, 0.72)));
    g2.addColorStop(1, rgb(gr));
    ctx.fillStyle = g2; ctx.fillRect(0, hy, W, H - hy);

    var step = 300, far = 4200, k;                     /* 草の目印 */
    var bz = Math.round(cam.z / step) * step, bx = Math.round(cam.x / step) * step;
    ctx.strokeStyle = "rgba(0,0,0,.09)"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (k = -3; k <= 8; k++) seg(bx - far, 0, bz + k * step, bx + far, 0, bz + k * step);
    for (k = -7; k <= 7; k++) seg(bx + k * step, 0, bz - 400, bx + k * step, 0, bz + far);
    ctx.stroke();
  }
  function seg(x1, y1, z1, x2, y2, z2) {
    toCam(x1, y1, z1); var ax = _cx, ay = _cy, az = _cz;
    toCam(x2, y2, z2); var bx = _cx, by = _cy, bz = _cz;
    if (az <= NEAR && bz <= NEAR) return;
    if (az <= NEAR) { var t = (NEAR - az) / (bz - az); ax += (bx - ax) * t; ay += (by - ay) * t; az = NEAR; }
    else if (bz <= NEAR) { var u = (NEAR - bz) / (az - bz); bx += (ax - bx) * u; by += (ay - by) * u; bz = NEAR; }
    var ia = FOCAL / az, ib = FOCAL / bz;
    ctx.moveTo(W / 2 + ax * ia, H / 2 - ay * ia);
    ctx.lineTo(W / 2 + bx * ib, H / 2 - by * ib);
  }

  /* ===== 音 ===== */
  var actx = null, eng = null, engGain = null;
  function audioStart() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    eng = actx.createOscillator(); eng.type = "sawtooth"; eng.frequency.value = 60;
    var f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500; f.Q.value = 5;
    engGain = actx.createGain(); engGain.gain.value = 0;
    eng.connect(f); f.connect(engGain); engGain.connect(actx.destination); eng.start();
  }
  function engineSound(v, on) {
    if (!actx) return;
    eng.frequency.setTargetAtTime(48 + v * 0.2, actx.currentTime, 0.07);
    engGain.gain.setTargetAtTime(on ? 0.04 : 0, actx.currentTime, 0.12);
  }
  function blip(f0, f1, dur, type, vol) {
    if (!actx) return;
    var o = actx.createOscillator(), gg = actx.createGain(), t = actx.currentTime;
    o.type = type || "triangle";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gg.gain.setValueAtTime(vol || 0.13, t);
    gg.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gg); gg.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  document.addEventListener("visibilitychange", function () {
    if (!actx) return;
    if (document.hidden) { engGain.gain.value = 0; actx.suspend(); } else actx.resume();
  });

  /* ===== 進行 ===== */
  var ST = { READY: "ready", PLAY: "play", RESULT: "result" };
  var state, total, hits, ok, flash, steer, flying = [], springUsed;
  var MAXV = 430, ACC = 250, GRAV = 900;

  actors.forEach(function (a) { a.x0 = a.x; a.z0 = a.z; a.a0 = a.a; });

  function newRun() {
    state = ST.READY; total = 0; hits = 0; ok = false; flash = 0; steer = 0;
    springUsed = 0; flying.length = 0;
    car.x = 0; car.z = -280; car.y = 0; car.a = 0; car.v = 0; car.vy = 0;
    car.air = 0; car.roll = 0; car.shake = 0; car.boost = 0;
    cam.yaw = 0;
    actors.forEach(function (a) { a.hit = 0; a.y = 0; a.x = a.x0; a.z = a.z0; a.a = a.a0; a.spin = 0; });
    rocks.forEach(function (r) { r.done = 0; });
    dayT = 0; duskT = 0; paletteAt = -9;
    camSync();
  }

  function splash() {
    car.z = RAMP.z0 - 620; car.x = 0; car.y = 0; car.v = 0;
    car.air = 0; car.vy = 0; flash = 0.7;
    blip(220, 40, 0.6, "sine", 0.16);
  }

  function update(dt) {
    var tgt = 0;
    if (keyL && !keyR) tgt = -1; else if (keyR && !keyL) tgt = 1;
    else if (touchOn) tgt = Math.max(-1, Math.min(1, touchX / (W * 0.26)));
    if (tgt > -0.08 && tgt < 0.08) tgt = 0;
    steer += (tgt - steer) * Math.min(1, dt * 14);

    if (state === ST.PLAY) {
      total += dt;
      dayT = Math.min(1, total / LIMIT);
      duskT = dayT * dayT * (3 - 2 * dayT);
      if (Math.abs(dayT - paletteAt) > 0.004) {
        paletteAt = dayT;
        FOGC = mix(SKY_HOR[0], SKY_HOR[1], duskT);
        buildPalette();
      }

      var off = Math.abs(car.x) > HW;
      var lim = MAXV * (off ? 0.44 : 1 - 0.26 * Math.abs(steer));
      if (car.boost > 0) { car.boost -= dt; lim = MAXV * 1.24; }
      car.v += (car.v < lim ? ACC : -ACC * 2.4) * dt;
      if (car.v > lim && car.boost <= 0) car.v = Math.max(lim, car.v - ACC * 2.4 * dt);
      if (car.v < 0) car.v = 0;
      car.a += (steer * 0.58 - car.a) * Math.min(1, dt * 6);
      car.x += Math.sin(car.a) * car.v * dt;
      car.z += Math.cos(car.a) * car.v * dt;
      car.roll += (-steer * 0.15 - car.roll) * Math.min(1, dt * 8);
      if (off) car.shake = Math.max(car.shake, 0.12);

      if (car.air) {
        car.vy -= GRAV * dt; car.y += car.vy * dt;
        if (car.y <= 0) {
          car.y = 0; car.air = 0;
          if (car.z > RIVER.z0 && car.z < RIVER.z1) splash();
          else { car.shake = 0.55; blip(150, 70, 0.18, "square", 0.1); }
        }
      } else if (car.z >= RAMP.z0 && car.z <= RAMP.z1) {
        car.y = rampH(car.z);
      } else if (car.y > 0.5) {
        car.air = 1; car.vy = 240 + car.v * 0.62;
        blip(300, 620, 0.22, "triangle", 0.11);
      } else {
        car.y = 0;
        if (car.z > RIVER.z0 && car.z < RIVER.z1) splash();
      }

      if (!car.air) {                                  /* 岩・倒木・荷車 */
        var i = firstAt(rocks, car.z - 150), r, dx, dz;
        for (; i < rocks.length && rocks[i].z < car.z + 150; i++) {
          r = rocks[i];
          if (r.done) continue;
          dx = car.x - r.x; dz = car.z - r.z;
          if (Math.abs(dx) < r.r + 14 && Math.abs(dz) < (r.w || r.r) + 25) {
            r.done = 1; car.v *= 0.3; car.shake = 0.8;
            car.x += dx > 0 ? 20 : -20;
            blip(120, 50, 0.24, "square", 0.15);
          }
        }
        var j = firstAt(actors, car.z - 150), a;      /* 山賊・市中の人々 */
        for (; j < actors.length && actors[j].z < car.z + 160; j++) {
          a = actors[j];
          if (a.hit) continue;
          dx = car.x - a.x; dz = car.z - a.z;
          if (Math.abs(dx) < 19 && Math.abs(dz) < 29) {
            a.hit = 1; hits++;
            a.vz = Math.cos(car.a) * car.v * 0.8 + 60;
            a.vx = Math.sin(car.a) * car.v * 0.8 + (dx > 0 ? -1 : 1) * (110 + rnd() * 140);
            a.vy = 220 + rnd() * 160;
            a.spin = (rnd() - 0.5) * 20;
            flying.push(a);
            car.v -= a.k === "bandit" ? 34 : 17;
            if (car.v < 0) car.v = 0;
            car.shake = Math.max(car.shake, 0.3);
            blip(a.k === "bandit" ? 420 : 620, 90, 0.16, "square", 0.11);
          }
        }
        if (!springUsed && Math.abs(car.x - SPRING.x) < 80 && Math.abs(car.z - SPRING.z) < 80) {
          springUsed = 1; car.boost = 2.6; flash = 0.35;
          blip(520, 1180, 0.4, "triangle", 0.14);
        }
      }

      for (var k = flying.length - 1; k >= 0; k--) {
        var fa = flying[k];
        fa.vy -= GRAV * dt;
        fa.x += fa.vx * dt; fa.y += fa.vy * dt; fa.z += fa.vz * dt; fa.a += fa.spin * dt;
        if (fa.y <= 0) { fa.y = 0; fa.hit = 2; flying.splice(k, 1); }
      }

      if (car.z >= GOALZ - 20) { state = ST.RESULT; ok = true; flash = 0.6; blip(560, 1200, 0.7, "triangle", 0.16); }
      else if (total >= LIMIT) { state = ST.RESULT; ok = false; blip(300, 90, 0.9, "sawtooth", 0.13); }
    }

    if (flash > 0) flash -= dt * 1.7;
    if (car.shake > 0) car.shake = Math.max(0, car.shake - dt * 2.2);

    cam.yaw += (car.a * 0.5 - cam.yaw) * Math.min(1, dt * 7);
    var back = 124 + car.v * 0.11;
    cam.x = car.x - Math.sin(cam.yaw) * back + (Math.random() - 0.5) * car.shake * 22;
    cam.z = car.z - Math.cos(cam.yaw) * back;
    cam.y = 84 + car.y * 0.7 + (Math.random() - 0.5) * car.shake * 16;
    camSync();
    engineSound(car.v, state === ST.PLAY);
  }

  /* ===== 入力 ===== */
  var keyL = false, keyR = false, touchOn = false, touchX = 0;

  function resultButtons() {
    var h = 56, gap = 16, wr = 158, ws = 208;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.64;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons(), i, b;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function left() { return Math.max(0, LIMIT - total); }
  function doShare() {
    zShare({
      text: ok ? "日没まで残り" + left().toFixed(1) + "秒で刑場に着きました（" + hits + "人はねた） #車で走れメロス"
               : "日が沈みました。間に合わなかった（" + hits + "人はねた） #車で走れメロス"
    });
  }
  function tap(x, y) {
    audioStart();
    if (state === ST.RESULT) {
      var h = x == null ? "retry" : hitButton(x, y);
      if (h === "share") doShare(); else if (h === "retry") newRun();
      return;
    }
    if (state === ST.READY) state = ST.PLAY;
  }
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = pos(e);
    touchOn = true; touchX = p.x - W / 2;
    tap(p.x, p.y);
  });
  window.addEventListener("pointermove", function (e) { if (touchOn) touchX = pos(e).x - W / 2; });
  window.addEventListener("pointerup", function () { touchOn = false; });
  window.addEventListener("pointercancel", function () { touchOn = false; });
  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keyL = true; e.preventDefault(); return; }
    if (k === "ArrowRight" || k === "d" || k === "D") { keyR = true; e.preventDefault(); return; }
    if (k === "Escape") { e.preventDefault(); if (!e.repeat) newRun(); return; }
    if (e.code === "Space" || k === " " || k === "Enter") { e.preventDefault(); if (!e.repeat) tap(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keyL = false;
    if (k === "ArrowRight" || k === "d" || k === "D") keyR = false;
  });

  /* ===== 画面まわり ===== */
  function drawButton(b) {
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    var hw = b.w / 2, hh = b.h / 2, rad = hh;
    ctx.beginPath();
    ctx.moveTo(-hw + rad, -hh);
    ctx.arcTo(hw, -hh, hw, hh, rad); ctx.arcTo(hw, hh, -hw, hh, rad);
    ctx.arcTo(-hw, hh, -hw, -hh, rad); ctx.arcTo(-hw, -hh, hw, -hh, rad);
    ctx.closePath();
    ctx.fillStyle = "#fffdf6"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#2a2426"; ctx.stroke();
    ctx.fillStyle = "#2a2426";
    ctx.font = "800 24px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(b.label, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }
  function drawHud() {
    ctx.save();
    var warn = left() < 12;
    ctx.fillStyle = warn ? "rgba(214,58,40,.95)" : "rgba(24,20,22,.82)";
    ctx.font = "800 34px ui-monospace, Menlo, Consolas, monospace";
    ctx.textAlign = "left";
    ctx.fillText(left().toFixed(1), 18, 46);
    var bx = 18, by = 60, bw = W - 36, bh = 5;
    ctx.fillStyle = "rgba(24,20,22,.22)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "rgba(24,20,22,.72)";
    ctx.fillRect(bx, by, bw * Math.max(0, Math.min(1, (car.z + 280) / (GOALZ + 280))), bh);
    ctx.restore();
  }

  var tick = 0;
  function draw() {
    drawSky();
    drawRoad(); drawProps(); drawRocks(); drawActors(); drawGoal();
    drawPolys();
    drawCar();
    drawPolys();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,246,226," + Math.min(0.7, flash) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    drawHud();

    if (state === ST.READY) {
      var p = 0.5 + 0.5 * Math.sin(tick * 4);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.45 * p;
      ctx.fillStyle = "#c8452e";
      ctx.translate(W / 2, H * 0.6 - p * 10);
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(26, 14); ctx.lineTo(0, 2); ctx.lineTo(-26, 14);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    if (state === ST.RESULT) {
      ctx.fillStyle = ok ? "rgba(250,226,180,.88)" : "rgba(28,24,44,.86)";
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = ok ? "#3a2a1e" : "#efe4d6";
      ctx.font = "800 84px ui-monospace, Menlo, Consolas, monospace";
      ctx.fillText(left().toFixed(1), W / 2, H * 0.42);
      ctx.font = "800 34px ui-monospace, Menlo, Consolas, monospace";
      ctx.fillText(hits + "人", W / 2, H * 0.52);
      ctx.restore();
      resultButtons().forEach(drawButton);
    }
  }

  buildPalette();
  newRun();

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    tick += dt;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
