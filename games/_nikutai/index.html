<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>肉体言語</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../celebrate.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="gltf-loader.js"></script>
<script src="macho-glb.js"></script>
<script src="scene3d.js"></script>
<script>
/* 肉体言語

   マッチョがポーズで1文字ずつしゃべる。下の翻訳表（ポーズ⇔五十音）と見比べて、同じポーズの文字をタップ。
   腕の形が行（あかさたな…）、脚の形が段（あいうえお）に対応している。5つの言葉を訳すまでの時間が記録。
   まちがえたら +3秒。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  /* 拍手と歓声（ノイズから作る）。power 0〜1、dur 秒 */
  function applause(power, dur) {
    if (!AC || !NOISE) return;
    var n = AC.currentTime, out = AC.createGain();
    out.gain.value = 0.5 + power * 0.7; out.connect(AC.destination);
    /* 拍手：短いノイズのはじける音を大勢ぶん */
    var claps = Math.round(dur * (25 + power * 70));
    for (var i = 0; i < claps; i++) {
      var t0 = n + Math.random() * dur * Math.random() * 1.2, src = AC.createBufferSource(); src.buffer = NOISE;
      var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900 + Math.random() * 1800; bp.Q.value = 1.2;
      var g = AC.createGain(), v = (0.05 + Math.random() * 0.06) * Math.max(0.15, 1 - (t0 - n) / (dur * 1.2));
      g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      src.connect(bp); bp.connect(g); g.connect(out);
      src.start(t0, Math.random() * 1.2, 0.06);
    }
    /* 歓声：ざわめき＋「うおー」 */
    var crowd = AC.createBufferSource(); crowd.buffer = NOISE; crowd.loop = true;
    var cf = AC.createBiquadFilter(); cf.type = "bandpass"; cf.frequency.value = 700; cf.Q.value = 0.8;
    var cg = AC.createGain();
    cg.gain.setValueAtTime(0.0001, n); cg.gain.exponentialRampToValueAtTime(0.05 + power * 0.12, n + 0.15); cg.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    crowd.connect(cf); cf.connect(cg); cg.connect(out); crowd.start(n); crowd.stop(n + dur + 0.1);
    var voices = Math.round(3 + power * 9);
    for (var k = 0; k < voices; k++) {
      var o = AC.createOscillator(), vt = n + Math.random() * 0.25, f0 = 180 + Math.random() * 260;
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f0 * 0.8, vt); o.frequency.exponentialRampToValueAtTime(f0 * 1.25, vt + 0.25); o.frequency.exponentialRampToValueAtTime(f0, vt + dur * 0.8);
      var lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 5 + Math.random() * 2; lg.gain.value = f0 * 0.03;
      lfo.connect(lg); lg.connect(o.frequency);
      var vf = AC.createBiquadFilter(); vf.type = "bandpass"; vf.frequency.value = 650 + Math.random() * 300; vf.Q.value = 3;
      var vg = AC.createGain();
      vg.gain.setValueAtTime(0.0001, vt); vg.gain.exponentialRampToValueAtTime(0.015 + power * 0.02, vt + 0.12); vg.gain.exponentialRampToValueAtTime(0.0001, vt + dur * 0.85);
      o.connect(vf); vf.connect(vg); vg.connect(out);
      o.start(vt); lfo.start(vt); o.stop(vt + dur); lfo.stop(vt + dur);
    }
  }
  /* ポーズが決まったときの「じゃーん」：金管っぽい和音とシンバル（自作の響き） */
  var JAAN = [[0, 4, 7, 12], [2, 5, 9, 14], [-1, 2, 7, 11], [0, 5, 9, 12], [-3, 4, 7, 12]];
  function jaan(i) {
    if (!AC) return;
    var n = AC.currentTime, ch = JAAN[i % JAAN.length], base = 196;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(600, n); lp.frequency.exponentialRampToValueAtTime(3200, n + 0.06); lp.frequency.exponentialRampToValueAtTime(900, n + 1.1);
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.16, n + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, n + 1.2);
    lp.connect(g); g.connect(AC.destination);
    ch.forEach(function (st) {
      [-6, 6].forEach(function (det) {
        var o = AC.createOscillator(); o.type = "sawtooth";
        o.frequency.value = base * Math.pow(2, st / 12); o.detune.value = det;
        o.connect(lp); o.start(n); o.stop(n + 1.25);
      });
    });
    if (NOISE) {
      var s = AC.createBufferSource(); s.buffer = NOISE;
      var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5000;
      var cg = AC.createGain(); cg.gain.setValueAtTime(0.22, n); cg.gain.exponentialRampToValueAtTime(0.0001, n + 1.0);
      s.connect(hp); hp.connect(cg); cg.connect(AC.destination); s.start(n); s.stop(n + 1.05);
    }
    tone(70, 0.25, 0.25, "sine", 45);
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ ポーズ ============
     1文字ごとに別々のポーズ（ボディビルの規定ポーズを中心に）。
     腕は U（上腕）・F（前腕）、脚は T（太もも）・S（すね）の向き。[外側, 上, 前] で書く（左右は自動で反転）。
     yaw は体の向き（0 正面、180 後ろ向き、90 横向き）、jy は跳んでいる高さ。 */
  var A = {
    down: [[0.2, -1, 0], [0.1, -1, 0.05]], bic: [[1, 0.05, 0], [-0.15, 1, 0.1]], lat: [[0.6, -0.8, 0.25], [-0.8, -0.3, 0.4]],
    crab: [[0.4, -0.9, 0.35], [-0.9, -0.1, 0.6]], up: [[0.25, 1, 0], [0.2, 1, 0]], V: [[0.7, 0.7, 0], [0.7, 0.7, 0]],
    T: [[1, 0, 0], [1, 0, 0]], head: [[0.6, 0.8, -0.1], [-0.9, 0.3, -0.5]], hip: [[0.6, -0.8, -0.1], [-0.7, -0.6, 0.1]],
    point: [[0.1, 0, 1], [0, 0, 1]], chin: [[0.2, -0.8, 0.5], [-0.4, 0.9, 0.4]], salute: [[0.9, 0.4, 0.2], [-0.8, 0.5, 0.3]],
    wave: [[0.9, 0.3, 0], [0.2, 1, 0]], fbic: [[0.2, 0, 1], [0, 1, 0.2]], low: [[0.4, -0.9, 0.3], [-1, -0.1, 0.4]],
    back: [[0.3, -0.9, -0.4], [-0.6, -0.2, -0.8]], clasp: [[0.35, -0.85, 0.45], [-1, 0.1, 0.5]], tri: [[0.05, -1, -0.1], [0.05, -1, 0.05]],
    knee: [[0.5, -0.85, 0.2], [0.15, -1, 0.3]], guard: [[0.4, -0.6, 0.5], [-0.2, 1, 0.3]], fist: [[0.4, -0.8, -0.3], [0, 0.2, 1]],
    fold: [[0.3, -0.8, 0.4], [-1, 0.2, 0.3]], fly: [[0.1, 0.5, 0.9], [0.1, 0.5, 0.9]], cheek: [[0.2, -0.6, 0.6], [-0.4, 1, 0]],
    ring: [[0.3, 1, 0], [-0.9, 0.5, 0]], runF: [[0.1, -0.5, 0.85], [0, 0.9, 0.4]], runB: [[0.1, -0.7, -0.7], [0, -0.3, 0.95]],
    shee: [[0.3, 1, 0], [-1, 0, 0]], sheeB: [[0.9, -0.3, 0], [-0.3, -0.9, 0.3]], drum: [[0.6, -0.6, 0.5], [-0.9, 0.3, 0.3]]
  };
  var L = {
    st: [[0.05, -1, 0], [0.03, -1, 0]], wide: [[0.35, -1, 0], [0.3, -1, 0]], bend: [[0.35, -1, 0.12], [0.1, -1, 0]],
    fwdK: [[0, -0.9, 0.4], [0, -1, -0.1]], calf: [[0.1, -1, -0.15], [0.05, -1, -0.3]], fwd: [[0.15, -0.9, 0.45], [0.15, -0.9, 0.45]],
    kneelF: [[0.1, -0.2, 1], [0, -1, 0]], kneelB: [[0.05, -1, 0], [0.05, 0, -1]], sumo: [[0.8, -0.6, 0.2], [0.05, -1, 0]],
    shiko: [[1, 0.3, 0], [1, -0.3, 0]], kneeUp: [[0, 0, 1], [0, -1, 0]], lungeF: [[0, -0.6, 0.8], [0, -1, 0]],
    lungeB: [[0, -0.8, -0.6], [0, -0.6, -0.8]], kick: [[0, 0, 1], [0, 0, 1]], tuck: [[0.3, -0.3, 0.8], [0, -1, 0]],
    squat: [[0.3, -0.2, 1], [0, -1, 0]], inK: [[-0.15, -1, 0.1], [0.15, -1, 0]], tree: [[0.8, -0.5, 0.1], [-0.9, -0.4, 0]],
    runK: [[0, -0.2, 1], [0, -1, 0]], runL: [[0, -0.9, -0.4], [0, -0.5, -0.85]], shee: [[-0.3, -0.4, 0.6], [0.6, -0.8, 0]],
    X: [[0.6, -0.8, 0], [0.6, -0.8, 0]]
  };
  /* [文字, 腕0, 腕1, 脚0, 脚1, 向き, 跳び] */
  var POSES = [
    ["あ", "bic", "bic", "wide", "wide"],                 /* フロント・ダブルバイセップス */
    ["い", "lat", "lat", "wide", "wide"],                 /* フロント・ラットスプレッド */
    ["う", "crab", "crab", "bend", "bend"],               /* モストマスキュラー */
    ["え", "clasp", "clasp", "fwdK", "st", -70],         /* サイドチェスト */
    ["お", "tri", "back", "fwdK", "st", 70],             /* サイドトライセップス */
    ["か", "bic", "bic", "st", "calf", 180],             /* バック・ダブルバイセップス */
    ["き", "lat", "lat", "wide", "wide", 180],           /* バック・ラットスプレッド */
    ["く", "head", "head", "fwd", "st"],                 /* アブドミナル＆サイ */
    ["け", "V", "V", "st", "st"],                         /* ヴィクトリー */
    ["こ", "bic", "down", "st", "st", 20],               /* ワンアーム・バイセップス */
    ["さ", "bic", "low", "fwdK", "st", 25],              /* アーノルドポーズ */
    ["し", "down", "down", "wide", "wide"],               /* フロント・リラックス */
    ["す", "T", "T", "st", "st"],                         /* 飛行機 */
    ["せ", "up", "up", "st", "st"],                       /* バンザイ */
    ["そ", "hip", "hip", "wide", "wide"],                 /* 手を腰に */
    ["た", "point", "down", "st", "st"],                  /* 指さし */
    ["ち", "chin", "fold", "st", "st"],                   /* 考える */
    ["つ", "salute", "down", "st", "st"],                 /* 敬礼 */
    ["て", "wave", "down", "inK", "st"],                  /* 手を振る */
    ["と", "fbic", "hip", "st", "st", -20],               /* 前で力こぶ */
    ["な", "bic", "bic", "kneelF", "kneelB"],             /* 片ひざダブルバイ */
    ["に", "up", "hip", "kneelF", "kneelB", 20],          /* 片ひざガッツポーズ */
    ["ぬ", "knee", "knee", "sumo", "sumo"],               /* 相撲の構え */
    ["ね", "T", "T", "st", "shiko"],                      /* 四股 */
    ["の", "up", "up", "kneeUp", "st"],                   /* フラミンゴ */
    ["は", "hip", "hip", "lungeF", "lungeB", 30],         /* ランジ */
    ["ひ", "fly", "down", "st", "lungeB", 40, 30],        /* スーパーマン */
    ["ふ", "guard", "guard", "kick", "st", -40],          /* 前げり */
    ["へ", "point", "fist", "wide", "wide"],              /* 正拳突き */
    ["ほ", "fold", "fold", "wide", "wide"],               /* 腕組み */
    ["ま", "bic", "down", "st", "calf", 180],            /* 後ろ向き片腕 */
    ["み", "up", "up", "wide", "wide", 180],             /* 後ろ向きバンザイ */
    ["む", "hip", "hip", "st", "st", 90],                /* 横向き手を腰 */
    ["め", "T", "T", "wide", "wide", -90],               /* 横向き飛行機 */
    ["も", "bic", "bic", "fwdK", "st", 35],              /* 斜めダブルバイ */
    ["や", "up", "up", "tuck", "tuck", 0, 40],           /* ジャンプ */
    ["ゆ", "bic", "bic", "kneeUp", "st", 90],            /* 横向き片足 */
    ["よ", "point", "point", "squat", "squat"],           /* しゃがむ */
    ["ら", "cheek", "cheek", "inK", "inK"],               /* ぶりっこ */
    ["り", "ring", "ring", "tree", "st"],                 /* 木のポーズ */
    ["る", "runF", "runB", "runK", "runL", 70],          /* 走る */
    ["れ", "head", "head", "wide", "wide", 180],         /* 後ろ向き手を頭 */
    ["ろ", "shee", "sheeB", "shee", "st"],                /* シェー */
    ["わ", "drum", "drum", "sumo", "sumo"],               /* ゴリラ */
    ["を", "hip", "bic", "st", "calf", 150],             /* 振り向き */
    ["ん", "V", "V", "X", "X", 0, 25]                    /* 大の字ジャンプ */
  ];
  var ROWS = ["あいうえお", "かきくけこ", "さしすせそ", "たちつてと", "なにぬねの", "はひふへほ", "まみむめも", "や ゆ よ", "らりるれろ", "わ   を", "ん    "].map(function (r) { return [r]; });
  var KANA = {};
  function nv(v) { var n = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; }
  POSES.forEach(function (q) {
    var v = [q[5] || 0, q[6] || 0];
    [A[q[1]], A[q[2]], L[q[3]], L[q[4]]].forEach(function (lim) { v.push.apply(v, nv(lim[0])); v.push.apply(v, nv(lim[1])); });
    KANA[q[0]] = { k: q[0], pose: v };
  });
  var REST = KANA["あ"].pose.slice();          /* 開始前の立ち姿（ダブルバイセップス） */

  function add(a, d, l) { return [a[0] + d[0] * l, a[1] + d[1] * l, a[2] + d[2] * l]; }
  function sd(v, o, s) { return nv([v[o] * s, v[o + 1], v[o + 2]]); }
  /* ポーズの数字から関節の位置（cm、床が y=0） */
  function joints(v, breath) {
    var yaw = v[0] * Math.PI / 180, cy = Math.cos(yaw), sy = Math.sin(yaw);
    var legs = [], lowest = 0;
    for (var i = 0; i < 2; i++) {
      var s = i === 0 ? -1 : 1, o = 14 + i * 6;
      var hip = [s * 9, -4, 0];
      var knee = add(hip, sd(v, o, s), 44);
      var ankle = add(knee, sd(v, o + 3, s), 42);
      legs.push([hip, knee, ankle]);
      lowest = Math.min(lowest, knee[1] - 6, ankle[1] - 4);
    }
    var py = -lowest + (v[1] || 0);
    function R(p) { return [p[0] * cy + p[2] * sy, p[1] + py, -p[0] * sy + p[2] * cy]; }
    var j = { pelvis: [0, py, 0], yaw: yaw, side: [] };
    for (var k = 0; k < 2; k++) {
      var sg = k === 0 ? -1 : 1, b = 2 + k * 6;
      var sh = [sg * 24, 55 + (breath || 0), 0];
      var el = add(sh, sd(v, b, sg), 30);
      var hd = add(el, sd(v, b + 3, sg), 27);
      var Lg = legs[k];
      j.side.push({ shoulder: R(sh), elbow: R(el), hand: R(hd), hip: R(Lg[0]), knee: R(Lg[1]), ankle: R(Lg[2]) });
    }
    return j;
  }

  /* ============ 言葉 ============ 番号つきの一覧は確認用に別ファイルでも渡す */
  /* 2文字・3文字…と1文字ずつ長くして、6文字でクリア */
  var WORDS = [
    ["むね", "うで", "かた", "あし", "はら", "こし"],
    ["ささみ", "せなか", "ねむい", "ひるね", "こころ", "ちから", "さむい"],
    ["きんにく", "きれてる", "おやすみ", "ふともも", "しあわせ", "もうむり", "ゆうやけ"],
    ["あいしてる", "ありえない", "にくをくう", "わすれない", "まけないよ"],
    ["おなかすいた", "なにみてんの", "あしたもくる", "きんにくつう", "おしりかたい", "あさひるよる"]
  ];

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var galleryK = null, showK = null;   /* showK: 確認用（覗き穴から1つのポーズを出す） */
  var state, T, penalty, words, wi, ci, cur, flex, wordDone, flash, gallery, misses, pt, pEnd = 1e9, hold = -1, pop = null, hitIdx, impact = 0;
  var STEP = 1.15;                             /* 1文字ぶんのポーズ（移る＋止める）の秒数 */
  var NW = 5, PEN = 3;
  var CAM = Number((location.search.match(/[?&]cam=(\d)/) || [])[1] || 0);

  var SH, AY, TY, CW, CH;
  function place() {
    SH = Math.round(H * 0.5);                  /* マッチョの場面 */
    AY = SH;                                   /* 答えの欄 */
    TY = SH + 78;                              /* 翻訳表 */
    CW = W / 11;
    CH = (H - TY - 10) / 5;
  }

  function pickWords() {
    return WORDS.map(function (g) { return g[Math.floor(Math.random() * g.length)]; });
  }
  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0; penalty = 0; misses = 0; wi = 0; ci = 0; flex = 0; wordDone = 0; flash = null; gallery = -1;
    words = pickWords();
    cur = cur || REST.slice();
    intro();
  }
  /* 再生中なら今ポーズしている文字の番号、止まっていれば -1 */
  function playIdx() {
    if (pt < 0 || state !== S.PLAY || !words || wi >= NW) return -1;
    var i = Math.floor(pt / STEP);
    return i < words[wi].length && pt < pEnd ? i : -1;
  }
  /* 全部続けて（from を渡すとその1文字だけ） */
  function play(from) {
    if (state !== S.PLAY || wordDone > 0) return;
    if (from == null) { pt = 0; pEnd = 1e9; hold = -1; } else { pt = from * STEP; pEnd = (from + 1) * STEP; hold = from; }
    hitIdx = -1;
    tone(440, 0.08, 0.1, "triangle"); tone(660, 0.1, 0.08, "triangle", null, 0.07);
  }
  /* 言葉の始め：一連のポーズを見せてから1文字目のポーズで止まる */
  function intro() { pt = 0; pEnd = 1e9; hitIdx = -1; hold = 0; }
  function slotRects() {
    var w = words[wi < NW ? wi : NW - 1], n = w.length;
    var bs = Math.min(52, (W - 60) / n - 6), x0 = W / 2 - (n * (bs + 6) - 6) / 2, y = AY + (TY - AY - 4 - bs) / 2, out = [];
    for (var i = 0; i < n; i++) out.push({ x: x0 + i * (bs + 6), y: y, s: bs });
    return out;
  }
  function score() { return T + penalty; }

  /* ============ 進行 ============ */
  function update(dt) {
    var k = 1;                                 /* 切り替えは一瞬（tomozo「光速に」） */
    if (pt >= 0) { pt += dt; if (state !== S.PLAY || playIdx() < 0) pt = -1; }
    var pi = playIdx();
    /* ポーズに移り終わるころに「じゃーん」 */
    if (pi >= 0 && pi !== hitIdx && pt - pi * STEP >= 0) { hitIdx = pi; jaan(pi); flex = 1; impact = 1; }
    impact = Math.max(0, impact - dt * 1.8);
    var goal = pi >= 0 ? KANA[words[wi][pi]].pose : (hold >= 0 && state === S.PLAY && wi < NW ? KANA[words[wi][hold]].pose : REST);
    if (showK) goal = KANA[showK].pose;
    if (gallery >= 0) {
      gallery += dt;
      var keys = Object.keys(KANA);
      galleryK = keys[Math.floor(gallery / 1.1) % keys.length]; goal = KANA[galleryK].pose;
    }
    if (!cur) cur = REST.slice();
    for (var i = 0; i < cur.length; i++) cur[i] += (goal[i] - cur[i]) * k;
    flex = Math.max(0, flex - dt * 2.5);
    if (flash) { flash.t += dt; if (flash.t > 0.4) flash = null; }
    if (pop) { pop.t += dt; if (pop.t > 0.6) pop = null; }
    if (state !== S.PLAY) return;
    if (!wordDone) T += dt;
    if (wordDone > 0) {
      wordDone -= dt;
      if (wordDone <= 0) {
        wordDone = 0; wi++; ci = 0;
        if (wi >= NW) { finish(); return; }
        intro();
      }
    }
  }
  function finish() {
    state = S.RESULT;
    if (AC && window.zCelebrate) window.zCelebrate.play(AC, "fanfare");
    if (confetti) confetti.burst(W, H, 160);
  }

  function cellAt(x, y) {
    if (y < TY) return null;
    var c = Math.floor(x / CW), r = Math.floor((y - TY) / CH);
    if (c < 0 || c > 10 || r < 0 || r > 4) return null;
    var k = ROWS[c][0][r];
    return k && k !== " " ? k : null;
  }

  /* ============ 入力 ============ */
  function choose(k) {
    if (state !== S.PLAY || wordDone > 0) return;
    var want = words[wi][ci];
    if (k === want) {
      flash = { k: k, ok: true, t: 0 };
      flex = 1;
      tone(520 + ci * 70, 0.1, 0.12, "triangle"); tone(780 + ci * 70, 0.12, 0.08, "sine", null, 0.05);
      applause(ci + 1 >= words[wi].length ? 1 : 0.3, ci + 1 >= words[wi].length ? 3.2 : 1.3);
      pop = { i: ci, t: 0 };
      ci++;
      /* 次の文字へカーソル、マッチョはその文字のポーズを決める */
      if (ci < words[wi].length) play(ci);
      if (ci >= words[wi].length) {
        /* そろったら改めて一連のポーズ */
        wordDone = words[wi].length * STEP + 0.6; pt = 0; pEnd = 1e9; hitIdx = -1; hold = -1;
        if (AC && window.zCelebrate) window.zCelebrate.play(AC, "chime");
      }
    } else {
      flash = { k: k, ok: false, t: 0 };
      penalty += PEN; misses++;
      tone(150, 0.22, 0.16, "square", 90);
    }
  }
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) { play(ci); return; }
    if (y < TY) {
      var sr = slotRects();
      for (var si = 0; si < sr.length; si++) if (x >= sr[si].x - 3 && x <= sr[si].x + sr[si].s + 3) { play(si); return; }
      return;
    }
    var k = cellAt(x, y);
    if (k) choose(k);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1: 1語目の始め  2: 最後の言葉の最後の1文字（正しくタップでクリア）  3: 全ポーズを順に見る  4: 3をやめる  5: 1文字目のポーズ */
    if (n === 1) newRound();
    if (n === 2) { if (state !== S.PLAY) newRound(); wi = NW - 1; ci = words[wi].length - 1; wordDone = 0; pt = -1; }
    if (n === 3) { if (state !== S.PLAY) newRound(); gallery = 0; }
    if (n === 4) { gallery = -1; }
    if (n === 5) { if (state !== S.PLAY) newRound(); play(0); }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    if (state === S.INTRO) startButton.click(); else down();
  });

  function doShare() {
    var t = score().toFixed(1);
    window.zResultActions.x({ text: "マッチョが「" + words.join("」「") + "」と言っていたのを" + t + "秒で翻訳した #肉体言語" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 翻訳表の小さな絵（正面の棒人間） */
  function drawPict(pose, cx, by, s, col) {
    var j = joints(pose, 0);
    function P(p) { return [cx + p[0] * s, by - p[1] * s]; }
    var cyw = Math.cos(j.yaw), syw = Math.sin(j.yaw);
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    var limbs = [];
    j.side.forEach(function (q) {
      limbs.push({ p: [q.shoulder, q.elbow, q.hand], w: 12, z: (q.elbow[2] + q.hand[2]) / 2 });
      limbs.push({ p: [q.hip, q.knee, q.ankle], w: 15, z: (q.knee[2] + q.ankle[2]) / 2 });
    });
    function limb(l, c) {
      ctx.strokeStyle = c; ctx.lineWidth = l.w * s;
      var a = P(l.p[0]), b = P(l.p[1]), d = P(l.p[2]);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(d[0], d[1]); ctx.stroke();
    }
    /* 体の奥にある手足は薄く先に描く */
    limbs.forEach(function (l) { if (l.z < -4) limb(l, "#9c8a7c"); });
    var pel = P(j.pelvis), neck = P([0, j.pelvis[1] + 60, 0]);
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.lineWidth = 34 * s * (0.55 + 0.45 * Math.abs(cyw));
    ctx.beginPath(); ctx.moveTo(pel[0], pel[1] - 10 * s); ctx.lineTo(neck[0], neck[1] + 6 * s); ctx.stroke();
    var hx = neck[0], hy = neck[1] - 16 * s;
    ctx.beginPath(); ctx.arc(hx, hy, 11 * s, 0, 6.3); ctx.fill();
    if (cyw > -0.3) {
      /* 顔の向き（後ろ向きは顔なし） */
      ctx.fillStyle = "#fffaf1";
      ctx.beginPath(); ctx.arc(hx + syw * 6 * s, hy + 1 * s, 3.2 * s, 0, 6.3); ctx.fill();
    }
    limbs.forEach(function (l) { if (l.z >= -4) limb(l, col); });
    ctx.restore();
  }

  function drawTable() {
    ctx.fillStyle = "#efe6d6"; ctx.fillRect(0, TY - 4, W, H - TY + 4);
    var s = Math.min((CW - 4) / 180, (CH - 18) / 210);
    for (var c = 0; c < 11; c++) for (var r = 0; r < 5; r++) {
      var k = ROWS[c][0][r];
      if (!k || k === " ") continue;
      var x = c * CW, y = TY + r * CH;
      var fl = (flash && flash.k === k) || (gallery >= 0 && galleryK === k);
      ctx.fillStyle = fl ? (!flash || flash.ok ? "#bfe8b0" : "#f5b3a8") : "#fffaf1";
      roundRect(x + 1.5, y + 1.5, CW - 3, CH - 3, 7); ctx.fill();
      ctx.strokeStyle = "rgba(60,40,20,.25)"; ctx.lineWidth = 1; ctx.stroke();
      drawPict(KANA[k].pose, x + CW / 2, y + CH - 4, s, "#3a2a20");
      ctx.fillStyle = "#c0392b"; ctx.font = "900 17px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(k, x + 4, y + 3);
    }
  }

  function drawAnswer() {
    ctx.fillStyle = "#1c1512"; ctx.fillRect(0, AY, W, TY - AY - 4);
    if (!words || state === S.INTRO) return;
    var w = words[wi < NW ? wi : NW - 1], n = w.length;
    var bs = Math.min(52, (W - 60) / n - 6), x0 = W / 2 - (n * (bs + 6) - 6) / 2, y = AY + (TY - AY - 4 - bs) / 2;
    for (var i = 0; i < n; i++) {
      var open = state !== S.PLAY || i < ci || wordDone > 0;
      ctx.fillStyle = open ? "#fff7e6" : (i === ci ? "#5a4636" : "#3a2c24");
      var pk = pop && pop.i === i && wi < NW ? 1 - pop.t / 0.6 : 0, px0 = x0 + i * (bs + 6);
      ctx.save();
      if (pk > 0) {
        /* 正解の文字：はねる・光る */
        var sc = 1 + 0.35 * Math.sin(pk * Math.PI) * pk;
        ctx.translate(px0 + bs / 2, y + bs / 2); ctx.scale(sc, sc); ctx.translate(-(px0 + bs / 2), -(y + bs / 2));
        ctx.shadowColor = "rgba(255,214,90," + pk + ")"; ctx.shadowBlur = 24;
      }
      roundRect(px0, y, bs, bs, 8); ctx.fill();
      ctx.restore();
      if (pk > 0) {
        ctx.save(); ctx.strokeStyle = "rgba(255,214,90," + pk + ")"; ctx.lineWidth = 3;
        for (var sp = 0; sp < 8; sp++) {
          var an = sp / 8 * Math.PI * 2, r0 = bs * 0.6 + (1 - pk) * 26, r1 = r0 + 10;
          ctx.beginPath(); ctx.moveTo(px0 + bs / 2 + Math.cos(an) * r0, y + bs / 2 + Math.sin(an) * r0); ctx.lineTo(px0 + bs / 2 + Math.cos(an) * r1, y + bs / 2 + Math.sin(an) * r1); ctx.stroke();
        }
        ctx.restore();
      }
      roundRect(px0, y, bs, bs, 8);
      if (i === playIdx() || (playIdx() < 0 && i === hold)) { ctx.strokeStyle = "#f3c34a"; ctx.lineWidth = 4; ctx.stroke(); }
      else if (i === ci && state === S.PLAY && !wordDone) { ctx.strokeStyle = "#8a7a6a"; ctx.lineWidth = 2; ctx.stroke(); }
      if (open) {
        ctx.fillStyle = "#16202e"; ctx.font = "900 " + Math.round(bs * 0.72) + "px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(w[i], x0 + i * (bs + 6) + bs / 2, y + bs / 2 + 2);
      }
    }
    ctx.fillStyle = "#b8a898"; ctx.font = "800 18px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";

  }

  function camFor() {
    var k = 215 / SH, d = 620, vh = H * k;
    var fov = 2 * Math.atan(vh / 2 / d) * 180 / Math.PI * (1 - impact * impact * 0.06);
    var ty = 100 - (H / 2 - SH / 2) * k;
    if (CAM === 0) return { fov: fov, x: 0, y: ty, z: d, tx: 0, ty: ty };
    if (CAM === 2) return { fov: fov, x: d * Math.sin(0.25), y: ty - 70, z: d * Math.cos(0.25), tx: 0, ty: ty - 18 };
    return { fov: fov, x: d * Math.sin(0.38), y: ty + 10, z: d * Math.cos(0.38), tx: 0, ty: ty };
  }

  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    var t = performance.now() / 1000;
    /* 舞台 */
    var g = ctx.createRadialGradient(W / 2, SH * 0.45, 20, W / 2, SH * 0.5, SH * 0.8);
    g.addColorStop(0, "#5a4a5e"); g.addColorStop(1, "#16121a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, SH);
    ctx.fillStyle = "#2a2026"; ctx.fillRect(0, SH * 0.82, W, SH * 0.18);
    if (impact > 0) {
      /* 決めポーズの集中線と後光 */
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, SH); ctx.clip();
      var cx = W / 2, cy = SH * 0.42, a = impact;
      var hg = ctx.createRadialGradient(cx, cy, 10, cx, cy, SH * 0.6);
      hg.addColorStop(0, "rgba(255,226,140," + (0.55 * a) + ")"); hg.addColorStop(1, "rgba(255,200,90,0)");
      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, SH);
      ctx.fillStyle = "rgba(255,240,200," + (0.35 * a) + ")";
      for (var ri = 0; ri < 28; ri++) {
        var an = ri / 28 * Math.PI * 2 + (hitIdx || 0) * 0.37, w2 = 0.045;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(an - w2) * W, cy + Math.sin(an - w2) * W);
        ctx.lineTo(cx + Math.cos(an + w2) * W, cy + Math.sin(an + w2) * W);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    var s3 = scene3d();
    if (s3 && cur) {
      try {
        var br = Math.sin(t * 2.4) * 0.8;
        s3.sync({ j: joints(cur, br), cam: camFor(), flex: flex, tilt: 0 });
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SH); ctx.clip();
        s3.draw(ctx, W, H);
        if (impact > 0.75) { ctx.fillStyle = "rgba(255,255,255," + ((impact - 0.75) * 1.6) + ")"; ctx.fillRect(0, 0, W, SH); }
        ctx.restore();
      } catch (e) { scene3d.drop(); }
    }
    drawAnswer();
    drawTable();
    if (state === S.RESULT) drawResult();
    if (confetti && state === S.RESULT) confetti.draw(ctx);
  }

  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10;
    ctx.textBaseline = "alphabetic";
    ctx.font = "800 108px sans-serif";
    var num = score().toFixed(1), nw = ctx.measureText(num).width;
    ctx.font = "800 44px sans-serif";
    var uw = ctx.measureText("秒").width, x0 = W / 2 - (nw + uw + 6) / 2;
    ctx.textAlign = "left"; ctx.font = "800 108px sans-serif";
    ctx.fillText(num, x0, H * 0.45);
    ctx.font = "800 44px sans-serif";
    ctx.fillText("秒", x0 + nw + 6, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  window.__probe = {
    now: function () { return { state: state, score: score(), W: W, H: H, word: words && words[wi], ci: ci, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); if (confetti && state === S.RESULT) confetti.step(1 / 60, W, H); draw(); } },
    reset: function () { newRound(); },
    show: function (k) { showK = k || null; },
    hideUI: function () { }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      startButton.click();
      while (state === S.PLAY) {
        await r.wait(300);
        if (state !== S.PLAY || wordDone) continue;
        if (pt >= 0) continue;
        for (var q = ci; q < words[wi].length && state === S.PLAY; q++) { choose(words[wi][q]); await r.wait(450); }
      }
      await r.wait(1800);
    }
  };

  var confetti = window.zCelebrate ? window.zCelebrate.confetti() : null;
  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { if (e) e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); if (confetti && state === S.RESULT) confetti.step(1 / 60, W, H); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
