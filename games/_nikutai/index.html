<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>肉体ピング</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../celebrate.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="gltf-loader.js"></script>
<script src="macho-glb.js"></script>
<script src="scene3d.js"></script>
<script>
/* 肉体ピング

   マッチョがポーズで1文字ずつしゃべる。下の翻訳表（ポーズ⇔五十音）と見比べて、同じポーズの文字をタップ。
   腕の形が行（あかさたな…）、脚の形が段（あいうえお）に対応している。5つの言葉を訳すまでの時間が記録。
   まちがえたら +3秒。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  /* 拍手と歓声（ノイズから作る）。power 0〜1、dur 秒 */
  function applause(power, dur) {
    if (!AC || !NOISE) return;
    var n = AC.currentTime, out = AC.createGain();
    out.gain.value = 0.5 + power * 0.7; out.connect(AC.destination);
    /* 拍手：短いノイズのはじける音を大勢ぶん */
    var claps = Math.round(dur * (25 + power * 70));
    for (var i = 0; i < claps; i++) {
      var t0 = n + Math.random() * dur * Math.random() * 1.2, src = AC.createBufferSource(); src.buffer = NOISE;
      var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900 + Math.random() * 1800; bp.Q.value = 1.2;
      var g = AC.createGain(), v = (0.05 + Math.random() * 0.06) * Math.max(0.15, 1 - (t0 - n) / (dur * 1.2));
      g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      src.connect(bp); bp.connect(g); g.connect(out);
      src.start(t0, Math.random() * 1.2, 0.06);
    }
    /* 歓声：ざわめき＋「うおー」 */
    var crowd = AC.createBufferSource(); crowd.buffer = NOISE; crowd.loop = true;
    var cf = AC.createBiquadFilter(); cf.type = "bandpass"; cf.frequency.value = 700; cf.Q.value = 0.8;
    var cg = AC.createGain();
    cg.gain.setValueAtTime(0.0001, n); cg.gain.exponentialRampToValueAtTime(0.05 + power * 0.12, n + 0.15); cg.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    crowd.connect(cf); cf.connect(cg); cg.connect(out); crowd.start(n); crowd.stop(n + dur + 0.1);
    var voices = Math.round(3 + power * 9);
    for (var k = 0; k < voices; k++) {
      var o = AC.createOscillator(), vt = n + Math.random() * 0.25, f0 = 180 + Math.random() * 260;
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f0 * 0.8, vt); o.frequency.exponentialRampToValueAtTime(f0 * 1.25, vt + 0.25); o.frequency.exponentialRampToValueAtTime(f0, vt + dur * 0.8);
      var lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 5 + Math.random() * 2; lg.gain.value = f0 * 0.03;
      lfo.connect(lg); lg.connect(o.frequency);
      var vf = AC.createBiquadFilter(); vf.type = "bandpass"; vf.frequency.value = 650 + Math.random() * 300; vf.Q.value = 3;
      var vg = AC.createGain();
      vg.gain.setValueAtTime(0.0001, vt); vg.gain.exponentialRampToValueAtTime(0.015 + power * 0.02, vt + 0.12); vg.gain.exponentialRampToValueAtTime(0.0001, vt + dur * 0.85);
      o.connect(vf); vf.connect(vg); vg.connect(out);
      o.start(vt); lfo.start(vt); o.stop(vt + dur); lfo.stop(vt + dur);
    }
  }
  /* ポーズが決まったときの「じゃーん」：金管っぽい和音とシンバル（自作の響き） */
  var JAAN = [[0, 4, 7, 12], [2, 5, 9, 14], [-1, 2, 7, 11], [0, 5, 9, 12], [-3, 4, 7, 12]];
  function jaan(i) {
    if (!AC) return;
    var n = AC.currentTime, ch = JAAN[i % JAAN.length], base = 196;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(600, n); lp.frequency.exponentialRampToValueAtTime(3200, n + 0.06); lp.frequency.exponentialRampToValueAtTime(900, n + 1.1);
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.16, n + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, n + 1.2);
    lp.connect(g); g.connect(AC.destination);
    ch.forEach(function (st) {
      [-6, 6].forEach(function (det) {
        var o = AC.createOscillator(); o.type = "sawtooth";
        o.frequency.value = base * Math.pow(2, st / 12); o.detune.value = det;
        o.connect(lp); o.start(n); o.stop(n + 1.25);
      });
    });
    if (NOISE) {
      var s = AC.createBufferSource(); s.buffer = NOISE;
      var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5000;
      var cg = AC.createGain(); cg.gain.setValueAtTime(0.22, n); cg.gain.exponentialRampToValueAtTime(0.0001, n + 1.0);
      s.connect(hp); hp.connect(cg); cg.connect(AC.destination); s.start(n); s.stop(n + 1.05);
    }
    tone(70, 0.25, 0.25, "sine", 45);
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ ポーズ ============
     1文字ごとに別々のポーズ（ボディビルの規定ポーズを中心に）。
     腕は U（上腕）・F（前腕）、脚は T（太もも）・S（すね）の向き。[外側, 上, 前] で書く（左右は自動で反転）。
     yaw は体の向き（0 正面、180 後ろ向き、90 横向き）、jy は跳んでいる高さ。 */
  var A = {
    down: [[0.2, -1, 0], [0.1, -1, 0.05]], bic: [[1, 0.05, 0], [-0.15, 1, 0.1]], lat: [[0.6, -0.8, 0.25], [-0.8, -0.3, 0.4]],
    crab: [[0.4, -0.9, 0.35], [-0.9, -0.1, 0.6]], up: [[0.25, 1, 0], [0.2, 1, 0]], V: [[0.7, 0.7, 0], [0.7, 0.7, 0]],
    T: [[1, 0, 0], [1, 0, 0]], head: [[0.6, 0.8, -0.1], [-0.9, 0.3, -0.5]], hip: [[0.6, -0.8, -0.1], [-0.7, -0.6, 0.1]],
    point: [[0.1, 0, 1], [0, 0, 1]], chin: [[0.2, -0.8, 0.5], [-0.4, 0.9, 0.4]], salute: [[0.9, 0.4, 0.2], [-0.8, 0.5, 0.3]],
    wave: [[0.9, 0.3, 0], [0.2, 1, 0]], fbic: [[0.2, 0, 1], [0, 1, 0.2]], low: [[0.4, -0.9, 0.3], [-1, -0.1, 0.4]],
    back: [[0.3, -0.9, -0.4], [-0.6, -0.2, -0.8]], clasp: [[0.35, -0.85, 0.45], [-1, 0.1, 0.5]], tri: [[0.05, -1, -0.1], [0.05, -1, 0.05]],
    knee: [[0.5, -0.85, 0.2], [0.15, -1, 0.3]], guard: [[0.4, -0.6, 0.5], [-0.2, 1, 0.3]], fist: [[0.4, -0.8, -0.3], [0, 0.2, 1]],
    fold: [[0.3, -0.8, 0.4], [-1, 0.2, 0.3]], fly: [[0.1, 0.5, 0.9], [0.1, 0.5, 0.9]], cheek: [[0.2, -0.6, 0.6], [-0.4, 1, 0]],
    ring: [[0.3, 1, 0], [-0.9, 0.5, 0]], runF: [[0.1, -0.5, 0.85], [0, 0.9, 0.4]], runB: [[0.1, -0.7, -0.7], [0, -0.3, 0.95]],
    Hpar: [[0.12, 1, 0], [0, 1, 0]], Itog: [[-0.3, 1, 0], [-0.2, 1, 0]], Yn: [[0.35, 1, 0], [0.35, 1, 0]],
    Ww: [[1, 0.3, 0], [0.5, 1, 0]], Cup: [[0, 0.7, 0.7], [0, -0.3, 1]], fwdLo: [[0.1, -0.8, 0.6], [0, 0, 1]],
    shee: [[0.3, 1, 0], [-1, 0, 0]], sheeB: [[0.9, -0.3, 0], [-0.3, -0.9, 0.3]], drum: [[0.6, -0.6, 0.5], [-0.9, 0.3, 0.3]]
  };
  var L = {
    st: [[0.05, -1, 0], [0.03, -1, 0]], wide: [[0.35, -1, 0], [0.3, -1, 0]], bend: [[0.35, -1, 0.12], [0.1, -1, 0]],
    fwdK: [[0, -0.9, 0.4], [0, -1, -0.1]], calf: [[0.1, -1, -0.15], [0.05, -1, -0.3]], fwd: [[0.15, -0.9, 0.45], [0.15, -0.9, 0.45]],
    kneelF: [[0.1, -0.2, 1], [0, -1, 0]], kneelB: [[0.05, -1, 0], [0.05, 0, -1]], sumo: [[0.8, -0.6, 0.2], [0.05, -1, 0]],
    shiko: [[1, 0.3, 0], [1, -0.3, 0]], kneeUp: [[0, 0, 1], [0, -1, 0]], lungeF: [[0, -0.6, 0.8], [0, -1, 0]],
    lungeB: [[0, -0.8, -0.6], [0, -0.6, -0.8]], kick: [[0, 0, 1], [0, 0, 1]], tuck: [[0.3, -0.3, 0.8], [0, -1, 0]],
    squat: [[0.3, -0.2, 1], [0, -1, 0]], inK: [[-0.15, -1, 0.1], [0.15, -1, 0]], tree: [[0.8, -0.5, 0.1], [-0.9, -0.4, 0]],
    runK: [[0, -0.2, 1], [0, -1, 0]], runL: [[0, -0.9, -0.4], [0, -0.5, -0.85]], shee: [[-0.3, -0.4, 0.6], [0.6, -0.8, 0]],
    X: [[0.6, -0.8, 0], [0.6, -0.8, 0]], Lam: [[0.45, -1, 0], [0.45, -1, 0]], tog: [[0, -1, 0], [0, -1, 0]],
    side: [[1, 0, 0], [1, 0, 0]], diag: [[0.6, -0.8, 0], [0.6, -0.8, 0]], bowed: [[0.45, -1, 0.1], [-0.2, -1, 0]],
    cBend: [[0, -0.7, 0.7], [0, -1, -0.3]]
  };
  /* [文字, 腕0, 腕1, 脚0, 脚1, 向き, 跳び] */
  /* マッスルポーズを土台に、正面から見た形をアルファベットに少し寄せる */
  var POSES = [
    ["A", "ring", "ring", "Lam", "Lam"],              /* 頭上で手を合わせて大股 */
    ["B", "down", "bic", "st", "tree"],               /* 片腕の力こぶ＋片ひざ */
    ["C", "Cup", "Cup", "cBend", "cBend", 90],        /* 横向きで丸まる */
    ["D", "down", "hip", "st", "st"],                 /* 片手を腰 */
    ["E", "point", "fwdLo", "kick", "st", 90],        /* 横向き：上・中・下に突き出す */
    ["F", "point", "fwdLo", "st", "st", 90],          /* 横向き：上・中に突き出す */
    ["G", "clasp", "clasp", "fwdK", "st", -70],       /* サイドチェスト */
    ["H", "Hpar", "Hpar", "wide", "wide"],            /* 両腕まっすぐ上・大股 */
    ["I", "Itog", "Itog", "tog", "tog"],              /* 頭上で腕を閉じて直立 */
    ["J", "Itog", "Itog", "tree", "st"],              /* I＋片ひざで曲がり */
    ["K", "down", "V", "st", "diag"],                 /* 片腕と片脚を斜めに */
    ["L", "down", "down", "st", "side"],              /* 片脚を真横に */
    ["M", "head", "head", "wide", "wide"],            /* 手を頭の後ろ（アブドミナル） */
    ["N", "up", "down", "st", "st"],                  /* 片腕を上 */
    ["O", "crab", "crab", "bowed", "bowed"],          /* モストマスキュラー＋がに股 */
    ["P", "down", "bic", "tog", "tog"],               /* ワンアーム・バイセップス */
    ["Q", "crab", "crab", "st", "diag"],              /* モストマスキュラー＋片脚を斜め */
    ["R", "down", "bic", "st", "diag"],               /* 片腕の力こぶ＋片脚を斜め */
    ["S", "bic", "low", "fwdK", "st", 25],            /* アーノルドポーズ */
    ["T", "T", "T", "tog", "tog"],                    /* 両腕を真横 */
    ["U", "bic", "bic", "wide", "wide"],              /* フロント・ダブルバイセップス */
    ["V", "V", "V", "tog", "tog"],                    /* ヴィクトリー */
    ["W", "Ww", "Ww", "sumo", "sumo"],                /* 腕を広げて四股 */
    ["X", "V", "V", "X", "X", 0, 25],                 /* 大の字ジャンプ */
    ["Y", "Yn", "Yn", "tog", "tog"],                  /* 細いY */
    ["Z", "down", "T", "side", "st"]                  /* 片腕を真横・逆の脚を真横 */
  ];
  /* 翻訳表の並び：キーボード（既定）と ABC 順を切り替える */
  var LAYOUTS = {
    key: { rows: ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"], off: [0, 0.5, 1.5], cols: 10 },
    abc: { rows: ["ABCDEFG", "HIJKLMN", "OPQRSTU", "VWXYZ"], off: [0, 0, 0, 0], cols: 7 }
  };
  var lay = "key";
  try { if (localStorage.getItem("nikutai-layout") === "abc") lay = "abc"; } catch (e) {}
  function LY() { return LAYOUTS[lay]; }
  var KANA = {};
  function nv(v) { var n = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; }
  POSES.forEach(function (q) {
    var v = [q[5] || 0, q[6] || 0];
    [A[q[1]], A[q[2]], L[q[3]], L[q[4]]].forEach(function (lim) { v.push.apply(v, nv(lim[0])); v.push.apply(v, nv(lim[1])); });
    KANA[q[0]] = { k: q[0], pose: v };
  });
  var REST = KANA["U"].pose.slice();          /* 開始前の立ち姿（ダブルバイセップス） */

  function add(a, d, l) { return [a[0] + d[0] * l, a[1] + d[1] * l, a[2] + d[2] * l]; }
  function sd(v, o, s) { return nv([v[o] * s, v[o + 1], v[o + 2]]); }
  /* ポーズの数字から関節の位置（cm、床が y=0） */
  function joints(v, breath) {
    var yaw = v[0] * Math.PI / 180, cy = Math.cos(yaw), sy = Math.sin(yaw);
    var legs = [], lowest = 0;
    for (var i = 0; i < 2; i++) {
      var s = i === 0 ? -1 : 1, o = 14 + i * 6;
      var hip = [s * 9, -4, 0];
      var knee = add(hip, sd(v, o, s), 44);
      var ankle = add(knee, sd(v, o + 3, s), 42);
      legs.push([hip, knee, ankle]);
      lowest = Math.min(lowest, knee[1] - 6, ankle[1] - 4);
    }
    var py = -lowest + (v[1] || 0);
    function R(p) { return [p[0] * cy + p[2] * sy, p[1] + py, -p[0] * sy + p[2] * cy]; }
    var j = { pelvis: [0, py, 0], yaw: yaw, jy: v[1] || 0, side: [] };
    for (var k = 0; k < 2; k++) {
      var sg = k === 0 ? -1 : 1, b = 2 + k * 6;
      var sh = [sg * 24, 55 + (breath || 0), 0];
      var el = add(sh, sd(v, b, sg), 30);
      var hd = add(el, sd(v, b + 3, sg), 27);
      var Lg = legs[k];
      j.side.push({ shoulder: R(sh), elbow: R(el), hand: R(hd), hip: R(Lg[0]), knee: R(Lg[1]), ankle: R(Lg[2]) });
    }
    return j;
  }

  /* ============ 言葉 ============ 番号つきの一覧は確認用に別ファイルでも渡す */
  /* 3文字・4文字…と1文字ずつ長くして、8文字でクリア */
  var WORDS = [
    ["GYM", "ABS", "BIG", "WOW", "YES", "RUN", "HOT", "TOP", "WIN", "MAX", "EGG", "LEG", "ARM", "FIT", "SUN"],
    ["FLEX", "BULK", "BEEF", "LIFT", "PUMP", "CORE", "TONE", "HUGE", "OILY", "TANK", "GRIP", "BODY", "POSE", "REPS", "MEAT"],
    ["MACHO", "POWER", "SQUAT", "CHEST", "GAINS", "STEAK", "BENCH", "TOUGH", "HEAVY", "SWEAT", "QUADS", "TRAIN", "MEATY", "PROUD", "MIGHT"],
    ["MUSCLE", "BICEPS", "STRONG", "HUNGRY", "LEGDAY", "SHREDS", "PLANKS", "GLUTES", "MIGHTY", "TROPHY", "CHAMPS", "SPRINT", "LUNGES", "PUSHUP", "SHAKER"],
    ["PROTEIN", "TRICEPS", "WORKOUT", "SIXPACK", "CHICKEN", "STRETCH", "BURPEES", "DIETING", "TRAINER", "SPRINTS", "CHINUPS", "HOTBODY", "BRONZED", "MONSTER", "WARMUPS"],
    ["DUMBBELL", "DEADLIFT", "HERCULES", "POSEDOWN", "SHOULDER", "BARBELLS", "ABSOLUTE", "EXERCISE", "MUSCULAR", "CHAMPION", "STRENGTH", "MARATHON", "FLEXIBLE", "GORGEOUS", "SUNSHINE"]
  ];

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var galleryK = null, showK = null;   /* showK: 確認用（覗き穴から1つのポーズを出す） */
  var state, T, penalty, words, wi, ci, cur, flex, wordDone, flash, gallery, misses, pt, pEnd = 1e9, hold = -1, pop = null, hitIdx, impact = 0;
  var STEP = 1.15, FAST = 0.58;                /* 連続ポーズの1文字ぶんの秒数。そろった後の結果発表だけ倍のテンポ */
  var step = STEP, doneT = -1;
  var NW = WORDS.length, PEN = 3;
  var CAM = Number((location.search.match(/[?&]cam=(\d)/) || [])[1] || 0);

  var SH, AY, TY, CW, CH;
  function place() {
    SH = Math.round(H * 0.5);                  /* マッチョの場面 */
    AY = SH;                                   /* 答えの欄 */
    TY = SH + 78;                              /* 翻訳表 */

  if (mini) mini.rain = false;
  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { if (e) e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); if (confetti && state === S.RESULT) confetti.step(1 / 60, W, H); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
