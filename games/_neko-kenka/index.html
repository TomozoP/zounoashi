<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>猫の喧嘩シミュレーター</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #0b1230; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 猫の喧嘩シミュレーター
   押しているあいだ自分の猫が唸る。指の高さが声の高さ。
   声を上下に揺らすほど迫力が出て、相手を押し返す。息が切れたら離して吸う。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, MASTER = null, VOICES = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6;
    MASTER = AC.createGain(); MASTER.gain.value = 0.9;
    MASTER.connect(comp); comp.connect(AC.destination);
    VOICES = { me: makeVoice(-0.35), foe: makeVoice(0.35) };
  }

  /* 猫の声。のこぎり波2本を少しずらして濁らせ、
     口の開きで2つの共鳴（「ウ」→「ア」）を動かす。
     低いところでは細かく震わせて「ゥゥゥ」と唸らせる。 */
  function makeVoice(pan) {
    var o1 = AC.createOscillator(), o2 = AC.createOscillator();
    o1.type = o2.type = "sawtooth";
    o2.detune.value = 16;
    var vib = AC.createOscillator(), vibG = AC.createGain();
    vib.frequency.value = 5.2; vibG.gain.value = 0;
    vib.connect(vibG); vibG.connect(o1.frequency); vibG.connect(o2.frequency);
    var src = AC.createGain(); src.gain.value = 0.5;
    o1.connect(src); o2.connect(src);
    var am = AC.createGain(); am.gain.value = 1;
    var gr = AC.createOscillator(), grG = AC.createGain();
    gr.frequency.value = 31; grG.gain.value = 0;
    gr.connect(grG); grG.connect(am.gain);
    src.connect(am);
    var env = AC.createGain(); env.gain.value = 0;
    function band(f, q, v) {
      var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      var g = AC.createGain(); g.gain.value = v;
      am.connect(bp); bp.connect(g); g.connect(env);
      return bp;
    }
    var f1 = band(700, 5, 1.4), f2 = band(1600, 7, 1.0), f3 = band(3200, 3, 0.25);
    var out = env;
    if (AC.createStereoPanner) { var p = AC.createStereoPanner(); p.pan.value = pan; env.connect(p); out = p; }
    out.connect(MASTER);
    [o1, o2, vib, gr].forEach(function (o) { o.start(); });
    return {
      set: function (f0, open, vol, growl) {
        var n = AC.currentTime, k = 0.03;
        o1.frequency.setTargetAtTime(f0, n, k);
        o2.frequency.setTargetAtTime(f0, n, k);
        vibG.gain.setTargetAtTime(f0 * 0.025, n, 0.1);
        f1.frequency.setTargetAtTime(450 + 650 * open, n, 0.05);
        f2.frequency.setTargetAtTime(1000 + 1500 * open, n, 0.05);
        grG.gain.setTargetAtTime(growl * 0.5, n, 0.05);
        am.gain.setTargetAtTime(1 - growl * 0.5, n, 0.05);
        env.gain.setTargetAtTime(vol, n, vol > 0 ? 0.04 : 0.06);
      }
    };
  }
  function noiseHit(dur, freq, vol, q, type) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = type || "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(MASTER);
    s.start(n); s.stop(n + dur + 0.05);
  }
  function hiss() { noiseHit(0.7, 3800, 0.5, 0.8, "highpass"); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* 声の高さ（0〜1）を周波数に */
  function hz(p, base) { return base * Math.pow(2, p * 1.7); }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var phase, phaseT, bal, aim, me, foe, level, trail;
  var COLORS = [
    { body: "#26262c", eye: "#e8e04a", line: "#b9b7c6" },
    { body: "#8c8d96", eye: "#7fd0ff", line: "#c9ccd8" },
    { body: "#efeae0", eye: "#6fd0a8", line: "#efeae0" },
    { body: "#6b5240", eye: "#f2b84a", line: "#c8a080" },
    { body: "#3c3f58", eye: "#ff7a6a", line: "#9aa0d0" }
  ];
  var ME_COLOR = { body: "#e2883c", eye: "#8fe07a", line: "#ffb36b" };

  var WALL, TR0, TR1;
  function place() {
    WALL = Math.round(H * 0.5);
    TR0 = WALL + 70;                           /* 声の枠（ここだけで声の高さを動かす） */
    TR1 = H - 30;
  }

  function cat() {
    return { p: 0.3, sp: 0.3, on: false, open: 0, onT: 0, x: 0, run: 0, jit: 0, jitT: 0 };
  }
  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    level = 0;
    me = cat();
    aim = 0.4;
    trail = [];
    nextFoe();
  }
  function nextFoe() {
    foe = cat();
    foe.color = COLORS[level % COLORS.length];
    foe.base = 190 + (level % 3) * 18;
    foe.mode = "rest"; foe.rest = 0.6; foe.p = 0.3;
    foe.x = 395;
    phase = "enter"; phaseT = 0;
    bal = 0;
    me.run = 0;
  }

  /* 相手の一声。こちらの声の少し上へついてくるか、決めた高さで張るか。
     強い相手ほど、ついてくるのが速い。 */
  function foePhrase() {
    foe.follow = Math.random() < Math.min(0.85, 0.45 + 0.08 * level);
    foe.goal = 0.2 + Math.random() * 0.6;
    foe.react = Math.min(6, 1.6 + 0.6 * level);
    foe.dur = 1.8 + Math.random() * 2.2;
    foe.feint = Math.random() < 0.35 ? 0.6 + Math.random() * 1.2 : -1;
    foe.t = 0; foe.on = true; foe.onT = 0; foe.mode = "yowl";
  }

  /* 両方鳴いているとき、どちらが押すか。
     相手の少し上（差0.3まで）を取った方が勝ち。離れすぎて上ずると逆に負ける。 */
  function clash(a, b) {
    var x = Math.abs(a - b);
    if (x < 0.02) return 0;
    var g = x < 0.3 ? 1 : (x < 0.5 ? 1 - (x - 0.3) / 0.1 : -1);
    return (a > b ? 1 : -1) * g;
  }
  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    phaseT += dt;

    /* 自分の声 */
    var want = held && (phase === "fight" || phase === "enter");
    if (want && !me.on) me.onT = 0;
    me.on = want;
    var prev = me.sp;
    me.p += (aim - me.p) * Math.min(1, dt * 18);
    me.sp = me.p;
    var vel = Math.abs(me.sp - prev) / Math.max(dt, 1e-3);
    me.warble = (me.warble || 0) + (vel - (me.warble || 0)) * Math.min(1, dt * 2.5);
    if (me.on) me.onT += dt;

    /* 相手の声 */
    if (phase === "fight") {
      if (foe.mode === "yowl") {
        foe.t += dt; foe.onT += dt;
        if (foe.feint > 0 && foe.t >= foe.feint) { foe.feint = -1; foe.follow = false; foe.goal = foe.sp > 0.5 ? 0.1 + Math.random() * 0.2 : 0.75 + Math.random() * 0.2; foe.react = 8; }
        /* 押されていると、上へ回り込むか、ガクッと下げて相手を上ずらせる */
        foe.think = (foe.think || 0) - dt;
        if (foe.think <= 0) {
          foe.think = Math.max(0.35, 1.0 - level * 0.08);
          if (me.on && clash(me.sp, foe.sp) > 0 && Math.random() < Math.min(0.9, 0.4 + 0.1 * level)) {
            foe.follow = false;
            foe.goal = me.sp > 0.7 || Math.random() < 0.4 ? Math.max(0, me.sp - 0.55) : Math.min(1, me.sp + 0.15);
          }
        }
        var tgt = foe.follow ? (me.on ? me.sp + 0.12 : 0.5) : foe.goal;
        tgt += 0.03 * Math.sin(foe.t * 9);
        foe.p += (tgt - foe.p) * Math.min(1, dt * foe.react);
        foe.sp = Math.max(0, Math.min(1, foe.p));
        if (foe.t >= foe.dur) { foe.on = false; foe.mode = "rest"; foe.rest = Math.max(0.25, 0.9 - level * 0.08) * (0.6 + Math.random() * 0.8); }
      } else {
        foe.rest -= dt;
        if (foe.rest <= 0) foePhrase();
      }

      if (me.on && foe.on) bal += dt * 0.4 * clash(me.sp, foe.sp);
      else if (me.on) bal += dt * 0.25;
      else if (foe.on) bal -= dt * 0.25;
      if (bal >= 1) { bal = 1; phase = "win"; phaseT = 0; foe.on = false; me.on = false; screech(VOICES && VOICES.foe, foe.base); }
      else if (bal <= -1) { bal = -1; phase = "lose"; phaseT = 0; foe.on = false; me.on = false; screech(VOICES && VOICES.me, 210); }
    } else if (phase === "enter") {
      foe.x = 395 + Math.max(0, 1 - phaseT / 1.1) * 260;
      if (phaseT > 1.1 && !foe.hissed) { foe.hissed = true; hiss(); }
      if (phaseT > 1.6) { phase = "fight"; phaseT = 0; foe.mode = "rest"; foe.rest = 0.4; }
    } else if (phase === "win") {
      foe.run = phaseT;
      if (phaseT > 1.4) { score++; level++; nextFoe(); }
    } else if (phase === "lose") {
      me.run = phaseT;
      if (phaseT > 1.4) { state = S.RESULT; }
    }

    /* 口の開き：鳴きはじめは閉じた「ウ」から開いていく */
    [me, foe].forEach(function (c) {
      var target = c.on ? Math.min(1, c.onT / 0.35) * (0.35 + 0.65 * c.sp) : 0;
      c.open += (target - c.open) * Math.min(1, dt * 12);
      c.jitT -= dt;
      if (c.jitT <= 0) { c.jitT = 0.06 + Math.random() * 0.1; c.jitGoal = (Math.random() * 2 - 1) * 0.02; }
      c.jit += ((c.jitGoal || 0) - c.jit) * Math.min(1, dt * 10);
    });

    trail.push([me.on ? me.sp : null, foe.on ? foe.sp : null]);
    if (trail.length > 180) trail.shift();

    sound();
  }

  function sound() {
    if (!VOICES) return;
    if (state !== S.PLAY) { VOICES.me.set(200, 0, 0, 0); VOICES.foe.set(200, 0, 0, 0); return; }
    voice(VOICES.me, me, 210);
    voice(VOICES.foe, foe, foe.base);
  }
  function voice(v, c, base) {
    if (c.screamT != null) return;
    if (!c.on) { v.set(hz(c.sp, base), c.open, 0, 0); return; }
    var g = Math.pow(1 - c.sp, 2) * 0.8;
    v.set(hz(c.sp, base) * (1 + c.jit), c.open, 0.5, g);
  }
  /* 負けた側の「ギャッ」 */
  function screech(v, base) {
    if (!v) return;
    var c = v === VOICES.me ? me : foe;
    c.screamT = 0;
    v.set(hz(1.1, base), 1, 0.75, 0);
    hiss();
    setTimeout(function () { v.set(hz(0.6, base), 0.5, 0, 0); c.screamT = null; }, 280);
  }
  /* ============ 入力 ============ */
  var PX0 = 20, PX1 = W - 20, NOWX = W - 90;
  function pitchY(v) { return TR1 - 18 - v * (TR1 - TR0 - 36); }
  function aimAt(y) { aim = Math.max(0, Math.min(1, (TR1 - 18 - y) / (TR1 - TR0 - 36))); }
  function inPanel(x, y) { return y >= TR0 - 10 && y <= TR1 + 10 && x >= PX0 - 10 && x <= PX1 + 10; }
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (y != null && !inPanel(x, y)) return;   /* 声の枠の外は触っても鳴かない */
    held = true;
    if (y != null) aimAt(y);
  }
  function move(x, y) {
    if (state !== S.PLAY) return;
    if (held && y != null) aimAt(y);
  }
  function up() {
    if (!held) return;
    held = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) return;
    if (n === 1 && phase === "fight") bal = 0.999;      /* 1: 相手が逃げる直前 */
    if (n === 2 && phase === "fight") bal = -0.999;     /* 2: 自分が逃げる直前 */
    if (n === 3) { level += 3; } /* 3: 相手を3段強く */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var upK = e.key === "ArrowUp" || e.key === "w" || e.key === "W";
    var dnK = e.key === "ArrowDown" || e.key === "s" || e.key === "S";
    if (!esc && !go && !upK && !dnK) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (upK || dnK) { aim = Math.max(0, Math.min(1, aim + (upK ? 0.12 : -0.12))); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    window.zResultActions.x({ text: "猫を" + score + "匹追い払いました #猫の喧嘩シミュレーター" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawScene() {
    var sky = ctx.createLinearGradient(0, 0, 0, WALL);
    sky.addColorStop(0, "#0b1230"); sky.addColorStop(1, "#2a3458");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, WALL);
    /* 月 */
    ctx.fillStyle = "rgba(255,240,200,.12)";
    ctx.beginPath(); ctx.arc(410, H * 0.15, 80, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f6edc8";
    ctx.beginPath(); ctx.arc(410, H * 0.15, 46, 0, Math.PI * 2); ctx.fill();
    /* 遠くの屋根 */
    ctx.fillStyle = "#141a33";
    ctx.beginPath(); ctx.moveTo(0, WALL);
    var xs = [0, 60, 110, 170, 230, 300, 360, 420, 480, 540];
    var ys = [0.36, 0.33, 0.38, 0.3, 0.35, 0.32, 0.37, 0.31, 0.36, 0.34];
    xs.forEach(function (x, i) { ctx.lineTo(x, H * ys[i]); });
    ctx.lineTo(W, WALL); ctx.fill();
    /* ブロック塀 */
    ctx.fillStyle = "#77736c"; ctx.fillRect(0, WALL, W, H - WALL);
    ctx.fillStyle = "#9a958c"; ctx.fillRect(0, WALL, W, 14);
    ctx.strokeStyle = "#5e5a54"; ctx.lineWidth = 2;
    for (var r = 0, y = WALL + 14; y < H; r++, y += 46) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      for (var x = (r % 2) * 60; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 46); ctx.stroke(); }
    }
    ctx.fillStyle = "rgba(8,10,24,.45)"; ctx.fillRect(0, WALL, W, H - WALL);
  }

  /* 横向きの猫。f=向き(1:右)、s=大きさ、puff=毛の逆立ち、open=口、run=逃げる時間 */
  function drawCat(x, y, f, s, puff, open, col, run) {
    ctx.save();
    ctx.translate(x, y);
    if (run > 0) { f = -f; ctx.translate(-f * -1 * 0, 0); }
    ctx.scale(f * s, s);
    var legPh = run > 0 ? Math.sin(run * 30) : 0;
    var arch = run > 0 ? 6 : 24 + puff * 14;
    ctx.fillStyle = col.body;
    ctx.strokeStyle = col.line; ctx.lineWidth = 2.5;
    /* 脚 */
    [[-38, 1], [-24, -1], [26, 1], [40, -1]].forEach(function (l, i) {
      var sw = legPh * 14 * l[1];
      ctx.beginPath();
      ctx.moveTo(l[0] - 6, -40); ctx.lineTo(l[0] + 6, -40);
      ctx.lineTo(l[0] + 5 + sw, 0); ctx.lineTo(l[0] - 5 + sw, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
    });
    /* しっぽ */
    ctx.lineCap = "round";
    ctx.strokeStyle = col.line; ctx.lineWidth = 14 + puff * 12;
    ctx.beginPath(); ctx.moveTo(-52, -54);
    if (run > 0) ctx.quadraticCurveTo(-90, -60, -110, -40);
    else ctx.quadraticCurveTo(-80, -90, -64, -140 - puff * 10);
    ctx.stroke();
    ctx.strokeStyle = col.body; ctx.lineWidth = 9 + puff * 12;
    ctx.stroke();
    /* 胴（毛が逆立つとギザギザ） */
    ctx.beginPath();
    var n = 44;
    for (var i = 0; i <= n; i++) {
      var a = Math.PI * 2 * i / n;
      var ca = Math.cos(a), sa = Math.sin(a);
      var rr = 1 + (i % 2 ? puff * 0.13 : 0) * (sa < 0.3 ? 1 : 0.3);
      var px = ca * 62 * rr, py = -62 + sa * 26 * rr;
      if (sa < 0) py -= arch * Math.pow(Math.cos(a - Math.PI * 1.5) , 1) * (1 - Math.abs(ca) * 0.6);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = col.body; ctx.fill();
    ctx.strokeStyle = col.line; ctx.lineWidth = 2.5; ctx.stroke();
    /* 頭 */
    var hx = 66, hy = -78 + (run > 0 ? 10 : 0);
    var ear = open > 0.05 ? 0.9 : 0;   /* 鳴くと耳を伏せる */
    ctx.fillStyle = col.body;
    [[-14, 1], [10, -1]].forEach(function (e) {
      ctx.save(); ctx.translate(hx + e[0], hy - 18); ctx.rotate(-ear * 0.9 * (e[1] > 0 ? 1 : 0.8));
      ctx.beginPath(); ctx.moveTo(-10, 4); ctx.lineTo(2, -24); ctx.lineTo(12, 4); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();
    });
    ctx.beginPath(); ctx.ellipse(hx, hy, 28, 25, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    /* 口 */
    var mo = open * 16;
    ctx.fillStyle = "#3a0e14";
    ctx.beginPath();
    ctx.moveTo(hx + 8, hy + 8);
    ctx.lineTo(hx + 30, hy + 4 - mo * 0.3);
    ctx.lineTo(hx + 28, hy + 10 + mo);
    ctx.closePath(); ctx.fill();
    if (open > 0.3) {
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.moveTo(hx + 22, hy + 4); ctx.lineTo(hx + 25, hy + 11); ctx.lineTo(hx + 27, hy + 4); ctx.fill();
    }
    /* 目 */
    ctx.fillStyle = col.eye;
    ctx.beginPath(); ctx.ellipse(hx + 12, hy - 6, 8, 6 - open * 2, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.ellipse(hx + 13, hy - 6, 1.6, 5 - open * 2, 0, 0, Math.PI * 2); ctx.fill();
    /* ひげ */
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5;
    for (var k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(hx + 18, hy + 4); ctx.lineTo(hx + 50, hy + 2 + k * 7); ctx.stroke(); }
    ctx.restore();
  }

  /* 口から出る声の輪 */
  function drawWaves(x, y, f, c, color) {
    if (!c.on) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineCap = "round";
    for (var i = 0; i < 3; i++) {
      var ph = (T * 2.2 + i / 3) % 1;
      var r = 20 + ph * 70;
      ctx.globalAlpha = (1 - ph) * 0.8;
      ctx.lineWidth = 3 + c.sp * 4;
      ctx.beginPath();
      ctx.arc(x, y, r, f > 0 ? -0.6 : Math.PI - 0.6, f > 0 ? 0.6 : Math.PI + 0.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 声の枠。左へ流れる2本の線（自分・相手）と、いまの高さのつまみ */
  function drawTrail() {
    ctx.fillStyle = "rgba(6,8,20,.72)";
    roundRect(PX0, TR0, PX1 - PX0, TR1 - TR0, 18); ctx.fill();
    ctx.strokeStyle = held ? ME_COLOR.line : "rgba(255,255,255,.55)"; ctx.lineWidth = 3;
    roundRect(PX0, TR0, PX1 - PX0, TR1 - TR0, 18); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1;
    for (var g = 1; g < 4; g++) { var gy = pitchY(g / 4); ctx.beginPath(); ctx.moveTo(PX0 + 10, gy); ctx.lineTo(PX1 - 10, gy); ctx.stroke(); }
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.beginPath(); ctx.moveTo(NOWX, TR0 + 8); ctx.lineTo(NOWX, TR1 - 8); ctx.stroke();
    var dx = (NOWX - PX0 - 14) / 179;
    function sx(i) { return NOWX - (trail.length - 1 - i) * dx; }
    /* 両方鳴いているところは、上を取った側の色で間を塗る */
    for (var i = 0; i < trail.length; i++) {
      var a = trail[i][0], b = trail[i][1];
      if (a == null || b == null) continue;
      var w = clash(a, b);
      if (!w) continue;
      ctx.strokeStyle = w > 0 ? "rgba(255,179,107,.4)" : hexA(foe.color.eye, 0.4);
      ctx.lineWidth = dx + 0.6;
      ctx.beginPath(); ctx.moveTo(sx(i), pitchY(a)); ctx.lineTo(sx(i), pitchY(b)); ctx.stroke();
    }
    [[1, foe.color.eye], [0, ME_COLOR.line]].forEach(function (k) {
      ctx.strokeStyle = k[1]; ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      var pen = false;
      for (var i = 0; i < trail.length; i++) {
        var v = trail[i][k[0]];
        if (v == null) { pen = false; continue; }
        if (pen) ctx.lineTo(sx(i), pitchY(v)); else ctx.moveTo(sx(i), pitchY(v));
        pen = true;
      }
      ctx.stroke();
    });
    /* 相手のいまの高さ */
    if (foe.on) {
      ctx.fillStyle = foe.color.eye;
      ctx.beginPath(); ctx.arc(NOWX, pitchY(foe.sp), 9, 0, Math.PI * 2); ctx.fill();
    }
    /* 自分のつまみ。触っていないときは脈打って、触る場所を示す */
    var ky = pitchY(held ? me.sp : aim);
    var pulse = held ? 0 : (Math.sin(T * 5) + 1) / 2;
    ctx.fillStyle = held ? ME_COLOR.body : "rgba(226,136,60,.55)";
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(NOWX, ky, 22 + pulse * 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    [-1, 1].forEach(function (d) {
      ctx.beginPath(); ctx.moveTo(NOWX - 7, ky + d * 36); ctx.lineTo(NOWX, ky + d * 44); ctx.lineTo(NOWX + 7, ky + d * 36); ctx.stroke();
    });
  }
  function hexA(h, a) {
    var n = parseInt(h.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  function drawHud() {
    /* 得点 */
    ctx.fillStyle = "#fff"; ctx.font = "800 40px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, 52);
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    drawScene();
    var shake = (me.on && foe.on) ? 1.5 : 0;
    /* 有利な方が大きく前へ、不利な方は小さく後ろへ */
    var mS = 1 + 0.25 * bal, fS = 1 - 0.25 * bal;
    var mx = 145 + bal * 60 - me.run * 420;
    var fx = (phase === "enter" ? foe.x : 395) + bal * 60 + foe.run * 420;
    var mp = (me.on ? 0.5 : 0.2) + 0.4 * Math.max(0, bal);
    var fp = (foe.on ? 0.5 : 0.2) + 0.4 * Math.max(0, -bal);
    if (state !== S.INTRO) {
      drawCat(mx + (Math.random() - 0.5) * shake, WALL + 4, 1, mS, mp, me.open, ME_COLOR, me.run);
      drawCat(fx + (Math.random() - 0.5) * shake, WALL + 4, -1, fS, fp, foe.open, foe.color, foe.run);
      drawWaves(mx + 96 * mS, WALL - 70 * mS, 1, me, ME_COLOR.line);
      drawWaves(fx - 96 * fS, WALL - 70 * fS, -1, foe, foe.color.eye);
      drawTrail();
      drawHud();
    } else {
      drawCat(145, WALL + 4, 1, 0.95, 0.3, 0, ME_COLOR, 0);
      drawCat(395, WALL + 4, -1, 0.95, 0.3, 0, COLORS[0], 0);
    }
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, phase: phase, bal: bal, foeOn: foe.on, foeP: foe.sp, level: level, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 40)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
