<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>直ピザ配達</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #9fd3f2; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="pizza3d.js"></script>
<script>
/* 直ピザ配達

   ピザを指で上へスライドして離すと、スライドした向きへ飛ぶ。スライドした長さが距離。
   お客の手元に届けば配達成功で、次のお客はもっと遠い。届けた軒数が結果。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 数字 ============ */
  var G = 9.8;
  var ELEV = 0.30;             /* 投げ上げる角度（ラジアン） */
  var LIFT = 0.010;            /* 回転で浮く力（速さの2乗にかける） */
  var DRAG = 0.04;             /* 空気でゆっくり遅くなる */
  var PULL_MIN = 30;           /* これより短いスライドは投げない */
  var PULL_V = 32 / 600;       /* スライドした長さ（ゲーム座標）→ 速さ（m/秒） */
  var CATCH_R = 1.15;          /* お客が取れる横のずれ */
  var HAND = { x: 0, y: 1.2, z: 0.75 };   /* 自分の目の前、少し下 */

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, keyMode = false;
  var phase, spin = 1, pizza, customer, pieces, caught, afterT, best, snap;
  var held, sx, sy, dragX, dragY, trail, keyAim, keyPow, keyPowOn;

  var scene3d = null, tries3d = 0, lastTry3d = -1e9;
  function make3d() {
    if (scene3d || tries3d >= 20 || !window.THREE || !window.PizzaScene) return;
    var now = performance.now();
    if (now - lastTry3d < 500) return;
    lastTry3d = now; tries3d++;
    try { scene3d = new window.PizzaScene(); } catch (e) { scene3d = null; }
  }
  make3d();

  var seed = 1;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  /* n軒目のお客の場所。遠く、横に、そのうち2階のベランダにも */
  function makeCustomer(n) {
    var z = Math.min(95, 9 + n * 6 + rnd() * 3);
    var side = Math.min(3.6, 0.8 + n * 0.45);
    var c = { seed: n + 1, x: (rnd() * 2 - 1) * side, y: 0, z: z };
    if (n >= 3 && rnd() < 0.35) { c.x = (rnd() < 0.5 ? -1 : 1) * 5.6; c.y = 3.2; }
    c.dist = Math.round(Math.sqrt(c.x * c.x + c.z * c.z));
    return c;
  }

  function newPizza() {
    return { x: HAND.x, y: HAND.y, z: HAND.z, vx: 0, vy: 0, vz: 0, r: 0.26, rot: 0, tiltX: 0, tiltZ: 0, spin: 1, wob: 0, wobPh: 0 };
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; T = 0; best = 0;
    seed = 3 + Math.floor(Math.random() * 1000);
    customer = makeCustomer(0);
    nextPizza();
  }
  function nextPizza() {
    phase = "aim"; pizza = newPizza(); pieces = [];
    caught = false; afterT = 0; snap = true;
    held = false; dragX = dragY = 0;
    keyAim = 0; keyPow = 0; keyPowOn = false;
  }

  /* 投げる。v は速さ（m/秒）、ang は横の角度（右が正） */
  function throwPizza(v, ang) {
    if (phase !== "aim") return;
    v = Math.max(4, Math.min(36, v));
    ang = Math.max(-0.6, Math.min(0.6, ang));
    var h = v * Math.cos(ELEV);
    pizza.vx = h * Math.sin(ang); pizza.vz = h * Math.cos(ang); pizza.vy = v * Math.sin(ELEV);
    pizza.wobPh = Math.random() * 6.28;
    pizza.wob = (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.6);
    phase = "fly";
    noiseHit(0.25, 900, 0.25, 1.2);
    tone(330, 0.12, 0.06, "triangle", 660);
  }

  /* 1コマぶん飛ばす（シミュレーションと共用） */
  function flyStep(p, dt, t) {
    var sp = Math.min(1, p.spin);
    var vh = Math.sqrt(p.vx * p.vx + p.vz * p.vz);
    var ay = -G + LIFT * sp * sp * vh * vh;
    if (p.vy > 0) ay -= LIFT * 0.5 * vh * vh * sp * sp * 0.4;
    /* 回転が足りないと横にふらつく */
    var ax = (1 - sp) * (4.5 * Math.sin(t * 5 + p.wobPh) + 3 * p.wob);
    var d = DRAG * (1 + (1 - sp) * 2);
    p.vx += (ax - d * p.vx) * dt;
    p.vy += (ay - d * p.vy * 0.3) * dt;
    p.vz += (-d * p.vz) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
  }

  function deliver() {
    caught = true; phase = "after"; afterT = 0;
    score++;
    best = Math.max(best, customer.dist);
    tone(784, 0.1, 0.1, "square"); tone(988, 0.1, 0.1, "square", null, 0.1); tone(1319, 0.3, 0.1, "square", null, 0.2);
  }
  function miss(how) {
    phase = "after"; afterT = 0; caught = false;
    if (how === "ground") { pizza.splat = true; noiseHit(0.3, 300, 0.4, 0.8); }
    else if (how === "wall") { pizza.splat = false; noiseHit(0.25, 500, 0.4, 0.8); burst(); }
    tone(220, 0.4, 0.08, "sawtooth", 110, 0.1);
  }
  function burst() {
    pizza.torn = true;
    pieces = [];
    for (var i = 0; i < 6; i++) {
      var a = i / 6 * Math.PI * 2;
      pieces.push({ x: pizza.x, y: pizza.y, z: pizza.z, vx: pizza.vx * 0.3 + Math.cos(a) * 3, vy: 2 + Math.random() * 3, vz: pizza.vz * 0.3 + Math.sin(a) * 3,
        r: pizza.r, rx: 0, ry: a, rz: 0, wr: (Math.random() - 0.5) * 20 });
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state === S.INTRO) { T += dt; if (pizza) pizza.rot += dt * 3; return; }
    if (state !== S.PLAY) return;
    T += dt;
    if (phase === "aim") {
      /* スライドしている間は、ピザが指についていく */
      var k = 1 - Math.exp(-dt * 20);
      var tx = held ? dragX : 0, ty = held ? dragY : 0;
      pizza.x += (HAND.x + tx * 0.0009 - pizza.x) * k;
      pizza.y += (HAND.y - Math.max(-200, Math.min(400, ty)) * 0.0007 - pizza.y) * k;
      pizza.z = HAND.z;
      pizza.tiltX += ((held ? ty * 0.0006 : 0) - pizza.tiltX) * k;
      pizza.tiltZ += ((held ? -tx * 0.0006 : 0) - pizza.tiltZ) * k;
      if (keyPowOn) keyPow += dt;
    } else if (phase === "fly") {
      var prevZ = pizza.z;
      flyStep(pizza, dt, T);
      pizza.rot += dt * 8;
      pizza.tiltX *= 0.9; pizza.tiltZ *= 0.9;
      var c = customer;
      if (prevZ < c.z && pizza.z >= c.z) {
        var dy = pizza.y - c.y;
        if (Math.abs(pizza.x - c.x) < CATCH_R + pizza.r && dy > 0.4 && dy < 2.6) { deliver(); return; }
      }
      if (Math.abs(pizza.x) > 7.4) { miss("wall"); return; }
      if (pizza.y <= 0.03) { pizza.y = 0.03; miss("ground"); return; }
      if (pizza.z > c.z + 40) { miss("ground"); return; }
    } else if (phase === "after") {
      afterT += dt;
      if (caught) {
        pizza.x = customer.x; pizza.y = customer.y + 2.25 + Math.abs(Math.sin(afterT * 9)) * 0.35; pizza.z = customer.z;
        pizza.tiltX = pizza.tiltZ = 0; pizza.rot += dt * 2;
        if (afterT > 1.6) { customer = makeCustomer(score); nextPizza(); }
      } else {
        if (!pizza.splat && !pizza.torn && pizza.y > 0.03) { flyStep(pizza, dt, T); if (pizza.y <= 0.03) { pizza.y = 0.03; pizza.splat = true; } }
        if (afterT > 1.6) end();
      }
    }
    pieces.forEach(function (q) {
      if (q.y <= 0.03) { q.y = 0.03; q.rx = 0; q.rz = 0; return; }
      q.vy -= G * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      q.rx += q.wr * dt; q.rz += q.wr * 0.7 * dt;
    });
  }

  function end() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  /* ============ 入力 ============
     ピザを上へスライドして離すと投げる。向きは離す直前に動かしていた向き、長さが速さ。 */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null || phase !== "aim") return;
    held = true; sx = x; sy = y; dragX = dragY = 0;
    trail = [{ x: x, y: y, t: performance.now() }];
  }
  function move(x, y) {
    if (state !== S.PLAY || !held || phase !== "aim") return;
    dragX = x - sx; dragY = y - sy;
    trail.push({ x: x, y: y, t: performance.now() });
    if (trail.length > 40) trail.shift();
  }
  function up() {
    if (!held) return;
    held = false;
    if (state !== S.PLAY || phase !== "aim") return;
    var len = Math.sqrt(dragX * dragX + dragY * dragY);
    if (len < PULL_MIN || dragY >= 0) return;
    /* 向きは最後の0.12秒ぶんの動き（短すぎるときは押したところから） */
    var now = performance.now(), last = trail[trail.length - 1], first = trail[0];
    for (var i = trail.length - 1; i >= 0; i--) { if (now - trail[i].t > 120) break; first = trail[i]; }
    var dx = last.x - first.x, dy = last.y - first.y;
    if (dx * dx + dy * dy < 400 || dy >= 0) { dx = dragX; dy = dragY; }
    throwPizza(4 + len * PULL_V, Math.atan2(dx, -dy) * 0.5);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); var p = atCanvas(e); move(p.x, p.y); up(); });
  wrap.addEventListener("pointercancel", function () { held = false; });
  window.addEventListener("blur", function () { held = false; });

  /* お客にちょうど届く速さを探す（数字キーの自動投げと確認用） */
  function aimFor(c, sp) {
    var ang = Math.atan2(c.x - HAND.x, c.z - HAND.z);
    var lo = 4, hi = 36;
    for (var k = 0; k < 30; k++) {
      var v = (lo + hi) / 2, h = v * Math.cos(ELEV);
      var p = { x: HAND.x, y: HAND.y, z: HAND.z, vx: h * Math.sin(ang), vy: v * Math.sin(ELEV), vz: h * Math.cos(ang), spin: sp, wob: 0, wobPh: 0 };
      var t = 0;
      while (p.z < c.z && p.y > 0 && t < 20) { flyStep(p, 1 / 60, t); t += 1 / 60; }
      var y = p.z >= c.z ? p.y : -1;
      if (y < c.y + 1.4) lo = v; else hi = v;
    }
    return { v: (lo + hi) / 2, ang: ang };
  }

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) return;
    if (n === 1 && phase === "aim") { var a = aimFor(customer, 1); throwPizza(a.v, a.ang); }
    if (n === 2 && phase === "aim") throwPizza(8, 0.3);
    if (n === 3 && phase === "aim") { score = 9; customer = makeCustomer(9); snap = true; }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var upK = e.key === "ArrowUp" || e.key === "w" || e.key === "W";
    if (!esc && !go && !left && !right && !upK) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (state === S.PLAY && phase === "aim") {
      /* キーでは：左右で向き、上キーかスペースを押している長さで強さ */
      if (left) keyAim = Math.max(-0.5, keyAim - 0.05);
      if (right) keyAim = Math.min(0.5, keyAim + 0.05);
      if ((upK || go) && !keyPowOn) { keyPowOn = true; keyPow = 0; }
      return;
    }
    if (e.repeat || !go) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var upK = e.key === "ArrowUp" || e.key === "w" || e.key === "W";
    if (go && state === S.INTRO) { startButton.click(); return; }
    if ((upK || go) && keyPowOn && state === S.PLAY && phase === "aim") { keyPowOn = false; throwPizza(4 + keyPow * 18, keyAim); }
  });

  function doShare() {
    var text;
    if (score === 0) text = zT("ピザを道に叩きつけて配達をあきらめた", "Slammed the pizza onto the street and gave up delivering");
    else text = zT("店から" + best + "m先のお客にピザを直接投げて届けた（" + score + "軒）",
      "Threw a pizza straight to a customer " + best + "m away (" + score + " deliveries)");
    window.zResultActions.x({ text: text + zT(" #直ピザ配達", " #DirectPizzaDelivery") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var lastDraw = 0;
  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    var now = performance.now(), ddt = Math.min(0.1, (now - (lastDraw || now)) / 1000); lastDraw = now;
    make3d();
    var st = { phase: phase, spin: spin, pizza: pizza, customer: customer, pieces: pieces || [], caught: caught, afterT: afterT, T: T, snap: snap };
    var ok = false;
    if (scene3d) { try { ok = scene3d.render(ctx, W, H, st, ddt || 1 / 60); } catch (e) { ok = false; } }
    snap = false;
    if (!ok) { ctx.fillStyle = "#9fd3f2"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "#4b4f57"; ctx.fillRect(0, H * 0.55, W, H * 0.45); }
    if (state === S.PLAY) {
      /* 届けた軒数 */
      ctx.save();
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 6;
      ctx.font = "800 64px sans-serif"; ctx.textAlign = "center";
      ctx.strokeText(String(score), W / 2, 92); ctx.fillText(String(score), W / 2, 92);
      ctx.restore();
      if (phase === "aim" && keyMode) drawKeyAim();
    }
    if (state === S.RESULT) drawResult();
  }

  /* キー操作のときだけ向きと強さの目印 */
  function drawKeyAim() {
    var len = 40 + (keyPowOn ? Math.min(1.8, keyPow) * 60 : 0);
    ctx.save();
    ctx.translate(W / 2, H - 120);
    ctx.rotate(keyAim);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillRect(-4, -len, 8, len);
    ctx.restore();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { threeD: !!scene3d, state: state, phase: phase, score: score, pizza: pizza && { x: pizza.x, y: pizza.y, z: pizza.z }, customer: customer, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    aimFor: function (sp) { return aimFor(customer, sp); },
    throwAt: function (v, ang) { throwPizza(v, ang); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
