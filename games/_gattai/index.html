<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>北海道詰め</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../celebrate.js"></script>   <!-- ファンファーレと紙吹雪 -->
<script src="../hikkoshi/vendor/matter.min.js"></script>   <!-- 物理（matter-js 0.20.0, MIT） -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="prefs.js"></script>   <!-- 都道府県の形 -->
<script src="scene3d.js"></script>
<script>
/* 北海道詰め（仮題）

   北海道の本当の輪郭を器にして、あいてと交互に県を1つずつ入れる（大きさは本物どおり）。
   県は吊るされた所から、左右に動かして・回して・落とす。止まったときに器からはみ出していたら、入れた側の負け。
   絵は3D（scene3d.js）。ゲームの座標は px（地面が y=0、上がマイナス）。 */
(function () {
  "use strict";
  var M = window.Matter || (typeof Matter !== "undefined" ? Matter : null);   /* 確認用の道具の中では window に付かない */

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, OUT = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor();
    OUT.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, to, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    var n = AC.currentTime + (delay || 0);
    f.type = "bandpass"; f.frequency.setValueAtTime(freq, n); f.Q.value = q || 1;
    if (to) f.frequency.exponentialRampToValueAtTime(to, n + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  var SFX = {
    whoosh: function () { noiseHit(0.5, 600, 0.12, 1.2, 2400); },
    clang: function () {                         /* ぴったりはまった */
      tone(1180, 0.5, 0.12, "square", 1100); tone(1770, 0.4, 0.07, "triangle"); tone(220, 0.25, 0.2, "square", 110);
      noiseHit(0.18, 3200, 0.3, 2);
    },
    stick: function () { tone(140, 0.25, 0.25, "square", 60); noiseHit(0.2, 500, 0.35, 1); },
    lost: function () { tone(500, 0.35, 0.08, "triangle", 160); },
    land: function () { tone(70, 0.6, 0.45, "sine", 35); noiseHit(0.6, 180, 0.6, 0.8); },
    swing: function () { noiseHit(0.16, 900, 0.12, 1.5, 2600); },
    hit: function (k) { k = Math.min(1, k); tone(120, 0.18, 0.3 * k + 0.1, "square", 50); noiseHit(0.2, 1400, 0.4 * k + 0.15, 1.2); noiseHit(0.08, 4000, 0.2 * k, 2); },
    hurt: function (k) { k = Math.min(1, k); tone(90, 0.3, 0.3 * k + 0.1, "sawtooth", 40); noiseHit(0.3, 700, 0.4 * k + 0.1, 1); },
    roar: function (big) {
      var d = big ? 1.2 : 0.6;
      tone(150, d, 0.16, "sawtooth", 70); tone(96, d, 0.14, "sawtooth", 55);
      noiseHit(d, 900, 0.25, 0.7, 300);
    },
    lose: function () { tone(330, 0.4, 0.12, "triangle", 300); tone(262, 0.5, 0.12, "triangle", 240, 0.35); tone(196, 0.9, 0.14, "triangle", 150, 0.75); }
  };
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });


  /* ============ 県のかたち ============
     PREFS（prefs.js）の輪郭を K 倍して px にする。物理には凸包を使い、中心は凸包の重心に合わせる */
  var K = 2.5;
  function hull(pts) {
    var p = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
    var lo = [], up = [];
    p.forEach(function (q) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); });
    p.slice().reverse().forEach(function (q) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); });
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  function centroid(h) {
    var a = 0, cx = 0, cy = 0;
    for (var i = 0; i < h.length; i++) {
      var p = h[i], q = h[(i + 1) % h.length], c = p[0] * q[1] - q[0] * p[1];
      a += c; cx += (p[0] + q[0]) * c; cy += (p[1] + q[1]) * c;
    }
    return a ? [cx / (3 * a), cy / (3 * a)] : [0, 0];
  }
  var SHAPES = window.GattaiShapes = (window.PREFS || []).map(function (d, i) {
    var pts = d.p.map(function (q) { return [q[0] * K, q[1] * K]; });
    var c = centroid(hull(pts));
    pts = pts.map(function (q) { return [q[0] - c[0], q[1] - c[1]]; });
    var h = hull(pts), r = 0;
    h.forEach(function (q) { r = Math.max(r, Math.hypot(q[0], q[1])); });
    return { i: i, name: d.n, pts: pts, hull: h, r: r };
  });
  /* 県ごとの色（色相を47に分けて、となりの番号どうしは離す） */
  function prefColor(i) { return "hsl(" + Math.round((i * 137.5) % 360) + ",72%,58%)"; }
  function pointIn(h, x, y) {
    var inside = false;
    for (var i = 0, j = h.length - 1; i < h.length; j = i++) {
      if ((h[i][1] > y) !== (h[j][1] > y) && x < (h[j][0] - h[i][0]) * (y - h[i][1]) / (h[j][1] - h[i][1]) + h[i][0]) inside = !inside;
    }
    return inside;
  }
  function segDist(px, py, a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy || 1;
    var t = Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / l));
    return Math.hypot(px - a[0] - dx * t, py - a[1] - dy * t);
  }

  /* ============ 器（北海道） ============
     北海道の本当の輪郭を器にする。外向きの向きが上を向いている辺（屋根）は開けて、そこから県を入れる。
     底が地面（y=0）に付くように置く */
  var HK = 0, BOX = null, WALL = 24;
  function makeBox() {
    var sh = SHAPES[HK], maxY = -1e9;
    sh.pts.forEach(function (q) { maxY = Math.max(maxY, q[1]); });
    var pts = sh.pts.map(function (q) { return [q[0], q[1] - maxY]; });
    var walls = [], roofs = [], top = 0, left = 1e9, right = -1e9;
    pts.forEach(function (q) { top = Math.min(top, q[1]); left = Math.min(left, q[0]); right = Math.max(right, q[0]); });
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      var nx = dy / l, ny = -dx / l, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (pointIn(pts, mx + nx * 3, my + ny * 3)) { nx = -nx; ny = -ny; }
      (ny < 0 && open(mx, my) ? roofs : walls).push({ a: a, b: b, nx: nx, ny: ny, l: l });
    }
    /* 空から見える辺（真上にほかの辺がない）だけを開ける */
    function open(x, y) {
      for (var k = 0; k < pts.length; k++) {
        var p = pts[k], q = pts[(k + 1) % pts.length];
        if ((p[0] - x) * (q[0] - x) > 0 || p[0] === q[0]) continue;
        if (p[1] + (q[1] - p[1]) * (x - p[0]) / (q[0] - p[0]) < y - 1) return false;
      }
      return true;
    }
    return { pts: pts, walls: walls, roofs: roofs, top: top, left: left, right: right };
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", AIM: "aim", FALL: "fall", RESULT: "result" };
  var state, T, won, fx, shake, cam;
  var engine, pieces, deck, cur, turn, count, settleT, calmT, loseBy, cpuPlan, endT, forceOut;
  var conf = window.zCelebrate ? window.zCelebrate.confetti() : null;
  if (conf) conf.rain = false;
  var G = 1, STEP = 1000 / 60;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    T = 0; won = false; fx = []; shake = 0; count = 0; loseBy = null; endT = 0; forceOut = null;
    BOX = BOX || makeBox();
    engine = M.Engine.create();
    engine.gravity.y = G;
    engine.positionIterations = 10; engine.velocityIterations = 8;
    var statics = [M.Bodies.rectangle(0, 100, 6000, 200, { isStatic: true, friction: 0.8 })];
    BOX.walls.forEach(function (w) {
      var cx = (w.a[0] + w.b[0]) / 2 + w.nx * WALL / 2, cy = (w.a[1] + w.b[1]) / 2 + w.ny * WALL / 2;
      statics.push(M.Bodies.rectangle(cx, cy, w.l + WALL, WALL, { isStatic: true, friction: 0.6, angle: Math.atan2(w.b[1] - w.a[1], w.b[0] - w.a[0]) }));
    });
    statics.forEach(function (b) { b.isWall = true; });
    M.Composite.add(engine.world, statics);
    pieces = [];
    deck = [];
    for (var i = 0; i < SHAPES.length; i++) if (i !== HK) deck.push(i);
    for (i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    turn = 0;
    cam = { x: (BOX.left + BOX.right) / 2, y: 0, w: 0 };
    fitCam(true);
    if (conf) conf.clear();
    var s3 = scene3d(); if (s3) s3.reset();
    nextPiece();
  }
  function fitCam(snap) {
    var w = BOX.right - BOX.left + 70;
    var visH = w * H / W, y = BOX.top / 2 - 40;
    if (snap) { cam.w = w; cam.y = y; }
    else { cam.w += (w - cam.w) * 0.1; cam.y += (y - cam.y) * 0.1; }
  }

  /* ---------- 1手（県を吊るして、動かして、落とす） ---------- */
  function hangY(i) { return BOX.top - SHAPES[i].r - 40; }
  function nextPiece() {
    if (!deck.length) { finish(true); return; }
    var i = deck.pop();
    cur = { i: i, x: (BOX.left + BOX.right) / 2, y: hangY(i), a: 0, ta: 0 };
    state = S.AIM;
    cpuPlan = turn === 1 ? planCPU(cur) : null;
    if (turn === 1 && forceOut === "cpu") { cpuPlan.x = BOX.right + 120; forceOut = null; }
    tone(turn ? 392 : 523, 0.1, 0.1, "square");
  }
  function hullAt(i, x, y, a) {
    var c = Math.cos(a), s = Math.sin(a);
    return SHAPES[i].hull.map(function (q) { return [x + q[0] * c - q[1] * s, y + q[0] * s + q[1] * c]; });
  }
  function drop() {
    if (state !== S.AIM) return;
    cur.a = cur.ta;
    var verts = hullAt(cur.i, 0, 0, cur.a).map(function (q) { return { x: q[0], y: q[1] }; });
    var b = M.Bodies.fromVertices(cur.x, cur.y, [verts], { friction: 0.6, frictionStatic: 0.8, frictionAir: 0.01, restitution: 0.05, density: 0.002 });
    M.Body.setPosition(b, { x: cur.x, y: cur.y });
    b.piece = { i: cur.i, a: cur.a }; b.by = turn; b.pi = pieces.length;
    M.Composite.add(engine.world, b);
    pieces.push(b);
    cur = null; state = S.FALL; settleT = 0; calmT = 0;
    SFX.whoosh();
  }
  /* 器からはみ出しているか（凸包の角が北海道の外へ 8px より出ている） */
  function outside(b) {
    var P = BOX.pts;
    for (var k = 0; k < b.vertices.length; k++) {
      var v = b.vertices[k];
      if (pointIn(P, v.x, v.y)) continue;
      var d = 1e9;
      for (var i = 0; i < P.length; i++) d = Math.min(d, segDist(v.x, v.y, P[i], P[(i + 1) % P.length]));
      if (d > 8) return true;
    }
    return false;
  }
  function updateFall(dt) {
    settleT += dt;
    var still = true;
    pieces.forEach(function (b) {
      if (Math.hypot(b.velocity.x, b.velocity.y) > 0.12 || Math.abs(b.angularVelocity) > 0.004) still = false;
    });
    calmT = still ? calmT + dt : 0;
    if (calmT < 0.5 && settleT < 6) return;
    var bad = pieces.filter(outside);
    if (bad.length) {
      bad.forEach(function (b) { b.bad = true; });
      loseBy = turn; finish(turn === 1);
      return;
    }
    count++;
    SFX.clang();
    turn = 1 - turn;
    nextPiece();
  }

  /* ---------- 相手（いちばん深く入りそうな所と向きを、少しまちがえながら選ぶ） ---------- */
  function surfaceY(x) {                         /* x の真上から見た、いちばん上の面 */
    var best = 200;
    M.Composite.allBodies(engine.world).forEach(function (b) {
      var V = b.vertices;
      for (var k = 0; k < V.length; k++) {
        var p = V[k], q = V[(k + 1) % V.length];
        if ((p.x - x) * (q.x - x) > 0 || p.x === q.x) continue;
        var y = p.y + (q.y - p.y) * (x - p.x) / (q.x - p.x);
        if (y < best) best = y;
      }
    });
    return best;
  }
  function planCPU(c) {
    var best = null;
    for (var n = 0; n < 48; n++) {
      var a = Math.floor(Math.random() * 12) * Math.PI / 6;
      var h = hullAt(c.i, 0, 0, a), lo = 1e9, hi = -1e9, bottom = -1e9;
      h.forEach(function (q) { lo = Math.min(lo, q[0]); hi = Math.max(hi, q[0]); bottom = Math.max(bottom, q[1]); });
      var x = BOX.left - lo + Math.random() * Math.max(1, (BOX.right - BOX.left) - (hi - lo));
      var land = 1e9;
      for (var k = 0; k <= 6; k++) {
        var sx = x + lo + (hi - lo) * k / 6;
        land = Math.min(land, surfaceY(sx));
      }
      var restY = land - bottom, ok = 1;
      h.forEach(function (q) { if (!pointIn(BOX.pts, x + q[0], restY + q[1] - 4)) ok = 0; });
      var score = ok * 1000 + restY + (Math.random() - 0.5) * 50;
      if (!best || score > best.score) best = { x: x, a: a, score: score };
    }
    return { x: best.x, a: best.a, t: 0 };
  }
  function updateCPU(dt) {
    var p = cpuPlan;
    p.t += dt;
    if (p.t > 0.35) {
      cur.x += (p.x - cur.x) * Math.min(1, dt * 5);
      cur.ta = p.a;
    }
    if (p.t > 1.3) drop();
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (conf) conf.step(dt, W, H);
    fx = fx.filter(function (f) { f.t += dt; return f.t < 0.6; });
    shake = Math.max(0, shake - dt * 30);
    T += dt;
    if (!engine) return;
    if (cur) cur.a += angDiff(cur.ta - cur.a) * Math.min(1, dt * 14);
    if (state === S.AIM && turn === 1) updateCPU(dt);
    if (state === S.AIM && turn === 0) {
      var mv = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
      if (mv) moveCur(mv * 320 * dt);
    }
    if (state !== S.INTRO) M.Engine.update(engine, STEP);
    if (state === S.FALL && endT === 0) updateFall(dt);
    if (endT > 0) { endT += dt; if (endT > 2.2 && state !== S.RESULT) { state = S.RESULT; shareButton.hidden = false; } }
  }
  function angDiff(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  function moveCur(dx) {
    if (!cur) return;
    var r = SHAPES[cur.i].r;
    cur.x = Math.max(BOX.left - r, Math.min(BOX.right + r, cur.x + dx));
  }
  function rotateCur() { if (cur && state === S.AIM && turn === 0) { cur.ta += Math.PI / 6; tone(660, 0.05, 0.08, "square"); } }
  function finish(win) {
    if (endT > 0) return;
    won = win; endT = 0.001; state = S.FALL;
    if (win) {
      setTimeout(function () { if (won && AC && window.zCelebrate) window.zCelebrate.play(AC, "fanfare", { dest: OUT }); }, 300);
      if (conf) conf.burst(W, H, 160);
    } else SFX.lose();
    shake = 10;
  }

  /* ============ 入力 ============ */
  var keys = { l: false, r: false };
  var drag = null;
  function ctrlButtons() {
    var r = 50, y = H - 96;
    return [{ kind: "rot", x: W / 2 - 90, y: y, r: r }, { kind: "drop", x: W / 2 + 90, y: y, r: r }];
  }
  function down(x, y, id) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.AIM || turn !== 0 || endT > 0) return;
    if (x == null) { drop(); return; }
    var bs = ctrlButtons();
    for (var i = 0; i < bs.length; i++) if (Math.hypot(x - bs[i].x, y - bs[i].y) < bs[i].r + 16) { if (bs[i].kind === "rot") rotateCur(); else drop(); return; }
    drag = { id: id, x: x };
  }
  function move(x, y, id) {
    if (!drag || drag.id !== id) return;
    var k = cam.w / W;
    moveCur((x - drag.x) * k);
    drag.x = x;
  }
  function up(id) { if (drag && (id == null || drag.id === id)) drag = null; }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) { e.preventDefault(); var p = atCanvas(e); down(p.x, p.y, e.pointerId); });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y, e.pointerId); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) { up(e.pointerId); });
  window.addEventListener("blur", function () { up(); keys.l = keys.r = false; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.AIM || turn !== 0 || endT > 0) return;
    if (n === 1) { var p = planCPU(cur); cur.x = p.x; cur.ta = cur.a = p.a; drop(); }   /* 自分の県を、相手と同じ考えで置いて落とす */
    if (n === 2) { forceOut = "cpu"; debugKey(1); }                                     /* 次の相手の県が器の外へ（勝ち） */
    if (n === 3) { cur.x = BOX.right + 120; drop(); }                                   /* 自分の県を器の外へ（負け） */
  }
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    if (e.key === "Escape") { e.preventDefault(); if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); keys.l = true; return; }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); keys.r = true; return; }
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === "x" || e.key === "X") { e.preventDefault(); if (!e.repeat) rotateCur(); return; }
    var go = e.code === "Space" || e.key === " " || e.key === "Enter" || e.key === "ArrowDown";
    if (!go) return;
    e.preventDefault();
    if (e.repeat || state === S.INTRO) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.l = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.r = false;
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  /* ============ シェア ============ */
  function doShare() {
    var text = won
      ? zT("北海道に" + count + "県詰めて勝った", "Packed " + count + " prefectures into Hokkaido and won", "홋카이도에 " + count + "개 현을 채워 넣고 이겼다", "在北海道塞进" + count + "个县，赢了", "在北海道塞進" + count + "個縣，贏了")
      : zT("北海道に" + count + "県詰めたところで、あふれて負けた", "Hokkaido overflowed after " + count + " prefectures", "홋카이도에 " + count + "개 현을 채우고 넘쳐서 졌다", "北海道塞进" + count + "个县后溢出，输了", "北海道塞進" + count + "個縣後溢出，輸了");
    window.zResultActions.x({ text: text + zT(" #北海道詰め", " #HokkaidoPacking") });
  }

  /* ============ 描画 ============ */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };
  function snapshot() {
    var list = (pieces || []).map(function (b) { return { id: "p" + b.pi, i: b.piece.i, x: b.position.x, y: b.position.y, a: b.angle + b.piece.a, bad: b.bad && endT > 0 && Math.floor(T * 4) % 2 === 0 }; });
    if (cur) list.push({ id: "cur" + (pieces ? pieces.length : 0), i: cur.i, x: cur.x, y: cur.y, a: cur.a, sel: true });
    var sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    return { pieces: list, box: BOX, cam: { x: cam.x + sx, y: cam.y + sy, w: cam.w }, t: T, state: state };
  }
  var proj = null;
  function toScreen(x, y) {
    if (proj) return proj(x, y);
    var k = W / cam.w;
    return { x: W / 2 + (x - cam.x) * k, y: H / 2 + (y - cam.y) * k };
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    var s3 = scene3d(), drew = false;
    if (s3 && BOX) {
      try { s3.sync(snapshot()); drew = s3.draw(ctx, W, H); proj = function (x, y) { return s3.project(x, y, W, H); }; }
      catch (e) { scene3d.drop(); proj = null; }
    }
    if (!drew) { proj = null; drawFlat(); }
    if (hideUI) return;
    if (state === S.AIM && cur) drawAim();
    if (state !== S.INTRO && state !== S.RESULT) drawHUD();
    if (state === S.RESULT) drawResult();
    if (conf) conf.draw(ctx);
  }
  function shapePath(i, x, y, a, k) {
    var c = Math.cos(a), s = Math.sin(a);
    ctx.beginPath();
    SHAPES[i].pts.forEach(function (q, n) {
      var px = x + (q[0] * c - q[1] * s) * k, py = y + (q[0] * s + q[1] * c) * k;
      if (n) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    });
    ctx.closePath();
  }
  function drawFlat() {
    ctx.fillStyle = "#8fb8d8"; ctx.fillRect(0, 0, W, H);
    if (!BOX) return;
    var g = toScreen(0, 0); ctx.fillStyle = "#6b7280"; ctx.fillRect(0, g.y, W, H - g.y);
    var k = W / cam.w;
    ctx.beginPath();
    BOX.pts.forEach(function (q, n) { var s = toScreen(q[0], q[1]); if (n) ctx.lineTo(s.x, s.y); else ctx.moveTo(s.x, s.y); });
    ctx.closePath(); ctx.fillStyle = "#e8efe6"; ctx.fill();
    ctx.strokeStyle = "#3a4a3a"; ctx.lineWidth = WALL * k;
    BOX.walls.forEach(function (w) { var a = toScreen(w.a[0], w.a[1]), b = toScreen(w.b[0], w.b[1]); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); });
    snapshot().pieces.forEach(function (p) {
      var q = toScreen(p.x, p.y);
      shapePath(p.i, q.x, q.y, p.a, k); ctx.fillStyle = p.bad ? "#ff3a2a" : prefColor(p.i); ctx.fill(); ctx.strokeStyle = "#16202e"; ctx.lineWidth = 2; ctx.stroke();
    });
  }
  function drawAim() {
    /* 落ちる先の目安（まっすぐ下へ点線） */
    var a = toScreen(cur.x, cur.y + SHAPES[cur.i].r * 0.3), b = toScreen(cur.x, surfaceY(cur.x));
    ctx.save(); ctx.setLineDash([8, 10]); ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
    if (turn !== 0) return;
    ctrlButtons().forEach(function (bt) {
      ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(bt.x, bt.y, bt.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.translate(bt.x, bt.y); ctx.strokeStyle = "#16202e"; ctx.fillStyle = "#16202e"; ctx.lineWidth = 6; ctx.lineCap = "round";
      if (bt.kind === "rot") {
        ctx.beginPath(); ctx.arc(0, 0, 20, -Math.PI * 0.85, Math.PI * 0.55); ctx.stroke();
        var ex = Math.cos(Math.PI * 0.55) * 20, ey = Math.sin(Math.PI * 0.55) * 20;
        ctx.beginPath(); ctx.moveTo(ex - 13, ey + 2); ctx.lineTo(ex + 2, ey + 8); ctx.lineTo(ex + 1, ey - 8); ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-16, 4); ctx.lineTo(0, 24); ctx.lineTo(16, 4); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
  }
  function drawHUD() {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
    ctx.font = "900 64px sans-serif"; ctx.lineWidth = 10; ctx.strokeStyle = "#16202e"; ctx.fillStyle = "#fff";
    ctx.strokeText(count, W / 2, 22); ctx.fillText(count, W / 2, 22);
    var who = turn === 0 ? zT("あなた", "YOU", "당신", "你", "你") : zT("あいて", "CPU", "상대", "对手", "對手");
    ctx.font = "800 24px sans-serif"; ctx.lineWidth = 6;
    ctx.fillStyle = turn === 0 ? "#7fd0ff" : "#ffb07f";
    if (endT === 0) { ctx.strokeText(who, W / 2, 94); ctx.fillText(who, W / 2, 94); }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.55)"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10; ctx.textAlign = "center";
    ctx.font = "800 96px sans-serif"; ctx.fillText(won ? "WIN" : "LOSE", W / 2, H * 0.36);
    ctx.font = "800 110px sans-serif"; ctx.fillText(count, W / 2, H * 0.36 + 120);
    ctx.font = "800 36px sans-serif"; ctx.fillText(zT("県", "prefectures", "현", "县", "縣"), W / 2, H * 0.36 + 166);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  var hideUI = false;
  window.__probe = {
    now: function () { return { state: state, turn: turn, count: count, won: won, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    debug: debugKey,
    hideUI: function () { hideUI = true; },
    pieces: function () { return { box: BOX, list: pieces.map(function (b) { return { n: SHAPES[b.piece.i].name, bad: !!b.bad, v: b.vertices.map(function (v) { return [v.x, v.y]; }) }; }) }; }
  };
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000); r.key(); await r.wait(800);
      for (var n = 0; n < 4; n++) {
        if (!await r.until(function () { return state === S.AIM && turn === 0; }, 15)) break;
        await r.wait(600); debugKey(1);
      }
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  newRound(); cur = null; state = S.INTRO; startButton.hidden = false;
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
