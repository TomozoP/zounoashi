<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>超合体！キングガッシンガーロボ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../celebrate.js"></script>   <!-- ファンファーレと紙吹雪 -->
<script src="../hikkoshi/vendor/matter.min.js"></script>   <!-- 物理（matter-js 0.20.0, MIT） -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* 超合体！キングガッシンガーロボ

   1. 合体: 胸（コア）を動かして、四方から飛んでくる10のパーツを受け止める。
      決まった場所にぴったり合えば「ガシーン」とはまり、それ以外はぶつかった所にそのままくっつく（いびつになる）。
   2. 戦い: 完成したロボを、左のスティックとパンチ・キックのボタンで動かして怪獣を倒す。
      物理は2D（matter.js）。各関節は合体したときの角度に戻ろうとするバネ（ラグドール）。
   絵は3D（scene3d.js）。ゲームの座標は px（地面が y=0、上がマイナス）。 */
(function () {
  "use strict";
  var M = window.Matter || (typeof Matter !== "undefined" ? Matter : null);   /* 確認用の道具の中では window に付かない */

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, OUT = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor();
    OUT.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, to, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    var n = AC.currentTime + (delay || 0);
    f.type = "bandpass"; f.frequency.setValueAtTime(freq, n); f.Q.value = q || 1;
    if (to) f.frequency.exponentialRampToValueAtTime(to, n + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  var SFX = {
    whoosh: function () { noiseHit(0.5, 600, 0.12, 1.2, 2400); },
    clang: function () {                         /* ぴったりはまった */
      tone(1180, 0.5, 0.12, "square", 1100); tone(1770, 0.4, 0.07, "triangle"); tone(220, 0.25, 0.2, "square", 110);
      noiseHit(0.18, 3200, 0.3, 2);
    },
    stick: function () { tone(140, 0.25, 0.25, "square", 60); noiseHit(0.2, 500, 0.35, 1); },
    lost: function () { tone(500, 0.35, 0.08, "triangle", 160); },
    land: function () { tone(70, 0.6, 0.45, "sine", 35); noiseHit(0.6, 180, 0.6, 0.8); },
    swing: function () { noiseHit(0.16, 900, 0.12, 1.5, 2600); },
    hit: function (k) { k = Math.min(1, k); tone(120, 0.18, 0.3 * k + 0.1, "square", 50); noiseHit(0.2, 1400, 0.4 * k + 0.15, 1.2); noiseHit(0.08, 4000, 0.2 * k, 2); },
    hurt: function (k) { k = Math.min(1, k); tone(90, 0.3, 0.3 * k + 0.1, "sawtooth", 40); noiseHit(0.3, 700, 0.4 * k + 0.1, 1); },
    roar: function (big) {
      var d = big ? 1.2 : 0.6;
      tone(150, d, 0.16, "sawtooth", 70); tone(96, d, 0.14, "sawtooth", 55);
      noiseHit(d, 900, 0.25, 0.7, 300);
    },
    lose: function () { tone(330, 0.4, 0.12, "triangle", 300); tone(262, 0.5, 0.12, "triangle", 240, 0.35); tone(196, 0.9, 0.14, "triangle", 150, 0.75); }
  };
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ ロボのパーツ ============
     胸の中心からの位置（x, y）、大きさ（w, h）、つなぎ目（jx, jy）、親。左右は画面の左右 */
  var SLOTS = {
    chest:  { w: 96, h: 84, x: 0, y: 0 },
    head:   { w: 54, h: 50, x: 0, y: -68, jx: 0, jy: -42, parent: "chest", from: ["top"] },
    uarmL:  { w: 64, h: 28, x: -82, y: -26, jx: -50, jy: -26, parent: "chest", from: ["left"] },
    uarmR:  { w: 64, h: 28, x: 82, y: -26, jx: 50, jy: -26, parent: "chest", from: ["right"] },
    farmL:  { w: 62, h: 26, x: -145, y: -26, jx: -114, jy: -26, parent: "uarmL", from: ["left"] },
    farmR:  { w: 62, h: 26, x: 145, y: -26, jx: 114, jy: -26, parent: "uarmR", from: ["right"] },
    waist:  { w: 76, h: 32, x: 0, y: 58, jx: 0, jy: 42, parent: "chest", from: ["bottom"] },
    thighL: { w: 32, h: 62, x: -22, y: 104, jx: -22, jy: 74, parent: "waist", from: ["bottom"] },
    thighR: { w: 32, h: 62, x: 22, y: 104, jx: 22, jy: 74, parent: "waist", from: ["bottom"] },
    legL:   { w: 34, h: 72, x: -22, y: 171, jx: -22, jy: 135, parent: "thighL", from: ["bottom"] },
    legR:   { w: 34, h: 72, x: 22, y: 171, jx: 22, jy: 135, parent: "thighR", from: ["bottom"] }
  };
  /* 名前: 1パーツ1文字。胸から見た位置を上の段から・左から読んだ順に並べるので、ずれて付くと文字が入れかわる */
  var FULL_NAME = "キングガッシンガーロボ";
  var CHARS = { head: "キ", farmL: "ン", uarmL: "グ", uarmR: "ガ", farmR: "ッ", chest: "シ", waist: "ン", thighL: "ガ", thighR: "ー", legL: "ロ", legR: "ボ" };
  function robotName() {
    return pieces.slice().sort(function (a, b) { return (Math.round(a.y / 45) * 10000 + a.x) - (Math.round(b.y / 45) * 10000 + b.x); })
      .map(function (p) { return CHARS[p.id]; }).join("");
  }
  var ORDER = ["waist", "uarmL", "uarmR", "thighL", "thighR", "farmL", "farmR", "legL", "legR", "head"];
  function kindOf(id) { return id.replace(/[LR]$/, ""); }
  function sideOf(id) { return /L$/.test(id) ? -1 : /R$/.test(id) ? 1 : 0; }

  var SKY_Y = -330;                            /* 合体するときの胸の高さ */
  var AREA = { x0: -120, x1: 120, y0: SKY_Y - 130, y1: SKY_Y + 100 };
  var SNAP_D = 34, SNAP_A = 0.42;               /* ぴったりはまる幅 */

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", BUILD: "build", DONE: "done", LAND: "land", FIGHT: "fight", RESULT: "result" };
  var state, T, score, won, held, fx, shake, cam;
  var core, pieces, flying, queue, spawnWait, nextExact, doneT, name;
  var engine, rBodies, joints, chestB, kaiju, robotHP, kaijuHP, fightT, attack, walkPhase, landT, endT, stunT;
  var conf = window.zCelebrate ? window.zCelebrate.confetti() : null;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.BUILD;
    T = 0; score = 0; won = false; held = false; fx = []; shake = 0;
    core = { x: 0, y: SKY_Y, vx: 0, vy: 0 };
    pieces = [{ id: "chest", kind: "chest", w: SLOTS.chest.w, h: SLOTS.chest.h, x: 0, y: 0, a: 0, snapped: true, parent: null }];
    flying = null; queue = ORDER.slice(); spawnWait = 0.8; nextExact = false;
    engine = null; rBodies = []; joints = []; kaiju = null;
    robotHP = 100; kaijuHP = 100; fightT = 0; attack = null; walkPhase = 0; endT = 0; stunT = 0;
    cam = { x: 0, y: SKY_Y + 50, w: 560 };
    stick.on = false; keys.l = keys.r = keys.u = keys.d = false;
    var s3 = scene3d(); if (s3) s3.reset();
  }

  /* ---------- 回した長方形の当たり（分離軸） ---------- */
  function corners(p) {
    var c = Math.cos(p.a), s = Math.sin(p.a), hw = p.w / 2, hh = p.h / 2;
    return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(function (q) {
      return [p.x + q[0] * c - q[1] * s, p.y + q[0] * s + q[1] * c];
    });
  }
  function overlap(a, b) {
    var A = corners(a), B = corners(b), axes = [a.a, a.a + Math.PI / 2, b.a, b.a + Math.PI / 2];
    for (var i = 0; i < 4; i++) {
      var ax = Math.cos(axes[i]), ay = Math.sin(axes[i]);
      var a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9;
      A.forEach(function (q) { var d = q[0] * ax + q[1] * ay; a0 = Math.min(a0, d); a1 = Math.max(a1, d); });
      B.forEach(function (q) { var d = q[0] * ax + q[1] * ay; b0 = Math.min(b0, d); b1 = Math.max(b1, d); });
      if (a1 < b0 || b1 < a0) return false;
    }
    return true;
  }
  function has(id) { return pieces.some(function (p) { return p.id === id; }); }
  function angDiff(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

  /* ---------- 合体 ---------- */
  function spawn() {
    var id = queue.shift(), sl = SLOTS[id];
    var from = sl.from[Math.floor(Math.random() * sl.from.length)];
    var exact = nextExact; nextExact = false;
    var off = exact ? 0 : (Math.random() * 2 - 1) * 70;
    var tilt = exact ? 0 : (Math.random() * 2 - 1) * 0.36;
    var tx = core.x + sl.x, ty = core.y + sl.y, dist = 520, dx = 0, dy = 0;
    if (from === "left") { dx = 1; ty += off; } else if (from === "right") { dx = -1; ty += off; }
    else if (from === "top") { dy = 1; tx += off; } else { dy = -1; tx += off; }
    var speed = 520 + (10 - queue.length) * 15;
    flying = { id: id, kind: kindOf(id), w: sl.w, h: sl.h, x: tx - dx * dist, y: ty - dy * dist, a: tilt,
      vx: dx * speed, vy: dy * speed, spin: 0, t: 0, from: from };
    SFX.whoosh();
  }
  function local(p) { return { x: p.x - core.x, y: p.y - core.y, a: p.a }; }

  function attach(f, snapped, touched) {
    var sl = SLOTS[f.id], p;
    if (snapped) {
      p = { id: f.id, kind: f.kind, w: f.w, h: f.h, x: sl.x, y: sl.y, a: 0, snapped: true, parent: sl.parent, jx: sl.jx, jy: sl.jy };
      fx.push({ type: "ring", x: core.x + sl.x, y: core.y + sl.y, t: 0, good: true });
      SFX.clang();
    } else {
      var L = local(f);
      /* つなぎ目は、ぶつかった相手の中心に近いほうの端 */
      var c = Math.cos(L.a), s = Math.sin(L.a), long = f.h >= f.w;
      var ux = long ? -s : c, uy = long ? c : s, half = (long ? f.h : f.w) / 2;
      var e1 = { x: L.x + ux * half, y: L.y + uy * half }, e2 = { x: L.x - ux * half, y: L.y - uy * half };
      var tp = touched;
      var e = Math.hypot(e1.x - tp.x, e1.y - tp.y) < Math.hypot(e2.x - tp.x, e2.y - tp.y) ? e1 : e2;
      p = { id: f.id, kind: f.kind, w: f.w, h: f.h, x: L.x, y: L.y, a: L.a, snapped: false, parent: tp.id, jx: e.x, jy: e.y };
      fx.push({ type: "puff", x: f.x, y: f.y, t: 0 });
      SFX.stick();
    }
    p.order = pieces.length;
    pieces.push(p);
    shake = Math.max(shake, snapped ? 6 : 9);
  }

  function updateBuild(dt) {
    /* 胸を動かす（キーのとき） */
    var kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    if (kx || ky) { core.x += kx * 320 * dt; core.y += ky * 320 * dt; }
    core.x = Math.max(AREA.x0, Math.min(AREA.x1, core.x));
    core.y = Math.max(AREA.y0, Math.min(AREA.y1, core.y));

    if (!flying) {
      if (queue.length) { spawnWait -= dt; if (spawnWait <= 0) spawn(); }
      else { spawnWait -= dt; if (spawnWait <= 0) startDone(); }
    } else {
      var f = flying, n = 4, done = false;
      for (var k = 0; k < n && !done; k++) {
        var px = f.x, py = f.y;
        f.x += f.vx * dt / n; f.y += f.vy * dt / n; f.t += dt / n;
        var sl = SLOTS[f.id];
        /* ぴったり（決まった場所の近くで、向きも合っている） */
        if (has(sl.parent)) {
          var L = local(f);
          if (Math.hypot(L.x - sl.x, L.y - sl.y) < SNAP_D && Math.abs(angDiff(L.a)) < SNAP_A) { attach(f, true); done = true; break; }
        }
        /* ぶつかった所にくっつく */
        for (var i = 0; i < pieces.length; i++) {
          var q = pieces[i], w = { x: core.x + q.x, y: core.y + q.y, a: q.a, w: q.w, h: q.h };
          if (overlap(f, w)) {
            /* ぶつかる直前まで戻す */
            var lo = 0, hi = 1, cx = f.x, cy = f.y;
            for (var it = 0; it < 7; it++) {
              var m = (lo + hi) / 2;
              f.x = px + (cx - px) * m; f.y = py + (cy - py) * m;
              if (overlap(f, w)) hi = m; else lo = m;
            }
            f.x = px + (cx - px) * hi; f.y = py + (cy - py) * hi;
            attach(f, false, q); done = true; break;
          }
        }
      }
      if (done) { flying = null; spawnWait = 0.45; }
      else if (f.t > 3.2) { flying = null; spawnWait = 0.3; fx.push({ type: "lost", t: 0, id: f.id }); SFX.lost(); }
    }
    cam.x += (core.x * 0.5 - cam.x) * Math.min(1, dt * 3);
    cam.y += (core.y + 50 - cam.y) * Math.min(1, dt * 3);
    cam.w += (560 - cam.w) * Math.min(1, dt * 2);
  }

  /* ============ 合体完了の演出 ============
     名前が1文字ずつ落ちてきて、そろったら戦いへ */
  var LETTER = 0.16, DONE_LEN;
  function startDone() {
    state = S.DONE; doneT = 0; name = robotName(); flying = null;
    DONE_LEN = 0.5 + name.length * LETTER + 1.8;
    shake = 10;
    fx.push({ type: "ring", x: core.x, y: core.y + 40, t: 0, good: true });
    tone(392, 0.25, 0.12, "square"); tone(523, 0.4, 0.12, "square", null, 0.12);
  }
  function updateDone(dt) {
    var before = doneT;
    doneT += dt;
    for (var i = 0; i < name.length; i++) {
      var at = 0.5 + i * LETTER;
      if (before < at && doneT >= at) {
        tone(330 * Math.pow(2, i / 12), 0.12, 0.12, "square"); noiseHit(0.08, 2800, 0.18, 2);
      }
    }
    var end = 0.5 + name.length * LETTER;
    if (before < end && doneT >= end) {
      shake = 12;
      if (AC && window.zCelebrate) window.zCelebrate.play(AC, name === FULL_NAME ? "levelup" : "chime", { dest: OUT });
    }
    cam.x += (core.x - cam.x) * Math.min(1, dt * 3);
    cam.y += (core.y + 50 - cam.y) * Math.min(1, dt * 3);
    cam.w += (500 - cam.w) * Math.min(1, dt * 3);
    if (doneT >= DONE_LEN) startFight();
  }
  function drawDone() {
    var c = toScreen(core.x, core.y + 50), u = doneT;
    /* 後ろの光 */
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(u * 0.6);
    ctx.fillStyle = "rgba(255,230,120,.22)";
    for (var i = 0; i < 12; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 900, i / 12 * Math.PI * 2, (i + 0.5) / 12 * Math.PI * 2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if (u < 0.25) { ctx.fillStyle = "rgba(255,255,255," + (1 - u / 0.25) + ")"; ctx.fillRect(0, 0, W, H); }
    /* 名前 */
    var size = Math.min(62, Math.floor((W - 30) / Math.max(1, name.length))), y = H * 0.2;
    var x0 = W / 2 - size * name.length / 2 + size / 2;
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var j = 0; j < name.length; j++) {
      var t = u - (0.5 + j * LETTER);
      if (t < 0) break;
      var k = Math.max(1, 2.6 - t * 14);
      ctx.save(); ctx.translate(x0 + j * size, y); ctx.scale(k, k);
      ctx.font = "900 " + size + "px sans-serif";
      ctx.lineJoin = "round"; ctx.lineWidth = size * 0.22; ctx.strokeStyle = "#16202e"; ctx.strokeText(name[j], 0, 0);
      var gr = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
      gr.addColorStop(0, "#fff6b0"); gr.addColorStop(0.5, "#ffc928"); gr.addColorStop(1, "#e2602a");
      ctx.fillStyle = gr; ctx.fillText(name[j], 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  /* ============ 戦い（matter.js） ============ */
  var G = 0.9, STEP = 1000 / 60;
  var GSTEP = G * 0.001 * STEP * STEP;          /* 1コマで重力が足す速さ */
  function startFight() {
    state = S.LAND; landT = 0; fightT = 0;
    engine = M.Engine.create();
    engine.gravity.y = G;
    engine.positionIterations = 8; engine.velocityIterations = 6; engine.constraintIterations = 4;
    var ground = M.Bodies.rectangle(0, 100, 4000, 200, { isStatic: true, friction: 0.9 });
    var wl = M.Bodies.rectangle(-860, -600, 200, 1600, { isStatic: true });
    var wr = M.Bodies.rectangle(860, -600, 200, 1600, { isStatic: true });
    M.Composite.add(engine.world, [ground, wl, wr]);

    /* ロボ: 合体した形のまま、空から落とす */
    var byId = {};
    rBodies = pieces.map(function (p) {
      var b = M.Bodies.rectangle(core.x + p.x, core.y + p.y, p.w, p.h, {
        angle: p.a, friction: 0.9, frictionAir: 0.02, restitution: 0.05,
        density: p.kind === "chest" ? 0.004 : 0.0025, collisionFilter: { group: -1 }, chamfer: { radius: 5 }
      });
      b.piece = p; b.robot = true; b.cool = 0; byId[p.id] = b;
      return b;
    });
    chestB = byId.chest;
    joints = [];
    rBodies.forEach(function (b) {
      var p = b.piece;
      if (!p.parent) return;
      var par = p.parent;
      while (!byId[par]) par = SLOTS[par].parent;   /* 親がなくなっていたら、その親へ */
      var pa = byId[par], ax = core.x + p.jx, ay = core.y + p.jy;
      var c = M.Constraint.create({
        bodyA: pa, bodyB: b,
        pointA: { x: ax - pa.position.x, y: ay - pa.position.y },
        pointB: { x: ax - b.position.x, y: ay - b.position.y },
        length: 0, stiffness: 0.9, damping: 0.1
      });
      joints.push({ c: c, a: pa, b: b, rest: b.angle - pa.angle, off: 0, k: 0.25 });
    });
    M.Composite.add(engine.world, rBodies);
    M.Composite.add(engine.world, joints.map(function (j) { return j.c; }));
    /* 立っているときの胸の高さ（いちばん下の角まで） */
    var low = 0;
    pieces.forEach(function (p) { corners(p).forEach(function (q) { low = Math.max(low, q[1]); }); });
    standH = low;
    totalMass = rBodies.reduce(function (s, b) { return s + b.mass; }, 0);

    makeKaiju();
    M.Events.on(engine, "collisionStart", onHit);
    M.Events.on(engine, "collisionActive", onHit);
  }
  var standH = 200, totalMass = 1;

  function makeKaiju() {
    var x = 330, o = { friction: 0.9, frictionAir: 0.02, collisionFilter: { group: -2 }, chamfer: { radius: 18 } };
    var body = M.Bodies.rectangle(x, -160, 170, 320, Object.assign({ density: 0.003 }, o));
    var head = M.Bodies.rectangle(x - 60, -345, 120, 80, Object.assign({ density: 0.002 }, o, { chamfer: { radius: 14 } }));
    var claw = M.Bodies.rectangle(x - 105, -230, 90, 34, Object.assign({ density: 0.002 }, o, { chamfer: { radius: 10 } }));
    [body, head, claw].forEach(function (b) { b.kaiju = true; b.cool = 0; });
    body.part = "body"; head.part = "head"; claw.part = "claw";
    var jh = M.Constraint.create({ bodyA: body, bodyB: head, pointA: { x: -40, y: -170 }, pointB: { x: 20, y: 5 }, length: 0, stiffness: 0.9 });
    var jc = M.Constraint.create({ bodyA: body, bodyB: claw, pointA: { x: -60, y: -70 }, pointB: { x: 40, y: 0 }, length: 0, stiffness: 0.9 });
    kaiju = { body: body, head: head, claw: claw, jh: jh, jc: jc, cd: 2.2, lunge: 0, swing: 0, down: false, roarT: 0, face: -1 };
    M.Composite.add(engine.world, [body, head, claw, jh, jc]);
  }

  function relSpring(a, b, rest, k, d) {        /* b を a に対して rest の角度へ戻す */
    var wa = M.Body.getAngularVelocity(a), wb = M.Body.getAngularVelocity(b);
    var err = angDiff(rest - (b.angle - a.angle));
    var dw = k * err - d * (wb - wa);
    var ia = a.inertia, ib = b.inertia;
    M.Body.setAngularVelocity(b, wb + dw * ia / (ia + ib));
    M.Body.setAngularVelocity(a, wa - dw * ib / (ia + ib));
  }

  function robotLowest() {
    var low = -1e9;
    rBodies.forEach(function (b) { low = Math.max(low, b.bounds.max.y); });
    return low;
  }

  function updateFight(dt) {
    fightT += dt;
    var alive = robotHP > 0, kAlive = kaijuHP > 0;
    var facing = kaiju.body.position.x > chestB.position.x ? 1 : -1;

    /* 入力 */
    var mx = 0, jump = false;
    if (stick.on) { mx = Math.max(-1, Math.min(1, stick.dx / 60)); jump = stick.dy < -45; }
    mx += (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (keys.u) jump = true;
    mx = Math.max(-1, Math.min(1, mx));
    if (!alive) { mx = 0; jump = false; }

    /* 攻撃の進み */
    if (attack) { attack.t += dt; if (attack.t > 0.38) attack = null; }

    /* 関節のバネ。歩き・パンチ・キックはここで角度をずらす */
    walkPhase += dt * 9 * Math.abs(mx);
    joints.forEach(function (j) {
      var p = j.b.piece, kind = p.kind, side = sideOf(p.id), off = 0, k = 0.22;
      /* 腕は合体のとき横に開いているので、戦いでは下ろして構える */
      if (kind === "uarm") off = side * 1.2;
      if (kind === "farm") off = -side * 1.9;
      if (kind === "thigh" && Math.abs(mx) > 0.1) off = Math.sin(walkPhase + (side < 0 ? 0 : Math.PI)) * 0.55;
      if (kind === "leg" && Math.abs(mx) > 0.1) off = Math.max(0, Math.sin(walkPhase + (side < 0 ? 0 : Math.PI) - 1)) * 0.6;
      if (attack && attack.t < 0.3 && side === attack.side) {
        if (attack.kind === "punch" && kind === "uarm") { off = side * facing > 0 ? -side * 0.15 : -side * 2.6; k = 0.5; }
        if (attack.kind === "punch" && kind === "farm") { off = 0; k = 0.5; }
        if (attack.kind === "kick" && kind === "thigh") { off = -facing * 1.5; k = 0.5; }
        if (attack.kind === "kick" && kind === "leg") { off = 0; k = 0.5; }
      }
      if (!alive) k = 0.02;
      relSpring(j.a, j.b, j.rest + off, k, 0.35);
    });

    /* 立つ: 何かが地面に着いていたら重さを支え、胸を立った高さ・まっすぐに保つ */
    var low = robotLowest(), grounded = low > -8;
    if (alive) {
      var w = M.Body.getAngularVelocity(chestB);
      M.Body.setAngularVelocity(chestB, w + angDiff(0 - chestB.angle) * 0.06 - w * 0.12);
      if (grounded) {
        rBodies.forEach(function (b) { var v = M.Body.getVelocity(b); M.Body.setVelocity(b, { x: v.x, y: v.y - GSTEP * 0.8 }); });
        var cv = M.Body.getVelocity(chestB);
        var target = -standH * 0.98, ey = target - chestB.position.y;
        var vy = cv.y + Math.max(-1.2, Math.min(1.2, ey * 0.06)) - cv.y * 0.08;
        if (ey < -40) vy = Math.max(vy, cv.y);          /* 立つ高さより上にいるときは持ち上げない */
        var vx = cv.x + (mx * 3.4 - cv.x) * 0.18;
        if (jump && !keys.jumpLock) { vy = -11; keys.jumpLock = true; SFX.swing(); }
        M.Body.setVelocity(chestB, { x: vx, y: vy });
      } else {
        var cv2 = M.Body.getVelocity(chestB);
        M.Body.setVelocity(chestB, { x: cv2.x + (mx * 3.4 - cv2.x) * 0.04, y: cv2.y });
      }
      if (!jump) keys.jumpLock = false;
    }

    /* 怪獣 */
    var kb = kaiju.body, kv = M.Body.getVelocity(kb);
    stunT = Math.max(0, stunT - dt);
    if (kAlive) {
      var kw = M.Body.getAngularVelocity(kb);
      var upright = stunT > 0 ? 0.01 : 0.05;
      M.Body.setAngularVelocity(kb, kw + angDiff(0 - kb.angle) * upright - kw * 0.1);
      relSpring(kb, kaiju.head, 0, 0.12, 0.3);
      var dx = chestB.position.x - kb.position.x, dist = Math.abs(dx), dir = dx > 0 ? 1 : -1;
      kaiju.face = dir;
      var rage = 1 + (100 - kaijuHP) / 100 * 0.6;
      kaiju.cd -= dt * rage;
      if (kaiju.lunge > 0) {
        kaiju.lunge -= dt;
        M.Body.setVelocity(kb, { x: kv.x + (dir * 7 - kv.x) * 0.3, y: kv.y });
      } else if (stunT <= 0 && alive) {
        var want = dist > 230 ? dir * 1.3 * rage : 0;
        M.Body.setVelocity(kb, { x: kv.x + (want - kv.x) * 0.08, y: kv.y });
        if (kaiju.cd <= 0 && dist < 420) {
          kaiju.lunge = 0.28; kaiju.swing = 0.45; kaiju.cd = 1.5 + Math.random() * 1.2;
          SFX.roar(false);
        }
      }
      /* 爪をふる */
      kaiju.swing = Math.max(0, kaiju.swing - dt);
      var swingA = kaiju.swing > 0 ? (kaiju.swing > 0.25 ? 1.2 : -0.9) : 0.3;
      relSpring(kb, kaiju.claw, swingA, 0.2, 0.3);
    }

    rBodies.concat([kaiju.body, kaiju.head, kaiju.claw]).forEach(function (b) { b.cool = Math.max(0, b.cool - dt); });
    M.Engine.update(engine, STEP);
    /* 暴れすぎないように速さの上限 */
    rBodies.forEach(function (b) {
      var v = M.Body.getVelocity(b), sp = Math.hypot(v.x, v.y), w = M.Body.getAngularVelocity(b);
      if (sp > 22) M.Body.setVelocity(b, { x: v.x * 22 / sp, y: v.y * 22 / sp });
      if (Math.abs(w) > 0.45) M.Body.setAngularVelocity(b, w > 0 ? 0.45 : -0.45);
    });

    /* カメラ: ロボと怪獣が両方入るように */
    var mid = (chestB.position.x + kb.position.x) / 2, span = Math.abs(chestB.position.x - kb.position.x);
    var cw = Math.max(720, Math.min(1500, span + 520));
    cam.w += (cw - cam.w) * Math.min(1, dt * 2.5);
    cam.x += (mid - cam.x) * Math.min(1, dt * 3);
    var visH = cam.w * H / W;
    cam.y += ((-visH * 0.5 + visH * 0.24) - cam.y) * Math.min(1, dt * 3);

    /* 決着 */
    if (endT > 0) {
      endT += dt;
      if (endT > 2.6) finish();
    } else if (kaijuHP <= 0) {
      endT = 0.001; won = true; score = Math.round(fightT * 10) / 10;
      SFX.roar(true);
      M.Composite.remove(engine.world, [kaiju.jh, kaiju.jc]);
      M.Body.setVelocity(kb, { x: -facing * -6, y: -6 });
      M.Body.setAngularVelocity(kb, facing * 0.08);
      setTimeout(function () { if (won && AC && window.zCelebrate) window.zCelebrate.play(AC, "fanfare", { dest: OUT }); }, 500);
      if (conf) conf.burst(W, H, 160);
    } else if (robotHP <= 0) {
      endT = 0.001; won = false;
      M.Composite.remove(engine.world, joints.map(function (j) { return j.c; }));   /* バラバラになる */
      rBodies.forEach(function (b) { M.Body.setVelocity(b, { x: (Math.random() - 0.5) * 10, y: -4 - Math.random() * 6 }); M.Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.4); });
      SFX.lose();
    }
  }

  function onHit(ev) {
    if (endT > 0) return;
    ev.pairs.forEach(function (pr) {
      var a = pr.bodyA, b = pr.bodyB, r = a.robot ? a : b.robot ? b : null, k = a.kaiju ? a : b.kaiju ? b : null;
      if (!r || !k) return;
      var n = pr.collision.normal, vr = M.Body.getVelocity(r), vk = M.Body.getVelocity(k);
      var rel = Math.abs((vr.x - vk.x) * n.x + (vr.y - vk.y) * n.y);
      var sr = Math.abs(vr.x * n.x + vr.y * n.y), sk = Math.abs(vk.x * n.x + vk.y * n.y);
      var pt = pr.collision.supports && pr.collision.supports[0] ? pr.collision.supports[0] : r.position;
      var limb = attack && attack.t < 0.34 && sideOf(r.piece.id) === attack.side && /arm|thigh|leg/.test(r.piece.kind);
      if (limb && r.cool <= 0 && rel > 3) {
        var dmg = Math.min(18, (rel - 2) * 1.6) * (k.part === "head" ? 1.4 : 1);
        kaijuHP = Math.max(0, kaijuHP - dmg);
        r.cool = 0.3; attack.t = Math.max(attack.t, 0.3);
        var dir = k.position.x > r.position.x ? 1 : -1;
        var kv = M.Body.getVelocity(kaiju.body);
        M.Body.setVelocity(kaiju.body, { x: kv.x + dir * dmg * 0.35, y: kv.y - dmg * 0.1 });
        if (dmg > 9) stunT = 0.6;
        fx.push({ type: "spark", x: pt.x, y: pt.y, t: 0, big: dmg > 9 });
        shake = Math.max(shake, 4 + dmg * 0.6);
        SFX.hit(dmg / 15);
      } else if ((kaiju.lunge > 0 || kaiju.swing > 0.1) && k.cool <= 0 && sk > sr * 0.6 && rel > 2.5) {
        var dmg2 = Math.min(16, (rel - 1.5) * 1.5) * (r.piece.kind === "chest" || r.piece.kind === "head" ? 1.2 : 0.8);
        robotHP = Math.max(0, robotHP - dmg2);
        k.cool = 0.45;
        var d2 = r.position.x > k.position.x ? 1 : -1;
        var cv = M.Body.getVelocity(chestB);
        M.Body.setVelocity(chestB, { x: cv.x + d2 * (3 + dmg2 * 0.3), y: cv.y - 3 });
        fx.push({ type: "spark", x: pt.x, y: pt.y, t: 0, big: dmg2 > 9, bad: true });
        shake = Math.max(shake, 5 + dmg2 * 0.5);
        SFX.hurt(dmg2 / 15);
      }
    });
  }

  function doAttack(kind) {
    if (state !== S.FIGHT || robotHP <= 0 || endT > 0) return;
    if (attack && attack.t < 0.22) return;
    var prev = attack ? attack.side : lastSide;
    var want = kind === "punch" ? ["uarm", "farm"] : ["thigh", "leg"];
    var sides = [-prev || 1, prev || -1].filter(function (s) {
      return pieces.some(function (p) { return sideOf(p.id) === s && want.indexOf(p.kind) >= 0; });
    });
    var side = sides.length ? sides[0] : (kind === "punch" ? 1 : -1);
    lastSide = side;
    attack = { kind: kind, side: side, t: 0 };
    /* 振りの勢い: その側の手足を怪獣のほうへ押す */
    var facing = kaiju.body.position.x > chestB.position.x ? 1 : -1;
    rBodies.forEach(function (b) {
      var p = b.piece;
      if (sideOf(p.id) !== side || want.indexOf(p.kind) < 0) return;
      var v = M.Body.getVelocity(b), tip = p.kind === "farm" || p.kind === "leg";
      M.Body.setVelocity(b, { x: v.x + facing * (tip ? 10 : 5), y: v.y - (kind === "kick" ? 3 : 1) });
    });
    var cv = M.Body.getVelocity(chestB);
    M.Body.setVelocity(chestB, { x: cv.x + facing * 2, y: cv.y });
    SFX.swing();
  }
  var lastSide = -1;

  /* ============ 進行 ============ */
  function update(dt) {
    if (conf) conf.step(dt, W, H);
    fx = fx.filter(function (f) { f.t += dt; return f.t < 0.6; });
    shake = Math.max(0, shake - dt * 30);
    if (state === S.BUILD) { T += dt; updateBuild(dt); }
    else if (state === S.DONE) { T += dt; updateDone(dt); }
    else if (state === S.LAND) {
      landT += dt;
      M.Engine.update(engine, STEP);
      /* 着地まで立つ力は入れず、そのまま落とす。地面に着いたら戦い */
      var low = robotLowest();
      cam.y += (chestB.position.y + 40 - cam.y) * Math.min(1, dt * 4);
      if (low > -6 || landT > 3) {
        state = S.FIGHT; shake = 14; SFX.land();
        fx.push({ type: "dust", x: chestB.position.x, y: 0, t: 0 });
        setTimeout(function () { if (state === S.FIGHT) SFX.roar(true); }, 500);
      }
    } else if (state === S.FIGHT) updateFight(dt);
  }

  function finish() {
    state = S.RESULT;
    shareButton.hidden = false;
  }

  /* ============ 入力 ============
     合体中: 指でなぞった分だけ胸が動く。
     戦い: 画面の左半分はスティック（触った所が中心）、右下にパンチ・キック。 */
  var keys = { l: false, r: false, u: false, d: false };
  var stick = { on: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
  var drag = null;
  function padButtons() {
    var r = 58, y1 = H - 230, y2 = H - 110;
    return [{ kind: "punch", x: W - 150, y: y1, r: r }, { kind: "kick", x: W - 78, y: y2, r: r }];
  }

  function down(x, y, id) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) { doAttack("punch"); return; }
    if (state === S.BUILD || state === S.LAND) { drag = { id: id, x: x, y: y }; return; }
    if (state === S.FIGHT) {
      var bs = padButtons();
      for (var i = 0; i < bs.length; i++) if (Math.hypot(x - bs[i].x, y - bs[i].y) < bs[i].r + 22) { doAttack(bs[i].kind); return; }
      if (x < W * 0.55) { stick = { on: true, id: id, ox: x, oy: y, dx: 0, dy: 0 }; return; }
      doAttack("punch");
    }
  }
  function move(x, y, id) {
    if (drag && drag.id === id && state === S.BUILD) {
      var k = cam.w / W;                       /* 画面の1pxが世界の何pxか */
      core.x += (x - drag.x) * k * 1.1; core.y += (y - drag.y) * k * 1.1;
      drag.x = x; drag.y = y;
    }
    if (stick.on && stick.id === id) {
      stick.dx = x - stick.ox; stick.dy = y - stick.oy;
      var d = Math.hypot(stick.dx, stick.dy), mx = 70;
      if (d > mx) { stick.ox = x - stick.dx * mx / d; stick.oy = y - stick.dy * mx / d; stick.dx *= mx / d; stick.dy *= mx / d; }
    }
  }
  function up(id) {
    if (drag && (id == null || drag.id === id)) drag = null;
    if (stick.on && (id == null || stick.id === id)) stick.on = false;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y, e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y, e.pointerId); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) { up(e.pointerId); });
  window.addEventListener("blur", function () { up(); keys.l = keys.r = keys.u = keys.d = false; });

  /* 本番以外だけ、数字キーで場面を飛ばせる */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function quickBuild(perfect) {
    if (state !== S.BUILD) return;
    flying = null;
    queue.forEach(function (id) {
      var sl = SLOTS[id];
      if (perfect || Math.random() < 0.4) pieces.push({ id: id, kind: kindOf(id), w: sl.w, h: sl.h, x: sl.x, y: sl.y, a: 0, snapped: true, parent: sl.parent, jx: sl.jx, jy: sl.jy, order: pieces.length });
      else if (Math.random() < 0.8) {
        /* でたらめな所にくっつける */
        var q = pieces[Math.floor(Math.random() * pieces.length)], ang = Math.random() * Math.PI * 2, a = Math.random() * 3 - 1.5;
        var r = (Math.max(q.w, q.h) + Math.max(sl.w, sl.h)) / 2 - 6;
        var x = q.x + Math.cos(ang) * r, y = q.y + Math.sin(ang) * r;
        pieces.push({ id: id, kind: kindOf(id), w: sl.w, h: sl.h, x: x, y: y, a: a, snapped: false, parent: q.id, jx: (x + q.x) / 2, jy: (y + q.y) / 2, order: pieces.length });
      }
    });
    queue = []; spawnWait = 0.5;
  }
  function debugKey(n) {
    if (n === 1 && state === S.BUILD) nextExact = true;          /* 次のパーツはまっすぐ、ぴったりの通り道で来る */
    if (n === 2) quickBuild(true);                               /* 残りを全部ぴったり合体 */
    if (n === 3) quickBuild(false);                              /* 残りをでたらめに合体 */
    if (n === 4 && state === S.FIGHT) kaijuHP = Math.min(kaijuHP, 3);   /* 次の一撃で勝つ */
    if (n === 5 && state === S.FIGHT) robotHP = Math.min(robotHP, 3);   /* 次に食らうと負け */
  }

  function keySet(e, on) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.l = on; return true; }
    if (k === "ArrowRight" || k === "d" || k === "D") { keys.r = on; return true; }
    if (k === "ArrowUp" || k === "w" || k === "W") { keys.u = on; return true; }
    if (k === "ArrowDown" || k === "s" || k === "S") { keys.d = on; return true; }
    return false;
  }
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    if (e.key === "Escape") { e.preventDefault(); if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (keySet(e, true)) { e.preventDefault(); return; }
    var go = e.code === "Space" || e.key === " " || e.key === "Enter" || e.key === "z" || e.key === "Z";
    var kick = e.key === "x" || e.key === "X";
    if (!go && !kick) return;
    e.preventDefault();
    if (e.repeat) return;
    if (state === S.INTRO) return;
    if (state === S.RESULT) { if (go) down(); return; }
    audioOn();
    doAttack(kick ? "kick" : "punch");
  });
  window.addEventListener("keyup", function (e) {
    if (keySet(e, false)) return;
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  /* ============ シェア ============ */
  function doShare() {
    var n = robotName(), text = won
      ? zT(n + "で怪獣を" + score + "秒で倒した", "Beat the kaiju in " + score + "s with " + n, n + "로 괴수를 " + score + "초 만에 쓰러뜨렸다", "用" + n + score + "秒打倒了怪兽", "用" + n + score + "秒打倒了怪獸")
      : zT(n + "、怪獣に敗れる", n + " lost to the kaiju", n + ", 괴수에게 패배", n + "，败给了怪兽", n + "，敗給了怪獸");
    window.zResultActions.x({ text: text + zT(" #超合体キングガッシンガーロボ", " #KingGasshingerRobo") });
  }

  /* ============ 描画 ============ */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function snapshot() {
    var list = [];
    if (engine && rBodies.length) {
      rBodies.forEach(function (b) { var p = b.piece; list.push({ id: p.id, kind: p.kind, w: p.w, h: p.h, x: b.position.x, y: b.position.y, a: b.angle, snapped: p.snapped, order: p.order || 0 }); });
    } else {
      pieces.forEach(function (p) { list.push({ id: p.id, kind: p.kind, w: p.w, h: p.h, x: core.x + p.x, y: core.y + p.y, a: p.a, snapped: p.snapped, order: p.order || 0 }); });
      if (flying) list.push({ id: flying.id, kind: flying.kind, w: flying.w, h: flying.h, x: flying.x, y: flying.y, a: flying.a, snapped: true, order: 20, flying: true });
    }
    var k = null;
    if (kaiju) k = ["body", "head", "claw"].map(function (n) { var b = kaiju[n]; return { part: n, x: b.position.x, y: b.position.y, a: b.angle }; });
    var sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    return { robot: list, kaiju: k, face: kaiju ? kaiju.face : -1, cam: { x: cam.x + sx, y: cam.y + sy, w: cam.w }, t: T, state: state, slot: state === S.BUILD && flying ? slotGhost() : null };
  }
  function slotGhost() {                         /* 飛んでくるパーツがぴったりはまる場所（うっすら） */
    var sl = SLOTS[flying.id];
    if (!has(sl.parent)) return null;
    return { kind: flying.kind, id: flying.id, w: sl.w, h: sl.h, x: core.x + sl.x, y: core.y + sl.y };
  }

  var proj = null;
  function toScreen(x, y) {
    if (proj) return proj(x, y);
    var k = W / cam.w;
    return { x: W / 2 + (x - cam.x) * k, y: H / 2 + (y - cam.y) * k };
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    var s3 = scene3d(), drew = false;
    if (s3 && state) {
      try { s3.sync(snapshot()); drew = s3.draw(ctx, W, H); proj = function (x, y) { return s3.project(x, y, W, H); }; }
      catch (e) { scene3d.drop(); proj = null; }
    }
    if (!drew) { proj = null; drawFlat(); }

    if (hideUI) return;
    drawFx();
    if (state === S.BUILD) drawBuildUI();
    if (state === S.DONE) drawDone();
    if (state === S.FIGHT || state === S.LAND) drawFightUI();
    if (state === S.RESULT) drawResult();
    if (conf) conf.draw(ctx);
  }

  /* three.js が使えないときの平面の絵 */
  function drawFlat() {
    ctx.fillStyle = "#8fb8d8"; ctx.fillRect(0, 0, W, H);
    var g = toScreen(0, 0);
    ctx.fillStyle = "#6b7280"; ctx.fillRect(0, g.y, W, H - g.y);
    var s = snapshot(), k = W / cam.w;
    s.robot.forEach(function (p) {
      var q = toScreen(p.x, p.y);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(p.a);
      ctx.fillStyle = p.kind === "chest" ? "#2f5fd0" : "#eef0f4"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 2;
      ctx.fillRect(-p.w * k / 2, -p.h * k / 2, p.w * k, p.h * k); ctx.strokeRect(-p.w * k / 2, -p.h * k / 2, p.w * k, p.h * k);
      ctx.restore();
    });
    if (s.kaiju) s.kaiju.forEach(function (b) {
      var q = toScreen(b.x, b.y), sz = b.part === "body" ? [170, 320] : b.part === "head" ? [120, 80] : [90, 34];
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(b.a); ctx.fillStyle = "#3f8a4a";
      ctx.fillRect(-sz[0] * k / 2, -sz[1] * k / 2, sz[0] * k, sz[1] * k); ctx.restore();
    });
  }

  function drawFx() {
    var k = W / cam.w;
    fx.forEach(function (f) {
      var u = f.t / 0.6;
      if (f.type === "ring") {
        var q = toScreen(f.x, f.y);
        ctx.strokeStyle = "rgba(255,226,90," + (1 - u) + ")"; ctx.lineWidth = 8 * (1 - u) + 2;
        ctx.beginPath(); ctx.arc(q.x, q.y, (20 + u * 90) * k * 1.6, 0, Math.PI * 2); ctx.stroke();
        for (var i = 0; i < 8; i++) {
          var a = i / 8 * Math.PI * 2, r0 = (30 + u * 60) * k * 1.6, r1 = r0 + 22 * (1 - u);
          ctx.beginPath(); ctx.moveTo(q.x + Math.cos(a) * r0, q.y + Math.sin(a) * r0); ctx.lineTo(q.x + Math.cos(a) * r1, q.y + Math.sin(a) * r1); ctx.stroke();
        }
      } else if (f.type === "puff") {
        var p = toScreen(f.x, f.y);
        ctx.fillStyle = "rgba(200,200,200," + (0.7 * (1 - u)) + ")";
        for (var j = 0; j < 6; j++) { var b = j / 6 * Math.PI * 2; ctx.beginPath(); ctx.arc(p.x + Math.cos(b) * u * 40, p.y + Math.sin(b) * u * 40, 12 * (1 - u) + 4, 0, Math.PI * 2); ctx.fill(); }
      } else if (f.type === "spark") {
        var s = toScreen(f.x, f.y), n = f.big ? 14 : 8, len = (f.big ? 70 : 45) * (0.4 + u);
        ctx.strokeStyle = f.bad ? "rgba(255,90,60," + (1 - u) + ")" : "rgba(255,240,120," + (1 - u) + ")";
        ctx.lineWidth = f.big ? 6 : 4;
        for (var m = 0; m < n; m++) {
          var c = m / n * Math.PI * 2 + f.x;
          ctx.beginPath(); ctx.moveTo(s.x + Math.cos(c) * len * 0.3, s.y + Math.sin(c) * len * 0.3); ctx.lineTo(s.x + Math.cos(c) * len, s.y + Math.sin(c) * len); ctx.stroke();
        }
        if (u < 0.25) { ctx.fillStyle = "rgba(255,255,255," + (1 - u * 4) + ")"; ctx.beginPath(); ctx.arc(s.x, s.y, f.big ? 34 : 22, 0, Math.PI * 2); ctx.fill(); }
      } else if (f.type === "dust") {
        var d = toScreen(f.x, f.y);
        ctx.fillStyle = "rgba(190,175,150," + (0.6 * (1 - u)) + ")";
        for (var z = -4; z <= 4; z++) { ctx.beginPath(); ctx.arc(d.x + z * 26 * (0.6 + u * 1.5), d.y - 10 - Math.abs(z) * 2, 22 * (1 - u * 0.5), 0, Math.PI * 2); ctx.fill(); }
      }
    });
  }

  /* 合体中: 上にパーツの数（はまった=黄、くっついた=灰、なくした=暗）、画面の端に来る方向 */
  function drawBuildUI() {
    var n = ORDER.length, sz = 26, gap = 8, x0 = W / 2 - (n * sz + (n - 1) * gap) / 2, y = 26;
    for (var i = 0; i < n; i++) {
      var id = ORDER[i], p = null;
      for (var j = 0; j < pieces.length; j++) if (pieces[j].id === id) p = pieces[j];
      var gone = !p && ORDER.indexOf(id) < ORDER.length - queue.length - (flying ? 1 : 0);
      ctx.fillStyle = p ? (p.snapped ? "#ffd84a" : "#9aa3ad") : gone ? "rgba(0,0,0,.35)" : "rgba(255,255,255,.35)";
      ctx.strokeStyle = "#16202e"; ctx.lineWidth = 2;
      roundRect(x0 + i * (sz + gap), y, sz, sz, 6); ctx.fill(); ctx.stroke();
    }
    if (false) {                                /* 来る方向の予告は出さない */
      var q = toScreen(flying.x, flying.y), m = 34;
      var ex = Math.max(m, Math.min(W - m, q.x)), ey = Math.max(m + 60, Math.min(H - m, q.y));
      if (ex !== q.x || ey !== q.y) {
        var a = Math.atan2(ey - q.y, ex - q.x), blink = Math.floor(flying.t * 8) % 2;
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
        ctx.fillStyle = blink ? "#ff4b3a" : "#ffd84a"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-14, -18); ctx.lineTo(-14, 18); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawFightUI() {
    /* 体力: 左がロボ、右が怪獣 */
    var bw = W * 0.4, bh = 18, y = 26;
    [[16, robotHP, "#4aa8ff", false], [W - 16 - bw, kaijuHP, "#7cd36b", true]].forEach(function (b) {
      ctx.fillStyle = "rgba(0,0,0,.5)"; roundRect(b[0] - 3, y - 3, bw + 6, bh + 6, 10); ctx.fill();
      ctx.fillStyle = "#3a1a1a"; roundRect(b[0], y, bw, bh, 8); ctx.fill();
      var w = bw * b[1] / 100;
      ctx.fillStyle = b[1] < 30 ? "#ff5a3a" : b[2];
      if (w > 1) { roundRect(b[3] ? b[0] + bw - w : b[0], y, w, bh, 8); ctx.fill(); }
    });
    if (state !== S.FIGHT || endT > 0) return;
    /* スティック */
    if (stick.on) {
      ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 70, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(stick.ox + stick.dx, stick.oy + stick.dy, 32, 0, Math.PI * 2); ctx.fill();
    } else {
      var sx = 110, sy = H - 150;
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx, sy, 70, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(sx, sy, 32, 0, Math.PI * 2); ctx.fill();
    }
    /* ボタン（拳と足のアイコン） */
    padButtons().forEach(function (b) {
      var active = attack && attack.kind === b.kind && attack.t < 0.15;
      ctx.fillStyle = active ? "#ffd84a" : "rgba(255,255,255,.9)"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.translate(b.x, b.y); ctx.fillStyle = "#16202e";
      if (b.kind === "punch") {
        roundRect(-24, -16, 40, 32, 10); ctx.fill();
        ctx.fillStyle = active ? "#ffd84a" : "#fff";
        for (var i = 0; i < 3; i++) { ctx.fillRect(-6 + i * 10, -16, 2, 14); }
        ctx.fillStyle = "#16202e"; roundRect(-30, -6, 12, 18, 5); ctx.fill();
      } else {
        ctx.fillRect(-14, -28, 18, 32);
        roundRect(-14, 0, 38, 18, 8); ctx.fill();
      }
      ctx.restore();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 結果画面（doji5 の形）: 勝てば倒した秒数、負ければ LOSE */
  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10; ctx.textAlign = "center";
    if (won) {
      ctx.font = "800 108px sans-serif";
      ctx.fillText(score.toFixed(1), W / 2, H * 0.45);
      ctx.font = "800 40px sans-serif";
      ctx.fillText(zT("秒", "sec", "초", "秒", "秒"), W / 2, H * 0.45 + 52);
    } else {
      ctx.font = "800 100px sans-serif";
      ctx.fillText("LOSE", W / 2, H * 0.47);
    }
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    dbg: function () { return kaiju && { k: kaiju.body.position, ka: kaiju.body.angle, c: chestB.position, cd: kaiju.cd, stun: stunT, lunge: kaiju.lunge }; },
    now: function () { return { state: state, score: score, W: W, H: H, parts: pieces ? pieces.length : 0, robotHP: robotHP, kaijuHP: kaijuHP, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    debug: debugKey,
    attack: doAttack,
    hideUI: function () { hideUI = true; }
  };
  var hideUI = false;

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(2000);
      debugKey(2);
      if (!await r.until(function () { return state === S.FIGHT; }, 10)) throw Error("戦いにならない");
      debugKey(4);
      for (var i = 0; i < 20 && state === S.FIGHT; i++) { keys.r = true; doAttack("punch"); await r.wait(400); }
      keys.r = false;
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
