<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>北海道詰め</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1f2a36; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../celebrate.js"></script>   <!-- ファンファーレと紙吹雪 -->
<script src="prefs.js"></script>   <!-- 都道府県の形 -->
<script>
/* 北海道詰め（仮題）

   北海道の輪郭（線）の中に、あいてと交互に県を置いていく。次に置く県はルーレットで決まる（大きさは本物どおり）。
   県は自分で動かして回して置く。ほかの県とは重ねられない。線からはみ出して置いたら負け。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    if (!HKP) buildShapes();                     /* 遊んでいる途中で形の倍率は変えない */
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, OUT = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor();
    OUT.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, to, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    var n = AC.currentTime + (delay || 0);
    f.type = "bandpass"; f.frequency.setValueAtTime(freq, n); f.Q.value = q || 1;
    if (to) f.frequency.exponentialRampToValueAtTime(to, n + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  var SFX = {
    whoosh: function () { noiseHit(0.5, 600, 0.12, 1.2, 2400); },
    clang: function () {                         /* ぴったりはまった */
      tone(1180, 0.5, 0.12, "square", 1100); tone(1770, 0.4, 0.07, "triangle"); tone(220, 0.25, 0.2, "square", 110);
      noiseHit(0.18, 3200, 0.3, 2);
    },
    stick: function () { tone(140, 0.25, 0.25, "square", 60); noiseHit(0.2, 500, 0.35, 1); },
    lost: function () { tone(500, 0.35, 0.08, "triangle", 160); },
    land: function () { tone(70, 0.6, 0.45, "sine", 35); noiseHit(0.6, 180, 0.6, 0.8); },
    swing: function () { noiseHit(0.16, 900, 0.12, 1.5, 2600); },
    hit: function (k) { k = Math.min(1, k); tone(120, 0.18, 0.3 * k + 0.1, "square", 50); noiseHit(0.2, 1400, 0.4 * k + 0.15, 1.2); noiseHit(0.08, 4000, 0.2 * k, 2); },
    hurt: function (k) { k = Math.min(1, k); tone(90, 0.3, 0.3 * k + 0.1, "sawtooth", 40); noiseHit(0.3, 700, 0.4 * k + 0.1, 1); },
    roar: function (big) {
      var d = big ? 1.2 : 0.6;
      tone(150, d, 0.16, "sawtooth", 70); tone(96, d, 0.14, "sawtooth", 55);
      noiseHit(d, 900, 0.25, 0.7, 300);
    },
    lose: function () { tone(330, 0.4, 0.12, "triangle", 300); tone(262, 0.5, 0.12, "triangle", 240, 0.35); tone(196, 0.9, 0.14, "triangle", 150, 0.75); }
  };
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });



  /* ============ 形 ============
     prefs.js の輪郭（どれも同じ縮尺）を、北海道が画面の幅いっぱいになる倍率にする。各県は自分の重心が原点 */
  function areaCentroid(p) {
    var a = 0, cx = 0, cy = 0;
    for (var i = 0; i < p.length; i++) {
      var u = p[i], v = p[(i + 1) % p.length], c = u[0] * v[1] - v[0] * u[1];
      a += c; cx += (u[0] + v[0]) * c; cy += (u[1] + v[1]) * c;
    }
    return a ? [cx / (3 * a), cy / (3 * a)] : [0, 0];
  }
  var HK = 0, SC = 1, SHAPES = [], HKP = null, HKB = null;
  function buildShapes() {
    var raw = window.PREFS || [], hx0 = 1e9, hx1 = -1e9, hy0 = 1e9, hy1 = -1e9;
    raw[HK].p.forEach(function (q) { hx0 = Math.min(hx0, q[0]); hx1 = Math.max(hx1, q[0]); hy0 = Math.min(hy0, q[1]); hy1 = Math.max(hy1, q[1]); });
    SC = Math.min((W - 40) / (hx1 - hx0), (H * 0.52) / (hy1 - hy0));
    SHAPES = raw.map(function (d, i) {
      var c = areaCentroid(d.p);
      var pts = d.p.map(function (q) { return [(q[0] - c[0]) * SC, (q[1] - c[1]) * SC]; });
      var r = 0; pts.forEach(function (q) { r = Math.max(r, Math.hypot(q[0], q[1])); });
      return { i: i, name: d.n, pts: pts, r: r, area: Math.abs(d.a || 1) };
    });
    /* 北海道（器）は、上に余白をとって真ん中に */
    var ox = W / 2 - ((hx0 + hx1) / 2) * SC, oy = 150 - hy0 * SC;
    HKP = raw[HK].p.map(function (q) { return [q[0] * SC + ox, q[1] * SC + oy]; });
    HKB = bbox(HKP);
  }
  function prefColor(i) { return "hsl(" + Math.round((i * 137.5) % 360) + ",72%,58%)"; }

  /* ---------- 多角形 ---------- */
  function bbox(P) {
    var b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
    P.forEach(function (q) { b.x0 = Math.min(b.x0, q[0]); b.x1 = Math.max(b.x1, q[0]); b.y0 = Math.min(b.y0, q[1]); b.y1 = Math.max(b.y1, q[1]); });
    return b;
  }
  function placed(i, x, y, a) {
    var c = Math.cos(a), s = Math.sin(a);
    return SHAPES[i].pts.map(function (q) { return [x + q[0] * c - q[1] * s, y + q[0] * s + q[1] * c]; });
  }
  function pointIn(P, x, y) {
    var inside = false;
    for (var i = 0, j = P.length - 1; i < P.length; j = i++) {
      if ((P[i][1] > y) !== (P[j][1] > y) && x < (P[j][0] - P[i][0]) * (y - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) inside = !inside;
    }
    return inside;
  }
  function cross(a, b, c, d) {                   /* 線分 ab と cd が交わる */
    var d1 = (d[0] - c[0]) * (a[1] - c[1]) - (d[1] - c[1]) * (a[0] - c[0]);
    var d2 = (d[0] - c[0]) * (b[1] - c[1]) - (d[1] - c[1]) * (b[0] - c[0]);
    var d3 = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    var d4 = (b[0] - a[0]) * (d[1] - a[1]) - (b[1] - a[1]) * (d[0] - a[0]);
    return d1 * d2 < 0 && d3 * d4 < 0;
  }
  function edgesCross(A, B, bb) {
    for (var i = 0; i < A.length; i++) {
      var a = A[i], b = A[(i + 1) % A.length];
      if (bb && (Math.max(a[0], b[0]) < bb.x0 || Math.min(a[0], b[0]) > bb.x1 || Math.max(a[1], b[1]) < bb.y0 || Math.min(a[1], b[1]) > bb.y1)) continue;
      for (var j = 0; j < B.length; j++) if (cross(a, b, B[j], B[(j + 1) % B.length])) return true;
    }
    return false;
  }
  /* 線（北海道の輪郭）からはみ出しているか */
  function overLine(P) {
    for (var k = 0; k < P.length; k++) if (!pointIn(HKP, P[k][0], P[k][1])) return true;
    return edgesCross(P, HKP);
  }
  /* ほかの県と重なっているか */
  function overlapsAny(P, bb) {
    for (var n = 0; n < board.length; n++) {
      var Q = board[n], qb = Q.bb;
      if (bb.x1 < qb.x0 || bb.x0 > qb.x1 || bb.y1 < qb.y0 || bb.y0 > qb.y1) continue;
      if (edgesCross(P, Q.poly, qb) || pointIn(Q.poly, P[0][0], P[0][1]) || pointIn(P, Q.poly[0][0], Q.poly[0][1])) return true;
    }
    return false;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", SPIN: "spin", PLACE: "place", END: "end", RESULT: "result" };
  var state, T, won, shake, board, deck, cur, turn, count, spin, cpuMove, endT, forceOut, loserPiece;
  var conf = window.zCelebrate ? window.zCelebrate.confetti() : null;
  if (conf) conf.rain = false;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    T = 0; won = false; shake = 0; count = 0; endT = 0; forceOut = null; loserPiece = null;
    board = []; cur = null; turn = 0;
    deck = [];
    for (var i = 0; i < SHAPES.length; i++) if (i !== HK) deck.push(i);
    if (conf) conf.clear();
    startSpin();
  }
  function trayPos() { return { x: W / 2, y: (HKB.y1 + ctrlY()) / 2 + 10 }; }

  /* ---------- ルーレット（次の県を決める） ---------- */
  function startSpin() {
    if (!deck.length) { finish(true); return; }
    state = S.SPIN;
    var pick = deck[Math.floor(Math.random() * deck.length)];
    /* 名前がだんだんゆっくり切りかわって、最後に pick で止まる */
    var ticks = [], t = 0, gap = 0.045;
    while (t < 1.5) { ticks.push(t); t += gap; gap *= 1.09; }
    var seq = ticks.map(function () { return deck[Math.floor(Math.random() * deck.length)]; });
    seq[seq.length - 1] = pick;
    spin = { t: 0, ticks: ticks, seq: seq, k: 0, pick: pick, hold: 0 };
  }
  function updateSpin(dt) {
    spin.t += dt;
    while (spin.k < spin.ticks.length - 1 && spin.t >= spin.ticks[spin.k + 1]) { spin.k++; tone(900 + (spin.k % 2) * 120, 0.04, 0.06, "square"); }
    if (spin.k === spin.ticks.length - 1) {
      if (!spin.hold) { tone(660, 0.12, 0.12, "square"); tone(990, 0.25, 0.12, "square", null, 0.1); }
      spin.hold += dt;
      if (spin.hold > 0.55) startPlace(spin.pick);
    }
  }
  function startPlace(i) {
    deck.splice(deck.indexOf(i), 1);
    var tp = trayPos();
    cur = { i: i, x: tp.x, y: tp.y, a: 0, ta: 0 };
    state = S.PLACE;
    cpuMove = null;
    if (turn === 1) {
      var best = solve(i);
      if (forceOut === "cpu") { best = null; forceOut = null; }
      if (!best) best = outsideSpot(i);
      cpuMove = { t: 0, fx: cur.x, fy: cur.y, x: best.x, y: best.y, a: best.a };
    }
  }

  /* ---------- 置ける所を探す（相手と、デバッグの「おまかせ」） ----------
     線の内側で、ほかの県と重ならない所のうち、線やほかの県にいちばん寄り添う所（少しぶれる） */
  function solve(i) {
    var best = null, step = 10, rots = 18;
    for (var r = 0; r < rots; r++) {
      var a = r * Math.PI * 2 / rots;
      for (var y = HKB.y0; y <= HKB.y1; y += step) for (var x = HKB.x0; x <= HKB.x1; x += step) {
        if (!pointIn(HKP, x, y)) continue;
        var P = placed(i, x, y, a);
        if (overLine(P)) continue;
        var bb = bbox(P);
        if (overlapsAny(P, bb)) continue;
        var sc = hug(P) + Math.random() * 6;
        if (!best || sc > best.sc) best = { x: x, y: y, a: a, sc: sc };
      }
    }
    return best;
  }
  function hug(P) {                              /* 線やほかの県の近くにある角の数 */
    var n = 0, polys = [HKP].concat(board.map(function (b) { return b.poly; }));
    for (var k = 0; k < P.length; k += 2) {
      var p = P[k], near = false;
      for (var m = 0; m < polys.length && !near; m++) {
        var Q = polys[m];
        for (var j = 0; j < Q.length; j++) if (Math.abs(Q[j][0] - p[0]) + Math.abs(Q[j][1] - p[1]) < 22) { near = true; break; }
      }
      if (near) n++;
    }
    return n;
  }
  function outsideSpot(i) {                      /* 入る所がない: 重ならない所に置くしかない（はみ出す） */
    for (var k = 0; k < 200; k++) {
      var x = HKB.x0 + Math.random() * (HKB.x1 - HKB.x0), y = HKB.y0 + Math.random() * (HKB.y1 - HKB.y0), a = Math.random() * 6.28;
      var P = placed(i, x, y, a);
      if (!overlapsAny(P, bbox(P))) return { x: x, y: y, a: a };
    }
    var tp = trayPos();
    return { x: tp.x, y: tp.y, a: 0 };
  }
  function updateCPU(dt) {
    var m = cpuMove;
    m.t += dt;
    var u = Math.min(1, Math.max(0, (m.t - 0.3) / 0.9)), e = u * u * (3 - 2 * u);
    cur.x = m.fx + (m.x - m.fx) * e; cur.y = m.fy + (m.y - m.fy) * e;
    cur.a = cur.ta = m.a * e;
    if (m.t > 1.5) confirm();
  }

  /* ---------- 置く ---------- */
  function curPoly() { return placed(cur.i, cur.x, cur.y, cur.a); }
  function curState() {
    var P = curPoly(), bb = bbox(P);
    return { P: P, bb: bb, hit: overlapsAny(P, bb), out: overLine(P) };
  }
  function confirm() {
    if (state !== S.PLACE || !cur) return;
    cur.a = cur.ta;
    var st = curState();
    if (st.hit) { tone(140, 0.15, 0.15, "square"); shake = 6; return; }   /* ほかの県とは重ねられない */
    var piece = { i: cur.i, x: cur.x, y: cur.y, a: cur.a, poly: st.P, bb: st.bb, by: turn };
    board.push(piece);
    cur = null;
    if (st.out) { loserPiece = piece; finish(turn === 1); return; }
    count++;
    tone(520, 0.08, 0.15, "square"); tone(780, 0.12, 0.12, "square", null, 0.06);
    turn = 1 - turn;
    startSpin();
  }
  function finish(win) {
    won = win; state = S.END; endT = 0;
    if (win) {
      setTimeout(function () { if (won && AC && window.zCelebrate) window.zCelebrate.play(AC, "fanfare", { dest: OUT }); }, 300);
      if (conf) conf.burst(W, H, 160);
    } else SFX.lose();
    shake = 10;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (conf) conf.step(dt, W, H);
    shake = Math.max(0, shake - dt * 30);
    T += dt;
    if (cur && !(cpuMove && state === S.PLACE)) cur.a += angDiff(cur.ta - cur.a) * Math.min(1, dt * 16);
    if (state === S.SPIN) updateSpin(dt);
    else if (state === S.PLACE && turn === 1) updateCPU(dt);
    else if (state === S.PLACE && turn === 0) {
      var mx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), my = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
      if (mx || my) moveCur(mx * 260 * dt, my * 260 * dt);
    } else if (state === S.END) {
      endT += dt;
      if (endT > 2) { state = S.RESULT; shareButton.hidden = false; }
    }
  }
  function angDiff(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  function moveCur(dx, dy) {
    cur.x = Math.max(0, Math.min(W, cur.x + dx));
    cur.y = Math.max(110, Math.min(ctrlY() - 40, cur.y + dy));
  }
  function rotateCur(dir) { if (cur && state === S.PLACE && turn === 0) { cur.ta += (dir || 1) * Math.PI / 12; tone(660, 0.04, 0.07, "square"); } }

  /* ============ 入力 ============ */
  var keys = { l: false, r: false, u: false, d: false };
  var drag = null;
  function ctrlY() { return H - 86; }
  function ctrlButtons() {
    var r = 44, y = ctrlY();
    return [{ kind: "rotL", x: W / 2 - 150, y: y, r: r }, { kind: "rotR", x: W / 2 - 50, y: y, r: r }, { kind: "ok", x: W / 2 + 110, y: y, r: r + 6 }];
  }
  function down(x, y, id) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLACE || turn !== 0) return;
    if (x == null) { confirm(); return; }
    var bs = ctrlButtons();
    for (var i = 0; i < bs.length; i++) if (Math.hypot(x - bs[i].x, y - bs[i].y) < bs[i].r + 10) {
      if (bs[i].kind === "ok") confirm(); else rotateCur(bs[i].kind === "rotL" ? -1 : 1);
      return;
    }
    drag = { id: id, x: x, y: y };
  }
  function move(x, y, id) {
    if (!drag || drag.id !== id || !cur || turn !== 0 || state !== S.PLACE) return;
    moveCur(x - drag.x, y - drag.y);
    drag.x = x; drag.y = y;
  }
  function up(id) { if (drag && (id == null || drag.id === id)) drag = null; }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) { e.preventDefault(); var p = atCanvas(e); down(p.x, p.y, e.pointerId); });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y, e.pointerId); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(e.pointerId); });
  wrap.addEventListener("pointercancel", function (e) { up(e.pointerId); });
  window.addEventListener("blur", function () { up(); keys.l = keys.r = keys.u = keys.d = false; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLACE || turn !== 0) return;
    if (n === 1 || n === 2) {                     /* 1 自分の県をおまかせで置く  2 そのうえ次の相手は入らない（勝ち） */
      var b = solve(cur.i) || outsideSpot(cur.i);
      cur.x = b.x; cur.y = b.y; cur.a = cur.ta = b.a;
      if (n === 2) forceOut = "cpu";
      confirm();
    }
    if (n === 3) { var o = outsideSpot(cur.i); cur.x = o.x; cur.y = o.y; cur.a = cur.ta = o.a; if (!curState().out) { cur.x = W / 2; cur.y = HKB.y0; } confirm(); }   /* 3 はみ出して置く（負け） */
  }
  function keySet(e, on) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.l = on; return true; }
    if (k === "ArrowRight" || k === "d" || k === "D") { keys.r = on; return true; }
    if (k === "ArrowUp" || k === "w" || k === "W") { keys.u = on; return true; }
    if (k === "ArrowDown" || k === "s" || k === "S") { keys.d = on; return true; }
    return false;
  }
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    if (e.key === "Escape") { e.preventDefault(); if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (keySet(e, true)) { e.preventDefault(); return; }
    if (e.key === "z" || e.key === "Z" || e.key === "q" || e.key === "Q") { e.preventDefault(); rotateCur(-1); return; }
    if (e.key === "x" || e.key === "X" || e.key === "e" || e.key === "E") { e.preventDefault(); rotateCur(1); return; }
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!go) return;
    e.preventDefault();
    if (e.repeat || state === S.INTRO) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (keySet(e, false)) return;
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  /* ============ シェア ============ */
  function doShare() {
    var text = won
      ? zT("北海道に" + count + "県詰めて勝った", "Packed " + count + " prefectures into Hokkaido and won", "홋카이도에 " + count + "개 현을 채워 넣고 이겼다", "在北海道塞进" + count + "个县，赢了", "在北海道塞進" + count + "個縣，贏了")
      : zT("北海道に" + count + "県詰めたところで、はみ出して負けた", "Stuck out of Hokkaido after " + count + " prefectures", "홋카이도에 " + count + "개 현을 채우고 삐져나와서 졌다", "北海道塞进" + count + "个县后出界，输了", "北海道塞進" + count + "個縣後出界，輸了");
    window.zResultActions.x({ text: text + zT(" #北海道詰め", " #HokkaidoPacking") });
  }

  /* ============ 描画 ============ */
  var BG = "#1f2a36", LINE = "#ffd34a";
  function path(P) {
    ctx.beginPath();
    P.forEach(function (q, n) { if (n) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
    ctx.closePath();
  }
  function drawPiece(i, P, x, y, a, look) {
    path(P);
    ctx.fillStyle = look === "bad" ? "#ff4a3a" : prefColor(i);
    ctx.globalAlpha = look === "hit" ? 0.55 : 1;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = look === "bad" ? "#fff" : "#16202e"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
    var nm = SHAPES[i].name, fs = Math.max(11, Math.min(26, SHAPES[i].r * 0.32));
    ctx.font = "800 " + fs + "px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(22,32,46,.8)"; ctx.strokeText(nm, x, y); ctx.fillStyle = "#fff"; ctx.fillText(nm, x, y);
  }
  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    /* 器（北海道） */
    path(HKP); ctx.fillStyle = "#33465a"; ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.stroke();
    board.forEach(function (b) {
      var flash = b === loserPiece && Math.floor(T * 5) % 2 === 0;
      drawPiece(b.i, b.poly, b.x, b.y, b.a, flash ? "bad" : null);
    });
    if (cur && state !== S.INTRO) {
      var st = curState();
      drawPiece(cur.i, st.P, cur.x, cur.y, cur.a, st.hit ? "hit" : null);
      if (st.out && cur.y < HKB.y1 + 40) {        /* 線からはみ出している所を見せる */
        ctx.save(); path(st.P); ctx.clip();
        ctx.fillStyle = "rgba(255,60,40,.35)"; ctx.fillRect(st.bb.x0, st.bb.y0, st.bb.x1 - st.bb.x0, st.bb.y1 - st.bb.y0);
        ctx.restore();
        path(HKP); ctx.strokeStyle = LINE; ctx.lineWidth = 4; ctx.stroke();
      }
    }
    ctx.restore();
    if (hideUI) return;
    if (state !== S.INTRO && state !== S.RESULT) drawHUD();
    if (state === S.SPIN) drawSpin();
    if (state === S.PLACE && turn === 0) drawCtrls();
    if (state === S.RESULT) drawResult();
    if (conf) conf.draw(ctx);
  }
  function drawHUD() {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
    ctx.font = "900 60px sans-serif"; ctx.fillStyle = "#fff";
    ctx.fillText(count, W / 2, 18);
    if (state !== S.END) {
      var who = turn === 0 ? zT("あなた", "YOU", "당신", "你", "你") : zT("あいて", "CPU", "상대", "对手", "對手");
      ctx.font = "800 22px sans-serif"; ctx.fillStyle = turn === 0 ? "#7fd0ff" : "#ffb07f";
      ctx.fillText(who, W / 2, 84);
    }
    ctx.restore();
  }
  function drawSpin() {
    /* 器の下に、名前が切りかわるルーレット */
    var tp = trayPos(), bw = 260, bh = 150, x = tp.x - bw / 2, y = tp.y - bh / 2;
    var i = spin.seq[spin.k], done = spin.k === spin.ticks.length - 1;
    ctx.fillStyle = done ? "#ffd34a" : "#fff"; roundRect(x, y, bw, bh, 18); ctx.fill();
    ctx.strokeStyle = turn === 0 ? "#7fd0ff" : "#ffb07f"; ctx.lineWidth = 5; ctx.stroke();
    var sh = SHAPES[i], k = 44 / sh.r;
    var P = sh.pts.map(function (q) { return [tp.x - 70 + q[0] * k, tp.y + q[1] * k]; });
    path(P); ctx.fillStyle = prefColor(i); ctx.fill(); ctx.strokeStyle = "#16202e"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#16202e"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "900 " + (sh.name.length >= 3 ? 34 : 42) + "px sans-serif";
    ctx.fillText(sh.name, tp.x + 50, tp.y);
  }
  function drawCtrls() {
    ctrlButtons().forEach(function (b) {
      ctx.fillStyle = b.kind === "ok" ? "#ffd34a" : "rgba(255,255,255,.92)"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.translate(b.x, b.y); ctx.strokeStyle = "#16202e"; ctx.fillStyle = "#16202e"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (b.kind === "ok") { ctx.beginPath(); ctx.moveTo(-17, 1); ctx.lineTo(-5, 14); ctx.lineTo(18, -12); ctx.stroke(); }
      else {
        if (b.kind === "rotL") ctx.scale(-1, 1);
        ctx.beginPath(); ctx.arc(0, 0, 18, -Math.PI * 0.85, Math.PI * 0.55); ctx.stroke();
        var ex = Math.cos(Math.PI * 0.55) * 18, ey = Math.sin(Math.PI * 0.55) * 18;
        ctx.beginPath(); ctx.moveTo(ex - 12, ey + 2); ctx.lineTo(ex + 2, ey + 8); ctx.lineTo(ex + 1, ey - 8); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.55)"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10; ctx.textAlign = "center";
    ctx.font = "800 96px sans-serif"; ctx.fillText(won ? "WIN" : "LOSE", W / 2, H * 0.36);
    ctx.font = "800 110px sans-serif"; ctx.fillText(count, W / 2, H * 0.36 + 120);
    ctx.font = "800 36px sans-serif"; ctx.fillText(zT("県", "prefectures", "현", "县", "縣"), W / 2, H * 0.36 + 166);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  var hideUI = false;
  window.__probe = {
    now: function () { return { state: state, turn: turn, count: count, won: won, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    debug: debugKey,
    hideUI: function () { hideUI = true; }
  };
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000); r.key(); await r.wait(800);
      for (var n = 0; n < 4; n++) {
        if (!await r.until(function () { return state === S.PLACE && turn === 0; }, 15)) break;
        await r.wait(600); debugKey(1);
      }
      await r.wait(2000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  board = []; count = 0; turn = 0; T = 0; shake = 0; state = S.INTRO; startButton.hidden = false;
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
