<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流れの編集 | 全員マッチョ館の殺人</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f151f; color: #e8eef6; font: 15px/1.6 system-ui, sans-serif; }

  header {
    position: sticky; top: 0; z-index: 5; background: #131b28;
    border-bottom: 1px solid #24303f; padding: 10px 16px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select, input, textarea {
    font: inherit; color: inherit; background: #1c2634;
    border: 1px solid #33445a; border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: #26344a; }
  button.main { background: #ffa23a; border-color: #ffa23a; color: #1a1206; font-weight: 700; }
  button.main:hover { background: #ffb15c; }
  #status { margin-left: auto; color: #93a4bb; font-size: 13px; }

  .cols { display: flex; align-items: flex-start; gap: 16px; padding: 14px 16px 60px; }

  /* ---- 左：シーンの並び ---- */
  .side { flex: 0 0 250px; position: sticky; top: 62px; }
  .side h2 { font-size: 13px; color: #93a4bb; margin: 0 0 8px; font-weight: 700; }
  .scene {
    border: 1px solid #24303f; border-radius: 9px; background: #141c28;
    padding: 7px 9px; margin-bottom: 5px; cursor: pointer;
  }
  .scene:hover { border-color: #3a4c66; }
  .scene.on { border-color: #ffa23a; background: #1b2432; }
  .scene .nm { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scene .meta { font-size: 12px; color: #8fa1b8; display: flex; gap: 8px; flex-wrap: wrap; }
  .scene .meta .in { color: #c0aaff; }
  .scene .meta .out { color: #97dba9; }
  .side .sbtn { display: flex; gap: 5px; margin-top: 8px; }
  .side .sbtn button { flex: 1; padding: 5px; font-size: 13px; }

  /* ---- 右：シーンの中身 ---- */
  .pane { flex: 1; min-width: 0; }
  .sceneHead {
    border: 1px solid #2c3a4d; border-radius: 10px; background: #151e2b;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .sceneHead .r { display: flex; gap: 10px; align-items: center; margin: 5px 0; flex-wrap: wrap; }
  .sceneHead label { flex: none; width: 108px; color: #93a4bb; font-size: 13px; }
  .sceneHead input[type=text] { flex: 1; min-width: 180px; }
  .sceneHead .hint { color: #7b8ca3; font-size: 12px; }

  .row { border: 1px solid #24303f; border-radius: 10px; background: #141c28; margin-bottom: 6px; overflow: hidden; }
  .row.open { border-color: #ffa23a; }
  .head { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
  .kind {
    flex: none; min-width: 92px; text-align: center; font-size: 12px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; background: #24303f; color: #a9bdd6;
  }
  .kind.say { background: #1d3b4d; color: #7fd3ff; }
  .kind.ask { background: #3d3320; color: #ffc477; }
  .kind.input { background: #43261f; color: #ff9f7f; }
  .kind.flow { background: #2b2440; color: #c0aaff; }
  .kind.stage { background: #223528; color: #97dba9; }
  .sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cfdcec; }
  .sum b { font-weight: 700; }
  .sum i { color: #8fa1b8; font-style: normal; }
  .acts { flex: none; display: flex; gap: 4px; }
  .acts button { padding: 2px 8px; font-size: 13px; }

  /* つまんで並べ替え */
  .grip { flex: none; color: #5d708a; cursor: grab; letter-spacing: -2px; user-select: none; }
  .head:active .grip, .scene:active .grip { cursor: grabbing; }
  .dragging { opacity: .35; }
  .dropBefore { box-shadow: 0 -3px 0 0 #ffa23a; }
  .dropAfter { box-shadow: 0 3px 0 0 #ffa23a; }

  .body { padding: 4px 10px 12px; border-top: 1px solid #24303f; }
  .f { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .f > label { flex: none; width: 96px; padding-top: 6px; color: #93a4bb; font-size: 13px; }
  .f > .in { flex: 1; }
  .f input[type=text], .f textarea, .f select { width: 100%; box-sizing: border-box; }
  .f textarea { min-height: 62px; resize: vertical; }

  .opts { border: 1px dashed #33445a; border-radius: 8px; padding: 8px; }
  .opt { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .opt input[type=text] { flex: 1; }
  .opt select { flex: 0 0 170px; }
  .opt label { font-size: 12px; color: #93a4bb; display: flex; gap: 4px; align-items: center; white-space: nowrap; }

  .add { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .out { margin-top: 20px; }
  .out textarea { width: 100%; box-sizing: border-box; min-height: 240px; font-family: ui-monospace, monospace; font-size: 13px; }
  .note { color: #93a4bb; font-size: 13px; margin: 6px 0 0; }

  @media (max-width: 720px) {
    .cols { flex-direction: column; }
    .side { position: static; flex: none; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>流れの編集</h1>
  <button id="save" class="main">保存</button>
  <button id="try" title="いま開いているシーンから始めます">このシーンから試す</button>
  <button id="kw">キーワード</button>
  <button id="export">書き出す</button>
  <button id="reset">保存ずみの内容に戻す</button>
  <span id="srv" title=""></span>
  <span id="status"></span>
</header>

<div class="cols">
  <div class="side">
    <h2>シーン</h2>
    <div id="scenes"></div>
    <div class="sbtn">
      <button id="sAdd">＋ シーン</button>
      <button id="sDel">× このシーンを消す</button>
    </div>
  </div>

  <div class="pane">
    <div class="sceneHead" id="sceneHead"></div>
    <div id="list"></div>

    <div class="add">
      <select id="kind"></select>
      <button id="add">この行を足す</button>
    </div>

    <div class="out" id="kwBox" hidden>
      <p class="note">
        覚えておきたい言葉。1行に1つ。本文にもログにも、この色で出ます。<br>
        書いた言葉は、出てくる全てのセリフで自動的に色が付きます（本文に印は要りません）。
      </p>
      <div class="add" style="margin-bottom:8px">
        <input type="color" id="kwColor" style="width:52px;padding:2px">
        <span class="note" id="kwColorText"></span>
      </div>
      <textarea id="kwText" spellcheck="false" style="min-height:200px"></textarea>
    </div>

    <div class="out" id="outBox" hidden>
      <p class="note">scenario.js の中身です。「保存」が使えないブラウザのときは、これをコピーして貼り替えてください。</p>
      <textarea id="outText" spellcheck="false"></textarea>
      <div class="add">
        <button id="dl" class="main">ダウンロード</button>
        <button id="copy">コピー</button>
      </div>
    </div>
  </div>
</div>

<script src="scenario.js"></script>
<script>
(function () {
  "use strict";

  var DRAFT_KEY = "macho-draft";
  var scenes = [];      // [{ name, rows, exit, isHead }]
  var cur = 0;          // 見ているシーン
  var openIndex = -1;   // 開いている行
  var srcText = "";     // scenario.js の全文

  /* =====================================================================
     流れ（一本の配列）と、シーンの束を行き来する
     ===================================================================== */
  function toScenes(listIn) {
    var out = [], s = { name: "はじめ", rows: [], isHead: true };
    for (var i = 0; i < listIn.length; i++) {
      var r = listIn[i];
      if (r.label !== undefined) { out.push(s); s = { name: r.label, rows: [] }; }
      else s.rows.push(r);
    }
    out.push(s);
    for (var j = 0; j < out.length; j++) {          // 末尾の「とぶ」は、シーンの出口として持つ
      var rows = out[j].rows, last = rows[rows.length - 1];
      if (last && last.jump !== undefined) { out[j].exit = last.jump; rows.pop(); }
    }
    if (out.length > 1 && out[0].rows.length === 0 && !out[0].exit) out.shift();
    return out;
  }

  function toList() {
    var out = [];
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i];
      if (!s.isHead) out.push({ label: s.name });
      out = out.concat(s.rows);
      if (s.exit) out.push({ jump: s.exit });
    }
    return out;
  }

  /* =====================================================================
     行の種類
     ===================================================================== */
  var KINDS = {
    say:   { label: "セリフ",   cls: "say",   fields: ["say", "text"] },
    text:  { label: "地の文",   cls: "say",   fields: ["text"] },
    ask:   { label: "選択肢",   cls: "ask",   fields: ["ask", "options", "last", "to"] },
    input: { label: "打ち込み", cls: "input", fields: ["input", "ok", "ng", "to"] },
    set:   { label: "フラグを立てる", cls: "flow", fields: ["set"] },
    cond:  { label: "フラグで分かれる", cls: "flow", fields: ["if", "to"] },
    bg:    { label: "背景",     cls: "stage", fields: ["bg"] },
    tune:  { label: "曲",       cls: "stage", fields: ["bgm"] },
    show:  { label: "立ち絵を出す", cls: "stage", fields: ["show", "pos"] },
    hide:  { label: "立ち絵を消す", cls: "stage", fields: ["hide"] },
    jump:  { label: "途中でとぶ", cls: "flow", fields: ["jump"] },
    end:   { label: "おわり",   cls: "flow",  fields: ["end"] }
  };

  var FIELD_LABEL = {
    say: "だれが", text: "本文", ask: "問い", options: "えらべる道",
    last: "全部見たら", to: "そのあと", input: "問い", ok: "正解", ng: "はずれのとき",
    set: "フラグ名", "if": "フラグ名", bg: "背景", bgm: "曲", show: "だれを", hide: "だれを",
    pos: "位置", jump: "とぶ先", end: "結び"
  };

  var FIELD_HINT = {
    last: "空にすると、全部見た時点で自動で次へ進みます",
    to: "空にすると、そのまま下の行に続きます",
    ok: "「、」で区切って、正解として通す書き方を並べます",
    ng: "違ったときに出す一言。そのまま打ち直せます",
    jump: "ふつうはシーンの「このあと」を使ってください"
  };

  function kindOf(row) {
    if (row.ask !== undefined) return "ask";
    if (row.input !== undefined) return "input";
    if (row.end !== undefined) return "end";
    if (row.jump !== undefined) return "jump";
    if (row.set !== undefined) return "set";
    if (row["if"] !== undefined) return "cond";
    if (row.bg !== undefined) return "bg";
    if (row.bgm !== undefined) return "tune";
    if (row.show !== undefined) return "show";
    if (row.hide !== undefined) return "hide";
    if (row.say !== undefined) return "say";
    return "text";
  }

  function blank(kind) {
    switch (kind) {
      case "say":   return { say: firstChara(), text: "" };
      case "text":  return { text: "" };
      case "ask":   return { ask: "", to: "", options: [{ text: "", to: "", once: true }] };
      case "input": return { input: "", ok: [""], to: "", ng: "" };
      case "set":   return { set: "" };
      case "cond":  return { "if": "", to: "" };
      case "bg":    return { bg: firstBg() };
      case "tune":  return { bgm: firstTune() };
      case "show":  return { show: firstChara(), pos: "center" };
      case "hide":  return { hide: firstChara() };
      case "jump":  return { jump: "" };
      case "end":   return { end: "" };
    }
    return { text: "" };
  }

  function charas() { return Object.keys(window.CHARA || {}); }
  function firstChara() { return charas()[0] || ""; }
  function bgs() { return Object.keys(window.BG || {}); }
  function firstBg() { return bgs()[0] || ""; }
  function tunes() { return ["なし"].concat(Object.keys(window.TUNES || {})); }
  function firstTune() { return tunes()[1] || "なし"; }
  function charaName(k) { return (window.CHARA && CHARA[k] && CHARA[k].name) || k; }
  function charaLabel(k) {
    var d = (window.CHARA || {})[k] || {};
    var n = charaName(k);
    if (k === n) return n + (d.noArt ? "（姿なし）" : "");     // 鍵と名前が同じなら、そのまま
    return n + "（" + k + (d.noArt ? "・姿なし" : "") + "）";
  }

  function sceneNames() {
    return scenes.filter(function (s) { return !s.isHead; }).map(function (s) { return s.name; });
  }

  /* そのシーンに入ってくる道の数（ループが見えるように） */
  function inbound(name) {
    var n = 0;
    scenes.forEach(function (s) {
      if (s.exit === name) n++;
      s.rows.forEach(function (r) {
        if (r.jump === name) n++;
        if (r.to === name) n++;
        if (r.options) r.options.forEach(function (o) { if (o.to === name) n++; });
      });
    });
    return n;
  }

  /* シーン名を変えたら、そこを指していた道もぜんぶ書き換える */
  function rename(i, name) {
    var old = scenes[i].name;
    if (!name || name === old) return;
    scenes[i].name = name;
    scenes.forEach(function (s) {
      if (s.exit === old) s.exit = name;
      s.rows.forEach(function (r) {
        if (r.jump === old) r.jump = name;
        if (r.to === old) r.to = name;
        if (r.options) r.options.forEach(function (o) { if (o.to === old) o.to = name; });
      });
    });
  }

  /* =====================================================================
     表示
     ===================================================================== */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ゲーム画面と同じ色分け（人の名前はその人の色、覚えたい言葉はキーワードの色） */
  var hiliteCache = [];

  function rebuildHilite() {
    var list = [], seen = {}, C = window.CHARA || {};
    for (var k in C) if (C.hasOwnProperty(k)) {
      var d = C[k];
      if (d.name && d.color && !seen[d.name]) { seen[d.name] = 1; list.push({ w: d.name, c: d.color }); }
    }
    var words = kwWords();
    for (var i = 0; i < words.length; i++) list.push({ w: words[i], c: kwColor });
    hiliteCache = list.sort(function (a, b) { return b.w.length - a.w.length; });
  }

  function charaColor(k) { return ((window.CHARA || {})[k] || {}).color || "#7fd3ff"; }

  function hilite(text) {
    var str = String(text == null ? "" : text), out = "", buf = "", i = 0;
    while (i < str.length) {
      var hit = null;
      for (var k = 0; k < hiliteCache.length; k++) {
        if (str.substr(i, hiliteCache[k].w.length) === hiliteCache[k].w) { hit = hiliteCache[k]; break; }
      }
      if (hit) {
        out += esc(buf); buf = "";
        out += "<span style='color:" + esc(hit.c) + "'>" + esc(hit.w) + "</span>";
        i += hit.w.length;
      } else {
        buf += str.charAt(i);
        i++;
      }
    }
    return out + esc(buf);
  }

  function summary(row) {
    var k = kindOf(row);
    if (!meaningful(row)) return "<i>（空のまま。保存では省かれます）</i>";
    if (k === "say")   return "<b style='color:" + esc(charaColor(row.say)) + "'>" +
                              esc(charaName(row.say)) + "</b> " + hilite(row.text);
    if (k === "text")  return hilite(row.text);
    if (k === "ask")   return hilite(row.ask) + " <i>（" + (row.options || []).map(function (o) {
                              return esc(o.text) + " → " + esc(o.to || "?"); }).join(" / ") + "）</i>";
    if (k === "input") return hilite(row.input) + " <i>→ " + esc((row.ok || []).join(" / ")) + "</i>";
    if (k === "set")   return esc(row.set) + " を立てる";
    if (k === "cond")  return esc(row["if"]) + " が立っていれば → " + esc(row.to);
    if (k === "bg")    return esc(row.bg);
    if (k === "tune")  return esc(row.bgm);
    if (k === "show")  return esc(charaName(row.show)) + " <i>（" + esc(row.pos || "center") + "）</i>";
    if (k === "hide")  return esc(charaName(row.hide));
    if (k === "jump")  return "→ " + esc(row.jump);
    if (k === "end")   return hilite(row.end);
    return "";
  }

  function sceneSelect(f, v, blankLabel) {
    var names = sceneNames();
    if (v && names.indexOf(v) < 0) names = names.concat([v]);
    return "<select data-f='" + f + "'><option value=''>" + esc(blankLabel || "（なし）") + "</option>" +
      names.map(function (n) {
        return "<option value='" + esc(n) + "'" + (n === v ? " selected" : "") + ">" + esc(n) + "</option>";
      }).join("") + "</select>";
  }

  function fieldHtml(row, f) {
    var v = row[f], box;

    if (f === "say" || f === "show" || f === "hide") {
      box = "<select data-f='" + f + "'>" + charas().map(function (c) {
        return "<option value='" + esc(c) + "'" + (c === v ? " selected" : "") + ">" + esc(charaLabel(c)) + "</option>";
      }).join("") + "</select>";
    } else if (f === "bgm") {
      box = "<select data-f='bgm'>" + tunes().map(function (c) {
        return "<option value='" + esc(c) + "'" + (c === v ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select>";
    } else if (f === "bg") {
      box = "<select data-f='" + f + "'>" + bgs().map(function (c) {
        return "<option value='" + esc(c) + "'" + (c === v ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select>";
    } else if (f === "pos") {
      box = "<select data-f='" + f + "'>" + ["left", "center", "right"].map(function (c) {
        return "<option value='" + c + "'" + (c === v ? " selected" : "") + ">" + c + "</option>";
      }).join("") + "</select>";
    } else if (f === "to" || f === "jump") {
      box = sceneSelect(f, v, f === "to" ? "（すぐ次へ）" : "（なし）");
    } else if (f === "text" || f === "ask" || f === "input" || f === "ng") {
      box = "<textarea data-f='" + f + "'>" + esc(v) + "</textarea>";
    } else if (f === "ok") {
      box = "<input type='text' data-f='ok' value='" + esc((v || []).join("、")) + "'>";
    } else if (f === "options") {
      box = optionsHtml(row);
    } else {
      box = "<input type='text' data-f='" + esc(f) + "' value='" + esc(v) + "'>";
    }

    var hint = FIELD_HINT[f] ? "<div class='hint' style='color:#7b8ca3;font-size:12px'>" + esc(FIELD_HINT[f]) + "</div>" : "";
    return "<div class='f'><label>" + esc(FIELD_LABEL[f] || f) + "</label><div class='in'>" + box + hint + "</div></div>";
  }

  function optionsHtml(row) {
    var opts = row.options || [], h = "<div class='opts'>";
    for (var i = 0; i < opts.length; i++) {
      var o = opts[i];
      h += "<div class='opt' data-oi='" + i + "'>" +
        "<input type='text' data-of='text' value='" + esc(o.text) + "' placeholder='えらぶ文'>" +
        sceneSelect("", o.to, "（行き先）").replace("data-f=''", "data-of='to'") +
        "<label><input type='checkbox' data-of='once'" + (o.once ? " checked" : "") + ">一度だけ</label>" +
        "<button data-oact='del'>×</button></div>";
    }
    return h + "<button data-oact='add'>＋ えらべる道</button></div>";
  }

  function renderScenes() {
    var h = "";
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i], n = s.isHead ? 0 : inbound(s.name);
      h += "<div class='scene" + (i === cur ? " on" : "") + "' data-si='" + i + "'" +
        (s.isHead ? "" : " draggable='true'") + ">" +
        "<div class='nm'>" + (s.isHead ? "" : "<span class='grip'>⠿</span> ") + esc(s.name) + "</div>" +
        "<div class='meta'>" +
          "<span>" + s.rows.length + "行</span>" +
          (n ? "<span class='in'>⟲ " + n + "本の道</span>" : "") +
          (s.exit ? "<span class='out'>→ " + esc(s.exit) + "</span>" : "") +
        "</div></div>";
    }
    document.getElementById("scenes").innerHTML = h;
  }

  function renderHead() {
    var s = scenes[cur];
    var h = "<div class='r'><label>シーン名</label>" +
      (s.isHead
        ? "<span class='hint'>いちばん最初のシーンです（名前はありません）</span>"
        : "<input type='text' id='sName' value='" + esc(s.name) + "'>") +
      "</div>" +
      "<div class='r'><label>このあと</label>" +
        "<select id='sExit'><option value=''>次のシーンへ進む</option>" +
        sceneNames().map(function (n) {
          return "<option value='" + esc(n) + "'" + (n === s.exit ? " selected" : "") + ">" + esc(n) + " へ戻る／とぶ</option>";
        }).join("") + "</select>" +
        "<span class='hint'>" + (s.exit ? "ここまで来たら、そのシーンへ移ります" : "そのまま下のシーンへ続きます") + "</span>" +
      "</div>";
    document.getElementById("sceneHead").innerHTML = h;
  }

  function renderRows() {
    var rows = scenes[cur].rows, h = "";
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i], K = KINDS[kindOf(row)], open = i === openIndex;
      h += "<div class='row" + (open ? " open" : "") + "' data-i='" + i + "'>" +
        "<div class='head' draggable='true'>" +
          "<span class='grip'>⠿</span>" +
          "<span class='kind " + K.cls + "'>" + K.label + "</span>" +
          "<span class='sum'>" + summary(row) + "</span>" +
          "<span class='acts'>" +
            "<button data-act='dup'>複製</button><button data-act='del'>×</button>" +
          "</span>" +
        "</div>";
      if (open) {
        h += "<div class='body'>";
        for (var f = 0; f < K.fields.length; f++) h += fieldHtml(row, K.fields[f]);
        h += "</div>";
      }
      h += "</div>";
    }
    if (!rows.length) h = "<p class='note'>まだ何もありません。下から行を足してください。</p>";
    document.getElementById("list").innerHTML = h;
  }

  function render() { renderScenes(); renderHead(); renderRows(); }

  /* =====================================================================
     触ったとき
     ===================================================================== */
  document.getElementById("scenes").addEventListener("click", function (e) {
    var el = e.target.closest(".scene");
    if (!el) return;
    cur = +el.dataset.si;
    openIndex = -1;
    render();
  });

  document.getElementById("sceneHead").addEventListener("input", function (e) {
    if (e.target.id === "sName") { rename(cur, e.target.value.trim()); save(); renderScenes(); }
    if (e.target.id === "sExit") { scenes[cur].exit = e.target.value || undefined; save(); render(); }
  });

  document.getElementById("sAdd").addEventListener("click", function () {
    var n = 1;
    while (sceneNames().indexOf("scene" + n) > -1) n++;
    scenes.splice(cur + 1, 0, { name: "scene" + n, rows: [] });
    cur = cur + 1;
    openIndex = -1;
    save(); render();
  });

  document.getElementById("sDel").addEventListener("click", function () {
    var s = scenes[cur];
    if (s.isHead) { note("最初のシーンは消せません"); return; }
    var n = inbound(s.name);
    if (!confirm("シーン「" + s.name + "」を、中の " + s.rows.length + " 行ごと消します。" +
                 (n ? "\nこのシーンへ向かう道が " + n + "本あります。" : "") + "\nよろしいですか。")) return;
    scenes.splice(cur, 1);
    cur = Math.max(0, cur - 1);
    openIndex = -1;
    save(); render();
  });

  document.getElementById("list").addEventListener("click", function (e) {
    var rowEl = e.target.closest(".row");
    if (!rowEl) return;
    var i = +rowEl.dataset.i, rows = scenes[cur].rows;

    var oact = e.target.dataset.oact;
    if (oact === "add") { rows[i].options = (rows[i].options || []).concat([{ text: "", to: "", once: true }]); save(); render(); return; }
    if (oact === "del") { rows[i].options.splice(+e.target.closest(".opt").dataset.oi, 1); save(); render(); return; }

    var act = e.target.dataset.act || (e.target.closest(".head") ? "open" : "");
    if (act === "open") { openIndex = openIndex === i ? -1 : i; renderRows(); return; }
    if (act === "dup") { rows.splice(i + 1, 0, JSON.parse(JSON.stringify(rows[i]))); openIndex = i + 1; save(); renderRows(); return; }
    if (act === "del") { rows.splice(i, 1); openIndex = -1; save(); render(); return; }
  });

  document.getElementById("list").addEventListener("input", function (e) {
    var rowEl = e.target.closest(".row");
    if (!rowEl) return;
    var row = scenes[cur].rows[+rowEl.dataset.i];

    var of = e.target.dataset.of;
    if (of) {
      var oi = +e.target.closest(".opt").dataset.oi;
      row.options[oi][of] = of === "once" ? e.target.checked : e.target.value;
      if (of === "once" && !e.target.checked) delete row.options[oi].once;
      save(); rowEl.querySelector(".sum").innerHTML = summary(row); renderScenes(); return;
    }

    var f = e.target.dataset.f;
    if (!f) return;
    if (f === "ok") row.ok = e.target.value.split(/[、,]/).map(function (s) { return s.trim(); }).filter(Boolean);
    else row[f] = e.target.value;
    save();
    rowEl.querySelector(".sum").innerHTML = summary(row);
    if (f === "to" || f === "jump") renderScenes();
  });

  /* =====================================================================
     つまんで並べ替える（行も、シーンも）
     ===================================================================== */
  function dragSort(hostId, itemSel, indexAttr, handleSel, onDrop) {
    var host = document.getElementById(hostId), from = -1;

    function clearMarks() {
      [].forEach.call(host.querySelectorAll(itemSel), function (el) {
        el.classList.remove("dropBefore", "dropAfter", "dragging");
      });
    }

    host.addEventListener("dragstart", function (e) {
      var handle = handleSel ? e.target.closest(handleSel) : e.target.closest(itemSel);
      if (!handle) return;
      var item = e.target.closest(itemSel);
      from = +item.dataset[indexAttr];
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(from));
      setTimeout(function () { item.classList.add("dragging"); }, 0);
    });

    host.addEventListener("dragover", function (e) {
      if (from < 0) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var item = e.target.closest(itemSel);
      [].forEach.call(host.querySelectorAll(itemSel), function (el) {
        el.classList.remove("dropBefore", "dropAfter");
      });
      if (!item) return;
      var r = item.getBoundingClientRect();
      item.classList.add((e.clientY - r.top) > r.height / 2 ? "dropAfter" : "dropBefore");
    });

    host.addEventListener("drop", function (e) {
      if (from < 0) return;
      e.preventDefault();
      var item = e.target.closest(itemSel);
      if (item) {
        var to = +item.dataset[indexAttr];
        var r = item.getBoundingClientRect();
        if ((e.clientY - r.top) > r.height / 2) to++;
        clearMarks();
        onDrop(from, to);
      } else clearMarks();
      from = -1;
    });

    host.addEventListener("dragend", function () { clearMarks(); from = -1; });
  }

  dragSort("list", ".row", "i", ".head", function (from, to) {
    var rows = scenes[cur].rows;
    if (to > from) to--;
    if (to === from) return;
    var wasOpen = openIndex === from;
    rows.splice(to, 0, rows.splice(from, 1)[0]);
    openIndex = wasOpen ? to : -1;
    save(); renderRows();
  });

  dragSort("scenes", ".scene", "si", null, function (from, to) {
    if (scenes[from].isHead) return;                       // 最初のシーンは動かさない
    if (scenes[0].isHead && to === 0) to = 1;              // その前にも入れない
    if (to > from) to--;
    if (to === from) return;
    scenes.splice(to, 0, scenes.splice(from, 1)[0]);
    cur = to;
    openIndex = -1;
    save(); render();
  });

  document.getElementById("add").addEventListener("click", function () {
    scenes[cur].rows.push(blank(document.getElementById("kind").value));
    openIndex = scenes[cur].rows.length - 1;
    save(); render();
    window.scrollTo(0, document.body.scrollHeight);
  });

  document.getElementById("try").addEventListener("click", function () {
    save();
    var s = scenes[cur], q = "index.html?draft=1&v=" + Date.now();
    if (s && !s.isHead) q += "&from=" + encodeURIComponent(s.name);   // いま見ているシーンから
    window.open(q, "_blank");
  });

  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("編集中のものを捨てて、保存ずみの scenario.js に戻します。よろしいですか。")) return;
    localStorage.removeItem(DRAFT_KEY);
    localStorage.removeItem(KW_KEY);
    location.replace(location.pathname + "?fresh=1&v=" + Date.now());   // 古いものを持ち越さない
  });

  /* =====================================================================
     書き出し・保存
     ===================================================================== */
  var ORDER = ["label", "bg", "bgm", "show", "pos", "hide", "set", "if", "jump",
               "say", "text", "ask", "to", "last", "options", "input", "ok", "ng", "end"];

  function rowToJs(row) {
    var parts = [], hasOptions = false;
    for (var i = 0; i < ORDER.length; i++) {
      var k = ORDER[i];
      if (row[k] === undefined || row[k] === "") continue;
      if (k === "options") { hasOptions = true; continue; }
      parts.push((k === "if" ? '"if"' : k) + ": " + JSON.stringify(row[k]));
    }
    if (!hasOptions) return "  { " + parts.join(", ") + " },";
    var h = "  { " + parts.join(", ") + ", options: [\n";
    h += (row.options || []).map(function (o) {
      var op = [];
      ["text", "to", "once"].forEach(function (k) { if (o[k] !== undefined && o[k] !== "") op.push(k + ": " + JSON.stringify(o[k])); });
      return "    { " + op.join(", ") + " }";
    }).join(",\n");
    return h + "\n  ] },";
  }

  /* 中身が空のままの行は、ファイルには残さない */
  function meaningful(row) {
    var k = kindOf(row);
    if (k === "end") return true;
    if (k === "say" || k === "text") return !!(row.text && row.text.trim());
    return Object.keys(row).some(function (key) {
      var v = row[key];
      return v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);
    });
  }

  var skipped = 0;

  /* 印と印のあいだを、新しい中身に入れ替える */
  function replaceBlock(text, head, tail, body) {
    var a = text.indexOf(head), b = text.indexOf(tail);
    if (a < 0 || b < 0) return text;                 // 印が見つからないときは、そのまま
    return text.slice(0, a) + head + "\n" + body + "\n" + text.slice(b);
  }

  function keywordBody() {
    var words = kwWords();
    return "var KEYWORDS = [\n" +
      (words.length ? "  " + words.map(function (w) { return JSON.stringify(w); }).join(",\n  ") + "\n" : "") +
      "];\nvar KEY_COLOR = " + JSON.stringify(kwColor) + ";";
  }

  function buildFile() {
    skipped = 0;
    var body = "var SCRIPT = [\n";
    for (var i = 0; i < scenes.length; i++) {
      var s = scenes[i];
      var rows = s.rows.filter(function (r) {
        if (meaningful(r)) return true;
        skipped++;
        return false;
      });
      body += (i ? "\n" : "") + "  /* ---- " + (s.isHead ? "はじめ" : s.name) + " ---- */\n";
      if (!s.isHead) body += rowToJs({ label: s.name }) + "\n";
      body += rows.map(rowToJs).join("\n") + (rows.length ? "\n" : "");
      if (s.exit) body += rowToJs({ jump: s.exit }) + "\n";
    }
    body += "];";

    var out = srcText;
    out = replaceBlock(out,
      "/* === 言葉 ここから（editor.html が書き換えます。この印は消さないでください） === */",
      "/* === 言葉 ここまで === */", keywordBody());
    out = replaceBlock(out,
      "/* === 流れ ここから（editor.html が書き換えます。この印は消さないでください） === */",
      "/* === 流れ ここまで === */", body);
    return out;
  }

  /* =====================================================================
     覚えておきたい言葉
     ===================================================================== */
  var KW_KEY = "macho-draft-kw";
  var kwColor = "#ffa23a";

  function kwWords() {
    return document.getElementById("kwText").value
      .split("\n").map(function (w) { return w.trim(); }).filter(Boolean);
  }

  function kwSave() {
    try { localStorage.setItem(KW_KEY, JSON.stringify({ words: kwWords(), color: kwColor })); } catch (e) {}
    draftUsed = true;
    document.getElementById("kwColorText").textContent = kwWords().length + " 語 ／ " + kwColor;
    rebuildHilite();        // 色分けをその場で入れ替える
    renderRows();
    note("下書きを保存");
  }

  document.getElementById("kw").addEventListener("click", function () {
    var box = document.getElementById("kwBox");
    box.hidden = !box.hidden;
    if (!box.hidden) box.scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("kwText").addEventListener("input", kwSave);
  document.getElementById("kwColor").addEventListener("input", function (e) {
    kwColor = e.target.value;
    kwSave();
  });

  function kwBoot() {
    var words = window.KEYWORDS || [];
    kwColor = window.KEY_COLOR || "#ffa23a";
    try {
      var d = JSON.parse(localStorage.getItem(KW_KEY) || "null");
      if (d && d.words) { words = d.words; kwColor = d.color || kwColor; draftUsed = true; }
    } catch (e) {}
    document.getElementById("kwText").value = words.join("\n");
    document.getElementById("kwColor").value = kwColor;
    document.getElementById("kwColorText").textContent = words.length + " 語 ／ " + kwColor;
    rebuildHilite();
  }

  document.getElementById("export").addEventListener("click", function () {
    var box = document.getElementById("outBox");
    box.hidden = false;
    document.getElementById("outText").value = buildFile();
    box.scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("dl").addEventListener("click", function () {
    var blob = new Blob([document.getElementById("outText").value], { type: "text/javascript" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "scenario.js";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  document.getElementById("copy").addEventListener("click", function () {
    document.getElementById("outText").select();
    document.execCommand("copy");
    note("コピーしました");
  });

  /* scenario.js をその場で書き換える */
  var fileHandle = null;

  function withStore(mode, fn) {
    return new Promise(function (res, rej) {
      var req = indexedDB.open("macho-editor", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("kv"); };
      req.onerror = function () { rej(req.error); };
      req.onsuccess = function () {
        var db = req.result, tx = db.transaction("kv", mode), out = fn(tx.objectStore("kv"));
        tx.oncomplete = function () { db.close(); res(out ? out.result : null); };
        tx.onerror = function () { rej(tx.error); };
      };
    });
  }

  async function ensureSrc() {
    if (!srcText) srcText = await (await fetch("scenario.js?v=" + Date.now())).text();
  }

  async function allowed(h) {
    var opt = { mode: "readwrite" };
    if ((await h.queryPermission(opt)) === "granted") return true;
    return (await h.requestPermission(opt)) === "granted";
  }

  /* 保存の番人（save-server.js）が動いていれば、押した瞬間にファイルが変わる */
  var SAVE_PORT = 8736, serverOk = false;

  function pingServer() {
    return fetch("http://localhost:" + SAVE_PORT + "/ping", { cache: "no-store" })
      .then(function (r) { return r.ok; }).catch(function () { return false; });
  }

  function showServerState() {
    var el = document.getElementById("srv");
    el.textContent = serverOk ? "● すぐ保存できます" : "○ 保存サーバー停止中";
    el.style.color = serverOk ? "#97dba9" : "#8fa1b8";
    el.style.fontSize = "13px";
    el.title = serverOk
      ? "「保存」を押すと scenario.js がその場で書き換わります"
      : "games/macho で node save-server.js を立ち上げると、押すだけで保存できます";
  }

  function saved(text) {
    srcText = text;
    localStorage.removeItem(DRAFT_KEY);       // ファイルと同じになったので、下書きは片付ける
    localStorage.removeItem(KW_KEY);
    draftUsed = false;
    stale = false;
    note("scenario.js に保存しました" + (skipped ? "（空のままの行 " + skipped + " つは入れていません）" : ""));
  }

  document.getElementById("save").addEventListener("click", async function () {
    try {
      await ensureSrc();
      var text = buildFile();

      if (!serverOk) serverOk = await pingServer();
      showServerState();

      /* ほかの窓で書き換えられていないか、直前に見に行く */
      var now = await (await fetch("scenario.js?v=" + Date.now(), { cache: "no-store" })).text();
      if (now !== srcText) {
        if (!confirm("scenario.js が、ここで開いたあとに書き換えられています。\n" +
                     "（別の窓や別のブラウザで保存したかもしれません）\n\n" +
                     "このまま上書きすると、そちらの変更は消えます。続けますか。")) {
          note("保存をやめました。「保存ずみの内容に戻す」で読み直せます");
          return;
        }
        srcText = now;
        text = buildFile();
      }

      if (serverOk) {                                   // ① 番人に書いてもらう（ダイアログなし）
        var r = await fetch("http://localhost:" + SAVE_PORT + "/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file: "scenario.js", text: text })
        });
        var out = await r.json();
        if (!out.ok) throw new Error(out.error);
        saved(text);
        return;
      }

      if (!window.showOpenFilePicker) {                  // ② ブラウザの機能で直に書く
        note("保存サーバーが止まっています。node save-server.js を立ち上げてください");
        return;
      }
      if (!fileHandle) fileHandle = await withStore("readonly", function (s) { return s.get("file"); });
      if (!fileHandle) {
        note("保存先の scenario.js を選んでください（最初の一度だけ）");
        var picked = await window.showOpenFilePicker({ multiple: false });
        fileHandle = picked[0];
        await withStore("readwrite", function (s) { s.put(fileHandle, "file"); });
      }
      if (!(await allowed(fileHandle))) { note("保存の許しが要ります"); return; }
      var w = await fileHandle.createWritable();
      await w.write(text);
      await w.close();
      saved(text);
    } catch (e) {
      note(e && e.name === "AbortError" ? "保存をやめました" : "保存できませんでした（" + (e && e.message) + "）");
    }
  });

  /* =====================================================================
     下書き
     ===================================================================== */
  var draftUsed = false, stale = false, noteTimer;

  function statusText() {
    if (stale) return "⚠ ファイルの中身と、この下書きが違います";
    return draftUsed ? "下書きあり（保存すると scenario.js に入ります）" : "";
  }

  function save() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(toList()));
      draftUsed = true;
      note("下書きを保存");
    } catch (e) {}
  }

  function note(s) {
    var el = document.getElementById("status");
    el.textContent = s;
    el.style.color = "#93a4bb";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      el.textContent = statusText();
      el.style.color = stale ? "#ffc477" : "#93a4bb";
    }, 1600);
  }

  async function boot() {
    document.getElementById("kind").innerHTML = Object.keys(KINDS).map(function (k) {
      return "<option value='" + k + "'>" + KINDS[k].label + "</option>";
    }).join("");

    /* ?fresh=1 を付けて開くと、下書きを捨ててファイルの中身だけを読みます */
    if (location.search.indexOf("fresh=1") > -1) {
      try { localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(KW_KEY); } catch (e) {}
    }

    /* 置いてあるファイルを、そのつど読み直す（ブラウザに古いものが残っていても大丈夫なように） */
    var fileScript = window.SCRIPT || [];
    try {
      srcText = await (await fetch("scenario.js?v=" + Date.now(), { cache: "no-store" })).text();
      var box = {};
      new Function("g", srcText + "\ng.SCRIPT = SCRIPT; g.CHARA = CHARA; g.BG = BG; g.KEYWORDS = KEYWORDS; g.KEY_COLOR = KEY_COLOR;")(box);
      if (box.SCRIPT && box.SCRIPT.length) {
        fileScript = box.SCRIPT;
        window.SCRIPT = box.SCRIPT;
        window.CHARA = box.CHARA;
        window.BG = box.BG;
        window.KEYWORDS = box.KEYWORDS;
        window.KEY_COLOR = box.KEY_COLOR;
      }
    } catch (e) {}

    var listIn = null;
    try {
      var d = localStorage.getItem(DRAFT_KEY);
      if (d) { listIn = JSON.parse(d); draftUsed = true; }
    } catch (e) {}
    if (!listIn || !listIn.length) listIn = JSON.parse(JSON.stringify(fileScript));

    /* 下書きと、いまのファイルが食い違っていたら知らせる */
    if (draftUsed && JSON.stringify(listIn) !== JSON.stringify(window.SCRIPT || [])) {
      stale = true;
    }

    scenes = toScenes(listIn);
    kwBoot();
    document.getElementById("status").textContent = statusText();
    render();

    pingServer().then(function (ok) { serverOk = ok; showServerState(); });
  }

  boot();
})();
</script>
</body>
</html>
