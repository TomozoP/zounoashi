<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <!-- 大広間。聞き取りの場。立ち絵は中央、下 700px から先はテキスト窓が重なります -->
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3446"/>
      <stop offset=".5" stop-color="#332c3d"/>
      <stop offset="1" stop-color="#272130"/>
    </linearGradient>
    <linearGradient id="hallFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3140"/>
      <stop offset="1" stop-color="#191420"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f3648"/>
      <stop offset=".45" stop-color="#584c63"/>
      <stop offset="1" stop-color="#332c3c"/>
    </linearGradient>
    <linearGradient id="doorWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a3428"/>
      <stop offset=".5" stop-color="#5d4232"/>
      <stop offset="1" stop-color="#402c22"/>
    </linearGradient>
    <radialGradient id="chandelier" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig3" cx=".5" cy=".45" r=".72">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".52"/>
    </radialGradient>
  </defs>

  <rect width="540" height="960" fill="url(#hall)"/>

  <!-- 天井の梁 -->
  <g fill="#241e2c" opacity=".8">
    <rect y="0" width="540" height="26"/>
    <rect x="0" y="64" width="540" height="8" opacity=".5"/>
  </g>

  <!-- シャンデリア -->
  <g>
    <circle cx="270" cy="150" r="130" fill="url(#chandelier)"/>
    <rect x="266" y="26" width="8" height="56" fill="#3a3040"/>
    <path d="M214 96 h112 l-14 26 h-84 z" fill="#8c6b34"/>
    <path d="M226 122 h88 l-10 20 h-68 z" fill="#a5813f"/>
    <g fill="#ffdda4">
      <circle cx="232" cy="150" r="7"/>
      <circle cx="256" cy="158" r="7"/>
      <circle cx="284" cy="158" r="7"/>
      <circle cx="308" cy="150" r="7"/>
      <circle cx="270" cy="166" r="8"/>
    </g>
  </g>

  <!-- 左右の柱 -->
  <g>
    <rect x="4" y="120" width="52" height="530" fill="url(#pillar)"/>
    <rect x="-4" y="106" width="68" height="18" fill="#4b4155"/>
    <rect x="-4" y="640" width="68" height="18" fill="#4b4155"/>
    <rect x="484" y="120" width="52" height="530" fill="url(#pillar)"/>
    <rect x="476" y="106" width="68" height="18" fill="#4b4155"/>
    <rect x="476" y="640" width="68" height="18" fill="#4b4155"/>
  </g>

  <!-- 奥の大扉（書斎へ続く。2トンある） -->
  <g>
    <rect x="146" y="150" width="248" height="500" fill="#241b22"/>
    <rect x="158" y="164" width="224" height="486" fill="url(#doorWood)"/>
    <g fill="none" stroke="#2e2019" stroke-width="5">
      <rect x="176" y="188" width="80" height="190"/>
      <rect x="286" y="188" width="80" height="190"/>
      <rect x="176" y="404" width="80" height="222"/>
      <rect x="286" y="404" width="80" height="222"/>
    </g>
    <rect x="266" y="164" width="10" height="486" fill="#2e2019"/>
    <!-- 太い金具と、大きな取っ手 -->
    <g fill="#8a6f34">
      <rect x="158" y="286" width="224" height="12" opacity=".8"/>
      <rect x="158" y="470" width="224" height="12" opacity=".8"/>
    </g>
    <circle cx="248" cy="418" r="12" fill="#c9a44f"/>
    <circle cx="294" cy="418" r="12" fill="#c9a44f"/>
    <rect x="146" y="138" width="248" height="16" fill="#4b4155"/>
    <path d="M146 138 L270 104 L394 138 Z" fill="#3d3446"/>
  </g>

  <!-- 壁の肖像画（左が屋敷の主） -->
  <g>
    <rect x="64" y="268" width="66" height="88" fill="#6a5330"/>
    <rect x="71" y="275" width="52" height="74" fill="#2b2537"/>
    <g fill="#e8c9a8">
      <circle cx="97" cy="300" r="12"/>
      <path d="M84 349 q13 -28 26 0 z"/>
    </g>
    <rect x="410" y="268" width="66" height="88" fill="#6a5330"/>
    <rect x="417" y="275" width="52" height="74" fill="#2b2537"/>
    <g fill="#4a5c78" opacity=".7">
      <rect x="429" y="296" width="28" height="42"/>
    </g>
  </g>

  <!-- 床（市松） -->
  <rect y="650" width="540" height="310" fill="url(#hallFloor)"/>
  <rect y="646" width="540" height="6" fill="#120e18" opacity=".6"/>
  <g opacity=".16" fill="#fff">
    <rect x="0" y="654" width="66" height="22"/>
    <rect x="132" y="654" width="66" height="22"/>
    <rect x="264" y="654" width="66" height="22"/>
    <rect x="396" y="654" width="66" height="22"/>
    <rect x="66" y="676" width="76" height="26"/>
    <rect x="218" y="676" width="76" height="26"/>
    <rect x="370" y="676" width="76" height="26"/>
  </g>

  <!-- 赤い絨毯 -->
  <path d="M212 650 L328 650 L390 960 L150 960 Z" fill="#5a2430" opacity=".75"/>
  <path d="M224 650 L316 650 L372 960 L168 960 Z" fill="none" stroke="#8a4050" stroke-width="3" opacity=".6"/>

  <rect width="540" height="960" fill="url(#vig3)"/>
</svg>
