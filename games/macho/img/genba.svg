<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <!-- 現場（夜の書斎）。立ち絵は中央、下 700px から先はテキスト窓が重なります -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40354a"/>
      <stop offset=".55" stop-color="#2e2637"/>
      <stop offset="1" stop-color="#221b29"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2028"/>
      <stop offset="1" stop-color="#140f16"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfe2ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#cfe2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc478" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffc478" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".72">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e1620"/>
      <stop offset="1" stop-color="#38101a"/>
    </linearGradient>
  </defs>

  <!-- 壁と床 -->
  <rect width="540" height="960" fill="url(#wall)"/>
  <rect y="648" width="540" height="312" fill="url(#floor)"/>
  <rect y="644" width="540" height="6" fill="#0e0a12" opacity=".6"/>

  <!-- 床板 -->
  <g stroke="#0f0b13" stroke-width="2" opacity=".45">
    <path d="M60 960 L120 650"/>
    <path d="M190 960 L215 650"/>
    <path d="M330 960 L322 650"/>
    <path d="M470 960 L420 650"/>
  </g>

  <!-- 本棚（左） -->
  <g>
    <rect x="8" y="196" width="168" height="452" fill="#241a20"/>
    <rect x="8" y="196" width="168" height="452" fill="none" stroke="#150f14" stroke-width="6"/>
    <g fill="#1a1218">
      <rect x="16" y="300" width="152" height="10"/>
      <rect x="16" y="410" width="152" height="10"/>
      <rect x="16" y="520" width="152" height="10"/>
      <rect x="16" y="630" width="152" height="10"/>
    </g>
    <!-- 本 -->
    <g opacity=".85">
      <rect x="22" y="232" width="14" height="68" fill="#6b3b3b"/>
      <rect x="38" y="240" width="11" height="60" fill="#3f5570"/>
      <rect x="51" y="228" width="16" height="72" fill="#7a6134"/>
      <rect x="69" y="244" width="10" height="56" fill="#4c3a5e"/>
      <rect x="81" y="234" width="15" height="66" fill="#5a3030"/>
      <rect x="99" y="248" width="12" height="52" fill="#3d5647"/>
      <rect x="113" y="230" width="14" height="70" fill="#6a5a3a"/>

      <rect x="22" y="346" width="13" height="64" fill="#44506b"/>
      <rect x="37" y="338" width="16" height="72" fill="#6b3b3b"/>
      <rect x="55" y="352" width="11" height="58" fill="#7a6134"/>
      <rect x="68" y="342" width="14" height="68" fill="#3d4f42"/>
      <rect x="84" y="356" width="12" height="54" fill="#553a5c"/>

      <rect x="26" y="452" width="15" height="68" fill="#5a3030"/>
      <rect x="43" y="462" width="12" height="58" fill="#43536e"/>
      <rect x="57" y="448" width="14" height="72" fill="#6a5a3a"/>
      <rect x="120" y="470" width="40" height="50" fill="#2f2330"/>
    </g>
  </g>

  <!-- 窓（右）と月あかり -->
  <g>
    <rect x="330" y="150" width="186" height="300" fill="#191320"/>
    <rect x="342" y="162" width="162" height="276" fill="url(#night)"/>
    <circle cx="452" cy="232" r="90" fill="url(#moonGlow)"/>
    <circle cx="452" cy="232" r="26" fill="#e8eeff" opacity=".9"/>
    <g fill="#fff" opacity=".55">
      <circle cx="372" cy="204" r="2"/>
      <circle cx="398" cy="262" r="1.6"/>
      <circle cx="486" cy="188" r="1.8"/>
      <circle cx="366" cy="330" r="1.5"/>
      <circle cx="424" cy="352" r="2"/>
    </g>
    <g fill="#191320">
      <rect x="418" y="162" width="10" height="276"/>
      <rect x="342" y="288" width="162" height="10"/>
    </g>
    <rect x="330" y="150" width="186" height="300" fill="none" stroke="#120d18" stroke-width="10"/>
    <!-- 窓から落ちる光 -->
    <path d="M342 438 L504 438 L540 700 L392 700 Z" fill="#cfe2ff" opacity=".05"/>
  </g>

  <!-- 奥の机とランプ -->
  <g>
    <rect x="196" y="556" width="150" height="14" fill="#3a2a2a"/>
    <rect x="204" y="570" width="12" height="78" fill="#2b1f20"/>
    <rect x="326" y="570" width="12" height="78" fill="#2b1f20"/>
    <circle cx="300" cy="520" r="86" fill="url(#lamp)"/>
    <path d="M282 512 h36 l10 44 h-56 z" fill="#c9903f" opacity=".85"/>
    <rect x="296" y="556" width="8" height="14" fill="#3a2a2a"/>
  </g>

  <!-- 床の血だまりと、転がった鉄アレイ -->
  <g transform="translate(104 664)">
    <ellipse cx="0" cy="0" rx="66" ry="15" fill="url(#blood)" opacity=".92"/>
    <ellipse cx="44" cy="7" rx="16" ry="5" fill="#4a1119" opacity=".8"/>
    <g fill="#20222a">
      <rect x="-36" y="-12" width="14" height="26" rx="3"/>
      <rect x="22" y="-12" width="14" height="26" rx="3"/>
      <rect x="-24" y="-5" width="46" height="11" rx="5"/>
    </g>
    <g fill="#2b2e38">
      <rect x="-34" y="-10" width="5" height="22" rx="2"/>
      <rect x="28" y="-10" width="5" height="22" rx="2"/>
    </g>
  </g>

  <rect width="540" height="960" fill="url(#vignette)"/>
</svg>
