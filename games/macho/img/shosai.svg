<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <!-- 書斎（事件の前・落ち着いた側）。現場と同じ部屋の、明かりが灯っている状態 -->
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38445e"/>
      <stop offset=".55" stop-color="#2a3348"/>
      <stop offset="1" stop-color="#1e2534"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2a30"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4770"/>
      <stop offset="1" stop-color="#16223a"/>
    </linearGradient>
    <radialGradient id="lamp2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd39a" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ffd39a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette2" cx=".5" cy=".45" r=".72">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".48"/>
    </radialGradient>
  </defs>

  <rect width="540" height="960" fill="url(#wall2)"/>
  <rect y="648" width="540" height="312" fill="url(#floor2)"/>
  <rect y="644" width="540" height="6" fill="#101018" opacity=".6"/>

  <g stroke="#101018" stroke-width="2" opacity=".4">
    <path d="M60 960 L120 650"/>
    <path d="M190 960 L215 650"/>
    <path d="M330 960 L322 650"/>
    <path d="M470 960 L420 650"/>
  </g>

  <!-- 絨毯 -->
  <g opacity=".55">
    <ellipse cx="270" cy="800" rx="230" ry="86" fill="#4a3040"/>
    <ellipse cx="270" cy="800" rx="196" ry="70" fill="none" stroke="#6b4457" stroke-width="4"/>
  </g>

  <!-- 本棚（左） -->
  <g>
    <rect x="8" y="196" width="168" height="452" fill="#2a2431"/>
    <rect x="8" y="196" width="168" height="452" fill="none" stroke="#181420" stroke-width="6"/>
    <g fill="#1e1a26">
      <rect x="16" y="300" width="152" height="10"/>
      <rect x="16" y="410" width="152" height="10"/>
      <rect x="16" y="520" width="152" height="10"/>
      <rect x="16" y="630" width="152" height="10"/>
    </g>
    <g opacity=".9">
      <rect x="22" y="232" width="14" height="68" fill="#7d4747"/>
      <rect x="38" y="240" width="11" height="60" fill="#4a6484"/>
      <rect x="51" y="228" width="16" height="72" fill="#8d7040"/>
      <rect x="69" y="244" width="10" height="56" fill="#59446e"/>
      <rect x="81" y="234" width="15" height="66" fill="#6a3a3a"/>
      <rect x="99" y="248" width="12" height="52" fill="#476552"/>
      <rect x="113" y="230" width="14" height="70" fill="#7b6944"/>

      <rect x="22" y="346" width="13" height="64" fill="#4f5f7d"/>
      <rect x="37" y="338" width="16" height="72" fill="#7d4747"/>
      <rect x="55" y="352" width="11" height="58" fill="#8d7040"/>
      <rect x="68" y="342" width="14" height="68" fill="#475d4d"/>
      <rect x="84" y="356" width="12" height="54" fill="#63456c"/>

      <rect x="26" y="452" width="15" height="68" fill="#6a3a3a"/>
      <rect x="43" y="462" width="12" height="58" fill="#4e6180"/>
      <rect x="57" y="448" width="14" height="72" fill="#7b6944"/>
      <rect x="120" y="470" width="40" height="50" fill="#382b3a"/>
    </g>
  </g>

  <!-- 窓（右）・夕暮れ -->
  <g>
    <rect x="330" y="150" width="186" height="300" fill="#1d1826"/>
    <rect x="342" y="162" width="162" height="276" fill="url(#dusk)"/>
    <g fill="#1d1826">
      <rect x="418" y="162" width="10" height="276"/>
      <rect x="342" y="288" width="162" height="10"/>
    </g>
    <rect x="330" y="150" width="186" height="300" fill="none" stroke="#161220" stroke-width="10"/>
  </g>

  <!-- 机とランプ（灯っている） -->
  <g>
    <circle cx="300" cy="520" r="120" fill="url(#lamp2)"/>
    <rect x="196" y="556" width="150" height="14" fill="#4a3634"/>
    <rect x="204" y="570" width="12" height="78" fill="#352725"/>
    <rect x="326" y="570" width="12" height="78" fill="#352725"/>
    <path d="M280 500 h40 l12 52 h-64 z" fill="#e0ab55"/>
    <rect x="296" y="552" width="8" height="18" fill="#4a3634"/>
    <!-- 机の上の本 -->
    <g>
      <rect x="216" y="540" width="46" height="8" fill="#7d4747"/>
      <rect x="220" y="532" width="42" height="8" fill="#4a6484"/>
    </g>
  </g>

  <rect width="540" height="960" fill="url(#vignette2)"/>
</svg>
