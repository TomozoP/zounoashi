<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>メガネウォーク</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>
<script>
/* メガネウォーク

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false;

  function place() {}

  /* ============ メガネの歩き ============
     立っているつる（脚）は、足先を支点に倒れる振り子（倒立振子）。重力で前後へ倒れる。
     押す：後ろのつるで地面を蹴り（前への勢い）、そのつるを浮かせて前へ振る（体を左右に揺らして浮かせる）。
     離す：振ったつるを下ろす。蝶番（腰）が前へ進んで足先が地面に届いた瞬間に着き、立つ脚が替わる。
     着いた衝撃で勢いは減る（歩幅が大きいほど減る）。前か後ろへ倒れきると、枠が机に当たってレンズが割れる。
     大きさは本物の10倍（つる14cm → 1.4）で計算する。進んだ距離は本物の cm で数える。 */
  var L = 1.4, G = 9.8;
  var P = { kick: 1.5, rate: 3.5, max: 0.55, limF: 1.0, limB: -0.95, hingeY: 0.17, frameD: 0.3 };
  var wk;
  function newWalker() {
    var a = 0.22;
    return {
      footX: L * Math.sin(a), th: -a, thd: 0, phi: -a, dragX: -L * Math.sin(a),
      lifted: false, started: false, fall: 0, broken: false, steps: 0,
      stance: 0,                     /* 立っているのはどちらのつるか（0: 奥 1: 手前） */
      beta: 0, betad: 0, hx: 0, hvx: 0, roll: 0, brokeT: 0
    };
  }
  function hipOf(w) { return [w.footX + L * Math.sin(w.th), L * Math.cos(w.th)]; }
  function pressStep() {
    var w = wk;
    if (w.fall || w.broken) return;
    w.lifted = true; w.air = true; w.started = true;
    w.thd = Math.max(w.thd, P.kick) + 0.1;    /* 後ろの足で蹴る（遅いときほど強く） */
    noiseHit(0.05, 900, 0.08, 1.2);
  }
  function releaseStep() { wk.lifted = false; }
  function walkStep(dt) {
    var w = wk;
    if (!w.started || w.broken) return;
    var h0 = hipOf(w);
    w.thd += (G / L) * Math.sin(w.th) * dt;
    w.th += w.thd * dt;
    var h = hipOf(w);
    if (w.lifted && !w.fall) {
      w.phi += Math.max(-P.rate * dt, Math.min(P.rate * dt, P.max - w.phi));
    } else if (!w.fall) {
      if (w.thd > 0 && w.phi > 0 && w.phi <= w.th) {
        /* 着く：振ったつるが立つ脚になり、今までの脚は後ろに残る */
        var nf = h[0] + L * Math.sin(w.phi), a = w.th;
        w.dragX = w.footX; w.footX = nf;
        w.thd *= Math.pow(Math.max(0, Math.cos(w.th + w.phi)), 0.3);
        w.th = -Math.asin(Math.max(-1, Math.min(1, (nf - h[0]) / L)));
        w.phi = -a; w.steps++; w.stance = 1 - w.stance; w.air = false;
        tone(1900, 0.04, 0.08, "triangle"); noiseHit(0.04, 3200, 0.1, 2);
      } else if (w.air) {
        /* 振ったつるは下ろしたまま、足先が机に届くのを待つ */
      } else if (w.thd < 0 && w.phi < 0 && w.th <= w.phi) {
        /* 後ろへ揺り戻した：後ろの足が受け止める */
        var of = w.footX; w.footX = w.dragX; w.dragX = of;
        w.thd *= Math.pow(Math.max(0, Math.cos(w.th + w.phi)), 0.3);
        w.th = Math.asin(Math.max(-1, Math.min(1, (h[0] - w.footX) / L)));
        w.phi = Math.asin(Math.max(-1, Math.min(1, (w.dragX - h[0]) / L)));
        w.stance = 1 - w.stance;
        tone(1500, 0.03, 0.05, "triangle");
      } else {
        /* 後ろに残った脚は、足先を机に着けたまま引きずられる */
        var d = Math.sqrt(Math.max(0, L * L - h[1] * h[1]));
        if (h[0] - w.dragX > d) w.dragX = h[0] - d;
        if (w.dragX - h[0] > d) w.dragX = h[0] + d;
        w.phi = Math.asin(Math.max(-1, Math.min(1, (w.dragX - h[0]) / L)));
      }
    }
    if (!w.fall && (w.th > P.limF || w.th < P.limB)) w.fall = w.th > 0 ? 1 : -1;
    /* 枠は蝶番から下がる振り子。腰の動きに振られる */
    var vx = (h[0] - h0[0]) / dt, ax = Math.max(-40, Math.min(40, (vx - w.hvx) / dt));
    w.hvx = vx;
    w.betad += (-(G / P.frameD) * Math.sin(w.beta) - (ax / P.frameD) * Math.cos(w.beta) - 4 * w.betad) * dt;
    w.beta += w.betad * dt;
    /* 浮かせた足が机より下になる分だけ、体を横へ傾けて浮かせる（見た目） */
    var fy = h[1] - L * Math.cos(w.phi);
    var need = w.lifted || (w.phi > w.th) ? Math.max(0, 0.06 - fy) : 0;
    w.roll += (Math.atan2(need, 1.4) - w.roll) * Math.min(1, 12 * dt);
    /* 枠の下が机に着いたら割れる */
    var bottom = h[1] - P.hingeY - 0.24 - 0.06;
    if (h[1] < 0.5 || bottom < 0) breakGlass();
  }
  var shards = [];
  function breakGlass() {
    var w = wk;
    if (w.broken) return;
    w.broken = true; w.brokeT = T; held = false;
    noiseHit(0.5, 4200, 0.5, 0.8); noiseHit(0.25, 2200, 0.35, 1.5);
    tone(3100, 0.35, 0.06, "sine", 2400); tone(4400, 0.25, 0.05, "sine", 3600, 0.03);
    var h = hipOf(w);
    shards = [];
    for (var i = 0; i < 26; i++) {
      shards.push({ x: h[0] + 0.15, y: Math.max(0.1, h[1] - 0.4), z: (Math.random() - 0.5) * 1.2,
        vx: (Math.random() - 0.3) * 2.5, vy: 1 + Math.random() * 2.5, vz: (Math.random() - 0.5) * 3,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 20, s: 0.04 + Math.random() * 0.07 });
    }
  }
  function moveShards(dt) {
    for (var i = 0; i < shards.length; i++) {
      var p = shards[i];
      if (p.y <= 0.01 && p.vy <= 0) { p.vx *= 0.9; p.vz *= 0.9; p.vr *= 0.9; }
      else p.vy -= G * dt;
      p.x += p.vx * dt; p.y = Math.max(0.01, p.y + p.vy * dt); p.z += p.vz * dt; p.r += p.vr * dt;
      if (p.y <= 0.01 && p.vy < 0) p.vy = -p.vy * 0.25;
    }
  }
  function distanceCm() { return Math.max(0, hipOf(wk)[0]) * 10; }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden=true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    wk = newWalker(); shards = [];
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;

    var n = 4;
    for (var i = 0; i < n; i++) walkStep(dt / n);
    moveShards(dt);
    if (wk.broken && T - wk.brokeT > 1.6) {
      state = S.RESULT;
      score = Math.round(distanceCm() * 10) / 10;
    }
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    held = true;
    pressStep();
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    releaseStep();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY) return;
    if (n === 1) { wk.started = true; wk.thd = 2.5; wk.lifted = true; }   /* 前へ倒れる */
    if (n === 2) { wk.footX += 100; wk.dragX += 100; }                     /* 10m先へ */
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      /* ▼UPDATE: 左右キー（選ぶものがあるとき。目印は keyMode のときだけ出す） */
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function scoreText() { return score.toFixed(1) + "cm"; }
  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    /* 英語のときのハッシュタグは英語のゲーム名にする（空白・記号は除く） */
    window.zResultActions.x({ text: zT("メガネが" + scoreText() + "歩いて、レンズが割れた", "My glasses walked " + scoreText() + " and the lens shattered") + zT(" #メガネウォーク", " #GlassesWalk") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* 立体へ渡す形：腰（蝶番）・2本のつるの角度・枠の振れ・横の傾き・破片 */
  function viewState() {
    var w = wk, h = hipOf(w);
    var stA = w.th, swA = w.phi;            /* 脚の角度（真下から前が正） */
    var stanceAngle = Math.atan2(h[0] - w.footX, h[1]);
    return {
      t: T || 0, state: state, hip: h, beta: w.beta, roll: w.roll * (w.stance ? 1 : -1),
      legs: w.stance === 0 ? [-stanceAngle, swA] : [swA, -stanceAngle],
      broken: w.broken, shards: shards, intro: state === S.INTRO
    };
  }

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(); }) : function () { return null; };

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);

    /* ▼DRAW: ここに絵。立体の上に、文字やボタンを2Dで描く */
    var s3 = scene3d(), drew = false;
    if (s3) { try { s3.sync(viewState()); drew = s3.draw(ctx, W, H); } catch (e) { scene3d.drop(); } }
    if (!drew) { ctx.fillStyle = "#1d1714"; ctx.fillRect(0, 0, W, H); }

    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(scoreText(), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { var h = hipOf(wk); return { state: state, score: score, W: W, H: H, x: h[0], y: h[1], th: wk.th, phi: wk.phi, steps: wk.steps, broken: wk.broken, fall: wk.fall }; },
    press: function () { down(); }, release: function () { up(); },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 30)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
