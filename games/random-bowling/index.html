  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
</style>
<!-- ゲームのOGP：道具で更新 -->

<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
</div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/cannon.js"></script>
<script src="physics.js"></script>
<script src="scene.js"></script>
<script src="../share.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* STRONG BOWL。奥行きのある座標で動かし、透視投影して描く。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var view3d=window.WebGLRenderingContext?new ZWrestleScene():null;
  var world=new ZWrestlePhysics.Game();
  var frameDt=1/60;

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if(view3d)view3d.resize(canvas.width,canvas.height);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, MASTER = null;
  // 初回の操作でも再開し、スマホの中断状態からも復帰する。
  function resumeAudio() {
    if (!AC || AC.state === "running" || AC.state === "closed") return;
    try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    // 全音をまとめて増幅し、重なった大きな音だけ抑える。
    MASTER=AC.createGain();MASTER.gain.value=2.5;
    var limiter=AC.createDynamicsCompressor();limiter.threshold.value=-6;limiter.knee.value=4;limiter.ratio.value=12;limiter.attack.value=.003;limiter.release.value=.12;
    MASTER.connect(limiter);limiter.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(MASTER);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, attack, to, pan, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    if(to)f.frequency.exponentialRampToValueAtTime(to,n+dur);
    g.gain.setValueAtTime(attack?0.0001:vol,n);if(attack)g.gain.exponentialRampToValueAtTime(vol,n+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g);
    if(AC.createStereoPanner){var p=AC.createStereoPanner();p.pan.value=pan||0;g.connect(p);p.connect(MASTER);}else g.connect(MASTER);
    s.start(n,Math.random()); s.stop(n + dur + 0.05);
  }
  // 風が近づいて抜ける音。速さに応じて短く、明るくする。
  function clapInterval(speed){return .8-.55*Math.max(0,Math.min(1,(speed-1.8)/15.14));}
  function crowdClap(volume,pan){
    noiseHit(.065,1400+Math.random()*700,volume,.65,0,850,pan);
    noiseHit(.045,2400,volume*.55,.5,0,1200,pan,.012+Math.random()*.012);
  }
  var crowdBus=null;
  function crowdOutput(){
    if(crowdBus)return crowdBus;
    // 観客席の短い反射音を共有し、遠近のある一団にまとめる。
    crowdBus=AC.createGain();var dry=AC.createGain(),wet=AC.createGain(),room=AC.createConvolver(),filter=AC.createBiquadFilter(),limit=AC.createDynamicsCompressor();
    var length=Math.floor(AC.sampleRate*.24),impulse=AC.createBuffer(2,length,AC.sampleRate);
    for(var ch=0;ch<2;ch++){var data=impulse.getChannelData(ch);for(var n=0;n<length;n++){var t=n/AC.sampleRate;data[n]=t<.022?0:(Math.random()*2-1)*Math.exp(-t*24)*.35;}}
    room.buffer=impulse;dry.gain.value=.8;wet.gain.value=.28;filter.type='lowpass';filter.frequency.value=3800;
    limit.threshold.value=-19;limit.knee.value=12;limit.ratio.value=3;limit.attack.value=.008;limit.release.value=.15;
    crowdBus.connect(dry);dry.connect(limit);crowdBus.connect(room);room.connect(filter);filter.connect(wet);wet.connect(limit);var voiceVolume=AC.createGain();voiceVolume.gain.value=3.2;limit.connect(voiceVolume);voiceVolume.connect(MASTER);return crowdBus;
  }
  // 声の高さと発声を少しずらし、「ハ」から「イ」へ響きを移す。
  function crowdChant(speed){
    if(!AC)return;
    var duration=Math.min(.28,clapInterval(speed)*.8);
    for(var i=0;i<20;i++){
      var start=AC.currentTime+Math.random()*.09,pitch=85+(i%7)*27+Math.random()*24,pan=(i/19*2-1)*.9,timbre=.78+Math.random()*.44,volume=.0035+Math.random()*.0035;
      var voice=AC.createOscillator(),envelope=AC.createGain();voice.type=i%4===0?'triangle':'sawtooth';voice.detune.setValueAtTime(Math.random()*32-16,start);voice.detune.linearRampToValueAtTime(Math.random()*38-19,start+duration*.6);
      voice.frequency.setValueAtTime(pitch,start);voice.frequency.linearRampToValueAtTime(pitch*1.1,start+.05);voice.frequency.exponentialRampToValueAtTime(pitch*.9,start+duration);
      envelope.gain.setValueAtTime(.0001,start);envelope.gain.exponentialRampToValueAtTime(volume,start+.035);envelope.gain.setValueAtTime(volume,start+duration*.55);envelope.gain.exponentialRampToValueAtTime(.0001,start+duration);
      [[780,330,5,1],[1200,2250,7,.65],[2700,2950,9,.22]].forEach(function(v){
        var filter=AC.createBiquadFilter(),level=AC.createGain();filter.type='bandpass';filter.Q.value=v[2];filter.frequency.setValueAtTime(v[0]*timbre,start);filter.frequency.setValueAtTime(v[0]*timbre,start+duration*.35);filter.frequency.exponentialRampToValueAtTime(v[1]*timbre,start+duration*.85);level.gain.value=v[3];voice.connect(filter);filter.connect(level);level.connect(envelope);
      });
      if(AC.createStereoPanner){var stereo=AC.createStereoPanner();stereo.pan.value=pan;envelope.connect(stereo);stereo.connect(crowdOutput());}else envelope.connect(crowdOutput());
      voice.start(start);voice.stop(start+duration+.02);
      noiseHit(.055,1500,.004,.6,.008,900,pan,start-AC.currentTime);
    }
  }
  // 投球には丸い「オオッ」、得点には開いた「ワーッ」を重ねる。
  function crowdReaction(reaction){
    if(!AC)return;
    var gasp=reaction==='throw',cheer=reaction===true,count=cheer?26:20;
    for(var i=0;i<count;i++){
      var start=AC.currentTime+Math.random()*.13,duration=gasp?.4+Math.random()*.1:cheer?.85+Math.random()*.08:1+Math.random()*.2;
      var pitch=(gasp?95:cheer?130:100)+(i%7)*16+Math.random()*20,voice=AC.createOscillator(),gain=AC.createGain(),volume=(cheer?.007:gasp?.0055:.007)*(.7+Math.random()*.6);voice.type=i%4===0?'triangle':'sawtooth';voice.detune.setValueAtTime(Math.random()*32-16,start);voice.detune.linearRampToValueAtTime(Math.random()*38-19,start+duration*.6);
      voice.frequency.setValueAtTime(pitch,start);voice.frequency.exponentialRampToValueAtTime(pitch*(gasp?1.16:cheer?1.25:.68),start+duration*.5);
      gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.07);gain.gain.setValueAtTime(volume*.85,start+duration*.6);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
      var vowels=gasp?[[400,500,5,1],[750,900,7,.65],[2300,2200,9,.15]]:cheer?[[430,900,4,1],[800,1400,6,.7],[2500,2800,8,.25]]:[[600,420,5,1],[1100,800,7,.55],[2600,2400,9,.18]],timbre=.78+Math.random()*.44;
      vowels.forEach(function(v){
        var f=AC.createBiquadFilter(),level=AC.createGain();f.type='bandpass';f.Q.value=v[2];f.frequency.setValueAtTime(v[0]*timbre,start);f.frequency.linearRampToValueAtTime(v[1]*timbre,start+duration*.3);level.gain.value=v[3];voice.connect(f);f.connect(level);level.connect(gain);
      });
      if(AC.createStereoPanner){var pan=AC.createStereoPanner();pan.pan.value=(i/(count-1)*2-1)*.9;gain.connect(pan);pan.connect(crowdOutput());}else gain.connect(crowdOutput());
      voice.start(start);voice.stop(start+duration+.03);
    }
  }
  var chantFlash=0,applauseTime=0,applauseBeat=0;
  function crowdUpdate(dt){
    if(applauseTime<=0)return;
    applauseTime=Math.max(0,applauseTime-dt);applauseBeat-=dt;
    if(applauseBeat<=0){applauseBeat=.035+Math.random()*.05;crowdClap((.045+Math.random()*.03)*Math.min(1,applauseTime/.7),Math.random()*1.6-.8);}
  }
  function swingSound(speed){
    var strength=Math.min(1,speed/16.94),duration=.36-.17*strength;
    noiseHit(duration,300+strength*950,.035+strength*.10,.55,duration*.38,180,-.35);
    noiseHit(duration*.8,1700,.014+strength*.025,.4,duration*.22,500,.35,.035);
  }
  function scoreFanfare(points){
    if(points<=0)return;
    var strike=points===10,notes=strike?[523.25,659.25,783.99,1046.5]:[659.25,783.99,1046.5],beat=strike?.14:.09;
    notes.forEach(function(f,i){var last=i===notes.length-1; tone(f,last?(strike?.65:.25):.12,strike?.065:.04,'triangle',null,i*beat);if(strike)tone(f/2,last?.55:.11,.035,'sine',null,i*beat);});
    if(strike){tone(659.25,.55,.035,'triangle',null,beat*3);tone(783.99,.55,.035,'triangle',null,beat*3);}
  }
  var lastImpactSound=-10,lastImpactTail=-10;
  function pinSound(force){
    if(!AC||AC.currentTime-lastImpactSound<.075)return;lastImpactSound=AC.currentTime;
    var weight=Math.min(1,force/18),pitch=.94+Math.random()*.12;
    // 鋭い当たり、腹に響く低音、ピンが散る残響を別々に重ねる。
    tone(145*pitch,.23,.04+weight*.12,'sine',43);
    noiseHit(.065,3100,.05+weight*.19,.55,0,1350);
    [470,830,1360].forEach(function(f,i){tone(f*pitch,.13+i*.035,(.024+weight*.055)/(i+1),'sine',f*pitch*.96);});
    if(weight>.35&&AC.currentTime-lastImpactTail>.65){
      lastImpactTail=AC.currentTime;
      [.055,.115,.21,.34,.49].forEach(function(delay,i){
        var fade=Math.pow(.66,i),pan=(i%2?1:-1)*(.25+i*.1);
        noiseHit(.12+i*.02,1700+Math.random()*900,(.025+weight*.06)*fade,.8,0,650,pan,delay);
        tone((620+Math.random()*650)*pitch,.15,(.012+weight*.025)*fade,'sine',null,delay);
      });
      noiseHit(.85,1100,.025+weight*.05,.45,.035,250,-.3,.06);
      noiseHit(.72,1500,.018+weight*.035,.5,.045,350,.35,.11);
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });


  /* 長押しで加速し、離した瞬間の赤レスラーの向きへ投げる。 */
  var S={PLAY:'play',RESULT:'result'},state,score,T,held,phase,shot,elapsed,history,scoreTime=0,angle=-Math.PI/2,omega=0,swingTime=0,snapshot,playbackRate=1,frontThrow=false,hitSlow=-1,hitSlowUsed=false;
  function place(){}
  function syncPhysics(){snapshot=world.snapshot();}
  function nextThrow(){held=false;phase='ready';chantFlash=0;applauseTime=0;applauseBeat=0;playbackRate=1;frontThrow=false;hitSlow=-1;hitSlowUsed=false;angle=-Math.PI/2;omega=0;swingTime=0;elapsed=0;world.reset(29+shot*14.5);syncPhysics();}
  function newRound(){confetti=[];state=S.PLAY;score=0;scoreTime=0;shot=0;history=[];T=0;nextThrow();}
  function update(dt){
    frameDt=dt;T+=dt;updateConfetti(dt);chantFlash=Math.max(0,chantFlash-dt);crowdUpdate(dt);scoreTime=Math.max(0,scoreTime-dt);if(state!==S.PLAY)return;elapsed+=dt;
    if(phase==='swing'){swingTime+=dt;omega=1.8+15.14*(1-Math.exp(-swingTime/2.3));var old=angle;angle+=omega*dt;world.swing(dt,angle);syncPhysics();if(Math.floor((angle-Math.PI/2)/(Math.PI*2))!==Math.floor((old-Math.PI/2)/(Math.PI*2))){crowdClap(.055,-.4);crowdClap(.04,.4);crowdChant(omega);chantFlash=.12;}if(Math.floor(angle/(Math.PI*2))!==Math.floor(old/(Math.PI*2)))swingSound(omega);}
    if(phase==='flight'){playbackRate=frontThrow?.3+.7*Math.max(0,Math.min(1,(elapsed-.12)/.28)):1;if(hitSlow>=0){hitSlow+=dt;playbackRate=Math.min(playbackRate,.3+.7*Math.max(0,Math.min(1,(hitSlow-.12)/.28)));}frameDt=dt*playbackRate;world.step(frameDt);syncPhysics();if(snapshot.firstPinHit&&!hitSlowUsed){hitSlowUsed=true;hitSlow=0;}if(world.impact>1){pinSound(world.impact);world.impact=0;}if(world.finished()){var fallen=snapshot.pins.filter(function(p){return p.down;}).length;score+=fallen;history.push(fallen);scoreFanfare(fallen);if(fallen===10)startConfetti();crowdReaction(fallen>0);if(fallen>0){applauseTime=1;applauseBeat=0;}shot++;scoreTime=2;phase='settle';elapsed=0;}}
    else if(phase==='settle'&&elapsed>1.2){if(shot===3)state=S.RESULT;else nextThrow();}
  }
  function down(x,y){audioOn();if(state===S.RESULT){var hit=x==null?'retry':hitButton(x,y);if(hit==='share')doShare();else if(hit==='retry')newRound();return;}if(phase!=='ready'||held)return;held=true;phase='swing';swingTime=0;omega=1.8;world.startSwing(angle);syncPhysics();}
  function up(){if(!held||phase!=='swing')return;if(Math.abs(omega)<.7){cancelHold();return;}held=false;frontThrow=ZWrestlePhysics.throwDirection(angle).z>=Math.cos(Math.PI/6);world.launch(angle,omega);syncPhysics();phase='flight';elapsed=0;crowdReaction('throw');tone(130,.22,.09,'sine',45);}
  function cancelHold(){if(phase==='swing')nextThrow();}
  function atCanvas(e){var r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  var activePointer=null;
  wrap.addEventListener('pointerdown',function(e){if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;if(wrap.setPointerCapture)wrap.setPointerCapture(e.pointerId);var p=atCanvas(e);down(p.x,p.y);});
  wrap.addEventListener('pointerup',function(e){if(activePointer!==e.pointerId)return;e.preventDefault();activePointer=null;up();});
  wrap.addEventListener('pointercancel',function(){activePointer=null;cancelHold();});
  window.addEventListener('blur',function(){activePointer=null;cancelHold();});
  document.addEventListener('visibilitychange',function(){if(document.hidden){activePointer=null;cancelHold();}});
  window.addEventListener('keydown',function(e){var go=e.code==='Space'||e.key===' '||e.key==='Enter';if(e.key!=='Escape'&&!go)return;e.preventDefault();if(e.repeat)return;if(e.key==='Escape'){activePointer=null;newRound();}else down();});
  window.addEventListener('keyup',function(e){if(e.code==='Space'||e.key===' '||e.key==='Enter'){e.preventDefault();up();}});

  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    zShare({ text: score + "/30 #STRONGBOWL" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }


  var confetti=[];
  function startConfetti(){
    var colors=['#ffdc62','#ed5364','#64dcd0','#79aaff','#fff1cb'];
    confetti=[];for(var i=0;i<100;i++)confetti.push({x:Math.random()*W,y:-20-Math.random()*H*.45,vx:(Math.random()-.5)*120,vy:150+Math.random()*160,r:Math.random()*6.28,spin:(Math.random()-.5)*10,size:5+Math.random()*5,color:colors[i%colors.length],age:0});
  }
  function updateConfetti(dt){
    confetti.forEach(function(p){p.age+=dt;p.x+=(p.vx+Math.sin(p.age*4+p.r)*24)*dt;p.y+=p.vy*dt;p.r+=p.spin*dt;});
    confetti=confetti.filter(function(p){return p.age<4&&p.y<H+20;});
  }
  function drawConfetti(){
    confetti.forEach(function(p){ctx.save();ctx.globalAlpha=Math.min(1,(4-p.age)/.7);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(Math.max(.15,Math.abs(Math.cos(p.r))),1);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.65);ctx.restore();});
  }
  function draw(){
    ctx.fillStyle='#142a37';ctx.fillRect(0,0,W,H);
    if(view3d)view3d.draw(ctx,W,H,snapshot,phase,angle,omega,frameDt,history);
    if(phase==='swing'&&chantFlash>0){
      ctx.save();ctx.globalAlpha=.4*Math.pow(chantFlash/.12,2);ctx.strokeStyle='#b9f4ef';ctx.lineWidth=8;ctx.shadowColor='#82eee4';ctx.shadowBlur=18;ctx.strokeRect(4,4,W-8,H-8);ctx.restore();
    }
    if(state===S.RESULT) drawResult();
    drawConfetti();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 68, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe={now:function(){return {state:state,phase:phase,held:held,score:score,shot:shot,history:history.slice(),scoreTime:scoreTime,playbackRate:playbackRate,simulationTime:snapshot.time,ringZ:snapshot.ringZ,firstPinHit:snapshot.firstPinHit,hitSlowUsed:hitSlowUsed,angle:angle,omega:omega,swingTime:swingTime,W:W,H:H,pins:snapshot.pins,human:snapshot.human,cameraFollow:view3d?view3d.follow:0,modelsReady:view3d?view3d.modelReady:false};},step:function(n){for(var i=0;i<(n||1);i++){update(1/60);draw();}},reset:newRound};
  window.__recording={sound:function(){audioOn();return AC;},run:async function(r){for(var i=0;i<3;i++){if(!await r.until(function(){return phase==='ready';},12))throw Error('次の投球に進まない');down();await r.until(function(){return swingTime>2&&ZWrestlePhysics.throwDirection(angle).z>.99&&Math.abs(ZWrestlePhysics.throwDirection(angle).x)<.08;},7);up();await r.wait(500);}await r.until(function(){return state===S.RESULT;},12);await r.wait(1500);}};

  /* ============ ループ ============ */
  newRound();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0,Math.min(0.033, (now - last) / 1000));   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
