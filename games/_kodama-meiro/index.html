<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>こだま迷路</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #0b0e15; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* こだま迷路

   真っ暗な迷路。玉には向きがあり、声を出すと、その声が高くなって玉の前方へ飛んでいく。
   音は粒になって進み、壁で跳ね返りながら届いた所の壁だけが光る（エコーロケーション）。
   大きな声ほど遠くまで届く。光った壁は1.5秒ほどで暗くなり、見えなくなる。
   音の粒が出口に届くと「キン」と、その方向から鳴る。
   迷路には見えない敵がいて、声を聞きつけると声のした場所へ寄ってくる。音の粒が当たると一瞬見える。
   捕まると入口に戻される。
   マイクが使えないときは、タップ（スペース）でも高い音を出せる。
   迷路の作りは画像迷路と同じ。触った所に出るジョイスティックで玉を動かす。結果は出口までの秒数。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
  }
  /* pan: -1 左 〜 1 右 */
  function tone(freq, dur, vol, type, to, delay, pan) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain(), out = g;
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g);
    if (pan && AC.createStereoPanner) { var p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(p); out = p; }
    out.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ マイク ============ */
  var mic = null, micSource = null, analyser = null, samples = null, micPending = false, micError = false;
  /* 声を高くして鳴らすため、マイクの音を直近2秒ぶん貯めておく */
  var tape = null, tapeLen = 0, tapePos = 0, tapeNode = null, tapeMute = null;
  function stopMic() {
    if (tapeNode) { try { tapeNode.disconnect(); tapeMute.disconnect(); } catch (e) {} tapeNode = null; }
    if (micSource) { try { micSource.disconnect(); } catch (e) {} }
    if (mic) mic.getTracks().forEach(function (t) { t.stop(); });
    mic = micSource = analyser = null;
  }
  async function requestMic() {
    if (micPending || mic) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) { micError = true; return; }
    micPending = true; micError = false;
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      if (document.hidden) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      mic = stream; analyser = AC.createAnalyser(); analyser.fftSize = 1024;
      samples = new Float32Array(analyser.fftSize);
      micSource = AC.createMediaStreamSource(stream); micSource.connect(analyser);
      if (AC.createScriptProcessor) {
        tapeLen = AC.sampleRate * 2; tape = new Float32Array(tapeLen); tapePos = 0;
        tapeNode = AC.createScriptProcessor(2048, 1, 1);
        tapeMute = AC.createGain(); tapeMute.gain.value = 0;
        tapeNode.onaudioprocess = function (ev) {
          var d = ev.inputBuffer.getChannelData(0);
          for (var i = 0; i < d.length; i++) tape[(tapePos + i) % tapeLen] = d[i];
          tapePos += d.length;
        };
        micSource.connect(tapeNode); tapeNode.connect(tapeMute); tapeMute.connect(AC.destination);
      }
      stream.getTracks().forEach(function (t) { t.onended = function () { stopMic(); micError = true; }; });
    } catch (e) { stopMic(); micError = true; }
    finally { micPending = false; }
  }
  window.addEventListener("pagehide", stopMic);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopMic();
    else if ((state === S.PLAY || state === S.BUILD) && !micError) requestMic();
  });
  /* 貯めた声のうち、from〜to（tapePos の値）を高くして鳴らす。鳴り終わる秒数を返す */
  var RATE = 1.75;
  function playHigh(from, to, vol) {
    if (!AC || !tape) return 0;
    from = Math.max(from, tapePos - tapeLen + 1);
    var n = to - from;
    if (n < AC.sampleRate * 0.05) return 0;
    var buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0), peak = 0.0001;
    for (var i = 0; i < n; i++) { d[i] = tape[(from + i) % tapeLen]; peak = Math.max(peak, Math.abs(d[i])); }
    for (var k = 0; k < n; k++) d[k] = d[k] / peak;   /* 大きさをそろえる */
    var len = n / AC.sampleRate / RATE;
    /* 本人の声のあと、小さくなりながら2回こだまする */
    [[0, 1], [0.28, 0.35], [0.56, 0.12]].forEach(function (e) {
      var src = AC.createBufferSource(), g = AC.createGain();
      src.buffer = buf; src.playbackRate.value = RATE;
      g.gain.value = vol * e[1];
      src.connect(g); g.connect(AC.destination);
      src.start(AC.currentTime + e[0]);
    });
    return len + 0.56;
  }
  /* 声の大きさ 0〜1 */
  function readVoice() {
    if (!analyser) return 0;
    analyser.getFloatTimeDomainData(samples);
    var sum = 0;
    for (var i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    return Math.max(0, Math.min(1, (Math.sqrt(sum / samples.length) - 0.012) / 0.075));
  }

  /* ============ 迷路 ============
     N×N の部屋。壁も1マスとして数えるので、マス目は G = 2N+1 */
  var N = 21, G = 2 * N + 1, B = 12, BOARD = G * B;
  var open = new Uint8Array(G * G);         /* 1 = 通路 */
  var EXIT = (G - 1) * G + G - 2;
  var light = new Float32Array(G * G);      /* 壁の光 0〜1 */
  var seen = new Uint8Array(G * G);         /* 一度光った壁 */

  /* ランダムな強さの低い順に掘る（Prim の最小全域木） */
  function buildMaze() {
    var strength = new Float32Array(G * G);
    for (var j = 0; j < G * G; j++) strength[j] = Math.random();
    open.fill(0);
    var heap = [];
    function push(w, a, b) {
      heap.push([w, a, b]);
      var i = heap.length - 1;
      while (i > 0) { var p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; var t = heap[p]; heap[p] = heap[i]; heap[i] = t; i = p; }
    }
    function pop() {
      var top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        var i = 0;
        for (;;) {
          var l = i * 2 + 1, r = l + 1, m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          var t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m;
        }
      }
      return top;
    }
    var done = new Uint8Array(N * N);
    function visit(c) {
      done[c] = 1;
      var cx = c % N, cy = (c / N) | 0, bx = cx * 2 + 1, by = cy * 2 + 1;
      open[by * G + bx] = 1;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (dv) {
        var nx = cx + dv[0], ny = cy + dv[1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N || done[ny * N + nx]) return;
        var wall = (by + dv[1]) * G + bx + dv[0];
        push(strength[wall] + Math.random() * 0.06, wall, ny * N + nx);
      });
    }
    visit(0);
    while (heap.length) {
      var e = pop();
      if (done[e[2]]) continue;
      open[e[1]] = 1;
      visit(e[2]);
    }
    /* 入口は左上、出口は右下 */
    open[1] = 1;
    open[EXIT] = 1;
  }
  function degree(i) {
    var x = i % G, y = (i / G) | 0, n = 0;
    if (x > 0 && open[i - 1]) n++;
    if (x < G - 1 && open[i + 1]) n++;
    if (y > 0 && open[i - G]) n++;
    if (y < G - 1 && open[i + G]) n++;
    return n;
  }

  /* ============ 音の粒 ============
     玉の向きを中心に扇形に飛ぶ。壁に当たると跳ね返り、当たった壁が光る。
     跳ね返るたびに弱くなり、届く距離（マス）は声の大きさで決まる */
  var SPEED = 30 * B, CONE = 0.55, RAYS = 70, REACH_MIN = 6, REACH_MAX = 34, BOUNCE_KEEP = 0.9, GLOW_FADE = 1.5;
  var rays = [], clock = 0, exitHeard = false;
  function ping(level) {
    level = Math.max(0, level);
    var reach = level >= 9 ? 400 : REACH_MIN + (REACH_MAX - REACH_MIN) * Math.min(1, level);
    var cone = level >= 9 ? Math.PI : CONE, count = level >= 9 ? 360 : RAYS;
    for (var i = 0; i < count; i++) {
      var a = facing + (count === 1 ? 0 : (i / (count - 1) * 2 - 1) * cone);
      rays.push({ x: player.x, y: player.y, vx: Math.cos(a), vy: Math.sin(a), d: 0, max: reach * B, e: 1, hit: 0 });
    }
    exitHeard = false;
    shouts++;
    if (state === S.PLAY && level < 9) hear(level);
  }
  function cellOf(x, y) { var bx = Math.floor(x / B), by = Math.floor(y / B); return (bx < 0 || by < 0 || bx >= G || by >= G) ? -1 : by * G + bx; }
  function solid(c) { return c < 0 || !open[c]; }
  function glow(c, e) { if (c >= 0) { light[c] = Math.max(light[c], e); seen[c] = 1; } }
  function stepRays(dt) {
    var go = SPEED * dt, sub = B / 3;
    rays.forEach(function (r) {
      for (var left = go; left > 0 && r.e > 0; left -= sub) {
        var s = Math.min(sub, left), fade = Math.max(0, 1 - r.d / r.max);
        var nx = r.x + r.vx * s, cx = cellOf(nx, r.y);
        if (solid(cx)) { glow(cx, Math.min(1, 0.3 + r.e) * fade); r.vx = -r.vx; r.e *= BOUNCE_KEEP; r.hit++; }
        else r.x = nx;
        var ny = r.y + r.vy * s, cy = cellOf(r.x, ny);
        if (solid(cy)) { glow(cy, Math.min(1, 0.3 + r.e) * fade); r.vy = -r.vy; r.e *= BOUNCE_KEEP; r.hit++; }
        else r.y = ny;
        r.d += s;
        for (var k = 0; k < foes.length; k++) {
          var f = foes[k];
          if (Math.abs(f.x - r.x) < B * 0.7 && Math.abs(f.y - r.y) < B * 0.7) { f.lit = Math.max(f.lit, 0.4 + 0.6 * fade); r.e = 0; }
        }
        if (r.d > r.max || r.e < 0.05) r.e = 0;
        if (!exitHeard && cellOf(r.x, r.y) === EXIT && state === S.PLAY) {
          exitHeard = true;
          var pan = (r.x - player.x) / (B * 10), vol = Math.max(0.02, 0.1 * fade);
          tone(1568, 0.6, vol, "sine", null, 0, pan); tone(2093, 0.5, vol * 0.7, "sine", null, 0.06, pan);
        }
      }
    });
    rays = rays.filter(function (r) { return r.e > 0; });
  }

  /* ============ 敵 ============
     ふだんはゆっくりうろつく。声が届く（通路づたいの距離が声の大きさで決まる）と、
     声のした場所へ急いで向かい、着いたらまたうろつく */
  var FOES = 3, FOE_WALK = 2 * B, FOE_RUN = 5 * B, HEAR_MIN = 8, HEAR_MAX = 36, FOE_FAR = 24;
  var foes = [], catches = 0, caughtFlash = 0;
  function nbrs(c) {
    var x = c % G, y = (c / G) | 0, out = [];
    if (x > 0 && open[c - 1]) out.push(c - 1);
    if (x < G - 1 && open[c + 1]) out.push(c + 1);
    if (y > 0 && open[c - G]) out.push(c - G);
    if (y < G - 1 && open[c + G]) out.push(c + G);
    return out;
  }
  /* c から通路づたいの距離（limit マスまで） */
  function distFrom(c, limit) {
    var d = new Int32Array(G * G).fill(-1), q = [c];
    d[c] = 0;
    for (var h = 0; h < q.length; h++) {
      var a = q[h];
      if (d[a] >= limit) continue;
      nbrs(a).forEach(function (m) { if (d[m] < 0) { d[m] = d[a] + 1; q.push(m); } });
    }
    return d;
  }
  function placeFoes() {
    var d = distFrom(Math.floor(player.y / B) * G + Math.floor(player.x / B), 9999), far = [];
    for (var c = 0; c < G * G; c++) if (d[c] >= FOE_FAR && (c % G) % 2 === 1 && ((c / G) | 0) % 2 === 1) far.push(c);
    foes = [];
    for (var i = 0; i < FOES && far.length; i++) {
      var c2 = far.splice(Math.floor(Math.random() * far.length), 1)[0];
      foes.push({ x: (c2 % G + 0.5) * B, y: (((c2 / G) | 0) + 0.5) * B, at: c2, to: c2, prev: -1, map: null, lit: 0, step: 0 });
    }
  }
  function hear(level) {
    var here = Math.floor(player.y / B) * G + Math.floor(player.x / B);
    var range = Math.round(HEAR_MIN + (HEAR_MAX - HEAR_MIN) * Math.min(1, level));
    var d = distFrom(here, range), heard = false;
    foes.forEach(function (f) {
      if (d[f.at] < 0) return;
      f.map = d; heard = true;   /* 声のした場所への道しるべ。距離が減る方へ進めば着く */
    });
    if (heard) tone(110, 0.5, 0.06, "sawtooth", 70, 0.15);
  }
  function updateFoes(dt) {
    var px = player.x, py = player.y;
    foes.forEach(function (f) {
      f.lit = Math.max(0, f.lit - dt / GLOW_FADE);
      var tx = (f.to % G + 0.5) * B, ty = (((f.to / G) | 0) + 0.5) * B;
      var dx = tx - f.x, dy = ty - f.y, dd = Math.hypot(dx, dy), sp = (f.map ? FOE_RUN : FOE_WALK) * dt;
      if (dd > sp) { f.x += dx / dd * sp; f.y += dy / dd * sp; }
      else {
        f.x = tx; f.y = ty; f.prev = f.at; f.at = f.to;
        var ns = nbrs(f.at);
        if (f.map) {
          if (f.map[f.at] === 0) f.map = null;   /* 声のした場所に着いた */
          else { var best = ns.filter(function (m) { return f.map[m] >= 0 && f.map[m] < f.map[f.at]; })[0]; if (best != null) f.to = best; else f.map = null; }
        }
        if (!f.map) {
          var go = ns.filter(function (m) { return m !== f.prev; });
          f.to = go.length ? go[Math.floor(Math.random() * go.length)] : (ns[0] != null ? ns[0] : f.at);
        }
      }
      /* 近くにいると足音が聞こえる */
      var near = Math.hypot(f.x - px, f.y - py) / B;
      f.step -= dt;
      if (near < 12 && f.step <= 0) {
        f.step = f.map ? 0.22 : 0.45;
        tone(70, 0.12, 0.05 * (1 - near / 12), "sine", 45, 0, (f.x - px) / (B * 8));
      }
      if (Math.abs(f.x - px) < B * 0.75 && Math.abs(f.y - py) < B * 0.75) caught(f);
    });
  }
  /* 捕まったら入口に戻される */
  function caught(f) {
    catches++;
    caughtFlash = 1;
    f.lit = 1;
    tone(160, 0.6, 0.12, "sawtooth", 50);
    tone(90, 0.8, 0.1, "square", 40, 0.05);
    player.x = 1.5 * B; player.y = 0.5 * B;
    facing = Math.PI / 2;
    placeFoes();
  }

  /* マイクの代わりの高い声 */
  function chirp() { tone(1400, 0.16, 0.08, "triangle", 2200); tone(1400, 0.16, 0.03, "triangle", 2200, 0.28); }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", BUILD: "build", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var state, T, held = false, keyMode = false, time = 0;
  var player = { x: 0, y: 0 };
  var shouts = 0, voice = 0, talking = false, talkT = 0, talkPeak = 0, quietT = 0, talkFrom = 0, deaf = 0;
  var facing = Math.PI / 2;                   /* 玉の向き（はじめは下） */
  var keys = { l: 0, r: 0, u: 0, d: 0 };
  var BX = 0, BY = 0;                         /* 迷路の左上 */
  var R_PLAYER = 3.5, BUILD_TIME = 0.4;
  var VOICE_ON = 0.16, VOICE_OFF = 0.07, TALK_MAX = 1.0;

  function place() {
    BX = Math.round((W - BOARD) / 2);
    BY = Math.round(Math.max(110, (H - BOARD) / 2 - 20));
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.BUILD;
    T = 0;
    time = 0;
    held = false;
    keys = { l: 0, r: 0, u: 0, d: 0 };
    player.x = 1.5 * B; player.y = 0.5 * B;
    shouts = 0; talking = false; voice = 0; deaf = 0;
    facing = Math.PI / 2;
    rays = [];
    catches = 0; caughtFlash = 0;
    light.fill(0); seen.fill(0);
    buildMaze();
    if (!micError) requestMic();
  }

  function wallAt(bx, by) {
    if (bx < 0 || by < 0 || bx >= G || by >= G) return true;
    return !open[by * G + bx];
  }
  function hits(x, y) {
    var r = R_PLAYER;
    var x0 = Math.floor((x - r) / B), x1 = Math.floor((x + r - 0.001) / B);
    var y0 = Math.floor((y - r) / B), y1 = Math.floor((y + r - 0.001) / B);
    for (var by = y0; by <= y1; by++) for (var bx = x0; bx <= x1; bx++) if (wallAt(bx, by)) return true;
    return false;
  }
  /* ぶつかった壁はかすかに光り、コツと鳴る */
  var bumpCool = 0;
  function bump(x, y) {
    var bx = Math.floor(x / B), by = Math.floor(y / B);
    if (bx < 0 || by < 0 || bx >= G || by >= G) return;
    var c = by * G + bx;
    if (open[c]) return;
    light[c] = Math.max(light[c], 0.45); seen[c] = 1;
    if (bumpCool <= 0) { tone(150, 0.07, 0.06, "sine", 110); bumpCool = 0.18; }
  }
  /* 角で引っかからないよう、ぶつかったら通路の真ん中へ寄せる */
  function moveAxis(dx, dy) {
    if (!hits(player.x + dx, player.y + dy)) { player.x += dx; player.y += dy; return; }
    bump(player.x + Math.sign(dx) * (R_PLAYER + 1), player.y + Math.sign(dy) * (R_PLAYER + 1));
    var amt = Math.abs(dx + dy);
    if (dx) {
      var cy = (Math.floor(player.y / B) + 0.5) * B, ahead = Math.floor((player.x + Math.sign(dx) * (R_PLAYER + 1)) / B);
      if (!wallAt(ahead, Math.floor(player.y / B)) && Math.abs(cy - player.y) > 0.01) {
        var ny = player.y + Math.sign(cy - player.y) * Math.min(amt, Math.abs(cy - player.y));
        if (!hits(player.x, ny)) player.y = ny;
      }
    } else {
      var cx = (Math.floor(player.x / B) + 0.5) * B, below = Math.floor((player.y + Math.sign(dy) * (R_PLAYER + 1)) / B);
      if (!wallAt(Math.floor(player.x / B), below) && Math.abs(cx - player.x) > 0.01) {
        var nx = player.x + Math.sign(cx - player.x) * Math.min(amt, Math.abs(cx - player.x));
        if (!hits(nx, player.y)) player.x = nx;
      }
    }
  }
  function moveBy(dx, dy) {
    if (state !== S.PLAY) return;
    var n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 2));
    for (var i = 0; i < n; i++) { moveAxis(dx / n, 0); moveAxis(0, dy / n); }
    if (player.y > (G - 1) * B + B * 0.3) goal();
  }
  /* ゴールしたら、迷路ぜんぶに波が広がって全体が見える */
  function goal() {
    state = S.GOAL;
    T = 0;
    stopMic();
    ping(99);
    shouts--;
    exitHeard = true;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, j) { tone(f, 1.4, 0.07, "triangle", null, 0.1 + j * 0.09); });
  }

  /* ============ 進行 ============ */
  function update(dt) {
    clock += dt;
    bumpCool -= dt;
    stepRays(dt);
    for (var i = 0; i < light.length; i++) if (light[i] > 0) light[i] = Math.max(0, light[i] - dt / GLOW_FADE);
    if (state === S.BUILD) {
      T += dt;
      if (T >= BUILD_TIME) { state = S.PLAY; T = 0; placeFoes(); ping(0.3); shouts = 0; foes.forEach(function (f) { f.map = null; }); }
      return;
    }
    if (state === S.GOAL) {
      T += dt;
      if (T > 2.2) { state = S.RESULT; shareButton.hidden = false; }
      return;
    }
    if (state !== S.PLAY) return;
    time += dt;
    caughtFlash = Math.max(0, caughtFlash - dt * 1.5);
    updateFoes(dt);
    /* 声。言い終わったら（長くても1秒で区切る）、その声を高くして鳴らし、一番大きかった分だけ音の粒を飛ばす。
       自分の鳴らした声をマイクが拾わないよう、鳴っている間は聞かない */
    deaf -= dt;
    var v = deaf > 0 ? 0 : readVoice();
    voice += (v - voice) * Math.min(1, dt * 20);
    if (!talking && v > VOICE_ON) { talking = true; talkT = 0; talkPeak = v; quietT = 0; talkFrom = tapePos - Math.floor((AC ? AC.sampleRate : 44100) * 0.08); }
    if (talking) {
      talkT += dt;
      talkPeak = Math.max(talkPeak, v);
      quietT = v < VOICE_OFF ? quietT + dt : 0;
      if (quietT > 0.12 || talkT > TALK_MAX) {
        talking = false;
        var len = playHigh(talkFrom, tapePos, 0.5);
        if (!len) chirp();
        deaf = (len || 0.3) + 0.15;
        ping(talkPeak);
      }
    }
    var sp = MOVE_SPEED * dt, vx = keys.r - keys.l, vy = keys.d - keys.u;
    if (stick && stick.on) {
      vx = (stick.x - stick.bx) / STICK_R; vy = (stick.y - stick.by) / STICK_R;
      var m = Math.hypot(vx, vy);
      if (m > 1) { vx /= m; vy /= m; }
      if (m < 0.15) vx = vy = 0;
    }
    if (vx || vy) {
      if (Math.hypot(vx, vy) > 0.3) facing = Math.atan2(vy, vx);
      moveBy(vx * sp, vy * sp);
    }
  }

  /* ============ 入力 ============
     触った所にジョイスティックが出て、倒した方へ玉が進み、玉もその方を向く。
     動かさずにちょんと触ると高い音が出る（マイクの代わり） */
  var stick = null, downAt = 0, moved = 0, STICK_R = 60, MOVE_SPEED = 90;
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (x == null) { if (state === S.PLAY) { chirp(); ping(0.55); } return; }
    held = true;
    stick = { on: true, bx: x, by: y, x: x, y: y };
    downAt = clock; moved = 0;
  }
  function move(x, y) {
    if (!held || !stick) return;
    moved += Math.abs(x - stick.x) + Math.abs(y - stick.y);
    var ox = x - stick.bx, oy = y - stick.by, d = Math.hypot(ox, oy);
    if (d > STICK_R) { stick.bx = x - ox / d * STICK_R; stick.by = y - oy / d * STICK_R; }   /* 大きく動かしたら台座もついてくる */
    stick.x = x; stick.y = y;
  }
  function up() {
    if (held && stick && moved < 8 && clock - downAt < 0.3 && state === S.PLAY) { chirp(); ping(0.55); }
    held = false; stick = null;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { held = false; stick = null; });
  window.addEventListener("blur", function () { held = false; stick = null; keys = { l: 0, r: 0, u: 0, d: 0 }; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (n === 1 && state !== S.INTRO) newRound();                                          /* 次の迷路 */
    if (n === 2 && state === S.PLAY) {                                                    /* ゴール目前へ */
      player.x = (G - 1.5) * B; player.y = (G - 1.5) * B;
      if (hits(player.x, player.y)) { player.x = (G - 2 + 0.5) * B; player.y = (G - 2 + 0.5) * B; }
    }
    if (n === 3 && state === S.PLAY) { time += 3; goal(); }                                /* クリア */
    if (n === 4 && state === S.PLAY) ping(1);                                             /* いちばん大きい声 */
    if (n === 5 && state === S.PLAY) foes.forEach(function (f) { f.lit = 1; });           /* 敵を見る */
  }

  var KEYMAP = { ArrowLeft: "l", a: "l", A: "l", ArrowRight: "r", d: "r", D: "r", ArrowUp: "u", w: "u", W: "u", ArrowDown: "d", s: "d", S: "d" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var dir = KEYMAP[e.key];
    if (!esc && !go && !dir) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (dir) { keys[dir] = 1; return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    var dir = KEYMAP[e.key];
    if (dir) { keys[dir] = 0; return; }
    if ((e.code === "Space" || e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
  });

  function secText() { return (Math.floor(time * 10) / 10).toFixed(1); }
  function doShare() {
    /* 英語のときのハッシュタグは英語のゲーム名にする */
    var ja = "真っ暗な迷路を" + shouts + "回叫んで" + secText() + "秒で抜けた";
    var en = "Escaped a pitch-dark maze by shouting " + shouts + " times in " + secText() + "s";
    window.zResultActions.x({ text: zT(ja, en) + zT(" #こだま迷路", " #EchoMaze") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b0e15";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(BX, BY);
    if (state !== S.INTRO) {
      /* 迷路の外枠と出口がかすかに見える */
      ctx.strokeStyle = "rgba(200,230,255,.08)";
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, BOARD - 1, BOARD - 1);
      ctx.strokeStyle = "rgba(200,230,255,.3)";
      ctx.strokeRect((G - 2) * B + 1.5, (G - 1) * B + 1.5, B - 3, B - 3);
      /* 光った壁（しばらくすると消える） */
      for (var c = 0; c < G * G; c++) {
        if (light[c] <= 0) continue;
        var a = light[c];
        ctx.fillStyle = "rgba(200,230,255," + a.toFixed(3) + ")";
        ctx.fillRect((c % G) * B, ((c / G) | 0) * B, B, B);
      }
      /* 飛んでいく音の粒 */
      ctx.fillStyle = "rgba(150,215,255,.75)";
      rays.forEach(function (r) {
        var sz = 2 + 1.5 * r.e;
        ctx.globalAlpha = Math.max(0.15, r.e * (1 - r.d / r.max));
        ctx.fillRect(r.x - sz / 2, r.y - sz / 2, sz, sz);
      });
      ctx.globalAlpha = 1;
      /* 敵。音の粒が当たったときだけ見える */
      foes.forEach(function (f) {
        if (f.lit <= 0) return;
        ctx.globalAlpha = Math.min(1, f.lit);
        ctx.beginPath(); ctx.arc(f.x, f.y, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = "#e0344a"; ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillRect(f.x - 3, f.y - 2, 2, 2); ctx.fillRect(f.x + 1, f.y - 2, 2, 2);
        ctx.globalAlpha = 1;
      });
      /* 玉。声の大きさで輪が広がる */
      if (state === S.PLAY && voice > 0.03) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, R_PLAYER + 3 + voice * 16, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(160,215,255," + Math.min(0.8, voice * 1.5).toFixed(3) + ")";
        ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(player.x, player.y, R_PLAYER + 1.5, 0, Math.PI * 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      /* 向き */
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(facing);
      ctx.beginPath();
      ctx.moveTo(R_PLAYER + 6.5, 0); ctx.lineTo(R_PLAYER + 2, -3.5); ctx.lineTo(R_PLAYER + 2, 3.5); ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    /* 捕まったときに赤く光る */
    if (caughtFlash > 0) { ctx.fillStyle = "rgba(224,52,74," + (0.45 * caughtFlash).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }

    /* ジョイスティック */
    if (state === S.PLAY && stick && stick.on) {
      ctx.beginPath(); ctx.arc(stick.bx, stick.by, STICK_R, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 2; ctx.stroke();
      var kx = stick.x - stick.bx, ky = stick.y - stick.by, kd = Math.hypot(kx, ky);
      if (kd > STICK_R) { kx = kx / kd * STICK_R; ky = ky / kd * STICK_R; }
      ctx.beginPath(); ctx.arc(stick.bx + kx, stick.by + ky, 26, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.fill();
    }

    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, time: time, player: { x: player.x, y: player.y }, W: W, H: H, shouts: shouts, mic: !!mic, micError: micError, rays: rays.length, facing: facing, catches: catches, foes: foes.map(function (f) { return { x: f.x, y: f.y, chase: !!f.map }; }) }; },
    maze: function () { return { G: G, B: B, open: Array.prototype.slice.call(open) }; },
    seen: function () { var n = 0; for (var i = 0; i < seen.length; i++) n += seen[i]; return n; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    move: function (dx, dy) { moveBy(dx, dy); },
    stick: function (vx, vy) { stick = { on: vx !== 0 || vy !== 0, bx: 0, by: 0, x: vx * STICK_R, y: vy * STICK_R }; },
    ping: function (v) { ping(v); },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(4000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO;
  startButton.hidden = false;
  shareButton.hidden = true;
  buildMaze();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
