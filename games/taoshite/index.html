<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>倒してもいいですかゲーム</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
  #follow-link { position:absolute; border-radius:999px; touch-action:manipulation; }
  #follow-link[hidden] { display:none; }
</style>
<!-- ゲームのOGP：道具で更新 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ゾウノアシゲームズ">

<!-- ゲームのOGPここまで -->
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
  <a id="follow-link" href="https://x.com/intent/follow?screen_name=TomozoP" target="_blank" rel="noopener" aria-label="作者をフォロー" hidden></a>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>
<script src="../voice.js"></script>   <!-- 声（アツアツ一輪車と同じ） -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="../random-bowling/vendor/cannon.js"></script>
<script src="../three-base.js"></script>
<script src="scene3d.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 倒してもいいですかゲーム

   新幹線の座席。STARTで「倒してもいいですか？」と聞き、後ろの人が「どうぞ」。
   押している間だけ背もたれがなめらかに倒れる。離したところで決まる。
   後ろの人はふつうに座ってスマホを見ていて、背もたれの頭の部分が後ろの人の頭にぶつかったら、
   アツアツ一輪車の倒れたときと同じ叫び声でラグドールになる。座り方はいつも同じ。すき間が近づくと拡大鏡が出る。結果は残りのすき間（mm）。
   絵は3D（scene3d.js）。人の作りと声はアツアツ一輪車と同じ（声は games/voice.js）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var followLink = document.getElementById("follow-link");
  window.zResultActions.bind(shareButton, doShare);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, CREAK = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    /* 走行音（低いゴー） */
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 220;
    var g = AC.createGain(); g.gain.value = 0.18;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  }
  function noiseHit(dur, freq, vol, q, at) {
    if (!AC) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = at || AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  /* 背もたれが少しずつ倒れる「ギッ」 */
  /* ぶつかったときの声（アツアツ一輪車の倒れたときと同じ）。
     「アアアアア～～～」。高いところから落ちていくように下がる長い叫び。
     細かく音量を揺らして「アアアア」と途切れさせ、だんだん震えを強くして消える */
  function scream(ac, at, pitch) {
    var t = at, f0 = pitch || 520, dur = 1.7;
    var out = ac.createGain(), trem = ac.createGain();
    out.gain.value = 0.45;
    trem.connect(out); out.connect(ac.destination);
    var o = ac.createOscillator(), env = ac.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(f0 * 1.15, t);
    o.frequency.exponentialRampToValueAtTime(f0, t + 0.12);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.5, t + dur);
    /* 声の震え（あとほど深く） */
    var vib = ac.createOscillator(), vg = ac.createGain();
    vib.frequency.value = 6.5;
    vg.gain.setValueAtTime(f0 * 0.01, t);
    vg.gain.linearRampToValueAtTime(f0 * 0.05, t + dur);
    vib.connect(vg); vg.connect(o.frequency);
    /* 「アアアア」と途切れる揺れ */
    var am = ac.createOscillator(), ag = ac.createGain();
    am.frequency.setValueAtTime(8, t);
    am.frequency.linearRampToValueAtTime(5, t + dur);
    ag.gain.value = 0.35;
    trem.gain.value = 0.65;
    am.connect(ag); ag.connect(trem.gain);
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.9, t + 0.03);
    env.gain.setValueAtTime(0.9, t + dur * 0.55);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(env);
    [[850, 5, 2.2], [1250, 6, 1.4], [2700, 8, 0.8]].forEach(function (fm) {
      var b = ac.createBiquadFilter(), g = ac.createGain();
      b.type = "bandpass"; b.frequency.value = fm[0]; b.Q.value = fm[1]; g.gain.value = fm[2];
      env.connect(b); b.connect(g); g.connect(trem);
    });
    [o, vib, am].forEach(function (n) { n.start(t); n.stop(t + dur + 0.05); });
  }
  /* 背もたれが倒れる「ギッ」 */
  function creak() {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(), n = AC.currentTime;
    o.type = "sawtooth"; o.frequency.setValueAtTime(70 + Math.random() * 30, n);
    f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 3;
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.12, n + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.07);
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + 0.1);
  }

  var bubbles = [];                             /* 吹き出し { who: "me"|"back", ja, en, until } */
  function say(who, yomi, ja, en, opt) {
    var at = AC ? AC.currentTime + (opt.delay || 0) : 0, end = at + 0.6;
    if (AC) end = window.zVoice.speak(AC, at, opt.pitch, window.zVoice.kana(yomi.replace(/[！？!?。…]+$/, ""), opt.mora || 0.12), { volume: opt.volume || 0.34 }).end;
    bubbles = bubbles.filter(function (b) { return b.who !== who; });
    bubbles.push({ who: who, ja: ja, en: en, from: T + (opt.delay || 0), until: T + (opt.delay || 0) + Math.max(1.2, (end - at) + 0.8) });
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", ASK: "ask", PLAY: "play", ANGRY: "angry", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var MAX = 50;                                 /* 座席が倒れきる角度 */
  var SPEED = 8;                                /* 倒れる速さ（度/秒） */
  var D2R = Math.PI / 180;
  var angle, contact, lean, gap, hitInfo, failed, denied, creakT = 0, noUI = false;

  function newRound(forceDeny) {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.ASK;
    score = 0; T = 0; T2 = 0; held = false; angle = 0; failed = false; gap = null;
    lean = -0.18;                               /* 後ろの人は背もたれに頭をつけてもたれる（触れるのは約30.7°）*/
    contact = 0; while (gapNow(contact) > 0 && contact < MAX) contact += 0.1;
    gap = gapNow(0);
    bubbles = [];
    say("me", "たおしてもいいですか？", "倒してもいいですか？", "May I recline?", { pitch: 290 });
    /* 30回に1回くらい、断られて終わり */
    denied = forceDeny || Math.random() < 1 / 30;
    if (denied) say("back", "だめです", "ダメです", "No.", { pitch: 200, delay: 1.7, mora: 0.15 });
    else say("back", "どうぞ", "どうぞ", "Sure.", { pitch: 210, delay: 1.7, mora: 0.15 });
  }

  /* 背もたれの頭の部分と後ろの人の頭のすき間（メートル）。a は度 */
  function gapNow(a) {
    if (!window.zRecline) { hitInfo = null; return 0.2 - a * 0.01; }   /* 3Dの部品が読めないとき（自動確認など） */
    hitInfo = window.zRecline.gapAt(a * D2R, lean); return hitInfo.gap;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    bubbles = bubbles.filter(function (b) { return T < b.until; });
    gap = gapNow(angle);
    if (state === S.ASK) { if (denied ? T > 3.2 : T > 2.4) { if (denied) toResult(); else state = S.PLAY; } return; }
    if (state === S.ANGRY) {
      T2 += dt;
      if (T2 > 2.6) toResult();
      return;
    }
    if (state !== S.PLAY) return;

    /* 押している間、なめらかに倒れる */
    if (held && angle < MAX) {
      angle = Math.min(MAX, angle + SPEED * dt);
      creakT -= dt;
      if (creakT <= 0) { creakT = 0.12; creak(); }
      gap = gapNow(angle);
    }
    if (gap <= 0) bump();
  }
  function bump() {
    state = S.ANGRY; T2 = 0; failed = true; held = false;
    if (AC) scream(AC, AC.currentTime + 0.02, 480 + Math.random() * 80);
    noiseHit(0.12, 2500, 0.5, 2);
  }
  var T2 = 0;
  function toResult() {
    state = S.RESULT;
    score = failed ? 0 : Math.round(gap * 100000) / 100;
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    held = true;
  }
  function up() {
    if (!held) return;
    held = false;
    if (state !== S.PLAY || angle <= 0) return;
    /* 1コマ(1/60秒)の間も倒れ続けているので、指を離した時刻までの分を足して角度を細かく出す */
    var extra = Math.min(1 / 30, stepAcc + Math.max(0, (performance.now() - last) / 1000));
    angle = Math.min(MAX, angle + SPEED * extra);
    gap = gapNow(angle);
    if (gap <= 0) { bump(); return; }
    { toResult(); noiseHit(0.08, 600, 0.3, 2); fanfare(); }
  }
  /* 成功のファンファーレ（四角波のパッパッパッパーン＋低い和音） */
  function fanfare() {
    if (!AC) return;
    var n = AC.currentTime + 0.15, C = 523.25, E = 659.25, G = 783.99, C2 = 1046.5, A = 880, B = 987.77;
    [[G, 0, 0.1], [G, 0.12, 0.1], [G, 0.24, 0.1], [C2, 0.36, 0.5], [A, 0.9, 0.16], [B, 1.08, 0.16], [C2, 1.26, 0.9]].forEach(function (t) { beep(t[0], n + t[1], t[2] + 0.1, 0.12, "square"); });
    [C / 2, E / 2, G / 2].forEach(function (f) { beep(f, n + 1.26, 1.0, 0.06, "triangle"); });
  }
  function beep(freq, at, dur, vol, type) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(at); o.stop(at + dur + 0.05);
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 1 すき間 2cm の手前まで 2 触れる 3 結果（残り約0.3mm） 4 断られる回 */
    if (n === 4 && state !== S.INTRO) { newRound(true); return; }
    if (state !== S.PLAY) return;
    var to = n === 1 ? 0.02 : n === 2 ? 0 : 0.00037;
    while (gapNow(angle) > to && angle < MAX) angle += 0.01;
    gap = gapNow(angle);
    if (n === 3) { toResult(); fanfare(); }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    var text = denied ? zT("リクライニングさせてもらえませんでした（そういうこともある）", "Wasn't allowed to recline (it happens)") : failed
      ? zT("後ろの人を倒した", "Knocked out the person behind me")
      : zT(score.toFixed(2) + "mmまで倒した", "Reclined my seat to " + score.toFixed(2) + "mm from the head behind me");
    window.zResultActions.x({ text: text + zT(" #倒してもいいですかゲーム", " #MayIReclineGame") });
  }

  /* ============ 描画 ============ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.Scene3D(); }) : function () { return null; };
  var angry = 0;
  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, followBox(), W, H, state === S.RESULT);
    var g = gap == null ? 1 : gap, near = Math.max(0, Math.min(1, 1 - g / 0.06));
    angry += ((state === S.ANGRY || (state === S.RESULT && failed) ? 1 : 0) - angry) * 0.2;
    var s3 = scene3d(), drew = false;
    if (s3) {
      try {
        s3.sync({ t: T || 0, angle: angle * D2R, lean: lean, near: state === S.INTRO ? 0 : near, angry: angry, rag: state === S.ANGRY || (state === S.RESULT && failed), W: W, H: H });
        drew = s3.draw(ctx, W, H);
      } catch (e) { scene3d.drop(); }
    }
    if (!drew) { ctx.fillStyle = "#d9d4c6"; ctx.fillRect(0, 0, W, H); }

    /* すき間が近いときの拡大鏡（当たりそうな所を5倍に） */
    if (drew && hitInfo && g < 0.06 && !failed && !noUI && state !== S.ANGRY && state !== S.INTRO && state !== S.RESULT) {
      var hi = hitInfo, k = canvas.width / W, mag = Math.max(5, Math.min(30, 0.03 / Math.max(0.001, g))), R = 100;
      var dx = hi.near.x - hi.at.x, dy = hi.near.y - hi.at.y, dl = Math.sqrt(dx * dx + dy * dy) || 1;
      var surf = { x: hi.at.x + dx / dl * hi.r, y: hi.at.y + dy / dl * hi.r };
      var c = s3.project({ x: (surf.x + hi.near.x) / 2, y: (surf.y + hi.near.y) / 2, z: 0 }, W, H);
      var cx = W / 2, cy = R + 40;
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      var sw = (R * 2) / mag;
      ctx.drawImage(canvas, (c.x - sw / 2) * k, (c.y - sw / 2) * k, sw * k, sw * k, cx - R, cy - R, R * 2, R * 2);
      ctx.restore();
      ctx.strokeStyle = "#16202e"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.font = "800 28px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
      var txt = (Math.max(0, g) * 1000).toFixed(2) + "mm", tw = ctx.measureText(txt).width + 24;
      ctx.fillStyle = "#fff"; rr(cx - tw / 2, cy + R + 8, tw, 38, 19); ctx.fill();
      ctx.fillStyle = "#16202e"; ctx.fillText(txt, cx, cy + R + 13);
    }

    /* 吹き出し */
    bubbles.forEach(function (b) {
      if (T < b.from || state === S.RESULT || noUI) return;
      var txt = zT(b.ja, b.en), mad = b.ja === "ちょっと！";
      ctx.font = (mad ? "900 44px" : "800 32px") + " sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var w = ctx.measureText(txt).width + 40, bx = b.who === "me" ? W * 0.68 : W * 0.3, by = b.who === "me" ? 70 : 150;   /* 頭にかぶらないよう上に。2人ずらす */
      bx = Math.max(w / 2 + 10, Math.min(W - w / 2 - 10, bx));
      ctx.fillStyle = mad ? "#c0263a" : "#fff";
      rr(bx - w / 2, by - 34, w, 68, 30); ctx.fill();
      ctx.fillStyle = mad ? "#fff" : "#16202e";
      ctx.fillText(txt, bx, by + 2);
    });

    if (state === S.RESULT) drawResult();
  }

  function resultLayout() { return window.zResultActions.showcase(W, H, { sizes: denied ? [80] : failed ? [58] : [104, 50] }); }
  function resultButtons() { return resultLayout().buttons; }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    var L = resultLayout();
    var rows = denied ? [zT("だめでした", "Denied")] : failed ? [zT("後ろの人を倒した", "Knocked out the person behind")] : [score.toFixed(2) + "mm", zT("まで倒した", "left")];
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineJoin = "round"; ctx.strokeStyle = "#16202e";
    rows.forEach(function (t, i) {
      var sz = L.lines[i].size;
      ctx.font = "900 " + sz + "px sans-serif";
      while (ctx.measureText(t).width > W - 30 && sz > 20) { sz -= 2; ctx.font = "900 " + sz + "px sans-serif"; }
      ctx.lineWidth = Math.max(6, sz * 0.12); ctx.strokeText(t, W / 2, L.lines[i].y);
      ctx.fillStyle = failed || denied ? "#ff5a6e" : "#fff"; ctx.fillText(t, W / 2, L.lines[i].y);
    });
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    drawFollow();
  }
  /* ボタンの下に控えめな「作者をフォロー」（押すと X のフォロー画面。上に透明のリンクを重ねる） */
  function followBox() {
    var b = resultButtons()[0], y = b.y + b.h + 10, h = 34;
    ctx.font = "700 18px sans-serif";
    var w = ctx.measureText(zT("作者をフォロー", "Follow the creator")).width + 56;
    return { x: W / 2 - w / 2, y: y, w: w, h: h };
  }
  function drawFollow() {
    var f = followBox(), t = zT("作者をフォロー", "Follow the creator");
    ctx.save();
    /* ほかのボタンと同じ白地・濃い縁で、小さめ */
    rr(f.x, f.y, f.w, f.h, f.h / 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.fillStyle = "#16202e";
    ctx.font = "700 18px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    if (!window.zActionIcon || !window.zActionIcon(ctx, "Xでシェア", f.x + 22, f.y + f.h / 2, 18)) { ctx.font = "900 17px sans-serif"; ctx.fillText("X", f.x + 14, f.y + f.h / 2 + 1); }
    ctx.font = "700 18px sans-serif"; ctx.fillText(t, f.x + 38, f.y + f.h / 2 + 1);
    ctx.restore();
  }

  window.__thumbnail = function () {
    newRound();
    denied = false; bubbles = []; state = S.PLAY; T = 5; held = false;
    while (gapNow(angle) > 0.015 && angle < MAX) angle += 0.01;   /* すき間 約15mm の際どい所 */
    gap = gapNow(angle);
    noUI = true;                                                  /* 吹き出し・拡大鏡・ボタンを消す */
    shareButton.hidden = true;
  };
  window.__probe = {
    now: function () { return { state: state, score: score, angle: angle, contact: contact, gap: gap, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
      held = true;
      if (!await r.until(function () { return gap < 0.006 || state !== S.PLAY; }, 20)) throw Error("倒れない");
      up();
      await r.wait(1500);
    }
  };

  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  angle = 0; lean = -0.18; contact = 20; T = 0; bubbles = []; state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
