<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>カンガルーバトル</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #fff; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* カンガルーバトル

   いつも自分と同じレベルのカンガルーと戦う。毎回レベル1から。
   体は点とばねの簡単な物理。指でなぞると、押した所からのずれのぶんだけ
     前 → 体を乗り出して前の手が伸びる / 下 → かがむ / 後ろ → ガード
   と、おもちゃのように体を引っぱる。グローブが相手に当たったときの勢いがダメージ。
   立って打てば上段、かがんで打てば下段。ガードも立てば上段、かがめば下段で、高さが合うと防げて、
   打った方がはじかれてすきができる（軽い読み合い）。
   勝つと短いレベルアップの演出のあと、すぐ次の（1つ上のレベルの）相手。負けたら結果を出してレベル1に戻る。
   相手の賢さと速さだけがレベルで上がる。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);


  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  function bell(delay) {
    tone(1180, 1.2, 0.16, "sine", null, delay); tone(2950, 0.6, 0.05, "sine", null, delay); tone(1770, 0.9, 0.06, "triangle", null, delay);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ レベル ============ 毎回レベル1から。勝ち抜いた数で上がる */
  var level = 1;

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", FIGHT: "fight", END: "end", LEVELUP: "levelup", RESULT: "result" };
  var state, T, shake = 0, fx = [], sparks = [], before = level, after = level, outcome = "";
  var TIME = 45;
  var GROUND, PANEL, P1X, P2X, FS = 1;
  function place() {
    PANEL = Math.round(H - Math.max(190, H * 0.2));
    FS = Math.min(1.3, Math.max(1, (PANEL - 120) / 420));
    GROUND = Math.min(PANEL - 50, Math.round(H * 0.6));
    P1X = W / 2 - 100 * FS; P2X = W / 2 + 100 * FS;
  }

  /* ============ 体（点とばね） ============
     右向きのときの足元からの位置。左向きは左右を返す。 */
  var REST = { foot: [0, 0], hip: [-15, -85], chest: [12, -190], head: [40, -248], tail: [-135, -6], gf: [62, -196], gb: [46, -214] };
  var NAMES = ["foot", "hip", "chest", "head", "tail", "gf", "gb"];
  var MUSCLE = { foot: 0.5, hip: 0.22, chest: 0.2, head: 0.28, tail: 0.2, gf: 0.3, gb: 0.3 };
  var STICKS = [["foot", "hip"], ["hip", "chest"], ["chest", "head"], ["hip", "tail"]];
  var GLOVE_R = 17;

  function fighter(home, dir, sc) {
    var f = { home: home, dir: dir, sc: sc || FS, slide: 0, hp: 100, ko: false, L: 0, C: 0, cool: { gf: 0, gb: 0 }, hurtT: 0, muscle: 1, hop: 0, P: {}, len: {} };
    NAMES.forEach(function (n) {
      var x = home + REST[n][0] * dir * f.sc, y = GROUND + REST[n][1] * f.sc;
      f.P[n] = { x: x, y: y, px: x, py: y };
    });
    STICKS.forEach(function (s) { f.len[s[0] + s[1]] = dist(f.P[s[0]], f.P[s[1]]); });
    return f;
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  /* 指（相手は頭の中の指）から決まる、各部の行きたい位置 */
  function target(f, n) {
    var L = f.L, C = f.C, o;
    if (n === "foot") o = [0, 0];
    else if (n === "hip") o = [-15 + 30 * L, -85 + 42 * C];
    else if (n === "chest") o = [12 + 95 * L, -190 + 100 * C];
    else if (n === "head") o = [12 + 95 * L + 28 + 10 * L, -190 + 100 * C - 58 + 5 * C];
    else if (n === "tail") o = [-135, -6];
    else if (guarding(f)) {
      /* ガード：立てば顔の前（上段）、かがめばお腹の前（下段） */
      var low = f.C > 0.5, cx0 = 12 + 95 * L, cy0 = -190 + 100 * C;
      o = n === "gf" ? [cx0 + 42, cy0 + (low ? 34 : -62)] : [cx0 + 34, cy0 + (low ? 20 : -48)];
    }
    /* 前の手は伸ばすほど少し下へ弧を描く（かがんだ相手の頭にも届く） */
    else if (n === "gf") o = [12 + 95 * L + 50 + 100 * Math.max(0, L), -190 + 100 * C - 6 - 10 * C + 45 * Math.max(0, L)];
    else o = [12 + 95 * L + 32, -190 + 100 * C - 26];
    var hop = f.hopY || 0;
    /* 足も少し踏み出す・下がる */
    var step = (n === "tail" || n === "foot" ? 1 : 0) * L * 30;
    return { x: f.home + f.slide + (o[0] + step) * f.dir * f.sc, y: GROUND + (o[1] - (n === "foot" ? 0 : 0)) * f.sc - hop };
  }

  /* 後ろへ引いている間はガード。高さはかがみ具合で決まる */
  function guarding(f) { return !f.ko && !(f.stun > 0) && f.L < -0.35; }
  function height(f) { return f.C > 0.5 ? "low" : "high"; }

  var G = 1800, DT = 1 / 60, hitStop = 0, parries = 0;
  function physics(f) {
    var p, n, i;
    for (i = 0; i < NAMES.length; i++) {
      p = f.P[NAMES[i]];
      var vx = (p.x - p.px) * 0.96, vy = (p.y - p.py) * 0.96;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + G * DT * DT;
    }
    var m = f.muscle;
    for (i = 0; i < NAMES.length; i++) {
      n = NAMES[i]; p = f.P[n];
      var t = target(f, n), k = MUSCLE[n] * (n === "foot" ? Math.max(0.05, m) : m);
      p.x += (t.x - p.x) * k; p.y += (t.y - p.y) * k;
    }
    for (var it = 0; it < 4; it++) {
      STICKS.forEach(function (s) { keep(f.P[s[0]], f.P[s[1]], f.len[s[0] + s[1]], f.len[s[0] + s[1]]); });
      /* 腕は伸び縮みする縄（短すぎず、長すぎず） */
      keep(f.P.chest, f.P.gf, 20 * f.sc, 150 * f.sc);
      keep(f.P.chest, f.P.gb, 20 * f.sc, 110 * f.sc);
    }
    for (i = 0; i < NAMES.length; i++) {
      p = f.P[NAMES[i]];
      if (p.y > GROUND) { p.y = GROUND; p.px = p.x - (p.x - p.px) * 0.6; }
      if (p.x < 8) p.x = 8; if (p.x > W - 8) p.x = W - 8;
    }
  }
  function keep(a, b, lo, hi) {
    var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
    var want = d < lo ? lo : d > hi ? hi : d;
    if (want === d) return;
    var k = (d - want) / d * 0.5;
    a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k;
  }

  /* グローブが相手の頭・胸に当たったか。勢い（近づく速さ）でダメージ */
  function hits(a, b) {
    ["gf", "gb"].forEach(function (g) {
      var gl = a.P[g];
      [["head", 24], ["chest", 36], ["hip", 34]].forEach(function (tg) {
        var t = b.P[tg[0]], r = (tg[1] + GLOVE_R) * a.sc;
        var dx = t.x - gl.x, dy = t.y - gl.y, d = Math.hypot(dx, dy);
        if (d >= r || d < 0.001) return;
        var nx = dx / d, ny = dy / d;
        var vx = ((gl.x - gl.px) - (t.x - t.px)) / DT, vy = ((gl.y - gl.py) - (t.y - t.py)) / DT;
        var vn = vx * nx + vy * ny;
        /* 重なりを押し戻す */
        var over = r - d;
        gl.x -= nx * over * 0.5; gl.y -= ny * over * 0.5;
        t.x += nx * over * 0.5; t.y += ny * over * 0.5;
        if (vn < 300 || a.cool[g] > 0 || b.ko || a.ko || a.stun > 0) return;
        a.cool[g] = 0.25;
        /* 上段・下段とガードの高さが合えば防がれ、打った方がはじかれてすきができる */
        if (guarding(b) && height(b) === height(a)) {
          b.hp -= 0.5;
          a.hurtT = 0.3;
          a.stun = 0.6; a.slide -= nx * 40;
          fx.push({ x: gl.x + nx * 12, y: gl.y + ny * 12, t: 0, big: false, guard: true, ang: Math.atan2(ny, nx) });
          parrySound(); parries++;
          hitStop = 0.09; shake = Math.max(shake, 0.12);
          return;
        }
        var head = tg[0] === "head";
        var dmg = Math.min(16, (vn - 300) / 50 * (head ? 1.2 : 0.6) + (head ? 2 : 1));
        b.hp -= dmg; b.hurtT = 0.25;
        /* 当たった勢いで相手の体を押す */
        t.px -= nx * vn * DT * 0.6; t.py -= ny * vn * DT * 0.6;
        b.slide += nx * vn * 0.03;
        var big = dmg > 10;
        fx.push({ x: gl.x + nx * 18, y: gl.y + ny * 18, t: 0, big: big });
        shake = Math.max(shake, big ? 0.25 : 0.1);
        punchSound(dmg / 16);
        if (big) hitStop = Math.max(hitStop, 0.05);
        if (b.hp <= 0) { b.hp = 0; knockOut(b); }
      });
    });
  }
  /* パリィの音：澄んだ金属の「キィン」。高い倍音を少しずらして重ね、長めに響かせる */
  function parrySound() {
    if (!AC) return;
    [[2093, 0.5, 0.11], [3136, 0.42, 0.07], [4699, 0.3, 0.05], [6272, 0.18, 0.03]].forEach(function (p) {
      tone(p[0], p[1], p[2], "sine");
      tone(p[0] * 1.006, p[1] * 0.9, p[2] * 0.6, "sine");
    });
    tone(1046, 0.25, 0.06, "triangle", 1568);
    noiseHit(0.05, 6000, 0.25, 0.7);
    tone(120, 0.12, 0.18, "sine", 60);
  }
  /* 殴った音：革の「バシッ」（短い高めの破裂）と、体に響く「ドスッ」（低く沈む音）を重ねる。
     p は強さ 0〜1。強いほど低音が厚く長い */
  function punchSound(p) {
    if (!AC) return;
    p = Math.max(0, Math.min(1, p));
    noiseHit(0.035, 3200, 0.35 + p * 0.2, 0.6);
    noiseHit(0.07 + p * 0.05, 1100, 0.5 + p * 0.3, 0.7);
    noiseHit(0.12 + p * 0.12, 380, 0.45 + p * 0.4, 0.9);
    tone(170 + p * 20, 0.16 + p * 0.18, 0.28 + p * 0.2, "sine", 48);
    if (p > 0.5) tone(70, 0.35, 0.25 * p, "sine", 35);
  }
  function knockOut(f) {
    f.ko = true; f.muscle = 0; f.C = 0;
    endFight();
  }
  function bodies(a, b) {
    /* 胸どうし・腰どうしは重ならない */
    [["chest", 40], ["hip", 44], ["head", 26]].forEach(function (e) {
      var p = a.P[e[0]], q = b.P[e[0]], r = e[1] * 2 * a.sc, d = dist(p, q);
      if (d < r && d > 0.001) { var k = (r - d) / d * 0.5, dx = q.x - p.x, dy = q.y - p.y; p.x -= dx * k; p.y -= dy * k; q.x += dx * k; q.y += dy * k; }
    });
  }
  function stepFighter(f, dt) {
    if (f.stun > 0) { f.stun -= dt; f.L = -0.5; f.C = 0; }
    f.cool.gf = Math.max(0, f.cool.gf - dt); f.cool.gb = Math.max(0, f.cool.gb - dt);
    f.hurtT = Math.max(0, f.hurtT - dt);
    f.slide *= Math.pow(0.1, dt);
    f.hop += dt;
    physics(f);
  }

  var me, foe, ai;
  function newRound() {
    level = 1;
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    fx = []; sparks = []; shake = 0; drag = null;
    nextBout();
  }
  /* 次の試合。演出なしですぐ始まる */
  function nextBout() {
    state = S.FIGHT; T = 0; fightT = 0;
    me = fighter(P1X, 1); foe = fighter(P2X, -1);
    ai = { L: 0, C: 0, goalL: 0, goalC: 0, think: 0.6, punchT: 0, react: null, guardFor: 0 };
    before = after = level; outcome = "";
  }

  /* ============ 相手（同じレベル） ============
     頭の中の指を動かす速さ・こちらの踏み込みに気づく速さと確かさがレベルで上がる。 */
  function cpuSkill() {
    return {
      delay: Math.max(0.08, 0.45 - (level - 1) * 0.03),
      sure: Math.min(0.92, 0.25 + (level - 1) * 0.05),
      pace: Math.max(0.35, 1.1 - (level - 1) * 0.04),
      speed: 7 + Math.min(10, (level - 1) * 0.5)
    };
  }
  function stepCpu(dt) {
    var k = cpuSkill();
    if (foe.ko || foe.stun > 0) { ai.L = foe.L; ai.C = foe.C; return; }
    /* こちらの前の手が速く近づいてきたら、高さを読んでガード（レベルが高いほど速く確か） */
    var g = me.P.gf, lunge = (g.x - g.px) / DT * me.dir;
    if (!ai.react && lunge > 450 && ai.guardFor <= 0 && ai.punchT <= 0 && Math.random() < 0.35 + k.sure * 0.4) {
      var right = Math.random() < k.sure;
      ai.react = { t: k.delay, low: (height(me) === "low") === right };
    }
    if (ai.react) {
      ai.react.t -= dt;
      if (ai.react.t <= 0) { ai.guardFor = 0.5; ai.guardLow = ai.react.low; ai.react = null; }
    }
    if (ai.guardFor > 0) { ai.guardFor -= dt; ai.goalL = -0.7; ai.goalC = ai.guardLow ? 0.85 : 0; }
    else if (ai.punchT > 0) { ai.punchT -= dt; ai.goalL = 1; ai.goalC = ai.punchLow ? 0.85 : 0; }
    else {
      ai.goalC = 0; ai.goalL = -0.15 + Math.sin(T * 3) * 0.12;
      ai.think -= dt;
      /* こちらがすきだらけなら狙う */
      if (me.stun > 0 && Math.random() < k.sure) ai.think = Math.min(ai.think, k.delay);
      if (ai.think <= 0) { ai.think = k.pace * (0.5 + Math.random()); ai.punchT = 0.2; ai.punchLow = Math.random() < 0.4; }
    }
    var sp = k.speed * dt;
    ai.L += Math.max(-sp, Math.min(sp, ai.goalL - ai.L));
    ai.C += Math.max(-sp, Math.min(sp, ai.goalC - ai.C));
    foe.L = ai.L; foe.C = ai.C;
  }

  function endFight() {
    if (state !== S.FIGHT) return;
    state = S.END; T = 0;
    if (me.hp > foe.hp) { outcome = "win"; after = level + 1; }
    else if (me.hp < foe.hp) { outcome = "lose"; after = 1; }
    else { outcome = "draw"; after = level; }
    if (outcome === "lose") { bell(0); bell(0.25); bell(0.5); }
  }

  /* ============ 進行 ============ */
  var drag = null, keyL = 0, keyC = 0, fightT = 0;
  function update(dt) {
    T += dt;
    shake = Math.max(0, shake - dt);
    for (var i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t > (fx[i].guard ? 0.4 : 0.22)) fx.splice(i, 1); }
    /* 防いだ瞬間だけ、ほんの少し止める */
    if (hitStop > 0) { hitStop -= dt; return; }
    for (var si = sparks.length - 1; si >= 0; si--) { var sp = sparks[si]; sp.t += dt; sp.y += sp.vy * dt; if (sp.t > 1.2) sparks.splice(si, 1); }
    if (state === S.INTRO) { me.L = Math.sin(T * 2) * 0.1; stepFighter(me, dt); stepFighter(foe, dt); return; }
    if (state === S.FIGHT) {
      fightT += dt;
      /* 指のずれがそのまま体の引っぱり */
      if (drag) { me.L = Math.max(-1, Math.min(1, drag.dx / 90)); me.C = Math.max(0, Math.min(1, drag.dy / 90)); }
      else { me.L += (keyL - me.L) * Math.min(1, dt * 14); me.C += (keyC - me.C) * Math.min(1, dt * 14); }
      stepCpu(dt);
      stepFighter(me, dt); stepFighter(foe, dt);
      bodies(me, foe);
      hits(me, foe); hits(foe, me);
      if (fightT >= TIME && state === S.FIGHT) endFight();
      return;
    }
    if (state === S.END) {
      me.L *= 0.9; me.C *= 0.9; if (!foe.ko) { foe.L *= 0.9; foe.C *= 0.9; }
      stepFighter(me, dt); stepFighter(foe, dt); bodies(me, foe);
      if (outcome === "win" && T > 0.6) { level = after; state = S.LEVELUP; T = 0; levelUpSound(); }
      else if (outcome === "draw" && T > 0.6) nextBout();
      else if (outcome === "lose" && T > 1.4) { level = after; state = S.RESULT; tone(330, 0.3, 0.1, "triangle", 220); }
      return;
    }
    if (state === S.LEVELUP) {
      me.hopY = Math.abs(Math.sin(T * 6)) * 30;
      stepFighter(me, dt); stepFighter(foe, dt);
      if (Math.random() < dt * 40) sparks.push({ x: me.P.chest.x + (Math.random() - 0.5) * 220, y: GROUND - Math.random() * 40, vy: -200 - Math.random() * 260, t: 0 });
      if (T > 1.3) { me.hopY = 0; nextBout(); }
      return;
    }
    if (state === S.RESULT) { stepFighter(me, dt); stepFighter(foe, dt); }
  }
  function levelUpSound() {
    [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, i === 6 ? 0.6 : 0.14, 0.11, "square", null, i * 0.09); });
    tone(1568, 0.8, 0.06, "triangle", null, 0.66);
  }

  /* ============ 入力 ============

  function down(x, y) {

  function move(x, y) {

  function up() { drag = null; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }

  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y); });

  window.addEventListener("blur", function () { up(); keyL = keyC = 0; });

  /* 本番以外だけ、数字キーで場面を飛ばせる */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function toFight() { newRound(); }
  function debugKey(n) {
    if (n === 1) { if (state !== S.FIGHT) toFight(); foe.hp = 0; knockOut(foe); }
    if (n === 2) { if (state !== S.FIGHT) toFight(); me.hp = 0; knockOut(me); }
    if (n === 3) { level += 10; before = after = level; }
    if (n === 4) { level = 1; before = after = level; }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }

    var esc = k === "Escape";
    var go = e.code === "Space" || k === " " || k === "Enter";
    var fw = k === "ArrowRight" || k === "d" || k === "D", bk = k === "ArrowLeft" || k === "a" || k === "A";

  window.addEventListener("keyup", function (e) {

    if (k === "ArrowDown" || k === "s" || k === "S") keyC = 0;
    if ((e.code === "Space" || k === " " || k === "Enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    var text;
    if (before > 1) text = zT("Lv." + before + "まで勝ち上がったカンガルー", "My kangaroo fought its way up to Lv." + before);
    else text = zT("Lv.1のカンガルーに負けた", "Lost to a Lv.1 kangaroo");
    window.zResultActions.x({ text: text + zT(" #カンガルーバトル", " #KangarooBattle") });
  }

  /* ============ 描画 ============ */
  var INK = "#141414";
  function stroke(w) { ctx.lineWidth = w || 4; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.lineCap = "round"; }
  function blob(fn, fill) { ctx.beginPath(); fn(); ctx.fillStyle = fill || "#fff"; ctx.fill(); ctx.stroke(); }
  function ell(x, y, rx, ry, rot) { ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); }

  /* 物理の点からカンガルーを描く（線画） */
  function drawRoo(f, ox, oy, tag) {
    var P = f.P, d = f.dir, s = f.sc;
    ctx.save();
    ctx.translate(ox || 0, oy || 0);
    if (f.hurtT > 0) ctx.translate(-8 * d * Math.sin(f.hurtT * 60), 0);
    stroke(4 * Math.min(1, s));
    function arm(g) {
      var sx = P.chest.x + (P.head.x - P.chest.x) * 0.25, sy = P.chest.y + (P.head.y - P.chest.y) * 0.25, e = P[g];
      ctx.lineWidth = 15 * s; ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(e.x, e.y); ctx.stroke();
      ctx.lineWidth = 9 * s; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(e.x, e.y); ctx.stroke();

      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(e.x - 8 * d * s, e.y - 10 * s); ctx.lineTo(e.x - 8 * d * s, e.y + 10 * s); ctx.stroke();

    }
    arm("gb");
    /* しっぽ：腰から先へ細くなる */
    var hx = P.hip.x, hy = P.hip.y, tx = P.tail.x, ty = P.tail.y;

    blob(function () { ell(6, -38, 9, 24, 0.2); });

    ctx.fillStyle = INK; ctx.lineWidth = 3;
    if (f.ko) { ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(20, -2); ctx.moveTo(20, -10); ctx.lineTo(10, -2); ctx.stroke(); }
    else if (f.hurtT > 0) { ctx.beginPath(); ctx.moveTo(10, -9); ctx.lineTo(20, -5); ctx.lineTo(10, -1); ctx.stroke(); }

  }
  function drawTag(x, y, text, sc) {

  }

  var dotLayer = null;
  function drawBackground() {
    ctx.fillStyle = "#fbfaf6"; ctx.fillRect(0, 0, W, H);
    /* 戦っている間は集中線 */
    if (state === S.FIGHT || state === S.END) {
      ctx.save();

    }

    ctx.fillStyle = "#e9e6dc"; ctx.fillRect(0, GROUND, W, PANEL - GROUND);

  }
  function drawHud() {
    var y = 26, bw = 200, bh = 22;
    [[me, 20, 1], [foe, W - 20 - bw, -1]].forEach(function (e) {
      var f = e[0], x = e[1];
      stroke(3); ctx.fillStyle = "#fff"; ctx.fillRect(x, y, bw, bh); ctx.strokeRect(x, y, bw, bh);

    });

    ctx.fillStyle = INK; ctx.font = "900 24px sans-serif"; ctx.textBaseline = "top";
    ctx.textAlign = "left"; ctx.fillText("Lv." + before, 20, y + bh + 8);
    ctx.textAlign = "right"; ctx.fillText("Lv." + before, W - 20, y + bh + 8);
    ctx.font = "900 34px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(String(Math.max(0, Math.ceil(TIME - fightT))), W / 2, y - 6);
  }
  /* パリィ：白く光る輪が広がり、はじいた向きに火花が散る */
  function drawParry(e) {
    var k = e.t / 0.4, r = 18 + k * 90;
    ctx.save(); ctx.translate(e.x, e.y);
    if (k < 0.25) { ctx.fillStyle = "rgba(255,255,255," + (1 - k * 4) + ")"; ctx.beginPath(); ctx.arc(0, 0, 46, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1 - k;

    }
    ctx.restore();
  }
  function drawFx() {
    fx.forEach(function (e) {
      if (e.guard) { drawParry(e); return; }

      ctx.save(); ctx.translate(e.x, e.y);

  }

  function draw() {
    var res = state === S.RESULT;
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, res);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 40, (Math.random() - 0.5) * shake * 30);
    drawBackground();
    if (state === S.LEVELUP) drawRays();
    drawRoo(foe, 0, 0, null);
    drawRoo(me, 0, 0, null);
    drawFx();
    if (state !== S.RESULT) drawHud();
    ctx.restore();
    if (state === S.FIGHT && drag) drawFinger();
    if (state === S.LEVELUP) drawLevelUp();
    if (res) drawResult();
  }

  /* 指の押した所と今の所（おもちゃの操作棒） */
  function drawFinger() {
    ctx.save();
    ctx.strokeStyle = "rgba(128,128,128,.7)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(drag.x0, drag.y0, 34, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(drag.x0, drag.y0); ctx.lineTo(drag.x, drag.y); ctx.stroke();
    ctx.fillStyle = "rgba(128,128,128,.8)"; ctx.beginPath(); ctx.arc(drag.x, drag.y, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  /* レベルアップ：後光・舞い上がる光・札の数字が跳ねて変わる */
  function drawRays() {
    var cx = me.P.chest.x, cy = me.P.chest.y + 20;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(T * 0.6);
    for (var i = 0; i < 16; i++) {
      ctx.rotate(Math.PI / 8);
      ctx.fillStyle = i % 2 ? "rgba(255,214,64,.55)" : "rgba(255,240,170,.45)";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -70); ctx.lineTo(900, 70); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawLevelUp() {
    var k = Math.min(1, T / 0.25);
    if (T < 0.25) { ctx.fillStyle = "rgba(255,255,255," + (1 - k) + ")"; ctx.fillRect(0, 0, W, H); }

  }

  /* 結果画面（doji5 の形）。負けたときだけ。たどり着いたレベルだけを出す */
  function resultButtons() { return window.zResultActions.row(W, H * 0.6); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }

    ctx.fillStyle = "rgba(10,10,10,.62)"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";

    ctx.fillText("Lv." + before, W / 2, H * 0.48);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
  }


  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { parries: parries, state: state, level: level, before: before, after: after, outcome: outcome, me: me && { hp: me.hp, L: me.L, C: me.C, head: [me.P.head.x, me.P.head.y], gf: [me.P.gf.x, me.P.gf.y] }, foe: foe && { hp: foe.hp, ko: foe.ko, head: [foe.P.head.x, foe.P.head.y] }, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },

  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
