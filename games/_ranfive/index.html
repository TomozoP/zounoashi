<script>
/* 運任戦士ランダムファイブ
   5人が1人ずつ登場し、色ガチャ（約100色）で色と名前が決まる。
   強そう・メジャーな色ほどレア（SR）、地味な色はコモン（C）。
   5人そろったら名乗り → 戦闘力の合計で怪人と戦って終わる。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  var talking = null;
  /* 色ごとの声色：明るい色ほど高い声、色ごとに速さ・抑揚も変える */
  function voiceOf(idx) {
    var l = lum(cHex(idx)), s = (idx * 7919) % 97;
    return { pitch: 105 + l * 200 + (s % 40), mora: 0.08 + (s % 6) * 0.012, swing: 0.5 + (s % 8) * 0.22 };
  }
  function sayAs(yomi, idx, delay, vol) {
    if (!AC || !window.zVoice) return null;
    var v = voiceOf(idx);
    return window.zVoice.speak(AC, AC.currentTime + 0.02 + (delay || 0), v.pitch, window.zVoice.kana(yomi, v.mora), { noise: NOISE, volume: vol || 0.4, swing: v.swing });
  }

  /* ============ BGM（自作の節。既存曲はなぞらない） ============
     イ短調の Am-F-G-E を16分で刻む。ベースは8分のオクターブ、上は自作の短い動機 */
  var BGM = { on: false, next: 0, step: 0, gain: null };
  var STEP = 60 / 152 / 4;
  var CH = [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]];   /* A4 からの半音：Am F G E */
  var MEL = [
    [0, null, 3, null, 7, null, 3, 5, 7, null, null, 10, 7, null, 5, null],
    [8, null, 7, null, 5, null, 3, null, 5, null, 3, 0, 3, null, null, null],
    [7, null, 10, null, 12, null, 10, 7, 5, null, 7, null, 10, null, null, null],
    [11, null, 8, null, 7, null, 4, null, 2, null, 4, null, -1, null, null, null]
  ];
  function nf(semi) { return 440 * Math.pow(2, semi / 12); }
  function note(f, t, dur, vol, type, dest) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  function bgmStart() {
    if (!AC || BGM.on) return;
    BGM.gain = AC.createGain(); BGM.gain.gain.value = 0.32; BGM.gain.connect(AC.destination);
    BGM.on = true; BGM.next = AC.currentTime + 0.08; BGM.step = 0;
  }
  function bgmStop() {
    if (!BGM.on) return;
    BGM.on = false;
    try { BGM.gain.gain.setTargetAtTime(0.0001, AC.currentTime, 0.15); } catch (e) {}
  }
  function bgmTick() {
    if (!BGM.on || !AC) return;
    if (BGM.next < AC.currentTime - 0.5) BGM.next = AC.currentTime + 0.05;   /* 止まっていたら追いつかせない */
    while (BGM.next < AC.currentTime + 0.2) {
      var s = BGM.step % 64, bar = s >> 4, i = s & 15, t = BGM.next, d = BGM.gain, ch = CH[bar];
      if (i % 2 === 0) note(nf(ch[0] - 24 + (i % 4 ? 12 : 0)), t, STEP * 1.8, 0.22, "triangle", d);
      if (i === 0 || i === 6 || i === 10) ch.forEach(function (c) { note(nf(c - 12), t, STEP * 1.6, 0.05, "sawtooth", d); });
      var m = MEL[bar][i];
      if (m != null) note(nf(m), t, STEP * 1.7, 0.07, "square", d);
      if (i % 4 === 0 && NOISE) {        /* キック */
        note(110, t, 0.12, 0.35, "sine", d);
      }
      if (i % 2 === 1 && NOISE) {        /* ハイハット */
        var sb = AC.createBufferSource(); sb.buffer = NOISE;
        var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7000;
        var g = AC.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
        sb.connect(hp); hp.connect(g); g.connect(d); sb.start(t, Math.random()); sb.stop(t + 0.06);
      }
      BGM.step++; BGM.next += STEP;
    }
  }

  function say(yomi, pitch, mora) {
    if (!AC || !window.zVoice) return;
    try { if (talking) talking.stop(); } catch (e) {}
    talking = window.zVoice.speak(AC, AC.currentTime + 0.02, pitch || 190, window.zVoice.kana(yomi, mora || 0.1), { noise: NOISE, volume: 0.4, swing: 1.3 });
  }
  function celebrate(kind) { if (AC && window.zCelebrate) window.zCelebrate.play(AC, kind, { volume: 0.8 }); }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 色ガチャ ============ */
  var COLORS = window.RF_COLORS;
  var POOL = { SR: [], R: [], C: [] };
  COLORS.forEach(function (c, i) { POOL[c[0]].push(i); });
  var RATE = { SR: 0.07, R: 0.28 };                 /* 残りがコモン */
  var POWER = { SR: [1500, 2500], R: [300, 700], C: [30, 150] };
  var BOSS = 2000;                                  /* 怪人の戦闘力 */
  var forceRare = null;                             /* デバッグ: 次に引くレア度 */
  function rollRarity(noForce) {
    if (forceRare && !noForce) { var f = forceRare; forceRare = null; return f; }
    var r = Math.random();
    return r < RATE.SR ? "SR" : r < RATE.SR + RATE.R ? "R" : "C";
  }
  function pull(idx) {
    if (forceRare) { var fl = POOL[rollRarity()]; idx = fl[Math.floor(Math.random() * fl.length)]; }
    if (idx == null) { var list = POOL[rollRarity()]; idx = list[Math.floor(Math.random() * list.length)]; }
    var rare = COLORS[idx][0];
    var p = POWER[rare];
    var power = Math.round((p[0] + Math.random() * (p[1] - p[0])) / 10) * 10;
    if (COLORS[idx][4] === "rainbow") power = 3000;
    return { idx: idx, rare: rare, power: power };
  }
  /* 名前は「ランダム○○」。「色」は付けずカタカナ（読みから作る） */
  function yomiOf(i) { return COLORS[i][2].replace(/いろ$/, ""); }
  function kata(s) { return s.replace(/[ぁ-ゖ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) + 0x60); }); }
  function cName(i) { var c = COLORS[i]; return zT("ランダム" + kata(yomiOf(i)), "Random " + c[3]); }
  function cHex(i) { return COLORS[i][4]; }
  function lum(hex) {
    if (hex === "rainbow") return 0.6;
    var n = parseInt(hex.slice(1), 16);
    return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, heroes, cur, sub, pt, T, total, win, reel, shake, parts;
  var confetti = window.zCelebrate ? window.zCelebrate.confetti() : null;
  if (confetti) confetti.rain = false;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    heroes = [];
    cur = 0; total = 0; win = false; shake = 0; parts = []; leaving = [];
    T = 0;
    if (confetti) confetti.clear();
    bgmStop(); bgmStart();
    startHero();
  }
  function setSub(s) { sub = s; pt = 0; }
  function startHero() {
    heroes[cur] = { g: null, shown: false, pose: 0, paint: 0, x: W + 120, done: false };
    setSub("enter");
    noiseHit(0.25, 900, 0.18, 0.8);
  }

  /* 色のリール。チップが左へ流れ、止めると目当ての色がまん中に来る */
  var CHIP = 104;
  function startReel() {
    var seq = [];
    /* 並ぶ色はレア度の確率どおりに引いておく。止めたときまん中にある色がそのまま当たり */
    for (var i = 0; i < 600; i++) { var l = POOL[rollRarity(true)]; seq.push(l[Math.floor(Math.random() * l.length)]); }
    reel = { seq: seq, pos: 0, speed: 14, stopping: false, lastTick: 0 };
  }
  function stopReel() {
    if (!reel || reel.stopping) return;
    var h = heroes[cur];
    /* 滑りなし：押した時点でまん中にある色で確定 */
    var k = Math.round(reel.pos);
    reel.pos = k;
    h.g = pull(reel.seq[k % reel.seq.length]);
    reel.seq[k % reel.seq.length] = h.g.idx;
    reel.stopping = true;
    tone(520, 0.06, 0.12, "square");
    reveal();
  }

  function easeOut(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
  function ease(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

  /* ============ 進行 ============ */
  function update(dt) {
    if (confetti) confetti.step(dt, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {

  /* 戦士。足元(x,y)、大きさ s（1 で高さ約250）。pose 0=立ち 1=名乗りポーズ。paint 0〜1 で下から色が付く */

  function drawHero(x, y, s, idx, pose, paint, rot, flip) {

  function heroBody(col, acc, p) {
    var OL = "#16202e";

    /* 関節の位置 */

    var elbow = [[lerp(-44, -46, p), lerp(-130, -140, p)], [lerp(44, 56, p), lerp(-130, -196, p)]];
    var hip = [[-15, -96], [15, -96]];
    var knee = [[lerp(-19, -30, p), -50], [lerp(19, 30, p), -50]];
    var foot = [[lerp(-21, -44, p), -6], [lerp(21, 44, p), -6]];

    else if (sub === "group") drawGroup();
    else if (sub === "fight" || state === S.RESULT) drawFight();
    else drawPulls();

    drawParts("puff");
    ctx.restore();
    if (confetti) confetti.draw(ctx);
    if (state === S.RESULT) drawResult();
  }

  function drawIntro() {
    var s = Math.min(0.62, H * 0.2 / 250);
    for (var i = 0; i < 5; i++) {
      var x = W * (0.14 + 0.18 * i), y = H * (i === 2 ? 0.8 : 0.77);
      drawHero(x, y, s * (i === 2 ? 1.08 : 1), null, 1, 0, 0, i < 2);
    }
    outlined(zT("運任戦士", "RANDOM", "운명전사", "运任战士", "運任戰士"), W / 2, H * 0.22, 78, "#ffd400");
    outlined(zT("ランダムファイブ", "FIVE", "랜덤파이브", "随机五人组", "隨機五人組"), W / 2, H * 0.33, 70, "#fff");
  }

  function drawPulls() {
    /* 並んだ人 */
    for (var i = 0; i < 5; i++) {
      var h = heroes[i];
      if (h && h.done) { drawHero(slotX(i), lineY(), BIG() * SMALL, h.g.idx, 1, 1, 0, SLOT[i] < 2); nameTag(slotX(i), lineY() + 3, h.g.idx, 20); }
      else if (!h || i > cur) {
        ctx.fillStyle = "rgba(22,32,46,.18)";
        ctx.beginPath(); ctx.ellipse(slotX(i), lineY() - 4, 26, 8, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    var bs = BIG(), fy = H * 0.76;
    leaving.forEach(function (L) {
      var t = ease(L.t / 0.3), g = heroes[L.i];
      drawHero(lerp(W / 2, slotX(L.i), t), lerp(fy, lineY(), t), lerp(bs, bs * SMALL, t), g.g.idx, 1, 1, 0, SLOT[L.i] < 2);
    });
    var h = heroes[cur]; if (!h) return;
    if (sub === "line") {
      var t = ease(pt / 0.25);
      drawHero(lerp(W / 2, slotX(cur), t), lerp(fy, lineY(), t), lerp(bs, bs * SMALL, t), h.g.idx, 1, 1, 0, SLOT[cur] < 2);
      return;
    }
    if ((sub === "paint" || sub === "show") && h.g) {
      var r = h.g.rare, a = Math.min(1, (sub === "paint" ? pt / 0.35 : 1));
      if (r === "SR") { ctx.globalAlpha = a; rays(W / 2, fy - bs * 130, W, "rgba(255,214,64,.42)", T * 0.4, 14); ctx.globalAlpha = 1; }
      else if (r === "R") { ctx.globalAlpha = a; rays(W / 2, fy - bs * 130, W * 0.7, "rgba(120,180,255,.3)", 0.2, 12); ctx.globalAlpha = 1; }
    }
    var hop = sub === "enter" ? -Math.sin(Math.min(1, pt / 0.3) * Math.PI) * 60 : 0;
    ctx.fillStyle = "rgba(60,45,30,.25)";
    ctx.beginPath(); ctx.ellipse(h.x, fy - 2, 60 * bs, 12 * bs, 0, 0, Math.PI * 2); ctx.fill();
    drawHero(h.x, fy + hop, bs, h.g ? h.g.idx : null, h.pose, h.g && sub !== "spin" ? h.paint : 0, 0, false);
    if (sub === "spin") drawReel();
    if ((sub === "paint" || sub === "show") && h.g) {
      var k = easeOut((sub === "show" ? pt + 0.2 : pt) / 0.2);
      ctx.save();
      ctx.translate(W / 2, H * 0.15); ctx.scale(0.6 + 0.4 * k, 0.6 + 0.4 * k);
      ctx.globalAlpha = Math.min(1, k * 1.5);
      badge(0, -40, h.g.rare, 1);
      var hex = cHex(h.g.idx);
      ctx.fillStyle = fillOf(hex, -W / 2, 0, W / 2, 0);
      roundRect(-W / 2 + 16, -8, W - 32, 76, 20); ctx.fill();
      ctx.strokeStyle = "#16202e"; ctx.lineWidth = 5; ctx.stroke();
      outlined(cName(h.g.idx), 0, 30, 54, "#fff");
      outlined(zT("戦闘力 ", "Power ", "전투력 ", "战斗力 ", "戰鬥力 ") + h.g.power, 0, 104, 34, "#fff", 800);
      ctx.restore();
    }
  }

  function groupPos(i) {
    var q = SLOT[i], mid = q === 2;
    return { x: posX(i), y: H * (mid ? 0.72 : 0.69 - Math.abs(q - 2) * 0.012), s: BIG() * (mid ? 0.6 : 0.52) };
  }
  function drawGroup() {
    var k = ease(pt / 0.5);
    for (var i = 0; i < 5; i++) {
      var g = groupPos(i), h = heroes[i];
      var gx = lerp(slotX(i), g.x, k), gy = lerp(lineY(), g.y, k);
      drawHero(gx, gy, lerp(BIG() * SMALL, g.s, k), h.g.idx, 1, 1, 0, SLOT[i] < 2);
      nameTag(gx, gy + 3, h.g.idx, lerp(20, 22, k));
    }
    if (pt > 1.2) {
      var a = easeOut((pt - 1.2) / 0.4);
      ctx.save(); ctx.globalAlpha = a;
      outlined(zT("運任戦士", "RANDOM", "운명전사", "运任战士", "運任戰士"), W / 2, H * 0.17, 72, "#ffd400");
      /* 「ランダムファイブ」は左から、その位置に立つ戦士の色で塗り分ける */
      var label = zT("ランダムファイブ", "FIVE", "랜덤파이브", "随机五人组", "隨機五人組");
      ctx.font = "900 66px sans-serif";
      var tw = Math.min(ctx.measureText(label).width, W - 30), x0 = W / 2 - tw / 2;
      var gr = ctx.createLinearGradient(x0, 0, x0 + tw, 0);
      for (var q = 0; q < 5; q++) {
        var hx = cHex(heroes[SLOT.indexOf(q)].g.idx);
        if (hx === "rainbow") hx = "#ff7a00";
        gr.addColorStop(q / 5, hx); gr.addColorStop((q + 1) / 5 - 0.001, hx);
      }
      outlined(label, W / 2, H * 0.27, 66, gr);
      ctx.restore();
    }
    if (pt > 2.0) {
      var c = Math.round(total * easeOut((pt - 2.0) / 0.9));
      outlined(zT("戦闘力 ", "Power ", "전투력 ", "战斗力 ", "戰鬥力 ") + c, W / 2, H * 0.88, 52, "#fff");
    }
  }

  function drawFight() {
    var f = state === S.RESULT ? 9 : pt;
    var my = H * 0.3, ms = Math.min(1, H * 0.26 / 300);
    var drop = easeOut(f / 0.6);
    var gone = win && fightHit ? Math.min(1, (f - 3.4) / 0.6) : 0;
    if (gone < 1 && state !== S.RESULT) {
      ctx.save(); ctx.globalAlpha = 1 - gone;
      drawMonster(W / 2, lerp(-200, my, drop) + gone * 30, ms * (1 - gone * 0.3), fightHit && win);
      ctx.restore();
    }
    if (!(win && fightHit) && state !== S.RESULT) outlined(zT("戦闘力 ", "Power ", "전투력 ", "战斗力 ", "戰鬥力 ") + BOSS, W / 2, my + 175 * ms, 36, "#ffe14d", 800);
    /* 戦士 */
    var knocked = !win && fightHit ? easeOut((f - 3.4) / 0.5) : 0;
    for (var i = 0; i < 5; i++) {
      var q = SLOT[i], x = posX(i), y = H * 0.84, s = BIG() * 0.46;
      /* 負けたら内側へ倒れる（画面からはみ出さない） */
      drawHero(x, y - knocked * 26, s, heroes[i].g.idx, 1, 1, (q > 2 ? -1 : 1) * knocked * 1.35, q < 2);
    }
    /* 色名は倒れた体に隠れないよう最後に重ねる */
    for (var n = 0; n < 5; n++) nameTag(posX(n), H * 0.84 + 4, heroes[n].g.idx, 22);
    if (state !== S.RESULT) outlined(zT("戦闘力 ", "Power ", "전투력 ", "战斗力 ", "戰鬥力 ") + total, W / 2, H * 0.6, 44, "#fff", 800);
    /* ビーム：5色が集まって怪人へ */
    if (f > 2.6 && f < 3.4) {
      var t = (f - 2.6) / 0.8;
      var gx = W / 2, gy = lerp(H * 0.66, my, t);
      for (var j = 0; j < 5; j++) {
        var sx = posX(j), sy = H * 0.84 - BIG() * 0.46 * 200;
        ctx.strokeStyle = fillOf(cHex(heroes[j].g.idx), sx, sy, gx, gy); ctx.lineWidth = 12; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(gx, gy); ctx.stroke();
      }
      var rr = 26 + total / 120;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(gx, gy, Math.min(70, rr), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffd400"; ctx.lineWidth = 6; ctx.stroke();
    }
    if (!win && fightHit && f < 4.3) {
      var b = (f - 3.4) / 0.9;
      ctx.fillStyle = "rgba(255,255,255," + (1 - b) + ")";
      ctx.beginPath(); ctx.arc(W / 2 + b * 260, my + b * 120, Math.max(1, 30 * (1 - b)), 0, Math.PI * 2); ctx.fill();
    }
  }

  function resultButtons() { return window.zResultActions.row(W, H * 0.44); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    /* 暗くせず、場面の上に縁取り文字で出す */
    outlined(win ? zT("勝利", "WIN", "승리", "胜利", "勝利") : zT("敗北", "LOSE", "패배", "败北", "敗北"), W / 2, H * 0.11, 60, win ? "#ffd400" : "#c9c4bb");
    outlined(zT("戦闘力", "Power", "전투력", "战斗力", "戰鬥力"), W / 2, H * 0.19, 30, "#fff", 800);
    outlined(String(total), W / 2, H * 0.28, 104, "#fff", 900);
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  window.__probe = {
    now: function () { return { state: state, sub: sub, score: total, win: win, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null, names: heroes ? heroes.map(function (h) { return h && h.g ? cName(h.g.idx) : null; }) : [] }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { shareButton.hidden = true; }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      for (var n = 0; n < 5; n++) { await r.wait(1200); r.key(); }
      if (!await r.until(function () { return state === S.RESULT; }, 60)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now(), stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
