<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>逆・作業支援ツール</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #d8cab2; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 逆・作業支援ツール

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null, OUT = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor(); OUT.threshold.value = -20; OUT.ratio.value = 6;
    var mg = AC.createGain(); mg.gain.value = 0.8; OUT.connect(mg); mg.connect(OUT);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", DONE: "done", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var progress, popups, nextSpawn, disturb, doneT, shake, typeFlash, keyLit, flicker, dark;

  /* 机の上の道具。押すと止まる */
  var GADGETS = ["radio", "lamp", "clock", "metro", "phone", "duck"];
  var G = {};
  GADGETS.forEach(function (id) { G[id] = { id: id, x: 0, y: 0, r: 52, on: false, t: 0, snd: 0, k: 0 }; });

  var OY;                                      /* 960の高さの絵を、画面の高さの真ん中に置く */
  function place() {
    OY = Math.round((H - 960) / 2);
    G.radio.x = 412; G.radio.y = 228 + OY;
    G.metro.x = 500; G.metro.y = 214 + OY;
    G.clock.x = 462; G.clock.y = 352 + OY;
    G.duck.x = 270;  G.duck.y = 384 + OY;
    G.lamp.x = 92;   G.lamp.y = 500 + OY;
    G.phone.x = 150; G.phone.y = 584 + OY;
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    progress = 0; popups = []; evs = []; nextSpawn = 0.6; disturb = 0; doneT = 0;
    shake = 0; typeFlash = 0; keyLit = -1; flicker = 0; dark = 0;
    GADGETS.forEach(function (id) { var g = G[id]; g.on = false; g.t = 0; g.snd = 0; g.k = 0; });
  }

  /* ============ 増やした妨害 ============
     出てくるときだけ部屋に現れる。押すと消える。
     where: "free"=空いている所 / "win"=窓（窓を押すと止まる）/ 決まった場所は x,y */
  var evs = [];
  var WIN = { x: 30, y: 110, w: 290, h: 310 };       /* 960の絵の中の窓 */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

  var KINDS = {
    monkey: { where: "free", snd: function (e) { noiseHit(0.16, 6500, 0.55, 1); return 0.28; },
      draw: function (e) {
        var c = e.k % 2 ? 4 : 22;
        circ(0, 14, 22, "#8a5a3a"); circ(0, -16, 18, "#8a5a3a"); circ(0, -12, 11, "#e8c39e");
        circ(-5, -16, 2.5, "#222"); circ(5, -16, 2.5, "#222");
        ctx.fillStyle = "#f2c94c"; ctx.beginPath(); ctx.ellipse(-c, 4, 6, 16, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(c, 4, 6, 16, 0, 0, 7); ctx.fill();
      } },
    fly: { where: "free", move: true, snd: function (e) { tone(190 + Math.sin(e.t * 9) * 40, 0.1, 0.035, "sawtooth"); return 0.08; },
      draw: function (e) {
        ctx.fillStyle = "rgba(220,240,255,.7)";
        var f = Math.sin(e.t * 80) * 4;
        ctx.beginPath(); ctx.ellipse(-6, -8 - f, 8, 4, -0.6, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(6, -8 + f, 8, 4, 0.6, 0, 7); ctx.fill();
        circ(0, 0, 8, "#222"); circ(-6, -2, 3, "#c33");
      } },
    mosquito: { where: "free", move: true, snd: function (e) { tone(620 + Math.sin(e.t * 7) * 80, 0.1, 0.03, "sawtooth"); return 0.08; },
      draw: function (e) {
        ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-24, 4); ctx.moveTo(-4, 4); ctx.lineTo(-8, 14); ctx.moveTo(4, 4); ctx.lineTo(8, 14); ctx.stroke();
        ctx.fillStyle = "rgba(220,240,255,.7)"; ctx.beginPath(); ctx.ellipse(0, -8, 10, 3, Math.sin(e.t * 90), 0, 7); ctx.fill();
        ctx.fillStyle = "#444"; ctx.beginPath(); ctx.ellipse(0, 0, 12, 4, 0, 0, 7); ctx.fill();
      } },
    vacuum: { where: "floor", move: true, snd: function (e) { noiseHit(0.2, 400, 0.35, 1); return 0.16; },
      draw: function (e) {
        ctx.fillStyle = "#3a3d44"; ctx.beginPath(); ctx.ellipse(0, 0, 40, 14, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#cfd3da"; ctx.beginPath(); ctx.ellipse(0, -6, 38, 12, 0, 0, 7); ctx.fill();
        circ(0, -8, 5, e.k % 2 ? "#4cf" : "#1a6");
      } },
    cat: { where: "desk", move: true, snd: function (e) { tone(720, 0.35, 0.09, "sawtooth", 480); return 1.1; },
      draw: function (e) {
        ctx.scale(e.vx > 0 ? -1 : 1, 1);
        ctx.fillStyle = "#e9e2d6";
        ctx.beginPath(); ctx.ellipse(6, 0, 28, 16, 0, 0, 7); ctx.fill();
        circ(-24, -12, 14, "#e9e2d6");
        ctx.beginPath(); ctx.moveTo(-34, -20); ctx.lineTo(-32, -34); ctx.lineTo(-24, -24); ctx.moveTo(-20, -24); ctx.lineTo(-14, -34); ctx.lineTo(-12, -20); ctx.fill();
        ctx.strokeStyle = "#e9e2d6"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(32, -4); ctx.quadraticCurveTo(46, -20 + Math.sin(e.t * 6) * 8, 40, -34); ctx.stroke();
        var st = Math.sin(e.t * 12) * 5;
        ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-10 + st, 18); ctx.moveTo(20, 10); ctx.lineTo(20 - st, 18); ctx.stroke();
        circ(-30, -14, 2.5, "#222");
      } },
    jack: { where: "free", snd: function (e) { tone(260, 0.3, 0.12, "triangle", 900); return 0.6; },
      draw: function (e) {
        var up = Math.abs(Math.sin(e.t * 5)) * 26;
        ctx.strokeStyle = "#bbb"; ctx.lineWidth = 3; ctx.beginPath();
        for (var i = 0; i < 6; i++) { ctx.lineTo(i % 2 ? 6 : -6, -i * (up + 8) / 6); } ctx.stroke();
        circ(0, -up - 14, 14, "#fff"); circ(0, -up - 12, 4, "#e33");
        ctx.fillStyle = "#e33"; ctx.beginPath(); ctx.moveTo(-12, -up - 24); ctx.lineTo(0, -up - 44); ctx.lineTo(12, -up - 24); ctx.fill();
        ctx.fillStyle = "#3b6fd8"; ctx.fillRect(-20, 0, 40, 30); ctx.fillStyle = "#f2c94c"; ctx.fillRect(-20, 0, 40, 6);
      } },
    cuckoo: { x: 455, y: 120, snd: function (e) { tone(880, 0.18, 0.1, "sine"); tone(700, 0.3, 0.1, "sine", null, 0.22); return 0.75; },
      draw: function (e) {
        ctx.fillStyle = "#6b4227"; ctx.beginPath(); ctx.moveTo(-30, -10); ctx.lineTo(0, -38); ctx.lineTo(30, -10); ctx.lineTo(26, 32); ctx.lineTo(-26, 32); ctx.fill();
        circ(0, 8, 13, "#2a1a10");
        var o = (e.t % 0.75) < 0.4 ? 18 : 4;
        circ(-o + 4, -4, 9, "#7fb6e8"); ctx.fillStyle = "#f2c94c"; ctx.beginPath(); ctx.moveTo(-o - 4, -6); ctx.lineTo(-o - 12, -2); ctx.lineTo(-o - 4, 0); ctx.fill();
      } },
    smoke: { x: 40, y: 40, snd: function (e) { tone(3300, 0.09, 0.08, "square"); return 0.45; },
      draw: function (e) {
        ctx.fillStyle = "#e9e9ee"; ctx.beginPath(); ctx.ellipse(0, 0, 26, 9, 0, 0, 7); ctx.fill();
        ctx.fillRect(-20, -10, 40, 8);
        if ((e.t % 0.45) < 0.2) { circ(0, 2, 5, "#ff3b3b"); ctx.globalAlpha = 0.3; circ(0, 2, 20, "#ff3b3b"); ctx.globalAlpha = 1; }
      } },
    trumpet: { where: "free", snd: function (e) { tone(pick([392, 440, 523, 587]), 0.24, 0.07, "sawtooth"); return 0.3; },
      draw: function (e) {
        ctx.rotate(-0.3 + Math.sin(e.t * 10) * 0.08);
        ctx.fillStyle = "#f2c94c"; ctx.fillRect(-34, -4, 40, 8);
        ctx.beginPath(); ctx.moveTo(4, -4); ctx.lineTo(30, -20); ctx.lineTo(30, 20); ctx.lineTo(4, 4); ctx.fill();
        circ(-36, 0, 6, "#e85a8a");
      } },
    taiko: { where: "free", snd: function (e) { tone(85, 0.25, 0.45, "sine", 50); shake = Math.max(shake, 6); return 0.4; },
      draw: function (e) {
        var b = (e.t % 0.4) < 0.08 ? 1.08 : 1; ctx.scale(b, b);
        ctx.fillStyle = "#a0402f"; ctx.fillRect(-28, -18, 56, 36);
        ctx.fillStyle = "#f3e6c8"; ctx.beginPath(); ctx.ellipse(0, -18, 28, 9, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(14, -50); ctx.lineTo(4, -22); ctx.stroke();
      } },
    kettle: { where: "free", snd: function (e) { tone(1850 + Math.sin(e.t * 20) * 60, 0.22, 0.05, "sine"); return 0.2; },
      draw: function (e) {
        ctx.fillStyle = "#c9ced8"; ctx.beginPath(); ctx.ellipse(0, 4, 26, 20, 0, 0, 7); ctx.fill();
        ctx.fillRect(18, -6, 22, 6);
        ctx.strokeStyle = "#333"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, -10, 14, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.6)";
        for (var i = 0; i < 3; i++) { var ph = (e.t * 1.5 + i / 3) % 1; ctx.globalAlpha = 1 - ph; circ(44 + ph * 18, -10 - ph * 30, 5 + ph * 6, "#fff"); }
        ctx.globalAlpha = 1;
      } },
    microwave: { where: "free", snd: function (e) { if (e.k % 4 < 3) tone(2100, 0.12, 0.07, "square"); return 0.2; },
      draw: function (e) {
        ctx.fillStyle = "#e8e8ec"; ctx.fillRect(-36, -22, 72, 44);
        ctx.fillStyle = (e.t % 0.4) < 0.2 ? "#ffd27a" : "#3a3a44"; ctx.fillRect(-30, -16, 44, 32);
        ctx.fillStyle = "#444"; ctx.fillRect(20, -14, 10, 4); ctx.fillRect(20, -4, 10, 4);
      } },
    siren: { where: "win", snd: function (e) { tone(e.k % 2 ? 1000 : 700, 0.3, 0.06, "square", e.k % 2 ? 700 : 1000); return 0.32; },
      drawWin: function (e) { ctx.globalAlpha = 0.45; ctx.fillStyle = (e.t % 0.5) < 0.25 ? "#ff2d2d" : "#2d6bff"; ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h); ctx.globalAlpha = 1; } },
    fireworks: { where: "win", snd: function (e) { noiseHit(0.5, 200, 0.8, 0.7); noiseHit(0.3, 3000, 0.2, 1); e.bx = rnd(70, 280); e.by = rnd(150, 260); e.bc = pick(["#ff6b9a", "#ffd34d", "#6bf0ff", "#9dff6b"]); return 0.6; },
      drawWin: function (e) {
        var ph = Math.min(1, ((e.t + 10) % 0.6) / 0.5);
        ctx.strokeStyle = e.bc || "#ffd34d"; ctx.lineWidth = 3; ctx.globalAlpha = 1 - ph;
        for (var i = 0; i < 12; i++) { var a = i / 12 * 6.283; ctx.beginPath(); ctx.moveTo((e.bx || 150) + Math.cos(a) * ph * 20, (e.by || 200) + Math.sin(a) * ph * 20); ctx.lineTo((e.bx || 150) + Math.cos(a) * ph * 55, (e.by || 200) + Math.sin(a) * ph * 55); ctx.stroke(); }
        ctx.globalAlpha = 1;
      } },
    thunder: { where: "win", snd: function (e) { noiseHit(1.2, 90, 1.2, 0.5); e.flash = 0.25; shake = Math.max(shake, 8); return 1.6; },
      drawWin: function (e) {
        ctx.fillStyle = "rgba(20,20,40,.35)"; ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
        if (e.flash > 0) {
          ctx.fillStyle = "rgba(255,255,240,.7)"; ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
          ctx.strokeStyle = "#fffbd0"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(200, 110); ctx.lineTo(170, 190); ctx.lineTo(200, 200); ctx.lineTo(160, 300); ctx.stroke();
        }
      } },
    crow: { where: "win", snd: function (e) { tone(420, 0.28, 0.11, "sawtooth", 300); return 0.9; },
      drawWin: function (e) {
        ctx.save(); ctx.translate(130, 392);
        var hop = (e.t % 0.9) < 0.15 ? -6 : 0;
        ctx.fillStyle = "#14121c"; ctx.beginPath(); ctx.ellipse(0, hop, 22, 14, -0.2, 0, 7); ctx.fill();
        circ(-18, hop - 12, 10, "#14121c");
        ctx.beginPath(); ctx.moveTo(-26, hop - 14); ctx.lineTo(-40, hop - 8); ctx.lineTo(-26, hop - 8); ctx.fill();
        circ(-20, hop - 14, 2, "#fff");
        ctx.restore();
      } },
    landline: { where: "free", snd: function (e) { if (e.k % 20 < 12) tone(e.k % 2 ? 1300 : 1500, 0.04, 0.07, "square"); return 0.045; },
      draw: function (e) {
        var j = Math.sin(e.t * 60) * 3;
        ctx.fillStyle = "#1e1e22"; ctx.beginPath(); ctx.moveTo(-30, 18); ctx.lineTo(-22, -8); ctx.lineTo(22, -8); ctx.lineTo(30, 18); ctx.fill();
        circ(0, 4, 11, "#ddd"); ctx.fillStyle = "#1e1e22"; ctx.fillRect(-34, -22 + j, 68, 10); ctx.fillRect(-34, -22 + j, 12, 18); ctx.fillRect(22, -22 + j, 12, 18);
      } },
    printer: { where: "free", snd: function (e) { noiseHit(0.08, 1800 + (e.k % 3) * 400, 0.3, 3); return 0.11; },
      draw: function (e) {
        var p = (e.t * 30) % 40;
        ctx.fillStyle = "#fff"; ctx.fillRect(-18, -24 - p * 0.3, 36, 20 + p);
        ctx.fillStyle = "#d6d8de"; ctx.fillRect(-36, -10, 72, 30); ctx.fillStyle = "#555"; ctx.fillRect(-26, -4, 52, 4);
        circ(26, 12, 3, "#5fd06a");
      } },
    disco: { x: 270, y: 50, snd: function (e) { if (e.k % 2) tone(100, 0.15, 0.3, "sine", 50); else noiseHit(0.05, 8000, 0.18, 1); return 0.24; },
      draw: function (e) {
        ctx.strokeStyle = "#888"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, -18); ctx.stroke();
        circ(0, 0, 18, "#c9d2e0");
        ctx.fillStyle = "#fff"; for (var i = 0; i < 8; i++) { var a = i + e.t * 3; ctx.fillRect(Math.cos(a) * 11 - 2, Math.sin(a * 1.3) * 11 - 2, 4, 4); }
      },
      over: function (e) {
        ctx.save(); ctx.globalAlpha = 0.18;
        ["#ff4fa0", "#4fd8ff", "#ffe14f", "#8cff4f"].forEach(function (c, i) {
          var a = e.t * 1.7 + i * 1.6; circ(270 + Math.cos(a) * 200, OY + 420 + Math.sin(a * 1.3) * 300, 60, c);
        });
        ctx.restore();
      } },
    cracker: { where: "free", snd: function (e) { noiseHit(0.25, 2500, 0.7, 0.8); e.burst = 0; return 0.9; },
      draw: function (e) {
        ctx.fillStyle = "#e85a8a"; ctx.beginPath(); ctx.moveTo(-8, 18); ctx.lineTo(8, 18); ctx.lineTo(16, -18); ctx.lineTo(-16, -18); ctx.fill();
        var b = e.burst || 0;
        ["#ffd34d", "#6bf0ff", "#ff6b9a", "#9dff6b", "#fff"].forEach(function (c, i) {
          for (var j = 0; j < 3; j++) { var a = -1.57 + (i * 3 + j - 7) * 0.13; ctx.fillStyle = c; ctx.fillRect(Math.cos(a) * b * 150, -20 + Math.sin(a) * b * 150 + b * b * 40, 6, 4); }
        });
      } },
    tamago: { where: "free", snd: function (e) { if (e.k % 3 < 2) tone(2800, 0.07, 0.06, "square"); return 0.14; },
      draw: function (e) {
        ctx.fillStyle = "#ff86c8"; ctx.beginPath(); ctx.ellipse(0, 0, 22, 27, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#cfe8c8"; ctx.fillRect(-12, -14, 24, 18);
        ctx.fillStyle = "#333"; ctx.fillRect(-4 + (e.k % 2) * 4, -8, 6, 6);
        circ(-8, 14, 3, "#fff"); circ(0, 16, 3, "#fff"); circ(8, 14, 3, "#fff");
      } },
    drip: { x: 360, y: 100, snd: function (e) { tone(1600, 0.12, 0.08, "sine", 700); return 0.55; },
      draw: function (e) {
        ctx.fillStyle = "#6b7a8f"; ctx.fillRect(-20, 30, 40, 26); ctx.fillStyle = "#8fbbe8"; ctx.fillRect(-16, 34, 32, 6);
        var ph = (e.t % 0.55) / 0.55;
        ctx.fillStyle = "#8fd3ff"; ctx.beginPath(); ctx.ellipse(0, -40 + ph * 70, 4, 6, 0, 0, 7); ctx.fill();
      } },
    chick: { where: "free", snd: function (e) { tone(3200, 0.06, 0.06, "sine", 2600); return 0.22; },
      draw: function (e) {
        var hp = (e.t % 0.22) < 0.06 ? -4 : 0;

    ctx.fillStyle = "#5fd06a"; ctx.beginPath(); ctx.ellipse(x + 26, y + 12, 7, 3, 0, 0, 7); ctx.fill();
    var bx = x + 50, by = y + 17, bw = w - 70;
    roundRect(bx, by, bw, 12, 6); ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fill();
    if (progress > 0) { roundRect(bx, by, Math.max(12, bw * progress / 100), 12, 6); ctx.fillStyle = "#7ee0a6"; ctx.fill(); }
    ctx.restore();
  }

  /* 左を向いて座る、ヘッドホンの子 */
  function drawGirl() {
    var annoyed = activeCount() + popups.length;
    var done = state === S.DONE || state === S.RESULT;
    var bob = G.radio.on ? (G.radio.k % 2 ? 3 : 0) : Math.sin(T * 2) * 1.5;
    var tap = typeFlash * 4;
    ctx.save(); ctx.translate(0, OY);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    /* 椅子 */
    ctx.fillStyle = "#3a2c55";
    ctx.fillRect(470, 500, 16, 170); roundRect(380, 640, 110, 20, 8); ctx.fill();
    ctx.fillRect(425, 660, 12, 100); ctx.fillRect(390, 756, 90, 8);
    /* 脚 */
    ctx.strokeStyle = "#2f3b5c"; ctx.lineWidth = 30;
    ctx.beginPath(); ctx.moveTo(440, 640); ctx.lineTo(352, 650); ctx.lineTo(352, 752); ctx.stroke();
    ctx.fillStyle = "#e9e3f2"; roundRect(330, 744, 46, 18, 8); ctx.fill();
    /* 胴（パーカー） */
    ctx.fillStyle = "#e7a948";
    ctx.beginPath(); ctx.moveTo(460, 650); ctx.quadraticCurveTo(470, 560, 440, 520 + bob);
    ctx.quadraticCurveTo(400, 505 + bob, 385, 530 + bob); ctx.quadraticCurveTo(375, 600, 395, 650); ctx.closePath(); ctx.fill();
    /* 腕 */
    ctx.strokeStyle = "#d39436"; ctx.lineWidth = 22;
    ctx.beginPath();
    if (done) { ctx.moveTo(410, 535 + bob); ctx.lineTo(380, 470); ctx.lineTo(370, 400); }
    else { ctx.moveTo(415, 540 + bob); ctx.lineTo(372, 588); ctx.lineTo(300, 586 - tap); }
    ctx.stroke();
    ctx.fillStyle = "#f3c9a8"; ctx.beginPath();
    if (done) ctx.arc(368, 392, 11, 0, 7); else ctx.arc(292, 586 - tap, 10, 0, 7);
    ctx.fill();
    /* 頭 */
    var hx = 400, hy = 470 + bob;
    ctx.fillStyle = "#f3c9a8";
    ctx.fillRect(hx - 2, hy + 30, 18, 22);
    ctx.beginPath(); ctx.arc(hx, hy, 40, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx - 38, hy - 4); ctx.lineTo(hx - 47, hy + 8); ctx.lineTo(hx - 37, hy + 12); ctx.fill();   /* 鼻 */
    ctx.fillStyle = "#f2a3a0"; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(hx - 18, hy + 16, 8, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    /* 髪（短い黒髪のおかっぱ） */
    ctx.fillStyle = "#1e1a2e";
    ctx.beginPath(); ctx.moveTo(hx - 42, hy - 8); ctx.quadraticCurveTo(hx - 40, hy - 50, hx + 2, hy - 48);
    ctx.quadraticCurveTo(hx + 50, hy - 44, hx + 46, hy + 10); ctx.quadraticCurveTo(hx + 44, hy + 40, hx + 30, hy + 44);
    ctx.lineTo(hx + 4, hy + 34); ctx.quadraticCurveTo(hx - 8, hy - 8, hx - 26, hy - 18); ctx.closePath(); ctx.fill();
    /* 目 */
    ctx.strokeStyle = "#1e1a2e"; ctx.lineWidth = 3;
    ctx.beginPath();
    if (done) { ctx.arc(hx - 24, hy + 4, 6, Math.PI * 1.1, Math.PI * 1.9); }
    else if (annoyed >= 3) { ctx.moveTo(hx - 30, hy + 2); ctx.lineTo(hx - 18, hy + 2); ctx.moveTo(hx - 32, hy - 10); ctx.lineTo(hx - 18, hy - 6); }
    else { ctx.moveTo(hx - 30, hy + 2); ctx.quadraticCurveTo(hx - 24, hy + 6, hx - 18, hy + 2); }
    ctx.stroke();
    if (annoyed >= 3 && !done) {                    /* 汗 */
      ctx.fillStyle = "#9ad8ff";
      ctx.beginPath(); ctx.moveTo(hx - 6, hy - 34); ctx.quadraticCurveTo(hx + 2, hy - 20, hx - 6, hy - 18); ctx.quadraticCurveTo(hx - 14, hy - 20, hx - 6, hy - 34); ctx.fill();
    }
    /* ヘッドホン */
    ctx.strokeStyle = "#e45d7b"; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(hx + 8, hy + 2, 50, Math.PI * 1.2, Math.PI * 1.95); ctx.stroke();
    ctx.fillStyle = "#e45d7b"; roundRect(hx + 4, hy - 14, 30, 40, 13); ctx.fill();
    ctx.fillStyle = "#fbe3ea"; roundRect(hx + 12, hy - 6, 14, 24, 7); ctx.fill();
    ctx.restore();
  }

  function drawDesk() {
    ctx.save(); ctx.translate(0, OY);
    /* 開いたノートPC（画面は向こう側） */
    var glowA = 0.25 + (typeFlash * 0.15);
    var lg = ctx.createRadialGradient(300, 520, 10, 300, 520, 140);
    lg.addColorStop(0, "rgba(150,210,255," + glowA + ")"); lg.addColorStop(1, "rgba(150,210,255,0)");
    ctx.fillStyle = lg; ctx.fillRect(160, 380, 280, 260);
    ctx.fillStyle = "#b9c1d6"; roundRect(190, 588, 120, 8, 3); ctx.fill();
    ctx.save(); ctx.translate(196, 592); ctx.rotate(-1.38);
    roundRect(0, -8, 100, 8, 3); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#e6eaf4"; ctx.beginPath(); ctx.arc(205, 545, 5, 0, 7); ctx.fill();
    /* マグ */
    ctx.fillStyle = "#f1ece2"; roundRect(322, 560, 30, 36, 6); ctx.fill();
    ctx.strokeStyle = "#f1ece2"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(320, 578, 9, 1.8, 4.5); ctx.stroke();
    ctx.restore();
  }

  function drawPopup(p) {
    var s = Math.min(1, p.t * 8);
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.scale(0.6 + 0.4 * s, 0.6 + 0.4 * s);
    ctx.translate(-p.w / 2, -p.h / 2);
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    roundRect(0, 0, p.w, p.h, 10); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.strokeStyle = "#c9d0d8"; ctx.lineWidth = 1.5; ctx.stroke();
    var col = { bell: "#f5b82e", warn: "#ef5350", heart: "#ec4f8f", mail: "#3d8be0", chart: "#38b26d" }[p.icon];
    ctx.save(); roundRect(0, 0, p.w, 34, 10); ctx.clip(); ctx.fillStyle = col; ctx.fillRect(0, 0, p.w, 34); ctx.restore();
    /* ✕ */
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.lineCap = "round";
    var cx = p.w - 20, cy = 18;
    ctx.beginPath(); ctx.moveTo(cx - 7, cy - 7); ctx.lineTo(cx + 7, cy + 7); ctx.moveTo(cx + 7, cy - 7); ctx.lineTo(cx - 7, cy + 7); ctx.stroke();
    /* 絵 */
    ctx.save(); ctx.translate(36, 72);
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 4;
    var wob = Math.sin(p.t * 20) * 0.25;
    if (p.icon === "bell") {
      ctx.rotate(wob);
      ctx.beginPath(); ctx.moveTo(-16, 10); ctx.quadraticCurveTo(-14, -18, 0, -18); ctx.quadraticCurveTo(14, -18, 16, 10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 14, 5, 0, 7); ctx.fill();
    } else if (p.icon === "warn") {
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(20, 16); ctx.lineTo(-20, 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillRect(-2.5, -8, 5, 14); ctx.fillRect(-2.5, 9, 5, 4);
    } else if (p.icon === "heart") {
      ctx.scale(1 + wob * 0.4, 1 + wob * 0.4);
      ctx.beginPath(); ctx.moveTo(0, 16); ctx.bezierCurveTo(-26, -2, -14, -24, 0, -10); ctx.bezierCurveTo(14, -24, 26, -2, 0, 16); ctx.fill();
    } else if (p.icon === "mail") {
      ctx.strokeRect(-20, -13, 40, 26);
      ctx.beginPath(); ctx.moveTo(-20, -13); ctx.lineTo(0, 3); ctx.lineTo(20, -13); ctx.stroke();
    } else {
      ctx.fillRect(-18, 2, 9, 14); ctx.fillRect(-5, -8, 9, 24); ctx.fillRect(8, -18, 9, 34);
    }
    ctx.restore();
    /* 中身の行 */
    ctx.fillStyle = "#c3cad3";
    ctx.fillRect(68, 52, p.w - 86, 8); ctx.fillRect(68, 68, p.w - 106, 8); ctx.fillRect(68, 84, p.w - 126, 8);
    ctx.restore();
  }

  function glow(g, col) {
    if (!g.on) return;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(g.t * 18);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r + 6, 0, 7); ctx.fill();
    ctx.restore();
  }
  function waves(g, col) {
    if (!g.on) return;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = "round";
    for (var i = 0; i < 3; i++) {
      var ph = (g.t * 2 + i / 3) % 1, rr = g.r * 0.6 + ph * 40;
      ctx.globalAlpha = 1 - ph;
      ctx.beginPath(); ctx.arc(g.x, g.y, rr, -0.6, 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(g.x, g.y, rr, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRadio(g) {
    glow(g, "#ff8a3d"); waves(g, "#ff8a3d");
    var b = g.on && g.k % 2 ? 1.08 : 1;
    ctx.save(); ctx.translate(g.x + jit(g, 2), g.y + jit(g, 2)); ctx.scale(b, b);
    roundRect(-46, -34, 92, 68, 10); ctx.fillStyle = "#c2443a"; ctx.fill();
    ctx.fillStyle = "#3b2b26"; ctx.beginPath(); ctx.arc(-18, 4, 20, 0, 7); ctx.fill();
    ctx.fillStyle = "#6a554c"; ctx.beginPath(); ctx.arc(-18, 4, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2d37a"; ctx.fillRect(10, -20, 28, 14);
    ctx.fillStyle = "#3b2b26"; ctx.beginPath(); ctx.arc(24, 16, 8, 0, 7); ctx.fill();
    ctx.strokeStyle = "#777"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(30, -34); ctx.lineTo(44, -62); ctx.stroke();
    ctx.restore();
    if (g.on) {                                    /* 音符 */
      ctx.save(); ctx.fillStyle = "#c2443a";
      for (var i = 0; i < 3; i++) {
        var ph = (g.t * 0.9 + i / 3) % 1;
        ctx.globalAlpha = 1 - ph;
        var nx = g.x + 30 + i * 12 + Math.sin(ph * 9 + i) * 10, ny = g.y - 40 - ph * 70;
        ctx.beginPath(); ctx.ellipse(nx, ny, 7, 5, -0.4, 0, 7); ctx.fill();
        ctx.fillRect(nx + 5, ny - 22, 3, 22);
      }
      ctx.restore();
    }
  }
  function drawLamp(g) {
    var lit = !g.on || dark < 0.2;
    var by = g.y + 100;
    if (lit) {
      ctx.save(); ctx.globalAlpha = g.on ? 0.55 : 0.4;
      var lg = ctx.createRadialGradient(g.x + 20, g.y + 40, 5, g.x + 20, g.y + 60, 150);
      lg.addColorStop(0, "#ffd98a"); lg.addColorStop(1, "rgba(255,200,120,0)");
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(g.x + 20, g.y + 60, 150, 0, 7); ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.translate(jit(g, 2), jit(g, 2));
    ctx.strokeStyle = "#2a2340"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(g.x - 40, by - 4); ctx.lineTo(g.x - 50, g.y + 30); ctx.lineTo(g.x - 10, g.y - 10); ctx.stroke();
    ctx.fillStyle = "#2a2340"; roundRect(g.x - 64, by - 8, 48, 10, 4); ctx.fill();
    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(0.5);
    ctx.fillStyle = "#3e7a6c";
    ctx.beginPath(); ctx.moveTo(-14, -16); ctx.lineTo(14, -16); ctx.lineTo(34, 22); ctx.lineTo(-34, 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lit ? "#fff3c8" : "#7c7a6c"; ctx.beginPath(); ctx.arc(0, 22, 13, 0, Math.PI); ctx.fill();
    ctx.restore(); ctx.restore();
  }
  function drawClock(g) {
    glow(g, "#ffd84d");
    ctx.save(); ctx.translate(g.x + jit(g, 4), g.y + jit(g, 3)); ctx.rotate(jit(g, 0.15));
    ctx.fillStyle = "#333"; ctx.fillRect(-26, 28, 8, 14); ctx.fillRect(18, 28, 8, 14);
    ctx.fillStyle = "#e0b33a";
    var ring = g.on ? Math.sin(g.t * 70) * 4 : 0;
    ctx.beginPath(); ctx.arc(-24 + ring, -32, 13, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(24 - ring, -32, 13, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#e34f3e"; ctx.beginPath(); ctx.arc(0, 0, 38, 0, 7); ctx.fill();
    ctx.fillStyle = "#fffaf0"; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
    ctx.strokeStyle = "#333"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -20); ctx.moveTo(0, 0); ctx.lineTo(14, 6); ctx.stroke();
    ctx.restore();
  }
  function drawMetro(g) {
    glow(g, "#9b7bff");
    ctx.save(); ctx.translate(g.x, g.y + 40);
    ctx.fillStyle = "#5a3c2a";
    ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.lineTo(16, -88); ctx.lineTo(-16, -88); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9dcc4"; ctx.fillRect(-12, -78, 24, 56);
    var a = g.on ? Math.sin(g.t * Math.PI / 0.19) * 0.6 : 0.0;
    ctx.save(); ctx.translate(0, -16); ctx.rotate(a);
    ctx.strokeStyle = "#222"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -74); ctx.stroke();
    ctx.fillStyle = "#c9a227"; ctx.fillRect(-7, -54, 14, 10);
    ctx.restore();
    ctx.restore();
  }
  function drawPhone(g) {
    glow(g, "#4dd0ff"); waves(g, "#4dd0ff");
    ctx.save(); ctx.translate(g.x + jit(g, 5), g.y + jit(g, 2)); ctx.scale(0.7, 0.7); ctx.rotate(-0.25 + jit(g, 0.08));
    roundRect(-28, -50, 56, 100, 10); ctx.fillStyle = "#1c1f24"; ctx.fill();
    roundRect(-23, -42, 46, 82, 5); ctx.fillStyle = g.on ? "#47b8ff" : "#2a3038"; ctx.fill();
    if (g.on) {
      ctx.fillStyle = "#5fd06a"; ctx.beginPath(); ctx.arc(0, 18, 9, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -14, 10, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  function drawDuck(g) {
    glow(g, "#ffe14d");
    var sq = g.on ? Math.max(0, Math.sin(g.t * Math.PI / 0.48 * 2)) : 0;
    ctx.save(); ctx.translate(g.x, g.y + 30); ctx.scale(1 + sq * 0.12, 1 - sq * 0.18);
    ctx.fillStyle = "#ffd53d";
    ctx.beginPath(); ctx.ellipse(0, -22, 40, 26, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-14, -58, 21, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff8a2a"; ctx.beginPath(); ctx.ellipse(-36, -54, 12, 6 + sq * 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-20, -64, 3.5, 0, 7); ctx.fill();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
    drawRoom();
    drawEvsWin();
    drawRadio(G.radio);
    drawMetro(G.metro);
    drawClock(G.clock);
    drawDuck(G.duck);
    drawDesk();
    drawGirl();
    drawPhone(G.phone);
    drawEvs(false);
    if (dark > 0) { ctx.fillStyle = "rgba(8,6,20," + dark + ")"; ctx.fillRect(-20, -20, W + 40, H + 40); }
    drawLamp(G.lamp);
    drawEvsOver();
    drawEvs(true);
    popups.forEach(drawPopup);
    drawWidget();
    ctx.restore();

    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score.toFixed(1) + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, W: W, H: H, progress: progress, popups: popups.length,
        active: GADGETS.filter(function (id) { return G[id].on; }), disturb: disturb, T: T,
        gadgets: GADGETS.map(function (id) { return { id: id, x: G[id].x, y: G[id].y }; }),
        evs: evs.map(function (e) { var k = KINDS[e.id]; return { id: e.id, block: !!k.block, x: k.where === "win" ? 175 : e.x, y: k.where === "win" ? OY + 200 : e.y }; }),
        popupClose: popups.map(function (p) { return { x: p.x + p.w - 20, y: p.y + 18 }; }) };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };
  /* サムネ用: 全部鳴っている場面で止める */
  window.__thumbnail = function () {
    newRound(); progress = 46; debugKey(1);
    GADGETS.forEach(function (id) { G[id].t = 0.3; G[id].k = 1; });
    popups.forEach(function (p) { p.t = 1; });
    dark = 0; nextSpawn = 999;
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var i = 0; i < 400 && state !== S.RESULT; i++) { await r.wait(120); r.key(); }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
