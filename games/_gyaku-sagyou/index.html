<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>逆・作業支援ツール</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #d8cab2; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 逆・作業支援ツール

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;

    place();                                   /* 高さが決まってから置き直す */

    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    window.zAudioResume(AC);
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", DONE: "done", RESULT: "result" };
  var state, score, T, held, keyMode = false;
  var progress, popups, nextSpawn, disturb, doneT, shake, typeFlash, keyLit, flicker, dark;

  /* 机の上の道具。押すと止まる */
  var GADGETS = ["radio", "lamp", "clock", "metro", "phone", "duck"];
  var G = {};
  GADGETS.forEach(function (id) { G[id] = { id: id, x: 0, y: 0, r: 52, on: false, t: 0, snd: 0, k: 0 }; });

  var MON, KEY, DESK;                          /* 高さから決まる置き場所 */
  function place() {
    DESK = Math.round(H * 0.5);
    MON = { x: 112, y: Math.round(H * 0.1), w: 316, h: Math.round(H * 0.3) };
    KEY = { x: 120, y: Math.round(H * 0.57), w: 300, h: Math.round(H * 0.085) };
    G.radio.x = 56;  G.radio.y = Math.round(H * 0.22);
    G.lamp.x = 486;  G.lamp.y = Math.round(H * 0.2);
    G.clock.x = 58;  G.clock.y = Math.round(H * 0.45);
    G.metro.x = 482; G.metro.y = Math.round(H * 0.44);
    G.phone.x = 110; G.phone.y = Math.round(H * 0.81);
    G.duck.x = 430;  G.duck.y = Math.round(H * 0.8);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    progress = 0; popups = []; nextSpawn = 1.0; disturb = 0; doneT = 0;
    shake = 0; typeFlash = 0; keyLit = -1; flicker = 0; dark = 0;
    GADGETS.forEach(function (id) { var g = G[id]; g.on = false; g.t = 0; g.snd = 0; g.k = 0; });
  }

  function activeCount() {
    var n = 0;
    GADGETS.forEach(function (id) { if (G[id].on) n++; });
    return n;
  }

  /* 妨害をひとつ起こす */
  var ICONS = ["bell", "warn", "heart", "mail", "chart"];
  function addPopup() {
    var w = 190, h = 112;
    var p = {
      x: MON.x + 8 + Math.random() * (MON.w - w - 16),
      y: MON.y + 30 + Math.random() * (MON.h - h - 40),
      w: w, h: h, icon: ICONS[Math.floor(Math.random() * ICONS.length)], t: 0
    };
    popups.push(p);
    tone(880, 0.12, 0.12, "sine");
    tone(1320, 0.22, 0.12, "sine", null, 0.1);
  }
  function turnOn(g) {
    g.on = true; g.t = 0; g.snd = 0; g.k = 0;
  }
  function spawn() {
    var off = GADGETS.filter(function (id) { return !G[id].on; });
    var wantPopup = Math.random() < 0.42 || !off.length;
    if (wantPopup && popups.length < 4) addPopup();
    else if (off.length) turnOn(G[off[Math.floor(Math.random() * off.length)]]);
    else return;
    disturb++;
  }

  /* 鳴りっぱなしの音 */
  var PENTA = [523, 587, 659, 784, 880, 1047];
  function gadgetSound(g) {
    g.k++;
    switch (g.id) {
      case "radio":
        if (g.k % 2) tone(110, 0.18, 0.3, "sine", 45); else noiseHit(0.05, 7000, 0.18, 1);
        tone(PENTA[Math.floor(Math.random() * PENTA.length)], 0.2, 0.06, "square");
        shake = Math.max(shake, g.k % 2 ? 5 : 2);
        return 0.22;
      case "clock":
        if (g.k % 14 < 10) { tone(g.k % 2 ? 2600 : 3100, 0.05, 0.07, "square"); }
        return 0.055;
      case "metro":
        noiseHit(0.03, 4200, 0.5, 3); tone(1900, 0.03, 0.08, "square");
        return 0.19;
      case "phone":
        noiseHit(0.38, 140, 0.9, 2);
        tone(1320, 0.1, 0.07, "triangle"); tone(1760, 0.1, 0.07, "triangle", null, 0.13);
        return 0.55;
      case "duck":
        tone(650, 0.2, 0.13, "sawtooth", 1250);
        return 0.48;
      case "lamp":
        tone(100, 0.08, 0.035, "sawtooth");
        if (Math.random() < 0.35) noiseHit(0.04, 3000, 0.25, 4);
        return 0.09;
    }
    return 1;
  }

  /* ============ 進行 ============ */
  function update(dt) {
    shake = Math.max(0, shake - dt * 30);
    typeFlash = Math.max(0, typeFlash - dt * 6);
    if (state === S.DONE) {
      doneT += dt;
      if (doneT > 1.3) { state = S.RESULT; }
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;

    nextSpawn -= dt;
    if (nextSpawn <= 0) {
      spawn();
      nextSpawn = (0.9 + Math.random() * 0.8) * Math.max(0.5, 1 - T / 45);
    }
    GADGETS.forEach(function (id) {
      var g = G[id];
      if (!g.on) return;
      g.t += dt;
      g.snd -= dt;
      if (g.snd <= 0) g.snd += gadgetSound(g);
    });
    popups.forEach(function (p) { p.t += dt; });
    /* 電気のちらつき（激しい点滅にはしない） */
    if (G.lamp.on) {
      flicker -= dt;
      if (flicker <= 0) { dark = Math.random() < 0.5 ? 0.45 : 0.05; flicker = 0.12 + Math.random() * 0.25; }
    } else dark = 0;
  }

  function finish() {
    state = S.DONE; doneT = 0;
    score = Math.round(T * 10) / 10;
    GADGETS.forEach(function (id) { G[id].on = false; });
    popups = [];
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.3, 0.14, "triangle", null, i * 0.11); });
    tone(1568, 0.6, 0.1, "triangle", null, 0.5);
  }

  function typeOnce() {
    if (popups.length) {                         /* 通知が出ている間は作業が進まない */
      tone(170, 0.12, 0.09, "square");
      shake = Math.max(shake, 3);
      return;
    }
    progress += 1.4 / (1 + 0.6 * activeCount());
    keyLit = Math.floor(Math.random() * 30);
    typeFlash = 1;
    noiseHit(0.035, 1800 + Math.random() * 1600, 0.35, 2);
    if (progress >= 100) { progress = 100; finish(); }
  }

  function hitPopup(x, y) {
    for (var i = popups.length - 1; i >= 0; i--) {
      var p = popups[i];
      if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return i;
      var cx = p.x + p.w - 20, cy = p.y + 18;
      if (Math.hypot(x - cx, y - cy) < 34) return i;
    }
    return -1;
  }
  function hitGadget(x, y) {
    for (var i = 0; i < GADGETS.length; i++) {
      var g = G[GADGETS[i]];
      if (Math.hypot(x - g.x, y - g.y) < g.r + 10) return g;
    }
    return null;
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    if (state !== S.PLAY) return;
    held = true;
    if (x == null) {                              /* キーは通知を閉じるか打つ */
      if (popups.length) { popups.pop(); tone(500, 0.08, 0.1, "triangle", 260); }
      else typeOnce();
      return;
    }
    var pi = hitPopup(x, y);
    if (pi >= 0) {
      var p = popups[pi];
      var cx = p.x + p.w - 20, cy = p.y + 18;
      if (Math.hypot(x - cx, y - cy) < 34) {
        popups.splice(pi, 1);
        tone(500, 0.08, 0.1, "triangle", 260);
      } else {
        tone(170, 0.12, 0.09, "square");
      }
      return;
    }
    var g = hitGadget(x, y);
    if (g) {
      if (g.on) { g.on = false; tone(420, 0.08, 0.12, "triangle", 200); }
      return;
    }
    typeOnce();
  }
  function move(x, y) {}
  function up() { held = false; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。
     本番（www.zounoashi.com/games/ 以下）では効かない。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state === S.INTRO) { newRound(); }
    if (n === 1) {                                /* 全部いっぺんに鳴る */
      if (state !== S.PLAY) newRound();
      GADGETS.forEach(function (id) { if (!G[id].on) turnOn(G[id]); });
      while (popups.length < 3) addPopup();
    } else if (n === 2) {                         /* 完成の直前 */
      if (state !== S.PLAY) newRound();
      progress = 97;
    } else if (n === 3) {                         /* 完成 */
      if (state !== S.PLAY) newRound();
      T = Math.max(T, 12.3); progress = 100; finish();
    }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    /* 英語のときのハッシュタグは英語のゲーム名にする（空白・記号は除く） */
    window.zResultActions.x({ text:
      zT("作業支援ツールに" + disturb + "回妨害されながら、" + score.toFixed(1) + "秒で作業を終わらせた",
         "My productivity tool interrupted me " + disturb + " times, but I finished my work in " + score.toFixed(1) + "s") +
      zT(" #逆作業支援ツール", " #AntiProductivityTool") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function jit(g, a) { return g.on ? (Math.random() * 2 - 1) * a : 0; }

  function drawRoom() {
    /* 壁 */
    var wg = ctx.createLinearGradient(0, 0, 0, DESK);
    wg.addColorStop(0, "#e9dfcd"); wg.addColorStop(1, "#d8cab2");
    ctx.fillStyle = wg; ctx.fillRect(-20, -20, W + 40, DESK + 20);
    /* 机 */
    var dg = ctx.createLinearGradient(0, DESK, 0, H);
    dg.addColorStop(0, "#b67d4b"); dg.addColorStop(1, "#8a5630");
    ctx.fillStyle = dg; ctx.fillRect(-20, DESK, W + 40, H - DESK + 20);
    ctx.fillStyle = "#c8915d"; ctx.fillRect(-20, DESK, W + 40, 8);
    ctx.strokeStyle = "rgba(90,50,20,.18)"; ctx.lineWidth = 2;
    for (var i = 0; i < 7; i++) {
      var yy = DESK + 40 + i * (H - DESK) / 7;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.bezierCurveTo(W * 0.3, yy - 8, W * 0.6, yy + 10, W, yy - 4); ctx.stroke();
    }
    /* 棚 */
    ctx.fillStyle = "#9b6a40"; ctx.fillRect(0, G.radio.y + 38, 108, 10);
  }

  function drawMonitor() {
    var m = MON;
    /* 台 */
    ctx.fillStyle = "#3a3f47";
    ctx.fillRect(m.x + m.w / 2 - 16, m.y + m.h, 32, DESK - m.y - m.h + 14);
    roundRect(m.x + m.w / 2 - 70, DESK + 6, 140, 16, 8); ctx.fill();
    /* 枠 */
    roundRect(m.x - 12, m.y - 12, m.w + 24, m.h + 24, 14);
    ctx.fillStyle = "#2a2e35"; ctx.fill();
    /* 画面 */
    ctx.fillStyle = "#f4f6f8"; ctx.fillRect(m.x, m.y, m.w, m.h);
    /* 道具の上の帯 */
    ctx.fillStyle = "#5b8def"; ctx.fillRect(m.x, m.y, m.w, 22);
    ctx.fillStyle = "#ff6b5a"; ctx.beginPath(); ctx.arc(m.x + 12, m.y + 11, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffcc4d"; ctx.beginPath(); ctx.arc(m.x + 27, m.y + 11, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#5fd06a"; ctx.beginPath(); ctx.arc(m.x + 42, m.y + 11, 5, 0, 7); ctx.fill();
    /* 進み具合 */
    var bx = m.x + 14, by = m.y + 32, bw = m.w - 28;
    roundRect(bx, by, bw, 12, 6); ctx.fillStyle = "#dde3ea"; ctx.fill();
    if (progress > 0) { roundRect(bx, by, Math.max(12, bw * progress / 100), 12, 6); ctx.fillStyle = "#3cc47c"; ctx.fill(); }
    /* 書いた行 */
    var lineH = 13, top = by + 26, rows = Math.floor((m.h - (top - m.y) - 8) / lineH);
    var filled = progress / 100 * rows;
    for (var r = 0; r < rows; r++) {
      var len = Math.min(1, filled - r);
      if (len <= 0) break;
      var full = (m.w - 40) * (0.6 + 0.4 * ((r * 37) % 10) / 10);
      ctx.fillStyle = "#9aa4b1";
      ctx.fillRect(m.x + 20, top + r * lineH, full * len, 6);
    }
    if (state === S.PLAY && (T * 2 % 1) < 0.5) {
      var rr = Math.min(rows - 1, Math.floor(filled)), fl = filled - rr;
      var full2 = (m.w - 40) * (0.6 + 0.4 * ((rr * 37) % 10) / 10);
      ctx.fillStyle = "#333"; ctx.fillRect(m.x + 20 + full2 * fl + 2, top + rr * lineH - 3, 2, 12);
    }
    if (state === S.DONE || state === S.RESULT) {
      ctx.save();
      ctx.strokeStyle = "#3cc47c"; ctx.lineWidth = 16; ctx.lineCap = "round"; ctx.lineJoin = "round";
      var cx = m.x + m.w / 2, cy = m.y + m.h * 0.6, s = Math.min(1, doneT * 4 + (state === S.RESULT ? 1 : 0));
      ctx.globalAlpha = s;
      ctx.beginPath(); ctx.moveTo(cx - 44, cy); ctx.lineTo(cx - 12, cy + 30); ctx.lineTo(cx + 48, cy - 34); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPopup(p) {
    var s = Math.min(1, p.t * 8);
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.scale(0.6 + 0.4 * s, 0.6 + 0.4 * s);
    ctx.translate(-p.w / 2, -p.h / 2);
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    roundRect(0, 0, p.w, p.h, 10); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.strokeStyle = "#c9d0d8"; ctx.lineWidth = 1.5; ctx.stroke();
    var col = { bell: "#f5b82e", warn: "#ef5350", heart: "#ec4f8f", mail: "#3d8be0", chart: "#38b26d" }[p.icon];
    ctx.save(); roundRect(0, 0, p.w, 34, 10); ctx.clip(); ctx.fillStyle = col; ctx.fillRect(0, 0, p.w, 34); ctx.restore();
    /* ✕ */
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.lineCap = "round";
    var cx = p.w - 20, cy = 18;
    ctx.beginPath(); ctx.moveTo(cx - 7, cy - 7); ctx.lineTo(cx + 7, cy + 7); ctx.moveTo(cx + 7, cy - 7); ctx.lineTo(cx - 7, cy + 7); ctx.stroke();
    /* 絵 */
    ctx.save(); ctx.translate(36, 72);
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 4;
    var wob = Math.sin(p.t * 20) * 0.25;
    if (p.icon === "bell") {
      ctx.rotate(wob);
      ctx.beginPath(); ctx.moveTo(-16, 10); ctx.quadraticCurveTo(-14, -18, 0, -18); ctx.quadraticCurveTo(14, -18, 16, 10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 14, 5, 0, 7); ctx.fill();
    } else if (p.icon === "warn") {
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(20, 16); ctx.lineTo(-20, 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillRect(-2.5, -8, 5, 14); ctx.fillRect(-2.5, 9, 5, 4);
    } else if (p.icon === "heart") {
      ctx.scale(1 + wob * 0.4, 1 + wob * 0.4);
      ctx.beginPath(); ctx.moveTo(0, 16); ctx.bezierCurveTo(-26, -2, -14, -24, 0, -10); ctx.bezierCurveTo(14, -24, 26, -2, 0, 16); ctx.fill();
    } else if (p.icon === "mail") {
      ctx.strokeRect(-20, -13, 40, 26);
      ctx.beginPath(); ctx.moveTo(-20, -13); ctx.lineTo(0, 3); ctx.lineTo(20, -13); ctx.stroke();
    } else {
      ctx.fillRect(-18, 2, 9, 14); ctx.fillRect(-5, -8, 9, 24); ctx.fillRect(8, -18, 9, 34);
    }
    ctx.restore();
    /* 中身の行 */
    ctx.fillStyle = "#c3cad3";
    ctx.fillRect(68, 52, p.w - 86, 8); ctx.fillRect(68, 68, p.w - 106, 8); ctx.fillRect(68, 84, p.w - 126, 8);
    ctx.restore();
  }

  function drawKeyboard() {
    var k = KEY;
    roundRect(k.x, k.y, k.w, k.h, 10); ctx.fillStyle = "#2f333a"; ctx.fill();
    var cols = 10, rows = 3, pad = 10, gw = (k.w - pad * 2) / cols, gh = (k.h - pad * 2) / rows;
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var lit = keyLit === r * cols + c && typeFlash > 0;
      roundRect(k.x + pad + c * gw + 2, k.y + pad + r * gh + 2 + (lit ? 2 : 0), gw - 4, gh - 4, 4);
      ctx.fillStyle = lit ? "#8fd3ff" : "#4a505a"; ctx.fill();
    }
    /* 手前のマグ */
    var mx = 270, my = Math.round(H * 0.8);
    ctx.fillStyle = "#f1ece2"; roundRect(mx - 26, my - 30, 52, 60, 8); ctx.fill();
    ctx.strokeStyle = "#f1ece2"; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(mx + 30, my, 14, -1.3, 1.3); ctx.stroke();
    ctx.fillStyle = "#6b3f22"; ctx.beginPath(); ctx.ellipse(mx, my - 30, 22, 6, 0, 0, 7); ctx.fill();
  }

  function glow(g, col) {
    if (!g.on) return;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(g.t * 18);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r + 6, 0, 7); ctx.fill();
    ctx.restore();
  }
  function waves(g, col) {
    if (!g.on) return;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = "round";
    for (var i = 0; i < 3; i++) {
      var ph = (g.t * 2 + i / 3) % 1, rr = g.r * 0.6 + ph * 40;
      ctx.globalAlpha = 1 - ph;
      ctx.beginPath(); ctx.arc(g.x, g.y, rr, -0.6, 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(g.x, g.y, rr, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRadio(g) {
    glow(g, "#ff8a3d"); waves(g, "#ff8a3d");
    var b = g.on && g.k % 2 ? 1.08 : 1;
    ctx.save(); ctx.translate(g.x + jit(g, 2), g.y + jit(g, 2)); ctx.scale(b, b);
    roundRect(-46, -34, 92, 68, 10); ctx.fillStyle = "#c2443a"; ctx.fill();
    ctx.fillStyle = "#3b2b26"; ctx.beginPath(); ctx.arc(-18, 4, 20, 0, 7); ctx.fill();
    ctx.fillStyle = "#6a554c"; ctx.beginPath(); ctx.arc(-18, 4, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2d37a"; ctx.fillRect(10, -20, 28, 14);
    ctx.fillStyle = "#3b2b26"; ctx.beginPath(); ctx.arc(24, 16, 8, 0, 7); ctx.fill();
    ctx.strokeStyle = "#777"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(30, -34); ctx.lineTo(44, -62); ctx.stroke();
    ctx.restore();
    if (g.on) {                                    /* 音符 */
      ctx.save(); ctx.fillStyle = "#c2443a";
      for (var i = 0; i < 3; i++) {
        var ph = (g.t * 0.9 + i / 3) % 1;
        ctx.globalAlpha = 1 - ph;
        var nx = g.x + 30 + i * 12 + Math.sin(ph * 9 + i) * 10, ny = g.y - 40 - ph * 70;
        ctx.beginPath(); ctx.ellipse(nx, ny, 7, 5, -0.4, 0, 7); ctx.fill();
        ctx.fillRect(nx + 5, ny - 22, 3, 22);
      }
      ctx.restore();
    }
  }
  function drawLamp(g) {
    ctx.strokeStyle = "#444"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(g.x, -5); ctx.lineTo(g.x + jit(g, 3), g.y - 30); ctx.stroke();
    var lit = !g.on || dark < 0.2;
    if (lit) {
      ctx.save(); ctx.globalAlpha = g.on ? 0.5 : 0.22;
      var lg = ctx.createRadialGradient(g.x, g.y + 10, 5, g.x, g.y + 10, 90);
      lg.addColorStop(0, "#fff3b0"); lg.addColorStop(1, "rgba(255,243,176,0)");
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(g.x, g.y + 10, 90, 0, 7); ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.translate(g.x + jit(g, 3), g.y);
    ctx.fillStyle = "#2f6b5e";
    ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(14, -30); ctx.lineTo(42, 14); ctx.lineTo(-42, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lit ? "#fff7cf" : "#8a8a7a"; ctx.beginPath(); ctx.arc(0, 16, 15, 0, Math.PI); ctx.fill();
    ctx.restore();
  }
  function drawClock(g) {
    glow(g, "#ffd84d");
    ctx.save(); ctx.translate(g.x + jit(g, 4), g.y + jit(g, 3)); ctx.rotate(jit(g, 0.15));
    ctx.fillStyle = "#333"; ctx.fillRect(-26, 28, 8, 14); ctx.fillRect(18, 28, 8, 14);
    ctx.fillStyle = "#e0b33a";
    var ring = g.on ? Math.sin(g.t * 70) * 4 : 0;
    ctx.beginPath(); ctx.arc(-24 + ring, -32, 13, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(24 - ring, -32, 13, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#e34f3e"; ctx.beginPath(); ctx.arc(0, 0, 38, 0, 7); ctx.fill();
    ctx.fillStyle = "#fffaf0"; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
    ctx.strokeStyle = "#333"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -20); ctx.moveTo(0, 0); ctx.lineTo(14, 6); ctx.stroke();
    ctx.restore();
  }
  function drawMetro(g) {
    glow(g, "#9b7bff");
    ctx.save(); ctx.translate(g.x, g.y + 40);
    ctx.fillStyle = "#5a3c2a";
    ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.lineTo(16, -88); ctx.lineTo(-16, -88); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9dcc4"; ctx.fillRect(-12, -78, 24, 56);
    var a = g.on ? Math.sin(g.t * Math.PI / 0.19) * 0.6 : 0.0;
    ctx.save(); ctx.translate(0, -16); ctx.rotate(a);
    ctx.strokeStyle = "#222"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -74); ctx.stroke();
    ctx.fillStyle = "#c9a227"; ctx.fillRect(-7, -54, 14, 10);
    ctx.restore();
    ctx.restore();
  }
  function drawPhone(g) {
    glow(g, "#4dd0ff"); waves(g, "#4dd0ff");
    ctx.save(); ctx.translate(g.x + jit(g, 5), g.y + jit(g, 2)); ctx.rotate(-0.25 + jit(g, 0.08));
    roundRect(-28, -50, 56, 100, 10); ctx.fillStyle = "#1c1f24"; ctx.fill();
    roundRect(-23, -42, 46, 82, 5); ctx.fillStyle = g.on ? "#47b8ff" : "#2a3038"; ctx.fill();
    if (g.on) {
      ctx.fillStyle = "#5fd06a"; ctx.beginPath(); ctx.arc(0, 18, 9, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -14, 10, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  function drawDuck(g) {
    glow(g, "#ffe14d");
    var sq = g.on ? Math.max(0, Math.sin(g.t * Math.PI / 0.48 * 2)) : 0;
    ctx.save(); ctx.translate(g.x, g.y + 30); ctx.scale(1 + sq * 0.12, 1 - sq * 0.18);
    ctx.fillStyle = "#ffd53d";
    ctx.beginPath(); ctx.ellipse(0, -22, 40, 26, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-14, -58, 21, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff8a2a"; ctx.beginPath(); ctx.ellipse(-36, -54, 12, 6 + sq * 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-20, -64, 3.5, 0, 7); ctx.fill();
    ctx.restore();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
    drawRoom();
    drawRadio(G.radio);
    drawMonitor();
    popups.forEach(drawPopup);
    drawClock(G.clock);
    drawMetro(G.metro);
    drawKeyboard();
    drawPhone(G.phone);
    drawDuck(G.duck);
    if (dark > 0) { ctx.fillStyle = "rgba(10,10,20," + dark + ")"; ctx.fillRect(-20, -20, W + 40, H + 40); }
    drawLamp(G.lamp);
    ctx.restore();

    if (state === S.RESULT) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score.toFixed(1) + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。 */
  window.__probe = {
    now: function () {
      return { state: state, score: score, W: W, H: H, progress: progress, popups: popups.length,
        active: GADGETS.filter(function (id) { return G[id].on; }), disturb: disturb, T: T,
        gadgets: GADGETS.map(function (id) { return { id: id, x: G[id].x, y: G[id].y }; }),
        popupClose: popups.map(function (p) { return { x: p.x + p.w - 20, y: p.y + 18 }; }) };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };
  /* サムネ用: 全部鳴っている場面で止める */
  window.__thumbnail = function () {
    newRound(); progress = 46; debugKey(1);
    GADGETS.forEach(function (id) { G[id].t = 0.3; G[id].k = 1; });
    popups.forEach(function (p) { p.t = 1; });
    dark = 0; nextSpawn = 999;
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      for (var i = 0; i < 400 && state !== S.RESULT; i++) { await r.wait(120); r.key(); }
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){e.stopPropagation();audioOn();resumeAudio();newRound();});
  newRound();state=S.INTRO;startButton.hidden=false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数（60Hz/120Hz）で挙動が変わらないように、描画が遅れても
       ゲームの時間は実際の時間どおり進め、update はいつもちょうど 1/60 秒ずつ呼ぶ（余りは次へ持ち越す）。
       タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
