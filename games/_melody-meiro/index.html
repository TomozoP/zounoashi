<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>メロディ迷路</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #172033; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script src="../random-bowling/vendor/three.min.js"></script>
<script src="maze3d.js"></script>
<script>
/* メロディ迷路

   正しい道を1マス進むごとに、曲が1音進む。行き止まりへ向かう道では曲が止まり、こつんと鳴る（戻れば続けられる）。
   出口までの秒数が結果。
   曲は毎回10曲からひとつ。どれも作曲者の没後に保護期間が切れた曲か、作者不明の古い民謡（旋律だけを使い、歌詞は使わない）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null;
  /* 音はボールのいる場所から聞こえるよう、左右に振る */
  var PAN = null;
  function out() {
    if (!PAN) {
      PAN = AC.createStereoPanner ? AC.createStereoPanner() : AC.createGain();
      PAN.connect(AC.destination);
    }
    return PAN;
  }
  function panTo(c) {
    if (!AC || !PAN || !PAN.pan) return;
    PAN.pan.setTargetAtTime(((c % NX) + 0.5) / NX * 1.2 - 0.6, AC.currentTime, 0.05);
  }
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
  }
  /* ピアノのような音。基音と倍音を重ねて、すぐ減衰させる */
  function note(freq, dur, vol, delay) {
    if (!AC) return;
    var n = AC.currentTime + (delay || 0);
    [[1, 1], [2, 0.35], [3, 0.12]].forEach(function (h) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(freq * h[0], n);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(vol * h[1], n + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
      o.connect(g); g.connect(out());
      o.start(n); o.stop(n + dur + 0.05);
    });
  }
  /* 間違った道の音。木の箱をこつんと叩いたような短く低い音にする（不協和音は使わない） */
  function knock(delay) {
    if (!AC) return;
    var n = AC.currentTime + (delay || 0);
    [[180, 0.18], [372, 0.06]].forEach(function (h) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(h[0] * 1.15, n);
      o.frequency.exponentialRampToValueAtTime(h[0], n + 0.03);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(h[1], n + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, n + 0.16);
      o.connect(g); g.connect(out());
      o.start(n); o.stop(n + 0.2);
    });
  }
  /* 休符のマスを通った音。紙をとんと叩いたような、高く小さく短い音 */
  function tick(delay) {
    if (!AC) return;
    var n = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(1400, n);
    o.frequency.exponentialRampToValueAtTime(900, n + 0.04);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(0.05, n + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, n + 0.07);
    o.connect(g); g.connect(out());
    o.start(n); o.stop(n + 0.1);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 曲 ============
     音の高さだけを並べる（リズムは1マス1音）。すべてハ長調に移してある */
  /* R は休符。1マス1拍で進むので、のばす音や区切りを休符のマスにしてリズムを出す */
  var SONGS = [
    { ja: "歓喜の歌", en: "Ode to Joy", n:
      "E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4 D4 D4 R E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4 R D4 D4 E4 C4 D4 E4 F4 E4 C4 D4 E4 F4 E4 D4 C4 D4 G3 R E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4 R" },
    { ja: "きらきら星", en: "Twinkle Twinkle Little Star", n:
      "C4 C4 G4 G4 A4 A4 G4 R F4 F4 E4 E4 D4 D4 C4 R G4 G4 F4 F4 E4 E4 D4 R G4 G4 F4 F4 E4 E4 D4 R C4 C4 G4 G4 A4 A4 G4 R F4 F4 E4 E4 D4 D4 C4 R" },
    { ja: "かえるの合唱", en: "The Frog Song", n:
      "C4 D4 E4 F4 E4 D4 C4 R E4 F4 G4 A4 G4 F4 E4 R C4 R C4 R C4 R C4 R C4 C4 D4 D4 E4 E4 F4 F4 E4 D4 C4 R" },
    { ja: "メリーさんのひつじ", en: "Mary Had a Little Lamb", n:
      "E4 D4 C4 D4 E4 E4 E4 R D4 D4 D4 R E4 G4 G4 R E4 D4 C4 D4 E4 E4 E4 E4 D4 D4 E4 D4 C4 R" },
    { ja: "ちょうちょう", en: "Lightly Row", n:
      "G4 E4 E4 R F4 D4 D4 R C4 D4 E4 F4 G4 G4 G4 R G4 E4 E4 E4 F4 D4 D4 D4 C4 E4 G4 G4 E4 E4 E4 R D4 D4 D4 D4 D4 E4 F4 R E4 E4 E4 E4 E4 F4 G4 R G4 E4 E4 E4 F4 D4 D4 D4 C4 E4 G4 G4 C4 R" },
    { ja: "ロンドン橋", en: "London Bridge", n:
      "G4 A4 G4 F4 E4 F4 G4 R D4 E4 F4 R E4 F4 G4 R G4 A4 G4 F4 E4 F4 G4 R D4 R G4 R E4 C4 R R" },
    { ja: "聖者の行進", en: "When the Saints Go Marching In", n:
      "C4 E4 F4 G4 R R C4 E4 F4 G4 R R C4 E4 F4 G4 E4 C4 E4 D4 R R E4 E4 D4 C4 R C4 E4 G4 G4 F4 R E4 F4 G4 E4 C4 D4 C4 R" },
    { ja: "ジングルベル", en: "Jingle Bells", n:
      "E4 E4 E4 R E4 E4 E4 R E4 G4 C4 D4 E4 R R R F4 F4 F4 F4 F4 E4 E4 E4 E4 D4 D4 E4 D4 R G4 R E4 E4 E4 R E4 E4 E4 R E4 G4 C4 D4 E4 R R R F4 F4 F4 F4 F4 E4 E4 E4 E4 G4 G4 F4 D4 C4 R R" },
    { ja: "かねがなる", en: "Frère Jacques", n:
      "C4 D4 E4 C4 C4 D4 E4 C4 E4 F4 G4 R E4 F4 G4 R G4 A4 G4 F4 E4 C4 G4 A4 G4 F4 E4 C4 C4 G3 C4 R C4 G3 C4 R" },
    { ja: "ゆかいな牧場", en: "Old MacDonald Had a Farm", n:
      "C4 C4 C4 G3 A3 A3 G3 R E4 E4 D4 D4 C4 R R G3 C4 C4 C4 G3 A3 A3 G3 R E4 E4 D4 D4 C4 R R R" }
  ];
  /* お試し：1画面のまま、マスを細かくして3倍くらい長い迷路と長い曲（URL に ?long を付けるか、MELODY_LONG） */
  var LONG = !!window.MELODY_LONG || /[?&]long\b/.test(location.search);
  if (LONG) SONGS = [
    { ja: "歓喜の歌", en: "Ode to Joy", n:
      "E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4 D4 D4 R E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4 R D4 D4 E4 C4 D4 E4 F4 E4 C4 D4 E4 F4 E4 D4 C4 D4 G3 R E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4 R D4 D4 E4 C4 D4 E4 F4 E4 C4 D4 E4 F4 E4 D4 C4 D4 G3 R E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4 C4 C4 R" },
    { ja: "美しく青きドナウ", en: "The Blue Danube", n:
      "C4 C4 E4 G4 G4 R R G5 R G5 E5 R E5 C4 C4 E4 G4 G4 R R G5 R G5 F5 R F5 B3 B3 D4 A4 A4 R R A5 R A5 F5 R F5 B3 B3 D4 A4 A4 R R A5 R A5 E5 R E5 C4 C4 E4 G4 C5 R R C6 R C6 G5 R G5 C4 C4 E4 G4 C5 R R C6 R C6 A5 R A5 D4 D4 F4 A4 A4 R R F5 R E5 D5 R C5 R R" },
    { ja: "ジングルベル", en: "Jingle Bells", n:
      "E4 E4 E4 R E4 E4 E4 R E4 G4 C4 D4 E4 R R R F4 F4 F4 F4 F4 E4 E4 E4 E4 D4 D4 E4 D4 R G4 R E4 E4 E4 R E4 E4 E4 R E4 G4 C4 D4 E4 R R R F4 F4 F4 F4 F4 E4 E4 E4 E4 G4 G4 F4 D4 C4 R R E4 E4 E4 R E4 E4 E4 R E4 G4 C4 D4 E4 R R R F4 F4 F4 F4 F4 E4 E4 E4 E4 D4 D4 E4 D4 R G4 R E4 E4 E4 R E4 E4 E4 R E4 G4 C4 D4 E4 R R R F4 F4 F4 F4 F4 E4 E4 E4 E4 G4 G4 F4 D4 C4 R R" }
  ];
  var NAMES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function isRest(nn) { return nn === "R"; }
  function hzOf(nn) { return 440 * Math.pow(2, (NAMES[nn[0]] + (+nn[1] + 1) * 12 - 69) / 12); }
  /* 音の色は音名ごと（オクターブ違いは同じ色） */
  var NOTE_COLOR = { C: "#ff7a7a", D: "#ffb26b", E: "#ffe36b", F: "#7be08a", G: "#6bd5ff", A: "#b48cff", B: "#ff8cd9" };
  function colorOfNote(nn) { return isRest(nn) ? "#c9c2b6" : NOTE_COLOR[nn[0]]; }
  var song, SONG, BASS;
  var songNo = -1;
  function pickSong(k) {
    songNo = k !== undefined ? k : (songNo < 0 ? Math.floor(Math.random() * SONGS.length)
      : (songNo + 1 + Math.floor(Math.random() * (SONGS.length - 1))) % SONGS.length);   /* 前と同じ曲は続けない */
    song = SONGS[songNo];
    SONG = song.n.split(" ");
    /* 入口から出口までの道のマス数の偶奇は迷路の大きさで決まるので、合わないときは最後に休符を足す */
    if (SONG.length % 2 !== (NX + NY - 1) % 2) SONG.push("R");
    /* 伴奏：4音ごとに、ド・ファ・ソの和音のうち旋律にいちばん合うものの根音を低く鳴らす */
    var CH = [[0, 4, 7, 130.81], [7, 11, 2, 98.0], [5, 9, 0, 87.31]];
    BASS = [];
    for (var i = 0; i < SONG.length; i += 4) {
      var bestC = CH[0], bestN = -1;
      CH.forEach(function (ch) {
        var n = 0;
        for (var j = i; j < Math.min(i + 4, SONG.length); j++) if (!isRest(SONG[j]) && ch.indexOf(NAMES[SONG[j][0]]) >= 0 && ch.indexOf(NAMES[SONG[j][0]]) < 3) n += j === i ? 2 : 1;
        if (n > bestN) { bestN = n; bestC = ch; }
      });
      BASS.push(bestC[3]);
    }
  }

  /* ============ 迷路 ============
     横 NX × 縦 NY のマス。壁はマスの間の線。入口は左上、出口は右下 */
  var NX = LONG ? 14 : 8, NY = LONG ? 21 : 11, B = LONG ? 36 : 60;
  var wallR, wallD;            /* wallR[i]: マスiの右に壁, wallD[i]: 下に壁 */
  var path = [], onPath, pathIdx;

  function idx(x, y) { return y * NX + x; }
  function open(a, b) {
    var ax = a % NX, ay = (a / NX) | 0, bx = b % NX, by = (b / NX) | 0;
    if (by === ay && bx === ax + 1) return !wallR[a];
    if (by === ay && bx === ax - 1) return !wallR[b];
    if (bx === ax && by === ay + 1) return !wallD[a];
    if (bx === ax && by === ay - 1) return !wallD[b];
    return false;
  }
  function generate() {
    pickSong();
    var total = NX * NY, keep = null;
    for (var tries = 0; tries < (LONG ? 6000 : 1500); tries++) {
      wallR = new Uint8Array(total).fill(1);
      wallD = new Uint8Array(total).fill(1);
      /* 穴を掘り進んで、行き止まりで戻る作り方（長くうねる道になる） */
      var seen = new Uint8Array(total), stack = [0];
      seen[0] = 1;
      while (stack.length) {
        var c0 = stack[stack.length - 1], x0 = c0 % NX, y0 = (c0 / NX) | 0, nb = [];
        if (x0 + 1 < NX && !seen[c0 + 1]) nb.push(c0 + 1);
        if (x0 > 0 && !seen[c0 - 1]) nb.push(c0 - 1);
        if (y0 + 1 < NY && !seen[c0 + NX]) nb.push(c0 + NX);
        if (y0 > 0 && !seen[c0 - NX]) nb.push(c0 - NX);
        if (!nb.length) { stack.pop(); continue; }
        var nx0 = nb[Math.floor(Math.random() * nb.length)];
        var a0 = Math.min(c0, nx0), b0 = Math.max(c0, nx0);
        if (b0 === a0 + 1) wallR[a0] = 0; else wallD[a0] = 0;
        seen[nx0] = 1;
        stack.push(nx0);
      }
      /* 入口から出口までの道 */
      var prev = new Int32Array(total).fill(-1), q = [0];
      prev[0] = 0;
      for (var h = 0; h < q.length; h++) {
        var c = q[h], cx = c % NX, cy = (c / NX) | 0;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
          var X = cx + d[0], Y = cy + d[1];
          if (X < 0 || Y < 0 || X >= NX || Y >= NY) return;
          var m = idx(X, Y);
          if (prev[m] >= 0 || !open(c, m)) return;
          prev[m] = c; q.push(m);
        });
      }
      path = [];
      for (var k = total - 1; k !== 0; k = prev[k]) path.unshift(k);
      path.unshift(0);
      /* 出口でちょうど曲が終わる長さの迷路を探す。なければいちばん近いもの */
      var diff = Math.abs(path.length - SONG.length);
      if (!keep || diff < keep.diff) keep = { diff: diff, wallR: wallR, wallD: wallD, path: path };
      if (diff === 0) break;
    }
    wallR = keep.wallR; wallD = keep.wallD; path = keep.path;
    onPath = new Int32Array(total).fill(-1);
    path.forEach(function (c, i) { onPath[c] = i; });
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", GOAL: "goal", RESULT: "result" };
  var fresh = false;            /* 待機画面で見せた迷路は、最初の1回はそのまま使う */
  var state, T, cell, best, time = 0, misses = 0;
  var line = [0], grow = 1;      /* 今たどっている線（引き返すと縮む）。grow は1マス動く途中の進み 0〜1 */
  var shrinking = false;
  var MOVE = 0.16;                /* 1マス跳ぶ時間 */
  var landT = 9;                  /* 跳んでからの経過 */
  /* 1回フリックすると1マス跳ぶ（指を離すまで次は数えない）。続けてはじいた分は順番にためて、一定のテンポ（1拍ごと）で進む */
  var BEAT = 0.2, beatT = BEAT, queue = [];
  var BX = 0, BY = 0;
  var acc = { x: 0, y: 0 };
  var bump = { x: 0, y: 0, t: 0 };
  var glow = [];                /* 鳴らしたマスの光 */

  function place() {
    BX = Math.round((W - NX * B) / 2);
    BY = Math.round((H - NY * B) / 2);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    T = 0;
    if (fresh) generate();
    fresh = true;
    setup3d();
    cell = 0;
    best = 0;
    pathIdx = 0;
    time = 0;
    misses = 0;
    line = [0];
    grow = 1;
    shrinking = false;
    beatT = BEAT; queue = [];
    glow = [];
    acc = { x: 0, y: 0 };
    playStep(0);
  }

  function secText() { return (Math.floor(time * 10) / 10).toFixed(1); }

  /* 音はボールが着地したときに鳴らす */
  function playStep(i, land) {
    var nn = SONG[i % SONG.length];
    panTo(path[i]);
    if (!isRest(nn)) {
      note(hzOf(nn), 0.9, 0.16, land);
      if (scene3d) scene3d.sing(colorOfNote(nn));
    } else tick(land);                                     /* 休符のマスは、通ったとわかる小さな音だけ */
    if (i % 4 === 0) note(BASS[(i / 4 | 0) % BASS.length], 1.4, 0.09, land);
    if (!isRest(nn)) glow.push({ c: path[i], t: -(land || 0) });
  }

  /* 1マス動く。壁なら動かない。ひとつ前のマスへ戻ると線が縮む。
     正しい道へ進むと曲が鳴り、行き止まりへ向かう道ではこつんと鳴る */
  function step(dx, dy) {
    if (state !== S.PLAY) return;
    var x = cell % NX, y = (cell / NX) | 0, X = x + dx, Y = y + dy;
    if (X < 0 || Y < 0 || X >= NX || Y >= NY || !open(cell, idx(X, Y))) {
      bump = { x: dx, y: dy, t: 0.12 };
      return;
    }
    var next = idx(X, Y);
    if (shrinking) { line.pop(); shrinking = false; }   /* 前の動きの途中でも、先に片付ける */
    if (scene3d) scene3d.rollTo(x, y, X, Y, MOVE);
    cell = next;
    if (line.length > 1 && line[line.length - 2] === next) { shrinking = true; grow = 0; return; }
    line.push(next);
    grow = 0;
    landT = 0;
    var k = onPath[next];
    if (k < 0) {
      misses++;
      panTo(next);
      knock(MOVE);
      if (scene3d) scene3d.oops();
      glow.push({ c: next, t: -MOVE, bad: true });
      return;
    }
    best = Math.max(best, k);
    playStep(k, MOVE);
    if (k === path.length - 1) win();
  }
  function canGo(d) {
    var x = cell % NX + d[0], y = ((cell / NX) | 0) + d[1];
    return x >= 0 && y >= 0 && x < NX && y < NY && open(cell, idx(x, y));
  }
  /* ゴールしたら、できあがった楽譜を頭から通しで演奏してから結果を出す */
  var REPLAY_AT = 0.8, REPLAY_STEP = 0.12, replayed = 0;
  function win() {
    state = S.GOAL;
    T = 0;
    replayed = 0;
  }
  function replayEnd() { return REPLAY_AT + path.length * REPLAY_STEP; }
  function updateReplay() {
    while (replayed < path.length && T >= REPLAY_AT + replayed * REPLAY_STEP) {
      var i = replayed++, nn = SONG[i % SONG.length];
      if (i % 4 === 0) note(BASS[(i / 4 | 0) % BASS.length], 1.4, 0.09);
      if (!isRest(nn)) {                                   /* 演奏では休符は鳴らさない */
        panTo(path[i]);
        note(hzOf(nn), 0.9, 0.16);
        glow.push({ c: path[i], t: 0 });
      }
      /* 最後に和音 */
      if (replayed === path.length) [261.63, 329.63, 392.0, 523.25].forEach(function (f, j) { note(f, 1.8, 0.1, REPLAY_STEP + j * 0.03); });
    }
  }

  /* ============ 進行 ============ */
  function update(dt) {
    glow.forEach(function (g) { g.t += dt; });
    grow = Math.min(1, grow + dt / MOVE);
    landT += dt;
    if (scene3d) scene3d.update(dt);
    if (grow >= 1 && shrinking) { line.pop(); shrinking = false; }
    beatT = Math.min(BEAT, beatT + dt);
    if (state === S.PLAY && beatT >= BEAT) {
      var d = queue.shift();
      if (d) {
        if (canGo(d)) { beatT -= BEAT; step(d[0], d[1]); }
        else queue = [];                          /* 壁に当たったら、ためた分は捨てる */
      }
    }
    if (bump.t > 0) bump.t = Math.max(0, bump.t - dt);
    if (state === S.PLAY) time += dt;
    if (state === S.GOAL) {
      T += dt;
      updateReplay();
      if (T > replayEnd() + 1.6) { state = S.RESULT; shareButton.hidden = false; }
    }
  }

  /* ============ 入力 ============
     指をすべらせた向きへ1マスずつ進む（どこをなぞってもよい）。キーは矢印 */
  var held = false, lastP = null;
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    /* 演奏中にタップすると結果へ飛ばす */
    if (state === S.GOAL) { if (T > REPLAY_AT + 0.5) { replayed = path.length; T = replayEnd() + 1.6; } return; }
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    held = true;
    lastP = x == null ? null : { x: x, y: y };   /* 押した点からはじいた向きへ進む */
  }
  function move(x, y) {
    if (!held || !lastP) return;
    var dx = x - lastP.x, dy = y - lastP.y;
    if (Math.hypot(dx, dy) > 28) {
      if (queue.length < 3) queue.push(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
      lastP = null;                              /* 1回はじいたら、指を離すまで次は数えない */
    }
  }
  function up() { held = false; lastP = null; }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(k) {
    if (state !== S.PLAY) return;
    if (k === 1) {                                       /* 正しい道を1マス自動で進む */
      if (onPath[cell] < 0) return;
      var nx = path[onPath[cell] + 1];
      step(nx % NX - cell % NX, ((nx / NX) | 0) - ((cell / NX) | 0));
    }
    if (k === 2) { cell = path[path.length - 2]; best = path.length - 2; line = path.slice(0, -1); if (scene3d) scene3d.place(cell % NX, (cell / NX) | 0); }   /* 出口の手前へ */
    if (k === 3) { fresh = true; newRound(); }   /* 次の曲で迷路を作り直す */

  }

  var DIRS = { ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
               ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1] };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var dir = DIRS[e.key];
    if (!esc && !go && !dir) return;
    e.preventDefault();
    if (esc) { if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (dir) { if (!e.repeat && queue.length < 3) queue.push(dir); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (DIRS[e.key]) return;
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    var s = secText();
    var ja = "迷路を歩いて「" + song.ja + "」を" + s + "秒で弾ききった" + (misses ? "（寄り道" + misses + "マス）" : "（寄り道なし）");
    var en = "Played \"" + song.en + "\" by walking a maze in " + s + "s" + (misses ? " (" + misses + " detour steps)" : " (no detours)");
    window.zResultActions.x({ text: zT(ja, en) + zT(" #メロディ迷路", " #MelodyMaze") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }


  /* 床の模様：たどっている線（マスごとの音の色をグラデーションでつなぐ）・光・出口。
     g に、1マス B の大きさで描く */
  function drawFloor(g, B) {
    function center(c) { return { x: (c % NX + 0.5) * B, y: (((c / NX) | 0) + 0.5) * B }; }
    var S5 = B * 0.12, LW = Math.max(1, B * 0.025), INK = "#2b2b36", PAPER = "#f4efe6";
    /* 通った道に五線を引く：太さを変えて重ね塗りして、5本の線を道なりに引く */
    function staff(pts) {
      if (pts.length < 2) return;
      g.beginPath();
      g.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
      g.lineJoin = "miter";
      g.lineCap = "square";
      g.lineCap = "butt";
      [[4 * S5 + LW, INK], [4 * S5 - LW, PAPER], [2 * S5 + LW, INK], [2 * S5 - LW, PAPER], [LW, INK]].forEach(function (w) {
        g.lineWidth = w[0]; g.strokeStyle = w[1]; g.stroke();
      });
    }
    /* 音符の玉。上向きは横の道なら画面の上、縦の道なら画面の右 */
    var STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
    function noteHead(i, k) {
      var c = line[i], o = center(c), from = i > 0 ? line[i - 1] : (line.length > 1 ? c - (line[1] - c) : c - 1);
      var vert = Math.abs(c - from) === NX, ux = vert ? 1 : 0, uy = vert ? 0 : -1;
      var nn = SONG[k % SONG.length];
      if (isRest(nn)) {
        /* 四分休符（ジグザグの記号） */
        g.save();
        g.translate(o.x, o.y);
        g.rotate(vert ? Math.PI / 2 : 0);
        g.strokeStyle = INK; g.lineWidth = LW * 2.2; g.lineCap = "round"; g.lineJoin = "round";
        var h = S5;
        g.beginPath();
        g.moveTo(-h * 0.3, -h * 1.5); g.lineTo(h * 0.35, -h * 0.7); g.lineTo(-h * 0.3, h * 0.1); g.lineTo(h * 0.35, h * 0.8);
        g.quadraticCurveTo(-h * 0.5, h * 0.6, -h * 0.05, h * 1.5);
        g.stroke();
        g.restore();
        return;
      }
      var p = STEP[nn[0]] + (+nn[nn.length - 1]) * 7 - (2 + 4 * 7);   /* ミ4（下の線）が0、1つ上がるごとに半間 */
      var off = (p - 4) * S5 / 2;
      g.save();
      g.translate(o.x + ux * off, o.y + uy * off);
      g.rotate(vert ? Math.PI / 2 : 0);
      g.fillStyle = g.strokeStyle = INK;
      /* 五線の外は加線 */
      g.lineWidth = LW;
      for (var q = -2; q >= p; q -= 2) { var d = (p - q) * S5 / 2; g.beginPath(); g.moveTo(-S5 * 1.1, d); g.lineTo(S5 * 1.1, d); g.stroke(); }
      for (var q2 = 10; q2 <= p; q2 += 2) { var d2 = (p - q2) * S5 / 2; g.beginPath(); g.moveTo(-S5 * 1.1, d2); g.lineTo(S5 * 1.1, d2); g.stroke(); }
      g.rotate(-0.35);
      g.beginPath(); g.ellipse(0, 0, S5 * 0.85, S5 * 0.6, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    var pts = line.map(center), head = null, n = line.length;
    /* 五線は入口のマスの外側の辺から始め、♪の動きに合わせてペンで引くように伸ばす（引き返すと縮む） */
    var d0 = n > 1 ? { x: Math.sign(pts[1].x - pts[0].x), y: Math.sign(pts[1].y - pts[0].y) } : { x: 1, y: 0 };
    var draw = [{ x: pts[0].x - d0.x * B / 2, y: pts[0].y - d0.y * B / 2 }].concat(pts.slice(0, Math.max(1, n - 1)));
    var landed = true;
    if (n > 1) {
      var a0 = pts[n - 2], b0 = pts[n - 1], f = shrinking ? 1 - grow : grow;
      head = { x: a0.x + (b0.x - a0.x) * f, y: a0.y + (b0.y - a0.y) * f };
      if (f > 0) draw.push(head);
      landed = !shrinking && landT >= MOVE;
    }
    staff(draw);
    /* 音符の玉は着地したときに置く。寄り道したマスは赤くかぶせる */
    for (var i = 0; i < n; i++) {
      if (i === n - 1 && !landed) continue;
      var k = onPath[line[i]], o = pts[i];
      if (k < 0) { g.fillStyle = "rgba(229,72,77,.45)"; g.fillRect(o.x - B / 2, o.y - B / 2, B, B); continue; }
      noteHead(i, k);
    }
    /* 鳴ったばかりのマスが光る */
    glow.forEach(function (gl) {
      if (gl.t > 0.5 || gl.t < 0) return;
      var c = center(gl.c), k = 1 - gl.t / 0.5;
      g.fillStyle = (gl.bad ? "rgba(255,60,70," : "rgba(255,190,40,") + (0.5 * k).toFixed(3) + ")";
      g.beginPath(); g.arc(c.x, c.y, B * (0.25 + (1 - k) * 0.45), 0, Math.PI * 2); g.fill();
    });
    /* 出口 */
    g.strokeStyle = INK;
    g.lineWidth = B * 0.05;
    g.strokeRect((NX - 1) * B + B * 0.17, (NY - 1) * B + B * 0.17, B * 0.66, B * 0.66);
    return head;
  }

  /* 立体の場面。three.js が使えないときは上から見た絵のまま */
  var scene3d = null, floor = null, FB = 64;
  try { if (window.THREE && window.MazeScene) scene3d = new window.MazeScene(); } catch (e) { scene3d = null; }
  function setup3d() {
    if (!scene3d) return;
    try {
      floor = document.createElement("canvas");
      floor.width = NX * FB; floor.height = NY * FB;
      scene3d.setup({ NX: NX, NY: NY, wallR: wallR, wallD: wallD, start: 0 }, floor);
    } catch (e) { scene3d = null; }
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    glow = glow.filter(function (g) { return g.t <= 0.5; });
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#172033";
    ctx.fillRect(0, 0, W, H);
    if (!path.length) return;

    if (scene3d && floor) {
      try {
        var fg = floor.getContext("2d");
        /* 床は最初から全部、楽譜の紙の色 */
        fg.fillStyle = "#f4efe6";
        fg.fillRect(0, 0, floor.width, floor.height);
        /* マス目をうっすら */
        fg.strokeStyle = "rgba(43,43,54,.05)";
        fg.lineWidth = 2;
        for (var gx = 1; gx < NX; gx++) { fg.beginPath(); fg.moveTo(gx * FB, 0); fg.lineTo(gx * FB, NY * FB); fg.stroke(); }
        for (var gy = 1; gy < NY; gy++) { fg.beginPath(); fg.moveTo(0, gy * FB); fg.lineTo(NX * FB, gy * FB); fg.stroke(); }
        drawFloor(fg, FB);
        scene3d.render(ctx, W, H);
        if (state === S.RESULT) drawResult();
        return;
      } catch (e) { scene3d = null; }
    }

    ctx.save();
    ctx.translate(BX, BY);
    if (bump.t > 0) ctx.translate(bump.x * bump.t * 30, bump.y * bump.t * 30);
    var head = drawFloor(ctx, B);

    /* 壁 */
    ctx.strokeStyle = "#e8ecf4";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(NX * B, 0);
    ctx.moveTo(0, 0); ctx.lineTo(0, NY * B);
    for (var yy = 0; yy < NY; yy++) for (var xx = 0; xx < NX; xx++) {
      var k2 = idx(xx, yy);
      if (wallR[k2] && !(xx === NX - 1 && yy === NY - 1)) { ctx.moveTo((xx + 1) * B, yy * B); ctx.lineTo((xx + 1) * B, (yy + 1) * B); }
      if (wallD[k2]) { ctx.moveTo(xx * B, (yy + 1) * B); ctx.lineTo((xx + 1) * B, (yy + 1) * B); }
    }
    ctx.stroke();

    /* 自分 */
    var px = (cell % NX + 0.5) * B, py = (((cell / NX) | 0) + 0.5) * B;
    if (head && grow < 1) { px = head.x; py = head.y; }
    ctx.beginPath();
    ctx.arc(px, py, B * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.restore();

    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, cell: cell, best: best, pathLen: path.length, songLen: SONG.length, song: song.ja, time: time, misses: misses, W: W, H: H }; },
    path: function () { return path.slice(); },
    step: function (k) { for (var i = 0; i < (k || 1); i++) { update(1 / 60); draw(); } },
    go: function (dx, dy) { step(dx, dy); },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(4000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (k) { startButton.addEventListener(k, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  /* 待機画面にも迷路を見せておく（START を押すと新しく作り直す） */
  generate();
  setup3d();
  cell = 0; best = -1;
  state = S.INTRO;
  startButton.hidden = false;
  shareButton.hidden = true;
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
</html>
