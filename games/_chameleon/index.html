<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>カメレオン</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #000; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* カメレオン（題名は仮）

   上はゲームの画面、下はカラーホイール。
   カメレオンは枝の上を歩いて進む。背景の色が次々に変わるので、ホイールで体の色を合わせる。
   色が合っていない時間が続くと、上の鳥に見つかってさらわれる。抜けた背景の数が記録。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  /* ============ 音楽 ============
     背景の色からその場で曲を作る。色相で調（隣り合う色は近い調）、
     赤〜黄緑は明るい音階、水色〜紫は暗い音階。鮮やかなほど音が増えて硬い音色になり、
     白っぽいところは静かな和音だけ。進むほど速くなる。 */
  var BUS = null, stepI = 0;
  function bgmBus() {
    if (BUS || !AC) return;
    var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 3200;
    BUS = AC.createGain(); BUS.gain.value = 0;
    BUS.connect(f); f.connect(AC.destination);
  }
  function bgmStart() {
    if (!AC) return; bgmBus();
    var n = AC.currentTime;
    BUS.gain.cancelScheduledValues(n); BUS.gain.setValueAtTime(BUS.gain.value, n);
    BUS.gain.linearRampToValueAtTime(1, n + 0.6);
    stepI = Math.ceil(walk / STEP_PX);
  }
  function bgmStop(sec) {
    if (!BUS) return;
    var n = AC.currentTime;
    BUS.gain.cancelScheduledValues(n); BUS.gain.setValueAtTime(BUS.gain.value, n);
    BUS.gain.linearRampToValueAtTime(0, n + (sec || 0.4));
  }
  function note(freq, at, dur, vol, type, att) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    att = att || 0.01;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + att);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(BUS);
    o.start(at); o.stop(at + dur + 0.05);
  }
  function hat(at, vol) {
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7000;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.04);
    s.connect(f); f.connect(g); g.connect(BUS);
    s.start(at, Math.random()); s.stop(at + 0.06);
  }
  function kick(at, vol) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(130, at); o.frequency.exponentialRampToValueAtTime(45, at + 0.12);
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
    o.connect(g); g.connect(BUS); o.start(at); o.stop(at + 0.2);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  /* 7色＝ドレミファソラシ。曲はハ長調で、背景の色の音を根にした和音を1小節鳴らす */
  var SCALE = [0, 2, 4, 5, 7, 9, 11];
  function deg(d) { return SCALE[d % 7] + 12 * Math.floor(d / 7); }
  var ARP = [0, 2, 4, 2, 7, 4, 2, 4];
  /* 曲は歩いた距離で刻む。8分音符1つ＝STEP_PX 進むごと。小節（8つ）の頭で背景の色が変わる */
  function bgmTick() {
    if (!AC || !BUS || state !== S.PLAY) return;
    var now = AC.currentTime, sp = speed(), step = 30 / bpm();
    /* 端末の音の出る遅れぶん早めに鳴らす（画面と耳をそろえる） */
    var lat = Math.min(0.15, (AC.outputLatency || 0) + (AC.baseLatency || 0));
    if (stepI * STEP_PX < walk - STEP_PX) stepI = Math.ceil(walk / STEP_PX);
    for (;;) {
      var at = now + (stepI * STEP_PX - walk) / sp - lat;
      if (at > now + 0.12) break;
      playStep(stepI, Math.max(now, at), step);
      stepI++;
    }
  }
  function playStep(i, at, step) {
    var d = colorAt(i * STEP_PX).i || 0, b = i % 8;
    /* 1つ先（半拍後）が色の境目なら、ここで跳ぶ音 */
    for (var zi = 0; zi < zones.length; zi++) if (zones[zi].x === (i + 1) * STEP_PX) { SND.jump(at - AC.currentTime); break; }
    /* 和音：小節の頭にふわっと */
    if (b === 0) [0, 2, 4].forEach(function (k) { note(mtof(60 + deg(d + k)), at, step * 8, 0.022, "sine", 0.2); });
    /* 低音 */
    if (b === 0 || b === 4 || b === 6) note(mtof(36 + deg(d) + (b === 4 ? 7 : 0)), at, step * 1.8, 0.07, "triangle");
    /* 上の分散和音（控えめ。押した音が聞こえるように） */
    if (b % 2 === 1 || Math.random() < 0.3) note(mtof(72 + deg(d + ARP[b])), at, step * 0.9, 0.018, "square", 0.005);
    if (b % 2 === 1) hat(at, 0.03);
    if (b === 0 || b === 4) kick(at, 0.18);
  }

  /* ============ 鍵盤の音 ============
     押した色の音（ド〜シ）を鳴らす。山びこ（遅れて繰り返す）をかけてやわらかく */
  var KEYS = null;
  function keyBus() {
    if (KEYS || !AC) return KEYS;
    var out = AC.createGain(); out.gain.value = 0.9; out.connect(AC.destination);
    var dl = AC.createDelay(1); dl.delayTime.value = 0.32;
    var fb = AC.createGain(); fb.gain.value = 0.35;
    var wet = AC.createGain(); wet.gain.value = 0.4;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
    dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(out);
    KEYS = AC.createGain(); KEYS.connect(out); KEYS.connect(dl);
    return KEYS;
  }
  function playKey(d) {
    if (!keyBus()) return;
    var at = AC.currentTime, f = mtof(72 + deg(d));
    var o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), g2 = AC.createGain();
    o.type = "triangle"; o2.type = "sine"; o.frequency.value = f; o2.frequency.value = f * 2;
    g2.gain.value = 0.3;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.09, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 1.1);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(KEYS);
    o.start(at); o2.start(at); o.stop(at + 1.2); o2.stop(at + 1.2);
  }

  var SND = {
    /* タン：跳ぶ音（木を軽くたたいたような） */
    jump: function (dl) { dl = Math.max(0, dl || 0); tone(520, 0.07, 0.09, "triangle", 260, dl); noiseHit(0.03, 1800, 0.25, 1.2, dl); },
    /* パシッ：短い破裂音＋その色の音の和音を一発 */
    ok: function (d) {
      noiseHit(0.05, 2600, 0.5, 0.9);
      noiseHit(0.12, 6000, 0.18, 0.6, 0.01);
      tone(160, 0.08, 0.12, "sine", 60);
      [0, 2, 4, 7].forEach(function (k) { tone(mtof(72 + deg(d + k)), 0.22, 0.035, "square"); });
      tone(mtof(96 + deg(d)), 0.4, 0.03, "sine", 0, 0.05);
    },
    hit: function () { tone(1800, 0.35, 0.06, "sawtooth", 900); tone(1500, 0.3, 0.05, "sawtooth", 700, 0.25); noiseHit(0.5, 1200, 0.3, 0.7, 0.4); }
  };

  /* ============ 色 ============
     下の色の帯は境目なし。左から右へ色相が一周する。出てくる色はどれも鮮やか。
     色は { h: 色相(度), t: 濃さ（いまは常に1） }。色相が近ければ「だいたい合っている」ですり抜ける。 */
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }
  function rgbOf(c) { return hsl(c.h, 90, 97 - 47 * c.t); }
  function css(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  function colOf(c) { return css(rgbOf(c)); }
  /* ホイールの上の位置（半径1） */
  function pos(c) { var a = (c.h - 60) * Math.PI / 180; return { x: Math.sin(a) * c.t, y: -Math.cos(a) * c.t }; }
  function dist(a, b) { var p = pos(a), q = pos(b); return Math.hypot(p.x - q.x, p.y - q.y); }
  var TOL = 0.42; /* これより近ければすり抜ける（ホイールの半径を1として） */
  function near(a, b) { return dist(a, b) < TOL; }
  /* 進むほど出る色が増える。濃さ t の範囲と、色相の選び方 */
  /* 7色（ド レ ミ ファ ソ ラ シ） */
  var HUES = [0, 30, 58, 120, 190, 235, 285];
  function colorN(i) { return { h: HUES[i], t: 1, i: i }; }
  /* 進むほど出る色が増える：ドミソ → ドレミソラ → 7色全部 */
  var STEPS = [
    { at: 0, set: [0, 2, 4] },
    { at: 8, set: [0, 1, 2, 4, 5] },
    { at: 18, set: [0, 1, 2, 3, 4, 5, 6] }
  ];
  function randomColor(n) {
    var st = STEPS[0];
    STEPS.forEach(function (x) { if (n >= x.at) st = x; });
    return colorN(st.set[Math.floor(Math.random() * st.set.length)]);
  }

  /* ============ 配置 ============ */
  var SX = 20, SY = 20, SW = 500, SH = 300, CX = 270, CY = 200, HEAD = 25;
  /* 下の色の帯（横一列。左から右へ色相が一周する） */
  var BX = 20, BY = 700, BW = 500, BH = 120;
  function place() {
    /* 親指で触りやすいよう太めにし、画面の下の縁から少し離す */
    BH = 170;
    SH = Math.max(320, Math.min(560, H - 20 - 24 - BH - 56));
    /* 画面と帯をひとまとめにして縦の真ん中へ（帯の下は少なくとも56空ける） */
    var total = SH + 24 + BH;
    SY = Math.max(20, Math.min((H - total) / 2, H - 56 - total));
    CX = SX + 130; CY = SY + SH - 75;
    BX = SX; BW = SW; BY = SY + SH + 24;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: 0, PLAY: 1, OVER: 2, RESULT: 3 };
  var state = S.INTRO, score = 0, T = 0, cur = colorN(0), shown = [246, 244, 238], overT = 0;
  var zones = [], walk = 0, exp = 0, fx = [], blink = 0, eyeT = 0, invincible = false, grabX = 0, grabY = 0;

  function newRound() {
    rings = []; jumpLine = -1; state = S.PLAY; score = 0; T = 0; cur = colorN(0); overT = 0; fx = []; exp = 0;
    makeZones(0); bgmStart();
    shareButton.hidden = true;
    if (startButton) startButton.hidden = true;
  }
  /* 背景の色。決まった色の区間（w）と、次の色へなめらかに移る区間（tr）が交互に来る。最初は白 */
  /* 色の区切りは小節の頭。1小節＝BAR_PX。移り変わりは小節の終わりの方で、頭でちょうど次の色になる */
  var STEP_PX = 44, BAR_PX = STEP_PX * 8;
  function makeZones(n) {
    score = n; walk = 0;
    zones = [{ x: -BAR_PX * 2, w: BAR_PX * 4, tr: 0, c: colorN(0), n: n, got: true }];
    fill();
  }
  function fill() {
    while (zones[zones.length - 1].x < walk + SW * 2) {
      var last = zones[zones.length - 1], n = last.n + 1;
      var c = randomColor(n);
      for (var k = 0; k < 6 && c.i === last.c.i; k++) c = randomColor(n);
      /* 長さは1小節。進むとときどき半小節も混ざる。色は小節の頭でぱっと変わる */
      var len = n >= 20 && Math.random() < 0.3 ? BAR_PX / 2 : BAR_PX;
      zones.push({ x: last.x + last.w + last.tr, w: len, tr: 0, c: c, n: n });
    }
    while (zones.length > 2 && zones[1].x + zones[1].w + zones[1].tr < walk - SW) zones.shift();
  }
  function zoneAt(x) {
    for (var i = zones.length - 1; i >= 0; i--) if (x >= zones[i].x) return zones[i];
    return zones[0];
  }
  /* その場所の背景の色。移る区間は色相の近い回り方で移る */
  function colorAt(x) {
    if (!zones.length) return { h: 0, t: 0 };
    for (var i = zones.length - 1; i >= 0; i--) {
      var z = zones[i];
      if (x < z.x) continue;
      if (x < z.x + z.w || !zones[i + 1] || !z.tr) return z.c;
      var u = (x - z.x - z.w) / z.tr; u = u * u * (3 - 2 * u);
      var a = z.c, b = zones[i + 1].c, d = ((b.h - a.h) % 360 + 540) % 360 - 180;
      return { h: ((a.h + d * u) % 360 + 360) % 360, t: a.t + (b.t - a.t) * u };
    }
    return zones[0].c;
  }
  /* 歩く速さ（px/秒）と、色が合っていなくても見つからない秒数 */
  function bpm() { return Math.min(210, 110 + score * 2.5); }
  function speed() { return bpm() / 60 * STEP_PX * 2; }
  function grace() { return Math.max(0.4, 0.95 - score * 0.015); }

  function update(dt) {
    blink -= dt; eyeT += dt;
    if (blink < -3 - Math.random() * 3) blink = 0.15;
    hopT += dt; popT += dt; poseT += dt;
    rings.forEach(function (g) { g.t += dt; });
    rings = rings.filter(function (g) { return g.t < g.delay + 0.35; });
    for (var q = 0; q < 7; q++) pressT[q] += dt;
    fx.forEach(function (e) { e.t += dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 500 * dt; });
    fx = fx.filter(function (e) { return e.t < e.life; });
    /* 体の色は少しだけかけて変わる（見た目だけ。判定はすぐ） */
    var tc = rgbOf(cur);
    for (var k = 0; k < 3; k++) shown[k] += (tc[k] - shown[k]) * Math.min(1, dt * 22);
    if (state === S.OVER) { overT += dt; if (overT > 2.0) state = S.RESULT; return; }
    if (state !== S.PLAY) return;
    T += dt;
    walk += speed() * dt;
    fill();
    /* 今の背景（と、少し先の次の背景）に色を合わせられたら1点。演出もここで */
    [zoneAt(walk), zoneAt(walk + 40)].forEach(function (z) {
      if (!z.got && near(cur, z.c)) { z.got = true; score++; success(z.c.i); }
    });
    /* 色の境目の半拍前で跳ぶ（タッ）。境目でちょうど一番高い（ターン） */
    var nb = nextLine();
    if (nb !== jumpLine && walk >= nb - UP_PX) jumpLine = nb; /* 音は曲の拍に合わせて playStep で鳴らす */
    var jk0 = jumpK(), air = jk0 >= 0 && jk0 < 0.5; /* 上がっている間だけ見つからない */
    var d = gap(), ok = d < TOL || air;
    if (ok || invincible) exp = Math.max(0, exp - dt * 1.5);
    else exp += dt * (0.5 + 1.3 * Math.min(1, (d - TOL) / 0.8)); /* 色が違うほど鳥が早く来る */
    if (exp > grace()) snatch();
    bgmTick();
  }
  /* 体の下（前後40）の背景のどこかと色が合っていればよい */
  /* 移り変わる区間では、前の色・次の色のどちらに合わせていてもよい（中間の色を狙わなくてよい） */
  function gap() {
    var m = 9;
    for (var dx = -40; dx <= 40; dx += 10) m = Math.min(m, dist(cur, colorAt(walk + dx)));
    for (var i = 0; i < zones.length - 1; i++) {
      var z = zones[i];
      if (walk + 40 >= z.x + z.w && walk - 40 < z.x + z.w + z.tr)
        m = Math.min(m, dist(cur, z.c), dist(cur, zones[i + 1].c));
    }
    return m;
  }
  function blends() { return gap() < TOL; }
  /* 次の色の境目（歩いた距離）と、跳んでいる途中なら 0〜1（地面なら -1） */
  var BEAT_PX = 88, UP_PX = 44, DOWN_PX = 88, jumpLine = -1;
  function nextLine() {
    for (var i = 0; i < zones.length; i++) if (zones[i].x > walk) return zones[i].x;
    return Infinity;
  }
  function jumpK() {
    if (state !== S.PLAY || jumpLine < 0) return -1;
    /* 半拍前に跳び（上がりは速く）、境目で一番高く、1拍かけてゆっくり着地。0〜0.5 上がり、0.5〜1 下がり */
    var u = walk - (jumpLine - UP_PX), k;
    if (u < 0) return -1;
    if (u < UP_PX) k = 0.5 * u / UP_PX;
    else k = 0.5 + 0.5 * (u - UP_PX) / DOWN_PX;
    return k < 1 ? k : -1;
  }
  /* 数が増えたとき：体から星が飛び、少し跳ねる */
  var hopT = 9;
  var rings = [], popT = 9;
  function success(d) {
    SND.ok(d || 0); hopT = 0; popT = 0;
    pose = (pose + 1 + Math.floor(Math.random() * 2)) % 3; poseT = 0; /* 続けて同じポーズにならない */
    /* 体から広がる輪を2重に */
    rings.push({ t: 0, delay: 0 }, { t: 0, delay: 0.07 });
    for (var i = 0; i < 20; i++) {
      var a = -Math.PI * (0.05 + 0.9 * i / 19);
      var v = 200 + Math.random() * 160;
      fx.push({ t: 0, life: 0.55 + Math.random() * 0.25, x: CX + 5, y: CY + 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, big: i % 2 === 0 });
    }
  }
  /* 鳥は色が合っていない間だけ、画面の右上の外から近づいてくる。合えば戻っていく */
  function birdPos() {
    var ix = SX + SW + 40, iy = SY - 30;
    var tx = CX + 70, ty = CY - 90;
    var k = Math.min(1, exp / grace());
    k = 1 - (1 - k) * (1 - k);
    return { x: ix + (tx - ix) * k, y: iy + (ty - iy) * k + Math.sin(T * 6) * 4 * k };
  }
  function snatch() {
    state = S.OVER; overT = 0; SND.hit(); bgmStop(0.3);
    var b = birdPos(); grabX = b.x; grabY = b.y;
  }

  /* ============ 入力 ============ */
  /* 7つの鍵盤のどれか。外れていれば null（鍵盤の少し外までは拾う） */
  var KEY_GAP = 8;
  function keyRect(i) {
    var w = (BW - KEY_GAP * 6) / 7;
    return { x: BX + i * (w + KEY_GAP), y: BY, w: w, h: BH };
  }
  function hitWheel(x, y) {
    if (y < BY - 24 || y > BY + BH + 56 || x < BX - 20 || x > BX + BW + 20) return null;
    var i = Math.max(0, Math.min(6, Math.floor((x - BX + KEY_GAP / 2) / (BW + KEY_GAP) * 7)));
    return colorN(i);
  }
  var pressT = [9, 9, 9, 9, 9, 9, 9];
  /* 押した（またはなぞって移った）ときに音。同じ鍵盤をなぞっている間は鳴らさない */
  function pick(c, tap) {
    if (c === null || state !== S.PLAY) return;
    if (tap || c.i !== cur.i) { if (AC) playKey(c.i); pressT[c.i] = 0; }
    cur = c;
  }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var i = hitWheel(p.x, p.y);
    if (i !== null) { dragging[e.pointerId] = true; pick(i, true); }
  });
  var dragging = {};
  wrap.addEventListener("pointermove", function (e) {
    if (!dragging[e.pointerId]) return;
    var p = atCanvas(e), i = hitWheel(p.x, p.y);
    if (i !== null) pick(i);
  });
  function release(e) { delete dragging[e.pointerId]; }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1 … 色が全部出る所まで飛ぶ  2 … さらわれて終わり  3 … 無敵の入り切り */
  function debugKey(n) {
    if (state === S.INTRO) startButton.click();
    if (n === 1) { newRound(); makeZones(32); }
    if (n === 2 && state === S.PLAY) snatch();
    if (n === 3) invincible = !invincible;
  }
  /* キーでも選べる（左右で色相、上下で段） */
  window.addEventListener("keydown", function (e) {
    if (DEBUG && (/^Digit[0-9]$/.test(e.code) || /^[0-9]$/.test(e.key))) { e.preventDefault(); debugKey(Number(e.key)); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat) newRound(); return; }
    if (state === S.INTRO) { if (k === " " || k === "enter") e.preventDefault(); return; }
    if (state === S.RESULT) { if ((k === " " || k === "enter") && !e.repeat) { e.preventDefault(); newRound(); } return; }
    if (k === "arrowleft") { e.preventDefault(); pick(colorN(((cur.i || 0) + 6) % 7), true); }
    if (k === "arrowright") { e.preventDefault(); pick(colorN(((cur.i || 0) + 1) % 7), true); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    var n = score;
    window.zResultActions.x({ text:
      zT("カメレオンになって" + n + "色の景色に溶け込んだ。そして鳥にさらわれた",
         "As a chameleon, I blended into " + n + " backgrounds. Then a bird carried me off") +
      zT(" #カメレオン", " #Chameleon") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.fillStyle = "#1e2420"; ctx.fillRect(0, 0, W, H);
    drawScreen();
    drawPanel();
    if (state === S.RESULT) drawResult();
  }

  /* ============ ドット絵 ============
     画面は 1ドット＝DOT の小さな裏の画面に、1ドットずつ四角で打ってから、ぼかさずに引き伸ばす。
     絵はすべて下の文字の絵（1文字＝1ドット）から描く。 */
  var DOT = 5, off = document.createElement("canvas"), o = null, GW = 100, GH = 60;
  function px(x, y, w, h, c) { o.fillStyle = c; o.fillRect(Math.round(x), Math.round(y), w, h); }
  /* 文字の絵を打つ。pal は文字→色。flip で左右反転 */
  function spr(rows, x, y, pal, flip) {
    x = Math.round(x); y = Math.round(y);
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r], n = row.length;
      for (var i = 0; i < n; i++) {
        var col = pal[row[i]];
        if (!col) continue;
        o.fillStyle = col; o.fillRect(flip ? x + n - 1 - i : x + i, y + r, 1, 1);
      }
    }
  }
  /* カメレオン（右向き。脚と目は別に打つ） */
  var CHAM = [
    "...............oo.....",
    ".........oooooolbo....",
    "......oobdbbdbbbbbooo.",
    ".....obbbbbbbbbbbbbbbo",
    "..oo.obbbbbbbbbbbbbbbo",
    ".obbobllbbbbbbbbbbddo.",
    "obooblllllllllbbbbbo..",
    "obo.oooobbbbbbbooo....",
    ".ooo.................."
  ];
  var LEG = ["obo", "ooo"];
  var EYE = ["oooo", "o..o", "o..o", "oooo"];
  /* 鳥（右向き。羽が上と下の2コマ） */
  var BIRD = [[
    "..oo..........oo.....",
    "...ooo......ooo......",
    "....oooo..oooo.......",
    "......oooooooo..ooo..",
    "oo..ogggggggggoowooyy",
    ".oooggggggggggoooyy..",
    "...ooggggggggoo......",
    ".....oo....oo........",
    ".....y.....y........."
  ], [
    ".....................",
    ".....................",
    ".....................",
    "......oooooooo..ooo..",
    "oo..ogggggggggoowooyy",
    ".oooggggggggggoooyy..",
    "...oooooooooooooo....",
    "....oooo..oooo.......",
    "...ooo......ooo......",
    "..oo..........oo....."
  ]];
  var BIRD_PAL = { o: "#2a2422", g: "#4d433e", y: "#e8b030", w: "#ffffff" };
  var LEAF = [".ddd...", "ddddddd", "...ddd."];
  /* 数字（3×5） */
  var DIGIT = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001",
    "111100111001111", "111100111101111", "111001010010010", "111101111101111", "111101111001111"];
  function shadeRGB(c, f) { return "rgb(" + Math.min(255, Math.round(c[0] * f)) + "," + Math.min(255, Math.round(c[1] * f)) + "," + Math.min(255, Math.round(c[2] * f)) + ")"; }

  function drawScreen() {
    GW = Math.ceil(SW / DOT); GH = Math.ceil(SH / DOT);
    if (off.width !== GW || off.height !== GH) { off.width = GW; off.height = GH; }
    o = off.getContext("2d");
    if (!o || !o.fillRect) return;
    drawScene();
    ctx.save();
    roundRect(SX, SY, SW, SH, 14); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, SX, SY, GW * DOT, GH * DOT);
    ctx.imageSmoothingEnabled = true;
    ctx.restore();
  }
  /* 画面の座標 → ドットの座標 */
  function gx(x) { return (x - SX) / DOT; }
  function gy(y) { return (y - SY) / DOT; }
  var BRANCH = 0;
  function drawScene() {
    BRANCH = Math.round(gy(CY + 40));
    /* 背景（1列ずつ、その場所の色） */
    /* 色の区切りがカメレオンの頭（RX）に来た瞬間が拍の頭になるように描く */
    var RX = CX + HEAD;
    for (var i = 0; i < GW; i++) px(i, 0, 1, GH, colOf(colorAt(walk + (SX + i * DOT + DOT / 2 - RX))));
    /* 葉っぱ（世界に固定。下の背景より少し暗く） */
    var wg = walk / DOT, cg = gx(RX);
    var t0 = Math.floor((wg - cg - 12) / 12), t1 = Math.ceil((wg - cg + GW + 12) / 12);
    for (var tile = t0; tile <= t1; tile++) {
      for (var li = 0; li < 3; li++) {
        var h1 = Math.abs(Math.sin(tile * 12.9898 + li * 78.233) * 43758.5453) % 1;
        var h2 = Math.abs(Math.sin(tile * 39.3468 + li * 11.135) * 24634.6345) % 1;
        var lx = Math.round(tile * 12 + h1 * 12 - wg + cg), ly = Math.round(h2 * (GH - 3));
        if (Math.abs(ly - BRANCH) < 3) continue;
        /* 葉っぱは1列ずつ、その列の背景より少し暗く（境目をまたいでも色がちらつかない） */
        var flip = h1 > 0.5;
        for (var r = 0; r < LEAF.length; r++) for (var q = 0; q < LEAF[r].length; q++) {
          if (LEAF[r][q] !== "d") continue;
          var lxq = lx + (flip ? LEAF[r].length - 1 - q : q);
          px(lxq, ly + r, 1, 1, shadeRGB(rgbOf(colorAt(walk + (SX + lxq * DOT + DOT / 2 - RX))), 0.84));
        }
      }
    }
    /* 枝（3ドット。こぶは世界に固定） */
    px(0, BRANCH, GW, 1, "#8a6240"); px(0, BRANCH + 1, GW, 2, "#6b4a2e"); px(0, BRANCH + 3, GW, 1, "#4a3220");
    for (var k = Math.floor((wg - cg) / 17) - 1; k <= Math.ceil((wg - cg + GW) / 17); k++) px(Math.round(k * 17 - wg + cg), BRANCH + 1, 2, 1, "#4a3220");
    drawChameleon();
    drawFx();
    drawBird();
    if (state === S.PLAY || state === S.OVER) drawNumber(score, Math.round(GW / 2), 3 - (popT < 0.25 ? Math.round(Math.sin(Math.PI * popT / 0.25) * 3) : 0));
  }
  /* 星：十字の形。終わりぎわは小さくなる */
  function drawFx() {
    /* 輪：ドットの円が広がりながら細くなる */
    rings.forEach(function (g) {
      var k = (g.t - g.delay) / 0.35;
      if (k < 0) return;
      var cx = gx(CX + 5), cy = gy(CY + 20), rr = 3 + k * 16, n = Math.ceil(rr * 7);
      var col = k < 0.6 ? "#ffffff" : "#fff3a8";
      for (var i = 0; i < n; i++) {
        var a = i / n * Math.PI * 2;
        px(Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr * 0.8), 1, 1, col);
      }
    });
    fx.forEach(function (e) {
      var x = Math.round(gx(e.x)), y = Math.round(gy(e.y)), k = e.t / e.life;
      var col = k < 0.5 ? "#ffffff" : "#fff3a8";
      if (e.big && k < 0.7) { px(x - 2, y, 5, 1, col); px(x, y - 2, 1, 5, col); }
      else if (k < 0.75) { px(x - 1, y, 3, 1, col); px(x, y - 1, 1, 3, col); }
      else px(x, y, 1, 1, col);
    });
  }
  function drawNumber(n, cx, y) {
    var s = String(n), w = s.length * 8 - 2, x0 = Math.round(cx - w / 2);
    for (var pass = 0; pass < 2; pass++) {
      for (var k = 0; k < s.length; k++) {
        var d = DIGIT[+s[k]];
        for (var i = 0; i < 15; i++) if (d[i] === "1") {
          var x = x0 + k * 8 + (i % 3) * 2, yy = y + Math.floor(i / 3) * 2;
          if (pass === 0) px(x - 1, yy - 1, 4, 4, "#ffffff");
          else px(x, yy, 2, 2, "#1e2420");
        }
      }
    }
  }

  /* 鳥。色が合っていないと少しずつ降りてくる。さらうときは急降下して持ち去る（画面の座標） */
  function grabbed() {
    if (state !== S.OVER) return null;
    var t = overT;
    if (t < 0.45) { var k = t / 0.45; return { x: grabX + (CX - grabX) * k, y: grabY + (CY - 30 - grabY) * k * k, carry: false }; }
    var u = t - 0.45;
    return { x: CX - u * 90, y: CY - 30 - u * u * 200 - u * 60, carry: true };
  }
  function drawBird() {
    if (state === S.INTRO) return;
    var g = grabbed(), b = g || birdPos();
    var frame = Math.floor((T + overT) * 6) % 2;
    if (!g && exp <= 0) return;
    var left = true;
    var rows = BIRD[frame];
    spr(rows, gx(b.x) - 10, gy(b.y) - 5, BIRD_PAL, left);
  }

  /* カメレオン。体の色は今の色、濃い所・明るい所はそこから作る */
  /* 決めポーズ用：しっぽを外した体と、上に巻いたしっぽ・上げた前足 */
  var CHAM_NT = [
    "...............oo.....",
    ".........oooooolbo....",
    "......oobdbbdbbbbbooo.",
    ".....obbbbbbbbbbbbbbbo",
    ".....obbbbbbbbbbbbbbbo",
    "....oblllbbbbbbbbbddo.",
    "....oblllllllllbbbbbo..",
    "....oooobbbbbbbooo....",
    "......................"
  ];
  var TAIL_UP = [
    "..ooo..",
    ".obbbo.",
    "obo.obo",
    "obo..bo",
    ".oo.obo",
    "....obo",
    "....obo",
    "....obo"
  ];
  var ARM_UP = ["...oo", "..obo", "..ob.", ".ob..", ".ob..", "ob...", "oo..."];
  /* 0 舌ぺろ  1 しっぽくるん  2 前足を上げてウインク */
  var POSE_T = 0.55, poseT = 9, pose = 0;
  function drawChameleon() {
    var jk = jumpK();
    var g = grabbed(), x = gx(CX) - 12, y = BRANCH - 9 - (hopT < 0.3 ? Math.round(Math.sin(Math.PI * hopT / 0.3) * 3) : 0);
    if (jk >= 0) y -= Math.round(Math.sin(Math.PI * jk) * 20);
    if (g && g.carry) { x = gx(g.x) - 11; y = gy(g.y) + 3; }
    var c = [shown[0], shown[1], shown[2]];
    var pal = { o: shadeRGB(c, 0.45), b: shadeRGB(c, 1), d: shadeRGB(c, 0.78), l: shadeRGB(c, 1.12) };
    var step = state === S.PLAY && jk < 0 ? Math.floor(walk / 8) % 2 : 0;
    /* 脚（前後の脚が交互に出る） */
    var posing = state === S.PLAY && poseT < POSE_T;
    spr(LEG, x + 6 + (step ? 1 : 0), y + 7, pal);
    if (!(posing && pose === 2)) spr(LEG, x + 14 + (step ? 0 : 1), y + 7, pal);
    spr(posing && pose === 1 ? CHAM_NT : CHAM, x, y, pal);
    spr(EYE, x + 15, y + 2, pal);
    if (posing) {
      if (pose === 0) {
        /* 舌をのばして、目はにっこり */
        var tl = Math.min(9, Math.round(poseT / 0.08 * 9));
        px(x + 21, y + 5, tl, 1, "#ff5c8a"); px(x + 20 + tl, y + 4, 2, 3, "#ff5c8a");
        px(x + 16, y + 3, 2, 2, pal.b); px(x + 16, y + 3, 2, 1, pal.o);
      } else if (pose === 1) {
        /* しっぽを背中の上でくるん */
        spr(TAIL_UP, x - 1, y - 4, pal);
        px(x + 16, y + 3, 2, 2, "#ffffff"); px(x + 17, y + 3, 1, 1, "#1e2420");
      } else {
        /* 前足を上げて、ウインク */
        spr(ARM_UP, x + 20, y - 1, pal);
        px(x + 16, y + 3, 2, 2, pal.b); px(x + 16, y + 4, 2, 1, pal.o);
      }
      return;
    }
    /* 目（鳥を見る） */
    if (blink > 0) { px(x + 16, y + 3, 2, 2, pal.o); return; }
    var bp = birdPos(), dx = 0, dy = 0;
    if (exp > 0.05 || state === S.OVER) { dx = bp.x > CX ? 1 : 0; dy = bp.y < CY - 20 ? 0 : 1; }
    else { dx = Math.sin(eyeT * 1.3) > 0 ? 1 : 0; dy = 1; }
    px(x + 16, y + 3, 2, 2, "#ffffff");
    px(x + 16 + dx, y + 3 + dy, 1, 1, "#1e2420");
  }


  function drawPanel() {
    /* 7つの鍵盤。押すと少し沈み、選んでいる鍵盤は白い縁 */
    for (var i = 0; i < 7; i++) {
      var k = keyRect(i), sink = pressT[i] < 0.12 ? 6 * (1 - pressT[i] / 0.12) : 0;
      roundRect(k.x, k.y + sink, k.w, k.h - sink, 14);
      ctx.fillStyle = colOf(colorN(i)); ctx.fill();
      if (cur.i === i) {
        ctx.strokeStyle = "#1e2420"; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3.5; ctx.stroke();
      }
    }
  }

  /* 結果画面。数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, score: score, cur: cur, time: T, W: W, H: H, bar: { x: BX, y: BY, w: BW, h: BH },
        zone: colorAt(walk), exp: exp, walk: walk, jump: jumpK() };
    },
    pick: pick,
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    noFx: function () { fx = []; rings = []; }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  makeZones(0); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
