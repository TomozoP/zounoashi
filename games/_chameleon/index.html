<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>カメレオン</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #000; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* カメレオン（題名は仮）

   上はゲームの画面、下はカラーホイール。
   カメレオンは枝の上を歩いて進む。背景の色が次々に変わるので、ホイールで体の色を合わせる。
   色が合っていない時間が続くと、上の鳥に見つかってさらわれる。抜けた背景の数が記録。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  var SND = {
    pick: function (i) { tone(420 + i * 45, 0.05, 0.05, "triangle"); },
    pass: function () { tone(880, 0.07, 0.03, "sine", 1100); },
    hit: function () { tone(1800, 0.35, 0.06, "sawtooth", 900); tone(1500, 0.3, 0.05, "sawtooth", 700, 0.25); noiseHit(0.5, 1200, 0.3, 0.7, 0.4); }
  };

  /* ============ 色 ============
     下のカラーホイールは境目なし。角度が色相、中心からの距離が濃さ（真ん中は白、外ほど鮮やか）。
     色は { h: 色相(度), t: 中心からの距離 0〜1 }。ホイールの上で近ければ「だいたい合っている」ですり抜ける。 */
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }
  function rgbOf(c) { return hsl(c.h, 90, 97 - 47 * c.t); }
  function css(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  function colOf(c) { return css(rgbOf(c)); }
  /* ホイールの上の位置（半径1） */
  function pos(c) { var a = (c.h - 60) * Math.PI / 180; return { x: Math.sin(a) * c.t, y: -Math.cos(a) * c.t }; }
  function dist(a, b) { var p = pos(a), q = pos(b); return Math.hypot(p.x - q.x, p.y - q.y); }
  var TOL = 0.24; /* これより近ければすり抜ける（ホイールの半径を1として） */
  function near(a, b) { return dist(a, b) < TOL; }
  /* 進むほど出る色が増える。濃さ t の範囲と、色相の選び方 */
  var STEPS = [
    { at: 0, t0: 0.95, hues: [0, 120, 240] },
    { at: 8, t0: 0.85, hues: [0, 60, 120, 180, 240, 300] },
    { at: 18, t0: 0.6, hues: null },
    { at: 32, t0: 0.35, hues: null }
  ];
  function randomColor(n) {
    var st = STEPS[0];
    STEPS.forEach(function (x) { if (n >= x.at) st = x; });
    var h = st.hues ? st.hues[Math.floor(Math.random() * st.hues.length)] : Math.random() * 360;
    return { h: h, t: st.t0 + Math.random() * (1 - st.t0) };
  }

  /* ============ 配置 ============ */
  var SX = 20, SY = 20, SW = 500, SH = 300, CX = 270, CY = 200;
  var WX = 270, WY = 700, WR = 180, W0 = 26;
  function place() {
    var ph = Math.max(330, Math.min(420, H * 0.4));
    SH = Math.max(300, Math.min(500, H - ph - 60));
    SY = 20 + Math.max(0, Math.round((H - 40 - SH - 20 - ph) / 2));
    CX = SX + 130; CY = SY + SH * 0.56;
    WR = Math.min(240, ph / 2 - 6); W0 = WR * 0.14;
    WX = W / 2; WY = SY + SH + 20 + ph / 2;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: 0, PLAY: 1, OVER: 2, RESULT: 3 };
  var state = S.INTRO, score = 0, T = 0, cur = { h: 0, t: 0 }, shown = [246, 244, 238], overT = 0;
  var zones = [], walk = 0, exp = 0, fx = [], blink = 0, eyeT = 0, invincible = false, grabX = 0, grabY = 0;

  function newRound() {
    state = S.PLAY; score = 0; T = 0; cur = { h: 0, t: 0 }; overT = 0; fx = []; exp = 0;
    makeZones(0);
    shareButton.hidden = true;
    if (startButton) startButton.hidden = true;
  }
  /* 背景の色。決まった色の区間（w）と、次の色へなめらかに移る区間（tr）が交互に来る。最初は白 */
  function makeZones(n) {
    score = n; walk = 0;
    zones = [{ x: -400, w: 600, tr: 120, c: { h: 0, t: 0 }, n: n }];
    fill();
  }
  function fill() {
    while (zones[zones.length - 1].x < walk + SW * 2) {
      var last = zones[zones.length - 1], n = last.n + 1;
      var base = Math.max(90, 260 - n * 5);
      var c = randomColor(n);
      for (var k = 0; k < 6 && dist(last.c, c) < 0.55; k++) c = randomColor(n);
      zones.push({ x: last.x + last.w + last.tr, w: base * (0.7 + Math.random() * 0.6), tr: Math.max(70, 150 - n * 2), c: c, n: n });
    }
    while (zones.length > 2 && zones[1].x + zones[1].w + zones[1].tr < walk - SW) zones.shift();
  }
  function zoneAt(x) {
    for (var i = zones.length - 1; i >= 0; i--) if (x >= zones[i].x) return zones[i];
    return zones[0];
  }
  /* その場所の背景の色。移る区間はホイールの上をまっすぐ進む */
  function colorAt(x) {
    if (!zones.length) return { h: 0, t: 0 };
    for (var i = zones.length - 1; i >= 0; i--) {
      var z = zones[i];
      if (x < z.x) continue;
      if (x < z.x + z.w || !zones[i + 1]) return z.c;
      var u = (x - z.x - z.w) / z.tr; u = u * u * (3 - 2 * u);
      var a = pos(z.c), b = pos(zones[i + 1].c), px = a.x + (b.x - a.x) * u, py = a.y + (b.y - a.y) * u;
      var th = Math.atan2(px, -py) * 180 / Math.PI;
      return { h: ((th + 60) % 360 + 360) % 360, t: Math.min(1, Math.hypot(px, py)) };
    }
    return zones[0].c;
  }
  /* 歩く速さ（px/秒）と、色が合っていなくても見つからない秒数 */
  function speed() { return Math.min(190, 75 + score * 3); }
  function grace() { return Math.max(0.4, 0.95 - score * 0.015); }

  function update(dt) {
    blink -= dt; eyeT += dt;
    if (blink < -3 - Math.random() * 3) blink = 0.15;
    if (pickT > 0) pickT -= dt;
    fx.forEach(function (e) { e.t += dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 500 * dt; });
    fx = fx.filter(function (e) { return e.t < e.life; });
    /* 体の色は少しだけかけて変わる（見た目だけ。判定はすぐ） */
    var tc = rgbOf(cur);
    for (var k = 0; k < 3; k++) shown[k] += (tc[k] - shown[k]) * Math.min(1, dt * 22);
    if (state === S.OVER) { overT += dt; if (overT > 2.0) state = S.RESULT; return; }
    if (state !== S.PLAY) return;
    T += dt;
    walk += speed() * dt;
    fill();
    var z = zoneAt(walk);
    if (z.n > score) { score = z.n; SND.pass(); }
    if (blends() || invincible) exp = Math.max(0, exp - dt * 1.5);
    else exp += dt;
    if (exp > grace()) snatch();
  }
  /* 体の下（前後60）の背景のどこかと色が合っていればよい */
  function blends() {
    for (var dx = -60; dx <= 60; dx += 10) if (near(cur, colorAt(walk + dx))) return true;
    return false;
  }
  function birdPos() {
    var ix = SX + SW * 0.55 + Math.sin(T * 0.9) * 150, iy = SY + 46 + Math.sin(T * 1.7) * 10;
    var k = Math.min(1, exp / grace()) * 0.55;
    return { x: ix + (CX - ix) * k, y: iy + (CY - 30 - iy) * k };
  }
  function snatch() {
    state = S.OVER; overT = 0; SND.hit();
    var b = birdPos(); grabX = b.x; grabY = b.y;
  }

  /* ============ 入力 ============ */
  /* ホイールのどの色か。外れていれば null（縁の少し外は一番外の色） */
  function hitWheel(x, y) {
    var dx = x - WX, dy = y - WY, d = Math.hypot(dx, dy);
    if (d > WR + 24) return null;
    var th = Math.atan2(dx, -dy) * 180 / Math.PI;
    return { h: ((th + 60) % 360 + 360) % 360, t: Math.min(1, d / WR) };
  }
  var pickT = 0;
  function pick(c) {
    if (c === null || state !== S.PLAY) return;
    if (dist(c, cur) > 0.12 && pickT <= 0) { SND.pick(Math.round(c.t * 6)); pickT = 0.06; }
    cur = c;
  }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var i = hitWheel(p.x, p.y);
    if (i !== null) { dragging[e.pointerId] = true; pick(i); }
  });
  var dragging = {};
  wrap.addEventListener("pointermove", function (e) {
    if (!dragging[e.pointerId]) return;
    var p = atCanvas(e), i = hitWheel(p.x, p.y);
    if (i !== null) pick(i);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); delete dragging[e.pointerId]; });
  wrap.addEventListener("pointercancel", function (e) { delete dragging[e.pointerId]; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1 … 色が全部出る所まで飛ぶ  2 … さらわれて終わり  3 … 無敵の入り切り */
  function debugKey(n) {
    if (state === S.INTRO) startButton.click();
    if (n === 1) { newRound(); makeZones(32); }
    if (n === 2 && state === S.PLAY) snatch();
    if (n === 3) invincible = !invincible;
  }
  /* キーでも選べる（左右で色相、上下で段） */
  window.addEventListener("keydown", function (e) {
    if (DEBUG && (/^Digit[0-9]$/.test(e.code) || /^[0-9]$/.test(e.key))) { e.preventDefault(); debugKey(Number(e.key)); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat) newRound(); return; }
    if (state === S.INTRO) { if (k === " " || k === "enter") e.preventDefault(); return; }
    if (state === S.RESULT) { if ((k === " " || k === "enter") && !e.repeat) { e.preventDefault(); newRound(); } return; }
    if (k === "arrowleft") { e.preventDefault(); pick({ h: (cur.h + 345) % 360, t: cur.t || 1 }); }
    if (k === "arrowright") { e.preventDefault(); pick({ h: (cur.h + 15) % 360, t: cur.t || 1 }); }
    if (k === "arrowup") { e.preventDefault(); pick({ h: cur.h, t: Math.min(1, cur.t + 0.1) }); }
    if (k === "arrowdown") { e.preventDefault(); pick({ h: cur.h, t: Math.max(0, cur.t - 0.1) }); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    var n = score;
    window.zResultActions.x({ text:
      zT("カメレオンになって" + n + "色の景色に溶け込んだ。そして鳥にさらわれた",
         "As a chameleon, I blended into " + n + " backgrounds. Then a bird carried me off") +
      zT(" #カメレオン", " #Chameleon") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.fillStyle = "#1e2420"; ctx.fillRect(0, 0, W, H);
    drawScreen();
    drawPanel();
    if (state === S.RESULT) drawResult();
  }

  /* ドット絵：画面は 1/DOT の大きさの裏の画面に描いて、ぼかさずに引き伸ばす */
  var DOT = 5, off = document.createElement("canvas"), main = ctx;
  function drawScreen() {
    var ow = Math.ceil(SW / DOT), oh = Math.ceil(SH / DOT);
    if (off.width !== ow || off.height !== oh) { off.width = ow; off.height = oh; }
    var o = off.getContext("2d");
    if (o && o.setTransform) {
      ctx = o;
      ctx.setTransform(1 / DOT, 0, 0, 1 / DOT, -SX / DOT, -SY / DOT);
      drawScene();
      ctx = main;
      ctx.save();
      roundRect(SX, SY, SW, SH, 14); ctx.clip();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, SX, SY, ow * DOT, oh * DOT);
      ctx.imageSmoothingEnabled = true;
      ctx.restore();
    } else drawScene();
  }
  function drawScene() {
    ctx.save();
    /* 背景（1ドットずつ、その場所の色で塗る） */
    for (var cx = 0; cx < SW; cx += DOT) {
      ctx.fillStyle = colOf(colorAt(walk + (SX + cx - CX)));
      ctx.fillRect(SX + cx, SY, DOT + 0.5, SH);
    }
    /* 葉っぱの模様（世界に固定。色は下の背景より少し暗く） */
    var t0 = Math.floor((walk - CX + SX - 60) / 60), t1 = Math.ceil((walk - CX + SX + SW + 60) / 60);
    for (var tile = t0; tile <= t1; tile++) {
      for (var li = 0; li < 3; li++) {
        var hsh = Math.abs(Math.sin(tile * 12.9898 + li * 78.233) * 43758.5453) % 1;
        var hs2 = Math.abs(Math.sin(tile * 39.3468 + li * 11.135) * 24634.6345) % 1;
        var wx = tile * 60 + hsh * 60, sx = CX + (wx - walk), sy = SY + hs2 * SH;
        var c = rgbOf(colorAt(wx));
        ctx.fillStyle = "rgb(" + Math.round(c[0] * 0.84) + "," + Math.round(c[1] * 0.84) + "," + Math.round(c[2] * 0.84) + ")";
        ctx.beginPath(); ctx.ellipse(sx, sy, 24, 10, (hsh * 6) - 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    /* 枝 */
    ctx.strokeStyle = "#6b4a2e"; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.moveTo(SX - 10, CY + 42); ctx.lineTo(SX + SW + 10, CY + 42); ctx.stroke();
    ctx.fillStyle = "#5a3c24";
    for (var j = 0; j < 8; j++) { var kx = SX + ((j * 97 - walk) % (SW + 60) + SW + 60) % (SW + 60) - 30; ctx.fillRect(kx, CY + 37, 10, 3); }
    drawChameleon();
    drawBird();
    fx.forEach(function (e) { ctx.fillStyle = e.c; ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI * 2); ctx.fill(); });
    if (state === S.PLAY || state === S.OVER) {
      ctx.fillStyle = "rgba(20,30,24,.8)"; ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 5;
      ctx.font = "800 60px sans-serif"; ctx.textAlign = "center";
      ctx.strokeText(String(score), SX + SW / 2, SY + 66); ctx.fillText(String(score), SX + SW / 2, SY + 66);
    }
    ctx.restore();
  }

  /* 鳥。色が合っていないと少しずつ降りてくる。さらうときは急降下して持ち去る */
  function grabbed() {
    if (state !== S.OVER) return null;
    var t = overT;
    if (t < 0.45) { var k = t / 0.45; return { x: grabX + (CX - grabX) * k, y: grabY + (CY - 30 - grabY) * k * k, carry: false }; }
    var u = t - 0.45;
    return { x: CX - u * 90, y: CY - 30 - u * u * 200 - u * 60, carry: true };
  }
  function drawBird() {
    if (state === S.INTRO) return;
    var g = grabbed(), b = g || birdPos(), flap = Math.sin(T * 9 + overT * 30);
    ctx.save();
    ctx.translate(b.x, b.y);
    var dir = g ? -1 : (Math.cos(T * 0.9) > 0 ? 1 : -1);
    ctx.scale(dir * 1.45, 1.45);
    ctx.fillStyle = "#3a3330";
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-46, -8 - flap * 26); ctx.lineTo(-22, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(40, -10 - flap * 26); ctx.lineTo(18, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-22, -2); ctx.lineTo(-38, -10); ctx.lineTo(-36, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(22, -6, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e8b030"; ctx.beginPath(); ctx.moveTo(29, -8); ctx.lineTo(40, -3); ctx.lineTo(29, -2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(24, -8, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e8b030"; ctx.fillRect(-4, 10, 3, 8); ctx.fillRect(4, 10, 3, 8);
    ctx.restore();
  }

  function bodyCol(a) { return "rgba(" + Math.round(shown[0]) + "," + Math.round(shown[1]) + "," + Math.round(shown[2]) + "," + (a == null ? 1 : a) + ")"; }
  function shade(f) { return "rgb(" + Math.round(shown[0] * f) + "," + Math.round(shown[1] * f) + "," + Math.round(shown[2] * f) + ")"; }

  /* カメレオン。右を向いて枝にとまる */
  function drawChameleon() {
    var x = CX, y = CY, g = grabbed(), rot = 0;
    if (g && g.carry) { x = g.x; y = g.y + 54; rot = -0.5; }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    /* しっぽ（くるり） */
    ctx.strokeStyle = shade(0.82); ctx.lineWidth = 12; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-50, 6); ctx.quadraticCurveTo(-92, 10, -92, 36); ctx.stroke();
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(-78, 38, 14, Math.PI, Math.PI * 2.6); ctx.stroke();
    ctx.lineCap = "butt";
    /* 脚 */
    ctx.strokeStyle = shade(0.78); ctx.lineWidth = 9; ctx.lineCap = "round";
    var st = state === S.PLAY ? Math.sin(walk * 0.09) * 9 : 0;
    [[-30, 1, st], [24, -1, -st]].forEach(function (l) {
      ctx.beginPath(); ctx.moveTo(l[0], 12); ctx.lineTo(l[0] + l[1] * 8 + l[2], 34); ctx.lineTo(l[0] + l[1] * 2 + l[2], 40); ctx.stroke();
    });
    ctx.lineCap = "butt";
    /* 体 */
    ctx.fillStyle = bodyCol();
    ctx.beginPath();
    ctx.moveTo(-58, 8);
    ctx.bezierCurveTo(-50, -34, 22, -40, 44, -16);
    ctx.lineTo(70, -12);
    ctx.quadraticCurveTo(84, 0, 66, 14);
    ctx.bezierCurveTo(30, 26, -30, 30, -58, 8);
    ctx.fill();
    ctx.strokeStyle = shade(0.6); ctx.lineWidth = 2.5; ctx.stroke();
    /* 背中のとげと模様 */
    ctx.fillStyle = shade(0.85);
    for (var i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(-40 + i * 13, -18 + Math.abs(i - 2.5) * 2.4, 4, 0, Math.PI * 2); ctx.fill(); }
    /* 頭のかぶと */
    ctx.fillStyle = shade(0.9);
    ctx.beginPath(); ctx.moveTo(30, -26); ctx.lineTo(50, -40); ctx.lineTo(56, -14); ctx.closePath(); ctx.fill();
    /* 目（ぐるぐる動く） */
    ctx.fillStyle = shade(0.75); ctx.beginPath(); ctx.arc(52, -8, 12, 0, Math.PI * 2); ctx.fill();
    var bp = birdPos(), look = exp > 0.05 ? Math.atan2(bp.y - (y - 8), bp.x - (x + 52)) : Math.sin(eyeT * 1.3) * 1.5;
    if (state === S.OVER) look = eyeT * 12;
    if (blink > 0) { ctx.strokeStyle = "#1e2420"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(44, -8); ctx.lineTo(60, -8); ctx.stroke(); }
    else {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(52, -8, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1e2420"; ctx.beginPath(); ctx.arc(52 + Math.cos(look) * 3.5, -8 + Math.sin(look) * 3.5, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    /* 口 */
    ctx.strokeStyle = shade(0.55); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(64, 4); ctx.quadraticCurveTo(70, 6, 76, 2); ctx.stroke();
    ctx.restore();
  }

  /* ホイールの絵は一度だけ点ごとに作っておく */
  var wheelImg = document.createElement("canvas"), wheelR = 0;
  function makeWheel() {
    var n = Math.round(WR * 2 / 6); /* ホイールもドットで（1ドット＝6） */
    wheelImg.width = wheelImg.height = n;
    var g = wheelImg.getContext("2d"), img = g && g.createImageData && g.createImageData(n, n);
    wheelR = WR;
    if (!img) return;
    var d = img.data;
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var dx = (x + 0.5) / (n / 2) - 1, dy = (y + 0.5) / (n / 2) - 1, t = Math.hypot(dx, dy);
      if (t > 1) continue;
      var h = Math.atan2(dx, -dy) * 180 / Math.PI;
      var c = rgbOf({ h: ((h + 60) % 360 + 360) % 360, t: Math.min(1, t) }), o = (y * n + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    wheelR = WR;
  }
  function drawPanel() {
    if (wheelR !== WR) makeWheel();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(wheelImg, WX - WR, WY - WR, WR * 2, WR * 2);
    ctx.imageSmoothingEnabled = true;
    /* 選んでいる所 */
    var p = pos(cur), x = WX + p.x * WR, y = WY + p.y * WR;
    x = WX - WR + Math.round((x - (WX - WR)) / 6) * 6; y = WY - WR + Math.round((y - (WY - WR)) / 6) * 6;
    ctx.fillStyle = "#1e2420"; ctx.fillRect(x - 15, y - 15, 30, 30);
    ctx.fillStyle = "#fff"; ctx.fillRect(x - 12, y - 12, 24, 24);
    ctx.fillStyle = colOf(cur); ctx.fillRect(x - 9, y - 9, 18, 18);
  }

  /* 結果画面。数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, score: score, cur: cur, time: T, W: W, H: H, wheel: { x: WX, y: WY, r: WR },
        zone: colorAt(walk), exp: exp, walk: walk };
    },
    pick: pick,
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  makeZones(0); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
</body>
