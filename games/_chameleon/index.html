<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>カメレオン</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #000; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }
  #share-button:focus-visible { outline:3px solid #f7cc71; outline-offset:3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../start.js"></script>
<script src="../view.js"></script>
<script src="../audio.js"></script>
<script src="../lang.js"></script>   <!-- 日本語以外のブラウザでは英語 -->
<script src="../share.js"></script>
<script src="../result-actions.js"></script>
<script src="../action-icons.js"></script>
<script src="../pad.js"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* カメレオン（題名は仮）

   上はゲームの画面、下はカラーパネル。
   枝の上のカメレオンに、色の弾が飛んでくる。当たる瞬間に同じ色になっていれば、弾はすり抜ける。
   違う色なら当たって終わり。すり抜けた弾の数が記録。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });
  var SND = {
    pick: function (i) { tone(420 + i * 45, 0.05, 0.05, "triangle"); },
    pass: function () { noiseHit(0.18, 2400, 0.25, 1.5); tone(900, 0.12, 0.04, "sine", 1400); },
    hit: function () { noiseHit(0.35, 300, 0.7, 0.8); tone(300, 0.5, 0.08, "square", 80); }
  };

  /* ============ 色 ============
     下のカラーホイールは 24色相 × 5段（内側ほど淡い）。真ん中の白は弾には出ない。
     弾と同じマスか、となりのマス（色相・段とも1つ以内）ならすり抜ける。 */
  var HUES = 24, RINGS = 5;
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }
  var LIGHT = [88, 78, 68, 58, 50];
  var CELL = [];
  for (var ri = 0; ri < RINGS; ri++) for (var hi = 0; hi < HUES; hi++) CELL.push(hsl(hi * 15, 88, LIGHT[ri]));
  var WHITE = [246, 244, 238];
  function rgbOf(i) { return i < 0 ? WHITE : CELL[i]; }
  function css(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  function colOf(i) { return css(rgbOf(i)); }
  function ringOf(i) { return Math.floor(i / HUES); }
  function hueOf(i) { return i % HUES; }
  function near(a, b) {
    if (a < 0 || b < 0) return false;
    var dh = Math.abs(hueOf(a) - hueOf(b)); dh = Math.min(dh, HUES - dh);
    return dh <= 1 && Math.abs(ringOf(a) - ringOf(b)) <= 1;
  }
  /* すり抜けた数で出る色が増える */
  var STEPS = [
    { at: 0, rings: [4], every: 8 },
    { at: 8, rings: [4], every: 4 },
    { at: 18, rings: [3, 4], every: 2 },
    { at: 32, rings: [1, 2, 3, 4], every: 1 },
    { at: 50, rings: [0, 1, 2, 3, 4], every: 1 }
  ];
  function palette() {
    var st = STEPS[0], p = [];
    STEPS.forEach(function (x) { if (score >= x.at) st = x; });
    st.rings.forEach(function (r) { for (var h = 0; h < HUES; h += st.every) p.push(r * HUES + h); });
    return p;
  }

  /* ============ 配置 ============ */
  var SX = 20, SY = 20, SW = 500, SH = 300, CX = 270, CY = 200;
  var WX = 270, WY = 700, WR = 180, W0 = 26;
  function place() {
    var ph = Math.max(330, Math.min(420, H * 0.4));
    SH = Math.max(300, Math.min(500, H - ph - 60));
    SY = 20 + Math.max(0, Math.round((H - 40 - SH - 20 - ph) / 2));
    CX = SX + 130; CY = SY + SH * 0.56;
    WR = Math.min(240, ph / 2 - 6); W0 = WR * 0.14;
    WX = W / 2; WY = SY + SH + 20 + ph / 2;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: 0, PLAY: 1, OVER: 2, RESULT: 3 };
  var state = S.INTRO, score = 0, T = 0, cur = -1, shown = [246, 244, 238], bullets = [], spawnT = 0, overT = 0;
  var splat = null, press = -1, pressT = 0, fx = [], blink = 0, eyeT = 0, invincible = false;

  function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }

  function newRound() {
    state = S.PLAY; score = 0; T = 0; cur = -1; bullets = []; spawnT = 1.0; overT = 0; splat = null; fx = [];
    shareButton.hidden = true;
    if (startButton) startButton.hidden = true;
  }

  /* 弾が届くまでの秒数と、次の弾までの間（すり抜けた数で短くなる） */
  function travel() { return Math.max(0.85, 1.9 - score * 0.025); }
  function interval() { return Math.max(0.42, 1.35 - score * 0.02); }

  function spawn() {
    var p = palette(), c = p[Math.floor(Math.random() * p.length)];
    var last = bullets[bullets.length - 1];
    for (var k = 0; k < 4 && last && near(last.c, c); k++) c = p[Math.floor(Math.random() * p.length)];
    var dist = SX + SW - CX + 30;
    bullets.push({ c: c, d: 1, t: 0, dur: travel(), dist: dist, y: CY - 8 + (Math.random() - 0.5) * 30, done: false });
  }

  function update(dt) {
    blink -= dt; eyeT += dt;
    if (blink < -3 - Math.random() * 3) blink = 0.15;
    if (pressT > 0) pressT -= dt;
    fx.forEach(function (e) { e.t += dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 500 * dt; });
    fx = fx.filter(function (e) { return e.t < e.life; });
    /* 体の色は少しだけかけて変わる（見た目だけ。判定はすぐ） */
    var tc = rgbOf(cur);
    for (var k = 0; k < 3; k++) shown[k] += (tc[k] - shown[k]) * Math.min(1, dt * 22);
    if (state === S.OVER) { overT += dt; if (overT > 1.1) { state = S.RESULT; } return; }
    if (state !== S.PLAY) return;
    T += dt;
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = interval(); }
    bullets.forEach(function (b) {
      b.t += dt;
      if (!b.done && b.t >= b.dur) {
        b.done = true;
        if (near(b.c, cur) || invincible) {
          score++; SND.pass();
          fx.push({ k: "ring", x: CX, y: b.y, vx: 0, vy: 0, t: 0, life: 0.35, c: colOf(b.c) });
        } else {
          state = S.OVER; overT = 0; SND.hit();
          splat = { c: colOf(b.c), x: CX + b.d * 20, y: b.y };
          for (var i = 0; i < 16; i++) fx.push({ k: "drop", x: CX + b.d * 20, y: b.y, vx: b.d * (40 + Math.random() * 160), vy: -Math.random() * 220, t: 0, life: 1, c: colOf(b.c) });
        }
      }
    });
    bullets = bullets.filter(function (b) { return b.t < b.dur * 1.8 && !(state === S.OVER && b.done && !near(b.c, cur)); });
  }

  function bulletX(b) { return CX + b.d * b.dist * (1 - b.t / b.dur); }

  /* ============ 入力 ============ */
  /* ホイールのどのマスか。真ん中は白（-1）。外れていれば null */
  function hitWheel(x, y) {
    var dx = x - WX, dy = y - WY, d = Math.hypot(dx, dy);
    if (d > WR + 24) return null;
    if (d < W0) return -1;
    var ring = Math.min(RINGS - 1, Math.floor((d - W0) / ((WR - W0) / RINGS)));
    var th = Math.atan2(dx, -dy) * 180 / Math.PI;
    var h = ((Math.round(th / 15) + 4) % HUES + HUES) % HUES;
    return ring * HUES + h;
  }
  function pick(i) {
    if (i === null || state !== S.PLAY) return;
    if (cur !== i) SND.pick(i < 0 ? 0 : ringOf(i) * 2 + (hueOf(i) % 3));
    cur = i;
  }
  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === S.INTRO) return;
    audioOn();
    var p = atCanvas(e);
    if (state === S.RESULT) { if (hitButton(p.x, p.y) === "retry") newRound(); return; }
    var i = hitWheel(p.x, p.y);
    if (i !== null) { dragging[e.pointerId] = true; pick(i); }
  });
  var dragging = {};
  wrap.addEventListener("pointermove", function (e) {
    if (!dragging[e.pointerId]) return;
    var p = atCanvas(e), i = hitWheel(p.x, p.y);
    if (i !== null) pick(i);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); delete dragging[e.pointerId]; });
  wrap.addEventListener("pointercancel", function (e) { delete dragging[e.pointerId]; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1 … 色が全部出る所まで飛ぶ  2 … 当たって終わり  3 … 無敵の入り切り */
  function debugKey(n) {
    if (state === S.INTRO) startButton.click();
    if (n === 1) { newRound(); score = 42; }
    if (n === 2 && state === S.PLAY) { state = S.OVER; overT = 0; SND.hit(); splat = { c: colOf(cur === 4 * HUES ? 4 * HUES + 12 : 4 * HUES), x: CX + 20, y: CY - 8 }; }
    if (n === 3) invincible = !invincible;
  }
  /* キーでも選べる（左右で色相、上下で段） */
  window.addEventListener("keydown", function (e) {
    if (DEBUG && (/^Digit[0-9]$/.test(e.code) || /^[0-9]$/.test(e.key))) { e.preventDefault(); debugKey(Number(e.key)); return; }
    var k = e.key.toLowerCase();
    if (k === "escape") { e.preventDefault(); if (!e.repeat) newRound(); return; }
    if (state === S.INTRO) { if (k === " " || k === "enter") e.preventDefault(); return; }
    if (state === S.RESULT) { if ((k === " " || k === "enter") && !e.repeat) { e.preventDefault(); newRound(); } return; }
    var c0 = cur < 0 ? 4 * HUES + 4 : cur, r0 = ringOf(c0), h0 = hueOf(c0);
    if (k === "arrowleft") { e.preventDefault(); pick(r0 * HUES + (h0 + HUES - 1) % HUES); }
    if (k === "arrowright") { e.preventDefault(); pick(r0 * HUES + (h0 + 1) % HUES); }
    if (k === "arrowup") { e.preventDefault(); pick(Math.min(RINGS - 1, r0 + 1) * HUES + h0); }
    if (k === "arrowdown") { e.preventDefault(); pick(Math.max(0, r0 - 1) * HUES + h0); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if ((k === " " || k === "enter") && state === S.INTRO) startButton.click();
  });

  function doShare() {
    var n = score;
    var line = n >= 60 ? zT("もはや景色", "basically scenery now")
      : n >= 30 ? zT("森に溶けた", "melted into the forest")
      : n >= 10 ? zT("それなりに擬態した", "blended in, sort of")
      : zT("ぜんぜん隠れていなかった", "wasn't hiding at all");
    window.zResultActions.x({ text:
      zT("カメレオンになって色の弾を" + n + "発すり抜けた。" + line,
         "As a chameleon, I let " + n + " paint shots pass right through me. I " + line) +
      zT(" #カメレオン", " #Chameleon") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    ctx.fillStyle = "#1e2420"; ctx.fillRect(0, 0, W, H);
    drawScreen();
    drawPanel();
    if (state === S.RESULT) drawResult();
  }

  function drawScreen() {
    ctx.save();
    roundRect(SX, SY, SW, SH, 14); ctx.clip();
    var g = ctx.createLinearGradient(0, SY, 0, SY + SH);
    g.addColorStop(0, "#cfe8d8"); g.addColorStop(1, "#9cc7a8");
    ctx.fillStyle = g; ctx.fillRect(SX, SY, SW, SH);
    /* 奥の葉っぱ */
    ctx.fillStyle = "rgba(60,120,80,.18)";
    for (var i = 0; i < 9; i++) {
      ctx.beginPath(); ctx.ellipse(SX + 30 + i * 60, SY + 30 + (i % 3) * 22, 46, 22, (i % 2 ? 0.4 : -0.4), 0, Math.PI * 2); ctx.fill();
    }
    /* 枝 */
    ctx.strokeStyle = "#6b4a2e"; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(SX - 10, CY + 40); ctx.quadraticCurveTo(CX, CY + 28, SX + SW + 10, CY + 46); ctx.stroke();
    ctx.lineCap = "butt";
    drawChameleon();
    bullets.forEach(function (b) {
      if (state === S.OVER && b.done && !near(b.c, cur)) return;
      var x = bulletX(b), c = colOf(b.c);
      var thru = b.done;
      ctx.globalAlpha = thru ? Math.max(0, 1 - (b.t - b.dur) / (b.dur * 0.5)) : 1;
      for (var k = 1; k <= 4; k++) {
        ctx.fillStyle = c; ctx.globalAlpha *= 0.55;
        ctx.beginPath(); ctx.arc(x + b.d * k * 9, b.y, 13 - k * 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = thru ? Math.max(0, 1 - (b.t - b.dur) / (b.dur * 0.5)) : 1;
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, b.y, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(x - 4, b.y - 5, 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    fx.forEach(function (e) {
      if (e.k === "ring") {
        ctx.strokeStyle = e.c; ctx.globalAlpha = 1 - e.t / e.life; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(e.x, e.y, 20 + e.t * 160, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = e.c; ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI * 2); ctx.fill();
      }
    });
    if (state === S.PLAY || state === S.OVER) {
      ctx.fillStyle = "rgba(20,30,24,.75)"; ctx.font = "800 44px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(score), SX + SW / 2, SY + 56);
    }
    ctx.restore();
  }

  function bodyCol(a) { return "rgba(" + Math.round(shown[0]) + "," + Math.round(shown[1]) + "," + Math.round(shown[2]) + "," + (a == null ? 1 : a) + ")"; }
  function shade(f) { return "rgb(" + Math.round(shown[0] * f) + "," + Math.round(shown[1] * f) + "," + Math.round(shown[2] * f) + ")"; }

  /* カメレオン。右を向いて枝にとまる */
  function drawChameleon() {
    var x = CX, y = CY, hit = state === S.OVER ? Math.sin(overT * 50) * 3 * Math.max(0, 1 - overT) : 0;
    ctx.save();
    ctx.translate(x + hit, y);
    /* しっぽ（くるり） */
    ctx.strokeStyle = shade(0.82); ctx.lineWidth = 12; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-50, 6); ctx.quadraticCurveTo(-92, 10, -92, 36); ctx.stroke();
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(-78, 38, 14, Math.PI, Math.PI * 2.6); ctx.stroke();
    ctx.lineCap = "butt";
    /* 脚 */
    ctx.strokeStyle = shade(0.78); ctx.lineWidth = 9; ctx.lineCap = "round";
    [[-30, 1], [24, -1]].forEach(function (l) {
      ctx.beginPath(); ctx.moveTo(l[0], 12); ctx.lineTo(l[0] + l[1] * 8, 34); ctx.lineTo(l[0] + l[1] * 2, 40); ctx.stroke();
    });
    ctx.lineCap = "butt";
    /* 体 */
    ctx.fillStyle = bodyCol();
    ctx.beginPath();
    ctx.moveTo(-58, 8);
    ctx.bezierCurveTo(-50, -34, 22, -40, 44, -16);
    ctx.lineTo(70, -12);
    ctx.quadraticCurveTo(84, 0, 66, 14);
    ctx.bezierCurveTo(30, 26, -30, 30, -58, 8);
    ctx.fill();
    ctx.strokeStyle = shade(0.6); ctx.lineWidth = 2.5; ctx.stroke();
    /* 背中のとげと模様 */
    ctx.fillStyle = shade(0.85);
    for (var i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(-40 + i * 13, -18 + Math.abs(i - 2.5) * 2.4, 4, 0, Math.PI * 2); ctx.fill(); }
    /* 頭のかぶと */
    ctx.fillStyle = shade(0.9);
    ctx.beginPath(); ctx.moveTo(30, -26); ctx.lineTo(50, -40); ctx.lineTo(56, -14); ctx.closePath(); ctx.fill();
    /* 目（ぐるぐる動く） */
    ctx.fillStyle = shade(0.75); ctx.beginPath(); ctx.arc(52, -8, 12, 0, Math.PI * 2); ctx.fill();
    var look = 0, tgt = null;
    bullets.forEach(function (b) { if (!b.done && (!tgt || b.t / b.dur > tgt.t / tgt.dur)) tgt = b; });
    if (tgt) look = Math.atan2(tgt.y - (y - 8), bulletX(tgt) - (x + 52));
    else look = Math.sin(eyeT * 1.3) * 1.5;
    if (state === S.OVER) look = eyeT * 12;
    if (blink > 0) { ctx.strokeStyle = "#1e2420"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(44, -8); ctx.lineTo(60, -8); ctx.stroke(); }
    else {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(52, -8, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1e2420"; ctx.beginPath(); ctx.arc(52 + Math.cos(look) * 3.5, -8 + Math.sin(look) * 3.5, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    /* 口 */
    ctx.strokeStyle = shade(0.55); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(64, 4); ctx.quadraticCurveTo(70, 6, 76, 2); ctx.stroke();
    /* 当たった色のしみ */
    if (splat) {
      ctx.fillStyle = splat.c;
      ctx.beginPath(); ctx.arc(splat.x - x, splat.y - y, 16, 0, Math.PI * 2); ctx.fill();
      for (var j = 0; j < 6; j++) { var a = j * 1.05; ctx.beginPath(); ctx.arc(splat.x - x + Math.cos(a) * 18, splat.y - y + Math.sin(a) * 14, 5, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  function drawPanel() {
    var dr = (WR - W0) / RINGS, step = Math.PI * 2 / HUES;
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(WX, WY + 5, WR + 2, 0, Math.PI * 2); ctx.fill();
    for (var i = 0; i < CELL.length; i++) {
      var r = ringOf(i), h = hueOf(i);
      var a0 = (h - 4) * step - step / 2 - Math.PI / 2, a1 = a0 + step;
      var rin = W0 + r * dr, rout = rin + dr;
      ctx.fillStyle = colOf(i);
      ctx.beginPath(); ctx.arc(WX, WY, rout + 0.6, a0 - 0.004, a1 + 0.004); ctx.arc(WX, WY, rin, a1 + 0.004, a0 - 0.004, true); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = css(WHITE); ctx.beginPath(); ctx.arc(WX, WY, W0, 0, Math.PI * 2); ctx.fill();
    /* 選んでいるマス */
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
    if (cur < 0) { ctx.strokeStyle = "#1e2420"; ctx.beginPath(); ctx.arc(WX, WY, W0 - 3, 0, Math.PI * 2); ctx.stroke(); return; }
    var rr = ringOf(cur), hh = hueOf(cur), b0 = (hh - 4) * step - step / 2 - Math.PI / 2, b1 = b0 + step, ri = W0 + rr * dr, ro = ri + dr;
    ctx.beginPath(); ctx.arc(WX, WY, ro, b0, b1); ctx.arc(WX, WY, ri, b1, b0, true); ctx.closePath();
    ctx.strokeStyle = "#1e2420"; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
  }

  /* 結果画面。数と「もう一度」「Xでシェア」だけ */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(score), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () {
      return { state: state, score: score, cur: cur, time: T, W: W, H: H, wheel: { x: WX, y: WY, r: WR },
        bullets: bullets.map(function (b) { return { c: b.c, left: b.dur - b.t, done: b.done }; }) };
    },
    pick: pick,
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(3000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    /* 端末の速さや画面のコマ数で挙動が変わらないように、update はいつもちょうど 1/60 秒ずつ呼ぶ */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

if (document.head && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]recorder-cli=1(?:&|$)/.test(location.search)) {
  var recorderScript = document.createElement("script");
  recorderScript.src = "../_tools/recorder-ui.js";
  document.head.appendChild(recorderScript);
}
</script>
