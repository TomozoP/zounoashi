    crowdBus=AC.createGain();var dry=AC.createGain(),wet=AC.createGain(),room=AC.createConvolver(),filter=AC.createBiquadFilter(),limit=AC.createDynamicsCompressor();

      var voice=AC.createOscillator(),envelope=AC.createGain();voice.type=i%4===0?'triangle':'sawtooth';voice.detune.setValueAtTime(Math.random()*32-16,start);voice.detune.linearRampToValueAtTime(Math.random()*38-19,start+duration*.6);

  /* ============ 状態 ============ */

  var nextReel = 0, camera = 0, streak = 0, targetSymbol = null;
  var flash = 0, failed = false, milestone = 0;

  // 10列揃えるごとの速度増分。チェリー、レモン、ダイヤ、7の順。

  function cameraTarget() {
    return Math.max(0, Math.min(COUNT - 3, nextReel - 1)) * PITCH;
  }
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {

  }

  function newRound() {
    state = S.PLAY;
    score = 0;
    T = 0;
    held = false;
    reels = Array.from({ length: COUNT }, function() { return Math.random() * 4; });
    stopped = Array(COUNT).fill(false);
    nextReel = 0;
    camera = 0;
    streak = 0;
    targetSymbol = null;
    speed = 4;
    flash = 0;
    failed = false;
    milestone = 0;
    celebration = 0; finishTime = 0; confetti = []; cheerBeat = 0; fanfareBeat = 0;
  }

  /* ============ 進行 ============ */

      celebration = Math.max(0, celebration - dt);
      cheerBeat -= dt; fanfareBeat -= dt;
      if (cheerBeat <= 0 && celebration > 1.5) { crowdReaction(true); cheerBeat = 1.3; }

        var note = notes[Math.min(7,Math.floor(finishTime/0.3)%8)];
        tone(note,0.28,0.055,"triangle");tone(note/2,0.32,0.035,"sine");fanfareBeat=0.3;

      for(var band=0;band<=6;band++)cabinet.addColorStop(band/6,"hsl("+((band*60+finishTime*65)%360)+",85%,62%)");
      ctx.shadowColor="hsl("+((finishTime*65)%360)+",90%,65%)";ctx.shadowBlur=22;
    }
    box(35,CY-304,bodyWidth,530,42,rainbow?cabinet:"#a52e42");
    box(48,CY-291,bodyWidth-26,504,33,cabinet);ctx.shadowBlur=0;
    box(78,CY-269,bodyWidth-86,61,20,"#812a39");
    var lampStart = Math.max(0,Math.floor((view.left-150)/PITCH));
    var lampEnd = Math.min(COUNT-1,Math.ceil((view.right-110)/PITCH));
    for(var j=lampStart;j<=lampEnd;j++) {
      var numbered=(j+1)%10===0, radius=numbered?20:11;
      var lit=(state===S.RESULT&&!failed)||milestone>0;
      ctx.save();
      if(lit) {
        var glow=milestone>0?milestone/0.8:0.65;
        ctx.shadowColor="#ffd76b";ctx.shadowBlur=12+24*glow;
      }
      circle(130+j*PITCH,CY-239,radius,lit?"#fff3ba":"#ffe2a0");
      if(numbered) {
        ctx.shadowBlur=0;ctx.fillStyle="#812a39";ctx.font="800 18px sans-serif";
        ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(String(j+1),130+j*PITCH,CY-238);
      } else if(lit) circle(130+j*PITCH,CY-239,5,"#fffdf0");
      ctx.restore();
    }
    box(55,CY-185,COUNT*PITCH+10,377,19,"#733342");
    // 画面に入る列だけ描き、100列でも描画の重さを増やさない。
    var first = Math.max(0,Math.floor((view.left-195)/PITCH));
    var last = Math.min(COUNT-1,Math.ceil((view.right-65)/PITCH));
    for(var i=first;i<=last;i++) {
      var x=65+i*PITCH;
      box(x,CY-175,130,357,12,"#fff9e9");
      ctx.save();roundRect(x,CY-175,130,357,12);ctx.clip();
      var base=Math.floor(reels[i]),fraction=reels[i]-base;
      for(var k=-3;k<=3;k++) symbol(((base+k)%4+4)%4,x+65,CY+4+(k-fraction)*106);
      var shade=ctx.createLinearGradient(0,CY-175,0,CY+182);shade.addColorStop(0,"rgba(84,54,31,.24)");shade.addColorStop(.3,"rgba(84,54,31,0)");shade.addColorStop(.7,"rgba(84,54,31,0)");shade.addColorStop(1,"rgba(84,54,31,.24)");ctx.fillStyle=shade;ctx.fillRect(x,CY-175,130,357);ctx.restore();
      if(i===nextReel && state!==S.RESULT) {
        roundRect(x,CY-175,130,357,12);ctx.strokeStyle="#ffe1a0";ctx.lineWidth=4;ctx.stroke();
      }
    }
    ctx.strokeStyle="#c99853";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(65,CY+4);ctx.lineTo(55+COUNT*PITCH,CY+4);ctx.stroke();
    ctx.restore();
    if(state!==S.RESULT) {
      circle(W/2,CY+317,58,"#202123");
      circle(W/2,CY+310,56,"#812a39");
      circle(W/2,CY+306+(held?5:0),50,held?"#e8bd7c":"#ffe1a0");
      box(W/2-14,CY+292+(held?5:0),28,28,5,"#ae3547");
    }
    if(milestone>0) {
      var progress=1-milestone/0.8;
      ctx.save();ctx.globalAlpha=(1-progress)*0.8;ctx.fillStyle="#ffe1a0";
      for(var spark=0;spark<24;spark++) {
        var angle=spark*Math.PI*2/24, radius=48+progress*(65+(spark%3)*18);
        ctx.save();ctx.translate(270+Math.cos(angle)*radius,CY-239+Math.sin(angle)*radius*0.32);
        ctx.rotate(angle+progress*2);ctx.fillRect(-2,-4,4,8);ctx.restore();
      }
      ctx.strokeStyle="#ffe1a0";ctx.lineWidth=3;ctx.shadowColor="#ffe1a0";ctx.shadowBlur=18;
      ctx.strokeRect(6,6,W-12,H-12);ctx.restore();
    }
    if(state===S.RESULT) {
      if(!failed) {
        ctx.save();ctx.fillStyle="#ffe1a0";ctx.font="700 40px sans-serif";
        ctx.textAlign="center";ctx.textBaseline="alphabetic";
        ctx.fillText(T.toFixed(2),W/2,CY-338);ctx.restore();
      }
      drawResult();
    }
    if(celebration>0) {
      ctx.save();ctx.globalAlpha=Math.min(1,celebration);
      confetti.forEach(function(paper){ctx.save();ctx.translate(paper.x,paper.y);ctx.rotate(paper.angle);ctx.fillStyle=paper.color;ctx.fillRect(-3,-6,6,12);ctx.restore();});
      ctx.restore();
    }
    // 全画面を白くせず、縁だけ短く光らせる。録画にも同じ絵が入る。
    if(flash > 0) {
      ctx.save();ctx.globalAlpha = flash / 0.18;
      ctx.strokeStyle = failed ? "#ef8090" : "#ffe1a0";
      ctx.shadowColor = ctx.strokeStyle;ctx.shadowBlur = 18;
      ctx.lineWidth = 8;ctx.strokeRect(4,4,W-8,H-8);ctx.restore();
    }
  }

  /* 戻るボタンは停止ボタンと同じ場所。右に共有ボタンを置く。 */
  function resultButtons() {
    return [
      { id: "retry", x: W/2, y: CY+310, r: 54, label: "もう一度" },
      { id: "share", x: W/2+140, y: CY+310, r: 44, label: "Xでシェア" }
    ];
  }
  function hitButton(x,y) {
    var buttons = resultButtons();
    for(var i=0;i<buttons.length;i++) {
      var b=buttons[i];
      if(Math.hypot(x-b.x,y-b.y)<=b.r) return b.id;
    }
    return null;
  }
  function drawResult() {
    resultButtons().forEach(function(b) {
      circle(b.x,b.y+7,b.r+4,"#202123");
      circle(b.x,b.y,b.r+2,"#812a39");
      circle(b.x,b.y-4,b.r-4,"#ffe1a0");
      ctx.fillStyle="#ae3547";
      if(b.id==="retry") {
        ctx.save();ctx.translate(b.x,b.y-4);ctx.strokeStyle="#ae3547";
        ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";
        ctx.beginPath();ctx.moveTo(-5,-14);ctx.lineTo(-19,0);ctx.lineTo(-5,14);
        ctx.moveTo(-19,0);ctx.lineTo(17,0);ctx.stroke();ctx.restore();
      } else window.zActionIcon(ctx,b.label,b.x,b.y-4,32);
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, time: T, W: W, H: H, reels: reels.slice(), stopped: stopped.slice(), speed: speed, buttonY: CY + 310, count: COUNT, nextReel: nextReel, camera: camera, cameraView: cameraView(), cameraTarget: cameraTarget(), streak: streak, remaining: COUNT - streak, flash: flash, failed: failed, milestone: milestone, celebration: celebration, confetti: confetti.length, rainbow: state===S.RESULT&&!failed&&targetSymbol===3, targetSymbol: targetSymbol, acceleration: targetSymbol == null ? 0 : acceleration[targetSymbol] }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      for(var i=0;i<COUNT;i++){await r.wait(180);r.key();}
      // 失敗画面と、戻る操作もそのまま撮影する。
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  newRound();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);   /* 戻ってきたとき飛ばないように上限 */
    last = now;
    if (!window.__recordManual) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
