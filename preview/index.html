/* このゲーム用のサンバ風伴奏。低い太鼓・シェーカー・乾いた打音と裏拍の和音。 */
let musicBus=null,musicNext=0,musicStep=0;
function musicNote(at,hz,duration,volume,type='sine',end=hz){

function updateMusic(){

// ゴールを越えた瞬間に一度だけ鳴らす、自作の短い祝奏。
function fanfare(){if(!AC)return;const start=AC.currentTime;const notes=[523.25,659.25,783.99,1046.5];notes.forEach((hz,i)=>{const o=AC.createOscillator(),g=AC.createGain();const at=start+i*.16,duration=i===3?.8:.22;o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.16,at+.015);g.gain.setValueAtTime(.12,at+duration*.55);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+duration+.02);o.onended=()=>{o.disconnect();g.disconnect();};});}
function stopInput(){keys={};pointer=null;padX=0;padY=-1;s.weight=0;s.target=-1;}

window.zResultActions.bind(shareButton,()=>window.zResultActions.x({text:shareText()}));
function update(dt){
  const previousBend=s.bend,previousWeight=s.weight;
  if(s.state==='play'){s.weight=pointer!==null?-padX:(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0);s.target=pointer!==null?padY:keys.ArrowDown||keys[' ']?1:-1;}

    limboVoice.formants[0].frequency.setTargetAtTime(450+strain*400,AC.currentTime,.1);
    limboVoice.formants[1].frequency.setTargetAtTime(1250,AC.currentTime,.1);

    postureSound.gain.gain.setTargetAtTime(playing?Math.min(Math.abs(bendRate)*.036,.085):0,AC.currentTime,.045);
    edgeSound.filter.frequency.setTargetAtTime(1500+Math.abs(s.weight)*650,AC.currentTime,.07);

  }
}
function disk(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function line(points,color,width){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}

function draw(){
  ctx.clearRect(0,0,W,H);if(view3d){ctx.drawImage(view3d.draw(s,Math.round(W*1.25),Math.round(H*1.25)),0,0,W,H);}else{ctx.fillStyle='#d7edef';ctx.fillRect(0,0,W,H);}

    if(s.reason==='clear'){ctx.fillStyle='#203e51';ctx.font='800 32px sans-serif';ctx.textAlign='center';ctx.fillText(s.distance.toFixed(1)+' m',270,H-151);}
    disk(150,H-92,35,'#203e51');ctx.strokeStyle='#fffaf0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(150,H-92,13,-.8,4.7);ctx.stroke();line([[147,H-111],[152,H-105],[144,H-104]],'#fffaf0',3);
    ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.roundRect(220,H-127,240,70,35);ctx.fill();ctx.fillStyle='#203e51';ctx.font='700 25px sans-serif';ctx.textAlign='center';ctx.fillText('Xでシェア',340,H-83);
  }

}
window.__probe={now:()=>({state:s.state,score:s.score,distance:s.distance,goal:s.goal,remaining:s.goal-s.distance,shareText:shareText(),shareVisible:!shareButton.hidden,W,H,z:s.z,x:s.x,roll:s.roll,rv:s.rv,bend:s.bend,target:s.target,weight:s.weight,speed:s.speed,reason:s.reason,fallTime:s.fallTime,positions:(s.rag||P.pose(s)).map(p=>({x:p.x,y:p.y,z:p.z})),gates:s.gates.map(g=>({...g})),renderer:!!view3d}),step:n=>{for(let i=0;i<(n||1);i++){update(1/60);draw();}},reset};
