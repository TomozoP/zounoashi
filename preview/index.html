<body>
<div id="stage"><div id="wrap">
<canvas id="c" aria-label="画像を唐揚げにする鍋"></canvas>
<button id="start" type="button">START</button>
<button id="pick" aria-label="画像を選ぶ" hidden><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="23" rx="4"/><circle cx="11" cy="12" r="2"/><path d="m4 24 8-8 6 6 5-5 6 7"/></svg></button>

<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var wrap=document.getElementById('wrap');
var start=document.getElementById('start');
var pick=document.getElementById('pick');
var act=document.getElementById('act');
var save=document.getElementById('save');
var again=document.getElementById('again');
var share=document.getElementById('share');
var file=document.getElementById('file');
var error=document.getElementById('error');

var W=540;
var H=960;
var state='intro';
var elapsed=0;
var clock=0;
var loadId=0;
var busy=false;
var pointerId=null;
var focused=true;
var original=document.createElement('canvas');
var fried=document.createElement('canvas');
var exported=document.createElement('canvas');
var pixels=null;
var relief=null;
var grain=null;
var coat=null;
var lastBake=-1;
var AC=null;
var hiss=null;
var volume=null;
var popBuffer=null;

var panX=270;
var panY=0;
var foodX=270;
var foodY=250;
var foodBase=250;
var foodOil=214;
var dragging=false;
var dragDx=0;
var dragDy=0;
var oilTouch=false;
var nextPop=0;

function layout(){
  H=Math.max(780,Math.min(1700,Math.round(W*window.innerHeight/window.innerWidth)));
  var k=Math.min(window.innerWidth/W,window.innerHeight/H);
  wrap.style.width=W+'px';
  wrap.style.height=H+'px';
  wrap.style.transform='scale('+k+')';
  var d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*d;
  canvas.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  draw();
}

window.addEventListener('resize',layout);
window.addEventListener('orientationchange',layout);

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function hash(x,y){
  var v=Math.sin(x*127.1+y*311.7+73.2)*43758.5453;
  return v-Math.floor(v);
}

function noise(x,y){
  var i=Math.floor(x),j=Math.floor(y);
  var u=x-i,v=y-j;
  u=u*u*(3-2*u);
  v=v*v*(3-2*v);
  return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v;
}

function plateY(){
  return H*.285;
}

function panYPos(){
  return H*.66;
}

function oval(x,y,rx,ry,color){
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
}

function sample(){
  original.width=original.height=320;
  var c=original.getContext('2d');
  c.beginPath();
  for(var i=0;i<10;i++){
    var a=i*Math.PI/5-Math.PI/2;
    var r=i%2?71:138;
    c.lineTo(160+Math.cos(a)*r,160+Math.sin(a)*r);
  }
  c.closePath();
  var g=c.createLinearGradient(30,20,250,300);
  g.addColorStop(0,'#84b6a0');
  g.addColorStop(1,'#235f59');
  c.fillStyle=g;
  c.fill();
  c.lineWidth=8;
  c.strokeStyle='#b2d5b3';
  c.stroke();
  prepare();
}

function removePlainBackground(data,w,h){
  var a=data.data;
  var r0=a[0],g0=a[1],b0=a[2];
  var hit=0,sample=0,cutout=false;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=(y*w+x)*4;
    if(a[p+3]<245&&(x===0||y===0||x===w-1||y===h-1))cutout=true;
    if(x===0||y===0||x===w-1||y===h-1){
      sample++;
      if(Math.max(Math.abs(a[p]-r0),Math.abs(a[p+1]-g0),Math.abs(a[p+2]-b0))<22)hit++;
    }
  }
  if(cutout||hit/sample<.96)return;

  var seen=new Uint8Array(w*h);
  var q=new Int32Array(w*h);
  var head=0,tail=0;
  function add(p){
    if(seen[p])return;
    seen[p]=1;
    var i=p*4;
    if(Math.max(Math.abs(a[i]-r0),Math.abs(a[i+1]-g0),Math.abs(a[i+2]-b0))>30)return;
    q[tail++]=p;
  }
  for(var x=0;x<w;x++){add(x);add((h-1)*w+x);}
  for(var y=0;y<h;y++){add(y*w);add(y*w+w-1);}
  while(head<tail){
    var p=q[head++],x=p%w,y=Math.floor(p/w);
    if(x>0)add(p-1);
    if(x<w-1)add(p+1);
    if(y>0)add(p-w);
    if(y<h-1)add(p+w);
  }
  if(tail>w*h*.97)return;
  for(var i=0;i<tail;i++)a[q[i]*4+3]=0;
}

function nearestToInside(w,h,alpha,outside){
  var n=w*h;
  var dist=new Int16Array(n);
  for(var i=0;i<n;i++)dist[i]=-1;
  var q=new Int32Array(n);
  var head=0,tail=0;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=y*w+x;
    if(alpha[p]){dist[p]=0;q[tail++]=p;}
  }
  while(head<tail){
    var p=q[head++];
    var d=dist[p]+1;
    var x=p%w,y=Math.floor(p/w);
    if(x>0&&dist[p-1]===-1&&outside[p-1]){dist[p-1]=d;q[tail++]=p-1;}
    if(x<w-1&&dist[p+1]===-1&&outside[p+1]){dist[p+1]=d;q[tail++]=p+1;}
    if(y>0&&dist[p-w]===-1&&outside[p-w]){dist[p-w]=d;q[tail++]=p-w;}
    if(y<h-1&&dist[p+w]===-1&&outside[p+w]){dist[p+w]=d;q[tail++]=p+w;}
  }
  return dist;
}

function prepare(){
  // 衣が画像の外へ張り出すための余白。
  var padded=document.createElement('canvas');
  padded.width=original.width+56;
  padded.height=original.height+56;
  padded.getContext('2d').drawImage(original,28,28);
  original.width=padded.width;
  original.height=padded.height;
  original.getContext('2d').drawImage(padded,0,0);
  var w=original.width;
  var h=original.height;
  var c=original.getContext('2d');
  pixels=c.getImageData(0,0,w,h);
  fried.width=w;
  fried.height=h;
  relief=new Float32Array(w*h);
  grain=new Float32Array(w*h);
  coat=new Float32Array(w*h);

  var a=pixels.data;
  var alpha=new Uint8Array(w*h);
  var n=w*h;
  for(var i=0;i<n;i++)alpha[i]=a[i*4+3]>10?1:0;

  var outside=new Uint8Array(n);
  var q=new Int32Array(n);
  var hA=0,hB=0;
  function addOutside(p){
    if(outside[p])return;
    outside[p]=1;
    if(!alpha[p])q[hB++]=p;
  }
  for(var x=0;x<w;x++){
    addOutside(x);
    addOutside((h-1)*w+x);
  }
  for(var y=0;y<h;y++){
    addOutside(y*w);
    addOutside(y*w+w-1);
  }
  while(hA<hB){
    var p=q[hA++];
    var x=p%w,y=Math.floor(p/w);
    if(x>0)addOutside(p-1);
    if(x<w-1)addOutside(p+1);
    if(y>0)addOutside(p-w);
    if(y<h-1)addOutside(p+w);
  }

  var dist=nearestToInside(w,h,alpha,outside);
  // 太い衣と細かい突起を重ね、元の輪郭から不規則に膨らませる。
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=y*w+x;
    relief[p]=noise(x*.12,y*.12)*.55+noise(x*.32,y*.32)*.30+noise(x*.8,y*.8)*.15;
    grain[p]=hash(x,y);
    if(outside[p]&&!alpha[p]){
      var spread=5+noise(x*.075,y*.075)*19+noise(x*.27,y*.27)*5;
      if(dist[p]>0)coat[p]=clamp((spread-dist[p])*1.5,0,1);
    }
  }

  lastBake=-1;
  bake(0);
}

function inOil(x,y,size){
  var cy=panYPos()-8;
  var rx=195*(size/250);
  var ry=92*(size/250);
  var dx=x-panX;
  var dy=y-cy;
  if(dy<-20||dy>ry+24)return false;
  return(dx*dx)/(rx*rx)+(dy*dy)/((ry+24)*(ry+24))<=1;
}

function updateContact(){
  var size=state==='frying'?(foodOil):(foodBase);
  oilTouch=inOil(foodX,foodY,size);
}

function bake(seconds){
  var bucket=Math.floor(seconds*6);
  if(bucket===lastBake)return;
  lastBake=bucket;
  var w=original.width;
  var h=original.height;
  var c=fried.getContext('2d');
  var out=c.getImageData(0,0,w,h);
  var a=pixels.data;
  var b=out.data;
  var t=clamp(seconds/10,0,1);
  var burn=clamp((seconds-11)/7,0,1);
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var p=y*w+x;
    var i=p*4;
    if(!a[i+3]){
      if(coat[p]){
        var n=relief[p];
        var slope=n-relief[Math.max(0,y-2)*w+Math.max(0,x-2)];
        var rough=(n-.5)*105+slope*180+(grain[p]-.5)*30;
        b[i]=(218+rough)*(1-burn*.66);
        b[i+1]=(155-t*48+rough*.76)*(1-burn*.8);
        b[i+2]=(72-t*45+rough*.38)*(1-burn*.84);
        b[i+3]=Math.round(255*coat[p]*clamp(seconds*1.5,0,1));
      } else {
        b[i+3]=0;
      }
      continue;
    }

    var n=relief[p];
    var slope=n-relief[Math.max(0,y-2)*w+Math.max(0,x-2)];
    var lum=(a[i]*.2126+a[i+1]*.7152+a[i+2]*.0722)/255;
    var rough=(n-.5)*72+slope*145+(grain[p]-.5)*25+(lum-.5)*47;
    var pit=n<.34?-24:0;
    var crust=t*0.94;

    var r=(211+rough+pit)*(1-burn*.66);
    var g=(157-t*50+rough*.79+pit)*(1-burn*.8);
    var bcol=(83-t*57+rough*.42+pit*.5)*(1-burn*.84);

    var edge=coat[p];
    if(edge){
      var bump=1+0.32*(Math.sin(x*0.48+y*0.36+p*0.001)-0.5*noise(x*.09,y*.07));
      var e=edge*(0.5+t)*130*bump;
      r=Math.min(255,r+e);
      g=Math.min(255,g+e*0.74);
      bcol=Math.min(255,bcol+e*0.34);
    }
    b[i]=a[i]*(1-crust)+r*crust;
    b[i+1]=a[i+1]*(1-crust)+g*crust;
    b[i+2]=a[i+2]*(1-crust)+bcol*crust;
    b[i+3]=255;
  }
  c.putImageData(out,0,0);
}

function controls(){
  var intro=state==='intro';
  var result=state==='result';
  start.hidden=!intro;
  pick.hidden=intro;
  pick.disabled=busy||state==='frying'||state==='result';
  act.hidden=intro||result;
  act.disabled=busy;
  act.setAttribute('aria-label',state==='frying'?'引き上げる':'油に入れる');
  document.getElementById('down-icon').hidden=state==='frying';
  document.getElementById('up-icon').hidden=state!=='frying';
  save.hidden=intro;
  save.disabled=!result||busy;
  again.hidden=!result;
  share.hidden=!result;
  save.classList.toggle('result',result);
  pick.classList.toggle('result',result);
}

function reset(){
  state='play';
  elapsed=0;
  foodX=panX;
  foodY=plateY();
  lastBake=-1;
  oilTouch=false;
  dragging=false;
  pointerId=null;
  bake(0);
  if(volume)volume.gain.setTargetAtTime(0,AC&&AC.currentTime||0,.03);
  controls();
  draw();
}

function go(){
  if(busy)return;
  if(state==='intro'){
    soundOn();
    reset();
    return;
  }
  soundOn();
  if(state==='result'){
    reset();
    return;
  }
  if(state==='play'){
    if(oilTouch)state='frying';
  } else if(state==='frying'){
    state='result';
    makeExport();
  }
  controls();
}

function update(dt){
  clock+=dt;
  updateContact();

  if(state==='play'&&oilTouch)state='frying';

  if(state==='frying'){
    var rate=oilTouch?1:0.2;
    elapsed=Math.min(18,elapsed+dt*rate);
    if(elapsed>0){
      bake(elapsed);
      if(rate>0 && dragging && oilTouch && volume){
        volume.gain.setTargetAtTime(.12,AC.currentTime,.05);
      } else if(volume && oilTouch){
        volume.gain.setTargetAtTime(.05,AC.currentTime,.1);
      }
      if(dragging&&oilTouch&&AC&&clock>nextPop){
        popNoise();
        nextPop=clock+0.09+hash(clock,9)*0.12;
      }
    }

    if(elapsed>=18){
      state='result';
      makeExport();
      controls();
      return;
    }

    if(!dragging&&elapsed===0&&!oilTouch)state='play';
  }

  if(state==='result')return;

  if(!volume)return;
  if(state==='frying'&&oilTouch){
    volume.gain.setTargetAtTime(.05,AC.currentTime,.1);
  } else {
    volume.gain.setTargetAtTime(0,AC.currentTime,.05);
  }
}

function soundOn(){
  if(!window.AudioContext&&!window.webkitAudioContext)return;
  if(AC)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    AC=new C();
    var buffer=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    var d=buffer.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    hiss=AC.createBufferSource();
    hiss.buffer=buffer;
    hiss.loop=true;
    var f=AC.createBiquadFilter();
    f.type='highpass';
    f.frequency.value=1700;
    volume=AC.createGain();
    volume.gain.value=0;
    hiss.connect(f);
    f.connect(volume);
    volume.connect(AC.destination);
    hiss.start();

    var p=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);
    var dp=p.getChannelData(0);
    for(var i=0;i<dp.length;i++)dp[i]=Math.random()*2-1;
    popBuffer=p;
    if(AC.state!=='running')AC.resume().catch(function(){});
  }catch(e){}
}

function popNoise(){
  if(!AC||!popBuffer)return;
  var s=AC.createBufferSource();
  s.buffer=popBuffer;
  s.playbackRate.value=0.7+hash(clock,2)*0.8;
  var f=AC.createBiquadFilter();
  f.type='bandpass';
  f.frequency.value=2200;
  var g=AC.createGain();
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(0.06,AC.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.07);
  s.connect(f);
  f.connect(g);
  g.connect(AC.destination);
  s.start();
}

function silence(){
  if(!volume)return;
  volume.gain.setTargetAtTime(0,AC.currentTime,.03);
}

document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    focused=false;
    if(AC&&AC.state!=='closed')AC.suspend().catch(function(){});
    silence();
  } else {
    focused=true;
    if(AC&&AC.state!=='running')soundOn();
  }
});

function drawFood(image,x,y,size,angle){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle||0);
  var k=size/Math.max(image.width,image.height);
  ctx.shadowColor='rgba(70,37,10,.26)';
  ctx.shadowBlur=13;
  ctx.shadowOffsetY=8;
  ctx.drawImage(image,-image.width*k/2,-image.height*k/2,image.width*k,image.height*k);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#eee7db';
  ctx.fillRect(0,0,W,H);

  var py=plateY();
  panY=panYPos();
  oval(panX,panY+45,220,126,'#d4c7b4');
  oval(panX,panY,221,126,'#3a5049');
  oval(panX,panY-4,208,112,'#142922');
  var oil=ctx.createRadialGradient(248,panY-46,10,270,panY,214);
  oil.addColorStop(0,'#e3b94d');
  oil.addColorStop(.65,'#bd7e20');
  oil.addColorStop(1,'#764015');
  oval(panX,panY-4,197,104,oil);

  var px=clamp(foodX,110,W-110);
  var py2=clamp(foodY,80,H-260);
  var size=state==='frying'||state==='result'?foodOil:foodBase;
  var active=state==='frying';
  var image=(state==='result'||state==='frying')?fried:original;
  var jiggle=(active&&dragging)?Math.sin(clock*16)*.014:0;
  drawFood(image,px,py2,size,jiggle-(active||state==='result'?-0.07:0));

  if(active){
    ctx.fillStyle='rgba(255,220,140,0.24)';
    for(var i=0;i<30;i++){
      var a=hash(i,9)*Math.PI*2;
      var r=35+hash(i,7)*130;
      var life=(clock*(.5+hash(i,2))+hash(i,3))%1;
      var bx=panX+Math.cos(a)*r;
      var by=panY-6+Math.sin(a)*r*.52-life*23;
      var br=(2+hash(i,4)*7)*Math.sin(life*Math.PI);
      ctx.beginPath();
      ctx.ellipse(bx,by,br,br*.8,0,0,Math.PI*2);
      ctx.fill();
    }
  }


  if(state!=='play'){
    ctx.fillStyle=oilTouch?'rgba(236,164,62,.35)':'rgba(236,164,62,.12)';
    ctx.beginPath();
    ctx.arc(px,py2,18,0,Math.PI*2);
    ctx.fill();
  }

  if(busy){
    ctx.strokeStyle='#284d43';
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(270,py,29,clock*4,clock*4+4);
    ctx.stroke();
  }
}

function makeExport(){
  exported.width=1080;
  exported.height=1080;
  var c=exported.getContext('2d');
  c.clearRect(0,0,1080,1080);
  var k=760/Math.max(fried.width,fried.height);
  c.save();
  c.translate(540,540);
  c.rotate(-0.07);
  c.shadowColor='rgba(70,37,10,.24)';
  c.shadowBlur=25;
  c.shadowOffsetY=16;
  c.drawImage(fried,-fried.width*k/2,-fried.height*k/2,fried.width*k,fried.height*k);
  c.restore();
}

function showError(message){
  error.textContent=message;
  error.hidden=false;
}

async function acceptImage(f){
  if(!f)return;
  var id=++loadId;
  error.hidden=true;
  if(f.size>25*1024*1024){
    showError('25MB以下の画像を選んでください');
    return;
  }
  if(!/^image\/(png|jpeg|webp|gif|avif|bmp)$/.test(f.type)){
    showError('PNG・JPEG・WebPなどの画像を選んでください');
    return;
  }

  busy=true;
  controls();
  var url=URL.createObjectURL(f);
  try{
    var im=new Image();
    await new Promise(function(resolve,reject){
      im.onload=resolve;
      im.onerror=reject;
      im.src=url;
    });
    if(id!==loadId)return;
    if(!im.naturalWidth||!im.naturalHeight)throw Error();

    var scale=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight));
    var next=document.createElement('canvas');
    next.width=Math.max(1,Math.round(im.naturalWidth*scale));
    next.height=Math.max(1,Math.round(im.naturalHeight*scale));
    var c=next.getContext('2d');
    c.drawImage(im,0,0,next.width,next.height);
    var data=c.getImageData(0,0,next.width,next.height);
    removePlainBackground(data,next.width,next.height);
    c.putImageData(data,0,0);

    var x0=next.width,y0=next.height,x1=-1,y1=-1;
    for(var y=0;y<next.height;y++){
      for(var x=0;x<next.width;x++){
        if(data.data[(y*next.width+x)*4+3]>15){
          if(x<x0)x0=x;
          if(y<y0)y0=y;
          if(x>x1)x1=x;
          if(y>y1)y1=y;
        }
      }
    }
    if(x1<0)throw Error();

    original.width=x1-x0+1;
    original.height=y1-y0+1;
    original.getContext('2d').drawImage(next,x0,y0,original.width,original.height,0,0,original.width,original.height);
    prepare();
    reset();
  }catch(e){
    if(id===loadId)showError('画像を読み込めませんでした');
  }finally{
    URL.revokeObjectURL(url);
    if(id===loadId){
      busy=false;
      controls();
    }
  }
}

file.addEventListener('change',function(){
  acceptImage(file.files[0]);
  file.value='';
});
pick.addEventListener('click',function(){
  if(!pick.disabled)file.click();
});
act.addEventListener('click',go);
start.addEventListener('click',go);
again.addEventListener('click',function(){if(state==='result')reset();});
save.addEventListener('click',function(){
  if(state!=='result')return;
  exported.toBlob(function(blob){
    if(!blob){
      showError('画像を保存できませんでした');
      return;
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='唐揚げ.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
  },'image/png');
});
share.addEventListener('click',function(){
  if(state==='result')zShare({text:'',native:false});
});

document.addEventListener('pointerdown',function(e){
  if(state!=='intro'||e.isPrimary===false||e.button>0)return;
  pointerId=e.pointerId;
},true);

document.addEventListener('pointerup',function(e){
  if(state!=='intro'||pointerId!==e.pointerId)return;
  pointerId=null;
  e.preventDefault();
  e.stopImmediatePropagation();
  go();
},true);

document.addEventListener('pointercancel',function(){
  pointerId=null;
  dragging=false;
  if(volume)silence();
});

function pointerPos(ev){
  var r=canvas.getBoundingClientRect();
  return{
    x:(ev.clientX-r.left)/r.width*W,
    y:(ev.clientY-r.top)/r.height*H
  };
}

wrap.addEventListener('pointerdown',function(e){
  if(e.target!==canvas||state==='intro'||e.isPrimary===false||e.button>0||busy)return;
  dragging=true;
  pointerId=e.pointerId;
  soundOn();
  var p=pointerPos(e);
  dragDx=p.x-foodX;
  dragDy=p.y-foodY;
  foodX=p.x-dragDx;
  foodY=p.y-dragDy;
  updateContact();
  if(state==='play'&&oilTouch)state='frying';
  controls();
});

wrap.addEventListener('pointermove',function(e){
  if(!dragging||pointerId!==e.pointerId)return;
  e.preventDefault();
  var p=pointerPos(e);
  foodX=clamp(p.x-dragDx,60,W-60);
  foodY=clamp(p.y-dragDy,120,H-260);
  updateContact();
  if(state==='play'&&oilTouch)state='frying';
});

wrap.addEventListener('pointerup',function(e){
  if(!dragging||pointerId!==e.pointerId)return;
  dragging=false;
  pointerId=null;
  updateContact();
  if(state==='frying'&&!oilTouch&&elapsed===0)state='play';
  controls();
  if(volume)volume.gain.setTargetAtTime(0,AC&&AC.currentTime||0,.05);
});

window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    e.preventDefault();
    if(!e.repeat){
      loadId++;
      busy=false;
      error.hidden=true;
      reset();
    }
    return;
  }
  if(e.code==='Space'||e.key===' '||e.key==='Enter'){
    if(e.target&&e.target.tagName==='BUTTON')return;
    e.preventDefault();
    if(!e.repeat)go();
  }
});

window.addEventListener('blur',function(){
  focused=false;
  pointerId=null;
  dragging=false;
  if(AC&&AC.state!=='closed')AC.suspend().catch(function(){});
  silence();
});

window.__probe={
  now:function(){
    return {
      state:state,
      seconds:elapsed,
      W:W,
      H:H,
      busy:busy,
      imageWidth:original.width,
      imageHeight:original.height,
      foodX:foodX,
      foodY:foodY,
      oil:oilTouch
    };
  },
  step:function(n){
    for(var i=0;i<(n||1);i++)update(1/60);
    draw();
  },
  reset:reset
};

/* ============ ループ ============ */
sample();
controls();
layout();
var last=performance.now();
function loop(now){
  var dt=Math.min(.033,(now-last)/1000);
  last=now;
  if(!document.hidden&&!window.__recordManual){
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
