<!DOCTYPE html>

<title>手刀を見逃さないゲーム</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #12100e; touch-action: none; }
  #wrap { position: relative; touch-action: none; }
  canvas { display: block; background: #1d1714; }
  /* 長押し中にゲームの絵が選択されないようにする。 */
  #stage, #wrap, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #start { position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:240px; height:68px; border:0; border-radius:34px; background:#fff; color:#16202e; font:bold 28px sans-serif; touch-action:manipulation; }
  #start[hidden] { display:none; }
  #share-button { position:absolute; padding:0; border:0; border-radius:999px; background:transparent; cursor:pointer; touch-action:manipulation; }
  #share-button[hidden] { display:none; }

  #wrap.photo-cursor, #wrap.photo-cursor * { cursor:none; }
</style>

<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <button id="start" type="button">START</button>
  <button id="share-button" type="button" aria-label="Xでシェア" hidden></button>
</div></div>
<script src="../games/share.js?v=shuto-20260918074003"></script>
<script src="../games/random-bowling/vendor/three.min.js?v=shuto-20260918074003"></script>
<script src="./people3d.js?v=shuto-20260918074003"></script>
<script src="../games/result-actions.js?v=shuto-20260918074003"></script>
<script src="../games/action-icons.js?v=shuto-20260918074003"></script>
<script src="../games/pad.js?v=shuto-20260918074003"></script>   <!-- ジョイパッドと、絵の外のタップ -->
<script>
/* 手刀を見逃さないゲーム

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  var people3D=null;
  if(window.WebGLRenderingContext&&window.ShutoPeople3D){try{people3D=new window.ShutoPeople3D();}catch(e){}}
  // 指先を操作位置に合わせ、録画にも写るようゲームの絵へ重ねる。
  var handImage = new Image(), handReady = false;
  var pointer = { x:0, y:0, visible:false, clickedAt:-Infinity };
  function handPress() { return Math.max(0, 1-(performance.now()-pointer.clickedAt)/240); }
  handImage.onload = function () { handReady = true; };
  handImage.src = 'img/pointing-hand.webp?v=shuto-20260918074003';
  function hideHand() {
    pointer.visible = false; pointer.clickedAt = -Infinity; wrap.classList.remove('photo-cursor');
    if (people) drawFrame();
  }
  function pointHand(e) {
    if (e.pointerType !== 'mouse' || !handReady || state === S.INTRO) { hideHand(); return; }
    var p = atCanvas(e);
    pointer.x = p.x; pointer.y = p.y; pointer.visible = true;
    wrap.classList.add('photo-cursor');
    drawFrame();
  }
  wrap.addEventListener('pointermove', pointHand, true);
  wrap.addEventListener('pointerdown', function (e) {
    pointHand(e);
    if (pointer.visible && e.button === 0) {
      pointer.clickedAt = performance.now();
      drawFrame();
    }
  }, true);
  wrap.addEventListener('pointerleave', hideHand);
  wrap.addEventListener('pointercancel', hideHand);
  window.addEventListener('blur', hideHand);
  document.addEventListener('visibilitychange', function () { if (document.hidden) hideHand(); });

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。
     どの端末でも「横540」の座標で描けばよい（解像度はここで吸収する）。 */
  var W = 540, H = 960;
  function layout() {
    var host = wrap.parentNode;
    var vw = host.clientWidth || window.innerWidth;
    var vh = host.clientHeight || window.innerHeight;
    H = Math.max(780, Math.min(1700, Math.round(W * vh / vw)));

    place();                                   /* 高さが決まってから置き直す */

    var scale = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.style.width = canvas.style.width = Math.round(W * scale) + "px";
    wrap.style.height = canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    var k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  var audioUnlocked = false;
  // 最初の長押しの中で短い無音を再生し、音声出力を起動する。
  function resumeAudio() {
    if (!AC || AC.state === "closed") return;
    if (AC.state !== "running") {
      audioUnlocked = false;
      try { var pending = AC.resume(); if (pending && pending.catch) pending.catch(function () {}); } catch (e) {}
    }
    if (!audioUnlocked) {
      try {
        var warmup = AC.createBufferSource();
        warmup.buffer = AC.createBuffer(1, 1, AC.sampleRate);
        warmup.connect(AC.destination);
        warmup.onended = function () { audioUnlocked = AC.state === "running"; warmup.disconnect(); };
        warmup.start(0);
      } catch (e) {}
    }
  }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", REPLAY: "replay", SUCCESS: "success", RESULT: "result" };
  var state, score, T, held, successWait=0, keyMode = false;

  var PERSONAL_SPACE=40, MAX_LEVEL=7;
  var level=1, CROWD_SIZE=20, FRAME_SECONDS=1/10, STRIKE_SECONDS=1/30, GUESS_SECONDS=5;
  var people=[], attacker=-1, victim=-1, attackAt=0, elapsed=-1, outcome='', selected=0;
  var clothes=['#b95038','#356f83','#d5a52f','#45614a','#57558a','#ac5872','#f0e2be'];
  var crowdHeight=960;
  var CY;                                      /* 高さから決まる置き場所 */
  function place() {
    if(people)people.forEach(function(p){p.y=p.y/crowdHeight*H;});crowdHeight=H;
    CY = Math.round(H * 0.5);                  /* ▼UPDATE: 置き場所の計算 */
  }

  function newRound(continueStreak, jumpLevel) {
    document.getElementById("start").hidden=true;
    shareButton.hidden=true;
    state = S.PLAY;
    if(!continueStreak){score=0;level=Math.min(MAX_LEVEL,jumpLevel||1);}
    else level=Math.min(MAX_LEVEL,level+1);
    CROWD_SIZE=level*20;
    successWait=0;
    T = 0;
    frameDebt=0;
    held = false;
    attackAt=6+Math.random()*4; elapsed=-1; outcome=''; attacker=-1; victim=-1; selected=0;
    replayTape=[];replayTaped=false;replayAt=0;replayTimer=0;
    people=[];
    // 少人数でも自然に隣り合う人を用意し、手刀の相手がいない待ち時間を減らす。
    var pairY=H*(.4+Math.random()*.2),pairVX=(Math.random()-.5)*5,pairVY=(Math.random()-.5)*12;
    for(var i=0;i<CROWD_SIZE;i++){
      var p=makePerson(i),tries=0;
      do{var initial=groundAt(15+Math.random()*510,65+Math.random()*(H-80));p.x=initial.x;p.y=initial.y;tries++;}
      while(tries<1000&&people.some(function(q){return Math.hypot(p.x-q.x,p.y-q.y)<PERSONAL_SPACE+2;}));
      if(i<2){p.x=W/2+(i===0?-33:33);p.y=pairY;p.vx=pairVX;p.vy=pairVY;}
      else if(tries>=1000)enter(p);
      people.push(p);
    }
  }

  /* ============ 手刀のリプレイ ============
     手刀のコマまでを控えておき、勝敗が決まったら遅く流してから結果を出す。
     控えるのは人の居場所と向き、歩きの時計、手刀の進み具合だけ。
     3Dの模型は毎コマこれらから組み直すので、戻せばそのまま同じ絵になる。 */
  var REPLAY_LEAD=6, REPLAY_SLOW=3, REPLAY_HOLD=1.3;
  var replayTape=[], replayTaped=false, replayAt=0, replayTimer=0, replayNext="";

  function record(){
    if(replayTaped)return;
    replayTape.push({T:T,elapsed:elapsed,
      spots:people.map(function(p){return {x:p.x,y:p.y,vx:p.vx,vy:p.vy};})});
    if(elapsed>=0){replayTaped=true;return;}   /* 手刀のコマを控えたら、そこで止める */
    if(replayTape.length>REPLAY_LEAD)replayTape.shift();
  }
  function moveCrowd(spots){
    spots.forEach(function(s,id){
      var p=people[id];
      if(!p)return;
      p.x=s.x;p.y=s.y;p.vx=s.vx;p.vy=s.vy;
    });
  }
  function finish(next){
    state=next;
    if(next===S.SUCCESS)successWait=0;
  }
  // 手刀が出る前に終わったときは流すものが無いので、そのまま結果へ。
  function startReplay(next){
    if(!replayTaped||replayTape.length<2){finish(next);return;}
    replayAt=0;replayTimer=0;replayNext=next;
    state=S.REPLAY;
  }
  function replayTick(dt){
    replayTimer+=dt;
    if(replayAt>=replayTape.length-1){          /* 手刀のコマ。印をつけて少し止める */
      if(replayTimer>=REPLAY_HOLD-1e-9)finish(replayNext);
      return;
    }
    if(replayTimer>=FRAME_SECONDS*REPLAY_SLOW-1e-9){replayTimer=0;replayAt++;}
  }
  // 控えたコマの姿に一時だけ差し替えて描く。進行と覗き穴には触らない。
  function drawFrame(){
    if(state!==S.REPLAY||!replayTape[replayAt]){draw();return;}
    var liveT=T, liveElapsed=elapsed;
    var live=people.map(function(p){return {x:p.x,y:p.y,vx:p.vx,vy:p.vy};});
    T=replayTape[replayAt].T;elapsed=replayTape[replayAt].elapsed;
    moveCrowd(replayTape[replayAt].spots);
    try{draw();}
    finally{T=liveT;elapsed=liveElapsed;moveCrowd(live);}
  }
  // 手刀のコマで止まっている間と、結果が出てからは、出した人に印をつける。
  function revealAttacker(){
    if(state===S.RESULT||state===S.SUCCESS)return true;
    return state===S.REPLAY&&replayAt>=replayTape.length-1;
  }
  /* ============ 進行 ============ */
  function update(dt) {
    if(state===S.REPLAY){replayTick(dt);return;}
    if(state===S.SUCCESS){
      successWait+=dt;
      if(successWait>=2-1e-9)newRound(true);
      return;
    }
    if (state !== S.PLAY) return;
    T += dt;

    walkCrowd(dt);
    if(elapsed<0 && T>=attackAt){
      var pairs=[];
      people.forEach(function(p){
        var screen=position(p);
        if(screen.x<120||screen.x>W-120||screen.y<170||screen.y>H-130)return;
        var end=position({x:p.x+p.vx*GUESS_SECONDS,y:p.y+p.vy*GUESS_SECONDS});
        if(end.x<64||end.x>W-64||end.y<130||end.y>H-60)return;
        people.forEach(function(q){
          var distance=Math.hypot(p.x-q.x,p.y-q.y);
          if(p.id!==q.id&&distance>=PERSONAL_SPACE-1&&distance<88&&Math.abs(p.y-q.y)<28)pairs.push([p.id,q.id]);
        });
      });
      if(pairs.length){
        var pair=pairs[Math.floor(Math.random()*pairs.length)];attacker=pair[0];victim=pair[1];
        elapsed=0;
      }
    }else if(elapsed>=0){
      elapsed+=dt;
      if(elapsed>=GUESS_SECONDS-1e-9){elapsed=GUESS_SECONDS;outcome='miss';startReplay(S.RESULT);}
    }
    record();
  }

  // 行き先は画面外。退場してから、別の入口の外側へ戻す。
  function makePerson(id){
    // ゆったり、大股、小刻み、弾む歩き、肩を揺らす歩き。
    var styles=[
      {speed:20,pace:4.2,stride:.6,arm:.45,bounce:.4,sway:.012,lean:.025},
      {speed:32,pace:5.1,stride:1.35,arm:1.2,bounce:1.1,sway:.02,lean:.065},
      {speed:29,pace:8.4,stride:.55,arm:.55,bounce:.7,sway:.012,lean:.04},
      {speed:27,pace:6.3,stride:.95,arm:1.05,bounce:2.8,sway:.025,lean:.015},
      {speed:22,pace:4.7,stride:.85,arm:.75,bounce:.5,sway:.065,lean:-.02}
    ];
    var gait=styles[id%styles.length],variation=.9+Math.random()*.2;
    var builds=[{width:.78,waist:7,belly:8},{width:1,waist:8,belly:9},{width:1.3,waist:7,belly:9},{width:1.2,waist:11,belly:14}];
    var build=builds[Math.floor(Math.random()*builds.length)];
    var angle=Math.random()*Math.PI*2,speed=gait.speed*variation;
    return {id:id,x:0,y:0,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,speed:speed,
      build:build.width,waist:build.waist,belly:build.belly,stature:.87+Math.random()*.26,
      gait:id%styles.length,pace:gait.pace*variation,stride:gait.stride*(.9+Math.random()*.2),
      arm:gait.arm,bounce:gait.bounce,sway:gait.sway,lean:gait.lean,asymmetry:Math.random()*.18,
      phase:Math.random()*6.28,color:clothes[Math.floor(Math.random()*clothes.length)],
      hair:Math.floor(Math.random()*5),hairStyle:Math.floor(Math.random()*5),
      hat:Math.random()<.32?1+Math.floor(Math.random()*3):0,
      hatColor:['#394b61','#dcc592','#824b42','#dedbd1','#4c6451'][Math.floor(Math.random()*5)],
      pattern:Math.floor(Math.random()*6),patternColor:Math.random()<.55?'#eee5d2':'#384951',
      skin:['#dbb395','#bf9276','#e5c6a8'][Math.floor(Math.random()*3)],
      trousers:['#384248','#575650','#4b505c'][Math.floor(Math.random()*3)],generation:0};
  }
  function enter(p){
    p.generation++;
    var target=groundAt(80+Math.random()*380,140+Math.random()*(H-260)),attempt=0;
    do{
      var edge=Math.floor(Math.random()*4);
      var entry=groundAt(edge===0?-200:edge===1?W+200:Math.random()*W,
        edge===2?-220:edge===3?H+360:Math.random()*H);
      p.x=entry.x;p.y=entry.y;
      attempt++;
    }while(attempt<200&&people.some(function(q){return p!==q&&Math.hypot(p.x-q.x,p.y-q.y)<PERSONAL_SPACE+2;}));
    var dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy);
    p.vx=dx/d*p.speed;p.vy=dy/d*p.speed;
  }
  function walkCrowd(dt){
    people.forEach(function(p){
      if(p.id===victim)return;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      var screen=position(p);
      if(screen.depth<100||screen.x< -240||screen.x>W+240||screen.y< -260||screen.y>H+420)enter(p);
    });
    // 近づいた人同士が少しずつ道を譲り、肩が触れるくらいの間隔ですれ違う。
    for(var pass=0;pass<5;pass++)for(var i=0;i<people.length;i++)for(var j=i+1;j<people.length;j++){
      var p=people[i],q=people[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
      if(d>=PERSONAL_SPACE)continue;
      if(d<.001){dx=1;dy=0;d=1;}
      var shift=(PERSONAL_SPACE-d)/2,px=dx/d*shift,py=dy/d*shift;
      if(p.id!==victim){p.x+=px*(q.id===victim?2:1);p.y+=py*(q.id===victim?2:1);}
      if(q.id!==victim){q.x-=px*(p.id===victim?2:1);q.y-=py*(p.id===victim?2:1);}
    }
  }

  /* ============ 入力 ============
     タップとスペースキーで同じことができるようにする。
     x が null のときはキー操作（場所を指さない）。 */
  function down(x, y) {
    if(state===S.INTRO||state===S.SUCCESS||state===S.REPLAY)return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    held = true;
    if(elapsed<0)return;
    var id=-1;
    if(x==null)id=selected;
    else if(people3D)id=people3D.pick(x,y,W,H);
    else{
      var nearest=Infinity;
      people.forEach(function(p){if(p.id===victim)return;var q=position(p),distance=Math.hypot((x-q.x)/q.scale,(y-(q.y-44*q.scale*p.stature))/q.scale);
        if(Math.abs(x-q.x)<=31*q.scale&&Math.abs(y-(q.y-44*q.scale*p.stature))<=43*q.scale*p.stature&&distance<nearest){nearest=distance;id=p.id;}});
    }
    if(id<0||id===victim)return;
    var caught=id===attacker;
    outcome=caught?'caught':'wrong';
    if(caught)score++;
    startReplay(caught?S.SUCCESS:S.RESULT);
    tone(caught?880:160,.18,.09,'sine');
  }
  function move(x, y) {
    if (state !== S.PLAY || !held) return;
    /* ▼UPDATE: なぞっているときの処理（要らなければ空のまま） */
  }
  function up() {
    if (!held) return;
    held = false;
    /* ▼UPDATE: 離したときの処理（要らなければ空のまま） */
  }

  function atCanvas(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  wrap.addEventListener("pointerdown", function (e) {
    if(e.isPrimary===false||e.button>0)return;
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e); move(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  window.addEventListener("keydown", function (e) {
    if(/^[0-9]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      e.preventDefault();
      if(!e.repeat){audioOn();newRound(false,e.key==='0'?10:Number(e.key));}
      return;
    }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var left = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
    var right = e.key === "ArrowRight" || e.key === "d" || e.key === "D";
    var vertical=e.key==='ArrowUp'?-6:e.key==='ArrowDown'?6:0;
    if(vertical){e.preventDefault();keyMode=true;if(state===S.PLAY)selected=(selected+vertical+people.length)%people.length;return;}
    if (!esc && !go && !left && !right) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (left || right) {
      if (state !== S.PLAY) return;
      selected=(selected+(left?-1:1)+people.length)%people.length;
      return;
    }
    if (e.repeat) return;                      /* 押しっぱなしで連発しない */
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if(state===S.INTRO)startButton.click();else up(); }
  });

  function resultText(){
    return outcome==='caught'?'見逃さなかった':'見逃した';
  }
  // スマホでもユーザー操作として扱われる、通常のクリックから直接開く。
  window.zResultActions.bind(shareButton,function(){
    if(state===S.RESULT)doShare();
  });
  function syncShareButton(){
    window.zResultActions.place(shareButton,resultButtons()[1],W,H,state===S.RESULT);
  }
  function doShare() {
    /* ▼SHARE: シェアされる文。正方形サムネの共有リンクは share.js が付ける。
       URLはここで作らない。公開準備の publish.js がゲーム名とサムネのOGPを作る。 */
    window.zResultActions.x({ text: score + "回連続で見逃さなかった #手刀を見逃さないゲーム" });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 地面を高さ0の平面として、上方48度の透視カメラから投影する。
  // 人物は従来の絵をカメラへ向けて立て、同じ深度で拡縮する。
  function position(p){
    var focal=Math.max(1000,H),z=H/2-p.y;
    var depth=focal+z*Math.cos(48*Math.PI/180),scale=focal/Math.max(1,depth);
    return {x:W/2+(p.x-W/2)*scale,y:H/2-z*Math.sin(48*Math.PI/180)*scale,scale:scale,depth:depth};
  }
  function groundAt(x,y){
    var focal=Math.max(1000,H),dy=y-H/2;
    var worldY=dy/(Math.sin(48*Math.PI/180)+dy*Math.cos(48*Math.PI/180)/focal);
    var scale=focal/(focal-worldY*Math.cos(48*Math.PI/180));
    return {x:W/2+(x-W/2)/scale,y:H/2+worldY};
  }
  function line(x,y,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
  function drawTown(){
    var floor=ctx.createLinearGradient(0,0,0,H);
    floor.addColorStop(0,'#cbd0cc');floor.addColorStop(1,'#b8bdb8');
    ctx.fillStyle=floor;ctx.fillRect(0,0,W,H);
    var far=groundAt(0,-20),near=groundAt(0,H+20);
    var left=Math.min(far.x,near.x)-180,right=W-left;
    for(var y=Math.floor(far.y/30)*30;y<near.y+30;y+=30){
      var a=position({x:left,y:y}),b=position({x:right,y:y});
      line(a.x,a.y,b.x,b.y,'#959b91',Math.max(.5,a.scale));
      for(var x=Math.floor(left/60)*60+(Math.floor(y/30)%2)*30;x<right;x+=60){
        var corners=[position({x:x+2,y:y+2}),position({x:x+58,y:y+2}),position({x:x+58,y:y+28}),position({x:x+2,y:y+28})];
        ctx.beginPath();corners.forEach(function(p,i){if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y);});ctx.closePath();
        var shade=Math.sin(x*.13+y*.17)>0;
        ctx.fillStyle=shade?'rgba(239,237,216,.12)':'rgba(60,65,53,.045)';ctx.fill();
        line(corners[0].x,corners[0].y,corners[1].x,corners[1].y,'rgba(244,241,220,.40)',Math.max(.5,corners[0].scale*1.5));
        line(corners[2].x,corners[2].y,corners[3].x,corners[3].y,'rgba(58,64,52,.16)',Math.max(.5,corners[2].scale*1.5));
        a=position({x:x,y:y});b=position({x:x,y:y+30});
        line(a.x,a.y,b.x,b.y,'#959b91',Math.max(.5,a.scale));
      }
    }
  }
  // 模様は服の輪郭で切り取り、歩いても本人の組み合わせを保つ。
  function drawClothes(p){
    if(!p.pattern)return;
    ctx.save();ctx.clip();ctx.fillStyle=p.patternColor;
    if(p.pattern===1||p.pattern===3){
      for(var y=-65;y<-40;y+=7)ctx.fillRect(-20,y,40,p.pattern===3?1.6:2.7);
    }
    if(p.pattern===2||p.pattern===3){
      for(var x=-12;x<=12;x+=6)ctx.fillRect(x,-70,p.pattern===3?1.6:2.2,32);
    }
    if(p.pattern===4){
      for(var row=0;row<4;row++)for(var col=0;col<4;col++){
        ctx.beginPath();ctx.arc(-10+col*7+(row%2)*3,-64+row*7,1.5,0,Math.PI*2);ctx.fill();
      }
    }
    if(p.pattern===5){ctx.fillRect(-20,-61,40,9);ctx.fillRect(-20,-44,40,4);}
    ctx.restore();
  }
  function drawHead(p,side){
    var hairColor=['#303632','#654a39','#a9936a','#b9b7aa','#8b533d'][p.hair];
    var back=p.vy< -8;
    ctx.fillStyle=hairColor;
    if(p.hairStyle===2){roundRect(-7,-87,14,20,4);ctx.fill();}
    if(p.hairStyle===3){
      ctx.beginPath();ctx.ellipse(-side*8,-78,3,8,-side*.3,0,Math.PI*2);ctx.fill();
      line(-side*7,-82,-side*9,-81,p.hatColor,2);
    }
    ctx.fillStyle=p.skin;ctx.beginPath();ctx.ellipse(0,-81,5.8,7.3,side*.08,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=hairColor;
    if(p.hairStyle===4){
      for(var i=0;i<5;i++){ctx.beginPath();ctx.arc(-5+i*2.5,-86-(i%2)*1.5,3,0,Math.PI*2);ctx.fill();}
    }else{
      ctx.beginPath();ctx.ellipse(-side,-84,6,p.hairStyle===1?7:4.8,0,Math.PI,Math.PI*2);ctx.fill();
      if(p.hairStyle===1){ctx.beginPath();ctx.moveTo(-6,-85);ctx.lineTo(5,-86);ctx.lineTo(-side*4,-79);ctx.closePath();ctx.fill();}
    }
    if(back){roundRect(-5.5,-86,11,p.hairStyle===2?18:11,3);ctx.fill();}
    else{ctx.fillStyle='#49473f';ctx.fillRect(side*3,-81,1.2,1.2);}
    ctx.fillStyle=p.hatColor;
    if(p.hat===1){
      ctx.beginPath();ctx.ellipse(0,-86,7,5,0,Math.PI,Math.PI*2);ctx.fill();
      line(-6,-86,side*12,-86,p.hatColor,3);
    }else if(p.hat===2){
      roundRect(-6,-95,12,9,2);ctx.fill();
      line(-11,-86,11,-86,p.hatColor,3);
      line(-5,-89,5,-89,'#504a40',2);
    }else if(p.hat===3){
      ctx.beginPath();ctx.ellipse(0,-85,7,8,0,Math.PI,Math.PI*2);ctx.fill();
      line(-6,-85,6,-85,p.hatColor,4);
      ctx.beginPath();ctx.arc(0,-94,2.6,0,Math.PI*2);ctx.fill();
    }
  }
  function fallProgress(){return Math.max(0,Math.min(1,(elapsed-.4)/1.1));}
  // 影も地面上の座標から投影し、人物より先に描く。
  function drawShadow(p){
    var q=position(p);
    if(q.depth<100||q.x< -120||q.x>W+120||q.y< -80||q.y>H+200)return;
    ctx.save();ctx.fillStyle='rgba(35,40,33,.22)';
    ctx.beginPath();ctx.ellipse(q.x,q.y,15*q.scale*p.build,6*q.scale,0,0,Math.PI*2);
    ctx.fill();ctx.restore();
  }
  function drawPerson(p){
    var q=position(p),fallen=p.id===victim&&elapsed>=0;
    if(q.depth<100||q.x< -95*q.scale||q.x>W+95*q.scale||q.y< -10*q.scale||q.y>H+120*q.scale)return;
    var cycle=T*p.pace+p.phase,walk=Math.sin(cycle),side=p.vx<0?-1:1;
    var stride=walk*p.stride,arm=Math.sin(cycle+.18)*p.arm;
    ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.scale,q.scale);
    if(fallen){var fall=fallProgress();ctx.translate(0,-5*fall);ctx.rotate(fall*fall*(3-2*fall)*Math.PI/2);walk=0;stride=0;arm=0;}
    // 頭は全身の約七分の一。膝・肘を曲げながら歩く。
    var bob=fallen?0:Math.abs(walk)*p.bounce;
    ctx.translate(0,-bob);
    ctx.scale(p.build,p.stature);
    if(!fallen)ctx.rotate(side*p.lean+Math.sin(cycle)*p.sway);
    line(-5,-39,-6+stride*4,-21,p.trousers,7);
    line(-6+stride*4,-21,-6+stride*8,-3,p.trousers,6);
    line(5,-39,6-stride*4*(1-p.asymmetry),-21,p.trousers,7);
    line(6-stride*4*(1-p.asymmetry),-21,6-stride*8*(1-p.asymmetry),-3,p.trousers,6);
    line(-6+stride*8,-2,-6+stride*8+side*5,-1,'#303533',4);
    line(6-stride*8*(1-p.asymmetry),-2,6-stride*8*(1-p.asymmetry)+side*5,-1,'#303533',4);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(-10,-69);ctx.lineTo(10,-69);ctx.quadraticCurveTo(p.belly+3,-52,p.waist,-40);ctx.lineTo(-p.waist,-40);ctx.quadraticCurveTo(-p.belly-3,-52,-10,-69);ctx.closePath();ctx.fill();
    drawClothes(p);
    line(-10,-65,-13-arm*4,-51,p.color,6);line(-13-arm*4,-51,-12-arm*7,-38,p.skin,4);
    if(p.id===attacker&&elapsed>=0&&elapsed<STRIKE_SECONDS-1e-9){
      var other=position(people[victim]),dx=(other.x-q.x)/(p.build*q.scale),dy=(other.y-q.y)/(p.stature*q.scale);
      line(dx<0?-9:9,-64,dx*.48,dy*.5-65,p.color,6);
      line(dx*.48,dy*.5-65,dx,dy-72*people[victim].stature*other.scale/(p.stature*q.scale),p.skin,4);
    }else{line(10,-65,13+arm*4,-51,p.color,6);line(13+arm*4,-51,12+arm*7,-38,p.skin,4);}
    line(0,-71,0,-75,p.skin,5);
    ctx.save();ctx.scale(1/Math.sqrt(p.build),1);
    drawHead(p,side);
    ctx.restore();
    ctx.restore();
    if(keyMode&&selected===p.id&&state===S.PLAY){ctx.strokeStyle='#fff6d3';ctx.lineWidth=2;roundRect(q.x-28*q.scale,q.y-94*q.scale,56*q.scale,100*q.scale,12);ctx.stroke();}
    if(revealAttacker()&&p.id===attacker){ctx.strokeStyle='#f7cc71';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(q.x,q.y-44*q.scale*p.stature,32*q.scale,50*q.scale*p.stature,0,0,Math.PI*2);ctx.stroke();}
  }

  var cameraPrepared=false,cameraLines=null;
  function drawCamera(){
    if(!cameraPrepared){
      cameraPrepared=true;
      var scan=document.createElement('canvas');scan.width=4;scan.height=4;
      var sc=scan.getContext('2d');sc.fillStyle='rgba(12,27,25,.08)';sc.fillRect(0,0,4,1);
      cameraLines=ctx.createPattern(scan,'repeat');
    }
    ctx.save();
    // 走査線と冷たい色味だけを薄く重ねる。
    ctx.globalCompositeOperation='saturation';ctx.globalAlpha=.10;
    ctx.fillStyle='#888';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    ctx.fillStyle='rgba(38,69,63,.045)';ctx.fillRect(0,0,W,H);
    if(cameraLines){ctx.fillStyle=cameraLines;ctx.fillRect(0,0,W,H);}
    ctx.restore();
  }
  function draw() {
    syncShareButton();
    ctx.clearRect(0, 0, W, H);

    drawTown();
    people.forEach(drawShadow);
    if(people3D){
      ctx.drawImage(people3D.render(people,T,attacker,victim,elapsed,fallProgress(),W,H,canvas.width,canvas.height),0,0,W,H);
      if(keyMode&&state===S.PLAY&&people[selected]){var focus=position(people[selected]);ctx.strokeStyle='#fff6d3';ctx.lineWidth=2;roundRect(focus.x-28*focus.scale,focus.y-94*focus.scale,56*focus.scale,100*focus.scale,12);ctx.stroke();}
      if(revealAttacker()&&attacker>=0){
        var marked=position(people[attacker]);ctx.strokeStyle='#f7cc71';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(marked.x,marked.y-44*marked.scale,32*marked.scale,55*marked.scale,0,0,Math.PI*2);ctx.stroke();
      }
    }else people.slice().sort(function(a,b){return a.y-b.y;}).forEach(drawPerson);
    drawCamera();

    if (pointer.visible && handReady) {
      var size = 120;
      ctx.save();
      ctx.translate(pointer.x, pointer.y);
      var press = handPress();
      ctx.rotate((-25-4*press)*Math.PI/180);
      ctx.scale(1-.10*press, 1-.10*press);
      ctx.drawImage(handImage, -size*.49, -size*.014, size, size);
      ctx.restore();
    }
    if (state === S.RESULT||state===S.SUCCESS) drawResult();
  }

  /* 結果画面。数字と「もう一度」「Xでシェア」だけ（説明や煽りは足さない） */
  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,24,28,.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.font=state===S.SUCCESS?'800 42px sans-serif':'800 48px sans-serif';
    ctx.fillText(resultText(), W / 2, H * 0.45);
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font=state===S.SUCCESS?'800 34px sans-serif':'800 48px sans-serif';ctx.textAlign='center';
    ctx.fillText(state===S.SUCCESS?'（'+score+'連続）':String(score),W/2,H*.54);
    if(state===S.SUCCESS)return;
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx,b.label,0,1,30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============
     テスト（games/_tools）から中を見るためのもの。読むのと進めるだけ。
     消さなくてよい。遊びを飛ばせるものは足さないこと。 */
  window.__probe = {
    now: function () { return { state: state, score: score, level:level, W: W, H: H, T:T, elapsed:elapsed, attackAt:attackAt, attacker:attacker, victim:victim, outcome:outcome, selected:selected, resultText:resultText(), fallProgress:fallProgress(), strikeVisible:attacker>=0&&elapsed>=0&&elapsed<STRIKE_SECONDS-1e-9, replay:{taped:replayTape.length,at:replayAt,revealed:revealAttacker()}, people:people.map(function(p){var q=position(p);return {id:p.id,x:q.x,y:q.y-44*q.scale*p.stature,footY:q.y,worldX:p.x,worldY:p.y,scale:q.scale,vx:p.vx,vy:p.vy,generation:p.generation};}) }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(FRAME_SECONDS); drawFrame(); } },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============
     record.js が呼ぶ自動操作。ゲームに合わせて run の中だけ書き換える。 */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 20)) throw Error("勝敗が出ない");
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton=document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  var startingPointer=null;
  document.addEventListener('pointerdown',function(e){
    if(!(state===S.INTRO))return;
    if(e.isPrimary===false||e.button>0)return;
    startingPointer=e.pointerId;
    e.stopImmediatePropagation();
  },true);
  document.addEventListener('pointerup',function(e){
    if(!(state===S.INTRO)||startingPointer!==e.pointerId)return;
    startingPointer=null;e.preventDefault();e.stopImmediatePropagation();startButton.click();
  },true);
  document.addEventListener('pointercancel',function(){startingPointer=null;},true);

  ['pointerdown','pointerup'].forEach(function(name){startButton.addEventListener(name,function(e){e.stopPropagation();});});
  startButton.addEventListener('click',function(e){if(e.stopPropagation)e.stopPropagation();audioOn();resumeAudio();newRound();});
  layout();
  newRound();state=S.INTRO;startButton.hidden=false;
  var last = performance.now(),frameDebt=0;
  function loop(now) {
    var dt = Math.min(.1, Math.max(0,(now-last)/1000));
    last=now;
    if(!window.__recordManual&&!document.hidden){
      frameDebt+=dt;
      if(frameDebt>=FRAME_SECONDS-1e-9){
        var ticks=Math.floor((frameDebt+1e-9)/FRAME_SECONDS);
        frameDebt=Math.max(0,frameDebt-ticks*FRAME_SECONDS);
        // 表示と進行を10fpsに揃え、手刀の発生コマは必ず描く。
        update(ticks*FRAME_SECONDS);drawFrame();
      }
    }else frameDebt=0;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
