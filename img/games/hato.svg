<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="neck" x1="0.25" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#8e99a6"/>
      <stop offset="0.38" stop-color="#77998a"/>
      <stop offset="0.68" stop-color="#8d80a0"/>
      <stop offset="1" stop-color="#96a2af"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b636d"/>
      <stop offset="1" stop-color="#434b54"/>
    </linearGradient>
  </defs>

  <!-- 足もとの道路と、奥の植え込み -->
  <rect width="600" height="600" fill="url(#road)"/>
  <rect width="600" height="126" fill="#8d939b"/>
  <rect y="114" width="600" height="16" fill="#b6bcc4"/>
  <g fill="#2c5539">
    <ellipse cx="62" cy="80" rx="70" ry="42"/>
    <ellipse cx="286" cy="86" rx="58" ry="34"/>
    <ellipse cx="486" cy="76" rx="86" ry="46"/>
  </g>
  <g fill="#3e7551">
    <ellipse cx="38" cy="58" rx="40" ry="23"/>
    <ellipse cx="462" cy="52" rx="46" ry="25"/>
    <ellipse cx="272" cy="66" rx="30" ry="17"/>
  </g>
  <g fill="#f0efe9" opacity=".6">
    <rect x="-14" y="252" width="196" height="21" transform="rotate(-3 84 262)"/>
    <rect x="236" y="228" width="196" height="21" transform="rotate(-3 334 238)"/>
    <rect x="486" y="204" width="196" height="21" transform="rotate(-3 584 214)"/>
  </g>
  <g fill="#000" opacity=".08">
    <ellipse cx="150" cy="452" rx="140" ry="34"/>
    <ellipse cx="530" cy="368" rx="96" ry="26"/>
  </g>

  <!-- ついばむ先のポップコーン -->
  <g transform="translate(492,296) scale(8.5)">
    <circle cx="0" cy="0" r="3.4" fill="#fdf8e8"/>
    <circle cx="2.2" cy="-1.6" r="2.2" fill="#fdf8e8"/>
    <circle cx="-2" cy="1.6" r="2" fill="#fdf8e8"/>
    <circle cx="-0.6" cy="1" r="1.6" fill="#efe2bd"/>
  </g>
  <g transform="translate(556,412) scale(6)">
    <circle cx="0" cy="0" r="3.4" fill="#fdf8e8"/>
    <circle cx="2.2" cy="-1.6" r="2.2" fill="#fdf8e8"/>
    <circle cx="-2" cy="1.6" r="2" fill="#fdf8e8"/>
  </g>

  <!-- 鳩。ゲームと同じかたちを、そのまま寄って写す -->
  <g transform="translate(157,736) scale(11)" stroke="#333b45" stroke-width="0.46"
     stroke-linejoin="round">
    <!-- 胴 -->
    <path d="M-18 -28.5 Q-9 -42 6 -39 Q17.5 -36 18 -25.5 Q17.5 -15 6 -12.5 Q-6 -10.5 -16 -17.5 Z"
          fill="#8e99a6"/>
    <ellipse cx="13" cy="-21" rx="13.5" ry="12.5" transform="rotate(-6 13 -21)"
             fill="#aab4be" stroke="none"/>
    <ellipse cx="-1" cy="-39" rx="10" ry="4" transform="rotate(-9 -1 -39)"
             fill="#ffffff" opacity=".12" stroke="none"/>

    <!-- 首 -->
    <path d="M10.3 -29 Q15.9 -35 16.5 -43.5 L9.5 -48.5 Q5.9 -42.1 -2.3 -38 Z" fill="url(#neck)" stroke="none"/>

    <!-- たたんだ翼 -->
    <path d="M9 -34 Q-3 -39 -16 -33 Q-27 -28 -26 -22.5 Q-13 -19.5 -1 -22.5 Q6.5 -25 9 -34 Z"
          fill="#7b8794"/>
    <g stroke="#39424c" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M3 -32 Q-7 -34 -17 -30.5"/>
      <path d="M2.5 -27 Q-7 -28.5 -17.5 -26"/>
    </g>
    <path d="M-21 -29 Q-33 -25 -34 -20 Q-25 -18.5 -19 -21.5 Z" fill="#232a34" opacity=".35"
          stroke="none"/>

    <!-- 頭 -->
    <g transform="translate(13,-46)">
      <path d="M-7.6 2.4 Q-9 -5.2 -2.6 -8.2 Q4.6 -10.2 7.4 -4.2 Q8.6 -0.4 6.4 3.4 Q0 6.6 -7.6 2.4 Z"
            fill="#96a2af"/>
      <path d="M4.6 -3 Q13.6 -1.5 14.8 0.9 Q12.4 3.1 5 2.5 Z" fill="#4b535d"/>
      <ellipse cx="7.4" cy="-3.4" rx="2.2" ry="1.7" transform="rotate(-14 7.4 -3.4)"
               fill="#eef0f2" stroke="none"/>
      <circle cx="2.1" cy="-2.6" r="2.7" fill="#e88a2c" stroke="none"/>
      <circle cx="2.4" cy="-2.6" r="1.35" fill="#1a1c20" stroke="none"/>
      <circle cx="1.4" cy="-3.4" r="0.7" fill="#ffffff" opacity=".85" stroke="none"/>
    </g>
  </g>
</svg>
