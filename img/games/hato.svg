<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5666"/>
      <stop offset="1" stop-color="#6d7783"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b636d"/>
      <stop offset="1" stop-color="#464e57"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8e99a6"/>
      <stop offset="0.4" stop-color="#5f9b7d"/>
      <stop offset="0.72" stop-color="#8a6f9e"/>
      <stop offset="1" stop-color="#96a2af"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#sky)"/>

  <!-- 奥のビル -->
  <g fill="#3f4855">
    <rect x="-10" y="70" width="120" height="120"/>
    <rect x="118" y="40" width="96" height="150"/>
    <rect x="224" y="88" width="130" height="102"/>
    <rect x="362" y="52" width="104" height="138"/>
    <rect x="474" y="82" width="140" height="108"/>
  </g>
  <g fill="#ffe096" opacity=".45">
    <rect x="14" y="96" width="12" height="14"/><rect x="46" y="96" width="12" height="14"/>
    <rect x="14" y="130" width="12" height="14"/><rect x="78" y="130" width="12" height="14"/>
    <rect x="136" y="66" width="12" height="14"/><rect x="170" y="98" width="12" height="14"/>
    <rect x="136" y="132" width="12" height="14"/><rect x="252" y="112" width="12" height="14"/>
    <rect x="300" y="112" width="12" height="14"/><rect x="252" y="148" width="12" height="14"/>
    <rect x="386" y="78" width="12" height="14"/><rect x="420" y="112" width="12" height="14"/>
    <rect x="386" y="146" width="12" height="14"/><rect x="500" y="106" width="12" height="14"/>
    <rect x="548" y="106" width="12" height="14"/><rect x="500" y="146" width="12" height="14"/>
  </g>

  <!-- 歩道と車道 -->
  <rect y="190" width="600" height="46" fill="#9aa0a8"/>
  <rect y="230" width="600" height="8" fill="#b6bcc4"/>
  <rect y="238" width="600" height="272" fill="url(#road)"/>
  <g fill="#f0efe9" opacity=".7">
    <rect x="20" y="292" width="70" height="7"/>
    <rect x="150" y="292" width="70" height="7"/>
    <rect x="280" y="292" width="70" height="7"/>
    <rect x="410" y="292" width="70" height="7"/>
    <rect x="540" y="292" width="70" height="7"/>
  </g>
  <g fill="#f4de78" opacity=".85">
    <rect y="378" width="600" height="7"/>
    <rect y="394" width="600" height="7"/>
  </g>
  <rect y="510" width="600" height="90" fill="#a7adb5"/>
  <rect y="510" width="600" height="12" fill="#c3c9d0"/>
  <g fill="#e8be3c" opacity=".8">
    <rect x="20" y="556" width="46" height="20"/><rect x="86" y="556" width="46" height="20"/>
    <rect x="152" y="556" width="46" height="20"/><rect x="218" y="556" width="46" height="20"/>
    <rect x="284" y="556" width="46" height="20"/><rect x="350" y="556" width="46" height="20"/>
    <rect x="416" y="556" width="46" height="20"/><rect x="482" y="556" width="46" height="20"/>
    <rect x="548" y="556" width="46" height="20"/>
  </g>

  <!-- 迫ってくる車 -->
  <g opacity=".9">
    <ellipse cx="470" cy="272" rx="120" ry="16" fill="#000" opacity=".28"/>
    <path d="M356 268 v-30 q0-10 10-12 l30-4 18-32 q4-8 14-8 h56 q10 0 14 9 l14 31 26 6 q10 3 10 13 v27 z" fill="#d94f4f"/>
    <path d="M410 224 l14-26 h52 l12 26 z" fill="#26364a" opacity=".92"/>
    <circle cx="396" cy="268" r="18" fill="#20242a"/><circle cx="396" cy="268" r="8" fill="#9aa2ab"/>
    <circle cx="530" cy="268" r="18" fill="#20242a"/><circle cx="530" cy="268" r="8" fill="#9aa2ab"/>
    <rect x="546" y="236" width="12" height="12" rx="3" fill="#ffeeb8"/>
  </g>

  <!-- こぼれたエサ -->
  <g>
    <path d="M186 470 l10-14 14 6 -6 13 z" fill="#e6c98d"/>
    <rect x="236" y="484" width="26" height="9" rx="4" fill="#f0c860"/>
    <circle cx="150" cy="500" r="8" fill="#f6efd8"/>
    <circle cx="160" cy="493" r="6" fill="#f6efd8"/>
    <ellipse cx="292" cy="452" rx="8" ry="6" fill="#c98f5a"/>
  </g>

  <!-- 鳩 -->
  <g transform="translate(330,470) scale(3.4)">
    <ellipse cx="0" cy="2" rx="20" ry="5" fill="#000" opacity=".26"/>
    <!-- 足 -->
    <g stroke="#d1707f" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M-4 -17 Q-8 -10 -9 -1"/>
      <path d="M1 -17 Q-2 -9 -1 1"/>
      <path d="M-9 -1 l6 -1 M-9 -1 l5 2 M-9 -1 l4 -3 M-9 -1 l-4 1"/>
      <path d="M-1 1 l6 -1 M-1 1 l5 2 M-1 1 l4 -3 M-1 1 l-4 1"/>
    </g>
    <!-- 尾 -->
    <path d="M-14 -32 L-41 -27 L-44 -18 L-38 -11 L-13 -18 Z" fill="#6f7b87"/>
    <path d="M-36 -27 L-44 -18 L-36 -12 Z" fill="#232a34" opacity=".55"/>
    <!-- 胴 -->
    <ellipse cx="0" cy="-26" rx="21.5" ry="15.5" transform="rotate(-6 0 -26)" fill="#8e99a6"/>
    <ellipse cx="8.5" cy="-23" rx="13" ry="12.6" fill="#aab4be"/>
    <!-- 首 -->
    <path d="M-1 -24 Q6 -34 8 -46 L18 -44 Q14 -32 10 -25 Z" fill="url(#neck)"/>
    <!-- たたんだ翼 -->
    <path d="M11 -33 Q-2 -40 -18 -32 Q-31 -26 -30 -20 Q-16 -17 -2 -20 Q8 -23 11 -33 Z" fill="#7b8794"/>
    <g stroke="#39424c" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M4 -31.5 Q-8 -33.5 -19 -29.5"/>
      <path d="M3.5 -26 Q-8 -27.5 -20 -24.5"/>
    </g>
    <path d="M-24 -28 Q-36 -24 -37 -19 Q-28 -17 -22 -20 Z" fill="#232a34" opacity=".35"/>
    <!-- 頭 -->
    <g transform="translate(14,-48)">
      <path d="M-7.6 2.4 Q-9 -5.2 -2.6 -8.2 Q4.6 -10.2 7.4 -4.2 Q8.6 -0.4 6.4 3.4 Q0 6.6 -7.6 2.4 Z" fill="#96a2af"/>
      <path d="M6.2 -2.6 Q13.6 -1.4 14.6 0.9 Q12.4 2.9 6.4 2.2 Z" fill="#4b535d"/>
      <ellipse cx="6.6" cy="-2.7" rx="2.9" ry="2.1" transform="rotate(-14 6.6 -2.7)" fill="#eef0f2"/>
      <circle cx="2.2" cy="-2.6" r="2.7" fill="#e88a2c"/>
      <circle cx="2.5" cy="-2.6" r="1.35" fill="#1a1c20"/>
      <circle cx="1.5" cy="-3.4" r="0.7" fill="#fff" opacity=".85"/>
    </g>
  </g>
</svg>
