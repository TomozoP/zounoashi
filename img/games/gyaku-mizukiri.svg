<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3d9"/>
      <stop offset="1" stop-color="#1c6f94"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect y="300" width="800" height="150" fill="url(#sea)"/>
  <g opacity=".35" stroke="#fff" stroke-width="4" fill="none">
    <path d="M40 330 Q120 320 200 330 T360 330 T520 330 T680 330 T800 330"/>
    <path d="M20 365 Q100 355 180 365 T340 365 T500 365 T660 365 T800 365"/>
  </g>
  <path d="M-10 450 L-10 300 Q90 260 190 300 L190 450 Z" fill="#c9b183"/>
  <path d="M-10 300 Q90 260 190 300 L190 285 Q90 245 -10 285 Z" fill="#7cae5c"/>

  <!-- huge flying rock -->
  <g transform="translate(470,180) rotate(22)">
    <polygon points="-58,16 -66,-20 -28,-58 20,-62 58,-28 62,16 28,40 -28,40" fill="#8b9096"/>
    <polygon points="-28,-58 20,-62 4,-28" fill="#ffffff" opacity=".22"/>
    <polygon points="20,-12 58,-28 62,16 28,40" fill="#000000" opacity=".15"/>
  </g>

  <!-- splash -->
  <g fill="#fff" opacity=".85">
    <circle cx="500" cy="305" r="7"/>
    <circle cx="530" cy="290" r="5"/>
    <circle cx="470" cy="296" r="5"/>
  </g>

  <!-- ojisan thrower -->
  <g transform="translate(120,300)">
    <circle cx="0" cy="-42" r="15" fill="#c98a52"/>
    <path d="M-15 -46 A15 15 0 0 1 15 -46 L15 -54 L-15 -54 Z" fill="#5a4a3c"/>
    <path d="M-10 -34 A10 10 0 0 0 10 -34" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
    <rect x="-15" y="-24" width="30" height="36" rx="4" fill="#eae4d6"/>
    <rect x="-34" y="-22" width="20" height="10" rx="4" fill="#c98a52" transform="rotate(-30 -24 -17)"/>
    <rect x="14" y="-22" width="20" height="10" rx="4" fill="#c98a52" transform="rotate(30 24 -17)"/>
    <rect x="-13" y="12" width="12" height="24" fill="#4d5f7d"/>
    <rect x="1" y="12" width="12" height="24" fill="#4d5f7d"/>
  </g>
</svg>
