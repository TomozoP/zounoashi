<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3d9"/>
      <stop offset="1" stop-color="#1c6f94"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect y="300" width="800" height="150" fill="url(#sea)"/>
  <g opacity=".35" stroke="#fff" stroke-width="4" fill="none">
    <path d="M40 330 Q120 320 200 330 T360 330 T520 330 T680 330 T800 330"/>
    <path d="M20 365 Q100 355 180 365 T340 365 T500 365 T660 365 T800 365"/>
  </g>
  <path d="M-10 450 L-10 300 Q90 260 190 300 L190 450 Z" fill="#c9b183"/>
  <path d="M-10 300 Q90 260 190 300 L190 285 Q90 245 -10 285 Z" fill="#7cae5c"/>

  <!-- flying ojisan -->
  <g transform="translate(430,190) rotate(18)">
    <circle cx="0" cy="-22" r="16" fill="#c98a52"/>
    <path d="M-16 -26 A16 16 0 0 1 16 -26 L16 -34 L-16 -34 Z" fill="#5a4a3c"/>
    <path d="M-11 -14 A11 11 0 0 0 11 -14" fill="none" stroke="#9a9a9a" stroke-width="6" stroke-linecap="round"/>
    <rect x="-16" y="-4" width="32" height="38" rx="4" fill="#eae4d6"/>
    <rect x="-38" y="-2" width="24" height="12" rx="4" fill="#c98a52" transform="rotate(-25 -26 4)"/>
    <rect x="14" y="-2" width="24" height="12" rx="4" fill="#c98a52" transform="rotate(25 26 4)"/>
    <rect x="-15" y="30" width="13" height="26" fill="#4d5f7d"/>
    <rect x="2" y="30" width="13" height="26" fill="#4d5f7d"/>
  </g>

  <!-- splash -->
  <g fill="#fff" opacity=".85">
    <circle cx="470" cy="300" r="6"/>
    <circle cx="495" cy="288" r="4"/>
    <circle cx="450" cy="292" r="4"/>
  </g>

  <!-- rock thrower -->
  <g transform="translate(120,300)">
    <polygon points="-30,8 -34,-10 -14,-30 10,-32 30,-14 32,8 14,20 -14,20" fill="#8b9096"/>
    <polygon points="-14,-30 10,-32 2,-14" fill="#ffffff" opacity=".25"/>
    <polygon points="10,-6 30,-14 32,8 14,20" fill="#000000" opacity=".15"/>
    <rect x="28" y="-30" width="24" height="9" rx="3" fill="#8b9096" transform="rotate(-55 28 -30)"/>
    <circle cx="-8" cy="-12" r="2.6" fill="#2b2f33"/>
    <circle cx="4" cy="-14" r="2.6" fill="#2b2f33"/>
  </g>
</svg>
