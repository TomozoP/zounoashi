<script>
/* こだま迷路

   真っ暗な迷路。玉は音叉を持っていて、声を出すと、その声が高くなって音叉の先から前方へ飛んでいく。
   音は粒になって進み、壁で跳ね返りながら届いた所の壁だけが光る（エコーロケーション）。
   粒が当たった壁の面が線で光り、輪郭が浮かぶ。大きな声ほど遠くまで届く。光は1.5秒ほどで消える。
   音の粒が出口に届くと「キン」と、その方向から鳴る。
   マイクが使えないときは、タップ（スペース）でも高い音を出せる。
   迷路には敵が3体いる。敵は1体ずつ順番にうなり声を出し、その音の粒で敵の居場所とまわりの壁が赤く見える。
   こちらの声を聞きつけると、声のした場所へ急いで寄ってくる。追ってくる間はずっとうなり続ける。捕まると入口に戻される。
   迷路の作りは画像迷路と同じ（13×13の部屋）。迷路は画面の幅いっぱいに大きく見せて上に置き、下の操作盤のジョイスティックで玉を動かし、ボタンで音を出す。結果は出口までの秒数。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
  }
  /* pan: -1 左 〜 1 右 */
  function tone(freq, dur, vol, type, to, delay, pan) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain(), out = g;
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g);
    if (pan && AC.createStereoPanner) { var p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(p); out = p; }
    out.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ マイク ============ */
  var mic = null, micSource = null, analyser = null, samples = null, micPending = false, micError = false;
  /* 声を高くして鳴らすため、マイクの音を直近2秒ぶん貯めておく */
  var tape = null, tapeLen = 0, tapePos = 0, tapeNode = null, tapeMute = null;
  function stopMic() {
    if (tapeNode) { try { tapeNode.disconnect(); tapeMute.disconnect(); } catch (e) {} tapeNode = null; }
    if (micSource) { try { micSource.disconnect(); } catch (e) {} }
    if (mic) mic.getTracks().forEach(function (t) { t.stop(); });
    mic = micSource = analyser = null;
  }
  async function requestMic() {
    if (micPending || mic) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) { micError = true; return; }
    micPending = true; micError = false;
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      if (document.hidden) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      mic = stream; analyser = AC.createAnalyser(); analyser.fftSize = 1024;
      samples = new Float32Array(analyser.fftSize);
      micSource = AC.createMediaStreamSource(stream); micSource.connect(analyser);
      if (AC.createScriptProcessor) {
        tapeLen = AC.sampleRate * 2; tape = new Float32Array(tapeLen); tapePos = 0;
        tapeNode = AC.createScriptProcessor(2048, 1, 1);
        tapeMute = AC.createGain(); tapeMute.gain.value = 0;
        tapeNode.onaudioprocess = function (ev) {
          var d = ev.inputBuffer.getChannelData(0);
          for (var i = 0; i < d.length; i++) tape[(tapePos + i) % tapeLen] = d[i];
          tapePos += d.length;
        };
        micSource.connect(tapeNode); tapeNode.connect(tapeMute); tapeMute.connect(AC.destination);
      }
      stream.getTracks().forEach(function (t) { t.onended = function () { stopMic(); micError = true; }; });
    } catch (e) { stopMic(); micError = true; }
    finally { micPending = false; }
  }
  window.addEventListener("pagehide", stopMic);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopMic();
    else if ((state === S.PLAY || state === S.BUILD) && !micError) requestMic();
  });
  /* 貯めた声のうち、from〜to（tapePos の値）を高くして鳴らす。鳴り終わる秒数を返す */
  var RATE = 1.75;
  function playHigh(from, to, vol) {
    if (!AC || !tape) return 0;
    from = Math.max(from, tapePos - tapeLen + 1);
    var n = to - from;
    if (n < AC.sampleRate * 0.05) return 0;
    var buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0), peak = 0.0001;
    for (var i = 0; i < n; i++) { d[i] = tape[(from + i) % tapeLen]; peak = Math.max(peak, Math.abs(d[i])); }
    for (var k = 0; k < n; k++) d[k] = d[k] / peak;   /* 大きさをそろえる */
    var len = n / AC.sampleRate / RATE;
    /* 本人の声のあと、小さくなりながら2回こだまする */
    [[0, 1], [0.28, 0.35], [0.56, 0.12]].forEach(function (e) {
      var src = AC.createBufferSource(), g = AC.createGain();
      src.buffer = buf; src.playbackRate.value = RATE;
      g.gain.value = vol * e[1];
      src.connect(g); g.connect(AC.destination);
      src.start(AC.currentTime + e[0]);
    });
    return len + 0.56;
  }
  /* 声の大きさ 0〜1 */
  function readVoice() {
    if (!analyser) return 0;
    analyser.getFloatTimeDomainData(samples);
    var sum = 0;
    for (var i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    return Math.max(0, Math.min(1, (Math.sqrt(sum / samples.length) - 0.012) / 0.075));
  }

  /* ============ 迷路 ============
     N×N の部屋。壁も1マスとして数えるので、マス目は G = 2N+1 */
  var N = 13, G = 2 * N + 1, B = 12, BOARD = G * B;
  var open = new Uint8Array(G * G);         /* 1 = 通路 */
  var EXIT = (G - 1) * G + G - 2;
  var marks = [];                           /* 音の粒が壁に当たった点。壁の面に沿った短い線として光る */

  /* ランダムな強さの低い順に掘る（Prim の最小全域木） */
  function buildMaze() {
    var strength = new Float32Array(G * G);
    for (var j = 0; j < G * G; j++) strength[j] = Math.random();
    open.fill(0);
    var heap = [];
    function push(w, a, b) {
      heap.push([w, a, b]);
      var i = heap.length - 1;
      while (i > 0) { var p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; var t = heap[p]; heap[p] = heap[i]; heap[i] = t; i = p; }
    }
    function pop() {
      var top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        var i = 0;
        for (;;) {
          var l = i * 2 + 1, r = l + 1, m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          var t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m;
        }
      }
      return top;
    }
    var done = new Uint8Array(N * N);
    function visit(c) {
      done[c] = 1;
      var cx = c % N, cy = (c / N) | 0, bx = cx * 2 + 1, by = cy * 2 + 1;
      open[by * G + bx] = 1;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (dv) {
        var nx = cx + dv[0], ny = cy + dv[1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N || done[ny * N + nx]) return;
        var wall = (by + dv[1]) * G + bx + dv[0];
        push(strength[wall] + Math.random() * 0.06, wall, ny * N + nx);
      });
    }
    visit(0);
    while (heap.length) {
      var e = pop();
      if (done[e[2]]) continue;
      open[e[1]] = 1;
      visit(e[2]);
    }
    /* 入口は左上、出口は右下 */
    open[1] = 1;
    open[EXIT] = 1;
  }
  function degree(i) {
    var x = i % G, y = (i / G) | 0, n = 0;
    if (x > 0 && open[i - 1]) n++;
    if (x < G - 1 && open[i + 1]) n++;
    if (y > 0 && open[i - G]) n++;
    if (y < G - 1 && open[i + G]) n++;
    return n;
  }

  /* ============ 音の粒 ============
     玉の向きを中心に扇形に飛ぶ。壁に当たると跳ね返り、当たった壁が光る。
     跳ね返るたびに弱くなり、届く距離（マス）は声の大きさで決まる */
  var SPEED = 30 * B, CONE = 0.55, RAYS = 70, REACH_MIN = 6, REACH_MAX = 34, BOUNCE_KEEP = 0.9, GLOW_FADE = 1.5;
  var rays = [], clock = 0, exitHeard = false;
  var FORK_TIP = R_FORK_TIP(), forkRing = -9;   /* 音叉の先までの長さと、最後に鳴らした時刻 */
  function R_FORK_TIP() { return 3.5 + 12; }
  function ping(level) {
    level = Math.max(0, level);
    var reach = level >= 9 ? 400 : REACH_MIN + (REACH_MAX - REACH_MIN) * Math.min(1, level);
    var cone = level >= 9 ? Math.PI : CONE, count = level >= 9 ? 360 : RAYS;
    /* 音は音叉の先から出る（先が壁に入るときは、壁の手前から） */
    var ox = player.x, oy = player.y, cf = Math.cos(facing), sf = Math.sin(facing);
    for (var t = 1; t <= FORK_TIP; t++) {
      if (solid(cellOf(player.x + cf * t, player.y + sf * t))) break;
      ox = player.x + cf * t; oy = player.y + sf * t;
    }
    forkRing = clock;
    for (var i = 0; i < count; i++) {
      var a = facing + (count === 1 ? 0 : (i / (count - 1) * 2 - 1) * cone);
      rays.push({ x: ox, y: oy, vx: Math.cos(a), vy: Math.sin(a), d: 0, max: reach * B, e: 1, hit: 0 });
    }
    exitHeard = false;
    shouts++;
    if (state === S.PLAY && level < 9) hear(level);
  }
  function cellOf(x, y) { var bx = Math.floor(x / B), by = Math.floor(y / B); return (bx < 0 || by < 0 || bx >= G || by >= G) ? -1 : by * G + bx; }
  function solid(c) { return c < 0 || !open[c]; }
  /* 壁の面の点 (x, y) を光らせる。vertical: 縦の面か */
  function glow(x, y, vertical, e, col) { if (marks.length < 9000) marks.push({ x: x, y: y, v: vertical, e: e, t: 0, c: col }); }
  function stepRays(dt) {
    var go = SPEED * dt, sub = B / 3;
    rays.forEach(function (r) {
      for (var left = go; left > 0 && r.e > 0; left -= sub) {
        var s = Math.min(sub, left), fade = Math.max(0, 1 - r.d / r.max);
        var nx = r.x + r.vx * s, cx = cellOf(nx, r.y);
        if (solid(cx)) { glow(r.vx > 0 ? Math.floor(nx / B) * B : (Math.floor(nx / B) + 1) * B, r.y, true, Math.min(1, 0.3 + r.e) * fade, r.col); r.vx = -r.vx; r.e *= BOUNCE_KEEP; r.hit++; }
        else r.x = nx;
        var ny = r.y + r.vy * s, cy = cellOf(r.x, ny);
        if (solid(cy)) { glow(r.x, r.vy > 0 ? Math.floor(ny / B) * B : (Math.floor(ny / B) + 1) * B, false, Math.min(1, 0.3 + r.e) * fade, r.col); r.vy = -r.vy; r.e *= BOUNCE_KEEP; r.hit++; }
        else r.y = ny;
        r.d += s;
        if (!r.col) for (var k = 0; k < foes.length; k++) {
          var f = foes[k];
          if (Math.abs(f.x - r.x) < B * 0.7 && Math.abs(f.y - r.y) < B * 0.7) { f.lit = Math.max(f.lit, 0.4 + 0.6 * fade); r.e = 0; }
        }
        if (r.d > r.max || r.e < 0.05) r.e = 0;
        if (!r.col && !exitHeard && cellOf(r.x, r.y) === EXIT && state === S.PLAY) {
          exitHeard = true;
          var pan = (r.x - player.x) / (B * 10), vol = Math.max(0.02, 0.1 * fade);
          tone(1568, 0.6, vol, "sine", null, 0, pan); tone(2093, 0.5, vol * 0.7, "sine", null, 0.06, pan);
        }
      }
    });
    rays = rays.filter(function (r) { return r.e > 0; });
  }

  /* ============ 敵 ============
     ふだんはゆっくりうろつき、1体ずつ順番にうなる（音の粒が広がって、居場所とまわりの壁が赤く見える）。
     こちらの声が届く（通路づたいの距離が声の大きさで決まる）と、声のした場所へ急いで向かい、着いたらまたうろつく。
     向かっている間はうなり続け、音の粒も出し続ける */
  var FOES = 3, FOE_WALK = 2 * B, FOE_RUN = 5 * B, HEAR_MIN = 8, HEAR_MAX = 36, FOE_FAR = 24;
  var GROWL_EVERY = 0.8, GROWL_RAYS = 36, GROWL_REACH = 7, FOE_COLOR = "#ff4d5e";
  var CHASE_PULSE = 0.35, CHASE_RAYS = 48, CHASE_REACH = 20;   /* 追ってくる間は大きな声で、遠くまで見える（危ないけれど道が分かる） */
  var foes = [], catches = 0, caughtFlash = 0, growlClock = 0, growlTurn = 0;
  function nbrs(c) {
    var x = c % G, y = (c / G) | 0, out = [];
    if (x > 0 && open[c - 1]) out.push(c - 1);
    if (x < G - 1 && open[c + 1]) out.push(c + 1);
    if (y > 0 && open[c - G]) out.push(c - G);
    if (y < G - 1 && open[c + G]) out.push(c + G);
    return out;
  }
  /* c から通路づたいの距離（limit マスまで） */
  function distFrom(c, limit) {
    var d = new Int32Array(G * G).fill(-1), q = [c];
    d[c] = 0;
    for (var h = 0; h < q.length; h++) {
      var a = q[h];
      if (d[a] >= limit) continue;
      nbrs(a).forEach(function (m) { if (d[m] < 0) { d[m] = d[a] + 1; q.push(m); } });
    }
    return d;
  }
  function placeFoes() {
    var d = distFrom(Math.floor(player.y / B) * G + Math.floor(player.x / B), 9999), far = [];
    for (var c = 0; c < G * G; c++) if (d[c] >= FOE_FAR && (c % G) % 2 === 1 && ((c / G) | 0) % 2 === 1) far.push(c);
    foes = [];
    for (var i = 0; i < FOES && far.length; i++) {
      var c2 = far.splice(Math.floor(Math.random() * far.length), 1)[0];
      foes.push({ x: (c2 % G + 0.5) * B, y: (((c2 / G) | 0) + 0.5) * B, at: c2, to: c2, prev: -1, map: null, lit: 0, pulse: 0, voice: null });
    }
    growlClock = 0.5; growlTurn = 0;
  }
  /* 追ってくる間のうなり声（鳴らしっぱなしで、大きさと左右を毎回合わせる） */
  function chaseVoice(f, on) {
    if (!AC) return;
    if (!f.voice) {
      if (!on) return;
      var o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain(), amp = AC.createGain(), g = AC.createGain(), out = g;
      o.type = "sawtooth"; o.frequency.value = 82;
      lfo.frequency.value = 9; lg.gain.value = 0.5; amp.gain.value = 0.5;
      lfo.connect(lg); lg.connect(amp.gain);
      g.gain.value = 0;
      o.connect(amp); amp.connect(g);
      if (AC.createStereoPanner) { var p = AC.createStereoPanner(); g.connect(p); out = p; g.pan = p; }
      out.connect(AC.destination);
      o.start(); lfo.start();
      f.voice = { o: o, lfo: lfo, g: g };
    }
    var near = Math.hypot(f.x - player.x, f.y - player.y) / B;
    var vol = on ? 0.26 : 0;
    f.voice.g.gain.setTargetAtTime(vol, AC.currentTime, 0.06);
    if (f.voice.g.pan) f.voice.g.pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, (f.x - player.x) / (B * 10))), AC.currentTime, 0.06);
  }
  function quietFoes() {
    foes.forEach(function (f) {
      if (!f.voice) return;
      try { f.voice.o.stop(); f.voice.lfo.stop(); f.voice.g.disconnect(); } catch (e) {}
      f.voice = null;
    });
  }
  function hear(level) {
    var here = Math.floor(player.y / B) * G + Math.floor(player.x / B);
    var range = Math.round(HEAR_MIN + (HEAR_MAX - HEAR_MIN) * Math.min(1, level));
    var d = distFrom(here, range);
    foes.forEach(function (f) {
      if (d[f.at] < 0) return;
      f.map = d;   /* 声のした場所への道しるべ。距離が減る方へ進めば着く */
    });
  }
  /* 敵の声の大きさは距離によらず一定（左右だけ方向に合わせる） */
  function fall() { return 0.5; }
  /* うなり声。左右はその方向から。音の粒がまわりへ広がる */
  function growl(f, rays0) {
    var near = Math.hypot(f.x - player.x, f.y - player.y) / B, pan = (f.x - player.x) / (B * 10);
    var vol = 0.16 * fall(near);
    tone(f.map ? 95 : 70, 0.5, vol, "sawtooth", f.map ? 140 : 55, 0, pan);
    tone(f.map ? 190 : 140, 0.35, vol * 0.4, "square", 90, 0.03, pan);
    f.lit = 1;
    emitFoe(f, GROWL_RAYS, GROWL_REACH);
  }
  function emitFoe(f, n, reach) {

      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(R_PLAYER + 1.5, 0); ctx.lineTo(R_PLAYER + 5, 0);                       /* 柄 */
      ctx.moveTo(R_PLAYER + 5, -2.8 - wob); ctx.lineTo(R_PLAYER + 5, 2.8 + wob);          /* 根元 */
      ctx.moveTo(R_PLAYER + 5, -2.8 - wob); ctx.lineTo(R_PLAYER + 12, -2.8 - wob);        /* 2本の歯 */
      ctx.moveTo(R_PLAYER + 5, 2.8 + wob); ctx.lineTo(R_PLAYER + 12, 2.8 + wob);
      ctx.stroke();
      ctx.lineCap = "butt";
      ctx.restore();
    }
    ctx.restore();

    /* 捕まったときに赤く光る */
    if (caughtFlash > 0) { ctx.fillStyle = "rgba(224,52,74," + (0.45 * caughtFlash).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }

    /* 操作盤：ジョイスティックと音のボタン */
    if (state === S.PLAY || state === S.BUILD || state === S.GOAL) {
      ctx.beginPath(); ctx.arc(PAD.x, PAD.y, STICK_R + 8, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2; ctx.stroke();
      var kx = 0, ky = 0;
      if (stick && stick.on) {
        kx = stick.x - stick.bx; ky = stick.y - stick.by;
        var kd = Math.hypot(kx, ky);
        if (kd > STICK_R) { kx = kx / kd * STICK_R; ky = ky / kd * STICK_R; }
      }
      ctx.beginPath(); ctx.arc(PAD.x + kx, PAD.y + ky, 28, 0, Math.PI * 2);
      ctx.fillStyle = stick && stick.on ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.3)"; ctx.fill();
      /* 音のボタン（音叉の絵） */
      var pr = Math.max(0, sndPress);
      ctx.beginPath(); ctx.arc(SND.x, SND.y, SND.r * (1 - 0.06 * pr), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + (0.1 + 0.25 * pr).toFixed(3) + ")"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.save();
      ctx.translate(SND.x, SND.y);
      var wb = pr * 2 * Math.sin(clock * 90);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 26); ctx.lineTo(0, 6);
      ctx.moveTo(-10 - wb, 6); ctx.lineTo(10 + wb, 6);
      ctx.moveTo(-10 - wb, 6); ctx.lineTo(-10 - wb, -24);
      ctx.moveTo(10 + wb, 6); ctx.lineTo(10 + wb, -24);
      ctx.stroke();
      ctx.restore();
    }

    if (state === S.RESULT) drawResult();
  }

  function resultButtons() {
    var h = 54, gap = 16, wr = 170, ws = 224;
    var x0 = W / 2 - (wr + gap + ws) / 2, y = H * 0.62;
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "share", x: x0 + wr + gap, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.font = "800 108px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(secText() + zT("秒", "s"), W / 2, H * 0.45);
    ctx.restore();
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, time: time, player: { x: player.x, y: player.y }, W: W, H: H, shouts: shouts, mic: !!mic, micError: micError, rays: rays.length, facing: facing, catches: catches, foes: foes.map(function (f) { return { x: f.x, y: f.y, chase: !!f.map }; }) }; },
    maze: function () { return { G: G, B: B, open: Array.prototype.slice.call(open) }; },
    marks: function () { return marks.length; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    move: function (dx, dy) { moveBy(dx, dy); },
    stick: function (vx, vy) { stick = { on: vx !== 0 || vy !== 0, bx: 0, by: 0, x: vx * STICK_R, y: vy * STICK_R }; },
    ping: function (v) { ping(v); },
    reset: function () { newRound(); }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(4000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO;
  startButton.hidden = false;
  shareButton.hidden = true;
  buildMaze();
  layout();
  var last = performance.now();
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
