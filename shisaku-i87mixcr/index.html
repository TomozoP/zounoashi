<script>
/* 広すぎ北海道ゲーム

   北海道の輪郭（線）の中に、あいてと交互に県を置いていく。次に置く県はルーレットで決まる（大きさは本物どおり）。
   県は自分で動かして回して置く。ほかの県とは重ねられない。線からはみ出して置いたら負け。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  /* 結果画面の「作者をフォロー」（共通。ボタン列の下に控えめに出す） */
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  /* ============ 画面 ============ */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
    if (!HKP) buildShapes();                     /* 遊んでいる途中で形の倍率は変えない */
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null, OUT = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    OUT = AC.createDynamicsCompressor();
    OUT.connect(AC.destination);
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(OUT);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, to, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    var n = AC.currentTime + (delay || 0);
    f.type = "bandpass"; f.frequency.setValueAtTime(freq, n); f.Q.value = q || 1;
    if (to) f.frequency.exponentialRampToValueAtTime(to, n + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(OUT);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  var SFX = {
    whoosh: function () { noiseHit(0.5, 600, 0.12, 1.2, 2400); },
    clang: function () {                         /* ぴったりはまった */
      tone(1180, 0.5, 0.12, "square", 1100); tone(1770, 0.4, 0.07, "triangle"); tone(220, 0.25, 0.2, "square", 110);
      noiseHit(0.18, 3200, 0.3, 2);
    },
    stick: function () { tone(140, 0.25, 0.25, "square", 60); noiseHit(0.2, 500, 0.35, 1); },
    lost: function () { tone(500, 0.35, 0.08, "triangle", 160); },
    land: function () { tone(70, 0.6, 0.45, "sine", 35); noiseHit(0.6, 180, 0.6, 0.8); },
    swing: function () { noiseHit(0.16, 900, 0.12, 1.5, 2600); },
    hit: function (k) { k = Math.min(1, k); tone(120, 0.18, 0.3 * k + 0.1, "square", 50); noiseHit(0.2, 1400, 0.4 * k + 0.15, 1.2); noiseHit(0.08, 4000, 0.2 * k, 2); },
    hurt: function (k) { k = Math.min(1, k); tone(90, 0.3, 0.3 * k + 0.1, "sawtooth", 40); noiseHit(0.3, 700, 0.4 * k + 0.1, 1); },
    roar: function (big) {
      var d = big ? 1.2 : 0.6;
      tone(150, d, 0.16, "sawtooth", 70); tone(96, d, 0.14, "sawtooth", 55);
      noiseHit(d, 900, 0.25, 0.7, 300);
    },
    lose: function () { tone(330, 0.4, 0.12, "triangle", 300); tone(262, 0.5, 0.12, "triangle", 240, 0.35); tone(196, 0.9, 0.14, "triangle", 150, 0.75); }
  };
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });



  /* ============ 形 ============
     prefs.js の輪郭（どれも同じ縮尺）を、北海道が画面の幅いっぱいになる倍率にする。各県は自分の重心が原点 */
  function areaCentroid(p) {
    var a = 0, cx = 0, cy = 0;
    for (var i = 0; i < p.length; i++) {
      var u = p[i], v = p[(i + 1) % p.length], c = u[0] * v[1] - v[0] * u[1];
      a += c; cx += (u[0] + v[0]) * c; cy += (u[1] + v[1]) * c;
    }
    return a ? [cx / (3 * a), cy / (3 * a)] : [0, 0];
  }
  var HK = 0, SC = 1, SHAPES = [], HKP = null, HKB = null;
  function buildShapes() {
    var raw = window.PREFS || [], hx0 = 1e9, hx1 = -1e9, hy0 = 1e9, hy1 = -1e9;
    raw[HK].p.forEach(function (q) { hx0 = Math.min(hx0, q[0]); hx1 = Math.max(hx1, q[0]); hy0 = Math.min(hy0, q[1]); hy1 = Math.max(hy1, q[1]); });
    SC = Math.min((W - 40) / (hx1 - hx0), (H * 0.52) / (hy1 - hy0));
    SHAPES = raw.map(function (d, i) {
      var c = areaCentroid(d.p);
      var pts = d.p.map(function (q) { return [(q[0] - c[0]) * SC, (q[1] - c[1]) * SC]; });
      var r = 0; pts.forEach(function (q) { r = Math.max(r, Math.hypot(q[0], q[1])); });
      return { i: i, name: d.n, pts: pts, r: r, area: Math.abs(d.a || 1) };
    });
    /* 北海道（器）は、上に余白をとって真ん中に */
    var ox = W / 2 - ((hx0 + hx1) / 2) * SC, oy = 150 - hy0 * SC;
    HKP = raw[HK].p.map(function (q) { return [q[0] * SC + ox, q[1] * SC + oy]; });
    HKB = bbox(HKP);
    CX = (HKB.x0 + HKB.x1) / 2; CY = (HKB.y0 + HKB.y1) / 2;
    window.GattaiShapes = SHAPES;                /* scene3d.js が形を読む */
  }
  function prefColor(i) { return "hsl(" + Math.round((i * 137.5) % 360) + ",72%,58%)"; }

  /* ---------- 多角形 ---------- */
  function bbox(P) {
    var b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
    P.forEach(function (q) { b.x0 = Math.min(b.x0, q[0]); b.x1 = Math.max(b.x1, q[0]); b.y0 = Math.min(b.y0, q[1]); b.y1 = Math.max(b.y1, q[1]); });
    return b;
  }
  function placed(i, x, y, a) {
    var c = Math.cos(a), s = Math.sin(a);
    return SHAPES[i].pts.map(function (q) { return [x + q[0] * c - q[1] * s, y + q[0] * s + q[1] * c]; });
  }
  function pointIn(P, x, y) {
    var inside = false;
    for (var i = 0, j = P.length - 1; i < P.length; j = i++) {
      if ((P[i][1] > y) !== (P[j][1] > y) && x < (P[j][0] - P[i][0]) * (y - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) inside = !inside;
    }
    return inside;
  }
  function cross(a, b, c, d) {                   /* 線分 ab と cd が交わる */
    var d1 = (d[0] - c[0]) * (a[1] - c[1]) - (d[1] - c[1]) * (a[0] - c[0]);
    var d2 = (d[0] - c[0]) * (b[1] - c[1]) - (d[1] - c[1]) * (b[0] - c[0]);
    var d3 = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    var d4 = (b[0] - a[0]) * (d[1] - a[1]) - (b[1] - a[1]) * (d[0] - a[0]);
    return d1 * d2 < 0 && d3 * d4 < 0;
  }
  function edgesCross(A, B, bb) {
    for (var i = 0; i < A.length; i++) {
      var a = A[i], b = A[(i + 1) % A.length];
      if (bb && (Math.max(a[0], b[0]) < bb.x0 || Math.min(a[0], b[0]) > bb.x1 || Math.max(a[1], b[1]) < bb.y0 || Math.min(a[1], b[1]) > bb.y1)) continue;
      for (var j = 0; j < B.length; j++) if (cross(a, b, B[j], B[(j + 1) % B.length])) return true;
    }
    return false;
  }
  /* 線（北海道の輪郭）からはみ出しているか */
  function overLine(P) {
    for (var k = 0; k < P.length; k++) if (!pointIn(HKP, P[k][0], P[k][1])) return true;
    return edgesCross(P, HKP);
  }
  /* ほかの県と重なっているか */
  /* 見た目の形どうしで比べる（県どうしは物理でぶつからないので、見た目で離れていれば当たらない） */
  function overlapsAny(P, bb) {
    for (var n = 0; n < board.length; n++) {
      var Q = board[n], qb = Q.bb;
      if (bb.x1 < qb.x0 || bb.x0 > qb.x1 || bb.y1 < qb.y0 || bb.y0 > qb.y1) continue;
      if (edgesCross(P, Q.poly, qb) || pointIn(Q.poly, P[0][0], P[0][1]) || pointIn(P, Q.poly[0][0], Q.poly[0][1])) return true;
    }
    return false;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", MODE: "mode", SPIN: "spin", PLACE: "place", SETTLE: "settle", END: "end", RESULT: "result" };
  var state, T, won, shake, board, deck, cur, turn, count, spin, cpuMove, endT, forceOut, loserPiece;
  var conf = window.zCelebrate ? window.zCelebrate.confetti() : null;
  if (conf) conf.rain = false;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    T = 0; won = false; shake = 0; count = 0; endT = 0; forceOut = null; loserPiece = null; fallen = null;
    newWorld();
    board = []; cur = null; turn = 0;
    deck = [];
    for (var i = 0; i < SHAPES.length; i++) deck.push(i);   /* 北海道も出る（入るわけがないが、置くまでやる） */
    if (conf) conf.clear();
    startSpin();
  }
  /* 遊び方: "cpu"（あいてはCPU）か "2p"（ふたりで交互） */
  var mode = "cpu";
  function cpuTurn() { return mode === "cpu" && turn === 1; }
  function humanTurn() { return !cpuTurn(); }
  var PCOL = ["#ff7a45", "#8a5cff"];             /* プレイヤーの色（1P / 2P・CPU） */
  function modeButtons() {
    var w = Math.min(220, (W - 60) / 2), h = 170, y = H * 0.66;
    return [{ m: "cpu", x: W / 2 - w - 10, y: y, w: w, h: h }, { m: "2p", x: W / 2 + 10, y: y, w: w, h: h }];
  }
  function trayPos() { return { x: W / 2, y: (HKB.y1 + ctrlY()) / 2 + 10 }; }

  /* ---------- ルーレット（次の県を決める） ---------- */
  /* 円盤に残りの県を並べる。自分の番はタップで回し、あいては自分で回す。ゆっくり止まって、針の先の県に決まる */
  var wheelRot = 0, forceHK = false;
  /* 円盤は回り続け、タップでブレーキ。止まるまでの長さは毎回ばらばらなので、どこで止まるかはランダム。あいては適当なところで押す */
  var SPIN_W = 13;
  function startSpin() {
    if (!deck.length) { finish(true); return; }
    state = S.SPIN;
    spin = { seg: deck.filter(function (i) { return board.length || i !== HK; }),   /* 最初の1枚は北海道を出さない（空の北海道にぴったり置けてしまう） */
       stop: false, v: SPIN_W, done: false, t: 0, hold: 0, pick: null, last: -1, cpuAt: 0.3 + Math.random() * 0.4 };
  }
  function spinNow() {
    if (state !== S.SPIN || spin.stop) return;
    spin.stop = true; spin.brake = 2.2 + Math.random() * 1.2;
    tone(500, 0.08, 0.12, "square");
  }
  function underNeedle() {
    var n = spin.seg.length, s = Math.PI * 2 / n, a = ((-Math.PI / 2 - wheelRot) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
    return Math.floor(a / s) % n;
  }
  function updateSpin(dt) {
    spin.t += dt;
    if (cpuTurn() && spin.t > spin.cpuAt) spinNow();
    if (!spin.done) {
      if (spin.stop) spin.v = Math.max(0, spin.v * Math.exp(-spin.brake * dt) - 0.9 * dt);   /* 最後はじわっと止まる */
      wheelRot += spin.v * dt;
      var k = underNeedle();
      if (k !== spin.last) { spin.last = k; tone(1100, 0.03, 0.04, "square"); }
      if (spin.stop && spin.v <= 0) {
        if (forceHK) {                           /* デバッグ: 北海道のマスに合わせる */
          var n = spin.seg.length, s = Math.PI * 2 / n;
          wheelRot = -Math.PI / 2 - (spin.seg.indexOf(HK) + 0.5) * s; forceHK = false;
        }
        spin.done = true; spin.pick = spin.seg[underNeedle()];
        tone(660, 0.12, 0.12, "square"); tone(990, 0.25, 0.12, "square", null, 0.1);
      }
      return;
    }
    spin.hold += dt;
    if (spin.hold > 1.0) startPlace(spin.pick);   /* 決まった県を見せる間 */
  }
  function startPlace(i) {
    deck.splice(deck.indexOf(i), 1);
    cur = { i: i, x: CX, y: CY, a: 0, ta: 0 };
    state = S.PLACE;
    cpuMove = null;
    refreshBoard();
    if (cpuTurn()) {
      var best = solve(i);
      if (!best || (NO_OVERLAP && overlapsAny(placed(i, best.x, best.y, best.a), bbox(placed(i, best.x, best.y, best.a))))) best = outsideSpot(i);
      if (forceOut === "cpu") { best = { x: HKB.x1 + 250, y: CY, a: 0 }; forceOut = null; }
      cpuMove = { t: 0, fx: cur.x, fy: cur.y, x: best.x, y: best.y, a: best.a };
    }
  }

  /* ---------- 置ける所を探す（相手と、デバッグの「おまかせ」） ----------
     線の内側で、ほかの県と重ならない所のうち、線やほかの県にいちばん寄り添う所（少しぶれる） */
  function deepIn(x, y) {                       /* 重心が線から少し内側（すべっても落ちにくい） */
    var m = 22;
    return pointIn(HKP, x, y) && pointIn(HKP, x + m, y) && pointIn(HKP, x - m, y) && pointIn(HKP, x, y + m) && pointIn(HKP, x, y - m);
  }
  function solve(i) {
    var best = null, step = 10, rots = 1;   /* 回さない */
    for (var r = 0; r < rots; r++) {
      var a = r * Math.PI * 2 / rots;
      for (var y = HKB.y0; y <= HKB.y1; y += step) for (var x = HKB.x0; x <= HKB.x1; x += step) {
        if (!deepIn(x, y)) continue;
        var P = placed(i, x, y, a), bb = bbox(P);
        var sc = hug(P) + Math.random() * 6 - (overLine(P) ? 5000 : 0);
        var HP = placed(i, x, y, a);
        if (overlapsAny(HP, bbox(HP))) {
          if (NO_OVERLAP) continue;            /* 置けない所は候補にしない（はみ出しても重ならない所を選ぶ） */
          /* 重ねるなら、県の上にまるごと乗せる（半分だけ乗ると傾いてすべり落ちる） */
          var f = onTop(P, bb, x, y);
          sc -= 1000 + 2000 * Math.min(f, 1 - f) + (f < 0.5 ? 600 : 0);
        }
        if (!best || sc > best.sc) best = { x: x, y: y, a: a, sc: sc };
      }
    }
    return best;
  }
  /* 角と真ん中のうち、ほかの県の上にある割合（0〜1）。真ん中は重く数える */
  function onTop(P, bb, cx, cy) {
    var near = board.filter(function (Q) { return !(bb.x1 < Q.bb.x0 || bb.x0 > Q.bb.x1 || bb.y1 < Q.bb.y0 || bb.y0 > Q.bb.y1); });
    function over(px, py) { for (var k = 0; k < near.length; k++) if (pointIn(near[k].poly, px, py)) return 1; return 0; }
    var n = 0, m = 0;
    for (var k = 0; k < P.length; k += 2) { n += over(P[k][0], P[k][1]); m++; }
    n += over(cx, cy) * 4; m += 4;
    return n / m;
  }
  function hug(P) {                              /* 線やほかの県の近くにある角の数 */
    var n = 0, polys = [HKP].concat(board.map(function (b) { return b.poly; }));
    for (var k = 0; k < P.length; k += 2) {
      var p = P[k], near = false;
      for (var m = 0; m < polys.length && !near; m++) {
        var Q = polys[m];
        for (var j = 0; j < Q.length; j++) if (Math.abs(Q[j][0] - p[0]) + Math.abs(Q[j][1] - p[1]) < 22) { near = true; break; }
      }
      if (near) n++;
    }
    return n;
  }
  function outsideSpot(i) {                      /* 入る所がない: 重ならない所に置くしかない（はみ出す） */
    for (var k = 0; k < 200; k++) {
      var x = HKB.x0 + Math.random() * (HKB.x1 - HKB.x0), y = HKB.y0 + Math.random() * (HKB.y1 - HKB.y0), a = 0;
      var P = placed(i, x, y, a);
      if (!overlapsAny(P, bbox(P))) return { x: x, y: y, a: a };
    }
    var tp = trayPos();
    return { x: tp.x, y: tp.y, a: 0 };
  }
  function updateCPU(dt) {
    var m = cpuMove;
    m.t += dt;
    var u = Math.min(1, Math.max(0, (m.t - 0.1) / 0.5)), e = u * u * (3 - 2 * u);

    modeButtons().forEach(function (b) {
      ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4;
      roundRect(b.x, b.y, b.w, b.h, 22); ctx.fill(); ctx.stroke();
      var cx = b.x + b.w / 2, cy = b.y + b.h * 0.42;
      if (b.m === "cpu") { person(cx - 34, cy, PCOL[0]); robot(cx + 34, cy, PCOL[1]); }

      ctx.fillText(b.m === "cpu" ? "VS CPU" : "2P", cx, b.y + b.h * 0.82);
    });
    /* 地図の出典（国土地理院の利用規約・jpn-atlas の BSD-3-Clause による表記） */
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "500 15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(zT("地図: 国土地理院「地球地図日本」を加工（jpn-atlas, BSD-3-Clause）", "Map: GSI Japan \"Global Map Japan\", modified (jpn-atlas, BSD-3-Clause)"), W / 2, H - 16);
  }
  function person(x, y, c) {
    ctx.fillStyle = c; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - 18, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 24, y + 30); ctx.quadraticCurveTo(x - 24, y, x, y); ctx.quadraticCurveTo(x + 24, y, x + 24, y + 30); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  function robot(x, y, c) {
    ctx.fillStyle = c; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y - 40); ctx.lineTo(x, y - 32); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y - 42, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    roundRect(x - 18, y - 32, 36, 28, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.fillRect(x - 10, y - 23, 7, 7); ctx.fillRect(x + 3, y - 23, 7, 7);
    ctx.fillStyle = c; roundRect(x - 22, y, 44, 30, 8); ctx.fill(); ctx.stroke();
  }
  function drawHUD() {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
    ctx.font = "900 60px sans-serif"; ctx.fillStyle = "#fff";
    ctx.fillText(count, W / 2, 18);
    if (state !== S.END) {
      var who = mode === "2p" ? (turn === 0 ? "1P" : "2P") : turn === 0 ? zT("あなた", "YOU", "당신", "你", "你") : "CPU";
      ctx.font = "900 26px sans-serif"; ctx.fillStyle = PCOL[turn]; ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; ctx.strokeText(who, W / 2, 84);
      ctx.fillText(who, W / 2, 84);
    }
    ctx.restore();
  }
  function wheelGeom() {
    /* 上半分だけ画面に出す大きな円 */
    var r = W * 0.47;
    return { x: W / 2, y: H - 6, r: r };
  }
  function drawSpin() {
    var g = wheelGeom(), n = spin.seg.length, s = Math.PI * 2 / n, done = spin.done;
    var kNow = done ? underNeedle() : -1;
    ctx.save(); ctx.translate(g.x, g.y);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(4, 6, g.r + 6, 0, Math.PI * 2); ctx.fill();
    for (var k = 0; k < n; k++) {
      var a = wheelRot + k * s, i = spin.seg[k];
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, g.r, a, a + s); ctx.closePath();
      ctx.fillStyle = prefColor(i); ctx.fill();
      if (k === kNow) { ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill(); }
      ctx.strokeStyle = "#16202e"; ctx.lineWidth = 1.2; ctx.stroke();
      /* 県名（外から中へ） */
      ctx.save(); ctx.rotate(a + s / 2);
      ctx.fillStyle = "#16202e"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.font = "500 " + Math.max(9, Math.min(20, g.r * s * 0.75)) + "px sans-serif";
      ctx.fillText(SHAPES[i].name, g.r - 6, 0);
      ctx.restore();
    }
    ctx.lineWidth = 5; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, g.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, g.r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#16202e"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    /* 針（上） */
    ctx.fillStyle = PCOL[turn]; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(g.x - 16, g.y - g.r - 22); ctx.lineTo(g.x + 16, g.y - g.r - 22); ctx.lineTo(g.x, g.y - g.r + 14); ctx.closePath(); ctx.fill(); ctx.stroke();

    if (done) {
      var nm = SHAPES[spin.pick].name, py = g.y - g.r * 0.45;
      var pop = 1 + 0.5 * Math.max(0, 1 - spin.hold / 0.18);
      ctx.save(); ctx.translate(g.x, py); ctx.scale(pop, pop); ctx.translate(-g.x, -py);
      ctx.font = "900 44px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
      ctx.lineWidth = 10; ctx.strokeStyle = "#16202e"; ctx.strokeText(nm, g.x, py); ctx.fillStyle = "#ffd34a"; ctx.fillText(nm, g.x, py);
      ctx.restore();

  }
  function drawCtrls() {
    ctrlButtons().forEach(function (b) {
      ctx.fillStyle = b.kind === "ok" ? (curOverlaps() ? "#b9b2a0" : "#ffd34a") : "rgba(255,255,255,.92)"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      }

    });
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);

  }
  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.55)"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10; ctx.textAlign = "center";
    if (mode === "2p") { ctx.fillStyle = PCOL[won ? 0 : 1]; ctx.font = "900 96px sans-serif"; ctx.fillText((won ? "1P" : "2P") + " WIN", W / 2, H * 0.36); ctx.fillStyle = "#fff"; }
    else { ctx.font = "800 96px sans-serif"; ctx.fillText(won ? "WIN" : "LOSE", W / 2, H * 0.36); }
    ctx.font = "800 110px sans-serif"; ctx.fillText(count, W / 2, H * 0.36 + 120);
    ctx.font = "800 36px sans-serif"; ctx.fillText(zT("県", "prefectures", "현", "县", "縣"), W / 2, H * 0.36 + 166);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  /* ============ 覗き穴 ============ */
  var hideUI = false;
  window.__probe = {
    now: function () { return { state: state, turn: turn, count: count, won: won, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    debug: debugKey,
    hideUI: function () { hideUI = true; },
    bodies: function () { return board.map(function (p) { return [SHAPES[p.i].name, +p.body.position.x.toFixed(2), +p.body.position.y.toFixed(2), +p.body.position.z.toFixed(2)]; }); }
  };
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000); r.key(); await r.wait(800);

        await r.wait(500); spinNow();
        if (!await r.until(function () { return state === S.PLACE && turn === 0; }, 15)) break;
        await r.wait(600); debugKey(1);
      }
      await r.wait(2000);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); startButton.hidden = true; state = S.MODE; });
  layout();

  var last = performance.now(), stepAcc = 0;

      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
