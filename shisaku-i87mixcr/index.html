<script>
/* エクストリーム駄々

   おもちゃ屋で子供になって駄々をこねる。子供は関節でつないだ剛体（physics.js）。
     連打 … たたくたびに触った方へ跳ねて転がる。速く連打するほど激しさ(rage)が上がり、手足のバタバタも転がりも強くなる
   15秒で壊したおもちゃの値段の合計が点数。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  var lastSfx = 0;
  function crash(kind, v) {
    if (!AC) return;
    var n = AC.currentTime;
    if (n - lastSfx < 0.03) return;
    lastSfx = n;
    if (kind === "ball") { tone(180 + Math.random() * 80, 0.12, 0.18, "sine", 90); return; }
    if (kind === "bear") { noiseHit(0.08, 500, 0.25, 0.8); return; }
    noiseHit(0.12 + v * 0.02, 900 + Math.random() * 900, Math.min(0.5, 0.15 + v * 0.06), 0.9);
    /* バキッ：割れる・つぶれる音を重ねる */
    noiseHit(0.05, 3500 + Math.random() * 2500, 0.22, 2);
    noiseHit(0.09, 380 + Math.random() * 200, 0.3, 0.6);
    tone(260 + Math.random() * 200, 0.07, 0.08, "triangle", 120);
  }
  /* スローの効果音：ドンという重い低音、時間が伸びるような下がる唸り、風切りが低くなっていく音。
     終わりぎわに逆回しのように吸い上がる音で元の速さへ戻る */
  function sweep(f0, f1, dur, vol, delay, q) {
    if (!AC || !NOISE) return;
    var n = AC.currentTime + (delay || 0), s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = q || 2;
    f.frequency.setValueAtTime(f0, n); f.frequency.exponentialRampToValueAtTime(f1, n + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(vol, n + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  function slowFx() {
    if (!AC) return;
    var n = AC.currentTime;
    tone(95, 1.3, 0.45, "sine", 32);                       /* ドーン */
    noiseHit(0.35, 160, 0.45, 0.8);
    var o = AC.createOscillator(), lp = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(260, n); o.frequency.exponentialRampToValueAtTime(55, n + 0.8);   /* 唸りが下がる */
    lp.type = "lowpass"; lp.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.12, n + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.85);
    o.connect(lp); lp.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + 0.9);
    sweep(2400, 220, 0.8, 0.35, 0, 1.5);                     /* 風切りが低くなる */
    sweep(250, 2600, 0.3, 0.3, SLOW_TIME - 0.25, 1.5);     /* 戻るときの吸い上げ */
    /* 破壊：ガシャーンと砕ける破片の音をばらばらに重ねる */
    for (var i = 0; i < 10; i++) shard(0.02 + Math.random() * 0.5, 2500 + Math.random() * 5000, 0.12 + Math.random() * 0.12);
    var crack = AC.createBufferSource(), cf = AC.createBiquadFilter(), cg = AC.createGain();
    crack.buffer = NOISE; cf.type = "lowpass"; cf.frequency.value = 1400;
    cg.gain.setValueAtTime(0.6, n); cg.gain.exponentialRampToValueAtTime(0.0001, n + 0.45);
    crack.connect(cf); cf.connect(cg); cg.connect(AC.destination); crack.start(n, Math.random()); crack.stop(n + 0.5);
  }
  function shard(delay, freq, vol) {
    if (!AC || !NOISE) return;
    var n = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 6;
    var g = AC.createGain(); g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.06 + Math.random() * 0.08);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(n, Math.random()); s.stop(n + 0.2);
  }
  /* 泣き叫ぶ声（合成） */
  var CRIES = ["やだー", "かってー", "ぎゃー", "やだやだやだ", "かってかって", "うわーん"];
  var cryEnd = 0;
  /* 声は動いたとき（タップ・スワイプ）だけ。しゃべっている途中なら重ねない */
  function cry() {
    if (!AC || !window.zVoice || AC.currentTime < cryEnd) return;
    var y = CRIES[Math.floor(Math.random() * CRIES.length)];
    var r = window.zVoice.speak(AC, AC.currentTime + 0.02, 430 + Math.random() * 80, window.zVoice.kana(y, 0.13), { volume: 0.3, swing: 1.6 });
    cryEnd = (r && r.end ? r.end : AC.currentTime + 1) + 0.15;
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 状態 ============ */
  var TIME = 15, SLOW_TIME = 0.9;
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, keyMode = false, broken;
  var phys = new window.ZDadaPhysics.Game();
  var rage = 0, slow = 0, slowCool = 0, tap = false, swipe = null, press = null, rings = [], streaks = [], keyDir = { l: 0, r: 0, u: 0, d: 0 }, shake = 0, pops = [], snap = true;

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    phys.reset();
    state = S.PLAY;
    score = 0; broken = 0;
    T = 0; held = false; rage = 0; slow = 0; slowCool = 0; tap = false; swipe = null; press = null; rings = []; streaks = []; pops = []; snap = true;
    cryEnd = 0;
  }
  function finish() {
    state = S.RESULT; held = false; press = null;
    if (AC) window.zCelebrate.play(AC, score >= 100000 ? "fanfare" : "chime");
  }

  /* ============ 進行 ============ */
  function update(realDt) {
    /* ぶつかったときのスロー：slow は残りの実時間。始めは 0.2 倍、終わりにかけて元の速さへ */
    slowCool = Math.max(0, slowCool - realDt);
    var scale = 1;
    if (slow > 0) { slow = Math.max(0, slow - realDt); var u = slow / SLOW_TIME; scale = 0.2 + 0.8 * (1 - Math.min(1, u * 1.6)); }
    var dt = realDt * scale;
    shake = Math.max(0, shake - dt * 1.5);
    for (var ri = rings.length - 1; ri >= 0; ri--) { rings[ri].t += realDt; if (rings[ri].t > 0.35) rings.splice(ri, 1); }
    for (var si = streaks.length - 1; si >= 0; si--) { streaks[si].t += realDt; if (streaks[si].t > 0.35) streaks.splice(si, 1); }
    rage = Math.max(0, rage - dt * 0.6);
    for (var i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.9) pops.splice(i, 1); }
    if (state === S.PLAY) {
      T += dt;
    }
    var on = state === S.PLAY;
    if (on && (tap || swipe)) cry();
    var ev = phys.step(dt, { rage: on ? rage : 0, tap: on && tap, swipe: on ? swipe : null }, Math.random);
    swipe = null;
    if (tap && on) { noiseHit(0.06, 300, 0.12 + rage * 0.15, 1); if (rage > 0.85) shake = Math.max(shake, 0.05); }
    tap = false;
    if (phys.shook) {
      if (on && phys.shook > 2.2 && slowCool <= 0) {
        slow = SLOW_TIME; slowCool = SLOW_TIME + 1.2; shake = 0.12;
        slowFx();
      }
      phys.shook = 0;
    }
    ev.forEach(function (e) {
      if (e.kind === "break" && state === S.PLAY) {
        score += e.toy.d.price; broken++;
        pops.push({ t: 0, p: e.toy.d.price, b: e.toy.body });
        shake = Math.min(0.12, shake + 0.03);
        var s3b = scene3d(); if (s3b) s3b.burst(e.toy);
      }
      crash(e.toy.d.kind, e.v || 2);
    });
    if (state === S.PLAY && T >= TIME) finish();
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    held = true;
    if (x != null) press = { x0: x, y0: y, pts: [{ x: x, y: y, t: performance.now() }], fired: false };
    else act(null);
  }
  /* タップで跳ねる、スワイプでその向きへ飛ぶ。どちらも激しさ rage が上がる */
  function act(sw) {
    rage = Math.min(1, rage + 0.11);
    if (sw) swipe = sw; else tap = true;
  }
  var SWIPE_GO = 46, SWIPE_MIN = 300, SWIPE_MAX = 2200;
  function swipeOf(P) {
    var a = P[0], b = P[P.length - 1];
    var dt = Math.max(16, b.t - a.t) / 1000, vx = b.x - a.x, vy = b.y - a.y, l = Math.sqrt(vx * vx + vy * vy);
    if (l < 1) return null;
    return { dx: vx / l, dz: vy / l, p: Math.max(0.15, Math.min(1, (l / dt - SWIPE_MIN) / (SWIPE_MAX - SWIPE_MIN))) };
  }
  function move(x, y) {
    if (state !== S.PLAY || !held || !press || press.fired) return;
    var now = performance.now();
    press.pts.push({ x: x, y: y, t: now });
    while (press.pts.length > 2 && now - press.pts[1].t > 100) press.pts.shift();
    /* ある程度なぞったら、離すのを待たずにその場で飛ぶ（1回押すごとに1回） */
    if (Math.hypot(x - press.x0, y - press.y0) > SWIPE_GO) {
      var sw = swipeOf(press.pts);
      if (sw) { press.fired = true; act(sw); streaks.push({ x0: press.x0, y0: press.y0, x1: x, y1: y, t: 0 }); }
    }
  }
  function up() {
    if (held && state === S.PLAY && press && !press.fired) {
      var l = press.pts[press.pts.length - 1];
      if (Math.hypot(l.x - press.x0, l.y - press.y0) < 20) { act(null); rings.push({ x: press.x0, y: press.y0, t: 0 }); }
      else { var sw = swipeOf(press.pts); if (sw) act(sw); }
    }
    held = false; press = null;
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); keyDir = { l: 0, r: 0, u: 0, d: 0 }; });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* 1=始め 2=残り3秒 3=結果 */
  function debugKey(n) {
    audioOn();
    if (n === 1) newRound();
    else if (n === 2) { if (state !== S.PLAY) newRound(); T = TIME - 3; }
    else if (n === 3) { if (state !== S.PLAY) newRound(); finish(); }
  }

  var DIRKEYS = { ArrowLeft: "l", a: "l", A: "l", ArrowRight: "r", d: "r", D: "r", ArrowUp: "u", w: "u", W: "u", ArrowDown: "d", s: "d", S: "d" };
  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    var dir = DIRKEYS[e.key];
    if (!esc && !go && !dir) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state !== S.INTRO) newRound(); return; }
    if (dir) {
      keyDir[dir] = 1;
      if (!e.repeat && state === S.PLAY) {
        var kx = keyDir.r - keyDir.l, kz = keyDir.d - keyDir.u, kl = Math.sqrt(kx * kx + kz * kz) || 1;
        act({ dx: kx / kl, dz: kz / kl, p: 0.7 });
      }
      return;
    }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    var dir = DIRKEYS[e.key];
    if (dir) keyDir[dir] = 0;
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function yen(n) { return "¥" + n.toLocaleString("ja-JP"); }
  function doShare() {
    var n = score.toLocaleString("ja-JP");
    window.zResultActions.x({ text: zT(
      "おもちゃ屋で駄々をこねて" + n + "円ぶん壊しました",
      "I threw a tantrum in a toy store and wrecked ¥" + n + " worth of toys",
      "장난감 가게에서 떼를 써서 " + n + "엔어치 부쉈습니다",
      "在玩具店撒泼打滚，砸坏了" + n + "日元的玩具",
      "在玩具店撒潑打滾，砸壞了" + n + "日圓的玩具"
    ) + zT(" #エクストリーム駄々", " #ExtremeTantrum", " #익스트림떼쓰기", " #极限撒泼", " #極限撒潑") });
  }

  /* ============ 描画 ============ */
  var scene3d = window.Z3 ? window.Z3.lazy(function () { return new window.GameScene(phys); }) : function () { return null; };
  var camChoice = null;                         /* カメラ案の撮り比べ用 */

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[1], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);
    var s3 = scene3d(), drew = false;
    if (s3) { try { s3.sync({ dt: 1 / 60, shake: shake, snap: snap, cam: camChoice, zoom: thumbZoom || (slow > 0 ? 0.68 : 1) }); snap = false; drew = s3.draw(ctx, W, H); } catch (e) { scene3d.drop(); } }
    if (!drew) { ctx.fillStyle = "#f3efe6"; ctx.fillRect(0, 0, W, H); }
    if (hideUI) return;

    /* 壊したときの値段（おもちゃの上に浮かぶ） */
    if (s3 && pops.length) {
      var cam = s3.camera, v = new window.THREE.Vector3();
      ctx.save(); ctx.textAlign = "center"; ctx.font = "800 26px sans-serif"; ctx.lineWidth = 5; ctx.lineJoin = "round";
      pops.forEach(function (p) {
        v.set(p.b.position.x, p.b.position.y + 0.2, p.b.position.z).project(cam);
        var x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H - p.t * 50;
        ctx.globalAlpha = Math.min(1, (0.9 - p.t) * 3);
        ctx.strokeStyle = "#fff"; ctx.strokeText(yen(p.p), x, y);
        ctx.fillStyle = "#e0262a"; ctx.fillText(yen(p.p), x, y);
      });
      ctx.restore();
    }
    if (state === S.PLAY) {
      /* 合計と残り時間 */
      ctx.save();
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.font = "900 52px sans-serif"; ctx.lineWidth = 8; ctx.lineJoin = "round";
      ctx.strokeStyle = "#fff"; ctx.strokeText(yen(score), W / 2, 34);
      ctx.fillStyle = "#16202e"; ctx.fillText(yen(score), W / 2, 34);
      var k = Math.max(0, 1 - T / TIME);
      ctx.fillStyle = "rgba(22,32,46,.25)"; ctx.fillRect(W / 2 - 150, 100, 300, 10);
      ctx.fillStyle = k < 0.2 ? "#e0262a" : "#16202e"; ctx.fillRect(W / 2 - 150, 100, 300 * k, 10);
      ctx.restore();
      streaks.forEach(function (r) {
        var k = r.t / 0.35;
        ctx.strokeStyle = "rgba(255,255,255," + (1 - k) * 0.9 + ")"; ctx.lineWidth = 14 * (1 - k) + 2; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(r.x0, r.y0); ctx.lineTo(r.x1, r.y1); ctx.stroke();
      });
      rings.forEach(function (r) {
        var k = r.t / 0.35;
        ctx.strokeStyle = "rgba(255,255,255," + (1 - k) * 0.9 + ")"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(r.x, r.y, 16 + k * 40, 0, 7); ctx.stroke();
      });
    }
    if (state === S.RESULT) drawResult();
  }

  function resultButtons() { return window.zResultActions.row(W, H * 0.62); }
  function hitButton(x, y) { return window.zResultActions.hit(resultButtons(), x, y); }
  function drawResult() {
    ctx.fillStyle = "rgba(10,8,6,.66)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 10;
    ctx.textAlign = "center";
    var txt = yen(score), fs = 108;
    ctx.font = "800 " + fs + "px sans-serif";
    while (fs > 40 && ctx.measureText(txt).width > W - 40) { fs -= 4; ctx.font = "800 " + fs + "px sans-serif"; }
    ctx.fillText(txt, W / 2, H * 0.45);
    ctx.restore();
    window.zResultActions.drawButtons(ctx, resultButtons());
    window.zResultActions.follow.draw(ctx, window.zResultActions.follow.box(ctx, resultButtons(), W));
  }

  var hideUI = false, thumbZoom = 0;
  window.__probe = {
    now: function () { return { state: state, score: score, broken: broken, T: T, W: W, H: H, kid: phys.center(), buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { hideUI = true; },
    cam: function (c) { camChoice = c; snap = true; },
    tapAt: function (x, y) { down(x, y); up(); },
    swipe: function (dx, dz, p) { act({ dx: dx, dz: dz, p: p }); }
  };

  /* サムネ撮影用（thumb.js）。おもちゃを散らかした場面で止めて、文字やボタンを消す */
  window.__thumbnail = async function () {
    window.__recordManual = true;
    startButton.hidden = true;
    for (var w = 0; w < 40 && !scene3d(); w++) await new Promise(function (r) { setTimeout(r, 250); });
    newRound();
    for (var i = 0; i < 20; i++) update(1 / 60);
    for (var j = 0; j < 75; j++) { if (j % 15 === 0) act({ dx: -0.5, dz: -0.85, p: 1 }); update(1 / 60); }
    hideUI = true; slow = 0; snap = true; thumbZoom = 0.55;
    var s3t = scene3d(); if (s3t) s3t.zoom = thumbZoom;
    draw(); draw();
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 40)) throw Error("結果が出ない");
      await r.wait(1500);
    }
  };

  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  state = S.INTRO; score = 0; broken = 0; T = 0; held = false;
  startButton.hidden = false;
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
