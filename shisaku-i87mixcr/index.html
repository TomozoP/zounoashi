<script>
/* 無限マシマシ

   揺れるトングからヤサイを落として、どんぶりの上に積む。
   ずれた分はこぼれて、次からの山が細くなる。ぴったりなら細らない。
   外れたら終わり。積んだ高さ（cm）が結果。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    /* 開始前に画面の大きさが変わったら（開いた直後は0のことがある）、カメラを置き直す */
    if ((!state || state === S.INTRO) && isFinite(H) && H > 0) camY = H * 0.1;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q, delay) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime + (delay || 0);
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random()); s.stop(n + dur + 0.05);
  }
  /* 完成のファンファーレ（自作の短い節）：ソドミソ↑ド、最後は和音で伸ばす */
  function fanfare() {
    if (!AC) return;
    var notes = [[392, 0, 0.12], [523, 0.12, 0.12], [659, 0.24, 0.12], [784, 0.36, 0.22], [659, 0.6, 0.1], [784, 0.72, 0.1], [1047, 0.84, 0.9]];
    notes.forEach(function (q) {
      tone(q[0], q[2], 0.07, "square", null, q[1]);
      tone(q[0] * 1.004, q[2], 0.05, "sawtooth", null, q[1]);
    });
    [523, 659, 784].forEach(function (f) { tone(f, 0.9, 0.035, "triangle", null, 0.84); });
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 数字 ============ */
  var LAYER = 36;              /* 一段の高さ（世界の座標） */
  var PX_CM = 7.2;             /* 1cm あたり */
  var BASE_W = 360;            /* 最初に乗っているヤサイの幅 */
  var SWING = 205;             /* トングが揺れる幅（中心から） */
  var HAND_UP = 230;           /* 山の上からトングまで */
  var PERFECT = 7;             /* これ以内のずれはぴったり扱い */
  var MIN_W = 45;              /* 山がこれより細くなったら終わり */
  var CEIL = 1800;             /* 店の天井 */
  var ANCHOR = 0.62;           /* 画面のこの高さに山の上が来る */
  /* 終わってからの流れ（秒）: てっぺんにアブラ → カメラを引きながらどんぶりにチャーシュー → 手前の下の段へドンと置く → 結果 */
  var ZOOM_T0 = 0.4, ZOOM_T1 = 1.15, CHASHU_T0 = 0, CHASHU_T1 = 0.65, PLACE_T0 = 1.25, PLACE_T1 = 1.6, RESULT_T = 2.0;

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, keyMode = false;
  var layers, handX, handDir, falling, spills, combo, ending, endT;
  var camY, zoom, endFrom, shake, flash;

  /* 0段目は見えない土台（スープの面）。1段目からがのせたもやし */
  function topY() { return (layers.length - 1) * LAYER; }
  function top() { return layers[layers.length - 1]; }
  function cm() { return Math.round((layers.length - 1) * LAYER / PX_CM); }
  function speed() { return Math.min(1100, 480 + 16 * (layers.length - 1)); }   /* 高くなるほど速い */

  /* 立体の場面。three.js が使えないときは平面の絵のまま */
  /* 開いた直後は画面の大きさが0だったり、立体の描画の準備が間に合わなかったりする。
     1回の失敗で平面に切り替えず、しばらく作り直し・描き直しを試す */
  var scene3d = null, uid = 0, tries3d = 0, fails3d = 0, lastTry3d = -1e9;
  function make3d() {
    if (scene3d || tries3d >= 20 || !window.THREE || !window.RamenScene) return;
    var now = performance.now();
    if (now - lastTry3d < 500) return;
    lastTry3d = now; tries3d++;
    try { scene3d = new window.RamenScene(); } catch (e) { scene3d = null; }
  }
  make3d();

  var seed = 1;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; T = 0;
    seed = 7;
    layers = [];
    addLayer(0, BASE_W, 0);
    handX = 0; handDir = Math.random() < 0.5 ? -1 : 1;
    falling = null; spills = []; combo = 0;
    ending = false; endT = 0; endFrom = null;
    zoom = 1; camY = H * 0.1; shake = 0; flash = 0;
    if (scene3d) { try { scene3d.reset(); } catch (e) { scene3d = null; } }
  }

  /* ============ ヤサイの山（一段ずつ絵にしておく） ============ */
  var KINDS = ["yasai", "yasai", "kyabetsu", "yasai", "ninniku", "yasai", "abura", "yasai", "kyabetsu", "abura", "yasai", "ninniku"];
  function addLayer(x, w, i) {
    var kind = i === 0 ? "yasai" : KINDS[i % KINDS.length];
    var L = { x: x, w: w, kind: kind, img: scene3d ? null : makeClump(w, kind, i), pop: i ? 1 : 0 };
    layers.push(L);
    return L;
  }
  function makeClump(w, kind, salt) {
    var R = 2, pad = 16, dome = 46, below = 14;
    var cw = Math.ceil(w + pad * 2), ch = dome + below + pad;
    var c = document.createElement("canvas");
    c.width = cw * R; c.height = ch * R;
    var g = c.getContext("2d");
    if (!g) return { c: c, ox: cw / 2, oy: dome + pad / 2, w: cw, h: ch };
    g.scale(R, R);
    var ox = cw / 2, oy = dome + pad / 2;   /* oy が段の底 */
    var keep = seed; seed = 1000 + salt * 97 + Math.round(w);
    function hgt(dx) { var t = dx / (w / 2); return t >= 1 ? 0 : dome * Math.sqrt(1 - t * t) * (0.82 + 0.18 * Math.cos(dx * 0.05 + salt)); }
    /* 下地 */
    g.fillStyle = "#d9cf9e";
    g.beginPath();
    g.moveTo(ox - w / 2, oy + below);
    for (var dx = -w / 2; dx <= w / 2; dx += 4) g.lineTo(ox + dx, oy - hgt(dx) * 0.8);
    g.lineTo(ox + w / 2, oy + below);
    g.closePath(); g.fill();
    /* もやし */
    var n = Math.round(w * 0.9);
    g.lineCap = "round";
    for (var k = 0; k < n; k++) {
      var px = (rnd() * 2 - 1) * w / 2 * 0.98;
      var py = oy + below * 0.6 - rnd() * (hgt(px) + below * 0.6);
      var a = rnd() * Math.PI, len = 12 + rnd() * 12;
      var x1 = ox + px - Math.cos(a) * len / 2, y1 = py - Math.sin(a) * len / 2 * 0.6;
      var x2 = ox + px + Math.cos(a) * len / 2, y2 = py + Math.sin(a) * len / 2 * 0.6;
      g.strokeStyle = "rgba(120,100,50,.35)"; g.lineWidth = 4.2;
      g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(ox + px, py - 4, x2, y2); g.stroke();
      g.strokeStyle = rnd() < 0.5 ? "#fbf7e6" : "#efe8c6"; g.lineWidth = 2.6;
      g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(ox + px, py - 4, x2, y2); g.stroke();
      if (rnd() < 0.35) { g.fillStyle = "#e8d36a"; g.beginPath(); g.arc(x1, y1, 2.2, 0, 7); g.fill(); }
    }
    /* キャベツ */
    var cab = kind === "kyabetsu" ? Math.round(w / 22) : Math.round(w / 70);
    for (k = 0; k < cab; k++) {
      px = (rnd() * 2 - 1) * w / 2 * 0.8;
      py = oy - rnd() * hgt(px) * 0.9;
      g.fillStyle = rnd() < 0.5 ? "#9cc25a" : "#c4dc84";
      g.beginPath();
      g.ellipse(ox + px, py, 7 + rnd() * 6, 4 + rnd() * 3, rnd() * 3, 0, 7);
      g.fill();
    }
    /* ニンニク */
    if (kind === "ninniku") {
      for (k = 0; k < Math.max(6, w / 9); k++) {
        px = (rnd() * 2 - 1) * Math.min(w / 2, 40);
        py = oy - hgt(px) - 2 + rnd() * 8;
        g.fillStyle = rnd() < 0.5 ? "#f2e6a4" : "#e6d27e";
        g.fillRect(ox + px - 2.5, py - 2.5, 5, 5);
      }
    }
    /* アブラとカラメ */
    if (kind === "abura") {
      for (k = 0; k < Math.max(5, w / 14); k++) {
        px = (rnd() * 2 - 1) * Math.min(w / 2 * 0.8, 70);
        py = oy - hgt(px) + rnd() * 6;
        g.fillStyle = "rgba(150,90,40,.55)";
        g.beginPath(); g.ellipse(ox + px, py + 6, 9, 5, 0, 0, 7); g.fill();
        g.fillStyle = rnd() < 0.5 ? "#fff6e4" : "#f3dfb8";
        g.fillRect(ox + px - 5, py - 5, 10, 8);
        g.fillStyle = "rgba(255,255,255,.8)";
        g.fillRect(ox + px - 4, py - 4, 4, 2);
      }
    }
    seed = keep;
    return { c: c, ox: ox, oy: oy, w: cw, h: ch };
  }

  /* ============ 進行 ============ */
  function update(dt) {
    if (state !== S.PLAY) return;
    T += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 3);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
    for (var i = Math.max(0, layers.length - 3); i < layers.length; i++) if (layers[i].pop > 0) layers[i].pop = Math.max(0, layers[i].pop - dt * 5);

    if (!ending && !falling) {
      handX += handDir * speed() * dt;
      if (handX > SWING) { handX = 2 * SWING - handX; handDir = -1; }
      if (handX < -SWING) { handX = -2 * SWING - handX; handDir = 1; }
    }

    if (falling) {
      falling.vy += 2600 * dt;
      falling.y -= falling.vy * dt;
      if (falling.y <= topY()) land();
    }

    for (i = spills.length - 1; i >= 0; i--) {
      var s = spills[i];
      s.vy += 1600 * dt; s.y -= s.vy * dt; s.x += s.vx * dt; s.r += s.vr * dt;
      if (s.y < -1200 - (ending ? 0 : 0)) spills.splice(i, 1);
    }

    /* カメラ */
    if (!ending) {
      var target = Math.max(H * 0.1, topY());
      camY += (target - camY) * Math.min(1, dt * 6);
    } else {
      var was = endT;
      endT += dt;
      if (was < CHASHU_T1 && endT >= CHASHU_T1) {      /* アブラとチャーシューが同時に乗った */
        noiseHit(0.3, 900, 0.4, 0.6);
        noiseHit(0.2, 2600, 0.15, 1.5, 0.04);
        shake = 0.6;
        noiseHit(0.25, 220, 0.6, 0.8);
        tone(140, 0.25, 0.18, "sine", 70);
      }
      if (was < PLACE_T1 && endT >= PLACE_T1) {        /* 下の段に置いた */
        shake = 1;
        noiseHit(0.35, 160, 0.8, 0.7);
        tone(90, 0.35, 0.25, "sine", 45);
        fanfare();
      }
      if (endT > ZOOM_T0) {
        if (!endFrom) {
          var z = Math.min(1, H * 0.78 / (topY() + 520));   /* 画面のタテいっぱいに（下の段に置いたあとまで） */
          endFrom = { z0: zoom, c0: camY, z1: z, c1: H * 0.24 / z - 430 };
        }
        var t = Math.min(1, (endT - ZOOM_T0) / (ZOOM_T1 - ZOOM_T0));
        var e = t * t * (3 - 2 * t);
        zoom = endFrom.z0 + (endFrom.z1 - endFrom.z0) * e;
        camY = endFrom.c0 + (endFrom.c1 - endFrom.c0) * e;
      }
      if (endT > RESULT_T) { state = S.RESULT; shareButton.hidden = false; }
    }
  }

  function drop() {
    if (ending || falling) return;
    var L = top();
    falling = { id: ++uid, x: handX, w: L.w, y: topY() + HAND_UP, vy: 0, kind: KINDS[layers.length % KINDS.length] };
    if (!scene3d) falling.img = makeClump(L.w, falling.kind, layers.length);
    tone(300, 0.1, 0.05, "triangle", 160);
    /* 最後の1つと決まったら、落とした時点でアブラとチャーシューも落とし始める */
    var f = falling;
    if (Math.min(f.x + f.w / 2, L.x + L.w / 2) - Math.max(f.x - f.w / 2, L.x - L.w / 2) < MIN_W) {
      ending = true; endT = 0; score = cm();
    }
  }

  function land() {
    var f = falling, L = top();
    falling = null;
    var lo = Math.max(f.x - f.w / 2, L.x - L.w / 2);
    var hi = Math.min(f.x + f.w / 2, L.x + L.w / 2);
    if (hi - lo < MIN_W) {               /* 外れ、または細くなりすぎたら終わり */
      /* 外れ */
      if (!ending) { ending = true; endT = 0; score = cm(); }
      shake = 1;
      noiseHit(0.5, 260, 0.5, 0.7);
      tone(330, 0.5, 0.12, "sawtooth", 90, 0.05);
      return;
    }
    var dx = f.x - L.x;
    var x, w;
    if (Math.abs(dx) <= PERFECT) {
      combo++;
      x = L.x; w = Math.min(BASE_W, L.w + (combo >= 3 ? 8 : 0));
      flash = 1;
      tone(520 + Math.min(combo, 12) * 60, 0.12, 0.1, "square");
      tone(780 + Math.min(combo, 12) * 90, 0.15, 0.06, "sine", null, 0.06);
    } else {
      combo = 0;
      x = (lo + hi) / 2; w = hi - lo;
      /* はみ出した分は落とさず、そのまま消える（積もるだけ） */
    }
    noiseHit(0.18, 700, 0.35, 0.8);
    noiseHit(0.12, 2400, 0.12, 1.2, 0.03);
    var N = addLayer(x, w, layers.length);
    N.kind = f.kind;
    score = cm();
    shake = Math.max(shake, 0.25);
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      return;
    }
    drop();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    if (state !== S.PLAY || ending) return;
    if (n === 1 || n === 3) {         /* 1: 30段 3: 300段 ぴったり積む */
      for (var i = 0; i < (n === 1 ? 30 : 300); i++) { var L = top(); addLayer(L.x, L.w, layers.length); }
      score = cm();
    } else if (n === 2) {             /* 2: 外して終わる */
      falling = null; handX = top().x + top().w + 40; drop(); falling.y = topY() + 1;
    }
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if ((e.code === "Space" || e.key === " " || e.key === "Enter") && state === S.INTRO) startButton.click();
  });

  /* シェアは「ヤサイマシマシ…… #無限マシマシ」。長すぎるときは「マシ」の切れ目で「…」にする */
  var SHARE_MAX = 100;
  function doShare() {
    var t = callText();
    if (t.length > SHARE_MAX) t = t.slice(0, SHARE_MAX - ((SHARE_MAX - 3) % 2)) + "…";
    window.zResultActions.x({ text: t + zT(" #無限マシマシ", " #InfiniteMashiMashi") });
  }

  /* ============ 描画 ============ */
  function sy(yw) { return H * ANCHOR - (yw - camY) * zoom; }
  function sx(xw) { return W / 2 + xw * zoom; }
  function wy(screenY) { return camY + (H * ANCHOR - screenY) / zoom; }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);

        for (gx = -2; gx < 2; gx++) {

      for (var ty = Math.ceil(Math.max(yBot, -200) / 60) * 60; ty < Math.min(yTop, CEIL); ty += 60) {
        var Y2 = sy(ty);
        ctx.beginPath(); ctx.moveTo(0, Y2); ctx.lineTo(W, Y2); ctx.stroke();

      /* 壁の黄色い帯 */
      ctx.fillStyle = "#f2c230";
      var bandY = sy(560);
      ctx.fillRect(0, bandY, W, 70 * zoom);
      ctx.fillStyle = "#c79a14";
      ctx.fillRect(0, bandY + 70 * zoom, W, 6 * zoom);

      drawCeiling();
    }
  }

  function drawCeiling() {
    var y0 = sy(CEIL + 60), y1 = sy(CEIL);
    var broken = topY() > CEIL - 20;
    var hole = broken ? holeRange() : null;
    ctx.fillStyle = "#5a3c22";

      ctx.lineTo(0, y1); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W, y0); ctx.lineTo(sx(hole[1]), y0);
      for (k = 0; k <= 6; k++) ctx.lineTo(sx(hole[1]) + (k % 2 ? -10 : 6) * zoom, y0 + (y1 - y0) * k / 6);
      ctx.lineTo(W, y1); ctx.closePath(); ctx.fill();
    }
    /* 照明 */
    [-170, 170].forEach(function (lx) {
      if (hole && lx > hole[0] - 20 && lx < hole[1] + 20) return;
      ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx(lx), y1); ctx.lineTo(sx(lx), sy(CEIL - 120)); ctx.stroke();
      ctx.fillStyle = "#c0392b";
      ctx.beginPath();
      ctx.moveTo(sx(lx - 34), sy(CEIL - 160)); ctx.lineTo(sx(lx + 34), sy(CEIL - 160));

  function holeRange() {

  function drawCounter() {

    ctx.fillStyle = "#8e1410";

    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(0, y, W, 4 * zoom);
  }

  function drawBowlBack() {
    var cy = sy(14), rx = 190 * zoom, ry = 44 * zoom;
    /* スープ */
    ctx.fillStyle = "#5b3216";
    ctx.beginPath(); ctx.ellipse(sx(0), cy, rx, ry, 0, 0, 7); ctx.fill();

      ctx.quadraticCurveTo(sx(bx + s * 20), cy, sx(bx - s * 6), cy + 26 * zoom);
      ctx.stroke();
    }
  }
  /* 最初から左手前に乗っている刻みニンニク（平面の絵のとき） */
  function drawGarlic() {
    for (var k = 0; k < 40; k++) {
      var a = k * 2.4, u = Math.sqrt((k % 10) / 10);
      ctx.fillStyle = k % 3 ? "#f0dc8c" : "#e2c766";
      ctx.fillRect(sx(-120 + Math.cos(a) * u * 45) - 4 * zoom, sy(20 + (1 - u * u) * 30) - Math.sin(a) * u * 10 * zoom, 8 * zoom, 7 * zoom);
    }
  }
  /* 終わりの演出（平面の絵のとき）: てっぺんにアブラ、引いたあとどんぶりの右にチャーシュー */
  function drawChashu() {
    if (!ending) return;
    if (endT <= CHASHU_T0) return;
    var t = Math.min(1, (endT - CHASHU_T0) / (CHASHU_T1 - CHASHU_T0)), L = top();
    var yb = topY() + (1 - t * t) * 350;
    for (var k = 0; k < 9; k++) {
      ctx.fillStyle = k % 3 ? "#fff3dc" : "#f0dcb6";
      ctx.fillRect(sx(L.x + (k - 4) * 9 - 6), sy(yb + 30 + (4 - Math.abs(k - 4)) * 5), 12 * zoom, 10 * zoom);
    }
    if (endT <= CHASHU_T0) return;

  }

    ctx.textBaseline = "top";

    ctx.restore();
  }

    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { threeD: !!scene3d, state: state, score: score, layers: layers.length, w: top().w, handX: handX, falling: !!falling, ending: ending, W: W, H: H }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); }
  };

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      for (var i = 0; i < 8; i++) {
        await r.until(function () { return Math.abs(handX - top().x) < 12 && !falling; }, 5);
        r.key();
        await r.wait(400);
      }
      await r.wait(600);
      r.key();
      await r.until(function () { return state === S.RESULT; }, 15);
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById("start");
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ["pointerdown", "pointerup"].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener("click", function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  layout();
  newRound(); state = S.INTRO; startButton.hidden = false;
