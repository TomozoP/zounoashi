<script>
/* ダメージジーンズメーカー

   書き換えるところの目印は3つ。
     ▼UPDATE … 進行と入力
     ▼DRAW   … 絵
     ▼SHARE  … シェアの文
   用意ずみ: タテ画面の座標・入力(タップ/スペース/Esc)・結果画面・シェア・音・覗き穴。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var saveButton = document.getElementById("save-button");
  /* スマホは共有シート（写真に保存できる）、PCはファイルで保存。UIを除いた立体の絵だけ */
  /* Claude の確認用ページの中ではファイルを直接落とせないので、ページの保存の仕組みを使う */
  var pageSaver = null;
  if (window.claude && window.claude.use) window.claude.use("downloads").then(function (d) { pageSaver = d; }, function () {});
  /* 保存する画像の名前: ダメージジーンズ_YYYYMMDD-HHMMSS.png */
  function fileName() {
    var d = new Date();
    function p2(n) { return (n < 10 ? "0" : "") + n; }
    return zT("ダメージジーンズ", "DamagedJeans") + "_" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + ".png";
  }
  window.zResultActions.bind(saveButton, function () {
    if (!scene3d) return;
    var cv = scene3d.renderer.domElement, name = fileName();
    if (pageSaver) { cv.toBlob(function (b) { if (b) pageSaver.save({ filename: name, data: b }).catch(function () {}); }, "image/png"); return; }
    window.zResultActions.saveImage({ canvas: cv, name: name });
  });

  /* ============ 画面 ============
     タテ画面。横幅は540で固定、高さは開いた画面の形に合わせて伸び縮みする。 */
  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ 最初の操作より後でしか鳴らせない */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n, Math.random() * 1.5); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ こする音 ============ 動かしている間だけ。カッターは「ザッ」、やすりは「シャシャ」 */
  var rubS = null;
  function rubOn() {
    if (!AC || !NOISE || rubS) return;
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = tool === "cut" ? 2600 : 4200; f.Q.value = tool === "cut" ? 1.6 : 0.7;
    var g = AC.createGain(); g.gain.value = 0.0001;
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start();
    rubS = { s: s, f: f, g: g };
  }
  function rubLevel(v) {
    if (!rubS) return;
    var n = AC.currentTime;
    rubS.g.gain.setTargetAtTime(0.0001 + (tool === "cut" ? 0.3 : 0.16) * v, n, 0.02);
    if (tool === "cut") rubS.f.frequency.setTargetAtTime(1800 + 1600 * Math.random(), n, 0.01);
  }
  function rubOff() {
    if (!rubS) return;
    var q = rubS; rubS = null;
    q.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.03);
    setTimeout(function () { try { q.s.stop(); } catch (e) {} }, 300);
  }

  /* ============ ランウェイの曲（自作） ============
     124BPMの四つ打ち。キック・裏のハイハット・クラップ・低いベース・暗い和音。幕が上がるあいだは上がっていくノイズ */
  var music = null;
  function mNoise(m, t, dur, type, freq, vol, q) {
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(m.out);
    s.start(t, Math.random()); s.stop(t + dur + 0.02);
  }
  function mTone(m, t, freq, dur, vol, type, cutoff) {
    var o = AC.createOscillator(); o.type = type; o.frequency.value = freq;
    var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(cutoff, t); f.frequency.exponentialRampToValueAtTime(Math.max(80, cutoff * 0.25), t + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(m.out);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function mKick(m, t) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.22);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(m.out); o.start(t); o.stop(t + 0.35);
  }
  var BASS = [55, 0, 55, 110, 0, 55, 98, 0, 55, 0, 55, 110, 65.4, 0, 49, 0];
  var CHORDS = [[220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [146.8, 174.6, 220, 261.6], [164.8, 196, 246.9, 293.7]];
  function musicStart() {
    if (!AC || !NOISE || music) return;
    var out = AC.createGain(); out.gain.value = 0.55; out.connect(AC.destination);
    var t0 = AC.currentTime + 0.05;
    music = { out: out, next: t0 + 2.3, step: 0 };
    /* 幕のあいだ: 上がっていくノイズと低い持続音 */
    var s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(6000, t0 + 2.25);
    var g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 2.1); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.35);
    s.connect(f); f.connect(g); g.connect(out); s.start(t0); s.stop(t0 + 2.4);
    mTone(music, t0, 55, 2.3, 0.18, "sawtooth", 400);
  }
  function musicTick() {
    if (!music) return;
    var st = 60 / 124 / 4;
    if (music.next < AC.currentTime - 0.1) music.next = AC.currentTime + 0.02;
    while (music.next < AC.currentTime + 0.15) {
      var t = music.next, i = music.step % 16, bar = Math.floor(music.step / 16) % 4;
      if (i % 4 === 0) mKick(music, t);
      if (i % 4 === 2) mNoise(music, t, 0.05, "highpass", 8000, 0.22);
      else if (i % 2 === 1) mNoise(music, t, 0.025, "highpass", 9000, 0.06);
      if (i === 4 || i === 12) { mNoise(music, t, 0.12, "bandpass", 1500, 0.35, 1.5); mNoise(music, t + 0.012, 0.1, "bandpass", 1700, 0.25, 1.5); }
      if (BASS[i]) mTone(music, t, BASS[i] * (bar === 3 ? 1.1225 : 1), st * 1.6, 0.32, "sawtooth", 700);
      if (i === 0 || i === 7 || i === 10) CHORDS[bar].forEach(function (fq) { mTone(music, t, fq, st * 2.4, 0.045, "square", 1800); });
      music.next += st; music.step++;
    }
  }
  function musicStop() {
    if (!music) return;
    var o = music.out; music = null;
    o.gain.setTargetAtTime(0.0001, AC.currentTime, 0.08);
    setTimeout(function () { try { o.disconnect(); } catch (e) {} }, 800);
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", PLAY: "play", RESULT: "result" };
  var state, score, T, held, look = 0;
  var tool = "cut";
  /* ワッペンにする画像。選ぶと道具がワッペンになり、タップした所に縫い付ける */
  var patchImg = null, patchFile = document.getElementById("patch-file");
  patchFile.addEventListener("change", function () {
    var f = patchFile.files && patchFile.files[0];
    if (!f) return;
    var im = new Image();
    im.onload = function () { patchImg = im; tool = "patch"; tone(660, 0.08, 0.06, "triangle"); };
    im.src = URL.createObjectURL(f);
    patchFile.value = "";
  });
  var lastXY = null, lastPick = null, lastMoveT = 0, snapT = 0, snipPath = null, snipScreen = null;
  var orbit = { yaw: 0, tilt: 0, vy: 0, vt: 0 }, spin = null;   /* 完成後にドラッグで回して眺める */

  function newRound() {
    shareButton.hidden = true; saveButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.PLAY;
    score = 0; T = 0; held = false; look = 0;
    lastXY = null; lastPick = null; snipPath = null; snipScreen = null;
    musicStop();
    orbit = { yaw: 0, tilt: 0, vy: 0, vt: 0 }; spin = null;
    if (scene3d) scene3d.newJeans(1 + Math.floor(Math.random() * 2147483000));
  }

  /* 立体の絵。作れないとき（WebGLなし）は何も描けない */
  var scene3d = null, tries3d = 0;
  function make3d() {
    if (scene3d || tries3d >= 5 || !window.THREE || !window.JeansScene) return;
    tries3d++;
    try { scene3d = new window.JeansScene(); scene3d.newJeans(1 + Math.floor(Math.random() * 2147483000)); } catch (e) { scene3d = null; }
  }

  /* ============ 進行 ============ ▼UPDATE */
  function update(dt) {
    T += dt;
    if (scene3d) scene3d.tick(dt);
    if (AC) musicTick();
    if (state === S.RESULT) {
      look = Math.min(1, look + dt * 0.8);
      if (!spin) {
        orbit.yaw += orbit.vy * dt; orbit.tilt += orbit.vt * dt;
        var k = Math.exp(-dt * 3.5); orbit.vy *= k; orbit.vt *= k;
      }
      orbit.tilt = Math.max(-0.9, Math.min(0.35, orbit.tilt));
    }
    if (state === S.PLAY && held && T - lastMoveT > 0.06) rubLevel(0);
  }

  /* ============ 入力 ============ カッターでなぞると切れ、やすりでこすると色が落ちる */
  function screenPick(x, y) { return scene3d ? scene3d.pick(x / W, y / H) : null; }
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      var hit = x == null ? "retry" : hitButton(x, y);
      if (hit === "retry") newRound();
      else if (!hit && x != null) { spin = { x: x, y: y, t: T }; orbit.vy = orbit.vt = 0; }
      return;
    }
    if (x == null) return;
    if (hitOk(x, y)) { finish(); return; }
    if (hitReset(x, y)) { newRound(); tone(330, 0.15, 0.08, "triangle", 520); return; }
    var tb = hitTool(x, y);
    if (tb === "patch") { if (patchImg && tool !== "patch") tool = "patch"; else patchFile.click(); return; }
    if (tb) { if (tool !== tb) { tool = tb; tone(tb === "cut" ? 880 : tb === "snip" ? 700 : 520, 0.08, 0.06, "triangle"); } return; }
    held = true;
    lastXY = { x: x, y: y, t: T }; lastMoveT = T;
    lastPick = screenPick(x, y);
    if (tool === "snip") { snipPath = lastPick ? [lastPick] : []; snipScreen = [{ x: x, y: y }]; return; }
    if (tool === "patch") {
      held = false;
      if (patchImg && lastPick && lastPick.on && scene3d.addPatch(patchImg, lastPick.x, lastPick.y)) { tone(220, 0.08, 0.12, "sine", 140); noiseHit(0.06, 1800, 0.1, 2); }
      return;
    }
    rubOn();
    if (tool === "sand" && lastPick && lastPick.on) scene3d.rub(lastPick.x, lastPick.y, 0.05);
  }
  function work(x, y, speed) {
    var p = screenPick(x, y);
    if (tool === "snip") {
      if (p) snipPath.push(p);
      snipScreen.push({ x: x, y: y });
      if (T - snapT > 0.09) { snapT = T; noiseHit(0.05, 2200, 0.08, 4); }   /* チョキチョキ */
      return;
    }
    if (tool === "cut") {
      if (p && lastPick && (p.on || lastPick.on)) {
        var added = scene3d.slash(lastPick.x, lastPick.y, p.x, p.y);
        if (added > 0 && T - snapT > 0.05 + Math.random() * 0.06) {   /* 糸がぷつぷつ切れる */
          snapT = T; noiseHit(0.03, 3000 + Math.random() * 2500, 0.18, 3);
        }
      }
    } else if (p && p.on) {
      /* こする速さに合わせて色が落ちる。歩幅ごとに置く */
      var n = lastPick ? Math.max(1, Math.ceil(Math.hypot(p.x - lastPick.x, p.y - lastPick.y) / 18)) : 1;
      for (var i = 1; i <= n; i++) {
        var q = lastPick ? { x: lastPick.x + (p.x - lastPick.x) * i / n, y: lastPick.y + (p.y - lastPick.y) * i / n } : p;
        scene3d.rub(q.x, q.y, 0.035);
      }
    }
    lastPick = p;
  }
  function move(x, y) {
    if (state === S.RESULT && spin) {
      var dx = x - spin.x, dy = y - spin.y, dts = Math.max(1 / 120, T - spin.t);
      orbit.yaw -= dx * 0.009; orbit.tilt -= dy * 0.006;
      orbit.vy = -dx * 0.009 / dts; orbit.vt = -dy * 0.006 / dts;
      spin = { x: x, y: y, t: T };
      return;
    }
    if (state !== S.PLAY || !held || !scene3d) return;
    var dtm = Math.max(1 / 120, T - lastXY.t);
    var dist = Math.hypot(x - lastXY.x, y - lastXY.y);
    if (dist < 2) return;
    var speed = dist / dtm;
    work(x, y, speed);
    rubLevel(Math.min(1, 0.25 + speed / 1200));
    lastXY = { x: x, y: y, t: T }; lastMoveT = T;
  }
  function up() {
    if (spin) { if (T - spin.t > 0.08) orbit.vy = orbit.vt = 0; spin = null; }
    if (!held) return;
    held = false;
    if (scene3d) scene3d.endSlash();
    if (snipPath && scene3d) {
      var got = scene3d.snip(snipPath);
      tone(1400, 0.05, 0.08, "square", 700); noiseHit(0.08, 3000, 0.15, 2);
      if (got > 0) { noiseHit(0.35, 600, 0.12, 0.7); }
    }
    snipPath = null; snipScreen = null;
    lastPick = null;
    rubOff();
  }
  function finish() {
    if (state !== S.PLAY) return;
    up();
    score = scene3d ? Math.round(scene3d.damage() * 1000) / 10 : 0;
    state = S.RESULT;
    orbit = { yaw: 0, tilt: 0, vy: 0, vt: 0 }; zoom = 1;
    if (scene3d) scene3d.showModel(true);
    musicStart();
  }

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  /* 2本指のピンチで少しだけ寄る・引く（PCはホイール）。そのあいだは切らない */
  var ZMIN = 0.9, ZMAX = 2.2, zoom = 1, touches = {}, pinch = null;
  function fingers() { var a = []; for (var k in touches) a.push(touches[k]); return a; }
  function pinchDist() { var f = fingers(); return Math.hypot(f[0].x - f[1].x, f[0].y - f[1].y); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var p = atCanvas(e);
    touches[e.pointerId] = { x: p.x, y: p.y };
    if (fingers().length === 2 && state !== S.INTRO) { up(); spin = null; pinch = { d0: Math.max(10, pinchDist()), z0: zoom }; return; }
    if (pinch) return;
    down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) {
    var p = atCanvas(e);
    if (touches[e.pointerId]) touches[e.pointerId] = { x: p.x, y: p.y };
    if (pinch) {
      if (fingers().length >= 2) zoom = Math.max(ZMIN, Math.min(ZMAX, pinch.z0 * pinchDist() / pinch.d0));
      return;
    }
    cursor = { x: p.x, y: p.y };
    move(p.x, p.y);
  });
  var cursor = null;
  function release(e) {
    delete touches[e.pointerId];
    if (pinch) { if (!fingers().length) pinch = null; return; }
    up();
  }
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); release(e); });
  wrap.addEventListener("pointercancel", release);
  wrap.addEventListener("pointerleave", function () { cursor = null; });
  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoom = Math.max(ZMIN, Math.min(ZMAX, zoom * Math.exp(-e.deltaY * 0.0012)));
  }, { passive: false });
  window.addEventListener("blur", function () { up(); });

  /* 本番以外（手元・確認用ページ・制作中の固定リンク）だけ、数字キーで場面を飛ばせる。 */
  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  /* ひざと腿に横の切り込み、腿をやすりで色落ち */
  function autoDamage() {
    if (state !== S.PLAY || !scene3d) return;
    [[300, 1400], [724, 1360], [270, 900], [760, 980], [330, 1700]].forEach(function (c, i) {
      for (var k = 0; k < 4; k++) {
        var y = c[1] + k * 26 + (Math.random() - 0.5) * 8, w = 70 + Math.random() * 60;
        scene3d.slash(c[0] - w, y, c[0] + w, y + (Math.random() - 0.5) * 10); scene3d.endSlash();
        if (i < 2 && k === 1) { scene3d.slash(c[0] - w * 0.6, y, c[0] + w * 0.6, y); scene3d.endSlash(); }
      }
    });
    for (var j = 0; j < 30; j++) scene3d.rub(260 + Math.random() * 100, 800 + Math.random() * 300, 0.06);
    for (j = 0; j < 30; j++) scene3d.rub(680 + Math.random() * 100, 800 + Math.random() * 300, 0.06);
  }
  function debugKey(n) {
    if (n === 1) autoDamage();
    if (n === 2) finish();
    if (n === 3) tool = tool === "cut" ? "snip" : tool === "snip" ? "sand" : "cut";
    if (n === 4 && scene3d && state === S.PLAY) scene3d.snip([{ x: 0, y: 1500 }, { x: 1024, y: 1520 }]);
    if (n === 5 && scene3d && state === S.PLAY) scene3d.snip([{ x: 0, y: 330 }, { x: 1024, y: 700 }]);
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (esc) { if (!e.repeat) newRound(); return; }
    if (e.repeat) return;
    if (state === S.PLAY) { finish(); return; }
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); }
  });

  function doShare() {
    /* ▼SHARE */
    window.zResultActions.x({ text: zT("#ダメージジーンズメーカー", "#DamagedJeansMaker") });
  }

  /* ============ 描画 ============ ▼DRAW */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var hideUI = false;
  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[2], W, H, state === S.RESULT && !hideUI);
    window.zResultActions.place(saveButton, resultButtons()[1], W, H, state === S.RESULT && !hideUI);
    make3d();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#2a221c"; ctx.fillRect(0, 0, W, H);
    if (scene3d) { try { orbit.zoom = zoom; scene3d.render(ctx, W, H, look, orbit); } catch (e) {} }
    if (hideUI) return;
    if (state === S.PLAY) {
      drawReset(); drawOk(); drawTools();
      var c = held ? lastXY : cursor;
      if (snipScreen && snipScreen.length > 1) drawSnipPath();
      if (c && !hitOk(c.x, c.y) && !hitReset(c.x, c.y) && !hitTool(c.x, c.y)) { if (tool === "cut") drawCutter(c.x, c.y); else if (tool === "snip") drawScissors(c.x, c.y); else if (tool === "patch") drawPatch(c.x, c.y); else drawSander(c.x, c.y); }
    }
    if (state === S.RESULT) drawResult();
  }

  /* 指先のカッターナイフ。刃先が切っている点 */
  function drawCutter(px, py) {
    ctx.save();
    ctx.translate(px, py); ctx.rotate(-0.7);
    ctx.lineJoin = "round";
    /* 刃 */
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(9, -30); ctx.lineTo(-7, -30); ctx.closePath();
    var gr = ctx.createLinearGradient(-7, 0, 9, 0); gr.addColorStop(0, "#f2f4f6"); gr.addColorStop(1, "#9aa3ab");
    ctx.fillStyle = gr; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#16202e"; ctx.stroke();
    /* 柄 */
    roundRect(-11, -128, 22, 100, 6);
    ctx.fillStyle = "#f4c21c"; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "#16202e"; ctx.fillRect(-3, -110, 6, 26);
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillRect(-8, -124, 4, 90);
    ctx.restore();
  }
  /* ワッペンを置く位置の目安（半透明） */
  function drawPatch(px, py) {
    if (!patchImg) return;
    var iw = patchImg.naturalWidth, ih = patchImg.naturalHeight, k = 84 / Math.max(iw, ih), w = iw * k, h = ih * k;
    ctx.save(); ctx.globalAlpha = 0.6;
    roundRect(px - w / 2, py - h / 2, w, h, Math.min(w, h) * 0.16); ctx.clip();
    ctx.drawImage(patchImg, px - w / 2, py - h / 2, w, h);
    ctx.restore();
  }
  /* ハサミでなぞっている線（離すとその線で切れる） */
  function drawSnipPath() {
    ctx.save();
    ctx.lineCap = ctx.lineJoin = "round";
    ctx.beginPath(); snipScreen.forEach(function (p, i) { if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(22,32,46,.55)"; ctx.stroke();
    ctx.setLineDash([10, 8]); ctx.lineWidth = 2.5; ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.restore();
  }
  /* 指先の裁ちばさみ。刃先が線の上 */
  function drawScissors(px, py) {
    ctx.save();
    ctx.translate(px, py); ctx.rotate(-0.5);
    ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#16202e";
    [-1, 1].forEach(function (s) {
      ctx.save(); ctx.rotate(s * 0.16);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * 7, -58); ctx.lineTo(-s * 2, -58); ctx.closePath();
      ctx.fillStyle = "#d9dde1"; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(s * 6, -82, 13, 19, s * 0.3, 0, Math.PI * 2);
      ctx.lineWidth = 7; ctx.strokeStyle = "#16202e"; ctx.stroke(); ctx.lineWidth = 4.5; ctx.strokeStyle = "#c0392b"; ctx.stroke();
      ctx.lineWidth = 2.5; ctx.strokeStyle = "#16202e";
      ctx.restore();
    });
    ctx.beginPath(); ctx.arc(0, -58, 3.5, 0, Math.PI * 2); ctx.fillStyle = "#16202e"; ctx.fill();
    ctx.restore();
  }
  /* 指先のやすり（当て木に紙やすり） */
  function drawSander(px, py) {
    ctx.save();
    ctx.translate(px, py); ctx.rotate(-0.15);
    roundRect(-46, -14, 92, 20, 4); ctx.fillStyle = "#b7895a"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
    roundRect(-48, 4, 96, 10, 3); ctx.fillStyle = "#c9a26b"; ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(60,40,20,.5)";
    for (var i = 0; i < 26; i++) ctx.fillRect(-44 + (i * 37 % 88), 6 + (i * 13 % 6), 2, 2);
    roundRect(-30, -34, 60, 22, 10); ctx.fillStyle = "#6b4a2e"; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  /* 全リセット（別のジーンズが出る）。左下、アイコンだけ */
  function resetButton() { var b = okButton(); return { x: 16, y: b.y, w: 80, h: b.h }; }
  function hitReset(x, y) { var b = resetButton(); return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
  function iconButton(b, label, on) {
    ctx.save();
    roundRect(b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = on ? "#16202e" : "#fff"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.fillStyle = on ? "#fff" : "#16202e";
    if (window.zActionIcon) window.zActionIcon(ctx, label, b.x + b.w / 2, b.y + b.h / 2 + 1, 30);
    ctx.restore();
  }
  function drawReset() { iconButton(resetButton(), "もう一度", false); }

  /* 道具の切り替え。右下にカッター・ハサミ・やすり・ワッペン（画像を選ぶ） */
  function toolButtons() {
    var b = okButton(), w = 58, g = 6, x0 = W - 16 - w * 4 - g * 3;
    return [{ id: "cut", label: "カッター" }, { id: "snip", label: "ハサミ" }, { id: "sand", label: "やすり" }, { id: "patch", label: "画像を選ぶ" }].map(function (t, i) {
      t.x = x0 + (w + g) * i; t.y = b.y; t.w = w; t.h = b.h; return t;
    });
  }
  function hitTool(x, y) {
    var bs = toolButtons();
    for (var i = 0; i < bs.length; i++) { var b = bs[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id; }
    return null;
  }
  function drawTools() { toolButtons().forEach(function (b) { iconButton(b, b.label, tool === b.id); }); }

  /* 「完成」ボタン。下の中央 */
  function okButton() { var w = 120, h = 62; return { x: 104, y: H - h - Math.max(28, H * 0.035), w: w, h: h }; }
  function hitOk(x, y) { var b = okButton(); return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
  function drawOk() {
    var b = okButton();
    ctx.save();
    roundRect(b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
    ctx.fillStyle = "#16202e"; ctx.font = "800 30px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(zT("完成", "Done"), b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.restore();
  }

  /* 結果画面。絵が見えるよう暗くせず、ボタンだけを下に */
  function resultButtons() {
    var h = 54, gap = 14, wr = 136, wv = 136, ws = 180;
    var x0 = W / 2 - (wr + wv + ws + gap * 2) / 2, y = H - h - Math.max(36, H * 0.05);
    return [
      { id: "retry", x: x0, y: y, w: wr, h: h, label: "もう一度" },
      { id: "save", x: x0 + wr + gap, y: y, w: wv, h: h, label: "画像を保存" },
      { id: "share", x: x0 + wr + wv + gap * 2, y: y, w: ws, h: h, label: "Xでシェア" }
    ];
  }
  function hitButton(x, y) {
    var bs = resultButtons();
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }
  function drawResult() {
    resultButtons().forEach(function (b) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      roundRect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#16202e"; ctx.stroke();
      ctx.fillStyle = "#16202e";
      ctx.font = "800 24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!window.zActionIcon || !window.zActionIcon(ctx, b.label, 0, 1, 30)) ctx.fillText(b.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = "alphabetic";
    });
  }

  /* ============ 覗き穴 ============ */
  window.__probe = {
    now: function () { return { state: state, score: score, W: W, H: H, tool: tool, has3d: !!scene3d }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    damage: function () { autoDamage(); },
    hideUI: function (v) { hideUI = v !== false; }
  };

  /* ============ 手元用の動画撮影 ============ */
  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(1000);
      r.key();
      await r.wait(1500);
    }
  };

  /* ============ ループ ============ */
  var startButton = document.getElementById('start');
  // 開始画面は絵の外の余白も含め、指を離した時点で開始する。
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });

  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) { e.stopPropagation(); audioOn(); resumeAudio(); newRound(); });
  newRound(); state = S.INTRO; startButton.hidden = false;
  layout();
  var last = performance.now();
  function loop(now) {
    /* 端末の速さで難しさが変わらないように、描画が遅れてもゲームの時間は実際の時間どおり進める。
       1回の update は 1/60 秒までに刻む。タブから戻ってきたときの大きな空白だけは切り捨てる */
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      while (dt > 0.0001) { var st = Math.min(1 / 60, dt); update(st); dt -= st; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
