<script>
/* インターネットおおきなかぶ

   STARTした人に通し番号を配り、その回の1人目から自分までが並んで自動で引っぱる。
   1000人目・2000人目…の人のときだけ抜ける。番号は abacus.jasoncameron.dev で数える（counterapi.dev の v1 は終了していた）。 */
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var shareButton = document.getElementById("share-button");
  window.zResultActions.bind(shareButton, doShare);
  var followLink = window.zResultActions.follow.link(shareButton.parentNode);

  var NEED = 1000;

  var W = 540, H = 960;
  function layout() {
    var view = window.zGameView.measure(wrap, W);
    H = view.gameHeight;
    place();
    window.zGameView.fit(canvas, wrap, ctx, W, H, view);
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  /* ============ 音 ============ */
  var AC = null, NOISE = null;
  function resumeAudio() { window.zAudioResume(AC); }
  wrap.addEventListener("touchstart", audioOn, { passive: true });
  wrap.addEventListener("touchend", resumeAudio, { passive: true });
  wrap.addEventListener("pointerup", resumeAudio, true);
  function audioOn() {
    if (AC) { resumeAudio(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { AC = new C(); } catch (e) { return; }
    resumeAudio();
    var len = Math.floor(AC.sampleRate * 2);
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(freq, dur, vol, type, to, delay) {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    var n = AC.currentTime + (delay || 0);
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, n);
    if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(vol, n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + dur + 0.05);
  }
  function noiseHit(dur, freq, vol, q) {
    if (!AC || !NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain(), n = AC.currentTime;
    g.gain.setValueAtTime(vol, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(n); s.stop(n + dur + 0.05);
  }
  document.addEventListener("visibilitychange", function () {
    if (!AC) return;
    if (document.hidden) { try { AC.suspend(); } catch (e) {} }
    else { try { AC.resume(); } catch (e) {} }
  });

  /* ============ 何人目か ============
     開始のたびに共通のカウンターを1つ進めて、その番号をもらう。1000の倍数の人だけが抜ける。 */
  var COUNTER = "https://abacus.jasoncameron.dev/hit/zounoashi/kabu-v1";
  var PEEK = "https://abacus.jasoncameron.dev/get/zounoashi/kabu-v1";   /* 進めずに今の数だけ見る */
  var curCount = 0;
  /* かぶに書くキリ番。この番号の人のときだけ抜ける */
  /* キリ番 = 1000の倍数か、3桁以上のぞろ目（111, 2222 …） */
  function isKiri(n) { return n > 0 && (n % NEED === 0 || (n >= 111 && /^(\d)\1+$/.test(String(n)))); }
  function nextKiri(n) { n = Math.max(1, n); while (!isKiri(n)) n++; return n; }
  function prevKiri(n) { n--; while (n > 0 && !isKiri(n)) n--; return n; }
  function kiriban() {
    if (ready && myNo) return nextKiri(myNo);
    return nextKiri(curCount + 1);
  }
  function peekCount() {
    var fixed = DEBUG && /[?&]no=(\d+)/.exec(location.search);
    if (fixed) { curCount = Number(fixed[1]) - 1; return; }
    fetch(PEEK, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      curCount = Number(j.count != null ? j.count : j.value) || 0;
    }).catch(function () {});
  }
  var myNo = 0, nextNo = 0;      /* nextNo はデバッグで次の番号を決めるとき */
  function takeNumber(done) {
    var fixed = DEBUG && /[?&]no=(\d+)/.exec(location.search);
    if (fixed) nextNo = Number(fixed[1]);
    if (nextNo) { var n = nextNo; nextNo = 0; setTimeout(function () { done(n); }, 0); return; }
    var fin = false;
    function end(n) { if (!fin) { fin = true; done(n); } }
    setTimeout(function () { end(0); }, 6000);
    fetch(COUNTER, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      end(Number(j.count != null ? j.count : j.value) || 0);
    }).catch(function () { end(0); });
  }
  function placeNo() { return myNo ? myNo - prevKiri(myNo) : 1; }
  function people() {
    var n = ready ? placeNo() : Math.max(1, shownN), list = [];
    for (var i = 1; i <= n; i++) list.push({ id: seed + ":" + i, pull: held || state !== S.PLAY, me: ready && i === n });
    return list;
  }

  /* ============ 状態 ============ */
  var S = { INTRO: "intro", WAIT: "wait", LINE: "line", PULL: "pull", PLAY: "play", OUT: "out", RESULT: "result" };
  var state, T, held, keyMode = false;
  var crowd = [], lift = 0, shake = 0, outT = 0, holdT = 0, won = false, creakT = 0, camX = 0, lineT = 0;
  var PULL_TIME = 1.9, PULL_BEAT = 0.62, pullT = 0;
  var lastTone = -1, ready = false, shownN = 0, popAcc = 0, appearAt = [], seed = "";
  var confetti = window.zCelebrate.confetti();

  var KX, KY;                                  /* かぶの根元 */
  function place() {
    KX = 170; KY = Math.round(H * 0.72);
  }

  function newRound() {
    shareButton.hidden = true;
    document.getElementById("start").hidden = true;
    state = S.WAIT;
    T = 0; held = false; lift = 0; shake = 0; outT = 0; holdT = 0; won = false;
    confetti.clear();
    camX = 0;
    /* 押したらすぐ並び始める。番号が届くまでは先頭の1人だけ */
    state = S.LINE; lineT = 0; lastTone = -1; ready = false; shownN = 0; appearAt = []; popAcc = 1;
    seed = Math.random().toString(36).slice(2, 7);
    if (myNo) curCount = myNo;
    takeNumber(function (n) { myNo = n; ready = true; });
  }

  var DROP = 1.0;                              /* 抜けてから、かぶが落ち始めるまで（秒） */
  function meX() { return KX + 200 + (placeNo() - 1) * GAP; }
  function pullOut() {
    state = S.OUT; outT = 0; won = true; shake = 0;
    noiseHit(0.5, 300, 0.5, 0.6);
    tone(220, 0.35, 0.25, "triangle", 880);
  }

  /* ============ 進行 ============ */
  function update(dt) {
    T += dt;
    crowd = people();
    var lucky = isKiri(myNo);
    if (state === S.LINE) {
      lineT += dt;
      popAcc += dt;
      var limit = ready ? placeNo() : 1;
      while (popAcc >= perT() && shownN < limit) {
        popAcc -= perT(); appearAt[shownN++] = lineT;
        if (lineT - lastTone > 0.04) { lastTone = lineT; tone(330 + Math.min(shownN / 10, 100) * 6, 0.05, 0.08, "square"); }
      }
      if (shownN >= limit) popAcc = Math.min(popAcc, perT());
      var cg = Math.max(0, KX + 200 + (shownN - 1) * GAP - W * 0.62);
      camX += (cg - camX) * Math.min(1, dt * 8);
      if (thumbFix) camX = 0;
      shake = 0.6;
      creakT -= dt;
      if (creakT <= 0) { creakT = 0.35; noiseHit(0.22, 220, 0.16, 3); }
      /* 自分まで来たら終わり。キリ番なら抜ける */
      if (ready && shownN >= placeNo() && lineT - appearAt[shownN - 1] > 0.4) {
        camX = camEnd();
        state = S.PULL; pullT = 0; creakT = 0;
      }
    } else if (state === S.PULL) {
      /* 自分のところに来てから、もうひと踏ん張り（グッ、グッ、グッ） */
      pullT += dt;
      shake = 0.9;
      creakT -= dt;
      if (creakT <= 0) { creakT = PULL_BEAT; noiseHit(0.3, 180, 0.22, 3); tone(140, 0.18, 0.08, "sawtooth", 110); }
      if (pullT > PULL_TIME) {
        if (lucky) pullOut();
        else { state = S.OUT; outT = 0; shake = 0; tone(196, 0.4, 0.18, "triangle", 98); }
      }
    }

    if (state === S.OUT) {
      outT += dt;
      if (won) {
        /* みんなで倒れたあと、かぶが自分の後ろに落ちてくる */
        camX += (meX() - W * 0.22 - camX) * Math.min(1, dt * 3);
        if (outT >= DROP + 0.5 && outT - dt < DROP + 0.5) {
          noiseHit(0.5, 120, 0.7, 0.7); tone(90, 0.3, 0.3, "sine", 50);
          window.zCelebrate.play(AC, "fanfare", { delay: 0.15 });
          confetti.burst(W, H, 180);
        }
      }
      if (outT > (won ? 4.2 : 1.0)) state = S.RESULT;
    }
    confetti.step(dt, W, H);
  }

  /* ============ 入力 ============ */
  function down(x, y) {
    if (state === S.INTRO) return;
    audioOn();
    if (state === S.RESULT) {
      /* もう一度はなし（シェアだけ） */
      return;
    }
  }
  function move() {}
  function up() {}

  function atCanvas(e) { return window.zGameView.point(canvas, e, W, H); }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault(); keyMode = false;
    var p = atCanvas(e); down(p.x, p.y);
  });
  wrap.addEventListener("pointermove", function (e) { var p = atCanvas(e); move(p.x, p.y); });
  wrap.addEventListener("pointerup", function (e) { e.preventDefault(); up(); });
  wrap.addEventListener("pointercancel", function () { up(); });
  window.addEventListener("blur", function () { up(); });

  var DEBUG = !/(^|\.)zounoashi\.com$/.test(location.hostname) || /^\/shisaku-/.test(location.pathname);
  function debugKey(n) {
    /* 次のSTART・もう一度の番号を決める。1=1000人目 2=37人目 3=999人目 4=1人目 5=2000人目
       スマホは URL に ?no=37 を付けると、毎回その番号になる */
    nextNo = [0, 1000, 37, 999, 1, 2000][n] || nextNo;
  }

  window.addEventListener("keydown", function (e) {
    if (DEBUG && /^Digit[0-9]$/.test(e.code)) { e.preventDefault(); debugKey(Number(e.code.slice(5))); return; }
    var esc = e.key === "Escape";
    var go = e.code === "Space" || e.key === " " || e.key === "Enter";
    if (!esc && !go) return;
    e.preventDefault();
    if (!esc) keyMode = true;
    if (esc) { if (!e.repeat && state === S.RESULT) newRound(); return; }
    if (e.repeat) return;
    down();
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "Enter") { if (state === S.INTRO) startButton.click(); else up(); }
  });

  function doShare() {
    window.zResultActions.x({ text: zT(
won ? myNo + "人目で、おおきなかぶを抜いた" : myNo + "人目だったので、おおきなかぶは抜けなかった",
      won ? "I was visitor #" + myNo + " and pulled out the giant turnip" : "I was visitor #" + myNo + ", so the giant turnip didn't budge",
      won ? myNo + "번째로 커다란 순무를 뽑았다" : myNo + "번째라서 커다란 순무는 뽑히지 않았다",
      won ? "我是第" + myNo + "人，拔出了大萝卜" : "我是第" + myNo + "人，大萝卜没拔出来",
      won ? "我是第" + myNo + "人，拔出了大蘿蔔" : "我是第" + myNo + "人，大蘿蔔沒拔出來"
    ) + zT(" #インターネットおおきなかぶ", " #InternetGiantTurnip", " #인터넷커다란순무", " #互联网拔萝卜", " #網路拔蘿蔔") });
  }

  /* ============ 描画 ============ */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

  /* 並び：かぶの右から、畑の上を左右に折り返しながら続く */
  var GAP = 92;
  function slots(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push({ x: KX + 200 + i * GAP, y: KY + 14, s: 150, dir: -1 });
    return out;
  }
  /* カメラ：並んだ直後は先頭から最後尾の自分まで流す。引っぱるとかぶの方へ戻る */
  /* 1人ずつ出てくる間隔。5人目までは0.2秒ずつ、そこからだんだん速く */
  function perT() { return shownN < 5 ? 0.2 : Math.max(0.003, 0.2 * Math.pow(0.82, shownN - 5)); }
  function popOf(i) {
    if (state !== S.LINE) return 1;
    if (i >= shownN) return 0;
    var u = (lineT - appearAt[i]) / 0.25;
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    var c = 1.70158; u -= 1;
    return 1 + (c + 1) * u * u * u + c * u * u;      /* 少し行き過ぎて戻る */
  }
  function camEnd() { return Math.max(0, KX + 200 + (placeNo() - 1) * GAP - W * 0.62); }

  var KINDS = ["jii", "baa", "mago", "inu", "neko", "nezumi"];
  var CLOTHES = ["#3d7be0", "#e05d5d", "#4bb46b", "#e0a33d", "#9a5ce0", "#3dbfc4", "#e07ab8", "#7a8a99", "#c46b3d"];
  var SKIN = ["#f4cfa8", "#e8b68a", "#c98d5e", "#f6dcc0"];

  function kindOf(p) { return KINDS[(Math.imul(hash(p.id), 2654435761) >>> 0) % KINDS.length]; }
  function scaleOf(k) { return k === "nezumi" ? 0.45 : k === "neko" ? 0.6 : k === "inu" ? 0.72 : k === "mago" ? 0.82 : 1; }
  function leanOf(i, pulling, fallen) { return state === S.PULL && pulling ? 0.4 + 0.2 * Math.max(0, Math.sin(pullT / PULL_BEAT * Math.PI * 2)) + Math.sin(T * 9 + i) * 0.03 : fallen ? 0.42 + 0.83 * Math.min(1, outT / 0.4) : pulling ? 0.42 + Math.sin(T * 9 + i) * 0.05 : 0.06; }
  /* 手（動物は口）の位置。drawPerson と同じ置き方で計算する */
  function handOf(p, sl, i, pulling, fallen, pop) {
    var k = kindOf(p), a = leanOf(i, pulling, fallen), f = pop * scaleOf(k) * sl.s / 100;
    var hx = k === "inu" || k === "neko" || k === "nezumi" ? -52 : -42, hy = k === "inu" || k === "neko" || k === "nezumi" ? -50 : -58;
    var x = hx * Math.cos(a) - hy * Math.sin(a), y = hx * Math.sin(a) + hy * Math.cos(a);
    return { x: sl.x - sl.dir * x * f, y: sl.y - (1 - pop) * 70 + y * f };
  }
  function drawPerson(p, sl, i, pulling, fallen, pop) {
    var h = hash(p.id);
    var s = sl.s, k = kindOf(p);                 /* 原作の役をランダムに */
    var lean = leanOf(i, pulling, fallen);
    ctx.save();
    ctx.translate(sl.x, sl.y - (1 - pop) * 70);
    ctx.scale(-sl.dir * pop, pop);                     /* 前（かぶの方）が -x */
    var sc = scaleOf(k);
    ctx.scale(sc * s / 100, sc * s / 100);
    /* 影 */
    ctx.fillStyle = "rgba(60,40,10,.25)";
    ctx.beginPath(); ctx.ellipse(0, 0, 34, 8, 0, 0, Math.PI * 2); ctx.fill();
    if (p.me) {
      ctx.strokeStyle = "#ff7a45"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(0, 0, 42, 11, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.rotate(lean);
    if (k === "inu" || k === "neko" || k === "nezumi") drawAnimal(k);
    else drawHuman(k, h);
    ctx.restore();
    if (p.me) {
      var ay = sl.y - s * sc * 1.25 - 14 + Math.sin(T * 5) * 4;
      ctx.fillStyle = "#ff7a45"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "900 48px sans-serif";
      ctx.fillText("↓", sl.x, ay);
      ctx.font = "900 40px sans-serif";
      ctx.fillText(zT("あなた", "YOU", "나", "你", "你"), sl.x, ay - 50);
    }
  }
  function drawHuman(k, h) {
    var cloth = k === "jii" ? "#7a5232" : k === "baa" ? "#8a5ca8" : k === "mago" ? "#e04848" : CLOTHES[h % CLOTHES.length];
    var skin = k === "hito" ? SKIN[(h >> 3) % SKIN.length] : "#f4cfa8";
    ctx.lineCap = "round";
    /* 足 */
    ctx.strokeStyle = "#3a2c22"; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(-14, -2); ctx.moveTo(6, -30); ctx.lineTo(12, -2); ctx.stroke();
    /* 胴 */
    ctx.fillStyle = cloth;
    roundRect(-16, -74, 32, 48, 12); ctx.fill();
    /* 腕（前へ） */
    ctx.strokeStyle = cloth; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(-4, -64); ctx.lineTo(-40, -58); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(-42, -58, 6, 0, Math.PI * 2); ctx.fill();
    /* 頭 */
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(0, -92, 18, 0, Math.PI * 2); ctx.fill();
    if (k === "jii") {
      ctx.fillStyle = "#f2f2f2";
      ctx.beginPath(); ctx.arc(-6, -82, 12, 0.2, Math.PI * 1.1); ctx.fill();
      ctx.beginPath(); ctx.arc(10, -96, 8, 0, Math.PI * 2); ctx.fill();
    } else if (k === "baa") {
      ctx.fillStyle = "#c9c9c9";
      ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * 0.95, Math.PI * 2.1); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -108, 9, 0, Math.PI * 2); ctx.fill();
    } else if (k === "mago") {
      ctx.fillStyle = "#2a1f1a";
      ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -86, 7, 0, Math.PI * 2); ctx.fill();
    } else {
      var hair = ["#2a1f1a", "#5a3a22", "#1a1a1a", "#8a6a3a", "#c0a060"][(h >> 5) % 5];
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    }
    ctx.fillStyle = "#2a1f1a";
    ctx.beginPath(); ctx.arc(-10, -92, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  function drawAnimal(k) {
    var col = k === "inu" ? "#b07a42" : k === "neko" ? "#9a9a9a" : "#8a8a96";
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = "round";
    /* 足 */
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-14, -26); ctx.lineTo(-18, -2); ctx.moveTo(14, -26); ctx.lineTo(18, -2); ctx.stroke();
    /* 胴 */
    ctx.beginPath(); ctx.ellipse(0, -36, 30, 18, 0, 0, Math.PI * 2); ctx.fill();
    /* しっぽ */
    ctx.lineWidth = k === "nezumi" ? 4 : 8;
    ctx.beginPath(); ctx.moveTo(26, -42);
    if (k === "nezumi") ctx.quadraticCurveTo(60, -40, 56, -10);
    else ctx.quadraticCurveTo(44, -60, 40, -74);
    ctx.stroke();
    /* 頭 */
    ctx.beginPath(); ctx.arc(-32, -54, 18, 0, Math.PI * 2); ctx.fill();
    /* 耳 */
    if (k === "neko") {
      ctx.beginPath(); ctx.moveTo(-46, -64); ctx.lineTo(-44, -84); ctx.lineTo(-32, -70); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-28, -70); ctx.lineTo(-18, -84); ctx.lineTo(-16, -62); ctx.fill();
    } else if (k === "inu") {
      ctx.fillStyle = "#7a5228";
      ctx.beginPath(); ctx.ellipse(-22, -64, 7, 14, 0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(-38, -72, 10, 0, Math.PI * 2); ctx.arc(-22, -72, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e8a0a8";
      ctx.beginPath(); ctx.arc(-38, -72, 5, 0, Math.PI * 2); ctx.arc(-22, -72, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#2a1f1a";
    ctx.beginPath(); ctx.arc(-40, -56, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-50, -50, 3, 0, Math.PI * 2); ctx.fill();
  }

  var LEAVES = [
    { a: -0.95, x: -0.6, stem: 0.35, len: 1.05, w: 0.9, bend: -1 },
    { a: -0.6, x: -0.4, stem: 0.45, len: 1.25, w: 1, bend: -0.6 },
    { a: -0.28, x: -0.2, stem: 0.5, len: 1.4, w: 1.05, bend: 0.4 },
    { a: 0.02, x: 0, stem: 0.55, len: 1.5, w: 1.1, bend: -0.3 },
    { a: 0.3, x: 0.2, stem: 0.5, len: 1.35, w: 1, bend: 0.6 },
    { a: 0.62, x: 0.4, stem: 0.42, len: 1.2, w: 0.95, bend: 0.8 },
    { a: 0.95, x: 0.6, stem: 0.35, len: 1.0, w: 0.85, bend: 1 }
  ];
  function kabuPos() {
    var out = won && (state === S.OUT || state === S.RESULT);
    if (out) {
      var t = outT - DROP, land = KY + 14 - 126, y0 = land - H * 1.2;
      var y = t < 0 ? y0 - 500 : Math.min(land, y0 + 0.5 * 9000 * t * t);
      return { x: meX() + 190, y: y, rot: 0.12 };
    }
    var sx = state === S.LINE || state === S.PULL ? Math.sin(T * 40) * shake * 3 : 0;
    return { x: KX + sx, y: KY + 34 - lift * 48, rot: Math.sin(T * 23) * shake * 0.03 };
  }
  function drawKabu() {
    var k = kabuPos(), r = 120;
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.rot);
    /* 葉：茎から伸びる、ふちが波打った葉を7枚 */
    for (var i = 0; i < LEAVES.length; i++) {
      var lf = LEAVES[i];
      ctx.save();
      ctx.translate(lf.x * r * 0.25, -r * 0.92);
      ctx.rotate(lf.a + Math.sin(T * 5 + i) * shake * 0.05);
      var stem = r * lf.stem, len = r * lf.len, wd = r * 0.26 * lf.w;
      ctx.strokeStyle = i % 2 ? "#6fb24f" : "#5ea845"; ctx.lineWidth = 9; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(lf.bend * 10, -stem * 0.5, 0, -stem); ctx.stroke();
      ctx.fillStyle = i % 2 ? "#3f9a3a" : "#348a31";
      ctx.beginPath(); ctx.moveTo(0, -stem);
      var N = 18, t, wv, j;
      for (j = 0; j <= N; j++) { t = j / N; wv = Math.pow(Math.sin(Math.PI * t), 0.8) * wd * (1 + 0.18 * Math.sin(t * 22)); ctx.lineTo(wv + lf.bend * t * 14, -stem - len * t); }
      for (j = N; j >= 0; j--) { t = j / N; wv = Math.pow(Math.sin(Math.PI * t), 0.8) * wd * (1 + 0.18 * Math.sin(t * 22 + 1.5)); ctx.lineTo(-wv + lf.bend * t * 14, -stem - len * t); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(190,235,160,.75)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -stem); ctx.lineTo(lf.bend * 13, -stem - len * 0.92); ctx.stroke();
      ctx.restore();
    }
    /* 実：白くて丸い。上は少し緑がかる */
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r * 1.25, -r * 1.02, r * 1.25, r * 0.55, 0, r * 1.02);
    ctx.bezierCurveTo(-r * 1.25, r * 0.55, -r * 1.25, -r * 1.02, 0, -r);
    var g = ctx.createRadialGradient(-r * 0.3, -r * 0.2, r * 0.1, 0, 0, r * 1.25);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.65, "#f4f1ea"); g.addColorStop(1, "#d6cfbf");
    ctx.fillStyle = g; ctx.fill();
    var g2 = ctx.createLinearGradient(0, -r, 0, -r * 0.45);
    g2.addColorStop(0, "rgba(150,200,110,.55)"); g2.addColorStop(1, "rgba(150,200,110,0)");
    ctx.fillStyle = g2; ctx.fill();
    ctx.strokeStyle = "rgba(150,135,110,.5)"; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath(); ctx.ellipse(-r * 0.42, -r * 0.35, r * 0.12, r * 0.24, 0.5, 0, Math.PI * 2); ctx.fill();
    /* ひげ根 */
    ctx.strokeStyle = "#cfc6b2"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, r * 1.0); ctx.quadraticCurveTo(8, r * 1.35, -4, r * 1.7); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.6); ctx.lineTo(-r * 0.68, r * 0.72); ctx.moveTo(r * 0.45, r * 0.7); ctx.lineTo(r * 0.62, r * 0.8); ctx.stroke();
    /* キリ番 */
    ctx.fillStyle = "#e0302a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "900 " + (String(kiriban()).length > 4 ? 44 : 54) + "px sans-serif";
    ctx.fillText(String(kiriban()), 0, -r * 0.62);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
    return k;
  }

  /* 背景：水色のグラデーションの空、市松の地面と草のふち */
  function drawRetroBack(cam) {
    var x, y, g;
    var sky = ctx.createLinearGradient(0, KY - H * 0.75, 0, KY + 14);
    sky.addColorStop(0, "#66ccff"); sky.addColorStop(1, "#e0faff");
    ctx.fillStyle = sky; ctx.fillRect(cam, KY - H * 1.6, W, H * 1.6 + 20);
    /* 地面：草のふちと市松模様 */
    g = 24; var x0 = Math.floor(cam / g) * g;
    for (y = KY + 20; y < KY + H; y += g) for (x = x0; x < cam + W + g; x += g) {
      ctx.fillStyle = ((x / g + (y - KY - 20) / g) & 1) ? "#996633" : "#a8743c";
      ctx.fillRect(x, y, g, g);
    }
    for (x = x0; x < cam + W + g; x += 8) { ctx.fillStyle = (x / 8) & 1 ? "#33cc33" : "#009900"; ctx.fillRect(x, KY + 14, 8, (x / 8) % 3 ? 10 : 14); }
  }

  function drawWorld(cam) {
    var n = crowd.length;
    ctx.save();
    ctx.translate(-Math.round(cam), Math.round(H * 0.7 - KY));
    drawRetroBack(cam);

    var k = kabuPos();
    var sl = slots(n);
    var out = won && (state === S.OUT || state === S.RESULT);
    var shown = state === S.LINE ? Math.min(n, shownN) : n;
    /* 土に埋まった所は描かない（地面の線で切る） */
    ctx.save();
    ctx.beginPath(); ctx.rect(cam - 10, KY - H, W + 20, H + 14); ctx.clip();
    drawKabu();
    ctx.restore();
    if (out) { ctx.save(); drawKabu(); ctx.restore(); }

    var hands = [];
    for (var i = 0; i < shown; i++) hands[i] = handOf(crowd[i], sl[i], i, crowd[i].pull || out, out, popOf(i));
    if (state !== S.WAIT && state !== S.INTRO) for (i = 0; i < n; i++) {
      if (sl[i].x < cam - 80 || sl[i].x > cam + W + 80) continue;
      var pop = popOf(i);
      if (pop <= 0) continue;
      drawPerson(crowd[i], sl[i], i, crowd[i].pull || out, out, pop);
    }
    /* 綱：かぶの葉の根元から、1人ずつの手を通る */
    if (!out && shown > 0 && state !== S.WAIT && state !== S.INTRO) {
      ctx.strokeStyle = "#e8d39a"; ctx.lineWidth = 6; ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(k.x + 30, k.y - 90);
      for (i = 0; i < shown; i++) if (hands[i]) ctx.lineTo(hands[i].x, hands[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 昔のホームページのアクセスカウンター風。START前はこの回の始まりの数、並ぶのに合わせて数え上がり、最後は自分の番号 */
  function drawVisitor() {
    var roll = Math.min(1, lineT / 0.8), base = Math.round((myNo - placeNo()) * (1 - Math.pow(1 - roll, 3)));   /* 前のキリ番までは0からクルクル回して追いつく */
    var no = !ready ? 0 : state === S.LINE ? base + Math.min(shownN, placeNo()) : myNo;
    var digits = String(Math.max(0, no)), len = Math.max(6, digits.length);
    while (digits.length < len) digits = "0" + digits;
    var pre = zT("あなたは", "You are visitor", "당신은", "您是第", "您是第");
    var post = zT("人目の来訪者です", "", "번째 방문자입니다", "位访客", "位訪客");
    var fs = 34, dw = 40, dh = 58, gap = 12, y = 66, font = "700 " + fs + "px 'MS PGothic', 'Hiragino Kaku Gothic ProN', sans-serif";
    ctx.font = font;
    var w1 = ctx.measureText(pre).width, w3 = post ? ctx.measureText(post).width : 0;
    var row = w1 + gap + len * dw, bw = Math.max(row, w3) + 36, bh = post ? 132 : 84, bx = (W - bw) / 2;
    /* 下地 */
    ctx.fillStyle = "#fffbe8"; ctx.strokeStyle = "#16202e"; ctx.lineWidth = 3;
    ctx.fillRect(bx, y - 42, bw, bh); ctx.strokeRect(bx, y - 42, bw, bh);
    var x = (W - row) / 2;
    ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.fillStyle = "#16202e";
    ctx.fillText(pre, x, y);
    x += w1 + gap;
    ctx.font = "700 44px 'Courier New', monospace"; ctx.textAlign = "center";
    for (var i = 0; i < len; i++) {
      ctx.fillStyle = "#111"; ctx.fillRect(x + i * dw, y - dh / 2, dw - 3, dh);
      ctx.fillStyle = "#4dff5a"; ctx.fillText(digits[i], x + i * dw + (dw - 3) / 2, y + 2);
    }
    if (post) {
      ctx.font = font; ctx.fillStyle = "#16202e";
      ctx.fillText(post, W / 2, y + 52);
    }
    ctx.textBaseline = "alphabetic";
  }

  function draw() {
    window.zResultActions.place(shareButton, resultButtons()[0], W, H, state === S.RESULT);
    window.zResultActions.place(followLink, window.zResultActions.follow.box(ctx, resultButtons(), W), W, H, state === S.RESULT);

    var n = crowd.length;
    drawWorld(camX);
    if (state !== S.RESULT && !hideUI) drawVisitor();

    confetti.draw(ctx);
    if (state === S.RESULT) drawResult();
  }

  /* 結果は暗くせず、場面をそのまま見せる（文字は上、ボタンは下） */
  function resultLayout() { return window.zResultActions.showcase(W, H, { sizes: [80, 44] }); }
  function resultButtons() {
    return window.zResultActions.row(W, H - 170, ["share"]);   /* シェアだけ。下に「作者をフォロー」が入るよう少し上げる */
  }
  function hitButton(x, y) {
    return window.zResultActions.hit(resultButtons(), x, y);
  }
  function drawResult() {
    var L = resultLayout(), no = myNo ? String(myNo) : "?";
    var lines = [
      won ? zT("抜けた", "Pulled out!", "뽑혔다", "拔出来了", "拔出來了") : zT("抜けなかった", "Didn't budge", "안 뽑혔다", "没拔出来", "沒拔出來"),
      zT("（" + no + "人目）", "(#" + no + ")", "(" + no + "번째)", "（第" + no + "人）", "（第" + no + "人）")
    ];

  }

  window.__probe = {
    now: function () { return { cam: Math.round(camX), state: state, no: myNo, won: won, people: crowd.length, W: W, H: H, buttons: state === S.RESULT ? resultButtons() : null }; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { update(1 / 60); draw(); } },
    reset: function () { newRound(); },
    hideUI: function () { hideUI = true; }
  };
  /* サムネ用：12人目にして、文字を隠す（並び始めた場面を撮る） */
  window.__thumbnail = async function (setup) {
    if (setup && setup.scene !== "line") throw Error("未対応の撮影指定: " + JSON.stringify(setup));
    nextNo = 12; hideUI = true; thumbFix = true;
  };
  var hideUI = false, thumbFix = false;   /* thumbFix: サムネ撮影中はカメラをかぶに止める */

  window.__recording = {
    sound: function () { audioOn(); return AC; },
    run: async function (r) {
      await r.wait(800);
      debugKey(1); r.key();
      if (!await r.until(function () { return state === S.RESULT; }, 10)) throw Error("抜けない");
      await r.wait(1500);
    }
  };

  var startButton = document.getElementById('start');
  window.zStartTap(function () { return state === S.INTRO; }, function () { startButton.click(); });
  ['pointerdown', 'pointerup'].forEach(function (name) { startButton.addEventListener(name, function (e) { e.stopPropagation(); }); });
  startButton.addEventListener('click', function (e) {
    e.stopPropagation(); audioOn(); resumeAudio();
    newRound();
  });
  state = S.INTRO; T = 0; held = false; startButton.hidden = false;
  peekCount();
  layout();
  var last = performance.now();
  var stepAcc = 0;
  function loop(now) {
    var dt = Math.max(0, Math.min(0.25, (now - last) / 1000));
    last = now;
    if (!window.__recordManual) {
      stepAcc += dt;
      while (stepAcc >= 1 / 60) { update(1 / 60); stepAcc -= 1 / 60; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
