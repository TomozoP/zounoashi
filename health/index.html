<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体重ログ | ゾウノアシゲームズ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/icon.png">
<style>
:root{--bg:#fffaf0;--ink:#2b2b2b;--sub:#8a8170;--w:#e0603a;--f:#3a8ee0;--line:#eadfca}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
.date{color:var(--sub);font-size:13px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.card .lab{font-size:13px;color:var(--sub)}
.card .val{font-size:34px;font-weight:700;line-height:1.2}
.card .val small{font-size:15px;margin-left:2px}
.card .diff{font-size:13px;color:var(--sub)}
.card.w .val{color:var(--w)} .card.f .val{color:var(--f)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 0;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chart{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px}
canvas{display:block;width:100%;height:300px}
.note{color:var(--sub);font-size:12px;margin-top:10px;text-align:center}
.back{display:inline-block;margin-top:18px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
<h1>体重ログ</h1>
<div class="date" id="date">読み込み中…</div>
<div class="cards">
  <div class="card w"><div class="lab">体重</div><div class="val" id="wv">-</div><div class="diff" id="wd"></div></div>
  <div class="card f"><div class="lab">体脂肪率</div><div class="val" id="fv">-</div><div class="diff" id="fd"></div></div>
</div>
<div class="tabs" id="tabs">
  <button data-d="30" class="on">1か月</button><button data-d="90">3か月</button><button data-d="365">1年</button><button data-d="0">全部</button>
</div>
<div class="chart"><canvas id="cv"></canvas></div>
<div class="note" id="note"></div>
<a class="back" href="../">← ゾウノアシゲームズ</a>
</main>
<script>
// health.gs をデプロイした .../exec のURLを貼る（空ならサンプル表示）
var HEALTH_URL = "";

var DATA = [], RANGE = 30;
function $(id){ return document.getElementById(id); }
function ymd(t){ var d=new Date(t); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function tm(s){ var a=s.split("-"); return new Date(+a[0],a[1]-1,+a[2]).getTime(); }

function sample(){
  var out=[], now=Date.now(), w=74, f=24;
  for(var i=200;i>=0;i--){
    if(Math.random()<0.15) continue;
    w += (Math.random()-0.53)*0.35; f += (Math.random()-0.53)*0.18;
    out.push([ymd(now-i*864e5), Math.round(w*10)/10, Math.round(f*10)/10]);
  }
  return out;
}

function last(col){ for(var i=DATA.length-1;i>=0;i--) if(DATA[i][col]!=="" && DATA[i][col]!=null) return DATA[i]; return null; }
function near(col, t){ // t 以前でいちばん新しい記録
  var r=null; for(var i=0;i<DATA.length;i++){ if(tm(DATA[i][0])>t) break; if(DATA[i][col]!=="" && DATA[i][col]!=null) r=DATA[i]; } return r;
}
function fmtDiff(a,b,unit){
  if(!a||!b) return "";
  var d=Math.round((a-b)*10)/10;
  return "30日前から "+(d>0?"+":d<0?"−":"±")+Math.abs(d).toFixed(1)+unit;
}

function cards(){
  var lw=last(1), lf=last(2), ref=Date.now()-30*864e5;
  var pw=near(1,ref), pf=near(2,ref);
  $("wv").innerHTML = lw ? (+lw[1]).toFixed(1)+"<small>kg</small>" : "-";
  $("fv").innerHTML = lf ? (+lf[2]).toFixed(1)+"<small>%</small>" : "-";
  $("wd").textContent = lw&&pw ? fmtDiff(lw[1],pw[1],"kg") : "";
  $("fd").textContent = lf&&pf ? fmtDiff(lf[2],pf[2],"pt") : "";
  var l = DATA.length ? DATA[DATA.length-1][0] : "";
  $("date").textContent = l ? "最終更新 "+l.replace(/-/g,"/") : "まだ記録がありません";
}

function draw(){
  var cv=$("cv"), dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  var c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  var t1=Date.now(), t0 = RANGE ? t1-RANGE*864e5 : (DATA.length?tm(DATA[0][0]):t1-30*864e5);
  var rows=DATA.filter(function(r){ return tm(r[0])>=t0-864e5; });
  var L=44,R=44,T=16,B=26, pw=W-L-R, ph=H-T-B;
  function X(t){ return L+(t-t0)/Math.max(1,t1-t0)*pw; }
  function scale(col){
    var v=rows.map(function(r){return r[col];}).filter(function(x){return x!==""&&x!=null;});
    if(!v.length) return null;
    var lo=Math.min.apply(0,v), hi=Math.max.apply(0,v), pad=Math.max(0.5,(hi-lo)*0.15);
    lo-=pad; hi+=pad; return {lo:lo,hi:hi,Y:function(x){ return T+(1-(x-lo)/(hi-lo))*ph; }};
  }
  var sw=scale(1), sf=scale(2);
  c.font="11px sans-serif"; c.strokeStyle="#f0e8d8"; c.lineWidth=1;
  for(var i=0;i<=4;i++){
    var y=T+ph*i/4; c.beginPath(); c.moveTo(L,y); c.lineTo(W-R,y); c.stroke();
    if(sw){ c.fillStyle="#e0603a"; c.textAlign="right"; c.fillText((sw.hi-(sw.hi-sw.lo)*i/4).toFixed(1),L-6,y+4); }
    if(sf){ c.fillStyle="#3a8ee0"; c.textAlign="left"; c.fillText((sf.hi-(sf.hi-sf.lo)*i/4).toFixed(1),W-R+6,y+4); }
  }
  // 日付の目盛り
  c.fillStyle="#8a8170"; c.textAlign="center";
  for(var k=0;k<=4;k++){ var t=t0+(t1-t0)*k/4, d=new Date(t); c.fillText((d.getMonth()+1)+"/"+d.getDate(), X(t), H-8); }
  function line(col,s,color){
    if(!s) return;
    var pts=rows.filter(function(r){return r[col]!==""&&r[col]!=null;}).map(function(r){return [X(tm(r[0])),s.Y(r[col])];});
    c.strokeStyle=color; c.lineWidth=2.5; c.lineJoin="round"; c.beginPath();
    pts.forEach(function(p,i){ i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); }); c.stroke();
    if(pts.length<=60){ c.fillStyle=color; pts.forEach(function(p){ c.beginPath(); c.arc(p[0],p[1],2.5,0,7); c.fill(); }); }
  }
  line(2,sf,"#3a8ee0"); line(1,sw,"#e0603a");
  if(!rows.length){ c.fillStyle="#8a8170"; c.textAlign="center"; c.font="14px sans-serif"; c.fillText("この期間の記録はありません",W/2,H/2); }
}

$("tabs").onclick=function(e){
  var b=e.target.closest("button"); if(!b) return;
  [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});
  RANGE=+b.dataset.d; draw();
};
window.addEventListener("resize",draw);

function show(rows, isSample){
  DATA=rows; cards(); draw();
  $("note").textContent = isSample ? "※ いまはサンプルの数字です" : "iPhoneのヘルスケアから毎日自動で更新";
}
if(HEALTH_URL){
  fetch(HEALTH_URL).then(function(r){return r.json();}).then(function(j){ show(j.data||[], false); })
  .catch(function(){ $("date").textContent="読み込めませんでした"; });
} else show(sample(), true);
</script>
</body>
</html>
